 armour_folder: "Броня"
 nsb_armour_folder: "Броня"
  
 #infantry_weapons2_desc: "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца. Улучшенные модели оружия и более специализированная экипировка."
 #improved_infantry_weapons_2_desc: "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца. Улучшенные модели оружия и более специализированная экипировка."
 #advanced_infantry_weapons2_desc: "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца. Включает штурмовые винтовки и противотанковые гранатометы. Оружие, ранее поставлявшееся в ограниченном количестве, теперь более доступно."
 #infantry_at_desc: "Оснастив нашу пехоту противотанковыми ружьями, мы позволим ей уничтожать легкую бронетехнику, не теряя мобильности."
 #infantry_at2_desc: "Чтобы пехота могла эффективнее вести бой с тяжелой бронетехникой, противотанковые ружья должны стать меньше и легче."
 paratroopers3_desc: "Обучение адаптации парашютно-десантных операций в зависимости от погодных условий, стандартизация снаряжения, такого как десантные ботинки, и расширенная специализированная подготовка позволят свести к минимуму неразбериху и риски, связанные с этими опасными миссиями."
 marines_desc: "Войска, специализирующиеся на десантных операциях, становятся всё более незаменимыми. Импровизированные методы и снаряжение уходят в прошлое, поскольку наша морская пехота получает поддержку в виде специализированных десантных катеров и подготовки."
 marines2_desc: "Десантные операции требуют постоянных инноваций. Улучшенная логистическая поддержка и портативные гавани могут позволить нашим морским пехотинцам проводить высадки, которые в противном случае были бы невозможны."
 marines3_desc: "Морская пехота может быть не просто десантной пехотой. В будущем наш корпус морской пехоты станет одной из самых дисциплинированных и организованных сил специального назначения."
 tech_mountaineers_desc: "Ведение боя в горных районах подвергает войска множеству опасностей, но иногда его невозможно избежать. Мы можем свести эти риски к минимуму, обеспечив наших солдат специальной подготовкой для этой местности."
 tech_mountaineers2_desc: "Выйдя за рамки выживания, наши силы могут быть обучены использовать горы в своих интересах. С лёгким снаряжением и мулами они могут маневрировать на этой местности лучше, чем другие пехотные подразделения."
 rangers_tech_desc: "Специализируясь на боях в лесистой местности и обучая нашу лёгкую пехоту адаптироваться к ландшафту и растительности, мы можем использовать меньше войск для удержания некоторых участков фронта или даже прорывать вражеские линии там, где нас меньше всего ждут."
 tech_recon4_desc: "Глубокие разведывательные операции, сочетающие шпионаж, партизанские действия и подготовку коммандос, помогут нашему тактическому выбору и позволят быстро адаптировать наши решения."
 tech_logistics_company_desc: "Наличие в наших рядах специально подготовленных офицеров по логистике обеспечит использование сетей поддержки для минимизации потерь."
 tech_logistics_company3_desc: "Постоянная статистическая оценка потребностей войск в снабжении способствует максимальному использованию наших ресурсов."
 tech_logistics_company4_desc: "Разработка стандартизированных классификаций для поставок позволит свести к минимуму путаницу и сделать планирование более эффективным."
 tech_military_police2_desc: "Выполняя регулярные полицейские обязанности на оккупированных территориях, такие как регулирование дорожного движения и поддержание общественного порядка, наша военная полиция может свести к минимуму хаос и неразбериху, в которых процветают партизанские движения."
 tech_signal_company_desc: "Для установления и поддержания связи на поле боя всегда требовались особые навыки. С возникновением новых средств связи и обнаружения в ходе Великой войны открылись новые практические возможности."
 tech_signal_company3_desc: "Всё более портативные средства связи теперь можно носить с собой в ранце. Эту повышенную мобильность войск связи необходимо использовать."
 tech_maintenance_company2_desc: "Регулярные процедуры эксплуатационного обслуживания минимизируют риски поломки оборудования и предупреждают войска о необходимости его замены до того, как оно выйдет из строя."
 tech_maintenance_company4_desc: "Опыт создания техники с нагруженным резервом, накопленный в Великую войну, можно применить, чтобы упростить процедуру ремонта более современной техники."
 motorised_infantry: "Моторизированная пехота"
 streamlined_line_desc: "Стандартизация и жёсткая структура сборочной линии являются ключами к её эффективности и безопасности. Именно эти аспекты следует развивать в нашем промышленном производстве."
 improved_equipment_conversion: "Котлы с пылеугольным отоплением"
 concentrated_industry5_desc: "Крупные промышленные комплексы теперь объединяют многие части нашей промышленности, сводя к минимуму затраты на транспортировку и рабочую силу."
 dispersed_industry2_desc: "Дальнейшее рассредоточение нашего производства затрудняет нанесение ударов по его отдельным частям."
 construction2_desc: "Модернизация наших инструментов и оборудования ещё больше поможет нашим строительным усилиям."
 construction4_desc: "Более высокая степень механизации и лучшие стандартные процедуры ещё больше ускоряют строительство."
 construction5_desc: "Будущее эффективного строительства потребует более тщательного планирования отдельных проектов, а также стандартизированных решений, где это возможно."
 improved_cavity_magnatron_desc: "Использование радаров уже доказало свою важность, но наших дециметровых радаров слишком мало для хорошего покрытия. Установка радаров на большее количество единиц техники позволит нам максимально использовать наше технологическое преимущество."
 improved_encryption_desc: "Ограничения в рандомизации шифровальных машин могут быть использованы для взлома шифров. Улучшив случайность механики роторов, мы можем затруднить этот вид криптоанализа."
 basic_decryption_desc: "Криптоанализ всё чаще становится передовой математической наукой. Системы, такие как карточные каталоги, и устройства, такие как циклометры, могут помочь в необходимой работе."
 improved_decryption_desc: "Разработка более сложных компьютеров позволяет применять новые методы криптоанализа, такие как дифференциальный анализ, которые можно использовать для взлома передовых шифров в сочетании с новыми ручными методами взлома кодов."
 rocket_interceptor_2_desc: "По-прежнему считающиеся чрезвычайно опасными в эксплуатации, ракетные истребители теперь используют автопилоты и буксировку другими самолётами, чтобы максимально использовать их высокую скорость, но небольшой запас топлива."
 #artillery1_desc: "With more modern materials and mechanisms, howitzers and field guns from the Great War can be re-chambered and modernised for modern warfare." #NT!
 #mountain_gun_desc: "The mountainous terrain of Northern India led to the development of an artillery piece that could be dismantled and carried on mule back to wherever it was needed." #NT!
 #rocket_artillery2_desc: "Self-propelled artillery utilising multiple rockets will be able to cause large-scale destruction rapidly, while maintaining mobility to avoid counter-fire." #NT!
 #rocket_artillery4_desc: "Spin-stabilised rockets can increase the range of lighter artillery batteries." #NT!
 #antiair4_desc: "Combining modern systems of radar, computerisation and autoloaders will be necessary to react quickly against faster aircraft." #NT!
 #antitank1_desc: "The importance of effective anti-tank weapons was established in the Great War. Introducing a new generation of these weapons will be necessary to combat modern tank designs." #NT!
 #antitank2_desc: "Most anti-tank guns are so far fairly light. Larger calibre guns will be required to combat heavier tanks with sloped armour." #NT!
 #antitank4_desc: "New versatile anti-tank guns employing armour-piercing discarding sabot shots can penetrate the armour of nearly any tank." #NT!
 #antitank5_desc: "By combining different kinds of new ammunition technology with guns with higher muzzle velocities, we can be prepared for whatever new armour our enemies may develop." #NT!
 air_defence: "ПВО"
 bomber_ace_initiative_desc: "Официальное признание и поощрение лётчиков-бомбардировщиков, получивших статус аса, поощряет смелость и инициативу."
 cas_ace_initiative_desc: "Официальное признание и поощрение лётчиков-штурмовиков, получивших статус аса, поощряет смелость и инициативу."
  
