 #changed to British spelling 
 heavy_armor_advice_tt: "\nУстановка более совершенного модуля §YБрони§! на §YТяжёлые корабли§! улучшает их способность выдерживать повреждения. §YЛинкоры§! и §YЛинейные крейсеры§! различаются своими §YСхемами бронирования§!, при этом линейные крейсеры обычно имеют худшую броню."
 basic_heavy_armor_scheme: "Наклонная схема бронирования пояса"
 basic_heavy_armor_scheme_desc: "Располагая поясную броню под углом, ту же массу и толщину брони становится гораздо труднее пробить.\n\nУстановка этого модуля на §YТяжёлые корабли§! улучшает их способность §Yвыдерживать повреждения§!. §YЛинкоры§! и §YЛинейные крейсеры§! различаются своими §YСхемами бронирования§!."
 improved_heavy_armor_scheme: "Схема бронирования «всё или ничего»"
 improved_heavy_armor_scheme_desc: "Эта схема фокусируется на защите только самых жизненно важных частей корабля, игнорируя неважные.\n\nУстановка этого модуля на §YТяжёлые корабли§! улучшает их способность §Yвыдерживать повреждения§!. §YЛинкоры§! и §YЛинейные крейсеры§! различаются своими §YСхемами бронирования§!."
  
 MOUNTAINEERS_DOCTRINE_DESC: "Особое внимание армии к полкам, привыкшим к суровой местности, даст нам преимущество в манёвренности и позволит лишить противника свободы действий."
 RANGERS_DOCTRINE_DESC: "Возможность действовать крупными силами в густонаселённых лесистых районах позволит нашей армии обходить и переигрывать силы противника."
 special_forces_paratroopers_desc: "Нет ничего страшнее, чем небо, темнеющее от вида тысячи транспортных самолётов, полных войск. Наша доктринальная философия должна использовать эффект шока и трепета, который внушает воздушный десант."
 ski_troops_desc: "Специалисты по ведению боя в холодных условиях жизненно важны для нашей полевой тактики. Официально признав этих экспертов в нашей военной доктрине, мы сможем высвободить ресурсы и время для их дальнейшего обучения."
 mountaineers_combat_1_desc: "Наши элитные силы должны сосредоточить свои усилия на удержании районов, в которых они специализируются. Сочетание тактики засад и улучшенной полковой организации гарантирует, что наши спецвойска создадут значительную эшелонированную оборону против вторгающихся сил."
 mountaineers_combat_2_desc: "Горные артиллерийские полки — это специализированные силы, предназначенные для быстрой поддержки наших элитных дивизий на дальних дистанциях, прошедшие подготовку и действовавшие в сложной местности. Их присутствие значительно повышает боевые возможности наших спецвойск."
 mountaineers_keystone_1_desc: "Успех наших элитных спецвойск требует перестройки нашей военной философии вокруг их присутствия."
 paras_dispersed_drop_desc: "Характер наших операций требует, чтобы наши воздушно-десантные войска специализировались на высоко рассредоточенных высадках, позволяя проводить значительные диверсии до того, как враг вообще узнает о нашем присутствии."
 SF_PARAS_combat_effect_tt: "Вражеские дивизии в регионах, куда мы §HВысаживаем десант§!, получат снижение текущей §HОрганизации§!.\n\n$PARA_EFFECT_TIMER$"
 paras_airborne_light_armor: "Воздушно-десантная броня"
 paras_bonus_1_desc: "Даже тщательно подготовленная высадка может пойти не по плану. Нужно сделать все, чтобы наши бойцы умели ориентироваться на местности."
 rangers_guerilla_doctrine: "Лесные партизаны"
 rangers_backbone_doctrine: "Специализация лёгкой пехоты"
  
