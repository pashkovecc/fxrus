 heavy_tank_destroyer_equipment: "Тяжелая ПТ-установка"
 heavy_tank_destroyer_equipment_short: "Тяжелая ПТ"
 heavy_tank_destroyer_equipment_desc: "Шасси тяжёлого танка, вооружённое массивным противотанковым орудием. Поскольку эта модель бронированной машины предназначена для уничтожения других тяжелобронированных машин, этот истребитель танков сохраняет тяжёлую броню, жертвуя скоростью, организацией экипажа и манёвренностью."
