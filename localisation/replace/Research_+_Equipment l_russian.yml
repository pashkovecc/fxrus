 medium_tank_artillery_equipment_3_short: "Ср. САУ III"
 medium_tank_artillery_equipment_3_desc: "$medium_tank_artillery_equipment_desc$"
  
 medium_tank_destroyer_equipment: "Средняя ПТ-установка"
 medium_tank_destroyer_equipment_short: "Средняя ПТ"
 medium_tank_destroyer_equipment_desc: "Шасси среднего танка, вооружённое скорострельной пушкой, предназначенной для пробития более тяжёлой брони. Хотя большинство средних танков уже оснащены достойными противотанковыми возможностями, за счёт компромиссов в броне и компоновке экипажа можно установить ещё более тяжёлое противотанковое орудие, обеспечивающее возможность пробития даже очень сильно бронированных машин и лёгких укреплений."
 medium_tank_destroyer_equipment_1: "Средняя ПТ-установка I"
