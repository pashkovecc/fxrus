 super_heavy_tank_equipment: "Сверхтяжелый танк"
 super_heavy_tank_equipment_desc: "Эволюция тяжёлого танка, Сверхтяжёлый танк увеличивает все аспекты своего меньшего предшественника для максимального увеличения брони и вооружения. В ответ он становится ещё медленнее, ещё менее манёвренным и начинает испытывать проблемы даже с самой базовой инфраструктурой, будучи неспособным пересекать большинство участков мягкого грунта и большинство мостов, а также имеет пагубную привычку разрушать дороги, по которым проходит."
 super_heavy_tank_equipment_1: "Сверхтяжелый танк"
 super_heavy_tank_equipment_1_short: "Сверхтяж. танк"
 super_heavy_tank_equipment_1_desc: "$super_heavy_tank_equipment_desc$"
  
 super_heavy_tank_artillery_equipment: "Сверхтяж. САУ"
 super_heavy_tank_artillery_equipment_desc: "Шасси Сверхтяжёлого танка, вооружённое тяжёлым артиллерийским орудием. Несмотря на то, что его роль непрямой огневой поддержки смягчает некоторые из его худших недостатков, существует мало артиллерийских орудий, которые выигрывают от такого массивного шасси."
 super_heavy_tank_artillery_equipment_1: "Сверхтяжелая САУ"
 super_heavy_tank_artillery_equipment_1_short: "Сверхтяж. САУ"
 super_heavy_tank_artillery_equipment_1_desc: "$super_heavy_tank_artillery_equipment_desc$"
  
 super_heavy_tank_destroyer_equipment: "Сверхтяжелая ПТ-установка"
 super_heavy_tank_destroyer_equipment_short: "Сверхтяж. ПТ-установка"
 super_heavy_tank_destroyer_equipment_desc: "Массивное корабельное орудие, установленное на шасси Сверхтяжёлого танка. Способное уничтожить всё, что окажется в пределах досягаемости, эта машина тем не менее страдает от недостатка хороших возможностей проявить себя в бою из-за своей крайне низкой производительности и надёжности."
 super_heavy_tank_destroyer_equipment_1: "Сверхтяжелая ПТ-установка"
 super_heavy_tank_destroyer_equipment_1_short: "Сверхтяж. ПТ"
 super_heavy_tank_destroyer_equipment_1_desc: "$super_heavy_tank_destroyer_equipment_desc$"
  
 super_heavy_tank_aa_equipment: "Сверхтяжелая ЗСУ"
 super_heavy_tank_aa_equipment_desc: "Шасси Сверхтяжёлого танка, вооружённое крупнокалиберным зенитным орудием. Несмотря на то, что его оборонительная зенитная роль смягчает некоторые из его худших недостатков, существует мало зенитных орудий, которые выигрывают от такого массивного шасси."
 super_heavy_tank_aa_equipment_1: "Сверхтяжелая ЗСУ"
 super_heavy_tank_aa_equipment_1_short: "Сверхтяж. ЗСУ"
 super_heavy_tank_aa_equipment_1_desc: "$super_heavy_tank_aa_equipment_desc$"
  
 modern_tank_equipment: "Основной танк"
 modern_tank_equipment_desc: "Современное развитие среднего танка, современный танк, который впоследствии получил название «Основной боевой танк», сочетает достижения в двигателестроении с улучшениями в производстве брони, обеспечивая скорость, сравнимую с предыдущими средними танками, при этом неся броню и вооружение, сравнимое с предыдущими тяжёлыми танками."
 modern_tank_equipment_1: "Основной танк"
 modern_tank_equipment_1_short: "Осн. танк"
 modern_tank_equipment_1_desc: "$modern_tank_equipment_desc$"
  
 modern_tank_artillery_equipment: "Современная САУ"
 modern_tank_artillery_equipment_desc: "Современная модель самоходной артиллерии, улучшенная достижениями в баллистике и броневых технологиях. Обычно оптимизированная для огневой мощи, эта модель способна нести тяжёлую гаубицу, сохраняя при этом приличную скорость по бездорожью."
 modern_tank_artillery_equipment_1: "Современная САУ"
 modern_tank_artillery_equipment_1_short: "Соврем. САУ"
 modern_tank_artillery_equipment_1_desc: "$modern_tank_artillery_equipment_desc$"
  
 modern_tank_destroyer_equipment: "Современная ПТ-установка"
 modern_tank_destroyer_equipment_desc: "Тяжёлое противотанковое орудие, установленное на современном шасси. Благодаря достижениям в броневых и двигательных технологиях, этот современный истребитель танков очень эффективен в прямом бою даже против самых современных танков."
 modern_tank_destroyer_equipment_1: "Современная ПТ-установка"
 modern_tank_destroyer_equipment_1_short: "Соврем. ПТ"
 modern_tank_destroyer_equipment_1_desc: "$modern_tank_destroyer_equipment_desc$"
  
 modern_tank_aa_equipment: "Современная ЗСУ"
 modern_tank_aa_equipment_desc: "Современное шасси танка, вооружённое либо очень тяжёлой зенитной пушкой, либо очень манёвренной батареей зенитных автоматических пушек. Несмотря на необходимость быстровращающейся башни для эффективной стрельбы по воздушным целям, достижения в инженерии обеспечивают меньшие потери в броне по сравнению с более ранними зенитными установками."
 modern_tank_aa_equipment_1: "Современная ЗСУ"
 modern_tank_aa_equipment_1_short: "Соврем. ЗСУ"
 modern_tank_aa_equipment_1_desc: "$modern_tank_aa_equipment_desc$"
  
  ##Artillery Tab 
  
 anti_air_equipment: "Буксируемое орудие ПВО"
 anti_air_equipment_short: "ПВО"
 anti_air_equipment_desc: "Поворотная установка, вооружённая одним или несколькими орудиями, часто скорострельными автоматическими, предназначенными для поражения быстродвижущихся воздушных целей."
  
 anti_tank_equipment: "Буксируемое орудие ПТО"
 anti_tank_equipment_short: "ПТО"
 anti_tank_equipment_desc: "Буксируемая установка, вооружённая скорострельной пушкой, предназначенной для стрельбы по тяжелобронированным наземным целям и их пробития."
  
  
  
 artillery_equipment: "Буксируемая артиллерия"
 artillery_equipment_short: "Артиллерия"
 artillery_equipment_desc: "Крупнокалиберное оружие, обслуживаемое расчётом, предназначенное для буксировки лошадьми или автомобилями для обеспечения тяжёлой огневой поддержки боевым подразделениям."
  
 rocket_artillery_equipment: "Буксируемая реактивная артиллерия"
 rocket_artillery_equipment_short: "Ракеты"
 rocket_artillery_equipment_desc: "Разновидность артиллерии, использующая реактивные снаряды. Хотя она обеспечивает очень высокий темп стрельбы на короткое время и может доставлять больший заряд, чем традиционная артиллерия, она гораздо менее точна и имеет гораздо меньший темп стрельбы."
  
 artillery_equipment_1_short: "Артиллерия I"
 artillery_equipment_1: "Артиллерия I"
 artillery_equipment_1_desc: "Очень базовая модель артиллерийского орудия, разработанная до или во время Великой войны. Хотя её базовая конструкция относительно примитивна, эта модель орудия всё ещё очень эффективна на поле боя, основана на хорошо изученной технологии и чрезвычайно надёжна при длительном использовании."
 artillery_equipment_2_short: "Артиллерия II"
 artillery_equipment_2: "Артиллерия II"
 artillery_equipment_2_desc: "Новая модель артиллерийского орудия, полностью учитывающая достижения в технологии оружия. Используя более совершенный механизм перезарядки, более современные боеприпасы и лучшую мобильную установку, эта модель превосходит предыдущие во всех отношениях."
 artillery_equipment_3_short: "Артиллерия III"
 artillery_equipment_3: "Артиллерия III"
 artillery_equipment_3_desc: "Современная модель артиллерийского орудия, предназначенная для доставки разрушительного взрывчатого заряда на предельные расстояния. Современный полуавтоматический механизм и стабилизированная установка позволяют этому орудию вести быстрые повторные выстрелы с сохранением точности, что значительно повышает эффективность бомбардировок."
  
 rocket_artillery_equipment_1_short: "Реактивная артиллерия I"
 rocket_artillery_equipment_1: "Реактивная артиллерия I"
 rocket_artillery_equipment_1_desc: "Реактивная артиллерия менее точна и скорострельна, чем традиционные орудия, однако недостатки окупаются эффектом от одновременного попадания нескольких ракет в цель."
 rocket_artillery_equipment_2_short: "Реактивная артиллерия II"
 rocket_artillery_equipment_2: "Реактивная артиллерия II"
 rocket_artillery_equipment_2_desc: "Стабилизированные вращением ракеты, увеличивающие дальность действия лёгких артиллерийских батарей."
  
 anti_air_equipment_1_short: "Зенитное орудие I"
 anti_air_equipment_1: "Зенитное орудие I"
 anti_air_equipment_1_desc: "Артиллерийское орудие, обычно автоматическое или полуавтоматическое, установленное на поворотной установке. Разработанное и применяемое в основном для противовоздушной обороны, эта модель также подходит для ограниченного применения прямой наводкой против пехоты и легкобронированных наземных машин."
 anti_air_equipment_2_short: "Зенитное орудие II"
 anti_air_equipment_2: "Зенитное орудие II"
 anti_air_equipment_2_desc: "Поздняя модель зенитного орудия, разработанная в ответ на быстрое улучшение бронирования самолётов. Обычно использующая снаряды большего калибра и/или с лучшими бронебойными снарядами, эта модель также достаточно эффективна против лёгких и средних танков."
 anti_air_equipment_3_short: "Зенитное орудие III"
 anti_air_equipment_3: "Зенитное орудие III"
 anti_air_equipment_3_desc: "Современная модель зенитного орудия, предназначенная для поражения более крупных и лучше бронированных самолётов. Благодаря большему калибру и более совершенным боеприпасам, эта модель очень эффективна как многоцелевое зенитное и противотанковое орудие."
  
 anti_tank_equipment_1_short: "Противотанковое орудие I"
 anti_tank_equipment_1: "Противотанковое орудие I"
 anti_tank_equipment_1_desc: "Заимствованное из ранней «пехотной пушки» эпохи Великой войны, это артиллерийское орудие представляет собой небольшую мобильную пушку, которую можно буксировать лёгкими автомобилями и лошадьми для пробития бронированных машин, которые иначе защищены от огня тяжёлых пулемётов и винтовок.\nИз-за своего малого калибра и низкой скорострельности оно имеет ограниченное применение, кроме как противотанковое оружие."
  
 anti_tank_equipment_2_short: "Противотанковое орудие II"
 anti_tank_equipment_2: "Противотанковое орудие II"
 anti_tank_equipment_2_desc: "Разработанная в ответ на улучшения бронированных машин, эта модель противотанкового орудия адаптируется за счёт использования снарядов большего калибра с улучшенными материалами и технологиями проектирования для более эффективных снарядов. Дополнительные инновации, такие как конические стволы и механизмы быстрой перезарядки, дополнительно повышают боевую эффективность."
  
 anti_tank_equipment_3_short: "Противотанковое орудие III"
 anti_tank_equipment_3: "Противотанковое орудие III"
 anti_tank_equipment_3_desc: "Сочетая различные типы новых боеприпасов с конструкцией более высокой начальной скорости, это противотанковое орудие использует наибольший калибр, который можно разумно перевозить на буксируемой установке, для максимизации пробития более тяжелобронированных машин."
  
 gw_artillery: "$artillery_equipment_1_short$"
  
  
  
  ##MtG Amphibious Armor 
  
 amphibious_mechanized_equipment: "Десантные машины-амфибии"
 amphibious_mechanized_equipment_short: "Амфибии"
 amphibious_mechanized_equipment_desc: "Обычно требующее специально сконструированного шасси из-за необходимости быть плавучим и водонепроницаемым, десантное гусеничное транспортное средство развивает предыдущие конструкции БТР, позволяя морской пехоте высаживаться на пляжи и пересекать реки, будучи защищённой лёгкой бронёй."
  
 amphibious_mechanized_equipment_1: "Десантный тягач I"
 amphibious_mechanized_equipment_1_short: "Дес. тягач I"
 amphibious_mechanized_equipment_1_desc: "Обычно требующее специально сконструированного шасси из-за необходимости быть плавучим и водонепроницаемым, десантное гусеничное транспортное средство развивает предыдущие конструкции БТР, позволяя морской пехоте высаживаться на пляжи и пересекать реки, будучи защищённой лёгкой бронёй. Его топливная эффективность и скорость обычно невысоки, но оно превосходит небронированные десантные катера для боевого использования."
 amphibious_mechanized_equipment_2: "Десантный тягач II"
 amphibious_mechanized_equipment_2_short: "Дес. тягач II"
 amphibious_mechanized_equipment_2_desc: "Улучшенная модель десантного гусеничного транспортного средства с боевыми характеристиками, более соответствующими другим моделям БТР. Обладает улучшенной бронёй, улучшенной скоростью и управляемостью, а также лучшими амфибийными возможностями."
  
 amphibious_tank_equipment: "Плавающие танки"
 amphibious_tank_equipment_short: "Плавающие танки"
 amphibious_tank_equipment_desc: "Обычно построенный на специально сконструированном или адаптированном шасси лёгкого танка, плавающий танк — это тип танка, который способен пересекать участки (обычно только мелкой) воды, будучи оснащённым плавучим корпусом, водонепроницаемыми отсеками и некоторой формой водного движителя (обычно гребным винтом)."
 light_tank_amphibious_chassis: "Легкие плавающие танки"
 light_tank_amphibious_chassis_short: "Легк. плав. танки"
 medium_tank_amphibious_chassis: "Средние плавающие танки"
 medium_tank_amphibious_chassis_short: "Ср. плав. танки"
 heavy_tank_amphibious_chassis: "Тяжелые плавающие танки"
 heavy_tank_amphibious_chassis_short: "Тяж. плав. танки"
  
  
 amphibious_tank_equipment_1: "Плавающий танк I"
 amphibious_tank_equipment_1_short: "Плав. танк I"
 amphibious_tank_equipment_1_desc: "Плавающий лёгкий танк, обычно построенный на специально сконструированном или адаптированном шасси лёгкого танка. Этот плавающий танк способен пересекать участки мелкой воды и оснащён плавучим корпусом, водонепроницаемыми отсеками и базовой формой водного движителя."
 amphibious_tank_equipment_2: "Плавающий танк II"
 amphibious_tank_equipment_2_short: "Плав. танк II"
 amphibious_tank_equipment_2_desc: "Более совершенная реализация идеи плавающего танка. Более тяжёлая и адаптированная из более стандартизированного шасси танка, эта модель использует современные материалы для применения складывающегося или съёмного амфибийного оборудования, а также резиновые прокладки и другие механические уплотнения для создания более крупной и тяжёлой конструкции танка, способной пересекать водные преграды."
  
