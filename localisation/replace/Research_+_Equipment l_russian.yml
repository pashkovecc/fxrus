 heavy_tank_artillery_equipment: "Тяжелая САУ"
 heavy_tank_artillery_equipment_desc: "Шасси тяжёлого танка, вооружённое тяжёлой гаубицей, оптимизированной для непрямой огневой поддержки. Хотя шасси такого размера требуется для перевозки тяжёлого вооружения, его использование в качестве тяжёлой артиллерийской поддержки позволяет более приемлемо жертвовать бронёй и манёвренностью."
