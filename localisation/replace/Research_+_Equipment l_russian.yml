 heavy_tank_equipment: "Тяжелый танк"
 heavy_tank_equipment_desc: "Крупный, тяжёлый, тяжелобронированный танк для специализированных ролей прорыва. Хотя он способен нести очень большое орудие и чрезвычайно хорошо бронирован, эта модель жертвует манёвренностью и скоростью ради максимальной защиты и огневой мощи."
 heavy_tank_equipment_1: "Тяжелый танк I"
 heavy_tank_equipment_1_short: "Тяж. танк I"
