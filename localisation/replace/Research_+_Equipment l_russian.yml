     ###Super-Heavy Art 
 sp_land_super_heavy_howitzer: "Сверхтяжелая артиллерия"
 sp_land_super_heavy_howitzer_desc: "Восходящая к Великой войне, сверхтяжелая артиллерия представляет собой орудия, предназначенные для осадных и разрушительных ролей, обладающие эффективной дальностью и взрывным зарядом, значительно превосходящими стандартные артиллерийские орудия. В обмен на эту огромную огневую мощь сверхтяжелая артиллерия обычно на порядки тяжелее и больше, чем может быть перевезена обычными грузовиками и тягачами, и часто должна разбираться на несколько частей для транспортировки, а заряжание осуществляется специализированными транспортными средствами."
 sp_land_self_propelled_super_heavy_howitzer: "Самоходная сверхтяжелая артиллерия"
 sp_land_self_propelled_super_heavy_howitzer_desc: "Модель сверхтяжелой артиллерии, установленная на самоходную установку. По сравнению с другими обычными самоходными артиллерийскими установками, эта машина идёт на крайние компромиссы в скорости, манёвренности и броне, достигая минимального размера и веса для эффективного перемещения артиллерийского орудия для оперативного переразвёртывания между боями."
  
