 medium_tank_aa_equipment: "Средняя ЗСУ"
 medium_tank_aa_equipment_desc: "Шасси среднего танка, оснащённое поворотной установкой с пулемётами или автоматическими пушками для противовоздушной обороны. Поскольку зенитная установка требует много свободного места для изменения наведения и возвышения, башню необходимо перепроектировать или убрать, и приходится жертвовать бронёй."
