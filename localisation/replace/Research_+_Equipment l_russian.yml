 sp_land_land_cruiser: "Сухопутный крейсер"
 sp_land_land_cruiser_desc: "Концепция «сухопутного крейсера» восходит к началу 1920-х годов, когда британцы впервые разработали идею «сухопутного линкора» — массивной, тяжелобронированной машины с вооружением и экипажем, аналогичным морским линкорам. Массивная, тяжёлая, многобашенная, многопушечная машина, сухопутный крейсер обладает экстремальной бронёй и вооружением в обмен на необходимость самого мощного двигателя и самого большого экипажа, который только можно разработать для наземной машины. Страдая от проблем с разработкой и иногда полностью неспособная передвигаться по обычным дорогам и мостам, сухопутный крейсер тем не менее представляет собой вершину амбиций в области бронированных машин."
  
