 medium_tank_artillery_equipment: "Средняя САУ"
 medium_tank_artillery_equipment_short: "СР. САУ"
 medium_tank_artillery_equipment_desc: "Шасси среднего танка, вооружённое артиллерийским орудием или гаубицей для непосредственной и непрямой огневой поддержки. Обычно броней жертвуют для освобождения веса под более тяжёлое орудие, а отделение экипажа обычно открыто сверху для создания необходимого пространства для заряжания и обслуживания орудия, что снижает живучесть машины."
 medium_tank_artillery_equipment_1: "Средняя САУ I"
 medium_tank_artillery_equipment_1_short: "Ср. САУ I"
 medium_tank_artillery_equipment_1_desc: "$medium_tank_artillery_equipment_desc$"
 medium_tank_artillery_equipment_2: "Средняя САУ II"
