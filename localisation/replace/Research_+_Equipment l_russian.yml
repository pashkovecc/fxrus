l_russian:
  
  ##Infantry Tab 
 infantry_equipment: "Пехотное снаряжение"
 infantry_equipment_short: "Пехотное снар."
 infantry_equipment_desc: "Винтовка, штык и боеприпасы для оснащения пехоты."
  
 infantry_equipment_0: "Пехотное снаряжение I"
 infantry_equipment_0_short: "Пехотное снар. I"
 infantry_equipment_0_desc: "Ранняя модель пехотной магазинной винтовки, разработанная в годы, предшествовавшие Великой войне и во время неё. Эта ранняя модель обычно имеет полноразмерный ствол и ряд устаревших элементов, таких как прицелы для залповой стрельбы и отключаемые магазины. Длинный ствол и длинный штык делают такое оружие неудобным в ближнем бою и непрактичным для вспомогательных войск."
 infantry_equipment_1: "Пехотное снаряжение II"
 infantry_equipment_1_short: "Пехотное снар. II"
 infantry_equipment_1_desc: "Улучшенная модель магазинной винтовки, разработанная в годы после Великой войны. Опираясь на опыт современной промышленной войны, эта конструкция обычно имеет более удобный размер «короткой винтовки» с более коротким штыком для снижения веса и улучшения управляемости. Устаревшие элементы устранены и заменены более современной эргономикой и более качественным изготовлением."
 infantry_equipment_2: "Пехотное снаряжение III"
 infantry_equipment_2_short: "Пехотное снар. III"
 infantry_equipment_2_desc: "Усовершенствованная пехотная винтовка с новой полуавтоматической автоматикой. Спроектированная для использования энергии выстрела для перезарядки, эта конструкция устраняет необходимость ручного перезаряжания, позволяя производить более быстрые повторные выстрелы и, следовательно, обеспечивать больший объём точного огня. Помимо улучшенного механизма, конструкция мало отличается от более ранних моделей, а управление, заряжание и эксплуатация обычно соответствуют более ранним винтовкам с продольно-скользящим затвором."
 infantry_equipment_3: "Пехотное снаряжение IV"
 infantry_equipment_3_short: "Пехотное снар. IV"
 infantry_equipment_3_desc: "Конструкция пехотной винтовки, разработанная с нуля с учётом современных технологий и тактики. Штурмовые и боевые винтовки с возможностью ведения огня очередями позволяют пехотинцу выполнять несколько задач с одной винтовкой. Промежуточные патроны, отъёмные магазины, складные приклады и другие конструктивные особенности включены для максимизации огневой мощи и удобства обращения при минимизации веса для отдельного солдата."
  
 infantry_weapons2: "Улучшенное пехотное снаряжение I"
 infantry_weapons2_desc: "Ранняя модель пистолетов-пулемётов, а также полуавтоматические пистолеты. Дополнена улучшенной пехотной амуницией и другим вспомогательным снаряжением, предназначенным для повышения наступательных возможностей солдат."
 improved_infantry_weapons_2: "Улучшенное пехотное снаряжение II"
 improved_infantry_weapons_2_desc: "Дальнейшая разработка пистолета-пулемёта с использованием современных материалов и технологий производства; более совершенные автоматические пистолеты для офицеров и вспомогательных войск. Войска получают лучшее снаряжение, включая ножи и штыки, а также улучшенную униформу и лучше стандартизированные боеприпасы."
 advanced_infantry_weapons2: "Улучшенное пехотное снаряжение III"
 advanced_infantry_weapons2_desc: "Модернизированный, дешёвый в производстве пистолет-пулемёт, предназначенный для максимально широкого распространения. Современное вспомогательное оружие, такое как карабины и компактные пистолеты, обеспечивает дополнительную огневую мощь для личного состава поддержки и штабов. Современная униформа и снаряжение позволяют лучше использовать имеющееся оружие."
  
 infantry_at: "Пехотное противотанковое оружие I"
 infantry_at_desc: "Переносное пехотное противотанковое оружие, предназначенное для усиления ротных противотанковых средств и обеспечения противотанковых возможностей в ситуациях, когда ротное оружие недоступно. Эти ранние модели используют проверенную технологию, разгоняя твёрдые снаряды на сверхвысоких скоростях для достижения пробития."
 infantry_at2: "Пехотное противотанковое оружие II"
 infantry_at2_desc: "Более модернизированное переносное пехотное противотанковое оружие. Способное обеспечить пехотинцев мощными средствами поражения материальной части, используя кумулятивные заряды, фугасные снаряды и безоткатные системы. Обеспечивает лучшее пробитие брони и борьбу с более бронированными машинами."
  
 night_vision_desc: "Ранний прототип инфракрасного ночного прицела, использующий специализированную инфракрасную электронную трубку. Низкая чувствительность этой модели требует дополнительной установки большого и тяжёлого инфракрасного осветителя, что ограничивает её эффективность и позволяет использовать её только со стационарным оружием или очень специализированными войсками."
 night_vision2_desc: "Разработанный прототип стандартизированного инфракрасного ночного прицела. Хотя он всё ещё ограничен инфракрасной трубкой, достижения в производстве и совершенствовании технологии улучшили портативность и эффективность. Хотя они всё ещё непрактичны для массового использования, эти модели чрезвычайно хорошо подходят для оружия взводного уровня, такого как пулемёты и пехотные гранатомёты."
  
 support_weapons: "Оружие огневой поддержки I"
 support_weapons_desc: "Ранняя модель среднего или лёгкого пулемёта, обычно с ограниченной переносимостью, разработанная во время Великой войны. Вместе с миномётом, разработанным до и во время Великой войны, они составляют основу оборонительного вооружения пехоты."
 support_weapons2: "Оружие огневой поддержки II"
 support_weapons2_desc: "Модель лёгкого пулемёта, улучшенная со времён Великой войны для удобной переноски и обслуживания расчётами из двух-трёх человек. Улучшенная модель миномёта, также разработанная с учётом пехотной переносимости. Обе конструкции значительно повышают манёвренность пехоты в обороне, дополнительно улучшая возможности при отражении атак."
 support_weapons3: "Оружие огневой поддержки III"
 support_weapons3_desc: "Модель лёгкого и/или единого пулемёта с улучшенными характеристиками, такими как быстросменный ствол и улучшенная сошка, обеспечивающая гибкое и надёжное применение. Улучшенные миномётные боеприпасы с лучшими метательными зарядами и более мощной взрывчаткой, предназначенные для модернизации существующих пехотных миномётов. Эти улучшения существующих конструкций ещё больше повышают способность пехоты вести эффективную оборону."
 support_weapons4: "Оружие огневой поддержки IV"
 support_weapons4_desc: "Модернизированная модель пехотного пулемёта, спроектированная как дешёвая, надёжная и неприхотливая, с развитием предыдущих конструкторских решений. Современные миномётные боеприпасы с улучшенной дальностью и взрывной мощью.\nКонструкции оружия поддержки здесь приближаются к пику возможных улучшений без радикального пересмотра организации и оснащения пехотных подразделений."
  
 motorized_equipment: "Грузовик"
 motorized_equipment_desc: "Транспорт для перевозки войск, снабжения и общего улучшения логистики."
 motorized_equipment_0_short: "Моториз. I"
 motorized_equipment_0: "Моторизированное снаряжение I"
 motorized_equipment_0_desc: "Один из первых транспортных средств с двигателем внутреннего сгорания, разработанный в годы, предшествовавшие Великой войне и после неё. Хотя он превосходит гужевой транспорт, эта модель не имеет стандартизированных органов управления и конструкции, что делает её неэффективной и непостоянной для военного использования."
 motorized_equipment_1_short: "Моториз. II"
 motorized_equipment_1: "Моторизированное снаряжение II"
 motorized_equipment_1_desc: "Полностью стандартизированная модель грузовика, разработанная в 1930-х годах. Эти модели грузовиков используют преимущества современных крупномасштабных промышленных методов, что делает их намного превосходящими более ранние образцы."
  
 mechanized_equipment: "Бронетранспортёры"
 mechanized_equipment_short: "Бронетранспортёры"
 mechanized_equipment_desc: "Транспорт, предназначенный для перевозки войск, снабжения и общего улучшения логистики, обеспечивающий адекватную броневую защиту от стрелкового оружия и лёгких снарядов."
  
 mechanized_equipment_1: "Бронетранспортёры I"
 mechanized_equipment_1_short: "Бронетранспортёры I"
 mechanized_equipment_1_desc: "Ранняя модель механизированного транспортного средства, адаптированная из существующего шасси грузовика путём добавления вспомогательной брони и обычно с добавлением гусениц или улучшенной подвески. Подходит для обеспечения пехоты адекватной защитой для боя вместе с танковыми ротами."
 mechanized_equipment_2: "Бронетранспортёры II"
 mechanized_equipment_2_short: "Бронетранспортёры II"
 mechanized_equipment_2_desc: "Лучше сконструированная специализированная модель бронированного транспортера пехоты. Имеет полностью закрытое отделение для экипажа с усиленной ходовой частью и моторным отсеком для лучшей защиты от стрелкового оружия. Лучше подходит для боя с более тяжёлыми танками."
 mechanized_equipment_3: "Бронетранспортёры III"
 mechanized_equipment_3_short: "Бронетранспортёры III"
 mechanized_equipment_3_desc: "Современная модель бронетранспортёра с усиленной броней и оптимизированной ходовой частью. Современная конструкция трансмиссии позволяет этому транспортному средству поддерживать оперативную скорость, сравнимую с небронированными грузовиками."
  
 motorbike_equipment: "Мотоциклетное снаряжение"
 motorbike_equipment_short: "Мотоциклетное снаряжение"
 motorbike_equipment_desc: "От скромного велосипеда до современного мотоцикла — «велосипеды» или «циклы» — это двухколёсные транспортные средства, предназначенные для перевозки одного человека, а иногда и пассажира в коляске. Велосипеды более экономичны и компактны, чем автомобили, а стандартный велосипед может приводиться в движение мускульной силой, что делает их гибким и дешёвым транспортным средством для пехоты и вспомогательного персонала."
  
 motorbike_equipment_0: "Велосипедное снаряжение"
 motorbike_equipment_0_short: "Велосипед"
 motorbike_equipment_0_desc: "Велосипед оставался практически неизменным с момента изобретения первого велосипеда с цепным приводом около 1885 года. Приводимый исключительно мускульной силой, велосипед не требует топлива, дёшев в производстве, лишь немного медленнее лошади и может передвигаться по более разнообразной местности, чем полноразмерные автомобили."
  
 motorbike_equipment_1: "Мотоциклетное снаряжение"
 motorbike_equipment_1_short: "Мотоцикл"
 motorbike_equipment_1_desc: "Мотоцикл — это небольшое двухколёсное транспортное средство, приводимое в движение небольшим бензиновым (или иногда керосиновым) двигателем, предназначенное для перевозки человека на большие расстояния и по различной местности. Хотя он не такой дешёвый и лёгкий, как велосипед, мотоцикл может перевозить войска быстрее и дальше, сочетая многие лучшие качества велосипеда и автомобиля."
  
 armored_car_equipment: "Бронемашина"
 armored_car_equipment_desc: "Лёгкое бронированное колёсное транспортное средство. Обычно используется для разведки и военной полиции, бронемашина пытается заполнить пробел между танками и небронированными грузовиками, используя лёгкую броню для защиты, жертвуя при этом проходимостью полноценного гусеничного транспорта."
 gw_armored_car_equipment: "Бронемашина I"
 gw_armored_car_equipment_desc: "Во время Великой войны первые бронированные боевые машины были гражданскими и промышленными автомобилями, обшитыми коммерческой стальной бронёй, иногда с установленной сверху башней. Эта модель является прямым потомком оригинальной военной бронемашины и имеет управляемость, сравнимую с большинством автомобилей Великой войны."
 armored_car_equipment_1: "Бронемашина II"
 armored_car_equipment_1_desc: "Улучшенная модель бронемашины, спроектированная с нуля для разведки и борьбы с партизанами. Новые модели бронемашин часто имеют двухосный привод, а также улучшенную проходимость по бездорожью, что делает их примечательно манёвренными на открытой местности."
 armored_car_equipment_2: "Бронемашина III"
 armored_car_equipment_2_desc: "Более совершенная модель бронемашины. Имеет более тяжёлую и лучше спроектированную броню, обеспечивающую защиту, сравнимую с большинством лёгких танков. Вооружена более тяжёлым орудием в специально сконструированной башне, с более современными органами управления и конструкцией."
 armored_car_at_equipment: "Противотанковая бронемашина"
 armored_car_at_equipment_desc: "Построенная на модернизированном шасси бронемашины, эта модель обеспечивает лёгкие разведывательные подразделения противотанковым оружием, которое быстрее развёртывается и лучше защищено, чем буксируемые противотанковые орудия."
  
  ##Armor Tab 
 gw_tank_equipment: "Танк эпохи Первой мировой"
 gw_tank_equipment_short: "Танк Первой мировой"
 gw_tank_equipment_desc: "Ранняя модель танка, разработанная на поздних этапах Первой мировой войны. Обычно адаптирована из ранней тракторной подвески и бронирована очень простыми лёгкими стальными листами, оснащена ранним маломощным двигателем. Из-за ограниченной мощности и большого веса обычно способна нести только лёгкое вооружение, обычно либо пехотное орудие, либо пулемёт."
  
 light_tank_equipment: "Легкий танк"
 light_tank_equipment_desc: "Небольшая, манёвренная модель танка, предназначенная для разведки и дозорных задач, обычно легко бронированная и оснащённая лёгким вооружением."
 light_tank_equipment_1: "Легкий танк I"
 light_tank_equipment_1_short: "Легк. танк I"
 light_tank_equipment_1_desc: "$light_tank_equipment_desc$"
 light_tank_equipment_2: "Легкий танк II"
 light_tank_equipment_2_short: "Легк. танк II"
 light_tank_equipment_2_desc: "$light_tank_equipment_desc$"
 light_tank_equipment_3: "Легкий танк III"
 light_tank_equipment_3_short: "Легк. танк III"
 light_tank_equipment_3_desc: "$light_tank_equipment_desc$"
  
 light_tank_artillery_equipment: "Легкая САУ"
 light_tank_artillery_equipment_desc: "Шасси лёгкого танка, вооружённое артиллерийским орудием для непосредственной поддержки. Обычно броней жертвуют для освобождения веса под более тяжёлое орудие, а отделение экипажа обычно открыто сверху для создания необходимого пространства для заряжания и обслуживания орудия, что снижает живучесть машины."
 light_tank_artillery_equipment_1: "Легкая САУ I"
 light_tank_artillery_equipment_1_short: "Легк. САУ I"
 light_tank_artillery_equipment_1_desc: "$light_tank_artillery_equipment_desc$"
 light_tank_artillery_equipment_2: "Легкая САУ II"
 light_tank_artillery_equipment_2_short: "Легк. САУ II"
 light_tank_artillery_equipment_2_desc: "$light_tank_artillery_equipment_desc$"
 light_tank_artillery_equipment_3: "Легкая САУ III"
 light_tank_artillery_equipment_3_short: "Легк. САУ III"
 light_tank_artillery_equipment_3_desc: "$light_tank_artillery_equipment_desc$"
  
 light_tank_destroyer_equipment: "Легкая ПТ-установка"
 light_tank_destroyer_equipment_short: "Легкая ПТ"
 light_tank_destroyer_equipment_desc: "Шасси лёгкого танка, вооружённое скорострельной пушкой, предназначенной для пробития более тяжёлой брони. В то время как меньшие противотанковые орудия можно устанавливать с меньшими изменениями, более крупные противотанковые орудия с большим калибром и более длинным стволом требуют значительных компромиссов в шасси и броне."
 light_tank_destroyer_equipment_1: "Легкая ПТ-установка I"
 light_tank_destroyer_equipment_1_short: "Легк. ПТ I"
 light_tank_destroyer_equipment_1_desc: "$light_tank_destroyer_equipment_desc$"
 light_tank_destroyer_equipment_2: "Легкая ПТ-установка II"
 light_tank_destroyer_equipment_2_short: "Легк. ПТ II"
 light_tank_destroyer_equipment_2_desc: "$light_tank_destroyer_equipment_desc$"
 light_tank_destroyer_equipment_3: "Легкая ПТ-установка III"
 light_tank_destroyer_equipment_3_short: "Легк. ПТ III"
 light_tank_destroyer_equipment_3_desc: "$light_tank_destroyer_equipment_desc$"
  
 light_tank_aa_equipment: "Легкая ЗСУ"
 light_tank_aa_equipment_desc: "Шасси лёгкого танка, оснащённое поворотной установкой с пулемётами или автоматическими пушками для противовоздушной обороны. Поскольку зенитная установка требует много свободного места для изменения наведения и возвышения, башню необходимо перепроектировать или убрать, и приходится жертвовать бронёй."
 light_tank_aa_equipment_1: "Легкая ЗСУ I"
 light_tank_aa_equipment_1_short: "Легк. ЗСУ I"
 light_tank_aa_equipment_1_desc: "$light_tank_aa_equipment_desc$"
 light_tank_aa_equipment_2: "Легкая ЗСУ II"
 light_tank_aa_equipment_2_short: "Легк. ЗСУ II"
 light_tank_aa_equipment_2_desc: "$light_tank_aa_equipment_desc$"
