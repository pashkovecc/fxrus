 super_heavy_railway_gun_equipment_short: "Св.-тяж. ж/д-орудие"
 super_heavy_railway_gun_equipment_desc: "Основанное на обычных тяжёлых железнодорожных орудиях, восходящих к Великой войне, это сверхтяжёлое железнодорожное орудие представляет собой более массивную модель пушки, требующую полноразмерного поезда, специализированных транспортных средств для заряжания и целой дивизии поддержки для работы. В обмен это орудие обладает абсолютно беспрецедентной дальностью для баллистического артиллерийского орудия, будучи способным вести огонь по целям за пределами оперативной дальности любого другого наземного подразделения."
