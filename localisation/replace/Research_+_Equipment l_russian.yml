 medium_tank_equipment: "Средний танк"
 medium_tank_equipment_desc: "Гибкая, универсальная модель танка, предназначенная для поддержания баланса скорости, брони и вооружения. Обычно они лучше подходят для регулярных фронтальных боёв, чем другие типы танков, поскольку они хорошо бронированы и достаточно вооружены для эффективности в боевых условиях, но также достаточно быстры для быстрого переразвёртывания."
 medium_tank_equipment_1: "Средний танк I"
 medium_tank_equipment_1_short: "Ср. танк I"
 medium_tank_equipment_1_desc: "$medium_tank_equipment_desc$"
