 ARMY_EXPERIENCE_DESC: "По мере использования снаряжения в бою вы получаете опыт армии. Это значит, что вы можете получать опыт армии, когда ваши §Hдивизии§! участвуют в сражениях или если вы поставили союзникам снаряжение через §Hматериальную поддержку§!.\nВы также получаете опыт за проведение §Hармейских учений§! войск, достигших как минимум $UNIT_TRAINING_LEVEL|Y$-го уровня, и за определенные §Hнациональные фокусы§!. Некоторые §Hминистры§! могут увеличивать прирост опыта.\n\nОпыт армии необходим для создания и изменения §Hшаблонов дивизий§! и открытия §Hдоктрин§!."
 AIR_EXPERIENCE_DESC: "По мере использования самолетов в бою и проведения §Hвоздушных учений§! вы получаете опыт авиации. Это значит, что вы можете получать опыт авиации, когда ваши §Hавиакрылья§! участвуют в сражениях или если вы поставили союзникам снаряжение через §Hматериальную поддержку§!.\nНекоторые §Hнациональные фокусы§! дают дополнительный опыт, а некоторые §Hминистры§! увеличивают прирост опыта.\n\nОпыт авиации позволяет создавать улучшенные варианты существующих самолетов и разрабатывать новые, а также открывать §Hдоктрины§!."
  
