 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc: "Один из младших инженеров обнаружил новый метод укрепления, который можно применять при строительстве оборонительных сооружений. Если мы запишем данные об этом открытии, в дальнейшем это упростит работу наших ученых."
