 sp_air_bouncing_bomb: "Прыгающая бомба"
 sp_air_bouncing_bomb_desc: "A bomb that can skip and bounce over water surfaces could be the perfect tool to breach dam defences, and could prove useful in other situations as well." #NT!
 sp_air_bouncing_bomb_completion_tt: "Открывает §Y$raid_type_dam_bombing_raid$§! и §Y$raid_type_lock_bombing_raid$§!"
  
