 sp_air_earthshaker_bomb: "Сейсмическая бомба"
 sp_air_earthshaker_bomb_desc: "Тяжелая бомба, которая пробивает поверхность земли и взрывается под землей. Такой взрыв производит сильнейшие разрушения."
 sp_air_earthshaker_bomb_completion_tt: "Открывает §Y$raid_type_mega_gun_emplacement_strike$§! raids"
