 sp_air_earthshaker_bomb_no_bba_desc: "$sp_air_earthshaker_bomb_desc$"
  
 sp_air_intercontinental_bomber: "Межконтинентальный бомбардировщик"
 sp_air_intercontinental_bomber_desc: "Огромный самолет, нагруженный бомбами и топливом. Разработан специально для высотных полетов на дальние расстояния и способен пересекать океаны и континенты."
  
 sp_air_mothership_aircraft: "Самолет-матка"
 sp_air_mothership_aircraft_desc: "A massive aircraft that carries fighter planes into battle, enabling deep escort missions into enemy territory — truly the swarm-lord of the skies." #NT!
  
 sp_air_jet_engine: "Реактивный двигатель"
 sp_air_jet_engine_desc: "Jet engines are far more powerful than propeller engines, potentially revolutionising aircraft design and sparking a new era of aeronautical engineering." #NT!
  
 sp_air_axial_jet_engine: "Осевой реактивный двигатель"
 sp_air_axial_jet_engine_desc: "Первые реактивные двигатели оказались неспособны эффективно сжимать воздух. Чтобы усилить тягу, можно попробовать разместить несколько компрессоров последовательно."
  
 sp_air_supersonic_jet: "Сверхзвуковой реактивный самолет"
 sp_air_supersonic_jet_desc: "Благодаря труду конструкторов реактивных двигателей вскоре появится возможность строить самолеты, способные достигать скорости звука и даже превышать ее."
  
 sp_air_helicopter: "Вертолет"
 sp_air_helicopter_desc: "Поскольку вертолет способен висеть на месте, он может обеспечить нашим войскам важное тактическое преимущество."
  
