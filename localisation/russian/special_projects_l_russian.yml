 sp_land_reward_stronghold_network_leadership_approach: "Подход к управлению"
 sp_land_reward_stronghold_network_leadership_approach_desc: "Работа над проектом идет полным ходом, и [Character.GetName] начинает размышлять о своей роли в его дальнейшей реализации. [Character.GetSheHeCap] может лично руководить процессом, чтобы обеспечить точное выполнение плана, или же остаться у себя в отделе и сосредоточиться на стратегии и планировании."
 sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally: "Контролировать работу лично"
