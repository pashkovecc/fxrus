 sp_air_political_interference_generic_reward: "Вмешательство политиков"
 sp_air_political_interference_generic_reward_desc: "Из-за вмешательства политиков, лезущих не в свое дело, уже законченные этапы работы пришлось выполнять заново — по совершенно абсурдным причинам."
 sp_air_political_interference_generic_reward_option: "Два шага вперед — один назад"
  
 sp_air_generic_major_breakthrough_reward: "Крупный прорыв"
