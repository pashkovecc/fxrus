 sp_rockets_medium_range_ballistic_missile: "БРСД"
 sp_rockets_medium_range_ballistic_missile_desc: "С помощью баллистических ракет средней дальности мы сможем поражать цели в любой точке континента с поразительной точностью и сильным разрушительным воздействием."
  
 sp_rockets_long_range_ballistic_missile: "МБР"
 sp_rockets_long_range_ballistic_missile_desc: "Межконтинентальная баллистическая ракета — вероятно, крупнейшая из всех, что мы построим. Способна донести боевой заряд с большой точностью в любую точку земного шара."
  
 sp_rockets_ground_to_air_missile: "Ракеты «земля — воздух»"
 sp_rockets_ground_to_air_missile_desc: "A large rocket powered anti-air missile, capable of knocking a bomber out of the sky with a single hit. This will shape the future of air defence, for sure." #NT!
  
 sp_rocket_interceptor: "Реактивный перехватчик"
 sp_rocket_interceptor_desc: "Combining the power of a rocket with the manoeuvrability of a small chassis, we will create an unmatched interceptor aircraft." #NT!
  
