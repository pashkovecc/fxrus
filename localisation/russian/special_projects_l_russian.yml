 sp_land_reward_stronghold_network_structural_weakness_discovered: "Обнаружена слабость конструкции"
 sp_land_reward_stronghold_network_delayed_by_concrete_shortage: "Задержки из-за нехватки бетона"
 sp_land_reward_stronghold_network_underground_rail_systems: "Подземная железнодорожная сеть"
