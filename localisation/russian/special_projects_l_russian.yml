 sp_nuclear_generic_industry_tech_reward: "Технологическое развитие"
 sp_nuclear_generic_industry_tech_reward_desc: "Во время работы над проектом наши инженеры совершили несколько открытий, которые могут пригодиться и в других областях."
 sp_nuclear_generic_reward_option_industry_tech_name: "Передовые промышленные исследования"
