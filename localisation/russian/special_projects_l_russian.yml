 sp_land_reward_stronghold_network_communication_system_overhaul: "Обновление систем связи"
 sp_land_reward_stronghold_network_communication_system_overhaul_desc: "Во время проверки внутренней системы связи испытательного центра инженеры выявили некоторые недостатки. Устранив их, мы сможем улучшить и другие подобные системы, используемые в укреплениях."
 sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize: "Standardise" #NT!
