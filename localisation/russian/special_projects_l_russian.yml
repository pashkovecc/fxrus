 sp_nuclear_major_political_interference_generic_reward: "Серьезное вмешательство политиков"
 sp_nuclear_major_political_interference_generic_reward_desc: "Проект [SpecialProject.GetName] стал объектом пристального внимания и вмешательства политических лидеров, что приводит к задержкам и потенциально смене руководства проекта. [Character.GetName] в ярости. Нужно разобраться с этими политическими проблемами, чтобы не сорвать сроки."
