  # Nuclear reactor 
 sp_nuclear_design_choice_reward: "Проект реактора"
 sp_nuclear_design_choice_reward_desc: "Перед тем как приступить к проектированию реактора, необходимо выбрать замедлитель нейтронов. От него будет зависеть конструкция всего реактора. Мы можем использовать тяжелую воду или графит. Преимущества и недостатки есть у обоих вариантов..."
 sp_nuclear_design_choice_reward_graphite: "Очищенный графит — лучший замедлитель"
 sp_nuclear_design_choice_reward_heavy_water: "Реакторы, работающие на тяжелой воде, дешевле"
 sp_nuclear_major_breakthrough_reward: "Крупный прорыв в области ядерных реакций"
 sp_nuclear_major_breakthrough_reward_desc: "В ходе контролируемого эксперимента с использованием небольшого количества радиоактивных веществ мы убедились, что наш проект осуществим. Теперь мы полны энтузиазма довести его до конца."
 sp_nuclear_isotope_separation_choice_reward: "Установки для разделения изотопов"
 sp_nuclear_isotope_separation_choice_reward_desc: "Чтобы обеспечить реакторы ядерным топливом, нужно определиться с процессом отделения полезных изотопов урана от всех остальных. Среди вариантов разделительных установок наметились два самых оптимальных — газовые и центрифуги."
 sp_nuclear_isotope_separation_choice_reward_gaseous: "Газовые установки — вариант, проверенный временем."
 sp_nuclear_isotope_separation_choice_reward_centrifugal: "Центрифуги будут более эффективны в долгосрочной перспективе."
  
