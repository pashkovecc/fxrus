  # Bouncing Bomb 
 sp_air_bouncing_bomb_backspin_mechanism_reward: "Механизм обратной раскрутки"
 sp_air_bouncing_bomb_backspin_mechanism_reward_desc: "Our scientists have come up with an ingenious solution for stabilising the bomb once dropped. The mechanism starts a backspin, which keeps it on track to the target." #NT!
