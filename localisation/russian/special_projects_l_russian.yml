 sp_nuclear_minor_progress_generic_reward_desc: "Во время работы над новейшим прототипом наши ученые совершили несколько важных открытий. Благодаря им наши знания расширились и углубились."
 sp_nuclear_generic_electronics_tech_reward: "Технологические инновации"
 sp_nuclear_generic_electronics_tech_reward_desc: "Significant learnings were made during the last iteration on the project. Hopefully, we will be able to put this to practical use, which should allow us to speed up research in related areas." #NT!
