 sp_nuclear_bomb_theoretical_breakthrough_generic_reward: "Теоретический прорыв"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc: "[Character.GetName] во время работы над прототипом успешно решает сложную теоретическую проблему. Это позволит усовершенствовать конструкцию бомбы и упростить ее производство."
  
 sp_nuclear_bomb_critical_mass_generic_reward: "Инцидент во время эксперимента с критической массой"
 sp_nuclear_bomb_critical_mass_generic_reward_desc: "Во время экспериментов с определением критической массы заряда произошел сверхкритический инцидент, который привел к облучению и гибели важного персонала."
  
 sp_nuclear_bomb_information_leak_reward: "Утечка информации"
 sp_nuclear_bomb_information_leak_reward_desc: "One of the workers at the [SpecialProject.GetName] has apparently been leaking information to foreign agents. Whether this was intentional or not is as of yet not known. It is likewise hard to determine the damage this has done to the project." #NT!
 sp_nuclear_bomb_information_leak_reward_tt: "Будет получен прогресс по проекту"
  
 # Nuclear Reactor 
 sp_nuclear_reactor_radioactive_leak_stabilized_reward: "Утечка радиации: всё под контролем"
 sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc: "Во время работы над реактором произошла серьезная внештатная ситуация, но благодаря уверенным действиям сотрудников ущерб удалось минимизировать. Кроме того, мы получили ценные научные данные."
 sp_nuclear_reactor_minor_explosion_reward: "Небольшой взрыв: обошлось без жертв"
 sp_nuclear_reactor_minor_explosion_reward_desc: "Во время работы над новейшим прототипом ядерного реактора произошел небольшой взрыв, частично повредивший лабораторию. Возникший пожар удалось быстро потушить. После восстановления лаборатории работы продолжатся по плану — задержка будет минимальной."
 sp_nuclear_reactor_tested_reward: "Первые успешные испытания ядерного реактора"
 sp_nuclear_reactor_tested_reward_desc: "Мы успешно испытали ядерный реактор, доказав на практике, что контролируемая ядерная реакция возможна. Этот прорыв положит начало новой эре в области производства энергии... и не только."
 sp_nuclear_reactor_tested_reward_public: "Открыто сообщить об этом успехе"
 nuclear_reactor_tested_reward_classify: "Пока что засекретить все сведения"
 sp_nuclear_reactor_tested_reward_public_tt: "Это может пойти на пользу другим странам"
 sp_nuclear_reactor_tested_tech_bonus: "Получена информация о ядерных испытаниях"
 sp_commercial_nuclear_reactor_concerns_reward: "Обеспокоенность вопросами ядерной безопасности"
 sp_commercial_nuclear_reactor_concerns_reward_desc: "[Character.GetName] выражает беспокойство по поводу отсутствия фильтров в градирнях наших новых реакторов. [Character.GetSheHeCap] настаивает на необходимости установки фильтров для предотвращения утечки радиации из реактора в случае чрезвычайной ситуации. Тем временем инженеры утверждают, что это значительно замедлит разработку проекта."
 sp_commercial_nuclear_reactor_concerns_reward_option_safety: "Добавить фильтры."
 sp_commercial_nuclear_reactor_concerns_reward_option_ignore: "Это полная чушь!"
  
  # Nuclear bombs 
 sp_nuclear_bomb_test_prototype_reward: "Прототип бомбы"
 sp_nuclear_bomb_test_prototype_reward_desc: "[Character.GetName] вместе с командой построили прототип бомбы. Успешное испытание этого устройства и оценка его результатов помогут сильно ускорить ход проекта. С другой стороны, бомба у нас уже есть..."
 sp_nuclear_bomb_test_prototype_reward_test_bomb: "Провести испытания в контролируемой среде."
 sp_nuclear_bomb_test_prototype_reward_keep_bomb: "Использовать бомбу против врагов."
 sp_nuclear_bomb_espionage_threats_reward: "Угроза шпионажа"
 sp_nuclear_bomb_espionage_threats_reward_desc: "Security officers argue that there is a need to increase security at the site of ¨[SpecialProject.GetName] project and all surrounding activities. The researchers, with [Character.GetName] in the lead, argue that freedom to move about and communicate is vital for the progress." #NT!
 sp_nuclear_bomb_espionage_threats_reward_no: "Не усиливать охрану"
 sp_nuclear_bomb_espionage_threats_reward_increase_security: "Усилить охрану"
 sp_nuclear_bomb_espionage_threats_reward_increase_security_tt: "Усиленная охрана снизит опасность утечки информации."
 sp_nuclear_bomb_breakthrough_plutonium_reward: "Прорыв в производстве плутония"
 sp_nuclear_bomb_breakthrough_plutonium_reward_desc: "Наши ученые добились серьезного прорыва в области технологий производства плутония, что ускорит темпы производства бомбы. Будем надеяться, что это сдвинет влево график разработки."
 sp_nuclear_bomb_accident_generic_reward: "Случайный пожар"
 sp_nuclear_bomb_accident_generic_reward_desc: "В одном из складов на объекте произошел пожар. Первоначальное расследование показало, что его причиной стала случайность. Но так ли это?"
 sp_nuclear_bomb_design_choice_reward: "Простая или сложная конструкция бомбы"
 sp_nuclear_bomb_design_choice_reward_desc: "Наши ученые разрабатывают два проекта создания атомного оружия, и между ними возникли споры о том, как производить детонацию ядерных боеприпасов. Первый вариант, который называют пушечным, гораздо проще реализовать, но он не так эффективно использует ядерное топливо. Другой вариант детонации — имплозивный. Он более сложный, но теоретически эффективность использования ядерного топлива у него выше."
 sp_nuclear_bomb_design_choice_reward_gun_type: "Пушечный вариант более простой в исполнении."
 sp_nuclear_bomb_design_choice_reward_implosion: "Имплозивный вариант технически совершеннее."
  
 # Thermonuclear Bombs 
 sp_thermonuclear_bomb_test_reward: "Предложение о проведении испытания"
 sp_thermonuclear_bomb_test_reward_desc: "Чтобы продолжить процесс создания термоядерной бомбы, наши ученые запросили возможность провести испытательный взрыв. Для инициирования цепной реакции нам придется предоставить им уже готовую атомную бомбу, но это значительно ускорило бы ход проекта."
 sp_thermonuclear_bomb_test_reward_option_yes: "Провести испытание."
 sp_thermonuclear_bomb_test_reward_option_no: "У нас нет лишних ресурсов."
