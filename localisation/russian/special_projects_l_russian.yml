 sp_nuclear_reactor: "Ядерный реактор"
 sp_nuclear_reactor_desc: "Эксперименты показали, что в результате расщепления атомного ядра высвобождается большое количество энергии. Это открытие пригодится в энергетике. Или при создании бомб..."
 sp_commercial_nuclear_reactor: "Коммерческий ядерный реактор"
 sp_commercial_nuclear_reactor_desc: "Ядерный реактор — лучшее устройство, способное производить сырье для бомб, но не только: огромные объемы вырабатываемой им энергии могут обеспечить мирное и военное производство."
 sp_nuclear_engines: "Ядерные двигатели"
 sp_nuclear_engines_desc: "Ядерная энергия поможет нам воплотить мечту о двигателе, который может работать вечно, не требуя дозаправки. Если верить конструкторам, ждать осталось совсем немного..."
 sp_nuclear_bomb: "Проект атомной бомбы"
 sp_nuclear_bomb_desc: "Бомба, поражающая врага энергией расщепляемых атомных ядер, — это оружие, способное уничтожить мир. Завладев им, мы станем непобедимы: никто не осмелится бросить нам вызов."
 sp_nuclear_bomb_tt: "Ядерные реакторы начинают производить §Yядерные бомбы§!."
 sp_thermo_nuclear_bomb: "Термоядерная бомба"
 sp_thermo_nuclear_bomb_desc: "Сложно представить что-то более смертоносное, чем ядерная бомба. Однако с помощью термоядерного синтеза можно еще больше увеличить мощность взрыва, побив все рекорды."
 sp_thermo_nuclear_bomb_tt: "Ядерные реакторы начинают производить §Yтермоядерные бомбы§!."
 sp_nuclear_warheads: "Ядерные боеголовки"
 sp_nuclear_warheads_desc: "By creating condensed nuclear weapons, we will be able to utilise them as a payload upon a wide range of rocket-based launch systems, allowing us to strike across vast distances." #NT!
  
