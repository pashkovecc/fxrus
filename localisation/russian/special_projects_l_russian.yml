 sp_land_super_heavy_railway_gun: "Сверхтяжелое железнодорожное орудие"
 sp_land_super_heavy_railway_gun_desc: "Исполинское орудие с невероятной мощью и точностью. Свидетельство военного превосходства любой страны, способной его применять."
 sp_land_stronghold_network: "Цепь укреплений"
 sp_land_stronghold_network_desc: "Обширная система из укрепленных бункеров и опорных пунктов, способная выдержать наступление противника и обеспечить безопасность стратегически важных районов."
 sp_land_flamethrower_tank: "Огнеметный танк"
 sp_land_flamethrower_tank_desc: "An armoured vehicle equipped with devastating close-range firepower, designed to unleash torrents of flames upon enemy positions." #NT!
 sp_land_military_engineering_vehicles: "Военные инженерные машины"
 sp_land_military_engineering_vehicles_desc: "Specialised vehicles to enhance battlefield mobility, fortification construction and obstacle clearance under combat conditions." #NT!
 sp_land_super_heavy_howitzer: "Сверхтяжелая гаубица"
 sp_land_super_heavy_howitzer_desc: "A formidable artillery piece boasting a large calibre, that can wreak havoc on enemy defences with unprecedented destructive force." #NT!
 sp_land_self_propelled_super_heavy_howitzer: "Самоходная сверхтяжелая гаубица"
 sp_land_self_propelled_super_heavy_howitzer_desc: "A self-propelled massive artillery piece with greater manoeuvrability on the battlefield than its towed counterpart, while accommodating an even larger calibre." #NT!
 sp_land_land_cruiser: "Сухопутный крейсер"
 sp_land_land_cruiser_desc: "A massive armoured behemoth designed to dominate the battlefield. With unparalleled size and firepower, this vehicle represents the pinnacle of armoured warfare." #NT!
 sp_air_radar: "Радар"
 sp_air_radar_desc: "Используя импульсные волны и фиксируя их отражения, мы сможем отслеживать передвижения противника на суше, в воздухе и на море."
 sp_air_centimetric_radar: "Сантиметровый радар"
 sp_air_centimetric_radar_desc: "Разработка радара сантиметрового диапазона позволит обнаруживать небольшие цели и использовать антенны гораздо меньшего размера."
 sp_land_large_caliber_kinetic_energy_sabot: "Large Calibre Kinetic Energy Sabot" #NT!
 sp_land_large_caliber_kinetic_energy_sabot_desc: "A larger calibre version of armour piercing artillery ammunition designed for penetrating fortifications." #NT!
 GER_sp_land_large_caliber_kinetic_energy_sabot: "Снаряд Рёхлинга"
  
 sp_land_reward_land_cruiser_overheating: "Перегрев во время испытаний"
 sp_land_reward_land_cruiser_chassis: "Перегрузка шасси"
 sp_land_reward_land_cruiser_chassis_desc: "В ходе испытаний проекта «[SpecialProject.GetName]» выяснилось, что его шасси не способно выдержать столь огромный вес и попросту ломается под давлением. Команда конструкторов рассматривает два возможных решения: усилить шасси, что еще больше увеличит вес машины, либо использовать более легкие материалы, что может снизить ее прочность."
 sp_land_reward_option_land_cruiser_chassis_redesign: "Полностью переработать шасси."
 sp_land_reward_option_land_cruiser_chassis_redesign_bonus_name: "Переработанное шасси"
 sp_land_reward_option_land_cruiser_chassis_reinforce: "Усилить шасси."
 sp_land_reward_option_land_cruiser_chassis_reinforce_bonus_name: "Усиленное шасси"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials: "Использовать более легкие материалы."
 sp_land_reward_option_land_cruiser_chassis_lighter_materials_bonus_name: "Облегченное шасси"
 sp_land_reward_land_cruiser_engine: "Недостаточно мощный двигатель"
 sp_land_reward_land_cruiser_engine_desc: "Ранние испытания проекта «[SpecialProject.GetName]» показали, что его массивный каркас создает слишком большую нагрузку на двигатель, делая машину медленной и неповоротливой. Инженеры предлагают два варианта: разработать более мощный двигатель или же попытаться увеличить мощность имеющегося, что может привести к его поломке."
 sp_land_reward_option_land_cruiser_engine_leave: "Оставить всё как есть."
 sp_land_reward_option_land_cruiser_engine_modify: "Переработать двигатель."
 sp_land_reward_option_land_cruiser_engine_modify_bonus_name: "Улучшенный двигатель"
 sp_land_reward_option_land_cruiser_engine_new: "Разработать новый двигатель."
 sp_land_reward_option_land_cruiser_engine_new_bonus_name: "Переработанный двигатель"
 sp_land_reward_land_cruiser_turret: "Сложный механизм башен"
 sp_land_reward_land_cruiser_turret_desc: "Громоздкая конструкция с несколькими башнями создает трудности при выравнивании и прицеливании, из-за чего мы вынуждены отложить установку вооружения. Конструкторы рекомендуют упростить компоновку башен для повышения надежности, однако это снизит огневую мощь проекта «[SpecialProject.GetName]»."
 sp_land_reward_option_land_cruiser_turret_original: "Оставить текущую конструкцию."
 sp_land_reward_option_land_cruiser_turret_simplify: "Упростить конструкцию башен."
 sp_land_reward_option_land_cruiser_turret_simplify_bonus_name: "Упрощенные башни"
 sp_land_reward_option_land_cruiser_turret_redesign: "Переработать конструкцию башен."
 sp_land_reward_option_land_cruiser_turret_redesign_bonus_name: "Переработанные башни"
 sp_land_reward_land_cruiser_track: "Перегрузка гусениц"
 sp_land_reward_land_cruiser_track_desc: "The weight of the [SpecialProject.GetName] has overwhelmed the track system, leading to constant breakdowns during testing. The options are to reinforce the tracks, which would require significant re-engineering, or reduce the vehicle's armour to lighten the load." #NT!
 sp_land_reward_option_land_cruiser_track_current: "Оставить текущие гусеницы."
 sp_land_reward_option_land_cruiser_track_reduce_armor: "Reduce Armour Plating" #NT!
 sp_land_reward_option_land_cruiser_track_reduce_armor_bonus_name: "Reduced Armour Plating" #NT!
 sp_land_reward_option_land_cruiser_track_reinforce_track: "Усилить гусеницы."
 sp_land_reward_option_land_cruiser_track_reinforce_track_bonus_name: "Усиленные гусеницы"
 sp_land_reward_land_cruiser_communication: "Проблема с системой связи"
 sp_land_reward_land_cruiser_communication_desc: "[SpecialProject.GetName] настолько огромен, что для координации работы экипажа требуется сложная внутренняя система связи. Текущая система не справляется с задачей: команды либо поступают с задержкой, либо просто теряются. Группа инженеров предлагает изменить внутреннюю компоновку танка, чтобы улучшить передачу сигналов, или же установить более продвинутую, но еще неиспытанную систему связи."
 sp_land_reward_option_land_cruiser_communication_current: "Оставить текущую систему."
 sp_land_reward_option_land_cruiser_communication_new: "Установить продвинутую систему."
 sp_land_reward_option_land_cruiser_communication_new_bonus_name: "Продвинутая система связи"
 sp_land_reward_option_land_cruiser_communication_redesign: "Переработать внутреннюю компоновку."
 sp_land_reward_option_land_cruiser_communication_redesign_bonus_name: "Переработанная система связи"
 sp_land_reward_land_cruiser_assembly: "Точная сборка"
 sp_land_reward_land_cruiser_assembly_desc: "На этапе сборки инженеры успешно применили метод точной центровки при установке крупных компонентов, таких как погон башни и обшивка корпуса, что позволило значительно снизить риск механических повреждений. Мы можем использовать этот инновационный метод в дальнейшей работе над проектом «[SpecialProject.GetName]», чтобы повысить общую надежность конструкции. Как его лучше применять?"
 sp_land_reward_option_land_cruiser_assembly_all: "На всех этапах сборки."
 sp_land_reward_option_land_cruiser_assembly_bonus_name: "Точная сборка"
 sp_land_reward_option_land_cruiser_assembly_key: "Только при установке ключевых компонентов."
 sp_land_reward_land_cruiser_suspension: "Гидропневматическая подвеска"
 sp_land_reward_land_cruiser_suspension_desc: "Инженеры завершили работу над передовой гидропневматической системой подвески для проекта «[SpecialProject.GetName]». Она способна выдерживать колоссальный вес машины, при этом обеспечивая ее устойчивость и снижая нагрузку на гусеницы даже при движении по пересеченной местности. [Character.GetName] считает, что эту систему уже можно внедрять в конструкцию танка, чтобы повысить его эффективность на поле боя."
 sp_land_reward_option_land_cruiser_suspension_full: "Полная гидропневматическая подвеска"
 sp_land_reward_option_land_cruiser_suspension_rear: "Использовать систему только в задней ходовой части"
 sp_land_reward_land_cruiser_ammunition: "Решение для хранения боеприпасов"
 sp_land_reward_land_cruiser_ammunition_desc: "During testing, concerns arose regarding safe storage and transport of the [SpecialProject.GetName]'s high-calibre ammunition, as the standard racks couldn't handle the explosive shell weight safely. A novel compartmentalised storage system, using reinforced bulkheads and hydraulic loaders, has been proposed, allowing for safer handling and faster shell loading under combat conditions." #NT!
 sp_land_reward_option_land_cruiser_ammunition_current: "Оставить текущую систему"
 sp_land_reward_option_land_cruiser_ammunition_simplified: "Использовать упрощенную систему"
 sp_land_reward_option_land_cruiser_ammunition_new: "Внедрить новую систему хранения"
  
 sp_land_reward_super_heavy_howitzer_focus_preference: "Приоритеты производства"
 sp_land_reward_super_heavy_howitzer_focus_preference_desc: "As development progresses, a critical decision must be made: We can prioritise fast production and smaller-calibre guns, or we can invest in bigger and heavier guns, sacrificing production efficiency for unparalleled firepower and devastating impact." #NT!
