 sp_rockets_generic_avionics_advancements_reward: "Развитие авионики"
 sp_rockets_generic_avionics_advancements_reward_desc: "Проводя научные исследования, мы совершили новые открытия в области авионики и аэродинамики. Они пойдут на пользу нашим авиастроителям."
 #sp_rockets_generic_avionics_advancements_reward_option: "This will certainly prove useful"
  
 sp_rockets_experimental_rockets_improved_accuracy_reward: "Улучшения точности"
 sp_rockets_experimental_rockets_stability_improvements_reward: "Улучшенная устойчивость полета ракеты"
  
  # Flying Bomb 
 sp_rocket_design_choice_reward: "Дальность или мощность?"
 sp_rocket_design_choice_reward_desc: "When designing our flying bomb, our engineers argue that it is important to decide what the main aim of the design of the bomb is. Do we want to maximise range, or is the payload the most important issue." #NT!
 sp_rocket_design_choice_reward_balanced: "Найти оптимальное сочетание параметров."
 sp_rocket_design_choice_reward_range: "Увеличить дальность."
 sp_rocket_design_choice_reward_payload: "Увеличить мощность."
  
 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward: "Технический прорыв при разработке пульсирующего ВРД"
 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_desc: "Наши инженеры смогли преодолеть серьезные трудности при разработке пульсирующего воздушно-реактивного двигателя, придающего ракете достаточную дальность и скорость полета."
 #sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_option: "Upward and Onward!"
  
 sp_rockets_flying_bomb_launch_ramp_innovations_reward: "Инновации в области пусковых установок"
 sp_rockets_flying_bomb_launch_ramp_innovations_reward_desc: "Our engineers have made significant improvements in the specialised launch ramps necessary for the deployment of the missiles." #NT!
 sp_rockets_flying_bomb_launch_ramp_innovations_reward_option: "Прекрасная новость"
  
 sp_rockets_flying_bomb_mass_production_scaling_reward: "Наращивание массового производства"
 sp_rockets_flying_bomb_mass_production_scaling_reward_desc: "Мы добились повышения производительности. Теперь наращивать массовое производство можно будет гораздо быстрее."
 #sp_rockets_flying_bomb_mass_production_scaling_reward_option: "Most beneficial"
  
 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward: "Engine Optimisation Breakthrough" #NT!
 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_desc: "Наши инженеры добились значительных улучшений конструкции реактивного двигателя для ракеты, сделав его надежнее и увеличив дальность полета."
 #sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_option: "Some call it luck"
  
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward: "Технологические инновации в области систем наведения"
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc: "Разработчики прототипов добились значительного повышения точности и надежности системы наведения, закрепив за собой техническое преимущество."
 #sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_option: "We are getting closer to achieving our goal"
  
 sp_rockets_flying_bomb_test_flight_failures_reward: "Неудачные испытательные полеты"
 sp_rockets_flying_bomb_test_flight_failures_reward_desc: "Early test flights have resulted in failures due to guidance system malfunctions and structural weaknesses. Our scientists have learnt a lot from it, but we need to take a step back and rethink." #NT!
 #sp_rockets_flying_bomb_test_flight_failures_reward_option: "They say you learn the most from your failures"
  
  # Ground to Air 
 sp_rockets_ground_control_improvements_reward: "Доработка управления с земли"
 sp_rockets_ground_control_improvements_reward_desc: "[Character.GetName] устраняет несколько серьезных проблем, связанных с отслеживанием ракеты и управлением с земли. Скоро поражать вражеские высоколетящие самолеты станет значительно проще."
  
 sp_rockets_vertical_launch_reward: "Система вертикального запуска"
 sp_rockets_vertical_launch_reward_desc: "Потерпев в ходе изысканий ряд неудач, [Character.GetName] наконец-то устраняет проблемы, связанные с вертикальным запуском ракет. Новая система обеспечит надежность запуска и быстрый набор высоты."
  
 sp_rockets_high_speed_flight_control_reward: "Система высокоскоростного управления"
 sp_rockets_high_speed_flight_control_reward_desc: "We have finally managed to get a working control system that can function at high speeds and react to changing flight dynamics. This knowledge can certainly be useful in other areas as well." #NT!
 sp_rockets_high_speed_flight_control_bonus: "Система высокоскоростного управления"
  
 sp_rockets_warhead_detonation_mechanisms_reward: "Механизмы подрыва боеголовки"
 sp_rockets_warhead_detonation_mechanisms_reward_desc: "An important part of the whole development is to get the weapon to explode at the right point. It appears that [Character.GetName] has managed to come up with a solution that allows us to detonate it at as favourable time as possible." #NT!
 sp_surface_air_missile_warhead_detonation_bonus: "Ракета «земля — воздух»: доработанный подрыв боеголовки"
  #Ballistic missile 
  
 sp_rocket_wind_tunnel_choice_reward: "Инженеры просят аэродинамическую трубу"
 sp_rocket_wind_tunnel_choice_reward_desc: "Инженеры, работающие над проектом баллистической ракеты, запросили строительство сверхзвуковой аэродинамической трубы для предварительного тестирования разрабатываемых ими прототипов. Это значительно ускорит разработку и в долгосрочной перспективе сэкономит ресурсы."
 sp_rocket_wind_tunnel_choice_reward_reject: "У нас сейчас нет на это ресурсов."
 sp_rocket_wind_tunnel_choice_reward_agree: "Выделить ресурсы."
  
 sp_rocket_glass_wool_choice_reward: "Образование льда при входе в атмосферу"
 sp_rocket_glass_wool_choice_reward_desc: "During the reentry phase of the rocket's flight, ice seems to be forming around the fuel tanks and interfering with the rocket's internals. Although a setback, our engineers have suggested adding glass wool around the tanks to prevent this from happening in future." #NT!
 sp_rocket_glass_wool_choice_reward_accept: "Досадно, но необходимо."
  
 sp_rocket_guidance_system_choice_reward: "Система наведения"
 sp_rocket_guidance_system_choice_reward_desc: "Our engineers are debating the guidance system for the rocket. Some wish to stick with a tested mechanical computer while others wish to utilise new radio technologies to control and monitor the rocket post launch." #NT!
 sp_rocket_guidance_system_choice_reward_mechanical: "Механический метод надежнее."
 sp_rocket_guidance_system_choice_reward_radio: "Будущее за радио!"
  
 sp_rocket_turbo_pump_froth_reward: "Проблема запенивания турбонасоса"
 sp_rocket_turbo_pump_froth_reward_desc: "Во время испытаний на большой высоте была выявлена ​​проблема с турбонасосом. Похоже, при больших нагрузках смазка внутри насосов начинает пениться, что снижает общую производительность и надежность текущей конструкции."
 sp_rocket_turbo_pump_froth_reward_accept: "Нужно разобраться с этой проблемой!"
  
 sp_rocket_relay_failure_reward: "Неисправное реле"
 sp_rocket_relay_failure_reward_desc: "При подготовке к испытательному запуску было обнаружено неисправное реле, используемое для внутренних систем управления ракеты. Инженеры считают, что подготовку нужно приостановить и заменить реле, но подобная задержка может иметь негативные политические последствия."
 sp_rocket_relay_failure_reward_accept: "Реле нужно заменить."
 sp_rocket_relay_failure_reward_reject: "Задержки недопустимы."
  
 sp_rocket_outercoating_reward: "Ржавчина на корпусе ракеты"
 sp_rocket_outercoating_reward_desc: "Есть опасения по поводу внешнего корпуса ракеты. При длительном хранении материалы часто подвергаются коррозии. Если не решить эту проблему, ракета может выйти из строя."
 sp_rocket_outercoating_reward_accept: "Возможно, стоит использовать смазку?"
  
 sp_rocket_launch_site_choice_reward: "Проблемы на стартовой площадке"
 sp_rocket_launch_site_choice_reward_desc: "The sheer scale of the new rocket is causing constraints at the intended launch site. The project managers are therefore requesting funding for a new purpose-built site to be constructed elsewhere." #NT!
 sp_rocket_launch_site_choice_reward_reject: "Найдите способ использовать текущую площадку."
 sp_rocket_launch_site_choice_reward_accept: "Нужно инвестировать в строительство новой площадки."
  
 SP_ROCKET_AND_SUBMARINE_SITE_REMINDER_PROJECT: "In order to effectively use $PROJECT|Y$ we need to construct a Rocket Site or have Submarines with missile strike capability." #NT!
 SP_ROCKET_SITE_REMINDER_PROJECT: "In order to effectively use $PROJECT|Y$ we need to construct a Rocket Site." #NT!
  
 ######################## 
   ## NAVAL PROJECTS ## 
 ######################## 
 sp_naval_cruiser_submarine: "Подводный крейсер"
 sp_naval_cruiser_submarine_desc: "Подводная лодка с увеличенной дальностью хода, разработанная специально для преодоления больших расстояний без дополнительного снабжения, — отличный охотник на корабли вражеского торгового флота."
 sp_naval_cruiser_submarine_free_design: "Подводный крейсер"
  
 sp_naval_nuclear_submarine: "Атомная подлодка"
 sp_naval_nuclear_submarine_desc: "We should be able to make nuclear engines small enough to fit in a specialised submarine, making the vessel silent and providing it with extreme range." #NT!
 sp_naval_nuclear_submarine_free_design: "Атомная подлодка"
  
 sp_naval_rocket_launching_submarine: "Ракетная подлодка"
 sp_naval_rocket_launching_submarine_desc: "By equipping our submarines with missiles and launch systems, we should be able to hit our enemies' strategic targets anywhere, and with no prior warning." #NT!
  
 sp_naval_torpedo_cruiser: "Торпедный крейсер"
 sp_naval_torpedo_cruiser_desc: "We can inflict significant damage on our enemies' most important and expensive ships, utilising Torpedo Cruisers, according to the last century's concept - Jeune École." #NT!
 sp_naval_torpedo_cruiser_free_design: "Торпедный крейсер"
  
 sp_naval_fleet_submarine: "Эскадренная подводная лодка"
 sp_naval_fleet_submarine_desc: "Подводная лодка большой дальности плавания, способная сопровождать флотилии и при этом лишенная конструктивных недостатков старых крейсерских подлодок."
 sp_naval_fleet_submarine_free_design: "Эскадренная подводная лодка"
  
 sp_naval_super_heavy_battleship: "Dreadnought" #NT!
 sp_naval_super_heavy_battleship_desc: "The Dreadnought Race may be a thing of the past for over a decade... yet, it is hard to deny the sheer majesty of the dreadnought, and its potential for unparalleled naval firepower." #NT!
 sp_naval_super_heavy_battleship_free_design: "$ship_hull_super_heavy_1$" #NT!
  
 sp_naval_nuclear_missile_submarine: "Подлодка с ядерными ракетами"
 sp_naval_nuclear_missile_submarine_desc: "Благодаря подводной лодке, способной всплыть, выпустить ракеты с ядерными зарядами и снова погрузиться, наша возможность наносить превентивные удары станет практически безграничной."
  
 sp_naval_modern_battleship: "Современный линкор"
 sp_naval_modern_battleship_desc: "Некоторые считают, что судьбу морских сражений будут решать авианосцы. Мы намерены убедить их в обратном."
 sp_naval_modern_battleship_free_design: "Современный линкор"
  
 sp_naval_midget_submarine: "Сверхмалая подводная лодка"
 sp_naval_midget_submarine_desc: "There exists a niche in our naval capabilities for a lightweight, cheap, and versatile submarine, that could be used for anything from harbour sabotage to convoy raiding." #NT!
 sp_naval_midget_submarine_free_design: "Сверхмалая подводная лодка"
  
 sp_naval_nuclear_torpedo: "Атомная торпеда"
 sp_naval_nuclear_torpedo_desc: "В наступающую эпоху царствования тактических боеголовок малой мощности хорошо себя проявят торпеды дальнего действия, оснащенные такими боеголовками. В теории вооружить ими можно будет любую обычную подлодку."
  
 sp_naval_modern_carrier: "Современный авианосец"
 sp_naval_modern_carrier_desc: "Благодаря последним достижениям кораблестроителей мы сможем построить авианосцы нового поколения, значительно более крупные и боеспособные."
 sp_naval_modern_carrier_free_design: "Современный авианосец"
  
 sp_naval_anechoic_tiles: "Звукопоглощающее покрытие"
 sp_naval_anechoic_tiles_desc: "This special rubber-tiled coating for submarines, which contains small empty spaces between them; reduces the threat of detection by enemy sonars." #NT!
 sp_naval_anechoic_tiles_non_mtg_tt: "Открывает значения в 6 и 7 для улучшения скрытности подводных лодок"
  
 sp_naval_aip_engine: "Воздухонезависимая силовая установка"
 sp_naval_aip_engine_desc: "Новая двигательная установка, способная устранить главную слабость подлодок — необходимость всплывать для подзарядки батарей и пополнения запасов воздуха."
 sp_naval_aip_engine_non_mtg_tt: "Открывает значения в 6 и 7 для улучшения двигателя подводных лодок"
  
 sp_naval_ice_carrier: "Пайкеритовый авианосец"
 sp_naval_ice_carrier_desc: "In order to assert our air superiority over the vast oceans, we need carriers that could store and launch long-range regular airplanes, and not just carrier aircraft." #NT!
 sp_naval_ice_carrier_free_design: "Пайкеритовый авианосец"
  
 sp_naval_underway_replenishment: "Пополнение на ходу"
 sp_naval_underway_replenishment_desc: "Supplying navies far from their home bases was always a limiting factor. With our fleets operating on extreme ranges, we need to develop new methods for resupply." #NT!
  
 sp_naval_proximity_fuze: "Дистанционный взрыватель"
 sp_naval_proximity_fuze_desc: "Благодаря развитию радиотехники мы можем разработать новые виды взрывателей, которые будут срабатывать, просто находясь в непосредственной близости от цели."
  
 sp_naval_support_ships: "Корабли поддержки"
 sp_naval_support_ships_desc: "Корабли поддержки помогут нам удерживать господство в море, обеспечивая наши корабли даже во время долгих переходов."
  
 sp_naval_escort_carrier: "Авианосец сопровождения"
 sp_naval_escort_carrier_desc: "Для защиты линий снабжения нам нужно разработать относительно небольшие авианосцы, которые будут с меньшими затратами обеспечивать прикрытие с неба и борьбу с подводными лодками."
 sp_naval_escort_carrier_free_design: "Авианосец сопровождения"
  
 sp_naval_submarine_carrier: "Подводный авианосец"
 sp_naval_submarine_carrier_desc: "We are looking to develop new kind of submarine, capable of storing and launching multiple planes, to carry out missions beyond aerial reconaissance." #NT!
 sp_naval_submarine_carrier_free_design: "Подводный авианосец"
  
 sp_naval_panzerschiff: "Panzerschiff" #NT!
 sp_naval_panzerschiff_desc: "A small capital ship filling the gap between the venerable battleship and more recent heavy cruiser designs. These are meant to be long-ranged and capable of independent action, especially surface raiding. They are popularly, but erroneously, known as Pocket Battleships because of their heavy armament despite their hull size." #NT!
 sp_naval_panzerschiff_free_design: "Panzerschiff" #NT!
  
 ################################# 
   ## NAVAL PROTOTYPE REWARDS ### 
 ################################# 
 sp_naval_cruiser_submarine_unique_reward_a: "Протокол рейдов"
 sp_naval_cruiser_submarine_unique_reward_a_desc: "While the large size of our new submarines presents an opportunity to dramatically increase deck armament capacity, we should also consider utilising the space to increase tactical range." #NT!
 sp_naval_cruiser_submarine_preference_a: "Дальность для нас важнее."
 sp_naval_cruiser_submarine_preference_b: "У наших подлодок должно быть лучшее вооружение"
  
 sp_naval_fleet_submarine_unique_reward_a: "Принципы проектирования"
 sp_naval_fleet_submarine_unique_reward_a_desc: "Нам стоит решить, на чем лучше сосредоточить усилия при разработке нового типа подводных лодок большой дальности. Мы можем сделать наши подлодки бесшумными и смертоносными хищниками или же обеспечить им повышенную прочность и надежность."
 sp_naval_fleet_submarine_preference_a: "Повысить боевую эффективность подлодок."
 sp_naval_fleet_submarine_preference_b: "Укрепить подлодки"
  
 sp_naval_nuclear_submarine_unique_reward_a: "Чрезмерная стоимость"
 sp_naval_nuclear_submarine_unique_reward_a_desc: "As we are working on a completely new type of submarine, there are growing concerns that the ship production costs will ultimately be too high. How should we proceed with the design?" #NT!
 sp_naval_nuclear_submarine_preference_a: "Упростить конструкцию"
 sp_naval_nuclear_submarine_preference_b: "Придерживаться плана"
 sp_naval_nuclear_submarine_preference_c: "Обеспечить наивысшее качество"
  
 sp_naval_rocket_launching_submarine_unique_reward_a: "Проблема с поражением целей"
 sp_naval_rocket_launching_submarine_unique_reward_a_desc: "Инженеры не могут решить один важный вопрос: как добиться того, чтобы наши ракеты, запущенные с подводных лодок, гарантированно достигали своих целей?"
 sp_naval_rocket_launching_submarine_preference_a: "Сосредоточиться на дальности"
 sp_naval_rocket_launching_submarine_preference_b: "Сосредоточиться на надежности"
 sp_naval_rocket_launching_submarine_preference_c: "Сосредоточиться на незаметности"
  
 sp_naval_nuclear_missile_submarine_unique_reward_a: "Уход от преследования"
 sp_naval_nuclear_missile_submarine_unique_reward_a_desc: "Если информация о нашем запланированном ядерном ударе дойдет до врагов, они моментально начнут искать наши подлодки с ядерным вооружением. Как лучше избежать обнаружения?"
 sp_naval_nuclear_missile_submarine_preference_a: "Нужно залечь на дно"
 sp_naval_nuclear_missile_submarine_preference_b: "Сохранять спокойствие и придерживаться плана"
 sp_naval_nuclear_missile_submarine_preference_c: "Нужно переждать"
  
 sp_naval_nuclear_torpedo_unique_reward_a: "Доработка торпед"
 sp_naval_nuclear_torpedo_unique_reward_a_desc: "Разработка ядерных торпед уже практически завершена, но мы еще можем внести некоторые изменения."
 sp_naval_nuclear_torpedo_preference_a: "Увеличить мощность боеголовок"
 sp_naval_nuclear_torpedo_preference_b: "Обеспечить безопасное хранение боеприпасов"
  
 sp_naval_midget_submarine_unique_reward_a: "Загрузить побольше"
 sp_naval_midget_submarine_unique_reward_a_desc: "We have realised that we can potentially specialise parts of our midget submarines, though that will have a few trade-offs." #NT!
 sp_naval_midget_submarine_preference_a: "Повысить незаметность"
 sp_naval_midget_submarine_preference_b: "Повысить надежность"
 sp_naval_midget_submarine_preference_c: "Повысить дальность"
  
 sp_naval_aip_engine_unique_reward_a: "Параллельные разработки"
 sp_naval_aip_engine_unique_reward_a_desc: "Our scientists working on this technology shared their findings with their colleagues working on improving more conventional engines. Don't hold your breath yet, as the resulting improvements likely won't be breathtaking." #NT!
 sp_naval_aip_engine_preference_a: "Повысить бесшумность двигателей"
 sp_naval_aip_engine_preference_b: "Повысить мощность двигателей"
 sp_naval_aip_engine_preference_c: "Снизить расход топлива двигателей"
  
 sp_naval_anechoic_tiles_unique_reward_a: "Новые наработки: строительство корпуса подлодки"
 sp_naval_anechoic_tiles_unique_reward_a_desc: "During the development of anechoic tiles, we realised that we can adapt our findings to conventional submarine construction in order to enhance our stealth capabilities, or save a bit on costs, while maintaining the current levels of visibility." #NT!
 sp_naval_anechoic_tiles_preference_a: "Приспособить корпуса к агрессивному патрулированию"
 sp_naval_anechoic_tiles_preference_b: "Повысить бесшумность"
 sp_naval_anechoic_tiles_preference_c: "Снизить стоимость корпусов"
  
 sp_naval_torpedo_cruiser_unique_reward_a: "Второй шанс: торпедный крейсер"
 sp_naval_torpedo_cruiser_unique_reward_a_desc: "Возрождение концепции торпедных крейсеров вынуждает нас пересмотреть их роль в нашем флоте. Мы можем попытаться извлечь максимальную пользу из их торпедного вооружения либо повысить их эффективность в бою с эсминцами."
 sp_naval_torpedo_cruiser_preference_a: "Усилить торпеды"
 sp_naval_torpedo_cruiser_preference_b: "Повысить эффективность против эсминцев"
  
 sp_naval_super_heavy_battleship_unique_reward_a: "Вопрос приоритета: боевой потенциал"
 sp_naval_super_heavy_battleship_unique_reward_a_desc: "Designing a new class of battleships allows us the opportunity to focus our efforts on improving our ability to dominate the naval battlefield. What should we prioritise?" #NT!
 sp_naval_super_heavy_battleship_preference_a_a: "Отдать приоритет тяжелым орудиям"
 sp_naval_super_heavy_battleship_preference_b_a: "Отдать приоритет скорости"
 sp_naval_super_heavy_battleship_preference_c_a: "Отдать приоритет легким орудиям"
 sp_naval_super_heavy_battleship_unique_reward_b: "Matter of Priorities - Defence" #NT!
 sp_naval_super_heavy_battleship_unique_reward_b_desc: "Our top naval commanders gave us an impossible task, to make this ship nigh invincible - and while we know it to be impossible, we can at least try to make it so. This time, what should be our priority?" #NT!
 sp_naval_super_heavy_battleship_preference_a_b: "Reinforced Armour and Hull" #NT!
 sp_naval_super_heavy_battleship_preference_b_b: "Усилить зенитные орудия"
 sp_naval_super_heavy_battleship_preference_c_b: "Повысить защиту от торпед"
  
 sp_naval_modern_battleship_unique_reward_a: "Современный линкор: надежда"
 sp_naval_modern_battleship_unique_reward_a_desc: "Говорят, что эпоха линкоров прошла, однако мы считаем, что они еще могут проявить себя в бою. Есть надежда, что этот корабль обеспечит нам превосходство на море. На чём нам лучше сосредоточить усилия, чтобы воплотить эту мечту в реальность?"
 sp_naval_modern_battleship_preference_a_a: "Повысить огневую мощь"
 sp_naval_modern_battleship_preference_b_a: "Manoeuvrability" #NT!
 sp_naval_modern_battleship_preference_c_a: "Повысить точность"
 sp_naval_modern_battleship_unique_reward_b: "Современный линкор: защита"
 sp_naval_modern_battleship_unique_reward_b_desc: "Чтобы сохранить свое влияние на море и доказать эффективность линкоров, нам предстоит повысить их способность противостоять вражеским ударам. Какие системы следует улучшить, чтобы наши корабли могли дать отпор любому противнику?"
 sp_naval_modern_battleship_preference_a_b: "Укрепить корпус"
 sp_naval_modern_battleship_preference_b_b: "Усилить зенитные орудия"
 sp_naval_modern_battleship_preference_c_b: "Повысить защиту от торпед"
  
 sp_naval_modern_carrier_unique_reward_a: "Современный авианосец: приоритеты"
 sp_naval_modern_carrier_unique_reward_a_desc: "В ходе разработки нового поколения авианосцев мы можем повысить их эффективность в конкретных ситуациях. Какие характеристики корабля для нас важнее?"
 sp_naval_modern_carrier_preference_a_a: "Улучшить способность к обнаружению противника"
 sp_naval_modern_carrier_preference_b_a: "Повысить скорость и устойчивость к погоде"
 sp_naval_modern_carrier_preference_c_a: "Сдерживание легких кораблей"
 sp_naval_modern_carrier_unique_reward_b: "Современный авианосец: безопасность"
 sp_naval_modern_carrier_unique_reward_b_desc: "Становится очевидно, что авианосцы незаменимы в морском бою, поэтому мы должны как следует защитить их от вражеских атак. На чём лучше сосредоточить усилия?"
 sp_naval_modern_carrier_preference_a_b: "Защита от вражеской артиллерии"
 sp_naval_modern_carrier_preference_b_b: "Защита от вражеской авиации"
 sp_naval_modern_carrier_preference_c_b: "Защита от вражеских торпед"
  
 sp_naval_ice_carrier_unique_reward_a: "Укрепление пайкеритового авианосца"
 sp_naval_ice_carrier_unique_reward_a_desc: "Мы потратили огромное количество времени на постройку этого гигантского авианосца и должны быть уверены, что он обладает лучшей защитой из возможных. Каков главный фактор опасности?"
 sp_naval_ice_carrier_preference_a: "Силы природы"
 sp_naval_ice_carrier_preference_b: "Войска противника"
  
 sp_naval_underway_replenishment_unique_reward_a: "Масштаб снабжения"
 sp_naval_underway_replenishment_unique_reward_a_desc: "Мы все еще работаем над улучшением системы снабжения, и надо принять еще одно решение: изменять наши первоначальные расчеты или нет?"
 sp_naval_underway_replenishment_preference_a: "Повысить дальность"
 sp_naval_underway_replenishment_preference_b: "Снизить использование конвоев"
 sp_naval_underway_replenishment_preference_c: "Найти баланс"
  
 sp_naval_proximity_fuzes_unique_reward_a: "Точность или эффективность"
 sp_naval_proximity_fuzes_unique_reward_a_desc: "Дистанционные взрыватели значительно сокращают количество снарядов, необходимое для поражения вражеского самолета. Мы готовимся применять их в своей подвижной зенитной артиллерии, что позволит снизить объемы снабжения боеприпасами при сохранении эффективности."
 sp_naval_proximity_fuzes_preference_a: "Изменить объемы снабжения боеприпасами"
 sp_naval_proximity_fuzes_preference_b: "Сохранить текущие объемы снабжения боеприпасами"
  
 sp_naval_support_ships_unique_reward_a: "Вспомогательные корабли: приоритет поддержки"
 sp_naval_support_ships_unique_reward_a_desc: "While the value of support ships is not in dispute, we need to decide what their operational focus shall be: focused replenishment of a small number of ships, or generalised topping-up of the whole fleet's stores." #NT!
 sp_naval_support_ships_preference_a_a: "Потребности немногих"
 sp_naval_support_ships_preference_b_a: "Найти баланс"
 sp_naval_support_ships_preference_c_a: "Потребности многих"
 sp_naval_support_ships_unique_reward_b: "Вспомогательные корабли: ремонтные работы"
 sp_naval_support_ships_unique_reward_b_desc: "The key question for our repair ship organisation: either a larger number of small repair crews, able to service a great number of ships slowly, or a smaller number of more lavishly equipped crews that can repair fewer ships more comprehensively." #NT!
 sp_naval_support_ships_preference_a_b: "Больший охват"
 sp_naval_support_ships_preference_b_b: "Найти баланс"
 sp_naval_support_ships_preference_c_b: "Приоритет в ремонте"
  
 sp_naval_submarine_carrier_unique_reward_a: "Улучшение подводных авианосцев"
 sp_naval_submarine_carrier_unique_reward_a_desc: "Our submarine carriers push the limits of naval engineering, and cannot be equally strong in every area. Shall we prioritise range, hull strength, or stealth?" #NT!
 sp_naval_submarine_carrier_preference_a: "Увеличенная дальность"
 sp_naval_submarine_carrier_preference_b: "Укрепленная конструкция"
 sp_naval_submarine_carrier_preference_c: "Сниженная заметность"
  
 sp_naval_escort_carrier_unique_reward_a: "Проекты кораблей сопровождения"
 sp_naval_escort_carrier_unique_reward_a_desc: "Авианосцу сопровождения необходимо вместить массу возможностей в довольно небольшой корпус. Чему стоит отдавать приоритет: дальности действия, прочности корпуса или скорости?"
 sp_naval_escort_carrier_preference_a_a: "Дальность действия"
 sp_naval_escort_carrier_preference_b_a: "Более прочный корпус"
 sp_naval_escort_carrier_preference_c_a: "Повышенная скорость"
 sp_naval_escort_carrier_unique_reward_b: "Приоритет обнаружения"
 sp_naval_escort_carrier_unique_reward_b_desc: "An escort carrier's air group is necessarily limited in size. Shall they specialise in antisubmarine warfare, or spotting surface targets, or adopt a generalised, multi-role approach?" #NT!
 sp_naval_escort_carrier_preference_a_b: "Подводные лодки"
 sp_naval_escort_carrier_preference_b_b: "Без предпочтений"
 sp_naval_escort_carrier_preference_c_b: "Надводные корабли"
  
 sp_naval_panzerschiff_unique_reward_a: "Panzerschiff Philosophy" #NT!
 sp_naval_panzerschiff_unique_reward_a_desc: "Due to limited size and resources, we must decide what our Panzerschiff designs should focus on. Focusing on Speed will allow the ship to outrun heavier warships and pursue lighter ones, much akin to a larger cruiser or a smaller battlecruiser. Focusing on Light Attack will create a strong \"cruiser-killer\" design able to destroy enemy raiders and deter destroyers. Lastly, Heavy Attack will deter enemy capital ships, forcing them to withdraw or commit to a costly attack." #NT!
 sp_naval_panzerschiff_preference_a: "Speed will ensure greater flexibility." #NT!
 sp_naval_panzerschiff_preference_b: "Light Attack to destroy smaller vessels." #NT!
 sp_naval_panzerschiff_preference_c: "Heavy Attack; give it battleship guns!" #NT!
  
