l_russian:
  
 white.1.t: "Граждане государства [Root.GetName] требуют мира!"
 white.1.d: "Граждане государства [Root.GetName] выходят на улицы в знак протеста против неспособности нашей армии защитить родину. Они требуют, чтобы [Root.GetLeader] надавил на правящую партию ([Root.GetRulingParty]) с целью начать мирные переговоры и прекратить бессмысленное кровопролитие, пока оно не охватило всю нашу страну."
 white.1.a: "Страна [Root.GetName] должна начать мирные переговоры"
 white.1.b: "[Root.GetAdjective]ие будут сражаться до самого конца"
 white.2.t: "[From.GetName] просит о мире"
 white.2.d: "[Root.GetAdjective]ие войска нанесли решительное поражение [From.GetAdjective]ой армии в нескольких ключевых сражениях, и теперь мы полностью контролируем спорные регионы между нашими двумя странами. Вследствие этих неудач правительство в г. [From.Capital.GetName] запросило мир, пойдя на ряд уступок, чтобы умилостивить нас. [From.GetName] предлагает щедрые условия, и нам не стоит рисковать, слишком сильно распыляя наши войска в попытке получить большее. Они на данный момент выиграли уже достаточно."
 white.2.a: "Мы принимаем условия, которые предлагает [From.GetName]"
 white.2.b: "[Root.GetName] примет только безоговорочную капитуляцию"
 white.3.t: "[From.GetName] отказывается от мира"
 white.3.d: "Несмотря на наше щедрое предложение, ненасытные [From.GetAdjective]ие отказываются идти на мир. Этот конфликт перерос в тотальную войну за само выживание государства [Root.GetName]. Мы должны пойти на любые жертвы, чтобы спасти нашу нацию и [Root.GetAdjective]ий народ от варварского государства [From.GetName]."
 white.3.a: "К оружию!"
