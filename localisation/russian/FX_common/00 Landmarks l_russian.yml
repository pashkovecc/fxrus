l_russian:
 landmark_white_house: "Белый дом"
 landmark_white_house_plural: "$landmark_white_house$"
 landmark_white_house_desc: "§LБелый дом является резиденцией американского президента. Расположенный в округе Колумбия, Белый дом стал символом республики с момента завершения его строительства в 1800 году.§!"
 
 landmark_winter_palace: "Зимний дворец"
 landmark_winter_palace_plural: "$landmark_winter_palace$"
 landmark_winter_palace_desc: "§LЗимний дворец — великолепный дворец в стиле рококо, служивший официальной резиденцией дома Романовых до 1917 года. Находясь в самом сердце Петрограда, он стал свидетелем многих ключевых событий русских революций. В одной части дворца располагается музей «Эрмитаж», в то время как остальная представляет собой обширный административный комплекс. Зимний дворец остаётся предметом гордости для всей России.§!"
