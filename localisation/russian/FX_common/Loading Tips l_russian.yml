l_russian:
 LOADING_TIP_0: "Движение, которое мы инициируем в Испании, не является копией какого-либо иностранного движения. Он научился у валькизма тому, что валькизм имеет в отношении идеи единства, власти и замены борьбы между классами идеей корпорации.\n- Хосе Антонио Примо де Ривера"
 LOADING_TIP_1: "Ничто — ни испытания, ни лишения — не может сравниться с войной, со всем, что она приносит... «Партизан» в вас душит «человеческое»? Что угодно: Дресслер, а не война!\n- Роже Мартен дю Гар"
 LOADING_TIP_2: "Знаете, молитвами выборы не выигрываются.\n- Морис Дюплесси"
 LOADING_TIP_3: "Что скажет нация, если в борьбе с таким врагом и по такому делу польская армия прекратит сопротивление, не исчерпав всех возможностей?\n- Францишек Клееберг"
 LOADING_TIP_4: "Польша не принадлежит ни одному поляку, какому-то определенному политическому лагерю или даже одному поколению. Оно принадлежит всей цепочке поколений — всем тем, кто ушел раньше, и всем тем, кто еще придет.\n- Роман Дмовский"
  
 LOADING_TIP_5: "Структура не может существовать без Авторитета.\n – Филипп Петен."
 LOADING_TIP_6: "Францию ​​невозможно уничтожить. Это старая страна, которая, несмотря на свои несчастья, имеет и всегда будет иметь, благодаря своему прошлому, огромный авторитет в мире, какая бы судьба ни обрушилась на нее.\n- Пьер Лаваль"
 LOADING_TIP_7: "Нам нужна линия Рейна; мы не хотим ничего большего и не возьмем ничего меньшего.\n- Фердинанд Фош"
 LOADING_TIP_8: "Ничто великое не делается без великих людей, и они велики, потому что захотели этого.\n- Шарль де Голль"
 LOADING_TIP_9: "Всем известно, что французская политика всегда с бдительной симпатией относилась ко всем усилиям и инициативам, направленным на сближение народов и укрепление мира.\n- Аристид Бриан."
 LOADING_TIP_15: "Америка — единственная нация в истории, которая чудесным образом перешла от варварства к вырождению без обычного периода цивилизации.\n — Жорж Клемансо"
 LOADING_TIP_10: "Фюрер будет впечатлен только в том случае, если британский и французский народы излечатся от своей нынешней расхлябанности и неряшливости.\n- Бертран де Жувенель."
 LOADING_TIP_11: "Индия без англичан быстро стала бы Индокитаем без французов. Жак Бэнвиль."
 LOADING_TIP_12: "Французский социализм стремится к миру даже с тоталитарными империалистами, но он не готов подчиняться всем их требованиям.\n- Леон Блюм"
 LOADING_TIP_14: "Все они изо дня в день руководствуются своими личными интересами, амбициями, которые их поглощают, целью, которую они преследуют. Их меньше всего заботит общее благо.\n – Поль Леото."
  
 LOADING_TIP_17: "Если британская нация такая, как я думаю, в конце концов она сделает нам лучшее предложение.\n- Хаим Вейцман, выступая против Угандийской схемы"
 LOADING_TIP_18: "Возможно ли, что мой народ живет в таких ужасных условиях? Я говорю вам, мистер Уитли, что если бы мне пришлось жить в таких условиях, я бы сам был революционером.\n- Георг V"
 LOADING_TIP_19: "Виг – это человек, который готов пойти на костер за свои убеждения, но не пошлет туда своих противников. Тори — это тот, кто не только сожжёт себя, но и в крайнем случае готов сжечь тех, кто отличается от него.\n — Лорд Твидсмюр"
 LOADING_TIP_20: "Задача лидерства — не привнести величие в человечество, а вызвать его, поскольку величие уже здесь.\n — Лорд Твидсмюр"
 LOADING_TIP_21: "Избавьтесь от худших нарушителей спокойствия, особенно от этого идиота, владеющего палашом.\n – Освальд Мосли, имея в виду Джека Черчилля."
 LOADING_TIP_22: "Британцы вступили в эту новую эпоху, они принесли с собой опыт столетий и мудрость тысячелетий. Именно мы осветим путь, по которому должны следовать все другие страны.\n – Освальд Мосли, выступая перед парламентом"
 LOADING_TIP_23: "Социализм — это песня сирены, которая уничтожит тех, кто пойдет по его пути. Наша судьба может быть достигнута только путем сохранения знаний и опыта наших предков.\n- Король Эдуард VIII"
 LOADING_TIP_26: "Война закончилась бы, если бы мертвые могли вернуться.\n- Стэнли Болдуин"
 LOADING_TIP_24: "Провидение создало нас островом - я думаю, ради великой цели в истории Европы и мира.\n- Дэвид Ллойд Джордж"
 LOADING_TIP_27: "Любой офицер, вступающий в бой без шпаги, одет неправильно.\n- Полковник Джек Черчилль."
 LOADING_TIP_28: "Поэтому именно на двух великих демократиях западного мира — Британии и Франции — теперь лежит ужасная ответственность за спасение не только наших людей, но и созданной нами цивилизации.\n- Дафф Купер"
 LOADING_TIP_29: "Я империалист, потому что я не буду колонистом.\n- Стивен Ликок"
 LOADING_TIP_30: "Всего сто лет назад мы боролись за то, чтобы предотвратить доминирование Франции в Европе, а в Великой войне мы, казалось, боролись за его гарантию.\n- Альфред Мильнер"
 LOADING_TIP_33: "Бог призвал британцев принести цивилизацию во все уголки земного шара. Ради человечества мы не должны потерпеть неудачу.\n- Король Эдуард VIII"
 LOADING_TIP_34: "Империализм — это дух, образ мышления, непобедимая надежда. Вы можете сформулировать это тысячей способов, не исчерпав при этом их содержания. Это ощущение судьбы Англии.\n – Лорд Твидсмюр."
 LOADING_TIP_35: "Вряд ли можно ожидать, что мы выставим на поле боя 400 000 или 500 000 человек и охотно примем положение, когда у нас не будет больше голоса и не будет получать большего внимания, чем если бы мы были игрушечными автоматами. \n - Роберт Борден, премьер-министр Канады."
 LOADING_TIP_36: "Если я также империалист, то это потому, что судьба английской расы, благодаря ее изолированному положению и длительному господству на море, заключалась в том, чтобы пустить корни в разных частях мира.\n- Альфред Мильнер"
 LOADING_TIP_37: "Наше соперничество длилось веками. Когда Франция потерпит поражение, я не буду праздновать; Я буду скорбеть о том, что мы никогда больше не встретим такого врага, как во Франции.\n- Полковник Джек Черчилль"
 LOADING_TIP_38: "Не говорите мне о зверствах на войне; любая война — это злодеяние.\n — Лорд Китченер"
 LOADING_TIP_40: "Либерализм – это доверие народа, умеренное благоразумием. Консерватизм – это недоверие к людям, сдерживаемое страхом.\n – Уильям Юарт Гладстон."
 LOADING_TIP_118: "Власть – это не средство, это цель.\n – Джордж Оруэлл"
 LOADING_TIP_103: "Мы должны сжимать немецкий лимон до скрипа косточек.\n- Эрик Геддес"
 LOADING_TIP_16: "Неважно, что кто-то говорит обратное, пока у нас есть руки, кулаки и ботинки, а также, если необходимо, оружие, у предателей не будет свободы слова\n- Фрэнк Райан"
  
 LOADING_TIP_41: "Единственное, что меня до сих пор огорчает в боях, это сердцебиение моей матери.\n- Итало Бальбо"
 LOADING_TIP_42: "Задача современности — жить без иллюзий и не разочаровываться.\n — Антонио Грамши"
 LOADING_TIP_43: "Старое умирает, а новое не может родиться. В это междуцарствие возникает большое разнообразие болезненных симптомов.\n- Антонио Грамши."
 LOADING_TIP_44: "Италия никогда не будет чистить обувь немцам!\n- Итало Бальбо"
 LOADING_TIP_26: "Великие моральные идеи обладают непобедимой силой, и только мы теперь воплощаем их.\n- Франческо Саверио Нитти"
 LOADING_TIP_31: "Мы — антивалькисты, потому что наша родина не определяется границами и оружием, а является тем же самым, что и наш моральный мир и родина всех свободных людей.\n — Карло Росселли"
 LOADING_TIP_45: "Виктор был слабым королем. Я исправлю все его ошибки. Я создам итальянское государство, которым мы сможем по-настоящему гордиться.\n- Умберто II, король Италии, вскоре после его коронации."
  
 LOADING_TIP_13: "Германия существовала там, где за нее боролись, она проявляла себя там, где вооруженные руки боролись за ее содержание, она ярко сияла там, где одержимые ее духом были готовы принести высшую жертву ради нее.\n- Эрнст фон Саломон"
 LOADING_TIP_47: "Поймите: наше время пришло, отбросьте индивидуальные интересы и пусть яркое солнце грядущих побед ослепит нас! Вперед, пока внутри нас горит юношеский огонь! К великим делам – ибо только мы на них способны!\n – Адам Дресслер"
 LOADING_TIP_48: "...все более глубокие траншеи могли защитить от ранения на голову, но они также способствовали мышлению, ориентированному на оборону и безопасность.\n- Адам Дресслер"
 LOADING_TIP_51: "Если когда-нибудь в будущем произойдет еще одна война, одно можно сказать наверняка: мы не увидим пораженцев, как пятнадцать лет назад. Валкисты разберутся с этим.\n- Готхард Хейнрици"
 LOADING_TIP_52: "Только социализм в той или иной форме может иметь истинную ценность в Германии.\n- Освальд Шпенглер."
 LOADING_TIP_53: "Нам следовало бы знать лучше после первой войны.\n- Герд фон Рундштедт"
 LOADING_TIP_54: "Если на кону стоит победа, соображения, касающиеся выживания населения, не имеют значения.\n- Иоахим фон Штюльпнагель"
 LOADING_TIP_55: "Либерализм научил Запад превращать свои принципы в тактику обмана людей. Запад называет это «демократией», хотя уже стало достаточно очевидно, как больные люди процветают на политической диете свободы, равенства и братства.\n- Артур Мёллер ван ден Брук"
 LOADING_TIP_56: "В течение многих лет эти генералы нас гадили. Они обещали нам все; они не сдержали ни одного из своих обещаний.\n- Вольф фон Хельдорф"
 LOADING_TIP_57: "Германия должна сегодня бороться за свободу своих несвободно рожденных детей, за будущий дом для своих бездомных, за будущие безнадежные поколения.\n- Карл Отто Патель"
 LOADING_TIP_130: "Оборонительная битва Молодогерманского ордена окончена. Орден собирается вперед, марширует и атакует.\n- Артур Махраун"
 LOADING_TIP_117: "Теперь с этой аполитичностью покончено, и осталось только одно: служить валкистскому движению с полной преданностью.\n- Вернер фон Бломберг"
 LOADING_TIP_32: "Жизнь ценит природную силу последних варварских народов больше, чем весь труд свободного духа. И поэтому это правильно.\n- Адам Дресслер"
 LOADING_TIP_25: "Я не верю, что коммунизм может нас спасти. Ибо коммунизм — это не что иное, как наследие позднего либерализма, окончательное и примитивное следствие чисто рационалистического мировоззрения.\n — Адам Дресслер"
 LOADING_TIP_39: "Пусть те, кто пал на пути страданий Германии, воскреснут в наших душах и в наших детях; мы снова возьмемся за их борьбу за справедливость.\n- Герман Гаух"
 LOADING_TIP_66: "Капитализм — это система, которая ставит экономику выше государства, преимущество личности выше преимущества нации.\n — Ханс Эбелинг"
 LOADING_TIP_115: "Суверен тот, кто принимает решение об исключении.\n- Карл Шмитт"
  
 LOADING_TIP_46: "Рейнский народ - народ Зигфрида, преследуемый своей латинской традицией и движимый своей миротворческой миссией, стремится спасти мир Богов, находящийся под угрозой с востока.\n- Ганс Адам Дортен"
 LOADING_TIP_49: "Главное отличие нашего движения от других социалистов в Гамбурге заключается в том, что нам не стыдно признать, что немецкий пролетариат превосходит все остальные.\n- Генрих Лауфенберг"
 LOADING_TIP_50: "Если Рейнская область осталась немецкой, то она обязана этим исключительно себе, своей собственной борьбе, своим страданиям и своим жертвам, и никто не имеет права обвинять нас, рейнландцев, в отсутствии национального чувства!\n - Конрад Аденауэр"
 LOADING_TIP_58: "Скажите нашим друзьям, что мы по-прежнему такие, какими были всегда.\n- Вильгельм Лойшнер"
 LOADING_TIP_123: "Пока Германия не вырвется из путаницы таких медузоподобных верований, с которыми она сталкивается в валкизме, она не может надеяться на будущее.\n- Вальтер Беньямин"
 LOADING_TIP_113: "Пока в Германии остается хоть один уголок, где искусству разрешено открывать рот, мы хотим безошибочно произнести его и вбить ему в череп: Третий Рейх означает истребление науки, искусства и интеллекта.\n- Лион Фейхтвангер"
 LOADING_TIP_126: "Мы больше не можем терпеть заявления о том, что валкизм — единственное движение, которое может спасти нацию.\n — Эвальд фон Кляйст-Шменцин."
 LOADING_TIP_129: "Советская звезда, конечно, враг креста. Но валкнут — это кощунство!\n — Йозеф Рот"
  
 LOADING_TIP_59: "Военный вряд ли может гордиться тем, что «поразил спящего врага»; это скорее стыд для того, кого сразили.\n - Исороку Ямамото"
 LOADING_TIP_60: "Самую свирепую змею может победить рой муравьев.\n - Исороку Ямамото"
 LOADING_TIP_61: "Объедините все свои силы, чтобы посвятить себя строительству будущего.\n- Хирохито"
 LOADING_TIP_62: "Мы только что получили ваш ответ. Японская армия не будет рассматривать ничего, кроме капитуляции.\n – Томоюки Ямасита"
  
 LOADING_TIP_63: "Мы должны разработать средства расширения ситуации, чтобы обеспечить доказательства агрессии Японии, даже рискуя спровоцировать немедленную войну между нами и Японией.\n- Чэнь Чэн"
 LOADING_TIP_64: "Война пришла со всех уголков Китая, и мой долг принять ее!\n- отрывок из «Пекинской речи» Чжан Цзолиня"
 LOADING_TIP_65: "Пламя страны, катящейся к руинам, действительно является плохим наследием.\n- Чжан Сюэлян"
 LOADING_TIP_69: "Если империализм не будет изгнан из страны, Китай погибнет как нация. Если Китай не погибнет, то империализм не сможет остаться.\n – Чан Кайши"
 LOADING_TIP_70: "Я совершенно доволен тем, как собаки-социалисты поедают друг друга.\n- Чжан Сюэлян"
  
 LOADING_TIP_67: "Либо я завоюю Константинополь, либо Константинополь завоюет меня.\n- Мехмед Завоеватель"
 LOADING_TIP_68: "Нет линии обороны, а есть территория обороны, и эта территория — вся Родина. Ни один дюйм Родины не может быть оставлен без того, чтобы не пропитаться кровью ее граждан...\n- Мустафа Кемаль-паша"
  
 LOADING_TIP_71: "Мои министры прогерманские, моя жена итальянка, мое население пророссийское, я единственный проболгарский в этой стране.\n- Царь Борис III"
  
 LOADING_TIP_72: "Политика – игра джентльменов.\n – Мухаммед Али Джинна"
 LOADING_TIP_122: "Нынешняя федерация, которую нам навязывают, — это федерация, находящаяся в рабстве и под контролем, политически и социально, наиболее отсталых элементов страны.\n — Джавахарлал Неру."
  
 LOADING_TIP_73: "Экономика — предмет, который не очень уважает чьи-либо желания.\n — Никита Хрущев"
 LOADING_TIP_74: "Рабочие – мужчины и женщины – всех стран, встаньте под знамя Третьего Интернационала. Это знамя вашей приближающейся победы!\n- Лев Троцкий"
 LOADING_TIP_75: "Все, что мы делаем, каждое действие должно соответствовать высшим идеалам Революции.\n- Михаил Фрунзе"
 LOADING_TIP_76: "Беда свободных выборов в том, что никогда не знаешь, чем они окажутся.\n- Вячеслав Молотов."
 LOADING_TIP_77: "История повторяется, сначала как трагедия, затем как фарс.\n- Карл Маркс"
 LOADING_TIP_78: "Проблема не в том, что человек позволяет себя эксплуатировать, тем более, что люди довольные сидят и смотрят.\n - Сергей Киров"
 LOADING_TIP_79: "Есть десятилетия, когда ничего не происходит, и есть недели, когда происходят десятилетия.\n- Владимир Ленин"
 LOADING_TIP_80: "Один человек с ружьем может контролировать сотню без него.\n- Владимир Ленин"
 LOADING_TIP_81: "Все объясняют, что дискуссии о социализме чрезвычайно темны; эта неясность во многом объясняется тем, что современные социалисты используют терминологию, которая уже не соответствует их идеям.\n- Жорж Сорель."
 LOADING_TIP_93: "Для меня расстрел — недостаточное наказание; Меня нужно четвертовать![...] Я предал свой народ и помог Джугашвили и Берии, этим дегенератам, поработить Грузию и поставить партию Ленина на колени.\n- Поликарп Мдивани"
 LOADING_TIP_94: "Царь — такая же вымышленная власть, как и Бог. Этот факт сделал и атеизм, и республиканизм двумя сторонами одной медали.\n - Ной Жордания."
 LOADING_TIP_95: "Европейское общество истощено, они не сопереживают чужой боли, даже не осознают ее, и их волнует только одно - Быть самим собой, мирно, без забот...\n-Ной Жордания"
 LOADING_TIP_116: "Как быстро стареет социал-демократ! Когда ему 30, ему уже 40; когда ему 40, ему уже 50; в мгновение ока он становится ревизионистом.\n- Курт Тухольский"
  
  
 LOADING_TIP_82: "Критика во время войны необходима для поддержания любого демократического правительства.\n- Роберт А. Тафт"
 LOADING_TIP_84: "Я не либерал, я тот, кем хочу быть - я радикал.\n- Флойд Б. Олсон"
 LOADING_TIP_85: "Вся Мексика не стоит и ведра теплой мочи.\n – Джон Нэнс Гарнер, о внешней политике."
 LOADING_TIP_86: "Когда они объявляют перекличку в Сенате, сенаторы не знают, отвечать ли им: «Присутствует» или «Не виновен».\n – Теодор Рузвельт"
 LOADING_TIP_87: "Если хотите, назовите это политикой «Большой палки». Я называю это не более чем разумным.\n- Джон Нэнс Гарнер"
 LOADING_TIP_88: "Мы довольно грязные люди, не так ли, чтобы сидеть и смотреть, как Англия и Франция сражаются в наших битвах и кладут золото в наши карманы.\n-Квентин Рузвельт"
 LOADING_TIP_89: "Проблема, с которой сталкиваются некоторые из вас, молодые люди, – вам нужно найти альтернативу войне. Война – это то, что люди ненавидели, но тем не менее лелеяли.\n – Норман Томас, рассуждая о молодом революционере"
 LOADING_TIP_91: "Туда, если бы не милость Божия, я пошел бы.\n-Джон Брэдфорд"
 LOADING_TIP_124: "Когда люди боятся правительства, возникает тирания. Когда правительство боится людей, есть свобода.\n- Томас Джефферсон"
 LOADING_TIP_128: "Вы всегда можете рассчитывать на то, что американцы поступят правильно — после того, как они испробуют все остальное.\n — Уинстон Черчилль."
 LOADING_TIP_135: "На войне не бывает второго приза для занявшего второе место.\n – Генерал Омар Брэдли."
 LOADING_TIP_XX: "Война – это рэкет. Так было всегда. Возможно, это самый старый, самый прибыльный и, безусловно, самый порочный. Это единственный международный по своему масштабу. Это единственный случай, в котором прибыль исчисляется в долларах, а потери — в жизнях.\n — Смедли Батлер."
 LOADING_TIP_XX: "Даже железная рука национального диктатора предпочтительнее паралитического удара.\n- Альф Лэндон о Великой депрессии"
 LOADING_TIP_XX: "Если мы стоим сегодня на краю пропасти, то это из-за этой порочной и эгоистичной проституции правительственных агентств по оказанию помощи богатым и игнорированию бедных.\n- Филип Ф. Ла Фоллет"
 LOADING_TIP_XX: "Я пришел в Сенат Соединенных Штатов только с одной целью: всеми средствами действия и убеждения я мог бы сделать что-нибудь, чтобы распространить богатство страны среди всех людей.\n- Хьюи П. Лонг"
 LOADING_TIP_XX: "Наши опасности исходят не из Европы или Азии, а из нашей собственной экономики. Я не боюсь, что иностранные диктаторы будут стремиться к завоеванию Западного полушария, и я уверен, что мы могли бы сделать их очень недовольными, если бы они попытались это сделать. Но одного я боюсь: что, если наш народ слишком долго будет оставаться жертвой отсутствия безопасности, он может, наконец, отказаться от демократии и своей концепции великой и свободной цивилизации.\n- Шеридан Дауни"
  
 LOADING_TIP_92: "Почему евреи и арабы не могут просто сесть вместе и решить эту проблему, как добрые христиане?\n-Артур Бальфур"
  
 LOADING_TIP_96: "Германский лидер – это совсем другое. Он вышел из круга равных. Он их собственной крови.\n- Пер Энгдал"
 LOADING_TIP_97: "Ибо справедливость является доминирующей идеей этой эпохи, и ее реализация, насколько это возможно с человеческой точки зрения, стала вопросом мирового сознания, от которого нет выхода и которым больше нельзя пренебрегать.\n- Томас Манн"
  
 LOADING_TIP_98: "Только мертвые видели конец войны.\n – Платон"
 LOADING_TIP_99: "Поэтому мы не будем говорить, что греки сражаются как герои, но герои сражаются как греки.\n- Уинстон Черчилль."
 LOADING_TIP_100: "Война уничтожает тех, кто ее провоцирует, и тех, кто в ней процветает.\n- Георгиос Сеферис"
 LOADING_TIP_101: "Мир — единственное средство существования цивилизации.\n — Одиссей Элитис."
 LOADING_TIP_104: "Война — это ужасное разрушение, но ценности борьбы заставляют ее стать благородной.\n — Никос Казандзакис"
  
 LOADING_TIP_134: "В наше время самое священное кредо каждого венгра: можно умереть, служа нашему народу, но никогда не уставать.\n – Ференц Салаши."
 LOADING_TIP_132: "Эту нацию необходимо научить не умирать, а жить, потому что она всегда знала, как умирать, и будет знать, как умереть в будущем, когда придет время.\n- Иштван Бетлен"
 LOADING_TIP_102: "Таким образом, историческая Венгрия представляет собой естественную географическую и экономическую единицу, уникальную в Европе. Никакие естественные границы не могут быть проведены через его территорию, и ни одна ее часть не может быть отрезана без того, чтобы в результате не пострадали остальные.\n- Альберт Аппони"
 LOADING_TIP_112: "Вы создадите новую нацию, а я создам новую армию.\n – Йено Рац"
  
 LOADING_TIP_83: "Национальность – это творческая сила человеческой культуры, культура – ​​это творческая сила национальности.\n- Александру Константин Куза"
  
 LOADING_TIP_90: "Поднимитесь, жители деревни и рабочие... Мы должны подняться, угнетать их и падать, чтобы другие могли подниматься, угнетать нас и падать в бесконечной последовательности.\n- Фан Ноли"
  
 LOADING_TIP_105: "Зачем независимость, если сегодняшние рабы завтра станут тиранами?\n – отрывок из романа доктора Хосе Рисаля «Флибустеризм»"
 LOADING_TIP_106: "Я бы предпочел, чтобы страна, как ад, управлялась филиппинцами, чем страна, которой управляли как рай американцы, потому что каким бы плохим ни было филиппинское правительство, мы всегда можем его изменить.\n- Мануэль Луис Кесон"
 LOADING_TIP_107: "Я покажу им, что у филиппинцев больше чести, мужества и достоинства.\n- Антонио Луна"
 LOADING_TIP_108: "Какая любовь может превзойти чистоту и величие. Как любовь к родной земле. Что любишь больше? Ничего нет.\n- Андрес Бонифачо"
 LOADING_TIP_109: "Нация погибнет не из-за злых людей, а из-за хороших людей, которые просто наблюдали и ничего не делали.\n- Аполинарио Мабини"
 LOADING_TIP_110: "Дайте мне десять тысяч филиппинцев, и я завоюю мир.\n- Генерал Дуглас Макартур"
 LOADING_TIP_111: "Наша свобода не будет обеспечена острием меча... Мы должны обеспечить ее, сделав себя достойными ее. И когда люди достигнут этой высоты, Бог предоставит оружие, идолы будут разбиты, тирания рухнет, как карточный домик, а свобода засияет, как первый рассвет.\n- Доктор Хосе Рисаль"
  
 LOADING_TIP_114: "Когда же женщины смогут решать судьбу мужчин, которые до сих пор имели безумное высокомерие руководить судьбами мира без нашего согласия?\n- Жанна Мелен"
 LOADING_TIP_119: "Демократия больше, чем любая другая система правления, нуждается в власти, поскольку демократия – опасная система...\n- Анри Пишо"
 LOADING_TIP_120: "Вы можете не интересоваться войной, но война интересуется вами.\n- Лев Троцкий"
 LOADING_TIP_121: "Меч покоряет царство, но перо поддерживает его.\n- Юсуф Баласагуни"
 LOADING_TIP_125: "Давайте не будем забывать об этом: со дня воздуха старые границы исчезли. Когда вы думаете о защите Англии, вы больше не думаете о Белых скалах Дувра; вы думаете о Рейне.\n- Стэнли Болдуин"
 LOADING_TIP_127: "Я никогда не убивал человека, но с большим удовольствием прочитал множество некрологов.\n- Кларенс Дэрроу"
 LOADING_TIP_131: "Мы единственная великая страна в мире, существование которой находится под угрозой.\n- Поль Рейно"
 LOADING_TIP_133: "Война — это серия катастроф, приводящая к победе.\n — Жорж Клемансо."
  
