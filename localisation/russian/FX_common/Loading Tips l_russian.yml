l_russian:
  
 LOADING_TIP_0: "The movement we are initiating in Spain is not the copy of any foreign movement. It has learned from Valkism what Valkism has of the idea of unity, authority, and substitution of the struggles among classes by the idea of corporation.\n- José Antonio Primo de Rivera" #NT!
 LOADING_TIP_1: "Nothing — no ordeal, no hardship — can compare to war, to all that it brings...Does the \"partisan\" in you stifle the \"human\"? Anything: Dressler, rather than war!\n- Roger Martin du Gard" #NT!
 LOADING_TIP_2: "You know, elections are not won with prayers.\n- Maurice Duplessis" #NT!
 LOADING_TIP_3: "What will the nation say if, in the fight against such an enemy and for such a cause, the Polish army ceases resistance without exhausting all possibilities?\n- Franciszek Kleeberg" #NT!
 LOADING_TIP_4: "Poland does not belong to any one Pole, to any particular political camp, or even to a single generation. It belongs to the entire chain of generations—all those who have gone before and all those yet to come.\n- Roman Dmowski" #NT!
  
 LOADING_TIP_5: "Structure cannot exist without Authority.\n- Philippe Pétain" #NT!
 LOADING_TIP_6: "France cannot be destroyed. She is an old country who, despite her misfortunes, has, and always will have, thanks to her past, a tremendous prestige in the world, whatever the fate inflicted upon her.\n- Pierre Laval" #NT!
 LOADING_TIP_7: "We must have the Rhine line; we want nothing more and will take nothing less.\n- Ferdinand Foch" #NT!
 LOADING_TIP_8: "Nothing great is done without great men, and they are great because they wanted it.\n- Charles de Gaulle" #NT!
 LOADING_TIP_9: "Everyone knows that French policy has always viewed, with vigilant sympathy, all efforts and initiatives aimed at bringing peoples closer together and strengthening peace.\n- Aristide Briand" #NT!
 LOADING_TIP_15: "America is the only nation in history which miraculously has gone directly from barbarism to degeneration without the usual interval of civilization.\n- Georges Clemenceau" #NT!
 LOADING_TIP_10: "The Führer will be impressed only if the British and the French nations cure themselves of their present laxity and slovenliness.\n- Bertrand de Jouvenel" #NT!
 LOADING_TIP_11: "India without the English would swiftly be Indochina without the French\n- Jacques Bainville" #NT!
 LOADING_TIP_12: "French socialism seeks peace even with the totalitarian imperialists, but it is not prepared to bow to all their demands.\n- Léon Blum" #NT!
 LOADING_TIP_14: "They are all, day to day, driven by their personal interests, the ambition that consumes them, the goal they pursue. They couldn't care less about the common good.\n- Paul Léautaud" #NT!
  
 LOADING_TIP_17: "If the British nation is what I think she is in the end she will give us a better offer.\n- Chaim Weizmann, talking against the Uganda Scheme" #NT!
 LOADING_TIP_18: "Is it possible that my people live in such awful conditions? I tell you, Mr. Wheatley, that if I had to live in conditions like that I would be a revolutionary myself.\n- George V" #NT!
 LOADING_TIP_19: "A Whig is a man who is prepared to go to the stake for his beliefs, but who will not send his opponents there. A Tory is one who will not only burn himself, but is quite prepared in the last resort to burn those who differ from him.\n- Lord Tweedsmuir" #NT!
 LOADING_TIP_20: "The task of leadership is not to put greatness into humanity, but to elicit it, for the greatness is already there.\n- Lord Tweedsmuir" #NT!
 LOADING_TIP_21: "Get rid of the worst of the trouble-makers, especially that broadsword wielding imbecile.\n- Oswald Mosley, referring to Jack Churchill" #NT!
 LOADING_TIP_22: "Britons have entered unto this new age, they bring with them the experience of centuries and the wisdom of a millenia. It is we who will illuminate the path for all other nations to follow.\n- Oswald Mosley, speaking to Parliament" #NT!
 LOADING_TIP_23: "Socialism is a siren song that will destroy those that follow its path. Our destiny can only be achieved by retaining the knowledge and experience of our ancestors.\n- King Edward VIII" #NT!
 LOADING_TIP_26: "War would end if the dead could return.\n- Stanley Baldwin" #NT!
 LOADING_TIP_24: "Providence has made us an island - I think for a great purpose in the history of Europe and of the world.\n- David Lloyd George" #NT!
 LOADING_TIP_27: "Any officer who goes into action without his sword is improperly dressed.\n- Colonel Jack Churchill" #NT!
 LOADING_TIP_28: "It is therefore on the two great democracies of the western world — Britain and France — that there now rests the terrible responsibility of saving not only our persons but the civilization we have created.\n- Duff Cooper" #NT!
 LOADING_TIP_29: "I am an Imperialist because I will not be a Colonial.\n- Stephen Leacock" #NT!
 LOADING_TIP_30: "Just one hundred years ago we had fought to prevent French dominance in Europe, in the Great War we seemingly fought to guarantee it.\n- Alfred Milner" #NT!
 LOADING_TIP_33: "God has called upon the British to bring civilisation to every corner of the globe. For the sake of mankind we must not fail.\n- King Edward VIII" #NT!
 LOADING_TIP_34: "Imperialism is a spirit, an attitude of mind, an unconquerable hope. You can phrase it in a thousand ways without exhausting its content. It is a sense of the destiny of England.\n- Lord Tweedsmuir" #NT!
 LOADING_TIP_35: "It can hardly be expected that we shall put 400,000 or 500,000 men in the field and willingly accept the position of having no more voice and receiving no more consideration than if we were toy automata.\n- Robert Borden, Canadian PM" #NT!
 LOADING_TIP_36: "If I am also an Imperialist, it is because the destiny of the English race, owing to its insular position and long supremacy at sea, has been to strike roots in different parts of the world.\n- Alfred Milner" #NT!
 LOADING_TIP_37: "Ours is a rivalry that has endured for centuries. When France lays defeated I shall not celebrate; I shall mourn that we shall never find an enemy such as we had in France again.\n- Colonel Jack Churchill" #NT!
 LOADING_TIP_38: "Don't talk to me about atrocities in war; all war is an atrocity.\n- Lord Kitchener" #NT!
 LOADING_TIP_40: "Liberalism is trust of the people tempered by prudence. Conservatism is distrust of the people tempered by fear.\n- William Ewart Gladstone" #NT!
 LOADING_TIP_118: "Power is not a means, it is an end.\n- George Orwell" #NT!
 LOADING_TIP_103: "We must squeeze the German lemon until the pips squeak.\n- Eric Geddes" #NT!
 LOADING_TIP_16: "No matter what anybody says to the contrary, while we have hands, fists and boots to use, and guns if necessary, there will be no free speech for traitors\n- Frank Ryan" #NT!
  
 LOADING_TIP_41: "The only thing that still grieves me in battles, are my mother's heartbeats.\n- Italo Balbo" #NT!
 LOADING_TIP_42: "The challenge of modernity is to live without illusions and without becoming disillusioned.\n- Antonio Gramsci" #NT!
 LOADING_TIP_43: "The old is dying and the new cannot be born. In this interregnum there arises a great diversity of morbid symptoms.\n- Antonio Gramsci" #NT!
 LOADING_TIP_44: "Italy will never find herself shining the shoes of the Germans!\n- Italo Balbo" #NT!
 LOADING_TIP_26: "Great moral ideas possess an invincible power, and it is we alone who now embody them.\n- Francesco Saverio Nitti" #NT!
 LOADING_TIP_31: "We are anti-Valkists because our homeland is not defined by borders and guns, but is one and the same as our moral world and the homeland of all free people.\n- Carlo Rosselli" #NT!
 LOADING_TIP_45: "Victor was a weak king- I will right what he has wronged. I will create an Italian state that we can be truly proud of.\n- Umberto II of Italy, shortly after his coronation" #NT!
  
 LOADING_TIP_13: "Germany existed where it was being fought for, it revealed itself where armed hands struggled to give it substance, it shone out brightly where those possessed by its spirit were prepared to make the ultimate sacrifice for its sake.\n- Ernst von Salomon" #NT!
 LOADING_TIP_47: "Understand: our time has come, cast aside individual interests and let the bright sun of coming victories blind us! Forward, as long as youthful fire burns within us! Towards great deeds - for only we are capable of them!\n- Adam Dressler" #NT!
 LOADING_TIP_48: "...the ever-deeper trenches might protect against the odd head wound, but it also made for a defensive and security-conscious type way of thinking.\n- Adam Dressler" #NT!
 LOADING_TIP_51: "If there is another war sometime in the future, one thing is for sure: we will not see any defeatists as we did fifteen years ago. The Valkists will sort that out.\n- Gotthard Heinrici" #NT!
 LOADING_TIP_52: "Only socialism in some form can be of true value within Germany.\n- Oswald Spengler" #NT!
 LOADING_TIP_53: "We should have known better after the first war.\n- Gerd von Rundstedt" #NT!
 LOADING_TIP_54: "If victory is at stake, considerations concerning the survival of the population do not matter.\n- Joachim von Stülpnagel" #NT!
 LOADING_TIP_55: "Liberalism has taught the West to turn its principles into tactics to deceive the people. The west dubs this 'democracy,' though it has become evident enough how ill men thrive on a political diet of liberty, equality and fraternity.\n- Arthur Moeller van den Bruck" #NT!
 LOADING_TIP_56: "For years these generals have shit all over us. They promised us everything; they’ve kept not one of their promises.\n- Wolf von Helldorff" #NT!
 LOADING_TIP_57: "Germany has to fight today for the freedom of its unfree-born children, for a future home for its homeless, for the future hopeless generations.\n- Karl Otto Paetel" #NT!
 LOADING_TIP_130: "The defensive battle of the Young German Order is over. The Order is gathering forward, marching and attacking.\n- Artur Mahraun" #NT!
 LOADING_TIP_117: "Now this being non-political is finished, and there remains only one thing: to serve the Valkist movement with complete devotion.\n- Werner von Blomberg" #NT!
 LOADING_TIP_32: "Life values the natural strength of the last barbaric people more than all the labor of the free spirit. And thus it is correct.\n- Adam Dressler" #NT!
 LOADING_TIP_25: "I do not believe that communism can save us. For communism is none other than the heritage of late liberalism, the final and primitive consequence of a purely rationalistic worldview.\n- Adam Dressler" #NT!
 LOADING_TIP_39: "May those who fell on Germania’s path of suffering rise again in our souls and in our children; we shall take up their struggle for justice once more.\n- Herman Gauch" #NT!
 LOADING_TIP_66: "Capitalism is a system that places the economy above the state, the advantage of the individual above that of the nation.\n- Hans Ebeling" #NT!
 LOADING_TIP_115: "Sovereign is he who decides on the exception.\n- Carl Schmitt" #NT!
  
 LOADING_TIP_46: "The Rhenish people - the people of Siegfried, haunted by their Latin tradition and driven towards their peacemaking mission, seek to save the threatened peace of the Gods from the east.\n- Hans Adam Dorten" #NT!
 LOADING_TIP_49: "The main difference between our movement and other socialists in Hamburg, is the fact that we aren’t ashamed to admit the German proletariat is superior to all others.\n- Heinrich Laufenberg" #NT!
 LOADING_TIP_50: "If the Rhineland has remained German, it owes that solely to itself, to its own struggles, its own suffering and its own sacrifices, and no one has the right to accuse us Rhinelanders of any lack of national sentiment!\n- Konrad Adenauer" #NT!
 LOADING_TIP_58: "Tell our friends that we still are what we have always been.\n- Wilhelm Leuschner" #NT!
 LOADING_TIP_123: "Until Germany has broken through the entanglement of such Medusalike beliefs that confront it in Valkism, it cannot hope for a future.\n- Walter Benjamin" #NT!
 LOADING_TIP_113: "As long as there remains a single corner in Germany where art is allowed to open its mouth, we want to pronounce it unmistakably and hammer it through the skull: the Third Reich means the extermination of science, of art, and of the intellect.\n- Lion Feuchtwanger" #NT!
 LOADING_TIP_126: "We can no longer tolerate the pretense that Valkism is the one movement that can save the nation.\n- Ewald von Kleist-Schmenzin" #NT!
 LOADING_TIP_129: "The Soviet star is an enemy of the cross, to be sure. But the valknut is a sacrilege!\n- Joseph Roth" #NT!
  
 LOADING_TIP_59: "A military man can scarcely pride himself on having \"smitten a sleeping enemy\"; it is more a matter of shame, simply, for the one smitten.\n- Isoroku Yamamoto" #NT!
 LOADING_TIP_60: "The fiercest serpent may be overcome by a swarm of ants.\n- Isoroku Yamamoto" #NT!
 LOADING_TIP_61: "Unite your total strength, to be devoted to construction for the future.\n- Hirohito" #NT!
 LOADING_TIP_62: "We have just received your reply. The Japanese Army will consider nothing but surrender.\n- Tomoyuki Yamashita" #NT!
  
 LOADING_TIP_63: "We must devise a means of expanding the situation so as to secure proof of Japan's aggression, even at the risk of provoking an immediate war between ourselves and Japan.\n- Chen Cheng" #NT!
 LOADING_TIP_64: "War has come from every corner of China, and it is my duty to embrace it!\n- excerpt from Zhang Zuolin's 'Beijing Speech'" #NT!
 LOADING_TIP_65: "The flames of a country sliding into ruin is a poor inheritance indeed.\n- Zhang Xueliang" #NT!
 LOADING_TIP_69: "If imperialism is not banished from the country, China will perish as a nation. If China does not perish, then imperialism cannot remain.\n- Chiang Kai-Shek" #NT!
 LOADING_TIP_70: "I am perfectly content to watch the socialist dogs eat each other.\n- Zhang Xueliang" #NT!
  
 LOADING_TIP_67: "Either I conquer Constantinople or Constantinople conquers me.\n- Mehmed the Conqueror" #NT!
 LOADING_TIP_68: "There is no defense line, but a defense territory, and that territory is the whole of the motherland. Not even an inch of the motherland may be abandoned without being soaked in the blood of her citizens...\n- Mustafa Kemal Pasha" #NT!
  
 LOADING_TIP_71: "My ministers are pro-German, my wife is Italian, my population is pro-Russian, i am the only pro-Bulgarian in this country.\n- Tsar Boris III" #NT!
  
 LOADING_TIP_72: "Politics is a gentleman's game.\n- Muhammed Ali Jinnah" #NT!
 LOADING_TIP_122: "The present federation that is being thrust upon us is a federation in bondage and under the control, politically and socially, of the most backward elements in the country.\n- Jawaharlal Nehru" #NT!
  
 LOADING_TIP_73: "Economics is a subject that does not greatly respect one's wishes.\n-Nikita Khrushchev" #NT!
 LOADING_TIP_74: "Workers – men and women – of all countries, place yourselves under the banner of the Third International. It is the banner of your approaching victory!\n- Leon Trotsky" #NT!
 LOADING_TIP_75: "All that we do, every action, should correspond to the highest ideals of the Revolution.\n- Mikhail Frunze" #NT!
 LOADING_TIP_76: "The trouble with free elections, is that you never know how they are going to turn out.\n- Vyacheslav Molotov" #NT!
 LOADING_TIP_77: "History repeats itself, first as tragedy, second as farce.\n- Karl Marx" #NT!
 LOADING_TIP_78: "The problem does not lie within the man allowing himself to be exploited, moreso that people contentedly sit by and watch.\n- Sergey Kirov" #NT!
 LOADING_TIP_79: "There are decades where nothing happens and there are weeks where decades happen.\n- Vladimir Lenin" #NT!
 LOADING_TIP_80: "One man with a gun can control one hundred without.\n- Vladimir Lenin" #NT!
 LOADING_TIP_81: "Everyone explains that discussions about Socialism are exceedingly obscure; this obscurity is due, to a large extent, to the fact that contemporary socialists use a terminology which no longer corresponds to their ideas.\n- Georges Sorel" #NT!
 LOADING_TIP_93: "Being shot is not enough punishment for me; I need to be quartered![...] I betrayed my people and helped Jugashvili and Beria, these degenerates, enslave Georgia and bring Lenin's party to its knees.\n- Polikarp Mdivani" #NT!
 LOADING_TIP_94: "The king is as fictional an authority as God. This fact made both atheism and republicanism two faces of the same coin.\n-Noe Zhordania" #NT!
 LOADING_TIP_95: "The European society is exhausted, they don't empathize with other's pain, they don't even recognize it, and they only care about one thing - To be by themselves, peacefully, with no worries...\n-Noe Zhordania" #NT!
 LOADING_TIP_116: "How quickly a Social Democrat ages! When he's 30, he's already 40; when he's 40, he's already 50; in no time, he becomes a revisionist.\n- Kurt Tucholsky" #NT!
  
  
 LOADING_TIP_82: "Criticism in a time of war is essential to the maintenance of any kind of democratic government.\n- Robert A. Taft" #NT!
 LOADING_TIP_84: "I am not a liberal, I am what I want to be - I am a radical.\n- Floyd B. Olson" #NT!
 LOADING_TIP_85: "The whole of Mexico isn't worth a bucket of warm piss.\n- John Nance Garner, on foreign policy" #NT!
 LOADING_TIP_86: "When they call the roll in the Senate, the Senators do not know whether to answer 'Present' or 'Not Guilty'.\n- Theodore Roosevelt" #NT!
 LOADING_TIP_87: "Call it a Big Stick policy if you must. I call it nothing more than reasonable.\n- John Nance Garner" #NT!
 LOADING_TIP_88: "We are a pretty sordid lot, aren't we, to want to sit looking on while England and France fight our battles and pan gold into our pockets.\n-Quentin Roosevelt" #NT!
 LOADING_TIP_89: "The problem that confronts some of you younger ones – you’ve got to find an alternative to war. War is something men have hated but yet cherished.\n- Norman Thomas, debating a young revolutionary" #NT!
 LOADING_TIP_91: "There but for the grace of God go I.\n-John Bradford" #NT!
 LOADING_TIP_124: "When the people fear the government, there is tyranny. When the government fears the people, there is liberty.\n- Thomas Jefferson" #NT!
 LOADING_TIP_128: "You can always count on Americans to do the right thing—after they’ve tried everything else.\n- Winston Churchill" #NT!
 LOADING_TIP_135: "In war, there is no second prize for the runner-up.\n- General Omar Bradley" #NT!
 LOADING_TIP_XX: "War is a racket. It always has been. It is possibly the oldest, easily the most profitable, surely the most vicious. It is the only one international in scope. It is the only one in which the profits are reckoned in dollars and the losses in lives.\n- Smedley Butler" #NT!
 LOADING_TIP_XX: "Even the iron hand of a national dictator is in preference to a paralytic stroke.\n- Alf Landon, on the Great Depression" #NT!
 LOADING_TIP_XX: "If we stand today on the brink of a precipice it is due to this wicked and selfish prostitution of the agency of government for the relief of the rich and ignoring the poor.\n- Philip F. La Follette" #NT!
 LOADING_TIP_XX: "I had come to the United States Senate with only one project in mind, which was that by every means of action and persuasion I might do something to spread the wealth of the land among all the people.\n- Huey P. Long" #NT!
 LOADING_TIP_XX: "Our dangers come not from Europe or Asia but from our own economy. I have no fear that foreign dictators will seek the conquest of the Western hemisphere, and I am confident we could make them very unhappy if they tried it. But one thing I do dread: that if our people remain too long a prey to insecurity they may at last abandon democracy and their conception of a great and free civilization.\n- Sheridan Downey" #NT!
  
 LOADING_TIP_92: "Why can't the Jews and the Arabs just sit down together and settle this like good Christians?\n-Arthur Balfour" #NT!
  
 LOADING_TIP_96: "The Germanic leader is something else entirely. He has emerged from a circle of equals. He is of their own blood.\n- Per Engdahl" #NT!
 LOADING_TIP_97: "For justice is the dominant idea of this epoch, and its realisation, as far is humanely possible, has become a matter of world conscience, from which there is no escape and which can no longer be neglected.\n- Thomas Mann" #NT!
  
 LOADING_TIP_98: "Only the dead have seen the end of war.\n- Plato" #NT!
 LOADING_TIP_99: "Hence we will not say that Greeks fight like heroes, but heroes fight like Greeks.\n- Winston Churchill" #NT!
 LOADING_TIP_100: "War destroys those who provoke it and those who flourish in it.\n- Georgios Seferis" #NT!
 LOADING_TIP_101: "Peace is the only sustenance of civilization.\n- Odysseas Elytis" #NT!
 LOADING_TIP_104: "War is a wretched destruction, but the values of the struggle force it to become noble.\n- Nikos Kazantzakis" #NT!
  
 LOADING_TIP_134: "In these times, the most sacred creed of every Hungarian is: one can die in the service of our nation, but never tire.\n- Ferenc Szálasi" #NT!
 LOADING_TIP_132: "This nation must be taught not to die, but to live, because it has always known how to die, and will know how to die in the future, when the time comes.\n- István Bethlen" #NT!
 LOADING_TIP_102: "Historical Hungary thus constitutes a natural geographical and economic unit that is unique in Europe. No natural boundaries can be drawn across its territory, and no part of it can be severed without the rest suffering as a result.\n- Albert Apponyi" #NT!
 LOADING_TIP_112: "You create the new nation, and I will create the new army.\n- Jenő Rátz" #NT!
  
 LOADING_TIP_83: "Nationality is the creative power of human culture, culture is the creative power of nationality.\n- Alexandru Constantin Cuza" #NT!
  
 LOADING_TIP_90: "Rise up, villagers and workers... We must rise, oppress them, and fall, so that others may rise, oppress us, and fall, in endless succession.\n- Fan Noli" #NT!
  
 LOADING_TIP_105: "Why independence, if the slaves of today will be tyrants of tomorrow?\n- an excerpt from Dr. José Rizal's novel, El Filibusterismo" #NT!
 LOADING_TIP_106: "I would rather have a country run like hell by Filipinos than a country run like heaven by the Americans, because however a bad Filipino government might be, we can always change it.\n- Manuel Luis Quezon" #NT!
 LOADING_TIP_107: "I will show them that Filipinos have more honor, courage and dignity.\n- Antonio Luna" #NT!
 LOADING_TIP_108: "What love can surpass purity and greatness. Like the love of the native land. Which love more? There is nothing.\n- Andres Bonifacio" #NT!
 LOADING_TIP_109: "A nation will perish because not of evil men but of good men who just watch and did nothing.\n- Apolinario Mabini" #NT!
 LOADING_TIP_110: "Give me ten thousand Filipinos and I shall conquer the world.\n- General Douglas MacArthur" #NT!
 LOADING_TIP_111: "Our liberty will not be secured at the sword's point... We must secure it by making ourselves worthy of it. And when the people reaches that height, God will provide a weapon, the idols will be shattered, tyranny will crumble like a house of cards, and liberty will shine out like the first dawn.\n- Dr. José Rizal" #NT!
  
 LOADING_TIP_114: "When will women get to decide the destiny of men who up until now have had the crazed arrogance to lead the destinies of the world without our consent?\n- Jeanne Mélin" #NT!
 LOADING_TIP_119: "Democracy, more than any other system of government, needs authority, for democracy is a dangerous system...\n- Henri Pichot" #NT!
 LOADING_TIP_120: "You may not be interested in war, but war is interested in you.\n- Leon Trotsky" #NT!
 LOADING_TIP_121: "The sword conquers the realm, but the pen sustains it.\n- Yūsuf Balasaguni" #NT!
 LOADING_TIP_125: "Let us not forget this: since the day of the air, the old frontiers are gone. When you think of the defense of England, you no longer think of the White Cliffs of Dover; you think of the Rhine.\n- Stanley Baldwin" #NT!
 LOADING_TIP_127: "I have never killed a man, but I have read many obituaries with great pleasure.\n- Clarence Darrow" #NT!
 LOADING_TIP_131: "We are the only great country in the world whose existence is menaced.\n- Paul Reynaud" #NT!
 LOADING_TIP_133: "The war is a series of catastrophes that results in a victory.\n- Georges Clemenceau" #NT!
  
