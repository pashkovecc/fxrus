 # EST - Estonia 
 ####################################### 
 EST_submarine_2: "Тип «Калев»"
 EST_submarine_2_desc: "Тип «Калев» состоял из двух подводных лодок, построенных в Великобритании для ВМС Эстонии в 1936 году. Их основной задачей была постановка минных заграждений, но при этом они несли четыре 533-мм торпедных аппарата."
  
 ####################################### 
 # FIN - Finland 
 ####################################### 
 FIN_heavy_cruiser_1: "Тип «Вяйнямёйнен»"
 FIN_heavy_cruiser_1_desc: "Тип «Вяйнямёйнен» состоял из двух линкоров береговой обороны, построенных в Финляндии в начале 30-х годов ХХ века. Это были одни из последних кораблей береговой обороны в мире, однако по размеру и вооружению они были ближе к тяжелым крейсерам. При водоизмещении в 3900 тонн они были довольно медлительными, а вооружение их состояло из четырех 254-мм орудий."
 FIN_submarine_1: "Тип «Ветехинен»"
 FIN_submarine_1_desc: "Тип «Ветехинен» состоял из трех средних подводных лодок, построенных для ВМС Финляндии на базе немецкого типа «UB III» эры Первой мировой войны. Их водоизмещение составляло менее 500 тонн, а вооружение состояло из четырех 533-мм торпедных аппаратов."
  
 ####################################### 
 # FRA - France 
 ####################################### 
 FRA_submarine_1: "600-тонная серия"
 FRA_submarine_1_desc: "600-тонная серия — первые французские подлодки современного типа, построенные после Первой мировой войны. Несмотря на то, что они были способны действовать в открытом море, их разрабатывали для операций у побережья и в основном использовали в теплых водах Средиземного моря. Серия состояла из трех типов: «Сирен», «Ариан» и «Сирсе», по четыре лодки в каждом. Они послужили основой для более крупных серий 630-тонных подлодок типов «Аргонот», «Диан» и «Орион»."
 FRA_submarine_2: "Тип «Минерв»"
 FRA_submarine_2_desc: "Подводные лодки типа «Минерв» (проект T2) созданы на основе 630-тонной серии, но были оснащены лучшими энергетическими установками и имели другое расположение торпед. Эти лодки стали первой частью программы стандартизации, в рамках которой проектами централизованно занималась DCAN (дирекция по строительству военных кораблей)."
 FRA_submarine_3: "Тип «Ролан Морийо»"
 FRA_submarine_3_desc: "Большие океанские подводные лодки типа «Ролан Морийо» (проект Z2) основывались на раннем типе «Редутабль». Эти крупные лодки имели водоизмещение в районе 1800-2400 тонн и несли устрашающее вооружение из 10 торпедных аппаратов. Ни одна из лодок типа не была достроена из-за капитуляции Франции."
 FRA_submarine_4: "Тип «Феникс»"
 FRA_submarine_4_desc: "Средние океанские подводные лодки типа «Феникс», обладавшие большой дальностью действия, были одобрены в рамках военно-морской программы 1939-40 годов, но из-за начала войны и поражения Франции их строительство было отменено. Они напоминали тип «Редутабль», но были несколько меньше, имели водоизмещение в 1200 тонн и несли при этом аналогичное тяжелое торпедное вооружение."
 FRA_destroyer_1: "Тип «Бурраск»"
 FRA_destroyer_1_desc: "Эсминцы типа «Бурраск», построенные в середине 20-х годов, были частью 1500-тонной серии и вместе с типами «Шакаль» и «Л'Адруа» составляли основу нового послевоенного флота Франции. Они были быстры и хорошо вооружены для своего времени, но их торпедное вооружение уступало аналогичным кораблям других держав."
 FRA_destroyer_2: "Тип «Ле Фантаск»"
 FRA_destroyer_2_desc: "Эсминцы типа «Ле Фантаск», запущенные в серию в рамках военно-морской программы 1930 года, являлись, по сути, улучшенной версией ранних «суперэсминцев» 2400-тонной серии («Гепард», «Эгль», «Воклен»). Они были большие, тяжеловооруженные, очень быстрые и отлично подходили для сопровождения новых скоростных кораблей. Их вооружение состояло из орудий новейшей конструкции, достойной системы ПВО и торпедного вооружения."
 FRA_destroyer_3: "Тип «Л’Энтрепид»"
 FRA_destroyer_3_desc: "Эсминцы типа «Л’Энтрепид» — модифицированная версия предыдущего типа, «Ле Арди». Они были одобрены в рамках военно-морских программ 1938 и 1939 гг., но война и капитуляция Франции привели к отмене их строительства. Предполагался более заметный акцент на зенитном вооружении, увеличение водоизмещения до 2800-2900 тонн и использование более крупной энергетической установки."
 FRA_destroyer_4: "Тип «Гош»"
 FRA_destroyer_4_desc: "Типы «Гош» и «Баярд» были последними проектами «суперэсминцев». Оба основывались на проекте «Могадор», имели водоизмещение в 4200 тонн и схожее вооружение главного калибра, отличаясь усиленными зенитными батареями и улучшенной энергетической установкой. Они были заказаны в рамках военно-морской программы 1939-40 годов, но из-за начала войны и капитуляции Франции строительство было отменено."
 FRA_light_cruiser_1: "Тип «Дюге Труэн»"
 FRA_light_cruiser_1_desc: "Легкие крейсеры типа «Дюгэ Труэн» стали первыми большими военными кораблями Франции, построенными после Первой мировой войны в рамках военно-морской программы 1922 года, а также первыми легкими крейсерами с закрытыми башнями главного калибра. По сравнению с другими кораблями того же типа они обладали мощным торпедным вооружением, однако бронирование у них практически отсутствовало."
 FRA_light_cruiser_2: "Тип «Ла Галиссоньер»"
 FRA_light_cruiser_2_desc: "Легкие крейсеры «Ла Галиссоньер» стали ответом итальянским «Кондоттьери». Они были построены в рамках военно-морских программ 1931 и 1932 годов на основе типа «Эмиль Бертен» с пушечным и зенитным вооружением, соответствующими эпохе. Обладая водоизмещением в 10850 тонн, крейсеры отличались хорошей скоростью и большим количеством самолетов-разведчиков на борту."
 FRA_light_cruiser_3: "Тип «Де Грасс»"
 FRA_light_cruiser_3_desc: "Крейсеры типа «Де Грасс» были заказаны в рамках военно-морских программ 1938 и 1939 годов и стали значительно улучшенной версией типа «Ла Галиссоньер». Они должны были иметь усиленное вооружение ПВО, а также более мощные энергетические установки. Падение Франции привело к тому, что строительство последних двух кораблей было отменено, а головной корабль был завершен в измененном виде и только после окончания войны. Немцы планировали перестроить его в легкий авианосец, но и этот проект тоже не был осуществлен."
 FRA_light_cruiser_4: "Тип «Кольбер»"
 FRA_light_cruiser_4_desc: "«Кольбер» представлял собой легкий крейсер ПВО и был спущен на воду в 1956 году. Крейсеры этого типа схожи с послевоенными вариантами «Де Грасса» и обладали мощным зенитным вооружением как дальнего, так и ближнего радиуса действия. Разница между типами «Кольбер» и «Де Грасс» заключается в том, что «Кольбер» имел более скромную энергетическую установку и более тонкую броню, а также был немного меньше."
 FRA_heavy_cruiser_1: "Тип «Сюффрен»"
 FRA_heavy_cruiser_1_desc: "Тип тяжелых крейсеров «Сюффрен» практически повторял предыдущий тип «Дюкень» с небольшими улучшениями, увеличившими его мореходные качества. Оба типа подходили под современную философию крейсеров ВМФ Франции: тонкая броня, но хорошие скорость и дальность действия. Их стандартное водоизмещение составляло 10000 тонн, а вооружение было типичным для тяжелых крейсеров."
 FRA_heavy_cruiser_2: "Тип «Альжери»"
 FRA_heavy_cruiser_2_desc: "Тяжелые крейсеры типа «Альжери» являлись дальнейшим усовершенствованием предшественников типа «Дюкень» и «Сюффрен», но были разработаны для противостояния новым итальянским тяжелым крейсерам «Зара». Бронепояс и подводная защита были значительно усилены. Вооружение ПВО соответствовало эпохе, но из-за изменений водоизмещение превышало 10000 тонн."
 FRA_heavy_cruiser_3: "Тип «Сен-Луи»"
 FRA_heavy_cruiser_3_desc: "Тип тяжелых крейсеров «Сен-Луи» основывался на типе «Альжери», но по внешнему виду корабли больше напоминали линкоры «Дюнкерк» и «Ришелье». Три корабля были заказаны в рамках военно-морской программы 1940 года, но из-за капитуляции Франции ни один из них не был заложен. «Сен-Луи» должны были нести новые орудия и улучшенные системы ПВО, однако их броня была аналогична типу «Альжери». Это был последний проект тяжелых крейсеров ВМС Франции."
 FRA_heavy_cruiser_4: "Тип «Форбэн»"
 FRA_heavy_cruiser_4_desc: "Гипотетические тяжелые крейсеры типа «Форбэн» должны были стать наследниками типа «Сен-Луи». Они были спроектированы для защиты торговых путей между материковой Францией и колониями и, как следствие, обладают большой дальностью действия и хорошей скоростью. При этом, однако, крейсеры несут тяжелое вооружение, расположенное в четырех трехорудийных башнях, и достаточное количество орудий ПВО. В компоновке и общем виде корабля чувствуется влияние предыдущего типа «Сен-Луи», а вместе с этим — и британского типа «Уганда»."
 FRA_battle_cruiser_1: "Проект «Дюран-Вьель»"
 FRA_battle_cruiser_1_desc: "Линейный крейсер «Дюран-Вьель» относится к проектам периода до Первой мировой войны. По своей сути он являлся облегченной версией линкоров типов «Норманди» и «Лион», неся на себе те же башни главного калибра, но в меньшем количестве. Как и остальные линейные крейсеры других ВМС того времени, он был быстрее линкоров, но с более слабым бронированием. Проект был отменен еще до начала Первой мировой войны."
 FRA_battle_cruiser_2: "Тип «Дюнкерк»"
 FRA_battle_cruiser_2_desc: "Линкоры «Дюнкерк» были спроектированы для противодействия немецким «карманным» линкорам типа «Дойчланд». Они стали вершиной конструкторских разработок, проводившихся с середины 20-х годов и до начала 30-х годов ХХ века. Линкоры были заказаны в рамках военно-морских программ 1931 и 1934 годов и напоминали британские линкоры типа «Нельсон»: все башни главного калибра были сосредоточены впереди, в результате чего бронепояс стал короче, а сам корабль — меньше, дабы соответствовать ограничениям военно-морских договоров."
 FRA_battleship_1: "Тип «Курбэ»"
 FRA_battleship_1_desc: "Линкоры типа «Курбэ» были первыми супердредноутами, построенными для ВМС Франции до и во время Первой мировой войны. Они были заказаны в рамках военно-морских программ 1910 и 1911 годов и не успели принять заметное участие в Первой мировой, зато активно использовались в ходе Второй мировой. Несмотря на то, что броней и вооружением они превосходили своих предшественников, линкоры «Данте», они уступали линкорам ВМС США и Британии того времени. Их водоизмещение составляло 22000 тонн; единственными изменениями перед Второй мировой войной были улучшение зенитных батарей и замена паровых котлов на мазутные."
 FRA_battleship_2: "Тип «Ришелье»"
 FRA_battleship_2_desc: "Корабли типа «Ришелье», улучшенный вариант типа «Дюнкерк», стали последними линкорами, принятыми на вооружение ВМС Франции. Они были заказаны в рамках военно-морских программ 1935 и 1938 годов. Превосходное зенитное вооружение, скорость и дальность хода выгодно отличали их среди крупных кораблей. Однако из четырех заказанных судов только два были спущены на воду и еще одно было построено до капитуляции Франции. Существовало множество проектов по завершению строительства оставшихся кораблей в различных вариантах: в качестве линкоров противодействия авианосцам, гибридных вариантов авианесущего линкора или полных авианосцев."
 FRA_battleship_3: "Тип «Гасконь»"
 FRA_battleship_3_desc: "Линкоры «Гасконь» выступали в качестве подтипа «Ришелье». Три корабля были заказаны в рамках военно-морской программы 1940 года, однако ни один не был заложен. Проект преимущественно копировал «Ришелье», но орудия главного калибра были более равномерно распределены между передней и задней частями корпуса, а ПВО и энергетическая установка были усилены. В итоге получался более дееспособный линкор."
 FRA_battleship_4: "Тип «Эльзас»"
 FRA_battleship_4_desc: "Тип «Эльзас» планировался как продолжение типа «Ришелье». Были заказаны четыре корабля; разработка проекта закончилась в 1939 году, он был одобрен в 1940 году. Закладка корпусов планировалась на 1941 год, но не случилась из-за капитуляции Франции. Улучшения по сравнению с «Ришелье» включали усиленное вооружение главного калибра (с увеличением числа орудий), более мощные установки ПВО, более толстые бронеплиты и увеличенную энергоустановку."
 FRA_SH_battleship_1: "Тип «Шарлемань»"
 FRA_SH_battleship_1_desc: "Гипотетический проект суперлинкоров типа «Шарлемань» был разработан для противодействия крупным линкорам других ВМС. Линкоры обладали крупнокалиберными орудиями в передней части по линейно-возвышенной модели, мощными системами ПВО и толстой броней. Проект заимствовал элементы типов «Ришелье» и британского «Нельсона»."
 FRA_SH_battleship_2: "Тип «Наполеон Бонапарт»"
 FRA_SH_battleship_2_desc: "Гипотетические линкоры «Наполеон Бонапарт» базировались на типах «Эльзас» и «Гасконь». Тяжелое вооружение располагалось равномерно спереди и сзади в тройных башнях, линейно-возвышенных орудиях вспомогательной артиллерии и установках ПВО. Толстая броня и мощная энергетическая установка обеспечивали скорость и защиту, позволяя не отставать от других кораблей флота и давать отпор противнику."
 FRA_carrier_1: "Тип «Беарн»"
 FRA_carrier_1_desc: "«Беарн» был изначально заложен как линкор типа «Норманди», но достроен был уже как авианосец с водоизмещением в 22000 тонн. Ему довелось послужить как в межвоенное время, так и в ходе Второй мировой войны. Из-за особенностей конструкции он был медленным и имел небольшой ангар, но хороший бронепояс и большой радиус действия уравновешивали эти недостатки. Его строительство дало важный опыт французским инженерам DCAN (дирекции по строительству военных кораблей) и легло в основу будущих разработок."
 FRA_carrier_2: "Тип «Жоффр»"
 FRA_carrier_2_desc: "Авианосцы типа «Жоффр» (проект PA-16) стали следующим поколением авианосцев ВМС Франции. Это был последний из проектов, разработанных между 1929 и 1937 гг. Два корабля были заказаны в рамках военно-морской программы 1938 года, но начало военных действий замедлило темпы строительства, а капитуляция Франции вовсе привела к его отмене. Водоизмещение корабля должно было составлять 20000 тонн. «Жоффр» обладал хорошей системой ПВО, броней и скоростью, но размер авиагруппы оставлял желать лучшего. В целом ВМС Франции получили бы достаточно сбалансированный и универсальный авианосец."
 FRA_carrier_3: "Тип «Жан Бар»"
 FRA_carrier_3_desc: "В середине войны поступило предложение о перестройке незаконченного линкора «Жан Бар» типа «Ришелье» в полноценный авианосец, аналогично тому, как создавался японский «Синано». Крупный корпус позволил бы нести большое количество самолетов, а мощная энергетическая установка обеспечила бы будущему авианосцу высокую скорость и большой радиус действия. Батарея зенитных орудий производства США предоставляла серьезную защиту от авиации и малых судов противника."
 FRA_carrier_4: "Тип «Клемансо»"
 FRA_carrier_4_desc: "Тип «Клемансо» (проект PA-28) стал первым послевоенным проектом авианосца ВМС Фанции. Его конструкция была схожа с незаконченным типом «Жоффр», но оборудование и вооружение было бы современным и произведенным во Франции. Покупка эскортных авианосцев ВМС США и Британии и печальное состояние послевоенной экономики привели к закрытию проекта. Не следует путать с более поздними авианосцами «Клемансо» проекта PA-54, заложенными в 1955-1957 годах."
  
 ####################################### 
 # GRE - Greece 
 ####################################### 
 GRE_submarine_1: "Тип «Кацонис»"
 GRE_submarine_1_desc: "Две подводные лодки типа «Кацонис» были построены Францией для ВМФ Греции в конце 20-х годов ХХ века и находились в строю во время Второй мировой войны. Их водоизмещение составляло около 580 тонн, а вооружение состояло из шести 533-мм торпедных аппаратов."
 GRE_submarine_2: "Тип «Матрозос»"
 GRE_submarine_2_desc: "Греческая подводная лодка «Матрозос» принадлежала к итальянскому типу «Перла», была захвачена Британией и передана в 1942 году ВМФ Греции. Ее водоизмещение составляло 680 тонн, а вооружение состояло из шести 533-мм торпедных аппаратов. Лодка могла погружаться на глубину до 80 метров."
 GRE_submarine_4: "Тип «Пипинос»"
 GRE_submarine_4_desc: "Тип «Пипинос» состоял из четырех британских подводных лодок типа «U», переданных ВМФ Греции в 1943-1946 гг. Их водоизмещение составляло 545 тонн, а вооружение состояло из шести 533-мм торпедных аппаратов."
 GRE_destroyer_1: "Тип «Аэтос»"
 GRE_destroyer_1_desc: "Эсминцы типа «Аэтос» были построены в Британии и куплены ВМФ Греции до начала Первой мировой войны. Все четыре корабля находились в строю во время Второй мировой войны. Их водоизмещение составляло 980 тонн, а вооружение состояло из четырех 105-мм орудий и четырех 533-мм торпедных аппаратов. В конце 20-х годов ХХ века эсминцы прошли модернизацию."
 GRE_destroyer_2: "Тип «Василевс Георгиос I»"
 GRE_destroyer_2_desc: "Тип «Василевс Георгиос I» состоял из двух модифицированных британских эсминцев типа «H», построенных для ВМФ Греции в конце 30-х годов ХХ века. Эсминцы обладали водоизмещением в 1350 тонн и отличными скоростью и дальностью действия. Вооружение состояло из четырех 128-мм орудий; кроме того, корабли несли мощное торпедное вооружение."
 GRE_destroyer_3: "Тип «Адриас»"
 GRE_destroyer_3_desc: "Тип «Адриас» состоял из шести британских эскортных миноносцев типа «Хант», четыре из которых были переданы ВМФ Греции в 1942 году. Будучи эскортными миноносцами, они уступали в скорости стандартным эсминцам. Обладая водоизмещением в 1050 тонн, они несли на себе четыре 102-мм орудия и отличались солидным торпедным и противолодочным вооружением."
 GRE_destroyer_4: "Тип «Леон»"
 GRE_destroyer_4_desc: "Тип «Леон» представлял собой американские эскортные миноносцы типа «Кэннон», заказанные в 1943 году, но переданные Греции только в 1951 году. Эти корабли были медленнее стандартных эсминцев. Их водоизмещение составляло 1240 тонн, они были оснащены тремя 3-дюймовыми орудиями и солидным арсеналом торпедного и противолодочного вооружения."
 GRE_light_cruiser_1: "Тип «Элли»"
 GRE_light_cruiser_1_desc: "Легкий крейсер «Элли» был построен в США в 1914 году. Изначально он планировался для ВМФ Китая, но в конечном итоге был передан Греции. «Элли» был небольшим для крейсера, обладая водоизмещением всего в 2600 тонн. Его основное вооружение состояло из двух 152-мм орудий. Корабль принял участие во Второй мировой войне и был потоплен итальянской подлодкой незадолго до вторжения стран Оси в Грецию."
 GRE_heavy_cruiser_1: "Тип «Авероф»"
 GRE_heavy_cruiser_1_desc: "Броненосный крейсер «Авероф» был построен в Италии для ВМФ Греции до Первой мировой войны и принял участие во Второй мировой войне в качестве флагмана флота. «Авероф» был весьма мощным кораблем по сравнению с крейсерами своего времени. Его водоизмещение составляло около 10000 тонн, он был очень хорошо бронирован и нес вооружение из четырех 234-мм орудий, являясь при этом сравнительно быстрым для броненосного крейсера."
 GRE_battleship_1: "Тип «Килкис»"
 GRE_battleship_1_desc: "Тип «Килкис» состоял из двух американских броненосцев типа «Миссисипи», введенных в строй в 1908 году и проданных Греции в 1914 году. Это были последние линкоры, построенные в США до эры дредноутов. Их водоизмещение составляло всего 13000 тонн, а вооружение состояло из четырех 10-дюймовых орудий. Корабли имели средние бронирование, скорость и дальность действия для кораблей своего типа. Оба корабля были списаны в 1936 году."
  
 ####################################### 
 # GER - Deustches Reich 
 ####################################### 
 GER_submarine_1: "«Тип UB III»"
 GER_submarine_1_desc: "Подводные лодки типа UB III строились императорскими ВМС Германии во время Первой мировой войны. Они несли десять торпед и имели водоизмещение около 500 тонн. Между 1916 и 1918 годами было построено 96 лодок, но все они были выведены из эксплуатации к 1935 году."
 GER_submarine_2: "«Тип IIA»"
 GER_submarine_2_desc: "Подлодки типа IIA имели цельносварной корпус и внутренние балластные танки. Их водоизмещение составляло более 250 тонн, а вооружение — пять 522-мм торпедных аппаратов. Всего в 1934-1935 гг. было построено шесть лодок."
 GER_submarine_3: "«Тип VIIC»"
 GER_submarine_3_desc: "Лодки типа VIIC были рабочей лошадкой подводных сил Германии. С 1940 по 1945 гг. было введено в строй 568 лодок. Водоизмещение составляло 770 тонн, а вооружение состояло из пяти 533-мм торпедных аппаратов."
 GER_submarine_4: "«Тип XXI»"
 GER_submarine_4_desc: "Подводные лодки типа XXI, также известные как «электроботы», были первыми подлодками, разработанными для действия в основном в подводном положении. Ключевыми особенностями стали обтекаемые корпус и рубка, а также большое количество аккумуляторных элементов. Тип XXI был одним из крупнейших типов немецких подводных лодок, обладая водоизмещением более 1620 тонн. За 1943-1945 гг. было введено в строй 118 лодок."
 GER_destroyer_1: "«Тип 23»"
 GER_destroyer_1_desc: "«Тип 23» — тип торпедных катеров, построенных для кригсмарине после Первой мировой войны. В 1926-1928 гг. на вооружение поступили шесть кораблей, которые позже приняли участие во Второй мировой. Несмотря на формальное обозначение типа, по размеру корабли были ближе к эсминцам, обладая водоизмещением в 920 тонн и тремя 105-мм орудиями."
 GER_destroyer_2: "Gloria Klasse" #NT!
 GER_destroyer_2_desc: "The Gloria Klasse was the first class of German destroyers built since World War I. They were armed with five 5" guns and eight torpedo tubes. 16 ships were built, out of which 12 were the improved Zerstörer 1934A subclass." #NT!
 GER_destroyer_3: "August Wilhelm Klasse" #NT!
 GER_destroyer_3_desc: "The August Wilhelm Klasse, known to the allies as "Auwi" Class destroyers, was designed to carry the new 150mm (5.9") guns. Designed with three single guns aft and a twin gun in the bow, they were originally fitted with a single gun in the bow. Four of the eight ships of the class were later refitted with the twin turrets. A second group of seven destroyers were built to a slightly modified design with twin guns in the bow." #NT!
 GER_destroyer_4: "Aegir Klasse" #NT!
 GER_destroyer_4_desc: "Although the first prototype of a diesel powered destroyer (August Wilhelm Klasse 1942) was not completed, the development of the ship type continued. Several proposals were made which finally lead to the Aegir Klasse project. In addition to a heavy main armament, the ships had an increased Flak armament compared to its predecessors, including the new 5,5 cm AA gun." #NT!
 GER_light_cruiser_1: "Emden Klasse" #NT!
 GER_light_cruiser_1_desc: "«Эмден» стал первым крупным немецким кораблем после Первой мировой войны. Он был заложен в 1921 году и спущен на воду в 1925-м. Вооружение состояло из восьми 150-мм орудий в одноорудийных башнях."
 GER_light_cruiser_2: "Seeckt Klasse" #NT!
 GER_light_cruiser_2_desc: "The Seeckt Klasse light cruisers were built between 1928 and 1935 as improvements over the preceding Emden Klasse cruisers. They displaced over 8,100 tons, had adequate speed and range, and were armed with nine 15cm SK C/25 guns in their main armament." #NT!
 GER_light_cruiser_3: "Ludendorff Klasse" #NT!
 GER_light_cruiser_3_desc: "The Ludendorff Klasse cruisers were designed as scouts for commerce raiding squadrons. Six ships were ordered as part of Plan Z, with two being laid down before work was halted at the outbreak of the war. The main armament would have been eight 150mm guns in four twin turrets." #NT!
 GER_light_cruiser_4: "Sebottendorf Klasse" #NT!
 GER_light_cruiser_4_desc: "The Sebottendorf Klasse cruisers were a modified Ludendorff Klasse design. They were designed to be larger than the Ludendorff Klasse with a heavier anti-aircraft armament and improved fire control." #NT!
 GER_heavy_cruiser_1: "Blücher Klasse" #NT!
 GER_heavy_cruiser_1_desc: "«Блюхер» стал последним немецким бронекрейсером. Для своего времени это была инновационная конструкция, дальнейшим развитием которой стали линейные крейсеры «Фон дер Танн», но к началу Первой мировой она уже устарела. Сам «Блюхер» был потоплен в 1915-м у Доггер-банки."
 GER_heavy_cruiser_2: "Hipper Klasse" #NT!
 GER_heavy_cruiser_2_desc: "The Admiral Hipper Klasse heavy cruisers were the first heavy cruisers of the Kriegsmarine. Officially displacing 10,000 tons, in reality they displaced over 16000 tons. They were armed with eight 8" guns in four twin turrets, with a secondary battery of twelve 105mm guns." #NT!
 GER_heavy_cruiser_3: "Thule Klasse" #NT!
 GER_heavy_cruiser_3_desc: "Officially part of the Hipper Klasse, the Thule subclass incorporates many improvements, including a heavier anti air armament." #NT!
 GER_heavy_cruiser_4: "Raeder Klasse" #NT!
 GER_heavy_cruiser_4_desc: "The Admiral Raeder Klasse was a large heavy cruiser design, officially designated as Panzerschiff (Armored Ship) by the Kriegsmarine. Displacing almost 24,000 tons, they would have been 3,000 tons lighter but 55 meters longer than the U.S. New York-class battleships. The armament consisted of six 280mm guns in two triple turrets." #NT!
 GER_battle_cruiser_1: "Yorck Klasse" #NT!
 GER_battle_cruiser_1_desc: "The three ships of the Yorck-Klasse battlecruisers were designed in response to the British Renown Class. They would have been armed with eight 380mm guns in four twin turrets. All three ships were laid down in 1916, but none were completed due to the war." #NT!
 GER_battle_cruiser_2: "Hamburg Klasse" #NT!
 GER_battle_cruiser_2_desc: "In 1939, the Kriegsmarine decided to replace three of the planned P-class cruisers with battlecruisers. This resulted in the Hamburg Klasse battlecruisers, armed with six 38cm (15") guns in three twin turrets. The ships were designed with a displacement of 35,400 tons and a top speed of 35 knots. Construction orders were given for the three ships of the class, but none were started." #NT!
 GER_battleship_1: "Deutschland Klasse" #NT!
 GER_battleship_1_desc: "Версальский договор позволял Германии иметь на вооружении шесть линкоров. К 30-м годам ХХ века в строю оставались два корабля типа «Дойчланд» (не путать с карманными линкорами одноименного типа). В 4:47 утра 1 сентября 1939 года линкор «Шлезвиг-Гольштейн» выпустил первый снаряд Второй мировой войны по базе в Гданьске."
 GER_battleship_2: "Scharnhorst Klasse" #NT!
 GER_battleship_2_desc: "The Scharnhorst Klasse battleships were the first modern battleships to be built for the Kriegsmarine. They were built as a response to the French Dunkerque-class battlecruisers, themselves a response to the German Deutschland Klasse Panzerschiffe (Pocket Battleships). The Scharnhorst class is armed with nine 283mm (11") guns in three triple turrets. Plans were made to up gun them with twin 380mm (15") guns, but with the outbreak of the war, this never happened." #NT!
 GER_battleship_3: "Führer Klasse" #NT!
 GER_battleship_3_desc: "The two-ship Führer Klasse battleships were the largest warships built for the Kriegsmarine. The ships were designed in response to the new French battleships under construction, with a similar armament of eight 38cm (15") guns as the Richelieu Class, with four twin turrets as opposed to the two quad turrets of the Richelieus." #NT!
 GER_battleship_4: "Großdeutschland Klasse" #NT!
 GER_battleship_4_desc: "The German Hamburg Plan envisioned a force of ten battleships in order to challenge the naval power of the United Kingdom. The Großdeutschland Klasse was a series of designs for the six battleships needed to meet the demands of the plan. Two ships of the G39 design were laid down at the outbreak of the 2nd Great War, but construction was halted as the war begun. Neither of the ships were officially named, but Großdeutschland was speculated as a possible name for the lead ship of the class. Had the ships been completed, they would have been augmented Führer Klasse ships, with a main battery of eight 40.6cm (16") guns." #NT!
 GER_carrier_1: "Авиапароход I"
 GER_carrier_1_desc: "«Авианосный пароход I», разработанный в 1915 году, представлял собой конверсию пассажирского лайнера «Аузония» в авианосец. С началом Первой мировой войны работа была приостановлена; если бы корабль был достроен, он обладал бы водоизмещением в 12500 тонн и нес бы различные гидро- и обычные самолеты в трех ангарах."
 GER_carrier_2: "Seydlitz Klasse" #NT!
 GER_carrier_2_desc: "Seydlitz was laid down as the fourth ship of the Admiral Hipper Klasse heavy cruisers. Partially completed by the beginning of the war, she was considered for conversion into an aircraft carrier. The project, codenamed Weser 1, was partially underway when work was halted due to increasing air attacks on Bremen and the lack of resources for her construction." #NT!
 GER_carrier_3: "Graf Zeppelin Klasse" #NT!
 GER_carrier_3_desc: "«Граф Цеппелин» — единственный немецкий авианосец, полностью разработанный как таковой. Были заказаны два корабля, но ни один из них не был достроен. Предполагалось, что «Граф Цеппелин» должен был нести 30 истребителей Bf-109T и 12 пикирующих бомбардировщиков Ju-87E (палубных вариантов Bf-109E и Ju-87D соответственно)."
 GER_carrier_4: "Europa Klasse" #NT!
 GER_carrier_4_desc: "В начале 40-х кригсмарине рассматривался вариант конверсии различных гражданских судов в авианосцы. Крупнейшим из них было пассажирское судно «Европа», использовавшееся в качестве плавучей казармы и транспорта. Если бы конверсия была завершена, новый авианосец обладал бы водоизмещением в 56000 тонн и нес до 42 самолетов."
 GER_SH_battleship_1: "Линкор типа H41"
 GER_SH_battleship_1_desc: "Линкоры H41 представляли собой модернизацию предыдущей модели H39. Было запланировано усиление бронирования, противоторпедные переборки, а также защита руля и осей гребных винтов. Батарея главного калибра получила восемь 420-мм орудий (мощнее, чем у британского проекта типа «Лайон»). Водоизмещение должно было достигать 70000 тонн."
 GER_SH_battleship_2: "Линкор типа H44"
 GER_SH_battleship_2_desc: "Тип H44 был последней разработкой линкоров серии «H». Отсутствие ограничений по калибру и тоннажу привело к тому, что проект предполагал установку восьми 508-мм орудий и водоизмещение в 131000 тонн."
  
