 ####################################### 
 # SPR - Republican Spain 
 ####################################### 
 SPR_submarine_1: "Тип «В»"
 SPR_submarine_1_desc: "Тип «B» состоял из шести подводных лодок, построенных Испанией для своих ВМС в 1922-1925 гг. Они были спроектированы как однокорпусные корабли, и, следовательно, их надежность оставляла желать лучшего. Это были подводные лодки среднего размера с водоизмещением около 550 тонн. Вооружение состояло из четырех 450-мм торпедных аппаратов."
 SPR_submarine_2: "Тип «Хенераль Мола»"
 SPR_submarine_2_desc: "Тип «Хенераль Мола» состоял из четырех итальянских подлодок типа «Архимед», введенных в строй в 1934 году и переданных испанским националистам в 1937 году. Они были достаточно большими, с водоизмещением в 880 тонн, и при этом быстрее большинства подлодок. Лодки несли вооружение из восьми 533-мм торпедных аппаратов и могли погружаться на глубину до 90 метров."
 SPR_submarine_3: "Тип «G»"
 SPR_submarine_3_desc: "Испанский тип «G» представлял собой две немецкие подлодки типа «Тип VIIC», построенных Испанией по лицензии. Лишь одна лодка была завершена, но и та вошла в состав ВМС Испании лишь в 1947 году. Водоизмещение составляло 770 тонн, а вооружение состояло из пяти 533-мм торпедных аппаратов. Лодки обладали отличной скоростью и дальностью действия."
 SPR_submarine_4: "Тип «D»"
 SPR_submarine_4_desc: "Три испанские подводные лодки типа «D» были спущены на воду в 1944 году и введены в строй уже после войны. Все три были спроектированы и построены в Испании. Это были крупные океанские подлодки с водоизмещением в 1050 тонн, отличной скоростью и радиусом действия. Их вооружение состояло из шести 533-мм торпедных аппаратов."
 SPR_destroyer_1: "Тип «Альседо»"
 SPR_destroyer_1_desc: "Три эсминца типа «Альседо» были построены Испанией для своих ВМС на основе британского типа «L» и введены в строй в 1924-1925 гг. Их водоизмещение составляло 1040 тонн, а вооружение состояло из трех 102-мм орудий и четырех 450-мм торпедных аппаратов. Также они имели отличную скорость и радиус действия для своего типа."
 SPR_destroyer_2: "Тип «Чуррука»"
 SPR_destroyer_2_desc: "Испанский тип «Чуррука» состоял из шестнадцати эсминцев, построенных в 1925-1933 годах и составлявших основу ВМС Испании в период гражданской войны (позже два эсминца были проданы Аргентине). Проект этих кораблей основывался на британском типе эсминцев «S», их водоизмещение составляло более 1500 тонн, а вооружение состояло из пяти 120-мм орудий и шести 533-мм торпедных аппаратов. Эсминцы обладали хорошей скоростью и отличным радиусом действия."
 SPR_destroyer_4: "Тип «Алава»"
 SPR_destroyer_4_desc: "Эсминцы типа «Алава» были построены после войны как усовершенствование предыдущего типа «Альмиранте Антекера» (подтипа более раннего типа «Чуррука»). Водоизмещение эсминцев составляло 1710 тонн, а вооружение состояло из четырех 120-мм орудий. Их скорость и дальность действия были сравнимы с более ранними типами, которые легли в основу проекта."
 SPR_light_cruiser_1: "Тип «Мендес Нуньес»"
 SPR_light_cruiser_1_desc: "Тип «Мендес Нуньес» состоял из двух легких крейсеров, построенных Испанией для своих ВМС в начале 20-х годов ХХ века. Корабли были заказаны в 1915 году, но нехватка материалов во время Первой мировой войны сказалась на сроках строительства. Крейсеры обладали водоизмещением в 4800 тонн, хорошей броней и сравнительно небольшой скоростью. Главное вооружение состояло из шести 152-мм орудий и дюжины 533-мм торпедных аппаратов."
 SPR_heavy_cruiser_1: "Тип «Принцесса де Астуриас»"
 SPR_heavy_cruiser_1_desc: "Тип «Принцесса де Астуриас» состоял из трех броненосных крейсеров, построенных для ВМС Испании в начале века. Уже к середине 30-х годов все три были сданы на лом или уничтожены. Крейсеры были вооружены сдвоенными 240-мм орудиями и восемью 140-мм орудиями. Из-за тяжелого бронирования их скорость была ниже, чем у тяжелых крейсеров своей эпохи."
 SPR_heavy_cruiser_2: "Тип «Канариас»"
 SPR_heavy_cruiser_2_desc: "Два тяжелых крейсера типа «Канариас» были построены в соответствии с требованиями Вашингтонского морского соглашения. Они были спущены на воду в начале 30-х годов, но достроены только в 1936 году. Крейсеры обладали водоизмещением в 10700 тонн и хорошей скоростью. Также они были сравнительно легко бронированы, но несли восемь 203-мм орудий."
 SPR_battleship_1: "Тип «Эспанья»"
 SPR_battleship_1_desc: "Тип «Эспанья» изначально состоял из трех дредноутов, введенных в строй во время Первой мировой войны, однако к началу гражданской войны в Испании один из них потерпел крушение, а два оставшихся корабля были потеряны во время войны. Эти корабли были сравнительно небольшими для линкоров, с водоизмещением всего в 15400 тонн, обладая при этом отличной броней и скоростью. Основное вооружение состояло из восьми 305-мм орудий."
  
 ####################################### 
 # SWE - Sweden 
 ####################################### 
 SWE_submarine_1: "Тип «Хайен»"
 SWE_submarine_1_desc: "Типы «Хайен», «Баверн» и «Вален» были сериями малых и средних подводных лодок, построенных для ВМС Швеции в 20-е годы ХХ века. В тип «Хайен» входили принятые на вооружение в 1920 году подлодки водоизмещением около 400 тонн, вооруженные четырьмя 450-мм торпедными аппаратами и способные погружаться на глубину всего лишь до 30 метров."
 SWE_submarine_2: "Тип «Съёльёнет»"
 SWE_submarine_2_desc: "Тип «Съёльёнет» состоял из девяти подводных лодок, построенных в 1936-1942 гг. Это были средние подлодки водоизмещением в 580 тонн, на проект которых оказал сильное влияние голландский тип «О». Они были вооружены шестью 533-мм торпедными аппаратами и могли погружаться на глубину в 60 метров."
 SWE_submarine_3: "Тип «U»"
 SWE_submarine_3_desc: "Тип «U» состоял из девяти подводных лодок, введенных в строй в 1942-1944 гг. Они были весьма малы, водоизмещением всего 370 тонн, и сравнительно медленны. Их вооружение состояло из четырех 533-мм торпедных аппаратов."
 SWE_submarine_4: "Тип «Нептун»"
 SWE_submarine_4_desc: "Тип «Нептун» состоял из трех средних подводных лодок, введенных в строй в 1943 году и использовавшихся преимущественно для постановки минных заграждений. Их водоизмещение составляло 550 тонн, а вооружение состояло из пяти 533-мм торпедных аппаратов."
 SWE_destroyer_1: "Тип «Эренскольд»"
 SWE_destroyer_1_desc: "Два эсминца типа «Эренскольд», первые современные эсминцы Швеции после Первой мировой войны, были построены в 1927 году. Их водоизмещение составляло более 970 тонн, а вооружение состояло из трех 120-мм орудий и шести 533-мм торпедных аппаратов. Эсминцы имели малый радиус действия, но обладали хорошей скоростью."
 SWE_destroyer_2: "Тип «Гётеборг»"
 SWE_destroyer_2_desc: "Тип «Гётеборг» состоял из шести эсминцев, построенных в 1935-1942 гг. Эсминцы отличались от своих предшественников удлиненным корпусом и усовершенствованной энергетической установкой. Их водоизмещение составляло более 1020 тонн, а вооружение состояло из 120-мм орудий и шести 533-мм торпедных аппаратов. Корабли обладали ограниченной дальностью действия, но при этом отличной скоростью."
 SWE_destroyer_3: "Тип «Висбю»"
 SWE_destroyer_3_desc: "Четыре эсминца типа «Висбю» были построены в 1942-1944 гг. Они были схожи с предшествующим типом «Гётеборг», но крупнее, с водоизмещением более 1130 тонн. Также они отличались более современной энергетической установкой и большой дальностью действия и несли на себе мощное противолодочное оборудование."
 SWE_destroyer_4: "Тип «Эланд»"
 SWE_destroyer_4_desc: "The two Öland-class destroyers represented a radical change from previous designs. They were launched and completed shortly after World War II. They were large, displacing 1,880 tons. They were armed with four 120mm/45 M44 guns in their main armament, and had a strong AA, torpedo, and ASW complement. They were slightly slower than earlier destroyers, but had a significantly improved range." #NT!
 SWE_light_cruiser_1: "Тип «Фюльгия»"
 SWE_light_cruiser_1_desc: "«Фюльгия» был сравнительно маленьким броненосным крейсером, введенным в строй в ВМС Швеции в 1905 году. Во время войны он использовался в учебных целях после глубокой модернизации в 1939-41 гг. До переоборудования его водоизмещение составляло 4300 тонн, а вооружение состояло из шести 152-мм орудий. Корабль имел хорошую броню, но был сравнительно медлительным для крейсера."
 SWE_light_cruiser_4: "Тип «Тре Крунур»"
 SWE_light_cruiser_4_desc: "В тип «Тре Крунур» входили два легких крейсера, построенных для ВМС Швеции сразу после Второй мировой войны. Обладая водоизмещением немногим меньше 7700 тонн, крейсеры отличались отличными скоростью и дальностью действия. Их главное вооружение состояло из семи 152-мм орудий. Крейсеры также несли мощные установки ПВО, торпедные аппараты и противолодочное вооружение."
 SWE_heavy_cruiser_1: "Тип «Сверье»"
 SWE_heavy_cruiser_1_desc: "Тип «Сверье» состоял из трех броненосцев береговой обороны, построенных для ВМС Швеции до Первой мировой войны. Броненосцы больше походили на тяжелые крейсеры, как размерами (водоизмещение более 6800 тонн), так и вооружением (четыре 283-мм орудия). Корабли были сравнительно медлительны для крейсеров, но отличались достойным бронированием. Все три корабля приняли участие во Второй мировой войне."
  
 ####################################### 
 # URG - Uruguay 
 ####################################### 
 URG_destroyer_1: "Тип «Уругвай»"
 URG_destroyer_1_desc: "«Уругвай» был тяжелым миноносцем, построенным в Германии для ВМС Уругвая перед Первой мировой войной. Его водоизмещение составляло 1400 тонн, а вооружение состояло из четырех 120-мм орудий. Он также обладал мощной системой ПВО и нес два 450-мм торпедных аппарата. Из-за почтенного возраста и больших размеров «Уругвай» уступает в скорости другим эсминцам."
  
 ####################################### 
 # USA - United States of America 
 ####################################### 
 USA_submarine_1: "Тип S"
 USA_submarine_1_desc: "Тип S представлял собой серию из 51 подлодки, спроектированную и построенную в 1920-х годах. В отличие от типов O и R, тип S был больше, что позволяло увеличить дальность хода и нести больше торпед, хотя лодки обладали всего четырьмя носовыми 21-дюймовыми торпедными аппаратами. Несмотря на возраст — последняя лодка типа S была сдана в 1924 году, — они составляли немалую часть подводного флота США."
 USA_submarine_2: "Тип «Порпойс»"
 USA_submarine_2_desc: "Подводные лодки типа «Порпойс» — первые современные подлодки ВМС США, ставшие наследницами экспериментальных лодок серии V-типа, построенных в конце 20-х и начале 30-х годов XX века. Несмотря на первоначальные проблемы с полностью электрическими двигателями, тип оказался удачным и рассматривался как основа для будущих проектов. Лодки этого типа были вооружены 6 торпедными аппаратами и трехдюймовыми палубными орудиями."
 USA_submarine_3: "Тип «Тэмбор»"
 USA_submarine_3_desc: "Тип «Тэмбор» является результатом многолетних экспериментов ВМС США в проектировании подлодок, способных действовать в составе эскадр и адаптированных для действий в водах Тихого океана. Вооружение было расширено до десяти торпедных труб (четыре из них — в корме), 3-дюймового палубного орудия и двух орудий ПВО для дополнительной защиты."
 USA_submarine_4: "Тип «Балао»"
 USA_submarine_4_desc: "Тип «Балао» представляет собой развитие конструкции, основанное на типе «Тэмбор». Центральные изменения включали усиление корпуса, установку 5-дюймовых орудий, а также множество мелких конструктивных улучшений."
 USA_destroyer_1: "Тип «Клемсон»"
 USA_destroyer_1_desc: "Эсминцы типа «Клемсон» унаследовали многие черты своего прямого предшественника — типа «Викс». При этом «Клемсон» обладает более высокой мореходностью и вооружен 4-дюймовыми орудиями, 3-дюймовыми орудиями ПВО и 12 торпедными аппаратами. Этот тип уже считается морально устаревшим, но все еще составляет основу миноносного флота ВМС США."
 USA_destroyer_2: "Тип «Симс»"
 USA_destroyer_2_desc: "Эсминцы типа «Симс» — самые большие среди 1500-тонных проектов, с более упорядоченным расположением торпед и более длинным корпусом. Улучшенная система управления огнем вместе с 5-дюймовыми орудиями и 12 торпедными аппаратами, расположенными по центру, значительно повысила атакующие возможности корабля."
 USA_destroyer_3: "Тип «Флетчер»"
 USA_destroyer_3_desc: "Тип «Флетчер» является большим шагом вперед в плане возможностей эсминца — в основном благодаря увеличению тоннажа до 2500 тонн. Сохранив 5-дюймовые спаренные орудия и центральное расположение торпед, корабли получили дополнительную орудийную башню и значительно усиленные батареи ПВО, а также увеличенную дальность хода и большее водоизмещение."
 USA_destroyer_4: "Тип «Аллен М. Самнер»"
 USA_destroyer_4_desc: "Тип «Самнер» является преемником типа «Флетчер» с немного увеличенным водоизмещением. Корабли этого типа оснащались спаренными 5-дюймовыми орудиями и более мощной батареей ПВО. Добавление второго руля позволило повысить маневренность во время противолодочных операций."
 USA_light_cruiser_1: "Тип «Омаха»"
 USA_light_cruiser_1_desc: "Крейсеры «Омаха» были спроектированы в период Первой мировой войны для разведывательных задач. Являясь быстрым и универсальным легким крейсером, «Омаха» была вооружена устрашающим комплектом 6-дюймовых орудий, расположенных в восьми одинарных и двух спаренных башнях. Хотя тип «Омаха» и устаревает, он все еще составляет основную часть флота легких крейсеров ВМС США."
 USA_light_cruiser_2: "Тип «Бруклин»"
 USA_light_cruiser_2_desc: "Тип «Бруклин» был спроектирован с учетом Вашингтонского морского соглашения. Для обеспечения максимальной огневой мощи он был оснащен пятнадцатью новыми 6-дюймовыми орудиями модели Mk 16 в трехорудийных башнях. Проект был признан очень удачным и хорошо сбалансированным и использовался как основа для всех последующих разработок крейсеров ВМС США."
 USA_light_cruiser_3: "Тип «Кливленд»"
 USA_light_cruiser_3_desc: "The Cleveland Class was based on the Brooklyn Class, but without the Washington Naval Treaty restrictions. The Cleveland Class keeps the 15 6" main gun arrangement, but increased its secondary 5" armament greatly and added additional AA weaponry." #NT!
 USA_light_cruiser_4: "Тип «Фарго»"
 USA_light_cruiser_4_desc: "Тип «Фарго» является доработанным вариантом успешного типа «Кливленд». «Фарго» обладал улучшенными секторами огня орудий ПВО благодаря пирамидальному дизайну надстройки."
 USA_heavy_cruiser_1: "Тип «Пенсакола»"
 USA_heavy_cruiser_1_desc: "Тип «Пенсакола» был спроектирован в рамках Вашингтонского морского соглашения и с целью максимизировать огневую мощь при ограничении калибра до 8 дюймов был вооружен десятью орудиями. Несмотря на слабое бронирование корпуса и связанную с этим некоторую неустойчивость, проект оказался эффективным и стал основой флота тяжелых крейсеров ВМС США."
 USA_heavy_cruiser_2: "Тип «Уичита»"
 USA_heavy_cruiser_2_desc: "Корабли типа «Уичита» имели улучшенное вооружение по сравнению с типом «Пенсакола» и его модификациями, обладая новой конструкцией башен для 8-дюймовых орудий и улучшенными секторами огня 5-дюймовых вспомогательных батарей."
 USA_heavy_cruiser_3: "Тип «Балтимор»"
 USA_heavy_cruiser_3_desc: "Тип «Балтимор» сочетает в себе все наиболее успешные элементы предыдущих проектов крейсеров. Он основан на конструкции легких крейсеров типа «Бруклин» в сочетании с вооружением и бронированием типа «Уичита»."
 USA_heavy_cruiser_4: "Тип «Орегон-Сити»"
 USA_heavy_cruiser_4_desc: "Тип крейсеров «Орегон-Сити» имеет множество улучшений разной степени по сравнению с типом «Балтимор». Наиболее заметна модификация надстройки, что улучшило секторы огня орудий ПВО. Часть улучшений аналогична модификациям легких крейсеров, начиная от «Кливлендов» и заканчивая «Орегон-Сити»."
 USA_battle_cruiser_1: "Тип «Лексингтон»"
 USA_battle_cruiser_1_desc: "Тип «Лексингтон» изначально был ответом на японские линкоры типа «Конго». Заказанные в рамках Военно-морского акта 1916 года корабли должны были нести спаренные 16-дюймовые орудия и развивать скорость в 33 узла. После начала строительства США подписали Вашингтонское военно-морское соглашение, и «Лексингтон» и «Саратога» были перестроены в авианосцы."
 USA_battle_cruiser_2: "Тип «Аляска»"
 USA_battle_cruiser_2_desc: "Тип «Аляска» разрабатывался в большей степени как ответ на немецкие «карманные линкоры», чем на японские «суперкрейсеры». Корабли этого типа должны были нести 12-дюймовые орудия и быть способными выдержать попадание 10-дюймового снаряда, а также развивали скорость, сопоставимую со скоростью крейсеров. Заметным недостатком было слабое бронирование ниже ватерлинии."
 USA_battleship_1: "Тип «Нью-Йорк»"
 USA_battleship_1_desc: "Линкоры типа «Нью-Йорк» стали первыми линкорами США, вооруженными 14-дюймовыми орудиями. Дополнительное вооружение состояло из множества 5-дюймовых орудий; толщина брони в некоторых местах превышала 10 дюймов."
 USA_battleship_2: "Тип «Норт Кэролайн»"
 USA_battleship_2_desc: "Тип «Норт Кэролайн» был сложен в разработке и стал первым линкором, построенным ВМС США в 20-х годах XX века. Требовалось, чтобы тип соответствовал требованиям Вашингтонского морского соглашения, которое ограничивало водоизмещение 36000 тонн, но в то же время нес 16-дюймовые орудия и улучшенную броню. Кроме того, новый линкор должен был быть способным сопровождать быстрые авианосцы ВМС США."
 USA_battleship_3: "Тип «Айова»"
 USA_battleship_3_desc: "Тип «Айова» сочетает в себе все новшества и возможности более раннего типа «Норт Кэролайн», но имеет значительно большие водоизмещение и скорость. Основная задача «Айовы» — сопровождение авианосцев, однако корабли имели возможность выполнять роль «охотников на крейсеры»."
 USA_battleship_4: "Тип «Иллинойс»"
 USA_battleship_4_desc: "Тип «Иллинойс» схож по конструкции и роли с типом «Айова». Как следствие, приоритет был отдан скорости и вооружению в ущерб броне. Вооружение типа «Иллинойс» было увеличено с 9 до 12 16-дюймовых орудий; кроме того, энергетические установки также были улучшены для достижения более высокой крейсерской скорости. Изначально проект, подобно типу «Монтана», включал четыре двухорудийных 6-дюймовых башни, но они были заменены 5-дюймовыми универсальными орудиями для усиления ПВО."
 USA_carrier_1: "Тип «Лексингтон»"
 USA_carrier_1_desc: "Авианосцы типа «Лексингтон» были созданы на основе двух корпусов линкоров одноименного типа, перестройка которых стала результатом ограничений, наложенных Вашингтонским морским соглашением. Это были первые действующие авианосцы в составе ВМС США; в настоящий момент их роль сводится к повышению эффективности авианесущих соединений."
 USA_carrier_2: "Тип «Рейнджер»"
 USA_carrier_2_desc: "Тип «Рейнджер» — первые корабли ВМС США, изначально спроектированные как авианосцы. В соответствии с концепцией малых авианосцев этот тип был гораздо меньше предыдущего, «Лексингтон», но нес на себе такое же количество авиации благодаря улучшенной конструкции."
 USA_carrier_3: "Тип «Эссекс»"
 USA_carrier_3_desc: "With the lessons learned from the preceding Lexington, Ranger and Yorktown variant classes, the result was the Essex Class, a fast ship able to carry a large compliment of planes into battle. Damage control designs would also be carried over from the Yorktown class and a deck edge elevator was included to improve plane handling." #NT!
 USA_carrier_4: "Тип «Мидуэй»"
 USA_carrier_4_desc: "Тип «Мидуэй» был вершиной развития авианосцев ВМС США. Имея бронированную палубу и больше самолетов, чем любой предыдущий тип, «Мидуэй» заслужил собственное уникальное обозначение подтипа — CVB («боевой авианосец»)."
 USA_SH_battleship_1: "Тип «Вирджиния»"
 USA_SH_battleship_1_desc: "В 1920 году было начато строительство больших линкоров типа «Саут Дакота», вооруженных 12 16-дюймовыми орудиями. Этот тип открыл бы новую эру больших линкоров, но был отменен в 1922 году из-за принятия Вашингтонского морского соглашения. После того как ограничения соглашения перестали действовать, а также ввиду угрозы со стороны секретных японских проектов линкоров, проект был модернизирован, увеличившись в водоизмещении до 55000 тонн, получил 18-дюймовые орудия и превратился в новый тип тяжелых линкоров."
 USA_SH_battleship_2: "Тип «Монтана»"
 USA_SH_battleship_2_desc: "Тип «Монтана» был больше и лучше бронирован, чем тип «Иллинойс», но дополнительная масса сказалась на скорости. Основное вооружение состоит из 12 18-дюймовых орудий; если учесть также новейшую систему управления огнем, то ни один корабль не может сравниться с «Монтаной» в огневой мощи. Изначальная схема предусматривала установку 6-дюймовых орудий, но они были заменены 5-дюймовыми универсальными орудиями, установленными попарно в башни."
