 # POR - Portugal 
 ####################################### 
 POR_submarine_1: "Тип «Фока»"
 POR_submarine_1_desc: "Португальский тип «Фока» состоял из трех малых подводных лодок, построенных Италией для ВМС Португалии сразу после Первой мировой войны. Они являлись увеличенным вариантом итальянского типа «Эспадарти» и были аналогичны испанскому типу «А». Лодки имели водоизмещение в 260 тонн и были вооружены двумя 450-мм торпедными аппаратами. Все три были списаны в середине 30-х годов."
 POR_submarine_2: "Тип «Дельфим»"
 POR_submarine_2_desc: "Тип «Дельфим» состоял из двух подводных лодок, изначально заказанных и заложенных в Италии для ВМС Португалии в начале 30-х годов ХХ века. Заказ был впоследствии отменен, и вместо этого лодки были переданы ВМС Италии. Проект основывался на больших итальянских лодках типа «Скуало» с водоизмещением в 980 тонн и вооружением из восьми 533-мм торпедных аппаратов."
 POR_submarine_4: "Тип «Нарвал»"
 POR_submarine_4_desc: "Тип «Нарвал» состоял из трех британских подводных лодок типа «Сател», принятых на вооружение в 1945 году и проданных Португалии после окончания Второй мировой войны. Их водоизмещение составляло 840 тонн, а вооружение состояло из семи 533-мм торпедных аппаратов."
 POR_destroyer_1: "Тип «Дору»"
 POR_destroyer_1_desc: "Тип «Дору» состоял из семи эсминцев, построенных в начале 30-х годов в Португалии и Британии. В 1934 году два корабля были проданы Колумбии. Их водоизмещение составляло более 1200 тонн, а вооружение состояло из четырех 4,7-дюймовых орудий и восьми 533-мм торпедных аппаратов."
  
 ####################################### 
 # PRU - Peru 
 ####################################### 
 PRU_submarine_1: "Тип «R»"
 PRU_submarine_1_desc: "Четыре подводные лодки типа «R» были построены США для ВМС Перу в середине 20-х годов. Они были практически идентичны американскому типу «R», имели водоизмещение более 570 тонн и вооружение из четырех 553-мм торпедных аппаратов."
 PRU_destroyer_1: "Тип «Альмиранте Виллар»"
 PRU_destroyer_1_desc: "«Альмиранте Виллар» и «Альмиранте Гиссе» ранее были российскими эсминцами типа «Новик». Прежде чем окольными путями добраться до ВМС Перу, они успели походить под флагами Великобритании и Эстонии. Эсминцы были вооружены четырьмя 102-мм орудиями и девятью 533-м торпедными аппаратами. Их водоизмещение составляло 1200 тонн, они были довольно быстрыми для своего размера и типа."
 PRU_light_cruiser_1: "Тип «Альмиранте Грау»"
 PRU_light_cruiser_1_desc: "Тип «Альмиранте Грау» состоял из двух легких крейсеров, построенных в Британии для ВМС Перу до Первой мировой войны и введенных в строй в 1903 году. Это были сравнительно небольшие корабли даже для легких крейсеров, и их скорость при этом оставляла желать лучшего. Крейсеры были легко бронированы, а их главное вооружение состояло из пары 152-мм орудий."
  
 ####################################### 
 # RAJ - British Raj 
 ####################################### 
 RAJ_submarine_1: "Тип «L»"
 RAJ_submarine_1_desc: "Тип «L» — лодки среднего размера, изначально спроектированные в рамках экстренной военной программы как улучшенные версии предшествующих типов. Они были построены ближе к концу Первой мировой войны и оборудованы новыми большими 21-дюймовыми торпедами. Оставались в строю до начала Второй мировой, после чего были переведены на вспомогательные и учебные задачи."
 RAJ_submarine_2: "Тип «T»"
 RAJ_submarine_2_desc: "Лодки типа «T», или «Трайтон», были разработаны для замены больших подлодок типов «O», «P» и «R». Они были умеренно большими, с большой дальностью, хорошо подготовленными для действий в Атлантическом и Тихом океанах. Тип «Т» оказался мощной и устойчивой платформой и широко использовался во время войны: 25% всех построенных лодок были потеряны в бою."
 RAJ_submarine_3: "Тип «U»"
 RAJ_submarine_3_desc: "Тип «U» — подводные лодки малого размера, построенные в рамках экстренных военных программ 1940 и 1941 годов. Изначально спроектированы как учебные подлодки, но после начала войны в конструкцию были внесены изменения, позволяющие им быть полезными в акваториях Северного и Средиземного морей. Этот тип состоял из трех подтипов: «Андин», «Ампайр» и «Апрор»."
 RAJ_submarine_4: "Тип «V»"
 RAJ_submarine_4_desc: "Подводные лодки типа «V», или «Вэмпайр», основывались на конструкции предыдущего типа «U». Они были больше, но все еще относительно малы и обладали лучшими мореходными качествами, но с ограниченными дальностью действия и вооружением."
 RAJ_destroyer_1: "Тип «V»/«W»"
 RAJ_destroyer_1_desc: "Эти эсминцы включали в себя типы «V» и «W» постройки Адмиралтейства и «Торникрофт», созданные в рамках экстренной военной программы. Новые типы являлись венцом эволюции британских эсминцев, воплощая в себе улучшения своих предшественников, а также новые технологические достижения. Большое количество этих кораблей было построено во время поздней стадии Первой мировой войны и стало впоследствии основой флотилий эсминцев Королевского флота. С 30-х годов XX века эсминцы были направлены в резервный флот и в конечном итоге переведены на эскорт конвоев. Типы «V» и «W» были солидно вооруженными быстрыми кораблями с хорошей дальностью действия."
 RAJ_destroyer_2: "Тип «G»/«H»/«I»"
 RAJ_destroyer_2_desc: "Эсминцы типов «G», «H» и «I» были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они представляли собой несколько уменьшенную в размере копию предыдущего типа «F». Вооружение на «G»- и «H»-типах было идентичным: оба использовали 4,7-дюймовые орудия. Эти корабли имели большую дальность действия, удовлетворительное вооружение и мощное торпедное оснащение. Они широко использовались в военное время и понесли заметные потери."
 RAJ_destroyer_3: "Тип «J»/«K»/«N»"
 RAJ_destroyer_3_desc: "Типы «J», «K» и «N» схожи с ранним типом «Трайбал», но вместо усиления орудийного вооружения конструкторы вернулись к более стандартной схеме с тяжелыми торпедами и легкими орудиями. За время службы в военный период корабли были модифицированы. Улучшения включали в себя усиленную систему ПВО и радар. Эти эсминцы отличались скоростью, дальностью действия и хорошим вооружением и идеально подходили для роли флотских эскортов."
 RAJ_destroyer_4: "Тип «Бэттл»"
 RAJ_destroyer_4_desc: "В эсминцах типа «Бэттл» представлено развитие британских эсминцев за годы войны. Корабли были заказаны в рамках военно-морской программы 1942 и 1943 годов. Они были хорошо вооружены как орудиями, так и торпедами. Это, а также скорость и дальность действия, сделали их достаточно универсальными кораблями, но позднее появление не позволило внести ощутимый вклад в победу."
 RAJ_light_cruiser_1: "Тип «С»"
 RAJ_light_cruiser_1_desc: "Двадцать восемь легких крейсеров типа «С» были построены до и во время Первой мировой войны для использования в суровых условиях Северного моря. Они оказались прочными и эффективными судами, несмотря на малый размер и тесные условия. Вооружение было более чем удовлетворительным: они несли достаточно 6-дюймовых орудий и большой запас торпед. Тип «С» активно использовался во время Первой мировой и принял участие во многих сражениях. Всего лишь три подтипа оставались в составе флота к середине 1930-х: «Каледон», «Серес» и «Карлайл»."
 RAJ_basic_light_cruiser: "Тип «Саутгемптон»"
 RAJ_light_cruiser_2: "Тип «Саутгемптон»"
 RAJ_light_cruiser_2_desc: "Легкие крейсеры типа «Саутгемптон» — подтип крейсеров «Таун» — были спроектированы для противодействия японским крейсерам типа «Могами». Они были хорошо бронированы, имели приличную скорость и дальность действия и несли грозное вооружение из двенадцати 6-дюймовых орудий в четырех тройных башнях. Тип «Саутгемптон» стал основой для многих последующих проектов легких крейсеров Королевского флота времен войны."
 RAJ_light_cruiser_3: "Тип «Уганда»"
 RAJ_light_cruiser_3_desc: "Легкие крейсеры типа «Уганда» были улучшенной версией более раннего типа «Таун», но с упрощенной конструкцией для ускорения производства и снижения стоимости. Корабли этого типа несли на себе то же вооружение, что и предшественники: 4 тройные башни, оборудованные 6-дюймовыми орудиями. Они были похожим образом бронированы, но из-за уменьшенной энергетической установки страдали от сниженной дальности действия. В этот тип входили два подтипа: «Фиджи» и «Цейлон»."
 RAJ_light_cruiser_4: "Тип «Минотавр»"
 RAJ_light_cruiser_4_desc: "Эти крейсеры, также известные как тип «Свифтшур», были спроектированы как улучшенная версия типа «Уганда» с учетом модификаций, утвержденных в 1941 году. Они имели большую дальность действия и больше установок ПВО, чем тип «Уганда», но основное вооружение было сокращено до трех трехорудийных башен. Большинство заказанных судов были впоследствии отменены, поскольку уже не могли повлиять на исход войны. "
 RAJ_heavy_cruiser_1: "Тип «Хокинс»"
 RAJ_heavy_cruiser_1_desc: "Крейсеры типа «Хокинс» стали первыми тяжелыми крейсерами в мире. Конструкция основывалась на более раннем типе «Таун», в частности, на подтипе «Бирмингем», однако обладала 7,5-дюймовыми орудиями и более толстым бронепоясом. Корабли проектировали для борьбы с большими германскими рейдерами; как следствие, они были хорошо вооружены, имели достаточную скорость и дальность плаванья и хорошую защиту. В общей сложности пять кораблей были введены в эксплуатацию, но только четыре оставались в строю на начало Второй мировой войны."
 RAJ_heavy_cruiser_2: "Тип «Суррей»"
 RAJ_heavy_cruiser_2_desc: "Тяжелые крейсеры типа «Суррей» были предложены в рамках военно-морской программы 1928 года. Они являлись улучшенной версией более ранних тяжелых крейсеров «Йорк». Если бы их строительство было завершено, они были бы оборудованы четырьмя двухорудийными башнями с 8-дюймовыми орудиями, более тяжелой броней и более мощной энергетической установкой. Два корабля были заказаны, но не один из них так и не был заложен."
 RAJ_heavy_cruiser_3: "Тип «Адмирал»"
 RAJ_heavy_cruiser_3_desc: "Тяжелые крейсеры типа «Адмирал» (не путать с линейными крейсерами типа «Адмирал») были последней попыткой Королевского флота спроектировать и построить крейсеры с 8-дюймовыми орудиями. Разработки проекта начались в 1938 и закончились в 1941 году. Окончательный вариант включал в себя новые 8-дюймовые орудия в тройных башнях, мощную систему ПВО, толстую броню и хорошую скорость. Отсутствие вражеских крейсеров и сравнительная дороговизна этих кораблей привели к отказу от проекта в пользу большего количества легких крейсеров."
 RAJ_heavy_cruiser_4: "Тип «Черчилль»"
 RAJ_heavy_cruiser_4_desc: "Проект этих кораблей был предложен сэром Уинстоном Черчиллем, лордом Адмиралтейства, на ранней стадии Второй мировой войны для противодействия германским крейсерам типа «Дойчланд». Эти корабли должны были иметь 9,2-дюймовые орудия, мощные орудия ПВО и крепкую броню. Они были спроектированы для эффективной борьбы с тяжелыми кораблями противника. В итоге проект был отменен из-за высокой стоимости и отсутствия необходимости в новых тяжелых крейсерах."
 RAJ_battle_cruiser_1: "Тип «Ринаун»"
 RAJ_battle_cruiser_1_desc: "Линейные крейсера типа «Ринаун» изначально были заложены как улучшенные версии типа «Ривендж». Их строительство было приостановлено в начале Первой мировой войны, но лорду Фишеру удалось возродить их в качестве линейных крейсеров. Эти корабли являлись образцовыми линейными крейсерами: они были хорошо вооружены, быстры и маневренны, но имели более слабое бронирование и меньшую дальность действия. Только два из трех кораблей, «Рипалс» и «Ринаун», были завершены."
 RAJ_battle_cruiser_2: "Тип «Принсесс Ройял»"
 RAJ_battle_cruiser_2_desc: "«Принсесс Ройял» — тип гипотетических линейных крейсеров, более быстрые и дешевые версии линкоров типа «Кинг Джордж V». Эти корабли несли на себе схожее, но ослабленное вооружение: два тройных 14-дюймовых орудия и шесть сдвоенных 5,25-дюймовых орудий ПВО. Высокая скорость и большая дальность действия крейсеров предоставила бы Королевскому флоту возможность наносить быстрые удары и охранять конвои, но их слабое вооружение стало бы проблемой, если бы им пришлось сражаться с современными линкорами."
 RAJ_battleship_1: "Тип «Ривендж»"
 RAJ_battleship_1_desc: "Линкоры класса «Ривендж» были заказаны в 1913 году и являлись удешевленным вариантом быстрых дредноутов класса «Куин Элизабет». Они напоминали исходный проект бронированием и вооружением, но были ощутимо медленнее и, как следствие, в период Второй мировой войны использовались на вторых ролях. Из 8 запланированных кораблей были достроены только 5."
 RAJ_battleship_2: "Тип «Кинг Джордж V»"
 RAJ_battleship_2_desc: "Линкоры типа «Кинг Джордж V» стали результатом Вашингтонского морского соглашения 1922 года и Первого лондонского морского договора 1930 года, которые ограничивали водоизмещение и вооружение крупных боевых кораблей. Как следствие, линкоры были оснащены орудиями меньшего калибра, чем более ранние образцы и даже современники. Несмотря на более скромный калибр, они были удовлетворительно вооружены в целом, отличались усиленной системой ПВО и достойным бронированием. Пять кораблей были заказаны и заложены как замена устаревших линкоров типа «Куин Элизабет»."
 RAJ_battleship_3: "Тип «Лайон»"
 RAJ_battleship_3_desc: "Линкоры типа «Лайон» были продолжением типа «Кинг Джордж V» и сочетали в себе многие из его особенностей. Шесть кораблей были заказаны в рамках военно-морской программы 1938 года для замены устаревших линкоров типа «Ривендж», но ни один из них не был закончен из-за начала военных действий. От типа «Кинг Джордж V» их отличало более мощное основное вооружение в виде 16-дюймовых орудий. Также они должны были обладать более толстой броней и более мощными энергетическими установками."
 RAJ_battleship_4: "Тип «Вэнгард»"
 RAJ_battleship_4_desc: "Линкоры типа «Вэнгард» были последними линкорами, построенными для Королевского флота. Был заказан только один корабль, но еще четыре рассматривались для Тихоокеанского театра военных действий. Заказанное в рамках экстренной военной программы 1940 года строительство не получило высокого приоритета и было завершено только после окончания войны. «Вэнгард» имел гладкий корпус, который обеспечивал ему отличную остойчивость и мореходность. Вооружение было таким же, как у типов «Куин Элизабет» и «Ривендж», что гарантировало значительную огневую мощь. Мощные энергетические установки и хорошая броня сделали их быстрыми и хорошо защищенными кораблями."
 RAJ_SH_battleship_1: "Тип «Центурион»"
 RAJ_SH_battleship_1_desc: "«Центурион» — гипотетический тип линкоров Королевского флота, построенный для противодействия крупным боевым кораблям Германии и Японии. Большие 18-дюймовые орудия и толстая броня обеспечивали этот корабль необходимой огневой мощью и защитой для сражения с противником. Сильная система ПВО, большая дальность действия и хорошая скорость были необходимы для защиты обширной акватории Британской империи."
 RAJ_SH_battleship_2: "Тип «Лайон-2»"
 RAJ_SH_battleship_2_desc: "Линкоры типа «Лайон-2» были разработаны в 1944 году как улучшенная версия более ранних линкоров типа «Лайон». Учитывая нужды военного времени, новый линкор был больше и тяжелее, и, если бы он был завершен, нес бы три или четыре трехорудийные 16-дюймовые башни последней модели. Толстые бронеплиты защищали корабль от любого надводного или воздушного противника. Стоимость постройки, а также поражение вражеских флотов и потребность в авианосцах привели к отмене проекта."
 RAJ_carrier_1: "Тип «Корейджес»"
 RAJ_carrier_1_desc: "Эти три корабля были перестроены из линкоров и стали первыми авианосцами Королевского флота. Их перестройка была следствием Вашингтонского морского соглашения 1922 года и завершилась в 1925 году. Они не могли похвастаться бронированием, зато обладали хорошим вооружением, большой дальностью действия и достойной скоростью. Но из-за особенностей конструкции их авианесущие способности были ограничены. Несмотря на это, они дали Королевскому флоту важный опыт в строительстве авианосцев и эксплуатации морской авиации."
 RAJ_carrier_2: "Тип «Арк Ройял»"
 RAJ_carrier_2_desc: "Авианосцы типа «Арк Ройял» были первыми кораблями, построенными в соответствии с Вашингтонским морским соглашением. Впервые была использована схема, при которой ангары и летная палуба стали неотъемлемой частью корпуса. Также они были хорошо вооружены и бронированы, несли большое число самолетов и имели достаточную дальность действия и скорость, чтобы следовать за основными силами Королевского флота."
 RAJ_carrier_3: "Тип «Илластриес»"
 RAJ_carrier_3_desc: "Тип «Илластриес» был разработан с учетом Второго лондонского морского договора 1936 года, который ограничивал водоизмещение авианосцев до 23000 тонн, и являлся первым британским авианосцем с бронированной летной палубой, что привело к сокращению размеров авиагруппы. Тяжелая броня и ПВО обеспечивали хорошую защиту корабля, а мощные энергетические установки и большой запас топлива — солидную дальность действия."
 RAJ_carrier_4: "Тип «Имплакабл»"
 RAJ_carrier_4_desc: "Авианосцы типа «Имплакабл» были заказаны в рамках военно-морской программы 1938 года и были улучшенной версией типа «Илластриес». Военные действия и смена приоритетов в сторону малых судов для защиты конвоев на ранней и средней стадии войны замедлили строительство. «Имплакабл» были большими судами, что позволяло нести больше самолетов, сохраняя толстую броню на корпусе и летной палубе. Более мощные двигатели давали им более высокую скорость и большую дальность действия в сравнении с типом «Илластриес»."
  
 ####################################### 
 # ROM - Romania 
 ####################################### 
 ROM_submarine_1: "Тип «Дэльфинул»"
 ROM_submarine_1_desc: "Румынская подводная лодка «Дэльфинул» была построена в Италии для ВМС Румынии в 1930 году, но на воду ее спустили только в 1936 году из-за разногласий по контракту между верфями и румынским правительством. Водоизмещение лодки составляло 650 тонн, а вооружение состояло из шести 533-мм торпедных аппаратов."
 ROM_submarine_3: "Тип «Рэкинул»"
 ROM_submarine_3_desc: "Подводные лодки «Рэкинул» и «Марсуинул» были построены Германией для своих румынских союзников в 1943 году на базе немецкого типа «Тип VII». Это были средние подлодки с водоизмещением в 600 тонн и вооружением, состоящим из шести 533-мм торпедных аппаратов."
 ROM_destroyer_1: "Тип «Марасти»"
 ROM_destroyer_1_desc: "Эсминцы типа «Марасти» были построены для Румынии во время Первой мировой войны. Четыре из них были реквизированы ВМС Италии, а еще два проданы Румынии в начале 20-х годов. Это были крупные эсминцы с водоизмещением более 1400 тонн и вооружением из четырех 120-мм орудий и четырех 450-мм торпедных аппаратов. Они имели среднюю скорость и надежность для своего типа."
  
 ####################################### 
 # SAF - Dominion of South Africa 
 ####################################### 
 SAF_submarine_1: "Тип «L»"
 SAF_submarine_1_desc: "Тип «L» — лодки среднего размера, изначально спроектированные в рамках экстренной военной программы как улучшенные версии предшествующих типов. Они были построены ближе к концу Первой мировой войны и оборудованы новыми большими 21-дюймовыми торпедами. Оставались в строю до начала Второй мировой, после чего были переведены на вспомогательные и учебные задачи."
 SAF_submarine_2: "Тип «T»"
 SAF_submarine_2_desc: "Лодки типа «T», или «Трайтон», были разработаны для замены больших подлодок типов «O», «P» и «R». Они были умеренно большими, с большой дальностью, хорошо подготовленными для действий в Атлантическом и Тихом океанах. Тип «Т» оказался мощной и устойчивой платформой и широко использовался во время войны: 25% всех построенных лодок были потеряны в бою."
 SAF_submarine_3: "Тип «U»"
 SAF_submarine_3_desc: "Тип «U» — подводные лодки малого размера, построенные в рамках экстренных военных программ 1940 и 1941 годов. Изначально спроектированы как учебные подлодки, но после начала войны в конструкцию были внесены изменения, позволяющие им быть полезными в акваториях Северного и Средиземного морей. Этот тип состоял из трех подтипов: «Андин», «Ампайр» и «Апрор»."
 SAF_submarine_4: "Тип «V»"
 SAF_submarine_4_desc: "Подводные лодки типа «V», или «Вэмпайр», основывались на конструкции предыдущего типа «U». Они были больше, но все еще относительно малы и обладали лучшими мореходными качествами, но с ограниченными дальностью действия и вооружением."
 SAF_destroyer_1: "Тип «V»/«W»"
 SAF_destroyer_1_desc: "Эти эсминцы включали в себя типы «V» и «W» постройки Адмиралтейства и «Торникрофт», созданные в рамках экстренной военной программы. Новые типы являлись венцом эволюции британских эсминцев, воплощая в себе улучшения своих предшественников, а также новые технологические достижения. Большое количество этих кораблей было построено во время поздней стадии Первой мировой войны и стало впоследствии основой флотилий эсминцев Королевского флота. С 30-х годов XX века эсминцы были направлены в резервный флот и в конечном итоге переведены на эскорт конвоев. Типы «V» и «W» были солидно вооруженными быстрыми кораблями с хорошей дальностью действия."
 SAF_destroyer_2: "Тип «G»/«H»/«I»"
 SAF_destroyer_2_desc: "Эсминцы типов «G», «H» и «I» были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они представляли собой несколько уменьшенную в размере копию предыдущего типа «F». Вооружение на «G»- и «H»-типах было идентичным: оба использовали 4,7-дюймовые орудия. Эти корабли имели большую дальность действия, удовлетворительное вооружение и мощное торпедное оснащение. Они широко использовались в военное время и понесли заметные потери."
 SAF_destroyer_3: "Тип «J»/«K»/«N»"
 SAF_destroyer_3_desc: "Типы «J», «K» и «N» схожи с ранним типом «Трайбал», но вместо усиления орудийного вооружения конструкторы вернулись к более стандартной схеме с тяжелыми торпедами и легкими орудиями. За время службы в военный период корабли были модифицированы. Улучшения включали в себя усиленную систему ПВО и радар. Эти эсминцы отличались скоростью, дальностью действия и хорошим вооружением и идеально подходили для роли флотских эскортов."
 SAF_destroyer_4: "Тип «Бэттл»"
 SAF_destroyer_4_desc: "В эсминцах типа «Бэттл» представлено развитие британских эсминцев за годы войны. Корабли были заказаны в рамках военно-морской программы 1942 и 1943 годов. Они были хорошо вооружены как орудиями, так и торпедами. Это, а также скорость и дальность действия, сделали их достаточно универсальными кораблями, но позднее появление не позволило внести ощутимый вклад в победу."
 SAF_light_cruiser_1: "Тип «С»"
 SAF_light_cruiser_1_desc: "Двадцать восемь легких крейсеров типа «С» были построены до и во время Первой мировой войны для использования в суровых условиях Северного моря. Они оказались прочными и эффективными судами, несмотря на малый размер и тесные условия. Вооружение было более чем удовлетворительным: они несли достаточно 6-дюймовых орудий и большой запас торпед. Тип «С» активно использовался во время Первой мировой и принял участие во многих сражениях. Всего лишь три подтипа оставались в составе флота к середине 1930-х: «Каледон», «Серес» и «Карлайл»."
 SAF_light_cruiser_2: "Тип «Саутгемптон»"
 SAF_light_cruiser_2_desc: "Легкие крейсеры типа «Саутгемптон» — подтип крейсеров «Таун» — были спроектированы для противодействия японским крейсерам типа «Могами». Они были хорошо бронированы, имели приличную скорость и дальность действия и несли грозное вооружение из двенадцати 6-дюймовых орудий в четырех тройных башнях. Тип «Саутгемптон» стал основой для многих последующих проектов легких крейсеров Королевского флота времен войны."
 SAF_light_cruiser_3: "Тип «Уганда»"
 SAF_light_cruiser_3_desc: "Легкие крейсеры типа «Уганда» были улучшенной версией более раннего типа «Таун», но с упрощенной конструкцией для ускорения производства и снижения стоимости. Корабли этого типа несли на себе то же вооружение, что и предшественники: 4 тройные башни, оборудованные 6-дюймовыми орудиями. Они были похожим образом бронированы, но из-за уменьшенной энергетической установки страдали от сниженной дальности действия. В этот тип входили два подтипа: «Фиджи» и «Цейлон»."
 SAF_light_cruiser_4: "Тип «Минотавр»"
 SAF_light_cruiser_4_desc: "Эти крейсеры, также известные как тип «Свифтшур», были спроектированы как улучшенная версия типа «Уганда» с учетом модификаций, утвержденных в 1941 году. Они имели большую дальность действия и больше установок ПВО, чем тип «Уганда», но основное вооружение было сокращено до трех трехорудийных башен. Большинство заказанных судов были впоследствии отменены, поскольку уже не могли повлиять на исход войны. "
 SAF_heavy_cruiser_1: "Тип «Хокинс»"
 SAF_heavy_cruiser_1_desc: "Крейсеры типа «Хокинс» стали первыми тяжелыми крейсерами в мире. Конструкция основывалась на более раннем типе «Таун», в частности, на подтипе «Бирмингем», однако обладала 7,5-дюймовыми орудиями и более толстым бронепоясом. Корабли проектировали для борьбы с большими германскими рейдерами; как следствие, они были хорошо вооружены, имели достаточную скорость и дальность плаванья и хорошую защиту. В общей сложности пять кораблей были введены в эксплуатацию, но только четыре оставались в строю на начало Второй мировой войны."
 SAF_heavy_cruiser_2: "Тип «Суррей»"
 SAF_heavy_cruiser_2_desc: "Тяжелые крейсеры типа «Суррей» были предложены в рамках военно-морской программы 1928 года. Они являлись улучшенной версией более ранних тяжелых крейсеров «Йорк». Если бы их строительство было завершено, они были бы оборудованы четырьмя двухорудийными башнями с 8-дюймовыми орудиями, более тяжелой броней и более мощной энергетической установкой. Два корабля были заказаны, но не один из них так и не был заложен."
 SAF_heavy_cruiser_3: "Тип «Адмирал»"
 SAF_heavy_cruiser_3_desc: "Тяжелые крейсеры типа «Адмирал» (не путать с линейными крейсерами типа «Адмирал») были последней попыткой Королевского флота спроектировать и построить крейсеры с 8-дюймовыми орудиями. Разработки проекта начались в 1938 и закончились в 1941 году. Окончательный вариант включал в себя новые 8-дюймовые орудия в тройных башнях, мощную систему ПВО, толстую броню и хорошую скорость. Отсутствие вражеских крейсеров и сравнительная дороговизна этих кораблей привели к отказу от проекта в пользу большего количества легких крейсеров."
 SAF_heavy_cruiser_4: "Тип «Черчилль»"
 SAF_heavy_cruiser_4_desc: "Проект этих кораблей был предложен сэром Уинстоном Черчиллем, лордом Адмиралтейства, на ранней стадии Второй мировой войны для противодействия германским крейсерам типа «Дойчланд». Эти корабли должны были иметь 9,2-дюймовые орудия, мощные орудия ПВО и крепкую броню. Они были спроектированы для эффективной борьбы с тяжелыми кораблями противника. В итоге проект был отменен из-за высокой стоимости и отсутствия необходимости в новых тяжелых крейсерах."
 SAF_battle_cruiser_1: "Тип «Ринаун»"
 SAF_battle_cruiser_1_desc: "Линейные крейсера типа «Ринаун» изначально были заложены как улучшенные версии типа «Ривендж». Их строительство было приостановлено в начале Первой мировой войны, но лорду Фишеру удалось возродить их в качестве линейных крейсеров. Эти корабли являлись образцовыми линейными крейсерами: они были хорошо вооружены, быстры и маневренны, но имели более слабое бронирование и меньшую дальность действия. Только два из трех кораблей, «Рипалс» и «Ринаун», были завершены."
 SAF_battle_cruiser_2: "Тип «Принсесс Ройял»"
 SAF_battle_cruiser_2_desc: "«Принсесс Ройял» — тип гипотетических линейных крейсеров, более быстрые и дешевые версии линкоров типа «Кинг Джордж V». Эти корабли несли на себе схожее, но ослабленное вооружение: два тройных 14-дюймовых орудия и шесть сдвоенных 5,25-дюймовых орудий ПВО. Высокая скорость и большая дальность действия крейсеров предоставила бы Королевскому флоту возможность наносить быстрые удары и охранять конвои, но их слабое вооружение стало бы проблемой, если бы им пришлось сражаться с современными линкорами."
 SAF_battleship_1: "Тип «Ривендж»"
 SAF_battleship_1_desc: "Линкоры класса «Ривендж» были заказаны в 1913 году и являлись удешевленным вариантом быстрых дредноутов класса «Куин Элизабет». Они напоминали исходный проект бронированием и вооружением, но были ощутимо медленнее и, как следствие, в период Второй мировой войны использовались на вторых ролях. Из 8 запланированных кораблей были достроены только 5."
 SAF_battleship_2: "Тип «Кинг Джордж V»"
 SAF_battleship_2_desc: "Линкоры типа «Кинг Джордж V» стали результатом Вашингтонского морского соглашения 1922 года и Первого лондонского морского договора 1930 года, которые ограничивали водоизмещение и вооружение крупных боевых кораблей. Как следствие, линкоры были оснащены орудиями меньшего калибра, чем более ранние образцы и даже современники. Несмотря на более скромный калибр, они были удовлетворительно вооружены в целом, отличались усиленной системой ПВО и достойным бронированием. Пять кораблей были заказаны и заложены как замена устаревших линкоров типа «Куин Элизабет»."
 SAF_battleship_3: "Тип «Лайон»"
 SAF_battleship_3_desc: "Линкоры типа «Лайон» были продолжением типа «Кинг Джордж V» и сочетали в себе многие из его особенностей. Шесть кораблей были заказаны в рамках военно-морской программы 1938 года для замены устаревших линкоров типа «Ривендж», но ни один из них не был закончен из-за начала военных действий. От типа «Кинг Джордж V» их отличало более мощное основное вооружение в виде 16-дюймовых орудий. Также они должны были обладать более толстой броней и более мощными энергетическими установками."
 SAF_battleship_4: "Тип «Вэнгард»"
 SAF_battleship_4_desc: "Линкоры типа «Вэнгард» были последними линкорами, построенными для Королевского флота. Был заказан только один корабль, но еще четыре рассматривались для Тихоокеанского театра военных действий. Заказанное в рамках экстренной военной программы 1940 года строительство не получило высокого приоритета и было завершено только после окончания войны. «Вэнгард» имел гладкий корпус, который обеспечивал ему отличную остойчивость и мореходность. Вооружение было таким же, как у типов «Куин Элизабет» и «Ривендж», что гарантировало значительную огневую мощь. Мощные энергетические установки и хорошая броня сделали их быстрыми и хорошо защищенными кораблями."
 SAF_SH_battleship_1: "Тип «Центурион»"
 SAF_SH_battleship_1_desc: "«Центурион» — гипотетический тип линкоров Королевского флота, построенный для противодействия крупным боевым кораблям Германии и Японии. Большие 18-дюймовые орудия и толстая броня обеспечивали этот корабль необходимой огневой мощью и защитой для сражения с противником. Сильная система ПВО, большая дальность действия и хорошая скорость были необходимы для защиты обширной акватории Британской империи."
 SAF_SH_battleship_2: "Тип «Лайон-2»"
 SAF_SH_battleship_2_desc: "Линкоры типа «Лайон-2» были разработаны в 1944 году как улучшенная версия более ранних линкоров типа «Лайон». Учитывая нужды военного времени, новый линкор был больше и тяжелее, и, если бы он был завершен, нес бы три или четыре трехорудийные 16-дюймовые башни последней модели. Толстые бронеплиты защищали корабль от любого надводного или воздушного противника. Стоимость постройки, а также поражение вражеских флотов и потребность в авианосцах привели к отмене проекта."
 SAF_carrier_1: "Тип «Корейджес»"
 SAF_carrier_1_desc: "Эти три корабля были перестроены из линкоров и стали первыми авианосцами Королевского флота. Их перестройка была следствием Вашингтонского морского соглашения 1922 года и завершилась в 1925 году. Они не могли похвастаться бронированием, зато обладали хорошим вооружением, большой дальностью действия и достойной скоростью. Но из-за особенностей конструкции их авианесущие способности были ограничены. Несмотря на это, они дали Королевскому флоту важный опыт в строительстве авианосцев и эксплуатации морской авиации."
 SAF_carrier_2: "Тип «Арк Ройял»"
 SAF_carrier_2_desc: "Авианосцы типа «Арк Ройял» были первыми кораблями, построенными в соответствии с Вашингтонским морским соглашением. Впервые была использована схема, при которой ангары и летная палуба стали неотъемлемой частью корпуса. Также они были хорошо вооружены и бронированы, несли большое число самолетов и имели достаточную дальность действия и скорость, чтобы следовать за основными силами Королевского флота."
 SAF_carrier_3: "Тип «Илластриес»"
 SAF_carrier_3_desc: "Тип «Илластриес» был разработан с учетом Второго лондонского морского договора 1936 года, который ограничивал водоизмещение авианосцев до 23000 тонн, и являлся первым британским авианосцем с бронированной летной палубой, что привело к сокращению размеров авиагруппы. Тяжелая броня и ПВО обеспечивали хорошую защиту корабля, а мощные энергетические установки и большой запас топлива — солидную дальность действия."
 SAF_carrier_4: "Тип «Имплакабл»"
 SAF_carrier_4_desc: "Авианосцы типа «Имплакабл» были заказаны в рамках военно-морской программы 1938 года и были улучшенной версией типа «Илластриес». Военные действия и смена приоритетов в сторону малых судов для защиты конвоев на ранней и средней стадии войны замедлили строительство. «Имплакабл» были большими судами, что позволяло нести больше самолетов, сохраняя толстую броню на корпусе и летной палубе. Более мощные двигатели давали им более высокую скорость и большую дальность действия в сравнении с типом «Илластриес»."
  
 ####################################### 
 # SIA - Kingdom of Siam 
 ####################################### 
 SIA_submarine_2: "Тип «Вилун»"
 SIA_submarine_2_desc: "Тип «Вилун» — малые береговые подлодки, построенные в Японии для ВМС Таиланда в 1936-1938 гг. Их водоизмещение составляло 370 тонн, а вооружение состояло из пяти 533-мм торпедных аппаратов."
 SIA_destroyer_1: "Тип «Пхра Руанг»"
 SIA_destroyer_1_desc: "«Пхра Руанг» — бывший британский эсминец типа «R», проданный ВМС Таиланда в 1920 году. Водоизмещение составляло чуть более 1000 тонн, а вооружение состояло из трех 120-мм орудий и четырех 533-мм торпедных аппаратов. Эсминец отличался хорошими скоростью, дальностью действия и надежностью для своего типа."
 SIA_light_cruiser_3: "Тип «Таскин»"
 SIA_light_cruiser_3_desc: "Тип «Таскин» состоял из двух легких крейсеров, построенных в Италии в 1941 году. Корабли были реквизированы Италией в 1942 году для переделки в крейсеры типа «Этна», но строительство так и не было завершено. Крейсеры должны были иметь водоизмещение в 5900 тонн и нести вооружение из шести 152-мм орудий, а также обладать мощной броней, но низкой для своего типа скоростью."
 SIA_heavy_cruiser_1: "Тип «Шри Аюти»"
 SIA_heavy_cruiser_1_desc: "Корабли береговой обороны типа «Шри Аюти» были, возможно, последними кораблями этого типа в мире. Оба были построены в Японии и введены в строй ВМС Таиланда в 1938 году. Проект был сопоставим по размерам с маленьким крейсером (или большим эсминцем), по скорости — с линкором и по вооружению — с тяжелым крейсером. Его главная батарея состояла из четырех 203-мм орудий. Корабли были легко бронированы в сравнении с тяжелыми крейсерами своей эпохи."
  
 ####################################### 
 # SOV - Soviet Union 
 ####################################### 
 SOV_submarine_1: "Тип «АГ»"
 SOV_submarine_1_desc: "Подлодки типа «Американский Голланд» строились в Канаде и были переправлены в Россию, где их дособирали окончательно. Они представляли собой полные копии успешного британского типа «Холланд» и обладали хорошим вооружением для своего времени, хотя по сравнению с современными лодками заметно устарели."
 SOV_submarine_2: "«Щука», серия V"
 SOV_submarine_2_desc: "Подводные лодки серии V типа «Щука» — вторые по численности подводные лодки ВМФ СССР. Благодаря их количеству им довелось послужить в составе четырех флотов: Черноморского, Балтийского, Северного и Тихоокеанского. «Щуки» — подлодки среднего размера с хорошим торпедным вооружением и мореходностью."
 SOV_submarine_3: "Тип «К», серия XIV"
 SOV_submarine_3_desc: "«К» серии XIV — большие крейсерские лодки с увеличенной дальностью действия. По сути, являются улучшенной версией серии IV типа «Правда». Подлодки обладали тяжелым вооружением — как пушечным, так и торпедным, — большим радиусом действия и при этом лишь средней мореходностью."
 SOV_submarine_4: "Проект 611"
 SOV_submarine_4_desc: "Подводные лодки проекта 611 («Zulu» по типификации НАТО) были первыми подлодками ВМФ СССР, построенными после Второй мировой войны. Проект основывался на немецких лодках типа XXI и предназначался для замены более старых лодок серии XIV типа «К». Новые тяжелые океанские подлодки имели мощное торпедное вооружение и большую дальность хода. Они послужили основой для новых подлодок проекта 613 («Whiskey» по типификации НАТО) и проекта 641 («Foxtrot» по типификации НАТО)."
 SOV_destroyer_1: "Тип «Орфей»"
 SOV_destroyer_1_desc: "Эсминцы типа «Орфей» — улучшенная версия предыдущего типа «Новик». Они оснащены пушечным и зенитным вооружением, соответствующим их размерам, имеют невысокую дальность действия, но хорошую скорость и мощное торпедное вооружение. Последующие типы «Фидониси» и «Изяслав» были улучшенной версией «Орфея» с усиленным вооружением главного калибра и увеличенным корпусом."
 SOV_destroyer_2: "Тип «Гневный»"
 SOV_destroyer_2_desc: "Эсминцы типа «Гневный» (проект 7) были запущены в серию в рамках судостроительной программы 1933-1938 годов. «Гневный» создавался под сильным влиянием итальянского эсминца «Маэстрале» и был признан успешным проектом. Его водоизмещение было в пределах 1600-2000 тонн, также эсминец имел приличное торпедное и зенитное вооружение. Благодаря мощной энергетической установке он обладал высокой скоростью, но дальность действия оставляла желать лучшего."
 SOV_destroyer_3: "Тип «Сообразительный»"
 SOV_destroyer_3_desc: "«Сообразительный» (проект 7-У) — улучшенная версия предыдущего типа «Гневный», получившая новый, более мощный двигатель и усиленное вооружение ПВО. Водоизмещение увеличилось до 1900-2400 тонн, скорость и радиус действия остались прежними."
 SOV_destroyer_4: "Тип «Скорый»"
 SOV_destroyer_4_desc: "Эсминцы типа «Скорый» (проект 30-бис) являются дальнейшим развитием типа «Огневой». В результате увеличения размеров и водоизмещения (2500-3100 тонн) на свет появились более стабильные корабли с большим радиусом действия. Все эсминцы были созданы после войны с использованием модульной конструкции, что сократило время постройки и ремонта. Вооружение по сравнению с «Огневым» не изменилось, но орудия главного калибра были размещены в спаренных, а не в одинарных башнях."
 SOV_light_cruiser_1: "Тип «Красный Крым»"
 SOV_light_cruiser_1_desc: "Тип крейсеров «Красный Крым» изначально носил имя «Светлана». Строительство первого крейсера «Светлана» началось перед Первой мировой, но из-за войны и последующей революции работа над всем типом была отложена. Позже, в середине 20-х годов, корабль был введен в состав ВМФ СССР вместе с однотипником «Червона Украина» (бывший «Адмирал Нахимов»). Они могли бы стать первыми крейсерами Российского императорского флота с турбинными двигателями. Крейсеры были хорошо вооружены и тяжело бронированы для своего времени."
 SOV_light_cruiser_2: "Тип «Комсомолец»"
 SOV_light_cruiser_2_desc: "«Комсомолец» — тип гипотетических легких крейсеров, гибрид старых и новых технологий. Использование незавершенных корпусов типов «Светлана» и «Адмирал Нахимов» позволило снизить стоимость строительства. Крейсера, оборудованные шестью двухорудийными башнями меньшего, сходного с эсминцами, калибра и солидным вооружением ПВО, подходили для разведки и роли лидера эсминцев. Внешний вид кораблей был схож с крейсерами типа «Киров»."
 SOV_light_cruiser_3: "Тип «Чапаев»"
 SOV_light_cruiser_3_desc: "Крейсеры «Чапаев» (проект 68) — дальнейшее развитие типа «Киров» (проект 26). Были заказаны в рамках судостроительной программы 1938-43 гг. Первые настоящие легкие крейсеры ВМФ СССР несли мощное пушечное и зенитное, а также адекватное торпедное вооружение. В целом тип представлял собой удачные корабли с толстым бронепоясом, высокой скоростью, хорошей дальностью действия и водоизмещением 10500-14000 тонн. Из-за войны и вторжения немецких войск многие корабли этого типа пришлось отменить, а оставшиеся были достроены уже после завершения военных действий."
 SOV_light_cruiser_4: "Тип «Свердлов»"
 SOV_light_cruiser_4_desc: "Тип «Свердлов» (проект 68-бис) — последние орудийные крейсеры ВМФ СССР, являющиеся улучшенной версией предыдущего типа «Чапаев». По сравнению с «Чапаевым», они имеют такие же вооружение главного калибра, силовую установку и бронирование, но больший запас топлива для увеличения радиуса действия, улучшенную противоторпедную защиту, усиленные батареи ПВО и чуть лучшую мореходность. Они были созданы для охоты на конвои и сопровождения крупных кораблей. Из-за наступления эры ракетного вооружения большинство из этих кораблей было отменено или не достроено."
 SOV_heavy_cruiser_1: "Тип «Красный Кавказ»"
 SOV_heavy_cruiser_1_desc: "Крейсер «Красный Кавказ» изначально был легким крейсером «Адмирал Лазарев» типа «Адмирал Нахимов» и повторил судьбу своего однотипника, «Червоны Украины». «Красный Кавказ» был завершен с изменением конструкции, получив 180-мм орудия главного калибра и усиленную систему ПВО. Поскольку он был перестроен из легкого крейсера, его броня тоньше, чем у тяжелых крейсеров других ВМС."
 SOV_heavy_cruiser_2: "Тип «Киров»"
 SOV_heavy_cruiser_2_desc: "Тип «Киров» — первые современные крейсеры ВМФ СССР. Проект основывался на типе итальянских легких крейсеров «Раймондо Монтекукколи» и был построен в рамках судостроительной программы 1933-1938 гг. Водоизмещение корабля составляло порядка 7700-9900 тонн, вооружение состояло из новых 180-мм орудий в трех трехорудийных башнях и сильной батареи ПВО. Мощная силовая установка обеспечивала хорошую скорость, но при этом средний радиус действия; бронепояс был тоньше по сравнению с другими тяжелыми крейсерами."
 SOV_heavy_cruiser_3: "Проект 22"
 SOV_heavy_cruiser_3_desc: "Тяжелые крейсеры проекта 22 были разработаны в середине 30-х годов для противодействия однотипникам соседних держав. По проекту получался корабль большого размера — с водоизмещением в 15500-17000 тонн, оборудованный четырьмя трехорудийными 240-мм башнями для боя с вражескими крейсерами, мощной зенитной батареей для самозащиты и гидросамолетом-разведчиком для поиска врага. Основные задачи включали в себя перехват вражеских кораблей и охоту на конвои. Высокая стоимость кораблей и ограниченность ресурсов привели к отмене проекта."
 SOV_heavy_cruiser_4: "Проект 66"
 SOV_heavy_cruiser_4_desc: "Тяжелые крейсеры проекта 66 — последняя попытка ВМФ СССР создать полностью орудийный крейсер. Разработка проекта была начата в 1943 году, а финальная версия появилась уже после окончания войны. Корабль нес 220-мм орудия в трех трехорудийных башнях и сильную систему ПВО. Водоизмещение было не меньше 26500 тонн. Наступление ракетной эпохи и смерть Сталина привели к закрытию проекта."
 SOV_battle_cruiser_1: "Тип «Бородино»"
 SOV_battle_cruiser_1_desc: "Тип линкоров «Бородино» состоял из четырех кораблей, заказанных в 1914 году незадолго до начала Первой мировой войны, и был разработан на основе линкоров «Императрица Мария». В соответствии с принятыми схемами конструкции больших кораблей, линкор имел 4 трехорудийные башни главного калибра, мощное дополнительное вооружение в казематах, плоскую палубу и низкий профиль с небольшой осадкой для сражений в мелких водах Балтийского моря. Как и многие другие русские корабли этого периода, линкоры не были закончены из-за начала Первой мировой войны и последующей Октябрьской революции."
 SOV_battle_cruiser_2: "Тип «Кронштадт»"
 SOV_battle_cruiser_2_desc: "Линкоры типа «Кронштадт» (проект 69) были заказаны в рамках судостроительной программы 1938-43 годов. Их строительство планировалось завершить в 40-х годах. Изначально проект планировался как большой тяжелый крейсер тоннажем в 23000 тонн, но после получения данных о немецких линейных крейсерах типа «Шарнхорст» проект был изменен, чтобы не уступать этим кораблям, и водоизмещение было увеличено до 35000 тонн. После начала военных действий между Германией и СССР строительство кораблей было заморожено и впоследствии отменено. В дальнейшем планировалось достроить незаконченные корпуса как авианосцы проекта 69АВ."
 SOV_battleship_1: "Тип «Марат»"
 SOV_battleship_1_desc: "Линкоры типа «Марат» (изначально «Гангут») являются кораблями эпохи Первой мировой войны и первыми дредноутами на службе Российского императорского флота. Их конструкция и расположение башен использовались во всех последующих типах линкоров и линейных крейсеров. Только три корабля пережили хаос революции. Они были модернизированы и заново введены в строй в 30-х годах с высокой, похожей на пагоду надстройкой, современной электроникой и новыми зенитными батареями."
 SOV_battleship_2: "Проект 21"
 SOV_battleship_2_desc: "Линкоры проекта 21 были разработаны в середине 30-х годов для океанского флота и были очень схожи с британскими линкорами типа «Нельсон». Они имели водоизмещение около 41000 тонн, были вооружены девятью 406-мм орудиями в трех трехорудийных башнях, направленных вперед, а также дополнительным вооружением из четырех строенных 152-мм орудий. Хорошее зенитное вооружение и толстая броня предоставляли надежную защиту от надводных и воздушных целей. Проект был отменен, но некоторые его элементы использовались в линкорах типа «Советский Союз» (проект 23)."
 SOV_battleship_3: "Тип «Ленин»"
 SOV_battleship_3_desc: "Тип линкоров «Ленин» — гипотетический проект, аналогичный немецким и американским линкорам типов «Бисмарк» и «Саут Дакота». Девять орудий 406-мм калибра в трех башнях обеспечивают необходимую огневую мощь для борьбы с этими кораблями, в то время как 130-мм орудия ПВО, толстая броня и крупная энергетическая установка обеспечивают выживание в бою."
 SOV_battleship_4: "Тип «Сталинград»"
 SOV_battleship_4_desc: "Линкоры типа «Сталинград» могли быть основой огневой мощи ВМФ СССР в послевоенную эпоху. Они были быстрыми, хорошо вооруженными и бронированными кораблями. Их строительство началось после войны, но смерть Сталина привела к его отмене. Существовали проекты завершения как минимум одного из них в модифицированном виде носителя советских ракет типа V-2."
 SOV_SH_battleship_1: "Тип «Советский Союз»"
 SOV_SH_battleship_1_desc: "«Советский Союз» (проект 23) — последние линкоры, построенные советскими верфями и одобренные в рамках судостроительной программы 1938-43 годов. Были запланированы четыре корабля с водоизмещением в 59000 тонн, тремя трехорудийными башнями с 405-мм орудиями, мощными дополнительными и зенитными батареями. Чтобы нести очень толстый броневой пояс, требовалась очень мощная энергетическая установка. Строительство не было завершено из-за начавшейся войны."
 SOV_SH_battleship_2: "Проект 23-бис"
 SOV_SH_battleship_2_desc: "Линкоры типа «Проект 23-бис» — улучшенная версия предыдущего типа «Советский Союз» (проект 23). От своих предшественников они отличались четырьмя трехорудийными башнями того же 406-мм калибра, более мощным броневым поясом, измененной схемой расположения дополнительных орудий и усиленной батареей ПВО."
 SOV_carrier_1: "Тип «Измаил»"
 SOV_carrier_1_desc: "Авианосец типа «Измаил» был перестроен из незавершенного корпуса своего тезки, линейного крейсера типа «Бородино». В результате для своего времени корабль имел толстый броневой пояс и мощное пушечное и зенитное вооружение. Авиагруппа среднего размера была в состоянии обеспечить флоту необходимое воздушное прикрытие. Проект не был осуществлен из-за высокой стоимости и состояния советской судостроительной отрасли после Октябрьской революции."
 SOV_carrier_2: "«Красный воздух»"
 SOV_carrier_2_desc: "Авианосцы типа «Красный Воздух» — гипотетический советский проект для воздушной защиты флота. Они схожи по размеру с британским типом «Арк Роял» или японским «Хирю», несут дополнительные орудия для борьбы с надводными целями и достойную систему ПВО. Увеличение брони привело к небольшому уменьшению размера авиагрупп по сравнению с упомянутыми типами."
 SOV_carrier_3: "Проект 71Б"
 SOV_carrier_3_desc: "Авианосцы проекта 71Б были спроектированы во второй половине 30-х годов и должны были обеспечивать воздушное прикрытие нового надводного флота, заказанного по плану Сталина. Было запланировано строительство двух кораблей с водоизмещением в 30000 тонн, сильным вооружением ПВО, хорошей броней и адекватным размером авиагруппы. Немецкое вторжение поставило крест на строительстве этих кораблей."
 SOV_carrier_4: "Проект 72"
 SOV_carrier_4_desc: "Авианосцы проекта 72 — улучшенная версия предыдущего проекта 71. Разработка была завершена в начале 40-х годов — в результате на свет появился более крупный корабль с более тонкой броней. Дополнительное свободное пространство было использовано для установки мощной системы ПВО и увеличения размера авиагрупп."
  
 ####################################### 
 # SPA - Anarchist Spain 
 ####################################### 
 SPA_submarine_1: "Тип «В»"
 SPA_submarine_1_desc: "Тип «B» состоял из шести подводных лодок, построенных Испанией для своих ВМС в 1922-1925 гг. Они были спроектированы как однокорпусные корабли, и, следовательно, их надежность оставляла желать лучшего. Это были подводные лодки среднего размера с водоизмещением около 550 тонн. Вооружение состояло из четырех 450-мм торпедных аппаратов."
 SPA_submarine_2: "Тип «Хенераль Мола»"
 SPA_submarine_2_desc: "The General Mola class was a class of four Italian Archimedes-class submarines commissioned in 1934 and transferred to the Nationalists in 1937. They were fairly large, displacing 880 tons, yet faster than most subs. They were armed with eight 533mm torpedo tubes and had a diving depth of 90m." #NT!
 SPA_submarine_3: "Тип «G»"
 SPA_submarine_3_desc: "Испанский тип «G» представлял собой две немецкие подлодки типа «Тип VIIC», построенных Испанией по лицензии. Лишь одна лодка была завершена, но и та вошла в состав ВМС Испании лишь в 1947 году. Водоизмещение составляло 770 тонн, а вооружение состояло из пяти 533-мм торпедных аппаратов. Лодки обладали отличной скоростью и дальностью действия."
 SPA_submarine_4: "Тип «D»"
 SPA_submarine_4_desc: "Три испанские подводные лодки типа «D» были спущены на воду в 1944 году и введены в строй уже после войны. Все три были спроектированы и построены в Испании. Это были крупные океанские подлодки с водоизмещением в 1050 тонн, отличной скоростью и радиусом действия. Их вооружение состояло из шести 533-мм торпедных аппаратов."
 SPA_destroyer_1: "Тип «Альседо»"
 SPA_destroyer_1_desc: "Три эсминца типа «Альседо» были построены Испанией для своих ВМС на основе британского типа «L» и введены в строй в 1924-1925 гг. Их водоизмещение составляло 1040 тонн, а вооружение состояло из трех 102-мм орудий и четырех 450-мм торпедных аппаратов. Также они имели отличную скорость и радиус действия для своего типа."
 SPA_destroyer_2: "Тип «Чуррука»"
 SPA_destroyer_2_desc: "Испанский тип «Чуррука» состоял из шестнадцати эсминцев, построенных в 1925-1933 годах и составлявших основу ВМС Испании в период гражданской войны (позже два эсминца были проданы Аргентине). Проект этих кораблей основывался на британском типе эсминцев «S», их водоизмещение составляло более 1500 тонн, а вооружение состояло из пяти 120-мм орудий и шести 533-мм торпедных аппаратов. Эсминцы обладали хорошей скоростью и отличным радиусом действия."
 SPA_destroyer_4: "Тип «Алава»"
 SPA_destroyer_4_desc: "Эсминцы типа «Алава» были построены после войны как усовершенствование предыдущего типа «Альмиранте Антекера» (подтипа более раннего типа «Чуррука»). Водоизмещение эсминцев составляло 1710 тонн, а вооружение состояло из четырех 120-мм орудий. Их скорость и дальность действия были сравнимы с более ранними типами, которые легли в основу проекта."
 SPA_light_cruiser_1: "Тип «Мендес Нуньес»"
 SPA_light_cruiser_1_desc: "Тип «Мендес Нуньес» состоял из двух легких крейсеров, построенных Испанией для своих ВМС в начале 20-х годов ХХ века. Корабли были заказаны в 1915 году, но нехватка материалов во время Первой мировой войны сказалась на сроках строительства. Крейсеры обладали водоизмещением в 4800 тонн, хорошей броней и сравнительно небольшой скоростью. Главное вооружение состояло из шести 152-мм орудий и дюжины 533-мм торпедных аппаратов."
 SPA_heavy_cruiser_1: "Тип «Принцесса де Астуриас»"
 SPA_heavy_cruiser_1_desc: "Тип «Принцесса де Астуриас» состоял из трех броненосных крейсеров, построенных для ВМС Испании в начале века. Уже к середине 30-х годов все три были сданы на лом или уничтожены. Крейсеры были вооружены сдвоенными 240-мм орудиями и восемью 140-мм орудиями. Из-за тяжелого бронирования их скорость была ниже, чем у тяжелых крейсеров своей эпохи."
 SPA_heavy_cruiser_2: "Тип «Канариас»"
 SPA_heavy_cruiser_2_desc: "Два тяжелых крейсера типа «Канариас» были построены в соответствии с требованиями Вашингтонского морского соглашения. Они были спущены на воду в начале 30-х годов, но достроены только в 1936 году. Крейсеры обладали водоизмещением в 10700 тонн и хорошей скоростью. Также они были сравнительно легко бронированы, но несли восемь 203-мм орудий."
 SPA_battleship_1: "Тип «Эспанья»"
 SPA_battleship_1_desc: "Тип «Эспанья» изначально состоял из трех дредноутов, введенных в строй во время Первой мировой войны, однако к началу гражданской войны в Испании один из них потерпел крушение, а два оставшихся корабля были потеряны во время войны. Эти корабли были сравнительно небольшими для линкоров, с водоизмещением всего в 15400 тонн, обладая при этом отличной броней и скоростью. Основное вооружение состояло из восьми 305-мм орудий."
  
 ####################################### 
 # SPF - Nationalist Spain 
 ####################################### 
 SPF_submarine_1: "B Class" #NT!
 SPF_submarine_1_desc: "The B class were the first submarines built within Spain for the Spanish Navy. The six ships of the class were commissioned between 1922 and 1925. They were designed as single-hulled ships, and consequently their reliability was subpar. They were medium-sized submarines, displacing over 550 tons. They were armed with four 450mm torpedo tubes." #NT!
 SPF_submarine_2: "General Mola Class" #NT!
 SPF_submarine_2_desc: "The General Mola class was a class of four Italian Archimedes-class submarines commissioned in 1934 and transferred to the Nationalists in 1937. They were fairly large, displacing 880 tons, yet faster than most subs. They were armed with eight 533mm torpedo tubes and had a diving depth of 90m." #NT!
 SPF_submarine_3: "G Class" #NT!
 SPF_submarine_3_desc: "The Spanish G-class submarines were a pair of German VIIC-class submarines licensed-built by Nationalist Spain. Only one was ever completed, however, and was not transferred to the Spanish Navy until 1947. The subs displaced 770 tons and were armed with five 533mm torpedo tubes. They had excellent speed and range, as the Type VIICs were the workhorse of the German submarine fleet." #NT!
 SPF_submarine_4: "D Class" #NT!
 SPF_submarine_4_desc: "The three submarines of the Spanish D class were all launched in 1944 and commissioned at various times after the war. All three were designed and built in Spain. They were large, oceangoing submarines, displacing 1,050 tons. They were armed with six 533mm torpedo tubes and had excellent speed and range." #NT!
 SPF_destroyer_1: "Alsedo Class" #NT!
 SPF_destroyer_1_desc: "The three destroyers of the Alsedo class were built for the Spanish Navy in Spain. They were based on the British L-class design, and were commissioned between 1924 and 1925. They displaced over 1,040 tons and had three 102mm/45 Vickers Mk LA guns as their main armament, as well as four 450mm torpedo tubes. They had decent speed and range for their vintage as well." #NT!
 SPF_destroyer_2: "Churruca Class" #NT!
 SPF_destroyer_2_desc: "The Spanish Churruca class included sixteen destroyers launched between 1925 and 1933, two of which were later sold to Argentina. The ships were designed based on the British S-class destroyers and made up the backbone of the Spanish Navy during the Civil War. They displaced over 1,500 tons and were armed with five 120mm/45 Vickers-Armstrong guns in their main armament, as well as six 533mm torpedo tubes. They had good speed and excellent range. " #NT!
 SPF_destroyer_4: "Álava Class" #NT!
 SPF_destroyer_4_desc: "The Álava-class destroyers were launched postwar as upgrades to the previous Almirante Antequera class (which was a subclass of the earlier Churruca class). They displaced 1,710 tons and had four 120mm/45 Vickers-Armstrong Mk Fs as their main guns. Their speed and range were comparable to the earlier designs that the class built upon." #NT!
 SPF_light_cruiser_1: "Méndez Núñes Class" #NT!
 SPF_light_cruiser_1_desc: "The Méndez Núñes-class light cruisers were a pair of cruisers built within Spain for the Spanish Navy in the early 1920s. The ships were ordered in 1915 but materials shortages during World War I delayed construction. The design was heavily influenced by the British C-class cruisers. The cruisers displaced nearly 4,800 tons but was relatively slow. Its main armament consisted of six 152mm/50 Vickers Mk V guns. It also had good armor and a dozen 533mm torpedo tubes." #NT!
 SPF_heavy_cruiser_1: "Princesa de Asturias Class" #NT!
 SPF_heavy_cruiser_1_desc: "The Princesa de Asturias class consisted of three armored cruisers built for the Spanish Navy around the turn of the century. All three had been either scrapped or wrecked by the mid-1930s. They were armed with twin 240mm Guillén M1896 and eight 140mm/33 Schneider-Canet guns. They were heavily armored but also somewhat slow compared to a standard heavy cruiser." #NT!
 SPF_heavy_cruiser_2: "Canarias Class" #NT!
 SPF_heavy_cruiser_2_desc: "The two heavy cruisers of the Canarias class were built to the specifications of the Washington Naval treay. They were launched in the early 1930s but not completed until 1936. They displaced nearly 10,700 tons and had good speed. They were relatively lightly armored but sported eight 203mm/50 Vickers-Armstrong Mk D guns as their main armament." #NT!
 SPF_battleship_1: "España Class" #NT!
 SPF_battleship_1_desc: "The España class was originally a class of three dreadnought battleships that were commissioned around the time of World War I, though one had wrecked by the time of the Spanish Civil War. The other two were lost during the war. They were fairly small for a battleship, displacing just over 15,400 tons. They had decent armor and decent speed, however, and had a main battery of eight 305mm/50 Vickers H guns. " #NT!
  
