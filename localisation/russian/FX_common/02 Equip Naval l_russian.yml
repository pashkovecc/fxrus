l_russian:
 ####################################### 
 # ARG - Argentina 
 ####################################### 
 ARG_submarine_1: "Тип «Санта-Фе»"
 ARG_submarine_1_desc: "Тип «Санта-Фе» включал три подводные лодки, заказанные в Италии и доставленные в Аргентину в 1933 году. Лодки этого типа составляли основу аргентинского подводного флота до 1960 года. Они получили прозвище «Тарантинос» в честь верфи в Таранто в Италии, где были построены."
 ARG_destroyer_1: "Тип «Катамарка»"
 ARG_destroyer_1_desc: "Эсминцы типа «Катамарка» были заказаны и построены в Великобритании для ВМФ Аргентины незадолго до начала Первой мировой войны. Они были вооружены четырьмя 120-мм орудиями и четырьмя 533-мм торпедными аппаратами."
 ARG_destroyer_2: "Тип «Буэнос-Айрес»"
 ARG_destroyer_2_desc: "Эсминцы типа «Буйнос-Айрес» строились в Великобритании для Аргентины в период 1936-1938 гг. на основе британских эсминцев типа «G». Эти корабли имели водоизмещение более 1300 тонн и были вооружены четырьмя 4,7-дюймовыми пушками."
 ARG_light_cruiser_1: "Тип «Либертад»"
 ARG_light_cruiser_1_desc: "Корабли типа «Либертад» были известны как «речные линкоры», хотя на самом деле они сравнимы, скорее, с более легкими бронированными крейсерами начала 1900-х годов. Два корабля этого типа были построены в 90-х годах XIX века и все еще состояли на службе к началу Второй мировой войны."
 ARG_light_cruiser_2: "Тип «Ла Архентина»"
 ARG_light_cruiser_2_desc: "Легкий крейсер «Ла Архентина» был построен Великобританией для Аргентины в конце 30-х годов XX века. Он совершил несколько тренировочных плаваний перед войной, а затем вошел в состав действующей эскадры для поддержания нейтралитета Аргентины. Крейсер был увеличенной версией британского типа «Аретуса», имея водоизмещение в 6500 тонн и основное вооружение из девяти 6-дюймовых орудий."
 ARG_heavy_cruiser_1: "Тип «Гарибальди»"
 ARG_heavy_cruiser_1_desc: "«Гарибальди» — тип броненосных крейсеров, построенных для Аргентины на пороге нового столетия. К 30-м годам ХХ века они заметно устарели, и последний из этих кораблей был снят с вооружения в 1932 году. На замену в 1931 году пришли тяжелые крейсеры типа «Вейнтисинко де Майо»."
 ARG_battleship_1: "Тип «Ривадавия»"
 ARG_battleship_1_desc: "Тип «Ривадавия» состоял из двух дредноутов, построенных Великобританией для ВМФ Аргентины в начале ХХ века. Они имели водоизмещение в 27500 тонн и были вооружены двенадцатью 305-мм орудиями. Эти корабли были в строю до 50-х годов ХХ века."
  
 ####################################### 
 # AST - Commonwealth of Austrailia 
 ####################################### 
 AST_submarine_1: "Тип «L»"
 AST_submarine_1_desc: "Тип «L» — лодки среднего размера, изначально спроектированные в рамках экстренной военной программы как улучшенные версии предшествующих типов. Они были построены ближе к концу Первой мировой войны и оборудованы новыми большими 21-дюймовыми торпедами. Оставались в строю до начала Второй мировой, после чего были переведены на вспомогательные и учебные задачи."
 AST_submarine_2: "Тип «T»"
 AST_submarine_2_desc: "Лодки типа «T», или «Трайтон», были разработаны для замены больших подлодок типов «O», «P» и «R». Они были умеренно большими, с большой дальностью, хорошо подготовленными для действий в Атлантическом и Тихом океанах. Тип «Т» оказался мощной и устойчивой платформой и широко использовался во время войны: 25% всех построенных лодок были потеряны в бою."
 AST_submarine_3: "Тип «U»"
 AST_submarine_3_desc: "Тип «U» — подводные лодки малого размера, построенные в рамках экстренных военных программ 1940 и 1941 годов. Изначально спроектированы как учебные подлодки, но после начала войны в конструкцию были внесены изменения, позволяющие им быть полезными в акваториях Северного и Средиземного морей. Этот тип состоял из трех подтипов: «Андин», «Ампайр» и «Апрор»."
 AST_submarine_4: "Тип «V»"
 AST_submarine_4_desc: "Подводные лодки типа «V», или «Вэмпайр», основывались на конструкции предыдущего типа «U». Они были больше, но все еще относительно малы и обладали лучшими мореходными качествами, но с ограниченными дальностью действия и вооружением."
 AST_destroyer_1: "Тип «Вендетта»"
 AST_destroyer_1_desc: "Эти эсминцы включали в себя типы «V» и «W» постройки Адмиралтейства и «Торникрофт», созданные в рамках экстренной военной программы и переданные австралийским ВМС. Новые типы являлись венцом эволюции британских эсминцев, воплощая в себе улучшения своих предшественников, а также новые технологические достижения. Большое количество этих кораблей было построено во время поздней стадии Первой мировой войны и стало впоследствии основой флотилий эсминцев Королевского флота. С 30-х годов XX века эсминцы были направлены в резервный флот и в конечном итоге переведены на эскорт конвоев. Типы «V» и «W» были солидно вооруженными быстрыми кораблями с хорошей дальностью действия."
 AST_destroyer_2: "Тип «G»/«H»/«I»"
 AST_destroyer_2_desc: "Эсминцы типов «G», «H» и «I» были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они представляли собой несколько уменьшенную в размере копию предыдущего типа «F». Вооружение на «G»- и «H»-типах было идентичным: оба использовали 4,7-дюймовые орудия. Эти корабли имели большую дальность действия, удовлетворительное вооружение и мощное торпедное оснащение. Они широко использовались в военное время и понесли заметные потери."
 AST_destroyer_3: "Тип «Низам»"
 AST_destroyer_3_desc: "Тип «Низам» использовался для обозначения британских эсминцев типов «J», «K» и «N». Они схожи с ранним типом «Трайбал», но вместо усиления орудийного вооружения конструкторы вернулись к более стандартной схеме с тяжелыми торпедами и легкими орудиями. За время службы в военный период корабли были модифицированы. Улучшения включают в себя усиленную систему ПВО и радар. Эти эсминцы отличаются скоростью, дальностью действия и хорошим вооружением и идеально подходят для роли флотских эскортов."
 AST_destroyer_4: "Тип «Бэттл»"
 AST_destroyer_4_desc: "В эсминцах типа «Бэттл» представлено развитие британских эсминцев за годы войны. Корабли были заказаны в рамках военно-морской программы 1942 и 1943 годов. Они были хорошо вооружены как орудиями, так и торпедами. Это, а также скорость и дальность действия, сделали их достаточно универсальными кораблями."
 AST_light_cruiser_1: "Тип «С»"
 AST_light_cruiser_1_desc: "Двадцать восемь легких крейсеров типа «С» были построены до и во время Первой мировой войны для использования в суровых условиях Северного моря. Они оказались прочными и эффективными судами, несмотря на малый размер и тесные условия. Вооружение было более чем удовлетворительным: они несли достаточно 6-дюймовых орудий и большой запас торпед. Тип «С» активно использовался во время Первой мировой и принял участие во многих сражениях. Всего лишь три подтипа оставались в составе флота к середине 1930-х: «Каледон», «Серес» и «Карлайл»."
 AST_light_cruiser_2: "Тип «Саутгемптон»"
 AST_light_cruiser_2_desc: "Легкие крейсеры типа «Саутгемптон» — подтип крейсеров «Таун» — были спроектированы для противодействия японским крейсерам типа «Могами». Они были хорошо бронированы, имели приличную скорость и дальность действия и несли грозное вооружение из двенадцати 6-дюймовых орудий в четырех тройных башнях. Тип «Саутгемптон» стал основой для многих последующих проектов легких крейсеров Королевского флота времен войны."
 AST_light_cruiser_3: "Тип «Уганда»"
 AST_light_cruiser_3_desc: "Легкие крейсеры типа «Уганда» были улучшенной версией более раннего типа «Таун», но с упрощенной конструкцией для ускорения производства и снижения стоимости. Корабли этого типа несли на себе то же вооружение, что и предшественники: 4 тройные башни, оборудованные 6-дюймовыми орудиями. Они были похожим образом бронированы, но из-за уменьшенной энергетической установки страдали от сниженной дальности действия. В этот тип входили два подтипа: «Фиджи» и «Цейлон»."
 AST_light_cruiser_4: "Тип «Минотавр»"
 AST_light_cruiser_4_desc: "Эти крейсеры, также известные как тип «Свифтшур», были спроектированы как улучшенная версия типа «Уганда» с учетом модификаций, утвержденных в 1941 году. Они имели большую дальность действия и больше установок ПВО, чем тип «Уганда», но основное вооружение было сокращено до трех трехорудийных башен."
 AST_heavy_cruiser_1: "Тип «Хокинс»"
 AST_heavy_cruiser_1_desc: "Крейсеры типа «Хокинс» стали первыми тяжелыми крейсерами в мире. Конструкция основывалась на более раннем типе «Таун», в частности, на подтипе «Бирмингем», однако обладала 7,5-дюймовыми орудиями и более толстым бронепоясом. Корабли проектировали для борьбы с большими германскими рейдерами; как следствие, они были хорошо вооружены, имели достаточную скорость и дальность плаванья и хорошую защиту. В общей сложности пять кораблей были введены в эксплуатацию, но только четыре оставались в строю на начало Второй мировой войны."
 AST_heavy_cruiser_2: "Тип «Суррей»"
 AST_heavy_cruiser_2_desc: "Тяжелые крейсеры типа «Суррей» были предложены в рамках военно-морской программы 1928 года. Они являлись улучшенной версией более ранних тяжелых крейсеров «Йорк». Если бы их строительство было завершено, они были бы оборудованы четырьмя двухорудийными башнями с 8-дюймовыми орудиями, более тяжелой броней и более мощной энергетической установкой. Два корабля были заказаны, но не один из них так и не был заложен."
 AST_heavy_cruiser_3: "Тип «Адмирал»"
 AST_heavy_cruiser_3_desc: "Тяжелые крейсеры типа «Адмирал» (не путать с линейными крейсерами типа «Адмирал») были последней попыткой Королевского флота спроектировать и построить крейсеры с 8-дюймовыми орудиями. Разработки проекта начались в 1938 и закончились в 1941 году. Окончательный вариант включал в себя новые 8-дюймовые орудия в тройных башнях, мощную систему ПВО, толстую броню и хорошую скорость. Отсутствие вражеских крейсеров и сравнительная дороговизна этих кораблей привели к отказу от проекта в пользу большего количества легких крейсеров."
 AST_heavy_cruiser_4: "Тип «Черчилль»"
 AST_heavy_cruiser_4_desc: "Проект этих кораблей был предложен сэром Уинстоном Черчиллем, лордом Адмиралтейства, на ранней стадии Второй мировой войны для противодействия германским крейсерам типа «Дойчланд». Эти корабли должны были иметь 9,2-дюймовые орудия, мощные орудия ПВО и крепкую броню. Они были спроектированы для эффективной борьбы с тяжелыми кораблями противника. В итоге проект был отменен из-за высокой стоимости и отсутствия необходимости в новых тяжелых крейсерах."
 AST_battle_cruiser_1: "Тип «Ринаун»"
 AST_battle_cruiser_1_desc: "Линейные крейсера типа «Ринаун» изначально были заложены как улучшенные версии типа «Ривендж». Их строительство было приостановлено в начале Первой мировой войны, но лорду Фишеру удалось возродить их в качестве линейных крейсеров. Эти корабли являлись образцовыми линейными крейсерами: они были хорошо вооружены, быстры и маневренны, но имели более слабое бронирование и меньшую дальность действия. Только два из трех кораблей, «Рипалс» и «Ринаун», были завершены."
 AST_battle_cruiser_2: "Тип «Принсесс Ройял»"
 AST_battle_cruiser_2_desc: "«Принсесс Ройял» — тип гипотетических линейных крейсеров, более быстрые и дешевые версии линкоров типа «Кинг Джордж V». Эти корабли несли на себе схожее, но ослабленное вооружение: два тройных 14-дюймовых орудия и шесть сдвоенных 5,25-дюймовых орудий ПВО. Высокая скорость и большая дальность действия крейсеров предоставила бы Королевскому флоту возможность наносить быстрые удары и охранять конвои, но их слабое вооружение стало бы проблемой, если бы им пришлось сражаться с современными линкорами."
 AST_battleship_1: "Тип «Ривендж»"
 AST_battleship_1_desc: "Линкоры класса «Ривендж» были заказаны в 1913 году и являлись удешевленным вариантом быстрых дредноутов класса «Куин Элизабет». Они напоминали исходный проект бронированием и вооружением, но были ощутимо медленнее и, как следствие, в период Второй мировой войны использовались на вторых ролях. Из 8 запланированных кораблей были достроены только 5."
 AST_battleship_2: "Тип «Кинг Джордж V»"
 AST_battleship_2_desc: "Линкоры типа «Кинг Джордж V» стали результатом Вашингтонского морского соглашения 1922 года и Первого лондонского морского договора 1930 года, которые ограничивали водоизмещение и вооружение крупных боевых кораблей. Как следствие, линкоры были оснащены орудиями меньшего калибра, чем более ранние образцы и даже современники. Несмотря на более скромный калибр, они были удовлетворительно вооружены в целом, отличались усиленной системой ПВО и достойным бронированием. Пять кораблей были заказаны и заложены как замена устаревших линкоров типа «Куин Элизабет»."
 AST_battleship_3: "Тип «Лайон»"
 AST_battleship_3_desc: "Линкоры типа «Лайон» были продолжением типа «Кинг Джордж V» и сочетали в себе многие из его особенностей. Шесть кораблей были заказаны в рамках военно-морской программы 1938 года для замены устаревших линкоров типа «Ривендж», но ни один из них не был закончен из-за начала военных действий. От типа «Кинг Джордж V» их отличало более мощное основное вооружение в виде 16-дюймовых орудий. Также они должны были обладать более толстой броней и более мощными энергетическими установками."
 AST_battleship_4: "Тип «Вэнгард»"
 AST_battleship_4_desc: "Линкоры типа «Вэнгард» были последними линкорами, построенными для Королевского флота. Был заказан только один корабль, но еще четыре рассматривались для Тихоокеанского театра военных действий. Заказанное в рамках экстренной военной программы 1940 года строительство не получило высокого приоритета и было завершено только после окончания войны. «Вэнгард» имел гладкий корпус, который обеспечивал ему отличную остойчивость и мореходность. Вооружение было таким же, как у типов «Куин Элизабет» и «Ривендж», что гарантировало значительную огневую мощь. Мощные энергетические установки и хорошая броня сделали их быстрыми и хорошо защищенными кораблями."
 AST_SH_battleship_1: "Тип «Центурион»"
 AST_SH_battleship_1_desc: "«Центурион» — гипотетический тип линкоров Королевского флота, построенный для противодействия крупным боевым кораблям Германии и Японии. Большие 18-дюймовые орудия и толстая броня обеспечивали этот корабль необходимой огневой мощью и защитой для сражения с противником. Сильная система ПВО, большая дальность действия и хорошая скорость были необходимы для защиты обширной акватории Британской империи."
 AST_SH_battleship_2: "Тип «Лайон-2»"
 AST_SH_battleship_2_desc: "Линкоры типа «Лайон-2» были разработаны в 1944 году как улучшенная версия более ранних линкоров типа «Лайон». Учитывая нужды военного времени, новый линкор был больше и тяжелее, и, если бы он был завершен, нес бы три или четыре трехорудийные 16-дюймовые башни последней модели. Толстые бронеплиты защищали корабль от любого надводного или воздушного противника. Стоимость постройки, а также поражение вражеских флотов и потребность в авианосцах привели к отмене проекта."
 AST_carrier_1: "Тип «Корейджес»"
 AST_carrier_1_desc: "Эти три корабля были перестроены из линкоров и стали первыми авианосцами Королевского флота. Их перестройка была следствием Вашингтонского морского соглашения 1922 года и завершилась в 1925 году. Они не могли похвастаться бронированием, зато обладали хорошим вооружением, большой дальностью действия и достойной скоростью. Но из-за особенностей конструкции их авианесущие способности были ограничены. Несмотря на это, они дали Королевскому флоту важный опыт в строительстве авианосцев и эксплуатации морской авиации."
 AST_carrier_2: "Тип «Арк Ройял»"
 AST_carrier_2_desc: "Авианосцы типа «Арк Ройял» были первыми кораблями, построенными в соответствии с Вашингтонским морским соглашением. Впервые была использована схема, при которой ангары и летная палуба стали неотъемлемой частью корпуса. Также они были хорошо вооружены и бронированы, несли большое число самолетов и имели достаточную дальность действия и скорость, чтобы следовать за основными силами Королевского флота."
 AST_carrier_3: "Тип «Илластриес»"
 AST_carrier_3_desc: "Тип «Илластриес» был разработан с учетом Второго лондонского морского договора 1936 года, который ограничивал водоизмещение авианосцев до 23000 тонн, и являлся первым британским авианосцем с бронированной летной палубой, что привело к сокращению размеров авиагруппы. Тяжелая броня и ПВО обеспечивали хорошую защиту корабля, а мощные энергетические установки и большой запас топлива — солидную дальность действия."
 AST_carrier_4: "Тип «Имплакабл»"
 AST_carrier_4_desc: "Авианосцы типа «Имплакабл» были заказаны в рамках военно-морской программы 1938 года и были улучшенной версией типа «Илластриес». Военные действия и смена приоритетов в сторону малых судов для защиты конвоев на ранней и средней стадии войны замедлили строительство. «Имплакабл» были большими судами, что позволяло нести больше самолетов, сохраняя толстую броню на корпусе и летной палубе. Более мощные двигатели давали им более высокую скорость и большую дальность действия в сравнении с типом «Илластриес»."
  
 ####################################### 
 # BRA - Brazil 
 ####################################### 
 BRA_submarine_1: "Тип «Умайта»"
 BRA_submarine_1_desc: "Бразильская подводная лодка «Умайта» была построена Италией на заказ в конце 20-х годов XX века. Она представляла собой модификацию типа «Балилья», который, в свою очередь, был спроектирован как глубоководная подлодка. «Умайта» имела водоизмещение около 1400 тонн и была вооружена шестью 533-мм торпедными аппаратами."
 BRA_submarine_2: "Тип «Тупи»"
 BRA_submarine_2_desc: "Подлодки типа «Тупи» были построены Италией для Бразилии в середине 30-х годов ХХ века. Они были небольшого размера с водоизмещением немногим больше 600 тонн и вооружением из шести 533-мм торпедных аппаратов."
 BRA_destroyer_1: "Marnhão Class" #NT!
 BRA_destroyer_1_desc: "The Marnhão was a British-built K-class destroyer that was sold to Brazil in 1922. The ship displaced just over 930 tons and was armed with four 4 in. guns." #NT!
 BRA_destroyer_2: "Тип «Журуэна»"
 BRA_destroyer_2_desc: "«Журуэна» представлял собой серию из шести британских эсминцев типа «H», заказанных Бразилией в конце 30-х годов ХХ века. Бразилия корабли так и не получила: Британия оставила их себе в связи с началом войны в 1939 году. Эсминцы имели водоизмещение около 1300 тонн, обладали хорошей скоростью и были вооружены тремя 4,7-дюймовыми орудиями и восемью 533-мм торпедными аппаратами."
 BRA_destroyer_3: "Тип «Марсилио Диас»"
 BRA_destroyer_3_desc: "Тип «Марсилио Диас» (также тип «M» или тип «Гринхал») состоял из трех эсминцев ВМФ Бразилии, введенных в строй в 1943 году. Они были созданы на основе американского типа «Мэхэн» и стали первыми крупными кораблями, построенными в Бразилии. Водоизмещение эсминцев составляло 1500 тонн, а вооружение состояло из пяти 5-дюймовых орудий."
 BRA_destroyer_4: "Тип «Акри»"
 BRA_destroyer_4_desc: "Тип «Акри» (он же тип «Амазонас») состоял из шести эсминцев ВМФ Бразилии. Они были построены в Бразилии по модифицированному британскому проекту с применением оборудования из США, чтобы занять место шести эсминцев типа «Журуэна», которые Британия оставила себе в начале войны. К концу войны ни один корабль не был достроен."
 BRA_light_cruiser_1: "Тип «Баия»"
 BRA_light_cruiser_1_desc: "Тип «Баия» состоял из двух разведывательных крейсеров, построенных Британией для Бразилии и поставленных в 1910 году. В 20-х годах они прошли модернизацию, но к началу Второй мировой войны уже успели устареть. Во время войны крейсеры в основном занимались сопровождением конвоев."
 BRA_battleship_1: "Тип «Минас-Жерайс»"
 BRA_battleship_1_desc: "Тип «Минас-Жерайс» состоял из двух дредноутов, построенных Великобританией для Бразилии в начале века. Они приняли участие в Второй мировой войне, но, будучи слишком устаревшими для серьезных задач, были задействованы для охраны побережья."
  
 ####################################### 
 # CAN - Dominion of Canada 
 ####################################### 
 CAN_submarine_1: "Тип «L»"
 CAN_submarine_1_desc: "Тип «L» — лодки среднего размера, изначально спроектированные в рамках экстренной военной программы как улучшенные версии предшествующих типов. Они были построены ближе к концу Первой мировой войны и оборудованы новыми большими 21-дюймовыми торпедами. Оставались в строю до начала Второй мировой, после чего были переведены на вспомогательные и учебные задачи."
 CAN_submarine_2: "Тип «T»"
 CAN_submarine_2_desc: "Лодки типа «T», или «Трайтон», были разработаны для замены больших подлодок типов «O», «P» и «R». Они были умеренно большими, с большой дальностью, хорошо подготовленными для действий в Атлантическом и Тихом океанах. Тип «Т» оказался мощной и устойчивой платформой и широко использовался во время войны: 25% всех построенных лодок были потеряны в бою."
 CAN_submarine_3: "Тип «U»"
 CAN_submarine_3_desc: "Тип «U» — подводные лодки малого размера, построенные в рамках экстренных военных программ 1940 и 1941 годов. Изначально спроектированы как учебные подлодки, но после начала войны в конструкцию были внесены изменения, позволяющие им быть полезными в акваториях Северного и Средиземного морей. Этот тип состоял из трех подтипов: «Андин», «Ампайр» и «Апрор»."
 CAN_submarine_4: "Тип «V»"
 CAN_submarine_4_desc: "Подводные лодки типа «V», или «Вэмпайр», основывались на конструкции предыдущего типа «U». Они были больше, но все еще относительно малы и обладали лучшими мореходными качествами, но с ограниченными дальностью действия и вооружением."
 CAN_destroyer_1: "Тип «V»/«W»"
 CAN_destroyer_1_desc: "Эти эсминцы включали в себя типы «V» и «W» постройки Адмиралтейства и «Торникрофт», созданные в рамках экстренной военной программы. Новые типы являлись венцом эволюции британских эсминцев, воплощая в себе улучшения своих предшественников, а также новые технологические достижения. Большое количество этих кораблей было построено во время поздней стадии Первой мировой войны и стало впоследствии основой флотилий эсминцев Королевского флота. С 30-х годов XX века эсминцы были направлены в резервный флот и в конечном итоге переведены на эскорт конвоев. Типы «V» и «W» были солидно вооруженными быстрыми кораблями с хорошей дальностью действия."
 CAN_destroyer_2: "Тип «Оттава»"
 CAN_destroyer_2_desc: "«Оттава» — канадское обозначение британских эсминцев типов «G», «H» и «I», заказанных в рамках Военно-морских строительных программ 1933 и 1934 годов. Они в целом повторяли предыдущий тип «F», немного уменьшенный в размерах. Вооружение типов «G» и «H» было такое же, как и у типа «F», и состояло из 4,7-дюймовых орудий. Они обладали высоким радиусом действия и хорошим вооружением, а также несли мощные торпеды. Эсминцы широко использовались во время войны и понесли заметные потери."
 CAN_destroyer_3: "Тип «J»/«K»/«N»"
 CAN_destroyer_3_desc: "Типы «J», «K» и «N» схожи с ранним типом «Трайбал», но вместо усиления орудийного вооружения конструкторы вернулись к более стандартной схеме с тяжелыми торпедами и легкими орудиями. За время службы в военный период корабли были модифицированы. Улучшения включали в себя усиленную систему ПВО и радар. Эти эсминцы отличались скоростью, дальностью действия и хорошим вооружением и идеально подходили для роли флотских эскортов."
 CAN_destroyer_4: "Тип «Алгонкин»"
 CAN_destroyer_4_desc: "«Алгонкин» — канадское обозначение британских эсминцев типа «Бэттл», заказанных в рамках Военно-морских программ 1942 и 1943 годов. Они были хорошо вооружены как орудиями, так и торпедами. Мощная система ПВО, противолодочные возможности, скорость и дальность действия делали их универсальными кораблями, но позднее появление в войне не позволило им проявить себя."
 CAN_light_cruiser_1: "Тип «С»"
 CAN_light_cruiser_1_desc: "Двадцать восемь легких крейсеров типа «С» были построены до и во время Первой мировой войны для использования в суровых условиях Северного моря. Они оказались прочными и эффективными судами, несмотря на малый размер и тесные условия. Вооружение было более чем удовлетворительным: они несли достаточно 6-дюймовых орудий и большой запас торпед. Тип «С» активно использовался во время Первой мировой и принял участие во многих сражениях. Всего лишь три подтипа оставались в составе флота к середине 1930-х: «Каледон», «Серес» и «Карлайл»."
 CAN_light_cruiser_2: "Тип «Саутгемптон»"
 CAN_light_cruiser_2_desc: "Легкие крейсеры типа «Саутгемптон» — подтип крейсеров «Таун» — были спроектированы для противодействия японским крейсерам типа «Могами». Они были хорошо бронированы, имели приличную скорость и дальность действия и несли грозное вооружение из двенадцати 6-дюймовых орудий в четырех тройных башнях. Тип «Саутгемптон» стал основой для многих последующих проектов легких крейсеров Королевского флота времен войны."
 CAN_light_cruiser_3: "Тип «Квебек»"
 CAN_light_cruiser_3_desc: "«Квебек» — канадское обозначение британских легких крейсеров типа «Уганда», улучшенной версии более раннего типа «Таун», но с упрощенной конструкцией для ускорения производства и снижения стоимости. Корабли этого типа несли на себе то же вооружение, что и их предшественники: 4 трехорудийных башни, оборудованных 6-дюймовыми орудиями. Бронирование было схожим, но из-за небольшой энергетической установки дальность действия была меньше. В этот тип входят два подтипа: «Фиджи» и «Цейлон»."
 CAN_light_cruiser_4: "Тип «Онтарио»"
 CAN_light_cruiser_4_desc: "«Онтарио» — канадское обозначение для британских легких крейсеров типа «Минотавр» («Свифтшур»). Эти корабли были спроектированы на базе типа «Уганда» с учетом модификаций, принятых в 1941 году. Крейсеры имели большую дальность действия и более мощную ПВО, чем тип «Уганда», но основное вооружение было сокращено до трех трехорудийных башен. Крейсеры были построены слишком поздно, чтобы оказать влияние на исход войны; после ее окончания большинство заказанных судов было отменено. "
 CAN_heavy_cruiser_1: "Тип «Хокинс»"
 CAN_heavy_cruiser_1_desc: "Крейсеры типа «Хокинс» стали первыми тяжелыми крейсерами в мире. Конструкция основывалась на более раннем типе «Таун», в частности, на подтипе «Бирмингем», однако обладала 7,5-дюймовыми орудиями и более толстым бронепоясом. Корабли проектировали для борьбы с большими германскими рейдерами; как следствие, они были хорошо вооружены, имели достаточную скорость и дальность плаванья и хорошую защиту. В общей сложности пять кораблей были введены в эксплуатацию, но только четыре оставались в строю на начало Второй мировой войны."
 CAN_heavy_cruiser_2: "Тип «Суррей»"
 CAN_heavy_cruiser_2_desc: "Тяжелые крейсеры типа «Суррей» были предложены в рамках военно-морской программы 1928 года. Они являлись улучшенной версией более ранних тяжелых крейсеров «Йорк». Если бы их строительство было завершено, они были бы оборудованы четырьмя двухорудийными башнями с 8-дюймовыми орудиями, более тяжелой броней и более мощной энергетической установкой. Два корабля были заказаны, но не один из них так и не был заложен."
 CAN_heavy_cruiser_3: "Тип «Адмирал»"
 CAN_heavy_cruiser_3_desc: "Тяжелые крейсеры типа «Адмирал» (не путать с линейными крейсерами типа «Адмирал») были последней попыткой Королевского флота спроектировать и построить крейсеры с 8-дюймовыми орудиями. Разработки проекта начались в 1938 и закончились в 1941 году. Окончательный вариант включал в себя новые 8-дюймовые орудия в тройных башнях, мощную систему ПВО, толстую броню и хорошую скорость. Отсутствие вражеских крейсеров и сравнительная дороговизна этих кораблей привели к отказу от проекта в пользу большего количества легких крейсеров."
 CAN_heavy_cruiser_4: "Тип «Черчилль»"
 CAN_heavy_cruiser_4_desc: "Проект этих кораблей был предложен сэром Уинстоном Черчиллем, лордом Адмиралтейства, на ранней стадии Второй мировой войны для противодействия германским крейсерам типа «Дойчланд». Эти корабли должны были иметь 9,2-дюймовые орудия, мощные орудия ПВО и крепкую броню. Они были спроектированы для эффективной борьбы с тяжелыми кораблями противника. В итоге проект был отменен из-за высокой стоимости и отсутствия необходимости в новых тяжелых крейсерах."
 CAN_battle_cruiser_1: "Тип «Ринаун»"
 CAN_battle_cruiser_1_desc: "Линейные крейсера типа «Ринаун» изначально были заложены как улучшенные версии типа «Ривендж». Их строительство было приостановлено в начале Первой мировой войны, но лорду Фишеру удалось возродить их в качестве линейных крейсеров. Эти корабли являлись образцовыми линейными крейсерами: они были хорошо вооружены, быстры и маневренны, но имели более слабое бронирование и меньшую дальность действия. Только два из трех кораблей, «Рипалс» и «Ринаун», были завершены."
 CAN_battle_cruiser_2: "Тип «Принсесс Ройял»"
 CAN_battle_cruiser_2_desc: "«Принсесс Ройял» — тип гипотетических линейных крейсеров, более быстрые и дешевые версии линкоров типа «Кинг Джордж V». Эти корабли несли на себе схожее, но ослабленное вооружение: два тройных 14-дюймовых орудия и шесть сдвоенных 5,25-дюймовых орудий ПВО. Высокая скорость и большая дальность действия крейсеров предоставила бы Королевскому флоту возможность наносить быстрые удары и охранять конвои, но их слабое вооружение стало бы проблемой, если бы им пришлось сражаться с современными линкорами."
 CAN_battleship_1: "Тип «Ривендж»"
 CAN_battleship_1_desc: "Линкоры класса «Ривендж» были заказаны в 1913 году и являлись удешевленным вариантом быстрых дредноутов класса «Куин Элизабет». Они напоминали исходный проект бронированием и вооружением, но были ощутимо медленнее и, как следствие, в период Второй мировой войны использовались на вторых ролях. Из 8 запланированных кораблей были достроены только 5."
 CAN_battleship_2: "Тип «Кинг Джордж V»"
 CAN_battleship_2_desc: "Линкоры типа «Кинг Джордж V» стали результатом Вашингтонского морского соглашения 1922 года и Первого лондонского морского договора 1930 года, которые ограничивали водоизмещение и вооружение крупных боевых кораблей. Как следствие, линкоры были оснащены орудиями меньшего калибра, чем более ранние образцы и даже современники. Несмотря на более скромный калибр, они были удовлетворительно вооружены в целом, отличались усиленной системой ПВО и достойным бронированием. Пять кораблей были заказаны и заложены как замена устаревших линкоров типа «Куин Элизабет»."
 CAN_battleship_3: "Тип «Лайон»"
 CAN_battleship_3_desc: "Линкоры типа «Лайон» были продолжением типа «Кинг Джордж V» и сочетали в себе многие из его особенностей. Шесть кораблей были заказаны в рамках военно-морской программы 1938 года для замены устаревших линкоров типа «Ривендж», но ни один из них не был закончен из-за начала военных действий. От типа «Кинг Джордж V» их отличало более мощное основное вооружение в виде 16-дюймовых орудий. Также они должны были обладать более толстой броней и более мощными энергетическими установками."
 CAN_battleship_4: "Тип «Вэнгард»"
 CAN_battleship_4_desc: "Линкоры типа «Вэнгард» были последними линкорами, построенными для Королевского флота. Был заказан только один корабль, но еще четыре рассматривались для Тихоокеанского театра военных действий. Заказанное в рамках экстренной военной программы 1940 года строительство не получило высокого приоритета и было завершено только после окончания войны. «Вэнгард» имел гладкий корпус, который обеспечивал ему отличную остойчивость и мореходность. Вооружение было таким же, как у типов «Куин Элизабет» и «Ривендж», что гарантировало значительную огневую мощь. Мощные энергетические установки и хорошая броня сделали их быстрыми и хорошо защищенными кораблями."
 CAN_SH_battleship_1: "Тип «Центурион»"
 CAN_SH_battleship_1_desc: "«Центурион» — гипотетический тип линкоров Королевского флота, построенный для противодействия крупным боевым кораблям Германии и Японии. Большие 18-дюймовые орудия и толстая броня обеспечивали этот корабль необходимой огневой мощью и защитой для сражения с противником. Сильная система ПВО, большая дальность действия и хорошая скорость были необходимы для защиты обширной акватории Британской империи."
 CAN_SH_battleship_2: "Тип «Лайон-2»"
 CAN_SH_battleship_2_desc: "Линкоры типа «Лайон-2» были разработаны в 1944 году как улучшенная версия более ранних линкоров типа «Лайон». Учитывая нужды военного времени, новый линкор был больше и тяжелее, и, если бы он был завершен, нес бы три или четыре трехорудийные 16-дюймовые башни последней модели. Толстые бронеплиты защищали корабль от любого надводного или воздушного противника. Стоимость постройки, а также поражение вражеских флотов и потребность в авианосцах привели к отмене проекта."
 CAN_carrier_1: "Тип «Корейджес»"
 CAN_carrier_1_desc: "Эти три корабля были перестроены из линкоров и стали первыми авианосцами Королевского флота. Их перестройка была следствием Вашингтонского морского соглашения 1922 года и завершилась в 1925 году. Они не могли похвастаться бронированием, зато обладали хорошим вооружением, большой дальностью действия и достойной скоростью. Но из-за особенностей конструкции их авианесущие способности были ограничены. Несмотря на это, они дали Королевскому флоту важный опыт в строительстве авианосцев и эксплуатации морской авиации."
 CAN_carrier_2: "Тип «Арк Ройял»"
 CAN_carrier_2_desc: "Авианосцы типа «Арк Ройял» были первыми кораблями, построенными в соответствии с Вашингтонским морским соглашением. Впервые была использована схема, при которой ангары и летная палуба стали неотъемлемой частью корпуса. Также они были хорошо вооружены и бронированы, несли большое число самолетов и имели достаточную дальность действия и скорость, чтобы следовать за основными силами Королевского флота."
 CAN_carrier_3: "Тип «Илластриес»"
 CAN_carrier_3_desc: "Тип «Илластриес» был разработан с учетом Второго лондонского морского договора 1936 года, который ограничивал водоизмещение авианосцев до 23000 тонн, и являлся первым британским авианосцем с бронированной летной палубой, что привело к сокращению размеров авиагруппы. Тяжелая броня и ПВО обеспечивали хорошую защиту корабля, а мощные энергетические установки и большой запас топлива — солидную дальность действия."
 CAN_carrier_4: "Тип «Имплакабл»"
 CAN_carrier_4_desc: "Авианосцы типа «Имплакабл» были заказаны в рамках военно-морской программы 1938 года и были улучшенной версией типа «Илластриес». Военные действия и смена приоритетов в сторону малых судов для защиты конвоев на ранней и средней стадии войны замедлили строительство. «Имплакабл» были большими судами, что позволяло нести больше самолетов, сохраняя толстую броню на корпусе и летной палубе. Более мощные двигатели давали им более высокую скорость и большую дальность действия в сравнении с типом «Илластриес»."
  
 ####################################### 
 # KMT - Kuomintang Government 
 ####################################### 
 KMT_destroyer_1: "Jianwei Class" #NT!
 KMT_destroyer_1_desc: "The Jianwei-class was a class of large torpedo boats built for the Nationalist Chinese navy and commissioned in 1904. Two ships of the class were modernized and still in service at the time of the Japanese invasion. Once modernized, they displaced 870 tons and were armed with two 4.7 in. main guns." #NT!
 KMT_light_cruiser_1: "Hairong Class" #NT!
 KMT_light_cruiser_1_desc: "The Hairong was a Chinese protected cruiser built in the late 1890s by Germany. The ship was similar to other protected cruisers and subsequent light cruisers produced for China around the turn of the century. Hairong displaced just under 2,700 tons and were armed with three 5.9 in QF guns. " #NT!
  
 ####################################### 
 # CHL - Chile 
 ####################################### 
 CHL_submarine_1: "Тип «H»"
 CHL_submarine_1_desc: "Тип состоял из шести подлодок британского типа «H» («Голланд 602»), построенных в Великобритании в 1915-1918 гг. и переданных Чили вскоре после Первой мировой для замены затопленных во время войны. Лодки имели водоизмещение в 360 тонн, могли погружаться на глубину до 30 м и были вооружены четырьмя 450-мм торпедными аппаратами."
 CHL_destroyer_1: "Тип «Альмиранте Линч»"
 CHL_destroyer_1_desc: "Тип «Альмиранте Линч» состоял из шести эсминцев, построенных для ВМФ Чили в Великобритании незадолго до начала Первой мировой войны. До начала военных действий Британия успела передать только два корабля, которые оставались в строю до 1945 года. Эсминцы имели водоизмещение в 1430 тонн, обладали приличной скоростью и дальностью действия для своего типа и были вооружены шестью 4-дюймовыми орудиями и двумя 21-дюймовыми торпедными аппаратами."
 CHL_light_cruiser_1: "Тип «Чакабуко»"
 CHL_light_cruiser_1_desc: "Бронепалубные крейсеры типа «Чакабуко» были построены в Британии по заказу ВМФ Чили в 1902 году. Они имели водоизмещение в 4160 тонн и были вооружены двумя 8-дюймовыми пушками Армстронга и тремя 18-дюймовыми торпедными аппаратами. В сравнении с ранними легкими крейсерами они были медлительны, но хорошо бронированы."
 CHL_heavy_cruiser_1: "Тип «О'Хиггинс»"
 CHL_heavy_cruiser_1_desc: "Броненосный крейсер «О'Хиггинс» был построен в Британии для ВМФ Чили на рубеже XIX и XX столетий. Его водоизмещение составляло 7800 тонн, а главное вооружение состояло из четырех 8-дюймовых орудий. В скорости крейсер значительно уступал тяжелым крейсерам Первой мировой войны."
 CHL_battleship_1: "Тип «Альмиранте Латорре»"
 CHL_battleship_1_desc: "Тип «Альмиранте Латорре» состоял из двух супердредноутов, построенных в Британии для ВМФ Чили в начале Первой мировой войны. Один из них был закончен, а второй перестроен в британский авианосец «Игл». Водоизмещение корабля составляло более 28000 тонн, а главное вооружение — из десяти 14-дюймовых орудий. Эти корабли уступали в бронировании другим дредноутам своей эпохи, но были несколько быстрее."
  
 ####################################### 
 # COL - Colombia 
 ####################################### 
 COL_destroyer_2: "Тип «Антиокия»"
 COL_destroyer_2_desc: "Тип «Антиокия» состоял из двух эсминцев, построенных для ВМФ Колумбии в Португалии и введенными в строй в 1934 году. Их водоизмещение составляло более 1200 тонн, а вооружение состояло из четырех 4,7-дюймовых орудий и восьми 533-мм торпедных аппаратов."
  
 ####################################### 
 # DEN - Denmark 
 ####################################### 
 DEN_submarine_1: "Kraken I" #NT!
 DEN_submarine_1_desc: "Подводные лодки типа «Ротья» были построены в Дании после окончания Первой мировой войны. Это были малые подлодки, разработанные на основе проекта «Голланд 602», водоизмещением в 290 тонн и с четырьмя 450-мм торпедными аппаратами."
 DEN_submarine_2: "Kraken II" #NT!
 DEN_submarine_2_desc: "Тип «Хауменден» состоял из пяти запланированных подводных лодок. Три из них были завершены до оккупации Германией, еще одна во время оккупации, а пятая была отменена. Это были сравнительно небольшие подлодки с водоизмещением в 320 тонн. Вооружение состояло из пяти 450-мм торпедных аппаратов."
 DEN_submarine_3: "Kraken III" #NT!
 DEN_submarine_4: "Kraken IV" #NT!
 DEN_submarine_4_desc: "«Стёрен» — британская подводная лодка типа «V», переданная ВМФ Дании после войны. Она была сравнительно небольшой, имея водоизмещение в 545 тонн, но несла четыре 533-мм торпедных аппарата и обладала хорошей мореходностью."
 DEN_destroyer_1: "Haj I" #NT!
 DEN_destroyer_2: "Haj II" #NT!
 DEN_destroyer_3: "Haj III" #NT!
 DEN_destroyer_4: "Haj IV" #NT!
 DEN_battleship_1: "Jörmungandr I" #NT!
 DEN_battleship_2: "Jörmungandr II" #NT!
 DEN_battleship_3: "Jörmungandr III" #NT!
 DEN_battleship_4: "Jörmungandr IV" #NT!
 DEN_heavy_cruiser_1: "Тип «Херлуф Троль»"
 DEN_heavy_cruiser_1_desc: "Тип «Херлуф Троль» состоял из трех береговых броненосных линкоров, введенных в строй в 1901-1908 гг. Несмотря на формальную принадлежность к линкорам, по размерам и вооружению корабли были ближе к крейсерам. На начало Второй мировой войны только один из них, «Петер Скрам», был в строю. Корабли обладали водоизмещением в 3700 тонн и вооружением из двух 240-мм орудий. Броня была достаточно крепкой, но в скорости они значительно уступали большинству дредноутов своей эпохи."
 DEN_carrier_1: "Lyngbakr I" #NT!
 DEN_carrier_2: "Lyngbakr II" #NT!
 DEN_carrier_3: "Lyngbakr III" #NT!
 DEN_carrier_4: "Lyngbakr IV" #NT!
  
 ####################################### 
 # ENG - United Kingdom 
 ####################################### 
 ENG_submarine_1: "Тип «L»"
 ENG_submarine_1_desc: "Тип «L» — лодки среднего размера, изначально спроектированные в рамках экстренной военной программы как улучшенные версии предшествующих типов. Они были построены ближе к концу Первой мировой войны и оборудованы новыми большими 21-дюймовыми торпедами. Оставались в строю до начала Второй мировой, после чего были переведены на вспомогательные и учебные задачи."
 ENG_submarine_2: "Тип «T»"
 ENG_submarine_2_desc: "Лодки типа «T», или «Трайтон», были разработаны для замены больших подлодок типов «O», «P» и «R». Они были умеренно большими, с большой дальностью, хорошо подготовленными для действий в Атлантическом и Тихом океанах. Тип «Т» оказался мощной и устойчивой платформой и широко использовался во время войны: 25% всех построенных лодок были потеряны в бою."
 ENG_submarine_3: "Тип «U»"
 ENG_submarine_3_desc: "Тип «U» — подводные лодки малого размера, построенные в рамках экстренных военных программ 1940 и 1941 годов. Изначально спроектированы как учебные подлодки, но после начала войны в конструкцию были внесены изменения, позволяющие им быть полезными в акваториях Северного и Средиземного морей. Этот тип состоял из трех подтипов: «Андин», «Ампайр» и «Апрор»."
 ENG_submarine_4: "Тип «V»"
 ENG_submarine_4_desc: "Подводные лодки типа «V», или «Вэмпайр», основывались на конструкции предыдущего типа «U». Они были больше, но все еще относительно малы и обладали лучшими мореходными качествами, но с ограниченными дальностью действия и вооружением."
 ENG_destroyer_1: "Тип «V»/«W»"
 ENG_destroyer_1_desc: "These destroyers included the Admirality and Thornycroft V and W classes. They were built under the War Emergency Program. They were the ultimate evolution of British destroyer design during the First World War, embodying the improvements of their predecessors as well as new technological advances. Large numbers of these ships were built during the late stages of WWI and became the backbone of the Royal Navy's destroyer flotillas afterwards. Beginning in the 1930s, they were placed into reserve fleets, used eventually relegated to convoy escort duties. They were adequately-armed, fast vessels with good range." #NT!
 ENG_destroyer_2: "Тип «G»/«H»/«I»"
 ENG_destroyer_2_desc: "Эсминцы типов «G», «H» и «I» были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они представляли собой несколько уменьшенную в размере копию предыдущего типа «F». Вооружение на «G»- и «H»-типах было идентичным: оба использовали 4,7-дюймовые орудия. Эти корабли имели большую дальность действия, удовлетворительное вооружение и мощное торпедное оснащение. Они широко использовались в военное время и понесли заметные потери."
 ENG_destroyer_3: "Тип «J»/«K»/«N»"
 ENG_destroyer_3_desc: "Типы «J», «K» и «N» схожи с ранним типом «Трайбал», но вместо усиления орудийного вооружения конструкторы вернулись к более стандартной схеме с тяжелыми торпедами и легкими орудиями. За время службы в военный период корабли были модифицированы. Улучшения включали в себя усиленную систему ПВО и радар. Эти эсминцы отличались скоростью, дальностью действия и хорошим вооружением и идеально подходили для роли флотских эскортов."
 ENG_destroyer_4: "Тип «Бэттл»"
 ENG_destroyer_4_desc: "В эсминцах типа «Бэттл» представлено развитие британских эсминцев за годы войны. Корабли были заказаны в рамках военно-морской программы 1942 и 1943 годов. Они были хорошо вооружены как орудиями, так и торпедами. Это, а также скорость и дальность действия, сделали их достаточно универсальными кораблями, но позднее появление не позволило внести ощутимый вклад в победу."
 ENG_light_cruiser_1: "Emerald Class" #NT!
 ENG_light_cruiser_1_desc: "Designed to emphasise high speed at the cost of other qualities the Emerald Class was created to counter the Kaisermarine's Brummer-Class high-speed cruisers in the waning years of the Great War. Being seen as a perfect vessel to be used in the inter-war years for policing trade across the Empire, additional Emerald-Class vessels would be constructed and deployed in the early 1920's." #NT!
 ENG_light_cruiser_2: "Тип «Саутгемптон»"
 ENG_light_cruiser_2_desc: "Легкие крейсеры типа «Саутгемптон» — подтип крейсеров «Таун» — были спроектированы для противодействия японским крейсерам типа «Могами». Они были хорошо бронированы, имели приличную скорость и дальность действия и несли грозное вооружение из двенадцати 6-дюймовых орудий в четырех тройных башнях. Тип «Саутгемптон» стал основой для многих последующих проектов легких крейсеров Королевского флота времен войны."
 ENG_light_cruiser_3: "Тип «Уганда»"
 ENG_light_cruiser_3_desc: "Легкие крейсеры типа «Уганда» были улучшенной версией более раннего типа «Таун», но с упрощенной конструкцией для ускорения производства и снижения стоимости. Корабли этого типа несли на себе то же вооружение, что и предшественники: 4 тройные башни, оборудованные 6-дюймовыми орудиями. Они были похожим образом бронированы, но из-за уменьшенной энергетической установки страдали от сниженной дальности действия. В этот тип входили два подтипа: «Фиджи» и «Цейлон»."
 ENG_light_cruiser_4: "Тип «Минотавр»"
 ENG_light_cruiser_4_desc: "Эти крейсеры, также известные как тип «Свифтшур», были спроектированы как улучшенная версия типа «Уганда» с учетом модификаций, утвержденных в 1941 году. Они имели большую дальность действия и больше установок ПВО, чем тип «Уганда», но основное вооружение было сокращено до трех трехорудийных башен."
 ENG_heavy_cruiser_1: "County Class" #NT!
 ENG_heavy_cruiser_1_desc: "Some of the first post Great War cruiser production laid down for the Royal Navy, the County Class has good firepower, cruising range and the speed required for colonial trade route defence. Being seen as a perfect use for policing the expansive trade routes of the Empire, several orders for the ship were made in the inter-war years with the most recent being completed in 1932." #NT!
 ENG_heavy_cruiser_2: "Тип «Суррей»"
 ENG_heavy_cruiser_2_desc: "Тяжелые крейсеры типа «Суррей» были предложены в рамках военно-морской программы 1928 года. Они являлись улучшенной версией более ранних тяжелых крейсеров «Йорк». Если бы их строительство было завершено, они были бы оборудованы четырьмя двухорудийными башнями с 8-дюймовыми орудиями, более тяжелой броней и более мощной энергетической установкой. Два корабля были заказаны, но не один из них так и не был заложен."
 ENG_heavy_cruiser_3: "Тип «Адмирал»"
 ENG_heavy_cruiser_3_desc: "Тяжелые крейсеры типа «Адмирал» (не путать с линейными крейсерами типа «Адмирал») были последней попыткой Королевского флота спроектировать и построить крейсеры с 8-дюймовыми орудиями. Разработки проекта начались в 1938 и закончились в 1941 году. Окончательный вариант включал в себя новые 8-дюймовые орудия в тройных башнях, мощную систему ПВО, толстую броню и хорошую скорость. Отсутствие вражеских крейсеров и сравнительная дороговизна этих кораблей привели к отказу от проекта в пользу большего количества легких крейсеров."
 ENG_heavy_cruiser_4: "Тип «Черчилль»"
 ENG_heavy_cruiser_4_desc: "Проект этих кораблей был предложен сэром Уинстоном Черчиллем, лордом Адмиралтейства, на ранней стадии Второй мировой войны для противодействия германским крейсерам типа «Дойчланд». Эти корабли должны были иметь 9,2-дюймовые орудия, мощные орудия ПВО и крепкую броню. Они были спроектированы для эффективной борьбы с тяжелыми кораблями противника. В итоге проект был отменен из-за высокой стоимости и отсутствия необходимости в новых тяжелых крейсерах."
 ENG_battle_cruiser_1: "Admiral Class" #NT!
 ENG_battle_cruiser_1_desc: "Designed towards the end of Great War, the Admiral-Class was in many ways an improved Queen Elizabeth-Class but was recast after the Admiral of the Grand Fleet - Sir John Jellicoe - intervened. Updated during development to incorporate the lessons learned at the Battle of Jutland it would take less than five years before a superior replacement, the G3 class, would be designed and construction would begin." #NT!
 ENG_battle_cruiser_2: "Тип «Принсесс Ройял»"
 ENG_battle_cruiser_2_desc: "«Принсесс Ройял» — тип гипотетических линейных крейсеров, более быстрые и дешевые версии линкоров типа «Кинг Джордж V». Эти корабли несли на себе схожее, но ослабленное вооружение: два тройных 14-дюймовых орудия и шесть сдвоенных 5,25-дюймовых орудий ПВО. Высокая скорость и большая дальность действия крейсеров предоставила бы Королевскому флоту возможность наносить быстрые удары и охранять конвои, но их слабое вооружение стало бы проблемой, если бы им пришлось сражаться с современными линкорами."
 ENG_battleship_1: "Queen Elizabeth Class" #NT!
 ENG_battleship_1_desc: "Designed and laid down during the early years of the Great War, the Queen Elizabeth-Class was a class of five super-dreadnoughts and were far superior in design, armament and armour to their predecessor the Iron Duke-Class. The first battleships to be armed with 15 inch guns they were considered by many at the end of the Great War to be the 'most successful type of capital ship yet designed'." #NT!
 ENG_battleship_2: "Тип «Кинг Джордж V»"
 ENG_battleship_2_desc: "Линкоры типа «Кинг Джордж V» стали результатом Вашингтонского морского соглашения 1922 года и Первого лондонского морского договора 1930 года, которые ограничивали водоизмещение и вооружение крупных боевых кораблей. Как следствие, линкоры были оснащены орудиями меньшего калибра, чем более ранние образцы и даже современники. Несмотря на более скромный калибр, они были удовлетворительно вооружены в целом, отличались усиленной системой ПВО и достойным бронированием. Пять кораблей были заказаны и заложены как замена устаревших линкоров типа «Куин Элизабет»."
 ENG_battleship_3: "Тип «Лайон»"
 ENG_battleship_3_desc: "Линкоры типа «Лайон» были продолжением типа «Кинг Джордж V» и сочетали в себе многие из его особенностей. Шесть кораблей были заказаны в рамках военно-морской программы 1938 года для замены устаревших линкоров типа «Ривендж», но ни один из них не был закончен из-за начала военных действий. От типа «Кинг Джордж V» их отличало более мощное основное вооружение в виде 16-дюймовых орудий. Также они должны были обладать более толстой броней и более мощными энергетическими установками."
 ENG_battleship_4: "Тип «Вэнгард»"
 ENG_battleship_4_desc: "Линкоры типа «Вэнгард» были последними линкорами, построенными для Королевского флота. Был заказан только один корабль, но еще четыре рассматривались для Тихоокеанского театра военных действий. Заказанное в рамках экстренной военной программы 1940 года строительство не получило высокого приоритета и было завершено только после окончания войны. «Вэнгард» имел гладкий корпус, который обеспечивал ему отличную остойчивость и мореходность. Вооружение было таким же, как у типов «Куин Элизабет» и «Ривендж», что гарантировало значительную огневую мощь. Мощные энергетические установки и хорошая броня сделали их быстрыми и хорошо защищенными кораблями."
 ENG_SH_battleship_1: "Trafalgar Class" #NT!
 ENG_SH_battleship_1_desc: "The Trafalgar-Class was designed and built to be the new flagship of the Royal Navy. Wielding large 18 in. guns and thick armour, the Trafalgar is the largest vessel to roam the Seven Seas. Equipped with state-of-the-art Anti-Air Armament and rumoured to be fitted with prototype Radio Detection Finding equipment, the Trafalgar is capable of obliterating any vessel of a similar class in short time." #NT!
 ENG_SH_battleship_2: "Victoria Class" #NT!
 ENG_SH_battleship_2_desc: "Created with the lessons learned from naval developments around the world, the Victoria-class is the largest Battleship ever designed and constructed. Carrying hitherto impossible-to-use 20 inch guns, the firepower of the Victoria Class is more than enough to obliterate any surface ship currently in use across the world." #NT!
 ENG_carrier_1: "Тип «Корейджес»"
 ENG_carrier_1_desc: "Эти три корабля были перестроены из линкоров и стали первыми авианосцами Королевского флота. Их перестройка была следствием Вашингтонского морского соглашения 1922 года и завершилась в 1925 году. Они не могли похвастаться бронированием, зато обладали хорошим вооружением, большой дальностью действия и достойной скоростью. Но из-за особенностей конструкции их авианесущие способности были ограничены. Несмотря на это, они дали Королевскому флоту важный опыт в строительстве авианосцев и эксплуатации морской авиации."
 ENG_carrier_2: "Тип «Арк Ройял»"
 ENG_carrier_2_desc: "Авианосцы типа «Арк Ройял» были первыми кораблями, построенными в соответствии с Вашингтонским морским соглашением. Впервые была использована схема, при которой ангары и летная палуба стали неотъемлемой частью корпуса. Также они были хорошо вооружены и бронированы, несли большое число самолетов и имели достаточную дальность действия и скорость, чтобы следовать за основными силами Королевского флота."
 ENG_carrier_3: "Тип «Илластриес»"
 ENG_carrier_3_desc: "Тип «Илластриес» был разработан с учетом Второго лондонского морского договора 1936 года, который ограничивал водоизмещение авианосцев до 23000 тонн, и являлся первым британским авианосцем с бронированной летной палубой, что привело к сокращению размеров авиагруппы. Тяжелая броня и ПВО обеспечивали хорошую защиту корабля, а мощные энергетические установки и большой запас топлива — солидную дальность действия."
 ENG_carrier_4: "Тип «Имплакабл»"
 ENG_carrier_4_desc: "Авианосцы типа «Имплакабл» были заказаны в рамках военно-морской программы 1938 года и были улучшенной версией типа «Илластриес». Военные действия и смена приоритетов в сторону малых судов для защиты конвоев на ранней и средней стадии войны замедлили строительство. «Имплакабл» были большими судами, что позволяло нести больше самолетов, сохраняя толстую броню на корпусе и летной палубе. Более мощные двигатели давали им более высокую скорость и большую дальность действия в сравнении с типом «Илластриес»."
  
