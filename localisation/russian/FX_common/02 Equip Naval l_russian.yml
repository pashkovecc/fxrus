 # PHI - Philippines 
 ####################################### 
 PHI_submarine_1: "S Class" #NT!
 PHI_submarine_1_desc: "The S boats, commonly known as Sugar Boats, were a series of 51 submarines design and built in the 1920s. Over the WW1 era O & R Boat series, the S Boats were larger allowing longer range and more torpedo reloads even though the class only had four forward-facing 21 inch tubes. Despite their age, with the last S Boat to be commissioned in 1924, the S Boats comprise a significant portion of the US Navy's standing Submarine force." #NT!
 PHI_submarine_2: "Porpoise Class" #NT!
 PHI_submarine_2_desc: "The Porpoise Class submarine was the US Navy's first modern submarine designed and built following a series of experimental "V Boats" built in the late 20s and early 30s. Despite initial issues with the all-electric propulsion, the class held promise and was being considered as future designs. The class was armed with 6 torpedo tubes and a 3" deck gun." #NT!
 PHI_submarine_3: "Tarlac Class" #NT!
 PHI_submarine_3_desc: "The Tarlac class based on the Tambor Class of the US Navy was the culmination of years of US Naval experimentation of both Submarine design and was gifted by the United States to us to fit the role of "Fleet Boat" and perform well in the waters of the Pacific Ocean. Armament was upgraded to 10 torpedo tubes with four firing aft, 3" deck gun with two AA guns for additional protection." #NT!
 PHI_submarine_4: "Pampanga Class" #NT!
 PHI_submarine_4_desc: "The Pampanga Class was a continuation of the design rooted in the Tarlac class. Improvements came in the form of hull reinforcement and upgrading the deck gun to a 5"/24 caliber along with numerous subtle design improvements." #NT!
 PHI_destroyer_1: "Clemson Class" #NT!
 PHI_destroyer_1_desc: "The Clemson Class destroyer continued with many design elements of its immediate predecessor, the Wickes Class. The Clemson had improved sea handling over the Wickes Class and was armed with 4"/50 caliber main guns, a 3"/23 caliber AA gun and 12 torpedo tubes. The class was aging and was nearly obsolete, but still comprised the bulk of the US Navy's Destroyer force." #NT!
 PHI_destroyer_2: "Samar Class" #NT!
 PHI_destroyer_2_desc: "The Samar Class was the largest "1500 Tonner" design with a more streamlined torpedo arrangement and longer hull. Improvement in fire control granted better attack capabilities with its 5"/38 caliber guns and included 12 centerline torpedo tubes." #NT!
 PHI_destroyer_3: "Laguna Class" #NT!
 PHI_destroyer_3_desc: "The Laguna Class represented a large step forward in terms of destroyer capability, thanks largely to its increase to 2500 tons. While keeping the 5"/38 dual purpose guns and centerline torpedo arrangement, the class added an additional single turret and received significant increases in AA weaponry as well as improved range and larger displacement." #NT!
 PHI_destroyer_4: "Davao Class" #NT!
 PHI_destroyer_4_desc: "The Davao Class continued on the Laguna Class with displacement only marginally increased. The ship was able to take on more armament gaining dual 5"/38 caliber guns and a much larger compliment of AA weaponry. The addition of a second rudder allowed for improve maneuvering during ASW operations." #NT!
 PHI_light_cruiser_1: "Omaha Class" #NT!
 PHI_light_cruiser_1_desc: "The Omaha Class was initially designed to fill a key scouting role in the US Navy's WW1 fleet. A fast and capable class, the Omaha Class was armed with a formidable load out of 6"/53 caliber guns in an 8x1 and 2x2 turret configuration and six torpedo launchers. The Omaha Class was aging but comprised of the bulk of the US Navy's Light Cruiser force." #NT!
 PHI_light_cruiser_2: "Cotabato Class" #NT!
 PHI_light_cruiser_2_desc: "The Cotabato Class was designed with the Washington Naval Treaty in mind and so was restricted to 6" guns. To maximize firepower, the Cotabato's was armed with 15 of the new Mk16 6" guns in triple turrets. The overall design was very balanced and was considered as the basis of all future cruiser designs for the new Philippine Navy." #NT!
 PHI_light_cruiser_3: "Zambales Class" #NT!
 PHI_light_cruiser_3_desc: "The Zambales Class was based on the Cotabato Class, but without the Washington Naval Treaty restrictions. The Zambales Class keeps the 12 6" main gun arrangement, but increased its secondary 5" armament greatly and added additional AA weaponry." #NT!
 PHI_light_cruiser_4: "Palawan Class" #NT!
 PHI_light_cruiser_4_desc: "The Palawan Class improved on the successful Zambales Class. It offered improved fields of AA fire thanks to a better designed pyramid-shaped superstructure." #NT!
 PHI_heavy_cruiser_1: "Pensacola Class" #NT!
 PHI_heavy_cruiser_1_desc: "The Pensacola Class were designed under the restrictions of the Washington Naval Treaty, and sought to maximize firepower under the 8" gun restriction. It was armed with a formidable armament of 10 x 8"/55 guns. The hull armor was thin and the design was top heavy but capable. It formed the bulk of the US Navy's Heavy Cruiser force." #NT!
 PHI_heavy_cruiser_2: "Samar Class" #NT!
 PHI_heavy_cruiser_2_desc: "The Samar Class ships improved armament over the Pensacola Class and its variants with a new turret design for its 8"55 caliber guns and improved the fields of fire for its secondary armament of 5"/38 guns. " #NT!
 PHI_heavy_cruiser_3: "Nueva Ecija Class" #NT!
 PHI_heavy_cruiser_3_desc: "The Nueva Ecija Class brought together the more successful elements of previous cruiser designs and was based largely off of the Cotabato Class light cruiser married with configurations with armament and armor from the USS Wichita." #NT!
 PHI_heavy_cruiser_4: "Manila Class" #NT!
 PHI_heavy_cruiser_4_desc: "Manila Class cruisers provided broad and marginal improvements over the Cotabato Class. Most notably was the change in the super structure which allowed better fields of AA fire. Similar improvements were also found from the Cotabato to the Manila class light cruisers." #NT!
 PHI_battle_cruiser_1: "Lexington Class" #NT!
 PHI_battle_cruiser_1_desc: "The Lexington Class was initially a reaction to Japan's Kongo class battlecruiser. Ordered by the Naval Act of 1916, the ships were intended to carry 16" guns in dual turrets and be capable of 33 knots. After construction began, the US entered into the Washington Naval Treaty and the USS Lexington and USS Saratoga was converted to Carriers." #NT!
 PHI_battle_cruiser_2: "Isabela Class" #NT!
 PHI_battle_cruiser_2_desc: "The Isabela Class was a response to the German pocket battleships now more so to Japan's "super cruisers." Designed to carry 12" guns and handle up to 10" shell fire, the class was capable of cruiser speeds but sacrificed under water protection." #NT!
 PHI_battleship_1: "Zamboanga Class" #NT!
 PHI_battleship_1_desc: "The Zamboanga Class battleships were the first Filipino Battleships to be armed with the 14"/45 caliber main guns. Numerous 5"/51 guns provided secondary armament and over 10" of armor." #NT!
 PHI_battleship_2: "La Union Class" #NT!
 PHI_battleship_2_desc: "The La Union Class was a challenging design and was the first battleship class built by the US Navy in 20 years. The US Navy required this class to meet the standards of Washington Naval Treaty, limited to 36,000 tons yet be armed with the 16"/45 caliber guns and have improved armor while being capable of escorting the US Navy's fast aircraft carriers." #NT!
 PHI_battleship_3: "Ilocos Class" #NT!
 PHI_battleship_3_desc: "The Ilocos Class added all the innovations and capabilities of the earlier La Union, but substantially increases its displacement and tactical speed. The Ilocos' was primarily responsible for escorting carriers groups and was designed with a second role of "cruiser killer" in mind." #NT!
 PHI_battleship_4: "Cebu Class" #NT!
 PHI_battleship_4_desc: "The Cebu Class continued with the design and role defined by the Ilocos Class. It maintained speed and armament over armor. The Ilocos Class increased the number of 16"/50 caliber guns from 9 to 12 while it also improved boilers and machinery in order to provide more efficient high cruise speeds. Like the La Union Class, initial designs included four 4 6" guns dual turrets, but this was reverted to the dual purpose 5" twin turret emplacements to maximize AA capabilities." #NT!
 PHI_carrier_1: "Lexington Class" #NT!
 PHI_carrier_1_desc: "The Lexington Class carrier was born from the converted hulls of two Lexington Class battlecruisers in order to conform to the limitations imposed by the Washington Naval Treaty. The class was the first operational carrier class in the US Navy and spent several years improving carrier operations." #NT!
 PHI_carrier_2: "Dapitan Class" #NT!
 PHI_carrier_2_desc: "The Dapitan Class was the first Philippine Navy class designed as a carrier from the keel up. As part of a Philippine Navy smaller carrier concept the class was much smaller than the previous Lexington Class, yet still retained the same air group compliment thanks to improvements on interior designs." #NT!
 PHI_carrier_3: "Intramuros Class" #NT!
 PHI_carrier_3_desc: "With the lessons learned from the preceding Lexington and Dapitan variant classes, the result was the Intramuros Class, a fast ship able to carry a large complement of planes into battle. Damage control designs would also be carried over from the Dapitan class and a deck edge elevator was included to improve plane handling." #NT!
 PHI_carrier_4: "Cabanatuan Class" #NT!
 PHI_carrier_4_desc: "The Cabanatuan Class was the ultimate in Philippine Navy carrier capability. Implementing an armored deck and able to carry far more aircraft than previous classes, the Cabanatuan Class was being given a unique sub-class designation, CVB (Carrier Vessel Battle)." #NT!
 PHI_SH_battleship_1: "Baguio Class" #NT!
 PHI_SH_battleship_2: "Quiapo Class" #NT!
  
