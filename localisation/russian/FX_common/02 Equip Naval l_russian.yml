 # HOL - Dutch State 
 ####################################### 
 HOL_submarine_1: "Тип «K III»"
 HOL_submarine_1_desc: "Тип «K III» состоял из двух подводных лодок, построенных для Королевских ВМС Нидерландов на основе американской модификации типа «Голланд». Лодки были введены в строй в начале 20-х годов ХХ века и использовались для морских патрулей. Каждая из лодок имела водоизмещение более 580 тонн и была вооружена четырьмя 450-мм торпедными аппаратами."
 HOL_submarine_2: "Тип «О 16»"
 HOL_submarine_2_desc: "Подводная лодка типа «О 16» была построена в Нидерландах и введена в строй Королевских ВМС Нидерландов в 1936 году. Это была крупная лодка с водоизмещением более 980 тонн. Она могла погружаться на глубину до 80 метров и была вооружена восемью 533-мм торпедными аппаратами."
 HOL_submarine_3: "Тип «О 21»"
 HOL_submarine_3_desc: "Тип «О 21» состоял из семи подводных лодок, построенных и введенных в строй в Нидерландах. Эти подлодки не были закончены на момент вторжения Германии, но пять из них удалось переправить в Британию, где они служили в рядах Королевских ВМС Нидерландов во время эмиграции. Эти лодки были крупнее предыдущих типов «О», обладая водоизмещением более 990 тонн, но их вооружение все так же состояло из восьми 533-мм торпедных аппаратов."
 HOL_submarine_4: "Тип «Звардвис»"
 HOL_submarine_4_desc: "Тип «Звардвис» состоял из четырех британских подлодок типа «Таситерн», переданных Королевским ВМС Нидерландов во время эмиграции в 1943-1945 гг. Лодки имели водоизмещение в 1090 тонн, были вооружены одиннадцатью 533-мм торпедными аппаратами и могли погружаться на глубину более 100 метров."
 HOL_destroyer_1: "Тип «Ван Гент»"
 HOL_destroyer_1_desc: "Тип «Ван Гент», или «Адмирален», состоял из восьми эсминцев, построенных для Королевских ВМС Нидерландов в 1926-1931 гг. на основе ранних версий британских эсминцев типа «А». Все корабли этого типа приняли участие во Второй мировой войне и были либо затоплены, либо уничтожены. Они имели водоизмещение более 1300 тонн, были вооружены четырьмя 120-мм орудиями и обладали отличной скоростью для кораблей своей эры."
 HOL_destroyer_3: "Тип «Калленбюрг»"
 HOL_destroyer_3_desc: "Тип «Калленбюрг» являлся проектом четырех эсминцев Королевских ВМС Нидерландов. Все четыре были спущены на воду до вторжения Германии, но лишь два были достроены: один Британией и еще один Германией. Эсминцы имели водоизмещение более 1600 тонн, были вооружены пятью 120-мм орудиями и восемью 533-мм торпедными аппаратами, а также имели хорошую скорость."
 HOL_destroyer_4: "Тип «Пит Хейн»"
 HOL_destroyer_4_desc: "Тип «Пит Хейн» состоял из трех британских эсминцев типа «S», переданных Королевским ВМС Нидерландов вскоре после войны. Эти корабли имели водоизмещение более 1800 тонн, были вооружены четырьмя 120-мм орудиями и обладали широким спектром противолодочного вооружения."
 HOL_light_cruiser_1: "Тип «Ява»"
 HOL_light_cruiser_1_desc: "Нидерланды ввели в строй два легких крейсера типа «Ява» в середине 20-х годов ХХ века. Корабли были спроектированы в Германии, но построены в Нидерландах. Они имели водоизмещение около 6700 тонн, а их основное вооружение состояло из десяти 150-мм орудий. Они были легкобронированными и обладали отличной скоростью для своего типа."
 HOL_light_cruiser_2: "Тип «Де Рёйтер»"
 HOL_light_cruiser_2_desc: "Легкий крейсер «Де Рёйтер» был построен и введен в строй в Нидерландах в середине 30-х годов. Он проходил службу в основном в Голландской Ост-Индии. Крейсер имел водоизмещение более 6500 тонн и был вооружен семью 150-мм орудиями. Обладая невысокой скоростью, он в тоже время имел хорошую дальность действия."
 HOL_light_cruiser_3: "Тип «Тромп»"
 HOL_light_cruiser_3_desc: "Тип «Тромп» состоял из пары относительно небольших легких крейсеров, введенных в строй Нидерландами незадолго до вторжения Германии. Оба они служили на Дальнем Востоке и пережили войну. Их водоизмещение составляло всего 3350 тонн, а вооружение в соответствии с проектом состояло из шести 150-мм орудий."
 HOL_light_cruiser_4: "Тип «Де Зевен Провинсиен»"
 HOL_light_cruiser_4_desc: "Тип «Де Зевен Провинсиен» состоял из двух крейсеров, заложенных незадолго до вторжения Германии, но достроенных лишь в 1951 году. Финальный проект сильно отличался от первоначального плана 1939 года; в итоге два корабля обладали водоизмещением свыше 12000 тонн и вооружением из восьми 152-мм орудий. Крейсеры были хорошо бронированы для легких крейсеров своего типа и имели дальний радиус действия."
 HOL_heavy_cruiser_1: "Тип «Сурабая»"
 HOL_heavy_cruiser_1_desc: "Нидерландский крейсер «Сурабая» (изначально «Де Зевен Провинсиен») был кораблем береговой обороны, построенным в Нидерландах до Первой мировой войны. Он имел водоизмещение более 6500 тонн, а его главное вооружение состояло из двух 280-мм орудий и четырех 150-мм орудий. Крейсер принимал участие во Второй мировой войне и был потоплен японскими бомбардировщиками в 1942 году."
  
 ####################################### 
 # ITA - Kingdom of Italy 
 ####################################### 
 ITA_submarine_1: "Тип «Мамели»"
 ITA_submarine_1_desc: "«Гоффредо Мамели» — тип средних подводных лодок Королевских ВМС Италии, заложенных между 1926 и 1928 гг. Их водоизмещение было около 800 тонн, а глубина погружения составляла 100 метров. «Гоффредо Мамели» стал основой для последующих типов, таких как «Пизани», «Бандиера» и «Скуало»."
 ITA_submarine_2: "Тип «Перла»"
 ITA_submarine_2_desc: "Подводные лодки типов «Перла» и «Адуа» были построены в 30-х годах XX века. Они стали третьим и четвертым подтипом итальянской «600-й серии» подводных лодок и были меньше своих предшественников, обладая водоизмещением немногим свыше 600 тонн."
 ITA_submarine_3: "Тип «Маркони»"
 ITA_submarine_3_desc: "Тип «Маркони» состоял из шести подлодок, построенных между 1939 и 1940 годами, и стал наследником более раннего типа «Люцци». Подводные лодки обоих типов имели водоизмещение около 1000 тонн и были вооружены восемью 533-мм торпедными аппаратами. Только одна подлодка из двух типов пережила войну."
 ITA_submarine_4: "Тип «Пиетро Кальви»"
 ITA_submarine_4_desc: "Подтип «Пиетро Кальви» включал только небольшие улучшения по сравнению с предыдущим типом средних подлодок «Флутто». Произведено было лишь несколько лодок, поскольку после капитуляции Италии значительную часть корпусов захватили немцы. Переработанная версия «Пиетро Кальви» была введена в эксплуатацию лишь в 1961 году."
 ITA_destroyer_1: "Тип «Куртатоне»"
 ITA_destroyer_1_desc: "Эсминцы типа «Куртатоне» стали первыми эсминцами, построенными в Италии после Первой мировой войны, и, кроме того, первыми эсминцами с парными орудийными установками. Изначально корабли были заказаны одновременно с типом «Палестро», но их отложили из-за нехватки стали. Водоизмещение было немногим меньше 1000 тонн, а вооружение состояло из четырех 102-мм орудий и 450-мм торпедных аппаратов."
 ITA_destroyer_2: "Тип «Сольдати»"
 ITA_destroyer_2_desc: "Эсминцы типа «Сольдати» были построены в конце 30-х годов XX века двумя партиями. Первая состояла из 12 кораблей, построенных в 1938-1939 гг., вторая — еще из 5 кораблей в 1941-1942 гг. Корабли первой партии имели водоизмещение немногим больше 1800 тонн и были вооружены четырьмя 120-мм орудиями."
 ITA_destroyer_3: "Тип «Чиклоне»"
 ITA_destroyer_3_desc: "Эсминцы типа «Чиклоне» спроектированы как миноносцы, хотя являлись, по сути, эскортными эсминцами. Они немного крупнее своих предшественников типа «Орса», с водоизмещением чуть более 1100 тонн, улучшенной остойчивостью и более тяжелым противолодочным вооружением."
 ITA_destroyer_4: "Тип «Медалье д'Оро»"
 ITA_destroyer_4_desc: "Эсминцы серии «Команданти Медалье д’Оро» были заказаны для Королевских ВМС Италии, но к моменту выхода из войны их производство не началось. Корабли были заметно больше, чем предыдущие итальянские эсминцы, их водоизмещение составляло около 2100 тонн. Кроме того, они были вооружены более крупными 135-мм орудиями и имели улучшенную энергетическую установку."
 ITA_light_cruiser_1: "Тип «Таранто»"
 ITA_light_cruiser_1_desc: "Крейсеры «Таранто» и «Бари» постройки Первой мировой войны были получены от Германии в рамках репараций. Оба имеют водоизмещение между 4500 и 5100 тоннами и вооружены немецкими 150-мм орудиями."
 ITA_light_cruiser_2: "Тип «Дюка дельи Абруцци»"
 ITA_light_cruiser_2_desc: "Тип «Дюка дельи Абруцци» был пятым подтипом легких крейсеров типа «Кондоттьери». Они были построены до Второй мировой войны с целью завоевания превосходства в Средиземном море. Это были самые большие итальянские легкие крейсеры, введенные в строй во время войны; они обладали водоизмещением более 9400 тонн и хорошей броней и были вооружены десятью 152-мм орудиями."
 ITA_light_cruiser_3: "Тип «Капитани Романи»"
 ITA_light_cruiser_3_desc: "Легкие крейсеры типа «Капитани Романи» должны были превосходить ходовыми качествами и огневой мощью новые французские эсминцы конца 30-х годов. В 1939 году было заказано двенадцать корпусов, однако только три из них построили до выхода Италии из войны. Крейсеры легкобронированные, их водоизмещение составляет всего 3700 тонн, но при этом они развивают довольно высокую скорость. Вооружение состоит из восьми 135-мм орудий."
 ITA_light_cruiser_4: "Тип «Сан-Марко»"
 ITA_light_cruiser_4_desc: "Тип «Сан-Марко» является улучшенной версией легких крейсеров «Капитани Романи». Из-за выхода Италии из войны «Сан-Марко» и его переработанный однотипник «Сан-Джорджо» не были введены в строй до 50-х годов."
 ITA_heavy_cruiser_1: "Тип «Тренто»"
 ITA_heavy_cruiser_1_desc: "Тяжелые крейсеры типа «Тренто» были спроектированы для Королевских ВМС Италии в конце 20-х годов XX века. Они стали первыми кораблями, разработанными с учетом Вашингтонского морского соглашения, которое ограничивало крейсеры водоизмещением в 10000 тонн и 8-дюймовыми орудиями. Последний корабль типа, «Больцано», имел улучшенную конструкцию и был спущен на воду в 1932 году."
 ITA_heavy_cruiser_2: "Тип «Сан-Джорджо»"
 ITA_heavy_cruiser_2_desc: "«Сан-Джорджо» — гипотетический тип межвоенных тяжелых крейсеров, которые должны были быть запущены незадолго до начала войны. Они обладали бы водоизмещением более 11000 тонн и вооружением, состоящим из восьми 203-мм орудий."
 ITA_heavy_cruiser_3: "Тип «Пиза»"
 ITA_heavy_cruiser_3_desc: "«Пиза» — гипотетический тип тяжелых крейсеров межвоенного периода. Он имел бы водоизмещение около 12000 тонн и был способен выступать в роли лидера патрульных групп."
 ITA_heavy_cruiser_4: "Тип «Гарибальди»"
 ITA_heavy_cruiser_4_desc: "«Гарибальди» — гипотетический тип тяжелых крейсеров позднего периода войны с водоизмещением около 14000 тонн, вооружением из восьми 203-мм орудий и скоростью, достаточной для сопровождения большинства авианосцев и других крупных кораблей."
 ITA_battle_cruiser_1: "Тип «Караччоло»"
 ITA_battle_cruiser_1_desc: "«Франческо Караччоло» — тип линкоров, предложенный сразу после Первой мировой войны. Он должен был иметь водоизмещение около 34000 тонн и хорошее бронирование и быть сравнительно быстрым для своего размера и типа. Был заложен только один корабль, но строительство отменили в 1921 году."
 ITA_battle_cruiser_2: "Тип «Принчипе Амедео»"
 ITA_battle_cruiser_2_desc: "«Принчипе Амедео» — гипотетический тип линейных крейсеров конца 1930-х годов. Он сравним с французскими линейными крейсерами типа «Дюнкерк», имеет водоизмещение около 30000 тонн и вооружен 320-мм орудиями главного калибра."
 ITA_battleship_1: "Тип «Конте ди Кавур»"
 ITA_battleship_1_desc: "Линкоры типа «Конте ди Кавур» были введены в строй во время Первой мировой войны. Они несли 305-мм орудия, обладали водоизмещением в 23000 тонн и самой высокой скоростью среди линкоров эпохи дредноутов. Начиная с 1933 года два оставшихся корабля подверглись серьезной перестройке, во время которой были увеличены их размеры и вооружение, а также повышена эффективность для соответствия требованиям к новым «быстрым» линкорам того времени."
 ITA_battleship_2: "Тип «Кайо Дуилио»"
 ITA_battleship_2_desc: "Линкоры типа «Кайо Дуилио» изначально были введены в строй в начале Первой мировой войны. Однако между 1937 и 1940 годами оба корабля этого типа подверглись полной перестройке. Их вооружение было заменено на десять 320-мм орудий M1934, водоизмещение увеличилось до 29000 тонн, а скорость улучшилась достаточно, чтобы «Кайо Дуилио» можно было типифицировать как «быстрые» линкоры."
 ITA_battleship_3: "Тип «Литторио»"
 ITA_battleship_3_desc: "Тип «Литторио», также иногда называемый типом «Витторио Венето» по названию самого известного корабля типа, был наиболее современным из всех линкоров, используемых Италией в период Второй мировой войны. Линкоры «Литторио», обладавшие водоизмещением в 40000 тонн и достаточно быстрые для своих размеров, стали основой итальянского флота."
 ITA_battleship_4: "Тип «Имперо»"
 ITA_battleship_4_desc: "«Имперо» — гипотетический тип послевоенных линкоров водоизмещением в 43000 тонн. Они вооружены 318-мм орудиями и хорошо бронированы."
 ITA_carrier_1: "Тип «Джузеппе Миралья»"
 ITA_carrier_1_desc: "«Джузеппе Миралья» — гипотетический тип авианосцев раннего межвоенного периода, сравним с американским «Лексингтоном» и японскими авианосцами «Кага» и «Акаги»."
 ITA_carrier_2: "Тип «Фалько»"
 ITA_carrier_2_desc: "«Фалько» — гипотетический тип итальянских авианосцев межвоенного периода, сравним с американским типом «Йорктаун» и британским «Арк Роял». Он обладает водоизмещением порядка 21000 тонн и приличным бронированием и несет авиагруппу среднего размера."
 ITA_carrier_3: "Тип «Аквила»"
 ITA_carrier_3_desc: "«Аквила» — запланированная конверсия океанского лайнера «Рома» в авианосец. Она была начата в 1941 году, но проект так и не довели до конца. Достроенная «Аквила» имела бы водоизмещение в 235000 тонн и была бы сравнима с японским «Хиё» и британским «Индомитебл»."
 ITA_carrier_4: "Тип «Спарвиеро»"
 ITA_carrier_4_desc: "«Спарвиеро» также представлял собой план конверсии океанского лайнера «Аугустус». Ее начали в 1942 году, но также не завершили. После выхода Италии из войны судно было захвачено и затоплено Германией. Авианосец имел бы водоизмещение в 30400 тонн, хорошее бронирование и сильную батарею ПВО."
 ITA_SH_battleship_1: "Тип «Реджина Маргерита»"
 ITA_SH_battleship_1_desc: "«Реджина Маргерита» — гипотетический тип тяжелых линкоров, спущенных на воду незадолго до начала войны. Они сравнимы с японским типом линкоров «Ямато»: хорошо бронированы, с водоизмещением порядка 60000 тонн и вооружением из 406-мм орудий."
 ITA_SH_battleship_2: "Тип «Реджина Елена»"
 ITA_SH_battleship_2_desc: "«Реджина Елена» — гипотетический тип тяжелых линкоров, спущенный на воду примерно к моменту вступления Италии в войну. Линкоры сравнимы с американским типом «Монтана»: они тяжело бронированы, имеют водоизмещение порядка 70000 тонн и вооружены 406-мм орудиями главного калибра. При этом корабли этого типа почти не уступают в скорости «быстрым» линкорам своего времени."
  
 ####################################### 
 # JAP - Empire of Japan 
 ####################################### 
 JAP_submarine_1: "Тип «Кайтю»"
 JAP_submarine_1_desc: "Подводные лодки типа «Кайтю» были построены после Первой мировой на основе предыдущих разработок. Новые модели были среднего размера, по меркам своего времени обладали адекватными вооружением, скоростью и дальностью, но к 1938 году уже несколько устарели. Всего в серии было построено 42 лодки в семи различных вариантах."
 JAP_submarine_2: "Тип «Кайдай VI»"
 JAP_submarine_2_desc: "Подводные лодки типа «Кайдай IV» были крупными и хорошо вооруженными, с большим запасом хода и не худшей скоростью. Все образцы серии «Кайдай» успешно несли службу в Императорском флоте Японии до завершения боевых действий на Тихом океане."
 JAP_submarine_3: "Тип «Ко-Гата»/«Оцу-Гата»/«Хэй-Гата»"
 JAP_submarine_3_desc: "Типы «Ко-Гата», «Оцу-Гата» и «Хэй-Гата» представляли собой крупные «крейсерские» подводные лодки, выполняющие роль флагманов подводных эскадр. Они обладали современной радиоаппаратурой и мощными торпедами, а также большой дальностью. «Ко-Гата» и «Оцу-Гата» несли на борту разведывательные гидросамолеты."
 JAP_submarine_4: "Тип «Сэнтоку»"
 JAP_submarine_4_desc: "Подводные авианосцы «Сэнтоку» представляли собой крупнейшие подводные корабли периода Второй мировой. Они обладали мощным торпедным вооружением, высокой скоростью и большой дальностью, батареей ПВО и тремя самолетами М6А «Сейран» для воздушной разведки и легких авиаударов."
 JAP_destroyer_1: "Тип «Минекадзе»"
 JAP_destroyer_1_desc: "Эсминцы типов «Минекадзе», «Камикадзе» и «Муцуки» несли мощное пушечное и торпедное вооружение, но слабую батарею ПВО. К началу Второй мировой они уже считались устаревшими и использовались в основном во вспомогательных ролях."
 JAP_destroyer_2: "Тип «Асасио»"
 JAP_destroyer_2_desc: "Эсминцы типа «Асасио» стали первыми японскими эсминцами водоизмещением более 2000 тонн и оснащенными сонаром. Они были вооружены тяжелыми торпедными аппаратами и легкой батареей ПВО, а также обладали чуть большей дальностью действия, чем предыдущий тип «Фубуки»."
 JAP_destroyer_3: "Тип «Акицуки»"
 JAP_destroyer_3_desc: "Эсминцы типа «Акицуки» обладали хорошим артиллерийским и торпедным вооружением и ПВО адекватной мощности, а также несли глубинные бомбы. Из 39 запланированных кораблей были достроены только 12, после чего серия была отменена."
 JAP_destroyer_4: "Тип «Симакадзе»"
 JAP_destroyer_4_desc: "Эсминец типа «Симакадзе» на момент создания стал самым быстрым эсминцем в мире. Это был прототип для испытания инновационных высокотемпературных турбин высокого давления – невероятно быстрый (благодаря агрегатам, сравнимым по размеру с теми, что устанавливались на крейсеры), вооруженный тяжелыми торпедами, но, впрочем, страдавший от сниженной дальности."
 JAP_light_cruiser_1: "Тип «Тэнрю»"
 JAP_light_cruiser_1_desc: "Легкие крейсеры типа «Тэнрю» обладали водоизмещением около 4400 тонн и легким вооружением по сравнению с однотипниками, что компенсировалось высокой скоростью и достойным торпедным вооружением. «Тэнрю» отводилась роль флагманов флотилий эсминцев, поэтому тип считался переходным между легкими крейсерами и крупными эсминцами."
 JAP_light_cruiser_2: "Mogami-Sho Class" #NT!
 JAP_light_cruiser_2_desc: "Mogami class cruisers initially were heavily armed, equipped with good armor and strong engines that provided high speed. The good AA defense and high speed ensured a long range of operations. However, the top heavy design led to instability during operations. With the Maru 2 Program, they were rebuilt as heavy cruisers." #NT!
 JAP_light_cruiser_3: "Тип «Агано»"
 JAP_light_cruiser_3_desc: "Легкие крейсеры типа «Агано» были задуманы в качестве флагманов эскадр эсминцев. Они были быстрыми и обладали адекватным вооружением (три спаренных 152-мм орудия), но страдали от недостаточной эффективности ПВО и легкого бронирования."
 JAP_light_cruiser_4: "Тип «Агацума»"
 JAP_light_cruiser_4_desc: "«Агацума» – тип легких крейсеров, работа над которым до конца войны так и не началась. Предполагалось, что это будут легкобронированные быстрые корабли с тяжелым вооружением, задачей которых будет защита флотов и авианосцев от авиации противника."
 JAP_heavy_cruiser_1: "Furutaka/Aoba Class" #NT!
 JAP_heavy_cruiser_1_desc: "Тип «Фурутака» и последовавший за ним тип «Аоба» были первыми тяжелыми крейсерами Императорского флота. В их основу легла конструкция крейсеров типа «Омаха» (США) и «Хокинс» (Британия). Позже в процессе модернизации на них было установлено дополнительное вооружение и более мощная энергетическая установка."
 JAP_heavy_cruiser_2: "Mogami-Kai Class" #NT!
 JAP_heavy_cruiser_2_desc: "The Mogami-Kai class is a rebuilt version of the Mogami class Light Cruisers, nicknamed Mogami-Sho. The Mogami-Kai design increased their displacement, allowing for more stable designs. The armaments of the Mogami-Kai design increased, while the speed and armor were also improved to fully utilize the increased displacemente." #NT!
 JAP_heavy_cruiser_3: "Тип «Тонэ»"
 JAP_heavy_cruiser_3_desc: "Тип тяжелых крейсеров «Тонэ» изначально был задуман как легкие крейсеры, но затем их вооружение усилили. Корабли были уникальны тем, что все вооружение на них устанавливалось спереди, в то время как корма использовалась для запуска и обслуживания гидросамолетов-разведчиков."
 JAP_heavy_cruiser_4: "Тип «Ибуки»"
 JAP_heavy_cruiser_4_desc: "Тяжелые крейсеры «Ибуки» – последний заказ на крейсеры для Императорского флота. Они представляли собой улучшенный вариант типа «Могами» с тем же вооружением и бронированием, но улучшенной ПВО и новой энергетической установкой."
 JAP_battle_cruiser_1: "Kongo Class" #NT!
 JAP_battle_cruiser_1_desc: "The Kongo battlecruisers were built for the IJN just before the Great War, and was one of the best battlecruisers during the interwar period. With the Navy seizing the opportunity of the Fourth Fleet incident, the 4 Kongos recieved modifications. The modified design is named the Kongo-Kai design." #NT!
 JAP_battle_cruiser_2: "Тип B-56"
 JAP_battle_cruiser_2_desc: "Линейные крейсеры проекта «Тип B-56» представляли собой быстрые, умеренно бронированные корабли с мощной зенитной батареей и современным вооружением и предназначались для боя с тяжелыми крейсерами ВМФ США и защиты авианосцев Императорского флота."
 JAP_battleship_1: "Тип «Фусо»"
 JAP_battleship_1_desc: "The Fuso class battleships were built during WWI and modernized in the 1930's with the Maru 2 Program. They were well-armored and armed, with the 6 twin turrets on the centerline giving a heavy broadside, but also limiting the extra AA weaponry these ships could carry." #NT!
 JAP_battleship_2: "Nagato Class" #NT!
 JAP_battleship_2_desc: "The Nagato-class battleship was a class of two battleships, laid during the later parts of the Great War but finished after the war. Both Nagato and Mutsu are regarded as the pride of the Japan. Both were modernized with the Maru 2 Program, improving their armor, armaments and other machinery." #NT!
 JAP_battleship_3: "Тип «Тадзима»"
 JAP_battleship_3_desc: "«Тадзима» представлял собой гипотетический тип скоростных линкоров, которые должны были быть дешевле и быстрее в производстве, чем массивный «Ямато». Планировалось, что линкоры получат старые орудия от предыдущих типов, но будут обладать хорошей скоростью, достойным бронированием и мощной системой ПВО."
 JAP_battleship_4: "Тип «Ивами»"
 JAP_battleship_4_desc: "«Ивами» – гипотетический тип линкоров. При их строительстве планировалось использовать новые методы, чтобы ускорить процесс. В результате получился бы хорошо вооруженный и защищенный от налетов с воздуха линкор, способный противостоять любому однотипнику. Однако расплачиваться за это пришлось бы невысокой скоростью хода."
 JAP_SH_battleship_1: "Тип «Ямато»"
 JAP_SH_battleship_1_desc: "Линкор типа «Ямато» – самый большой и тяжелый военный корабль в мире, построенный в рамках программы «Богини мира» для Императорского флота Японии. Он обладал водоизмещением в 72000 тонн и нес девять 460-мм орудий – самое мощное вооружение, когда-либо устанавливавшееся на военное судно."
 JAP_SH_battleship_2: "Тип «Супер-Ямато»"
 JAP_SH_battleship_2_desc: "«Супер-Ямато» – гипотетический улучшенный вариант на базе «Ямато», но с еще более мощным вооружением (510-мм орудия и новейшие зенитные установки) и водоизмещением в районе 70000-80000 тонн. Его броня была способна выдержать попадание собственных орудий."
 JAP_carrier_1: "Hōshō Class" #NT!
 JAP_carrier_1_desc: "Hōshō was the world's first commissioned ship that was designed and built as an aircraft carrier, and the first aircraft carrier of the Imperial Japanese Navy. Commissioned in 1922, the ship was used for testing carrier aircraft operations equipment, techniques, such as take-offs and landings, and carrier aircraft operational methods and tactics." #NT!
 JAP_carrier_2: "Тип «Сорю»"
 JAP_carrier_2_desc: "«Сорю» и «Хирю» представляли зеркальные копии друг друга, чтобы ускорить посадку авиации при совместных действиях. Авианосцы обладали водоизмещением в 20000 тонн, высокой скоростью за счет мощной энергетической установки и большой авиагруппой, но страдали от недостаточного бронирования."
 JAP_carrier_3: "Тип «Секаку»"
 JAP_carrier_3_desc: "Авианосцы типа «Секаку» обладали высокой скоростью, большим запасом хода и тяжелой броней и несли большое количество авиации при водоизмещении в 33000 тонн. Улучшенная конструкция позволяла выдерживать больший уровень повреждений, чем другим их однотипникам того же периода."
 JAP_carrier_4: "Тип «Тайхо»"
 JAP_carrier_4_desc: "Тип «Тайхо» представлял собой первый полностью бронированный авианосец Императорского флота с бронированной летной палубой и был способен выдержать множество попаданий бомб и торпед без потери боеспособности. Большая численность авиации и мощная батарея ПВО позволяли защитить от самолетов противника не только себя, но и весь флот."
  
 ####################################### 
 # LAT - Latvia 
 ####################################### 
 LAT_submarine_1: "Тип «Ронис»"
 LAT_submarine_1_desc: "Тип «Ронис» состоял из двух подводных лодок, построенных во Франции для ВМС Латвии и введенных в строй в 1927 году. Это были малые подлодки водоизмещением всего в 390 тонн и с вооружением из шести 533-мм торпедных аппаратов."
  
 ####################################### 
 # NOR - Norway 
 ####################################### 
 NOR_submarine_1: "Тип «В»"
 NOR_submarine_1_desc: "Шесть подводных лодок типа «B» были построены в Норвегии по проекту «Американский Голланд» и введены в строй в 1923-1930 гг. Они имели водоизмещение в 420 тонн, были вооружены четырьмя 450-мм торпедными аппаратами и могли погружаться на глубину в 60 метров."
 NOR_submarine_3: "Тип «Уредд»"
 NOR_submarine_3_desc: "Тип «Уредд» состоял из двух британских подлодок типа «U», построенных для ВМС Норвегии в 1941-1943 гг. Лодки имели водоизмещение в 540 тонн и были вооружены четырьмя 533-мм торпедными аппаратами, а также были оснащены радаром и сонаром британского производства и могли погружаться на глубину до 60 метров."
 NOR_submarine_4: "Тип «Утсира»"
 NOR_submarine_4_desc: "KThe Utsira class consisted of four British Vampire-class submarines. They were built between 1943 and 1944, though only one was transferred to the Norwegian Navy in exile before the end of the war. The ships were only a moderate improvement over the preceding U-class. They displaced 545 tons, were armed with four 533mm torpedo tubes, and a diving depth of 90m." #NT!
 NOR_destroyer_1: "Тип «Дрёуг»"
 NOR_destroyer_1_desc: "«Дрёуг» — первый тип эсминцев ВМС Норвегии, состоявший из нескольких кораблей. Эсминцы были введены в строй незадолго до Первой мировой войны и имели водоизмещение в 580 тонн. В качестве основного вооружения были установлены три 3-дюймовых британских орудия. При этом корабли были довольно медленными в сравнении с другими эсминцами своей эпохи."
 NOR_destroyer_2: "Тип «Слейпнер»"
 NOR_destroyer_2_desc: "Большие миноносцы типа «Слейпнер» были построены и введены в строй в Норвегии в 1937-1939 гг. В отличии от более раннего типа «Дрёуг», «Слейпнер» имел сравнительно хорошее пушечное и противолодочное вооружение, водоизмещение в 735 тонн и отличную для своего размера скорость."
 NOR_destroyer_3: "Тип «Олесунн»"
 NOR_destroyer_3_desc: "Тип «Олесунн» состоял из двух эсминцев, заложенных в 1939 году, но так и не достроенных на момент немецкой оккупации. Если бы они были завершены, то стали бы первыми норвежскими эсминцами, сопоставимыми с эсминцами ведущих держав, имея водоизмещение более 1200 тонн. Их планировалось вооружить четырьмя 120-мм орудиями и четырьмя 533-мм торпедными аппаратами."
 NOR_destroyer_4: "Тип «Сторд»"
 NOR_destroyer_4_desc: "Тип «Сторд» состоял из четырех британских эсминцев типа «S», построенных для Королевских ВМС Норвегии в 1943-1944 гг. Корабли имели водоизмещение почти в 1800 тонн и были вооружены четырьмя 120-мм орудиями и восемью 533-мм торпедными аппаратами. Кроме того, они были оснащены отличными радарами и противолодочным оборудованием. Эсминцы развивали высокую скорость и отличались высокой надежностью."
 NOR_heavy_cruiser_1: "Тип «Норге»"
 NOR_heavy_cruiser_1_desc: "Корабль береговой обороны «Норге» был построен в Британии для Норвегии в начале века. Его вооружение, сосредоточенное вокруг двух 210-мм орудий, было сравнимо с вооружением тяжелого крейсера, но при водоизмещении немногим больше 4200 тонн по размеру «Норге» был ближе к легким крейсерам, а по скорости сравним с дредноутами. Это был один из четырех кораблей береговой обороны, которые находились в строю Королевских ВМС Норвегии на начало Второй мировой войны."
  
 ####################################### 
 # NZL - Dominion of New Zealand 
 ####################################### 
 NZL_submarine_1: "Тип «L»"
 NZL_submarine_1_desc: "Тип «L» — лодки среднего размера, изначально спроектированные в рамках экстренной военной программы как улучшенные версии предшествующих типов. Они были построены ближе к концу Первой мировой войны и оборудованы новыми большими 21-дюймовыми торпедами. Оставались в строю до начала Второй мировой, после чего были переведены на вспомогательные и учебные задачи."
 NZL_submarine_2: "Тип «T»"
 NZL_submarine_2_desc: "Лодки типа «T», или «Трайтон», были разработаны для замены больших подлодок типов «O», «P» и «R». Они были умеренно большими, с большой дальностью, хорошо подготовленными для действий в Атлантическом и Тихом океанах. Тип «Т» оказался мощной и устойчивой платформой и широко использовался во время войны: 25% всех построенных лодок были потеряны в бою."
 NZL_submarine_3: "Тип «U»"
 NZL_submarine_3_desc: "Тип «U» — подводные лодки малого размера, построенные в рамках экстренных военных программ 1940 и 1941 годов. Изначально спроектированы как учебные подлодки, но после начала войны в конструкцию были внесены изменения, позволяющие им быть полезными в акваториях Северного и Средиземного морей. Этот тип состоял из трех подтипов: «Андин», «Ампайр» и «Апрор»."
 NZL_submarine_4: "Тип «V»"
 NZL_submarine_4_desc: "Подводные лодки типа «V», или «Вэмпайр», основывались на конструкции предыдущего типа «U». Они были больше, но все еще относительно малы и обладали лучшими мореходными качествами, но с ограниченными дальностью действия и вооружением."
 NZL_destroyer_1: "Тип «V»/«W»"
 NZL_destroyer_1_desc: "Эти эсминцы включали в себя типы «V» и «W» постройки Адмиралтейства и «Торникрофт», созданные в рамках экстренной военной программы. Новые типы являлись венцом эволюции британских эсминцев, воплощая в себе улучшения своих предшественников, а также новые технологические достижения. Большое количество этих кораблей было построено во время поздней стадии Первой мировой войны и стало впоследствии основой флотилий эсминцев Королевского флота. С 30-х годов XX века эсминцы были направлены в резервный флот и в конечном итоге переведены на эскорт конвоев. Типы «V» и «W» были солидно вооруженными быстрыми кораблями с хорошей дальностью действия."
 NZL_destroyer_2: "Тип «G»/«H»/«I»"
 NZL_destroyer_2_desc: "Эсминцы типов «G», «H» и «I» были заказаны в рамках военно-морских строительных программ 1933 и 1934 годов. Они представляли собой несколько уменьшенную в размере копию предыдущего типа «F». Вооружение на «G»- и «H»-типах было идентичным: оба использовали 4,7-дюймовые орудия. Эти корабли имели большую дальность действия, удовлетворительное вооружение и мощное торпедное оснащение. Они широко использовались в военное время и понесли заметные потери."
 NZL_destroyer_3: "Тип «J»/«K»/«N»"
 NZL_destroyer_3_desc: "Типы «J», «K» и «N» схожи с ранним типом «Трайбал», но вместо усиления орудийного вооружения конструкторы вернулись к более стандартной схеме с тяжелыми торпедами и легкими орудиями. За время службы в военный период корабли были модифицированы. Улучшения включали в себя усиленную систему ПВО и радар. Эти эсминцы отличались скоростью, дальностью действия и хорошим вооружением и идеально подходили для роли флотских эскортов."
 NZL_destroyer_4: "Тип «Бэттл»"
 NZL_destroyer_4_desc: "В эсминцах типа «Бэттл» представлено развитие британских эсминцев за годы войны. Корабли были заказаны в рамках военно-морской программы 1942 и 1943 годов. Они были хорошо вооружены как орудиями, так и торпедами. Это, а также скорость и дальность действия, сделали их достаточно универсальными кораблями, но позднее появление не позволило внести ощутимый вклад в победу."
 NZL_light_cruiser_1: "Тип «С»"
 NZL_light_cruiser_1_desc: "Двадцать восемь легких крейсеров типа «С» были построены до и во время Первой мировой войны для использования в суровых условиях Северного моря. Они оказались прочными и эффективными судами, несмотря на малый размер и тесные условия. Вооружение было более чем удовлетворительным: они несли достаточно 6-дюймовых орудий и большой запас торпед. Тип «С» активно использовался во время Первой мировой и принял участие во многих сражениях. Всего лишь три подтипа оставались в составе флота к середине 1930-х: «Каледон», «Серес» и «Карлайл»."
 #NZL_light_cruiser_1c: "Leander Class"
 NZL_light_cruiser_2: "Тип «Саутгемптон»"
 NZL_light_cruiser_2_desc: "Легкие крейсеры типа «Саутгемптон» — подтип крейсеров «Таун» — были спроектированы для противодействия японским крейсерам типа «Могами». Они были хорошо бронированы, имели приличную скорость и дальность действия и несли грозное вооружение из двенадцати 6-дюймовых орудий в четырех тройных башнях. Тип «Саутгемптон» стал основой для многих последующих проектов легких крейсеров Королевского флота времен войны."
 NZL_light_cruiser_3: "Тип «Гамбия»"
 NZL_light_cruiser_3_desc: "The Gambia class was the New Zeland designation for British Crown Colony-class light cruisers. These were improved versions of the earlier Town class but with a simplified design to speed up construction and reduce costs. The ships carried the same guns as their predecessors, four triple turrets housing 6 in. guns. They were similarly armored but because of their smaller engines, their range was somewhat reduced. The type included two subclasses: Fiji and Ceylon." #NT!
 NZL_light_cruiser_4: "Тип «Блэк Принс»"
 NZL_light_cruiser_4_desc: "«Блэк Принс» — новозеландское обозначение для британских легких крейсеров типа «Минотавр» («Свифтшур»). Эти корабли были спроектированы на базе типа «Уганда» с учетом модификаций, принятых в 1941 году. Крейсеры имели большую дальность действия и более мощную систему ПВО, чем тип «Уганда», но основное вооружение было сокращено до трех трехорудийных башен. Крейсеры были построены слишком поздно, чтобы оказать влияние на исход войны; после ее окончания большинство заказанных судов было отменено. "
 NZL_heavy_cruiser_1: "Тип «Хокинс»"
 NZL_heavy_cruiser_1_desc: "Крейсеры типа «Хокинс» стали первыми тяжелыми крейсерами в мире. Конструкция основывалась на более раннем типе «Таун», в частности, на подтипе «Бирмингем», однако обладала 7,5-дюймовыми орудиями и более толстым бронепоясом. Корабли проектировали для борьбы с большими германскими рейдерами; как следствие, они были хорошо вооружены, имели достаточную скорость и дальность плаванья и хорошую защиту. В общей сложности пять кораблей были введены в эксплуатацию, но только четыре оставались в строю на начало Второй мировой войны."
 NZL_heavy_cruiser_2: "Тип «Суррей»"
 NZL_heavy_cruiser_2_desc: "Тяжелые крейсеры типа «Суррей» были предложены в рамках военно-морской программы 1928 года. Они являлись улучшенной версией более ранних тяжелых крейсеров «Йорк». Если бы их строительство было завершено, они были бы оборудованы четырьмя двухорудийными башнями с 8-дюймовыми орудиями, более тяжелой броней и более мощной энергетической установкой. Два корабля были заказаны, но не один из них так и не был заложен."
 NZL_heavy_cruiser_3: "Тип «Адмирал»"
 NZL_heavy_cruiser_3_desc: "Тяжелые крейсеры типа «Адмирал» (не путать с линейными крейсерами типа «Адмирал») были последней попыткой Королевского флота спроектировать и построить крейсеры с 8-дюймовыми орудиями. Разработки проекта начались в 1938 и закончились в 1941 году. Окончательный вариант включал в себя новые 8-дюймовые орудия в тройных башнях, мощную систему ПВО, толстую броню и хорошую скорость. Отсутствие вражеских крейсеров и сравнительная дороговизна этих кораблей привели к отказу от проекта в пользу большего количества легких крейсеров."
 NZL_heavy_cruiser_4: "Тип «Черчилль»"
 NZL_heavy_cruiser_4_desc: "Проект этих кораблей был предложен сэром Уинстоном Черчиллем, лордом Адмиралтейства, на ранней стадии Второй мировой войны для противодействия германским крейсерам типа «Дойчланд». Эти корабли должны были иметь 9,2-дюймовые орудия, мощные орудия ПВО и крепкую броню. Они были спроектированы для эффективной борьбы с тяжелыми кораблями противника. В итоге проект был отменен из-за высокой стоимости и отсутствия необходимости в новых тяжелых крейсерах."
 NZL_battle_cruiser_1: "Тип «Ринаун»"
 NZL_battle_cruiser_1_desc: "Линейные крейсера типа «Ринаун» изначально были заложены как улучшенные версии типа «Ривендж». Их строительство было приостановлено в начале Первой мировой войны, но лорду Фишеру удалось возродить их в качестве линейных крейсеров. Эти корабли являлись образцовыми линейными крейсерами: они были хорошо вооружены, быстры и маневренны, но имели более слабое бронирование и меньшую дальность действия. Только два из трех кораблей, «Рипалс» и «Ринаун», были завершены."
 NZL_battle_cruiser_2: "Тип «Принсесс Ройял»"
 NZL_battle_cruiser_2_desc: "«Принсесс Ройял» — тип гипотетических линейных крейсеров, более быстрые и дешевые версии линкоров типа «Кинг Джордж V». Эти корабли несли на себе схожее, но ослабленное вооружение: два тройных 14-дюймовых орудия и шесть сдвоенных 5,25-дюймовых орудий ПВО. Высокая скорость и большая дальность действия крейсеров предоставила бы Королевскому флоту возможность наносить быстрые удары и охранять конвои, но их слабое вооружение стало бы проблемой, если бы им пришлось сражаться с современными линкорами."
 NZL_battleship_1: "Тип «Ривендж»"
 NZL_battleship_1_desc: "Линкоры класса «Ривендж» были заказаны в 1913 году и являлись удешевленным вариантом быстрых дредноутов класса «Куин Элизабет». Они напоминали исходный проект бронированием и вооружением, но были ощутимо медленнее и, как следствие, в период Второй мировой войны использовались на вторых ролях. Из 8 запланированных кораблей были достроены только 5."
 NZL_battleship_2: "Тип «Кинг Джордж V»"
 NZL_battleship_2_desc: "Линкоры типа «Кинг Джордж V» стали результатом Вашингтонского морского соглашения 1922 года и Первого лондонского морского договора 1930 года, которые ограничивали водоизмещение и вооружение крупных боевых кораблей. Как следствие, линкоры были оснащены орудиями меньшего калибра, чем более ранние образцы и даже современники. Несмотря на более скромный калибр, они были удовлетворительно вооружены в целом, отличались усиленной системой ПВО и достойным бронированием. Пять кораблей были заказаны и заложены как замена устаревших линкоров типа «Куин Элизабет»."
 NZL_battleship_3: "Тип «Лайон»"
 NZL_battleship_3_desc: "Линкоры типа «Лайон» были продолжением типа «Кинг Джордж V» и сочетали в себе многие из его особенностей. Шесть кораблей были заказаны в рамках военно-морской программы 1938 года для замены устаревших линкоров типа «Ривендж», но ни один из них не был закончен из-за начала военных действий. От типа «Кинг Джордж V» их отличало более мощное основное вооружение в виде 16-дюймовых орудий. Также они должны были обладать более толстой броней и более мощными энергетическими установками."
 NZL_battleship_4: "Тип «Вэнгард»"
 NZL_battleship_4_desc: "Линкоры типа «Вэнгард» были последними линкорами, построенными для Королевского флота. Был заказан только один корабль, но еще четыре рассматривались для Тихоокеанского театра военных действий. Заказанное в рамках экстренной военной программы 1940 года строительство не получило высокого приоритета и было завершено только после окончания войны. «Вэнгард» имел гладкий корпус, который обеспечивал ему отличную остойчивость и мореходность. Вооружение было таким же, как у типов «Куин Элизабет» и «Ривендж», что гарантировало значительную огневую мощь. Мощные энергетические установки и хорошая броня сделали их быстрыми и хорошо защищенными кораблями."
 NZL_SH_battleship_1: "Тип «Центурион»"
 NZL_SH_battleship_1_desc: "«Центурион» — гипотетический тип линкоров Королевского флота, построенный для противодействия крупным боевым кораблям Германии и Японии. Большие 18-дюймовые орудия и толстая броня обеспечивали этот корабль необходимой огневой мощью и защитой для сражения с противником. Сильная система ПВО, большая дальность действия и хорошая скорость были необходимы для защиты обширной акватории Британской империи."
 NZL_SH_battleship_2: "Тип «Лайон-2»"
 NZL_SH_battleship_2_desc: "Линкоры типа «Лайон-2» были разработаны в 1944 году как улучшенная версия более ранних линкоров типа «Лайон». Учитывая нужды военного времени, новый линкор был больше и тяжелее, и, если бы он был завершен, нес бы три или четыре трехорудийные 16-дюймовые башни последней модели. Толстые бронеплиты защищали корабль от любого надводного или воздушного противника. Стоимость постройки, а также поражение вражеских флотов и потребность в авианосцах привели к отмене проекта."
 NZL_carrier_1: "Тип «Корейджес»"
 NZL_carrier_1_desc: "Эти три корабля были перестроены из линкоров и стали первыми авианосцами Королевского флота. Их перестройка была следствием Вашингтонского морского соглашения 1922 года и завершилась в 1925 году. Они не могли похвастаться бронированием, зато обладали хорошим вооружением, большой дальностью действия и достойной скоростью. Но из-за особенностей конструкции их авианесущие способности были ограничены. Несмотря на это, они дали Королевскому флоту важный опыт в строительстве авианосцев и эксплуатации морской авиации."
 NZL_carrier_2: "Тип «Арк Ройял»"
 NZL_carrier_2_desc: "Авианосцы типа «Арк Ройял» были первыми кораблями, построенными в соответствии с Вашингтонским морским соглашением. Впервые была использована схема, при которой ангары и летная палуба стали неотъемлемой частью корпуса. Также они были хорошо вооружены и бронированы, несли большое число самолетов и имели достаточную дальность действия и скорость, чтобы следовать за основными силами Королевского флота."
 NZL_carrier_3: "Тип «Илластриес»"
 NZL_carrier_3_desc: "Тип «Илластриес» был разработан с учетом Второго лондонского морского договора 1936 года, который ограничивал водоизмещение авианосцев до 23000 тонн, и являлся первым британским авианосцем с бронированной летной палубой, что привело к сокращению размеров авиагруппы. Тяжелая броня и ПВО обеспечивали хорошую защиту корабля, а мощные энергетические установки и большой запас топлива — солидную дальность действия."
 NZL_carrier_4: "Тип «Имплакабл»"
 NZL_carrier_4_desc: "Авианосцы типа «Имплакабл» были заказаны в рамках военно-морской программы 1938 года и были улучшенной версией типа «Илластриес». Военные действия и смена приоритетов в сторону малых судов для защиты конвоев на ранней и средней стадии войны замедлили строительство. «Имплакабл» были большими судами, что позволяло нести больше самолетов, сохраняя толстую броню на корпусе и летной палубе. Более мощные двигатели давали им более высокую скорость и большую дальность действия в сравнении с типом «Илластриес»."
  
