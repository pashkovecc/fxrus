l_russian:
 cannot_change_government_type_tt: "\n§YТип правительства§! можно изменить только с помощью §Yсобытий§!, §Yфокусов§! или §Yрешений§!" # \n§YGovernment Type§! can only be changed through §Yevents§!, §Yfocuses§! or §Ydecisions§!
  
  ### Ideas ### 
  # 
 direct_democracy: "Прямая демократия" # Direct Democracy
 direct_democracy_desc: "Форма правления, при которой граждане сами представляют свои интересы и напрямую голосуют за новые законы и государственную политику. Большая часть решений принимается на общенациональных референдумах, а новые референдумы легко выносятся на голосование, что обеспечивает открытый диалог по всем вопросам. Хотя представительные лидеры существуют, они не занимают свои посты долго и не обладают высокой единоличной властью.\n" # A form of government in which the people represent themselves and vote directly for new laws and public policy. The majority of policy is determined by national referendums, and new referendums are easily brought to a vote, allowing for an open dialogue on all issues. While representative leaders do exist, they do not serve for a long time and do not have much power alone.\n
  # 
 presidential_republic: "Президентская республика" # Presidential Republic
 presidential_republic_desc: "В президентской республике избранный глава государства также является главой правительства, что обеспечивает большую централизацию власти. Президентские республики предлагают более сплоченное правительство с системой сдержек и противовесов, удерживающей отдельных лиц от чрезмерного усиления. Однако некоторые считают, что существование должности с такими широкими полномочиями может представлять опасность для демократии.\n" # In a presidential republic, the elected head of state is also the head of government, allowing for more centralized power. Presidential republics offer a more unified government, with checks and balances preventing individuals from becoming too strong. However, some believe the existence of an office as strong as the president can be dangerous for democracy.\n
  # 
 semi_presidential_republic: "Полупрезидентская республика" # Semi-Presidential Republic
 semi_presidential_republic_desc: "В полупрезидентской республике есть как премьер-министр, так и президент, которые разделяют власть, при этом только один из них напрямую подконтролен парламенту. Как правило, президент избирается народом, а правящая партия или коалиция выбирает премьер-министра. Их точные обязанности различаются от страны к стране, но на бумаге они являются равноправными партнерами в управлении государством.\n" # A semi-presidential republic has both a prime minister and a president, and they share power with only one being directly beholden to parliament. Typically, the president is elected by the people, and the party or parties in power choose the prime minister. Their exact responsibilities differ from country to country, but on paper they are equal partners in governing the nation.\n
  # 
 parliamentary_republic: "Парламентская республика" # Parliamentary Republic
 parliamentary_republic_desc: "В парламентских республиках есть избранный глава государства, однако должности главы государства и главы правительства разделены, при этом бóльшая часть исполнительной власти находится в руках главы правительства, либо же глава государства выполняет функции главы правительства и избирается парламентом. Из-за большей децентрализации власти эта система работает медленнее, но она более защищена от индивидуальной тирании во власти.\n" # Parliamentary republics have an elected head of state, but the head of state and head of government are kept separate with the head of government retaining most executive powers, or there is a head of state akin to a head of government, who is elected by a parliament. Because power is more decentralized, the system moves slower, but is safer from the tyranny of individuals in government.\n
  # 
 republican_dictatorship: "Республиканская диктатура" # Republican Dictatorship
 republican_dictatorship_desc: "Диктатура — это форма правления, при которой страна находится под автократическим управлением узкой группы лиц, часто возглавляемой единоличным лидером. Нередко диктатуры возникают в странах, где ранее существовали демократические институты, которые были ликвидированы или подчинены. В некоторых диктатурах сохраняется внешняя атрибутика, например выборы, однако они контролируются для достижения нужных правительству результатов. Диктаторы не являются монархами, но иногда передают власть членам своей семьи, как если бы они ими были.\n" # A dictatorship is when a country is under the authoritarian rule of a single small group, often headed by a leader who functions as an autocrat. Frequently, dictatorships are countries that had democratic institutions in place, but were subverted. Some dictatorships still have their trappings, such as elections, but they are controlled to produce outcomes the government favors. Dictators are never monarchs, but sometimes pass their power to their family members as if they were.\n
  # 
 theocratic_republic: "Теократическая республика" # Theocratic Republic
 theocratic_republic_desc: "Теократическая республика — это республиканская форма правления, чьи руководящие принципы и свод законов основаны на священных текстах и канонах государственной религии. Из-за сложности религиозного права изучению богословия и священных текстов, а также мнению высшего духовенства придается особое значение. Со стороны теократические республики выглядят крайне репрессивными из-за социального консерватизма и отсутствия свобод. Однако внутри они могут обладать плюралистической демократией... после того как кандидаты пройдут проверку религиозного ордена на соответствие духовным нормам.\n" # A theocratic republic is a republican form of government whose governing principles and legal code are based on the texts and principles of the state religion. Due to the complexities of religious law, the study of theology and holy texts and the views of the elder priesthood holds considerable clout. From the outside, theocratic republics are very repressive in their social conservatism and lack of freedom. But on the inside, they may enjoy a pluralistic democracy… after the candidates are vetted by the religious order to confirm their wholesomeness.\n
  # 
 theocratic_dictatorship: "Теократическая диктатура" # Theocratic Dictatorship
 theocratic_dictatorship_desc: "Теократия — это форма правления, при которой духовенство управляет страной напрямую милостью божественного провидения. Часто это диктатуры, где диктатор избирается из числа духовенства, а само духовенство является закрытым привилегированным сословием.\n" # A theocracy is a government where a priesthood rules the country directly, by the grace of divine providence. Often these are dictatorships, where the dictator is elected amongst the priesthood, and the priesthood is an exclusive body.\n
  # 
 one_party_dictatorship: "Однопартийная диктатура" # One Party Dictatorship
 one_party_dictatorship_desc: "Однопартийные государства — это страны, управляемые элитой единственной легальной партии в соответствии с ее идеологическими принципами. Партия проникает на все уровни государственного управления, а зачастую и в армию. Такие диктатуры обычно авторитарны и репрессивны, однако продвижение внутри партии может обеспечить определенную социальную мобильность.\n" # One party states are countries which are run by an elite in the only legal party, in accordance with the ideological principles of that party. The Party penetrates all levels of government, and oftentimes the army. These dictatorships are often authoritarian and repressive, but one can find some social mobility by working within the party.\n
  # 
 fuhrership: "Фюрерство" # Führerprinzip
 fuhrership_desc: "\"Фюрер велит, мы следуем за ним!\"\n\nТаков принцип нового германского государства. Фюрер, человек, которому предназначено вывести Германию из текущего кризиса, теперь наделен всеми возможными полномочиями. Там, где старые плутократы, социалисты и прочие слабаки потерпели крах, национальная революция во главе с Фюрером одержит победу!\n" # "Führer befiehl, wir folgen dir!"\n\nSuch is the principle of the new German state. The Führer, the man destined to lead Germany out of her current crisis has now been imbued with all the powers one may wish for. Where the old plutocrats, socialists and other weaklings fail, the national revolution led by the Führer shall succeed!\n
  # 
 workers_republic: "Рабочая республика" # Worker's Republic
 workers_republic_desc: "Социалистическая республика — это демократическое правительство, которое ради защиты революции запретило буржуазные политические партии. Точный уровень свободы слова и печати может варьироваться, однако ведется открытая дискуссия о том, как лучше строить социализм, хотя различия в курсах политических партий могут приводить к резким изменениям в политике государства.\n" # A socialist republic is a democratic government which has, for the protection of the revolution, banned bourgeois political parties. The exact amount of freedom of speech and press can vary, but there is an open debate on how to best build socialism, though the various policies of the political parties can cause the government’s approach to swing wildly.\n
  # 
 communist_state: "Коммунальное государство" # Communal State
 communist_state_desc: "Коммунальные государства — это страны, полностью посвятившие себя коммунистической мечте с прямым контролем рабочих над предприятиями, глубокой децентрализацией власти и гарантией автономии. Это анархические правительства, варьирующиеся от синдикалистских федераций до простых рабочих коммун. Зачастую государственные атрибуты сохраняются лишь для совместной обороны и общей внутренней торговли.\n" # Communal states are countries that have fully dedicated to the communist dream, with direct worker control over the workplace, and very great devolution of power and guarantees of autonomy. These are anarchist governments, ranging from syndicalist federations to simple worker communes. Often times, the trappings of the state remain only for unified defense and common internal trade.\n
  # 
 colonial_government_political: "Колониальное правительство" # Colonial Government
 colonial_government_political_desc: "Колониальные правительства — это бюрократические структуры, управляющие колониями и протекторатами в интересах иностранной имперской державы. Они представляют собой сложное переплетение государственных и военных интересов, а также интересов частных граждан и бизнеса метрополии. Вовлеченность и свободы коренного населения варьируются от колонии к колонии, но неизменной константой остается эксплуатация земли и труда на благо империи.\n" # Colonial governments are bureaucratic entities governing colonies and protectorates for the benefit of a foreign, imperial power. Colonial governments a complex weave of state interests, military interests, and the interests of private citizens and businesses in the imperial homeland. The engagement and freedoms of the natives varies from colony to colony, but the universal constant is the exploitation of the land and labor for the benefit of the empire.\n
  # 
 absolute_monarchy: "Абсолютная монархия" # Absolute Monarchy
 absolute_monarchy_desc: "Абсолютная монархия — это централизованная форма правления, при которой вся полнота власти принадлежит монарху, унаследовавшему свой титул после смерти предшественника. Благодаря централизованному характеру системы решения и государственные программы могут приниматься очень быстро и эффективно, но это также означает, что ошибка на самом верху ведет к краху всей системы. В идеале мудрые монархи обеспечивают долгие периоды внутренней стабильности и процветания государства, однако некомпетентные монархи представляют огромную опасность, так как бороться с ними законными методами крайне сложно.\n" # An absolute monarchy is a centralized form of government where ultimate final power rests on a monarch who inherited their power upon their predecessor’s death. Because of the centralized nature of the system, decisions and policies can be executed very quickly and efficiently, but that also means failure at the top means failure of the system. Ideally, good monarchs create long periods of internal stability and progress in the realm, but there is great danger in bad monarchs, who are very difficult to combat legally.\n
  # 
 constitutional_monarchy: "Конституционная монархия" # Constitutional Monarchy
 constitutional_monarchy_desc: "Конституционная монархия — это демократическая форма правления, которая сохраняет институт наследного монарха, одновременно ограничивая его полномочия. В большинстве современных конституционных монархий монарх выполняет в основном символическую функцию, однако в некоторых случаях за монархом сохраняются значительные чрезвычайные полномочия.\n" # A constitutional monarchy is a democratic form of government that still retains the office of the hereditary monarch, while simultaneously limiting their powers. In most modern constitutional monarchies, the monarch serves a mostly symbolic function, but some allow the monarch to retain considerable emergency powers.\n
  # 
 elective_monarchy: "Выборная монархия" # Elective Monarchy
 elective_monarchy_desc: "Форма правления, при которой монарх избирается, как правило, неким аристократическим советом.\n" # A form of government where the monarch is elected, usually by some aristocratic council.\n
  # 
 military_junta: "Военная хунта" # Military Junta
 military_junta_desc: "Военная хунта — это правительство во главе с группировкой армейских офицеров, обладающих абсолютным контролем над страной. Как правило, вводится военное положение, а любое инакомыслие жестко подавляется. Военные хунты ставят собственные интересы (а именно армию) на первое место, поэтому лояльные войска, составляющие лишь небольшую часть населения, силой удерживают в повиновении большинство.\n" # A military junta is a government headed by a clique of army officers who have absolute control of the nation. Usually, martial law is in place, and dissent is harshly suppressed. Military juntas tend to make themselves, namely the military, the highest priority, and so, a loyal army which is only a small portion of the population cajols the majority along.\n
  # 
 revolutionary_movement: "Революционное движение" # Revolutionary Movement
 revolutionary_movement_desc: "Низовое общественное движение, которое как минимум стремится к свержению правительства или государства. Подобные движения могут возникать в периоды крайних политических репрессий, когда иные способы проведения социальных реформ перестают существовать." # A grassroots social movement that seeks, as minimum, to overthrow the government or state. These movements may rise up in times of extreme political repression when other means of social reform cease to exist.
  # 
 failed_state: "Распавшееся государство" # Failing State
 failed_state_desc: "Правительство, развалившееся до такой степени, что базовые условия и обязанности суверенного государства больше не функционируют должным образом. Государство может потерпеть крах, если правительство теряет свою легитимность, даже если оно исправно выполняет свои функции. Для стабильности государства необходимо, чтобы власть обладала как эффективностью, так и легитимностью.\n" # A government that has disintegrated to a point where basic conditions and responsibilities of a sovereign state no longer function properly. A state may fail if the government loses its legitimacy even if it is performing its functions properly. For a stable state it is necessary for the government to enjoy both effectiveness and legitimacy.\n
  # 
 generic_government: "Обычное правительство" # Generic Government
  
  ### Events ### 
 gov.1.t: "Развал государства [Root.GetName]" # The Breakdown of the [Root.GetName]
 gov.1.d: "Ряд внезапных и кардинальных общественных изменений подорвал способность нашего правительства реагировать и поддерживать стабильность или хотя бы нормальное функционирование страны. Поскольку [Root.GetAdjective] правительство не в состоянии выполнять возложенные на него обязанности, многие граждане стали обращаться к черному рынку и другим нелегальным организациям для удовлетворения своих потребностей. На фоне очевидной слабости власти политические агитаторы — от профсоюзов до оппозиционных партий — начали проводить протесты и ставить под сомнение легитимность нашей администрации. Если бы не верность, которую сохраняет [Root.GetAdjective] армия, многие опасаются, что страна [Root.GetName] могла бы погрузиться в гражданскую войну. Чтобы предотвратить надвигающуюся катастрофу, мы должны провести масштабные реформы для повышения внутренней стабильности." # A series of abrupt and drastic societal changes has strained our government's ability to react and to keep our nation stable or even functioning properly. With the [Root.GetAdjective] government unable to to perform the actions and duties expected of it many of our people have begun to look towards the black market and other such illegal organizations to satisfy their needs. In light of our government's public weakness political agitators ranging from labor organizations to opposition parties have begun to hold protests and question our administration's legitimacy. If it wasn't for the loyalty of the [Root.GetAdjective] army many fear that the [Root.GetName] may collapse into a civil war. If we are to reverse this impending disaster we must implement major reforms to improve our country's internal stability.
 gov.1.a: "Да поможет нам Бог" # May God help us all
  
 gov.2.t: "Стабильность возвращается в [Root.GetName]" # Stability returns to the [Root.GetName]
 gov.2.d: "По мере того как наше правительство проводит столь необходимые реформы, в страну, похоже, возвращается чувство стабильности. Хотя худшее, возможно, уже позади, очевидно, что оппозиция будет пристально следить за каждым нашим шагом. Мы больше не можем позволить себе оказаться на грани катастрофы." # As our government implements much needed reforms it seems a sense of stability is returning to our country. While the worst may be over it's clear that our opposition will be watching us closely. We can not afford to face the brink of disaster like this ever again.
 gov.2.a: "Порядок восстановлен" # Order has been restored