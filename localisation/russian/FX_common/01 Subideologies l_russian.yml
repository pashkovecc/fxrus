### Vanguardist
 revolutionary_showaist_subtype: "Революционный шоуизм" # Revolutionary Showaism
 revolutionary_showaist_subtype_desc: "§Y(Революционный шоуизм)§!\n\nС тех пор, как нынешний император взошел на хризантемовый трон, Японская империя пережила значительный упадок. Экономика достигла критической точки, а иммиграция корейцев, наряду с либеральной нечистотой в японской политике, только подогрела вдохновение правых экстремистов. Возглавляемые защитниками милитаризма и генералами Имперских вооруженных сил на острове Ямато, их единственная цель — очистить остров и защитить его от коррумпированной западной идеологии раз и навсегда.\n\nПод знаменем восстановления Сёва крайне правые приняли националистические и другие правые идеи из Европы, но с оттенком социализма. Это привело к созданию Шоваизма, идеологии, целью которой является очищение Японской Империи. Хасимото Кингоро, японский офицер и один из сторонников шоуизма, считает, что сочетание революционного социализма, стратократии и национализма очистит японскую политику и бюрократию от коррумпированного либерализма. Все это будет сделано во имя справедливости и равенства, исходя из его интерпретации социализма. Военные будут служить защитниками новой реформированной японской бюрократии, чтобы гарантировать и защитить новую Японию от новой волны коррупции." # §Y(Revolutionary Showaism)§!\n\nSince the present emperor ascended to the Chrysanthemum throne, the Japanese Empire has experienced a significant decline. The economy has reached a critical point, and the immigration of Koreans, along with the liberal impurity in Japanese politics, has only fueled the inspiration of right-wing extremists. Led by militarist advocates and the generals of the Imperial Armed Forces on Yamato Island, their only goal is to purify the island and secure it from the corrupted Western ideology once and for all.\n\nUnder the banner of Showa restoration, the far-right has embraced nationalistic and other right-wing ideas from Europe, but with a twist of socialism. This has led to the creation of Showaism, an ideology that aims to purify the Japanese Empire. Hashimoto Kingoro, a Japanese officer and one of Showaism's advocates, believes that the combination of revolutionary socialism, stratocracy, and nationalism will cleanse Japanese politics and bureaucracy of the corrupted liberalism. All of this will be done in the name of fairness and equality, based on his interpretation of socialism. The military will serve as the protector of the new reformed Japanese bureaucracy to ensure and safeguard the new Japan from another wave of corruption.
 autocratic_socialist_subtype: "Автократический социализм" # Autocratic Socialism
 autocratic_socialist_subtype_desc: "§Y(Автократический социализм)§!\n\nАвтократические социалистические режимы — это в высшей степени авторитарные диктатуры, которые (по крайней мере, на бумаге) придерживаются социалистических принципов. Они заметно разнообразны, но обычно их можно увидеть в той или иной форме командной экономики, с упором на милитаризм, часто являются националистическими или используют патриотизм как инструмент государства и часто находятся в противоречии с более основными тоталистами Хартии. Хотя их приверженность социалистическим революционным принципам обычно в лучшем случае сомнительна, эти режимы по-прежнему поддерживают социализм в качестве официальной государственной идеологии и делают все возможное, чтобы раскрасить свое правительство в красный цвет - даже если правительство представляет собой не что иное, как тотальную диктатуру." # §Y(Autocratic Socialism)§!\n\nAutocratic Socialist regimes are highly authoritarian dictatorships that (at least on paper) adhere to socialist principles. They are notably varied, but can usually be seen with some form of command economy, emphasis on militarism, are often nationalist or use patriotism as a tool of the state, and are frequently at odds with more mainline Charter Totalists. While their commitment to Socialist revolutionary principles is usually questionable at best, these regimes still maintain socialism as the official state ideology, and go to lengths to paint their government red - even if the government is nothing short of a total dictatorship.
 hardliner_bolshevism_subtype: "Жесткий большевизм" # Hardliner Bolshevism
 hardliner_bolshevism_subtype_desc: "§Y(Жесткий большевизм)§!\n\nЯвляясь гордыми носителями ленинистских знамен, большевистские режимы жесткой линии представляют собой в высшей степени авторитарные диктатуры, которые (по крайней мере, на бумаге) придерживаются социалистических принципов. Они милитаристы, придерживаются той или иной формы национализма или социал-патриотизма и обычно практикуют государственный террор против любого инакомыслия. Хотя их приверженность социалистическим революционным принципам обычно в лучшем случае сомнительна, эти режимы по-прежнему поддерживают социализм в качестве официальной государственной идеологии и делают все возможное, чтобы раскрасить свое правительство в красный цвет - даже если правительство представляет собой не что иное, как тотальную диктатуру." # §Y(Hardliner Bolshevism)§!\n\nAs proud bearers of Leninist banners, Hardliner Bolshevist regimes are highly authoritarian dictatorships that (at least on paper) adhere to socialist principles. They are militarist, adhere to some form of nationalism or social-patriotism and usually practice state terror against all dissent. While their commitment to Socialist revolutionary principles is usually questionable at best, these regimes still maintain socialism as the official state ideology, and go to lengths to paint their government red - even if the government is nothing short of a total dictatorship.
 red_junta_subtype: "Сетевая плата" # Red Junta
 red_junta_subtype_desc: "§Y(Красная хунта)§!\n\nВоенные диктатуры бывают разных форм, включая военные диктатуры со значительным левым уклоном. Эти режимы, в частности, являются крайне авторитарными, милитаристскими и стратократическими, но при этом сохраняют социалистические принципы." # §Y(Red Junta)§!\n\nMilitary Dictatorships come in many forms, including Military Dictatorships that have a significant left-lean. These regimes in particular are highly authoritarian, militaristic and stratocratic, while still maintaining Socialist principles.
 socialist_security_state_subtype: "Государство Социалистической Безопасности" # Socialist Security State
 socialist_security_state_subtype_desc: "§Y(Государство Социалистической Безопасности)§!\n\nХотя внутренние разведывательные службы не ограничиваются каким-либо идеологическим направлением, Социалистическая Безопасность касается организаций, существующих во всех так называемых «красных» государствах. Люди, пренебрежительно относящиеся к таким правительствам, называют их «секьюритатизмом». Причиной их существования является серия решений, призванных лишь расширить сферу действия государственного или партийного аппарата. Когда агентство перерастает своих благодетелей, руководители таких государств стремятся к высшей власти, с помощью которой они могут контролировать все, что происходит внутри их народной республики. Хотя большинство из них озабочены только полным контролем над всеми аспектами жизни страны, некоторые все еще сохраняют ауру социалистической политики или законного правительства в качестве прикрытия для своей деятельности." # §Y(Socialist Security State)§!\n\nWhile internal intelligence agencies aren't exclusive to any strain of ideology, Socialist Security concerns the organizations found in all so-called 'red' states. Called 'Securitatism' by people dismisive of such governments, the reason for their existence is a series of decisions that were meant to only broaden the reach of the state or party apparatus. When the agency overgrows their benefactors the chiefs of such polities reach for ultimate power with which they can monitor every happening inside their people's republic. Although most are only concerned by total control of any and all aspects of the nation, some do still maintain an aura of socialist policies or legitimate government as a cloak for their activities.

### Communist
 monsoc_subtype: "Монархо-Социализм" # Monarcho-Socialism
 monsoc_subtype_desc: "§Y(Монархо-социализм)§!\n\nМонархо-социализм, наряду с его различными подтипами, такими как монархо-большевизм, монархо-коммунизм и другие, стремится последовательно объединить обычно противоположные системы социализма и монархизма в одну единую форму правления. Хотя степень преданности каждого монарха социалистической системе может сильно различаться: от простых номинальных глав, выкрашенных в красный цвет, до монархов, полностью преданных делу социализма, каждую систему объединяет приверженность благородной системе монархизма, и хотя этот монарх часто является лишь фасадом для более традиционного социалистического правительства, их присутствие является ключом к более широкой системе. Эти красные монархии направляют путь к истинному социализму, и хотя каждая система невероятно разнообразна, они обычно придерживаются более консервативного или традиционалистского взгляда на социальные и социальные проблемы." # §Y(Monarcho-Socialism)§!\n\nMonarcho-Socialism, along with its various subtypes such as Monarcho-Bolshevism, Monarcho-Communism, and others, seeks to coherently fuse the typically opposed systems of Socialism and Monarchism into one, unified form of government. Though the degree to which each monarch is dedicated to the Socialist system can vary greatly, from mere figureheads painted Red to monarchs fully dedicated to the Socialist cause, each system holds in common an adherence to the noble system of monarchism, and though this monarch is frequently only a facade for a more traditional Socialist government, their presence is key to the wider system. Under these Red monarchies, the journey to true Socialism is shepherded, and though each system is incredibly varied, they usually hold in common a more conservative or traditionalist outlook on social and societal issues.
 leninism_subtype: "ленинизм" # Leninism
 leninism_subtype_desc: "§Y(Ленинизм)§!\n\nЛенинизм — это политическая идеология, разработанная Владимиром Лениным, которая выступает за создание революционной авангардной партии, которая возглавит рабочий класс в свержении капитализма. Он подчеркивает необходимость централизованной и дисциплинированной партийной структуры, руководствующейся марксистскими принципами, для захвата и поддержания государственной власти от имени рабочего класса. Ленинизм также продвигает идею переходного социалистического государства, называемого «диктатурой пролетариата», как средства подавления контрреволюционных сил и закладки основы будущего коммунистического общества." # §Y(Leninism)§!\n\nLeninism is a political ideology developed by Vladimir Lenin, which advocates for the establishment of a revolutionary vanguard party to lead the working class in overthrowing capitalism. It emphasizes the need for a centralized and disciplined party structure, guided by Marxist principles, to seize and maintain state power on behalf of the working class. Leninism also promotes the idea of a transitional socialist state, referred to as the \"dictatorship of the proletariat,\" as a means to suppress counter-revolutionary forces and lay the groundwork for a future communist society.
 anarchism_subtype: "Анархизм" # Anarchism
 anarchism_subtype_desc: "§Y(Анархизм)§!\n\nАнархизм — это разнообразная форма политики, которая обычно призывает к полной или частичной эрозии государства. Стремясь организовать общество другими способами, либо посредством добровольного сотрудничества, либо через свободную ассоциацию между отдельными людьми и группами, эти социалисты часто рассматриваются основными левыми как предатели Революции. Все еще стремясь к социалистической или коммунистической системе, только без более широкого государственного аппарата, анархисты отвергают все или большинство властных должностей, стремясь к полному эгалитаризму, равенству и свободе от всех богов и хозяев." # §Y(Anarchism)§!\n\nAnarchism is a diverse body of politics that usually calls for the total or partial erosion of the State. Seeking to organize society along other means, either through voluntary cooperation or the free association between individuals and groups, these Socialists are oftentime seen as traitors to the Revolution by mainline Leftists. Still seeking a Socialist or Communist system, just without a wider state apparatus, Anarchists reject all or most positions of authority as they pursue total egalitarianism, equality, and freedom from all gods and masters.

### Libertarian Socialist
 libsoc_utopian_socialism_subtype: "Утопический социализм" # Utopian Socialism
 libsoc_utopian_socialism_subtype_desc: "§Y(Утопический социализм)§!\n\nУтопический социализм рассматривается как идеология, которая ошибочна в своих попытках создать идеальное общество посредством централизованного планирования и государственного контроля. Либертарианцы обычно верят в важность индивидуальной свободы и рассматривают правительство как потенциальную угрозу этим ценностям.\n\nС другой стороны, утопический социализм часто включает в себя идею коллективной собственности на средства производства и плановой экономики, которые могут рассматриваться как несовместимые с свобода личности и принципы свободного рынка. Либертарианцы утверждают, что такой подход будет сдерживать инновации, ограничивать выбор потребителей и приведет к неэффективности и растратам." # §Y(Utopian Socialism)§!\n\nUtopian socialism is seen as an ideology that is misguided in its attempts to create a perfect society through centralized planning and government control, Libertarians generally believe in the importance of individual liberty and see the government as a potential threat to these values.\n\nOn the other hand, Utopian socialism often involves the idea of a collective ownership of the means of production and a planned economy, which may be seen as incompatible with individual freedom and the principles of a free market. Libertarians would argue that such an approach would restrain innovation, limit consumer choice, and result in inefficiencies and waste.
 anarcho_syndicalism_subtype: "Анархо-синдикализм" # Anarcho-Syndicalism
 anarcho_syndicalism_subtype_desc: "§Y(Анархо-синдикализм)§!\n\nСамая крупная разновидность основного ортодоксального синдикализма, анархо-синдикализм стремится построить синдикалистскую систему - то есть систему, организованную вокруг профсоюзов и организаций работников - в рамках анархистской и безгосударственной или полугосударственной структуры. Стремясь отменить систему заработной платы, а также поддерживаемый капиталистами этатизм, анархо-синдикалисты верят, что посредством солидарности, самоуправления, коммунизации, прямого действия и прямой демократии можно построить настоящий эгалитарный рай для всех. Отвергая частную собственность, иерархию и социальное расслоение, анархо-синдикалисты разрушат государство, чтобы построить свои юнионистские утопии, свободные от очевидной жадности этатизма." # §Y(Anarcho-Syndicalism)§!\n\nThe largest subset of mainline Orthodox Syndicalism, Anarcho-Syndicalism seeks to build a Syndicalist system - that is, a system organized around trade unions and employee organizations - within an Anarchist and stateless, or semi-stateless, framework. Seeking to abolish the wage system as well as Capitalist-fueled statism, Anarcho-Syndicalists believe that through solidarity, self-management, communization, direct action, and direct democracy, a true egalitarian paradise can be built for all to enjoy. Rejecting private property, hierarchies, and social stratification, Anarcho-Syndicalists will tear down the state to build their unionist utopias free from the apparent greed of statism.
 socialist_feminist_subtype: "Социалистический феминизм" # Socialist Feminism
 socialist_feminist_subtype_desc: "§Y(Социалистический феминизм)§!\n\nЦелью социалистического феминизма является то, что все женщины должны быть освобождены и патриархат должен быть свергнут. Он охватывает широкий спектр прогрессивных и либеральных идей на рынке, при этом он является свободным для всех людей, и что угнетение простого человека должно быть запрещено. Они также думают, что каждый мужчина, женщина и ребенок должны быть равны и свободны в обществе, где нет никого выше или ниже остальных." # §Y(Socialist Feminism)§!\n\nThe focus of Socialist Feminism is that all women should be liberated and the patriarchy should be overthrown. It encompasses a wide range of progressive and liberal ideas in the market with a free one for all people, and that oppression of the common person should be forbidden. They also think that every man, woman, and child should be equal and free under a society with no one over or under the rest.
 agrarian_socialism_subtype: "Аграрный социализм" # Agrarian Socialism
 agrarian_socialism_subtype_desc: "§Y(Аграрный социализм)§!\n\nАграрный социализм — это попытка соединить аграрные принципы с социалистической доктриной. Аграрные социалисты, поддерживаемые такими людьми, как Сапата или народники, зачастую более консервативны, чем их левые союзники, и настаивают на социалистической системе, которая ставит крестьянство и фермеров государства превыше всех других забот. Аграрный социализм, распространенный в менее развитых или слабоиндустриальных странах, часто является демократическим и обычно призывает к созданию фермерских кооперативов, коммун или других кооперативных организационных структур для лучшего увеличения сельскохозяйственного производства и эффективности при движении к истинному социализму." # §Y(Agrarian Socialism)§!\n\nAgrarian Socialism is the attempt to fuse Agrarian principles with Socialist doctrine. Championed by the likes of Zapata or the Narodniks, Agrarian Socialists are frequently more Conservative than their Leftist allies and push for a Socialist system that puts the peasantry and the farmers of the state above all other concerns. Common in less-developed or under-industrialized nations, Agrarian Socialism is frequently democratic, and usually calls for the creation of farming cooperatives, communes, or other cooperative organizational structures to better increase agricultural output and efficiency while progressing towards true Socialism.
 bukharinist_subtype: "бухаринизм" # Bukharinism
 bukharinist_subtype_desc: "§Y(Бухаринизм)§!\n\nБухаринизм или полурыночный социализм — совокупность идей, сформулированных российским большевиком Николаем Бухариным после Гражданской войны в России, которые легли в основу программы его Народной социалистической партии и обоснования так называемой новой экономической политики.\n\nБухарин считал главным виновником провала большевистской революции в России и потери Красные в Гражданской войне оказались неэффективной политикой «военного коммунизма», приведшей к полному отчуждению крестьян от большевиков и экономическому кризису. Бухарин, однако, в своих трудах, разработанных вместе с экономистом Николаем Кондратьевым, предполагал, что социализма следует добиваться постепенно - и что для достижения этой цели необходимо государственное регулирование смешанной экономики с использованием плановых и рыночных механизмов. «Социализм в городе — Капитализм в деревне» — так Бухарин охарактеризовал свою программу на учредительном съезде новой партии. Помимо экономической сферы, бухаринизм предлагает многопартийную форму советской демократии, разделение властей и коренизацию - поддержку национальных меньшинств путем продвижения национальных человеческих ресурсов и ограничения русификации." # §Y(Bukharinism)§!\n\nBukharinism or Semi-Market Socialism is a set of ideas formulated by the Russian Bolshevik Nikolai Bukharin after the Civil War in Russia, which formed the basis of the program of his People's Socialist Party and the rationale for the so-called New Economic Policy.\n\nBukharin considered the main culprit for the failure of the Bolshevik Revolution in Russia and the loss of the Reds in the Civil War to be the ineffective policy of \"War communism\", which led to the complete alienation of the peasants from the Bolsheviks and economic crisis. Bukharin, however, in his writings, developed with economist Nikolai Kondratiev, suggested that socialism should be achieved gradually - and that state regulation of a mixed economy using planned and market mechanisms was necessary to achieve this goal. \"Socialism in the city - Capitalism in the countryside\" was how Bukharin characterized his program at the founding congress of the new party. In addition to the economic sphere, Bukharinism proposes a multiparty form of Soviet democracy, separation of powers, and Korenization - support for national minorities by promoting national human resources and limiting Russification.
 moderate_socialist_subtype: "Умеренный социализм" # Moderate Socialism
 moderate_socialist_subtype_desc: "§Y(Умеренный социализм)§!\n\nУмеренный социализм — это идеология, стремящаяся объединить демократию и социализм в одной синкретической системе. Обычно придерживаясь прямой демократической системы, хотя иногда и используя представительные органы, такие как конгресс или профсоюзные советы, эти правительства стремятся дать каждому гражданину право голоса, независимо от его положения в обществе, поскольку они стремятся к истинному социализму." # §Y(Moderate Socialism)§!\n\nModerate Socialism is an ideology that seeks to combine Democracy and Socialism in one syncretic system. Usually pursuing a directly democratic system, though sometimes using representative bodies such as a congress or union councils, these governments seek to give each and every citizen a voice regardless of their standing in society as they pursue true Socialism.

### Social Democrat
 socdem_longism_subtype: "Лонгизм" # Longism
 socdem_longism_subtype_desc: "§Y(Лонгизм)§!\n\nОсновываясь на политике и личности Хьюи Пирса Лонга-младшего, лонгизм представляет собой идеологию, которая почти так же неоднозначна, как и человек, в честь которого она названа. Поддерживая гражданский национализм, глубокое чувство благочестия и левопопулистскую экономику, игнорируя при этом такие важные вопросы, как раса. Лонгистские правительства, отличающиеся авторитарными методами правления, будут делать все и вся для народа, даже если люди не всегда с этим согласны." # §Y(Longism)§!\n\nBased on the policies and personality of Huey Pierce Long Jr, Longism is an ideology that is nearly as ambiguous as the man it's named after. Espousing civic nationalism, a deep sense of piety, and Left-leaning populist economics, all while ignoring critical questions such as race. Marked by authoritarian methods of ruling, Longist goverments will do anything and everything for the people, even if the people don't always agree.
 socdem_democratic_socialism_subtype: "Демократический социализм" # Democratic Socialism
 socdem_democratic_socialism_subtype_desc: "§Y(Демократический социализм)§!\n\nДемократический социализм — это идеология, стремящаяся объединить демократию и социализм в одной синкретической системе. Обычно придерживаясь прямой демократической системы, хотя иногда и используя представительные органы, такие как конгресс или профсоюзные советы, эти правительства стремятся дать каждому гражданину право голоса, независимо от его положения в обществе, поскольку они стремятся к истинному социализму." # §Y(Democratic Socialism)§!\n\nDemocratic Socialism is an ideology that seeks to combine Democracy and Socialism in one syncretic system. Usually pursuing a directly democratic system, though sometimes using representative bodies such as a congress or union councils, these governments seek to give each and every citizen a voice regardless of their standing in society as they pursue true Socialism.
 socdem_left_nationalism_subtype: "Левый национализм" # Left-wing Nationalism
 socdem_left_nationalism_subtype_desc: "§Y(Левый национализм)§!\n\nЛевый национализм, широко известный как социальный национализм или просто левый национализм, представляет собой разновидность национализма, возникшую в результате различных национально-освободительных движений под влиянием социалистических школ мысли. Поддерживая самоопределение как высшую ценность, левые националисты стремятся создать для своего народа государство, в котором можно будет пользоваться народным суверенитетом и равенством, определяемым на местном уровне. Социал-националисты противостоят своим правым коллегам, отвергая этнические или классовые различия в своей борьбе." # §Y(Left Nationalism)§!\n\nLeft-Wing Nationalism, commonly known as Social Nationalism or simply Left Nationalism, is a strain of nationalism originating from various national liberation movements influenced by socialist schools of thought. Upholding self-determination as the highest value, Left Nationalists strive to create a state for their people in which popular sovereignty and locally defined equality can be enjoyed. Social Nationalists stand in opposition to their right-wing counterparts by rejecting ethnic or class based distinctions in their struggle.
 socdem_humanistic_capitalism_subtype: "Гуманистический капитализм" # Humanistic Capitalism
 socdem_humanistic_capitalism_subtype_desc: "§Y(Гуманистический капитализм)§!\n\nГуманистический капитализм — это экономическая мыслеформа, которая стремится объединить гуманизм со стремлением к прибыли при умеренном капитализме. Гуманистические капиталистические общества продвигаются к экономическому процветанию с рыночной экономикой, как и любые другие капиталисты, но делают это гуманным способом, уделяя особое внимание потребностям, безопасности, здоровью и желаниям людей, а также их социальному и даже культурному и духовному развитию, в зависимости от нации. Создавая экономически справедливые финансовые системы, управляемые невидимой рукой национального правительства над любыми смутными рыночными силами, гуманистические капиталисты стремятся создать прибыльную утопию, в которой каждый имеет равный шанс осуществить свои самые смелые мечты." # §Y(Humanistic Capitalism)§!\n\nHumanistic Capitalism is an economic thoughtform that seeks to unite Humanism with the pursuit of profit under moderated Capitalism. Humanistic Capitalist societies progress towards economic prosperity with market economics as any other Capitalists do, but do so in a humane way that pays special attention to the needs, safety, health, and desires of the people, as well as to their social and even cultural and spiritual development, depending on the nation. Creating economically-fair financial systems guided by the invisible hand of the national government over any vague market force, Humanistic Capitalists seek to create a profitable utopia where any and all have a fair shot at achieving their wildest dreams.
 socdem_christian_socialism_subtype: "Христианский социализм" # Christian Socialism
 socdem_christian_socialism_subtype_desc: "§Y(Христианский социализм)§!\n\nОдна из наиболее распространенных форм социализма за пределами синдикалистской парадигмы, особенно в тех странах, население которых достаточно консервативно и религиозно, христианский социализм стремится создать общество в союзе с Учением Иисуса Христа в социалистических рамках. Однако тип христианства и форма социализма, которым следует каждый конкретный пример, могут сильно различаться." # §Y(Christian Socialism)§!\n\nOne of the more widespread forms of Socialism outside of the Syndicalist paradigm, especially in those countries whose populations are quite conservative and religious, Christian Socialism seeks to create a society in union with the Teachings of Jesus Christ within a Socialist framework. However, the type of Christianity and the form of Socialism each specific example follows can vary greatly.
 socdem_agrarianism_subtype: "Аграрность" # Agrarianism
 socdem_agrarianism_subtype_desc: "§Y(Аграризм)§!\n\nНесмотря на то, что аграризм не был конкретной идеологией с центральной доктриной или фундаментальными принципами, он стал широкой классификацией различных движений по всему миру, озабоченных интересами и тяжелым положением крестьянства в целом. Сторонники аграрных партий варьируются от крупных землевладельцев или землевладельцев до мелких землевладельцев и бедных фермеров, от низшего высшего класса до наиболее устойчивой базы поддержки среди среднего класса и, в конечном итоге, до низших классов. Истоки политического аграризма можно отнести к «правительству природы», разработанному физиократом и сторонником невмешательства Франсуа Кенэ, а также к республике сельской добродетели Томаса Джефферсона. Хотя сторонники таких партий считают народ страны основой общества и наиболее важной частью национального организма, они сильно расходятся в своих позициях в отношении экономики, налогообложения, протекционизма и свободной торговли, системы правления, религии и т. д. Аграрные партии в целом являются консервативными и традиционалистскими, хотя существует значительный контингент радикально либеральных и откровенно социалистических групп, между которыми смешаны некоторые нетрадиционные правые. Этот широкий диапазон можно увидеть, взглянув лишь на несколько сельских движений, таких как немецкое национально-революционное движение Landvolkbewegung или консервативно-монархистское Bund der Landwirte, более центристское чешское RSZML или финское Maalaisliitto, и даже радикальные с точки зрения социальных изменений, такие как польское PSL Wyzwolenia или болгарское BZNS." # §Y(Agrarianism)§!\n\nDespite not being a concrete ideology with a central doctrine or fundamental tenets, agrarianism became a broad classification of various movements across the entire globe concerned with the interests and plight of peasantry as a whole. Supporters of agrarian parties range from large landowners or landed gentry to smallholders and poor farmers, from the lower high class through the most consistent support base among the middle class, and ending up on the lower classes. The origins of political agrarianism can be traced to the 'government of nature' developed by physiocrat and laissez-faire advocate François Quesnay, as well as the republic of rural virtue of Thomas Jefferson. While supporters of such parties hold the people of the land as a foundation of society and the most important part of the nation's organism, they differ wildly in their positions regarding economy, taxation, protectionism vs free trade, system of government, religion etc. Agrarian parties are generally conservative and traditionalist, although there is a sizeable contingent of radically liberal and downright socialistic groups, with some unconventional right-wingers mixed in-between. This wide range can be seen by looking at only a few rural movements, such as the German national revolutionary Landvolkbewegung or the conservative and monarchist Bund der Landwirte, the more centrist Czech RSZML or the Finnish Maalaisliitto, and even the radicals in terms of social changes such as Poland's PSL Wyzwolenia or Bulgaria's BZNS.
 socdem_progressive_conservatism_subtype: "Прогрессивный консерватизм" # Progressive Conservatism
 socdem_progressive_conservatism_subtype_desc: "§Y(Прогрессивный консерватизм)§!\n\nПрогрессивный консерватизм — это политическая идеология, которая естественным образом сочетает в себе консервативную и прогрессивную политику, впервые зародившуюся в эпоху Просвещения, с целью создания упорядоченного и ответственного общества, которое по-прежнему заботится о своих людях. Впервые появился в Западной Европе в консервативных группах, выступающих за социальные реформы в области науки, экономики, образования, технологий, медицины и других аспектов условий жизни человека, на которые начало негативно влиять промышленная революция и ее растущие последствия, а также аболиционистское движение, которое начало набирать обороты примерно в то же время, особенно в Великобритании. Призывая к созданию сетей социальной защиты и минималистских систем благосостояния, прогрессивный консерватизм стремится улучшить общество без радикальных или быстрых изменений установленного статус-кво и традиций и часто связан с католическим социальным учением, христианской демократией и даже с папским литературным трудом «Rerum novarum», который призывает к определенной форме католического консервативного прогрессизма, чтобы защитить христианские рабочие массы от хищничества социализма. В более современные времена эту идеологию практиковали и адаптировали по всему миру такие люди, как бывший американский президент Теодор Рузвельт и британский премьер-министр Бенджамин Дизраэли, и теперь она снова начала находить современную популярность как консервативная альтернатива более опасной и радикальной левой прогрессивистской идеологии." # §Y(Progressive Conservatism)§!\n\nProgressive Conservatism is a political ideology that naturally combines conservative and progressive policies first birthed during the Age of Enlightenment in order to create an orderly and responsible society that still cares for its people. First appearing in Western Europe in conservative groups pushing for social reform in the areas of science, economics, education, technology, medicine, and other facets of human living conditions that had begun to be negatively affected by the Industrial Revolution and its growing consequences, as well as with the abolitionist movement that had begun to take flight around the time, particularly in Britain. Calling for social safety nets and minimalist welfare systems, Progressive Conservatism seeks to improve society without radical or rapid changes to the established status quo and traditions, and is often tied to Catholic social teaching, Christian democracy, and even the papal literary work ‘Rerum novarum’ which calls for a form of Catholic conservative progressivism in order to safeguard the Christian working masses against the predation of Socialism. In more modern times, the ideology has been practiced and adapted across the world by the likes of former American president Theodore Roosevelt and British prime minister Benjamin Disraeli, and now has begun finding contemporary popularity once again as a Conservative alternative to more dangerous and radical Leftist progressivist ideology.
 socdem_paternal_socialism_subtype: "Отцовский социализм" # Paternal Socialism
 socdem_paternal_socialism_subtype_desc: "§Y(Патернальный социализм)§!\n\nПатернальный социализм, также называемый консервативным социальным популизмом, патерналистским консерватизмом или, реже, христианским консервативным социализмом в западном мире, представляет собой уникальную мыслеформу, которая пытается объединить, казалось бы, противоречивые идеи традиционного консерватизма и немарксистского социализма или прогрессивного популизма. Эти странные системы, зародившиеся во время промышленной революции в Англии и Германии, но теперь все более распространенные за пределами западного мира, например, в Латинской Америке или Африке, где правила и ожидания социализма, ориентированного на Европу, не применяются. Эти странные системы стремятся построить моральные, консервативные общества, обычно, но не всегда, основанные на теистической этике, консервативной экономике благосостояния, классовом сотрудничестве и сотрудничестве и/или идеях гражданского национализма и неэкстремистского националистического патриотизма. Часто связанные с идеями рыночного социализма, христианского дистрибутизма, благотворительной экономики, государственного социализма Бисмарка и экономического интервенционизма, красного ториизма и других программ распределения богатства, патерналистские социалисты стремятся построить эгалитарные, неграбительские экономические системы, направленные против идей классовой борьбы, которые объединяют капиталистические и социалистические идеи в консервативный и патерналистский пакет на благо своих обычно традиционалистских и националистических народов, одновременно подрывая и ослабляя нормальные социалистические и левые движения. сохранять традиции и социальную стабильность, даже если это ставит их в противоречие с другими социалистами или консерваторами по всему миру." # §Y(Paternal Socialism)§!\n\nPaternal Socialism, also called Conservative Social Populism, Paternalistic Conservatism, or more rarely Christian Conservative Socialism in the Western World, is a unique thoughtform that attempts to fuse the seemingly contradictory ideas of traditional Conservatism and non-Marxist Socialism or Progressive Populism. Born during the Industrial Revolution in England and Germany but now increasingly common outside the Western World such as in Latin America or Africa where the rules and expectations of European-biased Socialisms do not apply, these strange systems seek to build moral, Conservative societies usually, but not always, rooted in theist ethics, Conservative welfare economics, class collaboration and cooperation, and/or ideas of Civic Nationalism and non-extremist Nationalist Patriotism. Often linked to ideas of Market Socialism, Christian Distributism, charity economics, Bismarck's State Socialism and economic interventionism, Red Toryism, and other wealth-sharing programs, Paternal Socialists seek to build egalitarian, non-predatory economic systems geared against ideas of class struggle that fuse Capitalist and Socialist ideas in a Consevative and Paternalistic package for the good of their usually traditionalist and nationalist peoples while undermining and weakening normal Socialist and Leftist movements to preserve tradition and societal stability, even if that puts them at odds with other Socialists or Conservatives around the globe.

### Social Liberal
 centrist_subtype: "Центризм" # Centrism
 centrist_subtype_desc: "§Y(Центризм)§!\n\nДемократический центризм описывает политическую точку зрения, которая вращается вокруг поддержания установленного статус-кво. Хотя этот статус-кво варьируется от нации к нации, центристы все равно сплачиваются вокруг этой золотой середины, стремясь сбалансировать равенство и иерархию в своих разнообразных обществах. Ненавистные как консерваторам, так и экстремистам, которые считают их антагонистами, центристы сплачиваются вокруг доказанного статус-кво, не колеблясь, сопротивляясь быстрым реформам и стойкому традиционализму, точно так же, как они ищут золотую середину между спорящими партиями ради большего блага своих обществ, поскольку они прежде всего стремятся к стабильности и последовательности." # §Y(Centrism)§!\n\nDemocratic Centrism describes the political outlook that revolves around the maintaining of the set status quo. Though this status quo varies from nation to nation, Centrists rally around this middleground just the same, seeking to balance equality and hierarchy in their varied societies. Hated by both conservatives and extremists who see them as fence-sitters, Centrists rally around the proven status quo without faltering, resisting rapid reform and staunch traditionalism just the same as they pursue a happy medium between bickering parties for the greater good of their societies as they seek stability and consistency above all.
 radical_liberalism_subtype: "Радикальный либерализм" # Radical Liberalism
 radical_liberalism_subtype_desc: "§Y(Радикальный либерализм)§!\n\nРадикальный либерализм, также называемый классическим радикализмом или радикальным республиканизмом, описывает современные политические движения, вдохновленные главным образом радикалами Французской революции и предшественниками либералов прошлого века. Связанный с республиканизмом, модернизмом, гражданским национализмом, рационализмом, светским гуманизмом, прогрессизмом и многим другим, радикальный либерал стремится расширить значение того, что значит быть «либералом», чтобы построить действительно свободное, справедливое и эгалитарное общество, которое защищает свободу, свободу и справедливость для всех." # §Y(Radical Liberalism)§!\n\nRadical Liberalism - also called Classical Radicalism or Radical Republicanism - describes the modern political movements chiefly inspired by the Radicals of the French Revolution and the precursor Liberals of the past century. Associated with Republicanism, modernism, civic nationalism, rationalism, secular humanism, progressivism, and more, Radical Liberal seeks to stretch the meaning of what it means to be ‘Liberal’ in order to build a truly free, fair, and egalitarian society that champions freedom, liberty, and justice for all.
 venizelism_subtype: "Венизелизм" # Venizelism
 venizelism_subtype_desc: "§Y(Венизелизм)§!\n\nВенизелизм - одно из самых значительных политических движений в Греции с начала 20 века. В период с 1910 по 1922 год, когда Греция находилась в состоянии постоянной военной готовности, возникло новое политическое мышление, воплощенное Элефтериосом Венизелосом, которое обычно называлось венизелизмом. Трудно определить, в чем именно заключалась эта политическая идеология, но с точки зрения экономики венизелизм рассматривал греческое государство как рычаг выражения и развития эллинизма. Другими словами, греческое государство должно было добиться интеграции эллинизма за пределами своих границ и, обладая единой национальной и государственной идентичностью, претендовать на свое место в тогдашнем современном мире. Это потребовало не только институциональной модернизации, чтобы сделать государство эффективным и надежным, но и общей приверженности идее развития производительных сил страны." # §Y(Venizelism)§!\n\nVenizelism is one of the most significant political movements in Greece since the start of the 20th century. During the period of 1910 to 1922, when Greece was in a state of continuous military readiness, a new political mindset emerged, embodied by Eleftherios Venizelos, and was commonly referred to as Venizelism. It is difficult to define in what exactly this political ideology was, but in terms of the economy, Venizelism considered the Greek state as a lever for the expression and development of Hellenism. In other words, the Greek state had to pursue the integration of Hellenism beyond its borders and, with a unified national and state identity, claim its place in the then-modern world. This required not only institutional modernization to make the state efficient and reliable but also a general commitment to the idea of developing the nation's productive forces.

### Market Liberal
 marlib_centrist_subtype: "Центризм" # Centrism
 marlib_centrist_subtype_desc: "§Y(Центризм)§!\n\nДемократический центризм описывает политическую точку зрения, которая вращается вокруг поддержания установленного статус-кво. Хотя этот статус-кво варьируется от нации к нации, центристы все равно сплачиваются вокруг этой золотой середины, стремясь сбалансировать равенство и иерархию в своих разнообразных обществах. Ненавистные как консерваторам, так и экстремистам, которые считают их антагонистами, центристы сплачиваются вокруг доказанного статус-кво, не колеблясь, сопротивляясь быстрым реформам и стойкому традиционализму, точно так же, как они ищут золотую середину между спорящими партиями ради большего блага своих обществ, поскольку они прежде всего стремятся к стабильности и последовательности." # §Y(Centrism)§!\n\nDemocratic Centrism describes the political outlook that revolves around the maintaining of the set status quo. Though this status quo varies from nation to nation, Centrists rally around this middleground just the same, seeking to balance equality and hierarchy in their varied societies. Hated by both conservatives and extremists who see them as fence-sitters, Centrists rally around the proven status quo without faltering, resisting rapid reform and staunch traditionalism just the same as they pursue a happy medium between bickering parties for the greater good of their societies as they seek stability and consistency above all.
 marlib_classical_liberalism_subtype: "Классический либерализм" # Classical Liberalism
 marlib_classical_liberalism_subtype_desc: "§Y(Классический либерализм)§!\n\nКлассический либерализм — это ветвь основного либерализма, которая выступает за свободный рынок и экономику невмешательства, а также за гражданские свободы, связанные с экономической и политической свободой в рамках верховенства закона ограниченного правительства. В отличие от основного социального либерализма, классические либералы более негативно смотрят на социальную политику, системы социального обеспечения, высокие налоги и участие государства в жизни своих граждан, вместо этого выступая за дерегулирование и децентрализацию, разделяя некоторые идеи с либеральными консерваторами, несмотря на презрение к консервативной экономике, такой как протекционизм. Классический либерализм, связанный с «оригинальными» либералами XIX века, такими как Джон Локк, Жан-Батист Сэй, Томас Роберт Мальтус и Давид Рикардо, укоренен в идеях Адама Смита, верных естественному праву, либеральному прогрессу, утилитаризму и урокам, извлеченным во время подъема промышленной революции и урбанизации. От Хайека до Мизеса классические либералы балансируют между правоцентристами и левоцентристами, стремясь донести идеи Просвещения до своих своенравных берегов." # §Y(Classical Liberalism)§!\n\nClassical Liberalism is a branch of mainline Liberalism that advocates for a free market and laissez-faire economics, and for civil liberties tied to economic and political freedom under the rule of law of a limited government. Differing from mainline Social Liberalism, Classical Liberals look more negatively on social policies, welfare systems, heavy taxation, and state involvement in the lives of its citizens, instead advocating for deregulation and decentralization, sharing some ideas with Liberal Conservatives, despite despising Conservative economics such as protectionism. Tied to the ‘original’ Liberals of the 19th Century, such as John Locke, Jean-Baptiste Say, Thomas Robert Malthus, and David Ricardo, Classical Liberalism is rooted in the ideas of Adam Smith, standing true to natural law, liberal progress, utilitarianism, and to the lessons learned during the rise of the Industrial Revolution and urbanization. From Hayek to Mises, Classical Liberals tow the line between the Center-Right and the Center-Left, seeking to bring about the ideas of the Enlightenment to their wayward shores.
 liberal_conservative_subtype: "Либеральный консерватизм" # Liberal Conservatism
 liberal_conservative_subtype_desc: "§Y(Либеральный консерватизм)§!\n\nПочти парадоксальная мыслеформа, сочетающая консервативные идеи с либеральными позициями. Либеральный консерватизм представляет собой смешанную смесь, которая сильно различается в зависимости от нации, которая ее исповедует. Расколотые на группы, которые поддерживают дерегуляцию и свободный рынок, и те, которые вместо этого поддерживают экономический интервенционизм, эти группы объединены в своем стремлении к гражданским свободам и свободам, одновременно отстаивая консервативные социальные позиции. В целом, либеральный консерватизм сочетает в себе либеральный капитализм и социальную справедливость с традиционалистскими взглядами на общество и жизнь и чрезвычайно распространен, особенно в западном мире, хотя на практике его можно увидеть по всему миру." # §Y(Liberal Conservatism)§!\n\nA near-paradoxical thoughtform that combines conservative ideas with liberal stances, Liberal Conservatism is a mixed bag that varies greatly depending on the nation that professes it. Split between groups that support deregulation and the free market, and those that instead support economic interventionism, these groups are united in their pursuit of civil liberties and freedoms while championing Conservative social positions. Overall, Liberal Conservatism fuses Liberal Capitalism and Social Justice with Traditionalist views on society and life, and is exceedingly common in the Western World specifically, though it can be seen in practice across the globe.
 marlib_venizelism_subtype: "Венизелизм" # Venizelism
 marlib_venizelism_subtype_desc: "§Y(Венизелизм)§!\n\nВенизелизм - одно из самых значительных политических движений в Греции с начала 20 века. В период с 1910 по 1922 год, когда Греция находилась в состоянии постоянной военной готовности, возникло новое политическое мышление, воплощенное Элефтериосом Венизелосом, которое обычно называлось венизелизмом. Трудно определить, в чем именно заключалась эта политическая идеология, но с точки зрения экономики венизелизм рассматривал греческое государство как рычаг выражения и развития эллинизма. Другими словами, греческое государство должно было добиться интеграции эллинизма за пределами своих границ и, обладая единой национальной и государственной идентичностью, претендовать на свое место в тогдашнем современном мире. Это потребовало не только институциональной модернизации, чтобы сделать государство эффективным и надежным, но и общей приверженности идее развития производительных сил страны." # §Y(Venizelism)§!\n\nVenizelism is one of the most significant political movements in Greece since the start of the 20th centrury. During the period of 1910 to 1922, when Greece was in a state of continuous military readiness, a new political mindset emerged, embodied by Eleftherios Venizelos, and was commonly referred to as Venizelism. It is difficult to define in what exactly this political ideology was, but in terms of the economy, Venizelism considered the Greek state as a lever for the expression and development of Hellenism. In other words, the Greek state had to pursue the integration of Hellenism beyond its borders and, with a unified national and state identity, claim its place in the then-modern world. This required not only institutional modernization to make the state efficient and reliable but also a general commitment to the idea of developing the nation's productive forces.
 national_socialism_subtype: "Национал-социализм" # National Socialism
 national_socialism_subtype_desc: "§Y(Национальный социализм)§!\n\nНесмотря на название, идеология, поддерживаемая Национал-социальной партией, пропагандирует гражданский национализм, чешский патриотизм, либеральный реформизм и либерализованный, умеренный социализм, поскольку она является чрезвычайно популистской по отношению к своим гражданам и одновременно стремится создать умеренное государство всеобщего благосостояния. Осуждая марксистские идеи социализма и вместо этого продвигая реформистскую программу, связанную с современным капитализмом, эти национал-социалисты стремятся принести свободу, процветание, эгалитаризм и патриотизм своему народу. Несмотря на то, что в прошлом, задолго до Великой войны, партия и ее идеология были слегка антисемитскими, партия и ее идеология уже давно отказались от этих ядовитых идей и стремятся к созданию действительно либеральной и единой нации для всех в ее границах." # §Y(National Socialism)§!\n\nDespite the name, the ideology espoused by the National Social Party promotes civic nationalism, Czech patriotism, liberal reformism, and liberalized, moderated socialism in that it is immensely populist with its citizenry while seeking to establish a moderated welfare state. Denouncing Marxist ideas of Socialism and instead pushing for a reformist agenda tied to modern Capitalism, these National Socialists seek to bring liberty, prosperity, egalitarianism, and patriotism to their own people. Though mildly antisemitic in its past well before the Great War, the party and its ideology have long abandoned these venomous ideas, and push for a truly liberal and united nation for all within its borders.
 marlib_national_liberalism_subtype: "Национал-либерализм" # National Liberalism
 marlib_national_liberalism_subtype_desc: "§Y(Национальный либерализм)§!\n\nНациональный либерализм описывает направление основной либеральной мысли, которое также поддерживает патриотизм и национализм - как гражданский, так и этнический по форме - которые по своей сути связаны с их понятиями свободы, равенства, свободы и братства. Национал-либералы, обычно более консервативные или традиционалистские, чем основной либерализм, стремятся к обществу порядка и защищенных свобод, но известно, что многие из них предлагают преференциальное отношение к гражданам, которым нравится каждый режим. Тем не менее, национал-либерализм является законной либеральной идеологией, уходящей корнями во Францию, Европу в целом и их колониальные владения за рубежом." # §Y(National Liberalism)§!\n\nNational Liberalism describes the strand of mainline Liberal thought that also espouses patriotism and nationalism - either civic or ethnic in form - tied inherently to their notions of liberty, equality, freedom, and fraternity. Commonly more conservative or traditionalist than mainline Liberalism, National Liberals seek a society of order and protected freedoms, but many have been known to offer preferential treatment towards each regimes favored citizenry. Regardless, National Liberalism is a legitimate Liberal ideology, with roots in France, wider Europe, and their colonial possessions abroad.

### Social Conservative
 christian_democracy_subtype: "Христианская демократия" # Christian Democracy
 christian_democracy_subtype_desc: "§Y(Христианская демократия)§!\n\nХристианско-демократические движения понимают, что только предоставляя людям выбор, а не принуждение, религиозное общество может быть поддержано. Основываясь на католическом социальном учении и неокальвинизме, христианские демократы стремятся создать свободное общество, в котором будут уважаться традиционные семейные ценности, социальная справедливость и старый добрый патриотизм. Хотя большинство христианских демократических партий не исключают ни одну конфессию, некоторые могут предпочесть придерживаться строго антиэкуменической позиции. К удивлению некоторых, многие сторонники христианской демократии в своих взглядах на экономику склоняются скорее к левому флангу, выступая за такие модели, как дистрибутизм, основанный на энциклике Папы Льва XIII «Rerum novarum». Эта позиция, конечно, не единственный выбор: другие проповедуют Евангелие процветания или поддерживают христианский капитализм." # §Y(Christian Democracy)§!\n\nChristian Democratic movements understand that only through allowing people a choice, and not coercion, a religious society might be upheld. Basing its programmes on Catholic social teaching and neo-Calvinism, Christian Democrats strive to create a free society in which traditional family values, social justice and good old fashioned patriotism will be respected. While most Christian Democratic parties don't exclude any denomination, some might choose to keep to a strictly anti-ecumenical position. Surprisingly to some, many advocates for Christian Democracy are rather left leaning in their views on the economy, advocating for models such as Distributism, based on Pope Leo XIII's 'Rerum novarum' encyclical. That position is of course not the only choice, with others preaching the Prosperity Gospel or upholding Christian Capitalism.
 soccon_warlordism_subtype: "военачальство" # Warlordism
 soccon_warlordism_subtype_desc: "§Y(Варлордизм)§!\n\nВарлордизм вряд ли является единой идеологией при любом воображении. Вместо этого он описывает разнообразную, бессвязную, дезорганизованную и милитаристскую природу различных клик военачальников по всему миру и был назван в честь периода военачальников в Китае, когда этот термин стал популяризироваться в современном контексте. Начиная от бандитских группировок с государством и заканчивая организованными военными стартократиями и даже поддерживаемыми военными республиканскими правительствами или чистыми диктатурами, военачальство имеет меньше общего с политикой, а больше связано с отсутствием четких границ и вездесущим и часто хаотичным характером войны. Военачальство часто является переходным состоянием и обычно является лишь ступенькой на пути к более четко определенной политической системе, хотя некоторые государства, в которых чисто военачальники все же существуют." # §Y(Warlordism)§!\n\nWarlordism is hardly a uniform ideology by any stretch of the imagination. Instead, it describes the varied, incoherent, disorganized, and militarist nature of various warlord cliques around the world, and was named after the Warlord Period of China in which the term became popularized in the modern context. Ranging from bandit groups with a state to organized military startocracies to even military-backed republican governments or pure dictatorships, Warlordism has less to do with politics and more to do with a lack of clear borders and the ever-present and often chaotic nature of warfare. Warlordism is frequently a transitory state, and is usually just a stepping stone on the road to a more clearly defined political system, though some pure warlord states do exist.
 toryism_subtype: "Торизм" # Toryism
 toryism_subtype_desc: "§Y(Торизм)§!\n\nТоризм — это изначально британская версия традиционализма и консерватизма, которая поддерживает верховенство социального порядка в том виде, в котором он развивался в английской культуре на протяжении всей истории. Идею тори можно выразить фразой «Бог, король и страна». Тори, как правило, являются монархистами, исторически имели высокое церковно-англиканское религиозное наследие и выступают против политического либерализма. Обычно Тори защищают идеи иерархии, естественного порядка и аристократии." # §Y(Toryism)§!\n\nToryism is an originally-British version of traditionalism and conservatism, which upholds the supremacy of social order as it has evolved in the English culture throughout history. The Tory ethos has been summed up with the phrase \"God, King, and Country\". Tories are generally monarchists, were historically of a high church Anglican religious heritage, and are opposed to political liberalism. Typically, Tories defend the ideas of hierarchy, natural order, and aristocracy.
 national_conservative_subtype: "Национальный консерватизм" # National Conservatism
 national_conservative_subtype_desc: "§Y(Национальный консерватизм)§!\n\nНациональный консерватизм — это националистический вариант основной консервативной мысли, который концентрируется на поддержании национальной и культурной самобытности нации. Эти государства обычно продвигают традиционные культурные и социальные ценности, сыновнюю почтительность и важность семейной структуры, а также патриотический монокультурализм. Хотя их экономические взгляды различаются, они часто варьируются от корпоративизма и смешанной экономики до политики невмешательства, но обычно выступают против глобализации и интернационализма." # §Y(National Conservatism)§!\n\nNational Conservatism is a nationalist variant of mainline conservative thought that concentrates on upholding the national and cultural identity of the nation. These states usually promote traditional cultural and societal values, filial piety and the importance of the family structure, and patriotic monoculturalism. Though varied in their economic outlooks, they frequently range from corporatism and mixed-economics to laissez-faire policies, but usually oppose globalization and internationalism.
 ukrainian_social_conservatism_subtype: "Украинский социальный консерватизм" # Ukrainian Social Conservatism
 ukrainian_social_conservatism_subtype_desc: "§Y(Украинский социал-консерватизм)§!\n\nУкраинский социал-консерватизм, или украинский гетманизм, по мнению идейного основателя движения Вячеслава Липинского, — это «идея нового монархизма и нового аристократизма».\nГетманизм — это символ единства Украинской Нации и силы Украинского Государства, олицетворяемый в традиционном, национальном, наследственном гетман. \"Гетманство - это новая форма государственной жизни нашей Нации, которую нам для наших сыновей и потомков упорным трудом, жертвами и самоотверженностью еще предстоит создать...\" Лишь в идеологическом и организационном возрождении украинского консерватизма и в восстановлении собственными силами его точки опоры - гетманизма, есть выход из национальной украинской трагедии." # §Y(Ukrainian Social Conservatism)§!\n\nUkrainian Social Conservatism, or Ukrainian Hetmanism, according to Vyacheslav Lypynskyi, the ideological founder of the movement, is \"the idea of new monarchism and new aristocratism.\"\nHetmanism is a symbol of the unity of the Ukrainian Nation and the strength of the Ukrainian State, personified in a traditional, national, hereditary Hetman. \"Hetmanship is a new form of state life of our Nation, which we for our sons and descendants by hard work, sacrifices and dedication have yet to create...\" Only in the ideological and organizational revival of Ukrainian conservatism and in the restoration by its own forces of its fulcrum - Hetmanism, there is a way out of the national Ukrainian tragedy.
 soccon_jadidism_subtype: "джадидизм" # Jadidism
 soccon_jadidism_subtype_desc: "§Y(джадидизм)§!\n\nОпираясь на наследие ранних джадидов, джадидизм описывает уникальную тюркскую идеологию, способствующую либерализации традиционно консервативных исламских социально-экономических и политических структур тюркского и мусульманского населения в пределах старой Российской империи. Джадидисты считают, что для того, чтобы положить конец разложению, вызванному руками российских автократов, исламское общество должно пережить вдохновленное Западом и модернистское, но по своей сути исламское возрождение. Настаивая на либерализме, модернизме, индустриализации и общем большем равенстве и процветании, джадидизм стремится принести просвещение и современность своим недавно освобожденным нациям и тюркским народам, хотя степень этого сильно варьируется в зависимости от каждого движения, поскольку консервативные и истинно либеральные разновидности джадидизма становятся все более популярными в равной мере." # §Y(Jadidism)§!\n\nDrawing from the legacy for the early Jadids, Jadidism describes a uniquely Turkic ideology promoting the liberalization of the traditionally conservative Islamic socioeconomic and political structures of the Turkick and Muslim populations within the old Russian Empire. Jadidists hold that in order to slough off the decay wrought at the hands of the Russian autocrats, Islamic society must experience a Western-inspired and modernist, but inherently Islamic rebirth. Pushing for liberalism, modernism, industrialization, and overall greater equality and prosperity, Jadidism seeks to bring enlightenment and modernity to their newly-freed nations and the Turkic peoples, though the degree to which varies greatly with each movement, for Conservative and truly Liberal strains of Jadidism are increasingly popular in equal measure.
 filipino_nationalism_subtype: "Филиппинский национализм" # Filipino Nationalism
 filipino_nationalism_subtype_desc: "§Y(Филиппинский национализм)§!\n\nФилиппинский национализм — это идеология, которая подчеркивает гордость, единство и суверенитет филиппинского народа. Филиппинский национализм, укорененный в историческом контексте колонизации и борьбы за независимость, стремится продвигать уникальную культурную самобытность, наследие и интересы Филиппин. Он призывает к признанию вклада, истории и языка филиппинцев, одновременно бросая вызов внешнему влиянию и доминированию. Филиппинский национализм часто подчеркивает необходимость самоопределения, экономического развития и социальной справедливости. Он был движущей силой в формировании истории страны, влиянии на политические движения и руководстве усилиями по утверждению законного места Филиппин в мировом сообществе." # §Y(Filipino Nationalism)§!\n\nFilipino Nationalism is an ideology that emphasizes the pride, unity, and sovereignty of the Filipino people. Rooted in the historical context of colonization and struggles for independence, Filipino Nationalism seeks to promote the unique cultural identity, heritage, and interests of the Philippines. It calls for the recognition of Filipino contributions, history, and language, while challenging external influences and domination. Filipino Nationalism often highlights the need for self-determination, economic development, and social justice. It has been a driving force in shaping the nation's history, influencing political movements, and guiding efforts to assert the Philippines' rightful place in the global community.
 soccon_agrarianism_subtype: "Аграрность" # Agrarianism
 soccon_agrarianism_subtype_desc: "§Y(Аграризм)§!\n\nНесмотря на то, что аграризм не был конкретной идеологией с центральной доктриной или фундаментальными принципами, он стал широкой классификацией различных движений по всему миру, озабоченных интересами и тяжелым положением крестьянства в целом. Сторонники аграрных партий варьируются от крупных землевладельцев или землевладельцев до мелких землевладельцев и бедных фермеров, от низшего высшего класса до наиболее устойчивой базы поддержки среди среднего класса и, в конечном итоге, до низших классов. Истоки политического аграризма можно отнести к «правительству природы», разработанному физиократом и сторонником невмешательства Франсуа Кенэ, а также к республике сельской добродетели Томаса Джефферсона. Хотя сторонники таких партий считают народ страны основой общества и наиболее важной частью национального организма, они сильно расходятся в своих позициях в отношении экономики, налогообложения, протекционизма и свободной торговли, системы правления, религии и т. д. Аграрные партии в целом являются консервативными и традиционалистскими, хотя существует значительный контингент радикально либеральных и откровенно социалистических групп, между которыми смешаны некоторые нетрадиционные правые. Этот широкий диапазон можно увидеть, взглянув лишь на несколько сельских движений, таких как немецкое национально-революционное движение Landvolkbewegung или консервативно-монархистское Bund der Landwirte, более центристское чешское RSZML или финское Maalaisliitto, и даже радикальные с точки зрения социальных изменений, такие как польское PSL Wyzwolenia или болгарское BZNS." # §Y(Agrarianism)§!\n\nDespite not being a concrete ideology with a central doctrine or fundamental tenets, agrarianism became a broad classification of various movements across the entire globe concerned with the interests and plight of peasantry as a whole. Supporters of agrarian parties range from large landowners or landed gentry to smallholders and poor farmers, from the lower high class through the most consistent support base among the middle class, and ending up on the lower classes. The origins of political agrarianism can be traced to the 'government of nature' developed by physiocrat and laissez-faire advocate François Quesnay, as well as the republic of rural virtue of Thomas Jefferson. While supporters of such parties hold the people of the land as a foundation of society and the most important part of the nation's organism, they differ wildly in their positions regarding economy, taxation, protectionism vs free trade, system of government, religion etc. Agrarian parties are generally conservative and traditionalist, although there is a sizeable contingent of radically liberal and downright socialistic groups, with some unconventional right-wingers mixed in-between. This wide range can be seen by looking at only a few rural movements, such as the German national revolutionary Landvolkbewegung or the conservative and monarchist Bund der Landwirte, the more centrist Czech RSZML or the Finnish Maalaisliitto, and even the radicals in terms of social changes such as Poland's PSL Wyzwolenia or Bulgaria's BZNS.
 paternal_socialism_subtype: "Отцовский социализм" # Paternal Socialism
 paternal_socialism_subtype_desc: "§Y(Патернальный социализм)§!\n\nПатернальный социализм, также называемый консервативным социальным популизмом, патерналистским консерватизмом или, реже, христианским консервативным социализмом в западном мире, представляет собой уникальную мыслеформу, которая пытается объединить, казалось бы, противоречивые идеи традиционного консерватизма и немарксистского социализма или прогрессивного популизма. Эти странные системы, зародившиеся во время промышленной революции в Англии и Германии, но теперь все более распространенные за пределами западного мира, например, в Латинской Америке или Африке, где правила и ожидания социализма, ориентированного на Европу, не применяются. Эти странные системы стремятся построить моральные, консервативные общества, обычно, но не всегда, основанные на теистической этике, консервативной экономике благосостояния, классовом сотрудничестве и сотрудничестве и/или идеях гражданского национализма и неэкстремистского националистического патриотизма. Часто связанные с идеями рыночного социализма, христианского дистрибутизма, благотворительной экономики, государственного социализма Бисмарка и экономического интервенционизма, красного ториизма и других программ распределения богатства, патерналистские социалисты стремятся построить эгалитарные, неграбительские экономические системы, направленные против идей классовой борьбы, которые объединяют капиталистические и социалистические идеи в консервативный и патерналистский пакет на благо своих обычно традиционалистских и националистических народов, одновременно подрывая и ослабляя нормальные социалистические и левые движения. сохранять традиции и социальную стабильность, даже если это ставит их в противоречие с другими социалистами или консерваторами по всему миру." # §Y(Paternal Socialism)§!\n\nPaternal Socialism, also called Conservative Social Populism, Paternalistic Conservatism, or more rarely Christian Conservative Socialism in the Western World, is a unique thoughtform that attempts to fuse the seemingly contradictory ideas of traditional Conservatism and non-Marxist Socialism or Progressive Populism. Born during the Industrial Revolution in England and Germany but now increasingly common outside the Western World such as in Latin America or Africa where the rules and expectations of European-biased Socialisms do not apply, these strange systems seek to build moral, Conservative societies usually, but not always, rooted in theist ethics, Conservative welfare economics, class collaboration and cooperation, and/or ideas of Civic Nationalism and non-extremist Nationalist Patriotism. Often linked to ideas of Market Socialism, Christian Distributism, charity economics, Bismarck's State Socialism and economic interventionism, Red Toryism, and other wealth-sharing programs, Paternal Socialists seek to build egalitarian, non-predatory economic systems geared against ideas of class struggle that fuse Capitalist and Socialist ideas in a Consevative and Paternalistic package for the good of their usually traditionalist and nationalist peoples while undermining and weakening normal Socialist and Leftist movements to preserve tradition and societal stability, even if that puts them at odds with other Socialists or Conservatives around the globe.
 popularism_subtype: "Популяризм" # Popularism
 popularism_subtype_desc: "§Y(Популяризм)§!\n\nОсновная идеология Итальянской народной партии, Пополяризм, является политическим преемником более широких социальных движений христианской демократии. Был создан доном Луиджи Стурцо, католическим священником с опытом, включающим в себя мягкую социалистическую христианскую мысль, как альтернативное средство влияния на политику, одновременно сосредотачиваясь на людях, что Папа Лев XIII запретил группам ChristDem. Европейский популяризм представляет собой попытку католиков прийти к соглашению и признать существование демократических институтов и начать использовать их как силу, объединяющую все социальные классы вместе. Партии, выступающие за пополяризм, намеревались обеспечить пропорциональное представительство, уважение естественных сообществ, таких как семьи, более широкий охват всех социальных групп, избирательное право женщин и полукорпоративистский специальный сенат, состоящий из менеджеров, профсоюзов и ученых. Поскольку их происхождение связано с преимущественно аграрной базой, популисты также считают, что нация лучше всего функционирует, когда она децентрализована и когда местным сообществам предоставляется больше автономии. В каком-то смысле пополяризм является децентралистическим и органичным братом централистской и индивидуально ориентированной либеральной демократии." # §Y(Popularism)§!\n\nThe guiding ideology of the Italian Popular Party, Popolarismo is the political successor to the wider social movements of Christian Democracy. Having been created by Don Luigi Sturzo, a Catholic priest with a background including softly socialistic Christian thought, as an alternative means of influencing politics while focusing on the people, which Pope Leo XIII forbade the ChristDem groups to do. European Popularism represents the effort of Catholics to come to terms and accept the existence of democratic institutions, and beginning to utilize them as a force unifying all social classes together. Parties advocating Popolarismo set out to implement proportional representation, respecting natural communities such as families, wider outreach to all social groups, female suffrage and a semi-corporatist special senate composed of managers, trade unions and academics. Since their origins lay with a predominantly agrarian base Popularists additionally see the nation as best operating when decentralized and with local communities given more autonomy. In a way Popolarismo is the decentralistic and organic brother of the centralistic and individual focused liberal democracy.
 progressive_conservatism_subtype: "Прогрессивный консерватизм" # Progressive Conservatism
 progressive_conservatism_subtype_desc: "§Y(Прогрессивный консерватизм)§!\n\nПрогрессивный консерватизм — это политическая идеология, которая естественным образом сочетает в себе консервативную и прогрессивную политику, впервые зародившуюся в эпоху Просвещения, с целью создания упорядоченного и ответственного общества, которое по-прежнему заботится о своих людях. Впервые появился в Западной Европе в консервативных группах, выступающих за социальные реформы в области науки, экономики, образования, технологий, медицины и других аспектов условий жизни человека, на которые начало негативно влиять промышленная революция и ее растущие последствия, а также аболиционистское движение, которое начало набирать обороты примерно в то же время, особенно в Великобритании. Призывая к созданию сетей социальной защиты и минималистских систем благосостояния, прогрессивный консерватизм стремится улучшить общество без радикальных или быстрых изменений установленного статус-кво и традиций и часто связан с католическим социальным учением, христианской демократией и даже с папским литературным трудом «Rerum novarum», который призывает к определенной форме католического консервативного прогрессизма, чтобы защитить христианские рабочие массы от хищничества социализма. В более современные времена эту идеологию практиковали и адаптировали по всему миру такие люди, как бывший американский президент Теодор Рузвельт и британский премьер-министр Бенджамин Дизраэли, и теперь она снова начала находить современную популярность как консервативная альтернатива более опасной и радикальной левой прогрессивистской идеологии." # §Y(Progressive Conservatism)§!\n\nProgressive Conservatism is a political ideology that naturally combines conservative and progressive policies first birthed during the Age of Enlightenment in order to create an orderly and responsible society that still cares for its people. First appearing in Western Europe in conservative groups pushing for social reform in the areas of science, economics, education, technology, medicine, and other facets of human living conditions that had begun to be negatively affected by the Industrial Revolution and its growing consequences, as well as with the abolitionist movement that had begun to take flight around the time, particularly in Britain. Calling for social safety nets and minimalist welfare systems, Progressive Conservatism seeks to improve society without radical or rapid changes to the established status quo and traditions, and is often tied to Catholic social teaching, Christian democracy, and even the papal literary work ‘Rerum novarum’ which calls for a form of Catholic conservative progressivism in order to safeguard the Christian working masses against the predation of Socialism. In more modern times, the ideology has been practiced and adapted across the world by the likes of former American president Theodore Roosevelt and British prime minister Benjamin Disraeli, and now has begun finding contemporary popularity once again as a Conservative alternative to more dangerous and radical Leftist progressivist ideology.
 moderate_authoritarianism_subtype: "Умеренный авторитаризм" # Moderate Authoritarianism
 moderate_authoritarianism_subtype_desc: "§Y(Умеренный авторитаризм)§!\n\nУмеренный авторитаризм на первый взгляд может показаться очень похожим на стандартный авторитарный режим, но это было бы крайне ошибочным мнением. Государства, следующие такой идеологии, по-прежнему рассматривают демократию как хорошую форму правления, но понимают, что различные группы, работающие в ее рамках, угрожают ей. Таким образом, умеренные авторитаристы решают взять дело в свои руки, чтобы гарантировать соблюдение свободы и борьбу с радикалами, как левыми, так и правыми. Большинство умеренных авторитарных правительств пытаются поощрять более традиционные и консервативные взгляды, но все же могут допускать распространение умеренного либерализма, конечно, в пределах разумного." # §Y(Moderate Authoritarianism)§!\n\nModerate Authoritarianism might seem very similar to a standard authoritarian regime at first, but that would be a highly flawed view. States following such ideology still view democracy as being a good form of government, but do understand that various groups working inside its framework threaten it. Thus, Moderate Authoritarians decide to take matters into their own hands to ensure that liberty is upheld and radicals, both left and right, are combated. Most Moderate Authoritarian governments try to foster more traditional and conservative views, yet might still allow for moderate liberalism to spread, within bounds of reason of course.
 soccon_liberal_conservative_subtype: "Либеральный консерватизм" # Liberal Conservatism
 soccon_liberal_conservative_subtype_desc: "§Y(Либеральный консерватизм)§!\n\nПочти парадоксальная мыслеформа, сочетающая консервативные идеи с либеральными позициями. Либеральный консерватизм представляет собой смешанную смесь, которая сильно различается в зависимости от нации, которая ее исповедует. Расколотые на группы, которые поддерживают дерегуляцию и свободный рынок, и те, которые вместо этого поддерживают экономический интервенционизм, эти группы объединены в своем стремлении к гражданским свободам и свободам, одновременно отстаивая консервативные социальные позиции. В целом, либеральный консерватизм сочетает в себе либеральный капитализм и социальную справедливость с традиционалистскими взглядами на общество и жизнь и чрезвычайно распространен, особенно в западном мире, хотя на практике его можно увидеть по всему миру." # §Y(Liberal Conservatism)§!\n\nA near-paradoxical thoughtform that combines conservative ideas with liberal stances, Liberal Conservatism is a mixed bag that varies greatly depending on the nation that professes it. Split between groups that support deregulation and the free market, and those that instead support economic interventionism, these groups are united in their pursuit of civil liberties and freedoms while championing Conservative social positions. Overall, Liberal Conservatism fuses Liberal Capitalism and Social Justice with Traditionalist views on society and life, and is exceedingly common in the Western World specifically, though it can be seen in practice across the globe.

### Authoritarian Democrat
 authdem_national_conservative_subtype: "Национальный консерватизм" # National Conservatism
 authdem_national_conservative_subtype_desc: "§Y(Национальный консерватизм)§!\n\nНациональный консерватизм — это националистический вариант основной консервативной мысли, который концентрируется на поддержании национальной и культурной самобытности нации. Эти государства обычно продвигают традиционные культурные и социальные ценности, сыновнюю почтительность и важность семейной структуры, а также патриотический монокультурализм. Хотя их экономические взгляды различаются, они часто варьируются от корпоративизма и смешанной экономики до политики невмешательства, но обычно выступают против глобализации и интернационализма." # §Y(National Conservatism)§!\n\nNational Conservatism is a nationalist variant of mainline conservative thought that concentrates on upholding the national and cultural identity of the nation. These states usually promote traditional cultural and societal values, filial piety and the importance of the family structure, and patriotic monoculturalism. Though varied in their economic outlooks, they frequently range from corporatism and mixed-economics to laissez-faire policies, but usually oppose globalization and internationalism.
 police_state_subtype: "Полицейское государство" # Police State
 police_state_subtype_desc: "§Y(Полицейское государство)§!\n\nОт военного положения и комендантского часа до жестких репрессий и законного патернализма — основные принципы, составляющие полицейское государство, неизменно схожи, несмотря на большое количество форм, в которых такое государство может принимать. В зависимости от того, где оно сформировалось и в каких условиях оно сформировалось, нация, управляемая полицией, может быть политической или аполитичной, профессиональной или непрофессиональной, коррумпированной или добродетельной — все в разной степени — но несмотря на эту идеологическую изменчивость, их всех объединяет базовое желание контролировать неуправляемое и хаотичное общество. Подобно военным хунтам, но обычно менее милитаристские и империалистические, полицейские государства стремятся навести порядок в своем народе превыше всего, и, имея на своей стороне Закон, они могут делать это безнаказанно." # §Y(Police State)§!\n\nFrom martial law and curfews to harsh crack downs and lawful paternalism, the main pillars that make up a Police State are unvaryingly similar despite the large number of forms such a state can come in. Depending on where it has formed and the conditions it formed under, a police-run nation can be political or apolitical, professional or unprofessional, corrupt or virtuous - all to varying degrees - but despite this ideological fluidity, they all share a baseline desire to control an otherwise unruly and chaotic society. Similar to military juntas but usually less militaristic and imperialistic, Police States seek to bring order to their people above all other pursuits, and with the Law on their side, they can do so with impunity.
 auth_duumvirism_subtype: "Дуумвиризм" # Duumvirism
 auth_duumvirism_subtype_desc: "§Y(Дуумвиризм)§!\n\nОсновано на убеждении, что единая власть необходима для обеспечения эффективного управления и принятия решений. Однако эта власть должна быть уравновешена двумя конкурирующими фракциями, имеющими равную силу и влияние. Считается, что такой баланс сил способствует стабильности, предотвращает коррупцию и гарантирует, что решения принимаются в интересах всего сообщества, а не только одной группы или отдельного человека." # §Y(Duumvirism)§!\n\nBased on the belief that a single authority is necessary to ensure effective governance and decision-making. However, this authority must be balanced by two competing factions with equal power and influence. This balance of power is thought to promote stability, prevent corruption, and ensure that decisions are made in the best interests of the entire community, rather than just one group or individual.
 authdem_junta_subtype: "Военная хунта" # Military Junta
 authdem_junta_subtype_desc: "§Y(Военная хунта)§!\n\nВоенные хунты — это режимы, полностью управляемые через национальные вооруженные силы или поддерживаемые военными правительства аналогичного характера. Хунты часто представляют собой стратократические, милитаристские и авторитарные режимы, которые быстро подавляют любое предполагаемое инакомыслие или угрозу нации или ее военному режиму и, как известно, ставят военную мощь и обеспечение национальной безопасности или амбиций выше любых других целей." # §Y(Military Junta)§!\n\nMilitary Juntas are regimes ruled fully through the nation's Armed Forces or through military-backed governments of a similar nature. Juntas are often stratocratic, militarist, and authoritarian regimes that are swift to crack down on any perceived dissent or threat to the nation or its Military regime, and are known to emphasize military might and the fulfillment of national security or ambition over any other pursuit.
 authdem_warlordism_subtype: "военачальство" # Warlordism
 authdem_warlordism_subtype_desc: "§Y(Варлордизм)§!\n\nВарлордизм вряд ли является единой идеологией при любом воображении. Вместо этого он описывает разнообразную, бессвязную, дезорганизованную и милитаристскую природу различных клик военачальников по всему миру и был назван в честь периода военачальников в Китае, когда этот термин стал популяризироваться в современном контексте. Начиная от бандитских группировок с государством и заканчивая организованными военными стартократиями и даже поддерживаемыми военными республиканскими правительствами или чистыми диктатурами, военачальство имеет меньше общего с политикой, а больше связано с отсутствием четких границ и вездесущим и часто хаотичным характером войны. Военачальство часто является переходным состоянием и обычно является лишь ступенькой на пути к более четко определенной политической системе, хотя некоторые государства, в которых чисто военачальники все же существуют." # §Y(Warlordism)§!\n\nWarlordism is hardly a uniform ideology by any stretch of the imagination. Instead, it describes the varied, incoherent, disorganized, and militarist nature of various warlord cliques around the world, and was named after the Warlord Period of China in which the term became popularized in the modern context. Ranging from bandit groups with a state to organized military startocracies to even military-backed republican governments or pure dictatorships, Warlordism has less to do with politics and more to do with a lack of clear borders and the ever-present and often chaotic nature of warfare. Warlordism is frequently a transitory state, and is usually just a stepping stone on the road to a more clearly defined political system, though some pure warlord states do exist.
 oligarchy_subtype: "Олигархизм" # Oligarchism
 oligarchy_subtype_desc: "§Y(Олигархизм)§!\n\nОлигархи — это режимы, в которых доминирует горстка элит, которые принимают решения от имени населения в целом. Они могут варьироваться от советов бизнес-магнатов до сильных мира сего, военных деятелей, политиков или любых других фигур власти, и в их странах обычно доминируют богатые или элитные группы. Они сильно различаются по тому, насколько официальными или постоянными являются их правящие органы, но правящий класс в олигархиях часто не озабочен ничем, кроме расширения своего собственного богатства и власти." # §Y(Oligarchism)§!\n\nOligarchies are regimes dominated by a handful of elites who make decisions on behalf of a general populace. They can vary from councils of business tycoons to strongmen, military figures, politicians, or any other figures of power, and their nations are usually dominated by a rich or elite group. They vary greatly in how official or permanent their ruling bodies are, but the ruling class in Oligarchies often aren't concerned with much besides expanding their own wealth and power
 prussian_constitutionalism_subtype: "Прусский конституционализм" # Prussian Constitutionalism
 prussian_constitutionalism_subtype_desc: "§Y(Прусский конституционализм)§!\n\nПрусский конституционализм — это полуавторитарная форма парламентского монархизма, сочетающая в себе идеи просвещенного монархизма и элитизма, поддерживаемые ограниченной системой конгрессов, обычно моделируемой по образцу немецкого ландтага. Антилиберальный по своей природе, граничащий с реакционным, этот сплав консервативного демократического республиканизма, милитаризма и монархизма является отличительной чертой идеологии старой Пруссии и Кайзеррейха и создан по образцу Конституции Германии, отсюда и название." # §Y(Prussian Constitutionalism)§!\n\nPrussian Constitutionalism is a semi-Authoritarian form of Parliamentary Monarchism combining ideas of enlightened monarchism and elitism supported by a limited congressional system usually modeled on the German landtag. Anti-Liberal in nature bordering on reactionary, this fusion of conservative democratic republicanism, militarism, and monarchism is the hallmark ideology of old Prussia and the Kaiserreich and is modeled on the Constiution of Germany, hence the name.
 controlled_democracy_subtype: "Контролируемая демократия" # Controlled Democracy
 controlled_democracy_subtype_desc: "§Y(Контролируемая демократия)§!\n\nКонтролируемая демократия относится к политической системе, в которой сохраняется видимость демократии, но власть фактически концентрируется в руках нескольких избранных лиц или групп. Для него характерны ограниченные политические свободы, ограниченность оппозиционных партий и манипулирование избирательными процессами с целью обеспечить сохранение власти правящей элитой. Хотя выборы могут состояться, они часто жестко контролируются и манипулируются для обеспечения заранее определенных результатов, что фактически ограничивает подлинное демократическое участие и принятие решений населением в целом." # §Y(Controlled Democracy)§!\n\nControlled democracy refers to a political system where the appearance of democracy is maintained, but power is effectively concentrated in the hands of a select few individuals or groups. It is characterized by limited political freedoms, restricted opposition parties, and manipulation of electoral processes to ensure the ruling elite retains power. Although elections may take place, they are often tightly controlled and manipulated to ensure predetermined outcomes, effectively limiting genuine democratic participation and decision-making by the general population.
 hetmanism_subtype: "гетманство" # Hetmanism
 hetmanism_subtype_desc: "§Y(Гетманство)§!\n\nГетманство — движение, развившееся из консервативных монархических движений в Украине. Их взгляды становились все более абсолютистскими и националистическими по своей природе по сравнению с умеренными консерваторами, что в конечном итоге привело к расколу монархистов. Гетманизм прославляет независимый дух Украины и черпает вдохновение из казачьей культуры, одновременно продвигая реваншистскую внешнюю политику в сочетании с консервативными социальными идеями. Скоропадский является лидером движения и до сих пор пользуется значительной поддержкой в ​​вооруженных силах. Из-за военного прошлого Скоропадского идея милитаризованного общества в сочетании с сильной исполнительной властью и слабым парламентом стала определяющим фактором его абсолютистского движения." # §Y(Hetmanism)§!\n\nHetmanism is a movement which evolved from the conservative monarchist movements in Ukraine. Their views became increasingly absolutist and nationalists in nature compared to the moderate conservatives, which lead to a eventual split of the monarchists. Hetmanism glorifies Ukraine's independent spirit and takes many inspirations from cossack culture, while promoting a revanchist foreign policy coupled to conservative social ideas. Skoropadskyi is the leading person behind the movement and still has considerable support within the armed forces. Due to the military background of Skoropadskyi, the idea of a militarized society coupled with a strong executive and a weak parliament became defining factors of his absolutist movement.
 authdem_revolution_nationale_subtype: "Национальная революция" # Révolution Nationale
 authdem_revolution_nationale_subtype_desc: "§Y(Национальная революция)§!\n\nНациональная революция — это официальная идеология французского государства после того, как маршал Петен и его сторонники установили полный контроль. Его идеология направлена ​​на революцию и радикальное восстановление французского общества путем установления сильного морального порядка, сосредоточенного вокруг личности маршала Петена, который является объектом обширного и обширного культа личности. Осуждая либерализм, парламентаризм, социализм и отвергая модернизм интеллектуальной и политической элиты, которую считали ответственной за захват власти коммунарами, режим маршала вместо этого продвигал более простой, аграрный идеал жизни, сосредоточенный вокруг семьи, религии и традиций, прививая молодежи ценности самопожертвования и преданности Отечеству." # §Y(Révolution Nationale)§!\n\nThe 'National Revolution' is the official ideology of the French state after Marshal Pétain and his loyalists instituted complete control. Its ideology aims to revolutionize and rebuild French society radically by instituting a strong moral order centered around the person of Marshal Pétain who is the object of a vast and extensive Cult of Personality. Denouncing liberalism, parliamentarianism, socialism and rejecting the modernism of the intellectual and political elites held responsible for the Communards' seizure of power, the Marshal's regime promoted instead a simpler, agrarian ideal of life centered around the family, religion and traditions while instilling in the youth the values of sacrifice and devotion to the Fatherland.
 authdem_christian_democracy_subtype: "Авторитарная христианская демократия" # Authoritarian Christian Democracy
 authdem_christian_democracy_subtype_desc: "§Y(Авторитарная христианская демократия)§!\n\nАвторитарная христианская демократия является результатом одного простого осознания того, что демократия сама по себе является разлагающей силой, когда она внедряется в любое общество, а родина ее, Древние Афины, являются ярким примером моральной деградации. Авторитарные христианско-демократические режимы занимают более активную позицию в борьбе с любой прогрессивной или социалистической силой, пытающейся разорвать ткань традиционного общества. Такие государства также могут иметь тесные связи с авторитетными религиозными институтами, при этом священнослужители время от времени выполняют функции министров или бюрократов. Несмотря на то, что авторитарные христианские демократы все еще желают триумфа социально справедливой экономики, они не дают передышки профсоюзам, чтобы они не расширили свое влияние и не свергли правительство блаженных и праведных." # §Y(Authoritarian Christian Democracy)§!\n\nAuthoritarian Christian Democracy is the result of one simple realization, that democracy itself is a corrupting force when introduced into any society, the birthplace of it, Ancient Athens, being a prime example of moral degradation. Authoritarian Christian Democratic regimes take a more active stance in combating any progressive or socialistic force trying to tear the fabric of traditional society apart. Such states might also have close connections with established religious institutions, with clergymen serving as occasional ministers or bureaucrats. Although still wanting for a socially just economy to triumph, Authoritarian ChristDems give no breathing room for unions, lest they expand their influence and overthrow the government of the blessed and the righteous.
 authdem_agrarianism_subtype: "Аграрность" # Agrarianism
 authdem_agrarianism_subtype_desc: "§Y(Аграризм)§!\n\nНесмотря на то, что аграризм не был конкретной идеологией с центральной доктриной или фундаментальными принципами, он стал широкой классификацией различных движений по всему миру, озабоченных интересами и тяжелым положением крестьянства в целом. Сторонники аграрных партий варьируются от крупных землевладельцев или землевладельцев до мелких землевладельцев и бедных фермеров, от низшего высшего класса до наиболее устойчивой базы поддержки среди среднего класса и, в конечном итоге, до низших классов. Истоки политического аграризма можно отнести к «правительству природы», разработанному физиократом и сторонником невмешательства Франсуа Кенэ, а также к республике сельской добродетели Томаса Джефферсона. Хотя сторонники таких партий считают народ страны основой общества и наиболее важной частью национального организма, они сильно расходятся в своих позициях в отношении экономики, налогообложения, протекционизма и свободной торговли, системы правления, религии и т. д. Аграрные партии в целом являются консервативными и традиционалистскими, хотя существует значительный контингент радикально либеральных и откровенно социалистических групп, между которыми смешаны некоторые нетрадиционные правые. Этот широкий диапазон можно увидеть, взглянув лишь на несколько сельских движений, таких как немецкое национально-революционное движение Landvolkbewegung или консервативно-монархистское Bund der Landwirte, более центристское чешское RSZML или финское Maalaisliitto, и даже радикальные с точки зрения социальных изменений, такие как польское PSL Wyzwolenia или болгарское BZNS." # §Y(Agrarianism)§!\n\nDespite not being a concrete ideology with a central doctrine or fundamental tenets, agrarianism became a broad classification of various movements across the entire globe concerned with the interests and plight of peasantry as a whole. Supporters of agrarian parties range from large landowners or landed gentry to smallholders and poor farmers, from the lower high class through the most consistent support base among the middle class, and ending up on the lower classes. The origins of political agrarianism can be traced to the 'government of nature' developed by physiocrat and laissez-faire advocate François Quesnay, as well as the republic of rural virtue of Thomas Jefferson. While supporters of such parties hold the people of the land as a foundation of society and the most important part of the nation's organism, they differ wildly in their positions regarding economy, taxation, protectionism vs free trade, system of government, religion etc. Agrarian parties are generally conservative and traditionalist, although there is a sizeable contingent of radically liberal and downright socialistic groups, with some unconventional right-wingers mixed in-between. This wide range can be seen by looking at only a few rural movements, such as the German national revolutionary Landvolkbewegung or the conservative and monarchist Bund der Landwirte, the more centrist Czech RSZML or the Finnish Maalaisliitto, and even the radicals in terms of social changes such as Poland's PSL Wyzwolenia or Bulgaria's BZNS.

### Paternal Autocrat
 absolute_mon_subtype: "Абсолютная монархия" # Absolute Monarchy
 absolute_mon_subtype_desc: "§Y(Абсолютная монархия)§!\n\nАбсолютная монархия часто устанавливает деспотический и авторитарный режим над людьми. Он состоит из самодержавного короля или императора, который правит страной железной рукой и под руководством могущественного правительства. Правительство имеет тенденцию быть консервативным, придерживаясь традиционных ценностей и направлений. Рынок, пресса и бизнес страны контролируются правительством, и люди живут, лишенные многих своих свобод." # §Y(Absolute Monarchy)§!\n\nAbsolute Monarchy holds a often despotic and authoritarian regime over the people. It is made of an autocratic king or emperor who rules over the country with an iron fist and with a powerful government under him. The government tends to be conservative with traditional values and focuses. The market, press, and businesses of the country are government controlled and the people live without a lot of their freedoms.
 social_nationalism_subtype: "Социальный национализм" # Social Nationalism
 social_nationalism_subtype_desc: "§Y(Социальный национализм)§!\n\nКак и левый национализм, социальный национализм относится к спектру национальных движений и националистических идеологий, находящихся под влиянием социалистической мысли. Социальный национализм, как правило, представляет собой национально-освободительное движение, которое подчеркивает продуманный, интеллектуальный и гражданский национализм, патриотизм и в некотором смысле более демократическую политическую систему, чем типичные национально-популистские движения. Такие движения, как правило, популярны в слаборазвитых странах, которые уже давно находятся под сильным влиянием метрополии или более могущественного соседа, и они подчеркивают апелляцию к социальной справедливости и национальным чувствам." # §Y(Social Nationalism)§!\n\nAkin to left-wing nationalism, Social Nationalism refers to a spectrum of national movements and nationalist ideologies influenced by socialist thought. Social nationalism tends to be a national liberation movement that emphasizes a well-considered, intellectual and civic nationalism, patriotism, and in some ways a more democratic political system than typical national-populist movements. Such movements tend to be popular in underdeveloped countries that have long been under the strong influence of a metropolis or a more powerful neighbor, and the appeal to social justice and national sentiment is what they emphasize.
 authdem_social_nationalism_subtype: "Социальный национализм" # Social Nationalism
 authdem_social_nationalism_subtype_desc: "§Y(Социальный национализм)§!\n\nКак и левый национализм, социальный национализм относится к спектру национальных движений и националистических идеологий, находящихся под влиянием социалистической мысли. Социальный национализм, как правило, представляет собой национально-освободительное движение, которое подчеркивает продуманный, интеллектуальный и гражданский национализм, патриотизм и в некотором смысле более демократическую политическую систему, чем типичные национально-популистские движения. Такие движения, как правило, популярны в слаборазвитых странах, которые уже давно находятся под сильным влиянием метрополии или более могущественного соседа, и они подчеркивают апелляцию к социальной справедливости и национальным чувствам." # §Y(Social Nationalism)§!\n\nAkin to left-wing nationalism, Social Nationalism refers to a spectrum of national movements and nationalist ideologies influenced by socialist thought. Social nationalism tends to be a national liberation movement that emphasizes a well-considered, intellectual and civic nationalism, patriotism, and in some ways a more democratic political system than typical national-populist movements. Such movements tend to be popular in underdeveloped countries that have long been under the strong influence of a metropolis or a more powerful neighbor, and the appeal to social justice and national sentiment is what they emphasize.
 pat_duumvirism_subtype: "Дуумвиризм" # Duumvirism
 pat_duumvirism_subtype_desc: "§Y(Дуумвиризм)§!\n\nОсновано на убеждении, что единая власть необходима для обеспечения эффективного управления и принятия решений. Однако эта власть должна быть уравновешена двумя конкурирующими фракциями, имеющими равную силу и влияние. Считается, что такой баланс сил способствует стабильности, предотвращает коррупцию и гарантирует, что решения принимаются в интересах всего сообщества, а не только одной группы или отдельного человека." # §Y(Duumvirism)§!\n\nBased on the belief that a single authority is necessary to ensure effective governance and decision-making. However, this authority must be balanced by two competing factions with equal power and influence. This balance of power is thought to promote stability, prevent corruption, and ensure that decisions are made in the best interests of the entire community, rather than just one group or individual.
 samurai_dictatorship_subtype: "Самурайская диктатура" # Samurai Dictatorship
 samurai_dictatorship_subtype_desc: "§Y(Самурайская диктатура)§!\n\nС древних времен самураи всегда хотели иметь власть над императорским двором. И считается, что руководство самураев сделает Японию вечно сильной. Кроме того, благодаря заботе об этих воинах-самураях управление государственными делами никогда не будет загрязнено иностранными идеями.\n\nИ благодаря жизни на моральных принципах конфуцианства. В качестве оправдания используется утверждение, что правящие самураи были дикарями, безумными или авторитарными. Потому что добродетели Конфуция запечатлены в сердце каждого самурая. Также Бусидо сделал самурая сильным и расчетливым воином. Чтобы гарантировать, что Ямато останется сильным во веки веков." # §Y(Samurai Dictatorship)§!\n\nSince ancient times, the samurai have always wanted to have power over the imperial court. And it is believed that the leadership of the samurai will make Japan remains strong forever. Also, with the care of these samurai warriors, the administration of state affairs will never be contaminated by foreign ideas.\n\nAnd by living on the moral principles of Confucianism. This uses as an excuse the claim that the ruling samurais were savages, insane, or authoritarian. Because the virtues of Confucius are engraved in the hearts of every samurai. Also Bushido made the samurai a powerful and prudent warrior. To ensure the Yamato will remain strong forever and ever
 pataut_warlordism_subtype: "военачальство" # Warlordism
 pataut_warlordism_subtype_desc: "§Y(Варлордизм)§!\n\nВарлордизм вряд ли является единой идеологией при любом воображении. Вместо этого он описывает разнообразную, бессвязную, дезорганизованную и милитаристскую природу различных клик военачальников по всему миру и был назван в честь периода военачальников в Китае, когда этот термин стал популяризироваться в современном контексте. Начиная от бандитских группировок с государством и заканчивая организованными военными стартократиями и даже поддерживаемыми военными республиканскими правительствами или чистыми диктатурами, военачальство имеет меньше общего с политикой, а больше связано с отсутствием четких границ и вездесущим и часто хаотичным характером войны. Военачальство часто является переходным состоянием и обычно является лишь ступенькой на пути к более четко определенной политической системе, хотя некоторые государства, в которых чисто военачальники все же существуют." # §Y(Warlordism)§!\n\nWarlordism is hardly a uniform ideology by any stretch of the imagination. Instead, it describes the varied, incoherent, disorganized, and militarist nature of various warlord cliques around the world, and was named after the Warlord Period of China in which the term became popularized in the modern context. Ranging from bandit groups with a state to organized military startocracies to even military-backed republican governments or pure dictatorships, Warlordism has less to do with politics and more to do with a lack of clear borders and the ever-present and often chaotic nature of warfare. Warlordism is frequently a transitory state, and is usually just a stepping stone on the road to a more clearly defined political system, though some pure warlord states do exist.
 junta_subtype: "Военная диктатура" # Military Dictatorship
 junta_subtype_desc: "§Y(Военная диктатура)§!\n\nВоенные хунты — это режимы, полностью управляемые через национальные вооруженные силы или поддерживаемые военными правительства аналогичного характера. Хунты часто представляют собой стратократические, милитаристские и авторитарные режимы, которые быстро подавляют любое предполагаемое инакомыслие или угрозу нации или ее военному режиму и, как известно, ставят военную мощь и обеспечение национальной безопасности или амбиций выше любых других целей." # §Y(Military Dictatorship)§!\n\nMilitary Juntas are regimes ruled fully through the nation's Armed Forces or through military-backed governments of a similar nature. Juntas are often stratocratic, militarist, and authoritarian regimes that are swift to crack down on any perceived dissent or threat to the nation or its Military regime, and are known to emphasize military might and the fulfillment of national security or ambition over any other pursuit.
 caudillo_populism_subtype: "Каудильо Популизм" # Caudillo Populism
 caudillo_populism_subtype_desc: "§Y(Популизм каудильо)§!\n\nПопулизм каудильо — это термин, используемый для обозначения различных популистских диктатур, существующих в Латинской Америке. Эти идеологии, зачастую не имея теоретических оснований, выдвигали сильного человека, часто военного, вокруг которого царит сильный культ личности, изображающий его чаще всего хранителем Отечества и Отцом народа. Обладая сильным популистским характером, эти режимы создают легитимность, часто внедряя несоциалистические формы благосостояния народа и опираясь на национализм или патриотизм. Экономическая политика этих режимов сильно различается: от государственной экономики до свободного рынка в пользу иностранных компаний и робкого протекционизма." # §Y(Caudillo Populism)§!\n\nCaudillo Populism is a term used to designate the different populist dictatorships present in Latin America. These ideologies, often without theoretical foundations, put forward a strong man, often a military man, around whom reigns a strong cult of personality showing him most often as guardian of the Fatherland and Father of the people. With a strong populist character, these regimes create legitimacy by often implementing non-socialist forms of welfare for the people, and by relying on nationalism or patriotism. The economic policies of these regimes vary greatly, ranging from state-run economies to free markets in favor of foreign companies to timid protectionism.
 corporatocracy_subtype: "Корпоратократия" # Corporatocracy
 corporatocracy_subtype_desc: "§Y(Корпоратократия)§!\n\nКорпоратократии — это режимы, полностью контролируемые крупными компаниями, монополиями или другими крупными коммерческими предприятиями. Корпоратократические режимы превыше всего ценят прибыль и, как известно, мало заботятся о чем-либо, кроме быстрого получения денег, хотя уровень или даже присутствие безжалостности может варьироваться. Права трудящихся в этих режимах, как известно, обычно ужасны, поскольку любая сила, которая потенциально может нанести вред их прибыли, подавляется, как только они заявляют о себе, часто с чрезвычайной силой." # §Y(Corporatocracy)§!\n\nCorporatocracies are regimes completely controlled by major companies, monopolies, or other large business ventures. Corporatocratic regimes value profit above all, and are known to have little regard for anything besides making a quick buck, though the level or even presence of ruthlessness can vary. Workers rights in these regimes are known to be usually abysmal, as any force that could potentially harm their bottom line is stamped out as soon as they make themselves known, frequently with extreme force
 pataut_legionarism_subtype: "Легионаризм" # Legionarism
 pataut_legionarism_subtype_desc: "§Y(Легионаризм)§!\n\nВпервые популяризированный Железной гвардией Румынии, Черносотенцами в России и АНИ в Италии, легионаризм представляет собой форму высокорелигиозного и глубоко милитаристского революционного национализма. Отвергая укоренившиеся политические элиты, хотя иногда и связанные с монархизмом, легионеры или легионеры выступают за национальную революцию, которая положит конец старому порядку и положит начало созданию нового, духовно возрожденного общества. Членов партий легионеров часто обучают действовать как воинствующие мученики, чтобы стать ближе к своей нации и Богу, хотя существуют и менее крайние примеры, когда национализм и патриотизм выражаются гораздо больше, чем мученичество. С точки зрения экономики не существует какой-либо определенной точки зрения, хотя капитализм и социализм обычно категорически отвергаются как развращающая иностранная сила, при этом в значительной степени доминируют корпоративизм, правый синдикализм или другие формы контролируемой экономики. Хотя акцент на религии и фанатизме сильно различается, большинство легионеров являются ярыми католиками или христианами, в зависимости от страны происхождения, и все они глубоко преданы ура-патриотическому возрождению своей родной страны." # §Y(Legionarism)§!\n\nFirst popularized by the Iron Guard of Romania, the Black Hundreds in Russia, and the ANI in Italy, Legionarism is a form of a highly religious and deeply militarist revolutionary nationalism. Rejecting entrenched political elites though sometimes tied to monarchism, Legionaries or Legionarists advocate for a national revolution that would end the old order and usher in the creation of a new, spiritually reborn society. Members of Legionary parties are often trained to act as militant martyrs in order to become closer to their Nation and God, though less extreme examples exist where Nationalism and Patriotism are expressed far more than martyrdom. In terms of economics, there is no one defined view, although Capitalism and Socialism are usually outright rejected as a corrupting, foreign force, with Corporatism, Right Syndicalism, or other forms of controlled economics largely being dominant. Though the emphasis on religion and zealotry widely differs, most Legionarists are devoutly Catholic or Christian, depending on the nation of origin, and all are deeply devoted to the jingoistic revitalization of their native country.
 ukrainian_nationalism_subtype: "Украинский национализм" # Ukrainian Nationalism
 ukrainian_nationalism_subtype_desc: "§Y(Украинский национализм)§!\n\nУкраинский национализм возник в 19 веке и набрал силу благодаря упорному труду украинских интеллектуалов, писателей, историков, священников, военнослужащих и политиков. Николай Михновский, автор брошюры «Независимая Украина», определил национализм как оружие порабощенного народа против своих обидчиков. В период с 1914 по 1922 год молодому поколению пришлось принять участие в кровопролитной борьбе за независимость Украины. Война и принесенные жертвы заставили большое количество людей навсегда выбрать свою судьбу – воевать. Бороться с национальной несправедливостью, за Украину, ее свободу, честь, славу и народ. Конечная цель национализма – добиться создания украинского, единого и независимого государства, чего бы для этого ни потребовались." # §Y(Ukrainian Nationalism)§!\n\nUkrainian nationalism emerged in the 19th century and gained strength through the hard work of Ukrainian intellectuals, writers, historians, priests, servicemen, and politicians. Mykola Mikhnovskyi, author of the brochure \"Independent Ukraine,\" defined nationalism as a weapon of the enslaved people against their offenders. Between 1914 and 1922, the younger generation had to take part in the bloody struggle for Ukraine's independence. The war and the sacrifices that were made forced a large number of people to choose their destiny forever - to fight. To fight against national injustice, for Ukraine, its freedom, honor, glory and people. The ultimate goal of nationalism is to achieve a Ukrainian, united and independent state, no matter what it takes.
 revolution_nationale_subtype: "Национальная революция" # Révolution Nationale
 revolution_nationale_subtype_desc: "§Y(Национальная революция)§!\n\nНациональная революция — это официальная идеология французского государства после того, как маршал Петен и его сторонники установили полный контроль. Его идеология направлена ​​на революцию и радикальное восстановление французского общества путем установления сильного морального порядка, сосредоточенного вокруг личности маршала Петена, который является объектом обширного и обширного культа личности. Осудив либерализм, парламентаризм, социализм и отвергнув модернизм интеллектуальной и политической элиты, которую считали ответственной за упадок Франции, режим маршала вместо этого продвигал более простой, аграрный идеал жизни, сосредоточенный вокруг семьи, религии и традиций, прививая молодежи ценности самопожертвования и преданности Отечеству." # §Y(Révolution Nationale)§!\n\nThe 'National Revolution' is the official ideology of the French state after Marshal Pétain and his loyalists instituted complete control. Its ideology aims to revolutionize and rebuild French society radically by instituting a strong moral order centered around the person of Marshal Pétain who is the object of a vast and extensive Cult of Personality. Denouncing liberalism, parliamentarianism, socialism and rejecting the modernism of the intellectual and political elites held responsible for France's decline, the Marshal's regime promoted instead a simpler, agrarian ideal of life centered around the family, religion and traditions while instilling in the youth the values of sacrifice and devotion to the Fatherland.
 theocracy_subtype: "Теократия" # Theocracy
 theocracy_subtype_desc: "§Y(Теократия)§!\n\nТеократии, возможно, являются одной из старейших форм правления в человеческом обществе. Теократии, состоящие из священников, святых людей или деятелей, претендующих на то, что они представляют Бога или Богов, существуют для того, чтобы направлять людей к их конечной цели и предлагать свою должную осмотрительность своему божеству. Хотя теократии сильно различаются в зависимости от религии, в широком смысле теократии представляют собой авторитарные системы, подавляющие все инакомыслие и противостоящие религии." # §Y(Theocracy)§!\n\nTheocracies are perhaps one of the oldest forms of government within human society. Made up either of priests, holy men or figures claiming to represent God or the Gods, Theocracies exist to direct the people to their ultimate end and to offer the their due diligences to their deity. While heavily differing depending on the religion, broadly speaking, Theocracies are authoritarian systems that crush all dissent and opposing religions.
 pataut_metaxism_subtype: "Метаксизм" # Metaxism
 pataut_metaxism_subtype_desc: "§Y(Метаксизм)§!\n\nМетаксизм — греческая националистическая авторитарная идеология, связанная с Иоаннисом Метаксасом. Он призывает к возрождению греческой нации и созданию современной, культурно однородной эллинской нации. Матаксизм унижает либерализм и индивидуализм, одновременно пропагандируя различные элементы, обычно встречающиеся в валкистских или национал-популистских движениях. Он стремится мобилизовать греческий народ как дисциплинированную массу на благо создания нового эллинского государства. Хотя некоторые из доктрин метаксизма описываются как национал-популистские, с академической точки зрения он считается уникальным самодержавным губернаторством, основанным на личных работах Метаксаса, объединяющих идеи классического консерватизма, монархизма, валкизма и национал-популистских движений. Идея третьей греческой цивилизации после первой древнегреческой и второй византийской цивилизаций является общим центром движения, которое по-разному определяется различными направлениями внутри метаксизма." # §Y(Metaxism)§!\n\nMetaxism is a Greek nationalist authoritarian ideology associated with Ioannis Metaxas. It calls for the regeneration of the Greek nation and the establishment of a modern, culturally homogeneous Hellenic Nation. Mataxism disparages Liberalism and individualism while propagating various elements commonly found in Valkist or National Populist movements. It seeks to mobilize the Greek people as a disciplined mass in service of the creation of a new Hellenic State. Although some of the doctrines of Metaxism are described as National Populist, academically it is considered to be a unique big tent autocratic governorship based on the personal works of Metaxas unifying ideas from classical Conservatism, Monarchism, Valkism and National Populist movements. The Idea of the Third Greek Civilization after the first ancient Greek and the second Byzantine Civilizations is the common center of the movement, which is defined differently by the various strains within Metaxism.


### National Populist
 volkisch_national_valkism_subtype: "Фёлькишский национал-валькизм" # Völkisch National-Valkism
 volkisch_national_valkism_subtype_desc: "§Y(Völkisch National-Valkism)§!\n\nЧто такое валкизм? Это, несомненно, ультранационалистическая идеология, основанная после Великой войны Адамом Дресслером путем объединения многочисленных добровольческих корпусов и ассоциаций ветеранов. Взяв свое название в честь отличительного символа, который они носят, валкисты также являются ультрамилитаристами и разделяют чувство элитарности как братское движение братьев, вдохновленное движениями Бюндишской молодежи. Однако это также начинает момент, когда валкизм начинает расходиться с основным движением валкистов, последовавшим за никем иным, как немецким фюрером Адамом Дресслером. Однако Дресслер был не единственным теоретиком, идеализировавшим путь валкистов. Рудольф Юнг был одним из первых, кто сформулировал валкистский путь, идеализируя способы управления государством. Однако он и другие вскоре увидят, что их видение предано кликой социалистов и другой несчастной молодежи, пытающейся подорвать национально-социальную революцию в немецких народах. Теперь, когда эти предатели свергнуты, TST может, наконец, принести настоящий валькизм, новый валкизм, который видит реальность либерального мирового порядка, контролируемого евреями. Валкизм, который обеспечит уничтожение двойной гидры капитализма и марксизма, и что Великая Германия восстанет из пепла как величайшая нация в Европе и мире - Фёлькишский национал-валькизм должен стать путем вперед для Германии." # §Y(Völkisch National-Valkism)§!\n\nWhat is Valkism? It is undeniably an ultra-nationalist ideology, founded in the wake of the Great War by Adam Dressler through the unification of numerous Freikorps and veteran associations. Taking their name after the distinctive symbol they wear, Valkists are also ultra-militaristic and share a sense of elitism as a fraternal movement of brothers, inspired by the Bündisch Youth movements. This however also begins the moment where Valkism begins to diverge with the mainstream Valkist movement having taken after none other than German Führer Adam Dressler. However, Dressler was not the only theoretician to idealize the Valkist way. Rudolf Jung was among the first formulators of the Valkist way, idealizing how the state would be run. However, he and others would soon see their vision betrayed by a cabal of socialists and other miserable youths, attempting to subvert the national-social revolution in the German peoples. Now with these traitors overthrown, the TST can at last bring true Valkism, a new Valkism that sees the reality of the Jewish-controlled liberal world order. A Valkism that will ensure the dual hydras of capitalism and Marxism are slain and that Greater Germany will arise from the ashes as the greatest nation in Europe and the world - Völkisch National-Valkism shall be the way forward for Germany.
 statist_showaist_subtype: "Статистский шоуизм" # Statist Showaism
 statist_showaist_subtype_desc: "§Y(государственный шоуизм)§!\n\nС момента восхождения нынешнего императора на хризантемовый трон Японская империя пережила упадок. Экономика достигла критической точки, а иммиграция корейцев, а также либеральное влияние в японской политике только вдохновили правых экстремистов. Их единственная цель, возглавляемая защитниками милитаризма и генералами Имперских вооруженных сил на острове Ямато, — очистить остров и избавить его от любой коррумпированной западной идеологии раз и навсегда.\n\nПод знаменем восстановления Сёва крайне правые приняли националистические и другие правые идеи из Европы, но с оттенком социализма. Это привело к созданию Шоваизма, идеологии, стремящейся очистить Японскую империю. Накано Сейго, японский политик и один из сторонников шоуизма, считает, что сочетание корпоративизма и государственного социализма может помочь реформировать бюрократию и избавить ее от иностранных идей. Сделав национализм центральным принципом выработки политики и полагаясь на доверенных и справедливых наблюдателей, японскую бюрократию можно защитить и очистить.\n\nЧтобы обеспечить защиту чистоты японской бюрократии, на острове Ямато будет создан специальный правительственный округ. Феодализм будет адаптирован к некоторым аспектам корпоративизма, чтобы обеспечить сбалансированную систему управления." # §Y(Statist Showaism)§!\n\nSince the ascension of the present emperor to the Chrysanthemum throne, the Japanese Empire has experienced a downfall. The economy has reached a critical point, and the immigration of Koreans, as well as liberal influences in Japanese politics, have only served to inspire right-wing extremists. Led by militarist advocates and the generals of the Imperial Armed Forces on Yamato Island, their only goal is to purify the island and rid it of any corrupted Western ideology once and for all.\n\nUnder the banner of Showa restoration, the far-right has embraced nationalistic and other right-wing ideas from Europe, but with a twist of socialism. This has led to the creation of Showaism, an ideology that seeks to purify the Japanese Empire. Nakano Seigo, a Japanese politician and one of Showaism's advocates, believes that the combination of corporatism and state socialism can help to reform the bureaucracy and rid it of foreign ideas. By making nationalism a central principle in policy-making and relying on trusted and fair overseers, the Japanese bureaucracy can be protected and purified.\n\nTo ensure the protection of the purity of the Japanese bureaucracy, a special government district will be created across Yamato Island. Feudalism will be adapted to some aspects of corporatism to ensure a balanced system of governance.
 integralism_subtype: "Интегрализм" # Integralism
 integralism_subtype_desc: "§Y(Интегрализм)§!\n\nИнтегрализм — это попытка создать общество, в котором нация полностью объединена в органическое, целостное и неконструктивное коллаборационистское целое. Хотя специфика варьируется от движения к движению, в широком смысле интегрализм настаивает на полном прекращении разделения церкви и государства, восстановлении или расширении полномочий монарха, прекращении классовой борьбы и децентрализации государства в органическую систему, в которой каждый аспект государства функционирует как независимый, но сотрудничающий орган, работающий в унисон со своими коллегами. Зачастую эгалитарный в некоторых отношениях, несмотря на свой националистический уклон, интегрализм и его производные представляют собой группу политических странностей, в которых доминируют христиане." # §Y(Integralism)§!\n\nIntegralism is the attempt to create a society in which the nation is fully united in an Organic, Integral, and noncombative collaborationist whole. While the specifics differ from movement to movement, broadly speaking Integralism pushes for the total end of Church and State separation, the restoration or empowerment of a Monarch, the end of class struggle, and the decentralization of the state into an organic system in which each aspect of the state functions as an independent but cooperative organ working in unison with its counterparts. Frequently egalitarian in some regards despite its Nationalist slant, Integralism and its derivatives are a group of Christian-dominated political oddities.
 legionarism_subtype: "Легионаризм" # Legionarism
 legionarism_subtype_desc: "§Y(Легионаризм)§!\n\nВпервые популяризированный Железной гвардией Румынии, Черносотенцами в России и АНИ в Италии, легионаризм представляет собой форму высокорелигиозного и глубоко милитаристского революционного национализма. Отвергая укоренившиеся политические элиты, хотя иногда и связанные с монархизмом, легионеры или легионеры выступают за национальную революцию, которая положит конец старому порядку и положит начало созданию нового, духовно возрожденного общества. Членов партий легионеров часто обучают действовать как воинствующие мученики, чтобы стать ближе к своей нации и Богу, хотя существуют и менее крайние примеры, когда национализм и патриотизм выражаются гораздо больше, чем мученичество. С точки зрения экономики не существует какой-либо определенной точки зрения, хотя капитализм и социализм обычно категорически отвергаются как развращающая иностранная сила, при этом в значительной степени доминируют корпоративизм, правый синдикализм или другие формы контролируемой экономики. Хотя акцент на религии и фанатизме сильно различается, большинство легионеров являются ярыми католиками или христианами, в зависимости от страны происхождения, и все они глубоко преданы ура-патриотическому возрождению своей родной страны." # §Y(Legionarism)§!\n\nFirst popularized by the Iron Guard of Romania, the Black Hundreds in Russia, and the ANI in Italy, Legionarism is a form of a highly religious and deeply militarist revolutionary nationalism. Rejecting entrenched political elites though sometimes tied to monarchism, Legionaries or Legionarists advocate for a national revolution that would end the old order and usher in the creation of a new, spiritually reborn society. Members of Legionary parties are often trained to act as militant martyrs in order to become closer to their Nation and God, though less extreme examples exist where Nationalism and Patriotism are expressed far more than martyrdom. In terms of economics, there is no one defined view, although Capitalism and Socialism are usually outright rejected as a corrupting, foreign force, with Corporatism, Right Syndicalism, or other forms of controlled economics largely being dominant. Though the emphasis on religion and zealotry widely differs, most Legionarists are devoutly Catholic or Christian, depending on the nation of origin, and all are deeply devoted to the jingoistic revitalization of their native country.
 klan_nationalism_subtype: "Клановый национализм" # Klan Nationalism
 klan_nationalism_subtype_desc: "§Y(Клан-национализм)§!\n\nКлан-национализм — это общее название идеологии превосходства белой расы, поддерживаемой американским Ку-клукс-кланом. Различные секты Клана, различающиеся по своему подходу к решению вопросов, касающихся расы и этнической принадлежности, сходятся в одном: Уайт прав. Идеи Клана разнообразны и разнообразны: от поддержки планов «Назад в Африку» до пропаганды полного возвращения рабства, но все они могут согласиться с тем, что благочестие, национализм, превосходство белой расы, американская исключительность и милитаризм — все это Божьи стремления." # §Y(Klan Nationalism)§!\n\nKlan Nationalism is a generic name of the White Supremacist ideology esposed by the American Ku Klux Klan. Varied in its approach to how it handles issues concerning race and ethnicity, the varied sects of the Klan all agree on one thing - White is right. From supporting Back to Africa plans to advocating to a total return the slavery, the ideas of the Klan are varied and diverse, but they can all agree that piety, nationalism, white supremacism, American exceptionalism, and militarism are all Godly pursuits.
 ukrainian_national_integralism_subtype: "Украинский национал-интегрализм" # Ukrainian National-Integralism
 ukrainian_national_integralism_subtype_desc: "§Y(Украинский национал-интегрализм)§!\n\nУкраинский национал-интегрализм основан на концепции Дмитрия Донцова «активного» или «интегрального» национализма. Учение Донцова основано на авторитарном интегральном национализме и социал-дарвинизме. По его словам, нация находится в состоянии постоянной конкуренции, а значит, войны за выживание, эту идею подкрепляет доктрина Михаила Колодзинского об агрессивном экспансионизме. Отсюда следует, что война — вещь неизбежная, а войны между народами вечны. Украинская нация, если она намерена войти в существующий мировой порядок наравне с существующими, должна иметь иерархию. Во главе должен быть лидер, воржд, затем элита или порядок, при котором живет масса или сброд. Партия выступает за доминирование Украины в Восточной Европе, чтобы обеспечить мир для отечества, и хочет колонизировать новые земли, чтобы государство могло существовать вечно." # §Y(Ukrainian National-Integralism)§!\n\nUkrainian National-Integralism is based on the Dmytro Dontsov's concept of 'Active' or 'Integral' Nationalism. The Dontsov's doctrine is based on authoritarian integral nationalism and Social-Darwinism. According to him, the nation is in a permanent state of competition, and therefore a war for survival, this idea is reinforced by Mykhailo Kolodzinskyi's doctrine of aggressive expansionism. It follows that war is an inevitable thing, and wars between nations are eternal. Ukrainian nation, if it intends to enter the existing world order on an equal footing with the established ones, should have a hierarchy. At the head should be a leader, the vorzhd, then the elite or the order, under which the mass or the rabble lives. The party stands for Ukrainian dominance in Eastern Europe to ensure peace for the fatherland and wants to colonize new lands so that the state can exist forever.
 falangism_subtype: "фалангизм" # Falangism
 falangism_subtype_desc: "§Y(Фалангизм)§!\n\nФалангизм, также известный как Фаланга, — крайне правая политическая идеология, возникшая в Испании в начале 20 века. Основанная Хосе Антонио Примо де Ривера в 1933 году, она приобрела известность во время диктатуры генерала Франсиско Франко с 1939 по 1975 год. Фалангизм сочетает в себе элементы национализма, авторитаризма и фашизма, подчеркивая единство нации и отвергая парламентскую демократию. Он продвигает централизованное правительство, антикоммунизм и корпоративистские экономические принципы.\n\nФалангизм выступает за сильную и самодостаточную Испанию, поддерживающую традиционные ценности и католицизм. Он стремится восстановить и сохранить культурное наследие Испании, отвергая при этом марксизм и интернационализм. Идеология придает большое значение коллективному единству, при этом ожидается, что люди будут ставить интересы нации выше своих собственных. Он предусматривает корпоративистскую экономическую систему, в которой различные сектора экономики организованы в синдикаты, действующие под контролем государства для достижения социальной и экономической гармонии." # §Y(Falangism)§!\n\nFalangism, also known as Falange, is a far-right political ideology that emerged in Spain in the early 20th century. Founded by José Antonio Primo de Rivera in 1933, it gained prominence under the dictatorship of General Francisco Franco from 1939 to 1975. Falangism combines elements of nationalism, authoritarianism, and fascism, emphasizing the unity of the nation and rejecting parliamentary democracy. It promotes a centralized government, anti-communism, and corporatist economic principles.\n\nFalangism advocates for a strong and self-sufficient Spain, upholding traditional values and Catholicism. It seeks to restore and preserve Spain's cultural heritage while rejecting Marxism and internationalism. The ideology places importance on collective unity, with individuals expected to prioritize the nation's interests over their own. It envisions a corporatist economic system where different sectors of the economy are organized into syndicates, operating under state control to achieve social and economic harmony.
 metaxism_subtype: "Метаксизм" # Metaxism
 metaxism_subtype_desc: "§Y(Метаксизм)§!\n\nМетаксизм — греческая националистическая авторитарная идеология, связанная с Иоаннисом Метаксасом. Он призывает к возрождению греческой нации и созданию современной, культурно однородной эллинской нации. Матаксизм унижает либерализм и индивидуализм, одновременно пропагандируя различные элементы, обычно встречающиеся в валкистских или национал-популистских движениях. Он стремится мобилизовать греческий народ как дисциплинированную массу на благо создания нового эллинского государства. Хотя некоторые из доктрин метаксизма описываются как национал-популистские, с академической точки зрения он считается уникальным самодержавным губернаторством, основанным на личных работах Метаксаса, объединяющих идеи классического консерватизма, монархизма, валкизма и национал-популистских движений. Идея третьей греческой цивилизации после первой древнегреческой и второй византийской цивилизаций является общим центром движения, которое по-разному определяется различными направлениями внутри метаксизма." # §Y(Metaxism)§!\n\nMetaxism is a Greek nationalist authoritarian ideology associated with Ioannis Metaxas. It calls for the regeneration of the Greek nation and the establishment of a modern, culturally homogeneous Hellenic Nation. Mataxism disparages Liberalism and individualism while propagating various elements commonly found in Valkist or National Populist movements. It seeks to mobilize the Greek people as a disciplined mass in service of the creation of a new Hellenic State. Although some of the doctrines of Metaxism are described as National Populist, academically it is considered to be a unique big tent autocratic governorship based on the personal works of Metaxas unifying ideas from classical Conservatism, Monarchism, Valkism and National Populist movements. The Idea of the Third Greek Civilization after the first ancient Greek and the second Byzantine Civilizations is the common center of the movement, which is defined differently by the various strains within Metaxism.



### Valkist
 panasian_nichirenist_subtype: "Паназиатский ничиренизм" # Pan-Asian Nichirenism
 panasian_nichirenist_subtype_desc: "§Y(Паназиатский нитирэнизм)§!\n\nЭволюция нитирэнизма началась с Танака Тигаку, отца нитирэнизма, который верил, что буддизм Нитирэн является высшей истиной среди всех других верований на острове Ямато. Логосу ничиренизма должны следовать все, от императора до бюрократов и даже простых людей. В японской интерпретации Лотосовой сутры считается, что Будда — единственное высшее существо и даже центр вселенной. Логотипы Будды олицетворяют высшую истину вселенной, а Император станет Маршалом Святых Вооруженных Сил и наместником Будды. Он направит объединение Азии на правильный и абсолютный путь. После того, как мир будет объединен, Сутра Лотоса будет преподаваться во всех уголках мира.\n\nПозже ничиренизм получил дальнейшее развитие Иноуэ Ниссо, проповедника и бывшего армейского шпиона, присоединившегося к Синьхайской революции. Он верил, что получил истину от Будды, укрываясь в заброшенном храме, и у него была мотивация изучать буддизм Нитирэн. Он присоединился к ассоциации Тигаку по обучению ничиренизму и вместе развивал паназиатство и ничиренизм. Он считал, что Япония — это центр мира, Китайско-Индосфера, и что объединение Азии — то же самое, что объединение мира. Лотосовая Сутра должна быть распространена как на Луну (Индия), так и на Солнце (Япония), и нет веры, которая была бы выше Лотосовой Сутры с запада на восток." # §Y(Pan-Asian Nichirenism)§!\n\nThe evolution of Nichirenism began with Tanaka Chigaku, the father of Nichirenism, who believed that Nichiren Buddhism is the supreme truth, above all other beliefs in Yamato Island. The logos of Nichirenism must be followed by everyone, from the Emperor to bureaucrats and even common people. In the Japanese interpretation of the Lotus Sutra, it is believed that the Buddha is the only supreme being and even the center of the universe. Buddha's logos represent the supreme truth of the universe, and the Emperor will become the Marshal of the Holy Armed Forces and the viceroy of Buddha. He will guide the unification of Asia on the right and absolute path. After the world has been unified, the Lotus Sutra shall be taught in every corner of the world.\n\nLater, Nichirenism was further developed by Inoue Nissho, a preacher and former army spy who joined the Xinhai Revolution. He believed that he received the truth from Buddha while taking refuge in an abandoned temple and was motivated to study Nichiren Buddhism. He joined Chigaku's association in teaching Nichirenism and developed Pan-Asianism and Nichirenism together. He believed that Japan was the center of the world, the Sino-Indosphere, and that the unification of Asia was the same as the unification of the world. The Lotus Sutra must be spread to both the Moon (India) and the Sun (Japan), and there is no faith that is above the Lotus Sutra from west to east.
 occultism_subtype: "Эзотерика" # Esotericism
 occultism_subtype_desc: "§Y(Эзотеризм)§!\n\nЭзотерический национализм, также называемый оккультным национализмом или эзотеризмом, представляет собой разнообразное подмножество крайне правых идеологий, объединенных общим акцентом на чужеродных философиях, религиях и других отчужденных идеях или движениях. Эти синкретические движения, часто связанные с язычеством, оккультизмом или маргинальными идеями, такими как теософия и ариософия, сочетают националистический пыл с выбранными ими мотивами или эстетикой и стремятся полностью перестроить общество в соответствии с провозглашенными ими догмами." # §Y(Esotericism)§!\n\nEsoteric Nationalism, also called Occultist Nationalism or Esotericism, is a diverse subset of far-Right ideologies bound together by their shared emphasis on outsider philosophies, religions, and other estranged ideas or movements. Often tied to Paganism, the Occult, or to fringe ideas like Theosophy and Ariosophy, these syncretic movements combine Nationalist fervor with their chosen motif or aesthetic, and seek to rebuild society completely along the lines of their proclaimed dogma.
 val_legionarism_subtype: "Легионаризм" # Legionarism
 val_legionarism_subtype_desc: "§Y(Легионаризм)§!\n\nВпервые популяризированный Железной гвардией Румынии, Черносотенцами в России и АНИ в Италии, легионаризм представляет собой форму высокорелигиозного и глубоко милитаристского революционного национализма. Отвергая укоренившиеся политические элиты, хотя иногда и связанные с монархизмом, легионеры или легионеры выступают за национальную революцию, которая положит конец старому порядку и положит начало созданию нового, духовно возрожденного общества. Членов партий легионеров часто обучают действовать как воинствующие мученики, чтобы стать ближе к своей нации и Богу, хотя существуют и менее крайние примеры, когда национализм и патриотизм выражаются гораздо больше, чем мученичество. С точки зрения экономики не существует какой-либо определенной точки зрения, хотя капитализм и социализм обычно категорически отвергаются как развращающая иностранная сила, при этом в значительной степени доминируют корпоративизм, правый синдикализм или другие формы контролируемой экономики. Хотя акцент на религии и фанатизме сильно различается, большинство легионеров являются ярыми католиками или христианами, в зависимости от страны происхождения, и все они глубоко преданы ура-патриотическому возрождению своей родной страны." # §Y(Legionarism)§!\n\nFirst popularized by the Iron Guard of Romania, the Black Hundreds in Russia, and the ANI in Italy, Legionarism is a form of a highly religious and deeply militarist revolutionary nationalism. Rejecting entrenched political elites though sometimes tied to monarchism, Legionaries or Legionarists advocate for a national revolution that would end the old order and usher in the creation of a new, spiritually reborn society. Members of Legionary parties are often trained to act as militant martyrs in order to become closer to their Nation and God, though less extreme examples exist where Nationalism and Patriotism are expressed far more than martyrdom. In terms of economics, there is no one defined view, although Capitalism and Socialism are usually outright rejected as a corrupting, foreign force, with Corporatism, Right Syndicalism, or other forms of controlled economics largely being dominant. Though the emphasis on religion and zealotry widely differs, most Legionarists are devoutly Catholic or Christian, depending on the nation of origin, and all are deeply devoted to the jingoistic revitalization of their native country.
