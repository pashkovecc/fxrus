 ### Unit Leader Events 
 unit_leader.1.t: "[From.GetName] заболевает"
 unit_leader.1.d: "Похоже, что на службе нации [From.From.GetRank] [From.From.GetName] совершенно не бережет [From.From.GetHerselfHimself]. Из-за сурового климата в зоне [From.From.GetHerHis] операций [From.From.GetRank] заболевает, и на поправку, вероятно, потребуется время. Пока [From.From.GetSheHe] не выздоровеет, [From.From.GetSheHe] не сможет командовать на [From.From.GetHerHis] обычном уровне."
 unit_leader.1.a: "Прискорбно."
 unit_leader.2.t: "[From.GetName] получает ранение"
 unit_leader.2.d: "Стремясь победоносно завершить битву, [From.From.GetRank] [From.From.GetName], похоже, берет на [From.From.GetHerselfHimself] слишком большой риск, лично ведя в бой [From.From.GetHerHis] солдат. [From.From.GetSheHeCap] получает ранение, и, вероятно, на полное исцеление потребуется время, в течение которого [From.From.GetRank] не сможет действовать на [From.From.GetHerHis] обычном уровне."
 unit_leader.2.a: "Прискорбно."
  
