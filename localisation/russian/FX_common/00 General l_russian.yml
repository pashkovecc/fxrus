 ### Ideology Subtype Desc 
 vanguardist_subtype_desc: "Национал-коммунизм — термин, описывающий совокупность теорий и концепций, разработанных Вячеславом Молотовым под влиянием трудов Генриха Лауфенберга и Фрица Вольфхейма. Переработанный под российские реалии, национал-коммунизм делает упор на построение социализма в отдельном государстве. В ортодоксальном понимании национал-коммунистические режимы стремятся строить свою политическую систему по ленинскому образцу, создавая авангардное революционное государство для последующего перехода к коммунизму. Однако этот авангард, по их мнению, должен опираться на сильное национальное государство и его лидеров. Это сочетается со склонностью к тоталитарным методам и широким применением политического насилия для чистки «контрреволюционных элементов». Сельское хозяйство подвергается сплошной коллективизации, а экономика полностью переходит в руки государства. В итоге национал-коммунизм остается нишевым течением левой мысли: считая себя единственным истинным преемником идей Ленина, он полностью открещивается от реформистского социализма и с подозрением относится к мейнстримному ленинизму."
 collectivist_subtype_desc: "Коммунизм — это группа марксистских идеологий, зародившихся в Германии и России на фоне Русской революции и окончания Великой войны. Отколовшись от основных марксистских партий того времени, коммунисты отвергают идею перехода к социализму парламентским путем, выступая за создание партийного центра, разжигающего классовую борьбу с целью насильственного свержения капиталистического общества. Взамен коммунистические движения стремятся создать однопартийное социалистическое государство для организации экономики и защиты от контрреволюции. В рамках системы демократического централизма коммунистические партии централизуют процесс принятия решений для более эффективной мобилизации своих рядов и борьбы с ревизионистскими тенденциями."
 libertarian_socialist_subtype_desc: "Либертарный социализм объединяет широкий спектр социалистических доктрин, выступающих против ленинской гегемонии в социалистическом движении. Они поддерживают децентрализованное, антиавторитарное и антикапиталистическое общество, демократически управляемое рабочими, которым также принадлежат средства производства. Либертарные идеологии включают левый коммунизм, коммунизм рабочих советов, анархо-синдикализм и анархо-коммунизм, и не следуют строго догматам марксизма или классического коммунизма."
 social_democrat_subtype_desc: "Социал-демократия — это идеология, целью которой является реформирование и гуманизация капитализма. Она стремится привести его в соответствие с этическими идеалами социального благополучия, сохраняя при этом капиталистический способ производства, а не создавая альтернативную социалистическую экономическую систему. Хотя обычно она поддерживает плутократическую форму правления и жестко регулируемую рыночную экономику, существуют и более радикальные ее течения."
 social_liberal_subtype_desc: "Социал-либерализм — это вариация классического рыночного либерализма, главное отличие которой заключается во включении различных гражданских свобод в число базовых прав человека. Провозглашая прогрессивную социальную и экономическую политику, социал-либералы стремятся создать общество, в котором каждый человек волен проживать свою жизнь, имея всю полноту возможностей независимо от своего статуса."
 market_liberal_subtype_desc: "Рыночные либералы считают себя представителями основного течения либеральной идеологии. Главными принципами рыночного либерализма являются нерегулируемый свободный рынок и либерально-демократическая политическая система. Рыночные либералы верят, что чем свободнее рынок, тем свободнее люди, и готовы стойко защищать политические и экономические права личности."
 social_conservative_subtype_desc: "Консерватизм — это политическая идеология, которая может сильно варьироваться в зависимости от политической истории региона или нации. Тем не менее, она, как правило, сосредоточена на сохранении традиционных верований, взглядов и философии, а также традиционной динамики власти в обществе при использовании демократической системы. Выступая против как радикальных, так и умеренных изменений статус-кво, консерваторы стремятся поддерживать в обществе порядок и стабильность. Большинство консервативных обществ обычно поддерживают регулируемую рыночную экономику и отдают предпочтение экономическому протекционизму."
 authoritarian_democrat_subtype_desc: "Авторитарная демократия — это идеология, сочетающая сильную исполнительную власть с представительным парламентом и частично демократической политической системой. Авторитарно-демократические режимы часто занимают консервативную позицию по социальным вопросам, выступают за централизацию и, как правило, придерживаются «ястребиных» настроений в правительстве; хотя встречаются и изоляционистские ветви этой идеологии. Цель таких режимов — поддерживать национальную стабильность и обеспечивать народу одновременно популярное и ответственное правительство."
 paternal_autocrat_subtype_desc: "Патернализм не является политической идеологией в привычном смысле этого слова; скорее, это общий термин, описывающий отношение подобных правительств к своим гражданам: все люди являются подданными лидера — короля или диктатора, и задача и долг лидера — вести государство и общество по правильному и лучшему пути, объединяя народ под своей благосклонной защитой. Такие страны обычно имеют очень авторитарное правительство, консервативные социальные взгляды и контролируемую государством экономику."
 national_populist_subtype_desc: "Охватывая множество ультранационалистических и милитаристских движений, национал-популизм обычно превозносит преданность государству, объединяя народ под властью сильного лидера и корпоративной экономики. В дипломатии национал-популисты, как правило, делают упор на экспансионистскую, «ястребиную» и реваншистскую политику, если это уместно или актуально для данной нации. Часто пропагандируя расовую политику и прибегая к агрессивной риторике, национал-популизм встречает яростное сопротивление со стороны большинства других политических партий."
 valkist_subtype_desc: "Валькизм — это ультранационалистическая идеология, основанная после Великой войны Адамом Дресслером путем объединения многочисленных фрайкоров и ветеранских ассоциаций. Свое название они получили от характерного символа, который носят. Валькисты отличаются ультрамилитаризмом и разделяют чувство элитаризма как братское движение, вдохновленное молодежными движениями «Бюндиш». Они поддерживают формирование естественной аристократии заслуг и силы, закаленной в окопах Великой войны, которая должна возродить германское государство. Валькистская нация строится на строгой правовой основе и опирается на сильную исполнительную власть государства. Валькисты принимают современные реалии. Национализм рассматривается как противоядие от разрушительной природы современности, и с помощью технологий и прогресса валькисты хотят преодолеть эту эпоху. В экономическом плане валькисты твердо стоят на антикапиталистических позициях и выступают за вмешательство государства. Вдохновляясь немецкой экономикой военного времени, фронтовым социализмом и прусским социализмом, они, как правило, отдают предпочтение государственной экономике. «Фольксгемайншафт» (народная общность) является ключевым аспектом валькистского немецкого общества и описывает общие идеалы, историю, культуру и обязанности немецкого народа. Под мудрым руководством Дресслера немецкий народ принесет Европе новое будущее вопреки декадентским капиталистическим демократиям Запада и выродившимся марксистам-материалистам Востока."
