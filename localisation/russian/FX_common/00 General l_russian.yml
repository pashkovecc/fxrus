 ### Credits 
 # TODO: FIX CREDITS 
 FX_SPLASH_TITLE: "§YСоздано с любовью командой Фюреррейха:§!"
 FX_SPLASH_CREDITS: "dax · Todd Howard · Captain Kaiczer · Dej · AmCath · Lextzo · BobRossHD · AngryCatholic · JoeBidenWhatAreYouHiding · David Lu · RAus · ainsley · the feets guy · Smigly · ATonyAtLaw2021 · thanasislanaras · terroristguy · miklos · Log · Ahmed Pasha Al Said · 9504 · Pascal · Crazy Green Hair Guy · Mitchell · Fokel · Formula · The dëtæīłêd brëæd · Mapper History · Mr. Saltine · The Man who sold the World · Thought_West · karimlebg · Fire · Maisel · Denis_MD · guerrillero · scipion34 · retiredlt24 · literallycamusenjoyer · Ayla · Brian! · Dragon_Arach · KingfishChris · Leopold · Lord Death · Norman · Trowald · SomeRandomAutocrat · Whitewoods · Yondaime · Steffplays123 · rcbpbankinghowcanihelpyou · Telephone Crab · Raufasertapete\n\n§CОтдельная благодарность создателям оригинального Фюреррейха за то, что разрешили продолжить их дело:§!\nDarknight1342 · Jespertjee · Trimeon · Drowse · Spocklan116 · Steffplays123 · Arser · Kalmoire · Kaiserman · LuxLoser · Milekhippy · Terran117 · Teutonician Germanicus Danziger · Freidrich von Omansich · Kano901 · Raptor Jesus · Hellbat\n\n§RТакже благодарим разработчиков Кайзерредукса и Кайзеррейха,§!\n\n§Cи спасибо тебе, Игрок, что играешь в наш мод!§!\n\n§YМод переведён Пашковцом§!"
  
 intro.1.t: "Фюреррейх версия 0.3.1\nВ стальных грозах: Чёрные знамёна — Хотфикс 2"
 intro.1.d: "Спасибо за ожидание! 0.3.1, «В стальных грозах — Чёрные знамёна Хотфикс 2» наконец-то доступна для всех.\n\nХотфикс «Чёрные знамёна» 2 обеспечивает совместимость с версией игры 1.19, а также попутно исправляет несколько небольших багов.\n\nПодробнее об этом патче вы можете прочитать в свежем дневнике разработки на нашем Сабреддите, /r/fuhrerredux.\n\nНад этим модом непрерывно работает сплочённая команда добровольцев со всего мира, и мы искренне ценим ваши тёплые слова и время, проведённое за нашей работой. От всего сердца выражаем вам самую глубокую благодарность; приятной игры!"
 intro.1.a: "Спасибо!"
 intro.1.b: "Что с популярностью партий?"
 intro.1.c: "А есть где-нибудь FAQ?"
 intro.2.t: "FAQ по Фюреррейху"
 intro.2.d: "В: Контент моей любимой страны говно! Получит ли она реворк?\nО: Да, все страны со временем должны получить переработку. Ничто в моде не останется неизменным.\n\nВ: Получит ли моя любимая страна контент в будущем?\nО: Наша цель — чтобы все нации в конечном итоге получили контент. Сколько времени на это уйдёт? Можете быть уверены, довольно много, в конце концов, мы всего лишь люди.\n\nВ: Будут ли какие-либо DLC обязательными для Фюреррейха?\nО: Категорически нет. Хотя Фюреррейх будет эффективно использовать новые функции из официальных дополнений, мы не будем обязывать игроков покупать DLC для игры в мод.\n\nВ: Почему вы провели ребрендинг?\nО: Поскольку оригинальный Фюреррейх теперь полностью мёртв, мы решили занять своё место как его официальный преемник. Оригинальное название мода, «Фюрерредукс», вызывало некоторую путаницу: люди думали, что наша цель, как и у Кайзерредукса, — предоставить «альтернативный опыт». На самом же деле цели нашей команды — развивать и продолжать оригинальный Фюреррейх, опираясь на идейные основы, с которых он начинался.\n\nВ: Я хочу присоединиться к команде как художник/кодер/тестер/писатель! Где подать заявку?\nО: Отлично! Вам нужно зайти на наш Discord-сервер и заполнить соответствующую анкету. Ссылку на наш Discord-сервер можно найти в меню паузы (круглая иконка с логотипом Discord). Также ссылка есть на странице мода в мастерской Steam."
 intro.2.a: "Почему все забирают мою политку?"
 intro.3.t: "Популярность партий для чайников"
 intro.3.d: "В Фюреррейхе используется система министров из Кайзеррейха, да и в целом мод активно заимствует идеи оттуда во многих других сферах. Один из таких примеров — система популярности партий.\n\nСистема популярности в Кайзеррейхе дает ощутимый прирост политической власти для стран с высокой популярностью правящей партии — это попытка отразить довольство населения режимом или парламентское большинство при демократии. Как правило, чем выше популярность, тем больше прирост политки. Ниже приведены критерии для разных уровней популярности:\n\nОчень низкая популярность = Меньше 20% популярности правящей партии\nНизкая популярность = 20% - 40% популярности правящей партии\nСредняя популярность = 40% - 60% популярности правящей партии\nВысокая популярность = 60% - 80% популярности правящей партии\nОчень высокая популярность = Более 80% популярности правящей партии\n\nОговорка «Как правило, чем выше популярность, тем больше прирост политвласти» сделана не просто так. У некоторых стран, таких как Франция, эта система отключена — ради более точной симуляции механики коалиций (или вообще по другим причинам). Просто имейте это в виду, и игра за страны с отключенной системой популярности пройдет как по маслу!"
 intro.3.a: "Короче, ничего не поменялось?"
 intro.4.t: "Новостные ивенты!"
 intro.4.d: "Приветствуем! Как и в Кайзеррейхе, мир Фюреррейха во многом полагается на новостные ивенты, чтобы казаться живым и интересным. Впрочем, вам это может и не понравиться, и вы захотите их отключить, чтобы спама ивентами было поменьше.\n\nПо этим самым причинам нам нужно, чтобы вы выбрали настройки мировых новостей, прежде чем мы выпустим вас из этой цепочки событий."
 intro.4.a: "Я хочу видеть все новости"
 intro.4.b: "Только самые важные"
 intro.4.c: "Новости для слабаков!"
 intro.5.t: "Где гайды для стран?"
 intro.5.d: "Простите, что надоедаем вам ещё одним вступительным ивентом (раньше их вообще было 4). Но раз уж вы всё равно будете спрашивать: открываете окно страны (клик по флагу слева вверху или клавиша «Q»), потом жмёте на кнопку «Гайды» рядом с заголовком \"Политика\" и кнопкой правил. А если читать вам впадлу, можете просто глянуть на картинку ивента — вы её, скорее всего, первой и заметили, а этот текст даже не читали. В общем, если у вашей страны есть гайды, жмякайте и смотрите."
 intro.5.a: "Вааау"
  
