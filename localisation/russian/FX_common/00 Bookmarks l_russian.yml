 ### Name and Description 
 FR_history_title: "Краткая история"
 FR_scenario_name: "Наследие Великой войны"
 FR_scenario_desc: "Окончание Великой войны привело к упадку былого могущества и влияния старых империй — Османской, Австрийской и Германской, в то время как Соединенные Штаты, Великобритания и Франция возвысились. Хотя многие верили, что Великая война откроет новую эру мира, похоже, прежние противоречия ещё не угасли и вновь угрожают и без того хрупкому спокойствию..."
  
 OTHER_FUHRERREICH_DESC: "На дворе 1936 год, и мир стоит на пороге новой неизбежной войны. Но мировой порядок состоит не только из нескольких монолитных империй. Даже самый малый камень способен вызвать огромную волну, и небольшие государства могут кардинально изменить ход истории. Встанете ли вы на сторону валькистов? Понесёте ли дальше факел революции? Или даруете своему народу невиданную прежде истинную свободу? Вскоре мир сойдёт с рельсов спокойствия и погрузится в ад войны. И он не станет ждать ваших решений."
  
 highlight_minor_0_tt: "Вы можете сыграть за §YИндийское государство§!, начав кампанию за §YБританскую Индию§!. Соответствующее событие произойдёт вскоре после начала войны за независимость Индии."
