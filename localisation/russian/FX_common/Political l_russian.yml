 fx.political.22.t: "Министр поддерживает свою идеологию"
 fx.political.22.d: "В нашем нынешнем правительстве есть министр иной идеологии. Он начал продвигать собственную идеологию, что наносит вред популярности нашей партии. Мы должны действовать прямо сейчас, чтобы свести на нет его усилия."
 fx.political.22.a: "Мы ничего не можем сделать."
 fx.political.22.b: "Использовать наше влияние, чтобы свести на нет его усилия."
  
 fx.political.23.t: "Министр поддерживает свою идеологию"
