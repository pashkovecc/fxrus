 ### State Transfer Tool ### 
  
 fx.political.250.t: "Сделать [marked_country.GetNameDef] марионеткой?"
 fx.political.250.d: "Это превратит [marked_country.GetNameDef] в субъекта государства [to_be_overlord.GetNameDef] со стандартным уровнем автономии «Оккупированная марионетка». Если страна состоит в другом альянсе, она покинет его, но это не прекратит ни одну из текущих войн, в которых она участвует. Если вы хотите сделать это, вам следует прекратить войны отдельно.\n\n§RПРИМЕЧАНИЕ: Это может сломать контент Фюреррейха! Используйте на свой страх и риск!§!"
 fx.political.250.a: "Сделать это"
 fx.political.250.b: "Сделать это, но оставить им текущее правительство"
 fx.political.250.c: "Хотя, если подумать..."
  
 fx.political.251.t: "Освободить [marked_country.GetNameDef]?"
 fx.political.251.d: "Это сделает [marked_country.GetNameDef] полностью независимым государством. Это не изменит их текущее правительство (если только в моде нет контента для автоматической смены), не исключит [marked_country.GetNameDef] из альянса, если страна в нем состоит, и не выведет её из текущих войн.\n\n§RПРИМЕЧАНИЕ: Это может сломать контент Фюреррейха! Используйте на свой страх и риск!§!"
  
 fx.political.252.t: "Вступить в [to_be_faction_leader.GetFactionName]?"
 fx.political.252.d: "Это заставит [marked_country.GetNameDef] вступить в альянс [to_be_faction_leader.GetFactionName], распустив свой собственный альянс, если страна является его лидером, или просто покинув текущий альянс. Это не повлияет на текущие войны.\n\n§RПРИМЕЧАНИЕ: Это может сломать контент Фюреррейха! Используйте на свой страх и риск!§!"
  
 fx.political.253.t: "Возглавить [marked_country.GetFactionName]?"
 fx.political.253.d: "Это сделает [marked_country.GetNameDef] лидером альянса [marked_country.GetFactionName].\n\n§RПРИМЕЧАНИЕ: Это может сломать контент Фюреррейха! Используйте на свой страх и риск!§!"
  
 fx.political.254.t: "Покинуть [marked_country.GetFactionName]?"
 fx.political.254.d: "Это заставит [marked_country.GetNameDef] покинуть альянс [marked_country.GetFactionName], что приведет к распуску альянса, если страна является его лидером. Это не повлияет на текущие войны.\n\n§RПРИМЕЧАНИЕ: Это может сломать контент Фюреррейха! Используйте на свой страх и риск!§!"
  
 fx.political.255.t: "Мир с [peace_target.GetNameDef]?"
 fx.political.255.d: "[marked_country.GetNameDefCap] вместе со всеми своими союзниками заключит белый мир с [peace_target.GetNameDef] и всеми их союзниками.\n\n§RПРИМЕЧАНИЕ: Это может сломать контент Фюреррейха! Используйте на свой страх и риск!§!"
 fx.political.255.b: "Отделить [marked_country.GetNameDef] от союзников, затем заключить мир"
  
 fx.political.256.t: "Выйти из всех войн?"
 fx.political.256.d: "[marked_country.GetNameDefCap] заключит сепаратный белый мир во всех текущих войнах. Если страна является субъектом, она сначала будет освобождена, а если состоит в альянсе — покинет его.\n\n§RПРИМЕЧАНИЕ: Это может сломать контент Фюреррейха! Используйте на свой страх и риск!§!"
 fx.political.257.t: "Война с [war_target.GetNameDef]?"
 fx.political.257.d: "[marked_country.GetNameDefCap] объявит войну [war_target.GetNameDef]. Никаких проверок валидности объявления войны не проводится, кроме того, что две страны не являются союзниками и еще не воюют.\n\n§RПРИМЕЧАНИЕ: Это может сломать контент Фюреррейха! Используйте на свой страх и риск!§!"
  
