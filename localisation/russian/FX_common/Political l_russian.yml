 unit_limit_above_limit_desc: "\n--------------\n$unit_limit_above_limit_text$" #NT!
 unit_limit_above_limit_text: "§RМы превысили наш предел и единственный путь облегчить бремя нашей страны — расформировать некоторые дивизии.§!\n\n$MODIFIER_ARMY_ORG_FACTOR$: [?mobilisation_penalty_var|+=%1]\n$MODIFIER_CONSUMER_GOODS_FACTOR$: [?mobilisation_penalty_var_positive|=%H1]\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: [?mobilisation_penalty_var|+=%]\n$MODIFIER_TRAINING_TIME_ARMY_FACTOR$: [?mobilisation_penalty_var_positive|-=%]\n$MODIFIER_LAND_REINFORCE_RATE$: [?mobilisation_penalty_var|+=%1]" #NT!
  
 unit_limit_breakdown_desc: "[unit_limit_breakdown_desc]" #NT!
 unit_limit_breakdown_desc_enabled: "Каждая страна способна содержать лишь определённое количество отдельных дивизий, прежде чем её экономика и инфраструктура начнут испытывать трудности с их обеспечением.\n\nМаксимальное количество поддерживаемых дивизий зависит от §Hнаселения§! страны и §Hколичества регионов во владении§!, а затем умножается на отношение этого значения к §Hколичеству фабрик§! в этих регионах.\n\nВ §Hгражданских войнах§! базовые значения рассчитываются исходя из суммы всех регионов, принадлежащих всем участникам." #NT!
 unit_limit_breakdown_desc_disabled: "§HМаксимальное количество дивизий§! было отключено правилами игры." #NT!
  
 RULE_UNIT_LIMIT_OPTIONS: "Лимиты дивизий" #NT!
 RULE_OPTION_STANDARD: "Применяются ко всем" #NT!
 RULE_UNIT_LIMIT_OPTIONS_STANDARD_DESC: "Были введены ограничения на количество дивизий, которое может строить ИИ, на основе количества его фабрик и уровня экономического закона. Как только ИИ достигнет этого лимита, он просто прекратит создавать новые дивизии. Это ограничение также распространяется и на игрока, однако для него это мягкий лимит, и он получает штраф в зависимости от того, насколько сильно его превышает.\n\n§RУчтите, что эта система предназначена для смягчения неизбежного замедления игры по ходу партии, так как огромное количество дивизий у ботов является главной причиной лагов.§!" #NT!
 RULE_OPTION_AI_ONLY: "Применяются только к ИИ" #NT!
 RULE_UNIT_LIMIT_OPTIONS_AI_ONLY_DESC: "Были введены ограничения на количество дивизий, которое может строить ИИ, на основе количества его фабрик и уровня экономического закона. Как только ИИ достигнет этого лимита, он просто прекратит создавать новые дивизии. При этой настройке нет ограничений на то, сколько дивизий может построить игрок, кроме его способности обеспечивать их людскими ресурсами и снаряжением.\n\n§RУчтите, что это даст игроку значительное преимущество перед странами под управлением ИИ, которые в противном случае обладали бы сопоставимой силой.§!" #NT!
 RULE_OPTION_TURN_OFF: "Отключены" #NT!
 RULE_UNIT_LIMIT_OPTIONS_TURN_OFF_DESC: "Это полностью отключает систему лимита дивизий.\n\n§RРекомендуется делать это только в том случае, если вы либо не против сильного замедления игры по ходу партии, либо у вас ОЧЕНЬ мощный компьютер.§!" #NT!
  
 RULE_GROUP_KAISERREICH_RULES: "Правила Кайзеррейха" #NT!
  
 ### Stability Events ### 
 fx.political.1.t: "Падение стабильности!"
 fx.political.1.d: "Из-за недавней нехватки политической власти стабильность нашей страны ослабла, мы больше не являемся очень стабильным государством. В политический дискурс снова начинают проникать сомнения."
 fx.political.1.a: "Всё хорошее когда-нибудь заканчивается."
  
 fx.political.2.t: "Падение стабильности!"
 fx.political.2.d: "Из-за недавней нехватки политической власти стабильность нашей страны ослабла, теперь мы находимся на грани нестабильности. Мало кто всё еще полностью доволен нашей политикой."
 fx.political.2.a: "Это вызывает беспокойство."
  
 fx.political.3.t: "Падение стабильности!"
 fx.political.3.d: "Из-за недавней нехватки политической власти стабильность нашей страны ослабла, теперь мы повсеместно считаемся нестабильным государством. Страхи за будущее нашей страны становятся всё более распространенными."
 fx.political.3.a: "Это лишь временное положение дел."
  
 fx.political.4.t: "Падение стабильности!"
 fx.political.4.d: "Из-за недавней нехватки политической власти стабильность нашей страны ослабла еще сильнее. Бунты и забастовки стали обычным делом, а наше правительство изо всех сил пытается утвердить свой авторитет."
 fx.political.4.a: "Это не сулит ничего хорошего."
  
 fx.political.5.t: "Падение стабильности!"
 fx.political.5.d: "Из-за недавней нехватки политической власти наша страна погрузилась в катастрофу. Ситуация во всех отношениях катастрофическая. На улицах говорят о революции и переворотах, а люди потеряли веру в наше правительство. Мы изо всех сил пытаемся удержать контроль над страной."
 fx.political.5.a: "Это настоящая катастрофа!"
  
 fx.political.6.t: "Рост стабильности!"
 fx.political.6.d: "Благодаря недавнему росту политической власти мы наконец начинаем возвращать контроль над ситуацией. Однако мы всё еще далеки от безопасности. По крайней мере, крупные бунты и разговоры о революции снова сменились гражданскими забастовками."
 fx.political.6.a: "Худшее позади!"
  
 fx.political.7.t: "Рост стабильности!"
 fx.political.7.d: "Благодаря недавнему росту политической власти конец кризиса уже близок; мы практически стали стабильным государством. Если народ всё еще не доверяет нам полностью, то, по крайней мере, он больше не испытывает склонности к насилию и гневу."
 fx.political.7.a: "Мы почти вернулись к норме."
  
 fx.political.8.t: "Рост стабильности!"
 fx.political.8.d: "Благодаря недавнему росту политической власти мы наконец снова обрели стабильность. Народ вновь доверяет нам управление повседневными делами, и на улицы возвращается спокойствие. Будем надеяться, это больше не повторится."
 fx.political.8.a: "[Root.GetNameDef] сильна."
  
 fx.political.9.t: "Возможный рост стабильности"
 fx.political.9.d: "Благодаря недавнему росту политической власти у нас появилась возможность повысить нашу стабильность. Однако это нужно сделать вручную.\n\nЧтобы подняться до Хорошей стабильности или Очень хорошей стабильности, вам нужно выбрать соответствующий закон на вкладке «Стабильность» в разделе «Законы и правительство» на политическом экране. Стоимость указана под выбранным вариантом.\n\nОбратите внимание: вы рискуете быстро потерять все положительные уровни стабильности, если ваша политическая власть опустится ниже 0. Поэтому убедитесь, что ваша страна действительно останется стабильной в краткосрочной и среднесрочной перспективе, прежде чем делать вложения.\n\nЭто сообщение больше не появится, так что не забудьте."
 fx.political.9.a: "Я понимаю, как повысить стабильность."
  
 ### Popularity Events ### 
 fx.political.11.t: "Очень высокая популярность"
 fx.political.11.d: "Поддержка правящей партии среди населения достигла очень высокого уровня, что влияет на нашу политическую власть. Наша политическая оппозиция практически отсутствует, и мы в состоянии провести любую реформу, какую пожелаем."
 fx.political.11.a: "Отлично!"
  
 fx.political.12.t: "Высокая популярность"
 fx.political.12.d: "Поддержка правящей партии среди населения достигла высокого уровня, что влияет на нашу политическую власть. Наша политическая оппозиция закрепилась, и только самые спорные реформы требуют нашего личного участия."
 fx.political.12.a: "Прекрасно!"
  
 fx.political.13.t: "Средняя популярность"
 fx.political.13.d: "Поддержка правящей партии среди населения достигла среднего уровня, что влияет на нашу политическую власть. Хотя по некоторым реформам нам, возможно, придется консультироваться с оппозицией, мы все еще можем эффективно управлять страной."
 fx.political.13.a: "Хорошо."
  
 fx.political.14.t: "Низкая популярность"
 fx.political.14.d: "Поддержка правящей партии среди населения опустилась до низкого уровня, что влияет на нашу политическую власть. Наша оппозиция достаточно сильна, чтобы формировать против нас коалиции, заставляя нас часто консультироваться с ней и идти на компромиссы."
 fx.political.14.a: "Это плохо."
  
 fx.political.15.t: "Очень низкая популярность"
 fx.political.15.d: "Поддержка правящей партии среди населения опустилась до очень низкого уровня, что влияет на нашу политическую власть. Наша партия практически не имеет влияния, а судьба наших реформ целиком зависит от прихотей оппозиции."
 fx.political.15.a: "Это катастрофа!"
  
 ### Minister Influences Ruling Party Events ### 
 fx.political.16.t: "Министр поддерживает свою идеологию"
 fx.political.16.d: "В нашем нынешнем правительстве есть министр иной идеологии. Он начал продвигать собственную идеологию, что наносит вред популярности нашей партии. Мы должны действовать прямо сейчас, чтобы свести на нет его усилия."
 fx.political.16.a: "Мы ничего не можем сделать."
 fx.political.16.b: "Использовать наше влияние, чтобы свести на нет его усилия."
  
 fx.political.17.t: "Наша идеология усилилась"
 fx.political.17.d: "Благодаря своей популярной политике один из наших лояльных министров сумел укрепить позиции нашей идеологии. Применив дополнительное влияние, мы могли бы использовать это для роста нашей популярности."
 fx.political.17.a: "Отлично."
 fx.political.17.b: "Нам это не нужно."
  
