l_russian:

 fxnews.1.t: "США признают независимость Филиппин" # US Recognises Philippine Independence
 fxnews.1.d: "[This.GetNewspaperHeader]В Вашингтоне, округ Колумбия, в [GetDate] президент США [USA.GetLeader] подписал документ, содержащий официальное признание Соединенными Штатами независимости Филиппин. Свидетелями этого были президент Филиппин [PHI.GetLeader] и несколько высокопоставленных чиновников, таких как вице-президент Серхио Осменья и главный судья Рамон Авансенья.\nВернувшись на Филиппины, толпы людей собрались в парке Лунета; чтобы отпраздновать это знаменательное событие. Также присутствуют делегации из Соединенных Штатов, такие как Верховный комиссар МакНатт, который вскоре станет послом США на Филиппинах, и сенатор Гарри Бартоу Хоуз, соавтор Закона об обрезке зайцев-Хоуза. Толпы в восторге, наблюдая за спуском американского флага и поднятием филиппинского флага, а некоторые сообщают о том, что они прослезились от всепоглощающей радости, увидев свою страну свободной от иностранного подчинения." # [This.GetNewspaperHeader]In Washington, D.C., at [GetDate], US President [USA.GetLeader] has signed the document containing the official recognition of the United States, for an independent Philippines. This has been witnessed by Filipino President [PHI.GetLeader] and a couple of higher officials, such as Vice-President Sergio Osmeña and Chief Justice Ramón Avanceña.\nBack in the Philippines, crowds have gathered in Luneta Park; to celebrate this momentous occasion. Delegations from the United States are also present, such as High Commissioner McNutt, soon to be US Ambassador to the Philippines, and Senator Harry Bartow Hawes, a co-author of the Hare-Hawes-Cutting Act. Crowds are ecstatic in witnessing the lowering of the American flag, and the raising of the Philippine flag, with some reports of tearing-up with overwhelming joy to see their country free from foreign submission.
 fxnews.1.a: "Интересно..." # Interesting...

 fxnews.2.t: "Националисты побеждают на выборах на Филиппинах" # Nacionalistas Wins Philippine Elections
 fxnews.2.d: "[This.GetNewspaperHeader]Коррупционный скандал бывшего министра экономики Акино потряс всю нацию [PHI.GetAdjective] до глубины души, что привело к росту популярности сакдалистов и созданию Либеральной партии, которая быстро завоевала популярность благодаря притоку политических беженцев из националистов.\n\nПо мнению аналитиков, президент Кесон не воспринимался как победитель президентских выборов 1937 года, предполагая резкое изменение политического ландшафта в Филиппины. Но его удача не закончилась, поскольку он получил наибольшее количество голосов на пост президента, что позволило ему переизбраться на высший пост на Филиппинах." # [This.GetNewspaperHeader]The corruption scandal of the former Economic Minister Aquino has shocked the entire [PHI.GetAdjective] nation to its core, resulting an increased popularity of the Sakdalistas and the creation of the Liberal Party that quickly gained popularity due to the influx of political refugees from the Nacionalista.\n\nAccording to analysts, President Quezon were not perceived to win the 1937 Presidential Elections, assuming the drastic change of the political landscape in the Philippines. But his luck haven't run out as he got the most votes for President, allowing himself to be reelected for the highest office in the Philippines.
 fxnews.2.a: "Интересно..." # Interesting...

 fxnews.3.t: "Либералы побеждают на выборах на Филиппинах" # Liberals Wins Philippine Elections
 fxnews.3.d: "[This.GetNewspaperHeader]Коррупционный скандал бывшего министра экономики Акино потряс всю нацию [PHI.GetAdjective] до глубины души, что привело к росту популярности сакдалистов и созданию Либеральной партии, которая быстро завоевала популярность благодаря притоку политических беженцев из националистов.\n\nНовая Либеральная партия, которую возглавляют сенатор Мануэль А. Роксас и сенатор Эльпидио Кирино, набрала достаточно голосов, чтобы стать способен занимать высший пост в стране, что эффективно меняет политический ландшафт на Филиппинах." # [This.GetNewspaperHeader]The corruption scandal of the former Economic Minister Aquino has shocked the entire [PHI.GetAdjective] nation to its core, resulting an increased popularity of the Sakdalistas and the creation of the Liberal Party that quickly gained popularity due to the influx of political refugees from the Nacionalistas.\n\nThe new Liberal Party which is headed by Senator Manuel A. Roxas and Senator Elpidio Quirino have secured enough votes for them to be able to sit on the highest office in the land, effectively shifting the political landscape in the Philippines.
 fxnews.3.a: "Интересно..." # Interesting...

 fxnews.4.t: "Прогрессисты побеждают на выборах на Филиппинах" # Progressistas Wins Philippine Elections
 fxnews.4.d: "[This.GetNewspaperHeader]Коррупционный скандал бывшего министра экономики Акино потряс всю нацию [PHI.GetAdjective] до глубины души, что привело к росту популярности сакдалистов и созданию Либеральной партии, которая быстро завоевала популярность благодаря притоку политических беженцев из националистов.\n\nОднако третий игрок, прогрессисты, также приобрели популярность в течение многих лет, принося плоды усилий, предпринятых ее основателем Эмилио Агинальдо в качестве ярый критик националистов, поскольку они набрали достаточно голосов, чтобы снова сделать Эмилио Агинальдо президентом Второй республики." # [This.GetNewspaperHeader]The corruption scandal of the former Economic Minister Aquino has shocked the entire [PHI.GetAdjective] nation to its core, resulting an increased popularity of the Sakdalistas and the creation of the Liberal Party that quickly gained popularity due to the influx of political refugees from the Nacionalistas.\n\nA third player, however, the Progressistas, have also gained popularity in the years, bearing the fruit for the effort done by its founder, Emilio Aguinaldo as a vocal critic of the Nacionalistas, as they have secured enough votes to be able to once again, make Emilio Aguinaldo, the President of the Second Republic.
 fxnews.4.a: "Интересно..." # Interesting...

 fxnews.5.t: "Сакдалистас побеждает на выборах на Филиппинах" # Sakdalistas Wins Philippine Elections
 fxnews.5.d: "[This.GetNewspaperHeader]Коррупционный скандал бывшего министра экономики Акино потряс всю нацию [PHI.GetAdjective] до глубины души, что привело к росту популярности сакдалистов и созданию Либеральной партии, которая быстро завоевала популярность благодаря притоку политических беженцев из националистов.\n\nВ резком изменении ситуации сакдалисты одержали победу на филиппинских выборах 1937 года; фактически позволяя его основателю Бениньо Рамосу стать следующим президентом Республики Филиппины." # [This.GetNewspaperHeader]The corruption scandal of the former Economic Minister Aquino has shocked the entire [PHI.GetAdjective] nation to its core, resulting an increased popularity of the Sakdalistas and the creation of the Liberal Party that quickly gained popularity due to the influx of political refugees from the Nacionalistas.\n\nIn a drastic change of event, the Sakdalistas, have come out on top on the 1937 Philippine Elections; effectively allowing its founder, Benigno Ramos, to become the next President of the Republic of the Philippines.
 fxnews.5.a: "Интересно..." # Interesting...

 fxnews.6.t: "Северное Борнео оккупировано филиппинскими войсками" # North Borneo Occupied by Filipino Troops
 fxnews.6.d: "[This.GetNewspaperHeader]Сегодня утром Министерство иностранных дел Великобритании опубликовало заявление для прессы, осуждающее провокационные действия правительства [PHI.GetAdjective]; поскольку было подтверждено, что [PHI.GetAdjective] напали на местные гарнизоны в регионе Северного Борнео, воспользовавшись хаосом, вызванным индонезийским восстанием, и обеспечив безопасность этой территории для правления [PHI.GetAdjective].\n\n[PHI.GetName] утверждает, что они являются государством-преемником Султаната Сулу, и, таким образом, претендуют на то, чтобы быть законным владельцем региона. Поскольку [ENG.GetAdjective] ослаблены крахом фондового рынка, а колониальное и революционное правительства Индонезии пытаются перерезать друг другу глотки; Судьба жителей Сабаха находится в руках [PHI.GetAdjective]." # [This.GetNewspaperHeader]This morning, the British Foreign Office, have issued a press statement condemning the provocative actions of the [PHI.GetAdjective] Government; as [PHI.GetAdjective] were confirmed have assaulted local garrisons in the North Borneo region, capitalizing the chaos the Indonesian uprising have caused, securing the area for [PHI.GetAdjective] rule.\n\nThe [PHI.GetName] claims they are a successor state to the Sultanate of Sulu, and thus claims to be the rightful owner of the region. As the [ENG.GetAdjective] are weaked by the Stock Market Crash, and both the Colonial and Revolutionary Governments in Indonesia are trying to slice each other's throats; the fate of the people in Sabah are in [PHI.GetAdjective] hands.
 fxnews.6.a: "Кто это предвидел..." # Who saw that coming...
 fxnews.6.b: "Когда-нибудь мы вернем это назад..." # We'll take that back someday...

 fxnews.7.t: "Филиппинский вход в [FRA.GetFactionName]" # Filipino Entry to the [FRA.GetFactionName]
 fxnews.7.d: "[This.GetNewspaperHeader]Высокопоставленные лица Альянса Антанты и правительства Филиппин встретились в [GetMeetingLocation], чтобы обсудить вступление Филиппин в альянс. Обе стороны тепло приветствовали друг друга, прежде чем обсудить повестку дня встречи.\n\nНесколько часов спустя [PHI.GetAdjective] и представители Антанты согласовали условия вступления и приступили к подписанию документов об официальном признании [PHI.GetName] членом альянса Антанты." # [This.GetNewspaperHeader]Combined dignitaries from the Entente alliance and the Philippine Government have met in [GetMeetingLocation] to discuss the entry of the Philippines in the alliance. Both sides greeted each other with a warm welcome before discussing the agendas of the meeting.\n\nA few hours later, the [PHI.GetAdjective] and the Entente representatives have agreed on the terms of the entry and have proceed to sign the papers to officially recognize the [PHI.GetName] as a member of the Entente alliance.
 fxnews.7.a: "Посмотрим, как это пойдет" # Let's see how this goes

 fxnews.8.t: "Южная агитация" # Southern Agitation
 fxnews.8.d: "[This.GetNewspaperHeader]Сегодня утром в Хьюстоне, штат Техас, произошел взрыв, в результате чего несколько человек погибли и неисчислимое количество раненых. Среди главных подозреваемых в инциденте - мексиканские националисты, хотя местная полиция еще не исключила наличие внутриполитической группировки. На месте происшествия находится то, что офицеры идентифицировали как флаг мексиканского штата, хотя необходимо будет провести дополнительные судебно-медицинские исследования. Предполагается, что целью атаки стал железнодорожный и транспортный узел в городе, но какой именно, пока неизвестно. Однако известно, что политический климат в стране резко ухудшился и дальше он, несомненно, будет только ухудшаться." # [This.GetNewspaperHeader]An explosion rocketed Houston, Texas this morning, causing several deaths and a currently untold number of injuries. Chief suspects of the incident include Mexican nationalists, though local police have not yet ruled out a domestic political group either. Included at the scene is what officers have been identifying as the flag of the Mexican State, though additional forensics research will have to be conducted. The target of the attack is believed to be a rail and trasportation hub in the city, but exactly which is not yet known, either. What is known, however, is that the political climate in the country has taken a drastic turn for the worse, and it will certianly only go downhill from here.
 fxnews.8.a: "Мы защитим свои границы!" # We will defend our borders!
 fxnews.8.b: "Смогут ли США и Мексика когда-нибудь уладить свои разногласия?" # Will the USA and Mexico ever settle their differences?

 fxnews.9.t: "Распад Соединенных Штатов" # Collapse of the United States
 fxnews.9.d: "[This.GetNewspaperHeader]Соединенные Штаты Америки, страна огромных возможностей и перспектив, в последнее время охвачены беспорядками и беспорядками; из-за передачи различных спорных территорий Мексике.\n\nЧто еще хуже, разные недовольные губернаторы потеряли веру в федеральное правительство и объединились, чтобы создать свое собственное государство; бросая вызов тем, кто находится в Вашингтоне. Однако вскоре соберётся Конгресс [USA.GetAdjective], который примет решение о том, что нация предпримет для преодоления этой катастрофы." # [This.GetNewspaperHeader]The United States of America, a nation of vast opportunity and promise, has been recently plagued by turmoil and riots; due to the ceding of different contested territories to Mexico.\n\nMaking matters worse, different discontented governors have lost faith on the Federal Government and have unified to create their own state; challenging those who are in Washington. The [USA.GetAdjective] Congress will convening soon however, deciding on what the nation will take to overcome this disaster.
 fxnews.9.a: "Касательно..." # Concerning...

 fxnews.10.t: "Конец американской демократии" # End of American Democracy
 fxnews.10.d: "[This.GetNewspaperHeader]Соединенные Штаты Америки, оплот демократии в новом мире, по иронии судьбы оказались в условиях военной диктатуры. Вызванный недавним отделением различных регионов, провозгласивших независимость от Вашингтона, Конгресс Соединенных Штатов не видел иного выбора, кроме как позволить вооруженным силам США взять под контроль государственный аппарат в надежде положить конец кошмару, который в настоящее время преследует политиков-федералистов.\n\nКогда новая администрация находится у власти, можно увидеть только возвращение ею своих старых территорий посредством войны. Однако многие надеются, что этот кошмар закончится и жизнь в США вернется в нормальное русло." # [This.GetNewspaperHeader]The United States of America, a bastion of democracy in the new world, has ironically fallen into a military dictatorship. Caused by the recent secessions of various regions proclaiming independence from Washington, the Congress of the United States saw no choice but to allow the US Military to take control of the apparatus of state in hopes of ending the nightmare that currently haunts the Federalist politicians.\n\nWith the new administration in power, one can only saw its reclaiming of its old territories by means of war. However, many hopes that this nightmare will be over and the life in the United States will go back to normal.
 fxnews.10.a: "Касательно..." # Concerning...

 fxnews.11.t: "Хьюи Лонг избран президентом США" # Huey Long Elected as US President
 fxnews.11.d: "[This.GetNewspaperHeader]Хьюи Пирс Лонг, губернатор Луизианы и популистская заноза в американской политике, официально объявлен первым президентом Соединенных Штатов Америки. Первый президент-демократ за более чем три десятилетия, он вступает в должность, обещая богатство, наследство и экономические реформы. Лонг взлетел в Белый дом сразу после одной из самых напряженных кампаний в американской истории. Говоря о напряженности в отношениях между Мексикой и Соединенными Штатами, Лонг заявил, что он «справляется с этой задачей; не тот, кто наносит удар первым», хотя многие политические обозреватели выразили недоверие такому заявлению. Независимо от мнения некоторых, политика Лонга явно находит отклик у многих, и трудно точно сказать, куда Соединенные Штаты пойдут дальше..." # [This.GetNewspaperHeader]Huey Pierce Long, the governor of Louisiana and populist thorn in the side of American politics, has officially been declared the inaugural President of the United States of America. The first Democratic President in more than three decades, he comes into office promising wealth, inheritance, and economic reforms, Long soared into the White House on the heels of one of the most tense campaigns in American history. Speaking on tension between Mexico and the United States, Long declared that he was 'up to the task; not a man who strikes first', though many political commentators have expressed their disbelief in such a statement. Regardless of the opinion of some, Long's policies clearly resonate with the many, and it's hard to say exactly where the United States will go from here...
 fxnews.11.a: "Интересно..." # Interesting...

 fxnews.12.t: "Квентин Рузвельт избран президентом США" # Quentin Roosevelt Elected as US President
 fxnews.12.d: "[This.GetNewspaperHeader]Квентин Рузвельт, губернатор штата Нью-Йорк и сын американского героя Теодора Рузвельта, официально объявлен первым президентом Соединенных Штатов Америки. Обменялись разногласиями и резкими словами относительно формы его политики, главным образом о том, что она очень точно следовала политике его отца. Расширение реформы избирательного права — его первая цель; По поводу расовой сегрегации в США он отметил, что «он сделает для чернокожего человека то, что его отец сделал для другого пола». Что касается отношений с Мексикой, Рузвельт постоянно подтверждал свою веру в упреждающую политику, направленную на предотвращение мексиканского восстания в Соединенных Штатах. Его президентство, кажется, уже наполнено недовольством, но, тем не менее, оно остается очень популярным." # [This.GetNewspaperHeader]Quentin Roosevelt, the governor of New York state and son of American hero Theodore Roosevelt, has officially been declared the inaugural President of the United States America. Controversy and harsh words were exchanged concerning the form of his policies- chiefly that they followed his father's very closely. Expanding suffrage reform is his first goal; on racial segregation in the US he commented that 'he would do for the black man what his father had done for the other sex'. On relations with Mexico, Roosevelt has constantly reiterated his belief in a preemptive policy to prevent a Mexican insurrection into the United States. His Presidency seems to already laden with discontent, but regardless it remains very popular.
 fxnews.12.a: "Интересно..." # Interesting...

 fxnews.13.t: "Альф Лэндон избран президентом США" # Alf Landon Elected as US President
 fxnews.13.d: "[This.GetNewspaperHeader]Альфред «Альф» Лэндон, губернатор Канзаса и популярный экономический деятель, официально объявлен первым президентом Соединенных Штатов Америки. Придя к власти с обширным кабинетом экономических реформаторов, администраторов и титанов промышленности, Лэндон, похоже, полон решимости переломить Великую депрессию, продвигая малый бизнес, расширяя план, который он реализовал в Канзасе, который позволил штату достичь третьего по величине уровня безработицы в стране. Продвигая консервативный тип либерализма, он пообещал, что бумажник Соединённых Штатов «не будет полностью» запечатан. Будучи оптимистичным президентом, только время покажет, ударит ли его политика в самое сердце Депрессии." # [This.GetNewspaperHeader]Alfred 'Alf' Landon, the governor of Kansas and popular economic figurehead, has officially been declared the inaugural President of the United States of America. Arriving in office with an extensive cabinet of economic reformers, administrotors, and titans of industry, Landon appears determined to turn around the Great Depression by promoting small businesses, scaling up a plan he implemented in Kansas that saw the state achieve the third lowest unemployment in the country. While he has promoted a conservative type of liberalism, he has promised that the pocketbook of the United States will 'not be entirely' sealed. An optimistic President, only time will tell if his policies will strike the heart of the Depression.
 fxnews.13.a: "Интересно..." # Interesting...

 fxnews.14.t: "Джон Нэнс Гарнер избран президентом США" # John Nance Garner Elected as US President
 fxnews.14.d: "[This.GetNewspaperHeader]Джон Нэнс Гарнер, спикер Палаты представителей и представитель Палаты представителей Техаса, официально объявлен первым президентом Соединенных Штатов Америки. Твердо веря в упреждающие действия, Гарнер обнаружил, что в последнее десятилетие он доминирует в консервативной политике. Хотя он занимает положительную позицию в консервативных дебатах относительно политики Теодора Рузвельта, его позиция в защиту обороны привлекла многих других консерваторов, которые хотели, чтобы демократ занял самое высокое место в стране. Уже обещая радикальную военную реформу, многие мексиканские дипломаты начинают возмущаться в своей стране США за то, что они заняли угрожающую позицию. Когда его попросили прокомментировать свои действия, Гарнер просто заявил, что «наши намерения будут такими же вредными, как и их»." # [This.GetNewspaperHeader]John Nance Garner, Speaker of the House and Texan House Representative, has officially been declared the inaugural President of the United States of America. A firm believer in pre-emptive action, Garner found his place dominating conservative politics in the past decade. Although he finds himself on the affirmative side of the conservative debate concerning Theodore Roosevelt's policies, his pro-defense stance brought in many other conservatives who were eager to see a Democrat achieve the highest seat in the country. Already promising sweeping military reform, many Mexican diplomats are beginning to turn outrage in their country toward the US for assuming a threatening posture. When asked to comment on his actions, Garner simply stated that 'our intentions will only ever be as harmful as theirs'.
 fxnews.14.a: "Интересно..." # Interesting...

 fxnews.15.t: "Восстановление демократии в США" # Restoration of Democracy in the United States
 fxnews.15.d: "[This.GetNewspaperHeader]США, известные своей стабильной демократией; находился под авторитарным правлением военных из-за распада союза.\n\nОднако по мере того, как федеральное правительство консолидировало контроль над своими старыми территориями; военная администрация назначила новые выборы; избрав [USA.GetLeader] своим новым президентом. Возрождение Соединенных Штатов стало для многих неожиданностью, поскольку старый порядок столкнулся на своем пути с многочисленными проблемами; и только время покажет, продолжит ли он противостоять угрозам своему выживанию." # [This.GetNewspaperHeader]The United States, known for its stable democracy; has been under authoritarian rule of the military due to the collapse of the union.\n\nHowever, as the Federal Government consolidated control over its old territories; the military administration have called in new elections; electing [USA.GetLeader] as its new President. The rebirth of the United States has been a suprise to many as the old order have faced numerous challenges along the way; and only time will tell if it continues to stand against threats to its survival.
 fxnews.15.a: "Интересно..." # Interesting...

 fxnews.16.t: "Убийство Абдулмеджида II." # The Assassination of Abdülmecid II
 fxnews.16.d: "[This.GetNewspaperHeader]В этот день, 13 января 1936 года, султан Абдул-Меджид II был внезапно застрелен неизвестным преступником! Местная жандармерия не смогла вовремя отреагировать и спасти султана, убив нападавшего только после смертельного выстрела, в результате которого султан погиб. Несмотря на непопулярность Османской династии после Великой войны, султан Абдулмеджид II и остальные члены Османской королевской семьи пользовались поддержкой держав Антанты и сохраняли империю относительно стабильной. После смерти султана в Османской империи теперь царит неопределенность." # [This.GetNewspaperHeader]On this day, the 13th of January, 1936, Sultan Abdülmecid II was very suddenly shot and killed by an unknown assailant! The local Gendarmerie were unable to react in time to save the Sultan, killing the assailant only after the fatal shot that left the Sultan dead. Despite the unpopularity of the Ottoman dynasty after the Great War, Sultan Abdülmecid II and the rest of the Ottoman Royal Family were backed by the Entente powers and kept the empire relatively stable. With the death of the Sultan, uncertainty now rules within the Ottoman Empire.
 fxnews.16.a: "Как ужасно!" # How terrifying!

 fxnews.17.t: "Восстание в Новой Американской Республике" # Revolt in the New American Republic
 fxnews.17.d: "[This.GetNewspaperHeader]Растущее притеснение администрацией Форда меньшинств и рабочего класса заставило последний захватить контроль над городом Чикаго, объявив открытое восстание против жителей Детриота. Поступали сообщения о том, что бизнесмены и лоялисты пытались бежать из города, но некоторые из тех, кто не смог покинуть город, были заперты новым «Революционным правительством». Только время покажет, чем закончится эта катастрофа." # [This.GetNewspaperHeader]The growing oppression of the Ford Administration on the minorities and the working class have made the latter, seize control of the city of Chicago, declaring an open-armed rebellion against those in Detriot. There were reports of businessmen and loyalists trying to escape the city, but some that unable to leave were locked up by the new \"Revolutionary Government\". Only time will tell on what will be the result of this disaster.
 fxnews.17.a: "Америка находится в хаосе с тех пор, как она рухнула." # America is in chaos since it collapsed.

 fxnews.18.t: "Социалисты победители!" # Socialists Victorious!
 fxnews.18.d: "[This.GetNewspaperHeader]После объявления открытого восстания против фордистского правительства; войска Социалистического восстания вошли в последние оплоты фордистов, окончательно положив конец вооруженному конфликту.\n\nЛидеры старого фордистского правительства еще не появились на свет, но многие предполагают, что они сбежали в соседние страны, такие как Канада и Новая Англия. По мере того, как в Ржавом поясе устанавливается новый порядок, многие либо приветствуют эти изменения, либо ожидают их." # [This.GetNewspaperHeader]Following the declaration of the open-armed rebellion against the Fordist Government; troops of the Socialist Revolt have marched into the last holdouts of the Fordists, finally giving the end to the armed conflict.\n\nLeaders of the old Fordist Government have not yet surfaced, but many are speculating that they have escaped to neighboring countries such as Canada and New England. As the new order rises in the Rust Belt, many are either cheering or looming on the change.
 fxnews.18.a: "Не предвидел такого приближения..." # Didn't see that one coming...

 fxnews.19.t: "Объединение Нидерландов и Бельгии" # Unification of Netherlands and Belgium
 fxnews.19.d: "[This.GetNewspaperHeader]Лидер голландского государства [HOL.GetLeader], близкий союзник [GER.GetName], провозгласил объединение Нидерландов и Бельгии; создание Соединенного Королевства Нидерландов.\n\nОб этом провозглашении было объявлено сегодня; после того, как все последующие приготовления к интеграции бывших бельгийских земель были полностью аннексированы Голландским государством, что фактически отменяет действие Лондонского договора 1839 года. Будет ли это окончательным завоеванием [HOL.GetAdjective] в расширении; может ответить только сам принц." # [This.GetNewspaperHeader]The leader of the Dutch State, [HOL.GetLeader], a close ally of [GER.GetName] have proclaimed the unification of the Netherlands and Belgium; creating the United Kingdom of the Netherlands.\n\nThe proclaimation have been announced today; after all post-preparations for the integration of the former Belgians lands have been completely annexed by the Dutch State, effectively reverting the effects of the Treaty of London in 1839. Whether this will be the final conquest of the [HOL.GetAdjective] in expansion; can only be answered by the Prince himself.
 fxnews.19.a: "Очередная партия карт осталась устаревшей" # Another batch of maps remained obsolete
 fxnews.19.b: "Этот ублюдок наконец сделал это." # That bastard have finally done it.

 fxnews.20.t: "Голландские изгнанники на стороне Антанты" # Dutch Exiles sides with the Entente
 fxnews.20.d: "[This.GetNewspaperHeader]Голландцы пытались сохранить свой нейтралитет во время Великой войны, пока наступление Антанты не заперло немецкие войска в Бельгии; когда Берлин оказывает давление на правительство Нидерландов, чтобы оно позволило немецким войскам бежать через Нидерланды; державы Антанты наказали Голландское королевство за присоединение провинций Зевс-Флаандерен и Лимбург к Бельгии.\n\nЭто привело к резкому росту националистических настроений голландского народа; позднее позволив перевороту во главе с принцем Бернхардом и другими радикальными националистическими армейскими офицерами захватить контроль и заставить монархию покинуть Суринам. Теперь изгнанное голландское правительство присоединилось к Антанте; обещая сотрудничать с различными державами Антанты, если родная страна будет возвращена." # [This.GetNewspaperHeader]The Dutch have attempted to main their neutrality during the Great War, until an Entente offensive have trapped German troops in Belgium; with Berlin pressuring the Dutch Government to allow German troops to flee through the Netherlands; the Entente powers punished the Dutch Kingdom in incorporating the provinces of Zeuws-Vlaanderen and Limburg into Belgium.\n\nThis has allowed the nationalist sentiment of the Dutch people skyrocketed; allowing later a coup headed by Prince Bernhard and other radical nationalist army officers to seize control and force the monarchy into exile in Suriname. Now the exiled Dutch Government, have aligned itself with the Entente; promising to cooperate with various Entente powers if the home country has been reclaimed.
 fxnews.20.a: "Ждать? Они еще живы?" # Wait? They're still alive?

 fxnews.21.t: "Германия охвачена гражданской войной" # Germany Engulfed in Civil War
 fxnews.21.d.a: "[This.GetNewspaperHeader]После прихода к власти Дресслера казалось, что Германия снова станет выдающейся европейской державой. Оправляясь от Великой депрессии быстрее, чем большинство других стран, Германия перевооружалась с головокружительной скоростью, причем многие наблюдатели даже предсказывали, что Германия свергнет франко-британский мировой порядок, который ей не удалось преодолеть в Великой войне.\n\nОднако недавние события подтвердили эти прогнозы. Правящий Блок Валкистов, долгое время борющийся с фракционной борьбой, распался после того, как выяснилось, что покушение на жизнь Дресслера было инициировано консерваторами блока. Осудив эту попытку как измену с обеих сторон, Дресслер и его враги мобилизовали своих сторонников, поскольку Германия погружается в гражданскую войну." # [This.GetNewspaperHeader]Following Dressler’s rise to power, it appeared that Germany would once more become the preeminent European power. Recovering from the Great Depression faster than most, Germany rearmed at a dizzying rate, with many observers even predicting that Germany would overthrow the Franco-British world order that she had failed to overcome in the Great War.\n\nThese predictions however have been proven invalid by recent events. Long struggling with factional strife, the ruling Valkist Bloc has ripped itself apart, after an attempt on Dressler’s life was discovered to have been initiated by the conservatives of the bloc. Denouncing this attempt as treason by both sides, Dressler, and his enemies have mobilized their supporters as Germany is sent spiralling into civil war.
 fxnews.21.d.b: "[This.GetNewspaperHeader]После прихода к власти Дресслера казалось, что Германия снова станет выдающейся европейской державой. Оправляясь от Великой депрессии быстрее, чем большинство других стран, Германия перевооружалась с головокружительной скоростью, причем многие наблюдатели даже предсказывали, что Германия свергнет франко-британский мировой порядок, который ей не удалось преодолеть в Великой войне.\n\nОднако недавние события подтвердили эти прогнозы. Смерть Адама Дресслера, долгое время боровшегося с фракционной борьбой, только усилила напряженность внутри Блока Валкистов. Поскольку все фракции внутри Блока не смогли обеспечить себе власть, со всей Германии поступали сообщения о перестрелках, что сигнализировало о начале гражданской войны." # [This.GetNewspaperHeader]Following Dressler’s rise to power, it appeared that Germany would once more become the preeminent European power. Recovering from the Great Depression faster than most, Germany rearmed at a dizzying rate, with many observers even predicting that Germany would overthrow the Franco-British world order that she had failed to overcome in the Great War.\n\nThese predictions however have been proven invalid by recent events. Long struggling with factional strife, the death of Adam Dressler has only inflammed tensions within the Valkist Bloc. With all of the factions within the Bloc failing to secure power, firefights have been reported from all over Germany, signaling the beginning of a civil war.
 fxnews.21.d.c: "[This.GetNewspaperHeader]После прихода к власти Дресслера казалось, что Германия снова станет выдающейся европейской державой. Оправляясь от Великой депрессии быстрее, чем большинство других стран, Германия перевооружалась с головокружительной скоростью, причем многие наблюдатели даже предсказывали, что Германия свергнет франко-британский мировой порядок, который ей не удалось преодолеть в Великой войне.\n\nОднако недавние события подтвердили эти прогнозы. Правящий Блок Валкистов, долгое время борющийся с фракционной борьбой, распался после покушения на жизнь Дресслера, которое, как выяснилось, было инициировано консерваторами блока. Сплотив сторонников, пришли сообщения о боях между немецкими солдатами, что сигнализирует о начале гражданской войны." # [This.GetNewspaperHeader]Following Dressler’s rise to power, it appeared that Germany would once more become the preeminent European power. Recovering from the Great Depression faster than most, Germany rearmed at a dizzying rate, with many observers even predicting that Germany would overthrow the Franco-British world order that she had failed to overcome in the Great War.\n\nThese predictions however have been proven invalid by recent events. Long struggling with factional strife, the ruling Valkist Bloc has ripped itself apart, following an attempt on Dressler’s life that was discovered to have been initiated by the conservatives of the bloc. Rallying their supporters, reports of fighting between German soldiers have come in, signaling the beginning of a civil war.
 fxnews.21.d.d: "[This.GetNewspaperHeader]После прихода к власти Дресслера казалось, что Германия снова станет выдающейся европейской державой. Оправляясь от Великой депрессии быстрее, чем большинство других стран, Германия перевооружалась с головокружительной скоростью, причем многие наблюдатели даже предсказывали, что Германия свергнет франко-британский мировой порядок, который ей не удалось преодолеть в Великой войне.\n\nОднако недавние события подтвердили эти прогнозы. Правящий Блок Валкистов, долгое время борющийся с фракционной борьбой, раскололся на части после государственного переворота в Берлине, от которого Дресслер успешно избежал. Обосновавшись в Мюнхене, Дресслер, как и его враги, призвали своих верных сторонников бороться за судьбу Германии, когда она снова скатывается к гражданскому конфликту." # [This.GetNewspaperHeader]Following Dressler’s rise to power, it appeared that Germany would once more become the preeminent European power. Recovering from the Great Depression faster than most, Germany rearmed at a dizzying rate, with many observers even predicting that Germany would overthrow the Franco-British world order that she had failed to overcome in the Great War.\n\nThese predictions however have been proven invalid by recent events. Long struggling with factional strife, the ruling Valkist Bloc has ripped itself apart, following a coup d'état in Berlin which Dressler successfully escaped. Basing himself in Munich, Dressler, as well as his enemies, have called on their loyal supporters to struggle for Germany's fate as she descends into civil conflict once again.
 fxnews.21.d.e: "[This.GetNewspaperHeader]После прихода к власти Дресслера казалось, что Германия снова станет выдающейся европейской державой. Оправляясь от Великой депрессии быстрее, чем большинство других стран, Германия перевооружалась с головокружительной скоростью, причем многие наблюдатели даже предсказывали, что Германия свергнет франко-британский мировой порядок, который ей не удалось преодолеть в Великой войне.\n\nОднако недавние события подтвердили эти прогнозы. Правящий Блок Валкистов, долгое время борющийся с фракционной борьбой, распался после многих лет интриг и интриг между фракциями. Поскольку напряженность накаляется, соперничающие фракции Блока сплотили ряды друг против друга, провозгласив себя единственным законным правительством, и нет никаких сомнений в том, что Германия вступила в гражданскую войну." # [This.GetNewspaperHeader]Following Dressler’s rise to power, it appeared that Germany would once more become the preeminent European power. Recovering from the Great Depression faster than most, Germany rearmed at a dizzying rate, with many observers even predicting that Germany would overthrow the Franco-British world order that she had failed to overcome in the Great War.\n\nThese predictions however have been proven invalid by recent events. Long struggling with factional strife, the ruling Valkist Bloc has ripped itself apart after years of intrigue and scheming between the factions. With tensions boiling over, the rival factions of the Bloc have closed ranks against one another, declaring themselves as the only legitimate government, there is little doubt that Germany has entered civil war.
 GER_german_civil_war_resp_GER: "Германия, проснись – Победа будет за нами!" # Deutschland, erwache - Sieg Wird Unser Sein!
 GER_german_civil_war_resp_TST: "Германия, проснись – Иуда погибнет!" # Deutschland, erwache - Juda verrecke!
 GER_german_civil_war_resp_YGO: "Германия, проснись! Защищай Германию верно!" # Deutschland, erwache - Verteidige Treu Deutschland!
 GER_german_civil_war_resp_FRA: "Боше разрываются на части..." # The Boche rip themselves apart...
 GER_german_civil_war_resp_anglos: "Германия истекает кровью - и Париж восстает..." # Germany bleeds - and Paris rises...
 GER_german_civil_war_resp_soc: "Настало время восстания немецких рабочих!" # Now is the time for the German workers to rise!
 GER_german_civil_war_resp_dem: "Доказательство того, что тирания всегда терпит неудачу." # Proof that tyranny always fails.
 GER_german_civil_war_resp_aut: "Германия истекает кровью." # Germany bleeds.


 fxnews.22.t: "НЛП побеждает на выборах в Румынии" # PNL Wins Romanian Elections
 fxnews.22.d: "[This.GetNewspaperHeader]Национально-либеральная партия победила на выборах. Ни один румын не был удивлен этой новостью, когда НЛП пришла к власти. С момента своего основания в 1875 году партия была последовательным лидером умеренной румынской политики. Национал-либеральная партия представляет правоцентристов и истеблишмент, поэтому неудивительно, что они заявили о своей победе на недавних выборах." # [This.GetNewspaperHeader]The National Liberal Party has won the elections. Not a single Romanian was surprised by the news when the PNL assumed power. Since their founding in 1875, the party has been a consistent frontrunner of moderate Romanian politics. The National Liberal Party represents the center-right and the establishment, therefore, it was not surprising that they claimed victory in the recent elections.
 fxnews.22.a: "Приветствую ПНЛ!" # Cheers to the PNL!

 fxnews.23.t: "ПСДР побеждает на выборах в Румынии" # PSDR Wins Romanian Elections
 fxnews.23.d: "[This.GetNewspaperHeader]Румынская социал-демократическая партия победила на выборах. Почти все румыны были удивлены тем, что этот аутсайдер одержал победу на недавних выборах. С момента своего основания в 1927 году ПСДР предлагала альтернативу коммунистам истеблишмента, поддерживающим Третий Интернационал и Советскую Россию. Впервые за десятилетия Национал-либеральная партия потерпела унизительное поражение." # [This.GetNewspaperHeader]The Romanian Social Democratic Party has won the elections. Almost all Romanians were surprised by this underdog securing victory in the recent elections. Since their founding in 1927, the PSDR has offered an alternative to the establishment Communists who support the Third International and Soviet Russia. For the first time in decades, the National Liberal Party has suffered a humiliating defeat.
 fxnews.23.a: "Приветствую ПСДР!" # Cheers to the PSDR!

 fxnews.24.t: "PNT побеждает на выборах в Румынии" # PNT Wins Romanian Elections
 fxnews.24.d: "[This.GetNewspaperHeader]Никто не удивился, что Румынская Крестьянская партия одержала победу на всеобщих выборах в Румынии. Поскольку выборы наконец закончились; новая PNT теперь сформирует правительство, которое будет руководить Румынией в эту новую эпоху; готовя его к предстоящим вызовам." # [This.GetNewspaperHeader]As to no one suprise, the Romanian Peasants Party have secured victory on the Romanian General Elections. As the elections are finally over; the new PNT will now form the government to guide Romania in this new age; preparing it to the challenges that will come.
 fxnews.24.a: "Приветствую ПНТ!" # Cheers to the PNT!

 fxnews.25.t: "PNC побеждает на выборах в Румынии" # PNC Wins Romanian Elections
 fxnews.25.d: "[This.GetNewspaperHeader]Национальная христианская партия победила на выборах. Подобно фениксу из пепла, духовный преемник Железной гвардии вознесся, чтобы возглавить Румынию. На улицах Бухареста разносится множество слухов, касающихся будущих решений Народной национальной партии. Как они будут реализовывать политику «Железной гвардии» теперь, когда она представляет собой формальное воплощение национального популизма в Румынии? Народ Румынии скоро узнает об этом." # [This.GetNewspaperHeader]The National Christian Party has won the elections. Like a phoenix from the ashes, the Iron Guard’s spiritual successor has ascended to lead Romania. Many whispers fill the streets of Bucharest, all concerning the PNC’s future decisions. How will they implement the Iron Guard’s policies now that they represent the formal embodiment of National Populism in Romania? The people of Romania shall find out soon enough.
 fxnews.25.a: "Приветствую ПНК!" # Cheers to the PNC!

 fxnews.26.t: "Гражданская война в Румынии" # Civil War in Romania
 fxnews.26.d: "[This.GetNewspaperHeader]Начались гражданские беспорядки в нашей стране. Элементы военных и ультранационалистических военизированных группировок, связанных с «Железной гвардией», поднялись в попытке свергнуть правительство. Кажется, конфликт неизбежен. Румынские вооруженные силы готовы усмирить этих подстрекателей." # [This.GetNewspaperHeader]The stirring civil unrest in our nation has finally materialized. Elements of the military and ultra-nationalist paramilitary groups in association with the Iron Guard have risen up in an attempt to overthrow the government. It appears conflict is unavoidable. The Romanian Armed Forces are standing by, ready to pacify these rabble rousers.
 fxnews.26.a: "Раздавите этих повстанцев!" # Crush these rebels!

 fxnews.27.t: "Гражданская война в Румынии" # Civil War in Romania
 fxnews.27.d: "[This.GetNewspaperHeader]Начались гражданские беспорядки в нашей стране. Элементы военных и лоялистских военизированных группировок, связанных с королевским истеблишментом, поднялись в попытке свергнуть правительство. Кажется, конфликт неизбежен. Наша Железная Гвардия готова усмирить этих подстрекателей." # [This.GetNewspaperHeader]The stirring civil unrest in our nation has finally materialized. Elements of the military and loyalist paramilitary groups in association with the royal establishment have risen up in an attempt to overthrow the government. It appears conflict is unavoidable. Our Iron Guard is standing by, ready to pacify these rabble rousers.
 fxnews.27.a: "Раздавите этих повстанцев!" # Crush these rebels!

 fxnews.28.t: "Гражданская война в Румынии" # Civil War in Romania
 fxnews.28.d: "[This.GetNewspaperHeader]После бесконечной борьбы за власть и нестабильности, худшее, наконец, произошло сегодня, когда правительство наконец потеряло контроль над конкурирующими фракциями, которые теперь официально больше не признают приказы из Бухареста. Лояльность армии и полиции разделена, и насилие между многочисленными ополченцами достигло нового уровня: бесчисленные перестрелки происходят уже несколько недель. Похоже, что открытая конфронтация между конкурирующими фракциями уже практически неизбежна. Боже, храни Румынию." # [This.GetNewspaperHeader]After unending power struggles and instability, the worst finally happened today with the government finally loosing control over the competing factions who now officially do not recognize orders from Bucharest anymore. The loyalty of the army and police forces are divided and the violence between the many militias came to a new height with countless shootouts already happening for weeks now. It seems that a open confrontation between the competing factions is all but inevitable by now. God save Romania.
 fxnews.28.a: "Раздавите этих повстанцев!" # Crush these rebels!

 fxnews.29.t: "Михаил I коронован королем Румынии" # Michael I Crowned King of Romania
 fxnews.29.d: "[This.GetNewspaperHeader]Сегодня Михаил I был коронован королем Румынии после долгого и беспокойного регентства при Николае I. Многие надеются, что с коронацией нового короля страна вернется к более стабильной политической ситуации после долгого периода неопределенности. Однако некоторые инсайдеры уже предупреждают о значительной оппозиции правлению молодого короля со стороны высших эшелонов общества, в то время как другие ставят под сомнение способность такого молодого человека возглавить нацию в эти трудные времена. Мы можем только надеяться, что король Михаил I сможет принять на себя мантию лидера, данную ему на благо Румынии и ее народа." # [This.GetNewspaperHeader]Today Michael I was crowned King of Romania after a long and troubled regency under Nicholas I. Many hope that with the coronation of the new king the country will return to a more stable political situation after a long time of uncertainty. However some Insiders are already warning about a sizable opposition to the rule of the young king from within the higher echelons of society while others question the ability of such a young man to lead a nation in these troublesome times. We can only hope that King Michael I will be able to take up the mantle of leadership that was given to him for the good of Romania and its people.
 fxnews.29.a: "Да здравствует Михаил I из Румынии!" # Long live Michael I of Romania!

 fxnews.30.t: "Николай I стал королем Румынии." # Nicholas I Crowned King of Romania
 fxnews.30.d: "[This.GetNewspaperHeader]После трагического и подлого убийства принца (или короля?) Михаила, бывшего регента и брата Михаила, принц Николай сегодня был коронован королем Румынии. Возвращение принца, сбежавшего в добровольное изгнание, было встречено неоднозначной реакцией многих людей, а очень немногие приглашенные гости описали коронацию как поспешное мероприятие с жесткими мерами безопасности. Даже несмотря на то, что его правление начинается очень беспокойно, нам следует молиться о долгом и стабильном правлении." # [This.GetNewspaperHeader]After the tragic and vile assassination of Prince (or King?) Michael, The former regent and brother of Michael, Prince Nicholas was today crowned King of Romania. The return of the Prince who fled into self imposed exile was met with mixed reactions by many people and the coronation was described as a rushed affair with huge security measures by the very few invited guests. Even tho his reign starts very troubled, we should pray for a long and stable reign.
 fxnews.30.a: "Да здравствует Николай I Румынский!" # Long live Nicholas I of Romania!

 fxnews.31.t: "Железная гвардия приходит к власти" # Iron Guard Rises to Power
 fxnews.31.d: "[This.GetNewspaperHeader]Сегодня нацию обнародовали шокирующие новости. После нескольких дней беспорядков и неопределенности националистической «Железной гвардии» в результате быстрого переворота с помощью своих военизированных и предательских инсайдеров внутри старой администрации удалось свергнуть прежнее правительство и установить диктатуру по образцу групповой «Идеологии». Последние чистки внутри администрации подходят к концу, а «Железная гвардия» завершает захват власти. Оппозиция в основном скрылась, и хотя многие опасаются нового режима, есть и те, кто приветствует твердое и стабильное правительство, которое обещает принести закон и порядок в страну. Время покажет, какое будущее ждет Румынию под властью ее новых хозяев." # [This.GetNewspaperHeader]Today shocking news were reveled to the Nation. After days of unrest and uncertainty the nationalist Iron Guard in a swift Coup, with the help of its paramilitary and traitorous insiders within the old administration managed to depose the former government and install a dictatorship in the mold of the groups Ideology. There last purges within the administration are coming to an end while the Iron Guard finishes the takeover. The opposition largely went into hiding and while many fear the new regime, there are also those who welcome a firm and stable government which vows to bring law and order to the nation. Time will tell what future awaits Romania under its new masters.
 fxnews.31.a: "Во времена кризиса иногда нужна сильная рука." # In times of crisis, sometimes a strong hand is needed.

 fxnews.32.t: "Пожары в Бинненхофе" # Fires in the Binnenhof
 fxnews.32.d: "[This.GetNewspaperHeader]Отмечая свой третий год прихода к власти, NNB или Nieuwe Nederlandse Beweging (Новое голландское движение) организовали грандиозный праздник в Бинненхоффе; на котором присутствовали влиятельные члены правительства и некоторые высокопоставленные военачальники.\n\nОднако во время празднования в южной части здания вспыхнул большой пожар, который быстро распространился и, наконец, охватил все здание. Подтверждено, что принц Бернхард и премьер-министр Гелкеркен погибли, задохнувшись от дыма, образовавшегося в результате пожара. Когда Амстердам был охвачен хаосом, социалистические элементы сделали свой ход и захватили государственный аппарат; провозглашение Голландского рабочего союза." # [This.GetNewspaperHeader]Celebrating its 3rd year, of coming into power, the NNB or the Nieuwe Nederlandse Beweging (New Dutch Movement) have organized a grand celebration in the Binnenhoff; with attendance from significant members of the government and some high-ranking military commanders.\n\nAs the celebration goes however, a large fire erupted in the southern part of the building, rapidly spreading and finally engulfing the whole building. Prince Bernhard and Prime Minister Geelkerken are ones that confirmed to be dead, suffocated by the smoke caused by the fire. As Amsterdam was engulfed into chaos, Socialist elements have made their move and seized the apparatus of state; declaring the Dutch Worker's Union.
 fxnews.32.a: "Хаос охватывает голландское государство..." # Chaos engulfs the Dutch State...

 fxnews.33.t: "Принц Бернхард убит!" # Prince Bernhard Assassinated!
 fxnews.33.d: "[This.GetNewspaperHeader]Народный принц, де-факто лидер ННБ, принц Бернхард был застрелен сегодня утром в Гронингене, когда выступал перед огромной толпой, собравшейся праздновать его недавние реформы. Одинокий преступник, подозреваемый в симпатиях к социалистам, похоже, имел непосредственный мотив мести за потерю своей семьи во время жестких социалистических репрессий, но многие наблюдатели подозревают, что в заговоре замешана рука нынешних членов партии самого NNB, когда предложения, выдвинутые Гилкеркеном, не были поддержаны принцем." # [This.GetNewspaperHeader]The people's prince, the de-facto leader of the NNB, Prince Bernhard was shot earlier today in Groningen when speaking to a massive crowd gathered to celebrate his recent reforms. The lone gunman, a suspected Socialist symphatizer, seems to have had as immediate motive revenge for the loss of his family during the hard socialist crackdowns but many observers are suspecting the hand of current party members of the NNB itself is in the plot, when the proposals brought by Geelkerken was not supported by the Prince.
 fxnews.33.a: "Это было весьма неудачно..." # That was quite unfortunate...

 fxnews.34.t: "Путч Рейндерса в голландском государстве" # Reijnders' Putsch in the Dutch State
 fxnews.34.d: "[This.GetNewspaperHeader]В результате шокирующего поворота событий генерал голландских вооруженных сил Исаак Рейндерс объявил чрезвычайное положение и совершил переворот в Гааге, свергнув недавно пришедшее к власти правительство Гилкеркена. Многие офицеры вооруженных сил с подозрением относились к причастности правительства Гилкеркена к убийству покойного принца Бернхарда, что позволило им взять на себя полный контроль. Военные настроены управлять Нидерландами в обозримом будущем." # [This.GetNewspaperHeader]In a shocking turn of events General Izaak Reijnders of the Dutch armed forces declared a state of emergency and launched a coup in the Hague, deposing the recently in-power Geelkerken Government. Many officers within the armed forces were suspicious about the involvement of the Geelkerken's Government on the assassination of the late Prince Bernhard, which allowed them to assume complete control. The military has set up to administer the Netherlands in the foreseeable future.
 fxnews.34.a: "Националисты воюют между собой..." # The nationalists are fighting among themselves...

 fxnews.35.t: "Конфликт на Аравийском полуострове" # Conflict in the Arabian Peninsula
 fxnews.35.d: "[This.GetNewspaperHeader]Аравийское Хашимитское Королевство было основано после неудавшейся военной кампании, проведенной Эмиратом Неджд в ответ на отказ Хашимитов разрешить паломникам из Неджда войти в Мекку.\n\nВновь видя неделю после краха лондонской фондовой биржи, лоялисты из Дома Саудов объявили открытое восстание против Хашимитского Королевства. Что еще хуже, остатки Дома Рашидов захватили контроль над Хаилем и верхней частью королевства, провозгласив при этом новый эмират Рашиди. Это привело к тому, что три фракции соперничают за контроль над полуостровом, и кто бы ни победил, Аравия изменится навсегда..." # [This.GetNewspaperHeader]The Hashemite Kingdom of Arabia has been founded after the failed military campaign conducted by the Emirate of Nejd in respose to the refusal of the Hashemites to allow pilgrims from Nejd to enter Mecca.\n\nSeeing the weekness again after the London Stock Market Crash, loyalists from the House of Saud, have declared an open rebellion against the Hashemite Kingdom. Making matters worse, remnants of the House of Rashid have seized control of Ha'il and the upper part of the Kingdom, declaring a new Rashidi Emirate in the process. This has resulted in three factions vying for control over the peninsula, and whoever wins, Arabia is changed forever...
 fxnews.35.a: "Интересно..." # Interesting...

 fxnews.36.t: "Смерть Владимира Ленина" # Death of Vladimir Lenin
 fxnews.36.d: "[This.GetNewspaperHeader]Всемирно известный революционер и архитектор Союза Советских Социалистических Республик Владимир Ленин скончался после длительной борьбы с сифилисом. На Красной площади прошла массовая похоронная церемония, на которую пришли более миллиона толп, чтобы отдать дань уважения человеку, который поставил Российскую империю на ноги и создал первое в истории государство, полностью принявшее идеалы коммунизма. После церемонии выступили вдова Ленина Надежда Крупская, Сергей Киров, Григорий Зинониев и Михаил Калинин. Несмотря на то, что Ленин занимал должность премьер-министра со дня рождения Советского Союза, Ленин публично не объявил о преемнике, и с его кончиной эта должность теперь остается тревожно вакантной, поскольку в то же время многие члены Коммунистической партии Советского Союза начинают свои попытки захватить власть, поскольку забастовки рабочих и нехватка продовольствия продолжают подрывать стабильность России." # [This.GetNewspaperHeader]The globally renowned revolutionary and architect of the Union of Soviet Socialist Republics Vladimir Lenin has passed away after a long battle with syphillis. A massive funeral ceremony was held in Red Square where crowds of upwards of millions attended to pay their respects to the man who brought the Russian Empire to its heels and brought forward the first ever state which fully adopted the ideals of communism. The ceremony was followed by speeches from Lenin's widow Nadezhda Krupskaya, Sergei Kirov, Grigoriy Zinoniev and Mikhail Kalinin. Despite holding the position of Premier since the day the Soviet Union was born, Lenin had not publically announced a successor, and with his passing, the position now remains uneasily vacant as at the same time many members of the Communist Party of the Soviet Union begin their gambits for power as labour strikes and food shortages continue to cripple Russian stability.
 fxnews.36.a: "Ленин был смертным, но его наследие будет длиться вечно." # Lenin was a mortal, but his legacy will last forever.

 fxnews.37.t: "Дворец Советов завершает строительство" # Palace of the Soviets Finishes Construction
 fxnews.37.d: "[This.GetNewspaperHeader]Новый мировой рекорд был побит: после многих неудач и задержек легендарный Дворец Советов был открыт для публики, к большому трепету мирового сообщества, поскольку теперь он является самым высоким зданием в мире с впечатляющей высотой 416 метров. Это сооружение с культовой статуей покойного Ленина на вершине было спроектировано как новое место проведения Верховного Совета и политический конференц-центр Коммунистической партии Советского Союза. Главный архитектор проекта Борис Иофан был награжден несколькими медалями от самого премьера, поскольку его выдающееся произведение теперь вызывает зависть у внешнего мира, демонстрируя мощь советской инженерной мысли." # [This.GetNewspaperHeader]A new world record has been broken as after many setbacks and delays, the legendary Palace of the Soviets has been opened to the public much to the awe to the global community as it now stands as the tallest building in the world at an impressive 416 meters. Bearing the iconic statue of the late Lenin at its top, the structure has been designed to be the new hosting place of the Supreme Soviet and as a political convention center for the Communist Party of the Soviet Union. The chief architect of the project - Boris Iofan - has been awarded several medals by the premier himself, as his magnum opus now stands to the great envy to the outer world, showing off the might of Soviet engineering.
 fxnews.37.a: "Настоящее достижение для работников всего мира." # Truly an achievement for workers all around the world.

 fxnews.38.t: "Военный переворот в Советском Союзе" # Military Coup in the Soviet Union
 fxnews.38.d: "[This.GetNewspaperHeader]Москва и Ленинград были полностью заблокированы в одночасье, поскольку были мобилизованы тысячи солдат Красной гвардии, введя военное положение, как раз в тот момент, когда города должны были быть захвачены массами демонстрантов, протестующих против массовой нехватки продовольствия и нестабильности после недавней смерти Ленина. Генерал Михаил Тухачевский вышел на трибуну в Кремле вместе с Клементом Ворошиловым и Михаилом Фрунзе, чтобы объявить, что нерешительность Коммунистической партии и «неминуемая угроза троцкистского переворота» вынудили Красную Армию вмешаться, чтобы восстановить порядок. Хотя большая часть советской Красной Армии заявила о своей преданности Тухачевскому, этого нельзя сказать об общественной поддержке переворота, поскольку ссорящаяся оппозиция объединилась вокруг таких фигур, как Сергей Киров и Григорий Зинониев, которые надеются остановить переворот посредством народных демонстраций." # [This.GetNewspaperHeader]Moscow and Leningrad have been completely locked down overnight as thousands of Red Guard troops have been mobilized, enacting martial law just as the cities were expected to be overwhelmed by the masses of demonstrators protesting the massive food shortages and instability following Lenin's recent death. General Mikhail Tukhachevsky took to the podium in the Kremlin alongside Klement Voroshilov and Mikhail Frunze to announce that the Communist Party's indecisiveness and the \"imminent threat of a Trotskyite coup\" forced the Red Army to step in to bring back order. While most of the Soviet Red Army has declared their allegiance to Tukhachevsky, the same could not be said about public support for the coup as the squabbling opposition have united behind figures like Sergei Kirov and Grigoriy Zinoniev, who hope to stop the coup through popular demonstrations.
 fxnews.38.a: "Советы находятся на пределе своего развития?" # Are the Soviets at their breaking point?

 fxnews.39.t: "Валлонский кризис" # The Walloon Crisis
 fxnews.39.d: "[This.GetNewspaperHeader]Напряженность в регионе Бенилюкса растет, поскольку требования Франции о предоставлении региона Валлония Белигуму встретили жесткое дипломатическое сопротивление. Поступили новые сообщения о том, что Великобритания сама гарантировала независимость Бельгии и пообещала ей полную военную поддержку, если французы решат предпринять военные действия. \n\nВзоры всего мира обратились к Валлонии, чтобы увидеть, что будет дальше. Кажется, еще одна крупная европейская война может маячить прямо за горизонтом." # [This.GetNewspaperHeader]Tensions are rising in the Benelux region, as the French demands for the Wallonia region from Beligum has been met with stiff diplomatic resistance. New reports have come in stating that Britain itself has guarunteed Belgiums independence and promised them full military support if the French decide to take military action. \n\nThe worlds eyes have turned to Wallonia to see what happens next, it seems another major European war may be looming just over the horizon.
 fxnews.39.a: "Неужели они не могут просто поговорить об этом за чаем?" # Can't they simply talk it out over tea?

 fxnews.40.t: "Формирование сферы совместного процветания" # Formation of the Co-Prosperity Sphere
 fxnews.40.d: "[This.GetNewspaperHeader]Высокопоставленные лица из Филиппин и Японии встретились в Токио в последние несколько дней, чтобы обсудить военный и экономический союз азиатских стран. Сегодня они объявили о создании «Сферы совместного процветания Большой Восточной Азии»; этот квазивоенный и экономический союз, целью которого является изгнание западного империализма из Восточной Азии. На сегодняшний день во все государства-члены этого альянса входят Япония и Филиппины, причем членство автоматически перешло к подвластным им государствам.\n\nВвиду растущих националистических амбиций Японии и Филиппин в Азии министерство иностранных дел Великобритании отказалось комментировать этот вопрос, заявив, что они работают над двумя странами, чтобы сохранить мир в регионе; однако министр иностранных дел Франции выразил обеспокоенность по поводу этого нового растущего альянса." # [This.GetNewspaperHeader]Dignitaries from the Philippines and Japan have met in Tokyo in the last few days discussing about a military and economic alliance for Asian nations. Today, they have announced the Greater East Asia Co-Prosperity Sphere; these quasi-military and economic alliance that aims to expel Western Imperialism in East Asia. As of today, all members states of this alliance include Japan and the Philippines, with membership automatically passed to their subject states.\n\nWith rising nationalist ambitions of Japan and the Philippines in Asia, the British Foreign Office and refused to comment on the matter, stating that they are working on the two countries to preserve the peace in the region; however, the French Foreign Minister have expressed their concerns over these new rising alliance.
 fxnews.40.a: "Интересно..." # Interesting...

 fxnews.41.t: "Корейское восстание" # The Korean Uprising
 fxnews.41.d: "[This.GetNewspaperHeader]Подъем Японии в последние десятилетия серьезно нарушил статус-кво в Восточной Азии, а присоединение Кореи в 1910 году к Стране восходящего солнца рассматривалось как показатель нового порядка на материке. Однако мощь Японии не безгранична, и усилия по колонизации в Корее, Маньчжурии и Формозе привели к большому недовольству их оккупантами, что в данном случае привело к открытому восстанию на Корейском полуострове. \nНесмотря на активные усилия японцев по подавлению корейского меньшинства в Фэнтяне, чтобы отговорить попытки изгнанников получить иностранное оружие, сегодня в Корее вспыхнуло открытое восстание, когда корейцы захватили стратегические точки на полуострове. Без сомнения, ответ Империи будет быстрым, и мало кто надеется на победу туземцев." # [This.GetNewspaperHeader]The rise of Japan in recent decades massively upset the status quo in East Asia, and the annexation of Korea in 1910 to the Land of the Rising Sun was seen as indicative of a new order on the mainland. However Japanese power is not limitless, and colonisation efforts in Korea, Manchuria and Formosa have led to great resentment against their occupiers, leading in this instance to open revolt on the Korean peninsula.\nDespite extensive efforts by the Japanese to crack down on the Korean minority in Fengtian to dissuade exiles' efforts to gain foreign arms, open rebellion broke out in Korea today as Koreans seized strategic locations across the peninsula. No doubt the Imperial response will be swift, and few are holding out for a native victory.
 fxnews.41.a: "Лазурные холмы будут залиты кровью." # The Azure Hills will be bathed in blood.

 fxnews.42.t: "Индокитайское восстание" # The Indochinese Uprising
 fxnews.42.d: "[This.GetNewspaperHeader]Индокитайский регион был колонизирован и эксплуатирован французами с 1862 года. Теперь индокитайские националисты и левые под руководством коалиционного правительства под названием Вьетминь восстали против колониального режима. Нго Дин Зьем, глава Вьетминя, провозгласил независимость Индокитая в Сайгоне. Отдав дань уважения сопротивлению азиатского народа, он осудил жестокое угнетение азиатов французами и подтвердил приверженность народа Индокитая единству Азии.\nНаблюдатели согласны с французскими СМИ, что в этом вопросе существует внешнее вмешательство; но французские официальные лица не заявили, кто это мог быть." # [This.GetNewspaperHeader]The Indochinese region have been colonialized and exploited by the French since 1862. Now, Indochinese nationalists and leftists under a coalition government called the Viet Minh have risen up against the colonial regime. Ngo Din Diem, the head of the Viet Minh, declared the Independence of Indochina in Saigon. After paying homage to the resistance of Asian people, he condemned the brutal French oppression of Asian people and affirmed the Indochinese people's commitment to the unity of Asia.\nObservers agree with French media that there is outside intervention on this matter; but French officials have not stated who might be it.
 fxnews.42.a: "Интересно..." # Interesting...

 fxnews.43.t: "Рождение Малайской Конфедерации" # Birth of the Malayan Confederation
 fxnews.43.d: "[This.GetNewspaperHeader]В этот день мир был уведомлен о создании Малайской Конфедерации. Это союз территорий Филиппин, Малайи и Индонезии. Страна разделена не только тысячами километров моря, но и внутри множества культур.\n\nХотя еще неизвестно, будут ли эти трудности преодолены вовремя, Конфедерация, вероятно, станет доминирующей силой в Юго-Восточной Азии." # [This.GetNewspaperHeader]On this day, the World was notified of the Malayan Confederation's formation. It is a union between the territories of the Philippines, Malaya, and Indonesia. The country is divided not only by thousands of kilometers of sea but also internally by a multitude of cultures.\n\nAlthough it is yet to be seen if these difficulties will be overcome in time, the Confederation is likely to be a dominant force in Southeast Asia.
 fxnews.43.a: "Интересно..." # Interesting...

 fxnews.44.t: "Армия захватила контроль над Филиппинами" # Army Seized Control of the Philippines
 fxnews.44.d: "[This.GetNewspaperHeader]Недавние события на Филиппинах потрясли нацию до глубины души: сначала был раскрыт коррупционный скандал госсекретаря Акино, затем рухнул лондонский фондовый рынок, погрузив нацию в политическую битву.\n\nПока протестующие набирали силу и симпатии среди местного населения, охранник, сочувствовавший их делу, хладнокровно убил президента в его офисе; в результате армия захватила контроль над правительством." # [This.GetNewspaperHeader]The recent events in the Philippines has shocked the nation to its core, first the corruption scandal of Secretary Aquino was uncovered, then the London Stock Market has crashed plunging the nation into a political battlefield.\n\nAs the protesters gained strength and symphathy in the local population, a guard sympathetic to their cause and have assassinated the President cold-blooded in his office; resulting the army to seize control of the government.
 fxnews.44.a: "О нет, это ужасно!" # Oh no, that's horrible!

 fxnews.45.t: "Германия признает претензии Беларуси" # Germany Recognises Belarusian Claims
 fxnews.45.d: "[This.GetNewspaperHeader]После встречи в Кенигсберге представителей [BLR.GetAdjective] и [GER.GetAdjective] правительство [GER.GetAdjective] согласилось признать территориальные претензии, изложенные правительством [BLR.GetAdjective].\n\nЭти территории, по-видимому, включают бывшие территории, принадлежавшие Великому княжеству Литовскому, государству, существовавшему с 13 века по 1795 год, когда территории были разделены между русскими, пруссаками и австрийцами; однако правительство [BLR.GetAdjective] стремится возродить Великое княжество Литовское." # [This.GetNewspaperHeader]After a meeting in Königsberg by both [BLR.GetAdjective] and [GER.GetAdjective] representatives, the [GER.GetAdjective] Government have agreed to recognize the territorial claims set-out by the [BLR.GetAdjective] Government.\n\nThese territories seems to include the former territories owned by the Grand Duchy of Lithuania, a state that 13th century to 1795 when the territories were partitioned among by the Russians, Prussians and Austrians; however, the [BLR.GetAdjective] Government seeks to revive the Grand Duchy of Lithuania.
 fxnews.45.a: "Какие претензии?" # What claims?

 fxnews.46.t: "Красный рассвет в Юго-Восточной Азии" # Red Dawn in Southeast Asia
 fxnews.46.d: "[This.GetNewspaperHeader]Только что добившись независимости от США, Филиппины избрали новое социалистическое правительство. Этот неожиданный результат выборов является результатом повсеместного роста симпатий к социалистам из-за насильственного разгона фермеров и крестьян филиппинскими скаутами недалеко от Мендиолы.\n\nНовый президент, [PHI.GetLeader], поклялся защищать демократические ценности и свободы всех людей и пообещал, что страна больше не подпадет перед капиталистическими и империалистическими интересами." # [This.GetNewspaperHeader]Having just achieved independence from the United States, the Philippines have elected a new Socialist Government. These unexpected result of the election is the result of the widespread increase in socialist symphaty due to the violent dispersal of farmers and peasants by Filipino Scouts just outside Mendiola.\n\nThe new President, [PHI.GetLeader] have sworn to uphold the democratic values and liberties of all people, and promised that the country would not fall again the capitalist and imperialist interests.
 fxnews.46.a: "Страна за страной, революция прогрессирует." # Country after country, the\nrevolution progresses.

 fxnews.47.t: "Король Эдуард VIII положил конец конституционализму" # King Edward VIII Ends Constitutionalism
 fxnews.47.d: "[This.GetNewspaperHeader]Поскольку гражданские волнения охватили Британские острова после катастрофических нескольких недель политической нестабильности, многие полагали, что Империя, над которой никогда не заходило солнце, вскоре окажется распущенной и окажется на свалке истории.\n\nНеожиданно появились сообщения о том, что король Эдуард VIII захватил власть с военной помощью в попытке навести порядок в стране и уничтожить революционные элементы, решившие искоренить старый порядок. Еще неизвестно, какие все последствия эта новая политическая ситуация будет иметь для Империи." # [This.GetNewspaperHeader]As civil unrest engulfed the British Isles following a disastrous several weeks of political turmoil, many believed the Empire on which the sun never set would soon find itself dissolved and confined to the dustbin of history.\n\nUnexpectingly reports have emerged that King Edward VIII has seized power with military assistance in an attempt to bring order to the country and destroy revolutionary elements determined to eradicate the old order. It remains to be seen what the full implications of this new political situation will have for the Empire.
 fxnews.47.a: "Это конец демократии в Британии?" # Is this the end of Democracy in Britain?

 fxnews.48.t: "Военные штурмуют здание парламента" # Military Storms Houses of Parliament
 fxnews.48.d: "[This.GetNewspaperHeader]Поскольку гражданские волнения охватили Британские острова после катастрофических нескольких недель политической нестабильности, многие считали, что Империя, над которой никогда не заходило солнце, вскоре окажется распущенной и окажется на свалке истории.\n\nСлухи из Британии указывали на то, что харизматичный офицер британской армии штурмовал Вестминстерский дворец с помощью находящихся в этом районе воинских частей после того, как ему было приказано открыть огонь по протестующим на улицах Лондона. Военные подразделения по всей стране уже присягнули на верность новому временному правительству, и порядок на улицах Британии был восстановлен – хотя и жестоко." # [This.GetNewspaperHeader]As civil unrest engulfed the British Isles following a disastrous several weeks of political turmoil, many believed the Empire on which the sun never set would soon find itself dissolved and confined to the dustbin of history.\n\nRumours from Britain have indicated that a charismatic officer of the British Army has stormed the Palace of Westminster with the assistance of military units in the area after having been ordered to open fire on protestors on the streets of London. Already military units around the country have pledged allegiance to the new provisional Government and order has been restored - albeit brutally - to the streets of Britain.
 fxnews.48.a: "И откажутся ли когда-нибудь военные от этой власти?" # And will the Military ever give up this power?

 fxnews.49.t: "Убийство в Гайд-парке" # Hyde Park Assassination
 fxnews.49.d: "[This.GetNewspaperHeader]Ближе к вечеру одинокий преступник достал заряженный револьвер, когда Его Величество король-император Эдуард VIII проезжал верхом на холме Конституции возле Букингемского дворца. Несмотря на то, что сотрудники Скотланд-Ярда заметили пистолет, мужчина смог выстрелить из него дважды, прежде чем его повалили на землю и обезоружили. Когда толпа разбежалась от преступника, через несколько мгновений выяснилось, что король мертв, получив огнестрельное ранение в грудь, которое, как полагают, пронзило его сердце.\n\nУбийство короля Эдуарда вызвало шок во всем политическом истеблишменте Британии. В Империи воцарилось предварительное затишье, и многие полагают, что худшее еще впереди." # [This.GetNewspaperHeader]Late this afternoon, a lone gunman produced a loaded revolver as His Majesty, King-Emperor Edward VIII, rode on horseback at Constitution Hill near Buckingham Palace. Despite the men of Scotland Yard spotting the gun, the man was able to discharge the weapon twice before he was tackled to the ground and disarmed. As the crowd scattered from the gunman, it was discovered moments later that the King was dead, suffering a gun-shot wound to the chest which is believed to have pierced his heart.\n\nKing Edward's assassination has sent shockwaves throughout the political establishment in Britain. A tentative calm has fallen across the Empire, with many believing the worst is yet to come.
 fxnews.49.a: "Мы должны поддержать Британию, чтобы не допустить хаоса!" # We must stand with Britain to keep chaos at bay!
 fxnews.49.b: "Еще один удар по стабильности Империи..." # Another blow to the Empire's stability...

 fxnews.50.t: "Британская имперская конференция 1937 года" # British Imperial Conference of 1937
 fxnews.50a.d: "[This.GetNewspaperHeader]После завершения четырнадцатой Имперской конференции новости о внутренних дискуссиях внутри Британской империи начали постепенно просачиваться в прессу Соединенного Королевства. После окончания Великой войны Британская империя погрузилась в «великолепную изоляцию» — политику, проводившуюся ранее в XIX веке. Из-за возросшей глобальной напряженности целый день конференции был посвящен решению вопроса о месте Британской империи в мире.\n\nПохоже, после напряженного дня переговоров британские лидеры решили, что дни изоляции Империи закончились. Теперь заявленная цель Великобритании – принести «цивилизацию» в самые темные уголки планеты." # [This.GetNewspaperHeader]As the fourteenth Imperial Conference concludes, news regarding the internal discussions within the British Empire has begun to steadily trickle out to the press in the United Kingdom. Since the end of the Great War the British Empire retreated into 'Splendid Isolation', a policy previously pursued in the 19thC. Due to heightened global tensions an entire day of the conference was dedicated to resolving the issue of the British Empire's place in the world.\n\nIt seems after a tense day of negotiation, British leaders have decided that the Empire's days of isolation are over. Now Britain's stated goal is to bring 'civilisation' to the darkest corners of the planet.
 fxnews.50b.d: "[This.GetNewspaperHeader]После завершения четырнадцатой Имперской конференции новости о внутренних дискуссиях внутри Британской империи начали постепенно просачиваться в прессу Соединенного Королевства. После окончания Великой войны Британская империя погрузилась в «великолепную изоляцию» — политику, проводившуюся ранее в XIX веке. Из-за возросшей глобальной напряженности целый день конференции был посвящен решению вопроса о месте Британской империи в мире.\n\nХотя многие считали, что эта конференция может ознаменовать новую эпоху империализма, многие были шокированы, обнаружив, что новой целью Британии является не экспансионизм, а то, что они называют «защитой свободы и демократии внутри страны и за рубежом»." # [This.GetNewspaperHeader]As the fourteenth Imperial Conference concludes, news regarding the internal discussions within the British Empire has begun to steadily trickle out to the press in the United Kingdom. Since the end of the Great War the British Empire retreated into 'Splendid Isolation', a policy previously pursued in the 19thC. Due to heightened global tensions an entire day of the conference was dedicated to resolving the issue of the British Empire's place in the world.\n\nWhile many believed that this conference may herald a new age of Imperialism, many have been shocked to discover that Britain's new objective is not expansionism, but what they call 'the defence of liberty and democracy at home and abroad'.
 fxnews.50c.d: "[This.GetNewspaperHeader]После завершения четырнадцатой Имперской конференции новости о внутренних дискуссиях внутри Британской империи начали постепенно просачиваться в прессу Соединенного Королевства. После окончания Великой войны Британская империя погрузилась в «великолепную изоляцию» — политику, проводившуюся ранее в XIX веке. Из-за возросшей глобальной напряженности целый день конференции был посвящен решению вопроса о месте Британской империи в мире.\n\nНеудивительно, что никто из участников не участвовал, британцы решили, что, хотя нестабильность во всем мире является причиной для беспокойства, британская отмена изоляции только еще больше усугубит указанную нестабильность, и поэтому ради Империи политика изоляции будет продолжена." # [This.GetNewspaperHeader]As the fourteenth Imperial Conference concludes, news regarding the internal discussions within the British Empire has begun to steadily trickle out to the press in the United Kingdom. Since the end of the Great War the British Empire retreated into 'Splendid Isolation', a policy previously pursued in the 19thC. Due to heightened global tensions an entire day of the conference was dedicated to resolving the issue of the British Empire's place in the world.\n\nSurprising none involved, the British have decided that while the instability world-wide is a cause for concern, a British revocation of isolation would only further worsen said instability, and so for the sake of the Empire the policy of isolation will continue.
 fxnews.50.a: "Британский лев проснулся ото сна" # The British Lion has awoken from its slumber
 fxnews.50.b: "Похоже, они используют демократию как оправдание своей воинственности." # Sounds like they're using democracy as an excuse for belligerence
 fxnews.50.c: "Похоже, Великая война оказала глубокое влияние на Империю." # It seems the Great War had a profound effect on the Empire
 fxnews.50.e: "Наше имперское бремя" # Our imperial burden
 fxnews.50.f: "В защиту свободы!" # In the defense of liberty!
 fxnews.50.g: "Мы должны избежать новой Великой войны" # We must avoid another Great War

 fxnews.51a.t: "Успешные переговоры в Индии" # Successful Negotiations in India
 fxnews.51b.t: "Индийские повстанцы капитулируют" # Indian Rebels Surrender
 fxnews.51a.d: "[This.GetNewspaperHeader]С момента начала восстания в декабре 1935 года индийские повстанцы проявили себя многообещающе, взяв на себя инициативу в борьбе против британского контроля над субконтинентом, и хотя Великобритания с тех пор отправила в регион большое количество войск, чтобы подавить восстание, восстание продолжает жить.\n\nВ попытке положить конец нестабильности в Индии британское правительство вступило в мирные переговоры с лидерами повстанцев в Индии, информация, которая просочилась в результате этих переговоров, указывает на то, что Британское правительство пообещало значительную автономию Индии в будущем, что является серьезной уступкой повстанческой стороне. Выполнит ли Великобритания это обещание, еще неизвестно." # [This.GetNewspaperHeader]Since the beginning of the rebellion in December of '35, the Indian Rebels had shown promise by taking the iniative in the fighting against British control over the sub-continent, and while Britain has since shipped larged quantities of troops to the region to crush the revolt the rebellion has continued to live on.\n\nIn an effort to bring an end to instability in India the British Government has entered into peace negotiations with rebel leaders in India, information that has leaked from these negotiations indicates that the British Government has promised significant autonomy for India in the future in what is a serious concession to the rebel side. Whether or not Britain follows through on this promise remains to be seen.
 fxnews.51b.d: "[This.GetNewspaperHeader]С момента начала восстания в декабре 1935 года индийские повстанцы проявили многообещающие способности, взяв на себя инициативу в борьбе против британского контроля над субконтинентом, хотя Британии не потребовалось много времени, чтобы переправить значительное количество войск и техники в Индию в попытке окончательно подавить восстание.\n\nУзнав новости о том, что лидеры повстанцев попытались начать переговоры с британским правительством, многие полагали, что восстание завершится дипломатическим путем, хотя кажется, что что британское правительство решило подать пример повстанцам в Индии и только сегодня объявило о полной и безоговорочной капитуляции повстанцев британским войскам." # [This.GetNewspaperHeader]Since the beginning of the rebellion in December of '35, the Indian Rebels had shown promise by taking the iniative in the fighting against British control over the sub-continent, although it would not take long for Britain to funnel significant quantities of troops and equipment to India in an attempt to crush the rebellion firmly.\n\nWith news that rebels leaders had attempted to open talks with the British Government many believed that the revolt would come to an end diplomatically, though it seems that the British Government has opted to make an example of the rebels in India and has just today announced the rebels complete and unconditional surrender to British forces.
 fxnews.51.a: "Стабильность в Индии наконец возвращается" # Stability in India returns at last
 fxnews.51.b: "А отчет по фондовому рынку?" # And the stock market report?

 fxnews.52.t: "Возрождение Сердечного согласия." # Rebirth of the Entente Cordiale
 fxnews.52.d: "[This.GetNewspaperHeader]Срочные сообщения из Лондона показали, что только что завершилась секретная встреча министров иностранных дел Франции и Великобритании. На пресс-конференции после встречи было зачитано совместное заявление, в котором говорилось, что правительства Великобритании и Франции согласились возродить союз Антанта Кордиале между двумя странами в попытке противостоять наступлению Германии на европейский континент.\n\nЗастав многих врасплох (поскольку в последние годы отношения между Францией и Великобританией были относительно плохими), эксперты полагают, что в условиях растущей угрозы доминирования Германии на континенте британское и французское правительства почувствовали себя обязанными отложить свои разногласия, чтобы справиться с большей угрозой." # [This.GetNewspaperHeader]Urgent reports from London have indicated that a secret meeting between the French and British Foreign Ministers has just concluded. At a press conference after the meeting, a joint statement was read indicating that the British and French Governments have agreed to revive the Entente Cordiale alliance between their two nations in an effort to counter the German advance across the European continent.\n\nTaking many by surprise - as in recent years French and British relations have been relatively poor - experts believe with the growing threat of German dominance over the continent that the British and French governments felt obligated to put aside their differences in order to deal with the greater threat.
 fxnews.52.a: "Победа будет за нами!" # Victory will be ours!
 fxnews.52.b: "Посмотрите, как они жмутся друг к другу, как загнанные крысы!" # Look at how they huddle together like cornered rats!
 fxnews.52.c: "Даже вместе они, возможно, не смогут противостоять Германии." # Even together they may be unable to stand against Germany

 fxnews.53.t: "Индийское восстание [GetYear]" # Indian Rebellion of [GetYear]
 fxnews.53.d: "[This.GetNewspaperHeader]В последние недели 1936 года в нескольких важных индийских городах произошли массовые беспорядки, вызванные отказом британской администрации реформировать условия труда и повысить заработную плату на всей территории Британской Индии. Эти суровые условия были введены еще в 1924 году и с тех пор вызвали большое негодование среди населения.\n\nНесмотря на первоначальное рассеяние, группа лидеров повстанцев сумела изгнать британских чиновников из основных мест по всей стране, взяв в руки оружие с заявленной целью насильственного изгнания британцев из Индии. Хотя повстанцы многочисленны, они плохо оснащены, и неизвестно, увенчаются ли их усилия в конечном итоге успехом." # [This.GetNewspaperHeader]During the later weeks of 1936 widespread rioting took place in several important Indian cities following the refusal of the British administration to reform working conditions and raise pay throughout British India. These harsh conditions were imposed as early as 1924 and have since caused great resentment among the population.\n\nWhile initially dispersed, a collection of rebel leaders have succeeded in ejecting British officials from major locations throughout the country, having taken up arms with the stated purpose of forcefully expelling the British from India. While numerous, the rebels are poorly equipped and it is unknown whether their efforts will ultimately succeed.
 fxnews.53.a: "Они заплатят цену за восстание против Империи." # They will pay the price of rebelling against the Empire.
 fxnews.53.b: "Больше нестабильности в Империи." # More instability in the Empire.
 fxnews.53.c: "Мы вытесним Британию из Индии!" # We will force Britain out of India!
 fxnews.53.e: "Возможно, Империя не так сильна, как думают люди." # Perhaps the Empire is not as strong as people suspect

 fxnews.54.t: "Второе восстание IRB" # The Second IRB Rising
 fxnews.54a.d: "[This.GetNewspaperHeader]После нескольких месяцев расследования, проведенного Королевской полицией Ирландии по выяснению местонахождения руководства Ирландского республиканского братства, была предпринята неудачная попытка симулировать уничтожение независимых ячеек IRB, действующих по всей Ирландии. Несмотря на полную секретность, британские источники в Вестминстере сообщили, что информация просочилась в IRB еще до операции.\n\nТолько сегодня утром IRB вновь появился в делах Ирландии, захватив многочисленные важные правительственные здания на западе страны и в Дублине. IRB отчаянно не хватает оборудования; если иностранная держава не вмешается, чтобы помочь Восстанию, маловероятно, что оно добьется успеха." # [This.GetNewspaperHeader]Following several months of investigation by the Royal Irish Constabulary to track down the whereabouts of the Irish Republican Brotherhood leadership, a failed attempt was made to simulatenously destroy the independent IRB cells working throughout Ireland. Despite the utmost secrecy, British sources within Westminster have indicated that information was leaked to the IRB prior to the operation.\n\nIt was not until this morning that the IRB made a re-appearance in Irish affairs, seizing numerous important government buildings throughout the West of the country and in Dublin. The IRB desperately lacks equipment; unless a foreign power intervenes to assist the Rising it is unlikely that it will succeed.
 fxnews.54b.d: "[This.GetNewspaperHeader]На протяжении веков ирландская нация находилась под британским контролем, и на протяжении веков ирландский народ боролся против британского правления. Хотя последнее восстание во время Великой войны провалилось, похоже, дух ирландского народа сломить нелегко. После того, как британское правительство не смогло справиться с остатками Ирландского республиканского братства, они воспользовались возможностью, которую новая британская война представляет Ирландии, и возглавили новое вооруженное восстание против британцев.\n\nОчевидно, что, научившись на предыдущем опыте, это новое восстание хорошо организовано и хорошо укомплектовано, единственным его недостатком является хроническая нехватка оборудования. Если это новое восстание увенчается успехом, Ирландии, несомненно, потребуется иностранная поддержка." # [This.GetNewspaperHeader]For centuries the Irish nation has been under British control, and for centuries the Irish people have fought against British rule. While the most recent rebellion during the Great War failed, it seems the spirit of the Irish people is not crushed easily. After the failure of the British Government to deal with the remnants of the Irish Republican Brotherhood, they have seized the opportunity that Britain's new war presents Ireland, and led another armed rebellion against the British.\n\nHaving apparently learned from previous experiences, this new rising is well organised and well manned, it's only downfall appears to be a chronic shortage of equipment. If this new rising is to succeed, Ireland will no doubt require foreign support.
 fxnews.54.a: "Они будут раздавлены!" # They will be crushed!
 fxnews.54.b: "Мы выгоним англичан из Ирландии!" # We will drive the British out of Ireland!
 fxnews.54.c: "Доказательство того, что ирландский дух невозможно победить." # Proof that the Irish spirit can never be conquered.

 fxnews.55.t: "Британцы изгнаны из Индии!" # The British are Driven from India!
 fxnews.55.d: "[This.GetNewspaperHeader]После нескольких месяцев боев индийские повстанцы недавно одержали ряд побед над британскими войсками в Индии, успешно изгнав их с материковой части Индии. Когда-то Индия была жемчужиной короны Империи, теперь свободна и независима, хотя о том, каким будет будущее Индии, можно только догадываться.\n\nХотя Индия объединилась против общего врага, похоже, что без объединяющей силы субконтинент вскоре может снова оказаться раздробленным и разделенным.\n\nБританское правительство поклялось восстановить порядок в Индии, хотя, поскольку небольшая территория поблизости все еще находится под их контролем, неизвестно, будут ли они когда-либо снова успешно угрожать Индии." # [This.GetNewspaperHeader]After several months of fighting the Indian rebels have recently won a string of victories over British forces in India, successfully ejecting them from the Indian mainland. Once the former crown jewel of the Empire, India is now free and independent, although what the future of India will be is anyone's guess.\n\nWhile India was united against their common enemy, it seems that without a unifying force the sub-continent may soon find itself fractured and divided once more.\n\nThe British Government has vowed to restore order to India although with little territory nearby still under their control it is unknown whether they will ever successfully threaten India again.
 fxnews.55.a: "Мы вернемся!" # We will return!
 fxnews.55.b: "Катастрофический день для Империи." # A disastrous day for the Empire.
 fxnews.55.c: "Победа за нами!" # Victory is ours!
 fxnews.55.e: "Это значительно ослабит Империю." # This will significantly weaken the Empire

 fxnews.56.t: "Игры Британской Империи 1938 года" # British Empire Games of 1938
 fxnews.56.a: "Напряженная конкуренция!" # An intense competition!
 fxnews.56.d: "[This.GetNewspaperHeader]Игры Британской Империи впервые начались в 1930 году как способ объединить Империю для дружеского соревнования. В этом году Игры проводились каждые четыре года на стадионе Sydney Cricket Ground в Сиднее, Австралия, и были приурочены к празднованию 150-летия со дня основания первого британского поселения в Австралии.\n\nНеудивительно, что победителем Игр этого года стала сама Австралия, сумевшая выиграть в общей сложности 66 медалей, из которых 25 золотых. Австралия показала особенно хорошие результаты в области борьбы и гребли с множеством исключительно опытных спортсменов. Примечательно, что австралийская спортсменка Десима Норман завоевала пять золотых медалей в легкой атлетике." # [This.GetNewspaperHeader]The British Empire Games first began in 1930 as a way of bringing the Empire together for some friendly competition. Held every four years, this years Games were held in the Sydney Cricket Ground in Sydney, Australia, timed to celebrate the 150-year anniversary since the first British settlement in Australia.\n\nUnsurprisingly the winner of this years Games was Australia herself, managing to win a total of 66 medals, of which 25 were gold. Australia performed particularly well in the fields of wrestling and rowing with a plethora of exceptionally skilled atheletes. Notably, Australian athlete Decima Norman won five gold medals in track and field.

 fxnews.57.t: "Четвертая англо-бурская война" # The Fourth Boer War
 fxnews.57.d: "[This.GetNewspaperHeader]С закрытием Имперской конференции в мир пришла новость о том, что Британская империя попытается создать «Имперскую федерацию», в которой правительствам Доминионов будет предоставлено равное представительство в Имперском парламенте внутри Империи. Хотя некоторые были счастливы или заинтересованы в такой возможности, никто не был так возмущен, как буры Южной Африки.\n\nСегодня началась Четвертая англо-бурская война, когда повстанцы захватили армейские склады по всей Южной Африке и захватили большое количество земель Южно-Африканского Союза. Это восстание масштабно и опасно, и еще неизвестно, сможет ли Империя восстановить порядок в этом регионе." # [This.GetNewspaperHeader]With the closing of the Imperial Conference news came to the world that the British Empire would attempt to pursue an 'Imperial Federation', where the Dominion Governments would be granted equal representation in an Imperial Parliament within the Empire. While some were happy or interested in this possibility, there were none more so outraged than the Boers of South Africa.\n\nToday the Fourth Boer War has begun, with rebels seizing army depots across South Africa and capturing a large amount of land from Union of South Africa. This revolt is large and dangerous, and it remains to be seen whether or not the Empire can restore order to this region.
 fxnews.57.a: "Мы наведем порядок в Южной Африке!" # We will restore order to South Africa!
 fxnews.57.b: "Сдадутся ли когда-нибудь буры?" # Will the Boers ever give up?
 fxnews.57.c: "Свобода будет нашей!" # Freedom will be ours!

 fxnews.58.t: "Индия покидает Империю" # India leaves the Empire
 fxnews.58.d: "[This.GetNewspaperHeader]С момента установления британского правления в Индии произошло несколько восстаний против Империи в попытке завоевать свободу индийского народа, последнее из которых произошло всего несколько лет назад. Хотя каждое восстание со временем подавлялось, похоже, что сегодня индийские националисты преуспели там, где те, кто был до них, потерпели неудачу.\n\nПока Империя занимается Четвертой англо-бурской войной, многие индийские повстанцы захватили важные места по всему субконтиненту и успешно изгнали британцев из региона, оставив под их контролем только Бирму и Цейлон. Хотя британское правительство пригрозило «восстановить порядок» в регионе, маловероятно, что они вернутся в ближайшее время." # [This.GetNewspaperHeader]Since the establishment of British rule in India there have been several rebellions against the Empire in an attempt to win the freedom of the Indian people, the most recent of which occurred only a few years ago. While each rebellion was put down over time, it seems that today Indian nationalists have succeeded where those that came before them failed.\n\nWhile the Empire deals with the Fourth Boer War, many Indian rebels seized important locations throughout the sub-continent and have successfully ejected the British from the region, with only Burma and Ceylon remaining under their control. While the British government has threatened to 'restore order' to the region, it is unlikely they will be back anytime soon.
 fxnews.58.a: "Мы с ними разберемся в конце концов" # We will deal with them eventually
 fxnews.58.b: "Жемчужина Империи исчезла" # The crown jewel of the Empire is gone
 fxnews.58.c: "Свобода!" # Freedom!

 fxnews.59.t: "Рождение Имперской Федерации" # Birth of the Imperial Federation
 fxnews.59.d: "[This.GetNewspaperHeader]После окончания Имперской конференции 1937 года Британской империи предстоял трудный путь после решения следовать идеям «Имперской Федерации». Сегодня эта борьба, наконец, принесла свои плоды: представители Империи официально провозгласили Федерацию в новом Имперском парламенте Лондона.\n\nДоминионы Империи получили полное представительство в этом новом Имперском парламенте, и хотя ожидается, что на пути к ним будут продолжаться трудности, поскольку члены Имперского парламента будут изо всех сил пытаться найти общий язык, эта новая Имперская Федерация, вероятно, будет представлять собой еще более могущественную Империю, чем когда-либо прежде." # [This.GetNewspaperHeader]Since the end of the Imperial conference of 1937 a difficult path lay ahead for the British Empire following the decision to pursue the ideas of an 'Imperial Federation'. Today this struggle has finally borne fruit, with the Federation formally being declared in London's new Imperial Parliament by representatives from the Empire.\n\nThe Dominions of the Empire have been granted full representation in this new Imperial Parliament, and although it is expected that there will be continued hardships in the road ahead as Members of the Imperial Parliament struggle to find common ground, this new Imperial Federation is likely to represent an even more powerful Empire than ever before.
 fxnews.59.a: "И что Империя будет делать с этой вновь обретенной силой?" # And what will the Empire do with this new-found power?

 fxnews.60.t: "Битва при Мерс-эль-Кебире" # Battle of Mers-el-Kébir
 fxnews.60.d: "[This.GetNewspaperHeader]Вчера в полдень эскалация кризиса между британским и французским правительствами из-за случайного затопления HMS Triton обострилась еще больше, когда военные корабли Королевского флота и Национальной морской пехоты перестрелялись у берегов Алжира, при этом обе стороны понесли многочисленные потери и заявили о победе над другой.\n\nСамая серьезная горячая точка между британским и французским правительствами после инцидента в Фашоде и яркий пример растущей напряженности между двумя странами; еще неизвестно, какими будут результаты ныне известной битвы при Мерс-эль-Кебире." # [This.GetNewspaperHeader]At midday yesterday the escalating crisis between the British and French Governments over the accidental sinking of HMS Triton escalated further as Royal Navy and Marine Nationale warships exchanged fire off the coast of Algérie, with both sides suffering numerous losses and claiming victory over the other.\n\nThe most significant flashpoint between British and French Governments since the Fashoda Incident, and a clear example of the growing tensions between the two nations; it remains to be seen what the results will be of the now well-known Battle of Mers-el-Kébir.
 fxnews.60.a: "Франция не может противостоять мощи Королевского флота." # France cannot stand against the might of the Royal Navy
 fxnews.60.b: "Как и предполагалось, Королевский флот — беззубый тигр" # As suspected the Royal Navy is a toothless tiger
 fxnews.60.c: "Дураки дерутся между собой" # The fools fight amongst one another
 fxnews.60.e: "Франция и Великобритания снова оказались на грани войны." # France and Britain are once again on the brink of war.

 fxnews.61.t: "Англо-французское дипломатическое противостояние" # Anglo-French Diplomatic Stand-Off
 fxnews.61a.d: "[This.GetNewspaperHeader]В последние дни продолжается растущая дипломатическая ссора между британским и французским правительствами из-за восстания туземцев против британского правления в Восточной Африке. Первоначально французское правительство выступило с официальным осуждением усилий британского правительства по подавлению восстания, в ответ британское правительство недавно выразило официальный дипломатический протест по поводу предполагаемого вмешательства Франции в их дела.\n\nНа данный момент неизвестно, как долго продлится восстание, но это просто еще один признак плохих отношений между двумя бывшими союзниками." # [This.GetNewspaperHeader]In recent days a growing diplomatic spat between the British and French Government has been continuing over a native revolt against British rule in East Africa. Initially the French Government issued a formal condemnation of the British Government in its efforts to quell the revolt, in response the British Government has recently issued a formal diplomatic protest over perceived French meddling in their affairs.\n\nIt is unknown at this time how long the revolt will last, but this is simply another sign of poor relations between the two former allies.
 fxnews.61b.d: "[This.GetNewspaperHeader]В последние дни продолжается растущая дипломатическая ссора между британским и французским правительствами из-за восстания туземцев против британского правления в Восточной Африке. Первоначально французское правительство выступило с официальным осуждением усилий британского правительства по подавлению восстания, в ответ британское правительство потребовало, чтобы французы официально отказались от своих заявлений, что до сих пор игнорировалось французским правительством.\n\nНа данный момент неизвестно, как долго продлится восстание, но это просто еще один признак плохих отношений между двумя бывшими союзниками." # [This.GetNewspaperHeader]In recent days a growing diplomatic spat between the British and French Government has been continuing over a native revolt against British rule in East Africa. Initially the French Government issued a formal condemnation of the British Government in its efforts to quell the revolt, in response the British Government demanded that the French issues a formal retraction of their statements which has so far been ignored by the French Government.\n\nIt is unknown at this time how long the revolt will last, but this is simply anotehr sign of poor relations between the two former allies.
 fxnews.61.a: "Французы должны перестать совать нос в дела других стран." # The French should stop sticking their noses in other nation's affairs.
 fxnews.61.b: "Британский империализм сделал Африку только хуже, чем раньше." # British Imperialism has only made Africa a worse place than before.
 fxnews.61.c: "Еще больше нестабильности в Африке" # More instability in Africa

 fxnews.62a.t: "Англо-французский дипломатический спор" # Anglo-French Diplomatic Row
 fxnews.62b.t: "Имперское эмбарго на французские товары" # Imperial Embargo on French Goods
 fxnews.62a.d: "[This.GetNewspaperHeader]В последние недели между Великобританией и Францией сложилась напряженная дипломатическая ситуация из-за действий Великобритании в подавлении восстания в Восточной Африке. Начавшееся с осуждения французами британского правления в Африке, но вскоре после того, как министерство иностранных дел Великобритании представило то, что они называют доказательством участия Франции в конфликте, оно лишь продолжало выходить из-под контроля, а напряженность в отношениях между обеими странами сейчас накаляется.\n\nВосстание в Восточной Африке, возможно, и подавлено, но его последствия продолжают ощущаться во Франции и Британии." # [This.GetNewspaperHeader]In recent weeks a tense diplomatic situation has developed between Britain and France over British handling of a revolt in East Africa. Initiated by a French condemnation of British rule in Africa - but closely followed by the British Foreign Ministry presenting what they call proof of French involvement in the conflict - it has only continued to spiral out of control with tensions now running high between both nations.\n\nThe East African revolt may have been put down, but its effects are continuing to be felt in France and Britain.
 fxnews.62b.d: "[This.GetNewspaperHeader]В последние недели между Великобританией и Францией сложилась напряженная дипломатическая ситуация из-за действий Великобритании в подавлении восстания в Восточной Африке. Начавшаяся с осуждения Францией британского правления в Африке, но вскоре после того, как Министерство иностранных дел Великобритании представило то, что они называют доказательством участия Франции в конфликте, она только продолжала выходить из-под контроля, а напряженность в отношениях между обеими странами сейчас накаляется.\n\nСегодня утром британский министр иностранных дел опубликовал совместную имперскую декларацию относительно предполагаемого участия Франции в восстании в Восточной Африке. Недвусмысленно заявив, что такое вмешательство недопустимо, представители Империи объявили о планах ввести эмбарго на французские товары в обозримом будущем." # [This.GetNewspaperHeader]In recent weeks a tense diplomatic situation has developed between Britain and France over British handling of a revolt in East Africa. Initiated by a French condemnation of British rule in Africa - but closely followed by the British Foreign Ministry presenting what they call proof of French involvement in the conflict - it has only continued to spiral out of control with tensions now running high between both nations.\n\nThis morning the British Foreign Minister issued a joint Imperial declaration regarding supposed French involvement in the East Africa Revolt. Stating unquivocally that such interference could not be tolerated, the Imperial representatives announced plans to embargo French goods for the forseeable future.
 fxnews.62.a: "Французы должны перестать совать нос в дела других стран." # The French should stop sticking their noses in other nation's affairs.
 fxnews.62.b: "Британский империализм сделал Африку только хуже, чем раньше." # British Imperialism has only made Africa a worse place than before.
 fxnews.62.c: "Еще больше нестабильности в Африке" # More instability in Africa

 fxnews.63.t: "Кризис Панамского канала" # The Panama Canal Crisis
 fxnews.63.d: "[This.GetNewspaperHeader]Сообщения из Панамского канала за последние несколько дней показали, что в нескольких ключевых стратегических точках вблизи канала происходили спорадические боевые действия, однако только сегодня утром правительство Соединенных Штатов официально подтвердило произошедшее.\n\nВ 5 часов утра в пятницу на прошлой неделе отряд Королевской морской пехоты высадился возле канала с намерением восстановить контроль над территорией и передать право собственности Британской империи. Вашингтон с тех пор пригрозил жесткой реакцией на захват, и до сих пор не уверен, может ли это привести к войне между Британской империей и Соединенными Штатами." # [This.GetNewspaperHeader]Reports from the Panama Canal over the past several days have indicated that there was sporadic fighting occurring in several key strategic locations near the Canal, however it was not until this morning that the United States Government officially confirmed what had happened.\n\nAt 5 o'clock on Friday last week a contigent of Royal Marines landed near the Canal with the intention of resting control of the area and handing ownership over to the British Empire. Washington has since threatened a severe reaction to the seizure, and it is still unsure if this may lead to war between the British Empire and the United States.
 fxnews.63.a: "Интересно..." # Interesting...

 fxnews.64.t: "Мирный конец в полночь" # A Peaceful Ending at Midnight
 fxnews.64.d: "[This.GetNewspaperHeader]Король Георг V мертв. Сегодня утром к воротам Букингемского дворца была прикреплена записка, в которой сообщалось, что король мирно скончался во сне прошлой ночью в окружении своей семьи. Его сын, принц Уэльский, также должен принять титул короля Эдуарда VIII.\n\nЧеловек, известный своей любовью к семье и стране, тысячи людей вышли на улицы по всей Британской империи, от Виннипега до Веллингтона, чтобы оплакать потерю одного из самых любимых монархов в своей истории." # [This.GetNewspaperHeader]King George V is dead. This morning a note was attached to the gates of Buckingham Palace, it announced that the King had died peacefully in his sleep last night surrounded by his family. His son the Prince of Wales is set to assume the title of King Edward VIII it was declared as well.\n\nA man known for his love of both family and country, thousands have taken to the streets across the British Empire, from Winnipeg to Wellington, to mourn the loss of one of the most beloved monarchs in their history.
 fxnews.64.a: "Больше, чем король, отец великого семейства" # More than a King, a father of a great family
 fxnews.64.b: "Новый король. Новая Империя?" # A new King. A new Empire?

 fxnews.65.t: "Формирование Второго Северного Альянса" # Formation of Second Northern Alliance
 fxnews.65.d: "[This.GetNewspaperHeader]История Японии на протяжении столетия представляла собой сёгунат, военизированное феодальное правительство с военным диктатором. При усиленной и приватизированной военной мощи императорский дом не мог быть истинным правителем собственными силами. А в другой раз страна восхода солнца попала в давний период Сэнгоку, войну за определение истинного военного повелителя. После длительного периода правления Сэнгоку клан Токугава удерживает контроль над японскими островами и положил конец давней войне, став сёгунатом Токугава. При мощи сёгуна императорский дом до сих пор не имеет себе равных по военной мощи. До Реставрации Мэйдзи императорский дом получал власть от сторонников Соно Дзёй, и сёгуната больше не существовало. Но сегодня Япония находится под милитаристским режимом, принц Токугава Иэсато провозгласил основу нового западного демократического движения и поклялся изгнать ультрамилитаризм со священного острова. Второй Северный Альянс пришел на смену прежнему Северному Альянсу, который был впервые основан сторонниками Сёгуна для поддержания идеала военно-демократического режима в Японии." # [This.GetNewspaperHeader]The history of Japan has accorded over the century of Shogunate, the militarized feudal government with a military autocrat. With the strengthened and privatized military power, the imperial house could not be the true ruler with their own strength. And another time, the land of sunrise fell into the long-time Sengoku period, the war of defining true military overlord. After the long period of Sengoku, the Tokugawa clan holds the grasp of Japanese islands and end the long-time war, becoming Tokugawa Shogunate. With the power of the Shogun, the imperial house still has no equal in military power. Until the Meiji Restoration, the imperial house gained power from Sonno Joi loyalists and Shogunate is no more. But today Japan is under militarist regime, Prince Tokugawa Iesato has declared the foundation of new western democratic movement and vowed to expel the ultramilitarism from the sacred island. The Second Northern Alliance succeeded the former Northern Alliance, which was first founded by Shogun’s loyalists to hold the ideal of a military democratic regime in Japan.
 fxnews.65.a: "Факел свободы зажёгся над Востоком" # The torch of liberty has been lit over the East

 fxnews.66.t: "Переворот австралийской гвардии" # Australasian Guard Coup
 fxnews.66.d: "[This.GetNewspaperHeader]Шокирующие новости от [AST.GetNameDef]: Австралийская гвардия, группа правых авторитарных деятелей, ярых антибольшевистских и промонархистских настроений, штурмовала австралийский парламент в Канберре и захватила контроль над правительством.\n\nНовое правительство, возглавляемое фельдмаршалом Томасом Блейми, немедленно пообещало, что [AST.GetNameDef] сделает все возможное, чтобы восстановить порядок в стране, и немедленно отменит все усилия по превращению нации в республика за пределами Британской империи. Некоторые рассматривают это как восстановление статус-кво, хотя вполне вероятно, что эта нестабильность означает дальнейшие проблемы для страны." # [This.GetNewspaperHeader]Shocking news from [AST.GetNameDef] as the Australian Guard, a group of right-wing authoritarians who are vehemently anti-bolshevist and pro-monarchist, have stormed the Australian parliament in Canberra and seized control of the government.\n\nLed by Field Marshal Thomas Blamey, the new government immediately promised [AST.GetNameDef] would do whatever it took to restore order in the nation and would immediately reverse all efforts to transform the nation into a republic outside of the British Empire. Some are viewing this as a restoration of the status quo, though it seems likely that this instability means further trouble ahead for the country.
 fxnews.66.a: "Как неожиданно." # How unexpected.

 fxnews.67.t: "Коронация Афтократора" # The Aftokrátor's Coronation
 fxnews.67.d: "[This.GetNewspaperHeader]Сегодня первого византийского императора с 1449 года короновал Его Всесвятейшество Вениамин I Константинопольский. Однако сначала Император должен был дать обет:\nКлянусь Именем Святой, Равной и Неделимой Троицы, быть верным Отечеству, управлять справедливо и доброжелательно и добросовестно исполнять свои обязанности.\nЗатем он был коронован. Сзади слышались псалмы:\nОтдай царю суды Твои, Боже, и правду Твою царскому сыну. Он будет судить народ твой по правде и бедных твоих по правде. (...) Имя Его пребудет вовек (...) и благословятся в Нем люди: все народы назовут Его благословенным. Благословен Господь Бог, Бог Израилев, творящий только чудеса. И благословенно славное имя Его во веки веков, и да наполнится вся земля славою Его; Аминь, аминь.\n»Склоните головы перед Господом\n«Тебе, Господи\nЕму тогда было даровано имя Афтократор Георгий II" # [This.GetNewspaperHeader]Today, the first Byzantine Emperor since 1449 was crowned by His All-Holiness Benjamin I of Constantinople. The Emperor first though, had to Vow:\nI swear in the Name of the Holy and Co-equal and Indivisible Trinity, to be faithful to the Fatherland, to govern with justice and benevolence and to conscientiously fulfil my duties.\nThen he was crowned. Psalms could be heard from behind:\nGive the king thy judgments, O God, and thy righteousness unto the king's son. He shall judge thy people with righteousness, and thy poor with judgment. (...) His name shall endure for ever (...) and men shall be blessed in him: all nations shall call him blessed. Blessed be the Lord God, the God of Israel, who only doeth wondrous things. And blessed be his glorious name for ever: and let the whole earth be filled with his glory; Amen, Amen.\n»Bow your heads to the Lord\n«To you, O Lord\nHe was then bestowed the name Aftokrátor George II
 fxnews.67.a: "Евлогитос или Теос Тон Афтократора эвлогито." # Evlogitós o Theós tón Aftokrátora evlogeíto.

 fxnews.68.t: "Черный атаман мертв" # The Black Ataman is Dead
 fxnews.68.d: "[This.GetNewspaperHeader]Человек, проложивший путь к власти в качестве атамана небольшого кавалерийского отряда во время восточноевропейской войны Верховному лидеру Беларуси, получил ранения, вызванные нападением неизвестного; убивая его мгновенно. Генерал Станислав Булак-Балахович держал Беларусь в своих руках более 13 лет, за это время он столкнулся с немалым количеством вызовов, ставивших под угрозу существование молодой нации. Крайним последствием его правления стало формирование дуализма между Национал-социалистической партией и Ополчением. С тех пор дальнейших сообщений было мало, но многочисленная непроверенная информация предполагает, что назревает борьба за власть между Ополчением и партией." # [This.GetNewspaperHeader]The man who paved his way to power as the Ataman of a small cavalry unit during the Eastern European war to the Supreme Leader of Belarus suffered injuries caused by an attack from an unknown assailant; killing him instantly. General Stanislav Bulak-Balakhovich held Belarus in his hands for more than 13 years, during that time he confronted a considerable number of challenges that threatened the existence of the young nation.\nThe extreme consequence of his rule was the formation of a dualism between the National-Socialist Party and the Home Guard. Further reports has been scarce ever since, but multiple unverified information speculates that the a power struggle betweent the Home Guard and the Party is brewing.
 fxnews.68.a: "Я чувствую кровопролитие на белорусских землях..." # I sense bloodshed in the Belarussian lands...

 fxnews.69.t: "Роспуск Комиссии" # Don't add [ISC.GetName] as title becomes too big to fit # The Dissolution of the Commission
 fxnews.69.d: "[This.GetNewspaperHeader]Поскольку взаимная вражда между Грецией и Турцией достигла рекордно высокого уровня, были проведены переговоры с целью успокоить напряженность, кульминацией которых стал роспуск Международной комиссии по проливам и разделение ее активов между двумя странами.\n\nРасстроенные их отсутствием участия, крупнейшие мировые державы подали протест, жалуясь на то, что ни одна страна не проинформировала и не проконсультировалась с заинтересованными державами о роспуске комиссии. Несмотря на опровержения со стороны обоих правительств, которые заявляют, что соглашение было необходимо для предотвращения новой войны, шаги, которые недавно предприняли Анкара и Афины, лишь указывают на то, что новая греко-турецкая война остается возможной, поскольку судьба Проливов висит на волоске." # [This.GetNewspaperHeader]With mutual enmity between Greece and Turkey reaching an all-time high, negotiations have been held to calm tensions, culminating in the dissolution of the International Straits Commission and the division of its assets between the two nations.\n\nUpset at their lack of involvement, the major world powers have lodged a protest, complaining that neither nation had informed nor consulted the interested powers in the dissolution of the commission. Despite rebuttals by both governments which declare that the agreement was necessary to prevent another war, the steps that both Ankara and Athens have recently taken only indicate that another Greco-Turkish war remains a possibility as the fate of the Straits hangs in the balance.
 fxnews.69.a: "Как очень неожиданно..." # How very unexpected...
 fxnews.69.b: "Почему они не проконсультировались с нами?" # Why did they not consult us?
 fxnews.69.c: "Необходимый шаг." # A necessary step.
 fxnews.69.e: "Мировой порядок Антанты постепенно рушится." # The Entente's world order crumbles little by little.

 fxnews.70.t: "Крах лондонской фондовой биржи" # The London Stock Market Crash
 fxnews.70.d: "[This.GetNewspaperHeader]Прошедшая неделя выдалась бурными пятью днями для Лондонского фондового рынка. Подпитываемая опасениями по поводу нехватки товаров и ресурсов из-за продолжающегося восстания в колониальной Африке и Индии, фондовая биржа продолжала резко меняться, поскольку из Вестминстера приходили новости о попытках предотвратить дальнейшее восстание по всей Империи.\n\nВ течение дня последовали массовые распродажи, поскольку охваченные паникой инвесторы потеряли доверие к имперской экономике и способности британского правительства справиться с колониальным кризисом.\n\nПоследствия Лондонской фондовой биржи 1936 года Крах наверняка будет ощущаться во всем мире." # [This.GetNewspaperHeader]Last week saw a tumultuous five days for the London Stock Market. Fuelled by fears of a shortage of goods and resources due to the on-going revolt in colonial Africa and India, the stock exchange continued to vary wildly as news dripped out from Westminster regarding efforts to prevent further insurrection throughout the Empire.\n\nAs the day proceeded, mass selling ensued as panic-stricken investors lost confidence in the Imperial economy and the British Government's ability to tackle the colonial crisis.\n\nThe effects of the 1936 London Stock Market Crash are sure to be felt world-wide.
 fxnews.70.a: "Боже, помоги нам всем..." # God help us all...

 fxnews.71.t: "Ремилитаризация Константинополя" # The Remilitarization of Constantinople
 fxnews.71.d: "[This.GetNewspaperHeader]После убийства бывшего султана Абдулмеджида II многие группировки внутри Турции боролись за власть, и среди них появились туранисты во главе с Хусейном Нихал-беем. Одной из его первых целей на посту была ремилитаризация Константинополя, который после окончания Великой войны был объявлен державами Антанты демилитаризованной зоной. Многие во всем мире обеспокоены, задаваясь вопросом, может ли это стать подъемом реваншистской Турции. Источники сообщают, что Греция также была в бешенстве из-за этого события, планируя свой следующий шаг." # [This.GetNewspaperHeader]After the assassination of the former Sultan, Abdülmecid II, many factions within Turkey were vying for power and, among them, emerged the Turanists lead by Hüseyin Nihal Bey. One of his first goals in office was the remilitarization of Constantinople, which was made a demilitarized zone by the Entente powers upon the conclusion of the Great War. Around the world, many are worried, wondering if this could be the rise of a revanchist Turkey. Sources say that Greece has also been thrown into a frenzy by this event, planning their next move.
 fxnews.71.a: "Тревожно." # Worrying.

 fxnews.72.t: "Парижская колониальная выставка" # The Paris Colonial Exposition
 fxnews.72.d: "[This.GetNewspaperHeader]Несколько часов назад Франция объявила об открытии Парижской колониальной выставки после нескольких месяцев тщательного планирования. Франция, столкнувшись с чрезмерной критикой своих колониальных владений со стороны других стран, таких как Германия и СССР, решила провести фестиваль, посвященный демонстрации огромных ресурсов ее колоний, среди множества других предметов. \n\nВ этом событии приняло участие множество других стран, особенно других стран, владеющих колониями. Тем не менее, мероприятие планируется продлить еще на несколько месяцев, пока оно не будет закрыто по усмотрению Франции; несмотря на осуждение со стороны немецкого и советского правительств." # [This.GetNewspaperHeader]A few short hours ago, France has declared the Paris Colonial Exposition to be open after months of extensive planning. France, after facing excessive flak for their colonial holdings from other nations such as Germany and the USSR, has decided to hold a festival dedicated to displaying the vast resources of her colonies, amongst a multitude of other subjects. \n\nA multitude of other nations has participated in this event, particularly other nations possessing Colonies. Nonetheless, the event is planned to continue for another few months, until it is closed at France's discretion; despite condemnations from the German and Soviet Governments.
 fxnews.72.a: "Весьма опыт!" # Quite the experience!
 fxnews.72.b: "Похоже, они пытаются оправдать свой империализм." # Seems like they're trying to justify their Imperialism.
 fxnews.72.c: "Да здравствует Республика!" # Vive l'Republique!

 fxnews.73.t: "Государственный переворот в Париже" # Coup d'état in Paris
 fxnews.73.d: "[This.GetNewspaperHeader]При неожиданном повороте событий вчера вечером Французская Республика пала в результате государственного переворота, совершенного их военными. Это событие было объявлено Филиппом Петэном вскоре после того, как французские военные подразделения захватили различные правительственные здания и задержали нескольких бывших правящих политиков. \nНеспособность Франции противостоять Германии на протяжении всего ее дипломатического противостояния в последние несколько месяцев, конечно, не была встречена с энтузиазмом французскими военными. Фельдмаршал Филипп Петен и адмирал Франсуа Дарлан организовали военный переворот, полагая, что если Франция позволит Германии продолжить наступление через континент; В конечном итоге Франция вообще не сможет бросить им вызов. Тем не менее, можно с уверенностью сказать, что в ближайшие месяцы Франция будет более жесткой в ​​своей дипломатии." # [This.GetNewspaperHeader]In an unexpected turn of events, the French Republic has fallen to a coup by their Military last night, the event was proclaimed by Philippe Petain shortly after French Military units seized various Governmental buildings and detained multiple formerly governing politicians. \nFrance's failure to confront Germany throughout their diplomatic standoffs in the past few months certainly wasn't met with enthusiasm by the French military. Field Marshal Philippe Pétain and Admiral François Darlan organized a military coup under the belief that if France was to allow a continued German advance across the continent; France would eventually be unable to challenge them at all. Nonetheless, it can be said with certainty that France will be more firm with her diplomacy in the coming months.
 fxnews.73.a: "Упадочная демократия превращается в упадочную диктатуру." # A decadent democracy turns into a decadent dictatorship.
 fxnews.73.b: "Еще одно пламя европейской демократии погашено..." # Yet another flame of European democracy is snuffed out...
 fxnews.73.c: "Смерть — ничто, но жить побежденным и бесславным — значит умирать ежедневно." # Death is nothing, but to live defeated and inglorious is to die daily.
 fxnews.73.e: "Французский народ знал свое место, а их армия еще не научилась этому." # The French people knew their place, their military has yet to learn.

 fxnews.74.t: "Немецкая оккупация Австрии" # German Occupation of Austria
 fxnews.74.d: "[This.GetNewspaperHeader]В последние недели череда плохих решений новоизбранного правительства Австрии привела к вспышке хаоса внутри страны. Похоже, что немецкий фюрер Адам Дресслер очень хотел воспользоваться ситуацией. Без какого-либо официального предупреждения немецкие войска продвинулись в Австрию, заняв несколько ключевых мест с предполагаемой целью «поддержания порядка в регионе». Вскоре Австрия оказалась под полной милостью Германии, которая, что неудивительно, «настояла», чтобы Австрийский национальный совет провел голосование по поводу объединения двух наций «ради взаимной безопасности». Результаты были решительно про-профсоюзными: 106 из 165 членов Национальной крысы проголосовали за Союз. Однако честность голосования сомнительна, поскольку безжалостная немецкая Thuleschutztruppe активно присутствовала в Национальном крысолове во время голосования." # [This.GetNewspaperHeader]In recent weeks, a string of poor decisions from Austria's newly elected Government led to an outburst of chaos within the nation. It seems that the German Fuhrer, Adam Dressler, was keen on taking advantage of the situation. Without any formal warning, German troops advanced into Austria, occupying several key locations, with the alleged goal of 'maintaining order within the region'. Austria was soon under the complete mercy of Germany, who unsurprisingly \"insisted\" that the Austrian Nationalrat held a vote concerning the unification of the two nations 'for the sake of mutual security'. The results were decisively Pro-Union, with 106 out of the 165 members of the Nationalrat ruling in favour of Union. However, the honesty of the vote is dubious, as the ruthless German Thuleschutztruppe was heavily present in the Nationalrat during the vote.
 fxnews.74.a: "Мы не можем позволить Германии аннексировать народы направо и налево!" # We cannot allow Germany to annex nations left-and-right!
 fxnews.74.b: "Кажется, Австрия окончательно канула в глубины учебников истории." # It seems Austria has finally faded into the depths of history books.
 fxnews.74.c: "Немцы повсюду должны быть едины!" # Germans everywhere must stand united!

 fxnews.75.t: "Хаос в Киле" # Chaos in Kiel
 fxnews.75.d: "[This.GetNewspaperHeader]История Кильской зоны с момента ее создания была невероятно бурной. Первоначально созданный как оккупационная зона держав Антанты для сохранения контроля над Кильским каналом, он оказался горячей точкой для немецких социалистов, а также стал местом рождения странного прототипа идеологии, известной как «Национальный коммунизм». В 1927 году произошло восстание Первой Гамбургской коммуны, которая почти одержала победу над датскими оккупационными силами, однако едва была побеждена из-за сочетания плохой организации со стороны Коммуны и нескольких удач со стороны Датчане. В последние дни датская администрация в Кильской зоне вызвала серию беспорядков, которые вышли далеко за пределы их контроля, спровоцировав восстание Второй Гамбургской Коммуны." # [This.GetNewspaperHeader]The history of the Kiel Zone has been incredibly turbulent since its inception. Originally established as an occupation zone of the Entente powers in order to maintain control over the Kiel Canal, it proved to become a hotspot for German Socialists, and also became the birthplace for a strange prototype ideology known as 'National Communism'.\n1927 saw the uprising of the First Hamburg Commune, which nearly achieved victory over Danish occupying forces however was barely defeated due to a combination of poor organization on behalf of the Commune, and a few strokes of luck on behalf of the Danes. In recent days, the Danish Administration in the Kiel Zone caused a series of riots to escalate far beyond their control, instigating the uprising of the Second Hamburg Commune.
 fxnews.75.a: "Мы победим!" # We will be victorious!
 fxnews.75.b: "Очередная левая революция в Европе... Подождите, они же левые, да?" # Yet another leftist revolution in Europe... Wait, they're leftists, right?

 fxnews.79.t: "БН победил на выборах во Франции" # BN Victorious in French Elections
 fxnews.79.d: "[This.GetNewspaperHeader]Хотя французскую политическую сцену часто называют хаотичной, последствия дела Роллена полностью искоренили доминирование Национального блока во французской политике. Несмотря на это, Национальный блок одержал победу на недавних выборах во Франции.\n\nУспешно сохранив свои позиции в Национальной ассамблее, мало кто ожидает, что текущая политика Парижа изменится. Однако вероятная перспектива второй великой европейской войны заставила многих наблюдателей задуматься, сможет ли номинально суровое французское правительство защитить старый порядок от ревизионистских держав Европы." # [This.GetNewspaperHeader]Whilst the French political scene has been often known as a chaotic one, the fallout of the Rollin affair has totally uprooted the dominance of the National Bloc in French politics. In spite of this, the National Bloc has won the recent French elections.\n\nHaving successfully maintained their position in the National Assembly, few expect the current policies of Paris to change. However, the likely prospect of a second great European war has made many observers wonder if the nominally stern French government can protect the old order from the revisionist powers of Europe.
 fxnews.79.a: "Конечно, ничего не изменилось." # Of course nothing has changed.
 fxnews.79.b: "Кажется, в Париже царит стабильность." # Stability reigns in Paris, it seems.
 fxnews.79.c: "Это облегчение." # That's a relief.
 fxnews.79.e: "Они нас не остановят!" # They will not stop us!
 fxnews.79.f: "Республика сильнее единства!" # The Republic is stronger united!

 fxnews.80.t: "SFIO победил на выборах во Франции" # SFIO Victorious in French Elections
 fxnews.80.d: "[This.GetNewspaperHeader]Хотя французскую политическую сцену часто называют хаотичной, последствия дела Роллена полностью искоренили доминирование Национального блока во французской политике. На волне настроений против истеблишмента французская секция Рабочего Интернационала добилась успеха на выборах, став ведущей партией во Франции.\n\nБез сомнения, более радикальные, чем любое предыдущее французское правительство, обещания SFIO укрепить права трудящихся и обеспечить гегемонию Франции в Европе были хорошо приняты французской общественностью. Тем не менее, многие не уверены, сможет ли новое правительство выполнить свои обещания, поскольку на горизонте появляется вторая европейская война." # [This.GetNewspaperHeader]Whilst the French political scene has been often known as a chaotic one, the fallout of the Rollin affair has totally uprooted the dominance of the National Bloc in French politics. Riding a wave of anti-establishment sentiment, the French Section of the Workers’ International has achieved electoral success, becoming the leading party in France.\n\nNo doubt more radical than any previous French government, the SFIO’s promises of strengthening worker’s rights and ensuring France's hegemony in Europe have been well-received by the French public. Still, many are unsure if the new government can fufill their promises as a second European war appears on the horizon.
 fxnews.80.a: "Пффф, еще одна реформистская чушь." # Pfft, more reformist nonsense.
 fxnews.80.b: "Франция отклоняется влево." # France lurches to the left.
 fxnews.80.c: "Будем надеяться, что они останутся надежными..." # Let's hope they remain reliable...
 fxnews.80.e: "Еще одно доказательство того, что либерализм всегда ведет к большевизму." # Further proof that liberalism always leads to Bolshevism.
 fxnews.80.f: "Рабочие всего мира, объединяйтесь!" # Workers of the world, unite!

 fxnews.81.t: "PR одержал победу на выборах во Франции" # PR Victorious in French Elections
 fxnews.81.d: "[This.GetNewspaperHeader]Хотя французскую политическую сцену часто называют хаотичной, последствия дела Роллена полностью искоренили доминирование Национального блока во французской политике. Воспользовавшись этой возможностью, Радикальная партия стала новыми лидерами Франции.\n\nВыполняя более либеральную повестку дня, чем предыдущие правительства, радикалы взяли на себя обязательство предоставить французскому народу дополнительные возможности для успеха, а также пообещали сделать все возможное, чтобы удержать Францию ​​от второй великой европейской войны. Однако такие обещания кажутся все более маловероятными, поскольку вероятность новой Великой войны становится все более вероятной." # [This.GetNewspaperHeader]Whilst the French political scene has been often known as a chaotic one, the fallout of the Rollin affair has totally uprooted the dominance of the National Bloc in French politics. Capitalizing on this opportunity, the Radical Party have become the new leaders of France.\n\nRunning on an agenda more liberal than the previous governments, the Radicals have committed to giving the French people additional opportunities for success and have also promised to do what it takes to keep France out of a second great European war. Such promises however seem ever more unlikely to be fufilled as the likelihood of another Great War becomes ever more likely.
 fxnews.81.a: "Республика остается в упадке..." # The Republic remains decadent...
 fxnews.81.b: "Сможет ли это вдохновить на радикальные перемены?" # Will this inspire radical change?
 fxnews.81.c: "Неужели они не знают о немецкой угрозе?" # Are they not aware of the German threat?
 fxnews.81.e: "Франция продолжает погружаться в деградацию." # France devolves further into degeneracy.
 fxnews.81.f: "За свободу!" # For liberty!

 fxnews.82.t: "ARD победила на выборах во Франции" # ARD Victorious in French Elections
 fxnews.82.d: "[This.GetNewspaperHeader]Хотя французскую политическую сцену часто называют хаотичной, последствия дела Роллена полностью искоренили доминирование Национального блока во французской политике. Тем не менее, после недавних выборов ранее доминировавший Демократический республиканский альянс теперь безраздельно господствует.\n\nБывшая крупнейшая фракция Национального блока, победа ARD означает, что Париж вряд ли радикально изменит курс. Тем не менее, многие задаются вопросом, сможет ли новое французское правительство, которое сейчас придерживается более резкого мнения о валкистской Германии, задачу поддержания мира в существующем европейском порядке, поскольку призрак войны маячит все ближе." # [This.GetNewspaperHeader]Whilst the French political scene has been often known as a chaotic one, the fallout of the Rollin affair has totally uprooted the dominance of the National Bloc in French politics. Nonetheless, the formerly dominant Democratic Republican Alliance now reigns supreme following the recent elections.\n\nFormerly the largest faction of the National Bloc, the victory of the ARD means that it is unlikely for Paris to drastically change course. Nevertheless, many wonder if the new French government, now wielding a harsher opinion of Valkist Germany are up to the task of maintaining peace in the existing European order as the spectre of war looms closer.
 fxnews.82.a: "Чего еще мы ожидали?" # What else did we expect?
 fxnews.82.b: "Франция сохраняет свой курс." # France maintains her course.
 fxnews.82.c: "Это облегчение." # That's a relief.
 fxnews.82.e: "Они нас не остановят!" # They will not stop us!
 fxnews.82.f: "За Республику!" # For the Republic!

 fxnews.83.t: "Маршал остается" # The Marshal Remains
 fxnews.83.d: "[This.GetNewspaperHeader]С концом французской демократии многие предсказывали, что 80-летний маршал уйдет в отставку после своего последнего крупного поступка. Однако эти прогнозы оказались ошибочными, поскольку, несмотря на массовую оппозицию, Филипп Петен решил остаться лидером Франции.\n\nНайдя поддержку со стороны корпоративных и крайне правых сторонников, режим Петена стремится осуществить «национальную революцию» с целью создания технократического правительства. Помимо этого, правительство, скорее всего, продолжит новую жесткую позицию, которую Франция занимает в отношении ревизионистских держав Европы, поскольку угроза войны, похоже, все больше приближается к реальности." # [This.GetNewspaperHeader]With the end of French democracy, many predicted that the 80 year old Marshal would retire after his last major action. However, these predictions have been proven wrong as in spite of mass opposition, Philippe Pétain has elected to remain as the leader of France.\n\nFinding support from corporate and far right supporters, Pétain’s regime seeks to bring about a \"National Revolution\" with the goal to create a technocratic government. Besides this, the government is also likely to continue the renewed harsh stance that France holds against the revisionist powers of Europe as the threat of war seems to creep further into reality.
 fxnews.83.a: "Республика показывает свое истинное лицо." # The Republic shows its true colors.
 fxnews.83.b: "Республика ушла." # The Republic is gone.
 fxnews.83.u: "Как маршал мог это сделать?" # How could the Marshal do this?
 fxnews.83.c: "Франция всегда нуждалась в лидерстве" # France always needed some leadership
 fxnews.83.e: "Старый дурак слишком сильно рискует своей удачей." # The old fool is pushing his luck too far
 fxnews.83.f: "Маршал, мы идем!" # Maréchal, nous voilà!

 fxnews.84.t: "Французское действие «Захватить власть»" # Action Française Seize Power
 fxnews.84.d: "[This.GetNewspaperHeader]С концом французской демократии многие предсказывали, что 80-летний маршал уйдет в отставку после своего последнего крупного поступка. Однако мало кто мог предсказать, кто придет ему на смену. Опираясь на волну народной поддержки со стороны церкви и сторонников монархистов, французское действие стало новым боссом в Париже.\n\nЯростно антисемитское и упорно выступающее против либерализма и республиканизма, предстоящее восстановление Королевства Франции также сочетается с заметным ростом антигерманских и ксенофобских настроений в Париже, что еще больше нарушает послевоенный европейский порядок, поскольку война в Европе кажется неизбежной." # [This.GetNewspaperHeader]With the end of French democracy, many predicted that the 80 year old Marshal would retire after his last major action. However, few could have predicted who would have replaced him. Riding on a wave of popular support by the church and monarchist supporters, French Action has become the new boss in Paris.\n\nVirulently antisemitic and doggedly against liberalism and republicanism, the impending restoration of the Kingdom of France has also been coupled with a marked rise in anti-German, xenophobic sentiments in Paris, further disturbing the post-war European order as war in Europe appears inevitable.
 fxnews.84.a: "Реакция порождает новую реакцию." # Reaction begets more reaction.
 fxnews.84.b: "тревожный" # Disturbing
 fxnews.84.u: "О, Боже..." # Dear god...
 fxnews.84.c: "Республика всегда была обречена на провал." # The Republic was always doomed to fail.
 fxnews.84.e: "Как будто Реакция может остановить Рейх!" # As if Reaction can stop the Reich!
 fxnews.84.f: "Да здравствует король!" # Vive le roi!

 fxnews.85.t: "Восстание полковника" # The Rise of the Colonel
 fxnews.85.d: "[This.GetNewspaperHeader]С концом французской демократии многие предсказывали, что 80-летний маршал уйдет в отставку после своего последнего крупного поступка. При широкой народной поддержке французской общественности Франсуа де Ла Рок стал новым лидером Франции.\n\nЛидер Французской социальной партии де Ла Рок пообещал вернуть Францию ​​к ее корням и создать новую систему, не основанную на либеральном капитализме, полностью заменив старую республику. В стремлении сдержать экспансию Германии еще предстоит увидеть, как новая республика справится с растущей напряженностью в Европе, поскольку, похоже, приближается вторая Великая война." # [This.GetNewspaperHeader]With the end of French democracy, many predicted that the 80 year old Marshal would retire after his last major action. With major popular backing from the French public, François de La Rocque has become the new leader of France.\n\nThe leader of the French Social Party, de La Rocque has promised to bring France back to her roots and to create a new system not based in liberal capitalism, replacing the old republic altogether. Seeking to contain Germany’s expansion, it remains to be seen how the new republic will deal with the rising tensions across Europe as a second Great War seems forthcoming.
 fxnews.85.a: "Республика показывает свое истинное лицо" # The Republic shows its true colors
 fxnews.85.b: "Вернется ли Республика?" # Will the Republic return?
 fxnews.85.u: "Интересно..." # Interesting...
 fxnews.85.c: "Будут ли они чем-то отличаться от Республики?" # Will they be any different from the Republic?
 fxnews.85.e: "Полковнику-выскочке нечего бояться." # An upstart colonel is nothing to be scared about.
 fxnews.85.f: "Социальное прежде всего!" # Social d'abord!

 fxnews.86.t: "Коммунисты получили большинство на выборах в Италии" # Communists Win Majority In Italian Election
 fxnews.86.d: "[This.GetNewspaperHeader]Коммунистическая партия неожиданно одержала победу на выборах в Италии в 1936 году. Хотя результаты весьма противоречивы, доказательств мошенничества обнаружено мало. Экономическая катастрофа «Черной среды» подтолкнула многих итальянских избирателей к крайним политическим крайностям. Однако это не помешало многим правым протестовать против их победы. Коммунисты уже давно вызывают социальные волнения в Италии, требуя радикальных социальных и правовых изменений. Многие обеспокоены тем, что это может стать концом итальянской демократии в том виде, в каком мы ее знаем, а некоторые даже утверждают, что лидер партии Антонио Грамши, который, по слухам, имеет связи с Советским Союзом, может создать единое партийное государство. Эти выборы серьезно дестабилизировали как Антанту, так и Западную Европу в целом." # [This.GetNewspaperHeader]In a surprise victory, the Communist party have won the the 1936 Italian election. While the results are very controversial little eveidence of fraud can be found. The economic disaster of Black Wednesday pushed many Italian voters to the extreme ends of politics. This has not stopped many on the right from protesting against their victory though. The Communist have had a long history of causing social unrest in Italy with demands of sweeping social and legal changes. Many are worried that this may be the end of Italian democracy as we know it and some even claim that party leader Antonio Gramsci, who is rumored to have connections with the Soviet Union, may create a single party state. This election has majorly destablised both the Entente and western Europe as a whole.
 fxnews.86.a: "Революция марширует на запад!" # The Revolution marches west!

 fxnews.87.t: "Либералы сохранили большинство на выборах в Италии" # Liberals Maintain Majority In Italian Election
 fxnews.87.d: "[This.GetNewspaperHeader]Несмотря на некоторые ранние неудачи, Либеральная партия смогла добиться успеха и победить на выборах в Италии 1936 года. После «Черной среды» общественная поддержка партии значительно сократилась, но для основного итальянского избирателя либералы воспринимаются как наиболее разумная и практичная партия перед лицом постоянно меняющегося мира. Луиджи Эйнауди и его партии предстоят тяжелые несколько лет. Коммунисты обвиняют его экономическую политику невмешательства в недавнюю депрессию, охватившую Италию, в то время как правое крыло критикует его правительство за слабость и неэффективность. Несмотря на это, Либеральная партия еще какое-то время будет оставаться опорой итальянской политики." # [This.GetNewspaperHeader]Despite some early set backs the Partito Liberale were able to push through and win the 1936 Italian election. In the wake of Black Wednesday public support for the party had shruken quite considerable but to the mainstream Italian voter the Liberals are seen as the most sensible and practical party in the the face of an ever changing world. It will be a rough few years ahead for Luigi Einaudi and his party. The Communists blame his Laissez-faire economic policies for the recent depression impacting Italy while The right wing criticize his government for being weak and ineffectual. Despite this the Partito Liberale will continue to be a mainstay in Italian politics for some time
 fxnews.87.a: "Миру нужны более разумные политики." # The world needs more sensible politicians.

 fxnews.88.t: "Прогрессисты получили большинство на выборах в Италии" # Progressives Win Majority In Italian Election
 fxnews.88.d: "[This.GetNewspaperHeader]Социал-демократическая партия считалась единственной партией, способной победить Либеральную партию на выборах в Италии 1936 года, и после упорной кампании они вышли победителями. «Черная среда» показала многим итальянцам, что либеральная экономика не сможет обеспечить экономическую стабильность в стране. Многие избиратели-центристы, разочаровавшиеся в либералах, считают социал-демократов единственной разумной реформистской партией в Италии. Даже некоторые из наиболее умеренных коммунистов признают, что их победа может привести к столь необходимым реформам. Теперь, находясь у власти, прогрессисты, как мы надеемся, выполнят свои предвыборные обещания и введут в Италии систему социального обеспечения." # [This.GetNewspaperHeader]The Partito Socialdemocratico were seen to be the only party capable of beating the Partito Liberale in the 1936 Italian election and after a hard faught campaign they have come out victorious. Black Wednesday had shown many Italians that Liberal economics would not be able to bring economic stability to the country. Many centrist voters who have become disilusioned with the Liberals see the Social Democrats as the only sensible reformist party in Italy. Even some of the more moderate Communists admit that thier victory may bring much needed reforms. Now in power the Progressives will hopefully fulfill their campaign promises and introduce a welfare system to Italy.
 fxnews.88.a: "В смутные времена потребуются реформы." # In troubled times, reforms will be needed.

 fxnews.89.t: "Консерваторы получили большинство на выборах в Италии" # Conservatives Win Majority In Italian Election
 fxnews.89.d: "[This.GetNewspaperHeader]Неожиданным результатом на выборах в Италии 1936 года стала победа Народной партии под руководством Луиджи Стурцо. Большинство коммунистов и левых возмущены результатами, и многие уже начали протестовать на улицах. Луиджи Стурцо, похоже, это не беспокоит и обещает «разобраться» с экстремистами, которые угрожают стабильности Италии. Стурцо имеет долгую историю угроз насилия против левых, и в Италии, которая, похоже, находится на грани коммунистического восстания, многие считают его единственным человеком, который может гарантировать их безопасность. Когда дело доходит до иностранных дел, консерваторы обещают развивать итальянские колониальные территории и укреплять отношения с Великобританией и ее империей, а внутри страны они обязуются защищать традиционную итальянскую культуру и вести нацию к экономическому восстановлению." # [This.GetNewspaperHeader]In an unexpected outcome the Partito Popolare lead by Luigi Sturzo have won the 1936 Italian election. Most Communist and leftists are furious at the results and many have already started protesting in the streets. Luigi Sturzo does not seem to be worried by this though and promises to 'deal with' extremists who threaten the stability of Italy. Sturzo has a long history of threating violence against the Left and in an Italy that seems on brink of a Communist uprising many see him as the only person that can guarantee their safty. When it comes to foreign affairs the Conservatives promise to develop Italian colonial territories and stregnthen relations with Britain and her Empire and on the domestic side they pledge to protect traditional Italian culture and lead the nation towards economic recovery
 fxnews.89.a: "Миру нужны смелые лидеры." # The world needs bold leaders.

 fxnews.90.t: "Третья греко-турецкая война" # The Third Greco-Turkish War
 fxnews.90.d: "[This.GetNewspaperHeader]После Великой войны и без того сокращающаяся Османская империя была насильственно демонтирована, при этом большая часть ее территории была либо отдана, либо стала независимой. Самой болезненной из всех этих потерь была потеря старой столицы Константинополя. Многие наблюдатели предсказывали, что когда-то турецкое государство было жемчужиной империи, оно останется слабым и коррумпированным государством.\n\nНесмотря на эти прогнозы, Порта восстановилась и теперь чувствует себя достаточно сильной, чтобы противостоять тому, что она считает иностранной оккупацией своих территорий. Поскольку Анкара и Афины снова начинают сражаться на полях Анатолии, многие задаются вопросом, какие последствия очередная региональная война означают для мира, поскольку послевоенный порядок 1919 года, похоже, начинает рушиться." # [This.GetNewspaperHeader]In the aftermath of the Great War, the already shrinking Ottoman Empire was forcibly dismantled, with much of its territory either given away or made independent. Most stinging of all of these losses was the loss of the old capital, Constantinople. Once the crown jewel of the empire, many observers predicted that the Turkish state would remain a weak, corrupt rump state.\n\nIn spite of these predictions, the Porte has rebounded, now feeling strong enough to confront what it views as foreign occupation of its territories. As Ankara and Athens begin to duke it out on the fields of Anatolia once again, many wonder what the consequences of yet another regional war means for peace as the postwar order of 1919 seemingly begins to crumble.
 fxnews.90.a: "Еще одна война на Балканах?" # Another war in the Balkans?
 fxnews.90.b: "Реакционная борьба, типичная" # Reactionary infighting, typical
 fxnews.90.s: "Мы должны поддержать наших греческих товарищей!" # We must support our Greek comrades!
 fxnews.90.c: "Турки будут усмирены раз и навсегда!" # The Turks will be pacified once and for all!
 fxnews.90.e: "Мы освободим нашу Родину!" # We will liberate our homeland!
 fxnews.90.f: "Царство террора Запада подходит к концу" # The West's reign of terror is coming to an end

 fxnews.91.t: "Коммунистический переворот в Италии" # Communist Coup In Italy
 fxnews.91.d: "Коммунистическая партия Италии, предчувствуя крах «черной среды», настаивала на проведении множества реформ, чтобы помочь Италии восстановиться, но оппозиционные партии успешно заблокировали их законодательство. Массовая безработица привела к тому, что многие люди поддержали коммунистов и с небывало высокими намерениями инициировали государственный переворот. При подозрении на поддержку со стороны Советского Союза Антонио Грамши вывел своих сторонников на улицы Рима и оттуда, при поддержке местных армейских подразделений, легко смог занять большинство правительственных зданий. После непродолжительного, но напряженного противостояния прежнее правительство уступило коммунистам, чтобы избежать полноценной гражданской войны. Теперь, когда коммунисты контролируют ситуацию, ожидается множество радикальных реформ как в итальянской культуре, так и в экономике." # Ever sense the crash of Black Wednesday, the Italian Communist party have pushed for many reforms to help Italy recover but opposition parties have successfully blocked their legislation. Mass unemployment has lead to many people supporting the Communists and with tentions at an all time high they have initiated a coup d'etat. With suspected support from the Soviet Union, Antonio Gramsci has lead supporters into the streets of Rome and from there, with the support of local army divisions, were easily able to occupy most government buildings. After a brief but tense standoff the former government yielded to the Communist to avoid a full fledged civil war. Now that the Communists are in control many drastic reforms to both Italian culture and the economy are expected.
 fxnews.91.a: "Революция марширует на запад." # The Revolution marches west.

 fxnews.92.t: "В Италии провалился коммунистический переворот" # Communist Coup Fails In Italy
 fxnews.92.d: "Коммунистическая партия Италии, предчувствуя крах «черной среды», настаивала на проведении множества реформ, чтобы помочь Италии восстановиться, но оппозиционные партии успешно заблокировали их законодательство. Массовая безработица привела к тому, что многие люди поддержали коммунистов и с небывало высокими намерениями предприняли попытку государственного переворота. При подозрении на поддержку со стороны Советского Союза Антонио Грамши вывел своих сторонников на улицы Рима и оттуда начал борьбу за захват зданий местного правительства. Вмешательство итальянской армии позволило отбросить коммунистические силы, и после нескольких часов боев Грамши был найден и арестован за государственную измену. Это стало серьезным ударом по делу коммунизма не только в Италии, но и в Европе в целом." # Ever sense the crash of Black Wednesday, the Italian Communist party have pushed for many reforms to help Italy recover but opposition parties have successfully blocked their legislation. Mass unemployment had lead to many people supporting the Communists and with tentions at an all time high they had attempted a coup d'etat. With suspected support from the Soviet Union, Antonio Gramsci had lead supporters into the streets of Rome and from there, fought to occupy local government buildings. Intervention from the Italian Army was able to push back the Communist forces and after several hours of fighting Gramsci was found and arrested for treason. This has been a major blow to the Communist cause, not just in Italy but in Europe as a whole.
 fxnews.92.a: "Настоящая победа прагматичной политики." # A true victory for pragmatic politics.

 fxnews.93.t: "Итальянская армия усмиряет Ливию" # Italian Army Pacifies Libya
 fxnews.93.d: "В результате резкого изменения колониальной политики итальянское правительство решило отменить всю автономию, ранее предоставленную регионам Ливии. Итальянские вооруженные силы высадились во многих прибрежных городах и готовятся обеспечить соблюдение нового законодательства. Повстанческие группы всегда были маргинальной проблемой в Ливии, но рост враждебности почти наверняка приведет к тому, что на их сторону примет еще больше ливийцев. Итальянское правительство обещает защитить безопасность всех жителей Ливии, как итальянцев, так и ливийцев, и что тем, кто будет следовать закону, не придется беспокоиться об увеличении военного присутствия. Большинство зарубежных экспертов полагают, что эта акция непременно приведет к затяжному конфликту, который будет стоить обеим сторонам огромных денег. Только время покажет, приведут ли эти радикальные меры к интеграции Ливии в большую Итальянскую империю." # In a dramatic change of colonial policy the Italian government has decided to repeal all autonomy previously given to the regions of Libya. Italian armed forces have landed in many coastal cities and are preparing to enforce the new legislation. Rebel groups have always been a fringe problem in Libya but the increase hostility will almost certainly bring more Libyans to their cause. The Italian government promise to protect the safety of all people in Libya, Italian or Libyan, and that those who follow the law will have no need to worry about the increased military presence. Most foreign experts believe that this action will certainly lead to a prolonged conflict that will cost both sides immensely. Only time will tell if these drastic measures will lead to the integration of Libya into the greater Italian Empire.
 fxnews.93.a: "Надеюсь, это не признак грядущей дикости." # Hopefully this isn't a sign of more savagery to come.

 fxnews.94.t: "Армия взяла под свой контроль Италию" # The Army Has Taken Control of Italy
 fxnews.94.d: "[This.GetNewspaperHeader]Неспособность выборов в Италии определить подходящее правительство вынудила военных под руководством Итало Бальбо и Пьетро Бадольо выйти на улицы Рима и штурмовать здание парламента. Большинство депутатов подчинились перевороту, а тех немногих, кто пытался сопротивляться, в основном коммунистов, вытащили на улицу и расстреляли. И Франция, и Англия протестовали против переворота и до сих пор не признали новое правительство. Теперь, когда итальянские военные захватили власть, некоторые лидеры, такие как Луиджи Капелло, герой Великой войны, предлагают быстрое восстановление гражданского правительства, в то время как Пьетро Бадольо вместо этого предложил пригласить третьего герцога Савойи-Аосты, Амедео, стать главой государства, но ходят слухи, что Итало Бальбо может использовать свое вновь обретенное влияние, чтобы провозгласить себя диктатором или «дуче» Италии." # [This.GetNewspaperHeader]The Italian election's failiure to determine a suitable government has forced the military, lead by Italo Balbo and Pietro Badoglio, to march into the streets of Rome and storm the Parliament building. The majority of the deputies submitted to the coup while the few who tried to oppose, mostly Communist, were dragged outside and executed by firing squad. Both France and England have protested the coup and have yet to recognize the new government. Now that the Italian military has seized control some leaders like Luigi Capello, a hero of the Great War, suggest a quick restoration of a civillian government while Pietro Badoglio instead proposed to invite the third duke of Savoy-Aosta, Amedeo, to become head of state but rumors are rampant that Italo Balbo may use his new found influence to proclaim himself dictator or \"Duce\" of Italy.
 fxnews.94.a: "Для Италии наступили поистине трудные времена." # These are truly difficult times for Italy.

 fxnews.95.t: "Гражданская война в Бразилии" # Civil War in Brazil
 fxnews.95.d: "[This.GetNewspaperHeader]Событие, которое никого не шокировало, в Южной Америке снова вспыхивает хаос и раздоры. На этот раз это южноамериканский гигант, Бразилия, расколотый внутренними проблемами.\n\nПоскольку коммунистическое восстание поднялось против так называемой \"коррумпированной\" Бразильской Республики на западе страны, на юге, группы традиционалистов и националистов, которые не лояльны ни к республике, ни к социалистическому повстанцу, взяли дело в свои руки и тоже восстали.\n\nОдно можно сказать наверняка: это крупнейшая гражданская война, которую континент видел за долгое время. время, и его последствия будут велики." # [This.GetNewspaperHeader]In an event that shocked absolutely no one, Chaos and strife surges once again in South America. This time, it is the South American giant, Brazil, the one that is split apart by internal issues.\n\nAs a communist revolt has risen against the so called \"corrupt\" Brazilian Republic in the west side of the country, in the south, traditionalists and nationalists group that have no loyalty for either the Republic or the socialist Insurgency have taken the matter into their own hands and risen as well.\n\nOne thing is for certain, this is the largest civil war the continent has seen in a long time, and its effects will be great.
 fxnews.95.a: "Внизу больше нет стабильности." # No stability to be found down under anymore.

 fxnews.96.t: "Вторая Летисийская война" # The Second Leticia War
 fxnews.96.d: "[This.GetNewspaperHeader]История повторяется: перуанские и колумбийские страны мобилизуют свои силы и сталкиваются в бою. Всего несколько лет назад простой пограничный конфликт в регионе Летисии перерос в обширную войну, которая навсегда потрясла обе страны.\n\nТеперь, с приходом к власти радикального реваншистского правительства в Колумбии и агрессивной внешней политикой Перу, ревностно стремящегося сохранить свою гегемонию, конфликт был неизбежен, и все, что произошло, возвращается, чтобы преследовать регион." # [This.GetNewspaperHeader]History repeats, as the Peruvian and Colombian nations mobilize their forces and clash in combat. It was only a few years ago that a simple border conflict in the Leticia region, escalated into an expansive war that shocked both countries forever.\n\nNow, with the rise of a radical revanchist government in Colombia, and an aggressive foreign policy by a Peru, zealous to mantain its hegemony, conflict was inevitable, and everything that happened comes back to haunt the region.
 fxnews.96.a: "Война – это болезнь." # War is a disease.

 fxnews.97.t: "Великая Тихоокеанская война" # The Great Pacific War
 fxnews.97.d: "[This.GetNewspaperHeader]Долгое время на Тихом океане царил мир. Однако недавние события потрясли самый большой океан в мире до самого основания, поскольку в сообщениях указывается, что Соединенные Штаты и Япония вступили в войну друг с другом.\n\nНапряженность между Токио и Вашингтоном, долгое время конкурирующая с Соединенными Штатами за гегемонию в Тихом океане, уже давно растет, особенно в связи с недавним перевооружением Японии и быстрым расширением ее вооруженных сил. Хотя поначалу мало кто думал, что японцы осмелятся рискнуть вторжением американского гиганта, их конкурирующие цели в Тихом океане теперь столкнулись друг с другом в полную силу, поскольку судьба Тихого океана находится на волоске…" # [This.GetNewspaperHeader]For a long time, the Pacific was at peace. However, recent events have shook the largest ocean in the world to its very core as reports have indicated that the United States and Japan have now entered into war with one another.\n\nLong competing with the United States over hegemony in the Pacific, tensions between Tokyo and Washington have long been on the rise, especially so with Japan’s recent rearmament and rapid expansion of its military. Whilst few initially thought that the Japanese would dare risk the intervention of the American giant, their competing goals for the Pacific have now crashed into one another full force as the fate of the Pacific lies in the balance…
 fxnews.97.a: "Тихий океан загорелся." # The Pacific set alight.
 fxnews.97.b: "На этом амбиции Японии заканчиваются." # Japan's ambitions end here.
 fxnews.97.u: "Солнце сядет раз и навсегда!" # The sun will set once and for all!
 fxnews.97.c: "Победа должна быть достигнута быстро!" # Victory must be achieved quickly!
 fxnews.97.j: "Американский империализм должен быть остановлен!" # American imperialism must be stopped!
 fxnews.97.e: "О, Боже." # Oh dear.

 fxnews.98.t: "Третья мексикано-американская война" # The Third Mexican-American War
 fxnews.98.d: "[This.GetNewspaperHeader]Поскольку Мексика была вынуждена уступить свои северные территории и провинции Соединенным Штатам в 1848 году; она обнаружила, что снова уступила территории своему противнику в рамках послевоенных договоров после Великой войны. Это привело к мексиканскому национализму, который привел к власти [MEX.GetRulingParty].\n\nС тех пор многочисленные сообщения о пограничных столкновениях усилили растущую напряженность между ними. И вновь на континенте вспыхнул конфликт: революционистская Мексика сталкивается с ослабленными Соединенными Штатами из-за Великой депрессии и краха лондонской фондовой биржи; и непонятно, кто возьмет верх." # [This.GetNewspaperHeader]As Mexico was forced to cede its northern territories and provices to the United States in 1848; she found herself once again giving up territories to its adversary as part of the post war treaties after the Great War. This resulted in Mexican nationalism that have put the [MEX.GetRulingParty] to power.\n\nSince then, multiple reports of border clashes have fueled rising tensions between the two. And once again, conflict have bursed on the contintent, as a revaunchist Mexico faces a weakened United States by the Great Depression and the London Stock Market Crash; and its not clear to say who will come on top.
 fxnews.98.a: "Так оно и есть." # So it goes.

 fxnews.99.t: "Боливийская революция" # The Bolivian Revolution
 fxnews.99.d: "[This.GetNewspaperHeader]После волны гражданского недовольства и повсеместной неспособности правительства обеспечить стабильную среду для боливийского общества, особенно после поражения в войне в Чако, внутри горной страны сформировалось несколько диссидентских групп.\n\nТеперь поднялась группа социалистов-революционеров, получившая широкую поддержку. Теперь официальное демократическое правительство пало, а на смену политической структуре республики пришло новорожденное революционное правительство, и в Боливии вспыхнуло пламя социалистической революции." # [This.GetNewspaperHeader]Following a wave of civil discontent and pervasive failures of the government to provide a stable environment for Bolivian society, specially in the aftermath of their defeat in the Chaco War, several dissident groups formed inside the mountainous country.\n\nNow, a group of socialist revolutionaries rose up with wide support. Now, the official democratic government has fallen, as well as the republic's political structure, being replaced by a newborn revolutionary government, and the flames of socialist revolution have arisen in Bolivia.
 fxnews.99.a: "Мировая революция продолжается" # The World Revolution continues
 fxnews.99.b: "Кого волнует Боливия?" # Who cares about Bolivia?

 fxnews.100.t: "Странное междуцарствие" # A Strange Interregnum
 fxnews.100.d: "[This.GetNewspaperHeader]Во время сегодняшней поездки по Пекину Чжан Цзолинь, бывший лидер правительства Фэнтянь, был застрелен японскими лоялистами под знаменем Ассоциации Конкордия. Пекин, который стал частью Фэнтяня всего несколько лет назад, служил ярким примером приверженности Китая как прошлому, так и будущему, а также де-юре столицей самого государства. Самое странное, что Цзолинь в тот день находился в столице, обсуждая потепление отношений между правительством Фэнтяня и Японской империей. Гастроли с выступлениями, которые ознаменовали одно из самых заметных действий Цзолиня во время его пребывания у власти, многие считали одним из самых важных политических событий в Китае за последние несколько лет. Что бы международные зрители ни надеялись получить от этих слов, теперь потеряно навсегда, поскольку Китай все ближе приближается к полномасштабной войне." # [This.GetNewspaperHeader]While touring Beijing today, Zhang Zuolin, the erstwhile leader of the Fengtian Governancy, was shot dead by Japanese loyalists under the banner of the Concordia Association. Beijing, which came to be part of Fengtian only some short years ago, served as a shining example of China's commitment to both the past and future, as well as the de jure capital of the state itself. Most strangely, Zuolin was in the capital that day discussing the warming of relations between the Fengtian government and the Empire of Japan. The touring of speeches, which had marked one of Zuolin's most salient actions while in power, had been considered by many to be one of the most important political events in China in the past few years. Whatever it was that international spectators hoped to gain from these words has now been lost forever as China comes ever closer to all out war.
 fxnews.100.a: "Китай скатывается к еще более глубокому хаосу." # China descends towards a deeper chaos.

 fxnews.101.t: "'Матир Рима'" # 'Il Matire di Roma'
 fxnews.101.d1: "[This.GetNewspaperHeader]'Il Matire di Roma', пьеса, созданная в Северной Италии и транслировавшаяся в последние месяцы в южном кантоне Тичино в Швейцарии, вышла на мировой рынок. Несколько полных экземпляров пьесы стали редкостью, и правительство Швейцарии, которое стало более настороженно относиться к социалистическим средствам массовой информации после катастрофических забастовок 1935 года, позволило пьесе пройти в знак доброй воли стойкого демократического государства. Спектакль был показан ограниченным тиражом в других странах, например, во Франции и США. В нем подробно описываются «героические» усилия активистов-социалистов в последние дни Великой войны и во время Красного года в Италии, а также рассказывается о жизни Бенито Муссолини, который был бесцеремонно казнен гвардейцами-роялистами. Пьеса была признана подлинной, но непоследовательной по тону." # [This.GetNewspaperHeader]'Il Matire di Roma', a play that originated in Northern Italy and which has been syndicated in the past months in the southern Ticino canton of Switzerland, has been released to the global market. The few full copies of the play had become a rarity, and the government of Switzerland which has been more wary of socialist media after the disastrous strikes of 1935, allowed the play to go through, as a sign of good will of the staunchly democratic state. The play has gone on to a limited showing elsewhere, such as France and the United States. It details the 'heroic' efforts of socialist activists in the closing days of the Great War and during the Red Year in Italy, and focuses on the life of Benito Mussolini, who was unceremoniously executed by royalist guards. The play has been regarded as genuine but inconsistent in tone.
 fxnews.101.d2: "[This.GetNewspaperHeader]Пьесе «Римская мать», пьесе, созданной в Северной Италии и которая в последние месяцы транслировалась в южном кантоне Тичино в Швейцарии, было отказано в выпуске на мировой рынок. Выпуск нескольких полных экземпляров пьесы, ставших редкостью в последние месяцы, был прекращен швейцарскими властями. Их нынешнее местонахождение неизвестно, но предполагается, что они были сожжены или выброшены. Поскольку в обращении не осталось полных экземпляров, кажется, что это конец плодотворной социалистической театральной пьесы, в которой подробно описываются подвиги главного героя Бенито Муссолини в последние дни Великой войны и Красного года в Италии. Это было описано как искреннее, но непоследовательное по тону. Ожидается, что полную постановку спектакля больше никто не увидит." # [This.GetNewspaperHeader]'Il Matire di Roma', a play that originated in Northern Italy and which has been syndicated in the past months in the southern Ticino canton of Switzerland, has been refused release to the global market. The few full copies of the play, which had become rare in the past months, were ceased by Swiss authorities. Their current location is unknown, but it is presumed they were burned or discarded. With no known full copies left in circulation, it seems that this is the end for the prolific socialist theater piece which details the exploits of protagonist Benito Mussolini in the last days of the Great War and the Red Year in Italy. It was described as genuine but inconsistent in tone. It is expected nobody will see a full production of the play again.
 fxnews.101.a: "Ожидается такого рода невмешательство." # This kind of laissez-faire treatment is expected.
 fxnews.101.b: "А как насчет швейцарских свобод?" # What about Swiss freedoms?

 fxnews.102.t: "Брак свергнутых" # Marriage of the Deposed
 fxnews.102.d: "[This.GetNewspaperHeader]Габсбургские королевские семьи из разных стран, включая Италию, Венгрию и Великобританию, собрались на прошлой неделе, чтобы отпраздновать исторический брак, который во многих отношениях потряс исторический европейский королевский институт до самой его сути. В минувшие выходные в Люцерне, Швейцария, состоялась свадьба Вильгельма IV, главного потомка Дома Гогенцоллернов, и эрцгерцогини Розы фон Остеррайх, одной из выдающихся герцогинь Дома Габсбургов. Хотя оба дома неофициально или официально запрещают брак законных потомков с женихами, не имеющими земли, этот брак произошел по воле обоих домов. Хотя оба супруга де-юре имеют титулы, родовой дом ни одного из них не имеет власти на родине, где они родились. Однако то, что это могло бы означать, если бы все было наоборот, монументально..." # [This.GetNewspaperHeader]Habsburg royalty from various coutries, including Italy, Hungary, and the United Kingdom have convened over the last week in celebration of a historic marriage that, in many ways, has shaken the historical European royal institution to its very core. A marriage between Wilhelm IV, the lead issue of the House of Hohenzollern, and Archduchess Rosa von Österreich, one of the the foremost duchesses of the House of Habsburg, were wed in Lucerne, Switzerland over the weekend. While both houses forbid, unofficially or officially, the marraige of legitimate offspring to unlanded suitors, this marriage occurred at the behest of both houses. While both spouses are de jure titled, neither's ancestral house holds sway in the homelands of their births. What this could represent if that were reversed, however, is monumental...
 fxnews.102.a: "Что это будет означать для прошлых и будущих корон Европы?" # What will this mean for the past and future crowns of Europe?

 fxnews.103.t: "Индонезийское восстание" # The Indonesian Uprising
 fxnews.103.d: "[This.GetNewspaperHeader]Растущее националистическое движение в Индонезии и ослабление Британской империи из-за краха лондонской фондовой биржи побудили индонезийских революционеров перехватить инициативу и начать тотальное восстание против британского правления. Острова, которые в течение многих лет находились под колониальным контролем сначала голландцев, а затем англичан, были ввергнуты в восстание. Британской империи снова брошен вызов!" # [This.GetNewspaperHeader]The rising nationalist movements in Indonesia and the weakening of the British Empire due to the London Stock Market Crash have prompted the Indonesian revolutionaries seize the initiative and have launched an all out revolt against British rule. The islands that have for many years been under colonial control, first by the Dutch, than the British, has been plunged into an uprising. The British Empire is once again challenged!
 fxnews.103.a: "Они будут раздавлены!" # They will be crushed!
 fxnews.103.b: "Очередное восстание против англичан..." # Another revolt against the British...

 fxnews.104.t: "Бухарин назначен премьер-министром Советского Союза." # Bukharin Appointed Premier of the Soviet Union
 fxnews.104.d: "[This.GetNewspaperHeader]После смерти Ленина и без того шаткое советское правительство впало в глубокую борьбу за власть. Из-за страха перед внутренними врагами и внешними угрозами возникла нестабильная «тройка» крупных политических лидеров, сформированная для защиты социалистического бастиона от катастрофы.\n\nИз-за внутренней борьбы за власть тройка теперь распалась, поскольку появились сообщения о том, что Николай Бухарин теперь назначен новым премьер-министром Верховного Совета, что делает его фактически лидером Советского Союза. Бухарин, которого многие считают золотым мальчиком большевиков, пообещал и дальше демократизировать Союз, а также обратить вспять чрезмерную милитаризацию, которая оттолкнула советского колосса от остального мира." # [This.GetNewspaperHeader]In the aftermath of Lenin’s death, the already shaky Soviet government fell into a deep power struggle. With fears of internal enemies and external threats abound, an unstable “troika” of major political leaders formed to protect the socialist bastion from catastrophe.\n\nSubject to an internal power struggle, the troika has now collapsed with reports indicating that Nikolai Bukharin has now been named the new Premier of the Supreme Soviet, making him effectively the leader of the Soviet Union. Seen by many as the golden boy of the Bolsheviks, Bukharin has promised to further democratize the Union and has pledged to reverse the over-militarization that has alienated the Soviet colossus from the rest of the world.
 fxnews.104.a: "Поздравляем товарища Бухарина!" # Congratulations to Comrade Bukharin!
 fxnews.104.b: "Революция принимает новое направление." # The Revolution takes a new direction.
 fxnews.104.c: "Презренный трус, чего еще мы ожидали?" # A contemptible coward, what else did we expect?
 fxnews.104.e: "Ласковая собака Ленина." # Lenin's affectionate dog.
 fxnews.104.f: "Будем надеяться, что это приведет к миру в Европе." # Let's hope this leads to peace in Europe.
 fxnews.104.s: "Революция идет вперед!" # The Revolution marches on!

 fxnews.105.t: "Молотов назначен премьер-министром Советского Союза" # Molotov Appointed Premier of the Soviet Union
 fxnews.105.d: "[This.GetNewspaperHeader]После смерти Ленина и без того шаткое советское правительство впало в глубокую борьбу за власть. Из-за страха перед внутренними врагами и внешними угрозами возникла нестабильная «тройка» крупных политических лидеров, созданная для защиты социалистического бастиона от катастрофы.\n\nВ результате внутренней борьбы за власть тройка распалась, поскольку появились сообщения о том, что Вячеслав Молотов теперь назначен новым премьер-министром Верховного Совета, что делает его фактически лидером Советского Союза. Молотов, которого широко не любили и боялись за его тоталитарные взгляды, пообещал избавить Союз от любых внутренних разногласий и модернизировать советское государство, установив тотальный контроль над сельским хозяйством и промышленностью." # [This.GetNewspaperHeader]In the aftermath of Lenin’s death, the already shaky Soviet government fell into a deep power struggle. With fears of internal enemies and external threats abound, an unstable “troika” of major political leaders formed to protect the socialist bastion from catastrophe.\n\nSubject to an internal power struggle, the troika has now collapsed with reports indicating that Vyacheslav Molotov has now been named the new Premier of the Supreme Soviet, making him effectively the leader of the Soviet Union. Widely disliked and feared for his totalitarian outlook, Molotov has promised to rid the Union of any internal dissent and to modernize the Soviet state by enacting total control on agriculture and industry.
 fxnews.105.a: "Ура товарищу Молотову!" # Hurrah to Comrade Molotov!
 fxnews.105.b: "Революция принимает кровавый поворот." # The Revolution takes a bloody turn.
 fxnews.105.c: "Типичные красные." # Typical reds.
 fxnews.105.e: "Может быть, из этого есть чему поучиться?" # Maybe there is something to learn from this?
 fxnews.105.f: "Каково его мнение о нынешнем порядке?" # What are his opinions on the current order?
 fxnews.105.s: "Революция будет обеспечена!" # The Revolution shall be secured!

 fxnews.106.t: "Троцкий назначен премьер-министром Советского Союза" # Trotsky Appointed Premier of the Soviet Union
 fxnews.106.d: "[This.GetNewspaperHeader]После смерти Ленина и без того шаткое советское правительство впало в глубокую борьбу за власть. Из-за страха перед внутренними врагами и внешними угрозами сформировалась нестабильная «тройка» крупных политических лидеров, чтобы защитить социалистический бастион от катастрофы.\n\nВ условиях внутренней борьбы за власть тройка теперь распалась. По иронии судьбы Троцкий вышел на первое место из тройки, которая была создана, чтобы помешать ему подняться на пост нового премьер-министра Советского Союза. Получив позорную славу и восхищение во всем мире за свое поведение во время гражданской войны, призыв Троцкого к международной революции уже вызвал красную панику среди стран, поскольку Красный Призрак преследует Европу." # [This.GetNewspaperHeader]In the aftermath of Lenin’s death, the already shaky Soviet government fell into a deep power struggle. With fears of internal enemies and external threats abound, an unstable “troika” of major political leaders formed to protect the socialist bastion from catastrophe.\n\nSubject to an internal power struggle, the troika has now collapsed. In an ironic twist of events, Trotsky has come out on top from the troika that was created to prevent his rise with him now being the new Premier of the Soviet Union. Gaining infamy and admiration worldwide for his conduct during the civil war, Trotsky’s call of an international revolution has already sparked a red scare among the nations as the Red Spectre haunts Europe.
 fxnews.106.a: "Троекратное ура товарищу Троцкому!" # Three cheers for Comrade Trotsky!
 fxnews.106.b: "А как насчет его «перманентной революции»?" # What about his \"permanent revolution\"?
 fxnews.106.c: "Красная угроза приближается!" # The Red Menace is coming!
 fxnews.106.e: "Тревожно." # Disturbing.
 fxnews.106.f: "Москве нельзя доверять!" # Moscow cannot be trusted!
 fxnews.106.s: "Интернационал будет человеческой расой!" # The International shall be the Human race!

 fxnews.107.t: "Красный Сын" # The Red Son
 fxnews.107.d: "[This.GetNewspaperHeader]После смерти Ленина и без того шаткое советское правительство впало в глубокую борьбу за власть. Однако борьба за власть, казалось, была быстро решена с опубликованием завещания Ленина, в котором говорилось, что Сергей Киров должен был стать следующим лидером Советского Союза.\n\nНесмотря на это, разразилась еще одна борьба за власть между внутренней левой оппозицией и Кировым, дестабилизировавшая правление Кирова. Тем не менее, Киров успешно консолидировал свою власть и теперь правит безальтернативно. Завоевав репутацию соглашателя, правление Кирова, скорее всего, приведет к продолжению большей части политики Ленина, с оговоркой, что это изменение политики чрезмерной милитаризации, которая оттолкнула советского гиганта от остального мира." # [This.GetNewspaperHeader]In the aftermath of Lenin’s death, the already shaky Soviet government fell into a deep power struggle. However, the power struggle seemed to have been quickly solved with the release of Lenin’s testament, stating that Sergei Kirov was to become the next leader of the Soviet Union.\n\nIn spite of this, another power struggle between the internal leftist opposition and Kirov broke out, destabilizing Kirov’s rule. Nevertheless, Kirov has successfully consolidated his power and now rules uncontested. Gaining repute as a compromiser, Kirov’s rule will likely result in the continuation of most of Lenin’s policies, with the caveat that is the reversal of the policy of over-militarization that has alienated the Soviet giant from the rest of the world.
 fxnews.107.a: "Ура товарищу Кирову!" # Huzzah to Comrade Kirov!
 fxnews.107.b: "Будет ли он учиться на ошибках Ленина?" # Will he learn from Lenin's mistakes?
 fxnews.107.c: "Ба!" # Bah!
 fxnews.107.e: "Он доживет до того, чтобы увидеть, как умрет ошибка Ленина." # He will live to see Lenin's mistake die.
 fxnews.107.f: "По крайней мере ничего не изменилось!" # At least nothing has changed!
 fxnews.107.s: "Ленин жив!" # Lenin lives on!

 fxnews.108.t: "Свержение Сергея Кирова" # The Overthrow of Sergei Kirov
 fxnews.108.d: "[This.GetNewspaperHeader]После смерти Ленина и без того шаткое советское правительство впало в глубокую борьбу за власть. Однако борьба за власть, казалось, была быстро решена с опубликованием завещания Ленина, в котором говорилось, что Сергей Киров должен был стать следующим лидером Советского Союза.\n\nНесмотря на это, разразилась еще одна борьба за власть между внутренней левой оппозицией и Кировым, дестабилизировавшая правление Кирова. К шоку для многих, Киров был свергнут и заменен Александром Шляпниковым на посту премьер-министра Советского Союза. Известный своей ненасытной борьбой за промышленных рабочих и профсоюзы, Шляпников уже сталкивается с противодействием со стороны крестьян внутри Союза, и многие задаются вопросом, как советский титан будет двигаться вперед." # [This.GetNewspaperHeader]In the aftermath of Lenin’s death, the already shaky Soviet government fell into a deep power struggle. However, the power struggle seemed to have been quickly solved with the release of Lenin’s testament, stating that Sergei Kirov was to become the next leader of the Soviet Union.\n\nIn spite of this, another power struggle between the internal leftist opposition and Kirov broke out, destabilizing Kirov’s rule. In a shock to many, Kirov has been overthrown and replaced by Alexander Shliapnikov as Premier of the Soviet Union. Known for his voracious campaigning for industrial workers and trade unions, Shliapnikov already faces opposition from peasants within the Union with many wondering how the Soviet titan will move forward.
 fxnews.108.a: "Аплодисменты товарищу Шляпникову!" # Applause to Comrade Shliapnikov!
 fxnews.108.b: "Союз не так стабилен, как кажется." # The Union is not as stable as it seems.
 fxnews.108.c: "Социалистические распри, что еще нового?" # Socialist infighting, what else is new?
 fxnews.108.e: "Большевики могут только есть друг друга." # Bolsheviks can only eat each other.
 fxnews.108.f: "Лучше бы это не было предзнаменованием грядущих событий..." # This better not be a sign of things to come...
 fxnews.108.s: "Для рабочих!" # For the workers!

 fxnews.109.t: "Возвышение Красного Наполеона" # The Rise of the Red Napoleon
 fxnews.109.d: "[This.GetNewspaperHeader]После смерти Ленина и без того шаткое советское правительство впало в глубокую борьбу за власть, после которой произошел военный переворот. Хотя поначалу хунта могла показаться несколько стабильной, между силами безопасности и отдельными кликами Красной Армии быстро возникли разногласия.\n\nНесмотря на это, первоначальный лидер переворота Михаил Тухачевский удержал власть и впоследствии стал премьер-министром Советского Союза. Известный своим блестящим полководческим искусством во время Гражданской войны и своими новаторскими военными стратегиями, Тухачевский усилил страх перед красной угрозой, которая будет преследовать Европу и Азию, еще больше отдаляя и без того изолированный Союз от мира." # [This.GetNewspaperHeader]In the aftermath of Lenin’s death, the already shaky Soviet government fell into a deep power struggle following which a military coup occurred. Whilst the junta may have seemed somewhat stable at first, divisions quickly appeared between the security forces and the separate cliques of the Red Army.\n\nIn spite of this, the initial leader of the coup, Mikhail Tukhachevsky has held onto power and has gone on to make himself Premier of the Soviet Union. Known for his brilliant generalship during the Civil War and for his innovative stratagems in the army, Tukhachevsky has spiked fears of a red menace that will haunt Europe and Asia, further alienating the already isolated Union from the world.
 fxnews.109.a: "Приветствуем Красного Наполеона!" # We salute the Red Napoleon!
 fxnews.109.b: "Распространится ли революция?" # Will the Revolution spread?
 fxnews.109.c: "Красные подошли слишком близко, чтобы успокоиться..." # The Reds are coming too close for comfort...
 fxnews.109.e: "Он потерпит неудачу, как потерпел неудачу Наполеон." # He will fail like Napoleon failed.
 fxnews.109.f: "Совсем не хорошо..." # Not good at all...
 fxnews.109.s: "Мы защитим Революцию!" # We will protect the Revolution!

 fxnews.110.t: "Восстание кровавого гнома" # The Rise of the Bloody Dwarf
 fxnews.110.d: "[This.GetNewspaperHeader]После смерти Ленина и без того шаткое советское правительство впало в глубокую борьбу за власть, после которой произошел военный переворот. Хотя поначалу хунта могла показаться несколько стабильной, между силами безопасности и отдельными кликами Красной Армии быстро возникли разногласия.\n\nПоскольку Красная Армия потерпела поражение в борьбе, силы безопасности во главе с Николаем Ежовым воспользовались шансом, сделав Ежова новым премьер-министром Советского Союза. Обещая очистить Союз от всех внутренних угроз, многие теперь опасаются, что предполагаемая социалистическая утопия теперь превратится в автократический кошмар, которому не будет способствовать предполагаемый садизм самого премьер-министра Ежова." # [This.GetNewspaperHeader]In the aftermath of Lenin’s death, the already shaky Soviet government fell into a deep power struggle following which a military coup occurred. Whilst the junta may have seemed somewhat stable at first, divisions quickly appeared between the security forces and the separate cliques of the Red Army.\n\nWith the Red Army battered in the struggle, the security forces headed by Nikolai Yezhov have seized the chance with Yezhov now the new Premier of the Soviet Union. Promising to cleanse the Union of all internal threats, many now fear that the supposed socialist utopia will now become an autocratic nightmare, not aided by the supposed sadism of Premier Yezhov himself.
 fxnews.110.a: "Молодец, \"товарищ\"." # Good job, \"comrade\".
 fxnews.110.b: "Зловещий." # Ominous.
 fxnews.110.c: "Неизбежный конечный результат социализма." # The inevitable end result of socialism.
 fxnews.110.e: "Большевизм может закончиться только кровопролитием." # Bolshevism can only end in bloodshed.
 fxnews.110.f: "Печальный конец революции." # A sad end for the revolution.
 fxnews.110.s: "Товарищ Ежов вообще НЕ кровавый!" # Comrade Yezhov is NOT bloody at all!

 fxnews.111.t: "Восстание красного офицера" # The Rise of the Red Officer
 fxnews.111.d: "[This.GetNewspaperHeader]После смерти Ленина и без того шаткое советское правительство впало в глубокую борьбу за власть, после которой произошел военный переворот. Хотя поначалу хунта могла показаться несколько стабильной, между силами безопасности и отдельными кликами Красной Армии быстро возникли разногласия.\n\nВдохновленный общественной популярностью и старой гвардией Красной Армии, Климент Ворошилов вышел на первое место и стал новым премьер-министром Советского Союза. Известный своим военным прошлым, его обещания вернуть стабильность и облегчить страдания гражданского населения не смогли успокоить опасения, что Советский Союз теперь представляет собой не что иное, как красную хунту." # [This.GetNewspaperHeader]In the aftermath of Lenin’s death, the already shaky Soviet government fell into a deep power struggle following which a military coup occurred. Whilst the junta may have seemed somewhat stable at first, divisions quickly appeared between the security forces and the separate cliques of the Red Army.\n\nBuoyed by public popularity and the old guard of the Red Army, Kliment Voroshilov has come out on top and has become the new Premier of the Soviet Union. Known for his military background, his promises to return stability and alleviate civilian suffering have been unable to calm fears that the Soviet Union is now nothing more than a red junta.
 fxnews.111.a: "Первому Красному офицеру!" # To the first Red officer!
 fxnews.111.b: "Это не похоже на коммунизм." # That doesn't sound like communism.
 fxnews.111.c: "Красные показали свое истинное лицо." # The Reds have revealed their true colors.
 fxnews.111.e: "Возможно, он мог бы быть полезен..." # Perhaps he could be useful...
 fxnews.111.f: "Его правление дестабилизирует Европу!" # His rule destabilizes Europe!
 fxnews.111.s: "Революция обгонит реакцию!" # The Revolution will overtake reaction!

 fxnews.112.t: "[RUS.GetNameDef] возвращает Россию" # [RUS.GetNameDef] retakes Russia
 fxnews.112.d: "[This.GetNewspaperHeader]Враги социализма на Дальнем Востоке выиграли войну против Советского Союза, и теперь перед ними стоит грандиозная задача — искоренить наследие социализма и контролировать эту землю. Это положило конец многолетнему правлению Советского Союза, единственной оппозицией которого были остатки Белого движения в Сибири, поддержанные Японией и США. Сможет ли правительство постоянно контролировать эту землю, неизвестно, но все, что мы знаем, это то, что это серьезно изменило геополитический ландшафт." # [This.GetNewspaperHeader]The enemies of socialism in the Far East have won the war against the Soviet Union, they will now have the monumental task of eradicating the legacy of socialism and controlling the land. This ended the rule of the Soviet Union that has lasted for many years, with it's only opposition being the remnants of the White Movement in Siberia that were supported by Japan and the USA. If the government is gonna be able to permanently control the land is uncertain but all we know is that this has severly changed the geopolitical landscape.
 fxnews.112.a: "Печальный день для революции..." # A sad day for the revolution...
 fxnews.112.b: "Скатертью дорога" # Good riddance

 fxnews.113.t: "Советский Союз побеждает [RUS.GetNameDef]" # Soviet Union beats the [RUS.GetNameDef]
 fxnews.113.d: "[This.GetNewspaperHeader][RUS.GetNameDef] потерпел поражение от Советского Союза, это практически устранило любую близкую к ним серьезную угрозу Советскому Союзу. Хотя интеграция новых земель окажется трудной из-за антисоциализма, существующего в регионе, расположенная там промышленность окажется полезной для режима." # [This.GetNewspaperHeader][RUS.GetNameDef] has been defeated by the Soviet Union, this has practically eradicated any serious threat to the Soviet Union that is close to them. While the integration of the new land will prove difficult because of the anti-socialism that is present in the region the industry that is located there will prove useful for the regime.
 fxnews.113.a: "Красные завершили дело..." # The Reds finished the job...
 fxnews.113.b: "Очередная победа народа!" # Another victory for the people!

 fxnews.114.t: "USM побеждает на российских выборах" # The USM wins the Russian Election
 fxnews.114.d: "[This.GetNewspaperHeader]На выборах [RUS.GetNameDef] победила партия «Союз спасения Родины», коалиция состоит из НУС и октябристов. Оба являются сильно милитаристскими, старший партнер NUS также поддерживает прогрессивные идеалы, такие как избирательное право женщин и гражданский национализм. Они также хотят реформировать правительство, сделав верхнюю палату полностью состоящей из ученых, инженеров и писателей, а нижнюю палату - полностью состоящей из бизнесменов. Сохранение демократии маловероятно, учитывая ее авторитарную направленность." # [This.GetNewspaperHeader]The USM standing for Union for the Salvation of the Motherland has won the election in [RUS.GetNameDef], the coalition consists of the NUS and the Oktoberists. Both are heavily militaristic, the NUS the senior partner also supports progressive ideals like Women Suffrage and Civic Nationalism. They also want to reform the government by making the upper chamber be completly consisting of scientist,engineers and writers and the lower chamber be completly consisting of businessmen. If democracy will be kept is unlikely considering it's authoritarian leanings.
 fxnews.114.a: "Интересное развитие" # An interesting development

 fxnews.115.t: "Союз Возрождения побеждает на российских выборах" # Union Of Regeneration wins Russian Election
 fxnews.115.d: "[This.GetNewspaperHeader]Союз возрождения победил на выборах в [RUS.GetNameDef], коалиция состоит из Народно-социалистической партии, кадетов и эсеров. Их коалиция хочет положить конец дискриминации меньшинств, поддерживает создание государства всеобщего благосостояния для помощи бедным, реализацию прогрессивных реформ для создания более справедливой и справедливой нации и национализацию земли." # [This.GetNewspaperHeader]The Union of Regeneration has won the election in [RUS.GetNameDef], the coalition consists of the Popular Socialist Party,Kadets and the Social Revolutionaries. They coalition wants to end discrimantion of minorities, supports creating a welfare state to help the poor,implementing progressive reforms to create a more just and fair nation and nationalizing the land.
 fxnews.115.a: "Интересное развитие" # An interesting development

 fxnews.116.t: "Национальный центр побеждает на российских выборах" # The National Center wins the Russian Election
 fxnews.116.d: "[This.GetNewspaperHeader]Национальный центр победил на выборах в [RUS.GetNameDef], партия состоит из бывших кадетов, которым не понравилось партийное руководство и которые впоследствии присоединились к партии, что сделало ее крупным игроком в политической сфере. Партия хочет восстановить монархию, но конституционную. Они также поддерживают инвестиции в образование, поскольку его лидером является бывший учитель, проводя реформы в духе невмешательства на рынок и поддерживая консервативные ценности." # [This.GetNewspaperHeader]The National Center has won the elections in [RUS.GetNameDef], the party consists of former Kadet members who disliked the party leadership and subsequently joined the party making it a major player in the political sphere. The party wants to restore the monarchy, but one that is constitutional. They also support an investement in the education considering it's leader is a former teacher, instutating laissez-faire reforms in the market and supporting conservative values.
 fxnews.116.a: "Интересное развитие" # An interesting development

 fxnews.117.t: "Корнилов совершает переворот в российском правительстве" # Kornilov coups the Russian Government
 fxnews.117.d: "[This.GetNewspaperHeader]Корнилов совершил переворот в российском правительстве и установил марионеточное правительство во главе со Спиридоном Дионисовичем Меркуловым. Он был выбран, чтобы возглавить нацию, чтобы обмануть японцев и предотвратить мгновенную интервенцию. Целью является создание националистической нации во главе с монархом и изгнание недружественного иностранного влияния. Они также крайне милитаристски обещают напасть на Советы до 1939 года и очистить общество. Добьются ли они успеха, неизвестно." # [This.GetNewspaperHeader]Kornilov has couped the Russian government and installed a puppet government led by Spiridon Dionisovich Merkulov. He was chosen to lead the nation to deceive the Japanese and prevent an instant intervention. There goal is to create a nationalistic nation led by a monarch and expel unfriendly foreign influence. They also are extremly militaristic pledging to attack the Soviets before 1939 and cleansing the society. If they are gonna be successful is uncertain.
 fxnews.117.a: "Успокоится ли когда-нибудь Россия?" # Will Russia ever rest?

 fxnews.118.t: "Дипломатическая напряженность между Францией и Великобританией" # Diplomatic Tensions between France and Britain
 fxnews.118.d: "[This.GetNewspaperHeader]Дипломатическая напряженность между Французской и Британской империями резко возросла в начале этой недели, когда французское правительство заказало строительство нескольких прибрежных фортов вдоль своего северного побережья и активно проводило антибританскую внешнюю политику. Хотя полномасштабная война между этими двумя титанами маловероятна, мир остановился и затаил дыхание, чтобы посмотреть на исход этого события. \n\nЛа-Манш накаляется, и многие задаются вопросом, кто сделает первый выстрел, а также последний." # [This.GetNewspaperHeader]Diplomatic tensions spiked between the French and British Empires earlier this week as the French government commissioned the construction of several coastal forts along their Northern coast and actively pursued anti-British foreign policies. While a full-scale war between these two titans does not seem likely, the world has paused and held its collective breath in order to watch the outcome of this event. \n\nThe English channel is heating up, and many wonder who will fire the first shot, as well as the last.
 fxnews.118.a: "Два титана, бьющиеся головами, не могут закончиться хорошо..." # Two titans butting heads cannot end well...
 WORLD_FRA_ENG_tensions: "Англо-французская напряженность" # Anglo-French Tensions

 fxnews.119.t: "Французская оккупация Канарских островов" # French Occupation of the Canary Islands
 fxnews.119.d: "[This.GetNewspaperHeader]Пока в Испании бушует гражданская война, небольшая группа французских морских пехотинцев за 24 часа оккупировала Канарские острова. В настоящее время острова находятся под французским военным управлением, и Национальная морская пехота установила вокруг острова военно-морскую блокаду. \n\nФранцузы заявили, что вторжение было направлено на то, чтобы гарантировать, что острова не будут разорены гражданской войной в Испании, и что местное население запросило иностранную защиту от правления фалангистов. Однако все стороны гражданской войны в Испании выразили свое возмущение по поводу аннексии их территории иностранной державой. \n\nНапряженность в Пиренеях резко возросла, и некоторые полагают, что вскоре может произойти дальнейшее вмешательство в дела Испании." # [This.GetNewspaperHeader]As civil war in Spain rages on, a small group of French Marines have occupied the Canary Islands in brief 24 hour operation. The islands are now under French military administration and a naval blockade has been placed around the island by the Marine Nationale. \n\nThe French have stated that the invasion was to ensure the islands were not ravaged by the Spanish civil war, and that the local population had requested foreign protection from Falangist rule. However all sides of the Spanish Civil War have expressed their outrage at a foreign power annexing their territory. \n\nTensions along the Pyrenees have risen sharply, and some believe that further intervention in Spain may soon come.
 fxnews.119.a: "Империализм поистине не знает границ..." # Imperialism truly knows no bounds...

 fxnews.120.t: "Французская оккупация горных перевалов Пиренеев" # French Occupation of the Pyrenees Mountain Passes
 fxnews.120.d: "[This.GetNewspaperHeader]Уже более двух лет в Испании бушует гражданская война, которая разрушила страну. В последнее время левые фракции, базирующиеся в Барселоне, берут верх и вытесняют остальные оставшиеся фракции далеко в сельскую местность. В связи с таким поворотом событий французское правительство объявило об операции по оккупации горных перевалов, расположенных на франко-испанской границе, чтобы, по их словам, «защитить испанцев, живущих в Пиренеях и вокруг них, от разрушительной гражданской войны».\n\nОднако мало кого обманывает этот обман, и ясно, что целью этой операции был захват важных приграничных регионов, которые испанцы потенциально могли бы использовать при будущем вторжении в Южную Францию. В очередной раз все испанские фракции выразили свое возмущение тем, что французы раздирают их страну, пока она переживает период великих потрясений." # [This.GetNewspaperHeader]For over two years now, civil war has raged on in Spain and destroyed the country. Recently, the leftist factions based out of Barcelona have been gaining the upper hand and have been pushing the other remaining factions far back into the countryside. Due to this turn of events, the French government has announced an operation to occupy the mountain passes straddling the Franco-Spanish border in order to, in their words, \"Safeguard the Spanish people living in and around the Pyrenees from the devestation of the civil war\".\n\nFew are fooled by this deception however, and it is clear that the purpose of this operation was to seize important border regions which the Spanish could have potentially used in a future invasion of Southern France. Once more, all Spanish factions have expressed their outrage at the French picking apart their country while it goes through this period of great turmoil.
 fxnews.120.a: "Собираются ли французы завоевать всю Испанию?" # Are the French going to conquer all of Spain?

 fxnews.121.t: "Франция аннексирует Валлонию" # France Annexes Wallonia
 fxnews.121.d: "[This.GetNewspaperHeader]После прихода к власти авторитарного и милитаристского режима во Франции на бельгийское правительство оказали давление с целью сдать регион Валлония и признать французскую гегемонию в этом регионе. У бельгийского правительства, неспособного справиться с силой Французской империи, не было другого выбора, кроме как отказаться от региона и бежать, поджав хвост. Французы назвали это громкой победой европейской политической стабильности и объявили о дальнейших планах расширения, которые идут вразрез со многими другими европейскими странами. \n\nНесколько пробельгийских восстаний в Валлонии были подавлены наступающей французской армией, и многие представители международного сообщества осудили их как массовые убийства местного населения. Баланс сил в Европе еще больше склонился в сторону французов, и независимость региона Бенилюкса, похоже, снова находится под угрозой." # [This.GetNewspaperHeader]Following the rise of an authoritarian and militaristic regime in France, the Belgian government has been pressured to surrender the Wallonia region and admit French hegemony over the region. The Belgian government, unable to cope with the force of the French Empire, had no other choice but to relinquish the region and run with their tail between their legs. The French have reported this as a resounding victory for European political stability, and has announced further plans of expansion which run in direct conflict with many other European nations. \n\nSeveral pro-Belgian uprisings in Wallonia were crushed by the advancing French army, with many in the international community denouncing them as massacres of the local population. The balance of power in Europe has tipped further towards the French, and the independence of the Benelux region seems to be threatened once more.
 fxnews.121.a: "Бельгийский лев не мог сравниться с французским петухом." #wow that sounds fucking dumb(from the future, you're WRONG) # The Belgian lion was no match for the French rooster.

 fxnews.122.t: "Олимпийский комитет выбрал Берлин местом проведения Олимпийских игр" # Olympic Committee Selects Berlin To Host The Olympic Games
 fxnews.122.d: "[This.GetNewspaperHeader]\nотбей мяч, набери очки" # [This.GetNewspaperHeader]\nhit the ball, score the points
 fxnews.122.a: "С удовольствием приедем в этом году." # We will gladly attend this year.

 fxnews.123.t: "Внешняя политика Германии – пангерманизм" # German Foreign Policy - Pan-Germanism
 fxnews.123.d: "[This.GetNewspaperHeader]В недавней речи канцлер Германии Адам Дресслер сделал напыщенные заявления об объединении всех немцев под одним флагом. В особенно горячий момент своей речи Дресслер страстно заявил, что «все немцы будут воссоединены любыми необходимыми средствами». Это явная угроза суверенитету всех стран, граничащих с Германией, но многие, такие как военный министр Франции, уверены, что Дресслер только лает и не кусается. Только время покажет, оправдались ли эти надежды." # [This.GetNewspaperHeader]In a recent speech German Chancellor, Adam Dressler, has made bombastic claims about uniting all Germans under one flag. During a particularly heated moment in his speech Dressler passionately stated that 'All Germans will be reunified by any means necessary'. This is a clear threat to the sovereignty of all nations that border Germany but many, such as French minister of war, are confident that Dressler is all bark and no bite. Only time will tell if these hopes are right.
 fxnews.123.a: "Это наверняка скоро пройдет." # This will surely blow over soon enough.

 fxnews.124.t: "Франция поддерживает Австрию" # France Backs Austria
 fxnews.124.d: "[This.GetNewspaperHeader]Вчера Германия направила Австрии ультиматум с требованием ее присоединения к Рейху. В ответ Австрия запросила военной поддержки у Антанты. Хотя многие сочли маловероятным, что Франция решила защитить независимость Австрии. Мир затаил дыхание, пока эти две мировые державы готовятся к войне. Надеемся, что мирное решение будет быстро найдено." # [This.GetNewspaperHeader]Yesterday Germany sent an ultimatum to Austria demanding for it's annexation into the Reich. In response Austria has asked for military support from the Entente. Though many found it highly unlikely France has chosen to protect the independence of Austria. The World holds it's breath as these two world powers gear up for war. Hopefully a peaceful solution can be quickly found.
 fxnews.124.a: "Зачем умирать за Дюрнкрут?" # Why die for Dürnkrut?

 fxnews.125.t: "Франция поддерживает Данию" # France Backs Denmark
 fxnews.125.d: "[This.GetNewspaperHeader]Вчера Германия направила Дании ультиматум с требованием провести референдум, чтобы определить, к какой нации должен принадлежать немецкий народ в Гольштейне. В ответ Дания запросила военной поддержки у Антанты. Хотя многие сочли это маловероятным, Франция решила защитить суверенитет Дании. Мир затаил дыхание, пока эти две мировые державы готовятся к войне. Надеемся, что мирное решение будет быстро найдено." # [This.GetNewspaperHeader]Yesterday Germany sent an ultimatum to Denmark demanding that a referendum be put forth to determine which nation the German people in Holstein should belong. In response Denmark has asked for military support from the Entente. Though many found it highly unlikely France has chosen to protect the sovereignty of Denmark. The World holds it's breath as these two world powers gear up for war. Hopefully a peaceful solution can be quickly found.
 fxnews.125.a: "Зачем умирать за Данию?" # Why die for Denmark?

 fxnews.126.t: "Германия аннексирует Рейн" # Germany Annexes the Rhine
 fxnews.126.d: "[This.GetNewspaperHeader]Вчера вечером стали известны результаты референдума в Рейнской области: Рейнская область снова станет частью Германии. Шокирующие результаты вызвали много споров. Во Франции жалобы на фальсификацию выборов со стороны рейнской валкистской партии становятся все более распространенными, но существенных доказательств найти не удалось. Сегодня кажется, что баланс сил в Европе постепенно склонился в пользу Германии." # [This.GetNewspaperHeader]Last night the results of the Rhineland referendum came in, Rhineland will become part of Germany once again. The shocking results have caused much controversy. In France complaints of election fraud by the Rhinish Valkist party have become more and more common but no substantial proof can be found. Today it seems the balance of power in Europe has slowly tipped into Germany's favor.
 fxnews.126.a: "Поистине неприятный поворот событий для Франции." # A truly embarrassing turn of events for France.

 fxnews.127.t: "Франция поддерживает чешское государство" # France Backs The Czech State
 fxnews.127.d: "[This.GetNewspaperHeader]Франция объявила, что окажет поддержку Чешскому государству в борьбе с Германией. Немецкий национализм в приграничных регионах Чешского государства подтолкнул Германию к действиям по аннексии этих регионов. Правительство Чешского государства, ослабленное множеством внутренних проблем, обратилось к французскому правительству с просьбой предоставить ему военную поддержку в случае, если между ними и Германией разразится война. Министр иностранных дел Франции заявил: «Мы не можем позволить немцам реорганизовать Европу по своей прихоти». По мере роста напряженности и Германия, и Франция готовят свои вооруженные силы к конфликту. Теперь нам остается только молиться, чтобы было найдено мирное решение." # [This.GetNewspaperHeader]France has announced that they will give support to The Czech State against Germany. German nationalism in The Czech State's border regions has imboldend Germany to take action to annex these regions. The Czech State's government, weakend by a myriad of internal issues, has petitioned the French government to give them military support in the event that war breaks out between them and Germany. The French foreign minister has stated 'We can not allow the Germans to reorganize Europe on a whim'. As tentions grow, both Germany and France are preparing their armed forces for conflict. Now we can only pray that a peaceful solution can be found.
 fxnews.127.a: "Зачем умирать за Дечина?" # Why die for Děčín?

 fxnews.128.t: "Франция поддерживает страны Балтии" # France Backs The Baltic States
 fxnews.128.d: "[This.GetNewspaperHeader]Вчера Германия направила ультиматум нескольким странам Балтии с требованием подчинения Рейху, ссылаясь на претензии Ливонии на регион и наличие немецких меньшинств, нуждающихся в защите от красной угрозы. В ответ Латвия и Эстония обратились к Антанте за военной поддержкой. К удивлению многих, французское правительство заявило о своей поддержке стран Балтии. Надеюсь, еще не поздно деэскалировать ситуацию." # [This.GetNewspaperHeader]Yesterday Germany sent an ultimatum to several Baltic States demanding submission to the Reich, citing Livonian claims on the region and the presence of German minorities in need of protection from the Red Menace. In Response, Latvia and Estonia have asked the Entente for military support. Surprising many, the French government has announced their support in favor of the Baltic States. Hopefully it is not too late to de-escalate the situation.
 fxnews.128.a: "Зачем умирать за Ригу?" # Why die for the Riga?

 fxnews.129.t: "Центральная Америка аннексирует Гондурас" # Centroamérica Annexes Honduras
 fxnews.129.d: "[This.GetNewspaperHeader]Сегодня Великая Республика Центроамерика аннексировала соседнее государство Гондурас, положив конец более чем столетней борьбе страны за независимость и распространив социализм дальше по всей Центральной Америке. Это произошло через несколько недель после того, как социалистическое правительство захватило парламент Гондураса, и новая объединенная нация уже поклялась противостоять «американскому империализму» и распространить ценности социализма на остальную часть Америки." # [This.GetNewspaperHeader]The Grand Republic of Centroamérica today annexed the neighboring nation of Honduras, bringing to an end the nation's more than century-long bid at independence and spreading socialism further across Central America. This comes several weeks after a socialist government took over the parliament of Honduras, and the new united nation has already vowed to resist 'American Imperialism' and spread the values of socialism to the rest of the Americas.
 fxnews.129.a: "Великая Республика становится сильнее!" # The Grand Republic grows stronger!
 fxnews.129.b: "И вот социализм распространяется..." # And so socialism spreads...

 fxnews.130.t: "Афганские солдаты пересекают линию Дюрана" # Afghan Soldiers Crosses the Durand Line
 fxnews.130.d: "[This.GetNewspaperHeader]\n Несколько часов назад по всему миру дошли сообщения о том, что афганская армия марширует в Северо-Западную пограничную провинцию Британской Индии, по-видимому, в ответ на продолжающееся восстание в Индии. В воздухе витает ожидание того, что британские власти могут сделать по этому делу. Это может перерасти в новую англо-афганскую войну." # [This.GetNewspaperHeader]\n Some hours ago, reports reached the rest of the world of the Afghan army marching into the North-West Frontier Province of British India, seemingly in reaction to the ongoing uprising in India. There is anticipation in the air over what British authorities might do about this case. This could turn into a new Anglo-Afghan War.
 fxnews.130.a: "Возмутительно!" # Outragous!
 fxnews.130.b: "Больше проблем в Индии?" # More troubles in India?

 fxnews.131.t: "Четвертая англо-афганская война" # The Fourth Anglo-Afghan War
 fxnews.131.d: "[This.GetNewspaperHeader]Ситуация в Северо-Западной пограничной провинции Британской Индии превратилась в тотальную войну между Афганистаном и Британской империей после оккупации этой территории Афганистаном. Многие пытаются предсказать исход этой войны, а некоторые говорят, что Афганистан будет раздавлен из-за своей жадности. Некоторые, с другой стороны, говорят, что Британской империи уже слишком многое предстоит сделать, чтобы обеспечить победу над афганцами." # [This.GetNewspaperHeader]The situation in the North-West Frontier Province of British India has turned into an all-out war between Afghanistan and the British Empire, following Afghanistan's occupation of the area. Many are attempting to predict the outcome of this war, with some saying that Afghanistan will be crushed for its greed. Some, on the other hand, say that the British Empire already has too much to handle to secure a victory over the Afghans.
 fxnews.131.a: "Посмотрим, что произойдет" # Let's see what happens

#fxnews.131.t: "Франция и Великобритания оккупируют Конго." # France and Britain Occupy the Congo
#fxnews.131.d: "[This.GetNewspaperHeader]В условиях бушующей в Бельгии гражданской войны представители министерств иностранных дел Франции и Великобритании объявили о совместной оккупации бельгийской колонии в Конго. Африканская колония богата ресурсами, и совместная оккупация призвана предотвратить ее попадание в руки социалистов или полное провозглашение независимости. Представители обоих правительств заявили, что эта оккупация не будет окончательной и что колония может быть возвращена Бельгии после окончания конфликта, хотя сторонние наблюдатели скептически относятся к тому, что две империи когда-либо серьезно рассмотрят вопрос об освобождении территории." # [This.GetNewspaperHeader]With civil war raging in Belgium, representatives from the French and British foreign ministries announced a joint occupation of the Belgian colony in the Congo. The African colony is rich in resources, and the join occupation is designed to prevent it from falling into socialist hands or declaring independence altogether. Representatives from both governments have said this occupation will not be final, and that the colony may be returned to Belgium following the end of its conflict, though outside observers are skeptical that the two empires would ever seriously consider releasing the territory.
#fxnews.131.a: "Кризис снова предотвращен!" # Crisis averted once again!
#fxnews.131.b: "Кажется, империализм жив и процветает в мире." # It seems imperialism is alive and well in the world.

 fxnews.132.t: "Франция оккупирует Конго" # France Occupies the Congo
 fxnews.132.d: "[This.GetNewspaperHeader]В связи с бушующей в Бельгии гражданской войной представители министерства иностранных дел Франции объявили о немедленной оккупации бельгийской колонии в Конго. Африканская колония богата ресурсами, и односторонняя оккупация призвана предотвратить ее попадание в руки социалистов или полное провозглашение независимости. Представители французского правительства заявили, что эта оккупация не будет окончательной и что колония может быть возвращена Бельгии после окончания конфликта, хотя сторонние наблюдатели скептически относятся к тому, что империя когда-либо серьезно рассмотрит возможность освобождения территории." # [This.GetNewspaperHeader]With civil war raging in Belgium, representatives from the French foreign ministry announced an immediate occupation of the Belgian colony in the Congo. The African colony is rich in resources, and the unilateral occupation is designed to prevent it from falling into socialist hands or declaring independence altogether. Representatives from the French government have said this occupation will not be final, and that the colony may be returned to Belgium following the end of its conflict, though outside observers are skeptical that the empire would ever seriously consider releasing the territory.
 fxnews.132.a: "Французская империя становится все сильнее!" # The French Empire grows ever stronger!
 fxnews.132.b: "Они пожалеют об этом..." # They'll regret this...
 fxnews.132.c: "Кажется, империализм жив и процветает в мире." # It seems imperialism is alive and well in the world.

 fxnews.134.t: "Массовые аресты военнослужащих японского флота!" # Mass Arrests of Japanese Navy Personel!
 fxnews.134.d: "[This.GetNewspaperHeader]Мир размышляет о том, что произойдет с островным государством Япония, когда пройдет одна из самых бурных недель. Нынешнее демократическое правительство только что арестовало многих своих военно-морских сотрудников, которые, по словам представителя правительства, «замышляли государственный переворот против правительства». Японское правительство отказалось обнародовать список арестованных, оно уверено, что были арестованы многие военно-морские теоретики, офицеры и некоторые кадеты, в то время как по неподтвержденным данным, арестовано более 1000 человек. Многие военно-морские эксперты уверены, что это вызовет массовую утечку мозгов, поскольку многие из арестованных занимают определенные важные должности, и возможное изменение военно-морской доктрины в связи с арестом традиционалистов. Многие военно-морские теоретики обеспокоены будущим японского военно-морского флота, но что ждет Японию, задается вопросом весь мир." # [This.GetNewspaperHeader]The world ponders what will happen to the island nation of Japan as one of their most tumultous weeks pass. The current democratic government has just arrested many of their naval personnel, who were according to the government spokeperson, 'plotting a coup't'etat against the government'. The Japanese government has refused to release the list of the arrested, it is sure that many naval theorists, officiers and some cadets were arrested, while unconfirmed reports state that over 1000 are arrested. Many naval experts are certain that this will cause a massive brain drain as many of the arrested hold certain important positions, and a possible naval doctrine change as the traditionalists are arrested. Many naval theorists are concerned about the Japanese navy's future, but what lies and waits for Japan, the world wonders.
 fxnews.134.a: "Их флот сильно пострадал." # Their Navy suffered greatly.
 fxnews.134.b: "В бесчестии мы нашли выживание." # In dishonor we found survival.
 fxnews.134.c: "Они только что уничтожили свой собственный щит." # They just destroyed their own shield.
 fxnews.134.e: "Наш старый союзник пал довольно быстро." # Our old ally has fallen rather quickly.

 fxnews.135.t: "Великий Тихоокеанский Альянс" # The Great Pacific Alliance
 fxnews.135.d: "[This.GetNewspaperHeader]Сегодня утром в Вашингтоне американский президент [USA.GetLeader] объявил о формировании Тихоокеанской коалиции с Японской империей против некоторых «неназванных» угроз, которая планирует нападения на интересы обеих стран. Будущее неопределенно, но объединив два тихоокеанских оплота, они защитят демократию от тех, кто желает подорвать альянс и их интересы. Европейская Антанта и Альянс защиты Империи шокированы довольно внезапным интервенционистским поведением Америки при формировании союза с Японией. Лидер Соединенного Королевства [ENG.GetLeader], как ни странно, не комментирует появление такого альянса." # [This.GetNewspaperHeader]This morning in Washington DC, the American president, [USA.GetLeader] announced the formation of the Pacific Coalition with the Empire of Japan against some 'unnamed' threats which is planning attacks against the interests of both countries. The future is uncertain, but with the two Pacific strongholds banding together, they will safeguard democracy against those who wish to undermine the alliance and their interests. The European Entente and the Imperial Protection Alliance are shocked by a rather sudden interventionalist America while forming an alliance with Japan. The leader of the United Kingdom, [ENG.GetLeader], curiously, does not comment on the surgence of such alliance.
 fxnews.135.a: "Два тихоокеанских оплота теперь будут защищать демократию." # The two Pacific Bulwarks will defend democracy now.
 fxnews.135.b: "Вместе мы защитим демократию." # Together we will safeguard Democracy.
 fxnews.135.c: "Мы победим, несмотря ни на что." # We will prevail no matter.
 fxnews.135.e: "Собрались вместе, как загнанные крысы." # Banding together like cornered rats.

 fxnews.136.t: "Британское Адмиралтейство арестовало японского шпиона!" # Japanese Spy Arrested by British Admiralty!
 fxnews.136.d: "[This.GetNewspaperHeader]Офицер иностранных дел Великобритании только что провел пресс-конференцию, на которой объявил об аресте подозреваемого японского шпиона в Британском Адмиралтействе, одновременно обвинив японское правительство в развязывании агрессии. Японское правительство отказалось комментировать подобные обвинения, заявив, что «Япония не намерена провоцировать возмущение и портить отношения между двумя близкими союзниками». Многие мировые политические комментаторы полагают, что это англо-японское дипломатическое противостояние наверняка сохранится еще довольно долгое время и определенно вызовет раскол между двумя близкими бывшими союзниками." # [This.GetNewspaperHeader]The British Foreign Officer just held a press conference to announce the arrest of a suspected Japanese spy at the British Admiralty, while accusing the Japanese government for causing aggression. The Japanese government refused to comment on such accusations, claiming 'Japan has no intention to provoke outrage and damage the relation between the two close allies.' Many world politic commenters believe that this Anglo-Japanese diplomatic standoff is sure to remain for quite a while and will definitely cause a rift between the two close former allies.
 fxnews.136.a: "Как изменились времена после великой войны..." # How times have changed since the great war...
 fxnews.136.b: "Их действия будут иметь последствия!" # Their actions will have consequences!
 fxnews.136.c: "Я сказал, что он уже не наш человек! Замолчи!" # I said he wasn't our man already! Shut up!

 fxnews.137.t: "Южная Африка покидает империю" # South Africa Leaves the Empire
 fxnews.137.d: "[This.GetNewspaperHeader]Южно-Африканский Союз, долгое время являвшийся основой британского колониализма в Африке, провозгласил независимость от британского политического и военного влияния. Новое правительство Южной Африки заявило, что оно «наметит свой собственный путь на ближайшие десятилетия», и сформулировало эту декларацию как борьбу за свободу от репрессивного и вездесущего врага. Британское министерство иностранных дел мало говорило о происходящих событиях, называя их «популистской пропагандой» и заявляя, что продолжит работать с правительством колонии, когда оно придет в себя. Великобритания по-прежнему сталкивается с рядом проблем, связанных с ее влиянием во всем мире, однако ее министерство отказалось от комментариев, когда его спросили, рассмотрит ли оно возможность возвращения Южной Африки в состав империи силой. На данный момент новая «независимая» нация будет стремиться обрести союзников и создать правительство, свободное от британского влияния." # [This.GetNewspaperHeader]The Union of South Africa, long a staple of British colonialism in Africa, has declared independence from British political and military influence. The new South African government has declared that they will 'chart their own path over the decades to come,' and have framed the declaration as a struggle for freedom from an oppressive and omnipresent foe. The British foreign ministry has said little about the developments, brushing them off as 'populist propaganda,' and saying it will continue to work with the government of the colony when it regains its senses. Britain remains embroiled in a series of challenges to its influence across the globe, yet its ministry declined to comment when asked if it would consider bringing South Africa back into the empire by force. For now, the newly 'independent' nation will seek to gain allies and set up a government free of British influence.
 fxnews.137.a: "Очередной удар по Британской империи." # Another blow to the British Empire.
 fxnews.137.b: "Они вернутся... так или иначе." # They'll be back...one way or another.

 fxnews.138.t: "Южная Африка провозглашает империю" # South Africa Proclaims Empire
 fxnews.138.d: "[This.GetNewspaperHeader]Сегодня правительство независимого южноафриканского государства провозгласило конец европейского империализма в Африке и начало новой африканской империи. Министерство иностранных дел Южной Африки изложило планы на будущее, которые включают «освобождение» всей Африки от европейского колониализма и поощрение беспорядков и восстаний со стороны элит и процветающих колонистов из высшего класса как в британских, так и во французских колониях на континенте. Многие сторонние наблюдатели назвали заявление Южной Африки не чем иным, как отчаянной попыткой привлечь внимание мировой общественности, а члены министерств иностранных дел Великобритании и Франции пригрозили ввести экономические санкции против страны и, в случае необходимости, предпринять военные действия. На данный момент судьба Африки висит на волоске..." # [This.GetNewspaperHeader]Today, the government of the independent South African state proclaimed the end of European imperialism in Africa and the start of a new African empire. The South African foreign ministry laid out plains for the future, which include 'liberating' all of Africa from European colonialism and encouraging unrest and rebellion by elites and propserous upper-class colonists across both British and French colonies on the continent. Many outside observers have labeled South Africa's proclamation as nothing more than a desperate attempt to gain global attention, and members of the British and French foreign ministries have threatened to impose economic sanctions on the country, and take military action if necessary. For now, the fate of Africa hangs in the balance...
 fxnews.138.a: "Они не могут быть серьезными." # They can't be serious.
 fxnews.138.b: "Слава нам!" # Glory to us!

 worldnews_afw_neutral: "Кончится ли когда-нибудь хаос?" # Will the chaos ever end?
 worldnews_fra_vs_eng_JAP: "Бесценная возможность..." # An invaluable opportunity...

 fxnews.139.t: "Англо-французская война" # The Anglo-French War
 fxnews.139.d.attacker_eng: "[This.GetNewspaperHeader]Несмотря на их кажущееся единство во время Великой войны, времена радикально изменились с 1919 года. Поскольку Великобритания и Франция разошлись во мнениях относительно масштабов поражения Германии, обе империи разделились, снова став геополитическими соперниками. Несмотря на первоначальные прогнозы о том, что рост валкизма в Германии приведет к улучшению отношений между двумя странами, такие прогнозы, очевидно, оказались ошибочными.\n\nПоскольку в последние месяцы резко возросла напряженность между Великобританией и Францией, теперь разразилась война, когда Лондон осудил то, что они называют французским империализмом на европейском континенте, когда британские бомбы упали на Тулон. Учитывая дальнейшие сообщения о перестрелке колониальных солдат от Гайаны до Индокитая, многие с трепетом, страхом и волнением смотрят на то, как старый порядок начинает рушиться сам по себе." # [This.GetNewspaperHeader]In spite of their apparent unity during the Great War, times have changed drastically since 1919. With Britain and France disagreeing over the extent of Germany’s defeat, both empires split ways, once more becoming geopolitical rivals. Despite initial predictions that the rise of Valkism in Germany would warm relations between the two nations, such predictions have been evidently proven wrong.\n\nWith tensions between Britain and France rising dramatically in recent months, war has now broken out with London denouncing what they describe as French imperialism on the European continent as British bombs drop on Toulon. With further reports of colonial soldiers from Guyana to Indochina exchanging fire, many look in awe, fear and excitement as the old order begins to collapse in on itself.
 fxnews.139.d.attacker_eng_wger: "[This.GetNewspaperHeader]Несмотря на их кажущееся единство во время Великой войны, времена радикально изменились с 1919 года. Поскольку Великобритания и Франция разошлись во мнениях относительно масштабов поражения Германии, обе империи разделились, снова став геополитическими соперниками. Несмотря на первоначальные прогнозы о том, что рост валкизма в Германии улучшит отношения между двумя странами, такие прогнозы явно оказались ошибочными.\n\nНесмотря на войну с Германией, война между бывшими союзниками теперь разразилась, когда Лондон осудил то, что они называют французским империализмом на европейском континенте, когда британские бомбы упали на Тулон. Учитывая дальнейшие сообщения о перестрелке колониальных солдат от Гайаны до Индокитая, многие с трепетом, страхом и волнением смотрят на то, как старый порядок начинает рушиться сам по себе." # [This.GetNewspaperHeader]In spite of their apparent unity during the Great War, times have changed drastically since 1919. With Britain and France disagreeing over the extent of Germany’s defeat, both empires split ways, once more becoming geopolitical rivals. Despite initial predictions that the rise of Valkism in Germany would warm relations between the two nations, such predictions have been evidently proven wrong.\n\nDespite their war with Germany, war between the former allies has now broken out with London denouncing what they describe as French imperialism on the European continent as British bombs drop on Toulon. With further reports of colonial soldiers from Guyana to Indochina exchanging fire, many look in awe, fear and excitement as the old order begins to collapse in on itself.
 worldnews_eng_vs_fra_FRA: "Росбифы будут отбиты!" # The Rosbifs will be repelled!
 worldnews_eng_vs_fra_FRA_allies: "Мы должны противостоять британскому империализму!" # We must resist British imperialism!
 worldnews_eng_vs_fra_USA: "Неужели они не понимают, что Германия представляет собой большую угрозу?" # Don't they realize Germany is the greater threat?
 worldnews_eng_vs_fra_GER: "Ха! Пусть они уничтожат друг друга." # Hah! May they destroy each other.
 worldnews_eng_vs_fra_GER_allies: "Антанта всегда была обречена на провал." # The Entente was always bound to fail.
 worldnews_eng_vs_fra_ENG: "Мы должны предотвратить возникновение новой Французской Империи!" # We must prevent another French Empire!
 worldnews_eng_vs_fra_ENG_allies: "На этом их наполеоновские амбиции закончатся." # Their Napoleonic ambitions will end here.
 worldnews_eng_vs_fra_socialist: "Реакционная борьба возвещает конец капитализма." # Reactionary infighting heralds the end of capitalism.

 fxnews.140.t: "Война за канал" # The Channel War
 fxnews.140.d.attacker_fra: "[This.GetNewspaperHeader]Несмотря на их кажущееся единство во время Великой войны, времена радикально изменились с 1919 года. Поскольку Великобритания и Франция разошлись во мнениях относительно масштабов поражения Германии, обе империи разделились, снова став геополитическими соперниками. Несмотря на первоначальные прогнозы о том, что рост валкизма в Германии приведет к улучшению отношений между двумя странами, такие прогнозы, очевидно, оказались ошибочными.\n\nПоскольку в последние месяцы резко возросла напряженность в отношениях между Великобританией и Францией, теперь разразилась война, и Париж объявил то, что они называют британским вмешательством, неприемлемым, поскольку французские подводные лодки преследуют британские конвои. Учитывая дальнейшие сообщения о перестрелке колониальных солдат от Гайаны до Индокитая, многие с трепетом, страхом и волнением смотрят на то, как старый порядок начинает рушиться сам по себе." # [This.GetNewspaperHeader]In spite of their apparent unity during the Great War, times have changed drastically since 1919. With Britain and France disagreeing over the extent of Germany’s defeat, both empires split ways, once more becoming geopolitical rivals. Despite initial predictions that the rise of Valkism in Germany would warm relations between the two nations, such predictions have been evidently proven wrong.\n\nWith tensions between Britain and France rising dramatically in recent months, war has now broken out with Paris declaring what they describe as British interference to be unacceptable as French submarines harrass British convoys. With further reports of colonial soldiers from Guyana to Indochina exchanging fire, many look in awe, fear and excitement as the old order begins to collapse in on itself.
 fxnews.140.d.attacker_fra_wger: "[This.GetNewspaperHeader]Несмотря на их кажущееся единство во время Великой войны, времена радикально изменились с 1919 года. Поскольку Великобритания и Франция разошлись во мнениях относительно масштабов поражения Германии, обе империи разделились, снова став геополитическими соперниками. Несмотря на первоначальные прогнозы о том, что рост валкизма в Германии приведет к улучшению отношений между двумя странами, такие прогнозы явно оказались ошибочными.\n\nНесмотря на войну с Германией, война между бывшими союзниками теперь разразилась, когда Париж объявил то, что они называют британским вмешательством, неприемлемым, поскольку французские подводные лодки преследуют британские конвои. Учитывая дальнейшие сообщения о перестрелке колониальных солдат от Гайаны до Индокитая, многие с трепетом, страхом и волнением смотрят на то, как старый порядок начинает рушиться сам по себе." # [This.GetNewspaperHeader]In spite of their apparent unity during the Great War, times have changed drastically since 1919. With Britain and France disagreeing over the extent of Germany’s defeat, both empires split ways, once more becoming geopolitical rivals. Despite initial predictions that the rise of Valkism in Germany would warm relations between the two nations, such predictions have been evidently proven wrong.\n\nDespite their war with Germany, war between the former allies has now broken out with Paris declaring what they describe as British interference to be unacceptable as French submarines harrass British convoys. With further reports of colonial soldiers from Guyana to Indochina exchanging fire, many look in awe, fear and excitement as the old order begins to collapse in on itself.
 worldnews_fra_vs_eng_FRA: "Мы уничтожим Коварный Альбион!" # We shall slain Perfidious Albion!
 worldnews_fra_vs_eng_FRA_allies: "Мы поддерживаем наших союзников!" # We stand with our allies!
 worldnews_fra_vs_eng_USA: "Печальный конец союза..." # A sad end for the alliance...
 worldnews_fra_vs_eng_GER: "Франция всегда занимала империалистическую позицию." # France has always had an imperialist attitude.
 worldnews_fra_vs_eng_GER_allies: "Дураки рвутся на части." # The fools rip themselves apart.
 worldnews_fra_vs_eng_ENG: "Мы должны были знать, что Париж предаст нас." # We should have known Paris would betray us.
 worldnews_fra_vs_eng_ENG_allies: "Империя не может пасть!" # The empire cannot fall!
 worldnews_fra_vs_eng_socialist: "Назовите лучший дуэт, чем империя и война." # Name a better duo than empire and war.

 worldnews_ww2_neutral: "Война – это ад." # War is hell.

 fxnews.141.t: "Вторая Великая Война" # The Second Great War
 fxnews.141.d: "[This.GetNewspaperHeader]Когда замолчали орудия и закончилась первая Великая война, многие думали, что эта война положит конец всем войнам. Издержки войны безвозвратно изменили ландшафт Европы, и считалось, что ни у кого нет желания продолжать войну. Тем не менее, были те, кто сомневался в том, что мир может продолжаться.\n\nСегодня эти пессимисты оправдались; осудив их предполагаемое порабощение Версальским договором, Германия снова мобилизовала свои силы, пригрозив Парижу немедленно уйти со всех заявленных территорий. Франция, естественно, высмеяла такие неприемлемые требования, зажег искру сообщениями о немецких артиллерийских ударах по французским позициям, что стало началом новой Великой войны, которая потрясет европейский континент." # [This.GetNewspaperHeader]When the guns fell silent and the first Great War was at an end, many had thought that it would be the war to end all wars. The costs of war had irrevocably changed the landscape of Europe and it was assumed that no one had the appetite for more war. Nevertheless, there were those who doubted that peace could last.\n\nToday, these pessimists have been vindicated; denouncing their supposed enslavement by the Treaty of Versailles, Germany has mobilized her forces once again, threatening Paris to withdraw from all claimed territory at once. Such unacceptable demands have naturally been laughed off by France, igniting the spark with reports of German artillery striking French positions - the induction of another Great War that will shake the European continent.
 worldnews_ger_vs_fra_FRA: "Они не пройдут." # They shall not pass.
 worldnews_ger_vs_fra_FRA_allies: "Мы должны остановить валкистский террор!" # We must stop Valkist terror!
 worldnews_ger_vs_fra_USA: "Как мы могли позволить Германии сделать это?" # How could we let Germany do this?
 worldnews_ger_vs_fra_GER: "Мы раздавим этих наглых крыс." # We will crush these impudent rats.
 worldnews_ger_vs_fra_GER_allies: "Антанта будет брошена в ад, где ей и место." # The Entente shall be thrown down to hell, where it belongs.
 worldnews_ger_vs_fra_ENG: "Мы не можем позволить Германии дестабилизировать Европу!" # We cannot let Germany destabilize Europe!
 worldnews_ger_vs_fra_ENG_allies: "Это угрожает стабильности Империи!" # This threatens the stability of the Empire!
 worldnews_ger_vs_fra_ITA: "Неужели немецкий империализм не заходит так далеко?" # Surely German imperialism doesn't go that far?
 worldnews_ger_vs_fra_SOV: "Их бессмысленные усилия принесут только вред рабочим." # Their pointless endeavors will only hurt the workers.
 worldnews_ger_vs_fra_SOV_allies: "Признаком капитализма является война." # A symptom of capitalism is war.
 worldnews_ger_vs_fra_JAP: "Эта диверсия сослужит нам очень хорошую службу..." # This diversion serves us very well...

 fxnews.142.t: "Франция вторгается в Германию" # France Invades Germany
 fxnews.142.d: "[This.GetNewspaperHeader]Когда замолчали орудия и закончилась первая Великая война, многие думали, что эта война положит конец всем войнам. Издержки войны безвозвратно изменили ландшафт Европы, и считалось, что ни у кого нет желания продолжать войну. Тем не менее, были те, кто сомневался в том, что мир может продолжаться.\n\nСегодня эти пессимисты оправдались; Все более разгневанная открытым отказом от Версальского договора, Франция осудила неповиновение Германии этому договору, требуя, чтобы Германия разоружилась и соблюдала часто игнорируемый договор. Однако неудивительный отказ Берлина от столь смехотворных требований зажег искру сообщениями о французских бомбардировках, что стало началом новой Великой войны, которая потрясет европейский континент." # [This.GetNewspaperHeader]When the guns fell silent and the first Great War was at an end, many had thought that it would be the war to end all wars. The costs of war had irrevocably changed the landscape of Europe and it was assumed that no one had the appetite for more war. Nevertheless, there were those who doubted that peace could last.\n\nToday, these pessimists have been vindicated; increasingly furious at the open repudiation of the Treaty of Versailles, France has decryed German defiance of the treaty, demanding that Germany disarm and abide by the oft-ignored treaty. Berlin’s unsurprising refusal to such ludicrous demands however have ignited the spark with reports of French bombing - the induction of another Great War that will shake the European continent.
 worldnews_fra_vs_ger_FRA: "Боше слишком долго отпускали из-под крючка." # The Boche has been let off the hook for too long.
 worldnews_fra_vs_ger_FRA_allies: "Германию необходимо остановить, пока не стало слишком поздно!" # Germany must be stopped before it is too late!
 worldnews_fra_vs_ger_USA: "Неужели им это не нужно было?" # Surely they didn't have to?
 worldnews_fra_vs_ger_GER: "Настало время, мы сбросим оковы Версаля!" # The time is now, we shall throw off the shackles of Versailles!
 worldnews_fra_vs_ger_GER_allies: "Французский империализм не знает границ." # French imperialism knows no bounds.
 worldnews_fra_vs_ger_ENG: "Как они смеют не консультироваться с нами?" # How dare they not consult us?
 worldnews_fra_vs_ger_ENG_allies: "Разве Пэрис не знает, что они делают?" # Does Paris not know what they're doing?
 worldnews_fra_vs_ger_ITA: "Возможно, есть возможность, которую мы можем получить от этого?" # Perhaps there is an opportunity we can gain from this?
 worldnews_fra_vs_ger_SOV: "Они не могут надеяться на успех." # They cannot hope to succeed.
 worldnews_fra_vs_ger_SOV_allies: "Рабочие должны дать отпор этим империалистическим ублюдкам!" # The workers must resist these imperialist bastards!
 worldnews_fra_vs_ger_JAP: "Если Франция занята на западе..." # If France is busy in the west...

 worldnews_gsw: "Мир дрожит." # The world trembles.
 worldnews_gsw_eastern_european: "А мы посередине..." # And we're in the middle...

 fxnews.143.t: "Война на Востоке" # War in the East
 fxnews.143.d.wo_fra: "[This.GetNewspaperHeader]Когда Советский Союз восстал из пепла старой царской империи, ему было суждено встретиться с идеологическим противником, который не уступал ему в революционном рвении. По иронии судьбы, этим противником оказалась Германия, которая непреднамеренно спровоцировала большевистскую революцию в 1917 году.\n\nВ течение долгого времени между Берлином и Москвой были самые холодные отношения, какие только могли быть, и иностранные наблюдатели делали ставки на то, какая страна нанесет удар первой. Теперь те, кто делал ставку на то, что Германия нанесет удар первой, оказались правы; осуждая советскую агрессию и обещая освободить Восточную Европу от советской власти, Германия вторглась в Советский Союз. Уже можно увидеть, как немецкие танки пересекают советскую границу – кульминация их идеологической борьбы." # [This.GetNewspaperHeader]When the Soviet Union arose from the ashes of the old Tsarist empire, it was destined to meet an ideological foe that matched them in revolutionary fervor. Ironically, this foe would wind up being Germany who had inadvertently sparked the Bolshevik revolution in 1917.\n\nFor the longest time, Berlin and Moscow had the frostiest relations that could be, with foreign observers betting on which country would strike first. Now, those who bet on Germany striking first have been proven right; decrying Soviet aggression and promising to liberate Eastern Europe from Soviet rule, Germany has invaded the Soviet Union. Already, German tanks have been seen pouring over the Soviet border - the culmination of their ideological struggle.
 fxnews.143.d.w_fra: "[This.GetNewspaperHeader]Когда Советский Союз восстал из пепла старой царской империи, ему было суждено встретиться с идеологическим противником, который не уступал ему в революционном рвении. По иронии судьбы, этим противником оказались немцы, которые непреднамеренно спровоцировали большевистскую революцию в 1917 году.\n\nВ течение долгого времени между Берлином и Москвой были самые холодные отношения, какие только могли быть, и иностранные наблюдатели делали ставки на то, какая страна нанесет удар первой. Хотя война Германии с Францией изменила большинство прогнозов, Берлин бросил вызов этим ожиданиям, смело осудив советскую агрессию и объявив войну Советскому Союзу. Даже когда немецкие танки пересекают советскую границу, многие задаются вопросом, сможет ли Германия действительно победить, поскольку теперь она снова сражается на два фронта." # [This.GetNewspaperHeader]When the Soviet Union arose from the ashes of the old Tsarist empire, it was destined to meet an ideological foe that matched them in revolutionary fervor. Ironically, this foe would wind up being the Germans who had inadvertently sparked the Bolshevik revolution in 1917.\n\nFor the longest time, Berlin and Moscow had the frostiest relations that could be, with foreign observers betting on which country would strike first. Although Germany's war with France had changed most predictions, Berlin has defied these expectations, going on to boldly condemn Soviet aggression, declaring war on the Soviet Union. Even as German tanks are seen crossing the Soviet border, many wonder if Germany can really win as she now fights on two fronts once again.
 worldnews_ger_vs_sov_ger_ally: "Если Германия будет на нашей стороне, социализм будет побеждён!" # With Germany on our side, socialism shall be defeated!
 worldnews_ger_vs_sov_sov_ally: "Если русские на нашей стороне, победа неизбежна!" # With the Russians on our side, victory is inevitable!
 worldnews_ger_vs_sov_SOV_ww2: "Германия будет раздавлена ​​как муха." # Germany will be crushed like a fly.
 worldnews_ger_vs_sov_SOV_allies_ww2: "Германия будет освобождена!" # Germany will be liberated!
 worldnews_ger_vs_sov_GER_ww2: "На карту поставлено существование Германии!" # Germany's existence is at stake!
 worldnews_ger_vs_sov_GER_allies_ww2: "Тревожно..." # Worrying...
 worldnews_ger_vs_sov_FRA_ww2: "Глупый ход." # A foolish move.
 worldnews_ger_vs_sov_FRA_allies_ww2: "О чем думал Берлин?" # What was Berlin thinking?
 worldnews_ger_vs_sov_SOV: "Мы сокрушим врага!" # We shall shatter the enemy!
 worldnews_ger_vs_sov_SOV_allies: "Наши товарищи атакованы!" # Our comrades are under attack!
 worldnews_ger_vs_sov_GER: "Мы исправим ошибки прошлого." # We shall right the mistakes of the past.
 worldnews_ger_vs_sov_GER_allies: "Всё для антибольшевистской борьбы!" # Everything for the anti-Bolshevik struggle!
 worldnews_ger_vs_sov_FRA: "Это оставляет Германию широко открытой..." # This leaves Germany wide open...
 worldnews_ger_vs_sov_FRA_allies: "По крайней мере, они нам не угрожают!" # At least they aren't threatening us!
 worldnews_ger_vs_sov_anglo: "Мир достаточно велик только для одного тирана." # The world is only big enough for one tyrant.
 worldnews_ger_vs_sov_JAP: "Это оставляет Восток открытым..." # This leaves the East open...
 worldnews_ger_vs_sov_RUS: "Вот и все." # This is it.

 fxnews.144.t: "Немецко-советская война" # The German-Soviet War
 fxnews.144.d.wo_fra: "[This.GetNewspaperHeader]Когда Советский Союз восстал из пепла старой царской империи, ему было суждено встретиться с идеологическим противником, который не уступал ему в революционном рвении. По иронии судьбы, этим противником оказались немцы, которые непреднамеренно спровоцировали большевистскую революцию в 1917 году.\n\nВ течение долгого времени между Берлином и Москвой были самые холодные отношения, какие только могли быть, и иностранные наблюдатели делали ставки на то, какая страна нанесет удар первой. Сегодня те, кто делал ставку на то, что Советы нанесут удар первыми, оказались правы; заявив, что Германия стремится уничтожить их первыми, Советский Союз объявил войну Германии. Уже сейчас можно увидеть перестрелку советских солдат с немецкими войсками – кульминацию их идеологической борьбы." # [This.GetNewspaperHeader]When the Soviet Union arose from the ashes of the old Tsarist empire, it was destined to meet an ideological foe that matched them in revolutionary fervor. Ironically, this foe would wind up being the Germans who had inadvertently sparked the Bolshevik revolution in 1917.\n\nFor the longest time, Berlin and Moscow had the frostiest relations that could be, with foreign observers betting on which country would strike first. Today, those who bet that the Soviets would strike first have been proven right; declaring that Germany seeks to destroy them first, the Soviet Union has declared war on Germany. Already, Soviet soldiers have been seen exchanging fire with German troops - the culmination of their ideological struggle.
 fxnews.144.d.w_fra: "[This.GetNewspaperHeader]Когда Советский Союз восстал из пепла старой царской империи, ему было суждено встретиться с идеологическим противником, который не уступал ему в революционном рвении. По иронии судьбы, этим противником оказались немцы, которые непреднамеренно спровоцировали большевистскую революцию в 1917 году.\n\nВ течение долгого времени между Берлином и Москвой были самые холодные отношения, какие только могли быть, и иностранные наблюдатели делали ставки на то, какая страна нанесет удар первой. Учитывая войну на Западе, многие наблюдатели предсказывали, что Москва первой нанесет удар по отвлеченным немцам. Действительно, Советский Союз объявил войну Германии. Видя, как советские солдаты перестреливаются с немецкими войсками, многие задаются вопросом, сможет ли Германия действительно победить, поскольку теперь она снова сражается на два фронта." # [This.GetNewspaperHeader]When the Soviet Union arose from the ashes of the old Tsarist empire, it was destined to meet an ideological foe that matched them in revolutionary fervor. Ironically, this foe would wind up being the Germans who had inadvertently sparked the Bolshevik revolution in 1917.\n\nFor the longest time, Berlin and Moscow had the frostiest relations that could be, with foreign observers betting on which country would strike first. With the war in the West, many observers predicted that Moscow would strike the distracted Germans first. Sure enough, the Soviet Union has declared war on Germany. As Soviet soldiers are seen exchanging fire with German troops, many wonder if Germany can really win as she now fights on two fronts once again.
 worldnews_sov_vs_ger_ger_ally: "Мы должны противостоять большевистской агрессии!" # We must resist Bolshevik aggression!
 worldnews_sov_vs_ger_sov_ally: "Германия снова проиграет!" # Germany will lose again!
 worldnews_sov_vs_ger_SOV_ww2: "Мы освободим немецкого рабочего!" # We shall liberate the German worker!
 worldnews_sov_vs_ger_SOV_allies_ww2: "Мы должны поддержать наших товарищей в Москве!" # We must support our comrades in Moscow!
 worldnews_sov_vs_ger_GER_ww2: "Боже на небесах!" # Gott im Himmel!
 worldnews_sov_vs_ger_GER_allies_ww2: "Красные идут!" # The Reds are coming!
 worldnews_sov_vs_ger_FRA_ww2: "Мы опередим их до Берлина." # We will beat them to Berlin.
 worldnews_sov_vs_ger_FRA_allies_ww2: "Как Икар и солнце." # Like Icarus and the sun.
 worldnews_sov_vs_ger_SOV: "Мы должны нанести удар раньше, чем они!" # We must strike before they do!
 worldnews_sov_vs_ger_SOV_allies: "Рабочие всего мира требуют освобождения Германии!" # The workers of the world demand Germany's liberation!
 worldnews_sov_vs_ger_GER: "Мы должны были это предвидеть." # We should have seen this coming.
 worldnews_sov_vs_ger_GER_allies: "Жаль, что мы не нанесли удар первыми..." # Shame we didn't strike first...
 worldnews_sov_vs_ger_FRA: "Пусть они борются." # Let them fight.
 worldnews_sov_vs_ger_FRA_allies: "Стабильность Европы под угрозой!" # The stability of Europe is at risk!
 worldnews_sov_vs_ger_anglo: "Красная угроза распространяется..." # The red menace spreads...
 worldnews_sov_vs_ger_JAP: "Наша северная граница обеспечена." # Our northern frontier is secured.
 worldnews_sov_vs_ger_RUS: "Это наш последний шанс." # This is our last chance.

 fxnews.145.t: "Кильский совет" # The Kiel Soviet
 fxnews.145.d: "[This.GetNewspaperHeader]Появившийся в результате унизительного поражения Германии в Великой войне, Кильский мандат был охвачен нестабильностью с момента его создания в 1922 году: экстремисты со всех сторон боролись с правительством и друг с другом за контроль над жизненно важным Кильским каналом и всем, что его окружает.\n\nПоскольку Лондон не мог продолжать поддерживать мандат, его будущее было оставлено на усмотрение референдума, что привело к печальной победе тех, кто желал объединения с Рейхом. Военная интервенция, которая была признана неприемлемым результатом, была осуществлена ​​в соответствии с мандатом, за которым последовал вакуум власти, который привел коммунистов Киля к власти. Когда революция достигла Киля, многие задаются вопросом, что будет дальше, поскольку баланс сил в Европе становится все более хрупким." # [This.GetNewspaperHeader]The product of Germany’s humiliating defeat in the Great War, the Kiel mandate has been embroiled in instability since its creation in 1922, with extremists on every side duking out with the government and each other for control of the vital Kiel Canal and all that surrounds it.\n\nWith London unable to continue supporting the mandate, its future was left up to a referendum, resulting in an upset victory for those who desired unification with the Reich. Deemed to be an unacceptable result, a military intervention by the mandate was executed, followed by a power vacuum that has propelled the communists of Kiel to power. With the revolution reaching Kiel, many wonder what will happen next as the balance of power in Europe becomes ever more tenuous.
 fxnews.145.a: "Спартак будет отомщен!" # Spartacus shall be avenged!
 fxnews.145.b: "Московские куклы-носочки..." # Moscow's sockpuppets...
 fxnews.145.c: "Вскоре они присоединятся к своим красным кумирам." # They will join their red idols soon enough.
 fxnews.145.e: "История повторяется." # History repeats itself.

 fxnews.146.t: "Регионалисты захватили Киль" # Regionalists Take Over Kiel
 fxnews.146.d: "[This.GetNewspaperHeader]Появившийся в результате унизительного поражения Германии в Великой войне, Кильский мандат был охвачен нестабильностью с момента его создания в 1922 году: экстремисты со всех сторон боролись с правительством и друг с другом за контроль над жизненно важным Кильским каналом и всем, что его окружает.\n\nПоскольку Лондон не смог продолжать поддерживать мандат, его будущее было оставлено на усмотрение референдума, в результате которого было создано свободное государство. Однако неспособность города сформировать правительство только придала смелости регионалистам прежнего мандата, что привело к штурму ими Ландтага и созданию независимой земли Шлезвиг-Гольштейн. После этого Ландеспартии заявили о себе, пообещав оказать столь желанную помощь сельскому населению." # [This.GetNewspaperHeader]The product of Germany’s humiliating defeat in the Great War, the Kiel mandate has been embroiled in instability since its creation in 1922, with extremists on every side duking out with the government and each other for control of the vital Kiel Canal and all that surrounds it.\n\nWith London unable to continue supporting the mandate, its future was left up to a referendum, resulting in the creation of a free state. However, the city’s inability to form a government has only emboldened the regionalists of the former mandate, resulting in their storming of the Landtag and creation of an independent Schleswig-Holstein. In the aftermath, the Landespartei have asserted themselves, promising to bring much-desired aid to the rural population.
 fxnews.146.a: "Долой берлинскую тиранию!" # Down with Berlin's tyranny!
 fxnews.146.b: "Еще один оплот против Германии?" # Another bulwark against Germany?
 fxnews.146.c: "Ба!" # Bah!
 fxnews.146.e: "Мандат всегда был временным решением." # The Mandate was always a temporary solution.

 fxnews.147.t: "Конец Свободного города" # The End of the Free City
 fxnews.147.d: "[This.GetNewspaperHeader]Появившийся в результате унизительного поражения Германии в Великой войне, Кильский мандат был охвачен нестабильностью с момента его создания в 1922 году: экстремисты со всех сторон боролись с правительством и друг с другом за контроль над жизненно важным Кильским каналом и всем, что его окружает.\n\nПоскольку Лондон не смог продолжать поддерживать мандат, его будущее было оставлено на усмотрение референдума, в результате которого было создано свободное государство. Однако неспособность города сформировать правительство только придала смелости регионалистам прежнего мандата, что привело к штурму ими Ландтага и созданию независимой земли Шлезвиг-Гольштейн. Новое правительство «Ландволк», крайне ксенофобское и националистическое, пришло к власти, сигнализируя об окончании иностранного влияния в Киле." # [This.GetNewspaperHeader]The product of Germany’s humiliating defeat in the Great War, the Kiel mandate has been embroiled in instability since its creation in 1922, with extremists on every side duking out with the government and each other for control of the vital Kiel Canal and all that surrounds it.\n\nWith London unable to continue supporting the mandate, its future was left up to a referendum, resulting in the creation of a free state. However, the city’s inability to form a government has only emboldened the regionalists of the former mandate, resulting in their storming of the Landtag and creation of an independent Schleswig-Holstein. Highly xenophobic and nationalist, the new ‘Landvolk’ government has taken over, signalling the end of foreign influences in Kiel.
 fxnews.147.a: "Народ победил!" # The people are victorious!
 fxnews.147.b: "Лучше они, чем красные..." # Better them than the reds...
 fxnews.147.c: "Полнейшая глупость." # Utter folly.
 fxnews.147.e: "А что насчет канала?" # What about the canal?
         
 fxnews.148.t: "Немецкие эмигранты формируют правительство в Киле" # German Exiles Form Government in Kiel
 fxnews.148.d: "[This.GetNewspaperHeader]Появившийся в результате унизительного поражения Германии в Великой войне, Кильский мандат был охвачен нестабильностью с момента его создания в 1922 году: экстремисты со всех сторон боролись с правительством и друг с другом за контроль над жизненно важным Кильским каналом и всем, что его окружает.\n\nПоскольку Лондон не смог продолжать поддерживать мандат, его будущее было оставлено на усмотрение референдума, в результате которого было создано свободное государство. Вмешавшись, чтобы заполнить вакуум, немецкие изгнанники сформировали новое, националистическое правительство, неразрывно противостоящее Рейху. Состоящая из последователей и союзников бывшего канцлера Курта фон Шлейхера, еще неизвестно, как Берлин отреагирует на их продолжающееся окружение, поскольку напряженность в Европе продолжает расти." # [This.GetNewspaperHeader]The product of Germany’s humiliating defeat in the Great War, the Kiel mandate has been embroiled in instability since its creation in 1922, with extremists on every side duking out with the government and each other for control of the vital Kiel Canal and all that surrounds it.\n\nWith London unable to continue supporting the mandate, its future was left up to a referendum, resulting in the creation of a free state. Stepping in to fill the vacuum, German exiles have formed a new, nationalist government inextricably opposed to the Reich. Made up of the followers and allies of former chancellor Kurt von Schleicher, it remains to be seen how Berlin will react to their continued encirclement as tensions in Europe continue to rise.
 fxnews.148.a: "Долой валькизм!" # Down with valkism!
 fxnews.148.b: "Они республиканцы, верно?" # They are republicans, right?
 fxnews.148.c: "Эти головорезы поплатятся за свою наглость!" # These goons shall pay for their insolence!
 fxnews.148.e: "Призрак Веймара преследует Германию..." # The ghost of Weimar haunts Germany...
         
 fxnews.149.t: "Социал-демократическое правительство в Киле" # Social Democratic Government in Kiel
 fxnews.149.d: "[This.GetNewspaperHeader]Появившийся в результате унизительного поражения Германии в Великой войне, Кильский мандат был охвачен нестабильностью с момента его создания в 1922 году: экстремисты со всех сторон боролись с правительством и друг с другом за контроль над жизненно важным Кильским каналом и всем, что его окружает.\n\nПоскольку Лондон не мог продолжать поддерживать мандат, его будущее было оставлено на усмотрение референдума, что привело к печальной победе тех, кто желал объединения с Рейхом. Военная интервенция, которая была признана неприемлемым результатом, была осуществлена ​​в соответствии с мандатом, за которым последовал вакуум власти, который привел к власти социал-демократов. Берлин, который когда-то считался в Германии израсходованной силой, уже осудил новое правительство, поскольку Европа продолжает двигаться к войне." # [This.GetNewspaperHeader]The product of Germany’s humiliating defeat in the Great War, the Kiel mandate has been embroiled in instability since its creation in 1922, with extremists on every side duking out with the government and each other for control of the vital Kiel Canal and all that surrounds it.\n\nWith London unable to continue supporting the mandate, its future was left up to a referendum, resulting in an upset victory for those who desired unification with the Reich. Deemed to be an unacceptable result, a military intervention by the mandate was executed, followed by a power vacuum that has propelled the social democrats to power. Once thought of as a spent force in Germany, Berlin has already denounced the new government as Europe continues to barrel towards war.
 fxnews.149.a: "Долой валькизм!" # Down with valkism!
 fxnews.149.b: "Киль остается в надежных руках." # Kiel remains in steady hands.
 fxnews.149.c: "Они потерпят неудачу, как и их предшественники!" # They will fail like their predecessors did!
 fxnews.149.e: "Кажется, еще есть надежда на немецкую демократию." # It seems there still is hope for German democracy.

 fxnews.150.t: "Франция оккупирует Риф" # France Occupies the Rif
 fxnews.150.d: "[This.GetNewspaperHeader]Сегодня были замечены французские колониальные солдаты, входящие в Танжер, а Париж сослался на необходимость не допустить попадания этого района в руки политических экстремистов и восстановить порядок.\n\nЭти агрессивные действия были приписаны поражению испанских республиканцев, в результате чего Париж начал беспокоиться о ситуации с безопасностью в Западном Средиземноморье, что привело к их решению сократить потери. Никаких заявлений от остальных фракций, участвующих в конфликте, не последовало, хотя ясно, что какая бы фракция ни выиграла конфликт, они не будут дружить со своим северным соседом." # [This.GetNewspaperHeader]Today, French colonial soldiers have been seen entering Tangiers, with Paris citing a need to prevent the area from falling into the hands of political extremists and restore order\n\nThis aggressive action has been chalked up to the defeat of the Spanish Republicans, causing Paris to grow concerned about the security situation in the Western Mediterranean, leading to their decision to cut losses. No statements have been forthcoming from the remaining factions in the conflict, although it is clear that whichever faction has won the conflict, they will not be friendly with their northen neighbour.
 fxnews.150.a: "Испания падает дальше..." # Spain falls further...

 fxnews.151.t: "Падение Франции" # The Fall of France
 fxnews.151.d.noengita: "[This.GetNewspaperHeader]Когда закончилась Великая война и замолчали пушки над Европой, казалось, что державы прошлого, Великобритания и Франция утвердили свое господство над растущей Германией, повалив сравнительно молодую нацию на землю с такой силой и жестокостью, что многие считали невозможным для Германии самоутвердиться когда-либо снова.\n\nКогда-то критики нового немецкого режима стали объектом множества шуток своих недоброжелателей, а теперь замолчали, поскольку Германия, несомненно, сделала то, что сделал Кайзеррейх. не смог – разгромить и оккупировать Францию. Поскольку Франция исчезла из поля зрения, многие теперь считают, что доминирование Германии на континенте — это лишь вопрос времени, поскольку образ немецких солдат, марширующих по Триумфальной арке, потрясает мир до глубины души." # [This.GetNewspaperHeader]When the Great War ended and the guns over Europe fell silent, it seemed that the powers of old, Britain and France had asserted dominance over the rising Germany, beating the comparatively young nation into the ground with such force and cruelty that many had thought it impossible for Germany to assert herself ever again.\n\nOnce the butt of many jokes by their detractors, the critics of the new German regime have now fallen silent as Germany has undeniably done what the Kaiserreich was unable to - to defeat and occupy France. With France out of the picture, many now believe that it is only a matter of time before Germany dominates the continent as the image of German soldiers marching down the Arc de Triomphe shakes the world to its very core.
 fxnews.151.d.engita: "[This.GetNewspaperHeader]Когда закончилась Великая война и замолчали пушки над Европой, казалось, что державы прошлого, Великобритания и Франция утвердили свое господство над растущей Германией, повалив сравнительно молодую нацию на землю с такой силой и жестокостью, что многие считали невозможным для Германии самоутвердиться когда-либо снова.\n\nКогда-то критики нового немецкого режима стали объектом множества шуток своих недоброжелателей, а теперь замолчали, поскольку Германия, несомненно, сделала то, что сделал Кайзеррейх. не смог – разгромить и оккупировать Францию. Поскольку Франция исчезла из поля зрения, теперь только Рим и Лондон остаются последними державами Антанты в Европе, противостоящими, казалось бы, неудержимому Херу, и многие полагают, что это вопрос времени, когда их постигнет та же участь, которая постигла Францию." # [This.GetNewspaperHeader]When the Great War ended and the guns over Europe fell silent, it seemed that the powers of old, Britain and France had asserted dominance over the rising Germany, beating the comparatively young nation into the ground with such force and cruelty that many had thought it impossible for Germany to assert herself ever again.\n\nOnce the butt of many jokes by their detractors, the critics of the new German regime have now fallen silent as Germany has undeniably done what the Kaiserreich was unable to - to defeat and occupy France. With France out of the picture, now only Rome and London remain as the last Entente powers in Europe standing against the seemingly unstoppable Heer, with many believing it a matter of time before the same fate that befell France befalls them too.
 fxnews.151.d.ita: "[This.GetNewspaperHeader]Когда закончилась Великая война и замолчали пушки над Европой, казалось, что державы прошлого, Великобритания и Франция утвердили свое господство над растущей Германией, повалив сравнительно молодую нацию на землю с такой силой и жестокостью, что многие считали невозможным для Германии самоутвердиться когда-либо снова.\n\nКогда-то критики нового немецкого режима стали объектом множества шуток своих недоброжелателей, а теперь замолчали, поскольку Германия, несомненно, сделала то, что сделал Кайзеррейх. не смог – разгромить и оккупировать Францию. Поскольку Франция исключена из поля зрения, только Италия, «наименьшая из великих держав», остается противостоять буйству Германии в Европе, и многие считают, что это вопрос времени, когда немцы снова пересекут Альпы, чтобы утолить свою дальнейшую жажду завоеваний." # [This.GetNewspaperHeader]When the Great War ended and the guns over Europe fell silent, it seemed that the powers of old, Britain and France had asserted dominance over the rising Germany, beating the comparatively young nation into the ground with such force and cruelty that many had thought it impossible for Germany to assert herself ever again.\n\nOnce the butt of many jokes by their detractors, the critics of the new German regime have now fallen silent as Germany has undeniably done what the Kaiserreich was unable to - to defeat and occupy France. With France out of the picture, only Italy, ‘the least of the great powers’, remains to oppose Germany’s rampage across Europe, with many believing it a matter of time before the Germans cross the Alps once more to satiate their further hunger for conquest.
 fxnews.151.d.eng: "[This.GetNewspaperHeader]Когда закончилась Великая война и замолчали пушки над Европой, казалось, что державы прошлого, Великобритания и Франция утвердили свое господство над растущей Германией, повалив сравнительно молодую нацию на землю с такой силой и жестокостью, что многие считали невозможным для Германии самоутвердиться когда-либо снова.\n\nКогда-то критики нового немецкого режима стали объектом множества шуток своих недоброжелателей, а теперь замолчали, поскольку Германия, несомненно, сделала то, что сделал Кайзеррейх. не смог – разгромить и оккупировать Францию. Поскольку Франция исключена из поля зрения, одинокий остров Великобритании является единственным, что стоит между Германией и полной победой в Западной Европе, и многие полагают, что это вопрос времени, когда Империя уступит немецкому натиску." # [This.GetNewspaperHeader]When the Great War ended and the guns over Europe fell silent, it seemed that the powers of old, Britain and France had asserted dominance over the rising Germany, beating the comparatively young nation into the ground with such force and cruelty that many had thought it impossible for Germany to assert herself ever again.\n\nOnce the butt of many jokes by their detractors, the critics of the new German regime have now fallen silent as Germany has undeniably done what the Kaiserreich was unable to - to defeat and occupy France. With France out of the picture, the lonely island of Great Britain is the only thing standing between Germany and total victory in Western Europe, with many believing it a matter of time before the Empire succumbs to the German onslaught.
 worldnews_fall_of_france_GER: "Зиг Хайль!" # Sieg Heil!
 worldnews_fall_of_france_FRA: "Мы вернемся..." # We will return...
 worldnews_fall_of_france_SOV: "Это не предвещает ничего хорошего..." # This does not forbode well...
 worldnews_fall_of_france_JAP: "Дальний Восток открыт!" # The Far East lays open!
 worldnews_fall_of_france_USA: "О, Боже." # Dear God.
 worldnews_fall_of_france_ENG: "Какой ужас!" # How horrible!
 worldnews_fall_of_france_ITA: "Мы должны воспользоваться моментом!" # We must seize the day!
 worldnews_fall_of_france_GER_allies: "Германию невозможно остановить – победа неминуема!" # Germany cannot be stopped - victory is imminent!
 worldnews_fall_of_france_FRA_allies: "Мы должны сражаться дальше!" # We must fight on!
 worldnews_fall_of_france_anglo_allies: "Что это будет означать для Европы?" # What will this mean for Europe?
 worldnews_fall_of_france_socialist: "Реакция — неизбежный результат капитализма." # Reaction is the inevitable result of capitalism.
 worldnews_fall_of_france_normal: "Фюрер сделал то, чего не смог кайзер." # The Führer has done what the Kaiser could not.

 fxnews.153.t: "Ремилитаризация Гамбурга" # The Remilitarization of Hamburg
 fxnews.153.d: "[This.GetNewspaperHeader]С момента окончания Великой войны Кильский мандат оставался одним из самых острых вопросов раздора между побежденными немцами и победившей Антантой. С его созданием Германии было запрещено посылать свои военные силы в Гамбург и прилегающие к мандату регионы, в результате чего администрация Киля была в полной безопасности от Германии.\n\nОднако после возникновения новой ультранационалистической Германии и отказа от Версаля демилитаризованный статус этой территории считался отложенным. Заявив о своем праве на территориальный суверенитет, новое правительство Германии во главе с фюрером [GER.GetLeader] ввело войска в демилитаризованную зону. Учитывая отсутствие реакции со стороны бывших держав Антанты, теперь ясно, что..." # [This.GetNewspaperHeader]Ever since the end of the Great War, the Kiel mandate remained as one of the most sore points of contention between the defeated Germans and triumphant Entente. With its establishment, Germany was barred from sending her military into Hamburg and the regions adjacent to the mandate, leaving the Kiel administration to be totally secure from Germany.\n\nFollowing the rise of a new ultranationalist Germany however and the repudiation of Versailles, the demilitarized status of this area was thought to be on borrowed time. Declaring its right to territorial sovereignty, the new German government headed by Führer [GER.GetLeader] has sent troops into the demilitarized zone. With a lack of response by the former Entente powers, it is now clear that...
 fxnews.153.a: "...это первый шаг к освобождению Германии!" # ...this is the first step to Germany’s liberation!
 fxnews.153.b: "...Берлин невозможно приручить." # ...Berlin can not be tamed.
 fxnews.153.c: "...последний остаток Версаля разрушен." # ...the last vestige of Versailles has been broken.

 fxnews.154.t: "Распад Антанты" # Collapse of the Entente
 fxnews.154.d.no_entente_remnant: "[This.GetNewspaperHeader]В конце Великой войны считалось, что победоносный альянс, простирающийся через Атлантику, раз и навсегда восторжествовал. Мир должен был стать владением держав-победительниц, особенно Франции и ее союзников. Для многих это был момент, когда либеральная демократия даже стала триумфальной системой правления.\n\nОднако Антанта знавала и лучшие дни. Сильно ослабленный уходом Соединенных Штатов, альянс вскоре раскололся между Лондоном и Парижем, и Великобритания тоже решила пойти своим путем. В условиях, когда восходящие державы нападают на Антанту в борьбе за новый мировой порядок, альянс теперь полностью распался, и все его члены так или иначе потерпели поражение. Следом обязательно наступит новая эра." # [This.GetNewspaperHeader]At the end of the Great War, the victorious alliance stretching across the Atlantic was thought to have once and for all prevailed. The world was to be the domain of the victorious powers, most especially France and her allies. To many, it was to be the point at which liberal democracy had ascended as the triumphant system of government even.\n\nThe Entente however has seen better days. Greatly weakened by the departure of the United States, the alliance would soon split between London and Paris with Britain opting to go her own way as well. With rising powers bearing down on the Entente in a struggle for a new world order, the alliance has now totally collapsed with all of its members having been defeated one way or another. A new age is sure to come next.
 fxnews.154.d: "[This.GetNewspaperHeader]В конце Великой войны считалось, что победоносный альянс, простирающийся через Атлантику, раз и навсегда восторжествовал. Мир должен был стать владением держав-победительниц, особенно Франции и ее союзников. Для многих это был момент, когда либеральная демократия даже стала триумфальной системой правления.\n\nОднако Антанта знавала и лучшие дни. Сильно ослабленный уходом Соединенных Штатов, альянс вскоре раскололся между Лондоном и Парижем, и Великобритания тоже решила пойти своим путем. В условиях, когда восходящие державы нападают на Антанту в борьбе за новый мировой порядок, альянс теперь полностью распался, и лишь немногие его члены способны устоять, когда в мире наступает новая эра." # [This.GetNewspaperHeader]At the end of the Great War, the victorious alliance stretching across the Atlantic was thought to have once and for all prevailed. The world was to be the domain of the victorious powers, most especially France and her allies. To many, it was to be the point at which liberal democracy had ascended as the triumphant system of government even.\n\nThe Entente however has seen better days. Greatly weakened by the departure of the United States, the alliance would soon split between London and Paris with Britain opting to go her own way as well. With rising powers bearing down on the Entente in a struggle for a new world order, the alliance has now totally collapsed with only a scant few members able to hold out as a new age dawns on the world.
 worldnews_no_more_entente_GER: "Германия, отечество, мы идём!" # Deutschland, Vaterland, wir kommen schon!
 worldnews_no_more_entente_GER_enemy: "Но даже в этом случае они не одержат победу!" # Even so, they shall not prevail!
 worldnews_no_more_entente_ENG: "Назревает полная катастрофа." # A total disaster in the making.
 worldnews_no_more_entente_SOV: "Капиталистический порядок подходит к своему окончательному завершению." # The capitalist order is reaching its final conclusion.
 worldnews_no_more_entente_JAP: "Западный мировой порядок рушится." # The Western world order is collapsing.
 worldnews_no_more_entente_USA: "Демократия сейчас под угрозой..." # Democracy is now under siege...
 worldnews_no_more_entente_ITA: "Кажется, мы увернулись от пули!" # It appears we have dodged a bullet!
 worldnews_no_more_entente_socialist: "Либеральная слабость всегда проигрывает." # Liberal weakness always loses.
 worldnews_no_more_entente_normal: "Начало нового мира..." # The beginning of a new world...

 fxnews.155.t: "Конец Второй мировой войны" # The End of World War Two
 fxnews.156.t: "Конец Второй Великой войны" # The End of the Second Great War
 fxnews.155.d: "[This.GetNewspaperHeader]В результате потрясающего поворота событий старые враги Первой мировой войны снова столкнулись в войне за судьбу не только Европы, но, теперь, казалось бы, всего мира. Однако, несмотря на все шансы, сложившиеся против них, вновь оживившаяся Германия успешно одержала досадную победу над некогда доминирующими державами Антанты, при этом весь реформированный альянс сталкивается с постоянными неудачами в Европе и за рубежом.\n\nПоскольку ни одна из сторон не была в состоянии полностью победить другую, и Берлин, и Вашингтон объединились, чтобы положить конец войне, хотя и на условиях, явно в пользу Германии и ее союзников. Этим мастерским ходом старый мировой порядок подошел к жалкому концу, а Рейх торжествует." # [This.GetNewspaperHeader]In an earth-shaking turn of events, the old enemies of the first Great War would once again face off in a war over the fate of not just Europe, but now seemingly the world. Despite all the odds stacked against them however, the newly invigorated Germany has successfully pulled off an upset victory over the once-dominant Entente powers, with all of the reformed alliance facing constant setbacks in Europe and abroad.\n\nAs neither side were in the position to totally defeat the other, both Berlin and Washington have come together to end the war, though on terms clearly in favour of Germany and its allies. With this masterstroke, the old world order has come to a pitiful end as the Reich reigns triumphant.
 fxnews.156.d: "[This.GetNewspaperHeader]В результате потрясающего поворота событий старые враги Первой мировой войны снова столкнулись в войне за судьбу Европы. Однако, несмотря на все шансы, сложившиеся против них, недавно воодушевленная Германия успешно одержала досадную победу над некогда доминирующими державами Антанты, при этом все континентальные союзники Британии были повержены.\n\nПоскольку ни одна из сторон, по-видимому, не была в состоянии полностью покончить с другой, и Германия, и Великобритания решили прекратить боевые действия, хотя наблюдатели отметили, что эти условия были весьма благоприятны для Берлина и ее союзников. Теперь, когда британцы изгнаны из любой европейской системы, а Германия победила на континенте, похоже, что порядок Антанты подошел к концу." # [This.GetNewspaperHeader]In an earth-shaking turn of events, the old enemies of the first Great War would once again face off in a war over the fate of Europe. Despite all the odds stacked against them however, the newly invigorated Germany has successfully pulled off an upset victory over the once-dominant Entente powers, with all of Britain’s continental allies laid low.\n\nAs neither side was seemingly able to fully finish off the other, both Germany and Britain have opted to end hostilities, though observers have noted the terms to be highly favourable for Berlin and her allies. With the British now expelled from any sort of European system and Germany victorious on the continent, it appears that the Entente order has come to a feeble end.
 worldnews_GER_wins_ww2_GER: "Народ встаньте!" # Das Volk steht auf!
 worldnews_GER_wins_ww2_GER_ally: "Нас ждет новый мир!" # A new world awaits us!
 worldnews_GER_wins_ww2_GER_enemy: "Это будет непросто..." # This will not be easy...
 worldnews_GER_wins_ww2_JAP: "Крах империализма скоро наступит..." # The collapse of imperialism will soon come...
 worldnews_GER_wins_ww2_USA: "Темный день для человечества..." # A dark day for humanity...
 worldnews_GER_wins_ww2_ENG: "Темный день для империи..." # A dark day for the empire...
 worldnews_GER_wins_ww2_socialist: "Либерализм никогда не мог надеяться на то, что его будет достаточно." # Liberalism could never hope to suffice.
 worldnews_GER_wins_ww2_normal: "Нас ждет новый мир..." # A new world awaits us...

 fxnews.157.t: "Война в Центральной Европе" # War in Central Europe
 fxnews.157.d: "[This.GetNewspaperHeader]Подъём режима валкистов в Германии не остался незамеченным для народов, окружавших Рейх. Несмотря на свои пангерманские заявления, соседи Германии вышли невредимыми из волны валкистов, в результате чего вопрос пангерманского объединения задержался.\n\nС падением немецких мандатов и приходом к власти новых правительств вместо них Берлин вскоре окажется в окружении нового поддерживаемого Западом альянса. Не испугавшись, пангерманские амбиции Германии теперь привели к войне в самом сердце Европы между новым альянсом и Берлином. Хотя немногие могут отрицать храбрость молодых наций, сражающихся с Германией, еще меньше людей ожидают какого-либо результата, кроме создания смелой, закаленной в войне Германии." # [This.GetNewspaperHeader]The rise of the Valkist regime in Germany was not to go unnoticed by the nations surrounding the Reich. Despite their pan-German proclamations, Germany’s neighbours came out unscathed from the Valkist surge - causing the question of pan-German unification to linger.\n\nWith the fall of the German mandates and the rise of new governments in their stead, Berlin would soon find herself encircled by a new Western-backed alliance. Undeterred, Germany’s pan-German ambitions have now resulted in a war in the heart of Europe between the new alliance and Berlin. Although few can deny the bravery of the young nations fighting Germany, even fewer expect any outcome besides the creation of an emboldened, war-hardened Germany.
 fxnews.157.a: "Это окажется простым." # This will prove simple.
 fxnews.157.b: "Родина, ты снова моя!" # Heimat du bist wieder mein!
 fxnews.157.b_alt: "Мы должны остановить Германию!" # We must stop Germany!
 fxnews.157.c: "Сможет ли мир в Европе пережить этот удар?" # Can peace in Europe survive this blow?

 fxnews.158.t: "Консолидация «Стрела-скрещение» в Венгрии" # Arrow-Cross Consolidation in Hungary
 fxnews.158.d: "[This.GetNewspaperHeader]Будучи одним из проигравших в Великой войне, мало кто ожидал, что оставшееся венгерское государство хоть как-то вернется. Поскольку большая часть исторически принадлежавшей ему территории была отторгнута, многие думали, что Будапешту придется довольствоваться третьеразрядной державой по отношению к любому балканскому блоку. Однако ситуация кардинально изменилась после возвращения Венгрией своих старых земель.\n\nСтавший печально известным своими демагогическими и ультранационалистическими декларациями, венгерский лидер Ференц Салаши теперь укрепил свою власть в восходящем венгерском государстве, объявив себя Везером. Поскольку его «зеленорубашечники» приобрели известность за свою жестокость по отношению к меньшинствам, многие опасаются того, что будет дальше с Будапештом." # [This.GetNewspaperHeader]Being one of the losers of the Great War, few expected the rump Hungarian state to make any sort of comeback. With most of its historically owned territory ripped away, many thought that Budapest would have to make do as a third-rate power to any Balkan bloc. This, however, has changed drastically with Hungary’s reclamation of her old lands.\n\nBecoming infamous for his demagogic and ultranationalist declarations, Hungarian leader Ferenc Szálasi has now consolidated his power in the ascendant Hungarian state, declaring himself Vezér. With his Greenshirts gaining notoriety for their brutality against minorities, many are wary of what comes next for Budapest.
 fxnews.158.a: "Просыпайся, венгерка!" # Ébredj Magyar!
 fxnews.158.b: "Ужасный." # Awful.
 fxnews.158.c: "Они - прыгающая сумасшедшая компания." # They are a hopping mad bunch.
 fxnews.158.e: "Возможно, Салаши сможет обеспечить сильное руководство, в котором нуждается Венгрия?" # Perhaps Szálasi can provide the strong leadership Hungary needs?

 fxnews.159.t: "Президент Салаши свергнут" # President Szálasi Overthrown
 fxnews.159.d: "[This.GetNewspaperHeader]Будучи одним из проигравших в Великой войне, мало кто ожидал, что оставшееся венгерское государство хоть как-то вернется. Поскольку большая часть исторически принадлежавшей ему территории была отторгнута, многие думали, что Будапешту придется довольствоваться третьеразрядной державой по отношению к любому балканскому блоку. Ситуация, однако, коренным образом изменилась после того, как Венгрия вернула свои старые земли.\n\nДостигнув известности в качестве прямолинейного премьер-министра при буйном и зачастую причудливом президенте Салаши, Бела Имреди, похоже, изменил ситуацию в Скрещенных Стрелах в их скрытой борьбе за власть с помощью государственного переворота. Хотя сам Имреди не является президентом Венгрии, большинство знает, где сейчас находится истинная власть в Будапеште." # [This.GetNewspaperHeader]Being one of the losers of the Great War, few expected the rump Hungarian state to make any sort of comeback. With most of its historically owned territory ripped away, many thought that Budapest would have to make do as a third-rate power to any Balkan bloc. This, however, has changed drastically with Hungary’s reclamation of her old lands.\n\nRising to prominence as the straight-laced prime minister to the boisterous and often-fanciful president Szálasi, Béla Imrédy has seemingly turned the tables on the Arrow-Cross in their latent power struggle with a coup. While Imrédy himself does not reign as the president of Hungary, most know where the true power in Budapest now lies.
 fxnews.159.a: "Лучшее будущее – храни Бог!" # Jobb jövőt - Adjon Isten!
 fxnews.159.b: "Действительно ли они лучше зеленорубашечников?" # Are they truly better than the Greenshirts?
 fxnews.159.c: "Наконец-то хорошие новости с Балкан!" # At last, some good news from the Balkans!
 fxnews.159.e: "Они кажутся более типичными." # They seem to be more typical.

 fxnews.160.t: "Республиканцы захватили мандат в Рейнской области" # Republicans Take Over Rhineland Mandate
 fxnews.160.d: "[This.GetNewspaperHeader]Передача Рейнской области от Германии под международный мандат после окончания Великой войны, являющейся одним из центров немецкой промышленности, вызвала большие споры. Поскольку и Берлин, и Париж боролись друг с другом за влияние на мандат, многие предполагали, что Рейнская область должна была остаться за Парижем.\n\nОднако с приходом к власти Дресслера судьба продемонстрировала другие планы относительно мандата. Поддерживая антифранцузские настроения, изгнанники из самой Германии взяли на себя инициативу и одержали победу на национальной конференции, которая решила судьбу Рейнской области, при этом оставшиеся мандатные державы поддержали их захват. Будучи ненавистными врагами Берлина, их претензии на легитимность заставляют задуматься, смогут ли они действительно вернуть себе Рейх." # [This.GetNewspaperHeader]As one of the hearts of German industry, the cession of the Rhineland from Germany to an international mandate following the end of the Great War has been a matter of great controversy. With both Berlin and Paris wrestling with one another for influence over the mandate, many presumed that the Rhineland was to remain with Paris.\n\nWith the rise of Dressler however, fate has demonstrated other plans for the mandate. Rallying anti-French sentiment, exiles from Germany proper have taken the initiative and come out victorious at a national conference to decide the Rhineland’s fate, with the remaining mandate powers supporting their takeover. As the hated enemy of Berlin, their claim to legitimacy leaves one to wonder if they can truly reclaim the Reich.
 fxnews.160.a: "Немецкий народ!" # Dem deutschen Volke!
 fxnews.160.b: "Могут ли они учиться на ошибках Веймара?" # Can they learn from Weimar's mistakes?
 fxnews.160.c: "Неудачный поворот событий..." # An unfortunate turn of events...
 fxnews.160.e: "Преступники, предатели – скоро повесят!" # Criminals, traitors - they shall hang soon!

 fxnews.161.t: "Федералисты захватили мандат в Рейнской области" # Federalists Take Over Rhineland Mandate
 fxnews.161.d: "[This.GetNewspaperHeader]Передача Рейнской области от Германии под международный мандат после окончания Великой войны, являющейся одним из центров немецкой промышленности, вызвала большие споры. Поскольку и Берлин, и Париж боролись друг с другом за влияние на мандат, многие предполагали, что Рейнская область должна была остаться за Парижем.\n\nОднако с приходом к власти Дресслера судьба продемонстрировала другие планы относительно мандата. Заключив союз федералистов, изгнанники из самой Германии и сепаратисты захватили Рейнскую землю, а оставшиеся мандатные державы поддержали их захват. Поскольку они являются ненавистными врагами самой Германии, их претензии на легитимность заставляют задуматься, смогут ли они действительно вернуть себе Рейх." # [This.GetNewspaperHeader]As one of the hearts of German industry, the cession of the Rhineland from Germany to an international mandate following the end of the Great War has been a matter of great controversy. With both Berlin and Paris wrestling with one another for influence over the mandate, many presumed that the Rhineland was to remain with Paris.\n\nWith the rise of Dressler however, fate has demonstrated other plans for the mandate. Striking a federalist alliance, exiles from Germany proper and separatists have taken over the Rhenish state, with the remaining mandate powers supporting their takeover. As the hated enemy of Germany proper, their claim to legitimacy leaves one to wonder if they can truly reclaim the Reich.
 fxnews.161.a: "Единство, справедливость и свобода!" # Einigkeit und Recht und Freiheit!
 fxnews.161.b: "Могут ли они учиться на ошибках Веймара?" # Can they learn from Weimar's mistakes?
 fxnews.161.c: "Лучше тот дьявол, которого мы знаем, верно?" # Better the devil we know, right?
 fxnews.161.e: "Эта стайка национал-предателей скоро будет наказана!" # This gaggle of national-traitors shall soon be punished!

 fxnews.162.t: "Сепаратисты захватили мандат в Рейнской области" # Separatists Take Over Rhineland Mandate
 fxnews.162.d: "[This.GetNewspaperHeader]Передача Рейнской области от Германии под международный мандат после окончания Великой войны, являющейся одним из центров немецкой промышленности, вызвала большие споры. Поскольку и Берлин, и Париж боролись друг с другом за влияние на мандат, многие предполагали, что Рейнская область должна была остаться за Парижем.\n\nЭти прогнозы сбылись: сепаратистская коалиция социалистов и консерваторов взяла под свой контроль Рейнское государство после своей победы на национальной конференции, которая решила судьбу Рейнской области с благословения мандатных держав. Учитывая сообщения о существенном внутреннем сопротивлении и регулярных обвинениях со стороны Рейха, можно только предполагать, смогут ли они сохранить независимость Рейнской области." # [This.GetNewspaperHeader]As one of the hearts of German industry, the cession of the Rhineland from Germany to an international mandate following the end of the Great War has been a matter of great controversy. With both Berlin and Paris wrestling with one another for influence over the mandate, many presumed that the Rhineland was to remain with Paris.\n\nThese predictions have come true, with a separatist coalition of socialists and conservatives taking control of the Rhenish state following their victory at the national conference to decide the fate of the Rhineland, with the blessing of the mandate powers. With reports of substantial internal resistance and regular denunciations from the Reich, one can only speculate if they can keep the Rhineland independent.
 fxnews.162.a: "За свободную Рейнскую область!" # Für Freie Rheinland!
 fxnews.162.b: "Рейнская область остается привязанной к Парижу..." # The Rhineland remains tied to Paris...
 fxnews.162.c: "Лучшего результата нет!" # There is no better outcome!
 fxnews.162.e: "Народ отбросит захватчика, как в 1813 году!" # The Volk shall throw back the invader as in 1813!

 fxnews.163.t: "Конец Рейнского мандата" # The End of the Rhineland Mandate
 fxnews.163.d: "[This.GetNewspaperHeader]Передача Рейнской области от Германии под международный мандат после окончания Великой войны, являющейся одним из центров немецкой промышленности, вызвала большие споры. Поскольку и Берлин, и Париж боролись друг с другом за влияние на мандат, многие предполагали, что Рейнская область должна была остаться за Парижем.\n\nЭти предсказания сбылись: популярный мэр Конрад Аденауэр и его католическая центристская партия взяли под свой контроль Рейнское государство после победы сепаратистов на национальной конференции, которая решила судьбу Рейнской области, с благословения мандатных полномочий. Учитывая сообщения о распрях и регулярные обвинения со стороны Рейха, можно только предполагать, смогут ли они сохранить Рейнскую область свободной." # [This.GetNewspaperHeader]As one of the hearts of German industry, the cession of the Rhineland from Germany to an international mandate following the end of the Great War has been a matter of great controversy. With both Berlin and Paris wrestling with one another for influence over the mandate, many presumed that the Rhineland was to remain with Paris.\n\nThese predictions have come true, with the popular mayor Konrad Adenauer and his Catholic Centre Party taking control of the Rhenish state following separatist victory at the national conference to decide the fate of the Rhineland, with the blessing of the mandate powers. With reports of infighting coming out and regular denunciations from the Reich, one can only speculate if they can keep the Rhineland free.
 fxnews.163.a: "За свободную Рейнскую область!" # Für Freie Rheinland!
 fxnews.163.b: "Признак перемены времен?" # A sign of the changing times?
 fxnews.163.c: "Лучше он, чем дураки." # Better him than fools.
 fxnews.163.e: "Бессовестный, слабоумный предатель!" # A shameless, feeble-minded traitor!

 fxnews.164.t: "Переворот в Будапеште" # Coup in Budapest
 fxnews.164.d: "[This.GetNewspaperHeader]Будучи одним из проигравших в Великой войне, мало кто ожидал, что оставшееся венгерское государство хоть как-то вернется. Поскольку большая часть исторически принадлежавшей ему территории была отторгнута, многие думали, что Будапешту придется довольствоваться третьеразрядной державой по отношению к любому балканскому блоку. Однако ситуация радикально изменилась после того, как Венгрия вернула свои старые земли.\n\nВозможно, это шокирует, но ни президент Салаши, ни премьер-министр Имреди не одержали верх в недавней борьбе за власть. По-видимому, устав от дальнейшего скатывания к радикализму, военные в сотрудничестве с демократической оппозицией и аристократией свергли ультранационалистическое правительство, провозгласив новое будущее Венгрии." # [This.GetNewspaperHeader]Being one of the losers of the Great War, few expected the rump Hungarian state to make any sort of comeback. With most of its historically owned territory ripped away, many thought that Budapest would have to make do as a third-rate power to any Balkan bloc. This, however, has changed drastically with Hungary’s reclamation of her old lands.\n\nPerhaps shockingly, neither president Szálasi nor prime minister Imrédy have come on top in the recent power struggle. Seemingly sick of the further slide into radicalism, the military in collaboration with democratic opposition and the aristocracy have overthrown the ultranationalist government, heralding a new future for Hungary.
 fxnews.164.a: "Боже, благослови венгров." # Isten, áldd meg a magyart.
 fxnews.164.b: "Похоже, в Будапешт возвращается нормальная жизнь..." # It appears normalcy returns to Budapest...
 fxnews.164.c: "Лучше с ними будет проще работать..." # They better be easier to work with...
 fxnews.164.e: "Надеюсь, из этого следует правильный результат." # Hopefully the right outcome comes from this.

 fxnews.165.t: "Игры XI Олимпиады: Берлин 1936 г." # Games of the XI Olympiad: Berlin 1936
 fxnews.165.d: "[This.GetNewspaperHeader]Олимпийские игры 1936 года, официально именуемые Играми XI Олимпиады, завершились. Изначально XI Олимпиаду планировалось провести в Барселоне, но из-за начала гражданской войны Международный олимпийский комитет решил вместо этого передать Игры Германии.\n\nОфициально названные «Берлин 1936» со слоганом «Я призываю молодежь мира!», Олимпийские игры в Берлине были тщательно разработаны Германией, чтобы показать миру образ динамичной, энергичной и модернизирующейся нации. В нем приняли участие почти пятьдесят стран, при этом немецкие спортсмены завоевали наибольшее количество медалей - 103 медали и 40 золотых, что намного опередило занявшие второе место Соединенные Штаты с 53 медалями, 23 из которых золотые." # [This.GetNewspaperHeader]The 1936 Olympic Games, officially The Games of the XI Olympiad, have concluded. Hosted in Berlin, the XI Olympiad was originally planned to be hosted in Barcelona, before the outbreak of civil war led the International Olympic Committee to instead award the Games to Germany.\n\nOfficially branded as \"Berlin 1936\" with the slogan \"I call the Youth of the World!\", the Berlin Olympics have been carefully crafted by Germany to show the world an image of a dynamic, energetic and modernizing nation. Nearly fifty nations participated, with the German athletes taking the greatest number of medals of 103 total  medals with 40 gold, far ahead of the second-place United States with 53 total medals, 23 of which are gold.
 fxnews.165.a: "Германия пробуждается!" # Deutschland Erwacht!
 fxnews.165.b: "Мы сделали все возможное!" # We did our best!
 fxnews.165.c: "Не что иное, как накрасить свинью помадой." # Nothing more than putting lipstick on a pig.
 fxnews.165.e: "Надеюсь, мы сможем принять участие в следующий раз..." # Hopefully we can participate next time...

 fxnews.166.t: "Игры XI Олимпиады: Лозанна 1936 г." # Games of the XI Olympiad: Lausanne 1936
 fxnews.166.d: "[This.GetNewspaperHeader]Олимпийские игры 1936 года, официально именуемые Играми XI Олимпиады, завершились. Первоначально XI Олимпиаду планировалось провести в Барселоне, но из-за начала гражданской войны Международный олимпийский комитет официально присудил проведение Игр Германии. По иронии судьбы, вспышка аналогичной гражданской войны в Германии побудила МОК собраться снова, перенеся Игры в Лозанну, Швейцария, где они наконец были проведены.\n\nВ них приняли участие более сорока стран, хотя в них явно не было Германии, событие, которое многие называют суровым, учитывая причину и поспешность, с которой Игры были перенесены. Лучше всего выступили США, выигравшие в общей сложности 77 медалей и 34 золотых, за ними следует Франция; Сами швейцарцы выступили великолепно, выиграв 11 золотых медалей и 28 в общей сложности." # [This.GetNewspaperHeader]The 1936 Olympic Games, officially The Games of the XI Olympiad, have concluded. The XI Olympiad was originally planned to be hosted in Barcelona, before the outbreak of civil war led the International Olympic Committee to award the Games officially to Germany. It was with some irony, then, that the outbreak of a similar civil war in Germany led the IOC to meet again, relocating the Games to Lausanne, Switzerland, where they were finally held.\n\nOver forty nations attended, though notably lacking Germany, an event described by many as stark, given the reason for, and haste with which, the Games were relocated. The United States performed the best, winning 77 total medals, with 34 gold, followed by France; the Swiss themselves performed admirably, winning 11 gold medals and 28 in total.
 fxnews.166.a: "Быстрее, выше, сильнее." # Plus vite, plus haut, plus fort.
 fxnews.166.b: "Мы сделали все возможное!" # We did our best!
 fxnews.166.c: "Еще реакционные шарады." # More reactionary charades.
 fxnews.166.e: "Конечно, им будет приятно присутствовать..." # It sure must be nice for them to attend...

# Alt-History Literature
 fxnews.76.t: "Эрнест Рэймонд - Четвертый Рим" # Ernest Raymond - A Fourth Rome
 fxnews.76.d: "Восходящий британский писатель Эрнест Рэймонд выпустил свою новую книгу «Четвертый Рим». Он стал последним крупным произведением альтернативной истории в Британской империи и оказал заметное культурное влияние на народы различных наций.\n\nСюжет романа вращается вокруг продолжающихся военных действий между Великобританией и Францией после 1890-х годов, при этом общий момент расхождения заключается в том, что немецкий император Фридрих III так и не приобрел привычку курить в 1880-х годах. Военные действия между Великобританией и Францией заставили Великобританию искать союзников, которые помогли бы установить влияние на континенте, чтобы противостоять Франции, а выживание немецкого императора Фридриха III помогло улучшить отношения между Великобританией и Германией, проложив путь к союзу между двумя сторонами. Франция, однако, смогла уговорить Италию и Россию присоединиться к их собственной Антанте, тем не менее, подготовив почву для Великой войны, которая первоначально разразилась между Францией и Великобританией из-за колониального пограничного спора.\n\nВойна закончилась и привела к поражению Антанты и победе центральных держав. Франция вскоре стала жертвой националистических настроений после своего поражения в Великой войне, что привело к созданию «высоко милитаризованной республики, в которой служба гарантирует гражданство», что, возможно, стирало границы между республикой и хунтой. Затем Франция установит республиканский режим аналогичного стиля в Италии после вмешательства Франции в гражданскую войну в Италии, вызванной ее поражением в Великой войне. Марко Бресил придет к власти в этом недавно созданном государстве-партнере Франции, провозгласит себя «Цезарем» и объявит о своей цели воссоздать цивилизацию, подобную Риму по своей природе (а не территориально).\n\nРоман заканчивается еще одной войной между возглавляемыми Германией Центральными державами и возглавляемым Францией Антантой д'Асье, когда новорожденный «Четвертый Рим» пытается использовать ситуацию в своих интересах. Роман оказал глубокое влияние на всю Великобританию, Францию ​​и Германию и способствовал взаимному росту германофилии и англофилии в Великобритании и Германии соответственно. Несмотря на это, он вызвал массу критики со стороны критиков, поскольку идея длительного выживания Фридриха III считалась «не более чем ребячеством». Тем не менее Рэймонд защищает свою историю, заявляя, что «нечто подобное могло произойти в другой Вселенной»." # The rising British novelist, Ernest Raymond, has released his new book ‘A Fourth Rome’. It has become the latest major work of alternate history in the British Empire, and has had notable cultural impact on the peoples of various nations.\n\nThe novel’s plot revolves around continued hostilities between Britain and France following the 1890’s, with the general point of divergence being that German Emperor Friedrich III never picking up a habit of smoking in the 1880’s. Hostilities between Britain and France would cause Britain to seek allies to help establish influence on the continent to counter France, and the survival of the German Emperor Friedrich III had assisted in bettering relations between Britain and Germany, paving way for an alliance between the two parties. France, however, was able to coax Italy and Russia into their own Entente, nonetheless setting a stage for the Great War, which would break out initially between France and Britain over a colonial border dispute.\n\nThe war would end and result in the loss of the Entente and the victory of the Central Powers. France would soon become prey to nationalist sentiment following their loss in the Great War, resulting in the establishment of a ‘highly Militarized Republic in which service guarantees citizenship’, which arguably blurred the lines between a Republic and a Junta. France would then install a similarly styled Republican Regime in Italy following France’s intervention in the Italian Civil War, which was induced by their loss in the Great War. Marco Brescil would rise to power in this newly established Partner-State to France, and would proclaim himself as ‘Caesar’, and would announce his goal to recreate an Civilization similar to Rome in nature (rather than territorially speaking).\n\nThe novel ends with yet another war between the German-led Central Powers and French-led Entente d’Acier, as a newborn ‘Fourth Rome’ scrambles to utilize the situation to their advantage. The novel has had profound impact throughout Britain, France, and Germany, and has contributed to a mutual rise of Germanophilia and Anglophilia in Britain and Germany respectively. Despite this, it has received large amounts of flak from critics, as the notion of a prolonged survival of Friedrich III has been considered as ‘nothing more than childish’. Raymond nonetheless defends his tale, stating that ‘something like this could have happened in another Universe’.
 fxnews.76.a: "Какая детская фантазия." # What a childish fantasy.

 fxnews.77.t: "Эрик Блэр - Волны революции" # Eric Blair - Tides of Revolution
 fxnews.77.d: "Британский писатель, известный как Эрик Блэр, ранее сегодня опубликовал книгу «Волны революции», сюжет которой в конечном итоге был воспринят подавляющим большинством имперского населения как шокирующий и противоречивый. Захватывающая история о британском моряке, сражающемся на стороне Фрайпакта в войне глобального масштаба. Книга подробно описывает мир, в котором Антанта выиграла Великую войну, но дорогой ценой. \n\nОтсутствие участия Америки в Великой войне привело к гораздо более затяжной и кровопролитной Великой войне, которая разрушила многие западные государства-члены Антанты. Поскольку и Антанта, и Центральные державы находятся на грани краха и неспособны поддерживать дальнейший конфликт; было достигнуто шаткое мирное соглашение, которое привело к удивительно небольшим территориальным уступкам с обеих сторон. Поскольку Антанта отчаянно хотела положить конец большевистской угрозе, она вмешалась, чтобы обеспечить победу белых в Гражданской войне в России. \n\nПосле окончания кровавой Великой войны без каких-либо новых завоеванных территорий Франция вскоре погрузилась в гражданскую войну между республиканцами и социалистами, причем последние стали победителями. При этом все их колониальные владения были либо конфискованы, либо провозглашены независимость. По другую сторону Рейна в Германии и России начали быстро нарастать сильные националистические настроения, которые быстро сменились националистической риторикой. Две страны достигли точки соприкосновения и вскоре сформировали союз с целью обеспечения глобального доминирования двух стран. Кроме того, Британская империя приняла Вестминстерский статут и постепенно децентрализировалась, а Австро-Венгерская империя превратилась в федерацию равных; обе страны быстро оказались единственными либеральными демократиями, оставшимися в Европе. В Америке Соединенные Штаты борются с внутренней политикой больше, чем когда-либо; недавние революции в Европе привели к колоссальному росту националистических и социалистических настроений с усилением поляризации; разразилась гражданская война; нанеся непоправимый ущерб Соединенным Штатам. \n\nРоман заканчивается шестилетней напряженной Второй мировой войной между французской «P.R.I», «Русско-германской осью» и «Фрайпактом», которая привела к трагическим человеческим жертвам по всему миру. Хотя его часто критикуют за отсутствие исторической основы и широкие творческие свободы, он, тем не менее, стал бестселлером в Британской империи." # The British writer known as Eric Blair has released ‘The Tides of Revolution’ earlier today, the plot of which ended up being received as shocking and controversial by a strong majority of the Imperial populace. A gripping story about a British Sailor fighting on behalf of the Freipakt in a global-scale war, the book details a world in which the Entente won the Great War, but at a dire cost. \n\nA lack of American entry to the Great War culminated in a much more drawn out and bloodier Great War, which ruined many Western member-states of the Entente. With both the Entente and Central Powers on the brink of collapse and unable to sustain further conflict; a shaky peace arrangement was reached which resulted in surprisingly little territorial concessions by either side. As the Entente was desperate to see the Bolshevik threat put down, they intervened to ensure victory of the Whites in the Russian Civil War. \n\nWith the end of a bloody Great War without any newly acquired territories to gleam, France soon fell into a civil war between the Republicans and Socialists, with the latter being the victor. In the process, all of their colonial holdings were either seized or declared independence. On the other side of the Rhine, a strong Nationalist sentiment began to rapidly brew in Germany and Russia, both of which quickly fell to Nationalist rhetoric. The two nations reached a common ground and shortly formed an alliance with the goal of ensuring global domination by the two countries. Additionally, with the British Empire passing the Statute of Westminster and steadily decentralizing coupled with the Austro-Hungarian Empire reforming into a federation of equals; the two nations quickly found themselves as the only liberal democracies remaining in Europe. In the Americas, the United States is struggling with internal politics more than ever; recent revolutions in Europe led to a colossal rise of Nationalist and Socialist sentiments, with polarization on the rise; a Civil War broke out; damaging the United States beyond repair. \n\nThe novel ends off with a 6-year strong Second Great War between the the French ‘P.R.I’, the ‘Russo-German Axis’ and the ‘Freipakt’, leading to tragic loss of life across the world. Whilst often criticized for lack of historical foundation and extensive creative liberties, it has nonetheless become a bestseller amongst the British Empire.
 fxnews.77.a: "Он пытается сделать эту Вселенную как можно хуже?" # Is he trying to make that Universe as bad as possible?

 fxnews.78.t: "Андре Мальро - Нож в письме" # André Malraux - The Knife in the Letter
 fxnews.78.d: "Спорная история французского писателя Андре Мальро, действие которой происходит в будущем, недавно появилась на прилавках Франции и описывает сценарий нового мирового порядка после Второй мировой войны.\n\nЭта история представляет собой сказку-антиутопию, действие которой происходит в 1962 году, в которой рассказывается об американце, выживающем на разделенном Среднем Западе в мире, запертом в ядерном тупике. В этом временном графике Германский Рейх вступает в войну с Антантой, успешно побеждает ее и берет под свой контроль Западную Европу. На восточном фронте, когда хаос разделяет русских, Советский Союз тоже очень быстро падет, в результате чего Штальпакт доминирует на всем европейском континенте. Тем временем в Новом Свете разобщенные и больные Соединенные Штаты переходят к реваншистскому Мексиканскому государству, федеральное правительство рушится, а в Северной Америке возникают расколотые штаты, а затем, когда поднимающаяся Мексика начинает устанавливать свою сферу влияния в Новом Свете, она вступает в конфликт с Британской империей в Карибском бассейне, что приводит к совместной войне с Германией против Британии. Война заходит в тупик, пока Германия не создаст совершенное оружие, работающее на самом атоме. После того, как мексиканцы бомбили этим ядерным оружием Ямайку и Барбуду, британцы, наконец, согласились на мирные переговоры, предоставив Германии несколько ее колониальных владений за рубежом и предоставив Мексике контроль над Карибским морем.\n\nПо мере установления нового мирового порядка немецко-мексиканские отношения разрываются, а также крах Штальпакта, когда Германия выходит за его границы, вызывая всеобщее недовольство, пока экономический кризис не заставляет ее изолироваться. Затем британцы начинают игнорировать условия мирного договора и бросать вызов влиянию Рейха в мире. Таким образом, к 1962 году мир оказался в ядерном тупике между Германским рейхом, Великим мексиканским государством и Британской империей, которые все стремятся стать доминирующей мировой державой.\n\nРоман заканчивается началом нового ядерного кризиса, когда мексиканцы создают ракетную базу на своей союзной территории недалеко от Великих озер, угрожая Канаде и вызывая всемирную панику, поскольку британцы готовятся противостоять этой агрессии. Хотя многие критикуют книгу за огромные пробелы в правдоподобии и преувеличенные предложения будущих технологий, захватывающая политическая напряженность, охватывающая каждую часть истории, привела ее к большому успеху среди всех стран Антанты." # A controversial tale of by the French writer André Malraux set on a future timeline has recently reached the shelves of France, depicting a scenario of a new world order after a Second Great War.\n\nThe story is a dystopian tale set in 1962, featuring an American man surviving in the divided midwest in a world locked in a nuclear stalemate. In this timeline, the German Reich goes to war with and successfully defeats the Entente and takes control of western Europe. In the eastern front, as chaos divides the Russians, the Soviet Union too falls very quickly, causing the Stahlpakt to dominate all of the European continent. Meanwhile, in the New World, a disunited and ill United States falls to the revanchist Mexican State, the federal government collapses and splinter states rise in North America, then as the rising Mexico begins to establish its sphere of influence in the New World, it comes into conflict with the British Empire in the Caribbean, leading to a joint war with Germany against the British. The war slows down into a grinding naval stalemate, until Germany creates the ultimate weapon, powered by the atom itself. After the Mexican bomb Jamaica and Barbuda with this nuclear weapon, the British finally accept to negotiate a peace, granting Germany several of its colonial possessions overseas and giving Mexico control of the Caribbean.\n\nAs a new world order is established, German-Mexican relationships break, as well as the Stahlpakt collapses as Germany oversteps its boundaries, causing widespread resentment, up until economic crisis causes it to isolate itself. The British then begin ignoring the peace treaty terms and challenging the Reich’s influence in the world. Thus by 1962, the world is locked in a nuclear stalemate between the German Reich, the Greater Mexican State, and the British Empire, all looking to be the dominant world power.\n\nThe Novel ends with the beginning of a new nuclear crisis as the Mexican set up a missile base in their allied territory near the Great Lakes, threatening Canada, and causing the worldwide panic as the British prepare to deal with this aggression. While many criticize the book for its huge gaps in plausibility and exaggerated proposals of future technology, the gripping political tension that wraps every part of the story has lead it to great success amongst all of the Entente.
 fxnews.78.a: "С каких пор псевдонаучная фантастика стала такой популярной?" # Since when is Pseudo-Science Fiction so popular?

 fxnews.152.t: "Анна Зегерс - рабочий класс" # Anna Seghers - Arbeiterreich
 fxnews.152.d: "Известная немецкая писательница Анна Зегерс, известная своими социалистическими идеалами, представляет свой последний литературный шедевр «Наследие революции». Эта новаторская работа по альтернативной истории захватила воображение читателей по всему миру, оставив неизгладимый след в культурном ландшафте.\n\nНаследие революции, действие которого происходит в иной реальности, где триумфовала немецкая революция 1919 года, рисует яркую картину преобразившейся Европы. В этом мире дальновидная социалистка Роза Люксембург вступает на пост президента Немецкого народного государства в 1926 году, возвещая эпоху прогрессивного управления, отмеченную демократией и гражданскими свободами. Тем временем по ту сторону Рейна французское население восстает против своего правительства, ввергая страну в ожесточенный гражданский конфликт, кульминацией которого является создание Французского государства. Британцы, предпочитая невмешательство, наблюдают, как их континентальные соседи борются с потрясениями.\n\nТем не менее, среди беспорядков сохраняются очаги сопротивления. Королевство Италия под руководством Эммануила III и социал-либерального премьер-министра Иваноэ Бономи объединяет силы с Греческой империей во главе с императором Георгом II, заключая грозный «Афинско-Римский пакт». Вместе они утверждают доминирование на Балканах, поддерживаемое марионеточными государствами в Хорватии, Словении и Албании. Турция, которая когда-то была региональной державой, лежит в руинах, ее упадок организован греческими и итальянскими силами, стремящимися изменить геополитический ландшафт. Появление освобожденных образований, таких как Понтийское королевство и Антиохийское королевство, сигнализирует о сейсмическом сдвиге в балансе сил.\n\nНа Ближнем Востоке Королевство Хиджаз выступает как грозный противник Афинско-Римского пакта, в то время как Венгрия расширяет свое влияние на северные балканские территории, подчиняя Чехию и Трансильванию как вассальные государства. Тем временем немецкие роялисты во главе с изгнанным королем Вильгельмом II начинают новое существование в Африке, претендуя на свои собственные суверенные владения.\n\nНесмотря на серьезные попытки дипломатии, мир по-прежнему остается в ловушке ненадежной паутины конкурирующих идеологий. Немецкие социалисты, французские националисты, русские империалисты и британские либералисты стоят на грани конфликта, их амбиции сталкиваются на фоне кипящей напряженности в меняющемся мире.\n\nЭто вызвало большое количество критики, поскольку воспринимаемое чрезмерное упрощение сложных исторических событий и идеалистическое изображение социалистического управления кажутся не чем иным, как «детским». Они утверждают, что повествование Сегерса не может адекватно справиться с многогранными проблемами, присущими такой монументальной социальной трансформации, и вместо этого отдает предпочтение утопическому видению, лишенному нюансов." # Renowned German author Anna Seghers, known for her socialist ideals, unveils her latest literary masterpiece, \"The Legacy of the Revolution\". This groundbreaking work of alternate history has captured the imagination of readers worldwide, leaving an indelible mark on the cultural landscape.\n\nSet in a divergent reality where the 1919 German revolution triumphed, \"The Legacy of the Revolution\" paints a vivid tableau of a transformed Europe. In this world, visionary socialist Rosa Luxemburg ascends to the presidency of the German People’s state in 1926, heralding an era of progressive governance marked by democracy and civil liberties. Meanwhile, across the Rhine, the French populace rises in defiance against their government, plunging the nation into a bitter civil conflict that culminates in the establishment of the French State. The British, opting for non-intervention, watch as their continental neighbors grapple with upheaval.\n\nYet amidst the turmoil, pockets of resistance persist. The Kingdom of Italy, under the leadership of Emmanuel III and social liberal Prime Minister Ivanoe Bonomi, joins forces with the Hellenic Empire, led by Emperor George II, forging the formidable \"Athens-Rome Pact\". Together, they assert dominance over the Balkans, bolstered by puppet states in Croatia, Slovenia, and Albania. Turkey, once a regional power, lies in ruins, its demise orchestrated by Greek and Italian forces keen on reshaping the geopolitical landscape. The emergence of liberated entities like the Kingdom of Pontus and the Kingdom of Antioch signals a seismic shift in the balance of power.\n\nIn the Middle East, the Kingdom of Hejaz emerges as a formidable adversary to the Athens-Rome Pact, while Hungary extends its influence over the northern Balkan territories, subjugating Czechia and Transylvania as vassal states. Meanwhile, German Royalists, led by exiled King Wilhelm II, carve out a new existence in Africa, laying claim to their own sovereign domain.\n\nDespite earnest attempts at diplomacy, the world remains ensnared in a precarious web of competing ideologies. The German socialists, French nationalists, Russian imperialists, and British liberalists stand poised on the brink of conflict, their ambitions colliding amidst the simmering tensions of a world in flux.\n\nIt has received large amounts of flak from critics, as the perceived oversimplification of complex historical events and the idealistic portrayal of socialist governance seem nothing more than 'childish'. They argue that Seghers' narrative fails to grapple adequately with the multifaceted challenges inherent in such a monumental societal transformation, opting instead for a utopian vision that lacks nuance.
 fxnews.152.a: "Не могу поверить, что это бестселлер." # I can't believe this is a bestseller.

 fxnews.1065.t: "Кайзер Вильгельм II замечен в Мемеле" # Kaiser Wilhelm II spotted in Memel
 fxnews.1065.d: "-- ПОЛУЧИЛСЯ! КАЙЗЕР ВИЛЬГЕЛЬМ II ВОЗВРАЩАЕТСЯ В ПРУССИЮ — МЕМЕЛЬ ПРОЯВЛЯЕТ ВЕРНОСТЬ КОРОНЕ! --\n--Берлин в смятении, поскольку Дресслер осуждает «предательские призраки прошлого»--\n\nМЕМЕЛЬ, ЛИТВА — В результате поворота событий, который не смогли сфабриковать даже валкистские цензоры, свергнутый 78-летний кайзер Вильгельм II вновь появился в Мемеле, маскируясь под голландского торговца сыром. Свидетели утверждают, что монарх прибыл на борту грузового судна, испачканного сельдью, в окружении балтийских немецких ополченцев, кричащих «Смерть репе!»\n\nНа рассвете имперские флаги развевались над мэрией, а литовские чиновники бежали, бормоча: «Мы слишком трезвы для этого».\n\nНемецкий фюрер Адам Дресслер назвал Вильгельма «старческой мумией в монокле», но когда в Берлине вспыхнула паника Радио Valkist случайно проигрывало «Heil dir im Siegerkranz» в течение 30 минут." # --GOTT MIT UNS! KAISER WILHELM II RETURNS TO PRUSSIA — MEMEL PROCLAIMS ALLEGIANCE TO THE CROWN! --\n--Berlin in Turmoil as Dressler Condemns 'Traitorous Ghosts of the Past'--\n\nMEMEL, LITHUANIA — In a turn of events even the Valkist censors could not fabricate, overthrown Kaiser Wilhelm II, 78, has resurfaced in Memel masquerading as a Dutch cheese merchant. Witnesses claim the monarch arrived aboard a herring-stained freighter, flanked by Baltic German militiamen shouting “Death to Turnips!”\n\nBy dawn, imperial flags flew over the city hall as Lithuanian officials fled, reportedly muttering, “We’re too sober for this.”\n\nGerman Führer Adam Dressler dismissed Wilhelm as “a senile mummy in a monocle,” but panic erupted in Berlin when Valkist radio accidentally played “Heil dir im Siegerkranz” for 30 minutes.
 fxnews.1065.a: "Какого черта?" # What the fuck?

 fxnews.1066.t: "«ПЕНСИОННЫЙ ТУР» KAISER ПОПАДАЕТ В ДАЦИГ – ГОРОД ЗАПАДАЕТ НЕМЕЦКИМ БАБУЛЯМ С МЕТЛАМИ" # KAISER’S “RETIREMENT TOUR” HITS DANZIG — THE CITY FALLS TO GERMAN GRANNIES WITH BROOMSTICKS
 fxnews.1066.d: "Польские официальные лица: «Мы не так готовились к войне»\n\nДАНЦИГ — «Имперская освободительная армия» Вильгельма (толпа разгневанных пенсионеров и цирковой медведь-отрекшийся) захватила Польский коридор. Кайзер, якобы вооруженный парадной саблей и банкой маринованной свеклы, объявил Данциг «новейшей чайной Пруссии». Немецкие охранники сдались после того, как местные бабушки забросали их штруделями.\n\nРежим Дресслера запретил музыку на аккордеоне, ссылаясь на «монархическую подрывную деятельность»." # Polish Officials: “This is Not How We Trained for War”\n\nDANZIG — Wilhelm’s “Imperial Liberation Army” (a mob of angry pensioners and a renounced circus bear) overran the Polish Corridor. The Kaiser, allegedly armed with a ceremonial saber and a jar of pickled beets, declared Danzig “Prussia's newest tea room.” German guards surrendered after local grandmothers bombarded them with strudel.\n\nDressler's regime banned accordion music, citing “monarchist subversion.”
 fxnews.1066.a: "Ты, должно быть, шутишь..." # You've got to be kidding me...

 fxnews.1067.t: "ПОЗЕН «ОСВОБОЖДЕН» ПОСЛЕ КАЙЗЕРА ДРЕМИТ ЧЕРЕЗ БИТВУ" # POSEN “LIBERATED” AFTER KAISER NAPS THROUGH BATTLE
 fxnews.1067.d: "«Тактический храп» провозгласил новую военную доктрину. ПОЗЕН, ПОЛЬША — В ходе того, что историки называют «наименее преднамеренным завоеванием с тех пор, как кот Наполеона захватил Мальту», кайзер Вильгельм II случайно аннексировал Позен после того, как задремал во время поездки в карете и проснулся в 20 милях от польских линий. Его ополченцы, интерпретировав его сон как «божественную стратегию», захватили регион, используя украденное сельскохозяйственное оборудование. Сообщается, что польские войска были отвлечены мошеннической брошюрой валкистов под названием «Почему язычество — это круто».\n\nЗапись в дневнике Вильгельма: «Мне снилось, что я был Бисмарком. Проснулся с вареньем на лице. Победа!»" # “Tactical Snoring” Declared New Military Doctrine\n\nPOSEN, POLAND — In what historians are calling “the least intentional conquest since Napoleon’s cat took Malta,” Kaiser Wilhelm II accidentally annexed Posen after dozing off during a carriage ride and waking up 20 miles behind Polish lines. His militia, interpreting his nap as “divine strategy,” overran the region using stolen farm equipment. Polish troops were reportedly distracted by a rogue Valkist pamphlet titled “Why Paganism is Cool.”\n\nWilhelm’s Diary Entry: “Dreamt I was Bismarck. Woke up with jam on my face. Victory!”
 fxnews.1067.a: "Это шутка, да?" # This is a joke, right?

 fxnews.1068.t: "РАЙНЛАНДИЯ, ВОЗВРАЩЕННАЯ ПАРИКОМ KAISER НА ВОЗДУШНОМ ВОЗДУШНОМ ВОЗДУХЕ" # RHINELAND RECLAIMED BY KAISER’S BALLOON-BORNE WIG
 fxnews.1068.d: "Французские войска бегут от «разумного шиньона судьбы»\n\nКОБЛЕНЦ — Рейнская область снова стала немецкой после того, как Вильгельм пролетел над французской оккупационной зоной на воздушном шаре в форме парика Фридриха Великого, сбросив листовки с надписью «Сдавайтесь, или я прочту свою поэзию!» Французские войска отступили в Бельгию, где сейчас спорят о вафлях. Архиепископ Кёльна провозгласил кайзера «личным цирюльником Бога». Сообщается, что учёные Дресслера теперь разрабатывают «антипариковую артиллерию»." # French Troops Flee “Sentient Hairpiece of Doom”\n\nKOBLENZ — The Rhineland is German again after Wilhelm floated over the French occupation zone in a hot-air balloon shaped like Frederick the Great’s wig, dropping leaflets that read, “Surrender or I’ll Recite My Poetry!” French forces retreated to Belgium, where they are currently arguing about waffles. Cologne’s archbishop hailed the Kaiser as “God’s own barber.”\nDressler’s scientists now reportedly developing “anti-wig artillery.”
 fxnews.1068.a: "Это становится смешно..." # This is getting ridiculous...

 fxnews.1069.t: "ВИЛЬГЕЛЬМ ЗАХВАТЫВАЕТ КИЛЬ С «МОРСКОЙ НОЧЬЮ БИНГО»" # WILHELM SEIZES KIEL WITH “NAVAL BINGO NIGHT”
 fxnews.1069.d: "Моряки взбунтовались из-за обещания бесплатной выпечки.\n\nKIEL — Балтийский флот Германии перешел на сторону кайзера на этой неделе после того, как он провел военно-морской турнир по бинго на борту линкора «Шлезвиг-Гольштейн». \"Дресслер дал нам репу. Кайзер дал нам штрудель. Легкий выбор\", - сказал один моряк. Вильгельм, ныне называющий себя «адмиралом гериатрической армады», блокировал Гамбург, используя рыболовные траулеры, задрапированные простынями-флагами.\n\nКоролевский флот Великобритании объявил, что «время чая продлено на неопределенный срок»." # Sailors Mutiny Over Promise of Free Pastries\n\nKIEL — Germany’s Baltic fleet defected to the Kaiser this week after he hosted a naval bingo tournament aboard the battleship Schleswig-Holstein. “Dressler gave us turnips. The Kaiser gave us strudel. Easy choice,” said one sailor. Wilhelm, now styling himself “Admiral of the Geriatric Armada,” has blockaded Hamburg using fishing trawlers draped in bedsheet flags.\n\nBritain’s Royal Navy announced “tea time indefinitely extended.”
 fxnews.1069.a: "Это выходит из-под контроля..." # This is getting out of hand...

 fxnews.1070.t: "БЕРЛИН ПАДАЕТ ОТ КРЕСЛА KAISER, ЗАГРУЖЕННОГО ЛОШАДЬМИ" # BERLIN FALLS TO KAISER’S HORSE-DRAWN RECLINER
 fxnews.1070.d: "Дресслер сбегает, последний раз его видели в обмен на бункеры для альпак.\n\nБЕРЛИН — Режим валкистов рухнул сегодня, когда Вильгельм въехал в столицу на фургоне с сеном, швыряя бутылки со шнапсом в убегающих штурмовиков Дресслера. Кайзер, ныне император Второго рейха, короновал себя в Рейхстаге, используя половник для супа. Его первый указ? «Обязательный сон после 15:00».\n\nСообщается, что Нидерланды запретили экспорт сыра «ради всеобщей безопасности»." # Dressler Flees, Last Seen Trading Bunkers for Alpacas\n\nBERLIN — The Valkist regime collapsed today as Wilhelm rolled into the capital atop a hay wagon, hurling schnapps bottles at Dressler’s fleeing stormtroopers. The Kaiser, now Emperor of the Second Reich, crowned himself in the Reichstag using a soup ladle. His first decree? “Mandatory naps after 3 PM.”\n\nThe Netherlands has reportedly banned cheese exports “for everyone’s safety.”
 fxnews.1070.a: "Это шутка, да.... да?" # This is a joke, right.... right?

 fxnews.1071.t: "Император Эдуард VIII объявляет себя «Императором мира»" # Emperor Edward VIII Declares Himself 'Emperor of the World'
 fxnews.1071.d: "«Боже, храни короля — и только короля!»\nЭДУАРД VIII РАСПРОПАЕТ ПАРЛАМЕНТ, КОРОНОНУЕТ СЕБЯ ИМПЕРАТОРОМ, ПРИСОЕДИНЯЕТ ЛУНУ\n\nЛОНДОН — В тот день, который эксперты называют «довольно напряженным днем», король Эдуард VIII одновременно распустил парламент, упразднил доминионы, короновал себя императором и объявил войну гравитации. Этот шаг, описанный королем как «срочная национальная необходимость – и к тому же, я просто так захотел», оставил Вестминстер в ошеломленной тишине, прерываемой только звуком Уинстона Черчилля, поперхнувшегося бренди.\n\nПарламент был официально заменен советом королевских корги под председательством уважаемого «Вице-короля Снафлза IV». Канада, Австралия и Новая Зеландия были насильственно объединены в новое образование под названием «Задний сад Эдварда», а британское владычество было переименовано в «Драгоценность Эдварда» и назначено личным полем для игры в поло Императора. Не довольствуясь земным правлением, Эдвард также объявил Луну территорией Короны, сославшись на ее «стратегическую важность для будущих турниров по крокету».\n\nНепосредственные последствия этой имперской перестройки были одновременно драматичными и глубоко смешными. В ответ Канада избрала своим премьер-министром лося по имени Реджинальд, утверждая, что он обладает «лучшими навыками принятия решений, чем современные люди». Тем временем Уэльс пригрозил перейти во Францию, если «кто-нибудь не отремонтирует поле для регби». Индия применила более дипломатический подход: Ганди вежливо отправил Букингемскому дворцу телеграмму с просьбой «немедленно прекратить имперское безумие». Вернувшись в Великобританию, парламентарии покинули страну на перепрофилированном «Спитфайре», пообещав сформировать «правительство в изгнании» на Бермудских островах. Эдвард назвал их «стайкой энтузиастов гольфа с манией значимости».\n\nМеждународная реакция была столь же озадачена. Кайзер Вильгельм II, обрадованный этой новостью, отправил восторженную телеграмму, в которой предлагал «вместе вторгнуться во Францию ​​— в память о старых временах». МИ-5 быстро перехватила сообщение, прежде чем оно успело достичь Императора. Тем временем Франция на всякий случай начала срочное строительство «антимонархического рва» вдоль Ла-Манша. В самой Британии Королевский флот был задействован для «успокоения» острова Уайт после того, как он провозгласил независимость из-за спора о тарифах на булочки. В Дели недавно сформированное «Министерство чая и путаницы» уже запретило брюки по вторникам. Вдобавок к общему беспорядку, совет корги Эдварда получил полное право вето на все законы.\n\nНесмотря на нарастающий кризис, Эдвард остаётся совершенно невозмутимым. Выступая со своего трона (теперь подвешенного на позолоченном воздушном шаре), император отверг опасения, заявив: \"Все идет гладко. Абсолютно прекрасно. Передайте бренди\"." # \"GOD SAVE THE KING—AND ONLY THE KING!\"\nEDWARD VIII DISSOLVES PARLIAMENT, CROWNS HIMSELF EMPEROR, ANNEXES THE MOON\n\nLONDON — In what experts are calling “a rather busy afternoon,” King Edward VIII has simultaneously dissolved Parliament, abolished the dominions, crowned himself Emperor, and declared war on gravity. The move, described by the King as “an urgent national necessity—and also, I just felt like it,” has left Westminster in stunned silence, interrupted only by the sound of Winston Churchill choking on his brandy.\n\nParliament has been officially replaced by a council of royal corgis, chaired by the esteemed “Viceroy Snuffles IV.” Canada, Australia, and New Zealand have been forcibly merged into a new entity called “Edward’s Back Garden,” while the British Raj has been renamed “Edward’s Jewel” and designated as the Emperor’s personal polo field. Not content with earthly rule, Edward has also declared the Moon a Crown Territory, citing its “strategic importance for future croquet tournaments.”\n\nThe immediate consequences of this imperial overhaul have been both dramatic and deeply ridiculous. Canada has responded by electing a moose named Reginald as its Prime Minister, arguing that he possesses “better decision-making skills than recent humans.” Wales, meanwhile, has threatened to defect to France unless “somebody fixes the rugby pitch.” India has taken a more diplomatic approach, with Gandhi politely wiring Buckingham Palace to request “an immediate cessation of imperial lunacy.” Back in Britain, Parliamentarians have fled the country in a repurposed Spitfire, vowing to form a “Government-in-Exile” in Bermuda. Edward has dismissed them as “a gaggle of golf enthusiasts with delusions of relevance.”\n\nThe international response has been equally bewildered. Kaiser Wilhelm II, delighted by the news, has sent an enthusiastic telegram suggesting they “invade France together—for old times’ sake.” MI5 swiftly intercepted the message before it could reach the Emperor. France, meanwhile, has begun the urgent construction of an “Anti-Monarchist Moat” along the Channel, just in case. Within Britain itself, the Royal Navy has been deployed to “pacify” the Isle of Wight after it declared independence over a scone tariff dispute. In Delhi, a newly formed “Ministry of Chai and Confusion” has already banned trousers on Tuesdays. Adding to the general disorder, Edward’s council of corgis has been granted full veto power over all laws.\n\nDespite the mounting crisis, Edward remains entirely unfazed. Speaking from his throne (now suspended from a gilded hot-air balloon), the Emperor dismissed concerns, declaring, “This is all going swimmingly. Absolutely swimmingly. Pass the brandy.”
 fxnews.1071.a: "Ты шутишь, что ли?" # Are you kidding me?

 fxnews.172.t: "Фердинанд Маркос избран президентом" # Ferdinand Marcos Elected as President
 fxnews.172.d: "[This.GetNewspaperHeader]Фердинанд Э. Маркос вступил в должность президента Филиппин на церемонии, на которой присутствовали высокопоставленные лица, сторонники и международные наблюдатели. В своем обращении Маркос пообещал открыть новую эру прогресса, стабильности и единства нации. Он изложил амбициозные планы по модернизации экономики, укреплению национальной обороны и содействию национальному развитию, призвав всех филиппинцев работать вместе ради светлого будущего.\n\nПоскольку страна сталкивается с новыми проблемами внутри страны и за рубежом, многие филиппинцы надеются, что президент Маркос выполнит свои обещания и поведет нацию к процветанию. С высокими ожиданиями и глазами всего мира, Филиппины стоят на пороге новой главы своей истории." # [This.GetNewspaperHeader]Ferdinand E. Marcos has been inaugurated as President of the Philippines in a ceremony attended by dignitaries, supporters, and international observers. In his address, Marcos pledged to usher in a new era of progress, stability, and unity for the nation. He outlined ambitious plans to modernize the economy, strengthen national defense, and promote national development, calling on all Filipinos to work together for a brighter future.\n\nAs the country faces new challenges at home and abroad, many Filipinos are hopeful that President Marcos will deliver on his promises and guide the nation toward prosperity. With expectations high and the eyes of the world watching, the Philippines stands at the threshold of a new chapter in its history.
 fxnews.172.a: "Для Филиппин начинается новая глава." # A new chapter begins for the Philippines.
