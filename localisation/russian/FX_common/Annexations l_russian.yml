 #! @REGIONMAKER REGIONS LOC START 
 annexation_region_0: "Portugal" #NT!
 annexation_region_0_desc: "The government in Lisbon has finally been forced into the sea, but we are left with the fate of the Portuguese people to decide. Do we release them as their own nation following our rightly guided principles?" #NT!
 annexation_region_1: "Spain" #NT!
 annexation_region_1_desc: "In the aftermath of the recent conflicts, we ended up controlling a number of territories that once belonged to the Spanish state. What should we do about them now?" #NT!
 annexation_region_2: "France" #NT!
 annexation_region_2_desc: "The French state has been forced to capitulate, and our troops are parading in their capital in Paris. What should we do with the remnants of their state?" #NT!
 annexation_region_3: "Alsace-Lorraine" #NT!
 annexation_region_3_desc: "Our armies have taken control of Alsace-Lorraine after our last campaigns, a region disputed between France and Germany for the last 70 years. We must now decide what's to do with this land." #NT!
 annexation_region_4: "Savoy" #NT!
 annexation_region_4_desc: "Our armies have taken control of Savoy, which although not hotly contested still remains a region disputed between Italy and France. What should we do?" #NT!
 annexation_region_5: "Nice" #NT!
 annexation_region_5_desc: "Our armies have taken control of Nice, which although not hotly contested still remains a region disputed between Italy and France. What should we do?" #NT!
 annexation_region_6: "Luxembourg" #NT!
 annexation_region_6_desc: "We have taken control of the territories of Luxembourg, and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_7: "Flanders" #NT!
 annexation_region_7_desc: "After a short campaign across the fields of Flanders we now control the region and we must decide what to do with it." #NT!
 annexation_region_8: "Wallonia" #NT!
 annexation_region_8_desc: "We now control the French-speaking province of Wallonia, that once belonged to Belgium and Flanders-Wallonia. We must choose what to do with our new piece of Belgium." #NT!
 annexation_region_9: "Eupen-Malmedy" #NT!
 annexation_region_9_desc: "Our armies have taken control of Eupen-Malmedy, a small region with a particularly strong German presence. What should we do with it?" #NT!
 annexation_region_10: "Limburg" #NT!
 annexation_region_10_desc: "The former Belgian provinces of Limburg is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_11: "Zeuss-Flanders" #NT!
 annexation_region_11_desc: "The former Belgian provinces of Zeuss-Vlaanderen is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_12: "Netherlands" #NT!
 annexation_region_12_desc: "After a short campaign across the marshes and the urban centres of the Netherlands, we have managed to take down the proud nation. The Netherlands are now in our hands! We must now decide on its future." #NT!
 annexation_region_13: "Britain" #NT!
 annexation_region_13_desc: "Our armies have managed to take control of the Britain, and the island itself is now occupied by us. We have a few options in front of us, now. We can either puppet the island or take it for ourselves, seeing as it possesses a key position in the Atlantic and is crucial to retaining control of that area. What shall we do?" #NT!
 annexation_region_14: "Northern Ireland" #NT!
 annexation_region_14_desc: "We have taken control of Northern Ireland, a region of Ireland where Unionists are particularly dominant. What shall we do with it?" #NT!
 annexation_region_15: "Ireland" #NT!
 annexation_region_15_desc: "We have secured the island of Ireland. The fate of the Irish nation lies in our hands now." #NT!
 annexation_region_16: "Rhineland" #NT!
 annexation_region_16_desc: "The entire Rhenish region has been brought under our control. Currently our armed forces are facing some opposition from the local populations. We could leave it up to local governments in the region to take care of any dissent." #NT!
 annexation_region_17: "Kiel" #NT!
 annexation_region_17_desc: "We have taken control of the territories of Schleswig-Holstein, and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_18: "Germany" #NT!
 annexation_region_18_desc: "The German state has been forced to capitulate, and our troops are parading in their capital in Berlin. What should we do with the remnants of their state?" #NT!
