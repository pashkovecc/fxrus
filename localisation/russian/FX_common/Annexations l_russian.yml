 annexation_region_19_desc: "The state of [85.GetName] has been brought under our control as our troops occupy the region. We must now decide what to do with it." #NT!
 annexation_region_20: "Danzig" #NT!
 annexation_region_20_desc: "The city of Danzig and its majority-German population has been brought under our control, what shall we do with it?" #NT!
 annexation_region_21: "Austria" #NT!
 annexation_region_21_desc: "Austria has been forced to capitulate and our troops are patrolling the streets of Vienna to prevent a rebellion or anything that could cause further instability. However, some have proposed that creating a local Austrian government would be more helpful." #NT!
 annexation_region_22: "Burgenland" #NT!
 annexation_region_22_desc: "The disputed territories of Burgenland is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_23: "Voralberg" #NT!
 annexation_region_23_desc: "The disputed territories of Switzerland is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_24: "Switzerland" #NT!
 annexation_region_24_desc: "After fierce fighting in the Alpine Mountains, we have finally conquered Switzerland. The Swiss army has surrendered, and their territory is under our control. What should we do with the land we now control?" #NT!
 annexation_region_25: "Sudetenland" #NT!
 annexation_region_25_desc: "The Sudetenland, a newly-popular name for the land of the German Bohemians has now fallen under control. What are we to do with it?" #NT!
 annexation_region_26: "Bohemia" #NT!
 annexation_region_26_desc: "The ancient heartland of the Czechs have been conquered by our victorious forces. The venerable gem of the Moldau, Prague, is occupied by our troops who parade smartly across the Wenceslas Square. Should we prop up a Czech government loyal to the designs of our own state or maintain this splendid military occupation?" #NT!
 annexation_region_27: "Slovakia" #NT!
 annexation_region_27_desc: "After a short campaign across the mountains of Slovakia, we have managed to shatter the defences of the country. Slovakia is now in our hands! We must now decide on the future of it." #NT!
 annexation_region_28: "South Slovakia" #NT!
