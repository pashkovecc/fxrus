 annexation_region_237: "British Antilles" #NT!
 annexation_region_237_desc: "The former British Antilles is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_238: "Trinidad And Tobago" #NT!
 annexation_region_238_desc: "The former colony of Trinidad is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_239: "Curaçao" #NT!
 annexation_region_239_desc: "The former Dutch colony of Curaçao is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_240: "Panama Canal" #NT!
 annexation_region_240_desc: "The vital link between the Caribbean and the Pacific Ocean is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_241: "Panama" #NT!
 annexation_region_241_desc: "After a rapid campaign around the Panamá Canal, we have finally managed to shatter the Panamanian defences. Panamá City is now in our hands! We must now decide on the future of Panamá." #NT!
 annexation_region_242: "Costa Rica" #NT!
 annexation_region_242_desc: "Our glorious army corps marched through the land and now occupy the capital of the former Costa Rican government. We, however, can't have this situation last so long, what should we do with the land?" #NT!
 annexation_region_243: "Nicaragua" #NT!
 annexation_region_243_desc: "With Managua in our hands, we now control Nicaragua and are able to decide what do with these lands." #NT!
 annexation_region_244: "El Salvador" #NT!
 annexation_region_244_desc: "El Salvador has been annexed by our proud armies and our troops are parading in San Salvador. How should the administration be set up?" #NT!
 annexation_region_245: "Honduras" #NT!
 annexation_region_245_desc: "Our armies have put down the Honduran government and are patrolling the capital in Tegucigalpa. Which sort of government should be put in place instead?" #NT!
 annexation_region_246: "Guatemala" #NT!
 annexation_region_246_desc: "The Guatemalan state has been forced to capitulate, and our troops are parading in the capital of Guatemala. What should we do with the remnants of their state?" #NT!
 annexation_region_247: "Colombia" #NT!
 annexation_region_247_desc: "After a campaign across Colombia, we have finally managed to shatter the Colombian defences. Bogotá is now in our hands! We must now decide on the future of Colombia. 
 annexation_region_248: "Ecuador" #NT!
 annexation_region_248_desc: "After a campaign across Ecuador, we have finally managed to shatter the Ecuadorian defences. Quito is now in our hands! We must now decide on the future of Ecuador." #NT!
 annexation_region_249: "Venezuela" #NT!
 annexation_region_249_desc: "After a campaign across Venezuela, we have finally managed to shatter the Venezuelan defences. Caracas is now in our hands! We must now decide on the future of Venezuela." #NT!
 annexation_region_250: "Peru" #NT!
 annexation_region_250_desc: " After a campaign across the hostile Peruvian Andes, we have finally managed to shatter the Peruvian defences. Lima is now in our hands! We must now decide on the future of Peru." #NT!
 annexation_region_251: "Colombian Amazon" #NT!
 annexation_region_251_desc: "The former Colombian section of the Amazon is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_252: "Bolivia" #NT!
 annexation_region_252_desc: "After a campaign through the jungles and deserts of Bolivia, we have finally managed to reach the gates to the Andes. La Paz is now in our hands! We must now decide on the future of Bolivia." #NT!
 annexation_region_253: "Arica" #NT!
 annexation_region_253_desc: "The disputed territory of Arica is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_254: "Chile" #NT!
 annexation_region_254_desc: "After a long campaign across the hostile Chilean Andes, we have finally managed to shatter the Chilean defences. Santiago is now in our hands! We must now decide on the future of Chile." #NT!
 annexation_region_255: "Argentina" #NT!
 annexation_region_255_desc: "After the conquest of the vast nation of Argentina we have to organise competent administrations to keep the territory under control. Now we will need to decide on the fate of the region." #NT!
 annexation_region_256: "Uruguay" #NT!
 annexation_region_256_desc: "After a long campaign in Uruguay, we have finally managed to shatter their defences. We must now decide on the future of Uruguay." #NT!
 annexation_region_257: "Paraguay" #NT!
 annexation_region_257_desc: "Our armies have finally taken control of the Paraguayan capital and occupy the territory of the former state of Paraguay. We should now decide how to set up a competent administration in the area." #NT!
 annexation_region_258: "Chaco Boreal" #NT!
 annexation_region_258_desc: "The disputed territory of Chaco Boreal is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_259: "Brazil" #NT!
 annexation_region_259_desc: "After the conquest of the vast nation of Brazil we have to organise competent administrations to keep the territory under control. Even if the magnificent city of Rio is under the boots of our soldiers we can't keep an hold on it forever." #NT!
