 annexation_region_225_desc: "The region of Quebec is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_226: "Newfoundland" #NT!
 annexation_region_226_desc: "The region of Newfoundland is now under our control; thus we must decide what to do with it."" #NT!
 annexation_region_227: "United States Of America" #NT!
 annexation_region_227_desc: "With the behemoth that was the United States of America now slain, we must now decide what to do with the once-great titan of the North American continent." #NT!
 annexation_region_228: "Mexico" #NT!
 annexation_region_228_desc: "After a long campaign across Mexico, we have finally managed to shatter the Mexican defences. Mexico City is now in our hands! We must now decide on the future of Mexico." #NT!
 annexation_region_229: "Puerto Rico" #NT!
 annexation_region_229_desc: "Following a brief campaign, San Juan has is under our control and with it all of Puerto Rico. What should be done with the Island?" #NT!
 annexation_region_230: "Baja California" #NT!
 annexation_region_230_desc: "The region of Baja California is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_231: "Yucatan" #NT!
