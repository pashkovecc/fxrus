 annexation_region_181: "Botsawana" #NT!
 annexation_region_181_desc: "The protectorate of Botswana, switched from British to South African leadership has seen many changes and is now prime for independence. Should we create a Botswanan satellite?" #NT!
 annexation_region_182: "Burundi" #NT!
 annexation_region_182_desc: "The region of Burundi has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_183: "Ubangi-Shari" #NT!
 annexation_region_183_desc: "The region of Central Africa has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_184: "French Guadeloupe" #NT!
 annexation_region_184_desc: "The region of Guadaloupe has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_185: "Cameroon" #NT!
 annexation_region_185_desc: "With our recent annexation of the colony of Cameroon, the former administration has fallen and this territory needs a new capable administration. The question is should it be ours or should it be a local one under our commands?" #NT!
 annexation_region_186: "Congo" #NT!
 annexation_region_186_desc: "After a long and hard-fought campaign in the vast expanses of the Congo we've finally achieved a historic victory. Now that we've won the war, we must decide how to best secure the peace. How should we go about managing the lands we've conquered?" #NT!
 annexation_region_187: "Djibouti" #NT!
