 annexation_decisions_desc: "Having gained control of new swaths of land we must now work out what to do with it. Occupation can be expensive and destabilising but it would give us direct access to the riches of this new land. On the other hand, creating a puppet nation would certainly be cheaper, though our new subjects may not be as reliable as we might think. Either way, the fate of nations rests in our hands." #NT!
  
