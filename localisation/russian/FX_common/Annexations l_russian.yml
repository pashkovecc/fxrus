 annex.1015.a: "Restore a loyal Honduran state." #NT!
 annex.1015.b: "Annex the territories" #NT!
  
 annexation_BOT_CONQ: "The Fate of Botswana" #NT!
 annexation_BOT_CONQ_DESC: "The protectorate of Botswana, switched from British to South African leadership has seen many changes and is now prime for independence. Should we create a Botswanan satellite?" #NT!
 annex.2001.a: "Create a collaborationist government in Botswana!" #NT!
  
 annexation_BRD_CONQ: "The Fate of Burundi" #NT!
 annexation_BRD_CONQ_DESC: "The region of Burundi has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2002.a: "Form the state of Burundi" #NT!
  
 annexation_CAR_CONQ: "The Fate of Central Africa" #NT!
 annexation_CAR_CONQ_DESC: "The region of Central Africa has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2003.a: "Form the state of Central Africa." #NT!
 annex.2003.b: "Establish a colony in the former Equitorial African Territories" #NT!
  
 annexation_CHA_CONQ: "The Fate of Chad" #NT!
 annexation_CHA_CONQ_DESC: "Finally, our annexation of the region of Chad is complete, the former French colony is now in need of a competent administration to manage it. Given the difficulties it gave to France, between tribal and passive revolts, should we consider giving them autonomy to alleviate this burden?" #NT!
 annex.2042.a: "Form the state of Chad." #NT!
  
 annexation_CMR_CONQ: "The Fate of Cameroon" #NT!
 annexation_CMR_CONQ_DESC: "With our recent annexation of the colony of Cameroon, the former administration has fallen and this territory needs a new capable administration. The question is should it be ours or should it be a local one under our commands?" #NT!
 annex.2005.a: "Form the state of Cameroon." #NT!
 annex.2005.b: "Transfer the territories to Equitorial Africa" #NT!
  
 annexation_DJI_CONQ: "The Fate of Djibouti" #NT!
 annexation_DJI_CONQ_DESC: "The region of Djibouti has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2007.a: "Form the state of Djibouti" #NT!
  
 annexation_ERI_CONQ: "The Fate of Eritrea" #NT!
 annexation_ERI_CONQ_DESC: "After our successful campaign in Eritrea we now have the task to establish new local administrative authority in order to restore peace, however, there are several options for our choice..." #NT!
 annex.2009.a: "Release Eritrea under a friendly government!" #NT!
  
 annexation_GAB_CONQ: "The Fate of Gabon" #NT!
 annexation_GAB_CONQ_DESC: "We now control the former French colony of Gabon and with it masses of Africans yearning to breathe free, should we give them this freedom under our close surveillance or is this dream vain?" #NT!
 annex.2011.a: "Form the state of Gabon." #NT!
  
 annexation_GAM_CONQ: "The Fate of Gambia" #NT!
 annexation_GAM_CONQ_DESC: "The region of Gambia has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2012.a: "Form the state of Gambia." #NT!
  
 annexation_GDL_CONQ: "The Fate of Guadaloupe" #NT!
 annexation_GDL_CONQ_DESC: "The region of Guadaloupe has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2013.a: "Form the state of Guadaloupe." #NT!
  
 annexation_GHA_CONQ: "The Fate of Ghana" #NT!
 annexation_GHA_CONQ_DESC: "The region of Ghana has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2014.a: "Form the state of Ghana." #NT!
  
 annexation_GNA_CONQ: "The Fate of Guinea" #NT!
 annexation_GNA_CONQ_DESC: "The former French colony of Guinea, divided between a traditional mountainous north and a colonial south has been annexed into our growing empire. We're now left with the complex task of organising this new territory, should we incorporate it directly into our structure of power or should we create a separate puppet state there?" #NT!
 annex.2015.a: "Form the state of Guinea." #NT!
  
 annexation_GNB_CONQ: "The Fate of Guinea Bissau" #NT!
 annexation_GNB_CONQ_DESC: "The region of Guinea Bissau has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2016.a: "Liberate Guinea Bissau!" #NT!
 annex.2016.b: "Transfer the territories to West Africa!" #NT!
  
 annexation_IVO_CONQ: "The Fate of Ivory Coast" #NT!
 annexation_IVO_CONQ_DESC: "The Ivory Coast, once a French colony under Mittelafrika just got annexed into our glorious empire. Its inhabitants now demand a competent administration to take care of taxes or conscription, should we try to govern them from our capital or would a local limited government be a better solution?" #NT!
 annex.2017.a: "Form the state of Ivory Coast." #NT!
  
 annexation_MLI_CONQ: "The Fate of Mali" #NT!
 annexation_MLI_CONQ_DESC: "The valley of the Niger river, once known as French Sudan or Mali is now directly integrated into our territories. This colony though needs a better administration that we will have difficulties to provide, nevertheless, the local people and the remnants of the French administration can administer it for us to an extent, should we let them form a loyal puppet state?" #NT!
 annex.2019.a: "Form the state of Mali." #NT!
  
 annexation_MRT_CONQ: "The Fate of Mauritania" #NT!
 annexation_MRT_CONQ_DESC: "The desert region of Mauritania has come under the control of our armies. The former French colony, not even pacified 15 years ago, is now in need of a government to rule it efficiently to avoid the territory falling into anarchy once again. Should we consider creating a Mauritanian puppet state?" #NT!
 annex.2021.a: "Form the state of Mauritania." #NT!
  
 annexation_NGA_CONQ: "The Fate of Nigeria" #NT!
 annexation_NGA_CONQ_DESC: "The vast and rich colony of Nigeria is now under our control and with it comes the burden of having to administer it, could we delegate this task to an extent to a local puppet state?" #NT!
 annex.2022.a: "Form the state of Nigeria." #NT!
 annex.2022.b: "Transfer the lands to [NFA.GetName]" #NT!
  
 annexation_NGR_CONQ: "The Fate of Niger" #NT!
 annexation_NGR_CONQ_DESC: "The region of Niger has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2023.a: "Form the state if Niger!" #NT!
  
 annexation_NMB_CONQ: "The Fate of Namibia" #NT!
 annexation_NMB_CONQ_DESC: "We annexed the former territories of South Africa, most commonly known as Namibia but we're now left to manage thousands of Africans in a territory we don't know about, should we institute a degree of self-determination or should we rule this place as a new colony?" #NT!
 annex.2024.a: "Form the state of Namibia!" #NT!
  
 annexation_RWA_CONQ: "The Fate of Rwanda" #NT!
 annexation_RWA_CONQ_DESC: "After the liberation of Rwanda from the Belgian colonial grip we're left with the choice to let the Rwandans govern themselves to an extent or not, should we do it?" #NT!
 annex.2025.a: "Form the state of Rwanda." #NT!
  
 annexation_SEN_CONQ: "The Fate of Senegal" #NT!
 annexation_SEN_CONQ_DESC: "The region of Senegal has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2027.a: "Form the state of Senegal" #NT!
 annex.2027.b: "Establish [Root.GetAdjective] West Africa!" #NT!
  
 annexation_SOM_CONQ: "The Fate of Somalia" #NT!
 annexation_SOM_CONQ_DESC: "We now control the territories of the former Dervish state of Somalia and this inhospitable area populated by Somalis will prove itself to be hard to maintain through occupation, maybe we should let the Somalis organise themselves to an extent?" #NT!
 annex.2028.a: "Create a loyal Somalia" #NT!
  
 annexation_TOG_CONQ: "The Fate of Togo" #NT!
 annexation_TOG_CONQ_DESC: "The region of Togo has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2029.a: "Form the state of Togo." #NT!
  
 annexation_TZN_CONQ: "The Fate of Tanzania" #NT!
 annexation_TZN_CONQ_DESC: "The region of Tanzania has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annex.2030.a: "Form the state of Tanzania" #NT!
  
 annexation_UGA_CONQ: "The Fate of Uganda" #NT!
 annexation_UGA_CONQ_DESC: "We now occupy the former British colony of Uganda and this region, populated and close from the Great Lakes is far from anything we could control, should we make it easier by giving them a level of self-autonomy or should we continue the occupation?" #NT!
 annex.2031.a: "Form the state of Uganda." #NT!
  
 annexation_VOL_CONQ: "The Fate of Volta" #NT!
 annexation_VOL_CONQ_DESC: "The ancient land of the Mossi around the region of the Volta have come to our control and are now a part of our country. Often divided and badly regarded by the colonial authorities, their people are now asking us for a chance to form their own state. Should we let them organise themselves to an extent?" #NT!
 annex.2032.a: "Form the state of Upper Volta." #NT!
  
 annexation_ZIM_CONQ: "The Fate of Zimbabwe" #NT!
 annexation_ZIM_CONQ_DESC: "The protectorate of Zimbabwe has seen many movements for independence during its time as a colony but none succeeded until now, with our annexation of the country, there is now hope that the Zimbabwean nation will be created, should we do it?" #NT!
 annex.2033.a: "Form the state of Zimbabwe." #NT!
  
 annexation_TRI_CONQ: "The Fate of Trinidad" #NT!
 annexation_TRI_CONQ_DESC: "The former colony of Trinidad is now under our control; thus we must decide what to do with it." #NT!
 annex.1021.a: "Liberate a loyal state in Trinidad" #NT!
  
 annexation_SUR_CONQ: "The Fate of Suriname" #NT!
 annexation_SUR_CONQ_DESC: "The former Dutch territory of Suriname is now under our control; thus we must decide what to do with it." #NT!
 annex.1034.a: "Create a loyal state in Suriname" #NT!
  
 annexation_MZB_CONQ: "The Fate of Mozambique" #NT!
 annexation_MZB_CONQ_DESC: "Our annexation of the former Portuguese colony of Mozambique left us to manage those millions of Africans far by the seas. Surely installing a local government will be easier for us to manage it, but should we trust the locals with that?" #NT!
 annex.2040.a: "Form the state of Mozambique!" #NT!
  
 annexation_SIE_CONQ: "The Fate of Sierra Leone" #NT!
 annexation_SIE_CONQ_DESC: "The former British colony of Sierra Leone, once a haven for former loyal British slaves, has been captured by our advancing armies and has been incorporated into our empire. But despite our best efforts its administration is revealing itself to be a difficulty for our untrained administrators, some have argued to give the territory a greater degree of autonomy, should we allow it?" #NT!
 annex.2041.a: "They shall have their independence." #NT!
  
 annexation_SAARLAND_CONQ: "The Fate of Saarland" #NT!
 annexation_SAARLAND_CONQ_DESC: "Our armies have taken control of Saarland after our last campaigns, a region disputed between France and Germany for the last 70 years. We must now decide what's to do with this land." #NT!
 annex.181.a: "Give it to [16.owner.GetNameDef]" #NT!
 annex.181.b: "Give it to [64.owner.GetNameDef]" #NT!
  
 annexation_HAW_CONQ: "The Fate of Hawaii" #NT!
 annexation_HAW_CONQ_DESC: "The islands of Hawaii have been brought under our control as our troops occupy the region. We must now decide what to do with it." #NT!
