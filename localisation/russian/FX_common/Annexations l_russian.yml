 annexation_ALG_CONQ: "The Fate of Algeria" #NT!
 annexation_ALG_CONQ_DESC: "We finally freed Algeria from the French tyrants in Algiers. Should we give the Algerians freedom?" #NT!
 annex.2036.a: "Liberate a loyal Algeria." #NT!
  
 annexation_AFG_CONQ: "The Fate of Afghanistan" #NT!
 annexation_AFG_CONQ_DESC: "After a long fight with the Afghans, we have launched a full offensive and forced the Afghan Army to surrender and flee to the mountains. Kabul and the major roads are now in our hands, but the countryside is rallying against us and we may have a large fight on our hands should we attempt to occupy the so-called 'Graveyard of Empires.'" #NT!
 annex.3515.a: "Afghanistan must not be our graveyard, we will give them autonomy." #NT!
  
 annexation_ALAND_CONQ: "The Fate of Aland" #NT!
 annexation_ALAND_CONQ_DESC: "With the Baltic island of Åland now under our control, we must decide what to do with it." #NT!
 annexations.199.a: "Give it to Sweden" #NT!
 annexations.199.b: "Give it to Finland" #NT!
  
 annexation_ALASKA_CONQ: "The Fate of Alaska" #NT!
 annexation_ALASKA_CONQ_DESC: "The disputed territory of Alaska is now under our control; thus we must decide what to do with it." #NT!
 annex.1001.a: "Give it to Canada" #NT!
 annex.1001.b: "Give it to USA" #NT!
  
 annexation_ALB_CONQ: "The Fate of Albania" #NT!
 annexation_ALB_CONQ_DESC: "After a campaign across the Albanian countryside, our enemies in Tirana have finally capitulated, leaving us with the control of their country. Our position in the Adriatic has been cemented, but we must now decide what to do with Albania." #NT!
 annexations.154.a: "Restore an autonomous Albania!" #NT!
  
 annexation_ALSACE_CONQ: "The Fate of Alsace-Lorraine" #NT!
 annexation_ALSACE_CONQ_DESC: "Our armies have taken control of Alsace-Lorraine after our last campaigns, a region disputed between France and Germany for the last 70 years. We must now decide what's to do with this land." #NT!
 annex.180.a: "Give it to [baden.GetGrantTerritoryEventOption]" #NT!
 annex.180.b: "Give it to [moselland.GetGrantTerritoryEventOption]" #NT!
  
 annexation_AMMAN_CONQ: "The Fate of Amman" #NT!
 annexation_AMMAN_CONQ_DESC: "The disputed territory of Amman is now under our control; thus we must decide what to do with it." #NT!
 annex.3013.a: "Give it to the Arabs" #NT!
 annex.3013.b: "Give it to Syria" #NT!
 annex.3013.c: "Give it to the Iraqis" #NT!
 annex.3013.d: "Give it to the Arabs" #NT!
  
 annexation_ANG_CONQ: "The Fate of Angola" #NT!
 annexation_ANG_CONQ_DESC: "Our annexation of the former Portuguese colony of Angola left us to manage those millions of Africans far by the seas. Surely installing a local government will be easier for us to manage it, but should we trust the locals with that?" #NT!
 annex.2000.a: "Form the state of Angola!" #NT!
  
 annexation_ARB_CONQ: "The Fate of Arabia" #NT!
 annexation_ARB_CONQ_DESC: "After a long fight with the Arabs, we have launched a full offensive and forced the Arabian Army to surrender. The fate of the arabs in this land is now in our hands!" #NT!
 annex.3004.a: "Liberate a loyal Arabia." #NT!
  
 annexation_ARG_CONQ: "The Fate of Argentina" #NT!
 annexation_ARG_CONQ_DESC: "After the conquest of the vast nation of Argentina we have to organise competent administrations to keep the territory under control. Now we will need to decide on the fate of the region." #NT!
 annex.1023.a: "Liberate Argentina as our puppet!" #NT!
  
 annexation_ARICA_CONQ: "The Fate of Arica" #NT!
 annexation_ARICA_CONQ_DESC: "The disputed territory of Arica is now under our control; thus we must decide what to do with it." #NT!
 annex.1022.a: "Give it to Chile" #NT!
 annex.1022.b: "Give it to Peru" #NT!
  
 annexation_ARM_CONQ: "The Fate of Armenia" #NT!
 annexation_ARM_CONQ_DESC: "After fierce fighting in the Caucasus, we have conquered and annexed Armenia. The Armenian army has surrendered, and the territory is under our control, but the people are still resistant but soon they will submit." #NT!
 annex.3010.a: "Liberate Armenia!" #NT!
 annex.3010.b: "Transfer the lands to our Caucasian subject state" #NT!
  
 annexation_AST_CONQ: "The Fate of Australia" #NT!
 annexation_AST_CONQ_DESC: "Australia has been forced to capitulate and our troops are patrolling the streets of Sydney to prevent a rebellion or anything that could cause further instability. However, some have proposed that creating a local Australian government would be more helpful." #NT!
 annex.5001.a: "Liberate Australia!" #NT!
  
