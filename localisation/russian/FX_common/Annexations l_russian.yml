 annexation_region_29: "Carpathian Ruthenia" #NT!
 annexation_region_29_desc: "The disputed region of Carpathian Ruthenia has fallen into our hands, what shall we do with it?" #NT!
 annexation_region_30: "Hungary" #NT!
 annexation_region_30_desc: "The Hungarian nation has been completely defeated. Our forces are policing the streets of Budapest and partisans are being detained all across the countryside, but should this state of affairs remain permanent? What should we do with the Hungarian lands?" #NT!
 annexation_region_31: "Alfold" #NT!
