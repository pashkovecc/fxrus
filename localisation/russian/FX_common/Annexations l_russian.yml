 annexation_AUS_CONQ_DESC: "Austria has been forced to capitulate and our troops are patrolling the streets of Vienna to prevent a rebellion or anything that could cause further instability. However, some have proposed that creating a local Austrian government would be more helpful." #NT!
 annex.102.a: "We must liberate them." #NT!
 annex.102.b: "Integrate it to Germany" #NT!
  
