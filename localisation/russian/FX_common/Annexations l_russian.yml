 annexation_region_87: "Belarus" #NT!
 annexation_region_87_desc: "After a short campaign across Belarus, we have managed to shatter the defences of Minsk. Belarus is now in our hands! We must now decide on the future of it." #NT!
 annexation_region_88: "Mozyr" #NT!
 annexation_region_88_desc: "The region of Mozyr has been brought under our control as our troops occupy the region. We must now decide what to do with it." #NT!
 annexation_region_89: "Ukraine" #NT!
 annexation_region_89_desc: "After a long fight with the Breadbasket of Europe, we have launched a full offensive and forced the Ukrainian Army to surrender. Kiev is now in our hands!" #NT!
 annexation_region_90: "Donetsk And Luhansk" #NT!
 annexation_region_90_desc: "Our armies have taken control of Donetsk and Luhansk after our last campaigns, a region disputed between Ukraine and the Soviet Union for the last centuries. We must now decide what's to do with this land." #NT!
 annexation_region_91: "Crimea" #NT!
 annexation_region_91_desc: "The region of Crimea has been brought under our control as our troops occupy the region. We must now decide what to do with it." #NT!
 annexation_region_92: "Volhynia And Polesie" #NT!
 annexation_region_92_desc: "Both Volhynia and Polesie have been brought under our control. We must now decide what to do with it." #NT!
 annexation_region_93: "South Pinsk" #NT!
 annexation_region_93_desc: "The region of South Pinsk have been brought under our control. We must now decide what to do with it." #NT!
 annexation_region_94: "Denmark" #NT!
 annexation_region_94_desc: "After a short campaign across the numerous islands of Denmark and the capture of its capital, we have managed to take down the country. Copenhagen is now in our hands! The status of the Atlantic islands of Denmark is a particularly interesting case to deal with but we'll anyway have to decide on the future of Denmark." #NT!
 annexation_region_95: "Sweden" #NT!
 annexation_region_95_desc: "Today, the Swedish Chief of Army has announced the surrender of the Army. Supplies and equipment were captured after the surrender and have been shipped back to our country. Total victory has been achieved, but what we should do with Sweden is an open question." #NT!
 annexation_region_96: "Norway" #NT!
 annexation_region_96_desc: "The Norwegian Army has surrendered, and we have completely capitulated the Norwegian government. Our flag waves over the former capitol building in Oslo as our military campaign comes to an end. Now we must begin a campaign to destroy the Norwegian partisans, but perhaps enlisting Norwegian sympathizers to form a government would aid us?" #NT!
 annexation_region_97: "Finland" #NT!
 annexation_region_97_desc: "The Finnish soldiers have been defeated and our army is marching through Helsinki. Now we must deal with the question of how best to administer the Finns." #NT!
 annexation_region_98: "Karelia" #NT!
 annexation_region_98_desc: "The region of Karelia have been brought under our control. We must now decide what to do with it." #NT!
 annexation_region_99: "Aland" #NT!
 annexation_region_99_desc: "With the Baltic island of Åland now under our control, we must decide what to do with it." #NT!
 annexation_region_100: "Iceland" #NT!
 annexation_region_100_desc: "A campaign in the Northern Atlantic has paid off: Iceland has fallen in our hands and the question now is what we should do with this barren island in the northern Atlantic?" #NT!
 annexation_region_101: "Greenland" #NT!
 annexation_region_101_desc: "A campaign in the Northern Atlantic has paid off: Greenland has fallen in our hands and the question now is what we should do with this barren island in the northern Atlantic?" #NT!
 annexation_region_102: "Soviet Union" #NT!
 annexation_region_102_desc: "After a long fight with the Soviet government, we have launched a full offensive and forced the Red Army to surrender. Moscow is now in our hands and fate of the Russian nation with it!" #NT!
 annexation_region_103: "Kurdistan" #NT!
 annexation_region_103_desc: "Our armies have taken control of the northern part of the Levant, and the local Kurdish population is clamouring for self-government. We should decide what's to be done with the region." #NT!
 annexation_region_104: "Armenia" #NT!
 annexation_region_104_desc: "After fierce fighting in the Caucasus, we have conquered and annexed Armenia. The Armenian army has surrendered, and the territory is under our control, but the people are still resistant but soon they will submit." #NT!
 annexation_region_105: "Eastern Anatolia" #NT!
 annexation_region_105_desc: "The region of Eastern Anatolia have been brought under our control. We must now decide what to do with it." #NT!
 annexation_region_106: "Azerbaijan" #NT!
 annexation_region_106_desc: "After fierce fighting in the Caucasus, we have conquered and annexed Azerbaijan. The Azeri army has surrendered, and their territory is under our control, but the people are still resistant. What should we do with our newly conquered lands?" #NT!
 annexation_region_107: "Tao-Klarjeti" #NT!
 annexation_region_107_desc: "The disputed region of Tao Klarjeti is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_108: "Lori" #NT!
 annexation_region_108_desc: "The disputed region of Lori is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_109: "Russia" #NT!
 annexation_region_109_desc: "After a long fight with the white-Russian state, we have launched a full offensive and forced the White Army to surrender. Vladivostok is now in our hands and the fate of the Russian Far East with it!" #NT!
 annexation_region_110: "Georgia" #NT!
 annexation_region_110_desc: "Our armed forces have defeated the Georgian regime and is now triumphantly marching through the streets of Tbilisi. Now the only thing that remains to do is to determine status of the Georgian territory..." #NT!
 annexation_region_111: "Mountain Republic" #NT!
 annexation_region_111_desc: "Our armed forces have defeated the Mountain Republic and is now triumphantly marching through the streets in their capital. Now the only thing that remains to do is to determine status of the conquered territory..." #NT!
 annexation_region_112: "Iraq" #NT!
 annexation_region_112_desc: "We have conquered the fertile lands of Iraq including the grand and ancient city of Baghdad. What are we to do with these old Ottoman provinces?" #NT!
 annexation_region_113: "Iran" #NT!
 annexation_region_113_desc: "After a long fight with the Persians, we have launched a full offensive and forced the Persian Army to surrender. [266.GetName] is now in our hands!" #NT!
 annexation_region_114: "Khuzestan" #NT!
 annexation_region_114_desc: "The disputed region of Khuzestan is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_115: "Burma" #NT!
 annexation_region_115_desc: "Our forces have taken control of Burma, home to a vast array of different ethnic groups and numerous resources to boot. As a strategic gateway both into India and Southeast Asia, it would be vital to ensure its compliance. This begs the question, what shall we do with these lands?" #NT!
 annexation_region_116: "Vietnam" #NT!
 annexation_region_116_desc: "Our armies have taken control of Vietnam, and the local population are clamouring for self-government, risking our control should we not heed their desires. We should decide then what is to be done with the region." #NT!
 annexation_region_117: "Cambodia" #NT!
 annexation_region_117_desc: "Our armies have taken control of Phnom Penh, and the local Cambodians are clamouring for self-government. We should decide what is to be done with the region." #NT!
 annexation_region_118: "Laos" #NT!
 annexation_region_118_desc: "Our armies have taken control of Laos, and the locals are clamouring for self-government. We should decide what is to be done with the region." #NT!
 annexation_region_119: "Thailand" #NT!
 annexation_region_119_desc: "We have taken control over the Thai state and secured our dominance on the upper part of the Malay Peninsula. With continental Southeast Asia opened for the taking, the pressing issue for our government now is to figure out what we should do with the newly 'liberated' Thai provinces." #NT!
 annexation_region_120: "Malaya" #NT!
 annexation_region_120_desc: "Our armies have managed to take control of Malaya, and with it the invaluable rubber and tin that it can provide for our country. It is thus vital to decide now how best to secure such resources - what shall we do?" #NT!
 annexation_region_121: "Sarawak" #NT!
 annexation_region_121_desc: "Our armies have managed to take control of Sarawak, and with it the invaluable rubber and tin that it can provide for our country. It is thus vital to decide now how best to secure such resources - what shall we do?" #NT!
 annexation_region_122: "Sabah" #NT!
 annexation_region_122_desc: "The disputed territory of Sabah is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_123: "Indonesia" #NT!
 annexation_region_123_desc: "Our armies have managed to take control of Indonesia, and the islands themselves are now occupied by us. We have a few options now. We can either puppet the island or take it for ourselves, seeing as it possesses a key position in South East Asia and has many strategically valuable resources. What shall we do?" #NT!
 annexation_region_124: "Japanese Indonesia" #NT!
 annexation_region_124_desc: "The disputed territories of former-Japanese Indonesia - the Moluccas and Sulawesi - is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_125: "Timor" #NT!
 annexation_region_125_desc: "The disputed territory of Timor is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_126: "Papua New Guinea" #NT!
 annexation_region_126_desc: "Papua New Guinea has been brought under our leadership and our troops occupy the island. We must now decide what to do with it." #NT!
 annexation_region_127: "Philippines" #NT!
 annexation_region_127_desc: "Our armies have managed to take control of the Philippines, and the archipelago is now occupied by us. Should we organise a puppet government?" #NT!
 annexation_region_128: "Australia" #NT!
 annexation_region_128_desc: "Australia has been forced to capitulate and our troops are patrolling the streets of Sydney to prevent a rebellion or anything that could cause further instability. However, some have proposed that creating a local Australian government would be more helpful." #NT!
 annexation_region_129: "New Zealand" #NT!
 annexation_region_129_desc: "The islands of New Zealand have been brought under our control as our troops occupy the region. We must now decide what to do with it." #NT!
 annexation_region_130: "Taiwan" #NT!
 annexation_region_130_desc: "The island of Formosa, also known as Taiwan is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_131: "Yunnan" #NT!
 annexation_region_131_desc: "We have taken control of the territories of Yunan, and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_132: "Sichuan" #NT!
 annexation_region_132_desc: "We have taken control of the territories of Sichuan, and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_133: "Xinjiang" #NT!
 annexation_region_133_desc: "After our successful campaign in Xinjiang we now have the task to establish new local administrative authority in order to restore peace, however there are several options for our choice." #NT!
 annexation_region_134: "Tibet" #NT!
 annexation_region_134_desc: "After our successful campaign in the Tibetan Plateau we now have the task to establish new local administrative authority in order to restore peace, however there are several options for our choice." #NT!
 annexation_region_135: "Shanxi" #NT!
 annexation_region_135_desc: "We have taken control of the territories of Shanxi, and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_136: "Manchuria" #NT!
 annexation_region_136_desc: "After our successful campaign in Manchuria we now have the task to establish new local administrative authority in order to restore peace, however there are several options for our choice." #NT!
 annexation_region_137: "Mongolia" #NT!
 annexation_region_137_desc: "After our successful campaign in the steppes of Mongolia, we now have the task to establish new local administrative authority in order to restore peace. However, there are several options for our choice." #NT!
 annexation_region_138: "Korea" #NT!
 annexation_region_138_desc: "After the final liberation of the proud nation of Korea we were left with the responsibility of organising the administration of the newly conquered territories, what shall we do?" #NT!
 annexation_region_139: "Singapore" #NT!
 annexation_region_139_desc: "The former bastion of British rule in Southeast Asia, Singapore, is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_140: "Japan" #NT!
 annexation_region_140_desc: "After our successful campaign on the Japanese islands we now have the task to establish new local administrative authority in order to restore peace, however there are several options for our choice.." #NT!
 annexation_region_141: "Tuva" #NT!
