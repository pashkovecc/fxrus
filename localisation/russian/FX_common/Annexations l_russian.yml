 annexation_region_232: "Cuba" #NT!
 annexation_region_232_desc: "After a short campaign across the island of Cuba, we have finally managed to shatter the Cuban defences. Havana is now in our hands! We must now decide on the future of Cuba." #NT!
 annexation_region_233: "Bahamas" #NT!
 annexation_region_233_desc: "After a short campaign across the Bahamas, we have finally managed to shatter the Cuban defences. Havana is now in our hands! We must now decide on the future of Cuba." #NT!
