 annexation_region_61_desc: "The disputed region of Smyrna is now under our control; and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_62: "Constantinople" #NT!
 annexation_region_62_desc: "The disputed city and former jewel of the East - Constantinople - is now under our control; we must decide what to do with this city." #NT!
 annexation_region_63: "the Straits" #NT!
 annexation_region_63_desc: "The disputed region of the Bosphorus Straits is now under our control; and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_64: "Bulgaria" #NT!
 annexation_region_64_desc: "After a long fight with the Bulgarians, we have launched a full offensive and forced the Bulgarian Army to surrender. Sofia is now in our hands! What should we do with their lands?" #NT!
 annexation_region_65: "South Anatolia" #NT!
 annexation_region_65_desc: "The region of South Anatolia is now under our control; and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_66: "Turkey" #NT!
 annexation_region_66_desc: "We have destroyed the last remnants of the Turkish state and finally put the 'sick man of Europe' in his grave. Our troops now patrol the streets of Ankara, yet we cannot remain as occupiers forever. A decision will have to be made in regards to the future government of the Turkish people." #NT!
 annexation_region_67: "Cyprus" #NT!
 annexation_region_67_desc: "Our armies have managed to take control of Cyprus, and the island itself is now occupied by us. We have a few options in front of us, now. We can either puppet the island or take it for ourselves, seeing as it possesses a key position in the Mediterranean and is crucial to retaining control of that area. What shall we do?" #NT!
 annexation_region_68: "Ellispontos" #NT!
 annexation_region_68_desc: "The disputed region of Dardanella is now under our control; " #NT!
 annexation_region_69: "Italy" #NT!
 annexation_region_69_desc: "With the majority of the Italian peninsula under our control, it is up to us to decide what will become of the region. Will it be released as a single entity under our control, powerful but perhaps difficult to control? Or should we decide what to do with each part of it separately?" #NT!
 annexation_region_70: "South Tyrol" #NT!
