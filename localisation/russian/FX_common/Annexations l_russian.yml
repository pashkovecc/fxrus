 annexation_region_189: "Eritrea" #NT!
 annexation_region_189_desc: "After our successful campaign in Eritrea we now have the task to establish new local administrative authority in order to restore peace, however, there are several options for our choice..." #NT!
 annexation_region_190: "Ethiopia" #NT!
 annexation_region_190_desc: "After our successful campaign in Ethiopia we now have the task to establish new local administrative authority in order to restore peace, however there are several options for our choice..." #NT!
 annexation_region_191: "Gabon" #NT!
 annexation_region_191_desc: "We now control the former French colony of Gabon and with it masses of Africans yearning to breathe free, should we give them this freedom under our close surveillance or is this dream vain?" #NT!
 annexation_region_192: "Gambia" #NT!
 annexation_region_192_desc: "The region of Gambia has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_193: "Suez" #NT!
 annexation_region_193_desc: "The Suez Canal has now been brought under our control. With a vital piece of the international trade system now under our control, should we continue this occupation or should we hand it back to local control?" #NT!
 annexation_region_194: "Ghana" #NT!
 annexation_region_194_desc: "The region of Ghana has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_195: "Guinea" #NT!
 annexation_region_195_desc: "The former French colony of Guinea, divided between a traditional mountainous north and a colonial south has been annexed into our growing empire. We're now left with the complex task of organising this new territory, should we incorporate it directly into our structure of power or should we create a separate puppet state there?" #NT!
 annexation_region_196: "Ivory Coast" #NT!
 annexation_region_196_desc: "The Ivory Coast, once a French colony under Mittelafrika just got annexed into our glorious empire. Its inhabitants now demand a competent administration to take care of taxes or conscription, should we try to govern them from our capital or would a local limited government be a better solution?" #NT!
 annexation_region_197: "Kenya" #NT!
 annexation_region_197_desc: "The steppes of Kenya are now in our graceful control, what should we do with them? Will we control it directly or will we liberate them?" #NT!
 annexation_region_198: "Mali" #NT!
 annexation_region_198_desc: "The valley of the Niger river, once known as French Sudan or Mali is now directly integrated into our territories. This colony though needs a better administration that we will have difficulties to provide, nevertheless, the local people and the remnants of the French administration can administer it for us to an extent, should we let them form a loyal puppet state?" #NT!
 annexation_region_199: "Morocco" #NT!
 annexation_region_199_desc: "We have freed Morocco from the French and our forces are now having difficulties occupying the mountainous and semi-arid regions of the country. Though the urban centres are in our control, it would maybe be wise to hand out further control to locals." #NT!
 annexation_region_200: "Mauritania" #NT!
 annexation_region_200_desc: "The desert region of Mauritania has come under the control of our armies. The former French colony, not even pacified 15 years ago, is now in need of a government to rule it efficiently to avoid the territory falling into anarchy once again. Should we consider creating a Mauritanian puppet state?" #NT!
 annexation_region_201: "Nigeria" #NT!
 annexation_region_201_desc: "The vast and rich colony of Nigeria is now under our control and with it comes the burden of having to administer it, could we delegate this task to an extent to a local puppet state?" #NT!
 annexation_region_202: "Niger" #NT!
 annexation_region_202_desc: "The region of Niger has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_203: "Namibia" #NT!
 annexation_region_203_desc: "We annexed the former territories of South Africa, most commonly known as Namibia but we're now left to manage thousands of Africans in a territory we don't know about, should we institute a degree of self-determination or should we rule this place as a new colony?" #NT!
 annexation_region_204: "Rwanda" #NT!
 annexation_region_204_desc: "After the liberation of Rwanda from the Belgian colonial grip we're left with the choice to let the Rwandans govern themselves to an extent or not, should we do it?" #NT!
 annexation_region_205: "South Africa" #NT!
 annexation_region_205_desc: "After a long fight with the South African state, we have launched a full offensive and forced the South African armed forces to surrender." #NT!
 annexation_region_206: "The Rif" #NT!
 annexation_region_206_desc: "The Rif mountain range has now been brought under our control. Should we continue this occupation or should we return it to other parties?" #NT!
 annexation_region_207: "Guinea-Bissau" #NT!
 annexation_region_207_desc: "The region of Guinea Bissau has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_208: "Senegal" #NT!
 annexation_region_208_desc: "The region of Senegal has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_209: "Somalia" #NT!
 annexation_region_209_desc: "We now control the territories of the former Dervish state of Somalia and this inhospitable area populated by Somalis will prove itself to be hard to maintain through occupation, maybe we should let the Somalis organise themselves to an extent?" #NT!
 annexation_region_210: "Tanzania" #NT!
 annexation_region_210_desc: "The region of Tanzania has now been brought under our control. The former colonial administration fled the colony early and left us with an ungoverned territory occupied. Should we continue this occupation or should we form a new government?" #NT!
 annexation_region_211: "Uganda" #NT!
 annexation_region_211_desc: "We now occupy the former British colony of Uganda and this region, populated and close from the Great Lakes is far from anything we could control, should we make it easier by giving them a level of self-autonomy or should we continue the occupation?" #NT!
 annexation_region_212: "Upper Volta" #NT!
 annexation_region_212_desc: "The ancient land of the Mossi around the region of the Volta have come to our control and are now a part of our country. Often divided and badly regarded by the colonial authorities, their people are now asking us for a chance to form their own state. Should we let them organise themselves to an extent?" #NT!
 annexation_region_213: "Liberia" #NT!
 annexation_region_213_desc: "The state of Liberia, founded by an American company under the wish of bringing American blacks back to Africa has always been a peculiar state. Under the loose control of the Americans for years the country has now fallen before our might. The Liberian identity is strong and trying to annex them directly might prove itself inefficient, officials in our country are calling for the establishment of a loyal Liberian state instead, should we do that?" #NT!
 annexation_region_214: "Tunisia" #NT!
 annexation_region_214_desc: "After overwhelming the Tunisian defences, we have launched a full offensive and Tunis is now in our hands, along with the rest of Tunisia. The Bey and several nationalists are clamouring for self-governance, and some suggest they should be granted it. Alternatively, we could continue to occupy Tunisia. What should we do?" #NT!
 annexation_region_215: "Algeria" #NT!
 annexation_region_215_desc: "We finally freed Algeria from the French tyrants in Algiers. Should we give the Algerians freedom?" #NT!
 annexation_region_216: "Madagascar" #NT!
 annexation_region_216_desc: "Our powerful armies have taken control of the former French colony of Madagascar. The huge island is currently under military administration but we may want to install a real administration there, should it be local or should we annex the island directly to our empire?" #NT!
 annexation_region_217: "Libya" #NT!
 annexation_region_217_desc: "We have taken control of the territories of Libya, and there is some degree of resistance among the locals. We must decide what to do with their lands." #NT!
 annexation_region_218: "Kufra" #NT!
 annexation_region_218_desc: "The Saharan territory of Kufra has fallen under our control, and we must thus now decide what to do with this land." #NT!
 annexation_region_219: "Western Sahara" #NT!
 annexation_region_219_desc: "The region of Western Sahara is now under our control; thus we must decide what to do with it." #NT!
 annexation_region_220: "Mozambique" #NT!
 annexation_region_220_desc: "Our annexation of the former Portuguese colony of Mozambique left us to manage those millions of Africans far by the seas. Surely installing a local government will be easier for us to manage it, but should we trust the locals with that?" #NT!
 annexation_region_221: "Sierra Leone" #NT!
 annexation_region_221_desc: "The former British colony of Sierra Leone, once a haven for former loyal British slaves, has been captured by our advancing armies and has been incorporated into our empire. But despite our best efforts its administration is revealing itself to be a difficulty for our untrained administrators, some have argued to give the territory a greater degree of autonomy, should we allow it?" #NT!
 annexation_region_222: "Chad" #NT!
 annexation_region_222_desc: "Finally, our annexation of the region of Chad is complete, the former French colony is now in need of a competent administration to manage it. Given the difficulties it gave to France, between tribal and passive revolts, should we consider giving them autonomy to alleviate this burden?" #NT!
 annexation_region_223: "Equatorial Guinea" #NT!
 annexation_region_223_desc: "After our successful campaign in the center of Africa we now have the task to establish new local administrative authority in order to restore peace, however there are several options for our choice..." #NT!
 annexation_region_224: "Canada" #NT!
