 NAR_the_racial_issue_desc: "Хотя за последние несколько десятилетий федеральное правительство фактически отменило рабство, многие меньшинства, особенно чернокожие, не пользуются теми же преимуществами, что и белые граждане. По правовому статусу они технически свободны, но сегрегированы в обществе.\n\nТекущий статус меньшинств: [NAR_minority_status]\nУровень притеснения: [?minority_suppression|0-]" # While the last few decades the Federal Government effectively abolished slavery, many minorities, especially blacks doesn't enjoy the same benefits as white citizens. Under the legal status, they are technically free, but are segregated in public society.\n\nCurrent Status of Minorities: [NAR_minority_status]\nOppression Level: [?minority_suppression|0-]
