### Events
 newamerica.1.t: "Укрепление нашего авторитета" # Cementing Our Authority
 newamerica.1.d: "Новая Американская Республика — молодая республика, возникшая после разрушения старых и коррумпированных Соединенных Штатов. Губернаторы были недовольны политикой федерального правительства, полностью вышли из союза и образовали Новую Американскую Республику. Хотя некоторые наши граждане уважают нашу власть; некоторые этого не делают, особенно те, кто принадлежит к низшим классам и меньшинствам. Они считают их простой марионеткой Корпоративного Совета; а не законное правительство, подобное правительству в Вашингтоне. Многие предлагали нам установить какие-то отношения с меньшинствами и рабочим классом, однако есть и те, кто не хочет с ними компромисса; поскольку у нас есть войска, которые могут при необходимости усмирить будущие угрозы." # The New American Republic is a young republic brought upon the destruction of the old and corrupt United States. The governors have been discontented with the policies of the Federal Government and have outright seceeded from the union and have formed the New American Republic. While some of our citizens our respecting our authority; some do not, specially those who are in the lower classes and the minorities. They see as a mere puppet of the Corpoate Council; and not a legitimate government like those in Washington. Many have been proposing that we conduct some sort of a relations with the minorities and the working classes, however, there are also some, that don't want a compromise with them; as we have the troops that can pacify future threats if necessary.
 newamerica.1.a: "Наш авторитет исходит от оружия армии" # Our authority comes from the guns of the army
 newamerica.1.b: "Попробуйте наладить отношения с меньшинствами" # Try having relations with the minorities
 newamerica.2.t: "Компромисс с Симмонсом?" # Compromise with Simmons?
 newamerica.2.d: "Уильям Джозеф Симмонс, лидер АНП, или Американской партии чистоты, с ее военизированным крылом «Черный легион». Чтобы полностью укрепить нашу власть в штате, некоторые в правительстве предлагают компромисс с Симмонсом. Однако, если они получат слишком много власти в правительстве, кто знает, что произойдет с Республикой." # William Joseph Simmons, the leader for the APP, or the American Purity Party, with its paramilitary wing, the Black Legion. In order, to fully cement our power in the state, some in the government proposes a compromise with Simmons. However, if they get too much power on the government, who knows what will happen to the Republic.
 newamerica.2.a: "Пока это укрепит нашу власть" # As long as it will solidify our power
 newamerica.2.b: "Они меня пугают, но ничего не делают" # They give me the creeps, but do nothing
 newamerica.2.c: "Запретить их полностью" # Ban them outright
 newamerica.3.t: "Обзор пособий по безработице" # Reviewing the Unemployment Benefits
 newamerica.3.d: "В надежде смягчить некоторые последствия экономического спада было предложено пересмотреть пособия по безработице, которые могут быть использованы в качестве фондов в случае их отмены. Однако отмена этих льгот, безусловно, может сделать нашу администрацию популярной, и поэтому у некоторых в правительстве есть идея отменить льготы только для тех, кто классифицируется как меньшинства, что может в то же время высвободить некоторое финансирование, избегая непопулярности среди наших граждан." # In hopes of alleviating some of the effects of the economic recession, there have been the proposal of reviewing the unemployment benefits that can be used as funds in case of it being revoked. However, revoking these benefits can surely make our administration popular, and thus, some within the government have the idea of only revoking the benfits of those who are classified as minorities which can free up some funding at the same time, avoiding being unpopular onto our citizens.
 newamerica.3.a: "Отзыв для меньшинств" # Revoke for the minorities
 newamerica.3.b: "Отменить его для всех" # Revoke it for all
 newamerica.4.t: "Гарнизоны в Детриоте?" # Garrisons in Detriot?
 newamerica.4.d: "На встрече с [Root.GetLeader] генерал Мозли предложил разместить гарнизоны по всему городу Детриот; чтобы обезопасить сердце Республики, а также уменьшить отвратительные действия, совершаемые преступниками. Хотя предложение генерала Мозли было, мягко говоря, вполне разумным; мы также можем разместить эти гарнизоны в других частях страны; эффективно обеспечивая наш контроль за пределами городских территорий." # On the meeting with [Root.GetLeader], General Moseley have proposed to deploy garrisons throughout the city of Detriot; in order to secure the heart of the Republic and also to lessen the henious activities commited by the criminals. While the proposal of General Moseley have been quite sensible to say the least; we can also deploy those garrisons on other parts of the nation; effectively securing our control outside of the urban areas.
 newamerica.4.a: "Развертывание гарнизонов" # Deploy the garrisons
 newamerica.4.b: "Они нужнее в другом месте" # They are more needed elsewhere
 newamerica.5.t: "Проблема минимальной заработной платы" # The Minimum Wage Issue
 newamerica.5.d: "Идея стандартизированной минимальной заработной платы в последнее время не вызывала особого беспокойства у правительства. Однако с тех пор профсоюзы и профсоюзные лидеры довольно громко заявляли об этом, и в последнее время они набрали обороты; поскольку чиновники в правительстве предложили минимальную заработную плату для рабочих по всей стране. Постановление уже находится в законодательном органе правительства и находится на рассмотрении." # The idea of an standardized minimum wage has not been quite in the government's concerns recently. However, unions and labour leaders have been quite vocal about it since, and they have gained the momentum recently; as officials in the government have proposed a minimum wage for the workers throughout the nation. The resolution is already in the legislative body of the government and is being reviewed.
 newamerica.5.a: "Какое абсурдное требование" # What an absurd demand
 newamerica.5.b: "Это только для избранных" # It is only for the privileged ones
 newamerica.5.c: "Просто прими это, это всего лишь деньги" # Just accept it, it's only money
 newamerica.6.t: "Вербовка в Черный Легион" # Recruitments in the Black Legion
 newamerica.6.d: "Наши силы безопасности получили разведывательные сообщения о том, что Черный Легион, военизированное крыло АПП, проводит вербовочные кампании по всему Детриоту и прилегающим к нему районам. Действующие члены легиона будут похищать потенциальных членов, чтобы заставить их войти в организацию. Эта деятельность АПП вызвала беспокойство у многих; и в силовых структурах есть офицеры, которые требуют их ареста; однако многие в гражданском правительстве желают оставить их в покое." # There have been intelligence reports from our security forces that the Black Legion, the paramilitary wing of the APP have been conducting recruitment campaigns all over Detriot and its surronding areas. Current members of the legion will kidnap potential members to force their entry onto the organization. These activities by the APP has been a worrysome for many; and there are officers in the security forces that demands their arrest; however, many within the civilian government wishes to leave them alone.
 newamerica.6.a: "Оставь их в покое" # Leave them alone
 newamerica.6.b: "Прикажите их арестовать" # Order their arrests
 newamerica.7.t: "Столкновение в Чикаго" # Clash at Chicago
 newamerica.7.d: "В ответ на недавнюю политику правительства в различных аспектах жизни по всей республике; Многие недовольные группы собрались вокруг города Чикаго, организовав акцию протеста в надежде обратить вспять некоторые, если не все, противоречивые политические решения.\n\nОднако задействованные силы безопасности стремились разогнать протестующих, что привело к ожесточенному разговору, который в конечном итоге закончился столкновением между протестующими меньшинствами и нашими силами безопасности." # In response to the recent policies of the government in various aspects of life throughout the republic; many dissatisfied groups have gathered around the city of Chicago organizing a protest in hopes of reversing some, if not all of the controversial politicies.\n\nThe deployed security forces however, were eager to disperse the protesters, that resulted in a heated conversation that ultimately ended in a clash between the protesting minorities and our security forces.
 newamerica.7.a: "О, нет..." # Oh no...
 newamerica.8.t: "Трагедия на Вестерн-авеню" # Tragedy at Western Avenue
 newamerica.8.d: "Во время столкновения между нашими силами безопасности и меньшинствами, протестующими против нашего решения о дальнейшем ограничении их деятельности; наши силы случайно застрелили девочку-подростка небелого происхождения, которая затем скончалась от ран. В сообщениях утверждается, что наши силы ошибочно отождествили девочку-подростка с протестующими, которые направлялись по каким-то делам." # During the clash between our security forces and the minorities who are protesting our decision to further limit their activities; a teenage girl with a non-white ancestry was accidentaly shot by our forces, who then died from the injury. Reports have claimed that our forces have mistakenly relate the teenage girl from the protesters who are en route to run some errands. 
 newamerica.8.a: "Мы выражаем наши соболезнования" # We send our condolences
 newamerica.9.t: "Расследование" # The Investigation
 newamerica.9.d: "Спорная смерть девочки-подростка во время столкновения в городе Чикаго усилила голоса тех, кто хотел, чтобы правительство провело расследование в отношении тех, кто несет ответственность за трагедию, произошедшую во время столкновения.\n\nМы сами контролируем, каким будет результат этого расследования; хотя мы можем винить во всем, что произошло, протестующих, мы также можем винить в неудачном событии некоторых наших офицеров; однако каким бы ни было наше решение; последствия неизбежны." # The controversial death of a teenage girl during the clash at the city of Chicago have amplified the voices of those who wanted the government to conduct investigations on those who are responsible for the tragedy that have happened during the clash.\n\nWe ourselves, controls what will be the outcome of this investigation; while we can blame everything that has happened on the protesters, we can also blame the unfortunate event on some of our officers; however no matter what our decision will be; the consequences are inevitable.
 newamerica.9.a: "Протестующие виноваты" # The protesters are at fault
 newamerica.9.b: "Офицеры виноваты" # The officers are at fault
 newamerica.10.t: "Марш в Детриоте" # The March at Detriot
 newamerica.10.d: "С ростом популярности Американской партии чистоты, возглавляемой Уильямом Дж. Симмонсом; военизированные формирования и воинские части, сочувствующие этому делу, вошли в столицу, захватив важные правительственные объекты и объекты. Местонахождение [Root.GetLeader] до сих пор неизвестно; но это не имеет значения, поскольку АНП взяла под свой контроль государственный аппарат; назначение Симмонса новым президентом Новой Американской Республики." # With the growing popularity of the American Purity Party, headed by William J. Simmons; paramilitary forces and military units sympathetic to the cause have marched onto the capital, securing important government facilities and installations. The whereabouts of [Root.GetLeader] is still unknown; but it doesn't matter, as the APP have taken control of the apparatus of state; installing Simmons as the new President of the New American Republic.
 newamerica.10.a: "Новая эра для Америки!" # A new era for America!
 newamerica.11.t: "Во имя стабильности" # In the Name of Stability
 newamerica.11.d: "Спорная политика администрации Форда заставила военных взять контроль над собой во имя обеспечения стабильности государства. Важные правительственные объекты и объекты были взяты под охрану воинскими частями, а генерал Мозли был назначен временным президентом Новой Американской Республики." # The controversial policies of the Ford administration have left the military to seize control of themselves, in the name of securing the stability of the state. Important government installations and facilities have been secured by military units and General Moseley have been installed as temporary President of the New American Republic.
 newamerica.11.a: "Новая эра для Америки!" # A new era for America!
 newamerica.12.t: "Ford заручается корпоративной поддержкой" # Ford Secures Corporate Backing
 newamerica.12.d: "В ответ на его более жесткие реформы по всей Новой Республике Корпоративный совет проголосовал за отстранение [Root.GetLeader] от должности. Похоже, что совет утратил доверие к руководству Тигла и назначил новым президентом знаменитого Генри Форда." # In response to his more hardline reforms throughout the New Republic, [Root.GetLeader] was voted out of office by the Corporate Council. It seems that the council has lost confidence on Teagle's leadership and has installed the famed Henry Ford as the new President.
 newamerica.12.a: "Удачи, мистер Форд!" # Good luck, Mr. Ford!
 newamerica.13.t: "Рабочие присоединяются к протестующим" # Workers Join the Protesters
 newamerica.13.d: "Поддерживая своих угнетенных «товарищей», рабочие в различных частях штата присоединились к меньшинствам в их протестах. Профсоюзные лидеры и видные активисты организовали забастовку рабочих, которая фактически парализовала нашу экономику.\n\nВ правительстве есть люди, особенно в силах безопасности, которые предлагают арестовать организаторов забастовок. Однако это действие может даже усилить напряжение и усугубить ситуацию; есть и те, кто предлагает игнорировать сложившуюся ситуацию, главным образом полагая, что она разрешится сама собой. Однако, что бы мы ни сделали, последствия будут." # In supporting their fellow oppressed \"comrades\" the workers in various locations in the state have joined the minorities in their protests.Union leaders and prominent activists have organized a worker strike that have effectively paralyzed our economy.\n\nThere are some in the government, specially in the security forces that proposes to arrest the organisers of the strikes. However this action can even escelate the tension and might make things worse; there are also those who proposes to ignore the current situation mainly believing that it will resolve onto itself. However, whatever we might do, there will be consequences.
 newamerica.13.a: "Прикажите арестовать их лидеров!" # Order the arrest of their leaders!
 newamerica.13.b: "Не обращайте на них внимания и продолжайте" # Ignore them and carry on
 newamerica.14.t: "Бунт!" # Revolt!
 newamerica.14.d: "В этот день рано утром произошло немыслимое: протестующие и участники беспорядков одолели наши силы безопасности в городе Чикаго и захватили контроль над важными правительственными учреждениями и зданиями. Многие наши войска и части либо присоединились к протестующим, либо оказались взаперти; и лидеры анархистов объявили вооруженный конфликт против нашего правительства, да поможет нам Бог в это трудное время." # On this day, early in the morning, an unthinkable has happened, the protesters and rioters have overpowered our security forces in the city of Chicago and have seized control of important government offices and buildings. Many of our troops and units have either joined the protesters or have been locked up; and the anarchist's leaders have proclaimed an armed conflict against our government, may God help us in this difficult times.
 newamerica.14.a: "Мы сокрушим этих предателей!" # We will crush these traitors!
 newamerica.15.t: "Победа в Чикаго" # Victory in Chicago
 newamerica.15.d: "Наши войска снова маршировали по городу Чикаго, прежде чем он был захвачен анархистами, пытавшимися провозгласить собственное независимое государство.\n\nОднако, благодаря нашей военной мощи и промышленному потенциалу, мы победили их и убедились, что их идеи находятся с ними на их могилах." # Our forces were once again marching in the city of Chicago, before it is seized by the anarchist trying to declare an independent state of their own.\n\nHowever, due to our military might and industrial capabilities, we have defeated them and made sure that their ideas are with them on their graves.
 newamerica.15.a: "Как и ожидалось." # As expected.
 newamerica.16.t: "Доктрина ВВС" # The Air Force Doctrine
 newamerica.16.d: "Недавно созданные Новые американские ВВС обсуждают, на какой доктрине следует сосредоточить внимание этому учреждению. Есть голоса, которые настаивают на вспомогательной роли ВВС для армии, чтобы дать нашим войскам лучшее преимущество в бою; однако есть также голоса, которые выступают за сосредоточение внимания на разрушении промышленности и инфраструктуры противника, чтобы остановить их военную машину." # The newly created New American Air Force has been debating on what doctrine should the institution will focus on, there are voices that persue the supporting role of the air force for the army, in chance of giving our troops the better edge in combat; however, there are also voices that advocates in focusing on destruction of enemy industry and infrastructure, to halt their war machine.
 newamerica.16.a: "Им нужна поддержка армии на поле боя" # They need support the army on the field
 newamerica.16.b: "Им необходимо обрушить огонь на территорию противника." # They need to unleash fire onto the enemy territory
 newamerica.17.t: "Вторая Великая Миграция" # The Second Great Migration
 newamerica.17.d: "Поскольку мы пытались заставить меньшинства оставаться на наших территориях; поступали сообщения о том, что подавляющее число чернокожих американцев, азиатов и коренных американцев бежало на юг и восток, на территории, контролируемые старым федеральным правительством и недавно созданным штатом Новая Англия." # As we have attempted to force the minorities to stay in our territories; there have been reports of a overwhelming number of Black Americans, Asians and Native Americans fleeing into the south and east, territories controlled by the old federal Government and the newly established state of New England.
 newamerica.17.a: "Интересный..." # Interesting...
 newamerica.18.t: "Беженцы из [NAR.GetNameDef]" # Refugees from [NAR.GetNameDef]
 newamerica.18.d: "Несмотря на попытки [NAR.GetNameDef] заставить свои меньшинства остаться на своей территории, все большее число чернокожих американцев по иронии судьбы бегут на юг и восток. Общее число, вероятно, насчитывает не менее миллиона человек, причем многие стремятся поселиться на нашей территории из-за ее очевидной близости. В частности, в городских районах Нового Орлеана наблюдается приток мигрантов. Белые популисты, такие как Вирджил Эффингер, предлагают также прекратить въезд чернокожих, чтобы не угрожать белому рабочему классу. Однако большая часть республиканцев и прогрессистов с этим не согласна и наряду с нашими генералами видят возможность вербовки и потенциальных фабричных рабочих. Они рекомендуют разрешить мигрантам обосноваться и сразу же принять их на работу." # Despite the attempts of [NAR.GetNameDef] to force its minorities to stay in their territory, an increasingly large number of black Americans are ironically fleeing to the South and East. The total is likely numbering in at least a million, with many seeking to settle in our territory due to its obvious proximity. In particular, the urban regions of New Orleans are seeing an inflow of migrants. White populists such as Virgil Effinger suggest also stopping anymore blacks from entering so as to not threaten the white working class. However, much of the Republicans and Progressives disagree with this and alongside our generals see an opportunity for recruitment and potential factory workers. They recommend allowing the migrants to settle and recruiting them at once.
 newamerica.18.a: "Впусти их" # Let them in
 newamerica.18.b: "Объявляем, что больше не будем принимать" # Announce we won't be taking in anymore
 newamerica.19.t: "Архиепископы просят поддержки" # Archbishops seek support
 newamerica.19.d: "Считая [Root.GetLeader] полезным союзником как против Клана, так и против социалистов, многие архиепископы склоняются к новой политике после того, как ранее были враждебно настроены по отношению к влиянию Чарльза Кафлина среди католического населения, наиболее заметным из которых является архиепископ Эдвард Алоизиус Муни, который теперь открыто поддерживает новый режим. В частном порядке архиепископ желает увеличить финансирование католических епархий, чтобы [Root.GetLeader] поддерживал дружбу с католическими народами и чтобы иммигрантам-католикам было легче стать натурализованными иммигрантами. Однако некоторые в правительстве не желают такого соглашения, полагая, что [Root.GetLeader] должен сделать это без их одобрения, поскольку они относятся к духовенству с подозрением за то, что оно не поддержало их раньше. Однако архиепископы обещают усиление поддержки режима, если он согласится." # Perceving [Root.GetLeader] as a useful ally against both the Klan and socialists, many archbishops are coming around to the new policies after previously being hostile to Charles Coughlin's influence among the Catholic population, with the most notable being Archbishop Edward Aloysius Mooney whom is now openly embracing to the new regime. Privately, the Archbishop desires increased funding for Catholic diocoses, for [Root.GetLeader] to endorse friendship with Catholic nations and for it to be easier to Catholic immigrants to become naturalized immigrants. However, some in the government do not desire any such agreement, thinking [Root.GetLeader] should do it without their approval since they view the clericy with suspicion for not endorsing them sooner. However, the Archbishops promise increased support for the regime if he agrees.
 newamerica.19.a: "Соглашаться" # Agree
 newamerica.19.b: "Нет, мы обязаны сторонникам католиков, а не Церкви."  # No, we are beholden to Catholic supporters not the Church
 newamerica.20.t: "Еврейский вопрос" # The Jewish Question
 newamerica.20.d: "Как давно неизменно считали все фракции NDWL, еврейское население Америки и мира представляет собой подрывной и корыстный элемент, объединенный стремлением внести свой вклад в развитие американского общества и связанный с большевизмом и культурным вырождением.\nТеперь, когда мы укрепили свою власть, президенту [Root.GetLeader] предстоит решить вопрос нашей будущей политики по отношению к евреям. Умеренные в нашем правительстве хотят возродить планы Генри Форда по еврейской сегрегации, гарантируя, что евреи по всей Америке будут размещены в своих собственных автономных общинах в определенных городах.\nВ рамках жесткой оппозиции этому есть много нативистов, которые хотели бы, чтобы евреи были репатриированы из Америки, через канадскую границу и в места назначения по их выбору, вдали от нашей приятной земли. Между тем, есть те, кто считает, что Йоки не следует недооценивать прибыльную возможность дешевой еврейской рабочей силы." # As all of the NDWL factions have long invariably believed, the Jewish population of America and the world is a subversive and self-interested element, uniterested in contributing to American society and linked to Bolshevism and cultural degeneracy.\nNow that we have secured our hold on power, it falls to President [Root.GetLeader] to settle the matter of our future policy towards the Jews. The moderates in our government want to revive Henry Fords's plans of Jewish segregation, ensuring that Jews across America are placed in their own self-contained communities within designated cities.\nWithin the hardliner opposition to this, there are many nativists who would like to see Jews repatriated from America, across the Canadian border and on to destinations of their choosing far from our pleasant land. Meanwhile, there are those who believe that Yockey should not underestimate the lucrative possibility of cheap Jewish labor.
 newamerica.20.a: "Распространить Джима Кроу на евреев" # Extend Jim Crow to the Jews
 newamerica.20.b: "Репатриировать их массово" # Repatriate them en masse
 newamerica.20.c: "Они искупят себя трудом" # They will redeem themselves through labour
 newamerica.21.t: "Борьба с преступностью" # Fighting Crime
 newamerica.22.d: "Министр безопасности Томпсон объявил о новой борьбе с «преступным населением» Америки и теми, у кого есть обоснованные подозрения в совершении преступлений в будущем из-за «наследственных связей с преступностью и вырождения». После этих объявлений произошло значительное увеличение бюджетов полиции, особенно полиции и участков национальной гвардии на Глубоком Юге и в Черном поясе Америки. Эти усилия привели к заметному увеличению присутствия полиции в черных кварталах городов и сельских районах Юга, причем даже войска национальной гвардии формируют патрули в таких районах, как Талса, Оклахома. Помня о восстановлении порядка, полицейские управления увеличивают количество арестов за нарушение законов Джима Кроу и штрафуют афроамериканцев по обвинению в «вызове беспорядков в позднее время» даже для тех, кто просто выходит из дома после 5 часов вечера. Даже смертная казнь все чаще применялась в тюрьмах штата против заключенных, которые уже находились в заключении в течение многих лет до принятия новых законов о борьбе с преступностью." # Security Minister Thompson has announced a new struggle against "the criminal population" of America and those who have reasonable suspicion to commit crimes in the future due to "ancestral ties to crime and degeneracy". Following these announcements, there was a significant increase in policing budgets, particularly for police and national guard stations in the Deep South and Black Belt of America. These efforts have led to a noticeable increase in the police presence in Black neighborhoods in cities and the rural parts of the South, with even national guard troops forming patrols in areas such as Tulsa, Oklahoma. With the restoration of order in mind, police departments have been increasing arrests for breaking Jim Crow laws and fining African-Americans with charges of "causing a commotion at late times" even for those simply walking out past 5 P.M. Even the death penalty has been increasingly used in state’s prisons against prisoners who have already been imprisoned for years before the new crime fighting bills.
 newamerica.22.a: "Наконец-то Белый человек может спать спокойно!" # Finally, the White man can sleep peacefully!
 newamerica.23.t: "Закон об образовании чернокожих" # Black Education Act
 newamerica.23.d: "Волна изменений в государственном образовании, осуществленная Симмонсом с целью укрепить христианскую идентичность среди молодежи Америки, почти завершена. Его последним актом, принятым единогласно делегатами, стал Закон об образовании чернокожих. Закон об образовании чернокожих полностью пересматривает практику образования для общин этнических меньшинств и, в частности, афроамериканцев. В частности, он делает незаконным преподавание образования афроамериканцам, оторвавшимся от своей роли рабочих, отдаляет их от старых представлений о религиозном единстве между расами и сокращает и без того незначительные государственные расходы на школы для чернокожих. В своей речи, анонсирующей закон, Симмонс заявил: «В англосаксонском сообществе нет места неграм выше уровня рабочего». Какой смысл учить негритянских детей математике, если они не могут применять ее на практике?»." # The wave of public education changes implemented by Simmons in order to solidify Christian Identity into the youth of America is nearly complete. His final act, which passed with unanimous approval by the delegates, is the Black Education Act. The Black Education Act totally redefines education practices for ethnic minority communities and, in particular, African-Americans. Notably it makes it illegal to teach education to African-Americans divorced from their role as laborers, distances them from older notions of religious unity across races and slashes already minor public spending on Black Schools. As part of his speech announcing the law, Simmons stated, 'There is no place for the Negro in the Anglo Saxon community above the level of laborer. What is the use of teaching the Negro child mathematics, when it cannot use it in practice?'.
 newamerica.23.a: "Это к лучшему" # It's for the best
 newamerica.24.t: "Законы о пропусках" # The Pass Laws
 newamerica.24.d: "Новое правительство начало выдавать сберегательные книжки афроамериканцам по всему Содружеству в ожидании вступления в силу Закона о пропусках в следующем году. Этот закон аналогичен старому внутреннему паспорту, который использовался во времена Конфедерации для идентификации свободных и рабов. Это привело к тому, что многочисленным афроамериканцам было запрещено выезжать за пределы юга с планами расширить зонирование на остальную часть Республики, чтобы усилить сегрегацию, - политика, соответствующая ярому противодействию [Root.GetLeader] расовому смешению в большинстве форм." # The new government has begun issuing a passbook to African-Americans throughout the Commonwealth in anticipation of the Pass Laws taking effect next year. This law is similar to older internal passport used during the time of the Confederacy to identify freemen and slaves. This has resulted in numerous African-Americans being forbidden from traveling outside of the south with plans to extend zoning into the rest of the Republic in order to intensify segregation, a policy in-line with [Root.GetLeader]'s fervent opposition to race-mixing in most forms.
 newamerica.24.a: "Документы, пожалуйста." # Papers Please.
 newamerica.25.t: "Третья Великая Миграция" # The Third Great Migration
 newamerica.25.d: "К тысячам афроамериканцев, покинувшим Америку до гражданской войны, присоединились еще сотни тысяч, спасающихся от террора Белой лиги. Такие группы, как Международная защита труда и NAACP, теперь работают вместе с Красным Крестом, чтобы эвакуировать массы людей, борющихся за то, чтобы остаться свободными. Для Лиги защиты белых и их лидеров это играет на фоне давнего страха перед единым фронтом против их правления. В то же время, чем меньше диссидентов внутри страны, тем спокойнее могут спать лоялисты." # Those thousands of African-Americans that left America before the civil war are being joined by hundreds of thousands more fleeing White Leaguer terror. Groups like the International Labor Defense and the NAACP are now working together with the Red Cross to evacuate masses of people struggling to remain free. To the White Defense Leagues and their leaders, this plays into a long-standing fear of a united front against their rule. At the same time, the fewer the dissidents internally, the safer loyalists can sleep.
 newamerica.25.a: "Америка выводит токсины." # America is expelling toxins.
 newamerica.26.t: "Прибытие американских беженцев" # American Refugees Arrive
 newamerica.26.d.can: "Огромное количество американцев, многие из которых афроамериканцы, бежали сюда, на Север, спасаясь от людей Симмона. Мы официально приветствовали их как канадцев, и многие из них хотят поселиться в нашей стране." # A vast number of Americans, many of them African-Americans have fled across here in the North fleeing Simmon's men. We have officially welcomed them as Canadians and many of them want to settle in our country.
 newamerica.26.d.usa: "Огромное количество американцев, многие из которых афроамериканцы, бежали на юг, спасаясь от головорезов Симмонса. Мы официально приветствовали их как истинных американцев, и многие из них готовы сражаться против Симмонса." # A vast number of Americans, many of them African-Americans have fled into the south fleeing Simmons's goons. We have officially welcomed them as true Americans and more then a few are ready and willing to fight against Simmons.
 newamerica.26.d.nee: "Огромное количество американцев, многие из которых афроамериканцы, бежали в Новую Англию, спасаясь от головорезов Симмонса. Мы официально приветствовали их как истинных американцев, и многие из них готовы сражаться против Симмонса." # A vast number of Americans, many of them African-Americans have fled into New England fleeing Simmons's goons. We have officially welcomed them as true Americans and more then a few are ready and willing to fight against Simmons.
 newamerica.26.d.lib: "Тысячи людей, прибывших вместе с Маркусом Гарви в начале 1930-х годов, ожидали, что прибудет еще больше беженцев. Даже самый сильный пессимист не мог предвидеть наплыв беженцев, которых «Блэк Стар Лайн» подобрала и высадила в Монровии. Семьи воссоединяются, и Зерновой Берег теперь наполняется тысячами новых либерийцев Америки. Однако те, кто больше озабочен производством продуктов питания, отмечают, что в настоящее время мы не можем справиться с растущим населением." # The thousands that arrived with Marcus Garvey in the early 1930s anticipated that more refugees would come. Even the strongest pessimist could not anticipate the overflow of refugees the Black Star Line has picked up and dropped off in Monrovia. Families are reunited, and the Grain Coast now swells with thousands more Americo Liberians. Those more concerned with food production however have noted that we can't really handle a growing population at this time.
 newamerica.26.d.mex: "Центральное правительство обычно игнорировало существование американских беженцев в Мексике, поскольку в прошлом у нас были дружеские отношения с Америкой. Однако этот Симмонс представляет угрозу для всего континента, и еще тысячи беженцев, пересекающих Рио-Гранде, рассказывают об ужасах Серебряного Легиона. Эти беженцы сильно отличаются от тех, кто хочет уйти на пенсию Эмброуза Бирса, они изранены и полны решимости положить конец легионерскому режиму Америки." # The existence of American refugees in Mexico has generally been ignored by the Central Government, as we have had amicable relations with America in the past. However, this Simmons is a threat to the entire continent, and the thousands more refugees crossing the Rio Grande tell of the Silver Legion's horrors. These refugees are far different from the Ambrose Bierce's' looking to retire, they are scarred and determined to end the Legionary regime of America.
 newamerica.26.d.cub: "Всего лишь 300-мильная прогулка на лодке отделяла тысячи американских беженцев от Кубы. Семьи на Кубе месяцами звонили своим семьям, чтобы избежать вполне реальной угрозы националистического переворота. Никто из них не ожидал, что узкое место во Флориде откроется сразу, в результате чего сегодня в Варадеро появятся сотни лодок. Поток беженцев из Америки забил наши порты, заблокировал стационарные линии связи и затруднил правительственное министерство реагирования. Каким должен быть наш ответ?" # Just a 300 mile boat trip separated the thousands of American refugees from Cuba. Families in Cuba have been calling for months to their families to escape the very real threat of a nationalist takeover. None of them anticipated that the bottleneck in Florida would be opened all at once, causing hundreds of boats to show up at Varadero today. The flood of refugees from America has clogged up our ports, tied up or landlines, and put strain on the government ministry to respond. What should be our answer?
 newamerica.26.d.hai: "Гаити всегда позиционировала себя как второй дом для афроамериканцев. Распространенной историей было то, что первым гаитянином был беженец из Эфиопии, который бежал с такой силой, что остановился только тогда, когда упал на Гаити. Теперь мы видим, как это снова выходит из США. Зловещий Симмонс не должен иметь права поступать так с американским народом! Мы чувствуем возмущение беженцев, в то же время мы пытаемся определить, сможет ли наша хрупкая экономика справиться с избытком рабочей силы такого масштаба." # Haiti has always portrayed themselves as the second home for African-Americans. A common story to tell was that the first Haitian was a refugee of Ethiopia that ran with such force that he only stopped when he fell into Haiti. Now we see this again coming out of the USA. The sinister Simmons should not have the right to do this to American people! We feel the refugees outrage, at the same time we struggle to determine whether our fragile economy can handle a labor surplus of this magnitude.
 newamerica.26.a: "Добро пожаловать, чтобы остаться" # You are welcome to stay
 newamerica.27.t: "«Другие меньшинства»" # The \"Other Minories\"
 newamerica.27.d: "На заседании между высокопоставленными членами АНП и Американской партии чистоты обсуждались несколько новых политических мер, которые могут изменить жизнь других непризнанных небелых граждан, таких как оставшиеся индейцы и выходцы из Азии. В случае коренных американцев; некоторые члены партии предложили конфисковать их собственность и переместить ее в какие-то деревни подальше от городских округов страны.\n\nВ то время как в случае людей азиатской национальности некоторые предлагали депортировать их обратно в Азию; такие как Китай и Япония, где они больше не смогут нанести вред американскому обществу. Однако в партии есть и другие радикальные члены, которые выступают за то, чтобы людей с коренным индийским и азиатским происхождением содержали в трудовых лагерях; где они могут работать на государство в обмен на некоторые основные товары." # A session between the senior members of the APP or the American Purity Party have discussed a couple of new policies that may change the lives other undeemed non-white citizens such as the remaining Indians and with Asian-descent. In the case of native Americans; some within the party have proposed to seize their properties and relocate them in some sort of villages away from the urban districts of the country.\n\nWhile in the case of the people with Asian ethnicity, some proposed to deport them back to Asia; such as China and Japan where they can be do no more damage in the American society. However, there are other radical members within the party that advocates that people with native Indian and Asian decent should be contained within a labour camp; where they can work for the state in exchange for some basic goods.
 newamerica.27.a: "Мы продолжим более умеренный подход." # We'll proceed with the more moderate approach.
 newamerica.27.b: "Бесплатная рабочая сила – это хорошо, правда?" # Free labour is good right?
 newamerica.28.t: "Вопрос о приложении" # The APP Question
 newamerica.28.d: "Американская партия чистоты — это организация сторонников превосходства белой расы, выступающая за очищение американского государства; изгнание тех, кого считают нежелательными, из городов и земель Америки. Хотя они не враждебны нашему собственному правительству, это не может означать, что они не могут представлять угрозу нашей власти в ближайшем будущем. Они вербуют людей в свою военизированную организацию; в надежде устранить своих неугодных неугодных. Правительство поставило на этот вопрос; и решили..." # The American Purity Party is a white-supremacist organization that advocates for the purification of the American state; expelling the deemed undesirables from the cities and lands of America. While they are not hostile to our own government, this can not mean that they cannot be a threat to our power in the near future. They are recruiting for their own paramilitary organization; in hopes of eliminating their undeemed undesirables. The government has conveyed to this question; and have decided to...
 newamerica.28.a: "...забанить тогда и арестовать их лидеров" # ...ban then and arrest their leaders
 newamerica.28.b: "...пусть они будут" # ...let them be

 newamerica.100.t: "[BPS.GetName] Вступление в Соглашение" # [BPS.GetName] Entry to the Accord
 newamerica.100.d: "Правительство [NAR.GetAdjective] обратилось к нам сегодня с предложением заключить официальный союз между нашими двумя странами; в надежде сокрушить коммунистическую угрозу в регионе, в конце концов, мы находимся в стратегическом продвижении в победе над марксистами." # The [NAR.GetAdjective] Government have approached us today, proposing a formal alliance between our two nations; in hopes of crushing the communist threat in the region, after all, we are in a strategic advanNAR_rust_belte in defeating the marxists.
 newamerica.100.a: "Конечно, мы принимаем" # Of course we accept
 newamerica.100.b: "Мы не заинтересованы" # We are not interested
 newamerica.101.t: "[From.GetName] принимает" # [From.GetName] Accepts
 newamerica.101.d: "Правительство [From.GetAdjective] увидело мудрость в нашем предложении и приняло наше приглашение к официальному союзу; и вместе мы победим коммунистическую угрозу." # The [From.GetAdjective] Government have seen the wisdom in our proposal, and have accepted our invitation of a formal alliance; and together we shall defeat the communist menace.
 newamerica.101.a: "Хороший." # Good.
 newamerica.102.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 newamerica.102.d: "Правительство [From.GetAdjective] упрямо, как мы и ожидали, оно отклонило наше приглашение заключить союз в борьбе с коммунистической угрозой." # The [From.GetAdjective] Government is stubborn as we have anticipated, they have refused our invitation for an alliance in defeating the communist menace.
 newamerica.102.a: "На войну!" # To War!
 newamerica.102.b: "Они развалятся в одиночку." # They will crumble alone.
 newamerica.103.t: "[NAR.GetName] Вход в [This.GetFactionName]" # [NAR.GetName] Entry to the [This.GetFactionName]
 newamerica.103.d: "Делегация [NAR.GetAdjective] прибыла сюда, в [Root.Capital.GetName], чтобы обсудить вхождение [NAR.GetName] в [Root.GetFaction]. Правительство [NAR.GetAdjective] стремится установить с нами официальный союз. Должны ли мы принять их предложение?" # An [NAR.GetAdjective] delegation have arrived here in [Root.Capital.GetName] to discuss the entry of the [NAR.GetName] in the [Root.GetFaction]. The [NAR.GetAdjective] Government is seeking to establish a formal alliance with us. Should we accept their offer?
 newamerica.103.a: "Мы были бы дураками, если бы не приняли" # We'd be fools not to accept
 newamerica.103.b: "Они нам не нужны..." # We don't need them...
 newamerica.104.t: "[From.GetFaction] Вход запрещен" # [From.GetFaction] Entry Denied
 newamerica.104.d: "Правительство [From.GetAdjective] отклонило наше предложение об официальном союзе с ними. Возможно, нам придется поискать в другом месте." # The [From.GetAdjective] Government have refused our offer of our formal alliance with them. We may have to look elsewhere.
 newamerica.104.a: "Трагедия, конечно, иначе возможность..." # A tragedy to be sure, otherwise an opportunity...
 newamerica.105.t: "Поддержка стороны" # Supporting a Side
 newamerica.105.d: "С момента падения династии Цин Китай находился в состоянии хаоса и анархии. Существует множество конкурирующих правительств, которые претендуют на законное правительство китайской нации.\n\nСуществуют так называемые «демократические» силы под руководством Гоминьдана, основанные Сунь Ятом Сеном и в настоящее время возглавляемые [KMT.GetLeader]; затем есть правительство Бэйян, которое победило Гоминьдан в их «Северной экспедиции», но проиграло правительству Фэнтянь в Маньчжурии, которое в настоящее время возглавляет [MAN.GetLeader]." # Ever since the collapse of the Qing dynasty, China have been quite under chaos and anarchy. There are multiple competing governments that claims the legitimate government of the Chinese nation.\n\nThere is the so called, \"Democratic\" forces under the Kuomintang, founded by Sun Yat Sen and currently lead by [KMT.GetLeader]; then there is the Beiyang Government that have defeated the Kuomintang in their \"Northern Expedition\" but have lost to the Fengtian Government in Manchuria currently lead by [MAN.GetLeader].
 newamerica.105.a: "@Гоминьдан Правительство Гоминьдана" # @KMT Kuomintang Government
 newamerica.105.b: "@ZHI Правительство Бэйяна" # @ZHI Beiyang Government
 newamerica.105.c: "@MAN Правительство Фэнтяня" # @MAN Fengtian Government
 newamerica.106.t: "[NAR.GetAdjective] Поддержка" # [NAR.GetAdjective] Support
 newamerica.106.d: "Новое правительство [NAR.GetAdjective] в Вашингтоне выбрало нас как законное правительство Китая и, таким образом, поддерживает нас в военном, материальном и финансовом отношении в победе над другими полевыми командирами." # The new [NAR.GetAdjective] Government in Washington have chosen us, as the legitimate government in China, and thus they are supporting us militarily, materially, and financially in defeating the other warlords.
 newamerica.106.a: "Большой!" # Great!
 newamerica.107.t: "Вашингтон запрашивает [PHI.GetAdjective] вход в [FRA.GetFaction]" # Washington Requests [PHI.GetAdjective] Entry to the [FRA.GetFaction]
 newamerica.107.d: "Делегаты из Вашингтона просят нас также пригласить правительство [PHI.GetAdjective] в [Root.GetFaction]. Это может быть advanNAR_rust_belte, поскольку расположение [PHI.GetNameDef] является стратегически выгодным." # The delegates from Washington are requesting that we also invite the [PHI.GetAdjective] Government in the [Root.GetFaction]. This may can be an advanNAR_rust_belte as the location of [PHI.GetNameDef] is strategically viable.
 newamerica.107.a: "Отправьте приглашение" # Send out the invite
 newamerica.107.b: "Они нам не нужны" # We don't need them
 newamerica.108.t: "[FRA.GetName] приглашает нас на [FRA.GetFaction]" # [FRA.GetName] Invites us to [FRA.GetFaction]
 newamerica.108.d: "В ответ на просьбу [NAR.GetAdjective] пригласить нас в свою фракцию; [FRA.GetAdjective] официально рассылает нам приглашение присоединиться к их альянсу. Должны ли мы принять?" # In response to the [NAR.GetAdjective] request of inviting us into their faction; the [FRA.GetAdjective] is formally sending out the invite in order for us to join their alliance. Should we accept?
 newamerica.108.a: "Конечно, мы принимаем" # Of course we accept
 newamerica.108.b: "У нас на уме другие планы" # We have other plans in mind
 newamerica.109.t: "[From.GetName] соглашается присоединиться к [FRA.GetFaction]" # [From.GetName] Accepts to Join [FRA.GetFaction]
 newamerica.109.d: "Правительство [From.GetAdjective] приняло приглашение и официально присоединилось к нашему альянсу." # The [From.GetAdjective] Government have accepted the invitation and have formally joined our alliance.
 newamerica.109.a: "Вместе мы сила!" # Together we are strong!
 newamerica.110.t: "[From.GetName] отказывается присоединиться к [FRA.GetFaction]" # [From.GetName] Refuses to Join [FRA.GetFaction]
 newamerica.110.d: "Правительство [From.GetAdjective] отклонило приглашение официально присоединиться к нашему альянсу." # The [From.GetAdjective] Government have refused the invitation to formally join our alliance.
 newamerica.110.a: "Разочарование..." # Dissapointing...
 newamerica.111.t: "[FRA.GetAdjective] отказывается пригласить [PHI.GetName]" # The [FRA.GetAdjective] Refuses to Invite [PHI.GetName]
 newamerica.111.d: "Правительство [FRA.GetAdjective] категорически отклонило наше требование о приглашении [PHI.GetNameDef] в альянс. Однако это не конец света, поскольку мы можем в отместку выйти из альянса или просто принять их решение и оставить [PHI.GetNameDef] позади." # The [FRA.GetAdjective] Government have outright refused our demand in inviting [PHI.GetNameDef] into the alliance. It is not the end of the world however, as we can leave the alliance in retaliation or just accept their decision and leave [PHI.GetNameDef] behind.
 newamerica.111.a: "Пригрозите им, что мы выйдем из фракции" # Threten them that we will leave the faction
 newamerica.111.b: "Возможно, им придется встать на ноги" # They may need to stand up on their own feet
 newamerica.112.t: "Вашингтон угрожает уйти" # Washington Threatens to Leave
 newamerica.112.d: "Правительство [From.GetAdjective] проявило свое высокомерие и пригрозило нам выйти из альянса. Если [From.GetAdjective] покинут альянс, они могут стать нашими будущими врагами; но мы уступим их требованиям; нас могут втянуть в бессмысленную войну." # The [From.GetAdjective] Government, have shown their arrogance and have threathened us to leave the alliance. If the [From.GetAdjective] leave the alliance, they may be our future enemy; but we will cave in into their demands; we may be dragged onto a pointless war.
 newamerica.112.a: "Примите их требования; они слишком ценны." # Accept their demands; they are too valuable.
 newamerica.112.b: "Ну и что?" # So what?
 newamerica.113.t: "[FRA.GetName] уступает нашим требованиям" # [FRA.GetName] Caves into our Demands
 newamerica.113.d: "Правительство [FRA.GetAdjective], каким бы упрямым оно ни было, наконец-то уступило нашим требованиям, пригласив [PHI.GetName] в наш альянс." # The [FRA.GetAdjective] Government, stubborn as they were, have finally caved in into our demands, inviting [PHI.GetName] into our alliance.
 newamerica.113.a: "Большой!" # Great!
 newamerica.114.t: "[FRA.GetAdjective] упрям" # The [FRA.GetAdjective] is Stubborn
 newamerica.114.d: "Упрямство [FRA.GetAdjective] и их прямой отказ пригласить [PHI.GetName] во фракцию — это последний аргумент в пользу того, что Тедди Рузвельт прав; нам нужно найти лучших друзей в Европе." # The stubborness of the [FRA.GetAdjective] and their outright refusal to invite [PHI.GetName] into the faction is the final call that Teddy Roosevelt is right; we need to find better friends in Europe.
 newamerica.114.a: "Стыд." # Shame.

