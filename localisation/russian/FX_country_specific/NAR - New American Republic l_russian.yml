### Ideas
 NAR_racial_issue: "Расовая проблема" # The Racial Issue
 NAR_racial_issue_desc: "Лидеры этой страны имеют предвзятое отношение к своей расе; и поскольку они управляют этой страной без каких-либо последствий своих действий; многие меньшинства угнетаются и бегут в другие прогрессивные страны.\n\n§WПрирост политической власти:§! [?minority_pp|%+2]\n§WСтабильность:§! [?minority_stability|%+2]\n§WКоэффициент рекрутируемого населения:§! [?minority_conscription|%+2]\n§WСкорость строительства:§! [?minority_construction|%+2]" # Leaders of this nation have a bias on their own race; and since they run this nation with no consequences of their actions; many minorities are oppressed and fleeing to other progressive nations.\n\n§WPolitical Power Gain:§! [?minority_pp|%+2]\n§WStability:§! [?minority_stability|%+2]\n§WRecruitable Population Factor:§! [?minority_conscription|%+2]\n§WConstruction Speed:§! [?minority_construction|%+2]
 NAR_economic_downtrum: "Экономический спад" # Economic Downtrum
 NAR_economic_downtrum_desc: "Недавний крах бывших Соединенных Штатов вызвал хаос среди многих иностранных и отечественных инвесторов, выведя их инвестиции из экономики; и, таким образом, привело к экономическому спаду." # The recent collapse of the former United States have caused chaos among many foreign and domestic investors, pulling out their investments from the economy; and thus resulted in an economic recession.
 NAR_economic_downtrum_1: "Экономический спад" # Economic Downtrum
 NAR_economic_downtrum_1_desc: "Недавний крах бывших Соединенных Штатов вызвал хаос среди многих иностранных и отечественных инвесторов, выведя их инвестиции из экономики; и, таким образом, привело к экономическому спаду." # The recent collapse of the former United States have caused chaos among many foreign and domestic investors, pulling out their investments from the economy; and thus resulted in an economic recession.
 NAR_economic_downtrum_2: "Экономический спад" # Economic Downtrum
 NAR_economic_downtrum_2_desc: "Недавний крах бывших Соединенных Штатов вызвал хаос среди многих иностранных и отечественных инвесторов, выведя их инвестиции из экономики; и, таким образом, привело к экономическому спаду." # The recent collapse of the former United States have caused chaos among many foreign and domestic investors, pulling out their investments from the economy; and thus resulted in an economic recession.
 NAR_economic_downtrum_3: "Экономический спад" # Economic Downtrum
 NAR_economic_downtrum_3_desc: "Недавний крах бывших Соединенных Штатов вызвал хаос среди многих иностранных и отечественных инвесторов, выведя их инвестиции из экономики; и, таким образом, привело к экономическому спаду." # The recent collapse of the former United States have caused chaos among many foreign and domestic investors, pulling out their investments from the economy; and thus resulted in an economic recession.
 NAR_recovering_from_recession: "Восстановление после рецессии" # Recovering from Recession
 NAR_unstable_bureaucracy: "Нестабильная бюрократия" # Unstable Bureaucracy
 NAR_unstable_bureaucracy_desc: "Нынешнее правительство напрямую управляется корпорациями, захватившими контроль после распада Союза. Это интересы капиталистов в том, как управлять этим государством." # The current government is directly managed by corporations that seized control when the Union has collapsed. It is the capitalists' interests on what runs this state.
 NAR_illegitimate_government: "Нелегитимное правительство" # Illegitimate Government
 NAR_illegitimate_government_desc: "Поскольку мы вышли из Союза и образовали собственную нацию; многие страны не признали нашу независимость и поэтому до сих пор считаются отколовшимся государством бывших Соединенных Штатов." # Since we have ceded from the Union and form our own nation; many countries have not recognized our independence, and as such still treated as a breakaway state of the former United States.
