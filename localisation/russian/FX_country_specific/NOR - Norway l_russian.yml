#### Ideas ####

 NOR_socialism_surrounded_idea: "Социализм в окружении" # Socialism Surrounded
 NOR_socialism_surrounded_idea_desc: "Мы, Республика Норвегия, управляем социалистическим правительством, окруженным консервативными и националистическими режимами. На западе нашими морями управляет Британская империя. На юге датчане ждут нападения и передачи трона бывшему королю. На востоке шведы видят шанс вновь собрать союз, но под их руководством. А на севере белофинны восстают против Советского Союза. Нам нужно проповедовать единство и защиту в то время, когда мы действительно окружены странами, желающими нашей смерти." # We, the Republic of Norway are ruled by a socialist government, surrounded by conservative and nationalist regimes. To the west, the British Empire rules our seas. In the south, the Danes are waiting to attack and give the throne to the former king. In the east, the Swedes see a chance to reassemble the union, but with them leading it all. And in the north, the White Finns are rebelling against the Soviet Union. We need to preach unity and defence in a time where we truly are surrounded by countries wanting us dead.
 NOR_monarchist_right_idea: "Монархические правые" # The Monarchist Right
 NOR_monarchist_right_idea_desc: "После отмены монархии в 1926 году либералы и консерваторы были основными сторонниками промонархического выбора. Это было продемонстрировано, когда президент Хамбро разрешил провести бракосочетание наследного принца Олафа и шведской принцессы Марты в столице Осло. Хотя буржуазные партии сыграли на конституционной реформе 1926 года, они не боятся демонстрировать свои монархические позиции. Многие лидеры AP хотят, чтобы промонархические действия были объявлены вне закона и приговорены к тюремному заключению, чтобы подавить этот шаг!" # Since the abolition of the monarchy in 1926, the liberals and conservatives have been the main supporters for pro-monarchist choices. This was shown when president Hambro allowed the marriage between the crown prince, Olav, and the Swedish princess, Märtha, to take place in the capital of Oslo. While the bourgeois parties have played by the 1926 constitutional reform, they are not scared of showing their monarchist positions. Many leaders in AP want pro-monarchist actions outlawed and be sentenced to prison, to crush this move!
 NOR_monarchist_right_idea1: "Монархические правые" # The Monarchist Right
 NOR_war_on_samfundsvernet_idea: "Война с социальным обеспечением" # War on Samfundsvernet
 NOR_war_on_samfundsvernet_idea_desc: "Samfundsvernet был создан буржуазией как оружие против рабочего класса в 1923 году. С тех пор ситуация не изменилась. В канун Нового 1931 года их объявили вне закона, но они ушли в подполье. Возглавляемые офицерами НС, они представляют большую опасность для страны и за последние пять лет неоднократно пытались развязать в стране гражданскую войну. Они по-прежнему представляют угрозу для народа и государства, и с ними следует бороться, чтобы предотвратить гражданскую войну или переворот!" # Samfundsvernet was created by the bourgeoisie as a weapon against the working class in 1923. This hasn’t changed since then. They were outlawed on New Year's eve of 1931, but they have gone underground. Lead by NS officers, they are a great danger to the country and have many times tried to start a civil war in the country in the last five years. They are still a threat to the people and the state, and should be dealt with to prevent a civil war or a coup!
 NOR_war_on_samfundsvernet_idea1: "Война с социальным обеспечением" # War on Samfundsvernet
 NOR_samfundsvernets_rule_idea: "Самфундсвернет правит Норвегией" # Samfundsvernet is Ruling Norway
 NOR_military_deserters_idea: "Военные дезертиры" # Military Deserters
 NOR_military_deserters_idea_desc: "Многие солдаты дезертировали из армии в знак протеста против недемократического выбора, сделанного правительством." # Many soldiers have deserted the military in opposition to the undemocratic choice the government made.
 NOR_naval_deserters_idea: "Военно-морские дезертиры" # Naval Deserters
