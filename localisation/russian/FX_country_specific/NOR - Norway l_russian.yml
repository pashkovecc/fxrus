#### Focus Tree ####

 NOR_space_for_economic_projects: "Пространство экономических проектов" # Space for Economic Projects
 NOR_space_for_economic_projects_desc: "Хотя Норвегия не является страной с большим количеством земель для промышленности, есть районы, где мы можем достичь этого, приложив немного усилий. Чтобы поддержать будущее развитие норвежской промышленности и производство новых потребительских товаров, нам необходимо освободить место для новых расширений." # While Norway isn't a country filled with a lot of land for industry, there is areas where we can get there by a bit of work. To sustain the future development of Norwegian industry and production of new consumer goods, we need to clear out space for new expantions.
 NOR_utilize_merchant_fleet: "Используйте торговый флот" # Utilize the Merchant Fleet
 NOR_utilize_merchant_fleet_desc: "Под норвежским флагом ходят сотни торговых судов. Нам следует создать администрацию для управления этим флотом. И для того, чтобы использовать их для экономических и военных целей, а также для того, чтобы иметь некоторое представление о том, сколько кораблей у нас есть. Назовем эту администрацию «Нортрашип»." # There are hundreds of merchant vessels that sails under the Norwegian flag. We should establish an administration to administrate this fleet. Both to utilize them for economic and military goals, as well as having some sense of how many ships we have available. Let's call this administration 'Nortraship'.
 NOR_support_fishing_industry: "Поддержите рыбную отрасль" # Support the Fishing Industry
 NOR_support_fishing_industry_desc: "Норвежское побережье само по себе обладает потенциалом для промышленности. Уже сейчас многие рыбаки путешествуют по океану, чтобы зарабатывать на жизнь ловлей лосося и трески. С ростом внутреннего и международного спроса мы должны поддержать наших рыбаков и строительство рыбных «ферм» вдоль побережья." # The Norwegian coastline is itself filled with potential for industry. Already, there are many fishers who cruise the ocean to fish salmon and cod for a living. With the rise in domestic and international demands, we should support our fishers and the construction of fish 'farms' along the coast.
 NOR_hydro_power_expantion: "Расширение гидроэнергетики" # Hydro Power Expantion
 NOR_hydro_power_expantion_desc: "С начала века мы создали множество новых отраслей промышленности. Однако эти отрасли остро нуждаются в дешевой и надежной электроэнергии. К счастью, Норвегия наделена природой, идеально подходящей для строительства гидроэлектростанций. Они обеспечат как промышленность, так и население необходимой им электроэнергией." # Since the turn of the century, we have developed many new industries. However, these industries are in urgent need of cheap, reliable power. Luckily, Norway is blessed with a nature perfect to build hydro power plants. These will provide both industry and our people with the electricity they need.
 NOR_western_power_plants: "Западные электростанции" # Western Power Plants
 NOR_western_power_plants_desc: "Лучшие места для расширения гидроэнергетики, несомненно, находятся в западной Норвегии. Мы уже построили здесь гидроэлектростанции, чтобы обеспечить электричеством такие города, как Олесунн и Молде. Однако здесь есть больше городов и поселков, которые можно обеспечить электроэнергией, а также еще больший промышленный потенциал." # The best places for hydro power expantion, is undeniably found in western Norway. Already, we have built hydro power plants here to provide cities like Ålesund and Molde with electricity. However, there are more cities and towns here to provide power to, as well as an even bigger industrial potential.
 NOR_norwegian_aluminium: "Норвежский Алиминиум" # Norwegian Aliminium
 NOR_norwegian_aluminium_desc: "Норвегия имеет много природных ресурсов. Один из них – алюминиевый. До нас дошли сведения о потенциальных запасах алюминия в горных частях нашей страны. Благодаря недавнему строительству гидроэлектростанций у нас есть электричество, необходимое для использования этого потенциала." # Norway has many natural resources. One of them is aluminium. We have gotten words about potential aluminium reserves in the mountainous parts of our country. With the recent constructions of hydro power plants, we have the electricity needed to exploit this potential.
 NOR_our_trade_partners: "Наши торговые партнеры" # Our Trade Partners
 NOR_our_trade_partners_desc: ""
 NOR_norwegian_fish_n_chips: "Норвежская рыба и чипсы" # Norwegian Fish n' Chips
 NOR_norwegian_fish_n_chips_desc: "Хотя торговые отношения, связанные с Британией, привели к краху, теперь, когда наступили лучшие времена, британцы кажутся сильнее, чем когда-либо. Поэтому следует ли реформировать торговлю с империей." # While trade relations connected to the British created the crash, now when better times have come, the British seems to be stronger than ever. Therefore, should we reformalize trade with the empire.
 NOR_pomor_trade_reborn: "Поморская торговля возрождается" # The Pomor Trade Reborn
 NOR_pomor_trade_reborn_desc: "Советский Союз развился от капитализма. Некоторые из нас считают, что на нас повлияла темная сторона капитализма. Поэтому нам следует попытаться прекратить торговлю с капиталистическими странами и сосредоточиться на торговле с Советами." # The Soviet Union has developed themselves away from capitalism. Some of us believe that it was the dark side of capitalism that affected us. Therefore, we should try to cease trade with capitalist countries, and focus on trade with the Soviets.
 NOR_provide_resources_germany: "Предоставлять ресурсы Германии" # Provide Resources to Germany
 NOR_provide_resources_germany_desc: "Немцы разработали новую экономическую систему. В котором мы должны принять участие. Германия – это страна с амбициями, которая нуждается в большом количестве природных ресурсов. Как земля, обладающая многими природными ресурсами, мы можем торговать ими с немцами." # The Germans have developed themselves into a new economy system. One we should take a part in. Germany is a land with ambitions that need many natural resources. As a land with many natural resources, we can trade them with the Germans.
 NOR_expand_railway_infrastructure: "Расширить железнодорожную инфраструктуру" # Expand Railway Infrastructure
 NOR_expand_railway_infrastructure_desc: "Железнодорожная система западной Норвегии бедна, и многие места не видели чуда современного транспорта. Мы построим туннели и мосты и свяжем этот регион ближе со страной." # The railway system of western Norway is poor, and many places have not seen the wonder of modern transportation. We shall build tunnels and bridges, and bind this region closer to the country.
 NOR_rural_electrification: "Сельская электрификация" # Rural Electrification
 NOR_rural_electrification_desc: "Более 600 000 человек в Норвегии не имеют доступа к электричеству. В наши дни, когда электричество становится все более важным в повседневной жизни и на рабочих местах, этого уже не может быть. Нам необходимо обеспечить, чтобы как можно больше людей были связаны с электроэнергетикой и судьбами современной эпохи." # Over 600 000 people in Norway doesn't have access to electricity. Nowadays, when electricity becomes more and more important in everyday lives and on the workplaces, this can not stand. We need to ensure that as many as possible are connected with electric power and with the fortunes of the modern age.
 NOR_expand_steel_industries: "Развернуть Норск Йернверк" # Expand Norsk Jernverk
 NOR_expand_steel_industries_desc: "Железо и сталь — это также ресурс, который мы можем найти в нашей стране. В наших северных графствах мы также обнаружили потенциальные возможности для новых железных рудников. Это может помочь нашей стране стать менее зависимой от импорта стали." # Iron and Steel is also a resource we have the potential of finding in our country. In our northern counties, we have also found potential the for new iron mines. This can help our country to become less dependent on steel imports.
 NOR_expand_university_oslo: "Расширить Университет Осло" # Expand the University of Oslo
 NOR_expand_university_oslo_desc: "Университет Осло – старейший университет Норвегии с самым высоким рейтингом. Мы должны способствовать развитию новых инноваций и исследований, и есть ли лучший способ сделать это, чем расширение нашего любимого университета." # The University of Oslo is the oldest and the highest ranked university in Norway. We should promote the development of new innovations and research, and what better way is there to do this than to expand our dearest university.
 NOR_new_consumer_industries: "Новые потребительские отрасли" # New Consumer Industries
 NOR_new_consumer_industries_desc: ""
 NOR_reaction_to_london_crash: "Реакция на лондонский крах" # Reaction to the London Crash
 NOR_reaction_to_london_crash_desc: "Хотя нам удалось устранить британское влияние из Норвегии, глобальные экономические последствия краха повлияют на нас негативно, поскольку и у нас, и у тех, кто находится в Лондоне, есть много общих торговых партнеров." # While we have managed to remove British influence from Norway, the global economic consequences of the crash will affect us negatively, as both we and those in London have many common trade partners.
 NOR_public_works_program: "Программа общественных работ" # Public Works Program
 NOR_public_works_program_desc: ""
 NOR_complete_northern_railway: "Полный Нордландсбанен" # Complete Nordlandsbanen
 NOR_complete_northern_railway_desc: "Наша северная железная дорога «Нордландсбанен» еще далека от завершения. Хотя людей и товары в нынешнем виде можно доставлять в муниципалитет Гронг, нам следует поработать над тем, чтобы железная дорога прошла от Тронхейма до Будё и даже дальше..." # Our northern railway, 'Nordlandsbanen', is far from finished. While people and goods, as it stands now, can be transported to the Grong municipality, we should work on having a railway go all the way from Trondheim to Bodø, and even further beyond...
 NOR_alleviate_indebted_farmers: "Облегчить задолженность фермеров" # Alleviate Indebted Farmers
 NOR_alleviate_indebted_farmers_desc: "Норвежская экономика зависит от нашей способности экспортировать продукцию. Значительную часть этой экспортной экономики составляют наши фермеры. Из-за экономического кризиса экспорт остановился, а спрос на мясо и молоко иссяк. Нам необходимо поддержать наших фермеров, чтобы они не обанкротились в условиях этого кризиса." # The Norwegian economy is one reliant on our ability to export products. A sizeable part of this export economy, are our farmers. With the economic crisis, exports has halted and the demand for meat and milk has dried up. We need to support our farmers so they doesn't go bankrupt in this crisis.
 NOR_crisis_farm_subsidies: "Кризисные субсидии фермерским хозяйствам" # Crisis Farm Subsidies
 NOR_crisis_farm_subsidies_desc: "Нам следует ввести больше субсидий, чтобы помочь нашим фермерам. Если они упадут, мы рискуем важной частью нашего общества, что повысит вероятность того, что наши люди умрут от голода, если мы не сможем импортировать продукты." # We should enact more subsidies to help out our farmers. If they fall, we risk an important section of our society, making our people more likely to starve if we aren't able to import products.
 NOR_cut_subsidies: "Сократить субсидии" # Cut Subsidies
 NOR_cut_subsidies_desc: "Благодаря поддержке, которую получили наши фермеры, им удастся преодолеть трудности. Вместо того, чтобы увеличивать их субсидии, нам следует временно их сократить. Таким образом, мы избежим, что инфляция убьет нашу экономику." # With the support our farmers have gotten, they will manage to get through their hardship. Instead of increasing their subisidies, we should temporarily cut them back. This way, we will avoid inflation killing our economy.
 NOR_regulate_forclosures: "Регулирование выкупа" # Regulate Forclosures
 NOR_regulate_forclosures_desc: "Последствием кризиса, постигшего наших фермеров, является то, что они не могут погасить свой долг. Нам необходимо должным образом регулировать потерю права выкупа в сельскохозяйственном секторе, чтобы банки не использовали кризис, чтобы ввергнуть наших фермеров в нищету и бездомность." # An effect of the crisis that has befallen our farmers, is that they aren't able to make repayment on their debt. We need to properly regulate forclosure in the farming sector to avoid the banks using the crisis to throw our farmers into poverty and homelessness.
 NOR_cut_military_spending: "Сократить военные расходы" # Cut Military Spending
 NOR_cut_military_spending_desc: "Норвегия не видела войн со времен Наполеона. Хотя мы не можем быть уверены в том, что нас ждет в будущем, мы попытаемся сократить наш военный бюджет для финансирования наших программ помощи. Будем надеяться, что нам удастся восстановить его до того, как какая-либо война обрушится на наши берега." # Norway hasn’t seen any warfare since the Napoleonic era. While we can't be sure what the future will hold, we will try to cut our military budget to fund our relief programs. Hopefully, we will manage to restore it before any war hits our shores.
 NOR_crisis_rationing: "Кризисное нормирование" # Crisis Rationing
 NOR_crisis_rationing_desc: "Нам нужно сократить количество потребляемой пищи. Нам не нужно, чтобы ситуация ухудшалась сейчас, когда она улучшается. Эти пайки также могут научить людей не жаждать слишком многого." # We need to cut back on how much we are consuming. We don't need the situation to get worse, now when it is improving. These rations may also teach the people to not crave too much.
 NOR_towards_recovery: "На пути к восстановлению" # Towards Recovery
 NOR_towards_recovery_desc: ""
 NOR_urban_housing_projects: "Проекты городского жилья" # Urban Housing Projects
 NOR_urban_housing_projects_desc: ""
 NOR_restore_military_funding: "Восстановить военное финансирование" # Restore Military Funding
 NOR_restore_military_funding_desc: ""
 NOR_experience_with_synthetic_rubber: "Опыт работы с синтетическим каучуком" # Experience With Synthetic Rubber
 NOR_experience_with_synthetic_rubber_desc: ""
 NOR_kongsberg_expantion: "Расширение Конгсберга" # Kongsberg Expantion
 NOR_kongsberg_expantion_desc: "Нам необходимо расширить наши возможности по производству оружия. Благодаря новому расширению Kongsberg Våpenfabrikk у нас будет гораздо более сильная военная промышленность." # We need to expand our capacity for producing weapons. With a new expansion to Kongsberg Våpenfabrikk, we will have a much stronger military industry.

 NOR_reform_norwegian_army: "Реформировать норвежскую армию" # Reform the Norwegian Army
 NOR_reform_norwegian_army_desc: "Нам нужно найти новый план относительно нашей армии и ее стратегии. Мы можем сосредоточиться на специализированной армии или на сильной по численности армии." # We need to find a new plan regarding our army and its strategies. We can focus on a specialized army, or one that is strong in numbers.
 NOR_restore_royal_guards: "Восстановить королевскую гвардию" # Restore the Royal Guards
 NOR_restore_royal_guards_desc: "Когда монархия была распущена, Его Величество Королевская гвардия также была расформирована и включена в состав Президентской гвардии. С восстановлением монархии мы сможем восстановить гвардию и дать ей шанс сражаться за Норвегию. Наши враги научатся узнавать «Черных дьяволов» и бояться их." # When the monarchy was disbanded, His Majesty the King's Guard was also disbanded and integrated into the Presidential Guard. With the restoration of the Monarchy, we can restore the Guard and give them a chance to fight for Norway. Our enemies will learn to know and fear the 'Black Devils'.
 NOR_specialized_army: "Специализированная армия" # A Specialized Army
 NOR_specialized_army_desc: "Население Норвегии невелико, и было бы невероятно глупо призывать большую его часть в Вооруженные силы. Вместо этого мы должны преодолеть эти недостатки, сосредоточив внимание на профессиональных, специализированных солдатах и ​​возможностях, предоставляемых нам благодаря использованию хорошего оборудования." # Norway's population is small, and it would be incredibly stupid to draft most of them into the Armed Forces. Instead, we should overcome these shortcomings by focusing on professional, specialized soldiers and the opportunities granted to us through the use of good equipment.
 NOR_establish_special_forces: "Создать спецназ" # Establish Special Forces
 NOR_establish_special_forces_desc: "Хотя многие в нашей армии проходят обычную подготовку, мы должны заботиться о тех, кто может быть обучен на специализированные должности. Не только те, кто может быть хорошими горцами и десантниками, но и элитные солдаты." # While many in our army are going through the ordinary training regime, we should look after those who can be trained into specialized positions. Not only those who can be good mountaineers and paratroopers, but also elite soldiers.
 NOR_strength_in_numbers: "Сила в цифрах" # Strength in Numbers
 NOR_strength_in_numbers_desc: "Население Норвегии может быть относительно небольшим, но ее земля обширна и разнообразна. Если мы сможем защитить его, нам нужно, чтобы в армии служило больше мужчин и женщин. Нам следует продлить срок службы будущих солдат, а также привлечь больше нашего населения в Вооруженные Силы." # Norway's population may be relatively small, but her land is vast and diverse. If we shall be able to protect it, we need to have more men and women serving in the military. We should extend the service time for future soldiers, as well as drafting more of our population to the Armed Forces.
 NOR_modernize_kongsberg_rifles: "Модернизация винтовок Конгсберга" # Modernize Kongsberg Rifles
 NOR_modernize_kongsberg_rifles_desc: "Норвежская армия использует Krag-Jørgensen производства Kongsberg с 1890-х годов. Хотя это хорошая винтовка, ее все еще необходимо улучшать и модернизировать, чтобы она лучше соответствовала используемым сегодня боеприпасам, а также преодолеть недостатки более ранних версий KJ." # The Norwegian army has used the Kongsberg-produced Krag-Jørgensen since the 1890s. While it is a good rifle, it still needs to be improved and modernized to better fit with the ammonitions used today, while also to overcome the shortcomings of earlier versions of K-J.
 NOR_expand_national_service: "Расширить национальную службу" # Expand National Service
 NOR_expand_national_service_desc: "Хотя некоторые генералы говорят, что это решение приведет к снижению организованности, нам нужны все, кого мы можем привлечь, чтобы защитить нашу родину. Расширение нашей национальной службы, привлечение большего количества людей в армию означает, что мы можем мобилизовать более крупные силы, когда нам нужно защитить наши дома." # While some generals say this decision will cause less organization, we need everyone that we can get to defend our homeland. Expanding our national service, getting more people into the army, means we can mobilize a bigger force when we need to protect our homes.
 NOR_winter_mountaineers: "Зимние альпинисты" # Winter Mountaineers
 NOR_winter_mountaineers_desc: "Есть две вещи, которыми Норвегия известна, и которые мы можем использовать против наших врагов. Наши горы и наши лыжи. Нам необходимо готовить и совершенствовать элитные полки лыжников-альпинистов. У нашего населения уже есть одни из лучших лыжников в мире. Было бы обидно ими не воспользоваться." # There are two things Norway are known for that we can use against our enemies. Our mountains and our skis. We need to train and improve elite regiments of ski-going mountaineers. Already, our population have some of the best skiers in the world. It would be a shame to not utilize them.
 NOR_glomma_line: "Линия Гломма" # The Glomma Line
 NOR_glomma_line_desc: "Даже если мы сомневаемся, что война будет вестись с нашими шведскими братьями, мы не должны быть наивными, полагая, что она не может повториться. К счастью для нас, у нас есть леса и реки, которые служат естественной защитой от шведских нападений. Одной из них является река Гломма. Нам следует установить укрепления вдоль реки в качестве превентивной меры против потенциальных нападений." # Even if we doubt that war will be waged with our Swedish brothers, we shouldn't be naïve to believe it can't happen again. Luckily for us, we have forests and rivers that acts as natural defences against Swedish attacks. One of these are the Glomma river. We should establish fortifications along the river as a prevenative measure against potential attacks.
 NOR_utilize_artillary: "Используйте артиллерию" # Utilize Artillary
 NOR_utilize_artillary_desc: "Мы должны заняться улучшением наших пушек и минометов, которые остались стоять после великой войны. Нам нужна артиллерия, которая сможет продемонстрировать силу и представлять огромную опасность для наших врагов." # We must move to improve our cannons and mortars that have stood since after the great war. We need artillery that can show force, and be a huge danger to our enemies.
 NOR_panservern_canon: "Противотанковая пушка" # Panservernkanon
 NOR_panservern_canon_desc: ""
 NOR_motorized_supply_lines: "Моторизованные линии подачи" # Motorized Supply Lines
 NOR_motorized_supply_lines_desc: "Пехотинцы с трудом преодолевают огромные расстояния за разумное время по сравнению с нашими промышленно развитыми соседями. Чтобы компенсировать это, мы должны сосредоточить наши усилия на моторизации нашей армии и линий снабжения." # Foot soldiers struggle to cross vast distances in reasonable amounts of time compared to our industrialized neighbors. To make up for this, we should focus our efforts on motorizing our army and supply lines.
 NOR_experienced_general_staff: "Опытный генеральный штаб" # An Experienced General Staff
 NOR_experienced_general_staff_desc: "Нам нужен настоящий генеральный штаб. Не то, что мы имеем сейчас с этими непроверенными офицерами. Нам нужно обучить этих офицеров придумывать лучшие планы." # We need a real general staff. Not what we have now with these untested officers. We need to train these officers to come up with better plans.
 NOR_establish_home_guard: "Создать ополчение" # Establish the Home Guard
 NOR_establish_home_guard_desc: "На данный момент у нас нет организованной системы подготовленных гражданских лиц, готовых к военной службе в любой момент. Некоторые из наших генералов и капитанов предложили «Хаймевернет». Эти силы будут состоять из гражданских лиц, прошедших обычную армейскую службу и хранящих военную технику дома. Сила, которую можно призвать в случае необходимости." # Right now, we have no organized system of trained civilians ready for military service at a moment notice. Some of our generals and captains have proposed 'Heimevernet'. This force will be made up of civilians who are finished with normal army service, who stores their military equipment at home. A force that can be called upon if needed.
 NOR_study_armoured_designs: "Изучите конструкции бронетехники" # Study Armoured Designs
 NOR_study_armoured_designs_desc: ""

 NOR_norwegian_navy: "Норвежский флот" # The Norwegian Navy
 NOR_norwegian_navy_desc: "Наш флот находится не в лучшей форме. Нам следует начать планировать, в каком направлении мы собираемся двигаться с нашим флотом. Мы можем сосредоточиться на меньших прибрежных кораблях и подводных лодках или на более крупных кораблях и контроле над нашим морем." # Our navy is not in the best shape. We should begin to plan for what direction we are going to take with our navy. We can focus on smaller, coastal ships and submarines, or bigger ships and control over our sea.
