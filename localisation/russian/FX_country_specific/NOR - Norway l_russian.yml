 NOR_government_president_struggle_idea: "Борьба между правительством и президентом" # Struggle Between the Government and the President
 NOR_government_president_struggle_idea_desc: "Правительство и президент состоят из конфликтующих политических партий, одна из которых представляет левых политических сил, а другая — политических правых. Хотя эти два органа действуют как сдерживающие факторы друг для друга, это затрудняет управление страной в нашем направлении." # The government and the president is from conflicting political parties, with one representing the political left and the other representing the political right. While the two bodies act as checks on each other, it makes it hard to govern the nation in our direction.
