 NOR_german_alignment_desc: ""
 NOR_revive_greenland_case: "Возобновить дело Гренландии" # Revive the Greenland Case
 NOR_revive_greenland_case_desc: "В 1814 году великие державы разделили нашу нацию на две части: «датскую» и «шведскую». Хотя наши братья в Северной Атлантике не боролись за независимость так, как мы, они все равно братья. Когда мы получили независимость в 1905 году, датчане не отдали свои территории. Пришло время вернуть эти территории и объединить норвежцев!" # In 1814, the great powers divided our nation in two, the 'Danish' part and the 'Swedish' part. While our brothers in the North Atlantic did not fight for independence like we did, they are still brothers. When we got independence in 1905, the Danish did not give over their territories. It is time to take back these territories and unite the Norwegians!
 NOR_integrate_western_islands: "Интегрируйте Западные острова" # Integrate the Western Islands
 NOR_integrate_western_islands_desc: ""
 NOR_explore_greenland: "Откройте для себя направление Гренландия" # Explore Greenland
 NOR_explore_greenland_desc: "Хотя в Гренландии в основном только белый лед и снег, у нас есть потенциал для запуска промышленности на южном побережье." # While there is mostly just white ice and snow in Greenland, we have the potential to start industry along the southern coast.
 NOR_icelandic_industries: "Исландская промышленность" # Icelandic Industries
 NOR_icelandic_industries_desc: "Промышленность Исландии крошечная. Там почти ничего нет. Только несколько военно-морских портов и старые дома. Нам нужно благоустроить эту территорию и заставить людей иммигрировать сюда." # The industry of Iceland is tiny. There is almost nothing there. Just some naval ports and old houses. We need to improve this territory and get people to immigrate here.
 NOR_claims_in_east: "Претензии на Востоке" # Claims in the East
 NOR_claims_in_east_desc: "Шведы в течение многих лет оккупировали Альвхайм и Ойстрарикину, Емтланд. Они были незаконно конфискованы, и датчане полагали, что могут представлять нас. Мы заявляем, что эти земли являются частью Норвегии." # The Swedes have in many years occupied Alvheim and öystræ rikinu, Jemtland. These were unlawfully seized and the Danes believed they could represent us. We claim these lands as parts of Norway.
 NOR_integrate_eastern_lands: "Интегрируйте восточные земли" # Integrate Eastern Lands
 NOR_integrate_eastern_lands_desc: ""
 NOR_develop_east: "Развивайте Восток" # Develop the East
 NOR_develop_east_desc: ""
 NOR_greater_norwegian_dream: "Великая норвежская мечта" # The Greater Norwegian Dream
 NOR_greater_norwegian_dream_desc: "Мы наконец-то полностью объединили норвежскую нацию. Это великое достижение, которым нам нужно гордиться. В мире наступила новая эра. Эпоха Великой Норвегии!" # We have finally fully united the Norwegian nation. It is a great achievement, one we need to show our pride for. A new age has arrived in the world. The age of Greater Norway!

#### Decisions ####

 NOR_economical_decision_group: "Экономические решения Норвегии" # Norway's Economical Decisions
 NOR_economical_decision_group_desc: "Норвегия долгое время была сельским и непромышленным государством. Мы получили начало после обретения независимости в 1905 году, но нам необходимо продолжать наш промышленный подъем." # Norway has for a long time been a rural and non-industrial state. We got a beginning after independence in 1905, but we need to continue our industrial rise.

 NOR_land_distribution: "Распределение земли" # Land Distribution
 NOR_land_distribution_desc: "Больше не будет в нашей стране людей с «незаработанными» богатствами и богатствами!" # No Longer shall there be people in our country with 'unearned' riches and wealth!
 NOR_expand_steel_mines: "Расширить стальные рудники" # Expand the Steel Mines
 NOR_expand_steel_mines_desc: "В Норвегии есть потенциал для добычи большого количества железа и стали." # There is potential to mine out a lot of iron and steel in Norway.

 NOR_war_with_decistions: "Внешняя политика" # Foreign Policy

 NOR_white_peace_sweden: "Белый мир со Швецией" # White Peace with Sweden
 NOR_white_peace_sweden_desc: "Война между нами, Норвегией и Швецией не закончилась. Однако и здесь нет явного победителя, поэтому мы должны попытаться подписать белый мир." # The war between us, Norway, and Sweden has not come to an end. There is, however, no clear winner in this either, so we must try to sign a white peace.

 NOR_join_third_international: "Вступление в Третий Интернационал" # Joining the Third Internationale
 NOR_join_stahlpakt: "Вступление в Штальпакт" # Joining the Stahlpakt
 NOR_join_entente: "Вступление в Антанту" # Joining the Entente
 NOR_join_ipa: "Присоединение к Альянсу Имперской Защиты" # Joining the Imperial Protection Alliance

#### Others ####

 NOR_FUHRERREICH_DESC: "С момента обретения независимости в 1905 году Норвегия оставалась нейтральной в Великой войне. Но в условиях растущих во время войны классовых различий и все более непопулярной монархии марксизм стал рассматриваться как решение проблемы народа. Республика была основана в 1926 году, а в 1930 году ее возглавило социалистическое коалиционное правительство. Остается только посмотреть, продолжит ли Норвегия путь социализма или вернется к монархии." # Since independence in 1905, Norway stayed neutral in the Great War. But with class differences growing under the war, and a more and more unpopular monarchy, marxism was seen as a solution to the people. The Republic was established in 1926, and in 1930, a socialist coalition government took the lead. It is just to see if Norway will continue the path of socialism, or go back to the monarchy.

 POLITICS_MARTIN_TRANMAEL_DESC: "§YОписание лидера\nРодился:§! §g27 июня 1879 года в Мельхусе, Сёр-Трёнделаг§!\n§YПолитическая карьера:§! §gМартин Транмэль родился на ферме среднего размера в Мелхусе и дорос до того, чтобы стать лидером не только норвежских рабочих движение, но и Республика. Не многие могут сказать, что они свергли монархию в стране, но Транмэль может. Он один из величайших ораторов рабочего движения, некоторые даже говорят, что его речи скрепляют его партию и не дают ей расколоться. Но Транмэль также возглавляет республику, которая годами боролась с монархическими и антисоциалистическими беспорядками, и он боится представить, как будет жить Норвежская Республика без него.§!\n\n§RУмеренный Социалист§!" # §YLeader Description\nBorn:§! §gJune 27th, 1879, in Melhus, Sør-Trøndelag§!\n§YPolitical Career:§! §gMartin Tranmæl came from a middle-sized farm in Melhus, and rose to become the leader, of not just the Norwegian labour movement, but also the Republic. Not many can say that they have removed a country's monarchy, but Tranmæl can. He is one of the greatest speakers that the labour movement have, some even say that his speeches holds his party together and prevented it from dividing itself up. But Tranmæl is also leading a republic that has for years struggled with monarchist and anti-socialist riots, and he is afraid to imagine how the Norwegian Republic will fare without him leading it.§!\n\n§RModerate Socialist§!
 POLITICS_JOHAN_LUDWIG_MOWINCKEL_DESC: "§YОписание лидера\nРодился:§! §g22 октября 1870 года в Бергене, Хордаланд§!\n§YПолитическая карьера:§! §gЙохан Людвиг Мовинкель — судоходный магнат, государственный деятель и филантроп, бывший премьер-министр и действующий президент Норвегии. Он родился в старой купеческой семье в Бергене и, естественно, вырос и стал министром иностранных дел и защитником свободной торговли. Либерал, Мовинкель выступает против как валькизма Германии, так и социализма как Советского Союза, так и Лейбористской партии. Учитывая его опыт работы за границей, есть надежда, что его президентство приведет к расширению сотрудничества с нашими соседями и демократическими державами мира.§!\n\n§OLiberal§!" # §YLeader Description\nBorn:§! §gOctober 22nd, 1870, in Bergen, Hordaland§!\n§YPolitical Career:§! §gJohan Ludwig Mowinckel is a shipping magnate, statesman and philanthropist, a former Prime Minister, and the reigning President of Norway. Born into an old merchant family in Bergen, it was natural for him to grow up to become a foreign minister and an advocate of free trade. A Liberal, Mowinckel is opposed to both the Valkism of Germany and the socialism of both the Soviet Union and the Labour Party. With his background in the foreign field, there are hopes that his presidency will see increased cooperation with our neighbors and the democratic powers of the world.§!\n\n§OLiberal§!
 POLITICS_INGOLF_ELSTER_CHRISTENSEN_DESC: "§YОписание лидера\nРодился:§! §g28 марта 1872 года в Фёрде, Согн и Фьордане§!\n§YПолитическая карьера:§! §gИнгольф Эльстер Кристенсен имеет опыт юриста, военного офицера и губернатора графства. Выходец из сельского графства Согн-ог-Фьордане, он поднялся на самый высокий пост в стране. Кристенсен родился в 1872 году в семье капитана, учился в Бергенской кафедральной школе и поступил в Военную академию, а затем стал губернатором графства сначала в Согне-ог-Фьордане, затем в Осло и Акершусе, пока не ушел в отставку, чтобы добиться поста президента. Консерватор с опытом работы в сфере юстиции и обороны, сохранение правопорядка будет важной задачей президента.§!\n\n§CКонсерватор§!" # §YLeader Description\nBorn:§! §gMarch 28th, 1872, in Førde, Sogn og Fjordane§!\n§YPolitical Career:§! §gIngolf Elster Christensen has a history as a jurist, military officer and county governor. Coming from the rural county of Sogn og Fjordane, he has risen to the highest position in the country. Born in 1872 to a captain, Christensen studied in the Bergen Cathedral School and went to the Military Academy before serving as county governor, first for Sogn og Fjordane, than of Oslo and Akershus, until he stepped down to persue the presidency. A Conservative with a background in justice and defence, preserving law and order will be an important task for the President.§!\n\n§CConservative§!
 POLITICS_EINAR_GERHARDSEN_DESC: "§YОписание лидера\nРодился:§! §g10 мая 1897 года в Аскере, Акерсхус§!\n§YПолитическая карьера:§! §gЭйнар Генри Герхардсен, родившийся как Эйнар Генри Олсен. Будучи дорожным рабочим и активистом рабочего движения, теперь он является президентом Норвегии. Герхардсен родился в Аскере в скромной рабочей семье и считал естественным стать членом рабочего движения. Это также привело его к тому, что в начале 1920-х годов он стал членом ближайшего окружения Мартина Транмеля и почти преданно служил г-ну Транмелю. Начав с радикализма, Герхардсен перешел к более умеренной позиции в Лейбористской партии. Многие видят в нем продолжение наследия Транмеля, но он также может основать собственное наследие.§!\n\n§RУмеренный социалист§!" # §YLeader Description\nBorn:§! §gMay 10th, 1897, in Asker, Akershus§!\n§YPolitical Career:§! §gEinar Henry Gerhardsen, born as Einar Henry Olsen. From a background as a road worker and an activist in the labour movement, he now sits as the President of Norway. Born in Asker to a modest working class family, Gerhardsen found it natural to become a member of the labour movement. This also led him to become a member of Martin Tranmæl's inner circle in the early 1920s, serving almost loyally to Mr. Tranmæl. While starting of as an radical, Gerhardsen have moved towards a more moderate position in the Labour Party. Many see him as a continuation of Tranmæl's legacy, but could also found a legacy of his own.§!\n\n§RModerate Socialist§!
 POLITICS_HAAVARD_LANGSETH_DESC: "§YОписание лидера\nРождение:§! §g7 июля 1888 года§!\n§YПолитическая карьера:§! §gХаавард Лангсет — инженер-строитель, организатор, редактор и один из радикальных социалистов, нашедший пристанище в Лейбористской партии. Коммунист по натуре, Лангсет является сторонником социализма советского образца и был одним из главных основателей движения «Друзья Советского Союза». Это также заставило его оппонентов и даже умеренных внутри партии опасаться, что он не более чем советская марионетка. Став президентом, Лангсет сможет либо доказать их правоту, укрепив отношения Норвегии с Советским Союзом, либо построить более независимое социалистическое общество.§!\n\n§RРадикальный Социалист§!" # §YLeader Description\nBorn:§! §gJuly 7th, 1888§!\n§YPolitical Career:§! §gHaavard Langseth is a civil engineer, organizer, editor and one of the radical socialists that finds home in the Labour Party. A communist at heart, Langseth is a supporter of Soviet-style socialism, and was one of the main founders of the Friends of the Soviet Union movement. This have also made his opponents, and even moderates inside the party, afraid that he is no more than a Soviet puppet. With his rise to the presidency, Langseth can either prove them right by furthering Norway's relation to the Soviet Union, or build a more independent socialist society.§!\n\n§RRadical Socialist§!
 POLITICS_JOHAN_NYGAARDSVOLD_DESC: "§YОписание лидера\nРодился:§! §g6 сентября 1879 года в Хоммельвике, Сёр-Трёнделаг§!\n§YПолитическая карьера:§! §gЙохан Нигаардсволд — еще один лидер рабочего класса Лейбористской партии, по образованию рабочий на лесопилке. После недолгой карьеры в Америке, где он также выступал в качестве агитатора ИРМ, он вернулся в Норвегию в 1907 году. Нюгаардсвольд стал членом Лейбористской партии, затем Социал-демократов, прежде чем обе партии воссоединились. Хотя Нигаардсвольд неохотно занимал государственную должность, он принял кандидатуру кандидата в президенты от партии. Своими умеренными взглядами, граничащими с социал-демократией, он собрал оппозицию со стороны радикальной фракции партии. Однако для оппозиции он приветливое лицо.§!\n\n§RСоциал-демократ§!" # §YLeader Description\nBorn:§! §gSeptember 6th, 1879, in Hommelvik, Sør-Trøndelag§!\n§YPolitical Career:§! §gJohan Nygaardsvold is yet another working class Labour leader, with a background as a lumber mill worker. After a brief career in America, were he also acted as an agitator for the IWW, he returned to Norway in 1907. Nygaardsvold became a member of the Labour Party, then the Social Democrats, before the two parties reunited. While Nygaardsvold have been reluctant to hold public office, he has accepted the nomination to be the party's presidential candidate. With his moderate views, bordering to social democracy, he have gathered opposition from the radical faction of the party. However, he is a welcoming face for the opposition.§!\n\n§RSocial Democrat§!
 POLITICS_ARTHUR_NORDLIE_DESC: "§YОписание лидера\nРодился:§! §g2 февраля 1883 года в Кристиании (Осло)§!\n§YПолитическая карьера:§! §gАртур Нордли — подрядчик и спортивный менеджер, который много лет работал представителем Консервативной партии в Стортинге. Нордли родился в столице Осло, тогдашней Кристиании, и пришел в политику благодаря работе в ремесленных организациях. Нордли также принимал активное участие в местной политике и играл важную роль в создании футбольных и спортивных федераций как на национальном, так и на местном уровне. С возрастом Ингольфа Эльстера Кристенсена Нордли стал очевидным кандидатом на пост президента от Консервативной партии.§!\n\n§CConservative§!" # §YLeader Description\nBorn:§! §gFebruary 2nd, 1883, in Kristiania (Oslo)§!\n§YPolitical Career:§! §gArtur Nordlie is a contractor and sport manager that have served many years as a representative in the Storting for the Conservative Party. Born in the capital of Oslo, then Kristiania, Nordlie came into politics through service in artisan organizations. Nordlie has also been active in local politics and as an important figure in establishing football and sports federations, both nationally and locally. With Ingolf Elster Christensen aging, Nordlie have become the obvious candidate to represent the Conservative Party in the presidency.§!\n\n§CConservative§!
 POLITICS_NILS_TRAEDAL_DESC: "§YОписание лидера\nРодился:§! §g29 ноября 1879 года в Сунндале, Мёре и Ромсдал§!\n§YПолитическая карьера:§! §gНильс Тредал — священник и один из основателей Фермерской партии. Тредал родился в Сунндале в Мёре-ог-Ромсдале и является сыном фермера, который стал сначала капелланом, а затем приходским священником. В политическом плане Тредал начинал как член Либеральной партии, а затем стал членом Фермерской партии при ее основании в 1920 году. Тредал был представителем, членом правительства и лидером парламента, прежде чем теперь был избран на пост президента Норвегии. Популярно рассматриваемый как компромиссный кандидат, он призван посмотреть, сможет ли он стать объединяющей фигурой.§!\n\n§GAgrarian§!" # §YLeader Description\nBorn:§! §gNovember 29th, 1879, in Sunndal, Møre og Romsdal§!\n§YPolitical Career:§! §gNils Trædal is a priest and one of the founding members of the Farmers' Party. Born in Sunndal in Møre og Romsdal, Trædal is a farmers' son, who became first a chaplain, then a parish priest. Politically, Trædal started as a member of the Liberal Party before becoming a member of the Farmers' Party at its founding in 1920. Trædal have served as a representative, member of government and parliamentary leader, before now being elected to the Presidency of Norway. Popularily seen as a compromice candidate, it is to see if he can be a unifying figure.§!\n\n§GAgrarian§!
 POLITICS_KING_HAAKON_VII_DESC: "§YОписание лидера\nРодился:§! §g3 августа 1872 года в замке Шарлоттенлунд, Дания§!\n§YПолитическая карьера:§! §gКороль Хокон VII — это история короля, избранного народом, который также был свергнут народом. Родившийся как принц Датский Карл, сын датского короля, Карл получил трон новой независимой Норвегии в 1905 году, но потерял его только 20 лет спустя, будучи вынужденным покинуть страну. Первоначально будучи фигурой, объединяющей уважение к конституционной монархии, народ не смог проявить к этому институту такое же уважение, как он. Это повлияло на то, что король Хокон постепенно потерял уважение к принципам современной конституционной монархии. В последние годы король Хокон принял идею королевского патернализма, рассматривая допустившую ошибку республиканскую Норвегию как проект, который может спасти только сам монарх-отец.§!\n\n§WКоролевский патерналист§!" # §YLeader Description\nBorn:§! §gAugust 3rd, 1872, in Charlottenlund Castle, Denmark§!\n§YPolitical Career:§! §gKing Haakon VII is the story of a king elected by the people, who was also overthrown by the people. Born as Prince Carl of Denmark, the son of the Danish king, Carl was given the throne of the newly independent Norway in 1905, only losing it 20 years later, being forced into exile. While first being a unifying figure with respect for the constitutional monarchy, the people failed to show the same respect for the institution like he did. This influenced King Haakon to gradually lose respect for the principles of modern constitutional monarchy. In recent years, King Haakon has adopted the idea of Royal Paternalism, seeing the missteped republican Norway as a project that can only be saved by a Paternal Monarch, Himself.§!\n\n§WRoyal Paternalist§!
 POLITICS_KING_OLAV_V_DESC: "§YОписание лидера\nРодился:§! §g2 июля 1903 года в Эпплтаун-хаусе, Соединенное Королевство§!\n§YПолитическая карьера:§! §gКороль Олав V был еще ребенком, когда его отец, принц Карл, стал королем Норвегии Хоконом VII. Выросший в Норвегии, наследный принц был почти убит горем, когда ему пришлось покинуть недавно образованную республику в 1926 году. Хотя ему разрешили увидеть Норвегию для свадьбы в 1929 году, с тех пор социалистические правительства начала 1930-х годов его не приглашали. Хотя республика поначалу вызывала у Олава презрение к конституционной монархии, после нескольких лет изгнания Олав начал восстанавливаться после потери своей родины в Норвегии. Он много лет жил в Англии, периодически посещая Америку. Вернувшись в Норвегию, Олав надеется, что сможет стать королем народа и предотвратить новый 1926 год.§!\n\n§WConstitutionalist§!" # §YLeader Description\nBorn:§! §gJuly 2nd, 1903, in Appletown House, the United Kingdoms§!\n§YPolitical Career:§! §gKing Olav V was just a child when his father, Prince Carl, became King Haakon VII of Norway. Growing up in Norway, the crown prince was nearly heartbroken when he had to leave the newly formed republic in 1926. While he was allowed to see Norway for his marriage in 1929, since then, he has been uninvited by the socialist governments of the early 1930s. While the republic gave Olav a disstain for the consitutional monarchy at first, after some years of exile, Olav began to recover from the loss of his homeland in Norway. He has lived many years in England, with visits to the Americas in between. Returning to Norway, Olav hopes that he can be a king for the people and prevent another 1926.§!\n\n§WConstitutionalist§!
 POLITICS_RAGNVALD_HVOSLEF_DESC: "§YОписание лидера\nРодился:§! §g19 сентября 1872 года в Кристиании (Осло)§!\n§YПолитическая карьера:§! §gРагнвальд Хвослеф — военный офицер и политик, а также центральная фигура, управляющая направлением развития Норвегии, даже если он сам правит только несколько дней. Хвослеф родился в Христиании (ныне Осло). Он служил майором, военным атташе и даже начальником Королевской гвардии. Это было до того, как он покинул вооруженные силы в 1926 году. Лидер военизированной белой гвардии Самфундсвернет, он сыграл важную роль в новогоднем перевороте против республиканского правительства Социалистической Лейбористской партии. Теперь во многом от него зависит, кто продолжит возглавлять Норвегию. Однако он больше никогда не станет социалистическим.§!\n\n§gНационалистический§!" # §YLeader Description\nBorn:§! §gSeptember 19th, 1872, in Kristiania (Oslo)§!\n§YPolitical Career:§! §gRagnvald Hvoslef is a military officer and politician, and a central figure to steer the direction of Norway, even if he himself only rules for a few days. Born in Christiania, what is today Oslo, Hvoslef has served as a major, military attache and even chief for the Royal Guards. This before he left the Armed Forces in 1926. The leader of the paramilitary white guard Samfundsvernet, he was essential in the New Year Coup against the Republican government of the socialist Labour Party. It is now mostly up to him who is going to continue to lead Norway. However, it is not going to be a socialist ever again.§!\n\n§gNationalist§!
 POLITICS_VIDKUN_QUISLING_DESC: "§YОписание лидера\nРодился:§! §g18 июля 1887 года в Фиресдале, Телемарк§!\n§YПолитическая карьера:§! §gВидкун Квислинг — военный офицер, бывший сотрудник гуманитарной организации и ярый противник социализма. Квислинг родился в Телемарке и был сыном пастора норвежской церкви. Квислинг проявил себя талантливым в гуманитарных и естественных науках и в конце концов получил военное образование, где добился лучших результатов в училище. За свою жизнь Квислинг дважды женился, оба на русских женщинах, участвовал в гуманитарной работе вместе с национальным героем Фритьофом Нансеном и был одним из самых ярых противников республики и социализма. Теперь жизнь поставила его главой нового норвежского государства, прославившего не только Норвегию, но и все скандинавские страны.§!\n\n§gНационалист§!" # §YLeader Description\nBorn:§! §gJuly 18th, 1887, in Fyresdal, Telemark§!\n§YPolitical Career:§! §gVidkun Quisling is a military officer, former humanitarian relief worker and a strong opponent of socialism. Born in Telemark, Quisling was the son of a Church of Norway pastor. Quisling proved himself talented in the humanities and natural sciences, and eventually took an education in the military where he achieved the best result at the college. Through his life, Quisling have married twice, both to Russian women, partaken in humanitarian work with national hero Fridtjof Nansen, and was one of the most avid opponents to the Republic and to socialism. Now, life has placed him as the head of a new Norwegian state, anointed the savour of not only Norway, but all the Nordics.§!\n\n§gNationalist§!
 POLITICS_STEIN_BARTH_HEYERDAHL_DESC: "§YОписание лидера\nРодился:§! §g12 июля 1909 года в Стамнесе, Нордланд§!\n§YПолитическая карьера:§! §gШтайн Барт-Хейердал имеет опыт работы художником и редактором. Молодой Барт-Хейердал, родившийся в Нордланде, стал местным лидером скаутов и в конечном итоге вступил в Союз «Отечество». Начав изучать право, Барт-Хейердал больше времени уделял политике, а за годы своего пребывания в Осло он покинул Норвежскую церковь и стал неоязычником. Барт-Хейердал был приглашен при основании «Национал Самлинг» и стал фигурой радикального крыла партии, которая сначала окружала вдохновленного Фёлькишем Ойгена Нильсена. Обладая неоязыческими и пангерманскими взглядами, критикой консервативных и буржуазных тенденций квислингитского крыла, а также верой в расизм, Барт-Хейердал, естественно, вдохновился немецким валькизмом Адама Дресслера.§!\n\n§GValkist§!" # §YLeader Description\nBorn:§! §gJuly 12th, 1909, in Stamnes, Nordland§!\n§YPolitical Career:§! §gStein Barth-Heyerdahl has a background as an art painter and editor. Born in Nordland, the young Barth-Heyerdahl became a local scout leader and eventually joined the Fatherland Leauge. While set to study law, Barth-Heyerdahl spent more time pursuing politics, and during his years in Oslo, he left the Church of Norway and became a neo-pagan. Barth-Heyerdahl was invited at the founding of Nasjonal Samling and became a figure of the radical wing of the party that first surrounded the Völkish-inspired Eugen Nielsen. With neo-pagan and Pan-German views, criticism towards the Quislingite wings conservative and bourgeois tendencies, along with belief in racialism, Barth-Heyerdahl naturally became inspired by the German Valkism of Adam Dressler.§!\n\n§GValkist§!
 POLITICS_HANS_SOLGAARD_JACOBSEN_DESC: "§YОписание лидера\nРодился:§! §g10 февраля 1901 года, во Флеккефьорде, Вест-Агдер§!\n§YПолитическая карьера:§! §gГанс Солгаард Якобсен — журналист и бывший судовой брокер, который возглавит круг членов НС, которым удастся уничтожить Видкун Квислинг. Выросший в Моссе, где его отец руководил судоходной компанией, Якобсен поехал в Германию, чтобы получить образование в области социальной экономики. Пробыв большую часть 1920-х годов в Германии, он находился здесь под влиянием пангерманских и национал-социалистических идей и эмоционально привязался к борьбе послевоенной Германии, особенно благодаря литературе ветерана войны по имени Адам Дресслер. Кратковременная работа на заводе Ford в Детройте также помогла сформировать его антикапиталистические взгляды.\n\nВернувшись в Норвегию, Якобсен присоединился к радикальному крылу NS, вдохновленному Фёлькишем, во главе с Ойгеном Нильсеном. Приняв на себя обязанности Нильсена, Якобсен превратил бы ее в пангерманскую, антикапиталистическую и антихристианскую группу, оппозиционную Квислингу. Кроме того, он все больше и больше черпал вдохновение у этого парня Дресслера, добившись успеха валькизма в Германии.§!\n\n§GValkist§!" # §YLeader Description\nBorn:§! §gFebruary 10th, 1901, in Flekkefjord, Vest-Agder§!\n§YPolitical Career:§! §gHans Solgaard Jacobsen is a journalist and former ship broker, who would come to lead the circle of NS members who would manage to take down Vidkun Quisling. After his upbringing in Moss, where his father ran a shipping company, Jacobsen would travel to Germany for his social economics education. Staying most of the 1920s in Germany, here he was influenced by Pan-German, National-Socialistic ideas and got emotionally attached to the struggles of post-war Germany, especially through the litterature of a war veteran named Adam Dressler. A quick stint in a Ford factory in Detroit also helped in shaping his anti-capitalist views.\n\nBack in Norway, Jacobsen became affiliated with the radical Völkish-inspired wing of NS, led by Eugen Nielsen. After taking over from Nielsen, Jacobsen would mend it into a Pan-German, anti-capitalist and anti-Christian opposition group to Quisling. In addition, he has taken more and more inspiration by that Dressler guy, with the sucsess of Valkism in Germany.§!\n\n§GValkist§!

