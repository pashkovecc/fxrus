 NOR_1936_election: "Выборы 1936 года" # The 1936 Election
 NOR_1936_election_desc: "Настало время выборов 1936 года. Многие в нашей стране и за рубежом предполагают, что эти выборы станут поворотным моментом в Норвегии, ее политике и истории. Националистическая боевая группа, назвавшая себя «Самфундсвернет», попыталась захватить власть. Но наша демократия все еще стоит!" # It is time for the 1936 election. Many have speculated, in our country and abroad, that this election will be a turning point in Norway, its politics and history. The nationalist militant group that has called themselves 'Samfundsvernet' has tried to seize power. But our democracy still stands!

 NOR_ap_victory: "АП Виктория" # AP Victory
 NOR_ap_victory_desc: "Норвежская Лейбористская партия, несмотря на экономический кризис, преодолела трудности и была избрана на новый срок. Кажется, норвежский народ понимает, что экономический кризис произошел не по вине социалистического правительства, а по вине оставшегося влияния капиталистической системы. Теперь у нас есть полномочия преодолеть эти препятствия и направить Норвегию на путь утопии." # The Norwegian Labour Party have, despite the economic crisis, beaten the odds and been elected for another term. It seems that the Norwegian people understands that the economic crisis weren't the fault of a socialist government, but the remaining influence of a capitalist system. We have now a mandate to overcome these hurdles and set Norway on the path to utopia.

 NOR_continue_norwegian_revolution: "Продолжить норвежскую революцию" # Continue the Norwegian Revolution
 NOR_continue_norwegian_revolution_desc: "Умеренные в Лейбористской партии помешали нам осуществить революцию, наш мандат, данный в 1930 году. Они продолжали мечтать о том, что социализм и свобода рабочего класса могут быть достигнуты в рамках буржуазной демократии. В условиях недавнего экономического кризиса многие в партии наконец осознают, что необходимы настоящие перемены – настоящая социалистическая революция." # The moderates in Labour have hindred us from fulfilling the revolution, our mandate given in 1930. They have continued to dream that socialism and working class freedom can be achieved within the confines of bourgeois democracy. With the recent economic crisis, many in the party finally sees that real change is needed - a truly Socialist Revolution.
 NOR_supply_militant_workers: "Рабочие-боевики снабжения" # Supply Militant Workers
 NOR_supply_militant_workers_desc: "Наши рабочие все еще находятся под угрозой со стороны реакционной милиции и полиции, лояльных прихотям капиталистов. Кроме нас, им остается полагаться только на себя. Поэтому было бы справедливо снабдить их оружием, чтобы они могли защитить себя от реакции и легче свергнуть своих угнетателей в грядущей революции." # Our workers are still under the threat of reactionary militias and police loyal to the whims of capitalists. Beside us, they only have themselves to rely on. Therefore, it is fair to supply them with weapons so they can defend themselves against the reactionaries and easier overthrow their oppressors in the Revolution to come.
 NOR_request_soviet_support: "Запросить советскую поддержку" # Request Soviet Support
 NOR_request_soviet_support_desc: "Советский Союз — единственная крупная социалистическая страна в мире. Они взяли на себя мантию руководства мировой революцией, и мы должны обратиться к ним, чтобы помочь нам обеспечить революцию здесь, в Норвегии. Будем надеяться, что мы сможем присоединиться к ним в продвижении революции, а не эгоистично держаться особняком." # The Soviet Union are the only other major socialist country in the world. They have taken the mantle of leading the world revolution, and we should reach out to them to help us securing the revolution here in Norway. Hopefully, we can join them in furthering the revolution instead of selfishly keeping to ourselves.
 NOR_our_international_commitment: "Наши международные обязательства" # Our International Commitment
 NOR_our_international_commitment_desc: "Настало время выполнить наши международные обязательства. Слишком долго умеренные члены нашей партии удерживали нас от объединения сил с нашими братьями из рабочего класса в Советском Союзе. Социализм никогда не был о рабочих одной нации, а о рабочих всех наций.\n§R'Интернационал объединяет человечество!'§!" # It is time to meet our international commitment. For too long has the moderates in our party kept us away from joining forces with our working class brethren in the Soviet Union. Socialism has never been about workers of one nation, but about the workers of all nations.\n§R'The Internationale unites the Human Race!'§!
 NOR_strengthen_anti_insurgency_laws: "Укрепить антиповстанческое законодательство" # Strengthen Anti-Insurgency Laws
 NOR_strengthen_anti_insurgency_laws_desc: "Народ Норвегии живет в страхе перед реакционным насилием со стороны так называемого Norsk Samfundsvern и скрытыми заговорами политиков и бизнесменов, связанных с AfK. Эти силы стремятся подорвать волю народа и превратить Норвегию в капиталистическую диктатуру. Наш долг остановить их раз и навсегда." # The people of Norway lives in fear of the reactionary violence from the so-called Norsk Samfundsvern and the hidden plotting of AfK-affiliated politicians and businessmen. These forces seek to undermine the will of the people, and turn Norway into a capitalist dictatorship. It's our duty to stop them once and for all.
 NOR_overthrow_bourgeoisie_democracy: "Свергнуть буржуазную демократию" # Overthrow Bourgeois Democracy
 NOR_overthrow_bourgeoisie_democracy_desc: "Пришло время разорвать цепи буржуазной демократии, которая порабощает рабочий класс ложным сознанием того, что его голоса действительно имеют значение. В нашей стране это символизируют реакционные институты, такие как Стортинг, полиция или армия. Эти институты необходимо перевернуть, чтобы они служили Революции!" # It is time to break the chains of bourgeois democracy that enslaves the working class under a false conciousness that their voices really matters. In our country, this is symbolized by reactionary institutions like the Storting, the police or the military. These institutions need to be upended to serve the Revolution!
 NOR_nationalize_private_businesses: "Национализировать частный бизнес" # Nationalize Private Businesses
 NOR_nationalize_private_businesses_desc: "Слишком долго средства производства находились в руках класса капиталистов. Слишком долго эта страна и земля не принадлежали норвежскому народу. Сегодня мы исправим это и вернем контроль над средствами производства рабочему классу." # For too long, the means of production have been kept in the hands of the capitalist class. For too long, this country and land have not been owned by the Norwegian people. Today, we rectify this and take back control over the means of production to the working class.
 NOR_democratic_centralism: "Демократический централизм" # Democratic Centralism
 NOR_democratic_centralism_desc: "Нам нужно следовать учению Владимира Ленина, когда дело доходит до формирования нового социалистического государства, диктатуры пролетариата. Его ключевым принципом является демократический централизм. Здесь политические решения, принятые в ходе голосования, будут обязательными для всех членов политической партии и национальной политики." # We need to follow Vladimir Lenin's teaching when it comes to forming the new socialist state, the dictatorship of the proletariat. A key principle of his, is Democratic Centralism. Here, political decisions reached by the voting process will be binding upon all members of the political party and of the national politic.
 NOR_collectivize_farmland: "Коллективизировать сельскохозяйственные угодья" # Collectivize the Farmland
 NOR_collectivize_farmland_desc: "В Норвегии некоторые фермеры владеют большим количеством земли, в то время как другие являются «хусменами», которые работают на землях, принадлежащих другим фермерам и землевладельцам. Нам необходимо разрушить эту систему и передать все имеющиеся у нас небольшие сельскохозяйственные угодья под коллективное управление, чтобы это могло принести пользу всем нашим фермерам, а не только некоторым из них." # In Norway, some farmers own a lot of land while others are 'husmenn' who works on lands that are owned by other farmers and landowners. We need to upend this system and bring all of the little farmland that we have under collective management, so it can be to the benefit for all our farmers, not just some of them.
 NOR_dictatorship_of_proletariat: "Диктатура пролетариата" # Dictatorship of the Proletariat
 NOR_dictatorship_of_proletariat_desc: "Власть государства больше не контролируется силами реакции и капиталистов. То, что Маркс называет диктатурой буржуазии, потерпело поражение. Наконец, благодаря нашим недавним реформам мы видим, как пролетариат, рабочий класс, достигает контроля над правительством с созданием марксистско-ленинского государства." # No longer is the power of the state being controlled by the forces of reaction and the capitalist. What Marx calls the dictatorship of the bourgeoisie has been defeated. Finally, with our recent reforms, we see the Proletariat, the working class, achieving control over the government with the establishment of a Marxist-Leninist state.
 NOR_break_chains_of_religion: "Разорвите цепи религии" # Break the Chains of Religion
 NOR_break_chains_of_religion_desc: "Маркс называет религию «опиумом для народа». Религия либо служила правящему классу средством защиты эксплуатации рабочего класса и создания ложного чувства сознания у рабочих, либо способом для рабочего класса справиться со своим собственным отчуждением. С победой Революции религия устареет в нашем обществе и должна быть отменена." # Marx calls religion 'opium for the people'. Religion has either served as a means for the ruling class to protect their exploitation of the working class and to create a false sense of conciousness for the workers, or as a way for the working class to process their own alienation. With the victory of the Revolution, religion will become obsolete in our society and should be overturned.
 NOR_shield_of_revolution: "Щит революции" # Shield of the Revolution
 NOR_shield_of_revolution_desc: "Хотя наше общество становится свободным от оков буржуазной реакции, нет уверенности в том, что наше социалистическое общество не подвергнется реакционным атакам в будущем. Нам необходимо сформировать полицию государственной безопасности, перед которой будет поставлена ​​задача защищать норвежский рабочий класс от врагов революции." # While our society is becoming one free from the shackles of the bourgeois reactionaries, it isn't secure that our socialist society wouldn't come under reactionary attacks in the future. We need to form a State Security Police which will be tasked with protecting the Norwegian working class from the enemies of the Revolution.
 NOR_anti_monarchist_operations: "Антимонархические операции" # Anti-Monarchist Operations
 NOR_anti_monarchist_operations_desc: "После провозглашения республики в 1926 году монархические настроения в Норвегии продолжали расти под знаменем АдК. В их состав вошли влиятельные оппозиционные политики и бизнесмены, а также иностранные монархи и члены королевской семьи, сочувствующие делу реставрации. Это движение необходимо остановить, прежде чем оно подвергнет опасности нашу Республику." # Since the declaration of the Republic in 1926, monarchist sentiments has continued to grow in Norway under the banner of AfK. These have constituted of influential opposition politicians and businessmen, as well as foreign monarchs and royals sympathetic to the cause of restoration. This movement need to be stumped out before it endangers our Republic.
 NOR_crush_samfundsvernet: "Раздавить норвежскую общественную службу" # Crush Samfundsvernet
 NOR_crush_samfundsvernet_desc: "Хотя Norsk Samfundsvern оставалась нелегальной организацией с момента нашего первого прихода к власти в 1930 году, они продолжали действовать подпольно. Поскольку радикализирующий эффект экономического кризиса заставляет все больше и больше молодых людей присоединяться к этим реакционерам, нам необходимо расправиться с ними более жестко, чем раньше." # While Norsk Samfundsvern has remained an illegal organization since our first ascendancy in 1930, they have continued to operate underground. With the radicalizing effect of the economic crisis causing more and more young men to join these reactionaries, we need to crack down on them more heavy-handed than before.

 NOR_continue_moderate_course: "Продолжить умеренный курс" # Continue the Moderate Course
 NOR_continue_moderate_course_desc: "Норвежской Лейбористской партии удалось взять курс на независимый и умеренный норвежский социализм, и мы продолжим ему следовать. Хотя некоторые в партии призывают нас принять более радикальный курс, мы знаем, что этот курс является лучшим для нашей страны. Таким образом, мы поддержим норвежскую демократию, одновременно свергнув реакционную капиталистическую систему." # The Norwegian Labour Party have managed to steer a course for an independent and moderate Norwegian flair of socialism, and we will continue to follow it. While some in the party urge us to take a more radical course, we know this course is the best one for our nation. This way, we will uphold Norwegian democracy while overturning the reactionary, capitalist system.
 NOR_limit_labour_militancy: "Ограничьте воинственность труда" # Limit Labour Militancy
 NOR_limit_labour_militancy_desc: "В ответ на реакционное насилие организованные лейбористы начали защищать рабочих насилием. Хотя обычно это не их вина, такое насилие по-прежнему контрпродуктивно. Если мы хотим иметь общество, в котором действует верховенство закона, мы не можем позволить себе самостоятельно справляться с наказанием." # In response to reactionary violence, organized Labour have began to protect the workers with violence. While it is usually not their fault, this violence is still contra-productive. If we want to have a society where the rule of law applies, we can't allow ourselves to deal with punishment on our own.
 NOR_social_democratic_allies: "Социал-демократические союзники" # Social Democratic Allies
 NOR_social_democratic_allies_desc: "Социал-демократическая рабочая партия стала ближе к нам с тех пор, как мы впервые пришли в правительство в 1930 году. Поскольку наша партия продолжает курс демократического социализма, социал-демократы были готовы помочь нам в правительстве. Поскольку многие причины, по которым они отделились от нас, в конечном итоге устранены, мы надеемся объединить Лейбористское движение в ближайшем будущем." # The Social Democratic Labour Party have moved closer to us since we first came into government in 1930. With our party continuing the course of Democratic Socialism, the Social Democrats have been willing to help us in government. With many of the reasons why they split off from us eventually resolved, we hope to unite the Labour movement in the near future.
 NOR_socialist_reformism: "Социалистический реформизм" # Socialist Reformism
 NOR_socialist_reformism_desc: "Хотя мы постепенно отходим от Революции, это не значит, что мы отходим от Реформ. Многие верят, что социалистическое правительство сможет бороться с силами капитализма в демократических рамках и добиться существенных перемен в рабочем классе. Это нечто похожее на то, над чем работали социал-демократы в Дании и чего также стремятся достичь шведские социал-демократы. Почему это не сработает в Норвегии?" # While we are gradually moving away from Revolution, that doesn't mean we are moving away from Reform. Many believe that a Socialist government will be able to wrestle with the forces of capitalism inside the democratic framework, and create substantial change for the working class. This is something similar to what the Social Democrats in Denmark have worked towards and what Swedish Social Democrats also seek to achieve. Why wouldn't it work in Norway?
 NOR_tranmaelite_cult: "Культ Транмэлита" # Tranmælite Cult
 NOR_tranmaelite_cult_desc: "Мартин Транмэль – один из величайших лидеров в новейшей истории Норвегии. Под его руководством Лейбористское движение свергло монарха и создало правительство рабочего класса. Многие считают, что эти достижения невозможно воспроизвести без Транмеля и той роли, которую он сыграл в движении. Даже если Транмэль находится на посту президента последние годы, его наследие будет жить, а его протеже будут занимать центральные позиции в движении." # Martin Tranmæl is one of the greatest leaders in recent Norwegian history. Through his leadership, the Labour movement have ousted a monarch and created a government for the working class. Many see these achievements impossible to reproduce without Tranmæl and the role he has played in the movement. Even if Tranmæl is on his last years as President, his legacy will live on with his protégés holding central positions in the movement.
 NOR_fulfill_trondhjemsresolusjonen: "Выполнить тронхеймскую резолюцию" # Fulfill Trondhjemsresolusjonen
 NOR_fulfill_trondhjemsresolusjonen_desc: "Частью истории Лейбористской партии были Fagopposisjonen 1911 и Trondhjemsresolusjonen, которые стремились к более революционной линии партии. Хотя некоторые принципы резолюции были реализованы, другие все еще остаются невыполненными. Выполнение этого плана заложит основу для синдикализма в Норвегии, третьего пути, отдельного как от демократического социализма, так и от коммунизма, где Национальный профсоюз рабочих станет центральной частью управления." # A part of the Labour Party's history was Fagopposisjonen 1911 and Trondhjemsresolusjonen, that sought a more revolutionary line for the party. While some principles of the resolution have been implemented, others are still left unfulfilled. Fulfilling it would place the foundation for Syndicalism in Norway, a third way separate from both Democratic Socialism and Communism, where the Workers' National Trade Union will become a central part of governance.
 NOR_revolutionary_women: "Революционные женщины" # Revolutionary Women
 NOR_revolutionary_women_desc: "Как буржуазный капиталист угнетает рабочих, так и патриархат угнетает женщин. Многие из тех капиталистических структур, которые используются против рабочих, оправдывают угнетение женского пола. Свергнув капитализм, мы свергнем и патриархат. Мы должны добиться того, чтобы разорвать цепи, связывающие наших товарищей-женщин, а не поддерживать их." # Like the bourgeois capitalist oppresses the workers, so oppresses the patriarchy women. Many of the same capitalist structures that are used against the workers, are ones that justify the oppression of the female sex. In overthrowing capitalism, we also overthrow patriarchy. We have to ensure to break the chains that binds our female comrades, not uphold them.
 NOR_power_in_unions: "Власть в профсоюзах" # Power in Unions
 NOR_power_in_unions_desc: "Политическая власть должна быть передана в руки профсоюзов, лучших представителей рабочего класса, а не в руки партий и буржуазных институтов. Тем самым мы обеспечим объединение профсоюзов в продвижении интересов рабочего класса в целом, а не интересов одной профессии." # Political power needs to be vested in the hands of the unions, the best representatives of the working class, not in the hands of parties and bourgeois institutions. With this, we shall ensure that unions are united in advancing the interests of the working class as a whole, not the interests of one profession.
 NOR_empower_unionized_militias: "Расширение возможностей профсоюзных ополченцев" # Empower Unionized Militias
 NOR_empower_unionized_militias_desc: "Военные и полиция должны подчиняться профсоюзу. Слишком часто эти институты были инструментом капиталистической реакции, направленным на подрыв прав рабочего класса. Настало время создать ополчения для защиты профсоюзов, которые всегда будут преданы рабочему классу." # The military and the police should be subserviant to the union. Too often these institutions have been a tool for capitalist reactionaries to undermine the rights of the working class. It is time to raise militias to defend the unions, which its loyalty always will be with the working class.
 NOR_decentralized_communities: "Децентрализованные сообщества" # Decentralized Communities
 NOR_decentralized_communities_desc: "Синдикалистское государство должно быть государством, в котором полномочия по принятию решений децентрализованы и переданы местным профсоюзным отделениям и сообществам. Эти сообщества будут состоять из местных рабочих, фермеров и жителей региона, а не из интересов капиталистических реакционеров. Это была бы более чистая форма управления, которая хорошо отражала бы то, как была построена Норвегия." # The Syndicalist state should be one where the decision making powers are decentralized down into local union chapters and communities. These communities will be made up of the local workers, farmers and people of the area, not by the interests of capitalist reactionaries. It would be a purer form of governance that reflects well with how Norway has been built.
 NOR_compromise_with_agrarians: "Компромисс с аграриями" # Compromise With Agrarians
 NOR_compromise_with_agrarians_desc: "Многие считают соглашение с Фермерской партией маловероятным. Это была одна из самых антисоциалистических партий в Норвегии, а некоторые из ее членов даже сотрудничали с Norsk Samfundsvern. Однако они больше похожи на лейбористов, чем мы думаем. Мы обе классовые партии, представляющие низшие классы. Зачастую их интересы совпадают с нашими интересами вопреки интересам класса капиталистов. Мы можем показать им, что город и деревня могут работать вместе, рука об руку." # Many see an agreement with the Farmers' Party unlikely. They have been one of the most anti-socialist parties in Norway, with some of their members even collaborating with Norsk Samfundsvern. However, they are more alike Labour than we think. We are both class parties representing lower classes. Often, their interests are aligned with us against the interests of the capitalist class. We can show them that City and Countryside can work together, Hand in Hand.
 NOR_improve_workers_rights: "Улучшение прав работников" # Improve Workers Rights
 NOR_improve_workers_rights_desc: "Одним из важнейших достижений рабочего движения является введение 40-часовой рабочей недели. Однако всегда есть реформы, которые можно провести для улучшения условий труда рабочих. Нам необходимо обеспечить, чтобы рабочий класс имел право объединяться в профсоюзы, вести коллективные переговоры и бастовать ради улучшения условий жизни." # One of the most important achievement for the Labour movement, is the introduction of the 40-hour work week. However, there is always reforms that can be enacted to better the conditions of the workers. We need to ensure that the working class have the right to unionize, collectivly bargain and strike for better conditions.
 NOR_for_old_and_unemployeed: "Для старых и безработных" # For the Old and Unemployed
 NOR_for_old_and_unemployeed_desc: "Центральным предвыборным обещанием Лейбористской партии является расширение универсальных программ социального обеспечения. Самым большим шагом на пути к этой цели является создание программ помощи безработным и программ поддержки пенсионеров. Хотя мы надеемся, что они могут быть приняты в качестве универсальных программ, нам, возможно, все равно придется включить проверку потребностей, чтобы получить их одобрение." # A central campaign promise of Labour, is the expantion of universal social security programs. The biggest steps towards this goal is the establishment of programs to help the unemployed and programs that support pensioners. While we hope that these can be enacted as universal programs, we might still have to include needs testing to get them approved.
 NOR_protect_norwegian_farmers: "Защитите норвежских фермеров" # Protect Norwegian Farmers
 NOR_protect_norwegian_farmers_desc: "Мы обещали Фермерской партии усилить поддержку и защиту норвежских фермеров. Это будет включать в себя расширение сельскохозяйственных субсидий, помощь нашим фермерам выжить на их скудные доходы и модернизацию их оборудования, а также введение пошлин на иностранную сельскохозяйственную продукцию. Меры, которые также поддержат нашу национальную самодостаточность и независимость." # A promise from us to the Farmers' Party, was increasing support to and protection for the Norwegian farmers. This will include expanding the agricultural subsidies, helping our farmers to survive on their meager income and modernize their equipment, as well as enacting toll on foreign agricultural products. Measures that will also support our national self-sufficiency and independence.
 NOR_trepartssamarbeidet: "Трехстороннее сотрудничество" # Trepartssamarbeidet
 NOR_trepartssamarbeidet_desc: "Идея сотрудничества между рабочим и начальником для улучшения условий труда не нова. Это уже использовалось в ограниченной степени с хорошим успехом. Пришло время сделать это стандартом отношений между работодателем и работником по всей Норвегии. Вместо потенциального конфликта, в котором люди страдают каждый раз, когда работник добивается справедливости, мы можем собраться вместе и прийти к соглашению." # The idea of cooperation between the worker and the boss for better conditions are nothing new. Already, this have been used to a limited degree with good sucsess. It is time to make this the standard for the employer-employee relationship across Norway. Instead of having a potential conflict where people get harmed every time the worker seeks justice, we can get together and come to an agreement.
 NOR_secularization: "Секуляризация" # Secularization
 NOR_secularization_desc: "Отцы норвежской конституции создали Норвегию, которая по своей сути была христианской нацией. Однако мы уже давно прошли 1814 год, и нам нужно признать, что мы не можем позволить религиозным догмам управлять нашей страной. Хотя религиозные люди могут иметь своего Бога и свои церкви, они должны согласиться с тем, что влияние их Бога не распространяется на школы или другие официальные сектора." # The fathers of the Norwegian constitution created a Norway that was to its core a Christian nation. However, we are long passed 1814, and we need to achknowledge that we can't have religious dogmas running our country. While the religious people can have their God and their churches, they have to agree that the influence of their God doesn't extend into schools or other official sectors.
 NOR_socialism_and_liberal_feminism: "Социализм и либеральный феминизм" # Socialism and Liberal Feminism
 NOR_socialism_and_liberal_feminism_desc: "Мы должны смириться с тем фактом, что феминизм революционного социализма заинтересован не столько в возвышении женщин, сколько в использовании феминизма для разрушения капитализма. В этом отношении нам необходимо услышать опыт либеральной феминистской традиции. Хотя либеральный феминизм не идеален, он должен стать основой для дальнейшего построения феминизма." # We have to come to terms with the fact that feminism of revolutionary socialism isn't so much interested in uplifting women as it is to use feminism to tear down capitalism. In this regards, we have to hear the experience coming from the liberal feminist tradition. While liberal feminism isn't perfect, it should be the foundation to build feminism further on.
 NOR_norwegian_utopia: "Норвежская утопия" # A Norwegian Utopia
 NOR_norwegian_utopia_desc: "По мере продвижения вперед мы можем начать видеть контуры норвежской социалистической утопии. Для многих социалистов общество не так уж отличается от откровения новой Земли и нового Неба, данного Иоанну Богослову на Патмосе. Хотя наша нация не достигает стандартов Откровения, она продвинулась далеко в устранении неравенства между богатыми и бедными и в обеспечении того, чтобы у каждого был шанс на справедливую и счастливую жизнь." # As we move forward, we can begun to see the outlines for a Norwegian Socialist Utopia. For many Socialists, a society not so dissimilar to the revelation of a new Earth and a new Heaven given to John the Evangelist on Patmos. While our nation isn't reaching the standard of Revelation, it has come far in tendering to the inequality between the rich and the poor, and making sure everyone has a chance to a fair, happy life.

 NOR_venstre_victory: "Левая Победа" # Venstre Victory
 NOR_venstre_victory_desc: "Хотя многие удивлены победой Венстре, эксперты понимают, почему. Они пользовались поддержкой большего числа людей, чем Хойре, и подружились как с социал-демократами, так и с либералами-консерваторами, с их поддержкой социального обеспечения и частных инициатив." # While many are surprised that Venstre won, the experts see why. They had support from more people than Høyre, and had made friends with both social democrats and liberal-conservatives, with their supportive stand for welfare and private initiatives.
 NOR_mowinckels_legacy: "Наследие Мовинкеля" # Mowinckel's Legacy
 NOR_mowinckels_legacy_desc: "Йохан Людвиг Мовинкель был лидером Венстре после выхода на пенсию Гуннара Кнудсена в 1927 году. Даже до этого он был влиятельным норвежским политиком. В некоторой степени он сыграл роль в подъеме Лейбористской партии в 1930 году из-за своей неспособности собрать и сохранить антисоциалистическую коалицию. Вместо этого ведите переговоры по всему спектру. Теперь экономический кризис дал его партии новый шанс стать лидером. Надеюсь, это оставит лучшее наследие." # Johan Ludwig Mowinckel has been the leader of Venstre since the retirement of Gunnar Knudsen in 1927. Even before that, he has been an influential Norwegian politician. To some degree, he played a role in the rise of the Labour Party in 1930 with his inhability to gather and preserve an anti-socialist coalition. Instead negotiating across the spectrum. Now, the economic crisis has given his party a new chance to lead. Hopefully, it will leave a better legacy.
 NOR_our_castbergian_roots: "Наши кастбергианские корни" # Our Castbergian Roots
 NOR_our_castbergian_roots_desc: "Йохан Кастберг считается отцом ряда законов, признававших право наследования внебрачным детям и экономическую помощь матерям и детям. Законы, которые закладывают основу для растущего государства всеобщего благосостояния. Тогда Мовинкель действительно был близок к Кастбергу, и нам следует стремиться к реформам, которые укрепят фундамент, заложенный Кастбергом." # Johan Castberg is considered the father of a string of laws that recognized the right of inheiritance to illegitimate children, and economic aid to mothers and children. Laws that lays the foundation for a growing welfare state. Mowinckel did stand close to Castberg back then, and we should look towards reforms to strengthen the foundation that Castberg laid.
 NOR_liberal_pension_system: "Либеральная пенсионная система" # A Liberal Pension System
 NOR_liberal_pension_system_desc: "Многие пожилые норвежцы с нетерпением ждут выхода на пенсию, но зачастую они рискуют выйти на пенсию в результате банкротства. В то время как предыдущее лейбористское правительство провело некоторые реформы для обеспечения пенсий нашим пенсионерам, мы в Венстре завершим их разумным способом." # Many of Norway's elderly are looking forward to retirement, but they are often too likely to face retirement in bankrupcy. While the previous Labour government have done some reforms to secure pensions for our retirees, we in Venstre will finish it in a reasonable way.
 NOR_work_with_moderate_unions: "Работайте с умеренными профсоюзами" # Work With Moderate Unions
 NOR_work_with_moderate_unions_desc: "Национальный профсоюз рабочих с момента своего основания представлял собой проблемную группу революционеров. Однако под их эгидой есть много членов и организаций, которые готовы работать ради реформ, а не революции. Многие искренне заинтересованы в улучшении условий труда своих членов и противостоят революционным амбициям некоторых профсоюзных жуликов." # The Workers' National Trade Union has since its founding represented a troublesome bunch of revolutionaries. However, there are many members and organizations under their umbrella that are willing to work for reforms instead of revolution. Many have an earnest interest to better the working conditions of their members, and opposes the revolutionary ambitions of some union crooks.
 NOR_liberalism_and_neutrality: "Либерализм и нейтралитет" # Liberalism and Neutrality
 NOR_liberalism_and_neutrality_desc: "Видение Мовинкеля можно резюмировать двумя словами: «Либерализм» и «Нейтралитет». Он стремится создать либеральное норвежское государство со свободой торговли нашей продукцией на свободном рынке, а также с твердой приверженностью гражданским свободам. Он также стремится к тому, чтобы это государство оставалось нейтральным перед лицом предстоящих конфликтов." # Mowinckel's vision can be summed up in two words: 'Liberalism' and 'Neutrality'. He seek to create a liberal Norwegian state, with freedom to trade our products onto the free market, in addition to a strong adherance to civil freedoms. He also seek this state to be neutral in the face of upcoming conflicts.
 NOR_promote_nordic_ties: "Продвижение связей Северных стран" # Promote Nordic Ties
 NOR_promote_nordic_ties_desc: "Наши самые тесные связи – это те, которые у нас есть с нашими северными соседями. Эти связи будут полезны как для обеспечения рынков для норвежской продукции, так и для братьев, которые смогут поддержать друг друга в случае конфликта." # Our closest ties is those we have with our Nordic neighbors. These are ties that will be useful both in securing markets for Norwegian products, as well as brothers who can back each other up when faced with conflict.
 NOR_strengthen_low_church: "Укрепить Низкую Церковь" # Strengthen the Low Church
 NOR_strengthen_low_church_desc: "Венстре всегда был другом аутсайдеров в борьбе с элитами. Хотя Мовинкель не христианин, а Венстре стала более светской партией, мы по-прежнему поддерживаем низкую церковь. Эти церкви представляют собой учреждения, которые отвергают государственный контроль над их учениями и деятельностью. Нам следует отойти от монополии Церкви Норвегии, укрепляя церкви, находящиеся вне ее контроля." # Venstre has always been a friend to underdogs against elites. While Mowinckel is no Christian and Venstre has become a more secular party, we still support the low church. These churches are institutions that rejects state control over their teachings and operations. We should move away from the monopoly of the Church of Norway, strengthening the churches outside its control.
 NOR_oppose_protectionist_policies: "Выступайте против протекционистской политики" # Oppose Protectionist Policies
 NOR_oppose_protectionist_policies_desc: "Мовинкель и Венстре являются решительными сторонниками экономического либерализма. Однако не многие стремятся следовать этому естественному направлению. Особенно Фермерская партия стремится втянуть Норвегию в протекционизм, не понимая, что свободная торговля будет выгодна фермерам. Даже если они выступят против нас, мы не подчинимся протекционизму." # Mowinckel and Venstre are strong supporters of economic liberalism. However, not many seek to follw this natural direction. Especially the Farmers' Party seek to drag Norway into protectionism, not understanding that free trade will be beneficial to the farmers. Even if they would move against us, we will not bow down to protectionism.
 NOR_promote_liberal_feminism: "Продвигайте либеральный феминизм" # Promote Liberal Feminism
 NOR_promote_liberal_feminism_desc: "В том же году, когда была основана Венстре, была образована Норвежская ассоциация за права женщин. С тех пор мы оба работали ради одной цели. Равенство и демократия для обоих полов на либеральной основе. В последние годы социалистические «феминистки» пытались затмить этих борцов за справедливость и равенство. Нам необходимо защитить либеральную феминистскую традицию, которая предоставила норвежским женщинам это равенство." # The same year Venstre was formed, the Norwegian Association for Women's Rights was formed. Since then, we have both worked towards the same goal. Equality and democracy for both sexes based on a liberal foundation. In recent years, socialist 'feminists' have tried to overshadow these fighters of justice and equality. We need to defend the liberal feminist tradition that have granted Norwegian women this equality.
 NOR_reduce_bureaucracy: "Сократить бюрократию" # Reduce Bureaucracy
 NOR_reduce_bureaucracy_desc: "Правительство должно быть максимально эффективным. Однако с развитием современности наблюдается рост отчуждающей бюрократии, которая заключает людей в бумажную работу и рутину. Мы должны уменьшить это препятствие для нашего народа, гарантируя, что норвежская бюрократия сияет примером эффективности и гуманности." # Government need to be as efficient as possible. However, with the rise of modernity, it has seen a rise of an alienating bureaucracy that cages the people in paperwork and rutines. We should reduce this hurdle upon our people, ensuring that Norwegian bureaucracy shines as an example of efficiency and humanity.
 NOR_ban_political_militias: "Запретить политические формирования" # Ban Political Militias
 NOR_ban_political_militias_desc: "Norsk Samfundsvern и другие группировки ополченцев бросают вызов нашей демократии своими угрозами в адрес противоборствующих сил. Нам необходимо бороться с этим, гарантируя, что каждый, будь он социалистом или консерватором, может участвовать в наших демократических институтах без угроз со стороны вооруженных толп преступников." # Norsk Samfundsvern and other militia groups challenge our democracy with their threats against opposing forces. We need to crack down on this, ensuring that everyone, be they socialist or conservative, can partake in our democratic institutions without threats by armed mobs of criminals.

 NOR_borgerlig_samarbeid: "Гражданское сотрудничество" # Borgerlig Samarbeid
 NOR_borgerlig_samarbeid_desc: "У несоциалистических партий есть общий политический оппонент в лице Социалистической Лейбористской партии. Поэтому для нас естественно объединиться в коалицию против них. Хотя компромиссы будут, по крайней мере, это лучше, чем рисковать социалистическим правительством." # The non-socialist parties have a common political opponent in the socialist Labour Party. It is therefore natural for us to band together in a coalition against them. While there will be compromises, at least it is better than risking a socialist government.
 NOR_status_radio_monopoly: "Статус радиомонополии" # Status of the Radio Monopoly
 NOR_status_radio_monopoly_desc: "В то время как многие представители правых политических взглядов видят необходимость в том, чтобы Норвежская радиовещательная корпорация (NRK) лидировала в распространении радионовостей, у некоторых возникают проблемы с монополией на радио, установленной социалистическим правительством. Боясь, что такая монополия превратит НРК в инструмент идеологической обработки, некоторые правые предлагают отказаться от монополии и субсидировать независимые местные радиостанции по всей стране." # While many on the political right see the need for a Norwegian Broadcasting Corporation (NRK) to lead the way in radio news communication, some have problems with the radio monopoly that the socialist government enacted. Afraid that such a monopoly would make NRK a tool for ideological indoctrination, some right-wingers propose abandoning the monopoly and subsidize independent local radio stations across the country.
 NOR_encourage_new_businesses: "Поощряйте новый бизнес" # Encourage New Businesses
 NOR_encourage_new_businesses_desc: "Царствование социалистического правления было отмечено антибизнес-деятельностью и законами. В результате наши промышленники и бизнесмены оказались под давлением, в результате чего положение нашей страны ухудшилось. Нам нужна новая волна бизнеса и предпринимательства, которая придет в Норвегию и исправит социалистические ошибки." # The reign of socialist governance was a reign marked by anti-business activities and laws. As a result, our industralists and business men was pressured out, leaving our country worse off. We need a new wave of businesses and entrepreneurship to enter Norway to rectify socialist mistakes.
 NOR_rebuild_farming_sector: "Восстановить сельскохозяйственный сектор" # Rebuild the Farming Sector
 NOR_rebuild_farming_sector_desc: "Норвежский фермер, вероятно, больше всего пострадал от экономического кризиса. Поскольку восстановление идет гладко, нам необходимо гарантировать, что наши фермеры смогут восстановить свои фермы и производить продукцию. Это будет включать в себя более высокие субсидии и протекционистскую политику, несмотря на противодействие таким мерам в нашей коалиции." # The Norwegian farmer was probably hit the hardest by the economic crisis. With recovery going smothly, we need to ensure that our farmers are able to rebuild their farms and produce products. This will include higher subsidies and protectionist policies despite the opposition to such measures in our coalition.
 NOR_promote_conservative_officers: "Продвижение консервативных офицеров" # Promote Conservative Officers
 NOR_promote_conservative_officers_desc: "Социалисты в Лейбористской партии раньше применяли дискриминацию при продвижении по службе, часто продвигая офицеров, которые либо симпатизировали Лейбористской партии, либо офицеров, которые не высказывали никакого мнения о правительстве. Это оставило многих талантливых консервативных офицеров в канаве. Нам необходимо исправить ситуацию и признать усилия этих норвежских патриотов." # The socialists in the Labour Party used to discriminate in promotions, often promoting officers that was either sympathetic to the Labour Party or officers who didn't voice any opinion on the government. This left many talented, conservative officers in the ditch. We need to set things right and recognize the efforts of these Norwegian patriots.
 NOR_resolve_monarchy_question: "Решите вопрос о монархии" # Resolve the Monarchy Question
 NOR_resolve_monarchy_question_desc: "Социалисты использовали недостаток знаний народа и популистский призыв, чтобы проголосовать за отмену монархии. В результате проблема так и не была решена полностью. Нам необходимо дать норвежскому народу правильный, справедливый и осознанный выбор, чтобы мы могли положить этому конец раз и навсегда." # The socialists used the people's lack of knowledge and a populist appeal to vote away the monarchy. As a result, the issue was never completely resolved. We need to give a proper, fair and well-informed choice to the Norwegian people so that we can lay this to rest once and for all.

 NOR_hoyre_victory: "Правильная победа" # Høyre Victory
 NOR_hoyre_victory_desc: "Левые по большей части ненавидят Хойре, но у них есть веские причины для своей победы. Им удалось привлечь как либералов, так и консерваторов, и многие крайне правые неохотно их поддержали." # The left, for the most part, hates Høyre, but they have good reasons for their victory. They have been able to attract both liberals and conservatives, and have had many on the far right reluctantly supporting them.
 NOR_integrate_samfundsvern_moderates: "Интеграция модераторов социальной защиты" # Integrate Samfundsvern Moderates
 NOR_integrate_samfundsvern_moderates_desc: "Norsk Samfundsvern и другие ополченцы действительно бросают вызов норвежской демократии. В то же время их членами являются обычные люди, обеспокоенные эксцессами социалистического правительства и властью Лейбористской партии. Приняв некоторые из их посланий, мы можем вернуть некоторых из них к парламентской демократии и обрести лояльную когорту против лейбористов." # Norsk Samfundsvern and other militias do challenge Norwegian democracy. At the same time, their members are everyday people worried about the excesses of socialist government and the power of the Labour Party. By adopting some of their messaging, we can win some of them back to parliamentary democracy and gain a loyal cohort against Labour.
 NOR_leadership_question: "Вопрос лидерства" # The Leadership Question
 NOR_leadership_question_desc: "С тех пор как Ивар Люкке покинул пост лидера Хойре, его место занял Карл Йоахим Хамбро. Хамбро — лидер с сильными ораторскими способностями и сильным упором на перевооружение. Однако некоторые члены партии выступают против него из-за его импровизированного, а иногда и авторитарного руководства. Эта оппозиция сплотилась вокруг Йохана Хенрика Андресена, структурированного бизнесмена, который мог бы вновь привлечь внимание к экономической программе Хойре." # Since Ivar Lykke stepped away from leading Høyre, the position has been filled by Carl Joachim Hambro. Hambro is a leader with strong oratory skills and a strong focus on re-armament. However, some in the party oppose him due to his improvized and sometimes authoritarian leadership. This opposition has rallied behind Johan Henrik Andresen, a structured business man who could bring re-newed focus towards Høyre's economic agenda.
 NOR_limit_anti_parliamentarian_ideas: "Ограничьте антипарламентские идеи" # Limit Anti-Parliamentarian Ideas
 NOR_limit_anti_parliamentarian_ideas_desc: "Возвышение социалистов в наших демократических системах и экономический кризис, который мы пережили, испортили мнение многих людей о парламентской демократии. Хойре также исторически скептически относился к этой системе. Однако сегодня мы знаем преимущества, которые дает эта система. Мы должны работать над ограничением антипарламентских настроений в Норвегии, возвращая людей к демократии." # The rise of socialists through our democratic systems and the economic crisis we have endured have soured many people's opinion on parliamentary democracy. Høyre has also had it's history with scepticism towards this system. However, we know today the benefits that this system gives. We should work to limit the anti-parliamentarian sentiments in Norway, bringing people back to democracy.
 NOR_arm_our_neutrality: "Вооружите наш нейтралитет" # Arm Our Neutrality
 NOR_arm_our_neutrality_desc: "Центральной темой кампании Хойре было перевооружение. При социалистическом правлении наша армия осталась заброшенной. Даже при либералах вопросам готовности уделялось мало внимания. Если Норвегия хочет и дальше оставаться нейтральной страной в Европе, мы должны быть готовы защищать наш нейтралитет и нашу демократию. Помните слова в нашем гимне:\n\n'даже мы, когда этого потребуют, для его мира станем станом'" # A central theme of Høyre's campaign, was re-armament. Under socialist rule, our military has been left abandoned. Even under the liberals, there have been little focus on preparedness. If Norway is to continue to be a neutral country in Europe, we should be ready to defend our neutrality and our democracy. Remember the words in our anthem:\n\n'even we, when it is demanded, for its peace will encamp'
 NOR_lift_socialist_red_tape: "Поднимите социалистическую волокиту" # Lift Socialist Red Tape
 NOR_lift_socialist_red_tape_desc: "С тех пор как социалисты из Лейбористской партии пришли к власти в 1930 году, они делали все возможное, чтобы подорвать нашу экономику, пытаясь реализовать свою догматическую идеологию. Мы должны сократить их правила и налоги, чтобы позволить бизнесу снова дышать. Таким образом, наша экономика снова будет процветать." # Since the socialists in Labour took power in 1930 have they tried everything to undermine our economy in an attempt to fulfill their dogmatic ideology. We should cut back on their regulations and taxes to let business breathe again. This way, our economy will be booming once more.
 NOR_church_and_values: "Церковь и ценности" # Church and Values
 NOR_church_and_values_desc: "Церковь Норвегии сыграла центральную роль в укреплении морального общества, которое социалисты пытались подорвать своей чрезмерно ревностной антихристианской программой. В вопросах образования и социальной политики всегда необходимо поддерживать баланс между поклонением религиозным догмам и поддержкой критического мышления. Мы найдем его, сотрудничая с Церковью, а не борясь против нее." # The Church of Norway has played a central role in fostering a moral society, one the socialists has tried to undermine through their over-zealous anti-Christian agenda. In cases of education and social policies, a balance will always need to be upheld between kowtowing to religious dogma and upholding critical thinking. We will find it by cooperation with the Church, not by crusading against it.
 NOR_moral_case_against_marxism: "Моральные аргументы против марксизма" # The Moral Case Against Marxism
 NOR_moral_case_against_marxism_desc: "Должна быть серьезная дискуссия о моральном значении марксизма. Она повлияла на людей по всему миру своими идеями, которые на бумаге кажутся прекрасными, но привели к авторитаризму. Нам необходимо узнать норвежский народ о реальных последствиях отказа от демократии ради пролетарской революции и найти другие решения для решения проблемы материального неравенства." # There should be a serious discussion over the moral implication of Marxism. It have influenced people across the world with ideas, which on paper sounds lovely, but has resulted in authoritarianism. We need to learn the Norwegian people the real consequences of abandoning democracy for a proletarian revolution, and to find other solutions to handle material inequality.
 NOR_balance_the_books: "Сбалансируйте книги" # Balance the Books
 NOR_balance_the_books_desc: "Социалисты в Лейбористской партии управляют правительством, тратя больше, чем мы. Это привело к тому, что наша страна по колено в долгах. Фискальная дисциплина необходима для того, чтобы взять наши расходы под контроль и достичь баланса. Хотя некоторые будут выступать против предложенного нами сокращения расходов, в конечном итоге после сокращения у нас будет больше денег для расходов." # The socialists in Labour have ran a government on spending more than we have. This has resulted with our country knee-deep in debt. Fiscal discipline is necessary to bring our spending under control and achieve balance. While some would oppose the spending cuts we will propose, we will eventually have more money for spending after the cuts.
 NOR_paternalist_programs: "Патерналистские программы" # Paternalist Programs
 NOR_paternalist_programs_desc: "Причина, по которой социалистам удалось убаюкать рабочий класс, заключается в использовании программ социального обеспечения. Хотя наши амбиции никогда не смогут сравниться с их амбициями, мы должны попытаться противопоставить этим социалистическим взяткам наши собственные идеи о благосостоянии. Основываясь на патерналистских принципах, мы создадим гармоничное государство как для рабочего, так и для начальника." # A reason why the socialists managed to lull the working class into their grasp, is through the use of welfare programs. While our ambitions can never match theirs, we should try to counter these socialist bribes with our own ideas on welfare. Based upon paternalist principles, we will create a harmonious state for both worker and boss.
 NOR_empower_non_socialist_unions: "Расширение возможностей несоциалистических профсоюзов" # Empower Non-Socialist Unions
 NOR_empower_non_socialist_unions_desc: "Национальный профсоюз рабочих — это банда социалистических смутьянов, которые служат интересам революции и Лейбористской партии, а не интересам рабочего класса. Нам необходимо расширить возможности независимых профсоюзов за пределами их досягаемости. Профсоюзы, опирающиеся на протестантскую трудовую этику и патерналистские принципы." # The Workers' National Trade Union are a gang of socialist troublemakers who serve the interest of revolution and the Labour Party over the interest of the working class. We need to empower independent unions outside their reach. Unions who base themselves upon a Protestant work ethic and Paternalist principles.

 NOR_samfundsvernets_coup: "Переворот Самфундсвернета" # Samfundsvernet's Coup
 NOR_samfundsvernets_coup_desc: "Наши люди сейчас маршируют по улицам городов Норвегии. Мы наконец спасли страну от социалистической антиутопии! Мы узнаем, что делать с предателями-социалистами, а пока Норвегия может праздновать эту победу!" # Our men are now marching in the streets of the cities of Norway. We have finally saved the country from socialist dystopia! We will find out what to do with the socialist traitors, but for now, Norway can celebrate this victory!

 NOR_monarchist_victory: "Монархическая победа" # Monarchist Victory
 NOR_monarchist_victory_desc: "В то время как командующий Рагнвальд Хвослеф хочет сделать Видкуна Квислинга министром-президентом, большинство членов Норск Самфундсверн проголосовали за восстановление монархии." # While commander Ragnvald Hvoslef wants to make Vidkun Quisling the minister-president, the majority of the members of Norsk Samfundsvern has voted in favour of reinstating the monarchy.
 NOR_crown_prince: "Наследный принц" # The Crown Prince
 NOR_crown_prince_desc: "Мы боимся, что король Хокон может быть слишком привержен абсолютистской идеологии, что он не будет слушать людей и вместо этого будет править жесткой рукой. Однако его сын, наследный принц Олав, может быть мудрым выбором, поскольку он больше верит в идею о том, что он король для народа." # We are afraid that king Haakon could be too indoctrinated into the absolutist ideology, that he would not listen to the people, and instead rule with a hard hand. His son, however, crown prince Olav, could be a wise choice since he believes more in the idea that he is the king for the people.
 NOR_listen_to_people: "Слушайте людей" # Listen to the People
 NOR_listen_to_people_desc: "Новый король понимает, что его власть исходит не от его богатства и влияния, а от воли народа. Король ослабит правила, направленные против свободы слова, и хочет, чтобы его оппозиция говорила с ним, чтобы он мог слушать и править более мудро. Это также укрепит одобрение короля со стороны общественности." # The new king understands that his powers don't come from his wealth and influence, but from the will of the people. The king will loosen up on the rules that have targeted free speech, and wants his opposition to speak with him so he can listen and rule more wisely. This will also strengthen the king's approval by the public.
 NOR_reach_out_borgerlige_parties: "Обратитесь к вечеринкам Borgerlige" # Reach Out to 'Borgerlige' Parties
 NOR_reach_out_borgerlige_parties_desc: "Королю необходима поддержка большинства политических партий. Эти организации и тех, кто за них голосовал, нужно уважать. Пока они верны королю, они смогут приходить к королю с просьбами." # The king needs to have the support of most of the political parties. These organizations and those who voted for them need to be respected. So long they are loyal to the king, they will be able to come with requests to the king.
 NOR_reestablish_parliament: "Восстановить парламент" # Reestablish the Parliament
 NOR_reestablish_parliament_desc: "Когда страна была спасена из когтей социализма, парламент, к несчастью, был распущен. Теперь, когда все стабилизировалось, пришло время восстановить парламент Норвегии – Стортингет." # When the country was saved from the claws of socialism, the parliament was unluckily dissolved. Now when everything has stabilized, it is time to reestablish the parliament of Norway, Stortinget.
 NOR_kings_party_for_all: "Королевская вечеринка для всех" # A King's Party for All
 NOR_kings_party_for_all_desc: "Хотя король всегда будет беспристрастной фигурой, нам нужна партия короля, которая сможет сделать так, чтобы голос народа был услышан королем. Оставаясь верными нашему монарху, всегда важно не стать самодержцами и деспотами. Народ получит свой голос и свое представительство через Королевскую партию!" # While the King will always serve as an impartial figure, we need a King's Party that can make the voice of the people heard to the king. While staying loyal to our monarch, it is always important that we do not become autocrats and despots. The people shall have their voice and their representation through the King's Party!
 NOR_beyond_partisanship: "За пределами партийности" # Beyond Partisanship
 NOR_beyond_partisanship_desc: "Наше движение выходит за рамки деструктивной и поляризующей природы политических партий. Джордж Вашингтон, человек, который помог провозгласить демократическую республику, лучше, чем кто-либо другой, понимал этот факт о политических партиях:\n'...они, вероятно, с течением времени и событий станут мощными двигателями, с помощью которых хитрые, амбициозные и беспринципные люди смогут подорвать власть народа и узурпировать себе бразды правления, уничтожив впоследствии те самые механизмы, которые подняли их к несправедливому владычеству»." # Our movement is one beyond the destructive and polarizing nature of political parties. George Washington, a man who helped ushering a democratic republic, understood this fact better than anyone else about political parties:\n'...they are likely in the course of time and things, to become potent engines, by which cunning, ambitious, and unprincipled men will be enabled to subvert the power of the people and to usurp for themselves the reins of government, destroying afterwards the very engines which have lifted them to unjust dominion.'
 NOR_towards_center: "К центру" # Towards the Center
 NOR_towards_center_desc: "Королевская партия не является ни правой, ни левой партией. Это полностью Народная и Королевская партия. Он всегда должен находиться в центре норвежской политики. Не на стороне одной части народа, какова судьба правых и левых партий, а на стороне всего народа – и Его Величества, конечно." # The King's Party are not a right-wing nor a left-wing party. It is entirely the People's and the King's Party. It shall always be placed in the center of Norwegian politics. Not on the side of one section of the people, which is the fate of right-wing and left-wing parties, but on the side of all the people - and His Majesty of course.
 NOR_facade_of_democracy: "Фасад демократии" # A Façade of Democracy
 NOR_facade_of_democracy_desc: "В современном мире люди всегда будут искать способ повлиять на политику нации. Нашей обязанностью будет предоставить им «демократический» голос. Однако, поскольку политические партии больше не являются законными, а избирательная система полностью находится под нашим контролем, у нашего народа появится фасад демократического выбора." # In the modern world, the people will always seek a way to influence the policies of the nation. It will be our responsibility to provide them with a 'democratic' voice. However, with political parties no longer legal and the election system entirely under our control, our people will have a façade of a democratic choice.
 NOR_loyalist_propaganda: "Лоялистская пропаганда" # Loyalist Propaganda
 NOR_loyalist_propaganda_desc: "Даже если Королевство Его Величества будет уважать свободу прессы, нам необходимо обеспечить, чтобы пресса, которую они читают, видят и слышат, была нашей прессой. Благодаря пропаганде наш народ узнает правду о величии Его Величества и его повседневном служении своему народу." # Even if His Majesty's Kingdom shall respect the freedom of the press, we need to ensure that the press they read, see and hear is our press. Through propaganda, our people will know our truth about the greatness of His Majesty and his everyday service to his people.
 NOR_king: "Король" # The King
 NOR_king_desc: "Было бы предательством говорить, что мы должны избрать бывшего наследного принца королем, когда настоящий король еще жив. Король Хокон известен тем, что скатился к более авторитарным взглядам на управление, но, в конце концов, он наш истинный и благородный монарх." # It is treason to say we should pick the former crown prince as king when the real king is still alive. King Haakon is known for sliding into a more authoritarian view on governing, but he is, after all, our true and honourable monarch.
 NOR_royal_guard_police_forces: "Полицейские силы Королевской гвардии" # A Royal Guard Police Force
 NOR_royal_guard_police_forces_desc: "Королевская гвардия имеет большой опыт гвардейской службы и могла бы использовать этот опыт для дальнейшего укрепления наших полицейских сил. Кроме того, это стало бы для верных гвардейцев способом обеспечить контроль над норвежской полицией, обеспечив ее лояльность королю." # The Royal Guards have great experience as guardsmen and could use this experience to further strengthen our police forces. In addition, this would be a way for loyal guardsmen to secure control over the Norwegian police, ensuring its loyalty to the King.
 NOR_subjugate_samfundsvernet: "Подчинение социального обеспечения" # Subjugate Samfundsvernet
 NOR_subjugate_samfundsvernet_desc: "Самфундсвернет был верен в восстановлении короля на троне. Однако они преданы не нашему монарху, а таким людям, как Рагнвальд Хвослеф, и видениям, которые могут подвергнуть наше королевство опасности. Нам нужно их усмирить, гарантируя, что они не представляют угрозы. Надеюсь, некоторые из них захотят присоединиться к нам." # Samfundsvernet have been loyal in restoring the King to the throne. However, their loyalty aren't to our monarch, but to men like Ragnvald Hvoslef and visions that could place our Kingdom in danger. We need to pacify them, ensuring that they doesn't pose a threat. Hopefully some of them are willing to join us.
 NOR_modern_royal_titles: "Современные королевские титулы" # Modern Royal Titles
 NOR_modern_royal_titles_desc: "Сегодня в некоторых обществах к членам королевской семьи относятся как к неважным людям. Но реальность такова, что такая вера сама по себе является предательством. Члены королевской семьи избраны Богом для правления, и им должны быть предоставлены их законные привилегии." # In some societies today, the Royals are treated like unimportant people. But the reality is that such belief is treason in itself. The Royals are chosen by God to rule and should be given their rightful privileges.
 NOR_christian_moral_society: "Христианское нравственное общество" # A Christian, Moral Society
 NOR_christian_moral_society_desc: "Его Величество видит среди людей немало отпавших от Церкви и прославляющих безнравственность. Это терпеть не может. По его воле все воспитываются в ценностях нашей христианской веры и чтобы ценности нашей Церкви распространялись во всем нашем обществе. Имя Бога будет знать каждый!" # His Majesty see many among the people who have fallen from the Church and who celebrates immorality. This can't stand. It is in his will that all are educated in the values of our Christian faith and that the values of our Church are enforced throughout our society. Everyone will know the name of God!
 NOR_punish_socialists: "Наказать социалистов" # Punish the Socialists
 NOR_punish_socialists_desc: "Государственная измена, коррупция, захват власти, восстание.\nВсе преступления, в которых виновны норвежские социалисты Лейбористской партии. Хотя это преступления, которые легко могут привести к казни, король хочет проявить милосердие к этим гражданам, которые обидели его, и вместо этого выносит им только легкие приговоры - например, пожизненное заключение." # High Treason, Corruption, Seizure of Power, Insurrection.\nAll crimes that the Norwegian socialists in the Labour Party are guilty of. While these are crimes that would easily lead to execution, the King want to show his mercy towards these citizens that have wronged him and only give them light sentences - like life imprisonment - instead.
 NOR_empower_fagopposisjonen: "Расширение возможностей профсоюзной оппозиции" # Empower Fagopposisjonen
 NOR_empower_fagopposisjonen_desc: "Национальный профсоюз рабочих известен своей коррупцией и социализмом. Однако внутри него поднялась оппозиционная группа в поддержку нашего короля и порядочности. Хотя старую организацию необходимо снести, эта группа лояльных представителей рабочих сформирует основу Профессиональной организации Норвежского королевства." # The Workers' National Trade Union are known for their corruption and socialism. However, an opposition group inside it has rose up in support of our King and of decency. While the old organization need to be torn down, this group of loyal workers' representatives will form the basis for the Professional Organization of the Norwegian Realm.
 NOR_paternalist_economics: "Патерналистская экономика" # Paternalist Economics
 NOR_paternalist_economics_desc: "Условия, которые позволяли капиталистам эксплуатировать своих рабочих и которые также способствовали разжиганию опасной болезни, известной как социализм, никогда больше не повторятся. На капиталисте лежит обязанность заботиться о благосостоянии своих рабочих, а в противном случае он потеряет свой бизнес." # The conditions that allowed capitalists to exploit their workers, which also helped fuel the dangerous sickness known as socialism, shall never happen again. It is the responsibility of the capitalist to take care of his workers welfare, and if not, he will lose his business.
 NOR_benevolent_monarch: "Доброжелательный монарх" # A Benevolent Monarch
 NOR_benevolent_monarch_desc: "Его Величество видит многих людей, которые изо дня в день борются в своей стране. Это терпеть не может. Именно по его воле государство предоставляет такие услуги, как пособия по безработице, пенсии и по беременности и родам. Услуги, которые больше всего помогают нашим борющимся гражданам. Никто не ляжет спать голодным!" # His Majesty see many among the people who struggle day to day in his country. This can't stand. It is in his will that the state provide services such as unemployment, pensioner and maternity benefits. Services that help our stuggling citizens the most. No one will go to bed hungry!
 NOR_voluntary_work_service: "Служба волонтерской работы" # Voluntary Work Service
 NOR_voluntary_work_service_desc: "Его Величество видит многих людей, не имеющих работы в его стране. Это терпеть не может. По его воле мы организуем добровольную трудовую службу, где молодые люди смогут служить своему королю и своей нации, а взамен получат помощь на пути к стабильному трудоустройству. Никто не будет рабом бедности!" # His Majesty see many among the people without employment in his country. This can't stand. It is in his will that we organize a voluntary work service where young men can serve their King and their nation, and in return be helped on the path of steady employment. No one will be slave to poverty!
 NOR_work_with_ns: "Работа с НС" # Work With NS
 NOR_work_with_ns_desc: "Многие члены совета сочли бы этот шаг опасным. Допуск «Насьонал Самлинг» в совет может оказаться проблематичным для некоторых людей из-за их политических позиций. Но король считает, что это поможет стабилизировать королевство." # Many of the people in the council would see this move as dangerous. To allow Nasjonal Samling into the council could be troublesome for some people, because of their political stands. But the king believes this will help in stabilizing the kingdom.
 NOR_entrench_strict_loyalty: "Укрепить строгую лояльность" # Entrench Strict Loyalty
 NOR_entrench_strict_loyalty_desc: "Нам нужно обеспечить лояльность народа королю. С помощью пропаганды мы представим короля как отцовскую фигуру, которую люди, естественно, должны уважать и любить. Мы также должны обеспечить, чтобы против короля и его личности не было клеветы и дурных слов." # We need to secure the loyalty of the people to the King. Through the powers of propaganda, we will present the King as a Paternal figure that the people naturally should respect and love. We should also secure that no slander and ill speak is done against the King and his person.
 NOR_absolute_rule: "Абсолютное правило" # Absolute Rule
 NOR_absolute_rule_desc: "Хотя людям нашего времени будет трудно это понять, король действительно имеет право править от Бога. Вместо того, чтобы отдавать предпочтение одной части народа, чтобы она управляла от имени Его Величества, управление должно осуществляться под руководством абсолютного монарха. Таким образом, все его люди будут иметь равные возможности связаться с ним." # While it will be hard for a people of a modern time to understand, the King does have the right to rule from God. Instead of favoring one section of the people to rule on behalf of His Majesty, governing should be done under an Absolute monarch. That way, all his people have an equal opportunity to reach out to him.
 NOR_enlighten_absolutism: "Просвещенный абсолютизм" # Enlightened Absolutism
 NOR_enlighten_absolutism_desc: "Эпоха Просвещения принесла миру много хорошей философии, идей и технологий. К сожалению, это также подлило масла в огонь движениям, которые сместили своих монархов от власти. Однако из этой эпохи такие деятели, как Екатерина II в России, Карл III в Испании и Фридрих Великий, поднялись и стали отстаивать просвещенную форму абсолютизма. Форма, которая уравновешивала право короля на управление с улучшением общества для его граждан. Форма, у которой Норвегии следует поучиться." # The Age of Enlightenment brought a lot of good philosophy, ideas and technology to the world. Unfortunately, it also gave fuel to movements who displaced their monarchs from power. Out from this era however, figures like Catherine II of Russia, Charles III of Spain and Frederick the Great rose to champion an Enlightened form of Absolutism. A form that balanced the King's right to rule with improvement of society for its citizens. A form Norway should learn from.
 NOR_quisling_in_cabinet: "Квислинг в кабинете министров" # Quisling in Cabinet
 NOR_quisling_in_cabinet_desc: "Хотя король Хокон не является самым большим поклонником Видкуна Квислинга, он признает, что Квислинг может стать ценным союзником, если республиканские силы снова поднимутся. Привлечение Квислинга и его сторонников в правительство Его Величества могло бы помочь гарантировать, что «Национальная Самлинг» не создаст никаких проблем." # While King Haakon isn't the biggest fan of Vidkun Quisling, he achknowledge that Quisling can be a valuable ally if Republican forces rises again. Bringing Quisling and his supporters into His Majesty's government could help in ensuring that Nasjonal Samling doesn't create any trouble.
 NOR_utilize_ns_structures: "Используйте NS-структуры" # Utilize NS Structures
 NOR_utilize_ns_structures_desc: "В «Национальной выборке» имеется множество внутрипартийных структур, включающих организации для мужчин и женщин всех возрастов. Эти сооружения могли быть использованы на службе его величеству. Конечно, антимонархические элементы необходимо искоренить. Кроме того, многие члены НС готовы служить своему королю." # Nasjonal Samling have many intraparty structures, with organizations for men and women of all ages. These structures could be used in the service of his majesty. Of course, anti-monarchist elements need to be rooted out. Besides that, many NS members are willing to serve their King.
 NOR_heir_of_st_olav: "Наследник Святого Олава" # The Heir of St. Olav
 NOR_heir_of_st_olav_desc: "Все норвежские короли обретают свою легитимность через Бога. Однако эта легитимность не предоставляется непосредственно каждому королю. Оно даровано им как законным наследникам святого Олава, короля, принесшего христианскую веру в Норвегию. Король Хокон VII не является легитимным только из-за народного голосования в 1905 году. Он легитимен, потому что является наследником Вечного короля Норвегии!" # All Norwegian kings gain their legitimacy through God. However, this legitimacy isn't given directly to each king. It is granted to them as the legitimate heir of Saint Olav, the King who brought the Christian faith to Norway. King Haakon VII isn't legitimate only because of the people's vote in 1905. He is legitimate because he is the heir of Norway's Eternal King!
 NOR_long_live_the_king: "Да здравствует король" # Long Live the King
 NOR_long_live_the_king_desc: "Норвежский король – воплощение норвежской нации. Он призван управлять людьми как помазанный слуга Христа. Правление короля не похоже на правление господина над своими рабами. Вместо этого наш король — восседающий на троне слуга норвежского народа.\n§YДа живет он, да здравствует король!§!" # The Norwegian King are the embodiment of the Norwegian nation. He are set to rule the people as an anointed servant of Christ. The King's rule is not like the master's rule over his slaves. Instead, our King is an enthroned servant of the Norwegian people.\n§YLong may he live, Long Live the King!§!

 NOR_NS_victory: "НС Победа" # NS Victory
 NOR_NS_victory_desc: "Хотя есть много членов, которые хотят либо демократии, либо монархии, большинство, во главе с командующим Рагнвальдом Хвослефом, проголосовали за то, чтобы «Насьонал Самлинг» взял на себя управление в Норвегии. Видкун Квислинг станет новым министром-президентом Норвегии." # While there are many members that want either democracy or monarchy, the majority, with commander Ragnvald Hvoslef at the front, have voted for Nasjonal Samling to take control in Norway. Vidkun Quisling will become the new minister-president of Norway.
 NOR_promote_loyal_policemen: "Продвигайте лояльных полицейских" # Promote Loyal Policemen
 NOR_promote_loyal_policemen_desc: "С тех пор как социалисты пришли к власти, они попытались взять под свой контроль полицию и очистить ее от национально мыслящих офицеров. К счастью, им это не удалось. В полиции много симпатизирующих нашей партии. Мы можем обеспечить лояльность полиции, продвигая этих офицеров на руководящие должности." # Since the socialists came to power, they have attempted to take control over the police and purging it of nationally-minded officers. Luckily, they did not succeed. There are many within the police sympathetic to our party. We can assure the loyalty of the police by promoting these officers into leadership positions.
 NOR_remove_socialist_cancer: "Удалить социалистический рак" # Remove the Socialist Cancer
 NOR_remove_socialist_cancer_desc: "В Норвегии по-прежнему свирепствует сопротивление социалистов. Это московское влияние заставляет добрых норвежских мужчин и женщин поднимать оружие против нашей нации. Нам необходимо вычистить эту социалистическую раковую опухоль как из общества, так и из умов норвежских рабочих." # Resistance from the socialists are still rampant in Norway. This Moscowite influence causes good Norwegian men and women to take up arms against our nation. We need to purge out this socialist cancer, both from society and from the minds of the Norwegian workers.
 NOR_subdue_monarchists: "Подчинить монархистов" # Subdue the Monarchists
 NOR_subdue_monarchists_desc: "Монархисты были хорошим союзником в достижении нашей цели, но они более лояльны к изгнанному датчанину, чем к нации. Хотя монархия могла бы быть полезной для объединения и сдерживания консервативных сил в Норвегии, это архаичный институт, который, вероятно, будет бороться с нашими лидерами за доминирование." # The monarchists have been a good ally to achieve our goal, but they are more loyal towards an exciled Dane than towards the nation. While monarchy could be useful to unite and temper the conservative forces in Norway, it is an archaic institution which likely would fight against our leaders for dominance.
 NOR_enforce_jodeparagrafen: "Обеспечьте соблюдение еврейской оговорки" # Enforce Jødeparagrafen
 NOR_enforce_jodeparagrafen_desc: "В 1814 году отцы-основатели нашей конституции осознали угрозу, которую дает католикам и евреям получить слишком большую власть и влияние в Норвегии. Хотя мы по-прежнему запрещаем католикам-иезуитам въезд в королевство, мы, к сожалению, позволили евреям и их влиянию войти. Путем внесения изменений в конституцию и обеспечения соблюдения этого параграфа мы, наконец, можем «помочь» нашим еврейским соседям переехать. Либо обратно в Восточную Европу, либо в Палестину, либо в другое место." # In 1814, the founding fathers of our constitution understood the threat in allowing Catholics and Jews to gain too much power and influence in Norway. While we still forbid Catholic Jesuits from entering the realm, we sadly allowed Jews and their influence to come in. Through reamending the constitution and enforcing the paragraph, we can finally 'help' our Jewish neighbors to move. Either back to Eastern Europe, to Palestine or another place.
 NOR_norges_faggruppeorganisasjon: "Норвежская профессиональная ассоциация" # Norges Faggruppeorganisasjon
 NOR_norges_faggruppeorganisasjon_desc: "В отличие от либеральных капиталистов, мы понимаем необходимость того, чтобы норвежские рабочие были представлены и услышаны. Хотя Национальный профсоюз рабочих отравлен социализмом, все еще существует меньшинство, которое стремится отделить борьбу за норвежских рабочих от международного марксистского социализма. Они станут основой Норвежской организации профессиональных работников." # Unlike the liberal capitalists, we understand the need for the Norwegian workers to be represented and heared. While the Workers' National Trade Union is poisoned by socialism, a minority still exist that seek to decouple the fight for Norwegian workers from international marxist socialism. They will form the foundation for a Norwegian Organization of Professional Workers.
 NOR_establish_arbeidstjenesten: "Создать Службу занятости" # Establish Arbeidstjenesten
 NOR_establish_arbeidstjenesten_desc: "Столкнувшись с безработицей и бездействием, многие видят необходимость организовать службу трудоустройства для молодых норвежских мужчин. Сюда они могут прийти на работу и внести свой вклад в общество, а трудовая служба может стать хорошим способом дальнейшего трудоустройства либо в армии, либо в смежных сферах деятельности." # Faced by unemployment and inactivity, many see the need to organize a work service for young Norwegian men. Here, they can come to work and contribute to society, while the work service can be a good way for further employment in either the military or in related work fields.
 NOR_agrarian_revitalization: "Аграрное возрождение" # Agrarian Revitalization
 NOR_agrarian_revitalization_desc: "Аграрный сектор находится в стагнации после экономической депрессии. Многие фермеры изо всех сил пытались погасить долги и выжить, в то время как богатые горожане продолжали их эксплуатировать. Нам нужны серьезные инвестиции в норвежских фермеров, помогающие им восстановить свою жизнь и модернизировать свои фермы." # The agrarian sector has been stagnant since the economic depression. Many farmers struggled to pay off debt and survive while the rich city-folk continued to exploit them. We need serious investments into the Norwegian farmers, helping them to rebuild their lives and to modernize their farms.
 NOR_integrate_samfundsvernet: "Интегрируйте социальное обеспечение" # Integrate Samfundsvernet
 NOR_integrate_samfundsvernet_desc: "Samfundsvernet оказали большую помощь в свержении социалистического режима. Однако они слишком часто действуют как организации, находящиеся на обочине нашего правительства. У нас не может быть военных организаций, которые не были бы полностью лояльны к «Национал Самлингу». Однако многие в их рядах поддерживают нас и могут легко поменять свою форму Samfundsvern на форму от Hirden." # Samfundsvernet have been a great help in overthrowing the socialist regime. However, they operate too much as an organization on the sideline of our government. We can't have military organizations that are not completely loyal to Nasjonal Samling. However, many in their ranks support us and they can easily swap out their Samfundsvern uniforms with uniforms from Hirden.
 NOR_militarize_hirden: "Военизированный Хирден" # Militarize Hirden
 NOR_militarize_hirden_desc: "«Хирден» — военизированная организация, верная воле и целям «Национал Самлинг». До сих пор они действовали как охрана и дополнительные полицейские подразделения. Нам необходимо милитаризировать их, сделав при этом естественной частью норвежских сил и общества. На всех уровнях наших вооруженных сил будет ощущаться влияние наших Хирдменов." # Hirden is a paramilitary organization loyal to the will and goals of Nasjonal Samling. Until now, they have acted like guards and extra police units. We need to militarize them while making them a natural part of the Norwegian forces and society. In all levels of our armed forces, the influence of our Hirdmenn will be felt.
 NOR_heim_ett_fedreland: "Дом, Клан, Федреланд" # Heim, Ætt, Fedreland
 NOR_heim_ett_fedreland_desc: "Дом, Семья и Отечество. Эти слова подчеркивают ценности, которые наш режим стремится сохранить. Мы хотим, чтобы Норвегия стала родиной здорового и правильного норвежского народа. Самой сильной защитницей национальных ценностей как в прошлом, так и в современности была норвежка. Хотя некоторые рассматривают обязанности по воспитанию детей как способ угнетения женщин, мы знаем и ценим положение, которое расширяет возможности женщин Норвегии." # Home, Family and Fatherland. These words underline the values that our regime seeks to preserve. We want Norway to be a homeland for a healthy and proper Norwegian people. The strongest defenders of national values, both in the past and in modernity, has been the Norwegian woman. While some have seen childrearing responsibilities as a way to oppress women, we know and appreciate the empowering position this gives the women of Norway.
 NOR_festning_norge: "Крепость Норвегия" # Festning Norge
 NOR_festning_norge_desc: "Наша страна не окружена друзьями. Нам необходимо защитить наше побережье и моря от имперских амбиций, воплощаемых французами и британцами. Нам нужно превратить нашу страну в крепость!" # Our country is not surrounded by friends. We need to protect our coast and seas from the imperial ambitions enbodied by the French and the British. We need to make our nation into a fortification!
 NOR_work_camp_for_socialists: "Трудовые лагеря для социалистов" # Work Camps for Socialists
 NOR_work_camp_for_socialists_desc: "Слишком дорого стоит позволить социалистам и марксистам-предателям гнить в тюрьме. Вместо этого мы должны заставить их выполнять тяжелую работу в общинах и на фабриках, конечно, под надзором лояльных членов НС." # It is too costly to let the socialist and Marxist traitors rot in prison. Instead, we should force them to do hard work in the communities and in the factories, of course, overseen by loyal members of NS.
 NOR_approach_valkist_factionalism: "Подход Валкистский фракционализм" # Approach Valkist Factionalism
 NOR_approach_valkist_factionalism_desc: "Хотя социалисты свергнуты, власть нашего предка еще не в безопасности. С каждым днем ​​мы видим растущее разделение между теми, кто верен руководству Видкуна Квислинга, и теми, кто стремится подтолкнуть Норвегию к валькистскому направлению. Возглавляемые Хансом С. Якобсеном, они ищут более радикальное направление развития нашей страны." # While the Socialists are ousted, the power of our fører isn't yet secure. For every day that passes, we see increasing division between those loyal to the leadership of Vidkun Quisling and those who seek to move Norway more towards a Valkist-inspired direction. Led by Hans S. Jacobsen, they seek a more radical direction for our country.
 NOR_entrench_ns_rule: "Укрепить правило Квислинга" # Entrench Quisling's Rule
 NOR_entrench_ns_rule_desc: "Многие вызовы правлению Квислинга пытались восстать против нашего лидера. К счастью, с ними разобрались, поскольку противников либо отстранили, либо выгнали как «послов» в Германию. Эти внутренние социалисты больше не будут бросать вызов стабильности норвежского общества и процветающему будущему, к которому мы стремимся под руководством Видкуна Квислинга." # The many challenges against Quisling's rule tried to rise up against our leader. Luckily, they have been dealt with as the opponents are either sidelined or kicked out as 'envoys' to Germany. No longer will these internal socialists challenge the stability of Norwegian society and the prosperous future we seek under the leadership of Vidkun Quisling.
 NOR_reforged_christian_church: "Перекованная христианская церковь" # A Reforged Christian Church
 NOR_reforged_christian_church_desc: "Когда мы пришли к власти, в Норвежской церкви все еще было много противников. Однако с тех пор мы работали над тем, чтобы привести институты Церкви в соответствие с нашим имиджем. У Квислинга также есть несколько собственных идей, которые он называет «универсизмом», которые мы могли бы попытаться реализовать в этой обновленной Церкви." # When we took power, there were still many in the Norwegian Church who opposed it. However, we have since then worked to mend the institutions of the Church into our image. Quisling also has a few ideas of his own, what he call 'Universism', which we could seek to implement in this reforged Church.
 NOR_integrate_capitalist_class: "Интегрируйте класс капиталистов" # Integrate the Capitalist Class
 NOR_integrate_capitalist_class_desc: "Многие капиталисты скептически относились к режиму Квислинга из-за социалистических тенденций некоторых наших членов. Однако Квислинг и его ближайшее окружение далеки от социалистов. Вместо этого они стремятся к такой экономике, в которой различные слои общества работают вместе на благо нации." # Many capitalists have been sceptical towards the Quisling regime due to the socialist tendencies from some of our members. However, Quisling and his closest circle are far from socialists. Instead, they seek an economy where the different sections of society work together for the betterment of the nation.
 NOR_loyalty_to_foreren: "Лояльность к водителю" # Loyalty to Føreren
 NOR_loyalty_to_foreren_desc: "Верность Видкуну Квислингу, føreren, является важным условием нашей нации. Квислинг спас Норвегию от разрушения силами социализма и поведет страну в процветающее будущее. Только под его руководством Норвегия снова станет великой." # Loyalty to Vidkun Quisling, føreren, is an important tenant of our nation. Quisling has saved Norway from destruction by the forces of socialism, and he will lead the country into a prosperous future. Only under him will Norway ever be great again.
 NOR_depose_quisling: "Свергнуть Квислинга" # Depose Quisling
 NOR_depose_quisling_desc: "Видкун Квислинг пал. Хотя он доблестно боролся против разрушительных сил социализма и либеральной демократии в Норвегии, в конечном итоге он был слабым правителем, который считал, что у него есть силы возглавить нашу страну. Теперь мы, наконец, можем направить Норвегию к лучшему будущему для всего ее народа." # Vidkun Quisling has fallen. While he fought valiantly against the corrosive forces of socialism and liberal democracy in Norway, he was ultimately a weak ruler who believed himself to have the strength to lead our nation. Now, we can finally steer Norway into a better future for all it's people.
 NOR_paetelist_principles: "Принципы петелиста" # Paetelist Principles
 NOR_paetelist_principles_desc: "Нас вдохновляют идеи социализма Карла Отто Паэтеля на основе национализма, а не марксистского интернационализма. Вместо того чтобы идти на компромисс с непостоянным классом капиталистов, как это сделал бы Квислинг, нам нужно поставить экономику под национальный контроль. Экономика, которая будет работать на рабочих и фермеров, а не на капиталистов." # We are inspired by Karl Otto Paetel's ideas of socialism under the basis of nationalism instead of marxist internationalism. Instead of compromising with the fickle capitalist class, like Quisling would do, we need to have the economy under national control. An economy which would work for workers and farmers, not for the capitalists.
 NOR_end_white_christs_influence: "Положить конец влиянию Белого Христа" # End White Christ's Influence
 NOR_end_white_christs_influence_desc: "Иисус Христос, также известный как Белый Христос, и его последователи часто доказывали, что способны сдерживать Норвегию. Это неудивительно, поскольку он пришел для того, чтобы поставить Норвегию под сапоги папистов, и ситуация не изменилась, даже если он принял протестантскую форму. Чтобы продолжить нашу национальную революцию, нам нужно положить конец влиянию Христа и Его Церкви на Норвегию." # Jesus Christ, also known as White Christ, and his followers have often proven themselves to hold Norway back. It isn't surprising since he came as a way to force Norway under Papist boots, and it hasn't changed even if he took on a Protestant form. To continue our national revolution, we need to end the influence that Christ and his Church has over Norway.
 NOR_meritocratic_order: "Меритократический орден" # A Meritocratic Order
 NOR_meritocratic_order_desc: "Хотя мы не полностью против принципа наличия лидера, «фёрера», мы не поддерживаем передачу лидерства такому придурку, как Квислинг. Мы стремимся построить меритократическую систему снизу вверх, которая вознаграждает военное и интеллектуальное мастерство. Система, в которой лучшие бойцы Норвегии имеют больше шансов возглавить нацию, чем выродившаяся элита прошлых лет." # While we aren't totally against the principle of having a leader, a 'fører', we don't support giving leadership to a bozo like Quisling. We seek to build a meritocratic system from the buttom-up that awards military and intellectual prowess. A system where Norway's best fighters have a greater chance to lead the nation than the degenerate elites of yesteryears.
 NOR_rikstinget: "Рикстингет" # Rikstinget
 NOR_rikstinget_desc: "Нам необходимо разрушить сломанные системы прошлого. Создание Рикстингета не будет продолжением ошибок прошлого. Вместо этого разные слои нашего народа; рабочие, фермеры, горожане и т. д. будут объединены, чтобы работать над нашим видением Норвегии." # We need to overturn the broken systems of old. The establishment of Rikstinget will not be one of continuing the faults of the past. Instead, the different sections of our people; workers, farmers, city-folk, etc. will be united to work for our vision for Norway.
 NOR_with_spirit_st_olav: "Дух Святого Олафа" # The Spirit of St. Olav
 NOR_with_spirit_st_olav_desc: "Важным символом партии является Солнечный Крест. Часто его называют Крестом Олава. Мы действительно следуем по стопам святого Олафа. Он объединил Норвегию в христианское царство, и мы последуем его примеру, объединяя норвежский народ в национальное сообщество. Это дух святого Олафа течет в нашей норвежской крови." # An important symbol for the party is the Sun Cross. Often, it is mentioned as the Olav Cross. It is indeed the steps of Saint Olav we follow. He united Norway into a Christian realm, and we will follow in uniting the Norwegian people into a national community. It is the spirit of Saint Olav that flows in our Norwegian blood.
 NOR_spirit_germanic_volk: "Дух германского народа" # The Spirit of A Germanic Volk
 NOR_spirit_germanic_volk_desc: "Норвежский народ не является чем-то отдельным от окружающего его мира. Все они являются частью германского сообщества, сообщества народов Скандинавии и немецких земель. Борьба немецкого народа нам не чужда, мы разделяем ее как часть Народа. Этот дух жив в нас, как и в немцах." # The Norwegian people isn't an entity separate from the world around them. They are all a part of a Germanic community, a community of the peoples of the Nordics and of the German lands. The struggles of the German people aren't foreign to us, we share them as part of a Volk. This spirit is alive in us, as it is in the Germans.

 NOR_looking_outwards: "Глядя наружу" # Looking Outwards
 NOR_looking_outwards_desc: "Мир становится все более беспокойным со времен Великой войны. Хотя Норвегии удалось выжить в мире, придерживаясь своего нейтралитета, некоторые считают растущую напряженность признаком того, что нам необходимо переоценить эту позицию." # The world is growing more and more unrestful ever since the Great War. While Norway has managed to survive in peace with its neutrality, some see the rising tension as a sign that we need to re-evaluate this stance.
 NOR_spreading_revolution: "Распространение революции" # Spreading the Revolution
 NOR_spreading_revolution_desc: "Социалистическая революция не может быть сосредоточена в одной стране или одном народе. Проблемы рабочего класса разделяют рабочие всех стран, и мы должны делать свою работу по освобождению рабочих соседних стран. Некоторые в нашем движении видят в Панскандинавском движении источник вдохновения, призванный принести свободу рабочим всех стран Северной Европы." # The Socialist revolution can not be contained in one country or to one people. The challenges of the working class is shared by the workers of every country, and we need to do our job to liberate the workers of neighboring nations. Some in our movement see the Pan-Scandinavian movement as an inspiration to bring freedom to the workers of all the Nordics.
 NOR_support_danish_left: "Поддержите датских левых" # Support the Danish Left
 NOR_support_danish_left_desc: "Датские республиканцы и коммунисты поддерживают наш социализм и, вероятно, будут симпатизировать союзу Норвегии и Дании. Направление им поддержки и вербовка некоторых из них было бы очевидным шагом, прежде чем мы свергнем датскую буржуазию и установим социалистическое единство." # The Danish Republicans and Communists are in support of our socialism and will likely be sympathetic to a union between Norway and Denmark. Sending them support and recruiting some of them would be a obvious move before we overthrow the Danish bourgeoisie and establish socialist unity.
 NOR_secure_denmark: "Безопасная Дания" # Secure Denmark
 NOR_secure_denmark_desc: "Пришло время захватить Данию. Если они коллеги-социалисты, они, скорее всего, поймут причину и присоединятся к нам без боя. Если они реакционеры, мы должны раздавить их и освободить датский рабочий класс. За революцию!" # It is time to take over Denmark. If they are fellow socialists, they will likely see reason and join us without a fight. If they are reactionaries, we have to crush them and free the Danish working class. For the Revolution!
 NOR_harbour_swedish_revolutionaries: "Гавань шведских революционеров" # Harbour Swedish Revolutionaries
 NOR_harbour_swedish_revolutionaries_desc: "Есть много шведских социалистов, членов Социалистической и Коммунистической партий, которые могут быть готовы работать с нами в достижении освобождения шведского народа. Рабочий класс Швеции не наш враг, у нас есть общий враг в лице реакционного режима, который его угнетает." # There are many Swedish socialists, members of the Socialist and Communist parties, that can be willing to work with us in achieving liberation for the Swedish people. The working class of Sweden isn't our enemy, we have a common enemy in the reactionary regime that oppresses them.
 NOR_a_swedish_revolution: "Шведская революция" # A Swedish Revolution
 NOR_a_swedish_revolution_desc: "Пришло время перенести революцию на восток, в Швецию, и добиться единства между норвежским и шведским рабочим классом. Если они коллеги-социалисты, они, скорее всего, прислушаются к нашему разуму. Если они реакционеры, мы должны раздавить их и освободить шведский рабочий класс. За революцию!" # It is time to bring the revolution east, into Sweden, and bring unity between the Norwegian and Swedish working class. If they are fellow socialists, they will likely listen to our reason. If they are reactionaries, we have to crush them and free the Swedish working class. For the Revolution!
 NOR_work_with_finnish_reds: "Работа с финскими красными" # Work With the Finnish Reds
 NOR_work_with_finnish_reds_desc: "В своей борьбе за независимость финские красные пытались освободить рабочий класс. Хотя им дали отпор буржуазные реакции, они все еще могут быть великим союзником в освобождении Финляндии. И рабочие Норвегии, и рабочие Финляндии имеют общего врага в лице буржуазии, которая разделяет нас." # In its fight for independence, the Finnish Reds attempted to free the working class. While they were fought back by the bourgeois reactionaries, they can still be a great ally in liberating Finland. Both the workers of Norway and the workers of Finland has a common enemy in the bourgeoisie who keeps us separated.
 NOR_march_into_finland: "Марш в Финляндию" # March Into Finland
 NOR_march_into_finland_desc: "Настало время идти в Финляндию, освобождать своих рабочих от цепей и объединяться в одну социалистическую страну. Если они коллеги-социалисты, они, скорее всего, присоединятся к нам. Если они реакционеры, мы раздавим их молотом рабочего. За революцию!" # It is time to march into Finland, to liberate their workers from their chains, and unite into one socialist country. If they are fellow socialists, they will likely join us. If they are reactionaries, we will crush them with the hammer of the worker. For the Revolution!
 NOR_scandinavian_socialist_republics: "Скандинавские Социалистические Республики" # The Scandinavian Socialist Republics
 NOR_scandinavian_socialist_republics_desc: "С падением последнего реакционного режима в Скандинавии красные знамена реют теперь над Северной Европой. Но мы должны показать, что мы освободители, а не завоеватели. Рабочие из всех стран Северной Европы; В освобождении этой земли участвовали Норвегия, Швеция, Дания и Финляндия. Поэтому нам следует образовать союз социалистических республик между этими братскими народами." # With the fall of the last reactionary regime in Scandinavia, red banners fly now over Northern Europe. But we have to show that we are liberators, not conquerors. Workers from all the Nordic countries; Norway, Sweden, Denmark and Finland participated to liberate this land. So we should form a union of socialist republics between these brethren peoples.
 NOR_reconstruction_and_integration: "Реконструкция и интеграция" # Reconstruction and Integration
 NOR_reconstruction_and_integration_desc: "Конфликты, которые привели к этому объединению, оставили эти скандинавские земли в руинах. И в знак нашей приверженности этому союзу, и в качестве способа интеграции наших новых земель мы должны финансировать восстановление промышленности и инфраструктуры. Благодаря этим усилиям мы сможем объединить наши страны." # The conflicts that have led to this unification has left these Scandinavian lands in ruin. Both as a sign of our commitment to this union and as a way to integrate our new lands, we should fund the reconstruction of industries and infrastructure. Through this effort, we will be able to bind our nations together.
 NOR_socialist_scandinavianism: "Социалистический скандинавизм" # Socialist Scandinavianism
 NOR_socialist_scandinavianism_desc: "Панскандинавский проект XIX века, возможно, возглавлялся в первую очередь буржуазными либералами, но некоторые из их идей все еще ценны. Даже если наша социалистическая идеология отдает приоритет интернационализму, мы можем использовать скандинавский паннационализм для укрепления международного сотрудничества между различными народами Скандинавии." # The Pan-Scandinavian project of the 19th century may have been led primarily by bourgeoisie liberals, but some of their ideas are still valuable. Even if our socialist ideology prioritizes internationalism, we can use Scandinavian Pan-Nationalism to strengthen the international cooperation between the different nations of Scandinavia.
 NOR_nordic_neutrality: "Северный нейтралитет" # Nordic Neutrality
