#### Events ####

 nor.0.t: "Республика Норвегия" # The Republic of Norway
 nor.0.d: "Норвегия стала независимой от Швеции в 1905 году, выйдя из союза, созданного между этими странами. Один из первых вопросов, которые встал перед народом Норвегии, заключался в том, стать ли нам конституционной монархией или республикой. Тогда народ, все мужчины от 25 лет и старше, проголосовал за монархию. Принц Датский Карл приехал в Норвегию как король Хокон VII.\n\nНо не всех устраивала монархия. Когда шла Великая война, классовые различия способствовали росту рабочего движения в нашей стране, и после войны рабочий класс стал беднее, а высший класс - богаче. С идеями Карла Маркса все было заложено для революции. Многие могут сказать, что это началось с превращения Дании в диктатуру при их короле. Тот факт, что этот король был братом короля Хокона, был достаточной причиной, чтобы поднять рабочих на забастовку. Забастовка в Осло была протестом против капитализма и монархии. По большей части это было мирно, но случаи насилия стали для многих политиков из Arbeiderpartiet доказательством того, что за ними гонятся государство и полиция.\n\nЭто было также время, когда в норвежской политике появился Мартин Транмэль. Он был лидером в борьбе за отмену монархии в 1926 году и был естественным кандидатом на пост президента. Он представлял основную оппозицию президенту Хамбро. В 1930 году Мартин Транмель, представлявший партию «Арбейдерпартиет», победил на президентских выборах, а его товарищи сформировали правительство.\n\nС тех пор партия «Арбейдерпартийет» приобрела огромную власть. Но их власть не вечна. Потенциальные враги есть по всей стране, в Швеции, Дании и развивающейся державе в Германии. В то же время в стране усилились монархизм и национализм. Существует растущая опасность прихода к власти группировок боевиков. Несмотря на все изменения в мире, предстоящие выборы могут стать новым поворотным моментом в норвежской истории." # Norway became independent from Sweden in 1905, exiting the union that was established between these nations. One of the first questions the people of Norway had before themselves was if we should become a constitutional monarchy or a republic. The people then, all of the men 25 years old and older, voted for the monarchy. Prince Carl of Denmark came to Norway as King Haakon VII.\n\nBut not everyone was okay with the monarchy. When the Great War waged on, the class differences helped the worker movement to grow in our country and, after the war, the working class had become poorer and the upper class richer. With the ideas of Karl Marx, it was all laid down for revolution. Many can say it started with Denmark's turn into a dictatorship under their king. The fact that this king was King Haakon's brother was reason enough to get the workers up into a strike. The Oslo Strike was a protest against capitalism and monarchy. It was for the most part peaceful, but where it got violent was proof for many politicians in Arbeiderpartiet that the state and police were after them.\n\nThis was also the time when Martin Tranmæl emerged in Norwegian politics. He was the front-runner for the abolishment of the monarchy in 1926 and was a natural candidate for president. He represented the main opposition towards president Hambro. In 1930, Martin Tranmæl, for Arbeiderpartiet, won the presidential election while his comrades formed government.\n\nSince then, Arbeiderpartiet has yielded huge power. But their power is not eternal. There are potential enemies all around the nation, Sweden, Denmark and the emerging power in Germany. At the same time has monarchism and nationalism risen in the country. There is an increasing danger of militant groups taking power. With all the changes in the world, the upcoming election can be a new turning point in Norwegian history.
 nor.0.a: "Вечный и верный Довре Фаллеру!" # Evig og Tro til Dovre Faller!
 nor.1.t: "17 мая - День Конституции" # 17th of May - Constitution Day
 nor.1.d: "Сегодня 17 мая, день Конституции. Каждый год в этот день дети и взрослые маршируют по городам, размахивая флагами. Все это сделано для празднования дня подписания нашей конституции закона, 17 мая 1814 года. С тех пор конституция была изменена. Но основной материал в основном сохранился, что делает его одной из старейших конституций в мире." # It is the 17th of May, constitution day. This day is marked every year by both children and adults marching in the towns, waving their flags. All this is for celebrating the day when our constitution was signed into law, 17th of May 1814. Since then, the constitution has been changed. But the core material has mostly survived, making it one of the oldest constitutions in the world.
 nor.1.a: "Ура! Ура! Ура!" # Hurra! Hurra! Hurra!
 nor.2.t: "17 мая - День Конституции" # 17th of May - Constitution Day
 nor.2.d: "Сегодня 17 мая, день Конституции. Каждый год в этот день дети и взрослые маршируют по городам, размахивая флагами. Все это сделано для празднования дня подписания нашей конституции закона, 17 мая 1814 года. С тех пор конституция была изменена. Но основной материал в основном сохранился, что делает его одной из старейших конституций в мире." # It is the 17th of May, constitution day. This day is marked every year by both children and adults marching in the towns, waving their flags. All this is for celebrating the day when our constitution was signed into law, 17th of May 1814. Since then, the constitution has been changed. But the core material has mostly survived, making it one of the oldest constitutions in the world.
 nor.2.a: "Ура! Ура! Ура!" # Hurra! Hurra! Hurra!
 nor.3.t: "Лондонская катастрофа затронула и нас!" # London Crash Affects us too!
 nor.3.d: "Несколько дней назад фондовый рынок в Лондоне рухнул. Некоторые члены правительства и многие представители общества заявили, что нас это не затронет. Но мы это сделали. После того, как члены Континентальной Антанты сегодня прекратили с нами все инвестиции и всю торговлю, мы не совсем готовы заняться этой проблемой. Безработица уже выросла, а государственные компании требуют больше денег и ресурсов. Враги власти уже начали нас обвинять. Надо просто ждать, чем наполнятся новости завтра." # Some days ago, the stock market in London crashed. Some of the members of the government and many in society said that we would not be affected. But we did. After members of the Continental Entente, today stopped all investment and all trade with us, we are not completely ready to deal with this problem. Already has unemployment risen and the state-owned companies are demanding more money and resources. The enemies of the government have already begun to blame us. We must just wait what the news will be filled with tomorrow.
 nor.3.a: "Транмэль произносит речь, обещая рост и отсутствие связей с капиталистами!" # Tranmæl Holds a Speech Promising Growth and no ties with Capitalists!
 nor.3.b: "Кристенсен выступил с предупреждением против вмешательства правительства!" # Christensen Holds a Speech Warning Against Government Interference!
 nor.3.c: "Квислинг произносит речь, обвиняя социалистов в разрушении Норвегии!" # Quisling Holds a Speech Blaming the Socialists to have ruined Norway!
 nor.4.t: "Кризис в экономике" # Crisis in the Economy
 nor.4.d: "Похоже, уровень безработицы перестал расти и нам повезло в отличие от ситуации в Британии. Но и здесь не все идеально. Хуже всего то, что до выборов осталось всего несколько дней, и многие говорят, что этот инцидент оттолкнет избирателей от Мартина Транмеля и Arbeiderpartiet." # It seems that the unemployment rate has stopped going up and that we have been lucky in contrast to the situation in Britain. But it is not perfect here either. The worst is that the election is up in just a few days, and many say that this incident will sway the voters away from Martin Tranmæl and Arbeiderpartiet.
 nor.4.a: "Хуже как минимум не будет!" # It can't get worse at least!
 nor.5.t: "Национальная сборная норвежских сельскохозяйственных клубов" # Landslaget for Norske Jordbruksklubber
 nor.5.d: "С 1920-х годов всегда существовала идея заинтересовать молодежь сельским хозяйством. Сама идея исходит от американской организации 4-H. Выросшие сельские клубы теперь собрались вместе, чтобы организоваться. Хотя некоторые радикалы рассматривают это как аграрную пропаганду, президент Транмэль продемонстрировал свою поддержку этому." # Since the 1920s there has always been an idea to get the youth interested in agriculture. The idea itself comes from the American organization 4-H. The rural clubs that have grown have now got together to organize. While some radicals see this as agrarian propaganda, president Tranmæl has shown his support for this.
 nor.5.a: "Ясная Голова, горячее Сердце, добрые Руки и крепкое Здоровье!" # Clear Head, warm Heart, good Hands and good Health!
 nor.6.t: "Камнепад в Лоенватнете" # Rockfall in Loenvatnet
 nor.6.d: "Плохие новости пришли из городов Согн-ог-Фьордане Амт. Не так много часов назад огромная часть горы Рамнефьеллет соскользнула в озеро, создав волну паводка высотой 70 метров, которая разрушила множество близлежащих ферм и унесла жизни 74 человек. Многие люди сейчас ждут выступления президента, демонстрирующего свою заботу о пострадавших семьях и друзьях." # Bad news has arrived from the towns of Sogn og Fjordane Amt. Not so many hours ago, a huge bit of the mountain Ramnefjellet slid down into the lake, creating a 70-meter high flood wave that destroyed many nearby farms and killed 74 peoples. Many peoples are now waiting for the president to give a speech, showing his concern for the affected families and friends.
 nor.6.a: "Покойся с миром!" # Rest in Peace!
 nor.7.t: "Все для Королевского народного марша" # Alt for Kongen's Peoples March
 nor.7.d: "Когда из Англии пришли новости о рождении принца Харальда, сына наследного принца Олава, монархисты не опоздали организовать протест против республики. Возглавляемые Рудольфом Редером, который когда-то был ведущим членом Frisinnende Venstre до того, как партия объединилась с Хойре, а теперь самопровозглашенным лидером монархического движения, монархисты прошли маршем в столице Осло, высмеивая как республику, так и забастовку в Осло. Что мы собираемся с этим делать?" # When news from England came, giving the news of the birth of Prince Harald, son of Crown Prince Olav, the monarchists were not late to organize protest against the Republic. Lead by Rudolf Ræder, once leading member of Frisinnende Venstre before the party merged into Høyre, and now self-proclaimed leader of the monarchist movement, the monarchists marched in the capital of Oslo, mocking both the republic and the Oslo strike. What are we going to do about this?
 nor.7.a: "Они скоро устанут." # They will be tired soon.
 nor.7.b: "Арестуйте столько, сколько сможете!" # Arrest so many you can!

 nor.10.t: "Избирательная кампания начинается" # Election Campaign Begins
 nor.10.d: "Когда Норвегия стала республикой, президент получил задание объявить, когда должна начаться избирательная кампания перед выборами. Сегодня президент Танмэль объявил, что избирательная кампания по выборам 1936 года может начаться. Будут произнесены речи и развешены плакаты.\n\nArbeiderpartiet в этом году сосредоточится на устранении разногласий на левом фланге, но у крыльев партии другая программа, которая может привести к распаду партии. Венстре будет выступать за реприватизацию «украденных» предприятий и собственный план социального обеспечения. Они надеются, что их поддержат как либералы, так и социал-демократы. Хойре будет выступать за приватизацию важных предприятий и монархию. Они хотят, чтобы консервативные либералы и националисты поддержали их в этом вопросе. Есть второстепенные партии, но это самые важные." # When Norway became a republic, the president got the job to declare when an election campaign should begin before the election. Today, president Tanmæl has proclaimed that the election campaigns for the 1936 election can begin. Speeches will be held and posters will be hung up.\n\nArbeiderpartiet will this year focus on healing the divisions on the left, but wings of the party have a different program, that may make the party break apart. Venstre will campaign for the reprivatization of 'stolen' businesses and their own welfare plan. They hope to get both liberals and social democrats to support them. Høyre will campaign for the privatizing of important businesses and the monarchy. They wish to get conservative liberals and nationalists to support them on this. There are minor parties, but these are the most important.
 nor.10.a: "Интересно каждый раз." # Interesting Every Time.
 nor.11.t: "«Насджонал Самлинг» участвует в выборах" # Nasjonal Samling Involved in the Election
 nor.11.d: "Политическая партия «Национал Самлинг» на последних выборах играла второстепенную роль, а иногда вообще не участвовала в них. Но сегодня Видкун Квислинг, лидер партии, произнес речь перед Стортингетом, нашим национальным собранием. К нему присоединились некоторые из его товарищей по партии, и он привлек около 200 прохожих. Квислинг заявил, что он будет более активно участвовать в выборах, и если ему и его партии не разрешат участвовать, это покажет недемократический характер правительства. Полиция готова арестовать Квислинга после его выступления." # The political party Nasjonal Samling has for the last elections played a minor role, sometimes not getting involved in them at all. But today Vidkun Quisling, the party's leader, held a speech in front of Stortinget, our national assembly. He was joined by some of his party comrades and attracted around 200 passersbys. Quisling declared that he will be more involved in the election, and if he and his party are not allowed to participate, it would show the government's undemocratic nature. The police are ready to arrest Quisling after his speech.
 nor.11.a: "Арестуйте Его!" # Arrest Him!
 nor.11.b: "Давайте не будем доказывать ему нашу недемократичность!" # Let us Not Prove Our Undemocratic Nature to Him!
 nor.12.t: "Радикальные социалисты протестуют" # Radical Socialists are Protesting
 nor.12.d: "Из-за нашего одобрения речи Квислинга, произнесенной несколько дней назад, многие радикальные социалисты, профсоюзные деятели и коммунисты протестуют против этого перед Стортингетом. Многие из них хотят, чтобы правые партии были запрещены с плакатами с надписью: «Нет Квислингу, нет Редеру, нет Могенам!»" # Because of our acceptance over Quisling's speech that was held some days ago, many radical socialists, labour unionists and communists are protesting this in front of Stortinget. Many of them want to see the right-wing parties banned, with their posters saying: 'No Quisling, No Ræder, No Mogens!'
 nor.12.a: "Возможно, запрет сработает." # Maybe a Ban could Work.
 nor.13.t: "Общество протестует против ареста Квислинга" # Samfundsvernet Protest Quisling's Arrestation
 nor.13.d: "Из-за недавнего ареста лидера «Национал самлинг» Видкуна Квислинга многие из тех, кого подозревали в принадлежности к правой боевой группировке под названием «Самфундсвернет», вышли на акции протеста на улицах нашей столицы и близлежащих городов. Они также распространяют «ложь» о нашем правительстве. Что мы арестовываем националистов и пытаемся арестовать или уничтожить консервативные голоса в парламенте. Полицию уже прислали." # Because of the recent arrest of Nasjonal Samling leader Vidkun Quisling, many of those who have been suspected to be members of the right-winged militant group called Samfundsvernet, have protested in the streets of our capital city and surrounding towns. They are also spreading 'lies' about our government. That we arrest nationalists and try to arrest or assassinate conservative voices in parliament. Police have already been sent in.
 nor.13.a: "Возможно, нам следует усилить эту борьбу!" # Maybe we should Strengthen this Fight!
 nor.14.t: "День выборов" # Election Day
 nor.14.d: "Время агитации закончилось. Наконец-то наступила дата выборов. Сегодня мы увидим, как воля народа сбывается. Некоторые говорят, что это может стать еще одной победой Arbeiderpartiet. Мартин Транмэль по-прежнему остается вдохновляющей фигурой в норвежской политике. Он наверняка выиграет третий срок на посту президента или уступит свой пост новой, надеюсь, объединяющей фигуре. Другие верят, что будет сформировано новое правительство. И Венстре, и Хойре имеют хорошие шансы в этом году, и многие обвиняют правительство Мэдсена в экономической нестабильности. Некоторые хотели бы видеть Мовинкеля или Кристенсена новым президентом Норвегии.\n\nПрезидент также имеет право отменить выборы, если он видит, что ситуация делает выборы опасными. Но этот выбор будет очень непопулярным, и многие считают, что он только поможет правым в нашей стране получить поддержку. Давайте посмотрим, что происходит." # The time for campaigning is over. The election date is here finally. Today, we will see the will of the people play out. Some has said that this could become another victory for Arbeiderpartiet. Martin Tranmæl is still an inspiring figure in Norwegian politics. He is certain to win a third term as president, or give his position to a new, hopefully as uniting, figure. Others have faith that a new government will be formed. Both Venstre and Høyre has good chances this year, and many have blamed the Madsen government for the economic instability. Some would like to see Mowinckel or Christensen as the new president in Norway.\n\nThe president also has the power to cancel the election if he sees the situation to hold one to dangerous. But this choice would be very unpopular, and many believe it would only help the right-wing in our country gaining support. Let us see what's happens.
 nor.14.a: "Теряя некоторую поддержку, Arbeiderpartiet все равно побеждает." # While Losing some Support, Arbeiderpartiet still Wins.
 nor.14.b: "Кража голосов у AP и Хойре привела Венстре к победе." # Stealing votes from AP and Høyre has made Venstre victorious.
 nor.14.c: "Хойре сумел выиграть и по центру, и по правому флангу." # Høyre managed to win both the centre and the right.
 nor.14.e: "Остановите эти выборы! Это ослабляет национальную безопасность!" # Stop this election! It weakens National Security!
 nor.15.t: "Новое правительство Лейбористской партии" # Arbeiderpartiet's New Government
 nor.15.d: "Arbeiderpartiet победила на выборах, и теперь пришло время выбрать, кто возглавит правительство. Есть два возможных варианта: Педер Фуруботн, который хочет более тесных связей с интернационалистическими авангардистами и распространения социализма в Скандинавии, или Аксель Захариассен, который хочет восстановить связь между партией и социал-демократами и хочет защитить демократические ценности." # Arbeiderpartiet has won the election and it is now time to choose who shall lead the government. There are two possible option, Peder Furubotn, who wants closer ties with the internationalist vanguardists and to spread socialism in Scandinavia, or Aksel Zachariassen, who wants to heal the bond between the party and the social democrats, and wants to protect democratic values.
 nor.15.a: "Радикальный Фуруботн!" # The Radical Furubotn!
 nor.15.b: "Умеренный Захариассен!" # The Moderate Zachariassen!

 nor.16.t: "Массовые протесты против отмененных выборов!" # Mass Protests Against the Canceled Election!
 nor.16.d: "Отмена выборов, похоже, была довольно плохой идеей. Люди по всей стране протестуют, а в консервативной Западной Норвегии вспыхивают открытые восстания. В других регионах также начинают расти восстания. Многие сейчас обращаются к радикальным правым, чтобы заставить их «спасти» норвежскую демократию. Почти все готово к перевороту или гражданской войне." # Canceling the election seems to have been a pretty bad idea. People all over the country are in protest, and places in the conservative Western Norway are in open revolts. There are also revolts beginning to grow in other regions. Many are now turning to the radical right to make them 'save' Norwegian democracy. Nearly everything is set for a coup or civil war.
 nor.16.a: "Да поможет нам Бог!" # May God Help Us!

 nor.17.t: "Военные дезертиры" # Military Deserters
 nor.17.d: "Многие наши солдаты теперь заявили, что не хотят защищать правительство и свои действия. Многие солдаты-консерваторы, либералы и националисты сейчас дезертировали, некоторые присоединились к Norsk Samfundsvern." # Many more of our soldiers have now declared that they do not want to protect the government and their actions. Many conservative, liberal and nationalist soldiers have now deserted, some joining Norsk Samfundsvern.
 nor.17.a: "Можем ли мы вообще их наказать?!" # Can we Even Punish Them?!
 nor.18.t: "Военно-морские дезертиры" # Naval Deserters
 nor.18.d: "Мало того, что солдаты армии начали дезертировать. Сейчас дезертировали даже морские пехотинцы и офицеры низшего звена. Есть даже прибрежный патруль, который приплыл в Данию и присягнул на верность бывшему королю." # Not only has military soldiers from the army begun to desert. Now even naval marines and low ranking officers have deserted. There is even a coastal patrol that has sailed to Denmark and sworn loyalty to the former king.
 nor.18.a: "Что дальше? ВВС?!" # What's Next? The Air Force?!
 nor.19.t: "Партийный раскол!" # Party Divides!
 nor.19.d: "Педер Фуруботн недавно заявил, что выведет коммунистическую и радикальную части нашей партии и сформирует новую партию. Он считает, что Arbeiderpartiet — это тонущий корабль. Многие из наших самых радикальных политиков и сторонников покинули нас!" # Peder Furubotn has recently declared that he will lead the communist and radical parts of our party out and form a new party. He believes that Arbeiderpartiet is a sinking boat. Many of our most radical politicians and supporters have now left us!
 nor.19.a: "Ублюдки!" # Bastards!
 nor.20.t: "Рождественское восстание" # Christmas Uprising
 nor.20.d: "Казалось, Рождество станет мирным событием. Но мы ошибались. В городах Запада и Юга началось восстание. Тысячи людей выходят на улицы против правительства и президента Транмеля." # It seemed that the Christmas time would become a peaceful event. But we were wrong. Cities in West and South has started an uprising. Thousands of people march in the street against the government and president Tranmæl.
 nor.20.a: "Я рад, что у нас нет опросов общественного мнения" # I'm Glad we Don't have Opinion Polls
 nor.21.t: "Восстание в Осло" # Uprising in Oslo
 nor.21.d: "Протесты продолжались последние месяцы, но сейчас весь город Осло охвачен огнем восстаний. Samfundsvernet была мобилизована и при поддержке многих разгневанных мужчин и женщин начала крупное восстание. Многие из наших армейских подразделений либо перешли на сторону этих врагов, либо вообще не подчиняются приказам.\n\nОхранники замка либо присоединились к протесту, либо были убиты повстанцами. Камни уже забросаны окнами и президентской резиденцией. Тогда сделал..." # Protests has been going on the last months, but now, the whole city of Oslo was consumed by the fire of revolts. Samfundsvernet has been mobilized, and with the support of many angry men and women, they have started a major revolt. Many of our army units have either deserted to these enemies, or not responding to orders at all.\n\nAt the castle, the guards have either joined the protest or been murdered by rebels. Stones are already been thrown at the windows and into the presidential residence. Then did...
 nor.21.a: "...Самфундсвернет прорвется через парадную дверь и арестует Транмеля!" # ...Samfundsvernet break through the front door and arrest Tranmæl!
 nor.22.t: "Новое правительство в Норвегии" # New Government in Norway
 nor.22.d: "Norsk Samfundsvern совершил переворот в Норвегии, и пришло время выяснить, какое правительство мы собираемся принять. Некоторые из наших членов хотят передать власть консерваторам, но есть и многие, кто хочет, чтобы мы снова пригласили короля и позволили ему править. Наконец, есть фракция, которая хочет позволить «Насьонал Самлинг» прийти к власти и контролировать страну. Нам нужно посмотреть, за что будет голосовать." # Norsk Samfundsvern has couped Norway and its time to find out what kind of government we are going to adopt. Some of our members want to give power to the conservatives, but there is also many that want us to invite back the king and let him rule. Lastly, there is the faction that wants to let Nasjonal Samling take power and control the country. We have to see what will be voted on.
 nor.22.a: "Демократия!" # Democracy!
 nor.22.b: "Монархия!" # Monarchy!
 nor.22.c: "Национализм!" # Nationalism!

 nor.23.t: "Понимание отмены" # Understanding Towards the Cancellation
 nor.23.d: "Хотя многие недовольны тем, что мы отменили выборы, среди населения начало расти понимание этой акции. Люди начинают понимать, что Norsk Samfundsvern ничем не лучше правительства." # While many is angry that we canceled the election, understanding towards the action has begun to rise in the population. People begin to understand that Norsk Samfundsvern is not something better than the government.
 nor.23.a: "Мы обещаем выборы в 1940 году" # We Promise Election in 1940
 nor.24.t: "Мирное Рождество" # Peaceful Christmas
 nor.24.d: "Мы опасались протестов и восстаний перед Рождеством, но оно прошло относительно очень мирно. Люди не хотят бунтовать во время курортного сезона, и большинство из них предпочли остаться дома и побыть со своими семьями." # We were afraid for protests and rebellions around Christmas time, but it has been relatively very peaceful. People do not want to rebel in the holiday season, and most of them have taken the choice to stay at home and be with their families.
 nor.24.a: "Хороший выбор!" # Good Choice!
 nor.25.t: "Переворот предотвращен" # Coup Prevented
 nor.25.d: "В этот новый год группа боевиков Norsk Samfundsvern мобилизовалась и двинулась на столицу. Хотя многие воинские части дезертировали, те, что находились в Осло, остались верными и сумели помешать военизированной группировке добраться до парламента или замка. Они также теряют поддержку населения, а жители Осло дали информацию о том, где скрываются эти предатели. У президента..." # This new years day, the militant group Norsk Samfundsvern mobilized and marched on the capital. While many military units have deserted, the ones in Oslo stayed loyal and managed to stop the paramilitary group from reaching the parliament or the castle. They are also losing the support of the population, and the people of Oslo has given information about where these traitors are hiding. The president has...
 nor.25.a: "...приказано разгромить боевиков в Осло!" # ...ordered to rout out the Militants in Oslo!
 nor.26.t: "Соглашения с дезертирами" # Agreements with Deserters
 nor.26.d: "Многие из тех, кто дезертировал из наших вооруженных сил, хотят поговорить с нами о соглашении. Некоторые члены партии не хотят, чтобы мы заключали соглашение с дезертирами, но президент Транмэль готов заключить соглашение. Он и многие умеренные считают это чем-то важным для стабилизации страны и обеспечения мира и процветания." # Many of those that have deserted from our armed forces want to talk with us about an agreement. Some of the party's members don't want us to make an agreement with deserters, but president Tranmæl is open to set an agreement. He and many moderates see it as something essential to stabilize the country and bring on peace and prosperity.
 nor.26.a: "Нам нужно исцелить нашу страну и нацию!" # We Need to Heal our Country and Nation!

 nor.30.t: "Усиление кампаний против внутренних врагов" # Strengthen Campaigns Against Internal Enemies
 nor.30.d: "Президент приказал усилить кампанию против действий внутренних врагов, таких как монархисты и Норск Самфундсверн. Наше руководство верит, что это, наконец, положит начало эпохе внутреннего мира и процветания." # The president has ordered a strengthen campaign against the actions of internal enemies such as the monarchists and Norsk Samfundsvern. Our leadership believes this will finally start an era of inner peace and prosperity.
 nor.30.a: "Давайте начнем!" # Let's Begin!
 nor.31.t: "Референдум о новой монархии" # A New Monarchy Referendum
 nor.31.d: "Более десяти лет назад мы отменили монархию. Хотя некоторые считают, что это был хороший вариант, некоторые из нас уже не уверены, что это был правильный выбор. Наше правительство проведет новый референдум по этой теме." # It is over a decade ago we abolished the monarchy. While some believe that was a good option, some of us are not so sure anymore that this was the right choice. Our government will have a new referendum on this topic.
 nor.31.a: "Большинство за монархию" # Majority for the Monarchy
 nor.31.b: "Большинство за республику" # Majority for the Republic
 nor.32.t: "Создание независимых радиостанций" # Establishment of Independent Radios
 nor.32.d: "Монополия на радио теперь официально отменена. Отныне вы можете отправлять радиосигналы внутри страны, не подвергаясь за это аресту. Другое дело, что людям разрешено слушать зарубежное радио, а при президенте Транмеле это рассматривалось как измена." # The monopoly on the radio is now officially abolished. From now on, you can send radio signals from inside the country without being arrested for it. Another thing is that the people are allowed to listen in on foreign radio, while this was seen as treason under president Tranmæl.
 nor.32.a: "Пусть люди говорят!" # Let the People Speak!
 nor.33.t: "Да здравствует король Олав V!" # Long Live King Olav V
 nor.33.d: "Нам повезло, когда бывший наследный принц согласился вернуться в страну. Это было похоже на то, когда король Хокон впервые приехал в нашу страну. Члены Norsk Samfundsvern и Alt for Kongen встретили его на верфи, приветствуя его так же, как премьер-министр Михельсен приветствовал короля Хокона в 1905 году. Коронация нового короля не так уж и далеко!" # We were lucky when the former crown prince accepted to come back to the nation. It was similar to when king Haakon first came to our nation. Members of Norsk Samfundsvern and Alt for Kongen met him on the dockyard, welcoming him, just like prime minister Michelsen welcomed king Haakon in 1905. The new king's coronation is not so long away!
 nor.33.a: "Да благословит Господь короля Олава V!" # God Bless king Olav V!
 nor.34.t: "Да здравствует король Хокон VII!" # Long Live King Haakon VII
 nor.34.d: "Наш славный король, наш монарх согласился вернуться в Норвегию из Дании. Когда он пришел, его встретили члены Norsk Samfundsvern, Alt for Kongen и Nasjonal Samling. Даже Видкун Квислинг и Рагнвальд Хвослеф присутствовали, чтобы почтить прибытие короля Хокона, последний из которых должен был благополучно доставить короля Хокона во дворец. Скоро состоится новая коронация." # Our glorious king, our monarch, has accepted to come back to Norway from Denmark. When he came, he was met by members of Norsk Samfundsvern, Alt for Kongen and Nasjonal Samling. Even Vidkun Quisling and Ragnvald Hvoslef were there to honour King Haakon’s arrival, the latter of which was to safely transport king Haakon to the palace. A new coronation will soon be held.
 nor.34.a: "Боже, благослови короля Хокона VII" # God Bless King Haakon VII
 nor.35.t: "Король встречается с Квислингом" # The King Meets with Quisling
 nor.35.d: "Наш король недавно устроил встречу с Видкуном Квислингом. Предметом встречи было заключение соглашения между королем и «Насьонал Самлинг» о том, чтобы политическая партия помогала королю управлять страной. Это действительно одновременно опасное и вдохновляющее соглашение." # Our king has recently arranged a meeting with Vidkun Quisling. The subject of the meeting was to arrange an agreement between the king and Nasjonal Samling to have the political party to help the king governing the country. It is truly both a dangerous and an inspiring agreement.
 nor.35.a: "За короля и нацию" # For the King and the Nation
 nor.36.t: "Национальная выборка и электоральная фракционность" # Nasjonal Samling and Valkist Factionalism
 nor.36.d: "С тех пор, как Видкун Квислинг и его «Национал Самлинг» пришли к власти, между различными фракциями внутри партии начали возникать разногласия, а также рост вдохновленных валкистами оппозиционных групп, которые не считают, что Квислинг делает достаточно. Они также критически относятся к руководству, которое отдает предпочтение буржуазным капиталистам перед рабочими, безосновательно почитает Квислинга и преклоняется перед христианской церковью, которая снова и снова демонстрирует свою нелояльность по отношению к «Национальному самлингу».\n\nНаконец-то пришло время покончить с оппозицией. Квислинг созвал собрание партии. Один с целью избавить страну от своих самых ярых критиков. Подведя итоги этой сборки, мы видим, что..." # Since Vidkun Quisling and his Nasjonal Samling came to power, rifts have begun to be sown between different factions inside the party, with the growth of Valkist-inspired opposition groups who doesn't think that Quisling is doing enough. They are also critical towards a leadership that favors bourgeoisie capitalists over workers, venerate Quisling without good reason, and kowtow to a Christian Church that has showned their illoyalty towards Nasjonal Samling time and time again.\n\nIt is finally time to do away with the opposition. Quisling has called an assembly for the party. One with the goal to rid the country of his most ardent critics. With the result of this assembly tallied, we can see that...
 nor.36.a: "...Квислингу удается провести чистку в партии" # ...Quisling Manages to Purge the Party
 nor.36.b: "...оппозиция свергает Квислинга" # ...the Opposition Overthrows Quisling
 nor.37.t: "Выборы в Королевский совет" # Election to the King's Council
 nor.37.d: "Наш новый король Олав V установил систему, новый вид демократии в нашем королевстве. Он продолжит нести большую часть полномочий по управлению Норвегией, но его Совет будет больше выбираться не им, а народом. В конце концов, он и его сторонники сражаются за народ Норвегии! Теперь мы увидим, кто будет десницей короля.\n\nC. Дж. Хамбро - один из кандидатов, допущенных к участию в выборах короля. Некоторые считают его президентом-монархистом после того, как он позволил тогдашнему наследному принцу Олаву состояться в Осло после провозглашения республики. Ему также пойдет на пользу членство в крупной партии.\n\nЙоаким Лемкуль — еще один кандидат, допущенный к участию в выборах. Возглавляя правую Федреландслагет, он пользуется поддержкой многих союзников монархии и короля, а также значительной части норвежских националистов.\n\nРудольф Рёдер, нынешний руководитель, является фаворитным кандидатом от создания Альт-Конгена. Его роль в создании Королевства Норвегия также может помочь ему победить на выборах." # Our new king, Olav V, has set into system, a new kind of democracy in our realm. He will continue to bear much of the powers of ruling in Norway, but his Council will be no longer picked by him, but the people. He and his loyalists are, after all, fighting for the people of Norway! We will now see who will be the hand of the king.\n\nC. J. Hambro is one candidate accepted to run for hand of the King. By some regarded as the monarchist president after he allowed, then crown prince Olav's marriage to take place in Oslo after the Republic was declared. Being a member of a major party will also work for him.\n\nJoakim Lehmkuhl is another candidate that has been accepted to run. Leading the right-wing Fedrelandslaget, he is backed by many allies of the monarchy and the king, along with a big section of Norwegian nationalists.\n\nRudolf Ræder, the current hand, is the favorite candidate by the establishment of Alt for Kongen. His role in establishing the Kingdom of Norway might also help him in winning the election.
 nor.37.a: "Си Джей Хамбро избран!" # C. J. Hambro is Elected Hand!
 nor.37.b: "Йоахим Лемкуль избран!" # Joachim Lehmkuhl is Elected Hand!
 nor.37.c: "Рудольф Редер продолжит исполнять обязанности помощника!" # Rudolf Ræder will Continue as Hand!

 nor.40.t: "Наши североатлантические братья" # Our North Atlantic Brothers
 nor.40.d: "Мы наконец пошлем ультиматум тем, кто оккупирует наши земли в Северной Атлантике. Мы покажем им, что мы не признаем, что у нас есть братья, живущие под иностранной оккупацией!" # We will finally send an ultimatum to those occupying our lands in the North Atlantic. We shall show them that we will not accept that we have brothers living under foreign occupation!
 nor.40.a: "Отправить ультиматум" # Send the Ultimatum
 nor.40.b: "Давайте подождем.." # Let us wait..
 nor.41.t: "Норвегия требует Северную Атлантику" # Norway Demands the North Atlantic
 nor.41.d: "Норвежцы пришли с требованием: отдать наши территории в Северной Атлантике или столкнуться с войной. Многие из наших командиров хотят, чтобы мы отказались от этого требования, но есть и такие, кто считает, что для страны было бы лучше принять это предложение." # The Norwegians have come with a demand, to hand over our North Atlantic territories or face war. Many of our commanders want us to say no to this demand, but there are some who believe that it would be better for the country to accept the proposal.
 nor.41.a: "Нет земли, пока не пролилась кровь!" # No land before blood has been shed!
 nor.41.b: "Хорошо, мы принимаем их требование!" # Okay, we accept their demand!
 nor.42.t: "[FROM.GetAdjective] принимает требование" # The [FROM.GetAdjective] Accept the Demand
 nor.42.d: "Они приняли наше требование. Может быть, мы все-таки сможем стать друзьями. Это была великая дипломатическая победа для нашей страны и наших братьев в Северной Атлантике." # They accepted the demand we have given them. Maybe we can be friends after all. This has been a great diplomatic victory for our nation and for our brothers in the North Atlantic.
 nor.42.a: "Хороший выбор!" # Good Choice!
 nor.43.t: "[FROM.GetAdjective] отклонил требование" # The [FROM.GetAdjective] Rejected the Demand
 nor.43.d: "Они отвергли наше почетное требование! Мы покажем им, что происходит в случае отказа! Мы можем либо объявить войну, либо отступить. Все сводится к этому." # They rejected our honourable demand! We will show them what happens in the case of rejection! We can either declare war or back down. It comes down to this.
 nor.43.a: "Мы начали это! Мы заканчиваем это! Война!" # We started it! We finish it! War!
 nor.43.b: "Давайте отступим. Мы не готовы к войне." # Let's back down. We are not ready for war.
 nor.44.t: "Норвегия отступает" # Norway Back Down
 nor.44.d: "Норвегия отказалась от своих претензий в Северной Атлантике. Но мы предполагаем, что это не конец." # Norway has given up its claims in the North Atlantic. But we guess this will not be the end.
 nor.44.a: "Хоть победа для нас!" # Victory for us At Least!
 nor.45.t: "Норвегия требует Северную Атлантику" # Norway Demands the North Atlantic
 nor.45.d: "Норвежцы пришли с требованием покинуть территории Гренландии, Исландии и Фарерских островов или столкнуться с войной. Многие из наших командиров хотят, чтобы мы отказались от этого требования, но есть и такие, кто считает, что для страны было бы лучше принять это предложение." # The Norwegians have come with a demand, to leave the territories of Greenland, Iceland and the Faroe Islands or face war. Many of our commanders want us to say no to this demand, but there are some who believe that it would be better for the country to accept the proposal.
 nor.45.a: "Нет земли, пока не пролилась кровь!" # No land before blood has been shed!
 nor.45.b: "Хорошо, мы принимаем их требование!" # Okay, we accept their demand!
 nor.46.t: "Британцы принимают требование" # The British Accept the Demand
 nor.46.d: "Они приняли наше требование. Может быть, мы все-таки сможем стать друзьями. Это была великая дипломатическая победа для нашей страны и наших братьев в Северной Атлантике." # They have accepted the demand we gave them. Maybe we can be friends after all. This has been a great diplomatic victory for our nation and for our brothers in the North Atlantic.
 nor.46.a: "Хороший выбор!" # Good Choice!
 nor.47.t: "Британцы отвергли это требование" # The British Rejected the Demand
 nor.47.d: "Они отвергли наше почетное требование! Мы покажем им, что происходит в случае отказа! Мы можем либо объявить войну, либо отступить. Все сводится к этому." # They rejected our honourable demand! We will show them what happens in the case of rejection! We can either declare war or back down. It comes down to this.
 nor.47.a: "Мы начали это! Мы заканчиваем это! Война!" # We started it! We finish it! War!
 nor.47.b: "Давайте отступим. Мы не готовы к войне." # Let's Back Down. We are not Ready for war.
 nor.48.t: "Норвегия отступает" # Norway Back Down
 nor.48.d: "Норвегия отказалась от своих претензий в Северной Атлантике. Но мы предполагаем, что это не конец." # Norway has backed down from their claims in the North Atlantic. But we guess this will not be the end.
 nor.48.a: "Хоть победа для нас!" # Victory for us At Least!
 nor.49.t: "Мир в Северной Атлантике?" # Peace in the North Atlantic?
 nor.49.d: "Теперь мы побеждаем, и теперь и мы, и наш враг готовы просить мира." # We are now winning, and both us and our enemy are now willing to sue for peace.
 nor.49.a: "Давайте помиримся." # Let's Make Peace.
 nor.49.b: "Никогда!" # Never!
 nor.50.t: "Норвегия хочет мира!" # Norway wants Peace!
 nor.50.d: "Мирные переговоры" # Peace talks
 nor.50.a: "Хорошо" # Okay
 nor.50.b: "Нет" # Niet
 nor.51.t: "Британия принимает мир" # Britain Accepts Peace
 nor.51.d: "Британцы приняли наше требование о передаче нам территорий Северной Атлантики." # The British have accepted our demand of ceding the North Atlantic territories over to us.
 nor.51.a: "Победа!" # Victory!

 nor.52.t: "Наши братья на Востоке" # Our Brothers in the East
 nor.52.d: "Мы наконец пошлем ультиматум тем, кто оккупирует у нас Емтланд и Альвхейм. Мы покажем им, что мы не признаем, что у нас есть братья, живущие под иностранной оккупацией!" # We will finally send an ultimatum to those occupying Jemtland and Alvheim from us. We shall show them that we will not accept that we have brothers living under foreign occupation!
 nor.52.a: "Отправить ультиматум" # Send the Ultimatum
 nor.52.b: "Давайте подождем.." # Let us wait..
 nor.53.t: "Норвегия требует Богуслена и Емтланда" # Norway Demands Bohuslen and Jamtland
 nor.53.d: "Норвежцы пришли с требованием: отдать территории Богуслена и Емтланда или вступить в войну. Многие из наших командиров хотят, чтобы мы отказались от этого требования, но есть и такие, кто считает, что для страны было бы лучше принять это предложение." # The Norwegians have come with a demand, to hand over the territories of Bohuslen and Jamtland or face war. Many of our commanders want us to say no to this demand, but there are some who believe that it would be better for the country to accept the proposal.
 nor.53.a: "Нет земли, пока не пролилась кровь!" # No land before blood has been shed!
 nor.53.b: "Хорошо, мы принимаем их требование!" # Okay, we accept their demand!
 nor.54.t: "Шведы согласились с требованием" # The Swedes Accept the Demand
 nor.54.d: "Они приняли наше требование. Может быть, мы все-таки сможем стать друзьями. Это была великая дипломатическая победа для нашей страны и наших братьев в Богуслене и Емтланде." # They accepted the demand we have given them. Maybe we can be friends after all. This has been a great diplomatic victory for our nation and for our brothers in Bohuslen and Jamtland.
 nor.54.a: "Хороший выбор!" # Good Choice!
 nor.55.t: "Шведы отклонили требование" # The Swedes Rejected the Demand
 nor.55.d: "Они отвергли наше почетное требование! Мы покажем им, что происходит в случае отказа! Мы можем либо объявить войну, либо отступить. Все сводится к этому." # They rejected our honourable demand! We will show them what happens in the case of rejection! We can either declare war or back down. It comes down to this.
 nor.55.a: "Мы начали это! Мы заканчиваем это! Война!" # We started it! We finish it! War!
 nor.55.b: "Давайте отступим. Мы не готовы к войне." # Let's back down. We are not ready for war.
 nor.56.t: "Норвегия отступает" # Norway Backs Down
 nor.56.d: "Норвегия отказалась от претензий на Богуслен и Ямтланд. Но мы предполагаем, что это не конец." # Norway has given up its claims on Bohuslen and Jamtland. But we guess this will not be the end.
 nor.56.a: "Хоть победа для нас!" # Victory for us At Least!

 nor.61.t: "Для королей Скандинавии" # For the Kings of Scandinavia
 nor.61.d: "Поскольку наши семьи имеют такие прочные связи друг с другом, наш король хочет подписать пакт о «ненападении и защите» с Данией и ее королем Кристианом X, а также со Швецией и ее королем Густавом V. Будем надеяться, что датское и шведское правительства согласятся на это, чтобы поддержать мир и процветание!" # As our families have such strong ties to each other, our king wants to sign a 'Non-Aggression and Protection' pact with Denmark and its king, Christian X, and with Sweden and its king, Gustaf V. Hopefully will the Danish and Swedish governments agree to this, to upheld peace and prosperity!
 nor.61.a: "Отправляйте письма!" # Send the Letters!
 nor.61.b: "Неважно.." # Nevermind..
 nor.62.t: "Норвегия хочет Пакта о ненападении и защите" # Norway Wants Non-Aggression and Protection Pact
 nor.62.d: "Норвежский король недавно прислал нам письмо, содержащее просьбу о заключении пакта о ненападении и защите между нами, ими и Данией. Одобрим ли мы этот запрос?" # The Norwegian king recently sent us a letter, containing a request for a Non-Aggression and Protection pact between us, them and Denmark. Shall we approve this request?
 nor.62.a: "Мы бы от этого процветали!" # We would prosper from this!
 nor.62.b: "Мы не можем им доверять!" # We can't trust them!
 nor.63.t: "Швеция принимает" # Sweden Accepts
 nor.63.d: "Шведы приняли наше предложение и согласились на ненападение и защиту. Они видят, что мир важнее войны." # The Swedish have accepted our proposal, and have agreed on Non-Aggression and Protection. They see that peace is more important than war.
 nor.63.a: "Отличный!" # Excellent!
 nor.64.t: "Швеция отвергает" # Sweden Rejects
 nor.64.d: "Шведы отвергли наше предложение мира и согласия. У них могут быть какие-то планы против нас как независимого государства!" # The Swedish has rejected our proposal of peace and harmony. They may have some plans against us as an independent nation!
 nor.64.a: "Они могут быть разжигателями войны!" # They may be a Warmongerer!
 nor.65.t: "Норвегия хочет Пакта о ненападении и защите" # Norway Wants Non-Aggression and Protection Pact
 nor.65.d: "Норвежский король недавно прислал нам письмо, содержащее просьбу о заключении пакта о ненападении и защите между нами, ними и Швецией. Одобрим ли мы этот запрос?" # The Norwegian king recently sent us a letter, containing a request for a Non-Aggression and Protection pact between us, them and Sweden. Shall we approve this request?
 nor.65.a: "Мы бы от этого процветали!" # We would prosper from this!
 nor.65.b: "Мы не можем им доверять!" # We can't trust them!
 nor.66.t: "Дания принимает" # Denmark Accepts
 nor.66.d: "Датчане приняли наше предложение и согласились на ненападение и защиту. Они видят, что мир важнее войны." # The Danish have accepted our proposal, and have agreed on Non-Aggression and Protection. They see that peace is more important than war.
 nor.66.a: "Отличный!" # Excellent!
 nor.67.t: "Дания отклоняет" # Denmark Rejects
 nor.67.d: "Датчане отвергли наше предложение мира и гармонии. У них могут быть какие-то планы против нас как независимого государства!" # The Danish has rejected our proposal of peace and harmony. They may have some plans against us as an independent nation!
 nor.67.a: "Они могут быть разжигателями войны!" # They may be a Warmongerer!
 nor.68.t: "И Швеция, и Дания согласились!" # Both Sweden and Denmark Agreed!
 nor.68.d: "Оба королевства Швеция и Дания согласились подписать пакт о «ненападении и защите». Никто теперь не сможет напасть ни на кого из нас без помех!" # Both of the Kingdoms of Sweden and Denmark have agreed to sign the 'Non-Aggression and Protection' pact. No-one will now be able to attack any of us without interference!
 nor.68.a: "Да здравствуют короли Скандинавии!" # Long Live, Kings of Scandinavia!

 nor.70.t: "Норвегия хочет присоединиться к Штальпакту!" # Norway Wants to Join the Stahlpakt!
 nor.70.d: "Только что в нашу столицу прибыл дипломатический конвой из Норвегии. Норвежцы пришли спросить, могут ли они присоединиться к «Штальпакту». Это могло бы помочь нам защитить «Скагеррак» от французских или британских кораблей." # A diplomatic convoy from Norway has just arrived in our capital. The Norwegians came to ask if they can join the Stahlpakt. This could be helpful for us in securing the Skagerrak from French or British ships.
 nor.70.a: "Добро пожаловать в Пакт!" # Welcome to the Pakt!
 nor.70.b: "Вы нам не нужны!" # We do not need you!
 nor.71.t: "Германия приветствует нас!" # Germany Welcomes Us!
 nor.71.d: "Немцы были готовы принять нас в свой союз. Это наверняка станет началом долгой дружбы." # The Germans have been willing to let us in their alliance. This will surely be the start of a long friendship.
 nor.71.a: "Да здравствует Норвегия и Германия!" # Long Live Norway and Germany!
 nor.72.t: "Немцы отвергают" # The Germans Reject
 nor.72.d: "Немцы имели наглость отклонить нашу скромную просьбу. Это не будет забыто нашим руководством и в будущем." # The Germans had the nerve to reject our humble request. This will not be forgotten by our leadership in the future.
 nor.72.a: "Норвегии не нужна Германия!" # Norway Doesn't Need Germany!
 nor.73.t: "Норвегия хочет присоединиться к Третьему Интернационалу!" # Norway Wants to Join the Third International!
 nor.73.d: "В нашу столицу только что прибыл дипломатический конвой из Норвегии. Норвежцы пришли спросить, могут ли они присоединиться к Третьему Интернационалу. Это могло бы помочь нам защитить Норвежское море от британских кораблей." # A diplomatic convoy from Norway has just arrived our capital. The Norwegians came to ask if they can join the Tretiy Internazional. This could be helpful for us in securing the Norwegian sea from British ships.
 nor.73.a: "Добро пожаловать в Интернационал!" # Welcome to the International!
 nor.73.b: "Вы нам не нужны!" # We do not need you!
 nor.74.t: "Советская Россия приветствует нас!" # Soviet Russia Welcomes us!
 nor.74.d: "Советы были готовы принять нас в свой альянс. Это наверняка станет началом долгой дружбы." # The Soviets have been willing to let us in their alliance. This will surely be the start of a long friendship.
 nor.74.a: "Да здравствует Норвегия и Советский Союз!" # Long Live Norway and the Soviet Union!
 nor.75.t: "Советы отвергают" # The Soviets Rejects
 nor.75.d: "У Советов хватило наглости отклонить нашу скромную просьбу. Это не будет забыто нашим руководством и в будущем." # The Soviets had the nerve to reject our humble request. This will not be forgotten by our leadership in the future.
 nor.75.a: "Норвегии не нужен Советский Союз!" # Norway Doesn't Need the Soviet Union!

 nor.76.t: "Норвежцы хотят заключить с нами военно-морское соглашение" # The Norwegians Want a Naval Agreement With Us
 nor.76.d: "Норвегия обратилась к нам с предложением заключить военно-морское соглашение между нашими двумя странами. Они считают, что это сотрудничество будет выгодно для нас обоих в долгосрочной перспективе." # Norway has approached us with the proposal of a naval agreement between our two nations. They believe that this cooperation would be beneficial for both of us in the long run.
 nor.76.a: "Хорошо!" # Okay!
 nor.76.b: "Мы не хотим участвовать" # We Do Not Want to be Involved
 nor.77.t: "Британцы принимают соглашение" # The British Accept the Agreement
 nor.77.d: "Британцы приняли военно-морское соглашение между нами и ими. Мы очень рады услышать, что они хотят подписать это соглашение." # The British has accepted the naval agreement between us and them. We are thrilled to hear that they want to sign under on this.
 nor.77.a: "За Норвегию и Британскую империю!" # For Norway and the British Empire!
 nor.78.t: "Британцы отвергают соглашение" # The British Reject the Agreement
 nor.78.d: "Британцы отвергли военно-морское соглашение между нами и ими. Мы немного разочарованы, но что нам может дать будущее, пока неизвестно." # The British has rejected the naval agreement between us and them. We are a little disappointed, but what the future might give us is still unknown.
 nor.78.a: "Как жаль.." # What a Pity..

 nor.80.t: "Наследие Мовинкеля" # Mowinckel's Legacy
 nor.80.d: "Йохан Людвиг Мовинкель был постоянной фигурой в норвежской политике после окончания Великой войны. Уже своим приходом в норвежскую национальную политику в 1919 году он вызвал перемены в обществе. Чтобы он, как свободолюбивый человек вне Церкви, мог войти в правительство, была принята поправка к конституции, известная как «Лекс Мовинкель». С тех пор он стал ведущей фигурой в Венстре и наследником Гуннара Кнудсена. Однако, несмотря на реформы, проведенные под его руководством, 1920-е годы также были эпохой, отмеченной падением популярности Венстре в пользу растущего рабочего движения. Конец наступил с приходом к президентству революционера Мартина Транмеля и его Лейбористской партии к правительству, что поместило Венстре на скамейку оппозиции.\n\nЭкономический кризис дал Венстре и Мовинкелю шанс исправить страну от революционеров и построить лучшее либеральное наследие. Однако слишком многие обвиняют в кризисе экономический либерализм, который отстаивает Мовинкель, и потеряли веру в капитализм. Они забывают, что не мы были главными, когда разразился кризис, а лейбористы. Нам нужно показать им, что либерализм — это решение трудностей, с которыми сталкивается Норвегия, а не их причина." # Johan Ludwig Mowinckel have been an ever-present figure in Norwegian politics since the end of the Great War. Already with his entrence into Norwegian national politics in 1919, he caused change in society. For him to be able, as a Free-spirited man outside the Church, to enter government, the constitutional amendment known as 'Lex Mowinckel' was passed. Since then, he have rissen to become a leading figure in Venstre and the heir to Gunnar Knudsen. However, despite the reforms passed under his governance, the 1920s were also an age marked by a fall of the popularity of Venstre in favor of the rising labour movement. The end came with the rise of the revolutionary Martin Tranmæl to the presidency and his Labour Party to government, placing Venstre onto the opposition bench.\n\nThe economic crisis has given Venstre and Mowinckel a chance to rectify the country away from revolutionaries and building a better liberal legacy. However, too many blame the economic liberalism that Mowinckel champions for the crisis and has lost faith in capitalism. They forget that we weren't in charge when the crisis hit, Labour was. We need to show them that liberalism is the solution to the hardship Norway faces, not the cause.
 nor.80.a: "Наша работа начинается сейчас!" # Our Work Begins Now!

 nor.81.t: "Правое лидерство" # Høyre's Leadership
 nor.81.d: "Консервативная партия была достаточно сплочена под руководством Ивара Люкке. Люкке даже удалось сохранить большую часть финансовых сторонников партии, когда кризис показал им возможность оторваться и поддержать свободомыслящих либералов. Однако Люкке ушел от руководства много лет назад, и на его место партию возглавил Карл Иоахим Хамбро. Хотя Хамбро обладает огромными ораторскими талантами и является решительным защитником цивилизованной демократии от посягательств тоталитарных идеологий, у него также есть свои диссиденты. Многие считают, что Хамбро недостаточно сосредоточен на экономической политике и в то же время является слишком импровизированным и своенравным лидером. В некоторых случаях Хамбро, противник тоталитаризма, сам является авторитарным. Оппозиция Хамбро объединилась вокруг промышленника Йохана Х. Андресена. Во многих отношениях Андресен является противоположностью Хамбро. Структурированный, инновационный бизнесмен, который хочет, чтобы партия больше сосредоточилась на экономических вопросах и представила себя как более явную оппозицию социализму Лейбористской партии. Кроме того, Андресен более симпатичен Лиге Отечества и другим правым организациям.\n\nНесмотря на эти разногласия, они одновременно заинтересованы в вопросе военной готовности и в объединении политических правых против Лейбористской партии. Однако только один из них может повести партию в будущее." # The Conservative Party was fairly united under the leadership of Ivar Lykke. Lykke even managed to keep most of the financial backers of the party when crisis saw it possible for them to break off and support the Free-Minded Liberals. However, Lykke stepped away from leadership years ago, and in his place the party is led by Carl Joachim Hambro. While Hambro has great oratory talents and is a strong principle defender of civilized democracy against the encroachment of totalitarian ideologies, he has also his dissidents. Many see Hambro as not focused enough on economic policies, while being a too improvized and self-willed leader. In some cases Hambro, the opponent of totalitarianism, is himself an authoritarian. The opposition to Hambro has united behind the industralist Johan H. Andresen. In many ways, Andresen is the opposite to Hambro. A structured, innovative business man who wants the party to focus more on economic issues and present itself as a clearer opposition to the socialism of the Labour Party. In addition, Andresen is more sympathetic to the Fatherland League and other right-wing organizations.\n\nDespite these differences, they are both invested in the issue of military preparedness and to unite the political right against the Labour Party. However, only one of them can lead the party into the future.
 nor.81.a: "Хамбро продолжает оставаться лидером" # Hambro Continues as Leader
 nor.81.b: "Нам нужны идеи Андресена" # We Need Andresen's Ideas

 nor.82.t: "Конец Стортинга" # End of the Storting
 nor.82.d: "Первоначальное провозглашение социалистической республики было в основном просто показухой. Там смена флага и там новое название нашей республики. Сегодня начинаются настоящие перемены к социалистической республике. Членов Стортинга из оппозиционных партий сегодня разбудили в своих домах члены Красной гвардии и лояльные полицейские подразделения. Они были арестованы по обвинению в заговоре против Республики, сотрудничестве с реакционным терроризмом и всеобщей измене. На каждом шагу рабочего движения эти обструкционисты стояли на пути прогресса. У нас не может быть «демократических» систем, созданных для продления угнетения рабочего класса. Вот почему эти предательские политики были арестованы.\n\nМы гарантируем, что они понесут заслуженное наказание!" # The initial declaration of a socialist republic was mostly just for show. A change in the flag there and a new name for our republic there. Today starts the real change to a socialist republic. Members of the Storting from the opposition parties was today awaken in their homes by members of the Red Guard and loyal police units. They have been arrested on charges of conspiracy against the Republic, collaboration with reactionary terrorism, and general treason. On every step that the Labour movement have taken, these obstructionists have stood in the way of progress. We can't have 'democratic' systems that are built to prolong the oppression of the working class. That is why these treasonous politicians have been arrested.\n\nWe shall assure that they get the punishment they deserve!
 nor.82.a: "Да здравствует революция!" # Long Live the Revolution!

 nor.83.t: "Социалистическое общество" # A Socialist Society
 nor.83.d: "Последние остатки старой Республики и аркаического Королевства теперь разрушены. На его месте мы строим новое общество, свободное общество, социалистическое общество. Следуя по стопам Маркса и Ленина, Норвегия станет страной, где трудящиеся массы вздохнут настоящую свободу от цепей капитализма. Следуя этим шагам, мы задаем курс не только Норвегии, но и всем трудящимся мира. Отныне мы идем вместе с нашими братьями в Москве, чтобы освободить рабочих Германии, Франции, Англии от цепей, в которых они все еще находятся." # The final vestiges of the old Republic and the arcaic Kingdom are now torn up. In its place, we are building a new society, a free society, a socialist society. By following in the footsteps of Marx and Lenin, Norway will be a country where the working masses will breathe true freedom from the chains of capitalism. By following these steps, we set the course for, not only Norway, but for all workers of the world. From now on, we march together with our brothers in Moscow to free the workers of Germany, France, Britain from the chains they still endure.
 nor.83.a: "Рабочие всего мира, объединяйтесь!" # Workers of the World, Unite!

 nor.84.t: "Синдикализм в Норвегии" # Syndicalism in Norway
 nor.84.d: "Наша мечта, воплощенная в Trondhjemsresolusjonen 1911 года, теперь осуществилась. С тех пор в Рабочее движение сформировалось множество движений, от большевистской революции в России до развития социал-демократии. Однако мы, похоже, возвращаемся к старой мечте о синдикалистской форме правления. Норвегия покажет миру будущее, построенное не на революционных идеях Ленина или реформистских идеях, стремящихся к компромиссу с силами капитала, а будущее, созданное руками объединенных в профсоюзы рабочих." # Our dream represented by the 1911 Trondhjemsresolusjonen are now in reach. Since those days, many movements have come to form the Labour movement, from the Bolshevik revolution in Russia to the development of Social Democracy. However, we seem to trend back to the old dream of a Syndicalist form of government. Norway will show the world a future not built on Lenin's revolutionary ideas or the reformist ideas that seek to compromice with the forces of capital, but a future made by the hands of unionized workers.
 nor.84.a: "Наша революция начинается!" # Our Revolution Begins!

 nor.85.t: "Расцвет классового сотрудничества" # Rise of Class Cooperation
 nor.85.d: "Уже предпринимались попытки сотрудничества между представителями Национального профсоюза трудящихся, Норвежской конфедерацией работодателей и правительством для выяснения правил и регулирования занятости в Норвегии. Это путь, по которому стоит идти. Хотя некоторые считают, что это недостаточно революционно, многие признают это сотрудничество хорошим способом для организованных лейбористов заявить о своем мнении. Многие также видят разрушительную сторону революции, предпочитая вместо этого реформы. Что бы ни говорили эти революционные идеологи, мы создадим демократическую Норвегию, в которой классовые конфликты будут разрешаться мирными средствами." # Already, there have been attempts of cooperation between representatives of the Workers' National Trade Union, the Norwegian Employers' Confederation and the government to figure out the rules and regulation of employment in Norway. This is a path worth going down. While some believe this is not revolutionary enough, many achknowledge this cooperation as a good way for organized Labour to make their mind known. Many are also seeing the destructive side of revolution, favoring instead reform. Despite what those revolutionary ideologues would say, we will create a democratic Norway where class conflict will be resolved with peaceful means.
 nor.85.a: "Давайте встряхнемся с этим" # Let's Shake On It

 nor.90.t: "Более длительные избирательные периоды" # Longer Electoral Periods
 nor.90.d: "Недавно наш парламент принял решение продлить избирательный период с 3 до 4 лет. Некоторые могут рассматривать это как попытку отобрать власть у народа и передать ее политикам, но многие видят, что это поможет дать тем же самым политикам больше времени для выполнения своих предвыборных обещаний." # Our parliament has recently decided to extend the electoral period from 3 years to 4 years. Some may see this as an attempt to take power from the people and give it to the politicians, but many see that this would help in giving these same politicians more time to execute their election promises.
 nor.90.a: "Нам нужно прислушаться к нашему парламенту!" # We Need to Listen to our Parliament!
 nor.91.t: "Подъем христианской демократии" # The Rise of Christian Democracy
 nor.91.d: "Многие из наших граждан считают, что основные политические партии выступают за секуляризм. Даже Хойре с их предложением о реорганизации профсоюзов в христианский союз был воспринят многими избирателями-христианами как слишком светский. Таким образом, второстепенная политическая партия Кристелиг Фолькепартии приобрела повышенную популярность, набрав как социалистов, либералов, так и консервативных избирателей. Хотя большинство их позиций очень консервативны, они заявляют, что не находятся на одной стороне политического спектра. Однако нет никаких признаков того, что партия будет доминировать, но это станет фактором на предстоящих выборах." # Many of our citizens believe that the major political parties are for secularism. Even Høyre, with their proposal for a reorganization of the trade unions into a Christian union, has been seen as too secular for many Christian voters. Therefore, the minor political party of Kristelig Folkeparti gained increased popularity, gaining both socialist, liberals and conservative voters. While most of their stands are very conservative, they do claim to not be on one side of the political spectrum. There are no signs that the party will dominate, however, but it will be a factor in upcoming elections.
 nor.91.a: "Христианская демократия звучит интересно." # Christian Democracy Sounds Interesting.
 nor.92.t: "Ингольф Эльстер Кристенсен уходит из политики" # Ingolf Elster Christensen Resigns from Politics
 nor.92.d: "Лидер Хойре Ингольф Эльстер Кристенсен решил полностью уйти из политики. Он считает, что начинает становиться слишком слабым и старым, чтобы быть в состоянии нести ответственность быть лидером своей партии, и хочет вернуться на ферму своей семьи в Фёрде. Карл Йоахим Хамбро с этого момента станет новым лидером Хойре." # Høyre's leader, Ingolf Elster Christensen, has chosen to resign from politics completely. He believes that he is beginning to become too weak and old to be able to bear the responsibility of being the leader of his party, and wants to retreat back to his family's farm in Førde. Carl Joachim Hambro will become new leader of Høyre from now on.
 nor.92.a: "Кристенсен хорошо послужил своей партии." # Christensen has served his party well.

 nor.94.t: "Конференция Лейбористской партии 1940 года" # 1940 Arbeiderpartiet Conference
 nor.94.d: "Последние выборы показали миру, что будущее Норвегии принадлежит рабочим и профсоюзным деятелям. Наш лидер Мартин Транмель недавно открыл партийную конференцию 1940 года. Это происходило каждый раз перед выборами, но на этот раз вся страна будет следить за направлением главной партии.\n\nПервый вопрос, который необходимо решить, — это то, какую внешнюю политику следует практиковать." # The last election showed the world that the future of Norway belongs to the workers and unionists. Our leader, Martin Tranmæl has now recently opened the 1940 party conference. This has happened every time before an election, but this time, the whole country will be set to watch the direction of the major party.\n\nThe first matter to be resolved is what kind of Foreign Politics shall be practiced.
 nor.94.a: "Мы должны поддержать рабочие революции в Скандинавии!" # We must support Worker Revolutions in Scandinavia!
 nor.94.b: "Мы отсоединимся от капиталистических стран!" # We will be unaligning ourselves from Capitalist countries!
 nor.94.c: "Мы должны сохранять нейтралитет!" # We should preserve our neutrality!
 nor.95.t: "Военный вопрос" # The Issue of the Military
 nor.95.d: "Мы должны выяснить, где мы находимся с военными расходами. В то время как авангардисты хотят, чтобы армия использовалась для распространения революции в других странах, наше правое крыло хочет сделать нашу страну более мирной. Куда нам идти?" # We have to find out where we find ourselves on military spending. While the Vanguardists want to have a military used for bringing the Revolution to other countries, our right wing wants to make our country more peaceful. Where do we go?
 nor.95.a: "Нам нужно защитить и распространить Революцию!" # We need to protect and spread the Revolution!
 nor.95.b: "Мы потратим деньги, чтобы защитить то, что у нас уже есть!" # We shall spend to protect what we already have!
 nor.95.c: "Милитаризм – это не путь социализма!" # Militarism is not the way of Socialism!
 nor.96.t: "Вопрос экономики" # The Issue of Economy
 nor.96.d: "Нам нужно выяснить, где находится наша экономическая позиция. Многие в нашей партии хотят национализировать всё, а некоторые хотят, чтобы мы более терпимо относились к частным выскочкам. Нам нужно выяснить, какова позиция партии по этому поводу?" # We need to find out where our economic stance is. Many in our party want to nationalize everything, while some want us to be more accepting of private upstarts. We need to find out, where the party stands on this?
 nor.96.a: "Национализируйте все отрасли и фермы ради равноправного общества!" # Nationalize all Industries and Farms for an equal society!
 nor.96.b: "Фермеры не являются промышленными магнатами. Они имеют право на свою землю!" # Farmers are not Industry Magnates. They have a right to their land!
 nor.96.c: "Частных операторов следует разрешить, если они соблюдают наши правила!" # Private Operators should be allowed if they follow our rules!

 nor.99.t: "День выборов" # Election Day
 nor.99.d: "И снова пришло время выбрать тех, кто будет заседать в нашем парламенте, и оттуда сформировать правительство. Победа Arbeiderpartiet позволила им стать доминирующей силой на политической сцене Норвегии. Руководство партии доказало, что социализм может прекрасно работать в демократической стране. Но поскольку Норвегия является демократической страной, там будет присутствовать оппозиция. На этих выборах эта оппозиция, представленная Венстре и Хойре, объединилась в собственную коалицию, пытаясь свергнуть правящую партию Арбайдер. Теперь посмотрим, кто победит!" # It is, once more, time to elect who is going to sit in our Parliament, and from there, form a government. The victory of Arbeiderpartiet have managed to make them a dominant force on the political scene in Norway. The party's governing have proven that socialism can work fine in a democratic country. But with Norway being a democracy, there will be the presence of opposition. In this election, that opposition, represented by Venstre and Høyre have come together into their own coalition, trying to dethrone the ruling Arbeiderpartiet. We will now see who will be victorious!
 nor.99.a: "Лейбористская партия снова побеждает!" # Arbeiderpartiet Wins Again!
 nor.99.b: "«Гражданская» коалиция побеждает!" # The 'Borgerlige' Coalition Wins!

 nor.100.t: "Выборы в Верховный Совет Норвегии" # Election to the Norwegian Supreme Soviet
 nor.100.d: "С переходом Норвегии в Социалистическую Республику пришло время провести первые свободные выборы в этой социалистической системе. Благодаря доминированию Arbeiderpartiet, обеспечению прав рабочих и народа Норвегии, люди могут сделать по-настоящему свободный выбор. В то время как радикалы могут одержать новую победу, существует также вероятность победы умеренных или даже социал-демократов. Теперь посмотрим, кто победит!" # With Norway transitioning into a Socialist Republic, it is time to hold the first free election in this socialist system. With the dominance of Arbeiderpartiet secured, securing the rights of the workers and people of Norway, the people are able to make a truly free choice. While the Radicals can gain a new victory, there is also a possibility for the Moderates, or even the Social Democrats, to become victorious. We will now see who will be victorious!
 nor.100.a: "Радикалы побеждают!" # The Radicals Wins!
 nor.100.b: "Умеренные побеждают!" # The Moderates Wins!
 nor.100.c: "Правые побеждают!" # The Right-wing Wins!
 nor.101.t: "День выборов" # Election Day
 nor.101.d: "И снова пришло время выбрать тех, кто будет заседать в нашем парламенте, и оттуда сформировать правительство. Победа Венстре на последних выборах дала хорошую почву для предвыборной кампании как либералам, так и консерваторам. Arbeiderpartiet вернулась в политику и надеется «спасти» страну от капитализма. Теперь посмотрим, кто победит!" # It is, once more, time to elect who is going to sit in our Parliament, and from there, form a government. The victory of Venstre in last election has given a good ground for both the liberals and conservatives to campaign. Arbeiderpartiet has returned to politics, and hope to 'save' the country from capitalism. We will now see who will be victorious!
 nor.101.a: "Умеренные из Лейбористской партии формируют правительство!" # Moderates from Arbeiderpartiet form the government!
 nor.101.b: "Очередная победа Венстре!" # Another victory for Venstre!
 nor.101.c: "Хойре удалось выйти победителем!" # Høyre managed to become victorious!
 nor.102.t: "День выборов" # Election Day
 nor.102.d: "И снова пришло время выбрать тех, кто будет заседать в нашем парламенте, и оттуда сформировать правительство. Победа Хойре на последних выборах дала рост консерватизму, тогда как социализм становится все слабее и слабее. На Arbeiderpartiet возложили вину за экономические проблемы 1936 года, и на этот раз они вряд ли смогут победить. Но новая победа Хойре может оказаться нереальной. У Венстре будет шанс на победу при поддержке как социалистов, так и либералов. Теперь посмотрим, кто победит!" # It is, once more, time to elect who is going to sit in our Parliament, and out from there, form a government. The victory of Høyre in last election has given a rise to conservatism, while socialism is becoming weaker and weaker. Arbeiderpartiet was given the blame for the economic problems from 1936, and are not able to be likely to win this time. But a new victory for Høyre may not be a reality. Venstre will have a chance of victory with support from both socialists and liberals. We will now see who will be victorious!
 nor.102.a: "Левая победила!" # Venstre won!
 nor.102.b: "Очередная победа правых!" # Another victory for Høyre!

 nor.104.t: "День выборов" # Election Day
 nor.104.d: "Настало еще раз время выбрать тех, кто будет заседать в нашем парламенте, и оттуда сформировать правительство. Потерпев поражение в 1936 году, Arbeiderpartiet сумела восстановить власть и поверить, что сможет возглавить социалистическую коалицию после выборов. На этот раз Венстре и Хойре объединились, чтобы противостоять социалистической коалиции в своей коалиции Borgerlige. Почти все социалистические партии согласились на демократию в проведении реформ, а правые нашли согласие в программах друг друга. Теперь посмотрим, кто победит!" # It is once more, time to elect who is going to sit in our Parliament, and from there, form a government. While losing in 1936, Arbeiderpartiet has managed to regain power and believe they can lead a socialist coalition after the election. Venstre and Høyre have teamed up this time to counter the socialist coalition in their Borgerlige coalition. Nearly all socialist parties have agreed to democracy in achieving reforms, and the right has found agreements in each other programs. We will now see who will be victorious!
 nor.104.a: "Социалистическая коалиция побеждает!" # The Socialist Coalition Wins!
 nor.104.b: "«Гражданская» коалиция побеждает!" # The 'Borgerlige' Coalition Wins!
 nor.105.t: "День выборов" # Election Day
 nor.105.d: "Настало еще раз время выбрать тех, кто будет заседать в нашем парламенте, и оттуда сформировать правительство. Хотя политические партии Венстре и Хойре укрепили свои позиции в норвежской политике, все еще найдутся те, кто будет голосовать за Arbeiderpartiet и другие социалистические движения. Чтобы противостоять этому, обе партии договорились о создании коалиционного правительства, если они вместе будут иметь большинство. В свою очередь Arbeiderpartiet сформировали коалицию между собой и другими социалистическими партиями. Теперь посмотрим, кто победит!" # It is once more, time to elect who is going to sit in our Parliament, and from there, form a government. While the political parties of Venstre and Høyre have solidified their position in Norwegian politics, there will still be those that will vote for Arbeiderpartiet and other socialist movements. To counter this, the two parties have agreed on a coalition government if they together would have a majority. Arbeiderpartiet have, in return, formed a coalition between themselves and other socialist parties. We will now see who will be victorious!

 nor.109.t: "Декларация Социалистической Республики!" # Declaration of the Socialist Republic!
 nor.109.d: "Премьер-министр Педер Фуруботн объявил сегодня о новом направлении развития Норвегии. Буржуазные структуры парламентской демократии больше не будут тянуть народ Норвегии вниз. Сегодня народ увидит себя свободным в Социалистической Республике!" # Prime Minister Peder Furubotn have today announced a new direction for Norway. No longer shall the people of Norway being dragged down by the bourgeoisie structures of parliamentary democracy. Today, the people will see themselves free in a Socialist Republic!
 nor.109.a: "Да здравствует революция!" # Long Live the Revolution!

 nor.110.t: "Президентские выборы 1936 года" # The 1936 Presidential Election
 nor.110.d: "Поскольку парламентские выборы принесли новую победу Arbeiderpartiet, у партии также есть высокая вероятность стать президентом. Когда новый парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. После завершения первого тура голосования во втором туре появляются два кандидата.\n\nДействующий президент Мартин Транмэль баллотируется на новый срок на посту президента. Даже если экономический кризис повлиял на последние недели его первого срока, он уверяет, что президент и правительство смогут вывести Норвегию из последней хватки капитализма.\n\nПротивником Транмеля является Ингольф Эльстер Кристенсен из Хойре. Кристенсен надеется объединить правых политических сил в антисоциалистический блок, надеясь заставить либералов и социал-демократов проголосовать за него. Однако даже если он победит, его власть и влияние будут ограничены социалистическим правительством." # With the parliamentary election bringing a new win for Arbeiderpartiet, there is a high possibility for the party to gain the Presidency as well. With the new Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With first round of voting being concluded, two candidates emerges in the second round.\n\nIncumbent president Martin Tranmæl is seeking a new term as President. Even if the economic crisis have affected these last weeks of his first term, he assures that the President and the Government will be able to bring Norway out from the last grasp of capitalism.\n\nTranmæl's opponent is Ingolf Elster Christensen from Høyre. Christensen hopes to unite the political right-wing in an anti-socialist block, hoping to get Liberals and Social Democrats to vote for him. Even if he should win, however, his power and influence would be limited by the socialist government.
 nor.110.a: "Транмэль легко побеждает на второй срок" # Tranmæl Wins Easily a Second Term
 nor.110.b: "Кристенсену удалось стать президентом" # Christensen Manage to Win the Presidency

 nor.111.d: "Поскольку парламентские выборы принесли победу Венстре, у партии есть возможность также стать президентом. Однако это не гарантировано присутствием действующего президента Мартина Транмеля. Когда новый парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. После завершения первого тура голосования во втором туре появляются два кандидата.\n\nДействующий президент Мартин Транмэль может выиграть второй срок, даже если его партия проиграет парламентские выборы. Если ему удастся заручиться поддержкой социал-демократов, он будет иметь небольшое большинство.\n\nПоскольку Венстре обогнал Хойре на парламентских выборах, это, в свою очередь, сделало Йохана Людвига Мовинкеля кандидатом, который встретится с Транмелем во втором туре. Мовинкель, возможно, сможет объединить широкую коалицию против Транмеля, закрепив позиции своей партии." # With the parliamentary election bringing a victory for Venstre, there is a possibility for the party to win the presidency as well. It is not assured, however, with the presence of incumbent president Martin Tranmæl. With the new Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With first round of voting being concluded, two candidates emerges in the second round.\n\nThe incumbent, Martin Tranmæl, might be able to win a second term, even if his party lost the parliamentary election. If he manages to gain the support of the Social Democrats, he will have a slight majority.\n\nWith Venstre overtaking Høyre in the parliamentary election, this have, in return, made Johan Ludwig Mowinckel the candidate to face Tranmæl in the second round. Mowinckel might be able to unite a broad coalition against Tranmæl, securing the hold of his party.
 nor.111.a: "Незначительное левое большинство дает Транмелу второй срок" # A Slight Left-wing Majority Gives Tranmæl a Second Term
 nor.111.b: "Широкая коалиция делает Мовинкеля президентом" # A Broad Coalition Makes Mowinckel President

 nor.112.d: "Поскольку парламентские выборы принесли победу Хойре, у партии есть возможность также выиграть президентские выборы. Хотя у Транмеля еще есть шанс, у правых есть надежда «свергнуть» президента-социалиста. Собрав новый парламент, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. После завершения первого тура голосования во втором туре появляются два кандидата.\n\nДействующий президент Мартин Транмэль может выиграть второй срок, даже если его партия проиграет парламентские выборы. Если ему удастся заручиться поддержкой социал-демократов и, возможно, даже нескольких либералов, он будет иметь небольшое большинство.\n\nСоперником Транмеля является Ингольф Эльстер Кристенсен из Хойре. Кристенсен надеется объединить правых политических сил в антисоциалистический блок, надеясь заставить либералов, а возможно, и социал-демократов проголосовать за него. Его победа также обеспечила бы поддержку его партии." # With the parliamentary election bringing a victory for Høyre, there is a possibility for the party to win the presidency as well. While Tranmæl still has a chance, the right-wing has a hope to 'dethrone' the socialist president. With the new Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With first round of voting being concluded, two candidates emerges in the second round.\n\nThe incumbent, Martin Tranmæl, might be able to win a second term, even if his party lost the parliamentary election. If he manages to gain the support of the Social Democrats, and maybe even a few Liberals, he will have a slight majority.\n\nTranmæl's opponent is Ingolf Elster Christensen from Høyre. Christensen hopes to unite the political right-wing in an anti-socialist block, hoping to get Liberals, and perhaps also Social Democrats, to vote for him. His victory would also secure the hold of his party.
 nor.112.b: "Кристенсен побеждает с объединенной коалицией" # Christensen Wins With a United Coalition

 nor.113.t: "Президентские выборы 1940 года" # The 1940 Presidential Election
 nor.113.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Поскольку Arbeiderpartiet по сути играет доминирующую роль в норвежской политике, выборы продлятся всего один тур. Вопрос в том, кто из нашей партии станет президентом, поскольку Мартин Транмэль на этот раз не баллотируется на срок.\n\nЭйнар Герхардсен рассматривается как близкий соратник Мартина Транмеля, входивший в его круг еще в 1920-30-х годах. Герхардсен представляет умеренную фракцию в Arbeiderpartiet, желая продолжить линию Мартина Транмеля.\n\nХаавард Лангсет представляет радикальное крыло Arbeiderpartiet и является одним из наиболее близких к Советскому Союзу кандидатов в президенты. Его президентство оттолкнет некоторых из наших самых умеренных членов, так что, возможно, это не лучший выбор.\n\nЙохан Нигаардсвольд на самом деле представляет Норвежскую социал-демократическую арбейдерпартию, партию, которая отделилась от арбейдерпартийет еще в 1920-х годах. Его президентство может привести к слиянию партий, но также может и оттолкнуть радикальное крыло партии." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. Since Arbeiderpartiet basically has a dominant role in Norwegian politics, the election will just span one round. The question is who from our party is going to become President, since Martin Tranmæl is not seeking a term this time.\n\nEinar Gerhardsen is seen as a close associate to Martin Tranmæl, being a member of his circle back in the 1920s and 30s. Gerhardsen represents the moderate faction in Arbeiderpartiet, wanting to continue the line of Martin Tranmæl.\n\nHaavard Langseth represnts the radical wing of Arbeiderpartiet, and are one of the closest to the Soviet Union among the Presidential candidates. His presidency will alienate some of our most moderate members, so it might not be the best choice.\n\nJohan Nygaardsvold does in reality represent Norges Socialdemokratiske Arbeiderparti, a party that broke off Arbeiderpartiet back in the 1920s. His presidency can result in a party merge, but can also alienate the radical wing of the party.
 nor.113.a: "Эйнар Герхардсен" # Einar Gerhardsen
 nor.113.b: "Хавард Лангсет" # Haavard Langseth
 nor.113.c: "Йохан Нигаардсвольд" # Johan Nygaardsvold

 nor.114.t: "Наш кандидат в президенты" # Our Candidate for the Presidency
 nor.114.d: "Поскольку парламентские выборы уже завершились, выборы президента висят в воздухе. Поскольку Мартин Транмэль не выразил желания быть избранным на новый срок, от Arbeiderpartiet выдвинулось несколько кандидатов.\n\nЭйнар Герхардсен - кандидат, которого поддерживает Транмэль, и он представляет умеренных в партии. Герхардсен имеет опыт работы в кругу Транмеля и разделяет многие из его социалистических идей.\n\nХаавард Лангсет представляет радикальное крыло Arbeiderpartiet и поддерживает Советский Союз, но скептически относится к парламентской демократии. Его кандидатура может оттолкнуть некоторых умеренных, поскольку шансы на то, что социал-демократы поддержат его, невелики.\n\nЙохан Нигаардсволд также выдвигается в качестве кандидата. Хотя он является членом Норвежской социал-демократической партии, его кандидатура может получить поддержку либералов и политиков в центре. Но это может оттолкнуть радикальных членов Arbeiderpartiet, даже если это будет гарантированная победа." # With the parliamentary election now over, the election for the Presidency is up in the air. With Martin Tranmæl expressing no wish to be elected into a new term, a couple of candidates have come up for Arbeiderpartiet.\n\nEinar Gerhardsen is the candidate being supported by Tranmæl, and represents the moderates in the party. Gerhardsen has a background in the circle around Tranmæl, and are sharing many of his socialist ideas.\n\nHaavard Langseth represents the radical wing of Arbeiderpartiet, and are a supporter of the Soviet Union, while being sceptical to parliamentary democracy. His candidacy can risk alienate some moderates, with slim chances of gaining Social Democrats to support him.\n\nJohan Nygaardsvold is also being put forward as a candidate. While he is a member of Norges Socialdemokratiske Arbeiderparti, his candidacy might be able to gain the support of Liberals and politicians in the center. But this might alienate radical members of Arbeiderpartiet, even if it would be a secured win.
 nor.114.a: "Герхардсен, наследник Транмеля" # Gerhardsen, Tranmæl's Heir
 nor.114.b: "Лангсет, истинный социалист" # Langseth, the True Socialist
 nor.114.c: "Нюгаардсвольд, Аутсайдер" # Nygaardsvold, the Outsider

 nor.115.t: "Президентские выборы 1940 года" # The 1940 Presidential Election
 nor.115.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Когда парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. Поскольку первый тур голосования завершен, похоже, что во втором туре будут баллотироваться два кандидата.\n\nЭйнар Герхардсен — кандидат, которого поддерживает Арбайдерпартиет и другие социалисты в парламенте. Его считают близким соратником Мартина Транмеля, ведущего члена Arbeiderpartiet, и, судя по всему, он продолжает идти по стопам президента Транмеля. В общем, это безопасный кандидат, если Arbeiderpartiet тоже хочет победить на президентских выборах.\n\nАртур Нордли — кандидат, поддерживаемый правыми политическими силами, поскольку он является членом Хойре. Он надеется заручиться поддержкой всех антисоциалистических сил Норвегии, чтобы победить на этих выборах. Но с учетом победы Arbeiderpartiet на парламентских выборах маловероятно, что он победит." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With the first round of voting finishing up, it looks like two candidates are going to run in the second round.\n\nEinar Gerhardsen is the candidate supported by Arbeiderpartiet and other socialists in the Parliament. He is seen as a close associate to Martin Tranmæl, leading member of Arbeiderpartiet, and seems to continue in the footsteps of President Tranmæl. All in all, a safe candidate if Arbeiderpartiet wants to win the presidential election too.\n\nArthur Nordlie is the candidate supported by the political right, being a member of Høyre. He hope to gain the support of all anti-socialist forces in Norway in order to win this election. But with the victory of Arbeiderpartiet in the parliamentary election, it is a little unikely he will win.
 nor.115.a: "Эйнар Герхардсен – победитель!" # Einar Gerhardsen is Victorious!
 nor.115.b: "Артур Нордли одерживает неожиданную победу!" # Arthur Nordlie Gains a Surprising Win!

 nor.116.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Когда парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. Поскольку первый тур голосования подходит к концу, похоже, что во втором туре будут баллотироваться два кандидата.\n\nХаавард Лангсет - кандидат, пользующийся поддержкой Арбайдерпартиет и других социалистов в парламенте. Несмотря на поддержку правящей партии, его победа все еще не обеспечена. Считающийся радикалом, он может заставить некоторых умеренных в Arbeiderpartiet воздержаться от голосования или вместо этого проголосовать за оппозиционного кандидата.\n\nАртур Нордли — кандидат, которого поддерживают правые политические силы, и он является членом Хойре. Он надеется заручиться поддержкой всех антисоциалистических сил Норвегии, чтобы победить на этих выборах. Но с учетом победы Arbeiderpartiet на парламентских выборах маловероятно, что он победит." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting coming to an end, it looks like two candidates are going to run in the second round.\n\nHaavard Langseth is the candidate with the support of Arbeiderpartiet and other socialists in the Parliament. While having the support of the governing party, his victory is still not secured. Viewed as a radical, he might make some moderates in Arbeiderpartiet abstain from voting, or vote on the opposing candidate, instead.\n\nArthur Nordlie is the candidate supported by the political right, being a member of Høyre. He hope to gain the support of all anti-socialist forces in Norway in order to win this election. But with the victory of Arbeiderpartiet in the parliamentary election, it is a little unlikely he will win.
 nor.116.a: "Хаавард Лангсет — победитель!" # Haavard Langseth is the Winner!

 nor.117.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Когда парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. После завершения первого тура голосования, похоже, что во втором туре будут баллотироваться два кандидата.\n\nЙохан Нигаардсволд является кандидатом, пользующимся поддержкой как правящей партии Arbeiderpartiet, так и его собственной партии, Norges Socialdemokratiske Arbeiderparti. Несмотря на то, что он не имеет большой привлекательности для радикалов в Arbeiderpartiet и существует опасность заставить многих из них воздержаться от голосования, ему, возможно, удастся обратиться ко многим в политическом центре.\n\nАртур Нордли - кандидат, поддерживаемый правыми политическими силами, и является членом Хойре. Он надеется заручиться поддержкой всех антисоциалистических сил Норвегии, чтобы победить на этих выборах. Но с учетом победы Arbeiderpartiet на парламентских выборах маловероятно, что он победит." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting wraping up, it looks like two candidates are going to run in the second round.\n\nJohan Nygaardsvold is the candidate with the support of both the governing Arbeiderpartiet and his own party, Norges Socialdemokratiske Arbeiderparti. While not having a big appeal for radicals in Arbeiderpartiet, with a danger of making many of them abstain from voting, he might manage to appeal to many in the political center.\n\nArthur Nordlie is the candidate supported by the political right, being a member of Høyre. He hope to gain the support of all anti-socialist forces in Norway in order to win this election. But with the victory of Arbeiderpartiet in the parliamentary election, it is a little unikely he will win.
 nor.117.a: "Йохан Нигаардсвольд одерживает победу!" # Johan Nygaardsvold Carries the Win!

 nor.118.t: "Наш кандидат в президенты" # Our Candidate for the Presidency
 nor.118.d: "Теперь, когда парламентские выборы завершились, новая правительственная партия Хойре может выбрать, кто станет ее кандидатом на пост президента Норвегии. Хотя есть некоторые сторонники того, чтобы кандидат предыдущих выборов баллотировался и в этом раунде, есть голоса, которые хотят новой крови.\n\nАртур Нордли - новый любимый кандидат в партии. В случае Хойре его кандидатура, возможно, не будет иметь большого значения, если не считать притока новой крови в президентское кресло. Ингольф Эльстер Кристенсен также является кандидатом, будучи кандидатом от Хойре еще в 1936 году. Оба кандидата означают, что Хойре будет контролировать пост президента в случае их победы.\n\nПоследним ценным кандидатом является Нильс Тредал из Bondepartiet. Тредал мог бы стать более привлекательным кандидатом как для политиков из Венстре, так и для АНБ. Но эта стратегия может оттолкнуть некоторых членов партии Хойре, которые считают, что мы должны поддержать кандидата от нашей партии." # With the parliamentary election now over, the new government party of Høyre is set in position to select who is going to become their candidate for President of Norway. While there are some arguing to have previous election's candidate stand this round too, there are some voices that wants new blood.\n\nArthur Nordlie is a new favorite candidate in the party. His candidacy might not mean much in Høyre's case, outside from getting some new blood in the Presidency. Ingolf Elster Christensen is also a candidate, being the candidate for Høyre back in 1936. Both candidates would mean that Høyre would control the Presidency if they win.\n\nThe last candidate being valued are Nils Trædal from Bondepartiet. Trædal could work as a more appealing candidate for both politicians from Venstre and NSA. But this strategy might alienate some members in Høyre, who believes we should support a candidate from our party.
 nor.118.a: "Нордли, «новый» кандидат" # Nordlie, the 'New' Candidate
 nor.118.b: "Кристенсен, «старый» кандидат" # Christensen, the 'Old' Candidate
 nor.118.c: "Тредал, Аутсайдер" # Trædal, the Outsider

 nor.119.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Когда парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. Поскольку первый тур голосования завершен, похоже, что во втором туре будут баллотироваться два кандидата.\n\nАртур Нордли...\n\nЭйнар Герхардсен..." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting finishing up, it looks like two candidates are going to run in the second round.\n\nArthur Nordlie...\n\nEinar Gerhardsen...
 nor.119.a: "Артур Нордли победитель!" # Arthur Nordlie is Victorious!
 nor.119.b: "Эйнар Герхардсен одерживает неожиданную победу!" # Einar Gerhardsen Gains a Surprising Win!

 nor.120.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Когда парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. Поскольку первый тур голосования подходит к концу, похоже, что во втором туре будут участвовать два кандидата.\n\nИнгольф Эльстер Кристенсен...\n\nЭйнар Герхардсен..." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With the first round of voting coming to an end, it looks like two candidates are going to run in the second round.\n\nIngolf Elster Christensen...\n\nEinar Gerhardsen...
 nor.120.a: "Ингольф Эльстер Кристенсен побеждает!" # Ingolf Elster Christensen Wins!

 nor.121.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Когда парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. После завершения первого тура голосования похоже, что во втором туре будут баллотироваться два кандидата.\n\nНильс Тредал...\n\nЭйнар Герхардсен..." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting wraping up, it looks like two candidates are going to run in the second round.\n\nNils Trædal...\n\nEinar Gerhardsen...
 nor.121.a: "Нильс Тредал одерживает победу!" # Nils Trædal Carries the Win!

 nor.122.t: "Наш кандидат в президенты" # Our Candidate for the Presidency
 nor.122.d: "Теперь, когда парламентские выборы завершились, правящая партия Венстре находится в состоянии выбрать, кто станет их кандидатом на пост президента Норвегии. Хотя есть голоса за кандидата предыдущих выборов, некоторые также голосуют за нового кандидата.\n\nАрне Сунде является потенциальным кандидатом, отмечающим себя как юрист и политик, близкий к Йохану Людвигу Мовинкелю. Его образование и работа хорошо подходят для того, кто собирается стать президентом Норвегии.\n\nЙохан Людвиг Мовинкель также является надежным кандидатом, поскольку на протяжении многих лет он занимал должность премьер-министра иностранных дел, торговли и торговли, а также его вклад в развитие Лекса Мовинкеля. Даже если он баллотировался раньше, он может быть хорошим кандидатом.\n\nДругим ценным кандидатом является Нильс Тредал из Bondepartiet. Тредал мог бы стать более привлекательным кандидатом как для политиков из Хойре, так и для АНБ. Но эта стратегия может оттолкнуть некоторых членов Венстре, которые считают, что мы должны поддержать кандидата от нашей партии." # With the parliamentary election now over, the governing party of Venstre is set in position to select who is going to become their candidate for President of Norway. While there are some voices for the previous election's candidate, some are also voicing for a new candidate.\n\nArne Sunde is a potential candidate, remarking himself as a lawyer and a politician close to Johan Ludwig Mowinckel. His education and work would fit well for someone going to become the President of Norway.\n\nJohan Ludwig Mowinckel is also a reliable candidate, with his history as foreign, trade and prime minister over the years, and his contribution for Lex Mowinckel. Even if he has ran before, he might be a good candidate.\n\nAnother candidate being valued are Nils Trædal from Bondepartiet. Trædal could work as a more appealing candidate for both politicians from Høyre and NSA. But this strategy might alienate some members in Venstre, who believes we should support a candidate from our party.
 nor.122.a: "Сунде, юрист" # Sunde, the Lawyer
 nor.122.b: "Мовинкель, политик-ветеран" # Mowinckel, the Veteran Politician
 nor.122.c: "Тредал, Аутсайдер" # Trædal, the Outsider

 nor.123.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Когда парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. После завершения первого тура голосования, похоже, что во втором туре будут баллотироваться два кандидата.\n\nАрне Сунде...\n\nЭйнар Герхардсен..." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting wraping up, it looks like two candidates are going to run in the second round.\n\nArne Sunde...\n\nEinar Gerhardsen...
 nor.123.a: "Арне Сунде – новый президент!" # Arne Sunde is the New President!

 nor.124.d: "Парламентские выборы уже завершились, и пришло время проголосовать за то, кто станет следующим президентом Норвегии. Когда парламент собран, пришло время представителям народа проголосовать за то, кто станет следующим президентом Норвегии. После завершения первого тура голосования, похоже, что во втором туре будут баллотироваться два кандидата.\n\nЙохан Людвиг Мовинкель...\n\nЭйнар Герхардсен..." # With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With the first round of voting wraping up, it looks like two candidates are going to run in the second round.\n\nJohan Ludwig Mowinckel...\n\nEinar Gerhardsen...
 nor.124.a: "Йохан Людвиг Мовинкель – победитель!" # Johan Ludwig Mowinckel is Victorious!

 nor.130.t: "Выборы [GetYear] в Королевский совет" # The [GetYear] Election to the King's Council
 nor.130.d: "Назначены новые выборы в совет короля Олава V. Хотя кажется, что одни и те же кандидаты будут пытаться завоевать титул десницы короля в этом сезоне выборов, есть некоторые изменения.\n\nC. Дж. Хамбро возвращается на эти выборы, чтобы попытаться стать рукой короля Олава. Выходец из Хойре, одной из крупнейших партий Норвегии, он может заручиться поддержкой многих политиков истеблишмента. Наряду с тем, что некоторые считают его президентом-монархистом, он, возможно, сможет заручиться поддержкой и со стороны монархистов.\n\nНильс Лавик — новый кандидат, допущенный к участию в борьбе за титул десницы короля. Ведущая фигура движения «Христианская внутренняя миссия», он сумел завоевать популярность среди наиболее консервативных и христианских частей Норвегии, на юге и на западе.\n\nЙоаким Лемкуль снова был принят в качестве кандидата на титул десницы короля. Возглавляя правый Федреландслагет, его поддерживают многие союзники монархии и короля, а также большая часть норвежских националистов.\n\nРудольф Рёдер является любимым кандидатом от создания Альтернативного Конгена. Его роль в создании Королевства Норвегия также может помочь ему победить на выборах." # New elections to the council of king Olav V have been called. While it seems like the same candidates will attempt to win the title of hand of the King in this election season, there are some changes.\n\nC. J. Hambro returns in this election to try to become the hand of King Olav. Coming from Høyre, one of the biggest parties in Norway, he is able to gain the support of many establishment politicians. Along with some regarding him as a monarchist president, he might be able to gain support from monarchists too.\n\nNils Lavik is a new candidate accepted to run for the title as hand of the King. A leading figure in the Christian Inner Mission movement, he have managed to gain popularity among the more conservative and christian parts of Norway, in the South and in the West.\n\nJoakim Lehmkuhl has once more been accepted to run as a candidate for the title as hand of the King. Leading the right-wing Fedrelandslaget, he is backed by many allies of the monarchy and the king, along with a big section of Norwegian nationalists.\n\nRudolf Ræder is the favorite candidate by the establishment of Alt for Kongen. His role in establishing the Kingdom of Norway might also help him in winning the election.
 nor.130.a: "Си Джей Хамбро" # C. J. Hambro
 nor.130.b: "Нильс Лавик" # Nils Lavik
 nor.130.c: "Йоаким Лемкуль" # Joakim Lehmkuhl
 nor.130.e: "Рудольф Редер" # Rudolf Ræder

 nor.135.t: "Растущее влияние Норвегии" # Rising Norwegian Influence
 nor.135.d: "Социалистический режим в Норвегии начал финансировать наше левое крыло. Я не знаю, чего они добиваются, но это нехорошо." # The socialist regime in Norway has begun to fund our left-wing. I don't know what they are going for, but it ain't good.
 nor.135.a: "Черт бы побрал этих норвежцев" # Damn Those Norwegians

 nor.136.t: "Наши братья-социалисты требуют нашего подчинения" # Our Socialist Brethrens Request Our Submission
 nor.136.d: "Поскольку мы сами являемся революционной социалистической страной, норвежцы были настолько любезны, что попросили нас подчиниться им. Они утверждают, что вместе мы сможем сформировать более сильную и процветающую социалистическую Скандинавию." # Since we are a revolutionary socialist country ourselves, the Norwegians have been kind enough to request our submission to them. They argue that together, we can form a stronger, prosperous Socialist Scandinavia.
 nor.136.a: "Хорошо, за революцию!" # Okay, For the Revolution!
 nor.136.b: "Нет, Дания свободна" # No, Denmark is Free

 nor.137.t: "Датчане согласились" # The Danes Agreed
 nor.137.d: "Датские социалисты увидели причину и согласились объединить свою нацию с нашей. Вскоре Скандинавия будет полностью объединена." # The Danish Socialists saw reason and agreed to unite their nation with ours. Soon, Scandinavia will be fully unified.
 nor.137.a: "Да здравствует революция!" # Long Live the Revolution!
 nor.138.t: "Датчане сказали нет" # The Danes Said No
 nor.138.d: "Датчане, несмотря на то, что ими управляли коллеги-социалисты, все же не сдались. Сейчас есть только один способ осуществить революцию: война." # The Danish, despite being run by fellow socialists, still didn't give in. There is only one way to fulfill the revolution now: War.
 nor.138.a: "Ты должен был сказать «да»!" # You Should Have Said Yes!

 nor.139.t: "Норвегия братается со шведскими социалистами" # Norway Fraternizes With Swedish Socialists
 nor.139.d: "Социалистический режим в Норвегии начал влиять на нашу политику, братаясь со шведскими революционерами, стремящимися свергнуть наше правительство. Это не круто." # The socialist regime in Norway has begun to influence our politics, fraternizing with Swedish revolutionaries who seek to overthrow our government. That's not cool.
 nor.139.a: "Черт бы побрал этих норвежцев" # Damn Those Norwegians

 nor.140.b: "Нет, Швеция свободна" # No, Sweden is Free

 nor.141.t: "Шведы согласились" # The Swedes Agreed
 nor.141.d: "Шведские социалисты увидели причину и согласились объединить свою нацию с нашей. Вскоре Скандинавия будет полностью объединена." # The Swedish Socialists saw reason and agreed to unite their nation with ours. Soon, Scandinavia will be fully unified.
 nor.142.t: "Шведы сказали нет" # The Swedes Said No
 nor.142.d: "Шведы, несмотря на то, что ими управляли коллеги-социалисты, все же не сдались. Сейчас есть только один способ совершить революцию: война." # The Swedes, despite being run by fellow socialists, still didn't give in. There is only one way to fulfill the revolution now: War.

 nor.143.t: "Норвегия сотрудничает с красными" # Norway Collaborate With the Reds
 nor.143.d: "Социалистический режим в Норвегии начал работать вместе с социалистами в нашей стране, сближаясь с подпольной Красной гвардией. Мы должны быть начеку." # The socialist regime in Norway has begun to work together with the socialists in our country, becoming closer to the underground Red Guard. We have to be on guard.
 nor.143.a: "Черт бы побрал этих норвежцев" # Damn Those Norwegians

 nor.144.t: "Нет, Финляндия свободна" # No, Finland is Free

 nor.145.t: "Финны согласились" # The Finns Agreed
 nor.145.d: "Финские социалисты поняли причину и согласились объединить свою нацию с нашей. Вскоре Скандинавия будет полностью объединена." # The Finnish Socialists saw reason and agreed to unite their nation with ours. Soon, Scandinavia will be fully unified.
 nor.146.t: "Финны сказали нет" # The Finns Said No
 nor.146.d: "Финны, несмотря на то, что ими управляли коллеги-социалисты, все же не сдались. Сейчас есть только один способ совершить революцию: война." # The Finns, despite being run by fellow socialists, still didn't give in. There is only one way to fulfill the revolution now: War.

 nor.147.t: "Союз Скандинавских Социалистических Республик" # The Union of Scandinavian Socialist Republics
 nor.147.d: "Для многих представителей социалистического движения единство рабочего класса Скандинавии было дальновидной целью. Сегодня эта амбиция реализована. Вместе с нашими братьями в Швеции, Дании и Финляндии мы создали новую социалистическую державу в мире." # For many in the Socialist movement, unity between the working class people of Scandinavia has been a far-seeing ambition. Today, this ambition is fulfilled. Together with our brethrens in Sweden, Denmark and Finland, we have created a new Socialist power in the world.
 nor.147.a: "Панскандинавство не умерло" # Pan-Scandinavianism Isn't Dead
 nor.149.t: "Столица скандинавского государства" # Capital of the Scandinavian State
 nor.149.d: "С объединением скандинавского народа под одним флагом быстро возникает вопрос: «Какой должна быть столица этого нового союза?». При этом многие указывают на Осло, поскольку с момента объединения возглавляли норвежцы. Некоторые утверждают, что новая столица, такая как Стокгольм или Копенгаген, поможет лучше интегрировать наших братьев. Другие за нестоличный город, такой как Гетеборг, чтобы избежать фаворитизма в отношении одной нации над другими. Где это должно быть?" # With the unification of the Scandinavian people under one flag, a question quickly arise: 'What should be the capital of this new union?'. While many points to Oslo, since the unification have been led by Norwegians. Some argue another capital city like Stockholm or Køpenhavn to better integrate our brethrens. Others for a non-capital city, like Göteborg, to avoid favoritism towards one nation over the others. Where should it be?
 nor.149.a: "Осло – Норвегия возглавила объединение" # Oslo - Norway Led the Unification
 nor.149.b: "Гетеборг – Некапитал будет лучше обслуживать всех" # Göteborg - A Non-Capital Will Better Serve All
 nor.149.c: "Стокгольм - Обратиться к шведам" # Stockholm - To Appeal to the Swedes
 nor.149.e: "Копенгаген – Обращение к датчанам" # Køpenhavn - To Appeal to the Danes

 nor.148.t: "Норвегия отправляет помощь" # Norway Sends Aid
 nor.148.d: "Норвежское правительство предоставило нам военную помощь, а также помогло нам добровольцами в нашей борьбе против Советского Союза. Надеемся, этого будет более чем достаточно для победы над русским медведем." # The Norwegian government have issued us military aid, as well as helping us with volunteers in our fight against the Soviet Union. Hopefully, this will be more than enough to secure a victory over the Russian bear.
 nor.148.a: "Спасибо, Норвегия" # Thank You, Norway

 nor.150.t: "Норвего-шведское сотрудничество" # Norvego-Swedish Cooperation
 nor.150.d: "Норвегия обратилась к нам, стремясь к дальнейшему дипломатическому и военному сотрудничеству между двумя странами. И Норвегия, и Швеция имеют общую цель – обеспечить мир и спокойствие в Скандинавии, в мире, который все больше и больше чреват конфликтами и войнами." # Norway have reached out to us, seeking to further diplomatic and military cooperation between the two nations. Both Norway and Sweden have a common goal in securing peace and tranquility in Scandinavia, in a world that are more and more fraught with conflict and war.
 nor.150.a: "Звучит хорошо, рассчитывайте на нас" # Sounds Good, Count Us In
 nor.150.b: "Нам это не нужно.." # We Don't Need This..

 nor.151.t: "Норвего-датское сотрудничество" # Norvego-Danish Cooperation
 nor.151.d: "Норвегия обратилась к нам, стремясь к дальнейшему дипломатическому и военному сотрудничеству между двумя странами. И Норвегия, и Дания имеют общую цель – обеспечить мир и спокойствие в Скандинавии, в мире, который все больше и больше чреват конфликтами и войнами." # Norway have reached out to us, seeking to further diplomatic and military cooperation between the two nations. Both Norway and Denmark have a common goal in securing peace and tranquility in Scandinavia, in a world that are more and more fraught with conflict and war.

 nor.152.t: "Норвего-финское сотрудничество" # Norvego-Finnish Cooperation
 nor.152.d: "Норвегия обратилась к нам, стремясь к дальнейшему дипломатическому и военному сотрудничеству между двумя странами. И Норвегия, и Финляндия имеют общую цель – обеспечить мир и спокойствие в Скандинавии, в мире, который все больше и больше чреват конфликтами и войнами." # Norway have reached out to us, seeking to further diplomatic and military cooperation between the two nations. Both Norway and Finland have a common goal in securing peace and tranquility in Scandinavia, in a world that are more and more fraught with conflict and war.

 nor.153.t: "Все согласились" # All of Them Agreed
 nor.153.d: "Все наши скандинавские соседи; Швеция, Дания и Финляндия договорились укреплять военное и дипломатическое сотрудничество между странами. Столкнувшись с растущими угрозами со стороны Германии и Советов, мы можем показать, что Скандинавия вместе столкнется с растущей напряженностью." # All our Scandinavian neighbors; Sweden, Denmark and Finland, have agreed to strengthen military and diplomatic cooperation between the nations. Facing the rising threats of the Germans and the Soviets, we are able to show that Scandinavia will face the rising tentions together.
 nor.153.a: "Большой" # Great
 nor.154.t: "Швеция и Дания договорились" # Sweden and Denmark Agreed
 nor.154.d: "Двое наших скандинавских соседей; Швеция и Дания договорились укреплять военное и дипломатическое сотрудничество между странами. Хотя неучастие Финляндии ослабит это сотрудничество, мы по-прежнему остаемся сильным силовым блоком." # Two of our Scandinavian neighbors; Sweden and Denmark, have agreed to strengthen military and diplomatic cooperation between the nations. While the non-participation of Finland will weaken this cooperation, we are still a strong power block.
 nor.155.t: "Дания и Финляндия договорились" # Denmark and Finland Agreed
 nor.155.d: "Двое наших скандинавских соседей; Дания и Финляндия договорились укреплять военное и дипломатическое сотрудничество между странами. Хотя неучастие Швеции ослабит это сотрудничество, мы по-прежнему остаемся сильным силовым блоком." # Two of our Scandinavian neighbors; Denmark and Finland, have agreed to strengthen military and diplomatic cooperation between the nations. While the non-participation of Sweden will weaken this cooperation, we are still a strong power block.
 nor.156.t: "Швеция и Финляндия договорились" # Sweden and Finland Agreed
 nor.156.d: "Двое наших скандинавских соседей; Швеция и Финляндия договорились укреплять военное и дипломатическое сотрудничество между странами. Хотя неучастие Дании ослабит это сотрудничество, мы по-прежнему остаемся сильным силовым блоком." # Two of our Scandinavian neighbors; Sweden and Finland, have agreed to strengthen military and diplomatic cooperation between the nations. While the non-participation of Denmark will weaken this cooperation, we are still a strong power block.
 nor.157.t: "Только Швеция согласилась" # Only Sweden Agreed
 nor.157.d: "Только Швеция согласилась укреплять военное и дипломатическое сотрудничество между странами. Хотя это создаст блок, достаточно мощный, чтобы защитить себя, все равно очень разочаровывает то, что Дания и Финляндия не сотрудничают." # Only Sweden have agreed to strengthen military and diplomatic cooperation between the nations. While this will create a block powerful enough to defend itself, it is still very disappointing that Denmark and Finland isn't cooperating.
 nor.157.a: "облом" # Bummer
 nor.158.t: "Только Дания согласилась" # Only Denmark Agreed
 nor.158.d: "Только Дания согласилась укреплять военное и дипломатическое сотрудничество между странами. Хотя это создаст блок, достаточно мощный, чтобы защитить себя, все равно очень разочаровывает то, что Швеция и Финляндия не сотрудничают." # Only Denmark have agreed to strengthen military and diplomatic cooperation between the nations. While this will create a block powerful enough to defend itself, it is still very disappointing that Sweden and Finland isn't cooperating.
 nor.159.t: "Только Финляндия согласилась" # Only Finland Agreed
 nor.159.d: "Лишь Финляндия согласилась укреплять военное и дипломатическое сотрудничество между странами. Хотя это создаст блок, достаточно мощный, чтобы защитить себя, все равно очень разочаровывает то, что Швеция и Дания не сотрудничают." # Only Finland have agreed to strengthen military and diplomatic cooperation between the nations. While this will create a block powerful enough to defend itself, it is still very disappointing that Sweden and Denmark isn't cooperating.

 nor.160.t: "Норвегия хочет присоединиться к Антанте" # Norway Wants to Join the Entente
 nor.160.d: "Только что в нашу столицу прибыл дипломатический конвой из Норвегии. Норвежцы пришли спросить, могут ли они присоединиться к Антанте. Это могло бы помочь нам защитить Скагеррак от немецких кораблей и избежать того, чтобы шведская торговля сталью оказалась под немецким или советским контролем." # A diplomatic convoy from Norway has just arrived in our capital. The Norwegians came to ask if they can join the Entente. This could be helpful for us in securing the Skagerrak from German ships and avoid that the Swedish steel trade comes under German or Soviet control.
 nor.160.a: "Добро пожаловать в Антанту!" # Welcome to the Entente!
 nor.160.b: "Вы нам не нужны!" # We do not need you!
 nor.161.t: "Франция приветствует нас!" # France Welcomes Us!
 nor.161.d: "Французы были готовы принять нас в свой союз. Это наверняка станет началом долгой дружбы." # The French have been willing to let us in their alliance. This will surely be the start of a long friendship.
 nor.161.a: "Да здравствует Норвегия и Франция!" # Long Live Norway and France
 nor.162.t: "Французы отвергают" # The French Rejects
 nor.162.d: "Французы имели наглость отклонить нашу скромную просьбу. Это не будет забыто нашим руководством и в будущем." # The French had the nerve to reject our humble request. This will not be forgotten by our leadership in the future.
 nor.162.a: "Норвегии не нужна Франция!" # Norway Doesn't Need France!

 nor.163.t: "Норвегия хочет присоединиться к Альянсу защиты Империи" # Norway Wants to Join the Imperial Protection Alliance
 nor.163.d: "Только что в нашу столицу прибыл дипломатический конвой из Норвегии. Норвежцы пришли спросить, могут ли они присоединиться к Альянсу защиты Империи. Это могло бы помочь нам защитить Скагеррак от немецких кораблей и избежать того, чтобы шведская торговля сталью оказалась под немецким или советским контролем." # A diplomatic convoy from Norway has just arrived in our capital. The Norwegians came to ask if they can join the Imperial Protection Alliance. This could be helpful for us in securing the Skagerrak from German ships and avoid that the Swedish steel trade comes under German or Soviet control.
 nor.163.a: "Добро пожаловать в ИПА!" # Welcome to the IPA!
 nor.163.b: "Вы нам не нужны!" # We do not need you!
 nor.164.t: "Британия приветствует нас!" # Britain Welcomes Us!
 nor.164.d: "Британцы были готовы принять нас в свой альянс. Это наверняка станет началом долгой дружбы." # The British have been willing to let us in their alliance. This will surely be the start of a long friendship.
 nor.164.a: "Да здравствует Норвегия и Великобритания!" # Long Live Norway and Britain
 nor.165.t: "Британцы отвергают" # The British Rejects
 nor.165.d: "Британцы имели наглость отклонить нашу скромную просьбу. Это не будет забыто нашим руководством и в будущем." # The British had the nerve to reject our humble request. This will not be forgotten by our leadership in the future.
 nor.165.a: "Норвегии не нужна Британия!" # Norway Doesn't Need Britain!

 nor.200.t: "Перераспределение начинается" # Redistribution Begins
 nor.200.d: "Начался приказ о перераспределении земли от богатых землевладельцев в руки промышленных рабочих и низших классов." # The orders of land redistribution from rich landowners into the hands of industrial workers and the lower classes has begun.
 nor.200.a: "Пусть это начнется!" # Let this begin!

