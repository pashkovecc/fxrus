### Ideas
 MOR_harsh_environment: "Суровая окружающая среда" # Harsh Environment
 MOR_harsh_environment_desc: "В целом, жаркая, засушливая и неподходящая для промышленной экспансии, инвесторы отказываются помогать колониальному развитию Французской Северной Африки. Наши ученые стремятся доказать, что эти инвесторы ошибаются. Используя колбы, мензурки и выдумывая всякое дерьмо из ниоткуда, они могли бы провести «исследование», которое докажет, что эти инвесторы не правы. Правда, через какое время он прибудет, неизвестно." # Generally hot, arid, and not suited for industrial expansion, investors refuse to assist colonial development of French North Africa. Our scientists seek to prove these investors wrong. By using flasks, beakers, and making shit up out of nowhere, they might be able to conjure up a 'study' that proves these investors incorrect. How long until it arrives is unknown though.
