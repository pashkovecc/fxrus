 MLT_FUHRERREICH_DESC: "На протяжении веков легендарная история Мальты была отмечена иностранным владычеством. От финикийцев до римлян, арабов, норманнов и рыцарей Святого Иоанна — это стойкое островное государство было желанным призом в Средиземноморье. Британское колониальное правление принесло как процветание, так и проблемы. Мальтийцы, доблестные перед лицом невзгод, переносили лишения и лишения. Поскольку война маячила на горизонте, а ее стратегическое положение в Средиземном море, несомненно, играет важную роль для Соединенного Королевства." # For centuries, Malta's storied history was marked by foreign dominion. From the Phoenicians to the Romans, Arabs, Normans, and the Knights of St. John, this resilient island nation was a coveted prize in the Mediterranean. British colonial rule brought both prosperity and challenges. The Maltese, valiant in the face of adversity, endured hardship and hardship. As war loomed into the horizon, and its strategic position in the Mediterranean, Malta is undoubtedly play its importance to the United Kingdom.

