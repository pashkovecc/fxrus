 MLT_to_serve_the_Empire: "Служить Империи" # To Serve the Empire
 MLT_to_serve_the_Empire_desc: "Мальта была частью Британской империи с тех пор, как мы себя помним, ровно с 1813 года, почти 123 года назад или, точнее, с тех пор, как британский флот выгнал Наполеона с острова в 1800 году, так что Мальта находилась под крылом Империи 136 лет, теперь Мальта будет хорошим подданным и будет служить Империи." # Malta has been a part of the British Empire for as long as one can remember, exactly since 1813, nearly 123 years ago or more exactly since the British navy kicked Napoleon from the island in 1800, so Malta has been under the wing of the Empire fo 136 years, now Malta will be a good subject and serve the Empire.
 MLT_Support_Democrats: "Поддержите демократов" # Support the Democrats
 MLT_Support_Democrats_desc: "Нам необходимо поддержать все демократические партии, чтобы обеспечить стабильность Мальты." # We need to Support all the democratic parties to ensure the Stablity of Malta
 MLT_Fight_Socialism: "Борьба с Лейбористской партией" # Fight th Labour Party
 MLT_Fight_Socialism_desc: "Мальтийская Лейбористская партия — это не только социал-демократия и солнечная сторона, некоторые из ее элементов — это коммунисты или советские русские, пришедшие в этот средиземноморский рай, чтобы уничтожить его во имя народа." # The Maltese Labour party isn't all social democracy and sunshine, some of it's elements are Communist or Soviet Russians who came to this mediterranean heaven to destroy it in the name of the People.
 MLT_Close_Italian_Schools: "Закрыть итальянские школы" # Close Down Italian Schools
 MLT_Close_Italian_Schools_desc: "Эти противные итальянцы думают, что Мальта — их собственность, поэтому единственный способ доказать им это — закрыть все школы, в которых преподают итальянский язык." # Those Nasty Italians think that Malta is their property, so the only way to show them is by closing all schools that teach Italian.
 MLT_Tolerate_Maltese: "Освойте мальтийский язык" # Embrace Maltese Language
 MLT_Tolerate_Maltese_desc: "это Мальта, и здесь люди должны говорить на мальтийском языке, а не на итальянском или арабском, поэтому наряду с английским мальтийский язык также должен быть официальным языком." # this is Malta and here the people should speak Maltese, not Italian or Arabic, so alongside English, Maltese should be an Official language too.
 MLT_Impose_English: "Навязывайте английский" # Impose English
 MLT_Impose_English_desc: "Мальта — британская колония, и во всех британских колониях люди должны говорить по-английски." # Malta is a British colony and in all British colonies people should speak English.
 MLT_Fight_Nationalism: "Борьба с националистическим блоком" # Fight Nationalist Bloc
 MLT_Fight_Nationalism_desc: "Националистическая партия и ФМСН — это всего лишь кучка итальянцев, которые хотят передать весь контроль Риму." # The Nationalist Party and the FMSN are just a bunch of Italians who want to give all control to Rome.
 MLT_More_liberties: "Отменить военное положение" # Repeal Martial Law
 MLT_More_liberties_desc: "Сейчас на Мальте достаточно стабилизировалось, и отмена военного положения – это нормально." # Now Malta has stablized enough and lifting the Martial law is just normal.
 MLT_More_British_Settlers: "Больше британских поселенцев" # More British Settlers
 MLT_More_British_Settlers_desc: "Чем больше англичан, тем лучше" # The More Englishmen the Merrier
 MLT_Constitutionalist_support: "Поддержка конституционалистов" # Constitutionalist Support
 MLT_Constitutionalist_support_desc: "Партия конституционалистов, возглавляемая Джеральдом Полом Джозефом Каэтаном Кармелом Энтони Мартином Стриклендом, шестым графом делла Катеной, первым бароном Стриклендом и его дочерью Мэйбл Эделин Стрикленд, являются британцами по происхождению и мальтийцами по происхождению, поэтому поддерживать их - неплохая идея, даже если в прошлом у нас были небольшие разногласия, но Мальта нуждается в поддержке всех своих подданных." # The Constitutionalist party led by Gerald Paul Joseph Cajetan Carmel Antony Martin Strickland, 6th Count della Catena, 1st Baron Strickland and his daughter Mabel Edeline Strickland are British by origin and Maltese by birth so supporting them isn't a bad idea even if we had a little disagreements in the past, but Malta needs the support of all of it's subjects.
 MLT_Future: "Будущее Мальты" # The Future of Malta
 MLT_Future_desc: "Теперь Мальта решит свое будущее" # Now Malta will decide it's future

 MLT_Strengthern_british_command: "Усиление британского командования" # Strengthern British Command
 MLT_Strengthern_british_command_desc: "Британские военные на Мальте недостаточно сильны, поэтому нам придется усилить их, чтобы защитить этот крошечный остров от всех внешних угроз." # The British Military in Malta is not strong enough so we will need to strengthern them to protect this tiny island from all external threats
 MLT_squesh_manpower: "Призывники Мальтийских граждан" # Conscript Maltese Citizens
 MLT_squesh_manpower_desc: "Учитывая наше положение в Средиземноморье и непосредственную близость к Италии, нас наверняка ждут времена кризисов и конфликтов. Потребность в соответствующем персонале становится первостепенной. Чтобы обеспечить оборону и стабильность Мальты, крайне важно максимально увеличить доступную рабочую силу. В результате общие уведомления о призыве будут готовиться и выпускаться поэтапно. Хотя призыв на военную службу вызовет некоторое недовольство среди населения в целом, сила и устойчивость нации зависят от ее рабочей силы. В условиях растущей напряженности на далеких берегах необходимо отказаться от нашей зависимости от добровольцев для обеспечения оборонной готовности Мальты. Мы также можем использовать призывников для различных проектов, таких как строительство и промышленность Мальты. Этим секторам потребуется значительная помощь и колоссальные усилия, чтобы быть готовыми к будущим начинаниям, включая войну, если она когда-нибудь дойдет до нашего порога." # With our position in the Mediterranean and close proximity to Italy, times of crisis and conflict are surely ahead. The need for adequate personnel becomes paramount. To ensure Malta's defense and stability, it is crucial to maximize available manpower. As a result, general conscription notices will be prepared and issued in phases. While conscription will lead to some resentment within our general population, a nation's strength and resilience depend on its manpower. With growing tensions far away on distant shores, it is necessary to move away from our dependence on volunteers to ensure Malta's defense readiness. We can also utilize conscripts for various projects such as Malta's construction and industry sectors. These sectors will need significant assistance and monumental effort to be ready for future endeavors, including war if it ever comes to our doorstep.
 MLT_begin_navy_reforms: "На пути к истинно мальтийскому военно-морскому флоту" # Towards a Truly Maltese Navy
 MLT_begin_navy_reforms_desc: "Собрав одну из величайших армад со времен античности, турки-османы толпами напали на Мальту во время памятной и страшной Великой осады Мальты в 1565 году. Их флот состоял почти из двух кораблей, на которых находились 40 тысяч мародеров, намеревавшихся стереть Мальту с лица земли. Прежде чем прибыла европейская помощь и заставила турок-османов отступить, Мальта удерживалась четыре месяца шестью смельчаками. Чтобы гарантировать, что такая инициатива снова будет поддержана любым противником, который может совершить аналогичную ошибку при вторжении на Мальту, необходимо будет создать еще одну линию защиты. Мальтийский флот составит основу этой линии обороны. Это гарантирует, что ни один вражеский комбатант не ступит на наши берега. Тем не менее, какими бы ограниченными судостроительными мощностями или верфями в Гранд-Харборе мы ни располагали, они унаследованы от британских усилий до Вельткрига. Именно с помощью этих объектов мы заложим основу для создания мальтийского военно-морского флота, вооружения рыболовных траулеров." # With one of the grandest armadas assembled since antiquity, the Ottoman Turks descended upon Malta in droves during the memorable and frightful Great Siege of Malta in 1565. Their fleet consisted of nearly 2 vessels, hosting 40,0 marauders who intended to wipe Malta off the face of the earth. Before European relief arrived and forced the Ottoman Turks into a shattered retreat, Malta held for four months with 6, brave souls. In order to ensure that such an initiative is once again championed by any foe that may make such a similar mistake in invading Malta, another line of defense will need to be established. A Maltese navy will form the basis of this line of defense. This will ensure that no enemy combatant steps foot on our shores. However, whatever limited shipbuilding facilities or dockyards within the Grand Harbor that we possess are inherited from British efforts prior to the Weltkrieg. It is with these facilities that we will lay the groundwork for the establishment of the Maltese navy, with the arming of fishing trawlers.
 MLT_modernization_of_da_guns: "Модернизация огневой мощи гарнизона" # Modernize the Garrison's Firepower
 MLT_modernization_of_da_guns_desc: "После наших реформ мальтийские гарнизоны столкнулись с серьезными проблемами с вооружением. Во многом это связано с тем, что арсеналы Мальты не обслуживались в хорошем состоянии на протяжении десятилетий. Однако гарнизон будет обновлен в соответствии с современными британскими стандартами за счет получения оружия из веселой старой Англии. По крайней мере, мы сможем достаточно скоро заменить устаревшее вооружение неиспользованными запасами из Англии. Это позволит мальтийскому британскому гарнизону иметь современный арсенал и повысить шансы на борьбу с любым, кто осмелится вторгнуться на Мальту." # Since our reform efforts, Maltese garrisons have faced critical weaponry issues. This is largely due to Malta's armories not being well maintained for decades. The garrison is, however, will be updated to match contemporary British standards by obtaining weapons from Jolly old England. We can at least replace outdated weaponry with unused stockpiles from England soon enough. This will allow the Maltese British garrison to have an up-to-date arsenal and stand a better chance of fighting anyone who dares to invade Malta.
 MLT_defenive_army: "Чисто оборонительная сила" # A Purely Defensive Force
 MLT_defenive_army_desc: "Несмотря на все наши усилия, мы не хотим, чтобы сын Мальты когда-либо был отправлен на чужие берега для участия в конфликте такого масштаба, как первый Вельткриг. Приоритет установлен: Мальта и ее острова — единственные редуты, достойные выдержать осаду. Ни кайзер, ни председатель не стоят тысячи мальтийских сыновей. В рамках подготовки к вероятной высадке десанта на Мальту на берегах будут построены бункеры, а также подготовлены и тщательно отработаны доктрины. Береговое патрулирование будет осуществляться ежедневно, будут построены огневые точки как зенитной артиллерии, так и береговых батарей. Благодаря своему гарнизону, готовому противостоять любой попытке прорыва на Мальту, остров станет неприступной крепостью Средиземноморья." # For all of our efforts, there is no desire that a son of Malta will ever be sent off to foreign shores to fight in a conflict on a similar scale to the first Weltkrieg. The priority is established - Malta and its isles are the only redoubts worthy of withstanding a siege for. No Kaiser nor Chairman is worth a thousand of Malta's sons. In preparation for plausible amphibious landings against Malta, bunkers will be built on the shores and doctrines will be prepared and intensely drilled. Coastal patrols will occur daily and both anti-aircraft artillery and coastal battery emplacements will be constructed. With its garrison ready to deal with any attempt to breach Malta, the island will be an impregnable fortress of the Mediterranean.
 MLT_army_of_invade: "Лучшая защита..." # The Best Defense...
 MLT_army_of_invade_desc: "Несмотря на наши желания и в наших интересах, Мальта теперь должна готовиться к боевым действиям не только внутри своей территории, но и за ее пределами. Однако сыновья Мальты ни в коем случае не являются расходным материалом, и поэтому нам необходимо будет гарантировать, что любая операция, которую мы предпринимаем, будет стратегической и точной. Мы также должны осознавать свои ограничения и действовать соответственно, понимая, что жизни наших солдат имеют первостепенное значение. Наш офицерский корпус уже начал изучать доктрины десантной войны, чтобы избежать кровавых вод на чужих берегах во время любого прибрежного нападения. Кроме того, у них будет необходимое оборудование, чтобы свести к минимуму потери и добиться успеха в выполнении своей миссии. Морской бой — не единственное средство, которое мы можем использовать, чтобы одержать верх над врагом, но и вертикальный охват — смерть сверху. Прыжок из самолета — одно из самых безопасных поступков, которые может сделать человек, при условии, что он соблюдает надлежащие процедуры. Воздушное крыло уже начало несколько экспериментов по развертыванию с самолетов, добившись большого успеха с первой группой добровольцев. Благодаря этим разработкам мы можем создать силу, которая сможет причинить бесконечный вред нашим врагам еще до того, как у них появится шанс дать нам отпор." # In spite of our wishes or in our best interest, Malta must now prepare for combat not only within its own realm, but also beyond. However, Malta's sons are not expendable by any means, and as such, we will need to ensure that any operation we undertake is strategic and precise. We must also be aware of our limitations and act accordingly, understanding that our soldiers' lives are of the utmost importance. Our officer corps has already begun learning amphibious war doctrines to avoid bloody waters on foreign shores during any beach assault. In addition, they will have the proper equipment needed to minimize casualties and succeed in their mission. Amphibious warfare is not the only means we can use to gain a upper hand on our enemy, but also vertical envelopment - death from above. Jumping out of an airplane is one of the safest things a man can do, provided he follows proper procedure. The Air Wing has already started several experiments concerning deployment from aircraft, seeing large success with an initial batch of volunteers. With these developments, we can create a force that can do an infinite deal of mischief against our enemies before they even have a chance of repelling us.
 MLT_start_air_corp: "Воздушное крыло отправляется в полет" # The Air Wing Takes Flight
 MLT_start_air_corp_desc: "После окончания Вельткрига самолеты доказали свою военную ценность, а не просто интересные игрушки. Хотя для Мальты нецелесообразно рассматривать возможность приобретения самолетов у других стран, наша непосредственная близость к авиабазам в Северной Африке и на итальянском полуострове делает нас беззащитными перед воздушными налетами в случае возникновения конфликта. Поэтому необходимо укрепить еще одну линию защиты суверенитета Мальты - воздушный корпус, который поднимется в небо и позволит Мальте стать непотопляемым авианосцем посреди Средиземного моря." # Since the end of the Weltkrieg, airplanes have proved to be of military value, and not just interesting toys. While it is impractical for Malta to consider aircraft procurement from other nations, our close proximity to air bases in North Africa and the Italian peninsula leaves us defenseless against air raids should conflict occur. Therefore, it is necessary to bolster another line of defense to Malta's sovereignty - an air corps to take to the skies and allow Malta to become an unsinkable aircraft carrier in the middle of the Mediterranean.
 MLT_mill_enigies: "Земля инженеров" # A Land of Engineers
 MLT_mill_enigies_desc: "Если военная история Мальты и показывает что-то, так это то, что мальтийский народ обладает инженерными способностями. Будь то могучие крепости, защищавшие наш народ от угроз с моря, или превращение природной гавани в самую могущественную гавань на море, никто не может усомниться в наших славных достижениях. С приближением второй Великой войны пришло время извлечь выгоду из нашего инженерного духа. Правительство дало зеленый свет созданию новой Мальтийской инженерной корпорации. Эта корпорация будет отвечать за управление крупными военными активами, исследование новейших проектов и помощь гражданским властям в восстановлении поврежденной инфраструктуры. Создав возможности для процветания наших знаменитых творческих людей, Мальта, несомненно, станет величайшим инженерным центром в мире." # If the military history of Malta shows one thing, it is that the Maltese people have a knack for Engineering. Be it the mighty fortresses which protected our people against sea-bound threats or the transformation of a nature harbor into the mightiest Harbor in the seas, none can doubt our glorious accomplishments. With a second Great War clearing approaching, it is time we capitalize on our engineering spirit. The government has greenlit the creation of a new Maltese Corp of Engineers. This Corp shall be responsible for conducting major military assets, researching the latest projects and assisting civil authorities in repairing damaged infrastructure. By creating an outlet for our famously creative people to flourish, there is no doubt Malta will become the greatest engineering hub in the world.
 MLT_radar: "РАДАР-проекты" # RADAR Projects
 MLT_radar_desc: "РАДАР, или радиообнаружение и дальнометрия, — это новейшая военная технология. Хотя RADAR все еще является экспериментальным, он позволяет отслеживать и обнаруживать корабли или самолеты в заданной области. Хотя Мальта далеко опережает другие страны в этом исследовании, похоже, что до их выселения британцы проявляли к ней интерес. Учитывая наше положение посреди моря с интенсивным движением транспорта, нет никаких сомнений в том, что RADAR будет очень полезен, если мы сможем взломать его код." # RADAR, or radio detection and ranging, is the latest in military tech. While still highly experimental, RADAR allows the tracking and detection of ships or planes in a given area. While Malta is far beyond other nations in this research, it appears that prior to their eviction, the British, took an interest in it. Due to our position in the middle of a highly trafficked sea, there is little doubt that RADAR would be of great use, provided we can crack it's code.
 MLT_islandwide_fort: "Проект Мальтийского замка" # The Malta Castle Project
 MLT_islandwide_fort_desc: "На вершинах многих холмов или с видом на море во многих местах Мальты расположены могучие замки. Когда-то многие из этих замков использовались рыцарями в качестве мест защиты и защиты, но сейчас они разрушены или бесполезны для защиты. Однако существование этих могучих крепостей побудило Инженерный корпус начать свой последний проект. Этот план, получивший название «Проект Каструм Мальта», предусматривает, что Мальта полностью и полностью подготовлена ​​к попытке вторжения. Строя новые прибрежные бункеры, контрольно-пропускные пункты в городах и даже сообщая о нескольких старых крепостях, Корпорация стремится создать нерушимую Мальту, и даже если силы вторжения высадятся, мы будем сражаться с ними изо всех сил, переходя из города в город, с острова на остров, пока они либо не будут отброшены, либо Мальта не лишит их воли к борьбе." # Atop many hills or overlooking the sea in many places on Malta are mighty castles. Once used by the Knights among others as places of protection and defense, many of these castles have fallen into ruin, or otherwise are useless for defense. However, the existence of these mighty fortresses has led the Corp of Engineers to start their latest project. Dubbed the Castrum Malta Project, the plan envisions a Malta completely and utterly prepared for an attempt at invasion. By building new coastal bunkers, checkpoints in cities and even reporting a few old fortresses, the Corp seeks to create an unbreakable Malta, and even should an invading force land, we shall fight them tooth and nail, going from city to city, island to island, until either they are repelled, or Malta has drained them of the will to fight on.
 MLT_modernize_dockyard: "Обновление и модернизация верфи Мальты" # Update and Modernize the Malta Dockyard
 MLT_modernize_dockyard_desc: "Мальтийская верфь, примыкающая к Гранд-Харбору, когда-то была одной из крупнейших верфей Королевского флота. Верфь, являющаяся идеальным местом остановки на пути к Суэцкому каналу и обратно, знавала лучшие дни. Пока британцы пытались его сохранить, верфь быстро отстала в технологиях. Не желая вкладывать огромные средства в его модернизацию, британцы просто оставили его в руках мальтийского правительства. Руководству верфи был представлен карт-бланш на его модернизацию и обновление. Никаких расходов не следует распределять, ибо Мальте нужна верфь, как рыбе нужна вода." # Attached to the Grand Harbor, the Malta Dockyard was once one of the largest dockyards for the Royal Navy. A perfect stopping point on their journey to and from the Suez Canal, the Dockyard has seen better days. While the British attempted to maintain it, the Dockyard quickly fell behind in technology. Not wishing to invest the vast funds to modernize it, the British simply left it in the hands of the Maltese Government. A blank cheque has been presented to the officials of the Dockyard, to modernize and update it. No expense shall be spread, for Malta needs the Dockyard, as a fish needs water.
 MLT_bigass_guns: "Модернизация крепостных орудий" # Retooling the Fortress Guns
 MLT_bigass_guns_desc: "На стенах многих древних крепостей Мальты стоит ряд 10-тонных орудий. Установленные для предотвращения набегов вражеских сил, в наши дни они вряд ли справятся с этой задачей. Однако это не значит, что у наших прародителей не было правильной идеи. Чтобы обеспечить должную защиту наших людей и островов, эти некогда мощные орудия должны быть обновлены, чтобы они могли отражать и атаковать современные суда. Нет ничего более ценного, чем наши люди, поэтому мы должны защитить их любой ценой." # On the walls of many of Malta's ancient fortresses are a series of 10-ton guns. Installed to prevent raiding by enemy forces, in this day and age, they are hardly up for the task. However, that is not to say that our progenitors did not have the right idea. To ensure that our people and islands are properly protected, these once mighty guns shall be updated to be able to repeal and attack modern vessels. Nothing is more valuable than our people, thus we must protect them at all costs.
 MLT_marine_corp: "Основы мальтийской морской пехоты" # Foundations of a Maltese Marine Corp
 MLT_marine_corp_desc: "Почти никогда в своей истории Мальта не могла покинуть свои берега. Хотя это было благословением, поскольку многие в нашем правительстве желают расширить нашу территорию, мы должны иметь возможность по-настоящему покинуть свои собственные берега. Мало того, мы должны иметь возможность высадиться и на берегах врага. С этой целью правительство дало зеленый свет программе создания нашей собственной морской пехоты. Они будут первыми людьми Мальты, которые высадятся и уступят место остальной части армии. Без сомнения, создание такого рода войск будет дорогостоящим, но если мы хотим выйти за пределы наших родных островов, у нас нет другого выбора, кроме как построить его." # Almost never in it's history has Malta been able to leave it's own shores. While this has been a blessing, with many in our government wishing to expand our territory, we must be able to truly leave our own shores. Not only this, but we must be able to land on an enemy's shores as well. To this end, the government has greenlit a program to create our own Marine Corp. They shall be Malta's first people to land and make way for the rest of the army. It will no doubt be costly to create such a branch of the military, but if we wish to expand beyond just our home islands, we have no choice but to build one.
 MLT_Guardians_of_war_virtue: "Стражи военной добродетели" # Guardians of War Virtue
 MLT_Guardians_of_war_virtue_desc: "Наше наследие берет свое начало с 1099 года, с момента основания рыцарей-госпитальеров, и охватывает девять столетий. Наше наследие длинное и гордое, мы защищаем нашу крепость от корсаров, турок-османов и амбициозных французских революционеров. Таким образом, мы можем с гордостью заявлять, что являемся Хранителями военной доблести. Благодаря этим реформам мы эффективно добились этого, поскольку военные готовы преодолеть любые препятствия, которые могут возникнуть. Однако мы живем в мире, который катится к чертям так быстро, как только может это сделать каждый. Нам снова придется защищать нашу крепость. Мы уверены, что наше наследие и военная доблесть станут неоценимым активом в этой борьбе. Мы с гордостью встречаем любые вызовы, которые могут возникнуть перед нами, поскольку наследие предыдущих госпитальеров и мальтийских рыцарей воплощает в себе дух храбрых солдат, которые защищали Мальту в прошлом и которые снова воодушевятся, чтобы занять стены, как они это делали в былые времена." # Our legacy dates back to 1099, with the Knights Hospitaller founding, and spans nine centuries. Our legacy is long and proud, defending our stronghold against corsairs, Ottoman Turks, and ambitious French Revolutionaries. As such, we can proudly claim to be the Custodians of Military Prowess. Through these reforms, we've effectively done so as the military is ready to take on any obstacle that may present itself. However, we're living in a world that's blowing itself to hell as fast as everybody can arrange it. We will again need to defend our stronghold. We are confident that our legacy and Military Prowess will be an invaluable asset in the fight. It is with pride that we face any challenges that may arise to face us, as the legacy of the previous Hospitallers and Knights of Malta embodies the spirit of the brave soldiers who defended Malta in the past and will once again reinvigorate themselves to man the walls as they did in yore.

 MLT_build_up_eco: "Развитие мальтийской экономики" # Building up the Maltese Economy
 MLT_build_up_eco_desc: "Хотя экономика Мальты не такая большая, как ее европейские коллеги, она остается стабильной, но застойной. В прошлом веке экономика Мальты процветала и процветала благодаря наполеоновским войнам, поскольку она стала крупным торговым центром в Средиземноморье. Открытие Суэцкого канала в 1869 году также принесло большую пользу Мальте, поскольку Средиземное море стало «мировой торговой магистралью», не говоря уже о том, что мы уже были базой операций британского Средиземноморского флота и угольной станцией для судов, приходящих из-за канала. Однако на заре 20-го века Мальта обнаружила, что ее былое процветание тревожно падает, поскольку корабли перешли с угля на нефть и увеличились в размерах. Это привело к сокращению количества заходов в порты Мальты, поскольку мы больше не можем принимать эти суда на наших мощностях. В результате мы должны начать рассматривать расширение экономического сектора, чтобы постепенно отказаться от нашей зависимости от порта - было несколько предложений, но наиболее распространенными являются расширение наших морских объектов, развитие туристической экономики и даже банковское дело." # While Malta's economy isn't as large as its European counterparts, it remains stable - but stagnant. The past century witnessed Malta's economy flourish and prosper due to the Napoleonic Wars as it became a major trading hub within the Mediterranean. The opening of the Suez Canal in 1869 also greatly benefitted Malta with the Mediterranean becoming the "world highway of trade", not to mention that we were already a base of operations for the British Mediterranean Fleet and a coaling station for vessels sailing from beyond the Canal. However, at the dawn of the 20th century, Malta found its former prosperity declining worryingly as ships switched from coal to oil and grew in size. This has led to the rate of port calls in Malta shrinking, as we can no longer accommodate these ships with our facilities. As a result, we must start looking at expanding the economic sector to gradually shift away from our reliance on the port - there have been several suggestions but expanding our maritime facilities, nurturing a tourist economy, and even banking are the most prevalent ones.
 MLT_expand_great_harbor: "Расширить Великую гавань" # Expand the Great Harbor
 MLT_expand_great_harbor_desc: "Чтобы начать избавлять Мальту от зависимости от своих портов, по иронии судьбы, крайне важно начать реконструкцию объектов, имеющихся в наших портах. Это сделано для того, чтобы он мог вместить тоннаж большинства морских судов, присутствующих в Средиземноморье, а именно грузовых судов и нефтяных танкеров. Это также первый значительный шаг, который позволит нам медленно восстановить наше экономическое процветание. Мы также привлекли частных инвесторов из соседних стран для финансирования этих усилий. Это позволило нам начать процесс строительства модернизированных причалов и доков для дальнейшего повышения эффективности наших портов, позволяя им принимать более крупные суда. Окружающие предприятия в этих районах также были отремонтированы, чтобы привлечь моряков во время заходов в порт. Надеемся, что эти инвестиции принесут долгосрочную выгоду нашим портам и местной экономике." # To begin shifting Malta away from its reliance on its ports, it is ironically critical to initiate renovations of the facilities present at our ports. This is so that it can accommodate the tonnage of most maritime vessels present in the Mediterranean - namely cargo ships and oil tankers. This is also the first significant step to allowing us to slowly rebuild our economic prosperity. We have also acquired private investors from surrounding nations to finance these efforts. This has allowed us to begin the process of constructing upgraded jetties and docks to further enhance the efficiency of our ports, enabling them to receive larger vessels. Surrounding businesses in these areas have likewise been renovated to attract sailors during port calls. Hopefully, this investment will yield long-term benefits for our ports and the local economy.
 MLT_modernized_med_pitstop: "Модернизированный пит-стоп в самом сердце Средиземноморья" # A Modernized Pitstop in the Heart of the Mediterranean
 MLT_modernized_med_pitstop_desc: "Вторым шагом в нашей инициативе по восстановлению Мальты ее былого процветания как перекрестка между Европой, Африкой и Левантом является значительное расширение наших морских возможностей. Заправочные станции на Мальте будут отремонтированы и расширены, чтобы принять большую часть проходящего мимо морского транспорта. Мы также планируем добавить новые порты и гавани для дальнейшего приема более крупных кораблей со всего мира. Это позволит нам увеличить торговлю и туризм, что еще больше повысит наше благосостояние. Наконец, мы планируем завершить модернизацию существующих портов и гаваней для обеспечения эффективной работы, а также построить сухой док, который также позволит проводить операции по техническому обслуживанию и ремонту судов. Все эти планы будут финансироваться как государством, так и частными инвесторами с целью создания современной и эффективной портовой инфраструктуры. Это позволит нам удовлетворить потребности современного судоходства и обеспечить безопасную гавань для всех судов, проходящих через наши воды." # The second step in our initiative in restoring Malta to its former prosperity as a crossroads between Europe, Africa, and the Levant is by greatly expanding our maritime facilities. The fueling stations in Malta will be renovated and expanded in order to accommodate most sea traffic passing by. We also plan to add new ports and harbors to further accommodate larger ships from all over the world. This will allow us to increase trade and tourism, further increasing our prosperity. Finally, we plan to finish modernize our existing ports and harbors to ensure efficient operations, along with a dry dock to also allow for maintenance operations and ship repairs. All these plans will be funded by both the government and private investors, with the goal of creating a modern and efficient port infrastructure. This will ensure that we can keep up with the demands of modern shipping and provide a safe harbor for all vessels that come through our waters.
 MLT_expand_aquacultural_productaion: "Фонд расширения аквакультуры" # Fund Aquaculture Expansion
 MLT_expand_aquacultural_productaion_desc: "Состояние сельскохозяйственного сектора на Мальте никогда не было стабильным: первые жители наших островов ухудшили качество почвы до такой степени, что Мальта стала пригодной для проживания. В результате на протяжении большей части нашей истории нам приходилось полагаться на импорт большей части продуктов питания. Чтобы сохранить некоторую самоопределение, мы рассматриваем возможность расширения нашего сектора аквакультуры, чтобы расширить нашу рыбную промышленность. В Средиземноморье имеется огромное разнообразие природных творений, из которых мы, несомненно, можем увеличить наш улов, особенно атлантического голубого тунца. Мы надеемся увеличить улов этого вида за счет строительства дополнительных рыбных хозяйств и субсидий рыбакам, чтобы обеспечить более устойчивые источники пищи для нашего народа. Кроме того, мы сможем экспортировать рыбу в другие страны, принося экономическую выгоду нашей стране." # The state of the agricultural sector in Malta has never been stable - our islands first inhabitants having degraded the soil quality to the point of Malta becoming inhabitable. As a result, we have had to rely on importing most of our foodstuffs for most of our history. In order to preserve some self-determination, we are looking into expanding our aquaculture sector to expand our fishing industry. The Mediterranean hosts a massive variety of wealth of natural creations of which we can surely increase our catch from - especially the Atlantic Bluefin tuna. We are hoping to increase our catch of this species through the construction of additional fisheries and subsidies to fishermen in order to provide more sustainable food sources for our people. Additionally, we will be able to export the fish to other countries, providing economic benefits to our country.
 MLT_increase_supply_runs: "Увеличение пробега линий снабжения" # Increase Supplyline Runs
 MLT_increase_supply_runs_desc: "Несмотря на то, что наше расширение аквакультуры имело некоторый ограниченный успех, этого недостаточно для долгосрочной стабилизации продовольственной безопасности Мальты. В результате мы должны воспользоваться нашей непосредственной близостью к морским путям и увеличить импорт зерна и продуктов питания из зарубежных стран. Это на время ограничит нагрузку на местных фермеров. Мы также должны разработать долгосрочные стратегии, чтобы в некоторой степени увеличить наши сельскохозяйственные производственные мощности и обеспечить поставки продовольствия на будущее, поскольку на горизонте маячит конфликт. Чтобы накопить пшеницу и другие зерновые, мы свяжемся с такими странами, как Франция, Италия и Украина, чтобы определить, можно ли достичь соглашений, которые помогут нам в нашей опасной ситуации. Чтобы поддержать эту инициативу, правительство профинансирует строительство и покупку нескольких грузовых судов. Это обеспечит безопасность наших маршрутов поставок продовольствия и что никто на Мальте не останется голодным." # Even though our aquaculture expansion has had some limited success, it is not sufficient to stabilize Malta's food security long-term. As a result, we must take advantage of our close proximity to shipping lanes and increase our imports of grains and foodstuffs from foreign nations. This will limit the strain placed on local farmers for the time being. We must also develop long-term strategies to increase our agricultural production capacity to some extent and secure our food supply for the future, as conflict looms on the horizon. To stockpile wheat and other grains, we will contact nations such as France, Italy, and Ukraine to determine whether agreements can be reached to aid us in our precarious situation. In order to support this initiative, the government will fund the construction and purchase of several cargo vessels. This will ensure that our food supply routes remain secure, and that no one in Malta remains hungry.
 MLT_encourge_investments: "Поощряйте гражданские инвестиции" # Encourage Civilian Investment
 MLT_encourge_investments_desc: "Хотя мы, возможно, и сделали многое для поощрения более диверсифицированной экономики, мы можем сделать очень многое. Если мы действительно хотим, чтобы мальтийская экономика процветала, мы должны заставить население также открыть свои карманы. Будь то предложение налоговых льгот для новых предприятий или попытка заставить людей просто покупать местную продукцию, мы должны сделать все возможное, чтобы обеспечить приток денег." # While we may have done much to encourage a more diverse economy, there is only so much we can do. If we truly wish for the Maltese economy to flourish, we must get the population to also open up their pockets. Be it offering tax breaks for new businesses or by trying to get people to simply buy local, we must do everything we can to get the money flowing.
 MLT_centeral_bank: "Создание Центрального банка Мальты" # Creation of the Central Bank of Malta
 MLT_centeral_bank_desc: "К большому шоку нашего собственного правительства, наш народ начал массово вкладывать деньги в местную экономику! Однако дошло до того, что больше людей начинают бизнес, чем инвесторов, которые действительно вкладывают деньги. Чтобы решить эту проблему и обеспечить определенный уровень стабильности в нашей экономике, правительство решило создать Центральный банк. Хотя для полного создания Центрального банка потребуется время, со временем он приведет к беспрецедентному процветанию нашего народа." # Much to even the shock of our own government, our people have begun massively investing money into our local economy! However, it has gotten to the point that more people are starting businesses than there are investors to actually invest. To solve this, and to ensure a certain level of stability in our economy, the government has decided to birth a Central Bank. While it will take time to fully establish, the Central Bank, in time, will lead to an unprecedented amount of prosperity for our people.
 MLT_service_to_sailors: "Услуги для моряков" # Services for Sailors
 MLT_service_to_sailors_desc: "Среди различных услуг на Мальте большинство уже ориентировано на моряков, которые составляют большинство тех, кто высаживается на наших прекрасных берегах. Пытаясь развивать нашу экономику, мы не можем забывать тех, кто составляет основу нашей экономики. Таким образом, мы должны принять меры и обеспечить, чтобы наши моряки получили то, что они хотят. Будь то пабы, еда или даже плотские желания, мы должны обеспечить удовлетворение моряков любой ценой." # Among the varying services in Malta, most are already geared for the sailors, who make up the majority of those who land on our fair shores. As we go about attempting to grow our economy, we cannot forgot those who make up the backbone of our economy. Thus, we must doubleback and ensure that our sailors have  what they want. Be it pubs, food or even desires of the flesh, we must ensure that the sailors are satisfied, no matter the cost.
 MLT_deverisy_harbor: "Разнообразьте гавань" # Diversify the Harbor
 MLT_deverisy_harbor_desc: "Гранд-Харбор, особенно в последние годы, во многом отстал. Хотя когда-то здесь пережили почти всех, кто высадился на Мальте при Рейхе, ситуация сильно изменилась. Гавань была почти исключительно остановкой для военных судов. Так не может продолжаться. Гавань должна стать открытым пространством для всех, независимо от того, откуда они приходят. Хотя такую ​​политику может быть трудно проводить в жизнь в военное время, в мирное время она, несомненно, поможет нам наполнить нашу казну." # The Grand Harbor, in recent years especially, has fallen behind in many ways. While it once survived almost all who would land in Malta, under the Reich, this has changed greatly. The Harbor had been made almost exclusively a stop for military vessels. This cannot remain the case. The Harbor shall be made an open space, for all, no matter where they come from. While such a policy may be hard to enforce in wartime, in peacetime it shall no doubt help us fill our coffers.
 MLT_foundations_of_tech_industry: "Фонд для технологической индустрии" # A Foundation for a Tech Industry
 MLT_foundations_of_tech_industry_desc: "Хотя современные технологии, такие как компьютер, все еще находятся в зачаточном состоянии, их популярность быстро растет. Даже несмотря на это, очень немногие страны способны производить или применять на практике такие технологии из-за экзотических ресурсов, необходимых для их создания. Поскольку Мальта находится на перекрестке двух океанов, мы находимся в идеальном положении для производства этих устройств. Таким образом, правительство дало зеленый свет программе по накоплению этих более редких ресурсов. Даже если потребуются десятилетия, чтобы эти технологии стали популярными среди масс, Мальта должна быть готова создать их и распространить среди всех, кто в них нуждается." # While modern technologies, such as the computer, are still in their infancy, they are rapidly growing in popularity. Even despite this, very few nations are able to produce or practice such technologies, due to the exotic resources needed to build them. With Malta being on the crossroads of two oceans, we are in a perfect position in produce these devices. Thus, the government has greenlit a program to stockpile these more rare resources. Even if it takes decades for these technologies to become popular with the masses, Malta shall be prepared to build them and distribute them to all who want them. 
 MLT_geared_towards_tourists: "Экономика, ориентированная на туризм" # An Economy Geared for Tourism
 MLT_geared_towards_tourists_desc: "Если Мальте и не хватает чего-то, так это природной красоты. Мальта — одно из самых красивых мест на Божьей Зеленой Земле, и многие люди начали это видеть. Туризм уже стремительно развивается, поскольку мы стремимся диверсифицировать нашу экономику. Таким образом, чтобы еще больше способствовать этому, мы сделаем все возможное, чтобы подготовить нашу экономику к туризму. Поощряя наших людей открывать небольшие магазины, а также ремонтируя и расширяя различные места, куда стекаются туристы, мы можем гарантировать, что наша экономика станет лучше, чем когда-либо прежде." # If Malta is not lacking for one thing, it is natural beauty. Malta is one of the most pretty places on God's Green Earth, and many people have begun to see this. Already, tourism has exploded as we seek to diversify our economy. Thus, to further encourage this, we shall do all we can to gear our economy for tourism. By encouraging our people to open small shops and by repairing and expanding various spots that tourists flock too, we can ensure that our economy is better than ever before.
 MLT_A_Model_British_Economy: "Спасение мальтийской экономики" # The Salvation of the Maltese Economy
 MLT_A_Model_British_Economy_desc: "После долгой и упорной борьбы мы сделали это. Экономика Мальты, долгое время находившаяся в стагнации из-за чрезмерной зависимости от Гранд-Харбора, была спасена. Сейчас на Мальте развивается многообещающая технологическая индустрия, а наши города наполнены туристами и инвестиционной деятельностью. Наконец-то мы больше не полагаемся только на Гавань. Хотя Мальта по-прежнему является важным и жизненно важным аспектом нашей экономики, Мальта отныне и навсегда свободна от оков единого экономического субъекта. Virtute et Constantia!" # After a long and hard fought battle, we have done it. Malta's economy, long stagnating after an over reliance on the Grand Harbor, has been saved. Malta is now home to a budding tech industry, and our cities bustle with tourists and investment activity. We are no longer reliant on simply the Harbor, at long last. While it still forms a massive and vital aspect of our economy, Malta is now and forever free from the shackles of a single economic entity. Virtute et Constantia!

 mlt.1.t: "Прямое правление из Лондона" # Direct Rule from London
 mlt.1.d: "В офис губернатора пришла телеграмма с Даунинг-стрит, 10. Крах лондонской фондовой биржи вызвал волну, которая потрясла Империю до глубины души. Месопотамское королевство и египетские протектораты вырвались из-под защиты Империи, этого опасались многие в Адмиралтействе и Министерстве обороны, выступая за то, чтобы Лондон напрямую контролировал базы на Мальте." # A telegram have arrived in the governor's office from 10 Downing Street. The London Stock Market Crash have created a ripple that shocked the Empire to its core. The Mesopotamian Kingdom and the Egyptian protectorates have broken free from the protection of the Empire, this feared many within the Admiralty and the Defense Ministry, advocating for London to directly control the bases in Malta.
 mlt.1.a: "У нас очень хорошая пробежка..." # We have a jolly good run... 
 mlt.1.b: "Заверьте нашу лояльность Лондону..." # Assure our loyalty to London...

