 POL_advisors_council: "Совет консультантов" # The Council of Advisors
 POL_advisors_council_desc: "В 1935 году королю пришлось в третий раз распустить правительство и сейм. Видя, как парламентская система страны не работает и что она делает правительство бессильным из-за непопулярности и разногласий внутри парламента, Францишек I Радзивилл решил организовать только новые выборы в Сейм, оставив вопрос правительства на усмотрение назначенного совета из своих советников. Хотя это предположительно лишь временное решение, ничто не может фактически помешать королю взять на себя полную власть над страной." # In 1935, the King had to disband both the government and the Sejm for the third time. Seeing how the parliamentary system of the country doesn't work, and that it makes the government powerless due to unpopularity and divisions within the parliament, Franciszek I Radziwiłł decided to only organise new Sejm elections, leaving the government issue to an appointed council of his advisors. While this is supposedly only a temporary solution, nothing can virtually stop the King from assuming total power over the country.

