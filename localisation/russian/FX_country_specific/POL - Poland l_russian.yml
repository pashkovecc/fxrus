### Events ###

 poland.1.t: "Королевство Польское" # The Kingdom of Poland
 poland.1.d: "После раздела Польши в конце 18 века Польша восстановила свою независимость 11 ноября 1919 года благодаря Версальскому договору. Королевство Польское — полуконституционная монархия, возглавляемая королем Франциском I Радзивиллом, одним из самых выдающихся польских магнатов. Оживление промышленности и инфраструктуры страны было внезапно остановлено польско-украинской войной, разразившейся в 1918 году. Поляки вышли победителями, сохранив свою историческую территорию Красной Малороссии. Однако победа не была милосердной к самой территории, оставив ее полностью разрушенной, и вместе с этим возникли проблемы. Как только маршал Польши Юзеф Пилсудский ушел из политики и демократическим путем было избрано новое правительство, стало очевидно, что польская политика доставит всей стране тяжелые времена. Многочисленные разногласия между партиями и внутри них приводили к тупикам, которые снова и снова парализовали Сейм, вынуждая короля неоднократно его распускать. Ситуация только ухудшилась, когда премьер-министр Габриэль Нарутович после нескольких месяцев пребывания у власти был убит членом правой партии Национальная демократия (Narodowa Demokracja). Видя, как неэффективная политическая система рушится под собственной тяжестью, в сентябре 1926 года Юзеф Пилсудский вернулся из политической отставки и с согласия короля взял на себя полную власть над правительством и Сеймом. Это стабилизировало польскую «демократию» и продолжалось до тех пор, пока Пилсудский не заболел в июле 1935 года, и его влияние и контроль над своими сторонниками начали исчезать. Драки в Сейме вспыхнули вновь, столь же сильные, как никогда раньше, при этом несколько партий раскололись из-за внутренних разногласий. Польский король в третий раз использовал свою власть для роспуска правительства и сейма, но на этот раз были организованы только новые выборы сейма. Вместо избрания нового правительства король назначил группу советников, которые помогали ему управлять страной. Такое состояние сохраняется и по сей день, но перемены могут наступить в любую минуту: состояние здоровья Пилсудского становится только хуже, а Сейм, как и всегда, начинает работать неэффективно." # Following the Partitions of Poland at the end of the 18th century, Poland regained its independence in November 11th 1919 thanks to the Treaty of Versailles. The Kingdom of Poland is a semi-constitutional monarchy, led by the king Franciszek I Radziwiłł, one of the most prominent Polish magnates. The revitalization of the country's industry and infrastructure, was abruptly halted by the Polish-Ukrainian war, which broke out in 1918. The Poles emerged victorious, holding onto their historical territory of Red Ruthenia. The victory however, wasn't merciful to the territory itself, leaving it utterly destroyed, and with that, problems emerged. As soon as the Marshal of Poland, Józef Piłsudski, retired from politics, and the new government was democratically elected, it was obvious that Polish politics will give the whole country a hard time. Numerous disagreements between, and within the parties, caused gridlocks which paralized the Sejm over and over again, forcing the King to disband it numerous times. The situation only worsened when the Prime Minister Gabriel Narutowicz, after a couple of months in office, was assasinated by a member of the right-wing party, the National Democracy (Narodowa Demokracja). Seeing the innefective polital system collapse under its own weight, in September 1926 Józef Piłsudski came back from his political retirement, and, with the consent of the King, assumed total power over the government and the Sejm. This stabilized the Polish "democracy", and lasted until Piłsudski fell ill in July 1935, and his influence and control over his supporters started fading away. The fights in the Sejm erupted once again, as strong as never before, with several parties splitting due to internal disagreements. The Polish King, for the third time, used his power to disband the government and the Sejm, but this time, only new Sejm elections were organised. Instead of electing a new government, the King appointed a group of advisors, to help him run the country. This state continues to this day, but the change may come any minute now, with Piłsudski's state of health getting only worse, and the Sejm starting to be inneffective as it always was.
 poland.1.a: "Ради веры, читайте и управляйте!" # Pro Fide, Lege et Rege!
 poland.2.t: "Законопроект о польской промышленности" # The Polish Industry Bill
 poland.2.d: "Последние несколько лет промышленное законодательство Польши вообще не обновлялось, что отрицательно сказалось на польском народе и ее экономике. Чтобы исправить это, обе партии в Сейме представили план. Министерство труда хочет снизить налоги на потребительские товары и построить дополнительные гражданские заводы. А PSCD хочет субсидировать военные заводы. Какой план нам выбрать?" # The last few years Poland's industrial legislation hasn't been updated at all, this has had a negative effect on the Polish people and her economy. To fix this the two parties in the Sejm have each submitted a plan. The MOW wants to lower taxes on consumer goods, and build extra civilian factories. While the PSCD wants to subsudise military factories. Which plan should we choose?
 poland.2.a: "Выберите план MOW" # Choose the MOW's plan
 poland.2.b: "Выберите план PSCD" # Choose the PSCD's plan
 poland.2.c: "Все вместе наложите вето на законопроект!" # Veto the bill alltogether!
 poland.3.t: "Законопроект о налоговой реформе" # The Tax Reform Bill
 poland.3.d: "Польская налоговая система устарела и ненужно сложна, что приводит к массовому уклонению от уплаты налогов и тому, что люди облагаются налогами по ставкам, превышающим 100%. Обе партии в Сейме представили план по устранению этого беспорядка. У MOW есть предложение, которое фокусируется на слегка прогрессивной системе, а PSCD хочет ввести фиксированный налог. Какой из них нам выбрать?" # The Polish tax system is outdated and unnecessary complicated, this lead to massive tax evasion and people being taxed rates higher than 100%. The parties in the Sejm have both submitted a plan to fix this mess. The MOW has a proposal which focuses on a slightly progressive system and the PSCD wants to implement a flat tax. Which one should we choose?
 poland.3.a: "Выберите план MOW" # Choose the MOW's plan
 poland.3.b: "Выберите план PSCD" # Choose the PSCD's plan
 poland.3.c: "Полностью наложить вето на законопроект" # Veto the bill alltogether
 poland.4.t: "Законопроект о свободе слова" # The freedom of speech Bill
 poland.4.d: "Этот законопроект был предложен MOW и PSCD. Этот план направлен на внедрение универсального закона о свободе слова для всех жителей Королевства Польского, а не только для поляков. Это бы очень порадовало Литву, но большая свобода слова также снижает статус монархии и монарха. Что нам делать с законопроектом?" # This bill was proposed by the MOW and the PSCD, this plan wants to implement a universal free speech law for all inhabitants of the kingdom of Poland, not just the Poles. This would make Lithuania very happy, but a greater amount of freedom of speech also decreases the status of the monarchy and the monarch. What should we do with the bill?
 poland.4.a: "Законопроект принят!" # The Bill passes!
 poland.4.b: "Вето на законопроект!" # Veto the bill!
 poland.5.t: "Привилегии меньшинств" # Minorities' privileges
 poland.5.d: "В течение долгого времени меньшинства обладали рядом прав и привилегий. На сегодняшней дискуссии в Сейме консервативная партия СНСД подняла эту тему. Вопрос в том, что нам делать с этими правами? Население по этому вопросу разделилось, как и члены парламента. Должны ли мы прислушаться к PSCD и понизить их права, или нам следует прислушаться к PPS и SL и либо оставить их как есть, либо еще больше повысить?" # For a long time, minorities possesed a number of rights and privileges. On today's discussion in the Sejm, the conservative PSCD party brought up this topic. The question is, what do we do with these rights? The population is split on this matter, and so are the members of the parliament. Should we listen to PSCD and lower their rights, or should we listen to PPS and SL, and either leave them as they are, or increase them further?
 poland.5.a: "Слушайте социалистов, больше привилегий" # Listen to the socialists, More privileges
 poland.5.b: "Послушайте либералов, у них их достаточно" # Listen to the liberals, They have enough of them
 poland.5.c: "Послушайте консерваторов, у них слишком много" # Listen to the conservatives, They have too much
 poland.6.t: "Законопроект о реформе армии" # The Army Reform Bill
 poland.6.d: "В эти неспокойные времена необходимо усовершенствование нашей армии. Было предложено два плана. Министерство труда предлагает просто набирать больше людей в обмен на найм меньшего количества исследователей, в то время как PSCD хочет только увеличить число исследователей. Какой план нам выбрать?" # In these turbulent times an improvement of out army is necessary. Two plans have been proposed. The MOW proposes to simply conscript more men in exchange for hiring less researchers, while the PSCD only wants to increase researchers. Which plan should we choose?
 poland.6.a: "Выберите план MOW" # Choose the MOW's plan
 poland.6.b: "Выберите план PSCD" # Choose the PSCD's plan
 poland.6.c: "Полностью наложить вето на законопроект" # Veto the bill alltogether
 poland.7.t: "Законопроект о реформе ВВС" # The airforce Reform Bill
 poland.7.d: "Польские ВВС до сих пор используют старые самолеты времен Великой войны, которые не только невероятно устарели, но и невероятно неэффективны. MOW и PSCD теперь представили план по восстановлению наших военно-воздушных сил, MOW предлагает сосредоточиться на возможностях наших истребителей, а PSCD предлагает сосредоточить внимание на наших бомбардировочных возможностях. Какой план нам выбрать?" # The Polish airforce still uses old Great War planes which are not only incredibly outdated, but also incredibly ineffective. The MOW and the PSCD have now both both submitted a plan to fix our airforce, the MOW proposes to focus on the ability of our fighters and the PSCD proposes to focus of our bombing capacty. Which plan should we choose?
 poland.7.a: "Выберите план MOW" # Choose the MOW's plan
 poland.7.b: "Выберите план PSCD" # Choose the PSCD's plan
 poland.7.c: "Полностью наложить вето на законопроект" # Veto the bill alltogether
 poland.8.t: "Великое заседание Сейма" # The Great Sitting of the Sejm
 poland.8.d: "Несмотря на плохую ситуацию в стране, Сейм месяцами не обсуждал никаких проблем, и пришло время что-то с этим сделать. Король приказал организовать Великое заседание Сейма. Подобно большим заседаниям Сейма, которые устраивались во времена Речи Посполитой, это собрание займет необычайно много времени. Размещение для всех дополнительных гостей, таких как представители меньшинств, готовится в местах, ближайших к зданию Сейма, а все потребности, такие как питание, будут обеспечиваться в здании Сейма. Занятия начнутся в 10:00 и закончатся в 20:00 с перерывами. Каждый представитель, который не явится ни на одно заседание, будет лишен места в парламенте, поскольку это вопрос высочайшей государственной важности." # Despite the bad situation in the country, the Sejm didnt discuss any problems for months, and this is about time we do something about it. The King has ordered to organise a Great Sitting of the Sejm. Similar to the big Sejm sittings that had been organised in the times of the Polish-Lithuanian Commonwealth, this assembly will take an extraordinary amount of time. Accomodations for all additional guests such as minority representatives are prepared in places nearest to the building of the Sejm, and all needs such as meals will be provided in the Sejm's building. The sessions will begin at 10AM and end at 8PM, with breaks. Every representative that will not appear on any of the sittings will have his seat in the parliament stripped away, as this is a matter of the highest national importance.
 poland.8.a: "Это лучшее решение" # This is the best solution
