### Focus ###
 POL_great_sitting: "Великое заседание Сейма" # The Great Sitting of the Sejm
 POL_great_sitting_desc: "Несмотря на плохую ситуацию в стране, Сейм месяцами не обсуждал никаких серьезных проблем. Это вредит нашей стране, и мы должны что-то с этим делать. Король приказал организовать Великое заседание Сейма. Эта сборка займет необычайно много времени и, будем надеяться, решит все наши текущие проблемы." # Despite the bad situation in the country, the Sejm didn't discuss any major problems for months. This is hurting our country, and we have to do something about it. The King has ordered to organise the Great Sitting of the Sejm. This assembly will take an extraordinary amount of time and hopefully solve all of our current problems.
 POL_auth_dem: "Истинная конституционная монархия" # True Constitutional Monarchy
 POL_auth_dem_desc: "Демократия, как и наш монарх, восторжествует навсегда." # Democracy, just as our monarch, shall prevail forever.
 POL_auth_elections: "Выборы" # Elections
 POL_auth_elections_desc: "Пора устроить новые выборы и дать населению возможность выбрать свое будущее правительство." # Time to arrange new elections and let out population choose their future government.
 POL_WIP_2: "Чено-Пяст" # Chjeno-Piast
 POL_WIP_2_desc: "Чено-Пяст — коалиция правых и центристских партий ПСЧД и НД. Они стремятся ограничить права меньшинств и полностью или частично национализировать промышленность страны." # Chjeno-Piast is a coalition of rightist and centrist parties, the PSChD and the ND. They seek to decrease the minorities' rights and to fully, or partially, nationalise the country's industry.
 POL_centrolew: "Центролев" # Centrolew
 POL_centrolew_desc: "Центролев — коалиция левых и центристских партий, ППС и СЛ. Они стремятся обеспечить равенство между различными национальностями нашей страны и помочь беднейшим людям в нашем обществе: фермерам и рабочим." # Centrolew is a coalition of leftist and centrist parties, the PPS and the SL. They seek to enforce equality between the various nationalities of our country, and to help the poorest people in our society: the farmers and the workers.
 POL_pataut_mon: "Король - это все, что нам нужно" # The King is all we need
 POL_pataut_mon_desc: "Демократия оказалась для нашей страны не чем иным, как мертвым грузом. Сейчас это прекратится, и король станет нашим единственным настоящим лидером." # Democracy proved to be nothing but a deadweight for our country. This shall stop now, with the King becoming our only true leader.
 POL_imprison_opposition: "Заключить в тюрьму оппозицию" # Imprison the Opposition
 POL_imprison_opposition_desc: "Похоже, не все увидели свет в конце нашего нового пути. Различные группировки, или, как их следует называть, оппозиция, организовали несколько акций протеста против «недемократической системы» Королевства Польского. Очевидно, они неправы, и нам следует исправить их ошибки." # It seems that not everybody has seen light at the end of our new way. Various groupings, or as we should call them, the opposition, has organised several protests against the "Undemocratic system" of the Kingdom of Poland. Obviously, they are wrong, and we should correct their mistakes.
 POL_arrest_conspirators: "Арестовать заговорщиков" # Arrest the Conspirators
 POL_arrest_conspirators_desc: "Несмотря на наши усилия по исправлению ошибок оппозиции, все еще есть люди, которые верят не в нашу точку зрения! Они возглавляют подпольные организации, целью которых является дестабилизация нашего правления. Мы должны положить конец этим возмутительным действиям." # Despite our efforts to correct the mistakes of the opposition, there are still people who believe in views other than ours! They are leading underground organisations which aim to destabilize our rule. We should put an end to these outrageous actions.
 POL_disband_sejm: "Распустить Сейм" # Disband the Sejm
 POL_disband_sejm_desc: "Поскольку король получает почти полную власть, парламенту не нужно стоять у него на пути. Это всего лишь препятствие на нашем пути в светлое будущее!" # With the King assuming almost total power, there is no need for the parliament to stand in his way. It is just an obstacle on our way to the bright future!
 POL_new_elections: "Новая Республика" # A New Republic
 POL_new_elections_desc: "После роспуска монархии к власти пришло новое демократическое правление." # As the Monarchy has been disbanded, a new democratic rule has risen to power.
 POL_the_actual_elections: "Новые выборы" # New Elections
 POL_the_actual_elections_desc: "Пора устроить новые выборы и дать населению возможность выбрать свое будущее правительство." # Time to arrange new elections and let out population choose their future government.
 POL_centrolew_coalition: "§YCentrolew§!" # §YCentrolew§!
 POL_centrolew_coalition_desc: "Центролев — коалиция левых и центристских партий, ППС и СЛ. Они стремятся обеспечить равенство между различными национальностями нашей страны и помочь беднейшим людям в нашем обществе: фермерам и рабочим." # Centrolew is a coalition of leftist and centrist parties, the PPS and the SL. They seek to enforce equality between the various nationalities of our country, and to help the poorest people in our society: the farmers and the workers.
 POL_Ch_P: "§YЧено-Пяст§!" # §YChjeno-Piast§!
 POL_Ch_P_desc: "Чено-Пяст — коалиция правых и центристских партий ПСЧД и НД. Они стремятся ограничить права меньшинств и полностью или частично национализировать промышленность страны." # Chjeno-Piast is a coalition of rightist and centrist parties, the PSChD and the ND. They seek to decrease the minorities' rights and to fully, or partially, nationalise the country's industry.
 POL_nationalism: "Новая Эра" # The New Era
 POL_nationalism_desc: "Наступила Новая Эра для нашей славной страны! После ухода короля-предателя и его министерств мы можем формировать эту страну по своему вкусу и возродить национализм среди польского населения!" # The New Era for our glorious country has came! With the traitorous king and his ministries gone, we can shape this country to our liking, and revive nationalism among the Polish populace!
 POL_one_leader: "Один лидер" # One Leader
 POL_one_leader_desc: "Нам нужен только один лидер. Сложные структуры демократии всегда были, есть и будут неэффективными." # There is only one leader we need. The complicated structures of democracy always were, are, and will be inefficient.
 POL_one_nationality: "§YОдно гражданство§!" # §YOne Nationality§!
 POL_one_nationality_desc: "В этой стране только одна национальность является подходящей. Поляки будут единолично править в своей стране, а другие национальности будут подчинены полякам!" # In this country, only one nationality is the right one. The Polish shall rule alone in their country and other nationalities shall be subdued by the Polish!
 POL_one_party: "Одна вечеринка" # One Party
 POL_one_party_desc: "В этой стране есть только одна настоящая партия. Любые мнения, отличные от наших, будут отвергнуты." # There is only one true party in this country. Any views different from ours will be put down.
 POL_military_junta: "Военные берут власть" # Military Takes Power
 POL_military_junta_desc: "Незаконные действия короля побудили военных принять меры против него. Теперь, когда власть находится в руках военных, мы решим судьбу этой страны." # The King's unlawful actions have pushed the military to take action against him. Now, with the power in the military's hands, we will decide the fate of this country.
 POL_punish_monarchists: "Наказать монархические полки" # Punish the Monarchist Regiments
 POL_punish_monarchists_desc: "Во время нашей борьбы за власть было несколько полков, которые отказались поддержать наше дело и вместо этого защищали режим короля. Мы должны их сурово наказать, иначе наши вооруженные силы могут оказаться разделенными и недействующими." # During our fight for power, there were several regiments who refused to support our cause, and instead, defended the King's regime. We have to punish them harshly, or our military force may end up divided and inoperative.
 POL_stabilise_situation: "Стабилизировать ситуацию" # Stabilise the Situation
 POL_stabilise_situation_desc: "Быстрый захват страны военными привел в замешательство тысячи людей и бюрократов. Мы должны опубликовать официальное заявление о поглощении и принять административные меры, чтобы прояснить ненужную путаницу." # The swift take over of the country by the military has left thousands of people and bureaucrats confused. We should release an official statement about the take-over and take administrative measures to clear up the unneeded confusion
 POL_puppet_prime_minister: "§YВопрос о нашем правлении§!" # §YThe Question of Our Rulership§!
 POL_puppet_prime_minister_desc: "Наличие марионеточного премьер-министра с «легитимным» правительством очень поможет нам в наших усилиях по стабилизации ситуации. Либо так, либо мы назначим лидером самого нашего маршала." # Having a puppet prime minister with a "legitimate" government will greatly help us in our efforts to stabilize the situation. Either that or we'll a point our Marshal himself as the leader.
 POL_guiding_hand: "§YПутеводная рука короля§!" # §YThe King's Guiding Hand§!
 POL_guiding_hand_desc: "Руководящая рука короля будет охранять эту страну и решать ее судьбу.\n Власть короля будет неоспоримой и навсегда." # The King's guiding hand will guard this country, and decide its fate.\n The King's power shall be undisputed, forever.
 POL_restart_the_economy: "Перезапустить экономику" # Restart the Economy
 POL_restart_the_economy_desc: "Последствия краха лондонской фондовой биржи вызывают экономический хаос в Польше. Мы должны провести реформы как можно быстрее, чтобы исправить эту катастрофу." # The consequences of the London Stock Market Crash are causing economic havoc in Poland. We should pass reforms as quickly as possible to fix this disaster.
 POL_protect_the_consumer: "Защитите потребителя" # Protect the Consumer
 POL_protect_the_consumer_desc: "Из двух предложений мы выбрали защиту потребителя. Экономическая безопасность нашего народа является одним из наиболее важных вопросов, и мы никогда не будем уделять больше внимания крупным корпорациям, которые могут справиться самостоятельно." # From the two proposals, we have chosen to protect the consumer. Our people's economic safety is one of the most important matters, and we shall never give more attention to the big corporations which can manage on their own.
 POL_subsudise_local_industries: "Субсидирование местных предприятий" # Subsudise Local Industries
 POL_subsudise_local_industries_desc: "Местная промышленность важна для развития нашей страны. Без их правильной работы наша экономика обречена»." # Local industries are important for our country's development. Without them working correctly, our economy is doomed."
 POL_encourage_domestic_industry: "Поощряйте отечественную промышленность" # Encourage Domestic Industry
 POL_encourage_domestic_industry_desc: "Внутренняя промышленность была, есть и всегда будет для нас важнее крупных международных или иностранных концернов. Именно они гарантируют доступ к большинству товаров, необходимых нашему населению. Поэтому нам следует сконцентрироваться на развитии этого сектора нашей экономики." # Domestic industries were, are, and always will be more important for us than the big international or foreign concerns. They are the ones that guarantee the access to most of the goods needed by our population. This is why we should concentrate on developing this sector of our economy.
 POL_warsaw_to_wilno_railway: "Варшава-Вильно железная дорога" # Warsaw to Wilno Railway
 POL_warsaw_to_wilno_railway_desc: "Дорожная инфраструктура в Польше никогда не была хорошо развита. Поэтому нам необходимо расширять железнодорожную инфраструктуру, ведь она всегда была основным способом передвижения по нашей стране." # The road infrastructure was never well-developed in Poland. This is why we should expand the railway infrastructure, as it always was the main way of moving around in our country.
 POL_rail_to_lwow: "Расширить железную дорогу до Львова" # Expand the Rail to Lwow
 POL_rail_to_lwow_desc: "Поскольку железнодорожная система расширилась до Вильно, мы теперь должны соединить южную часть нашей страны с остальной ее частью. План предлагает превратить Львов в железнодорожный центр и «конечную станцию» южной ветки нашей железнодорожной сети." # With the railway system expanded to Wilno, we should now connect the southern part of our country to the rest of it. The plan proposes to turn Lwów into the railway centre and the "end station" for the southern branch of our railway network.
 POL_wolnosc_mine: "Финансируйте Шахту Свободы" # Fund the Wolnosc Mine
 POL_wolnosc_mine_desc: ""
 POL_support_our_military_industrial_complex: "Поддержите наш ВПК" # Support our Military Industrial Complex
 POL_support_our_military_industrial_complex_desc: "Из двух предложений мы решили воспользоваться финансовой ситуацией в Польше и предложить бедным людям общественные работы за приличную зарплату. Они будут развивать польский военно-промышленный комплекс, создавая таким образом беспроигрышную ситуацию как для нашего населения, так и для нашей армии." # From the two proposals, we have chosen to take an advantage of the financial situation in Poland, and offer public works to poor people for a somewhat decent salary. They will be developing the Polish military industrial complexes, thus making this a win-win situation for both our population and our army.
 POL_expand_warsaw_arsenal: "Расширить Варшавский арсенал" # Expand the Warsaw Arsenal
 POL_expand_warsaw_arsenal_desc: "Видя, в каком упадке находится Варшавский арсенал, нам следует разработать план его обновления и расширения." # Seeing the state of decay the Warsaw Arsenal is in, we should draft a plan to renew and expand it.
 POL_krakow_arms_industry: "Краковская оружейная промышленность" # The Krakow arms Industry
 POL_krakow_arms_industry_desc: "После расширения Варшавского арсенала нам следует сосредоточиться на развитии отрасли. Промышленные комплексы Кракова известны своим военным значением. Однако объем производимого ими вооружения недостаточен для удовлетворения потребностей Войска Польского. Нам следует расширить военную промышленность в Кракове, чтобы выполнить эти требования." # After expanding the Warsaw Arsenal, we should focus on developing the industry. Kraków's industrial complexes are well-known for their military importance. However, the amount of arms they produce is not enough to fulfill the needs of the Polish Army. We should expand the arms industry in Kraków in order to fulfill those requirements.
 POL_end_of_reforms: "Конец экономических реформ" # End of Economic Reforms
 POL_end_of_reforms_desc: "Окончательно! Конец! Финансовое положение тысяч, если не миллионов семей вновь встало на ноги. Уровень безработицы снизился, как и бедность. Наши планы сработали идеально! Несмотря на этот успех и его влияние на популярность нашей партии, продолжения мы точно не хотим." # Finally! The End! Thousands, if not millions of families' finances are back on their feet. The unemployment rate has fallen down, and so did the poverty. Our plans worked out perfectly! Despite this success and its influence on the popularity of our party, we for sure don't want any sequels.
 POL_warsaw_university: "Варшавский университет" # Warsaw University
 POL_warsaw_university_desc: ""
 POL_foreign_policy: "§YВнешняя политика§!" # §YForeign Policy§!
 POL_foreign_policy_desc: "Настало время серьезно отнестись к внешней политике и официально заявить о своей позиции по ситуации в регионе." # It is about time we take the foreign affairs seriously and declare our stance on the situation in the region officialy.

 POL_reassert_western_claims: "Подтвердить претензии Запада" # Reassert Western Claims
 POL_reassert_western_claims_desc: "Великая Польша принадлежит нам по всем моральным, духовным и юридическим правам. Свобода польского народа никогда не будет без освобождения всех истинно польских территорий, среди которых Запад является одной из важнейших!" # Greater Poland is ours by all moral, spiritual and legal right. The freedom of the Polish people will never be without the liberation of all true Polish territories, of which the West is among the most paramount!
 POL_modernise_frontier_guard: "Модернизация пограничной охраны" # Modernise the Frontier Guard
 POL_modernise_frontier_guard_desc: "Польская граница всегда была довольно тонкой, особенно сейчас на Западе. Пока немцы продолжают жаждать своих тщетных мечтаний о завоевании, пограничная охрана должна быть усилена, чтобы сдерживать первый немецкий удар до прибытия подкрепления." # The Polish frontier has always been rather tenuous, especially now in the West. So long as the Germans continue to hunger for their vain dreams of reconquest, the frontier guard must be bolstered to hold off the initial German strike until reinforcements can arrive.
 POL_demand_referendum_corridor: "Референдум по коридору" # Referendum on the Corridor
 POL_demand_referendum_corridor_desc: "Это может показаться довольно смешным, но прикрытие референдума на польских территориях, которые сейчас принадлежат Германии, окажется отличным прикрытием для захвата законных польских земель. Хотя нет никаких сомнений в том, что гунны отвергнут это, это просто демонстрирует правоту нашего дела!" # It may seem rather laughable, but the cloak of a referendum in the Polish territories now held by Germany will prove to be excellent cover for the seizure of rightful Polish lands. While there is little doubt that the Huns will reject this, it simply demonstrates the rightousness of our cause!
 POL_break_german_hegemony: "Разрушить немецкую гегемонию" # Break German Hegemony
 POL_break_german_hegemony_desc: "Немцы — наши злейшие враги, и мы должны раз и навсегда разобраться с этой угрозой.\n\n Пришло время атаковать Зверя Европы!" # The Germans are our greatest enemies, and we shall once and for all deal with this threat.\n\n It is time to attack the Beast of Europe!
 POL_look_outwards: "Посмотрите наружу" # Look Outwards
 POL_look_outwards_desc: "Чтобы защитить Польшу, мы не можем оставаться в изоляции. Как с Востока, так и с Запада, соперники и империи желают сокрушить зарождающееся Польское государство и возобновить угнетение последних 300 лет – еще одного года, которому мы не позволим случиться!" # To defend Poland, we cannot remain isolated. From both the East and the West, rivals and empires desire to crush the nascent Polish state and renew the oppression of the last 300 years - another year of which we shall not let come to pass!
 POL_subjugate_slovakia: "Подчинить Словакию" # Subjugate Slovakia
 POL_subjugate_slovakia_desc: "Пришло время угрожать слабакам Юга и требовать их стратегически важные территории!" # It is time to threaten the southern weaklings and demand their strategically important territories!
 POL_kill_the_bear: "Реализация плана «Волынь»" # Execute Plan 'Wołyń'
 POL_kill_the_bear_desc: "Украинцы долгое время были довольно нестабильным соседом, но теперь они, безусловно, представляют собой угрозу, которую невозможно сдержать просто словами и укреплениями. Мы должны последовать примеру старого Содружества и подготовиться к восточной кампании, чтобы нейтрализовать их раз и навсегда!" # The Ukrainians have long been a rather unsteady neighbour, but now they certainly pose a threat that cannot be simply held back with words and fortifications. We must make like the old Commonwealth, and prepare for an eastern campaign to neutralize them once and for all!
 POL_estonian_ultimatum: "Эстонский ультиматум" # Estonian Ultimatum
 POL_estonian_ultimatum_desc: "После присоединения Латвии к Польше пришло время еще больше расширить наше влияние на страны Балтии. Последним препятствием остается только Эстония." # With Latvia incorporated into Poland, the time has come to further expand our influence over the Baltic States. Only Estonia remains as the last obstacle.
 POL_join_vienna_accord: "Присоединяйтесь к Антигерманскому блоку" # Join the Anti-German Bloc
 POL_join_vienna_accord_desc: "Новый антигерманский блок, формирующийся в Центральной Европе, имеет с нами гораздо больше общего, чем с либеральными плутократами Запада. Мы объединимся, чтобы остановить посягательство валкизма и загнивающего большевизма на свободную Польшу!" # The new anti-German bloc forming in Central Europe shares far more in common with us then the liberal plutocrats of the West. We shall join together to stop the encroachment of Valkism and decadent Bolshevism upon free Poland!
 POL_polands_place_in_the_world: "Место Польши в мире" # Poland's Place in the World
 POL_polands_place_in_the_world_desc: "Где место Польши в великой схеме мировой истории? Хотя сейчас мало кто уверен в ответе, на этот вопрос наверняка будет ответ в ближайшие годы." # Where is Poland's place in the grand scheme of world history? While few are certain of the answers now, this question will surely have an answer in the coming years.
 POL_status_of_lithuania: "Статус Литвы" # Status of Lithuania
 POL_status_of_lithuania_desc: "Литва является важнейшей частью польской сферы, и теперь с ними необходимо разобраться раз и навсегда. Будь то продолжение альянса или, что более вероятно, интеграция, старые связи Содружества манят к действию." # Lithuania is a crucial part of the Polish sphere, and now they must be dealt with firmly once and for all. Whether it be a continued alliance, or in all greater likelihood integration, the old commonwealth ties beckon for action.
 POL_create_intermarium: "Создайте Междуморье" # Create the Intermarium
 POL_create_intermarium_desc: "Польша, нравится это нашим соседям или нет, является региональной сверхдержавой. У нас есть влияние и связи для создания нашего собственного восточноевропейского альянса, и мы надеемся, что у нас есть шанс противостоять нашим врагам." # Poland is, whether our neighbours like it or not, a regional superpower. We have the influence and relations to create our own Eastern-European alliance, and hopefully stand a chance against our enemies.
 POL_invite_southern_neighbours: "Пригласите наших южных соседей" # Invite our Southern Neighbours
 POL_invite_southern_neighbours_desc: "Мы расширим наш альянс, пригласив наших южных соседей - Венгрию, Румынию и Словакию." # We shall expand our alliance by inviting our southern neighbours -- Hungary, Romania and Slovakia.
 POL_invite_baltics: "Пригласите страны Балтии" # Invite the Baltics
 POL_invite_baltics_desc: "Мы можем еще больше расширить наш альянс, объединив наших балтийских друзей – Латвию, Литву и Эстонию." # We can expand our alliance even more by allying our Baltic friends -- Latvia, Lithuania and Estonia.
 POL_polish_legacy: "Возрожденное Содружество" # A Revived Commonwealth
 POL_polish_legacy_desc: "Хотя Речь Посполитая так и не вернулась как полноценное государство, новое Междуморье теперь стоит между российским колоссом и Германской империей как бастион свободы и независимости в Европе. Давайте вместе с другими свободными народами мира примем новый век как еще один золотой век Польши!" # While the commonwealth has not returned as a full-fledged state, the new Intermarium now stands between the Russian colossus and the Germanic empire as a bastion of freedom and independence in Europe. Along with the other free nations of the world, let us embrace the new age as another Polish Golden Age!
 POL_weapons_deal: "Сделки с оружием Антанты" # Entente Weapons Deals
 POL_weapons_deal_desc: "Антанта имеет много оружия и гораздо большую промышленную базу, чем мы одни. Мы должны использовать это в свою пользу, заключив сделки с [ENT.GetAdjective], чтобы получить необходимое нам оружие как можно скорее." # The Entente has many weapons and a far greater industrial base than we alone do. We should leverage this in our favour by making deals with the [ENT.GetAdjective] to see to it that we get the arms we need as soon as possible.
 POL_naval_developments: "База Антанты на Балтике" # Entente Base in the Baltic
 POL_naval_developments_desc: "Хотя немцы и русские обладают довольно смехотворным военно-морским потенциалом по сравнению с могучими флотами Запада, они все равно могут представлять серьезную проблему на Балтике. Благодаря созданию военно-морской базы Антанты на Балтике мы сможем сохранить открытыми и безопасными коммуникации и связи!" # Although the Germans and the Russians hold rather laughable naval capabilities compared to the mighty fleets of the West, they could still pose a serious problem in the Baltic. Through the establishment of an Entente naval base in the Baltic, we shall be able to keep communications and links open and secure!

 POL_our_place_in_the_world: "Много вариантов, один ответ" # Many Options, One Answer
 POL_our_place_in_the_world_desc: ""
 POL_the_old_alliance: "Старый Альянс" # The Old Alliance
 POL_the_old_alliance_desc: "У нас всегда были хорошие отношения с нашим западным другом Францией. Они помогали нам на протяжении всей истории, и теперь мы им поможем!\n\n (Или они помогут нам, зависит от ситуации)" # We always had good relations with our western friend France. They helped us throughout the history, and now, we will help them!\n\n (Or they will help us, depends on the situation)
 POL_deal_with_the_devil: "Сделки с Дьяволом" # Deals with the Devil
 POL_deal_with_the_devil_desc: "Отчаянные времена требуют отчаянных мер. Мы будем иметь дело с дьяволом, чтобы победить сатану." # Desperate times demand desperate measures. We will deal with the devil to defeat the Satan.
 POL_invite_romania: "Пригласить Румынию" # Invite Romania
 POL_invite_romania_desc: "Нам следует расширить наш союз на юг, а Румыния всегда была одним из наших самых близких друзей." # We should expand our alliance southwards, and Romania was always one of our closest friends.
 POL_invite_hungary: "Пригласить Венгрию" # Invite Hungary
 POL_invite_hungary_desc: "Нам следует расширить наш союз на юг, а Венгрия всегда была одним из наших самых близких друзей. У нас много общей истории." # We should expand our alliance southwards, and Hungary was always one of our closest friends. We share a lot of history.
 POL_invite_centroslavia: "Пригласить Словакию" # Invite Slovakia
 POL_invite_centroslavia_desc: "Нам следует расширить наш альянс на юг, а Словакия является хорошим стратегическим союзником, которого мы могли бы счесть ценным." # We should expand our alliance southwards, and Slovakia is a good strategic ally which we might consider valuable.
 POL_invite_belarus: "Пригласить Беларусь" # Invite Belarus
 POL_invite_belarus_desc: "Нам следует расширять наш альянс на восток, Беларусь будет ценным союзником в случае украинского экспансионизма." # We should expand our alliance eastwards, Belarus will be a valuable ally in case of Ukrainian expansionism.
 POL_belarus_railway: "Построить железную дорогу Варшава-Минск" # Build the Warsaw-Minsk Railway
 POL_belarus_railway_desc: "Расширение наших железных дорог должно способствовать нашему дальнейшему сотрудничеству." # Expanding our railways should help our further cooperation.
 POL_pol_no_bully_slo: "Безопасность на юге" # Safety in the South
 POL_pol_no_bully_slo_desc: "Гарантированный мир на южной границе должен позволить нам сосредоточиться на создании более важной обороны." # A guaranteed peace on the southern border should let us focus on establishing defences of higher importance.
 POL_gain_territory: "Завоевать территорию" # Gain Territory
 POL_gain_territory_desc: "Польша будет расширяться! Мы вернем земли, которыми когда-то владели!" # Poland shall expand! We will reclaim the lands we once owned!
 POL_latvian_ultimatum: "Латвийский ультиматум" # Latvian Ultimatum
 POL_latvian_ultimatum_desc: "Латвия достаточно долго находилась в нашей сфере влияния. Мы должны нарушить их «нейтралитет», о котором мы договорились в Рижском мирном соглашении." # Latvia was in our sphere of influence for long enough. We should break their "neutrality" we agreed for on the Riga peace deal.
 POL_baltic_soviet_republic_ultimatum: "Эстонский ультиматум" # Estonian Ultimatium
 POL_baltic_soviet_republic_ultimatum_desc: "После присоединения Латвии к Польше пришло время еще больше расширить наше влияние на страны Балтии. Последним препятствием остается только Эстония." # With Latvia incorporated into Poland, the time has come to further expand our influence over the Baltic States. Only Estonia remains as the last obstacle.
 POL_buy_land_landowners: "Покупайте землю у крупных землевладельцев" # Buy Land from the big Landowners
 POL_buy_land_landowners_desc: "На протяжении веков землевладельцам принадлежала большая часть земли, на которой работали фермеры. Даже после эпохи феодализма землевладельцы по-прежнему владеют большей частью земли, по сути заставляя мелких фермеров работать на ней, как это было в эпоху феодализма. Мы должны положить конец эксплуатации беднейших слоев населения." # For centuries, landowners owned majority of land the farmers work on. Even after the age of feudalism, the landowners still own majority of land, basically forcing the smaller farmers to work there just as it was in the age of feudalism. We have to put an end to this exploitation of the poorest.
 POL_better_conditions: "Лучшие условия для работников" # Better Conditions for the Workers
 POL_better_conditions_desc: "Пришло время выполнить нашу социалистическую программу и предоставить рабочим права, в которых они нуждаются. Некоторые части нашей страны высокоиндустриализированы, и рабочие из этих регионов требуют лучших условий труда. Это, несомненно, повысит производительность нашей отрасли, а также сделает рабочих довольными. Это беспроигрышная ситуация для обоих." # It is about time we fulfill our socialist program and grant the workers the rights they need. Some parts of our country are heavily industrialized, and workers from these regions demand better working conditions. This will for sure benefit the productivity of our industry, as well as make the workers content. It's a win-win situation for both.
 POL_land_redistribution: "Перераспределить землю" # Redistribute the Land
 POL_land_redistribution_desc: "Теперь, когда земля куплена у крупных землевладельцев, мы должны начать перераспределять ее между более мелкими фермерами и, будем надеяться, сделать равенство обычным явлением в польской деревне." # Now, with the land purchased from the big landowners, we should start redistributing it to the smaller farmers, and hoepfully make equality a common thing on the Polish countryside.
#natpop
 POL_crush_resistance: "Сокрушить сопротивление" # Crush the Resistance
 POL_crush_resistance_desc: "Мы подарим любое сопротивление среди населения! Они стремятся уничтожить наше Польское государство, и мы остановим их любой ценой!" # We shall crush any resistance among the population! They seek to destroy our Polish state, and we will stop them no matter the cost!
 POL_behead_opposition: "Обезглавить оппозицию" # Behead the Opposition
 POL_behead_opposition_desc: "Оппозиция ставит под сомнение легитимность нашего правительства или, как они его называют, нашей «диктатуры». Рано или поздно они увидят наш путь, когда их лидеры уйдут!" # The opposition questions the legitimacy of our government, or, as they call it, our "dictatorship". They will see our way sooner or later, with their leaders gone!
 POL_nationalist_convention: "Националистический съезд" # The Nationalist Convention
 POL_nationalist_convention_desc: "Мы устранили внутренние угрозы. Теперь различные националистические группы польского общества встретятся на одном съезде и обсудят будущее польского государства и его народа." # We have removed internal threats. Now, the various nationalist groups within the Polish society shall meet on one convention, and discuss the future of the Polish state and its people.
