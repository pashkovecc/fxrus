 poland.10.t: "Абсолютная монархия!" # Absolute monarchy!
 poland.10.d: "Польша превратилась из нестабильной, беспорядочной полуконституционной монархии в настоящую абсолютную монархию. Наш король проведет нас через эти трудные времена своим справедливым правлением и мудрыми решениями. Боже, храни короля!" # Poland has been transformed from the unstable, messy semi-constitutional monarchy to a proper absolute monarchy. Our king will guide us through these difficult times with his fair rule and his wise decisions. God save the king!
 poland.10.a: "Да здравствует монархия!" # Long live the monarchy!
 poland.11.t: "Демократические выборы" # The democratic elections
 poland.11.d: "Польский народ может еще раз проголосовать за новый парламент, но на этот раз все немного по-другому: впервые в бюллетенях участвуют более двух партий. Выбор стоит между социал-демократической СПРД, социал-либеральной партией SL, рыночно-либеральной партией SPR, социал-консервативной PSCD и авторитарными демократами MOW." # The Polish people may vote for a new parliament once again, but this time it is a bit different, it's the first time that more than two parties are on the Ballot. The choices are between the social democratic SPRD, the social liberal party SL, the market liberal party SPR, the social conservative PSCD and the authoritarian democrats MOW.
 poland.11.a: "СПРД побеждает!" # The SPRD wins!
 poland.11.b: "SL побеждает!" # The SL wins!
 poland.11.c: "СПР побеждает!" # The SPR wins!
 poland.11.e: "PSCD побеждает!" # The PSCD wins!
 poland.11.f: "МОУ побеждает!" # The MOW wins!
 poland.12.t: "Демократические выборы" # The democratic elections
 poland.12.d: "Польский народ может еще раз проголосовать за новый парламент, но на этот раз все по-другому. Это будет последний раз, когда в бюллетенях будут допущены только две партии. На следующих выборах всего будет участвовать пять партий. Две партии - консервативная PSCD и авторитарная демократическая MOW, кто победит?" # The Polish people may vote for a new parliament once again, but something is different this time. This will be the last time only two parties will be allowed on the ballot, next election there will be a grand total of five parties. The two parties are the conservative PSCD and the authoritarian democrative MOW, who shall win?
 poland.12.a: "PSCD побеждает!" # The PSCD wins!
 poland.12.b: "МОУ побеждает!" # The MOW wins!
 poland.13.t: "Демократические выборы" # The democratic elections
 poland.13.d: "В нашей великой стране вновь начались выборы. Как всегда, в избирательных бюллетенях участвуют две стабильные и великие партии. Опросы показывают, что консервативная PSCD и авторитарная демократическая MOW имеют близкие результаты. Кто победит – вопрос для всех нас!" # Elections have once again commenced in our great nation. Like always there are two stable and great parties on the ballot. The conservative PSCD and the authoritarian democrative MOW, the polls indicate that the results are close. Who will win is a question for all of us!
 poland.13.a: "PSCD побеждает!" # The PSCD wins!
 poland.13.b: "МОУ побеждает!" # The MOW wins!
 poland.14.t: "Демократические выборы" # The democratic elections
 poland.14.d: "Польский народ может снова проголосовать за новый парламент. Выбор стоит между социал-демократической СПРД, социал-либеральной партией SL, рыночно-либеральной партией SPR, социал-консервативной PSCD и авторитарными демократами MOW." # The Polish people may vote for a new parliament once again. The choices are between the social democratic SPRD, the social liberal party SL, the market liberal party SPR, the social conservative PSCD and the authoritarian democrats MOW.
 poland.14.a: "СПРД побеждает!" # The SPRD wins!
 poland.14.b: "SL побеждает!" # The SL wins!
 poland.14.c: "СПР побеждает!" # The SPR wins!
 poland.14.e: "PSCD побеждает!" # The PSCD wins!
 poland.14.f: "МОУ побеждает!" # The MOW wins!
 poland.15.t: "Крах Лондонской фондовой биржи" # London Stock Market Crash
 poland.15.d: "Крах лондонской фондовой биржи поразил Польшу. Это нанесло ущерб нашей промышленности и финансам миллионов польских семей. Это может стать одной из крупнейших экономических проблем, с которыми Польша когда-либо сталкивалась в своей истории." # The London Stock Market Crash has hit Poland. It has damaged our industry and the finances of millions of Polish families. This might be one of the biggest economic challenges Poland has ever witnessed in her history.
 poland.15.a: "Ох... ну, британцы снова наносят удар" # Oh...well, the British strike again
 poland.16.t: "Польша просит присоединиться к Континентальной Антанте" # Poland requests to join the Continental Entente
 poland.16.d: "Польша обратилась с просьбой о присоединении к Континентальной Антанте. Должны ли мы разрешить ей присоединиться?" # Poland has requested to join the Continental Entente, should we permit them to join?
 poland.16.a: "Да!" # Yes!
 poland.16.b: "Нет!" # No!
 poland.17.t: "Польша просит присоединиться к Штальпакту" # Poland requests to join the Stahlpakt
 poland.17.d: "Польша обратилась с просьбой о присоединении к «Штальпакту», в обмен на это они отдали бы нам «Зюдпреуссен» и «Нидершлезиен», следует ли нам разрешить им присоединиться?" # Poland has requested to join the Stahlpakt, in exchange for this they would give us Sudpreussen and Niederschlesien, should we permit them to join?
 poland.17.a: "Да!" # Yes!
 poland.17.b: "Нет!" # No!
 poland.18.t: "Присоединение к Междуморью" # Joining the Intermarium
 poland.18.d: "Польша попросила нас присоединиться к их фракции «Междуморье». Должны ли мы присоединиться к ней?" # Poland has asked us to join their faction, the Intermarium, should we join it?
 poland.18.a: "Да!" # Yes!
 poland.18.b: "Нет!" # No!
 poland.19.t: "Польша требует нашу территорию" # Poland demands our Territory
 poland.19.d: "Польша потребовала нашу территорию, поскольку они утверждают, что это по праву их земля. Если мы откажемся от их требований, мы можем рискнуть войной." # Poland has demanded our territory since they claim it is rightfully their land, if we deny their demands we might risk war.
 poland.19.a: "Принимать" # Accept
 poland.19.b: "Мусор" # Refuse
 poland.20.t: "Аннексия латвийских земель" # Annexation of Latvian lands
 poland.20.d: "Мы успешно аннексировали латвийские земли, теперь они вернулись к своим законным владельцам!" # We have successfully annexed the Latvian lands, they are now back to their rightful owners!
 poland.20.a: "Ура!" # Hurray!
 poland.21.t: "Латвия отказалась от наших требований!" # Latvia refused our demands!
 poland.21.d: "Латвия отказалась от наших требований на нашу законную землю! Должны ли мы в любом случае объявить войну, чтобы получить нашу территорию?" # Latvia has refused our demands to our rightful land! Should we declare war to get our territory anyway?
 poland.21.a: "Объявляем войну!" # Declare War!
 poland.21.b: "Отойди назад" # Stand back
 poland.22.t: "Польша требует нашу территорию" # Poland demands our Territory
 poland.22.d: "Польша потребовала всю нашу территорию, поскольку они утверждают, что это по праву их земля. Если мы откажемся от их требований, мы можем рискнуть войной." # Poland has demanded all our territory since they claim it is rightfully their land, if we deny their demands we might risk war.
 poland.22.a: "Принимать" # Accept
 poland.22.b: "Мусор" # Refuse
 poland.23.t: "Аннексия эстонских земель" # Annexation of Estonian lands
 poland.23.d: "Мы успешно аннексировали эстонские земли, теперь они вернулись к своим законным владельцам!" # We have successfully annexed the Estonian lands, they are now back to their rightful owners!
 poland.23.a: "Ура!" # Hurray!
 poland.24.t: "Прибалтийская Советская Республика отказалась от наших требований!" # Baltic Soviet Republic refused our demands!
 poland.24.d: "Балтийская Советская Республика отказалась от наших требований на нашу законную землю! Должны ли мы в любом случае объявить войну, чтобы получить нашу территорию?" # The Baltic Soviet Republic has refused our demands to our rightful land! Should we declare war to get our territory anyway?
 poland.24.a: "Объявляем войну!" # Declare War!
 poland.24.b: "Отойди назад" # Stand back
 poland.25.t: "Регистрация Литвы" # The Incorporation of Lithuania
 poland.25.d: "Королевство Польское потребовало нашей аннексии, они уже начали менять литовские статуи на польские и убирать литовских чиновников. Это может быть конец Литвы, какой мы ее знаем. Однако в нашем народе звучат голоса бунта, надежды, может быть, это просто безнадежные крики отчаяния, но это могут быть и голоса новой литовской нации." # The Kingdom of Poland has demanded that we are to be annexed, they have already started changing Lithuanian statues to Polish ones and removing Lithuanian government officials. This might be the end of Lithuania as we know it. There are however voices of revolt, of hope in our nation, maybe these are just hopeless screams of despair, but they could also be voices of a new Lithuanian nation.
 poland.25.a: "Сегодня мы восстаем!" # Today, we revolt!
 poland.25.b: "Нам придется принять свою судьбу..." # We have to accept our fate...
 poland.26.t: "Литовский бунт!" # The Lithuanian revolt!
 poland.26.d: "Литовский народ решил восстать! После всего нашего честного и справедливого правления они решили внезапно покинуть нас без объяснения причин. Они предатели нашей великой нации и их необходимо победить!" # The Lithuanian nation has decided to revolt! After all of our fair and just rule they have decided to suddenly abandon us without a giving a proper reason. They are traitors to our grand nation and must be defeated!
 poland.26.a: "На войну!" # To War!
 poland.27.t: "Литовские ополченцы присоединяются к армии!" # Lithuanian militias join army!
 poland.27.d: "Местные литовские ополченцы, воевавшие против Польши, пока мы были марионеткой, решили присоединиться к армии, вместе мы победим польского монстра!" # Local Lithuanian militias that have been fighting against Poland while we were still a puppet have decided to join the army, together we shall defeat the Polish monster!
 poland.27.a: "Наш народ восстал!" # Our people have risen!
 poland.28.t: "Пилсудский мертв." # Piłsudski is dead
 poland.28.d: "Сегодня вечером Пилсудский был найден мертвым в своем кабинете. Вскоре назначенное обследование его тела выявило сильное внутреннее кровотечение, вероятно, вызванное раком печени, который развивался в течение длительного времени. В ответ на смерть одного из самых влиятельных и любимых польских деятелей король объявил национальную неделю траура. Пилсудский будет похоронен рядом со своей матерью на кладбище в Вильнюсе со всеми почестями, которые удостоятся величайшего полководца Польши. Однако с его смертью возникли новые проблемы. Его популярность среди населения долгое время сохраняла целостность нашего государства. Но теперь, с его уходом, партии в парламенте, возможно, снова начнут разваливаться, что приведет к катастрофе, которую мы уже дважды пережили за последние 5 лет. Вот почему мы должны как можно скорее организовать большие дебаты, чтобы решить все проблемы до того, как весь аппарат власти Сейма снова исчезнет под партийными разногласиями и внутренними распрями." # On today's evening, Piłsudski was found lying dead in his office. The soon-ordered examination of his body revealed a huge internal bleeding, probably caused by a liver cancer which was developing for a long time. In response to the death of one of most influencial and beloved Polish figures, the King has announced a national week of mourning. Piłsudski will be buried next to his mother, on a cementary in Vilnius, with all the honours the greatest commander of Poland shall get. With his death however, come another problems. His popularity among the population was keeping our state together for a long time. But now, with him gone, the parties in the parliament will possibly start to fall apart again, resulting in a disaster we already expierienced two times in the last 5 years. This is why we have to organise a great debate as soon as possible, in order to solve all problems before the whole aparatus of the Sejm's power will again vanish under the parties' disagreements and internal fights.
 poland.28.a: "Это ужасный день для нашей страны..." # This is a terrible day for our country...
 poland.29.t: ""
 poland.29.d: ""
 poland.30.t: "Вопрос о монархии" # The question of monarchy
 poland.30.d: "Наш король был навязан нам Антантой на Версальской конференции. Монархия в нашей стране де-факто является искусственным созданием. Однако это приносит нам преимущества, а также некоторые незначительные недостатки. Вопрос в том, должно ли оно остаться или уйти? И если он останется, насколько мощным он должен быть?" # Our king was forced upon us by the Entente on the Versailles conference. The monarchy is de facto an artificial creation in our country. However it brings us benefits, together with some minor downsides. The question is, should it stay, or should it go? And if it should stay, how powerful should it be?
 poland.30.a: "Нам это больше не нужно" # We don't need it anymore
 poland.30.b: "Король должен иметь больше власти" # The king should have more power
 poland.30.c: "Мы должны оставить все как есть" # We should keep it as it is
 poland.31.t: "Вопрос о радикалах" # The question of radicals
 poland.31.d: "Радикальные партии представляют серьезную угрозу стабильности нашей страны. Четверть нашего населения состоит из меньшинств, которые, согласно программам радикальных партий, должны быть полонизированы или даже изгнаны. Мы не можем позволить этому случиться. Стоит также отметить, что оппозиционная нам партия — СДСР — планирует создать коалицию с национал-демократами. Запрет НД, возможно, поможет нам победить на ближайших выборах. Что нам с ними делать?" # The radical parties are posing a major stability risk to our country. A quarter of our population consists of minorities, which, according to radical parties' programs, should be polonised, or even expelled. We cannot let this happen. It is also worth mentioning that a party opposed to us, the PSCD, is planning a coalition with the National Democrats. Banning the ND could possibly help us win the nearest elections. What should we do with them?
 poland.31.a: "Нам следует запретить ОНР" # We should ban the ONR
 poland.31.b: "Нам следует запретить ОНР и НД." # We should ban the ONR and the ND
 poland.32.t: "Военные требуют доли власти" # Military demands a share of power
 poland.32.d: "Сегодня вечером маршал Польши Эдвард Рыдз-Смиглы вошел в кабинет короля с четким, но спорным предложением. От имени Войска Польского он потребовал вернуть ему звание «генерального инспектора армии». Смиглы заявил, что он должен иметь ту же власть, что и в старые времена польско-большевистской войны, что, по сути, делает его самым влиятельным государственным чином после монарха. Хотя предложение было представлено мирным путем, советники короля опасаются агрессивной реакции на отказ. Что нам делать?" # On today's evening, the Marshal of Poland, Edward Rydz-Śmigły, entered the King's office with a clear, yet controversial proposal. On behalf of the Polish Army, he demanded a return of the "General Inspector of the Army" rank. Śmigły stated that it should have the same power it had in the old days of the Polish-Bolshevik war, basically making it the most powerful government rank after the monarch. Although the proposal was presented peacefully, the King's advisors are afraid of an agressive response to a refusal. What should we do?
 poland.32.a: "Вы можете получить это..." # You can have it...
 poland.32.b: "Это мое!" # It is mine!
 poland.33.t: "Военные поддерживают короля" # The military supports the King
 poland.33.d: "Теперь, при поддержке военных, власть принадлежит Королю, и любые предатели, стремящиеся изменить этот статус, столкнутся с гневом лояльной Королю армии!" # Now, with the military's support, the power belongs to the King , and any traitors seeking to change this status will face the wrath of the King's loyal army!
 poland.33.a: "Теперь... где моя корона..." # Now...where is my crown...
 poland.34.t: "Военный переворот!" # Military coup!
 poland.34.d: "Мой король! Воинские части, которые якобы «тренировались» на подступах к Варшаве, теперь открыто враждебны и входят в город! Маршал Польши Эдвард Рыдз-Смиглы заявил, что «чтобы сохранить демократию, он обязан вмешаться до того, как король примет полную власть». Военные ополчились против нас, а последние верные части арестованы или сражаются с врагом на улицах Варшавы. Однако их лояльность не может спасти нас. Нас сильно превосходят по численности. Это конец монархии." # My King! The military units that were supposedly "training" on the outskirts of Warsaw are now openly hostile and entering the city! The Marshal of Poland, Edward Rydz-Śmigły has stated that "In order to preserve democracy, he is obliged to step in before the King assumes total power". The military has turned against us, and the last loyal units have been arrested or are fightning with the enemy on the streets of Warsaw. However their loyality can't save us. We are heavily outnumbered. This is the end of the monarchy.
 poland.34.a: "Мой король, вы арестованы за преступления против государства." # My King, you are under arrest for crimes against the state
 poland.35.t: "Что нам делать сейчас?" # What should we do now?
 poland.35.d: "Государство находится под нашим тотальным контролем. Быстрый захват жизненно важных правительственных зданий во всех крупных городах оказался на удивление успешным. Но теперь остался один вопрос. Должны ли мы вернуть демократию, как обещал маршал в своей речи, или нам следует заявить права на власть и создать военную хунту?" # The state is under our total control. The swift take over of the vital government buildings in all major cities was surprisingly successfull. But now, one question remains. Should we bring back democracy like the Marshal promised in his speech, or should we claim the power for ourselves, and estabilish a military junta?
 poland.35.a: "Это наше время править" # This is our time to rule
 poland.35.b: "Давайте вернем демократию" # Let's bring back democracy
 poland.36.t: "Первые выборы в новой республике" # First elections in the new republic
 poland.36.d: "Мы отменили монархию, и теперь это первые полностью свободные выборы в истории нашей страны. Это действительно особенный момент." # We have abolished the monarchy, and now, these are the first fully free elections in the history of our country. This is truly a special moment.
 poland.36.a: "Давайте начнем" # Let's start
 poland.37.t: "Волнения среди населения растут" # Unrest among the population rises
 poland.37.d: "Беспорядки, вызванные запретом правительством партии «Национальная демократия», выросли больше, чем ожидалось. Тысячи поляков по всей стране вышли на улицы в знак протеста против «незаконных, недемократических действий нынешнего правительства». Есть только два варианта. Мы уходим в отставку или продолжаем наши планы." # The unrest caused by the government banning the National Democracy party has risen more than expected. Thousands of Poles all around the country have taken to the streets to protest against the "Unlawful, undemocratic move of the current government". There are only two choices. We step down, or continue our plans. 
 poland.37.a: "Это было неправильное решение" # This was a wrong decision
 poland.37.b: "Они не остановят нас" # They won't stop us
 poland.38.t: "Беспорядки растут еще больше" # The unrest rises even more
 poland.38.d: "Наша позиция совершенно не помогла разрешить беспорядки. Теперь людей на улицах стало еще больше, а полиция уже не может сдерживать протесты. Предыдущие небольшие стычки превратились в настоящие стены людей, продвигающихся к полицейским очередям, а протестующие уже начали строить баррикады на улицах. Мы должны уйти в отставку или ввести армию, иначе ситуация полностью выйдет из-под нашего контроля!" # Our stance didn't help with resolving the unrest at all. Now there are even more people on the streets, and the police force cannot contain the protests anymore. The previous small skirmishes have turned into literal walls of people pushing towards the police lines and protesters have already started constructing barricades on the streets. We have to step down, or send in the military, or else the situation will completely slip out of our control!
 poland.38.a: "Мы сдаемся" # We give up
 poland.38.b: "Отправить в армию" # Send in the military
 poland.39.t: "Забастовка железнодорожников." # The railroad workers' strike
 poland.39.d: "Железнодорожники, поддерживающие протесты, организовали забастовку! Без действующих железных дорог мы не можем переправить наши войска из других регионов в Варшаву для сдерживания протестов, а городской гарнизон слишком мал, чтобы что-либо сделать самостоятельно! Теперь нас может спасти только чудо." # The railroad workers supporting the protests have organised a strike! Without functioning railways we cannot transport our troops from other regions to Warsaw to contain the protests, and the city garrison is too small to do anything on its own! Now, only a miracle can save us.
 poland.39.a: "Ой-ой" # Uh-oh
 poland.40.t: "Люди маршируют к столице!" # People are marching towards the capital!
 poland.40.d: "Протесты бушевали по всей стране уже несколько дней, но мы получили сообщения о националистическом марше, направленном прямо на столицу. Ходят слухи, что его возглавит сам Роман Дмовский. Тем временем все правительственные здания в Варшаве окружены, и выхода нет. Мы окружены и не можем действовать. Военные беспомощны, поэтому мы здесь одни. Начни молиться..." # The protests were raging all around the country for days now, but we got reports about a nationalist march aimed straight for the capital. There are rumors of Roman Dmowski leading it himself. Meanwhile, all government buildings in Warsaw are sorrounded, and there is no way out. We are encircled, and unable to act. The military is helpless, so we are here on our own. Start the prayers...
 poland.40.a: "Что мы будем делать теперь?" # What will we do now?
 poland.40.b: "Что мы будем делать теперь?" # What will we do now?
 poland.41.t: "Националистический захват" # Nationalist takeover
 poland.41.d: "Марш националистов легко проник в столицу и после штурма нескольких правительственных зданий вынудил правительство окончательно уйти в отставку. Эта коррумпированная структура теперь распущена, и настало время править Национальной Демократией, поскольку она пользуется полной поддержкой народа." # The Nationalist march entered the capital with ease and after storming several government buildings forced the government to finally step down. That corrupt structure is now dissolved, and it is the National Democracy's time to rule as they have the total support of the people.
 poland.41.a: "Новая эра начинается сейчас!" # The new era starts now!
 poland.42.t: "Формирование военизированных формирований на востоке" # Formation of paramilitaries in the east
 poland.42.d: "Благодаря нашему решению Великого заседания Сейма, которое предоставило меньшинствам широкий спектр новых прав, они сформировали военизированные группы в ответ на сложившуюся ситуацию. Их задача, по крайней мере, по словам их лидера - слова Симона Петлюры, - спасти нынешнее польское правительство от \"незаконного мятежа, организованного националистическими радикалами, стремящимися разрушить нынешний баланс прав между национальностями Польши\". По данным наших информаторов, в настоящее время эти группы маршируют в сторону Варшавы с явным намерением разогнать националистическое ополчение." # Thanks to our decision during the Great Sitting of the Sejm, which provided a wide spectrum of new rights for the minorities, they have formed paramilitary groups in response to the current situation. Their job, at least according to their leader's - Symon Petliura's words, is to save the current Polish government from "an unlawful revolt staged by nationalist radicals, who seek to destroy the current balance of rights between the nationalities of Poland". According to our informants, these groups are currently marching towards Warsaw, with a clear intention to disperse the nationalist militia.
 poland.42.a: "Мы спасены?" # Are we saved?
 poland.43.t: "НД сдается" # ND gives up
 poland.43.d: "Марш националистов, услышав новости о марше восточных военизированных формирований в сторону Варшавы, распустился и покинул город. Полиция сдержала протесты, и правительственные здания постепенно отвоевываются из рук протестующих. Похоже, социал-либеральное правительство под руководством Винсенти Витоса останется... пока" # The Nationalist march, after hearing the news about the eastern paramilitaries marching towards Warsaw, has disbanded and fled the city. The police force has recontained the protests and the government buildings are slowly getting recaptured from the hands of protestors. Looks like the Social Liberal government under Wincenty Witos stays...for now
 poland.43.a: "Поистине второе чудо на Висле" # Truly a second Miracle at Vistula
 poland.44.t: "Новая коалиция" # The new coalition
 poland.44.d: "Поскольку национальная демократия ушла с дороги, а социал-консерваторы потеряли важного союзника, мы можем смело объединить усилия с социал-демократами и с легкостью победить на выборах!" # With the National Democracy out of the way, and the Social Conservatives missing an important ally, we can safely join forces with the Social Democrats and proceed to win the elections with ease!
 poland.44.a: "Становится только лучше" # This is getting only better
 poland.45.t: "Выборы без НД" # Elections without the ND
 poland.45.d: "Новые выборы организованы, теперь вместе с социал-демократами мы спасем эту страну от националистов и их консервативных марионеток!" # New elections have been organised, now, together with the Social Democrats, we will save this country from the nationalists and their conservative puppets!
 poland.45.a: "Начнем выборы" # Let's start the elections
 poland.46.t: "Встреча с королем" # A meeting with the King
 poland.46.d: "Сегодня утром группа советников короля встретилась с самим королем в его дворце в Варшаве. Цель встречи — определить новый путь монархии, или, скорее, абсолютной монархии, установленной королем. Есть две партии, которые по-прежнему хотят сотрудничать с «недемократическим и злым» монархом. Социал-либеральная СЛ, которая предлагает модель доброжелательной диктатуры, которая поможет бедным и распространит богатство, и Националистическая НД, которая стремится создать однородное польское государство, оттесняя меньшинства на обочину." # On today's morning, a group of the King's advisors met with the King himself in his palace in Warsaw. The aim of the meeting is to decide the new path for the monarchy, or rather the absolute monarchy the King estabilished. There are two parties who still want to cooperate with the "undemocratic and evil" monarch. The Social Liberal SL, which proposes a model of a benevolent dictatorship, which would help the poor and spread the wealth, and the Nationalist ND, which seeks to estabilish a homogenous Polish State, with the minorities sweeped to the margin.
 poland.46.a: "Выберите центристское предложение" # Choose the centrist proposal
 poland.46.b: "Выберите националистическое предложение" # Choose the nationalist proposal
 poland.47.t: "Офицерское совещание" # Officers' meeting
 poland.47.d: "Сегодня вечером небольшая группа высокопоставленных офицеров встретилась с Эдвардом Рыдз-Смиглым в его новом офисе в Варшаве. Цель встречи – определить путь новой военной диктатуры. Среди многих предложений есть два, которые выделяются и, возможно, являются единственными жизнеспособными вариантами. Либо мы установим центристскую, доброжелательную диктатуру и заслужим поддержку народа, помогая ему, либо мы создадим националистическое правительство с целью создания однородного польского государства, в котором меньшинства будут оттеснены на обочину и практически не имеют никаких прав." # On today's evening, a small group of high-ranked officers met with Edward Rydz-Śmigły in his new office in Warsaw. The aim of the meeting is to decide the path for the new military dictatorship. Among many proposals, there are two which stand out, and are possibly the only viable options. Either we estabilish a centrist, benevolent dictatorship, and earn the support of the people through helping them, or we estabilish a nationalist government, with the aim of creating a homogenous Polish State, with the minorities sweeped to the margin, with barely any rights. 
 poland.47.a: "Выберите центристское предложение" # Choose the centrist proposal
 poland.47.b: "Выберите националистическое предложение" # Choose the nationalist proposal
 poland.48.t: "Польша просит защиты" # Poland asks for protection
 poland.48.d: "Польша запросила у нас защиту, в обмен на это они уступят Хмельницкий. Должны ли мы принять это предложение?" # Poland has requested a protection from us, in exchange for this they will cede Khmelnytskyi. Should we accept the offer?
 poland.48.a: "Они наши враги" # They are our enemies
 poland.48.b: "Мы должны защищать мир в регионе" # We should defend the peace in the region
 poland.49.t: "Польша хочет присоединить Литву" # Poland wants to incorporate Lithuania
 poladn.49.d: ""
 poland.49.a: "Ни в коем случае, мы остаемся независимыми" # No way, we stay independent
 poland.49.b: "Мы принимаем предложение" # We accept the offer
 poland.50.t: "Литва отказалась!" # Lithuania refused!
 poland.50.d: "Эти неблагодарные ублюдки отказались от нашего предложения! Мы должны наказать их всей возможной силой!" # These ungrateful bastards refused our proposal! We should punish them with all the force we can use!
 poland.50.a: "Атакуйте!" # Attack!
 poland.50.b: "Мы уважаем их решение" # We respect their decision
 poland.51.t: "Возвращение Галиции." # Taking back Galicia.
 poland.51.d: "Земли Галичины были незаконно отняты у нас во время польско-советской войны и с тех пор мы не можем их вернуть. Теперь словаки в полном восстании, и представился шанс вернуть землю. Мы должны войти и защитить нашу законную польскую землю." # The lands of Galicia were wrongfully taken from us during the Polish-Soviet War, and we have been unable to take them back ever since. Now the Slovaks are in full revolt, and the chance to take the land back has presented itself. We must march in and secure our rightful Polish land.
 poland.51.a: "Это как отобрать конфету у ребенка..." # Like taking candy from a baby...
 poland.52.t: "Польша требует земли!" # Poland demands land!
 poland.52.d: "Польские чиновники требуют от нас уступить стратегически важные земли, заявляя, что это ради нашей общей безопасности." # Polish officials demand us to cede strategically important lands, stating that it's for our common safety.
 poland.52.a: "У нас нет шансов, позвольте это сделать." # We stand no chance, allow it.
 poland.52.b: "Эти требования смешны, готовьтесь защищать наши земли!" # These demands are ridiculous, prepare to defend our lands!
 poland.53.t: "Словакия отказалась!" # Slovakia refused!
 poland.53.d: ""
 poland.53.a: "Атакуйте!" # Attack!
 poland.53.b: "Хорошо... они могут это получить... пока" # Ok...they can have it...for now
 poland.54.t: "Польша хочет покупать у нас оружие" # Poland wants to buy guns from us
 poland.54.d: "В связи со сложившейся ситуацией в регионе Министерство обороны Польши осознало, насколько велика потребность в новых орудиях в Войске Польском. Из разных подрядчиков решили выбрать нас и предложили сделку." # Due to the current situation in the region, the Polish Ministry of Defense realised how big the need for new guns in the Polish Army is. From various contractors, they decided to choose us, and proposed a deal.
 poland.54.a: "Мы должны помочь им с нашим оборудованием." # We should help them with our equipment
 poland.54.b: "Мы даже не можем пожалеть пистолета" # We can't even spare a pistol
 poland.55.t: "Польша просит помощи в расширении литовских портов" # Poland seeks help in expanding the Lithuanian ports
 poland.55.d: "Из-за отсутствия выхода к морю Польша вынуждена использовать литовские порты в качестве портов приписки для всех видов торговли. В связи с острой необходимостью увеличения импорта польское правительство стремится расширить инфраструктуру портов и верфей в литовском регионе. Однако такая инвестиция стоит дорого, и поляки обратились к нам за помощью." # Due to the lack of sea access, Poland is forced to use Lithuanian ports as their homeports for all kinds of trade. Due to the urgent need for bigger imports, the Polish government seeks to expand the port and dockyard infrastructure in the Lithuanian region. However, such an investment is expensive, and the Polish had asked us for help.
 poland.55.a: "Мы должны помочь нашим союзникам" # We should help our allies
 poland.55.b: "Мы не можем пощадить сломанный франк" # We can't spare a broken franc
 poland.56.t: "Польша просит помощи в разработке новых бомбардировщиков" # Poland asks for help in designing new bombers
 poland.56.d: "Министерство обороны Польши разработало план разработки нового современного бомбардировщика. Очевидно, что наши бомбардировщики превосходят любые другие, и именно поэтому поляки обратились к нам и ищут помощи в разработке новой конструкции. Должны ли мы им помочь?"  # The Polish Ministry of Defense has set up a plan to design a new, modern bomber. Obviously our bombers are superior to any others, and this is exactly why the Polish turned to us and are seeking help in developing a new design. Should we help them?
 poland.56.a: "Наши бомбардировщики явно превосходят, давайте поделимся знаниями" # Our bombers are obviouly superior, let's share the knowledge
 poland.56.b: "Я думаю, нам не следует" # I think we shouldn't
 poland.57.t: "План польских западных укреплений" # The Polish Western Fortifications plan
 poland.57.d: "На протяжении веков у Польши были проблемы со своим западным соседом, Германией. Теперь польское правительство решило изменить это, приняв план, направленный на укрепление западной польской границы. Конечно, для поляков такая инвестиция возможна, но им обязательно потребуются опытные помощники, поскольку они никогда раньше не строили подобного. Должны ли мы послать некоторых наших специалистов по фортификации в Польшу?" # For ages, Poland had problems with their western nerighbour, Germany. Now, the Polish government has decided to change it, by accepting a plan focused on fortyfing the western Polish border. Of course, such an investment is possible for the Polish, but they will certainly need some expierienced assistants, as they have never built such a thing before. Should we send send some of our fortification specialists to Poland?
 poland.57.a: "Защита от Германии – самый важный вопрос" # Protection against Germany is the most important matter
 poland.57.b: "Мы не можем жалеть наших специалистов" # We can't spare our specialists
 poland.58.t: "Франко-польская железнодорожная компания" # Compagnie Franco-Polonaise de Chemins de Fer
 poland.58.d: "Благодаря постепенному проникновению Польши в нашу сферу влияния, французские бизнесмены начали инвестировать в некоторые отрасли польской промышленности. Одним из результатов этих инвестиций стала «Compagnie Franco-Polonaise de Chemins de Fer», или, по-английски, «Французско-польская железнодорожная ассоциация». Его цель – инвестировать в польскую железнодорожную инфраструктуру и, возможно, в ее дальнейшее развитие. Наш верный союзник наверняка от этого выиграет." # Thanks to Poland slowly drifting into our sphere of influence, French businessmen started investing in some parts of the Polish industry. One of the outcomes of these investments is the "Compagnie Franco-Polonaise de Chemins de Fer", or, in english "The French-Polish Rail Association". Its aim is to invest in the Polish railway infrastructure, and possibly developing it further more. Our loyal ally will for sure prosper from this.
 poland.58.a: "Большой!" # Great!
 poland.59.t: "Польское предложение о покупке Мадагаскара" # Polish offer to buy Madagascar
 poland.59.d: "После создания Морской и колониальной лиги в Польше польское правительство начало поиск новых земель, на которых можно было бы собирать ресурсы и процветать. После нескольких дебатов они решили отправить нам предложение о покупке Мадагаскара. Для нас это пустошь, где почти нет ресурсов, поэтому они могут использовать ее больше, чем мы сейчас." # Following the estabilishment of the Maritime & Colonial League in Poland, the Polish government started searching for new lands they could gather resources, and prosper from. After several debates, they have decided to send an offer to buy Madagascar from us. For us it is a wasteland with almost no resources, so they may have a bigger use of it than we have currently.
 poland.59.a: "Мы принимаем предложение" # We accept the offer
 poland.59.b: "Мы не должны продавать части нашей колониальной империи" # We shouldn't sell parts of our colonial empire
 poland.60.t: "Они отказались!" # They refused!
 poland.60.d: "К сожалению, наше предложение было отклонено." # Sadly, our offer was denied.
 poland.60.a: "Черт возьми..." # Goddamnit...
 poland.61.t: "Предложение принято!" # Offer accepted!
 poland.61.d: "Французы приняли наше предложение!" # The French have accepted our offer!
 poland.61.a: "Ура!" # Hurray!
 poland.62.t: "Польская морская и колониальная лига" # Polish Maritime & Colonial League
 poland.62.d: "После развития литовских портов поляки решили преобразовать Морскую и Речную лигу в Морскую и Колониальную лигу. Его цель - заботиться о делах торгового флота и просвещать польский народ по морским вопросам. Он активно поддерживает развитие как польского торгового флота, так и военно-морского флота, а также создание польских заморских территорий." # Following the development of the Lithuanian ports, the Polish have decided to reform the Maritime & River League into the Maritime & Colonial League. Its purpose is to care of their merchant navy's affairs and to educate the Polish nation about maritime issues. It actively supports the development of both the Polish merchant fleet and navy, as well as creation of Polish overseas territories.
 poland.62.a: "Удачи" # Good luck
 poland.62.b: "Давайте отправим им небольшой подарок, ладно?" # Let's send them a small present, shall we?
 poland.63.t: "Польские фортификационные фонды" # Polish Fortification Funds
 poland.63.d: "Польша прислала нам средства, чтобы помочь нам в укреплении и защите нашей восточной границы. Их дар невелик, но, располагая достаточным количеством собственных денег, мы можем использовать его с пользой." # Poland has sent us funds to help us in fortyfing and defending our eastern border. Their gift isn't huge, but with a proper amount of our own money, we can make a good use of it.
 poland.63.a: "Мы не можем жалеть денег. Используйте только польские средства" # We can't spare any money. Use only the Polish funds
 poland.63.b: "Оборона – это то, на что у нас всегда есть деньги." # Defense is something we always have money for
 poland.64.t: "Разрешение трансильванского спора" # Solving the Transylvanian Dispute
 poland.64.d: "После Версальской конференции Румыния и Венгрия возненавидели друг друга. Из-за создания Республики Трансильвания и претензий Румынии и Венгрии на этот регион произошли различные дипломатические споры, нанесшие серьезный ущерб их отношениям. Теперь, когда мы в состоянии наконец положить этому конец, есть два варианта, предложенные и принятые нашими румынскими и венгерскими друзьями." # Since the Versailles Conference, Romania and Hungary came to hate each other. Due to the creation of the Republic of Transylvania, and claims of both Romania and Hungary to the region, various diplomatic disputes took place, damaging their relations greatly. Now, with us in a good position to finally put an end to this, there are two options available, both proposed and accepted by our Romanian and Hungarian friends.
 poland.64.a: "Трансильвания должна стать румынской, а Банат — венгерской." # Transylvania should be Romanian and Banat Hungarian
 poland.64.b: "Северная Трансильвания должна принадлежать Венгрии, Банат и южная Трансильвания должны принадлежать Румынии." # North Transylvania should be Hungarian, Banat and south Transylvania should go to Romania
 poland.65.t: "Наши соседи согласились разделить нас!" # Our Neighbours have agreed to partition us!
 poland.65.d: "В течение многих лет мы оставались в безопасности только благодаря разногласиям между нашими восточными и западными соседями. Теперь, когда Польша выступила в качестве переговорщика, они наконец пришли к соглашению о разделе нашей страны. Мы должны что-то сделать, пока не стало слишком поздно!" # For years we stayed safe only due to disagreements between our eastern and western neighbours. Now, with Poland as the negotiator, they finally came to an agreement to partition our country. We have to do something before it is too late!
 poland.65.a: "Мы никогда не сдадимся!" # We will never surrender!
 poland.65.b: "В любом случае это государство — искусственное творение." # This state is an artificial creation anyway
 poland.66.t: "Наши соседи согласились разделить нас!" # Our Neighbours have agreed to partition us!
 poland.66.d: "В течение многих лет мы оставались в безопасности только благодаря разногласиям между нашими восточными и западными соседями. Теперь, когда Польша выступила в качестве переговорщика, они наконец пришли к соглашению о разделе нашей страны. Мы должны что-то сделать, пока не стало слишком поздно!" # For years we stayed safe only due to disagreements between our eastern and western neighbours. Now, with Poland as the negotiator, they finally came to an agreement to partition our country. We have to do something before it is too late!
 poland.66.a: "Мы никогда не сдадимся!" # We will never surrender!
 poland.66.b: "В любом случае это государство — искусственное творение." # This state is an artificial creation anyway
 poland.67.t: "Трансильвания отказалась принять сделку!" # Transylvania refused to accept the deal!
 poland.67.d: "Несмотря на огромные усилия, которые мы приложили, чтобы положить конец этой безбожной мерзости, они по-прежнему упрямы и отказываются принять наше соглашение! Если они не захотят сотрудничать, они скоро увидят наше совместное вторжение!" # Even with the great effort we put in to put an end to this ungodly abomination, they are still stubborn and refused to accept our agreement! If they don't want to cooperate, they will soon expierience our combined invasion!
 poland.67.a: "Атакуйте!" # Attack!
 poland.68.t: "Трансильвания отказалась принять сделку!" # Transylvania refused to accept the deal!
 poland.68.d: "Несмотря на огромные усилия, которые мы приложили, чтобы положить конец этой безбожной мерзости, они по-прежнему упрямы и отказываются принять наше соглашение! Если они не захотят сотрудничать, они скоро увидят наше совместное вторжение!" # Even with the great effort we put in to put an end to this ungodly abomination, they are still stubborn and refused to accept our agreement! If they don't want to cooperate, they will soon expierience our combined invasion!
 poland.68.a: "Атакуйте!" # Attack!
 poland.69.t: "Трансильвания отказалась принять сделку!" # Transylvania refused to accept the deal!
 poland.69.d: "Несмотря на огромные усилия, которые мы приложили, чтобы положить конец этой безбожной мерзости, они по-прежнему упрямы и отказываются принять наше соглашение! Если они не захотят сотрудничать, они скоро увидят наше совместное вторжение!" # Even with the great effort we put in to put an end to this ungodly abomination, they are still stubborn and refused to accept our agreement! If they don't want to cooperate, they will soon expierience our combined invasion!
 poland.69.a: "Атакуйте!" # Attack!
 poland.70.t: "Польша просит военных советников" # Poland requests military advisors
 poland.70.d: "Поскольку Польша медленно дрейфует в нашу сферу влияния и, возможно, вскоре присоединится к нашему альянсу, они обратились к нам с просьбой о военных советниках. Кажется, они воспринимают нашу армию как величайшую армию на земле, и мы не удивлены. Должны ли мы помочь им в развитии их армии?" # With Poland slowly drifting into our sphere of influence and possibly joining our alliance soon, they have asked us for military advisors. It seems that they perceive out military as the greatest army on earth, and we aren't surprised. Should we help them in their army development?
 poland.70.a: "Отправьте советников" # Send the advisors
 poland.70.b: "Нет, пока они не присоединятся к нашему альянсу." # Not until they join our alliance
 poland.71.t: "Польша просит помощи в строительстве восточных укреплений" # Poland requests help in building their eastern fortifications
 poland.71.d: "Понимая опасность границы с Красным Гигантом, Польша разработала план по укреплению своей восточной границы. У них достаточно средств, чтобы начать укрепления самостоятельно, но их эффективность будет выше, если мы одолжим им некоторых наших специалистов по фортификациям." # Knowing the danger of being bordered by the Red Giant, Poland has brougth up a plan to fortify its eastern border. They have enough funds to start the fortifications by themselves, but their efficiency will be bigger if we lend some of our fortification specialists to them.
 poland.71.a: "Отправьте специалистов" # Send the specialists
 poland.71.b: "Они остаются с нами" # They stay with us
 poland.72.t: "Польша хочет покупать у нас танки" # Polands wants to buy tanks from us
 poland.72.d: "По итогам дебатов в польском министерстве обороны поляки решили, что их армия остро нуждается в новых танках. Ввиду своего членства в «Штальпакте» они сделали нам предложение. Может, нам продать им немного наших танков?" # Following the debate in the Polish ministry of defense, the Polish have decided that their army is in an urgent need for new tanks. Due to their membership in the Stahlpakt, they have proposed us an offer. Should we sell them some our tanks?
 poland.72.a: "У них должны быть некоторые из наших лучших танков." # They should have some of our superior tanks
 poland.72.b: "Это только для нас" # These are only for us
 poland.73.t: "Польша предлагает заключить оружейную сделку" # Poland proposes an arms deal
 poland.73.d: "Сегодня к нам приехал польский дипломат с интересным предложением. Польское верховное командование решило, что их запасы оружия слишком малы, и обсудило этот вопрос. Похоже, что среди различных подрядчиков нас считали наиболее подходящей страной для покупки оружия." # Today we were visited by a polish diplomat, with an interesting proposal. The Polish High Command have decided that their stockpile of weapons is too small, and debated the issue. Looks like, from various contractors, we were seen as the most appriopiate nation to buy arms from.
 poland.73.a: "Мы принимаем сделку" # We accept the deal
 poland.73.b: "Мы не можем жалеть оружия" # We can't spare any guns
 poland.74.t: "Польша просит финансовой помощи" # Poland requests financial help
 poland.74.d: "Поляки наконец решили укрепить свою самую уязвимую западную границу. Они знают, что их средств будет недостаточно, чтобы построить достаточно большие укрепления, чтобы остановить наступление немцев на их родину, поэтому они обратились к нам и обратились за финансовой помощью. Эта инвестиция может быть полезна не только им, так как готовые укрепления, вероятно, остановят немцев в Польше задолго до того, как они достигнут нашей земли." # The Polish have finally decided to fortify their most vulnerable, western border. They know that their funds won't be enough to build fortifications great enough to stop a German advance into their fatherland, so they have turned to us, and seek financial help. This investment may be useful not only for them, as the finished fortifications will probably stop the Germans in Poland, long before they reach our land.
 poland.74.a: "Мы должны помочь им остановить немецкий экспансионизм." # We must help them in stopping the German expansionism
 poland.74.b: "Они могут сделать это самостоятельно" # They can do it on their own
 poland.75.t: "Российская ССР отказалась помочь" # Russian SSR refused to help
 poland.75.d: "К сожалению, русские отказались прислать нам финансовую помощь. Это означает, что укрепления должны быть намного меньше и уж точно не такими эффективными, как те, которые мы планировали. Нам пока этого хватит." # Sadly, the Russians refused to send us financial help. This means that the fortifications will have to be much smaller, and for sure not as efficient as the ones we had in plans. We will have to suffice with these for now.
 poland.75.a: "Будем надеяться, что бункеры выстоят против немцев." # Let's hope the bunkers will stand against the Germans
 poland.76.t: "Польша хочет присоединиться к Интернационалу" # Poland wants to join the Internazional
 poland.76.d: "Наши коллеги-польские социалисты решили искать защиты в нашем славном союзе! Должны ли мы принять их просьбу присоединиться?»" # Our fellow Polish socialists have decided to seek protection in our glorious alliance! Should we accept their request to join?" 
 poland.76.a: "Еще одно успешное социалистическое государство в нашем союзе!" # One more succesfull socialist state in our alliance!
 poland.76.b: "Нет" # No
 poland.77.t: "Ограбление банка во Львове!" # Bank robbery in Lwów!
 poland.77.d: "Ужасные новости! Под покровом ночи грабители ворвались в одно из отделений Польского национального банка во Львове! Все вклады вместе с наличными, хранившимися в хранилище банка, исчезли, а стоимость ограбленного имущества оценивается примерно в 13 000 000 злотых! Грабители были профессионалами и их действия были прекрасно скоординированы. Полиция подозревает, что когда один из грабителей ждал в ванной, пока банк закроется, остальные проникли в здание сзади, просверлив дыру в стене соседнего дома. После закрытия банка грабитель, ранее скрывавшийся, вывел из строя обоих охранников, забрал их ключи, а затем использовал их для быстрого побега через парадную дверь. Нам нужно действовать быстро, иначе грабители сбегут со всеми ценностями!" # Terible news! Under the cover of the night, robbers have broken into one of the subsidaries of the Polish National Bank in Lwów! All deposits, together with the cash that was stored in the bank's vault is gone, and the value of the robbed goods is estimated to be around 13.000.000 złoty! The robbers were profesionals and their action was perfectly coordinated. The police suspects that when one of the robbers waited in the bathroom for the bank to close, the rest was entering the building from the back, by drilling a hole in the wall of the adjacent house. After the bank has closed, the robber who previously was hiding, had incapacitated both guards, and obtained their keys, and later used them for a quick escape through the frontal door. We have to act fast, or the robbers will run away with all the valuables!
 poland.77.a: "Найдите их!" # Find them!
 poland.78.t: "Они исчезли!" # They have vanished!
 poland.78.d: "Несмотря на огромные усилия, которые мы приложили для поиска каких-либо улик, их буквально нет. Мы обыскали все здание, и нет ни единого следа их работы, кроме дыры в стене и открытых банковских ячеек." # Despite the great effort we put into finding any clues, there are literally none. We have searched the whole building, and there isn't even a single sign of their work, except the hole in the wall and opened deposit boxes.
 poland.78.a: "Как?! Ищите что-нибудь!" # How?! Look for something!
 poland.79.t: "Тропы найдены!" # Trails found!
 poland.79.d: "Мы что-то нашли! Один из полицейских наткнулся на часть автомобиля, на котором, предположительно, грабители скрылись. Судя по всему, водитель ударился о бордюр, и на нем осталась часть бампера автомобиля. Полиция подозревает, что это был белый Opel Olimpia. Теперь нам остается только искать похожие автомобили." # We found something! One of the policemen have came across a part of the car which the robbers, supposedly, used to escape. It seems that the driver hit the kerb, and a part of the car's bumper stayed on it. The police suspects that car was a white Opel Olimpia. Now, we just have to look for similar cars.
 poland.79.a: "Ищите в городе!" # Search in the city!
 poland.79.b: "Ищите в Подмосковье!" # Search in the suburbs!
 poland.80.t: "Ничего!" # Nothing!
 poland.80.d: "Ни у одного Опеля в городе не пропала часть бампера! Мы просто теряем время в поисках машин, когда грабители скрываются с нашими деньгами!" # None of the Opel's in the city missed a part of their bumper! We are just wasting time looking for cars when the robbers are escaping with our money!
 poland.80.a: "Черт возьми! Ищите пригород! Быстрый!" # Goddamnit! Search the suburbs! Quick!
 poland.81.t: "Найдены инструменты и оружие!" # Tools & weapons found!
 poland.81.d: "Мы нашли еще больше подсказок! При обыске возможных путей выхода из города полицейский патруль обнаружил сумку, в которой были все инструменты, с помощью которых можно было проникнуть в банк, так же, как это сделали грабители. Вполне возможно, что мы находимся очень близко к их укрытию. Нам следует сосредоточить наши усилия на этом направлении." # We found more clues! When searching the possible exit-routes from the city, the police patrol found a bag, containing all the tools that could be used to break into a bank, in the same fashion the robbers did. It is possible that we are very close to their hideout. We should concetrate our efforts on that area.
 poland.81.a: "Мы близко!" # We are close!
 poland.82.t: "Таинственный информатор" # Mysterious Informator
 poland.82.d: "Сегодня вечером в главном полицейском участке Львова прозвенел звонок. Охранник ночной смены открыл дверь, но, к его удивлению, снаружи оказалось только письмо на коврике для приветствия. Он принёс это письмо коменданту так быстро, как только мог. Открыв и прочитав его, уже было очевидно, насколько важна эта информация. Мы не знаем источника, но кто-то только что сообщил, где прячутся грабители! Нам нужно добраться туда и арестовать их, прежде чем они сбегут!" # On today's evening, a bell rang on the Lwów's main police station. The night-shift guard has opened the door, but to his surprise, the only thing outside, was a letter on the welcome mat. He brought this letter to the commandant as fast as he could. Upon opening and reading it, it was already obvious how important this information is. We don't know the source, but somebody just revealed where the robbers are hiding! We need to get there and arrest them before they escape!
 poland.82.a: "Быстрый! Получите их!" # Quick! Get them!
 poland.83.t: "Убежище" # Hideout
 poland.83.d: "Мы тайно окружили убежище грабителей. Разведчики утверждают, что они все еще внутри. Все подразделения готовы к штурму дома. Однако существует опасность, что грабители попытаются сжечь украденные деньги, и мы не можем рисковать их потерять. Они также предположительно хорошо вооружены. Стоит ли нам попытаться договориться?" # We have secretly surrounded the robbers' hideout. Scouts claim that they are still inside. All units are ready to storm the house. However, there is a danger that the robbers will try to burn the money they have stolen, and we can't risk to loose it. They are also supposedly heavily armed. Should we try to negotiate?
 poland.83.a: "Давайте договориться" # Let's negotiate
 poland.83.b: "Рейд на убежище!" # Raid the hideout!
 poland.84.t: "Ультиматум!" # Ultimatum!
 poland.84.d: "В ответ на наши попытки переговоров грабители выдвинули ультиматум. Половину украденных денег они требуют себе, машину и возможность уехать без преследования полиции. Эти требования явно абсурдны, но это единственный способ предотвратить ненужную кровавую баню в убежище и уничтожение наших денег." # In response to our negotiation attempts, the robbers have issued an ultimatum. They demand half of the robbed money for themselves, a car, and a possibility to drive away without the police chasing them. These demands are obviously absurd, but this is the only way we can prevent an unnecessary blood-bath in the hideout and having our money destroyed.
 poland.84.a: "Мы принимаем это" # We accept it
 poland.84.b: "Их требования неприемлемы! Готовьте рейд!" # Their demands are unnaceptable! Prepare the raid!
 poland.85.t: "Они ушли!" # They are gone!
 poland.85.d: "Приняв требования, мы вывели все помещения из окрестностей дома. Грабители вышли из дома, сели в машину и уехали. Как только они покинули поместье, мы послали за ними группу полицейских машин, но, к их удивлению, машины, а вместе с ними и грабители, исчезли. Они обманули нас в очередной раз. Положительным моментом является то, что подозреваемые оставили обещанную половину денег в доме." # After accepting the demands, we have withdrawed all units from the house's surroundings. The robbers left the house, entered the car, and drived away. As soon as they left the estate, we have sent a group of police cars after them, but, to their surprise, the cars, and with it, the robbers, vanished. They have tricked us once again. On the bright side, the suspects left the promised half of the money in the house.
 poland.85.a: "Снова?!" # Again?!
 poland.86.t: "Отчет о рейде" # Raid report
 poland.86.d: "Был проведен оперативный полицейский рейд. Первое подразделение вошло в дом спереди через главную дверь и сразу же попало под перекрестный огонь, в ходе которого четверо полицейских были ранены и двое убиты. Второе подразделение полиции проникло в дом через вход в подвал, расположенный снаружи дома, и, ворвавшись в дом через забаррикадированные двери подвала, сумело без потерь убить одного грабителя. Другой подозреваемый сбежал наверх, где заперся в комнате и забаррикадировал ее. Прежде чем полицейским удалось выломать дверь, подозреваемый сжег 3/4 украденных денег и занял «защитную позицию», используя перевернутый шкаф и стол. Понадобилось еще 2 убитых полицейских, чтобы выгнать его оттуда и убить. Эта неудачная акция наверняка попадет в заголовки завтрашних газет." # A swift police raid was executed. The first unit entered the house from the front through the main door, immediately getting caught in a cross-fire during which 4 policemen were wounded and 2 were killed. The second police unit entered the house through the basement entrance located outside the house, and after forcing their way into the house through the barricaded basement doors, managed to kill one robber without casualities. The other suspect escaped upstairs, where he had locked himself in a room and barricaded it. Before the police managed to break the door down, the suspect burned 3/4 of the robbed money, and set up a "defensive position" using a flipped toppled wardrobe and a table. It took another 2 killed policemen to force him out of there and kill him. This unsucessful action will for sure make it to the tommorow's newspaper headlines.
 poland.86.a: "Какой провал" # What a failure
 poland.87.t: "Возможное убежище найдено!" # Possible hideout found!
 poland.87.d: "Отличные новости! Полицейские патрули обнаружили возможное убежище в окрестностях небольшой деревни недалеко от главной дороги. Хотя мы не совсем уверены в правдивости этих сообщений, мы уже достаточно долго играли в кошки-мышки. Пришло время совершить набег на их безопасное место и вернуть наши деньги!" # Great news! The police patrols have found a possible hideout in the surroundings of a small village near the main road. While we aren't entirely sure if the reports are true, we have already played cat and mouse long enough. It is time to raid their safe spot and get our money back!
 poland.87.a: "Совершите набег!" # Raid it!
 poland.88.t: "Неправильный дом!" # Wrong house!
 poland.88.d: "Отчеты были ошибочными! Мы совершили набег на дом, принадлежащий ни в чем не повинным гражданам! Общественное мнение в восторге, и завтра это наверняка попадет в заголовки газет. Это был самый большой конфуз за все время существования польской полиции." # The reports were mistaken! We have raided a house belonging to innocent civilians! The public opinion is thrilled and this will for sure make it to the tommorow's newspaper headlines. This was the biggest embarassment in the whole existance of the Polish Police Force.
 poland.88.a: "Кто за это отвечает?!" # Who is responsible for this?!
 poland.89.t: "Они сбежали!" # They have escaped!
 poland.89.d: "Сегодня полиция обнаружила возможное убежище грабителей. Он расположен в лесу, недалеко от одной из главных магистралей выезда из города. К сожалению, он пуст. Грабители ушли, как и наши деньги." # Today, the police have found a possible hideout of the robbers. It is located in the woods, not far away from one of the main exit-routes from the city. Sadly, it is empty. The robbers are gone, and so is our money.
 poland.89.a: "Кто за это отвечает?!" # Who is responsible for this?!
 poland.90.t: "Предложение Польско-Литовской федерации" # The Polish-Lithuanian Federation proposal
 poland.90.d: ""
 poland.90.a: "Отличная идея, так мы все сможем быть равными" # A great idea, this way we can all be equal
 poland.90.b: "Я думаю, мы должны оставаться Польшей." # I think we should remain Poland
 poland.91.t: "Польша хочет заключить пакт о ненападении" # Poland wants to establish a non-aggression pact
 poland.91.d: ""
 poland.91.a: "Да, это должно помочь защитить Европу от повторения прошлых ошибок." # Yes, this should help protect Europe from repeating its past mistakes
 poland.91.b: "Нет, я не думаю, что это имеет значение" # No, I don't think it matters
 poland.92.t: "Готовимся к вторжению" # Preparing ourselves for the invasion
 poland.92.d: "Поскольку вторжение в Украину потребует некоторых усилий, мы, возможно, захотим передать часть нашей силы нашим союзникам, чтобы они помогали нам во время боя." # As invading Ukraine will require a bit of effort, we might want to distribute some of our power to our allies so they assist us during the fight
 poland.92.a: "Мы должны помочь Литве, нашему доверенному субъекту." # We should aid Lithuania, our trusted subject.
 poland.92.b: "Мы должны помочь Беларуси, поскольку она является стратегически важным союзником, когда дело доходит до нападения!" # We should aid Belarus, as it is the strategically important ally when it comes to the attack!
 poland.92.c: "Мы должны оставить оборудование себе." # We should leave the equipment to ourselves.
 poland.93.t: "Польша вооружила нас для будущего вторжения в Украину" # Poland has armed us for the future invasion of Ukraine
 poland.93.d: ""
 poland.93.a: "Отлично, теперь мы можем показать свою силу во время боя!" # Excellent, now we can show our strength during the fight!
 poland.94.t: "Вопрос о власти" # The question of rulership
 poland.94.d: "Мы можем либо решить назначить марионеточного премьер-министра, либо позволить самому Рыдз-Смиглу руководить нацией." # We can either decide to appoint a puppet prime minister or let Rydz-Śmigły himself guide the nation.
 poland.94.a: "Нам следует выбрать Мосцицкого, он кажется многообещающим премьер-министром." # We should choose Mościcki, he seems like a promising prime minister.
 poland.94.b: "Ба, разве это не очевидно? Военный опыт Смиглы обеспечит безопасность нашего народа!" # Bah, isn't it obvious? Śmigły's military experience will ensure the safety of out nation!
 poland.95.t: "Доля Украины" # The share of Ukraine
 poland.95.d: "Теперь, когда Украина побеждена, мы можем потребовать от нашего союзника Польши отдать нам наши основные территории." # Now that Ukraine has been defeated, we can demand our ally Poland, to give us our core territories.
 poland.96.t: "Беларусь хочет часть украинской территории" # Belarus wants some of the Ukrainian territory
 poland.96.d: "Белорусское правительство требует от нас вернуть им так называемую «основную территорию»." # The Belarusian government is demanding us to return their so called "core territory"
 poland.97.t: "Польша согласилась отдать нам требуемую территорию" # Poland has agreed to give us the demanded territory
 poland.97.d: ""
 poland.98.t: "Польша отклонила наши требования" # Poland has declined our demands
 poland.98.d: "Самодовольное правительство нашего «союзника» отказалось передать нам основные территории, которые мы требовали.\n Является ли это признаком предательства?" # The self-righteous government of our "ally" has refused to hand us the core territories we've demanded.\n Is this a sign of treachery?
 poland.99.t: "Белорусы вышли из нашей фракции" # The Belarusians have left our faction
 poland.99.d: "Белорусское правительство, возмущенное нашим отказом, решило разорвать с нами связи." # The Belarusian government, outraged by our refusal has decided to break their ties with us.
 poland.100.t: "Поляки требуют Гродно" # Poles are demanding Grodno
 poland.100.d: "Польское правительство требует от нас вернуть его территорию под предлогом того, что там находится много поляков." # The Polish government demands us to return its territory with the excuse being that it holds many Polish people.
 poland.101.t: "Беларусь отказалась" # Belarus has refused
 poland.101.d: "Наши требования были отклонены." # Our demands have been declined.

 poland.102.t: "[POL.GetName] требует коридора!" # [POL.GetName] Demands the Corridor!
 poland.102.d: "Сегодня сюда прибыли дипломаты, требующие, чтобы [GER.GetName] немедленно передал право собственности на коридор [POL.GetName], или даже будут задействованы военные действия." # Diplomats have arrived here today demanding [GER.GetName] immediately transfers ownership of the corridor to [POL.GetName], or, there shall even be military action involved.
 poland.102.a: "Они шутят, да?" # They are joking, right?
 poland.102.b: "Фюрер — самый щедрый человек в истории человечества!" # The Führer is the most generous man in human history!

 poland.103.t: "[POL.GetNameDefCap] запрашивает альянс" # [POL.GetNameDefCap] Requests an Alliance
 poland.103.d: "Сегодня сюда в [AUS.capital.GetCapitalVictoryPointName] прибыли дипломаты с просьбой присоединиться к [AUS.GetFactionName] из-за угрозы [GER.GetName]. Они заявили, что нам нужно объединиться, чтобы победить их." # Diplomats have arrived here today in [AUS.capital.GetCapitalVictoryPointName] requesting to join the [AUS.GetFactionName] due to the threat of [GER.GetName]. They stated that we need to be united, in order to be able to win against them.
 poland.103.a: "не вижу причины, почему бы и нет" # I don't see a reason why not
 poland.103.b: "нам лучше без них" # We are better of without them

 poland.104.t: "[AUS.GetName] Принимает!" # [AUS.GetName] Accepts!
 poland.104.d: "Наши дипломаты, отправленные в [AUS.GetName], вернулись с захватывающими новостями; нас приветствовали в [AUS.GetFactionName]!" # Our diplomats sent to [AUS.GetName] got back with exciting news; we have been welcomed into the [AUS.GetFactionName]!
 poland.104.a: "Это отличная новость!" # That's great news!

 poland.105.t: "[AUS.GetName] Отклоняет!" # [AUS.GetName] Rejects!
 poland.105.d: "Наши дипломаты, отправленные в [AUS.GetName], вернулись с неутешительными новостями; нас отклонили из [AUS.GetFactionName]." # Our diplomats sent to [AUS.GetName] got back with disappointing news; we have been rejected from the [AUS.GetFactionName].
 poland.105.a: "Это позор." # That's a shame.

##########
# Drowse #
##########
 polpeace.1.t: "Судьба Словакии" # The fate of Slovakia
 polpeace.1.d: "Польша вступила в войну с нашим северным соседом Словакией. Большинству было ясно, что после распада Чехословакии Словакия была не чем иным, как остатком государства, но теперь эти открытые военные действия между Польшей и Словакией показывают нам, что ни одна из великих держав не заинтересована в сохранении суверенитета Словакии. Это дает нам возможность воссоединить венгерское большинство, оказавшееся в ловушке на юге Словакии, и создать буфер против любых возможных польских вторжений в нашу собственную страну." # Poland has gone to war with our northern neighbor Slovakia. It has been clear to most that Slovakia was nothing more than a rump state after the collapse of Czechoslovakia but now these open hostilities between Poland and Slovakia show us that none of the Great powers are interested in maintaining Slovakian sovereignty. This gives us the opportunity to reunite the Hungarian majority trapped in southern Slovakia and create a buffer against any possible Polish incursions into our own nation.
 polpeace.2.t: "Венгрия вторгается на нашу южную границу!" # Hungary invades our southern border!
 polpeace.2.d: "На протяжении десятилетий Венгрия выступала за контроль над венгерским населением вблизи нашей южной границы, но, несмотря на подавляющее большинство международного консенсуса, подтверждающего нашу собственность на этот регион, Венгрия решила подорвать всю дипломатическую вежливость и пытается оккупировать этот регион. Война против Польши превратилась в тотальную войну за выживание нашей нации и народа. Готовы ли мы пойти на жертвы, необходимые для спасения нашей нации?" # For decades Hungary has argued for control over the Hungarian population near our southern border but despite the overwhelming amount of international consensus affirming our ownership of this region Hungary has decided to subvert all diplomatic civility and is attempting to occupy this region. The war against Poland has morphed into a total war for the survival of our nation and people. Are we ready to make the sacrifices needed to save our nation?
 polpeace.3.t: "Засудить у поляков мир?" # Sue the Polish for peace?
 polpeace.3.d: "Ясно, что мы проиграли войну с Польшей. Они оккупируют спорные регионы и продвигают наши силы глубже в нашу страну. Ради сохранения нашего суверенитета мы должны просить мира и сдать заявленные регионы Польше, прежде чем они потребуют от нас большего." # It is clear that we have lost the war against Poland. They occupy the disputed regions and are pushing our forces deeper into our nation. For the sake of our continued sovereignty we should sue for peace and surrender the claimed regions to Poland before they demand more from us.
 polpeace.4.t: "Украина просит мира" # Ukraine sues for peace
 polpeace.4.d: "Наши армии одерживали победу за победой над украинскими войсками. После сокрушительных поражений правительство [UKR.Capital.GetName] согласилось передать нам спорные регионы, чтобы положить конец конфликту. Мы потеряли много хороших людей, отвоевавших эту землю, и у нас нет причин истощать наши силы для дальнейшего конфликта. Мы уже достаточно выиграли." # Our armies have won victory after victory against Ukrainian forces. In the wake of their crushing defeats the government in [UKR.Capital.GetName] have agreed to surrender the disputed regions to us to end the conflict. We have lost many good men retaking this land and we have no reason to stretch our forces thin with further conflict. We have already won quite enough.
 polpeace.5.t: "Польша отказывается от мира" # Poland refuses peace
 polpeace.5.d: "Несмотря на наши щедрые уступки, Польша отказалась от нашего предложения мира. Эта война сейчас ведется ради выживания нашей нации и народа. Мы должны пожертвовать всем, чтобы победить Польшу." # Despite our generous concessions Poland has refused our offer of peace. This war is now for the very survival of our nation and people. We must sacrifice whatever it takes to defeat Poland.
 polpeace.6.t: "Засудить у поляков мир?" # Sue the Polish for peace?
 polpeace.6.d: "Ясно, что мы проиграли войну с Польшей. Они оккупируют спорные регионы и продвигают наши силы глубже в нашу страну. Ради сохранения нашего суверенитета мы должны просить мира и сдать заявленные регионы Польше, прежде чем они потребуют от нас большего." # It is clear that we have lost the war against Poland. They occupy the disputed regions and are pushing our forces deeper into our nation. For the sake of our continued sovereignty we should sue for peace and surrender the claimed regions to Poland before they demand more from us.
 polpeace.7.t: "Беларусь просит мира" # Belarus sues for peace
 polpeace.7.d: "Наши армии одерживали победу за победой над белорусскими войсками. После сокрушительных поражений правительство [BLR.Capital.GetName] согласилось передать нам спорные регионы, чтобы положить конец конфликту. Мы потеряли много хороших людей, отвоевавших эту землю, и у нас нет причин истощать наши силы для дальнейшего конфликта. Мы уже достаточно выиграли." # Our armies have won victory after victory against Belorussian forces. In the wake of their crushing defeats the government in [BLR.Capital.GetName] have agreed to surrender the disputed regions to us to end the conflict. We have lost many good men retaking this land and we have no reason to stretch our forces thin with further conflict. We have already won quite enough.
 polpeace.8.t: "Польша отказывается от мира" # Poland refuses peace
 polpeace.8.d: "Несмотря на наши щедрые уступки, Польша отказалась от нашего предложения мира. Эта война сейчас ведется ради выживания нашей нации и народа. Мы должны пожертвовать всем, чтобы победить Польшу." # Despite our generous concessions Poland has refused our offer of peace. This war is now for the very survival of our nation and people. We must sacrifice whatever it takes to defeat Poland.
 polpeace.9.t: "Засудить у поляков мир?" # Sue the Polish for peace?
 polpeace.9.d: "Ясно, что мы проиграли войну с Польшей. Они оккупируют спорные регионы и продвигают наши силы глубже в нашу страну. Ради сохранения нашего суверенитета мы должны просить мира и сдать территорию, на которой преобладает польское большинство, Польше, прежде чем они потребуют от нас большего." # It is clear that we have lost the war against Poland. They occupy the disputed regions and are pushing our forces deeper into our nation. For the sake of our continued sovereignty we should sue for peace and surrender our Polish majority territory to Poland before they demand more from us.
 polpeace.10.t: "Германия требует мира" # Germany sues for peace
 polpeace.10.d: "Наши армии одерживали победу за победой над немецкими войсками. После сокрушительных поражений правительство [GER.Capital.GetName] согласилось передать нам свои регионы с польским большинством, чтобы положить конец конфликту. Мы потеряли много хороших людей, отвоевавших эту землю, и у нас нет причин истощать наши силы для дальнейшего конфликта. Мы уже достаточно выиграли." # Our armies have won victory after victory against German forces. In the wake of their crushing defeats the government in [GER.Capital.GetName] have agreed to surrender their Polish majority regions to us to end the conflict. We have lost many good men retaking this land and we have no reason to stretch our forces thin with further conflict. We have already won quite enough.
 polpeace.11.t: "Польша отказывается от мира" # Poland refuses peace
