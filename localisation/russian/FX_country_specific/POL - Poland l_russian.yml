### History
 POL_FUHRERREICH_DESC: "Польша возродилась благодаря Версалю. После более чем столетия угнетения польский народ снова смог вкусить свободу. Но безопасна ли эта свобода? Враг есть со всех сторон, даже внутри страны. С реваншистскими украинцами на востоке, экспансионистскими немцами на западе и растущими внутренними проблемами страна либо выполнит роль «мерзости Версаля», либо найдет свой путь в новом, но не незнакомом окружении. Сможет ли Королевство Польское процветать и привести свой народ к славе? Или он будет снова уничтожен, а его наследие погибнет в пепле современной войны?" # Poland was reborn thanks to the Versailles. After more than a century of opression, the Polish people could once again taste freedom. But is this freedom safe? The enemy is on all sides, even inside the country. With revanchist Ukrainians to the east, expansionist Germans to the west and rising internal problems, the country will either fulfill the role of the "abomination of Versailles", or find its way through the new, yet not unfamiliar, surroundings. Will the Kingdom of Poland thrive and lead its people to glory? Or will it get destroyed once again, with its legacy perished in the ashes of modern warfare?

