 polpeace.14.t: "Судьба Румынии" # The fate of Romania
 polpeace.14.d: "Польша вступила в войну с нашим восточным соседом Румынией. Большинству было ясно, что Румыния была не более чем тираническим государством после незаконной аннексии венгерской территории, но теперь эти открытые военные действия между Польшей и Румынией показывают нам, что ни одна из великих держав не заинтересована в сохранении суверенитета Румынии. Это дает нам возможность воссоединить венгерское большинство, оказавшееся в Румынии, и создать буфер против любых возможных вторжений поляков в нашу страну." # Poland has gone to war with our eastern neighbor Romania. It has been clear to most that Romania was nothing more than a tyrannical state after the illegal annexation of Hungarian territory but now these open hostilities between Poland and Romania show us that none of the Great powers are interested in maintaining Romanian sovereignty. This gives us the opportunity to reunite the Hungarian majority trapped in Romania and create a buffer against any possible Polish incursions into our own nation.
 polpeace.15.t: "Венгрия вторгается в Трансильванию!" # Hungary invades Transylvania!
 polpeace.15.d: "На протяжении десятилетий Венгрия выступала за контроль над венгерским населением, проживающим в наших северо-западных регионах, но, несмотря на подавляющее большинство международного консенсуса, подтверждающего нашу собственность на эти регионы, Венгрия решила подорвать всю дипломатическую вежливость и пытается оккупировать эти территории. Война против Польши превратилась в тотальную войну за выживание нашей нации и народа. Готовы ли мы пойти на жертвы, необходимые для спасения нашей нации?" # For decades Hungary has argued for control over the Hungarian population living in our Northwestern regions but despite the overwhelming amount of international consensus affirming our ownership of these regions Hungary has decided to subvert all diplomatic civility and is attempting to occupy these territories. The war against Poland has morphed into a total war for the survival of our nation and people. Are we ready to make the sacrifices needed to save our nation?
 polpeace.16.t: "Засудить у венгров мир?" # Sue the Hungarians for peace?
