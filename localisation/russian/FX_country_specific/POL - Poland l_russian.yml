 POL_foreign_designs_idea_desc: ""
 POL_mass_production_idea: "Массовое производство" # Mass Production
 POL_mass_production_idea_desc: ""
 POL_agricultural_grants_idea: "Сельскохозяйственные гранты" # Agricultural Grants
 POL_agricultural_grants_idea_desc: ""
 POL_cemented_state: "Стабильное состояние государства" # Stable State of the State
 POL_cemented_state_desc: "Состояние государства стабильно и вряд ли резко изменится." # The state of the State is stable, and unlikely to abruptly change.
 POL_instable_democracy: "Нестабильная демократия" # Unstable Democracy
 POL_instable_democracy_desc: "Польша за все время своего существования никогда не была республикой. Со времени Версальской конференции мы действовали в рамках конституционной монархической системы, которая уже была понята населением. Теперь, когда короля больше нет, и выбор стал больше, некоторые люди просто сбиты с толку и незнакомы с новой ситуацией. Все это в совокупности с появлением новых радикальных партий может поставить под угрозу нашу молодую Польскую Республику." # Poland was never a republic in its entire existance. Since the Versailles conference we operated with a consitutional monarchy system, which was already understood by the population. Now, when the king is gone, and more choices are available, some people are simply confused and unfamiliar with the new situation. All of this cumulatively, with new, radical parties emerging, can endanger our young Polish Republic
 POL_just_ok_conditions_idea: "Улучшенные условия труда" # Improved Working Conditions
 POL_just_ok_conditions_idea_desc: "Наша политика гарантирует, что фабрики должны следовать надлежащим правилам и процедурам безопасности." # Our policies have ensured that factories must follow the proper safety guidelines and procedures.
 POL_better_working_conditions_idea: "Лучшие условия труда" # Better Working Conditions
 POL_better_working_conditions_idea_desc: "Улучшение условий труда для рабочих." # Better working conditions for the workers.
 POL_happy_farmers: "Счастливые фермеры" # Happy Farmers
 POL_happy_farmers_desc: "Бедным и мелким фермерам наконец-то была предоставлена ​​справедливая доля земли." # The poor and small farmers were finally given a fair share of land.
 POL_dispersed_farming: "Рассредоточенное земледелие" # Dispersed Farming
 POL_dispersed_farming_desc: "Мы сделали довольными мелких и бедных фермеров. Но наша экономика теперь какое-то время будет страдать из-за отсутствия крупных агрокомплексов." # We made the smaller, poorer farmers content. But our economy will now suffer for some time due to lack of big farming complexes.
 POL_powerless_minorities: "Бессильные меньшинства" # Powerless Minorities
 POL_powerless_minorities_desc: "Мы лишили меньшинства всех прав. Теперь, когда они совершенно бессильны, мы можем продолжить наши планы." # We stripped away all the rights the minorities posessed. Now, with them completely powerless, we can continue our plans.
 POL_ukrainian_police_revolt: "Бунт украинской полиции" # Ukrainian Police Revolt
 POL_ukrainian_police_revolt_desc: "Украинская полиция на востоке подняла восстание и захватила многочисленные правительственные здания. Мы быстро решим эту проблему, иначе нас может ожидать полномасштабное восстание." # The Ukrainian police in the east has revolted and seized numerous government buildings. We shall deal with the problem quickly, or we may face a full-scale rebellion.
 POL_economic_interventionism: "Экономический интервенционизм" # Economic Interventionism
 POL_economic_interventionism_desc: ""
 POL_unsure_minorities_idea: "Неуверенные меньшинства" # Unsure Minorities
 POL_unsure_minorities_idea_desc: "Меньшинства не уверены в позиции и политике правительства по отношению к ним." # The minorities aren't sure about the government's stance and policies towards them
 POL_benevolent_dictatorship_idea: "Доброжелательная диктатура" # Benevolent Dictatorship
 POL_benevolent_dictatorship_idea_desc: ""
 POL_total_equality: "Равенство превыше всего" # Equality Above All
 POL_total_equality_desc: "Мы обеспечим равенство для каждого гражданина нашей страны. Это должно быть нашим главным приоритетом." # We shall provide equality for every single citizen of our country. It should be our first priority.
 POL_valkist_resistance: "Валкистское сопротивление" # Valkist resistance
 POL_valkist_resistance_desc: "Выгнанные радикалы из партии «Национальная демократия» сейчас протестуют против «недемократического шага» правительства." # The kicked radicals from the National Democracy party are now protesting against the "undemocratic move" of the government. 
 POL_minorities_protests: "Меньшинства протестуют против правительства" # Minorities protest against the government
 POL_minorities_protests_desc: ""
 POL_border_defence: "Отряды пограничной обороны" # Border Defense Squads
 POL_border_defence_desc: "Без украинской полиции у нас не останется инструментов, позволяющих держать под контролем беспорядки и границу на востоке. Именно поэтому мы сформировали Отряды пограничной обороны." # Without the Ukrainian Police, we are left with no tool to keep the unrest and the border in the east in check. This is why we formed the Border Defense Squads.
 POL_poland_ab_idea: "Неразвитая Малороссия" # The Undeveloped Ruthenia
 POL_poland_ab_idea_desc: "Существует тревожное несоответствие между экономическим положением Красной Малороссии и остальной частью нашей страны." # There is a concerning disparity between Red Ruthenia's economic situation and the rest of our country.
 POL_better_defensive: "Повышенные защитные возможности" # Increased Defensive Capabilites
 POL_better_defensive_desc: ""
 POL_three_statements: "Три заявления Дмовского" # Three Dmowski's Statements
 POL_three_statements_desc: ""
 POL_partial_nationalisation_industry: "Частичная национализация отрасли" # Partial Nationalisation of the Industry
 POL_partial_nationalisation_industry_desc: ""
 POL_nationalisation_industry: "Национализация промышленности" # Nationalisation of the Industry
 POL_nationalisation_industry_desc: ""
 POL_no_enemies: "Никаких внутренних врагов" # No Internal Enemies
 POL_no_enemies_desc: "Мы очистили и посадили в тюрьму всех наших врагов! Теперь мы будем править вечно!" # We have purged and jailed all our enemies! Now we shall rule forever!
 POL_ready: "Готов к худшему" # Ready for the worst
 POL_ready_desc: "Мы всегда должны быть готовы к худшему. Лучшая защита – не всегда хорошее нападение." # We should always be ready for the worst. The best defense isn't always a good offense.
 POL_rogue_elements: "Мошеннические элементы в армии" # Rogue elements in the army
 POL_rogue_elements_desc: "После публичного провозглашения Трех заявлений Дмовского небольшая часть наших военных заявила о своей оппозиции новому правительству. Одним из их главных лидеров является генерал Владислав Сикорский, известный своей поддержкой демократических структур по всей стране. Нам следует положить конец его ребяческим играм." # After the public declaration of the Three Dmowski's Statements, a small part of our military declared their opposition to the new government. One of their head leaders is General Władysław Sikorski, who is known for supporting democratic structures around the country. We should put an end to his childish play.

