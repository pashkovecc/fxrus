 POLITICS_FRANCISZEK_RADZIWILL_DESC: "Король Францишек I Радзивилл (полное имя: Януш Францишек Ксаверий Юзеф Лабре Бронислав Мария Радзивилл) (родился в Берлине 3 сентября 1880 года) — польский дворянин и король Царства Польского.\n\n Во время Великой войны он оказался на русской стороне линии фронта, в своем родовом имении в Олыке на Волыни. Там он организовал помощь беженцам из Конгресса Польши. В 1918 году, как сторонник Регентского совета, он вернулся в Польшу и стал членом правительства Яна Канты Стечковского в качестве директора Государственного департамента. Он отвечал за внешнюю политику Польши и развитие польских дипломатических связей по всему миру. Летом 1918 года он провел дипломатические переговоры с немецким и австрийским императорами Вильгельмом II и Карлом I о будущем Королевства Польского. В ходе встречи рассматривались различные кандидатуры на корону Царства Польского. Во время встречи он также отказался быть кандидатом на корону Литовского королевства, так как приходился двоюродным братом германскому императору. В 1919 году он пытался войти в состав польской дипломатической миссии на Версальской конференции, но потерпел неудачу. Тем не менее, к его удивлению, на Версальской конференции Регентский совет был провозглашен единственным законным правительством Польши. Затем, 20 ноября, он был выбран Советом новым королем. Было очевидно, что это решение было поддержано державами Антанты из-за королевских связей Радзивилла с различными королевскими семьями Европы. Месяц спустя Януш Радзивилл был официально коронован, и он выбрал второе имя Францишек в качестве своего королевского имени." # King Franciszek I Radziwiłł (full name: Janusz Franciszek Ksawery Józef Labre Bronisław Maria Radziwiłł) (Born in Berlin on September 3rd, 1880) is a polish nobleman and a king of the Kingdom of Poland.\n\n During the Great War he found himself on the Russian side of the frontline, in his family estate in Ołyka in Volhynia. There, he organised help for the refugees from the Congress Poland. In 1918, as the supporter of the Regency Council, he came back to Poland and became a member of the Jan Kanty Steczkowski's government as the Director of the State Department. He was responsible for the Polish foreign policy and developing the Polish diplomatic ties around the world.In the summer of 1918 he held diplomatic talks with the German and Austrian emperors, Wilhelm II and Carl I, about the future of the Kingdom of Poland. During the meeting they considered various candidacies for the crown of the Kingdom of Poland. During the meeting he also refused to be a candidate for the crown of the Kingdom of Lithuania, as he was a cousin of the German emperor. In 1919 he tried to become a part of the Polish diplomatic mission to the Conference of Versailles, but failed. Nonetheless, to his surprise, on the Versailles Conference, the Regency Council was proclaimed the only legal government of Poland. Then, on November 20th, he was chosen by the Council to become the new King. It was obvious that the decision was pushed by the Entente Powers, due to Radziwiłł's royal ties to various royal families of europe. One month later, Janusz Radziwiłł was officialy coronated and he chose the second name Franciszek as his royal name. 
 POL_Edward_Rydz_Smigly_desc: "Известный как наследник Юзефа Пилсудского, Рыдз-Смиглы получил свою известность после своих деяний в польско-украинской войне, остановив наступление Украины методами, аналогичными тем, которые использовались на западном фронте во время Великой войны. Разрабатывая линию обороны, он позволил своему начальнику Пилсудскому сосредоточиться на демонтаже окруженных украинских войск, оборонявшихся на отдельных участках.\n Этот опыт и другие факторы привели к тому, что он выбрал хорошо окопанную оборону в качестве тактики победы в конфликте." # Known as Józef Piłsudski's heir, Rydz-Śmigły obtained his fame after his deeds in the Polish-Ukrainian War,halting the Ukrainian advances through methods similiar in manner to those used on the western front during the Great War. Developing a line of defences, he allowed his superior, Piłsudski, to focus on dismantling the encircled Ukrainian troops defending in local areas.\n This experience and other factors led to him choosing well dug-in defence as the conflict-winning tactic.

