 POL_MOW_industrial: "Промышленный план MOW" # The MOW's industrial plan
 POL_MOW_industrial_desc: "Промышленный план Министерства труда, который включает строительство дополнительных гражданских заводов и снижение налогов на потребительские товары." # The MOW's industrial plan, which includes building extra civilian factories and lowering taxes on consumer goods.
 POL_PSCD_industrial: "Промышленный план PSCD" # The PSCD's industrial plan
 POL_PSCD_industrial_desc: "Промышленный план PSCD субсидирует военные заводы." # The PSCD's industrial plan subsidises military factories.
 POL_MOW_tax: "Налоговый план MOW" # The MOW's tax plan
 POL_MOW_tax_desc: "Прогрессивная и справедливая налоговая система, которая гарантирует, что каждый поляк платит свою долю расходов нашей страны." # A progressive and fair tax system which makes sure that every Pole pays his share of our nation's cost.
 POL_PSCD_tax: "Налоговый план PSCD" # The PSCD's tax plan
 POL_PSCD_tax_desc: "Единый налог, который легко администрировать и который равен для всех поляков." # A flat tax that is easy to administrate and equal for all Poles.
 POL_increased_free_speech: "Свобода слова для всей Польши." # Free speech for all of Poland
 POL_increased_free_speech_desc: "Предоставьте всем в Польше право свободы слова, в том числе и в Литве." # Allow everyone in Poland the right of free speech, including in Lithuania.
 POL_less_free_speech: "Свобода слова только для поляков" # Free speech for Poles only
 POL_less_free_speech_desc: "Только дайте право свободы слова полякам." # Only give the right of free speech to the Poles.
 POL_equality_for_all: "Равенство для всех" # Equality for All
 POL_equality_for_all_desc: "Все жители королевства Польского пользуются одинаковыми равными правами." # All inhabitants of the kingdom of Poland excercise the same equal rights.
 POL_equality_for_poles: "Равенство только для поляков" # Equality for Poles only
 POL_equality_for_poles_desc: "Только поляки в Королевстве Польском равны, граждане Прибалтики имеют меньше прав." # Only the Poles in the kingdom of Poland are equal, the Batlic citizens have less rights.
 POL_MOW_army: "Армейский план MOW" # The MOW's army plan
 POL_MOW_army_desc: "Этот план направлен на увеличение призыва в армию в обмен на меньшее количество исследователей." # This plan focuses on increased conscription in exchange for less researchers.
 POL_PSCD_army: "Армейский план PSCD" # The PSCD's Army plan
 POL_PSCD_army_desc: "Этот план направлен на найм большего количества армейских исследователей для более быстрого исследования лучшего оборудования." # This plan focuses on hiring more army researchers to research better equipment more quickly.
 POL_MOW_airforce: "План ВВС MOW" # The MOW's airforce plan
 POL_MOW_airforce_desc: "Этот план повышает боеспособность наших бойцов." # This plan improves the ability of our fighters to fight.
 POL_PSCD_airforce: "План ВВС PSCD" # The PSCD's airforce plan
 POL_PSCD_airforce_desc: "Этот план улучшает боеспособность нашего бомбардировщика." # This plan improves our bomber's ability to fight.
 POL_constitutional_monarchy: "Стать конституционной монархией" # Becoming a Constitutional Monarchy
 POL_constitutional_monarchy_desc: "Королевство Польское медленно переходит в конституционную монархию." # The kingdom of Poland is slowly transitioning into a Constitutional Monarchy
 POL_absolute_monarchy: "Стать абсолютной монархией" # Becoming an Absolute Monarchy
 POL_absolute_monarchy_desc: "Царство Польское медленно переходит в абсолютную монархию." # The kingdom of Poland is slowly transitioning into an Absolute Monarchy
 POL_king_men: "Все люди короля" # All the King's men
 POL_king_men_desc: ""
 POL_ojczyzna_guard_idea: "Национальная гвардия" # The Ojczyzna Guard
 POL_ojczyzna_guard_idea_desc: ""
 POL_GER_occupation: "Непопулярный режим" # Unpopular Regime

 POL_lithuanian_unrest: "Литовские беспорядки" # Lithuanian Unrest
 POL_lithuanian_unrest_desc: "После Великой войны все страны Балтии боролись за восстановление своей независимости, а Литва пала в результате польского наступления 1921 года во время польско-литовской войны. Не имея собственного выхода к морю, Литва является для Польши единственным способом получить доступ к мировой торговле и безопасно импортировать и экспортировать товары. Однако литовцы об этом знают и пытаются воспользоваться этой ситуацией." # After the Great War, the Baltics have all been fighting to regain their independence, with Lithuania falling in the Polish 1921 offensive during the Polish-Lithuanian War. With no own sea access, Lithuania is the only way for Poland to access world trade and safely import and export goods. However, Lithuanians are aware of this, and are trying to take an advantage of this situation.

 POL_lithuanian_unrest_stagnant: "Литовские волнения застопорились" # Lithuanian Unrest Stagnant
 POL_lithuanian_unrest_stagnant_desc: "Беспорядки в Литве по-прежнему остаются проблемой в нашей сфере влияния." # The unrest in Lithuania is still an issue in our sphere of influence.

 POL_lithuanian_unrest_less_bad: "Литовская поддержка" # Lithuanian Support
 POL_lithuanian_unrest_less_bad_desc: "С волнениями в Литве в основном удалось справиться, и наше правительство завоевало доверие литовского населения!" # The unrest in Lithuania has been mostly taken care of and our government has gained trust among the Lithuanian population!

 POL_ukrainian_unrest: "Беспорядки в Пограничье" # Unrest in the Borderlands
 POL_ukrainian_unrest_desc: "Люди на наших русинских территориях наносят ущерб нашему народу." # People in our Ruthenian territories are causing damage to our nation.

 POL_ukrainians_happy: "Права малых национальностей" # Rights for Minor Ethnicities
 POL_ukrainians_happy_desc: "Жители наших приграничья пользуются большей свободой. С момента своего создания они стали более продуктивными." # The people of our borderlands are enjoying more freedoms. Since their institution, they've become more productive.

 POL_direct_rule: "Прямое правление из Варшавы" # Direct Rule from Warsaw
 POL_direct_rule_desc: "Прямое управление из Варшавы." # Direct rule from warsaw.
 POL_local_leadership: "Местное лидерство" # Local Leadership
 POL_local_leadership_desc: "Местное руководство гарантирует, что польский народ станет более сплоченным и более готовым умереть за свою страну." # Local Leadership ensures that the Polish people are more united and more willing to die for their country.
 POL_protect_consumer: "Защитите потребителя" # Protect the Consumer
 POL_protect_consumer_desc: "Потребители должны быть нашей самой большой заботой в этом кризисе." # The consumers should be our biggest concern in this crisis.
 POL_military_complex: "Польский военно-промышленный комплекс" # The Polish Military Industrial Complex
 POL_military_complex_desc: ""
 POL_krakow_arms: "Краковская оружейная промышленность" # The Krakow Arms Industry
 POL_krakow_arms_desc: ""
 POL_black_wednesday: "Крах Лондонской фондовой биржи" # London Stock Market Crash
 POL_black_wednesday_desc: "LSMC ударил по Польше и разрушил нашу экономику. Нам нужно действовать быстро, иначе мы можем столкнуться с новыми проблемами." # The LSMC has hit Poland and destroyed our economy. We have to act quickly, or we may face more problems.
 POL_black_wednesday_meh: "Крах Лондонской фондовой биржи" # London Stock Market Crash
 POL_black_wednesday_meh_desc: "LSMC ударил по Польше и разрушил нашу экономику. Нам нужно действовать быстро, иначе мы можем столкнуться с новыми проблемами." # The LSMC has hit Poland and destroyed our economy. We have to act quickly, or we may face more problems.
