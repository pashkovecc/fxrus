### Parties (from KR)
 POR_vanguardist_party: "PCP (тарифы)" # PCP (Rates)
 POR_vanguardist_party_long: "Partido Comunista Português (Rates)\n§gКоммунистическая партия Португалии§!\n§LПосле своего изгнания в 1926 году из-за отказа сотрудничать с ВКТ, в которой доминировали коммунисты, бывший генеральный секретарь Хосе Карлос Ратес создал свою собственную отколовшуюся организацию, которая до сих пор твердо выступает против анархистского сотрудничества. Все еще сохраняя влияние на старую группу коммунистов, Рейтс во время своего пребывания во Франции стал вдохновляться ревизионистской, националистической авангардной школой мысли. Если бы он вернул себе контроль над партией, Рейтс, скорее всего, отомстил бы восходящим левым, которые его свергли, и внедрил бы технократическую, социалистическую систему, чтобы защитить революцию изнутри и снаружи.§!" # Partido Comunista Português (Rates)\n§gPortuguese Communist Party§!\n§LFollowing his expulsion in 1926, following a refusal to collaborate with the communist-dominated CGT, former General Secretary José Carlos Rates has created his own splinter organisation still standing firm on an opposition of anarchist collaboration. Still holding influence over an older contingent of Communists, Rates has grown inspired by the revisionist, nationalistic vanguardist school of thought during his time in France. If he were to take back control of the Party, Rates would likely take his revenge against the ascendant left-wing that ousted him and implement a technocratic, socialist system to safeguard the revolution from within and without.§!
 POR_collectivist_party: "CUFU (ВКТ/ФАП)" # CUFU (CGT/FAP)
 POR_collectivist_party_long: "Комитет единства Единого фронта\n§gКомитет единства Объединенного фронта§!\n§LКомитет объединенного фронта, созданный в результате союза коммунистов и профсоюзов Хосе де Соузы, в настоящее время существует как группа социалистов, заключенных в тюрьму и сосланных в Париж после неудавшейся всеобщей забастовки 1930 года. Всеобщая конфедерация труда и Португальская анархическая федерация — две взаимосвязанные фракции, составляющие коммунистический оплот Единого фронта. ВКТ номинально возглавляет находящийся в тюрьме основатель Мануэль Жоаким де Соуза, которого в Париже представляет Жозе да Силва Сантос Арранья. ВКТ считается самой воинственной революционной группой в Португалии и впоследствии подверглась наибольшим репрессиям со стороны Лиссабона. Португальская анархическая федерация является крылом Иберийской анархической федерации, образующей еще один политический фронт ВКТ. Хотя де Соуза является сторонником Паниберийского единства, многие внутри ВКТ в лучшем случае относятся к этой позиции скептически, а в худшем — открыто враждебно.§!" # Comité de Unidade de Frente Única\n§gUnited Front Unity Committee§!\n§LFormed with José de Sousa's alliance between the Communists and Trade Unions, the United Front Committee of Unions currently exists as a grouping of socialists, imprisoned and exiled in Paris following the failed 1930 General Strike. The General Confederation of Labour and the Portuguse Anarchist Federation are two interlinked factions, making up the communist bulwark of the United Front. The CGT is nominally led by founder Manuel Joaquim de Sousa from prison, who is represented by José da Silva Santos Arranha in Paris. The CGT is considered to be the most militant revolutionary group within Portugal, and has subsequently faced the most repression from Lisbon. The Portuguse Anarchist Federation is a wing of the Iberian Anarchist Federation, forming another political front for the CGT. Though de Sousa is a supporter of Pan-Iberian Unity, many within the CGT are at best sceptical, or at worst outwardly hostile to this position.§!
 POR_libertarian_socialist_party: "CUFU (PCP/ФАО)" # CUFU (PCP/FAO)
 POR_libertarian_socialist_party_long: "Комитет единства Единого фронта\n§gКомитет единства Объединенного фронта§!\n§LКомитет объединенного фронта, созданный в результате союза коммунистов и профсоюзов Хосе де Соузы, в настоящее время существует как группа социалистов, заключенных в тюрьму и сосланных в Париж после неудавшейся всеобщей забастовки 1930 года. Коммунистическая партия Португалии переживает трудности со времен Реставрации. Под руководством Бенту Антониу Гонсалвеса они проводили политику сотрудничества с анархистами и коммунистами, отходя от враждебного отношения к ним под руководством Хосе Карлоса Ратеса. Следуя линии прагматизма в отношении революции, коммунисты надеются, что стратегия Объединенного фронта со временем принесет плоды. Federação Socialista das Associações de Trabalhadores (Социалистическая федерация ассоциаций рабочих) представляет умеренных социалистических профсоюзных активистов Объединенного фронта, которые сохраняют присутствие в Португалии из-за отсутствия предпринятых ими радикальных действий. Их небольшой размер отвел им промежуточную роль между CGT и PCP.§!" # Comité de Unidade de Frente Única\n§gUnited Front Unity Committee§!\n§LFormed with José de Sousa's alliance between the Communists and Trade Unions, the United Front Committee of Unions currently exists as a grouping of socialists, imprisoned and exiled in Paris following the failed 1930 General Strike. The Portuguse Communist Party has struggled since the Restoration. Under the leadership of Bento António Gonçalves, they've operated on a policy of cooperation with the Anarchists and communists, a departure from the hostitly towards them under José Carlos Rates. By following a line of pragmatism towards the revolution, the Communists hope that the United Front strategy will bare fruit in time. The Federação Socialista das Associações de Trabalhadores (Socialist Federation of Workers' Associations) represents the moderate socialist trade unionists under the United Front, who maintain a presense within Portugal due to the lack of radical actions undertaken by them. Their small size has relegated them to an intermediary role between the CGT and the PCP.§!
 POR_social_democrat_party: "ДО" # PRED
 POR_social_democrat_party_long: "Partido Republicano da Esquerda Democrática\n§gРеспубликанская партия демократических левых сил§!\n§LДемократическая левая республиканская партия — марксистская, демократически-социалистическая партия, образованная в 1924 году после отделения от Демократической партии после идеологического спора с Афонсу Коштой. Лидер Жозе Домингес душ Сантуш построил PRED вокруг «Модерасао», попытки найти третий путь между революционным синдикализмом, поддерживаемым Третьим Интернационалом, и прогрессивным либерализмом демократов. Провал всеобщей забастовки 1930 года привел к тому, что PRED набрала небольшую популярность среди более радикально настроенных изгнанников, хотя CUFU по-прежнему относится к ним с сильным подозрением.§!" # Partido Republicano da Esquerda Democrática\n§gRepublican Party of the Democratic Left§!\n§LThe Democratic Leftwing Republican Party is a marxist, democratic-socialist party that formed in 1924, having split from Democratic Party following an ideological dispute with Afonso Costa. Leader José Domingues dos Santos has built the PRED around 'Moderação', an attempt to find a third way between the revolutionary syndicalism espoused by the Third Internationale, and the progressive liberalism of the Democrats. The failure of the 1930 General Strike has seen the PRED gain a small amount of steam among more radical minded exiles, though the CUFU still regards them with intense suspicion.§!
 POR_social_liberal_party: "ПРП" # PRP
 POR_social_liberal_party_long: "Португальская республиканская партия\n§gПортугальская республиканская партия§!\n§LДемократическая партия, официально называемая Португальской республиканской партией, — это левоцентристская прогрессивная партия, которая является самопровозглашенной преемницей первоначальной Республиканской партии, которая возглавила республиканскую революцию 1910 года. Сформированные в феврале 1912 года Афонсу Коштой после раскола старой Республиканской партии, демократы были политически доминирующим движением (с несколько авторитарными тенденциями) на протяжении большей части существования республики, пока Сидонио Паис не укрепил свою власть в 1917 году, после чего они выступили в качестве основной оппозиции консервативной военной диктатуре. После восстановления монархии Коста увёл своих последователей в изгнание, и с тех пор партия может быть связана почти с каждой попыткой повстанцев свергнуть монархию. После отставки Косты в 1931 году демократы оказались втянутыми в фракционную борьбу между популистом-подполковником Либерато Пинто, который хочет реформировать большую Демократическую партию прошлого, и бывшим заместителем Косты Антониу Марией да Силва, политиком, ориентированным на детали и сосредоточенным на консолидации нынешней идеологии партии.§!" # Partido Republicano Português\n§gPortuguese Republican Party§!\n§LThe Democratic Party, offically called the Portuguese Republican Party, is a centre-left, progressive party which is the self-proclaimed successor to the original Republican Party which led the 1910 republican revolution. Formed in Feburary 1912 by Afonso Costa after the old Republican Party splintered, the Democrats were the politically dominant movement (with somewhat authoritarian tendancies) for much of the Republic's existence, until Sidonio Pais cemented his power in 1917 after which they acted as the main opposition to the conservative military dictatorship. After the restoration of the monarchy, Costa led his followers into exile and the party can be tied to almost every insurrectionist attempt to overthrow the monarchy since. Following Costa's retirement in 1931, the Democrats have been locked in a factional struggle between the populist lieutenant-colonel Liberato Pinto, who wants to reform the big-tent Democratic Party of old, and Costa's former deputy António Maria da Silva, a detail-orentated politician focused on consolidating the parties current ideology.§!
 POR_market_liberal_party: "УРН (Либералы)" # URN (Liberais)
 POR_market_liberal_party_long: "União Republicana Nacionalista\n§gНационалистический республиканский союз§!\n§LНационалистический республиканский союз, в просторечии называемый националистами, — либерально-консервативная партия, образованная в изгнании в феврале 1923 года в результате слияния Республиканской либеральной партии, Партии восстановления и остатков Национальной республиканской партии. Националисты были созданы, чтобы обеспечить более сильную базу для противостояния восстановленной монархии, объединив правых республиканцев под одним знаменем. Их взгляды неоднозначны, они представляют широкий спектр интересов и идеалов, при этом их основной объединяющей идеологией является «анти-демократическая» идеология, то есть сильная оппозиция Демократической партии. Националистами руководит не один конкретный человек, а коллективное руководство с участием различных политиков правоцентристского и правого толка. «Либералы» — это классически-либеральная фракция, состоящая преимущественно из бывших членов Республиканской либеральной партии и Партии восстановления, возглавляемая главным образом харизматичным Антонио Гранхо. Либералы превыше всего отстаивают экономическую либерализацию, поддерживая торжественное открытие торговли с более широким миром. Харизматическое влияние Гранджо обеспечило либералам, как правило, доминирующую фракцию.§!" # União Republicana Nacionalista\n§gNationalist Republican Union§!\n§LThe Nationalist Republican Union, colloquially referred to as the Nationalists, is a liberal-conservative party, formed in exile in February 1923, as a merger of the Republican Liberal Party, the Reconstitution Party and the remnants of the National Republican Party. The Nationalists were created to provide a stronger base to stand against the restored Monarchy, uniting the right-wing republicans under one banner. Their views are mixed, representing a wide range of interests and ideals, with their main unifying ideology being one of 'Anti-Democrático', or strong opposition to the Democratic Party. The Nationalists are not led by one particular man, but rather have collective leadership with a variety center-right & right-wing politicians. The 'Liberals' are a classical-liberal faction made up predominantly of former Republican Liberal and Reconstitution Party members, cheifly led by the charismatic António Granjo. The Liberals champion economic liberalisation above anything else, supporting a grand opening of trade to the wider world. Granjo's charismatic influence has ensured the Liberals are generally the dominant faction.§!
 POR_social_conservative_party: "УРН (Юниониста)" # URN (Unionista)
 POR_social_conservative_party_long: "União Republicana Nacionalista\n§gНационалистический республиканский союз§!\n§LНационалистический республиканский союз, в просторечии называемый националистами, — либерально-консервативная партия, образованная в изгнании в феврале 1923 года в результате слияния Республиканской либеральной партии, Партии восстановления и остатков Национальной республиканской партии. Националисты были созданы, чтобы обеспечить более сильную базу для противостояния восстановленной монархии, объединив правых республиканцев под одним знаменем. Их взгляды неоднозначны, они представляют широкий спектр интересов и идеалов, при этом их основной объединяющей идеологией является «анти-демократическая» идеология, то есть сильная оппозиция Демократической партии. Националистами руководит не один конкретный человек, а коллективное руководство с участием различных политиков правоцентристского и правого толка. «Юнионисты» — социально-консервативная фракция, возглавляемая Франсиско да Кунья Леалем и состоящая преимущественно из бывших «сидонистов» и католических республиканцев. Юнионисты поддерживают консервативные в культурном отношении предприятия, будучи наиболее клерикально дружественными из всех республиканских групп. Под влиянием Кунья Леала они также поддержали широкий обзор колониальных предприятий Португалии.§!" # União Republicana Nacionalista\n§gNationalist Republican Union§!\n§LThe Nationalist Republican Union, colloquially referred to as the Nationalists, is a liberal-conservative party, formed in exile in February 1923, as a merger of the Republican Liberal Party, the Reconstitution Party and the remnants of the National Republican Party. The Nationalists were created to provide a stronger base to stand against the restored Monarchy, uniting the right-wing republicans under one banner. Their views are mixed, representing a wide range of interests and ideals, with their main unifying ideology being one of 'Anti-Democrático', or strong opposition to the Democratic Party. The Nationalists are not led by one particular man, but rather have collective leadership with a variety center-right & right-wing politicians. The 'Unionists' are a socially-conservative faction, led by Francisco da Cunha Leal and made up predominantly of former 'Sidonistas' and Catholic republicans. The Unionists support culturally conservative ventures, being the most clerically friendly of any Republican group. Under Cunha Leal's influence, they've also support a broad review of Portugal's colonial ventures.§!
 POR_authoritarian_democrat_party: "ПКК" # PCC
 POR_authoritarian_democrat_party_long: "Partido do Centro Católico\n§gКатолическая центристская партия§!\n§LКатолическая центристская партия образована в январе 1915 года с первоначальной целью представлять интересы католиков в антиклерикальной республике. Этот антиклерикализм, поначалу не являвшийся явно монархическим, естественным образом привлек католиков к оппозиции. Когда республика начала разваливаться, Католический центр отказался от своей поддержки, а некоторые ключевые члены сами обратились к воинственности роялистов. После Реставрации Католический центр стал крупнейшей официальной политической партией в Королевском конгрессе. В условиях катастрофического 1925 года «центристы» примирились с интегралистами, следуя более прагматичной позиции Иполито Рапозо в отношении политического сотрудничества. Поддержав переворот 1926 года, католики теперь доминируют в Палате пэров и стали поддерживать полуконституционную монархию немецкого типа. После фракционного спора в 1920 году партию возглавил ярый монархист и сторонник интегралистов Хосе Фернандо де Соуза, хотя его преклонный возраст привел к тому, что более молодое собрание членов вокруг профессора Антониу Салазара приобрело известность.§!" # Partido do Centro Católico\n§gCatholic Centre Party§!\n§LThe Catholic Centre Party formed in January 1915, with the intial goal of representing Catholic interests in the anti-clerical Republic. Not explicitly monarchist at first, that anti-clericalism naturally drew the Catholics into opposition. When the Republic began to collapse, the Catholic Centre withdrew their support, with some key members turning to royalist militancy themselves. Following the Restoration, the Catholic Centre was the largest formal political party in the Royal Congress. Amid the disastrous year of 1925, the 'Centrists' reconciled with the Integralists following Hipólito Raposo's more pragmatic stance on political cooperation. Backing the coup in 1926, the Catholics now dominate the Chamber of Peers and have come to support a German-style semi-constitutional monarchy. Since a factional dispute in 1920, ardent monarchist and integralist sympathiser José Fernando de Sousa has led the party, though his advancing age has led a younger caucus of members around Professor António Salazar to gain prominence.§!
 POR_paternal_autocrat_party: "СКК" # CCM
 POR_paternal_autocrat_party_long: "Conselho de Causa Monárquica\n§gСовет Монархического Дела§!\n§LСовет Монархического Дела, объединяющий многих роялистов, представляет собой шаткую коалиционную партию «Монархического Дела», которая управляла Португалией во время правления Энрике де Пайвы Кусейру в 1921–1926 годах и была первоначально сформирована в 1911 году для восстановления Монархия. Когда тогдашняя политическая партия была запрещена после переворота 17 марта, члены «Дела» были политически изолированы от короля Мануэля II и были вынуждены быть простыми зрителями «Органического эксперимента». Однако с коронацией Дуарте II у роялистской коалиции появится новая возможность вновь заявить о себе в Португалии. Хотя официальной целью Монархического Дела является постоянная защита и укрепление монархических институтов, их тайной целью является «Национальное восстановление», чтобы расширить возможности Монарха и сформировать вокруг него консервативную персоналистическую диктатуру, одновременно отсекая различные эксцессы ультрарадикального интегралистского режима. Основными лидерами Совета являются маршал Косейру и Домингуш Фесас Виталь, наместник короля.§!" # Conselho de Causa Monárquica\n§gCouncil of the Monarchist Cause§!\n§LAn umbrella of many royalists, the Council of the Monarchist Cause represents the shaky "Monarchist Cause" coalition-party that ruled Portugal during the government of Henrique de Paiva Couceiro of 1921-1926, and was initally formed in 1911 to pursue a restoration of the Monarchy. When the then-political party was banned following the March 17th Coup, the members of the Cause were politically isolated from King Manuel II and forced to be mere spectators of the Organic Experiment. With the coronation of Duarte II however, the royalist coalition would have a new opportunity to reassert themselves within Portugal. Though the Monarchist Cause's official purpose is the continued protection and strengthening of monarchist institutions, their secretive aim is a 'National Restoration' to empower the Monarch and form a conservative personalist dictatorship around them, whilst culling the various excesses of the ultra-radical Integralist regime. The Council's principle leaders are Marshal Couceiro and Domingos Fezas Vital, Lieutenant of the King.§!
 POR_national_populist_party: "Иллинойс" # IL
 POR_national_populist_party_long: "Integralismo Lusitano\n§gЛузитанский интегралист§!\n§LЛузитанское интегралистское движение зародилось в Университете Коимбры в 1911 году, хотя группа не была основана до 1914 года. Группа быстро стала известна как контркультурное движение против Республики, поддерживающее крайне реакционный, традиционалистский и элитарный взгляд на политику. Крайне антилиберальные и ультрамонархистские, интегралисты боролись против демократов и республиканской системы, хотя политики-интегралисты сотрудничали с диктатурой сидонистов «Новой Республики». Когда началась реставрация, интегралисты были одной из самых влиятельных фракций контрреволюционеров. Однако после реставрации деятельность «Интегралиста» застопорилась; Косейро считал их опасными, и они были отодвинуты на второй план в политическом отношении. Внезапная смерть Антонио Сардинья грозила распадом организации, но Иполито Рапозо рационализировал эстерическую, часто противоречивую идеологию группы и примирился с другими политическими группами, главным образом с Католическим центром. После катастрофического 1925 года интегралисты смогли провести практически бескровный переворот против Causa Monárquica и быстро консолидировать власть. С тех пор Рапозо приостановил более радикальные амбиции «Интегралиста», что привело к недовольству внутри Центральной хунты.§!" # Integralismo Lusitano\n§gLusitanian Integralism§!\n§LThe Lusitanian Integralist movement was born at the University of Coimbra in 1911, though the group wasnt founded until 1914. The group quickly became known as a counter-culture movement to the Republic, espousing an highly reactionary, traditionalist and elitist outlook on politics. Extremely anti-liberal and ultra-monarchist, the Integralists fought against the Democrats and the Republican system, though Integralist politicians cooperated with the Sidonist 'New Republic' dictatorship. As the restoration began, the Integralists were one of the most influential factions of the counter-revolutionaries. However, after the restoration, the Integralist's stagnated; viewed as dangerous by Couceiro, they were politically sidelined. Antonio Sardinha's sudden death threatened to collapse the organisation, but Hipólito Raposo rationalised the groups erosteric, often contradictory ideology and reconciled with other political groups, chiefly the Catholic Centre. After the disastrious year of 1925, the Integralists were able to lead a largely bloodless coup against the Causa Monárquica and swiftly consolidate power. Ever since, Raposo has put the Integralist's more radical ambitions on hold, which has led to discontent within the Central Junta.§!
 POR_valkist_party: "Иллинойс" # IL
 POR_valkist_party_long: "Лузитано интегрализм" # Integralismo Lusitano

#TOOLTIPS
 POR_first_warning_tt: "У вас есть еще примерно 6 месяцев, чтобы закончить войну. В противном случае на материке будет еще больше кровопролития." # You have aproximately 6 more months to finish the war. Otherwise there will be more bloodshed on the mainland.

#THREATS
 POR_renewed_civil_war_threat: "Гражданская война в Португалии возобновилась" # Portugese Civil War renewed


#EVENTS
 portugal.1.d: "могу ли я получить ууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууууудера" # can I get a uuuuuuhhhhh colonies please
 portugal.2.d: "С тех пор, как мы выгнали республиканцев с материка в 1930 году, наши планы по возвращению колоний были сорваны из-за наличия более слабого флота, чем у республиканцев. Конечно, вернуть колонии будет непросто. Республиканцы хорошо понимают, что колонии жизненно важны для стабильности нашего режима, и они приняли меры, чтобы закопаться, пока на нашем материке не поднимется новое восстание из-за растущей нестабильности и стыда, вызванных тем, что мы не владеем указанными колониями. \n\nНе говоря уже о том, что большая часть военно-морского флота перешла на сторону республиканцев. \n\nНеважно, сегодня новый день для Португалии. Наш большой военно-морской проект – строительство «Retaliação» – наконец-то завершен! Без сомнения, этот линкор стоил дорого. Однако это гарантирует, что мы сможем вывести республиканский флот из строя и вернуть себе колонии." # Ever since we kicked the Republicans out of the mainland in 1930, our plans on retaking the colonies have been thwarted by possessing a weaker navy than that of the Republicans. Of course, retaking the colonies will be no easy feat. The Republicans are well aware that the colonies are vital to the stability of our regime, and they've taken measures to dig in until another revolt rises up in our mainland due to mounting instability and shame caused by us not owning said colonies. \n\nNot to mention, a large portion of the navy defected to the Republicans. \n\nNo matter, today is a new day for Portugal. Our large naval project, the construction of the Retaliação, has finally been completed! This Battleship was costly, no doubt. However it will ensure that we'll be able to put the Republican navy out of action and retake the colonies.
 portugal.3.d: "Колонии жизненно важны для нас. Если мы отложим завоевание на другой раз, на материке, несомненно, произойдет восстание республиканцев. Сегодня Португалия вернет себе право первородства. Мы вернем свои колонии, и какой-то республиканский сброд не встанет между нами!" # The colonies are vital to us. If we put off the reconquest until another time, there will undoubtedly be a Republican revolt on the mainland. Today, Portugal will retake her birthright. We will reclaim our colonies, and some Republican rabble will not stand inbetween us!
 portugal.4.d: "Сообщения о различных полицейских рейдах в Лиссабоне сообщили нам о постоянно растущем числе республиканских элементов в нашем обществе. Мы не сомневаемся, что это связано с нашей неспособностью высадиться в колониях, что подрывает стабильность нашего режима. Хотя на данный момент мы сможем удерживать эти группы под стражей, в ближайшем будущем ситуация может выйти из-под нашего контроля." # Reports from various police raids in Lisbon have informed us on a ever-growing number of Republican elements in our Society. We have no doubt that this is due to our incapability of landing in the colonies, which is hampering the stability of our regime. Whilst we will be able to keep these groups detained for now, the situation might spiral beyond our control in the near future.
 portugal.5.d: "В последнее время республиканские движения вышли далеко за пределы нашего контроля. Теперь различные прореспубликанские формирования собрались и штурмовали такие места, как Лиссабон и Бежа! К счастью, север остался нам верен...\n\nОднако на материке мы увидим гораздо больше кровопролития." # As-of recent, Republican movements have spiraled far beyond our control. Now, various pro-republic militias have assembled and stormed locations such as Lisbon and Beja! Fortunately, the north has remained loyal to us...\n\nHowever we will see much more bloodshed on the mainland.
 portugal.6.d: "Из-за некомпетентности Королевства в вторжении в колонии, поддержка их режима на материке резко упала! Благодаря росту многих республиканских движений на материке в прошлом году мы смогли успешно совершить переворот и восстановить позиции на материке. Сейчас королевство просто находится на севере, и сокрушить его будет легкой задачей." # Due to the incompetence of the Kingdom in invading the colonies, the support for their regime on the mainland has plummeted! With the growth of many Republican movements on the mainland in the past year, we have been able to successfully execute a coup and regain a foothold in the mainland. The kingdom now merely resides in the north, crushing them should be an easy feat.

