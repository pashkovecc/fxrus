 ### Events 
 gerunion.2.t: "[From.GetName] Provides Economic Assistance" #NT!
 gerunion.2.d: "As we are in a union, it is our duty to support each other to the best of our abilities. As we are currently in an unviable economic position, [FROM.GetNameDef] has thankfully reached out to grant us economic assistance in our times of need." #NT!
 gerunion.2.a: "To German brotherhood!" #NT!
  
 gerunion.3.t: "Militarization Question" #NT!
 gerunion.3.d: "With the defeat of the militaristic and evil Prussian Reich, many had thought that we would be free from the menace of war. Now however, the question of remilitarization has come onto the horizon. With turmoil still prevailing worldwide, many wonder if it is time that we remilitarize in order to secure ourselves." #NT!
 gerunion.3.a: "Yes, the time is now!" #NT!
 gerunion.3.b: "No - peace shall triumph!" #NT!
  
 gerunion.4.t: "Devalkification" #NT!
 gerunion.4.d: "The matter of Valkism and its lingering elements is one that haunts our government. While we may be free, many still mistakenly cling to the idea of Valkism. This must be dealt with, although we can choose to be harsh or to be kind." #NT!
 gerunion.4.a: "Mercy is a virtue..." #NT!
 gerunion.4.b: "...that we shall not exercise." #NT!
  
 gerunion.5.t: "The Monarchy?" #NT!
 gerunion.5.d: "The House of Wittelsbach have always been celebrities of Bavaria and a symbol of South German resistance to centralizing Prussian tendencies. There are now calls for a South German monarchy to solidify our South German identity - though naturally it will be via democratic referendum." #NT!
 gerunion.5.a: "There is no harm." #NT!
 gerunion.5.b: "No!" #NT!
  
 gerunion.6.t: "The Monarchist Referendum" #NT!
 gerunion.6.d: "As campaigning for whether the House of Wittelsbach is to be restored wraps up, many await with both giddy excitement and ample anxiety at the prospect of a monarchist return. Do the people vote to restore the monarchy?" #NT!
 gerunion.6.a: "The people vote for Rupprecht!" #NT!
 gerunion.6.b: "The people vote for the Republic!" #NT!
  
 gerunion.7.t: "Status of Berlin" #NT!
 gerunion.7.d: "Berlin is a special city within Germany, as the seat of power of both the old Kaiserreich and the republic that came after. It was the site at which the whole world bore witness to Dressler’s rise to power. Some believe that it does not deserve any autonomy as it is simply another part of the state, although others urge that we must take a lighter hand unlike the Prussians that precede us." #NT!
 gerunion.7.a: "Grant them autonomy" #NT!
 gerunion.7.b: "There is no need for such a thing." #NT!
  
  
