### Events
 gerunion.2.t: "[From.GetName] оказывает экономическую помощь" # [From.GetName] Provides Economic Assistance
 gerunion.2.d: "Поскольку мы состоим в союзе, наш долг — поддерживать друг друга в меру своих возможностей. Поскольку в настоящее время мы находимся в нежизнеспособном экономическом положении, [FROM.GetNameDef] к счастью обратился к нам и предоставил нам экономическую помощь в трудные времена." # As we are in a union, it is our duty to support each other to the best of our abilities. As we are currently in an unviable economic position, [FROM.GetNameDef] has thankfully reached out to grant us economic assistance in our times of need.
 gerunion.2.a: "За немецкое братство!" # To German brotherhood!

 gerunion.3.t: "Вопрос милитаризации" # Militarization Question
 gerunion.3.d: "После поражения милитаристского и злобного прусского рейха многие думали, что мы освободимся от угрозы войны. Однако теперь на горизонте встал вопрос о ремилитаризации. Поскольку во всем мире все еще царят беспорядки, многие задаются вопросом, не пришло ли время нам провести ремилитаризацию, чтобы обезопасить себя." # With the defeat of the militaristic and evil Prussian Reich, many had thought that we would be free from the menace of war. Now however, the question of remilitarization has come onto the horizon. With turmoil still prevailing worldwide, many wonder if it is time that we remilitarize in order to secure ourselves.
 gerunion.3.a: "Да, время пришло!" # Yes, the time is now!
 gerunion.3.b: "Нет, мир восторжествует!" # No - peace shall triumph!

 gerunion.4.t: "Девалькификация" # Devalkification
 gerunion.4.d: "Вопрос валкизма и его сохраняющихся элементов не дает покоя нашему правительству. Хоть мы и свободны, многие все еще ошибочно цепляются за идею валкизма. С этим необходимо разобраться, хотя мы можем выбирать: быть суровыми или добрыми." # The matter of Valkism and its lingering elements is one that haunts our government. While we may be free, many still mistakenly cling to the idea of Valkism. This must be dealt with, although we can choose to be harsh or to be kind.
 gerunion.4.a: "Милосердие - это добродетель..." # Mercy is a virtue...
 gerunion.4.b: "...что мы не будем осуществлять." # ...that we shall not exercise.

 gerunion.5.t: "Монархия?" # The Monarchy?
 gerunion.5.d: "Дом Виттельсбахов всегда был знаменитостью Баварии и символом южногерманского сопротивления централизации прусских тенденций. Сейчас раздаются призывы к созданию южногерманской монархии, чтобы укрепить нашу южногерманскую идентичность – хотя, естественно, это будет происходить посредством демократического референдума." # The House of Wittelsbach have always been celebrities of Bavaria and a symbol of South German resistance to centralizing Prussian tendencies. There are now calls for a South German monarchy to solidify our South German identity - though naturally it will be via democratic referendum.
 gerunion.5.a: "Вреда нет." # There is no harm.
 gerunion.5.b: "Нет!" # No!

 gerunion.6.t: "Монархический референдум" # The Monarchist Referendum
 gerunion.6.d: "Когда кампания за восстановление дома Виттельсбахов завершается, многие ждут с головокружительным волнением и огромной тревогой перспективу возвращения монархии. Голосует ли народ за восстановление монархии?" # As campaigning for whether the House of Wittelsbach is to be restored wraps up, many await with both giddy excitement and ample anxiety at the prospect of a monarchist return. Do the people vote to restore the monarchy?
 gerunion.6.a: "Народ голосует за Рупрехта!" # The people vote for Rupprecht!
 gerunion.6.b: "Народ голосует за Республику!" # The people vote for the Republic!

 gerunion.7.t: "Статус Берлина" # Status of Berlin
 gerunion.7.d: "Берлин — особый город в Германии, резиденция власти как старого Кайзеррайха, так и последующей республики. Это было место, где весь мир стал свидетелем прихода к власти Дресслера. Некоторые считают, что он не заслуживает никакой автономии, поскольку это просто еще одна часть государства, хотя другие утверждают, что мы должны проявить более легкую позицию, в отличие от пруссаков, которые были до нас." # Berlin is a special city within Germany, as the seat of power of both the old Kaiserreich and the republic that came after. It was the site at which the whole world bore witness to Dressler’s rise to power. Some believe that it does not deserve any autonomy as it is simply another part of the state, although others urge that we must take a lighter hand unlike the Prussians that precede us.
 gerunion.7.a: "Предоставьте им автономию" # Grant them autonomy
 gerunion.7.b: "В этом нет необходимости." # There is no need for such a thing.


