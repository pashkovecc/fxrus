# Decisions
 GER_devalkification: "Наследие Валкиста" # The Valkist Legacy
 GER_devalkification_desc: "В ходе одного из величайших судей в истории чудовищный режим, укравший свободу немецкого народа в 1932 году, был подавлен, и теперь мы правим тем, что осталось от Германии.\n\nК сожалению для нас, валкисты не ушли тихо в ночь. Они и их клика сломленных солдат и сумасшедших головорезов бежали в те немногие места, где они могли спрятаться, сопротивляясь нашей попытке вернуть Германию в достойную страну с приличными людьми. Хуже всего то, что многие валькисты решили вернуться в общественную жизнь, оставив эту гнилую идеологию гноиться внутри Германии, пока они не воспользуются шансом втянуть Германию в участь худшую, чем смерть.\n\nЕсли мы хотим правильно восстановить Германию, мы должны сокрушить этих повстанцев. Будь то взвешенная реинтеграция в сочетании с суровым возмездием, мы, несомненно, найдем поддержку со стороны иностранных союзников и вернувшихся активистов в нашей попытке раз и навсегда искоренить валькизм в Германии. Однако путь предстоит долгий и трудный..." # In one of history's great justices, the monstrous regime that stole away the German people's freedom in 1932 have been crushed and now we rule over what remains of Germany.\n\nUnfortunately for us, the Valkists have not gone quietly into the night. They and their cabal of broken soldiers and demented thugs have fled into the scant few places where they can hide, resisting our attempt to restore Germany to a decent nation with decent people. Worst of all, many valkists have opted to slink back into public life, leaving this rotten ideology to fester within Germany until they seize the chance to drag Germany into a fate worse than death.\n\nIf we are to properly build Germany back up, we must crush these rebels. Whether through measured reintegration combined with harsh retribution, we will no doubt find support from foreign allies and returning activists in our attempt to once and for all root Valkism out of Germany. Still, the road ahead is long and difficult...

