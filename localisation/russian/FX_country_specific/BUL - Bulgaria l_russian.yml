### Events
 bulgaria.100.t: "Болгария добивается вступления в [Root.GetFactionName]" # Bulgaria Seeks Entry to the [Root.GetFactionName]
 bulgaria.100.d: "Правительство Болгарии направило своего посла и нескольких высокопоставленных лиц для обсуждения с Министерством иностранных дел возможного вступления Болгарии в [Root.GetFactionName]." # The Bulgarian Government have sent their ambassador and a couple of dignitaries to discuss with the Foreign Ministry of possible Bulgarian entry to the [Root.GetFactionName].
 bulgaria.100.a: "Впусти их" # Let them in
 bulgaria.100.b: "Они будут проблемой" # They will be a problem
 bulgaria.101.t: "[From.GetName] запрещает нам вход в [From.GetFactionName]" # [From.GetName] Denies our Entry to the [From.GetFactionName]
 bulgaria.101.d: "Неожиданным поворотом событий стало то, что правительство [From.GetAdjective] отклонило наше предложение о вступлении в [From.GetFactionName]." # In a suprising turn of events, the [From.GetAdjective] Government have denied our proposal of entry to the [From.GetFactionName].
 bulgaria.101.a: "Разочаровывает." # Dissapointing.

 	bulgaria.1.t: "Министры выступают за болгарскую «Реконкисту»" # Ministers Argue for a Bulgarian ‘Reconquista’ 
 	bulgaria.1.d: "В последнее время влиятельные элементы кабинета министров и правительства начали открыто выражать поддержку возвращению этнических болгарских земель на Балканах. Хотя общественное мнение, кажется, склоняется в пользу таких действий, международное сообщество в целом не видит эту проблему в полном свете. Правительства крупнейших стран мира продолжают предупреждать о потенциальных последствиях движения Болгарии по такому пути. Но будут ли они выполнять свои угрозы, еще предстоит увидеть. На данный момент и правительство, и население в целом задаются вопросом: укрепит ли Болгария свои позиции на мировой арене или станет жертвой вечных последствий западного интервенционизма?" # Powerful elements of the Cabinet and government recently have begun openly voicing support for the return of ethnic Bulgarian lands in the Balkans. While public opinion seems to sway in favor of such an action, the international community at large does not see the issue in any sunlight. Major world governments continue to warn against the potential consequences of moving Bulgaria down such a path. But whether or not they act on their threats is a matter to be seen. For now, both the government and the population at large find themselves wondering the same thing: Will Bulgaria strengthen its position on the world stage, or will it fall victim to the timeless effects of Western interventionism? 
 	bulgaria.1.a: "Возможно, лучше послушать гигантов, чтобы они не проснулись от мирного сна." # Perhaps it is best to listen to the giants, lest they wake from their peaceful slumbers
 	bulgaria.1.b: "Болгары должны принадлежать Болгарии." # Bulgarians shall belong to Bulgaria.

	#STATUS OF DOBRUDJA EVENTS
 	bulgaria.2.t: "Статус Добруджи" # Status of Dobrudja
 	bulgaria.2.d: "Южная Добруджа входила в состав Болгарии. Там до сих пор живут многие этнические болгары. Северная Добруджа также входила в состав Болгарии в составе Первого Болгарского царства. Должны ли мы «запросить» часть или всю Добруджу?" # South Dobrudja, was a part of Bulgaria. Many ethnic Bulgarians still live there. North Dobrudja was also a part of Bulgaria in the First Bulgarian Empire. Should we 'Request'  a part or all of  Dobrudja?
 	bulgaria.2.a: "Попросите вернуть Южную Добруджу прямо сейчас!" # Request the return of South Dobrudja right now!
 	bulgaria.2.b: "Немедленно попросите вернуть всю Добруджу, иначе будут ужасные последствия!" # Request the return of all of Dobrudja this instant, or there will be dire consequences!
 	bulgaria.3.t: "Румыния предоставила нам право собственности на Южную Добруджу!" # Romania granted us ownership of South Dobrudja!
 	bulgaria.3.d: "Посол Болгарии в Румынии объявил сегодня румынскому правительству, что Болгария требует владения Южной Добруджей, иначе будет война! Румынское правительство, в конце концов, после обсуждения решило, что отдаст нам Южную Добруджу под пакт о ненападении и гарантию независимости." # The Bulgarian ambassador in Romania, today announced to the Romanian goverment that Bulgaria demands ownership of South Dobrudja, or there will be a war! The Romanian goverment, in the end, after a discussion, decided that they are going to give us South Dobrudja for a Non Agression Pact and a Guarantee of Independece. 
 	bulgaria.3.a: "Их требования приемлемы, сегодня победа болгарского народа." # Their demands are acceptable, today is a win for the Bulgarian Nation.
 	bulgaria.4.t: "Румыны отказались предоставить нам право собственности на Южную Добруджу" # The Romanians have refused to grant us ownerhip of South Dobrudja
 	bulgaria.4.d: "Посольство Болгарии в Румынии озвучило им наши требования. Они были недовольны и сказали, что Южной Добруджи у нас не может быть. Правительство еще не решило, собираемся ли мы смириться с этим или начать войну." # The Bulgarian embassy to Romania, announced our demands to them. They weren't happy, and told that we can't have South Dobrudja. The goverment hasn't yet decided, if we are going to accept that, or go to war.
 	bulgaria.4.a: "Ребята, набирайтесь сил, потому что мы собираемся на войну!" # Man the Guns boys, for we are going to war!
 	bulgaria.4.b: "Просто претендуйте на землю, у нас сейчас другие заботы." # Just claim the land, we have other concerns for now.
 	bulgaria.5.t: "Болгария подарила нам Добруджу!" # Bulgaria gave us ownership of Dobrudja!
 	bulgaria.5.d: "После заявления нашего посла правительству Румынии о наших требованиях к Добрудже. Они решили предоставить нам право собственности, но мы должны им гарантировать, заключить с ними пакт о невозрастании." # After our embassador's announcement to the Romanian Goverment about our Demands to Dobrudja. They decided to grant us ownership, but we have to guarantee them, make a non agession pact with them.
 	bulgaria.5.a: "Их требования приемлемы, мы дадим им то, что они хотят." # Their demands are acceptable, we shall give them what they want
 	bulgaria.5.b: "Что? Нас пытаются ограбить! Вооружайтесь, ребята!" # What? They are trying to rob us! Arm the Guns Boys!
 	bulgaria.6.t: "Румыны не отдали нам Добруджу!" # The Romanians didn't give us Dobrudja!
 	bulgaria.6.d: "После заявления нашего посла правительству о наших требованиях к Добрудже, они решили, что не хотят давать нам такой большой участок земли, не выиграв при этом ничего. Поэтому они отвергли наши требования." # After our embassador's announcement to the goverment about our demands to dobrudja, they decided they didn't want to give us such a big amount of land without them winning anything. They have therefore, rejected our demands
 	bulgaria.6.a: "Эти ублюдки, вооружитесь, ребята!" # Those bastards, arm the guns boys!
 	bulgaria.6.b: "Просто пока заявите права на землю, потому что у нас другие заботы." # Just claim the land for now, for we have other concerns.
 	bulgaria.7.t: "Греки отказываются отдать нам Фракию" # The Greek reject to give us Thrace
 	bulgaria.7.d: "Наш посол г-н Юлиан Джульетт сообщил греческому правительству о наших требованиях. Они были, мягко говоря, недовольны. Что нам делать сейчас?" # Our embassador, Mr. Julian Juliettus, told the Greek goverment about our demands. They weren't happy to say the least. What should we do now? 
 	bulgaria.7.a: "Объявить войну." # Declare War.
 	bulgaria.7.b: "Просто заявите права на землю." # Just claim the land.
 	bulgaria.8.t: "Греки решают уступить нашим требованиям." # Greeks decide to cave in our demands.
 	bulgaria.8.d: "После речи нашего посла о требованиях, которые мы выдвинули, трусливый греческий народ решил, что лучше отдать нам Фракию, чем рисковать войной. Чтобы это произошло, им нужны конкретные вещи. Они потребовали, чтобы мы гарантировали их независимость, подписали с ними пакт о ненападении, а также заплатили им." # After our embassador's speech, about the demands we posed, the coward Greek Nation, decided they'd be better of giving us Thrace, than risking a war. For this to happen, they want specific things. They demanded we Guarantee their Independence, enact a non aggression pact with them, and also pay them.
 	bulgaria.8.a: "Хорошо, их требования приемлемы." # Alright, their demands are acceptable
 	bulgaria.8.b: "Они называют это честной сделкой? Вооружайтесь, ребята!" # They call this a fair deal? Arm the Guns Boys!
 	bulgaria.9.t: "Образование новой империи" # The Formation of a new Empire
 	bulgaria.9.d: "Более 500 лет назад османы положили конец второй Болгарской империи, завоевав ее всю. Однако, несмотря на всю борьбу и лишения, которые пришлось пережить людям в это время за свою свободу, за болгарское государство, включавшее в себя всех болгар, они не утратили своего духа, своей национальной идентичности, своего языка и, прежде всего, своей религии. Болгарское государство находилось под властью Османской империи до 3 марта 1878 года, когда они освободились от османов. Сегодня [GetDateStringNoHourLong], наш лидер [BUL.GetLeader] объявил о создании Третьей Империи. Мир с шоком и трепетом смотрит на доблестный народ этой балканской нации, которому, несмотря ни на что, удалось вернуть себе право первородства и империю. На востоке возникла новая мощная сила – Третья Болгарская империя." # More than 500 years ago the Ottomans ended the second Bulgarian Empire, by conquering it all. Yet despite all the struggle and hardship the people had in these times for their freedom, for a Bulgarian state that contained all of the Bulgarians, they didn't lose their spirit, their national identity, their language, and foremost their religion. The Bulgarian state was under Ottoman rule, untill  3rd March 1878, when they became free from the Ottomans. Today [GetDateStringNoHourLong], our leader [BUL.GetLeader] announced the formation of the Third Empire. The world looks with shock and awe upon the valiant people of this Balkan nation who, despite all odds managed to reclaim their birthright and empire. A new juggernaut of the east has risen, the Third Bulgarian Empire.
 	bulgaria.9.a: "Этот день следует отмечать с гордостью. Да здравствует Третья Болгарская империя." # This day, shall be celebrated with pride. Long live the Third Bulgarian Empire.
	# fxnews.49.t: "Образование Третьего Болгарского царства" # The formation of the Third Bulgarian Empire
	# fxnews.49.d: "В этот день болгарское правительство, после серии ошеломляющих побед и территориальных завоеваний, объявило о создании Третьей Болгарской империи, название которой было создано по образцу средневекового царства, уничтоженного османами. Еще предстоит увидеть, падет ли эта Империя под натиском иностранных сил, как ее предшественница, или же она будет править будущим Балкан. Что бы ни ждало новую Империю в будущем, ее соседи теперь должны определить свою позицию по отношению к этой растущей державе." # This Day, the Bulgarian Government, after a series of stunning victories and territorial gains, announced the formation of the Third Bulgarian Empire, a title modelled after the medieval realm which was ended by the Ottomans. It is yet to see if this Empire will fall to foreign forces like its predecessor or if it will rule the future of the Balkans. Whatever the future holds for the new Empire, its neighbours must now decide their stance towards this rising power.
	# fxnews.49.a: "Касательно..." # Concerning...
 	bulgaria.14.t: "Удар по нашим смертельным врагам" # Striking Our Mortal Enemies
 	bulgaria.14.d: "Сегодня наш лидер [BUL.GetLeader] заявил о наших претензиях к Турции. Турки пока не ответили, поэтому наш лидер решил вмешаться и оккупировать Константинополь и некоторые соседние регионы. Турецкая нация — это фальшивая нация, которая украла нашу драгоценную землю и поработила наш народ. Мы сотрем и уничтожим эту отбросы страны, которая смеет называть себя под тем же именем, что и животное, Турция." # Today, our leader, [BUL.GetLeader] annouced our claims to Turkey. The Turks, are yet to respond, so our leader decided to intervene and occupy Constantinople and some neighbour regions. The Turkish nation is a Fake Nation that stole our precious land and enslaved our kind. We shall obliterate and destroy this scum of a country, that dares to name itself, under the same name as an animal, Turkey.
 	bulgaria.14.a: "Турция должна быть уничтожена." # Turkey, delenda est.
 	bulgaria.14.b: "Под Богом мы будем!" # Under God we shall!
 	bulgaria.14.c: "Давайте покажем этим отбросам, кто настоящий Бог!" # Let's show these scums who is the real God!
	# bulgaria.14.d: "Как они посмели?" # How dare they?
 	bulgaria.14.e: "[TUR.GetName] больше нет." # [TUR.GetName] is no more.


