l_russian:
  
 BUL_FUHRERREICH_DESC: "The young Bulgarian nation joined the Central Powers in the Great War, declaring war on Serbia in October 1915; despite achieving its territorial objectives, the capitulation of the German Empire proved to have catastrophic effects as Entente forces took back its hard won gains.\n\nThe monarchy was abolished with the capitulation of Bulgarian forces; and the new Republic finally surrendered to the Entente, humiliated and torn apart in the Treaty of Neuilly-sur-Seine in 1920." #NT!
  
