 ### FOCUS 
  
 BUL_expand_armed_forces: "Expand Armed Forces" #NT!
 BUL_reclamation: "Reclaim what we lost" #NT!
 BUL_reclamation_desc: "Stemming from rapid development and deployment of our armed forces, Bulgaria has now found itself on the path to reclaiming the old titular status of "The Prussia of the Balkans." With all eyes on this once insignificant state, it is now time to choose how we utilize our growing strength to approach the nations foreign ambitions." #NT!
 BUL_reclaim_peacefully: "The path of Diplomacy" #NT!
 BUL_reclaim_peacefully_desc: "The Balkans: For too long a powder keg and hotspot for international conflicts and proxy wars. Our history is riddled with significant military miracles, and horrifying defeats at the hands of our enemies. But yet it has been decided. It is time we showed the world our capabilities, and restored peace to this troubled region, once and for all." #NT!
 BUL_man_the_guns: "Man The Guns" #NT!
 BUL_man_the_guns_desc: "Western interventionism and frequent military conflicts between various ethnic groups has decimated a region once capable of prosperity. As of now, peace in the Balkans is but a dream - something philosophers imagine in their past time; something seemingly unreachable. If we are to ever achieve unity in the region, then we must put an end to these petty conflicts. The military is ready. It is time for the last great push. It is time to show the world what we are truly capable of." #NT!
 BUL_territorial_ambitions_fulfilled: "Territorial Ambitions Fulfilled" #NT!
 BUL_territorial_ambitions_fulfilled_desc: "Throughout the centuries, Bulgaria has been forced to surrender its rightful lands at the hands of powers far greater than ourselves. From the Kievan Rus and the Byzantines, to the Ottomans and the Germans, we have been forced too many times into servitude. But no longer. Through skilled leadership and the decisive force of our military, we have reclaimed lands long thought lost. Never again will we kneel to foreign masters. Bulgaria is for Bulgarians, now and forever." #NT!
 BUL_sabotage_serbia: "Our connections in Serbia" #NT!
 BUL_retake_serbian_lands: "Macedonia is Bulgaria" #NT!
 BUL_status_of_dobrudja: "Status of Dobrudja" #NT!
