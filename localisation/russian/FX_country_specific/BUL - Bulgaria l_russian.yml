 BUL_demand_salonica: "Demand Salonica" #NT!
 BUL_integrate_macedonia: "Integrate Macedonia" #NT!
  
 ## ROMAN EMPIRE FOCUS 
 BUL_empire_greek_bulgarian: "A Roman Empire" #NT!
 BUL_empire_greek_bulgarian_desc: "After the fall of the Byzantines, our Empire claimed the title of the Third Rome until the Turkish onslaught. Our Czars always protected the orthodox legacy of the Romans even during these trying times. Today we are among the most powerful Nations of the Balkans in a position to reunite the Orthodox world. After we threw off the Muslim tyrants together with our brothers in arms and faith we are bound by destiny to bring back what always belonged together, to reclaim and ascend to the throne in Constantinople, the beating heart of both of our cultures." #NT!
 BUL_incite_uprising_gre: "Incite Uprsing in Greece" #NT!
 BUL_incite_uprising_gre_desc: "The old always needs to make room for the new and for our great Idea to succeed and finally bring our people together, we need to remove this obstacle to the unity of our people, the warmongering old Guard that wishes for nothing more then to divide the heirs to Rome and orthodoxy. Luckily many Greeks see alike and we will support our friends in their endeavours on their side of the border." #NT!
 BUL_alliance_greece: "An Alliance with Greece" #NT!
 BUL_alliance_greece_desc: "After our allies in Greece succeeded and have done away with the rotten structure, their nation is finally able to join us in our common destiny to reclaim the legacy of our people and the heart of Orthodoxy." #NT!
 BUL_united_kingdom: "A United Kingdom" #NT!
 BUL_united_kingdom_desc: "In Order for our Nations of brothers to stand together against our enemies and finalise the bond of friendship, our allies in the Greek government agreed to coronation our Czar as King of Greece, binding the fate of our States." #NT!
 BUL_demand_constantinople: "Demand Costantinople" #NT!
 BUL_demand_constantinople_desc: "The vile Muslim powers have long enough squatted in the holy halls of Orthodoxy and the great city of Constantine. We will offer them a final demand and chance to withdraw from European soil peacefully at least for now. Our brave soldiers are ready either way." #NT!
 BUL_question_of_turkey: "The Question of Turkey" #NT!
 BUL_question_of_turkey_desc: "Now that we reduced Turkey to a fully Turkish rump state, the Question remains on what to do with them, we cant let them be there, as they will always be a thorn in our side and an open invitation for our enemies. While we need to have control over the area, full occupation could be a costly and unnecessary endeavour for our manpower which will be needed elsewhere. Alternatively we could set up a controllable puppet in [TUR.GetName], but this would mean that the land won't be directly occupied by us." #NT!
 BUL_integrate_anatolia: "Integrate Anatolia" #NT!
 BUL_integrate_anatolia_desc: "We will use the remaining orthodox population as the backbone of our reintegration process of Asia Minor. The Area has long been neglected and was under Turkish rule so it will be important to solidify our new order there forst before we advance further." #NT!
  
  
  
  
  
  
