 ### Events 
 bulgaria.100.t: "Bulgaria Seeks Entry to the [Root.GetFactionName]" #NT!
 bulgaria.100.d: "The Bulgarian Government have sent their ambassador and a couple of dignitaries to discuss with the Foreign Ministry of possible Bulgarian entry to the [Root.GetFactionName]." #NT!
 bulgaria.100.a: "Let them in" #NT!
 bulgaria.100.b: "They will be a problem" #NT!
 bulgaria.101.t: "[From.GetName] Denies our Entry to the [From.GetFactionName]" #NT!
 bulgaria.101.d: "In a suprising turn of events, the [From.GetAdjective] Government have denied our proposal of entry to the [From.GetFactionName]." #NT!
 bulgaria.101.a: "Dissapointing." #NT!
  
 bulgaria.1.t: "Ministers Argue for a Bulgarian ‘Reconquista’ " #NT!
 bulgaria.1.d: "Powerful elements of the Cabinet and government recently have begun openly voicing support for the return of ethnic Bulgarian lands in the Balkans. While public opinion seems to sway in favor of such an action, the international community at large does not see the issue in any sunlight. Major world governments continue to warn against the potential consequences of moving Bulgaria down such a path. But whether or not they act on their threats is a matter to be seen. For now, both the government and the population at large find themselves wondering the same thing: Will Bulgaria strengthen its position on the world stage, or will it fall victim to the timeless effects of Western interventionism? " #NT!
 bulgaria.1.a: "Perhaps it is best to listen to the giants, lest they wake from their peaceful slumbers" #NT!
 bulgaria.1.b: "Bulgarians shall belong to Bulgaria." #NT!
  
 	#STATUS OF DOBRUDJA EVENTS 
 bulgaria.2.t: "Status of Dobrudja" #NT!
 bulgaria.2.d: "South Dobrudja, was a part of Bulgaria. Many ethnic Bulgarians still live there. North Dobrudja was also a part of Bulgaria in the First Bulgarian Empire. Should we 'Request'  a part or all of  Dobrudja?" #NT!
 bulgaria.2.a: "Request the return of South Dobrudja right now!" #NT!
 bulgaria.2.b: "Request the return of all of Dobrudja this instant, or there will be dire consequences!" #NT!
 bulgaria.3.t: "Romania granted us ownership of South Dobrudja!" #NT!
 bulgaria.3.d: "The Bulgarian ambassador in Romania, today announced to the Romanian goverment that Bulgaria demands ownership of South Dobrudja, or there will be a war! The Romanian goverment, in the end, after a discussion, decided that they are going to give us South Dobrudja for a Non Agression Pact and a Guarantee of Independece. " #NT!
 bulgaria.3.a: "Their demands are acceptable, today is a win for the Bulgarian Nation." #NT!
 bulgaria.4.t: "The Romanians have refused to grant us ownerhip of South Dobrudja" #NT!
 bulgaria.4.d: "The Bulgarian embassy to Romania, announced our demands to them. They weren't happy, and told that we can't have South Dobrudja. The goverment hasn't yet decided, if we are going to accept that, or go to war." #NT!
 bulgaria.4.a: "Man the Guns boys, for we are going to war!" #NT!
 bulgaria.4.b: "Just claim the land, we have other concerns for now." #NT!
 bulgaria.5.t: "Bulgaria gave us ownership of Dobrudja!" #NT!
 bulgaria.5.d: "After our embassador's announcement to the Romanian Goverment about our Demands to Dobrudja. They decided to grant us ownership, but we have to guarantee them, make a non agession pact with them." #NT!
 bulgaria.5.a: "Their demands are acceptable, we shall give them what they want" #NT!
 bulgaria.5.b: "What? They are trying to rob us! Arm the Guns Boys!" #NT!
 bulgaria.6.t: "The Romanians didn't give us Dobrudja!" #NT!
 bulgaria.6.d: "After our embassador's announcement to the goverment about our demands to dobrudja, they decided they didn't want to give us such a big amount of land without them winning anything. They have therefore, rejected our demands" #NT!
 bulgaria.6.a: "Those bastards, arm the guns boys!" #NT!
 bulgaria.6.b: "Just claim the land for now, for we have other concerns." #NT!
 bulgaria.7.t: "The Greek reject to give us Thrace" #NT!
 bulgaria.7.d: "Our embassador, Mr. Julian Juliettus, told the Greek goverment about our demands. They weren't happy to say the least. What should we do now? " #NT!
 bulgaria.7.a: "Declare War." #NT!
 bulgaria.7.b: "Just claim the land." #NT!
 bulgaria.8.t: "Greeks decide to cave in our demands." #NT!
 bulgaria.8.d: "After our embassador's speech, about the demands we posed, the coward Greek Nation, decided they'd be better of giving us Thrace, than risking a war. For this to happen, they want specific things. They demanded we Guarantee their Independence, enact a non aggression pact with them, and also pay them." #NT!
 bulgaria.8.a: "Alright, their demands are acceptable" #NT!
 bulgaria.8.b: "They call this a fair deal? Arm the Guns Boys!" #NT!
 bulgaria.9.t: "The Formation of a new Empire" #NT!
 bulgaria.9.d: "More than 500 years ago the Ottomans ended the second Bulgarian Empire, by conquering it all. Yet despite all the struggle and hardship the people had in these times for their freedom, for a Bulgarian state that contained all of the Bulgarians, they didn't lose their spirit, their national identity, their language, and foremost their religion. The Bulgarian state was under Ottoman rule, untill  3rd March 1878, when they became free from the Ottomans. Today [GetDateStringNoHourLong], our leader [BUL.GetLeader] announced the formation of the Third Empire. The world looks with shock and awe upon the valiant people of this Balkan nation who, despite all odds managed to reclaim their birthright and empire. A new juggernaut of the east has risen, the Third Bulgarian Empire." #NT!
 bulgaria.9.a: "This day, shall be celebrated with pride. Long live the Third Bulgarian Empire." #NT!
 # fxnews.49.t: "The formation of the Third Bulgarian Empire" #NT!
 # fxnews.49.d: "This Day, the Bulgarian Government, after a series of stunning victories and territorial gains, announced the formation of the Third Bulgarian Empire, a title modelled after the medieval realm which was ended by the Ottomans. It is yet to see if this Empire will fall to foreign forces like its predecessor or if it will rule the future of the Balkans. Whatever the future holds for the new Empire, its neighbours must now decide their stance towards this rising power." #NT!
 # fxnews.49.a: "Concerning..." #NT!
 bulgaria.14.t: "Striking Our Mortal Enemies" #NT!
 bulgaria.14.d: "Today, our leader, [BUL.GetLeader] annouced our claims to Turkey. The Turks, are yet to respond, so our leader decided to intervene and occupy Constantinople and some neighbour regions. The Turkish nation is a Fake Nation that stole our precious land and enslaved our kind. We shall obliterate and destroy this scum of a country, that dares to name itself, under the same name as an animal, Turkey." #NT!
 bulgaria.14.a: "Turkey, delenda est." #NT!
 bulgaria.14.b: "Under God we shall!" #NT!
 bulgaria.14.c: "Let's show these scums who is the real God!" #NT!
 # bulgaria.14.d: "How dare they?" #NT!
 bulgaria.14.e: "[TUR.GetName] is no more." #NT!
  
  
