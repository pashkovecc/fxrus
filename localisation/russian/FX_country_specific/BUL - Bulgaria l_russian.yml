### FOCUS

 	BUL_expand_armed_forces: "Расширить Вооруженные Силы" # Expand Armed Forces
 	BUL_reclamation: "Верните то, что мы потеряли" # Reclaim what we lost
 	BUL_reclamation_desc: "Благодаря быстрому развитию и развертыванию наших вооруженных сил Болгария теперь оказалась на пути к возвращению старого титульного статуса «Балканской Пруссии». Поскольку все внимание обращено на это когда-то незначительное государство, теперь пришло время выбрать, как мы будем использовать нашу растущую силу для решения иностранных амбиций страны." # Stemming from rapid development and deployment of our armed forces, Bulgaria has now found itself on the path to reclaiming the old titular status of "The Prussia of the Balkans." With all eyes on this once insignificant state, it is now time to choose how we utilize our growing strength to approach the nations foreign ambitions.
 	BUL_reclaim_peacefully: "Путь дипломатии" # The path of Diplomacy
 	BUL_reclaim_peacefully_desc: "Балканы: слишком долго были пороховой бочкой и горячей точкой международных конфликтов и прокси-войн. Наша история полна значительных военных чудес и ужасающих поражений от рук наших врагов. Но все же решено. Пришло время показать миру наши возможности и восстановить мир в этом неспокойном регионе раз и навсегда." # The Balkans: For too long a powder keg and hotspot for international conflicts and proxy wars. Our history is riddled with significant military miracles, and horrifying defeats at the hands of our enemies. But yet it has been decided. It is time we showed the world our capabilities, and restored peace to this troubled region, once and for all.
 	BUL_man_the_guns: "Человек с оружием" # Man The Guns
 	BUL_man_the_guns_desc: "Западный интервенционизм и частые военные конфликты между различными этническими группами опустошили регион, когда-то способный к процветанию. На данный момент мир на Балканах — это всего лишь мечта, которую философы представляли себе в прошлом; что-то, казалось бы, недостижимое. Если мы хотим когда-либо достичь единства в регионе, то мы должны положить конец этим мелким конфликтам. Военные готовы. Настало время для последнего великого рывка. Пришло время показать миру, на что мы действительно способны." # Western interventionism and frequent military conflicts between various ethnic groups has decimated a region once capable of prosperity. As of now, peace in the Balkans is but a dream - something philosophers imagine in their past time; something seemingly unreachable. If we are to ever achieve unity in the region, then we must put an end to these petty conflicts. The military is ready. It is time for the last great push. It is time to show the world what we are truly capable of.
 	BUL_territorial_ambitions_fulfilled: "Территориальные амбиции реализованы" # Territorial Ambitions Fulfilled
 	BUL_territorial_ambitions_fulfilled_desc: "На протяжении веков Болгария была вынуждена отдать свои законные земли в руки держав, гораздо более могущественных, чем мы сами. От Киевской Руси и Византии до османов и немцев нас слишком много раз принуждали к рабству. Но не больше. Благодаря умелому руководству и решительной силе наших вооруженных сил мы вернули себе земли, давно считавшиеся утраченными. Никогда больше мы не преклоним колени перед иностранными мастерами. Болгария для болгар, сейчас и навсегда." # Throughout the centuries, Bulgaria has been forced to surrender its rightful lands at the hands of powers far greater than ourselves. From the Kievan Rus and the Byzantines, to the Ottomans and the Germans, we have been forced too many times into servitude. But no longer. Through skilled leadership and the decisive force of our military, we have reclaimed lands long thought lost. Never again will we kneel to foreign masters. Bulgaria is for Bulgarians, now and forever.
 	BUL_sabotage_serbia: "Наши связи в Сербии" # Our connections in Serbia
 	BUL_retake_serbian_lands: "Македония – это Болгария." # Macedonia is Bulgaria
 	BUL_status_of_dobrudja: "Статус Добруджи" # Status of Dobrudja
