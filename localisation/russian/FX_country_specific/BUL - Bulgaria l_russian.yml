## ROMAN EMPIRE FOCUS 
 	BUL_empire_greek_bulgarian: "Римская империя" # A Roman Empire
 	BUL_empire_greek_bulgarian_desc: "После падения Византии наша империя претендовала на титул Третьего Рима до турецкого натиска. Наши цари всегда защищали православное наследие римлян даже в эти трудные времена. Сегодня мы являемся одной из самых могущественных наций Балкан, способных воссоединить православный мир. После того, как мы свергли мусульманских тиранов вместе с нашими братьями по оружию и вере, мы связаны судьбой вернуть то, что всегда было вместе, вернуть себе и взойти на трон в Константинополе, бьющемся сердце обеих наших культур." # After the fall of the Byzantines, our Empire claimed the title of the Third Rome until the Turkish onslaught. Our Czars always protected the orthodox legacy of the Romans even during these trying times. Today we are among the most powerful Nations of the Balkans in a position to reunite the Orthodox world. After we threw off the Muslim tyrants together with our brothers in arms and faith we are bound by destiny to bring back what always belonged together, to reclaim and ascend to the throne in Constantinople, the beating heart of both of our cultures.
 	BUL_incite_uprising_gre: "Разжигание восстания в Греции" # Incite Uprsing in Greece
 	BUL_incite_uprising_gre_desc: "Старому всегда нужно освободить место для нового, и чтобы наша великая Идея преуспела и, наконец, объединила наш народ, нам нужно устранить это препятствие на пути к единству нашего народа, воинственную старую гвардию, которая не желает ничего, кроме как разделить наследников Рима и ортодоксальности. К счастью, многие греки видят одинаково, и мы поддержим наших друзей в их начинаниях на их стороне границы." # The old always needs to make room for the new and for our great Idea to succeed and finally bring our people together, we need to remove this obstacle to the unity of our people, the warmongering old Guard that wishes for nothing more then to divide the heirs to Rome and orthodoxy. Luckily many Greeks see alike and we will support our friends in their endeavours on their side of the border.
 	BUL_alliance_greece: "Союз с Грецией" # An Alliance with Greece
 	BUL_alliance_greece_desc: "После того, как наши союзники в Греции добились успеха и покончили с гнилой структурой, их нация наконец-то сможет присоединиться к нам в нашей общей судьбе, чтобы вернуть наследие нашего народа и сердце Православия." # After our allies in Greece succeeded and have done away with the rotten structure, their nation is finally able to join us in our common destiny to reclaim the legacy of our people and the heart of Orthodoxy.
 	BUL_united_kingdom: "Соединенное Королевство" # A United Kingdom
 	BUL_united_kingdom_desc: "Чтобы наши братья-народы вместе выстояли против наших врагов и укрепили узы дружбы, наши союзники в греческом правительстве согласились короновать нашего царя как короля Греции, что определит судьбу наших государств." # In Order for our Nations of brothers to stand together against our enemies and finalise the bond of friendship, our allies in the Greek government agreed to coronation our Czar as King of Greece, binding the fate of our States.
 	BUL_demand_constantinople: "Спрос Константинополь" # Demand Costantinople
 	BUL_demand_constantinople_desc: "Гнусные мусульманские державы уже достаточно долго засели в святых залах православия и великом городе Константине. Мы предложим им последнее требование и шанс мирно уйти с европейской земли, по крайней мере на данный момент. Наши храбрые солдаты готовы в любом случае." # The vile Muslim powers have long enough squatted in the holy halls of Orthodoxy and the great city of Constantine. We will offer them a final demand and chance to withdraw from European soil peacefully at least for now. Our brave soldiers are ready either way.
 	BUL_question_of_turkey: "Вопрос о Турции" # The Question of Turkey
 	BUL_question_of_turkey_desc: "Теперь, когда мы превратили Турцию в полностью турецкое государство, остается вопрос, что с ними делать, мы не можем допустить, чтобы они там находились, поскольку они всегда будут занозой на нашем глазу и открытым приглашением для наших врагов. Хотя нам необходимо иметь контроль над этой территорией, полная оккупация может оказаться дорогостоящим и ненужным мероприятием для нашей рабочей силы, которая понадобится в другом месте. В качестве альтернативы мы могли бы установить управляемую марионетку в [TUR.GetName], но это будет означать, что земля не будет оккупирована нами напрямую." # Now that we reduced Turkey to a fully Turkish rump state, the Question remains on what to do with them, we cant let them be there, as they will always be a thorn in our side and an open invitation for our enemies. While we need to have control over the area, full occupation could be a costly and unnecessary endeavour for our manpower which will be needed elsewhere. Alternatively we could set up a controllable puppet in [TUR.GetName], but this would mean that the land won't be directly occupied by us.
 	BUL_integrate_anatolia: "Интегрировать Анатолию" # Integrate Anatolia
 	BUL_integrate_anatolia_desc: "Мы будем использовать оставшееся ортодоксальное население в качестве основы нашего процесса реинтеграции Малой Азии. Эта территория долгое время находилась в запустении и находилась под турецким правлением, поэтому будет важно укрепить там наш новый порядок, прежде чем мы продвинемся дальше." # We will use the remaining orthodox population as the backbone of our reintegration process of Asia Minor. The Area has long been neglected and was under Turkish rule so it will be important to solidify our new order there forst before we advance further.






