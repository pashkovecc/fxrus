 LUX_give_equipment_for_each_friendly_majors: "§YEquipments§! будет добавлено для каждой из следующих стран, имеющих §Yмнение§! Люксембурга! больше §G1§!: \n§Y[FRA.getFlag][FRA.GetNameDef]§!, [ENG.getFlag]§Y [ENG.GetNameDef]§!, §Y§!, §Y§!, §Y§!, §Y[USA.getFlag][USA.GetNameDef]§!, §Y§!, §Y§!, §Y§!, §Y[ITA.getFlag][ITA.GetNameDef]§! и §Y[SOV.getFlag][SOV.GetNameDef]§!." # §YEquipments§! will be added for each of the following countries that has an §Yopinion§! of Luxembourg! greater than §G1§!: \n§Y[FRA.getFlag][FRA.GetNameDef]§!, [ENG.getFlag]§Y [ENG.GetNameDef]§!, §Y[GER.getFlag][GER.GetNameDef]§!,§Y[USA.getFlag][USA.GetNameDef]§!, §Y[ITA.getFlag][ITA.GetNameDef]§! and §Y[SOV.getFlag][SOV.GetNameDef]§!.

 LUX_rearmament_tooltip: "§WВыполнение этого фокуса открывает§! §YРешения§! §Wto§! §Gизбавьтесь от§! §RПеха Великой войны§! Национальный дух" # §WCompleting this focus unlocks§! §YDecisions§! §Wto§! §Gget rid of§! the §RAshes of the Great War§! National Spirit
 LUX_rearmament: "Наследие Великой войны" # Legacy Of The Great War
 LUX_rearmament_desc: "Наша армия находится в плачевном состоянии со времен Великой войны. От нашего почти полного уничтожения до унижения, которое было на Изерском фронте, Люксембургу не удалось доказать, что он способен защитить людей, живущих на нем. Наследие войны – это разрушения. \n\nЕсли мы хотим продолжить выживание как нация, мы должны извлечь уроки из войны. Мы должны научиться не допускать, чтобы разрушения и хаос конфликта когда-либо снова пришли на нашу землю." # Our military has been in a sorry state ever since the Great War. From our near annihilation to the humiliation that was the Yser front, Luxembourg has failed to prove itself able to defend the people within it. The legacy of the war is that of destruction. \n\nIf we wish to continue our survival as a nation we must learn from the war. We must learn how to prevent the destruction and chaos of the conflict from ever arriving on our soil again.

 LUX_artillery_primacy: "Ударь сильно" # Hit Hard
 LUX_artillery_primacy_desc: "У нас нет возможности создать такую ​​огромную армию, как у наших современников. Вместо этого нам следует сосредоточить наше производство на более качественном и мощном оружии, чтобы мы могли одолеть любого врага, с которым мы сталкиваемся на поле боя. Однако это будет дорого, и поэтому мы должны очень избирательно выбирать, какие подразделения мы развертываем." # We lack the capacity to field a massive army like our contemporaries. Instead, we should focus our production on higher quality, stronger weaponry so that we may overpower any foes we face on the battlefield. This will be expensive, though, and, as such, we must be very selective in what units we deploy.
 LUX_decentralised_doctrine: "Децентрализованная доктрина" # Decentralised Doctrine
 LUX_decentralised_doctrine_desc: "Мы должны сосредоточить внимание на небольших подразделениях и офицерах низшего звена, а не на кабинетных генералах, которые ими руководят." # We must place focus on smal units and low tier officers over the armchair generals who lead them.
 LUX_strength_in_firepower: "Сила в огневой мощи" # Strength In Firepower
 LUX_strength_in_firepower_desc: "Если мы хотим одержать победу, наши подразделения должны быть сосредоточены на том, чтобы одолеть врага с помощью превосходной огневой мощи." # Our units must be focused on overpowering the enemy with Superior Firepower if we wish to come out on top.
 LUX_fn_contracts: "Бельгийские контракты на нападение" # Belgian Assault Contracts
 LUX_fn_contracts_desc: "Бельгийская Fabrique Nationale производит высококачественное штурмовое оружие, оружие, в котором отчаянно нуждается наша армия, если мы хотим проводить политику превосходящей огневой мощи. Таким образом, мы передадим люксембургские военные контракты компании FN в надежде приобрести больше штурмового оружия для наших вооруженных сил." # The Belgian Fabrique Nationale produces high quality assault weapons, weapons our army desperately needs if we are to persue a policy of superior firepower. As such, we shall hand out Luxembourgish military contracts to FN in the hopes of acquiring more assault weapons for our armed forces.
 LUX_frc_contracts: "Бельгийские пушечные контракты" # Belgian Cannon Contracts
 LUX_frc_contracts_desc: "Fonderie Royale des Canons for Cannons — ключевой компонент нашей артиллерийской промышленности. Таким образом, мы предоставим им дополнительное финансирование и контракты, чтобы обеспечить нашу армию артиллерией более высокого качества." # The Fonderie Royale des Canons for Cannons is a key component in our artillery industry. As such, we shall grant them extra funding and contracts in order to provide higher quality artillery for our army.
 LUX_minerva_contracts: "Бельгийские автомобильные контракты" # Belgian Car Contracts
 LUX_minerva_contracts_desc: "Бельгийская Minerva во время Великой войны производила широкий спектр мобильных транспортных средств. Многие настаивали на принятии в нашу армию бронетранспортеров, чтобы защитить наших пехотинцев. Возможно, Минерва могла бы обеспечить это маленькому Люксембургу?" # The Belgian Minerva produced a wide array of mobile vehicles during the Great War. Many have pushed for the adoption of Armoured Personnel Carriers into our army in order to protect our infantrymen. Perhaps Minerva could provide this to little Luxembourg?
 LUX_offencive_stratagems: "Наступательные стратегии" # Offencive Stratagems
 LUX_offencive_stratagems_desc: "Нападение – лучшая защита. Мы должны принять это близко к сердцу, если хотим защитить нашу великую нацию от внешних сил." # Offence is the best Defence. We must take this to heart if we wish to defend our great nation from outside powers.
 LUX_modern_army: "Современная армия" # A Modern Army
 LUX_modern_army_desc: " "

 LUX_auxiliary_units: "Вспомогательные подразделения" # Auxiliary Units
 LUX_auxiliary_units_desc: "Ни одна сила не обходится без подразделений поддержки. От разведки до инженеров — они имеют решающее значение для успеха." # No force is complete without support units. From Reconnaissance to Engineers, they are crucial for success.
 LUX_auxiliary_recon: "Вспомогательная разведка" # Auxiliary Reconnaissance
 LUX_auxiliary_recon_desc: "Мы сосредоточим наши усилия на специализации «Вспомогательная разведка»!" # We shall focus our efforts on Auxiliary Reconnaissance specialisation!
 LUX_auxiliary_engineers: "Вспомогательные инженеры" # Auxiliary Engineers
 LUX_auxiliary_engineers_desc: "Мы сосредоточим наши усилия на специализации «Вспомогательный инженер»!" # We shall focus our efforts on Auxiliary Enginner specialisation!
 LUX_logistics_calculation: "Специалисты по логистике" # Logistics Specialists
 LUX_logistics_calculation_desc: "Мы должны тщательно просчитать нашу логистику, чтобы победить!" # We must carefully calculate our logistics in order to win!

 LUX_planning_primacy: "Планирование Примата" # Planning Primacy
 LUX_planning_primacy_desc: "Планирование – это цель, в которой все выиграют любую войну. Глубинное планирование провело Антанту через Великую войну, и оно поможет нам пережить следующую войну!" # Planning is the end all win all of any war. In Depth Planning brought the Entente through the Great War, and it shall bring us through the next war!
 LUX_modernised_units: "Модернизируйте наши подразделения" # Modernise Our Units
 LUX_modernised_units_desc: "Подразделения, использовавшиеся в Великой войне, доказали свою неэффективность в эпоху современных войн. Учитывая это, мы должны смотреть в будущее и готовить наши подразделения к современным боям." # The Units used in the Great War had proven themselves ineffective in the era of modern warfare. With this in mind, we must look to the future and prepare our units for modern combat.
 LUX_anti_tank_units: "Противотанковые роты" # Anti-Tank Companies
 LUX_anti_tank_units_desc: "Броня быстро превратила пехоту в доминирующую силу на поле боя. Однако не все потеряно: пехота может и победит бронетехнику, если ей будет предоставлено подходящее оружие для уничтожения бронетехники противника!" # Armour has quickly enveloped Infantry as the dominant force on the battlefield. However, all is not lost, for Infantry can and will defeat Armour if provided a suitable weapon with which to destroy enemy armour!
 LUX_modern_arty: "Поддержка артиллерийских рот" # Support Artillery Companies
 LUX_modern_arty_desc: "При построении армии не следует акцентировать внимание на артиллерии. Скорее, его следует рассматривать как подразделение поддержки, чья работа заключается в оказании помощи пехоте, а не в ее замене." # Artillery should not be focused on when constructing an army. Rather, it should be considered a support unit, one whose job is to assist infantry, not replace it.
 LUX_defencive_stratagems: "Оборонительные стратегии" # Defencive Stratagems
 LUX_defencive_stratagems_desc: "Мы сосредоточим нашу армию на оборонительных мерах." # We shall focus our army on defencive measures.
 LUX_planning_board: "Совет центрального планирования" # Central Planning Board
 LUX_planning_board_desc: "Мы должны централизовать наше высшее командование, чтобы разработать лучшие и более глубокие планы." # We must centralise our high command in order to make for better, more in depth plans.
 LUX_strength_in_planning: "Сила в планировании" # Strength In Planning
 LUX_strength_in_planning_desc: " "
 LUX_contracts: "Иностранные контракты" # Foreign Contracts
 LUX_contracts_desc: ""
 LUX_cockerill_contracts: "Бельгийский контракт на оружие" # Belgian Gun Contract
 LUX_cockerill_contracts_desc: "Джон Кокерилл производит полевые орудия оборонного назначения, которые мы можем использовать для поддержки нашей армии в наших усилиях по защите родины." # John Cockerill produces defence oriented field guns which we can use to back up our army in our efforts to defend the homeland.
 LUX_rca_contracts: "Бельгийские авиационные контракты" # Belgian Air Contracts
 LUX_rca_contracts_desc: "Renard Constructions Aéronautiques — одна из немногих бельгийских авиационных компаний в Белигуме. Если мы хотим защитить себя, нам нужно обратиться к нашим бельгийским соседям." # Renard Constructions Aéronautiques is one of the few Belgian aeronautique companies in Beligum. If we wish to defend ourselves, we need to reach to our Belgian neighbours.
