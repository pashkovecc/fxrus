 ### Intro Screen 
 SHO_splash_title: "Государство в смятении"
 SHO_splash_desc: "Кильская зона была создана для содействия полному демонтажу Германии как нации. Однако до сих пор ее существование было лишь хрупким из-за ее хрупкого положения в Европе. Такое ощущение, что каждый день страна находится на грани распада под властью той или иной радикальной группировки. К счастью, датскому гарнизону до сих пор удавалось подавлять большинство предательских действий, но их возможности ограничены. Таким образом, они позволили задержаться так называемому Полярному фрайкору, который в основном состоит из сосланных членов Железного корпуса со времени их пребывания в Прибалтике.\n\nНесмотря на присутствие как датской гвардии, так и фрайкоров, население отказывается поддаваться чему-либо, кроме полноценной революции. Независимо от того! Насилие всегда фиксировало политическую напряженность.\n\nЭто не единственная проблема, с которой сталкивается Киль, поскольку постоянные требования аннексии исходят от этого проклятого «валькистского» государства на юге. Тем временем на севере Дании обращаются с нами как с марионетками на ниточках. Если что-то и положит конец идее нейтральной Кильской зоны, это обойдется им очень дорого!"
 SHO_splash_option: "Хуже уже не будет. Верно?"
  
