 SHO_democratic_opposition: "Демократическая оппозиция"
 SHO_democratic_opposition_desc: "С тех пор, как мы пришли к власти, есть те, кто выступает против необходимых нам чрезвычайных мер, заявляя, что они не сильно отличаются от того, что сделал Дресслер в 1932 году. Они принципиально не понимают опасности нашей ситуации или великого плана, который Шлейхер имел до своего предательства. Конечно, СДПГ находится в авангарде этого оппозиционного движения. Нам нужно будет проявлять бдительность и следить за ними, поскольку они уже доказали, что являются опасным фактором в нашем политическом ландшафте."
