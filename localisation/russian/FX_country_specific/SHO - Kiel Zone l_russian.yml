 ### Events 
 kiel.1.t: "Прибытие Фрица Вольфхейма"
 kiel.1.d: "С наступлением нового года в подконтрольном мандате всё сильнее укрепляют свои позиции и смелеют экстремисты как левого, так и правого толка. Из этого пестрого сброда антилиберальных сил особенно выделяется одна группа. Сплотившись в полунелегальной Национал-коммунистической партии Германии, национал-коммунисты проповедуют националистическую, революционную идеологию, направляя всю свою лютую ненависть и гнев против правительства мандата. И что самое тревожное, согласно последние отчётам, в Киль прибыл один из их лидеров — Фриц Вольфхейм.\n\nБывший член СДПГ, Вольфхейм получил широкую известность благодаря своим радикальным взглядам среди гамбургских левых, а в особенности — благодаря сотрудничеству с Генрихом Лауфенбергом над тем, что принято называть «национал-большевизмом». Будучи ярым антипарламентарием и непримиримым противником того, что он считает реформизмом, Вольфхейм призывал к изгнанию сил Антанты в конце войны путем «революционного перемирия» с буржуазными силами, чтобы сплотить немецкий пролетариат против «англо-американского финансового капитала», олицетворением которого стало унижение Германии в Великой войне. Когда-то один из главных лидеров гамбургских левых, Вольфхейм вскоре оказался в политической изоляции и ушёл в небытие. В этот период он стал всё больше сближаться с валькизмом, особенно с его лидером Карлом-Отто Петелем, с которым у него было определённое идеологическое сходство. Тем не менее, валькистское движение отвергло Вольфхейма из-за его еврейского происхождения и твёрдой веры в коммунизм.\n\nКогда атмосфера в Германии стала совсем невыносимой для социалистов всех мастей, Вольфхейм бежал и вернулся в Кильский мандат, где всё ещё оставался его старый соратник Лауфенберг. Переписываясь и сотрудничая с Лауфенбергом по вопросам их идеологических принципов, этот дуэт теперь начал ещё активнее продвигать то, что они называют «национал-коммунизмом». Поскольку мандат продолжает страдать под англо-датским владычеством, многие начинают обращать свой взор на национал-коммунистов, задаваясь вопросом, когда же закончится оккупация."
 kiel.1.a: "Мы уверены, что это не заговор Берлина?"
  
 kiel.2.t: "Кильское восстание"
 kiel.2.d: "После нескольких недель непрерывной эскалации напряженность в Киле достигла точки кипения. Сейчас насилие, похоже, эскалируется с каждым часом: магазины грабят, а различные группировки дерутся друг с другом на улицах. Хуже всего то, что повстанцы штурмовали правительственные здания, и у руководства города практически не осталось выбора. Неясно, кто спровоцировал это восстание, хотя многие подозревают, что за хаосом стоят крайне левые боевики и оппортунисты. С другой стороны, радикальные правые использовали общий хаос для своих восстаний и резко критиковали полицию и нынешнее руководство за этот хаос. Кажется все более очевидным, что в Киле царит анархия."
 kiel.2.a: "Где находится Копенгаген?"
  
 kiel.3.t: "Храбрые солдаты"
 kiel.3.d: "Сегодня датские солдаты прибыли на окраину Киля, чтобы поддержать местные силы в их усилиях. Крупная демонстрация силы со стороны британцев и датчан встретила неоднозначную реакцию населения, но к ней стали относиться терпимо после того, как стало все более ясно, что ситуация, в которой оказалось нынешнее правительство, быстро вышла из-под контроля."
 kiel.3.a: "Ура?"
  
 kiel.4.t: "Конец кровавого Киля"
 kiel.4.d: "С прибытием дополнительных сил на места восстания и восстания в основном утихли, и в этот район возвращается порядок. Некоторые группы бежали во внутренние районы, чтобы продолжить свои террористические действия, но похоже, что в самом городе тихо. Сейчас самое время сделать вывод из этого инцидента и наконец что-то изменить в этой неблагополучной системе."
 kiel.4.a: "Уф?"
  
 kiel.5.t: "Неопределенная судьба"
 kiel.5.d: "Поскольку мандат истекает, а волнения по-прежнему высоки, нынешняя ситуация является неприемлемой. Многие в британском и датском правительстве уже считают оккупацию Киля ненужным и дорогостоящим мероприятием. Похоже, что-то скоро изменится к лучшему или к худшему."
 kiel.5.a: "Посмотрим..."
 kiel_danish_fate_tt: "§gВ связи с недавней§! §oэкономической катастрофой§!§g, поразившей§! §rБританию§!, §1Дания§! §gрешит, каким будет будущее мандата.§!"
  
 kiel.6.t: "Будущее мандата"
 kiel.6.d: "Поскольку Лондон переживает экономический коллапс, наша власть над Кильским мандатом стала совершенно несостоятельной. Таким образом, теперь нам остается решить, как мы сделаем следующий шаг в отношении наших немецких соседей. Одно из предложений состоит в том, чтобы мандат был распущен и мы полностью вышли из него. Это не только развеяло бы немецкие опасения по поводу продолжающегося иностранного господства, но и стало бы для нас гораздо более простым процессом, поскольку нам не пришлось бы защищаться от потенциального немецкого вторжения.\n\nОднако некоторые «ястребы» выступают против такой позиции. В конце концов, Германия, несомненно, готовится вернуть себе то, что она считает своим законным местом в мире. Как мы можем верить, что не разразится вторая Великая война? Тем не менее, маловероятно, что мы сможем противостоять полномасштабному вторжению Германии, так что, возможно, злить их было бы неразумным шагом?"
 kiel.6.a: "Неужели Берлин не настолько глуп, чтобы начать новую войну?"
 kiel.6.b: "Дресслеру и его головорезам нельзя доверять!"
  
 kiel.7.t: "Бюллетени судьбы"
 kiel.7.d: "Сегодня завершилось голосование, определяющее будущее Кильского мандата. После напряженного периода неопределенности и жестокой кампании различных фракций судьба Киля была предрешена. Хотя многие наверняка будут недовольны результатами, похоже, что бюллетени подсчитаны и результаты очевидны."
 kiel.7.a: "Киль – свободный город отныне и навсегда!"
 kiel.7.b: "Германия – наша Родина!"
  
 kiel.8.t: "Этого не может быть!"
 kiel.8.d: "Когда бюллетени были подсчитаны и все было сказано и сделано, результаты стали шоком для всех участников. К ужасу жителей Киля, оказалось, что люди желали возвращения в Германию Дресслера.\n\nНо почему? Как? Был ли это сфальсифицированный заговор валькистских лазутчиков? Где были те, кто выступал против валькистов? Нет никаких сомнений в том, что Германия жестоко отомстит почти всем политическим фракциям в Киле, не говоря уже о том, что возвращение в Германию может привлечь Великобританию или, возможно, даже Антанту!\n\nИсходы референдума уже осуждены левыми, а коммунисты и социал-демократы осуждают результаты как сфальсифицированные и призывают народ сопротивляться любой попытке Германии захватить Киль. Поскольку правительство потеряло большую часть своей легитимности, есть только один вариант действий, который можно предпринять, не разжигая войну..."
 kiel.8.a: "Позвоните по телефону из Лондона... и Копенгагена одновременно!"
 kiel_valkism_tt: "§5Поскольку Германия является реваншистской, тоталитарной экспансионистской державой, которая хочет доминировать над всей Европой и разрушить нынешний мировой порядок, мы можем ожидать, что§! §rБритания§! §5и§! §1Дания§! §5 быстро вмешаются.§!"
  
 kiel.9.t: "Антивалькистский фронт"
 kiel.9.d: "Когда и Лондон, и Копенгаген выступили против любого объединения Германии и Киля, Берлин был вынужден отступить. Однако это только сделало Киль более изолированным, чем когда-либо прежде, поскольку ни Великобритания, ни Дания не хотели возвращаться к неуправляемому населению, которое праздновало их уход.\n\nХотя существование Киля, возможно, на данный момент не подвергается сомнению, правление правительства, скорее всего, было. Подкрепленный опасениями немецкой агрессии и продолжающимся расколом правых между сторонниками и противниками валькизма, между социал-демократами и коммунистами сформировался антивалькистский фронт. Благодаря неожиданному росту популярности после сопротивления аннексии Германии, единый фронт взял на себя управление Ландтагом, теперь удерживая бразды правления.\n\nКиль снова пал от революции."
 kiel.9.a: "Долой валькизм!"
 kiel_socialism_tt: "§OПобеда народа не означает, что левые заключили мир.§! §rСоциал-демократам и коммунистам есть о чем спорить...§!"
  
 kiel.10.t: "Левая разобщенность"
 kiel.10.d: "Социалисты захватили Ландтаг. Однако в истинно социалистическом духе существует раскол в отношении судьбы нового социалистического государства. Социал-демократическая партия желает социал-демократической республики, подобной той, которая существовала в Германии до прихода к власти валькистов, в то время как коалиция радикальных партий, возглавляемая Коллективистской арбайтерпартией, предлагает полноценное большевистское государство в знак солидарности с нашими советскими братьями для дальнейшего развития более широкой мировой революции. В каком направлении пойдут рабочие, предстоит решить предстоящему съезду."
 kiel.10.a: "Социал-демократия подвела Германию!"
 kiel.10.b: "Московских марионеток терпеть не будут!"
  
 kiel.11.t: "Свободный город"
 kiel.11.d: "В то время как левое крыло спорит между собой, а крайне правые желают продать Киль Дресслеру, многие изгнанники из высшего класса и промышленники Киля сформировали свой собственный избирательный блок. Вместе со многими бывшими членами кабинета Шлейхера они обладают не только средствами, но и связями для создания сильного государства, противостоящего Дресслеру. Теперь, когда Свободный город создан, националистам необходимо найти союзников, чтобы сформировать правящее большинство. К местным консерваторам и фермерским союзам обратились, их поддержка практически гарантировала националистам удержание власти. Однако они не хотят наделять полномочиями этих отпрысков павшей Веймарской республики, которые не смогли спасти свою старую нацию от катастрофы."
 kiel.11.a: "У этих изгнанников есть опыт..."
 kiel.11.b: "Что они знают о Шлезвиге?"
  
 kiel.12.t: "Правительство города"
 kiel.12.d: "Теперь, когда безопасность нового государства обеспечена, нам предстоит определиться с формой нашего правления. Некоторые утверждают, что нам следует сохранить чрезвычайное положение Шлейхера и править с помощью чрезвычайных указов, ссылаясь на концепцию «Нового государства» Папена. Однако это приведет к созданию авторитарной республики, в чем другие видят авторитаризм, сродни валькизму, и предательство доверия народа и его политических ценностей. Впрочем, никто не может отрицать, что Киль находится в таком положении, когда парламентский паралич и бесконечные дебаты — это роскошь, которую мы не можем себе позволить."
 kiel.12.a: "Нужна твердая рука"
 kiel.12.b: "Мы не опустимся до уровня Дресслера!"
  
 kiel.13.t: "Триумф аграриев"
 kiel.13.d: "Недоводные тем, как их игнорировало правительство, где доминировали горожане, фермеры Шлезвиг-Гольштейна взяли штурмом Ландтаг и заставили «городское» правительство уйти в отставку. Теперь, когда победившие крестьяне собрались у здания Ландтага, их временное правительство, возглавляемое шатким единым фронтом умеренной Ландеспартай и радикального Ландфолька, разрабатывает дальнейшие планы. Провинция, ставшая целой страной, гадает, что принесёт ей будущее."
 kiel_landespartei_option: "Слава нашему храброму народу!"
 kiel_landvolk_option: "Мы больше не будем подчиняться диктату Берлина!"
  
 kiel.14.t: "Похороны Фридриха Фердинанда"
 kiel.14.d: "Покойный Фридрих Фердинанд, герцог Шлезвиг-Гольштейн-Зондербург-Глюксбург, гражданин города Киля, бывший дворянин и претендент на престол Шлезвиг-Гольштейна, скончался в доме Эккернфёрде на прошлой неделе в возрасте 80 лет. Его желанием было устроить пышные похороны в Киле, но для этого потребуется одобрение мэра."
 kiel.14.a: "Что плохого в небольшом снисхождении?"
 kiel.14.b: "Ради бога, мы не живем в 1871 году!"
  
 kiel.15.t: "Бедственное положение народа"
 kiel.15.d: "Сельский класс в Киле силен и составляет значительную часть населения. Однако временный характер мандата и недавний экономический кризис лишь еще больше погрузили фермеров в нищету с неоспоримым побочным эффектом в виде их широко распространенного недовольства нынешним правительством.\n\nДля многих партией, на которую направлено их недовольство, является традиционалистская Ландеспартей, социальная консервативная партия местных жителей, которая следует сельским интересам и проводит изоляционистскую политику. Их основная демографическая группа – это фермеры и землевладельцы, которые сторонятся как левых, так и правых радикальных националистов. К несчастью для них, их продолжающаяся неспособность влиять на политику в пользу сельского класса привела к тому, что многие разочаровались в том, что многие считают дряхлой реакционной партией.\n\nПоэтому многие фермеры теперь бежали в Сельское народное движение, более известное в просторечии как Ландволк. Это движение представляет собой крайне правое националистическое движение, которое когда-то было выдающейся политической силой в земле Шлезвиг-Гольштейн до возникновения валькизма. Движение Ландволк является яростно антизападным, обладает радикально-реакционным характером и в значительной степени находится под влиянием народнических убеждений о кровном и почвенном национализме.\n\nХотя Ландеспартей определенно является основной аграрной партией, Ландволк в последние годы восстановил влияние, и обе партии уже сотрудничают по ряду вопросов. Поскольку Киль продолжает потрясать угроза революции и аннексии, среди сельского класса образовался раскол. Хотя их размер, существующее влияние и связи могут принести им пользу, многие предсказывают, что сравнительно умеренная Ландеспартай, скорее всего, скоро впадет в немилость, поскольку фермеры будут продолжать расти все более недовольными, особенно когда популистская и революционная риторика Ландфольк продолжает привлекать все больше и больше людей."
 kiel.15.a: "Всегда нужно идти на компромисс..."
 kiel.15.b: "Хватит с нас этих чертовых политиков!"
 kiel_landespartei_tt: "§5Несмотря на тяжелое положение, сельское население продолжает поддерживать §!§cЛандеспартай§!."
 kiel_landvolk_tt: "§5Из-за продолжающейся слабости §!§cЛандеспартай§!§5, §!§NЛандфольк§! §5приобретает огромную популярность.§!"
  
 kiel.16.t: "Внеочередная сессия Немецкого народного конгресса."
 kiel.16.d: "Народ стоит победителем! Киль был спасен из лап империализма и валькизма. Таким образом, объединенное левое движение призвало созвать внеочередной Конгресс для формирования в Киле настоящего социалистического правительства, готового к трудностям, с которыми теперь предстоит столкнуться молодому государству. Несмотря на первоначальный мир, вскоре сформировались различные фракции, которые раскололи конгресс и чуть не привели к тупику. Тремя крупнейшими являются коммунисты во главе с Вильгельмом Пиком, национал-коммунисты под руководством Генриха Лауфенберга и коммунистическая оппозиция во главе с Генрихом Брандлером. После долгих дебатов, бесчисленных компромиссов и даже драки у главного входа наконец-то может быть объявлено новое руководство. Для освобождения народа от валькизма съезд постановил, что..."
 kiel.16.a: "Нашу нынешнюю траекторию необходимо сохранить!"
 kiel.16.b: "Национальное решение является обязательным для свободы Германии."
 kiel.16.c: "Нынешний курс совершенно неустойчив."
 kiel_collec_tt: "§5Поскольку настроения меняются в пользу §! §rКоммунистической рабочей партии§!§5, нынешнее правительство §! §Gостается у власти.§!"
 kiel_natcol_tt: "§5Поскольку настроения меняются в пользу §! §oНационал-коммунистической партии§!§5, нынешнее правительство§! §tне останется у власти.§!"
 kiel_libsoc_tt: "§5Поскольку настроения меняются в пользу §! §oСоциалистической рабочей партии§!§5, нынешнее правительство§! §tне останется у власти.§!"
  
 kiel.17.t: "Вход Киля в [This.GetFactionName]"
 kiel.17.d: "Делегация [SHO.GetAdjective]их политиков прибыла сюда, в г. [Root.Capital.GetName], чтобы обсудить включение их в [Root.GetFaction]. [SHO.GetAdjective]ое правительство стремится установить с нами официальный союз. Должны ли мы принять их предложение?"
 kiel.17.a: "Мы были бы дураками, если бы не приняли"
 kiel.17.b: "Они нам не нужны..."
  
 kiel.18.t: "Сделка с Килем"
 kiel.18.d: "Молодое правительство в Киле предложило работать вместе с нами против экспансионизма Рейха. Они думают, что мы могли бы заключить плодотворную деловую и оборонную сделку. Однако многие в нашем правительстве указали на сохраняющиеся у нас территориальные споры, а также на сомнительный непрофессиональный характер их правительства и посоветовали нам сохранять нейтралитет в этом вопросе. Теперь нам решать, как мы поступим с нашими молодыми южными соседями."
 kiel.18.a: "Берлин — общий враг."
 kiel.18.b: "Если они хотят нашего молчаливого согласия, мы потребуем Фленсбурга."
 kiel.18.c: "Ещё чего?"
  
 kiel.19.t: "Налоговые декларации по Кильскому каналу"
 kiel.19.d: "Правительство Киля объявило о возврате сборов со всех иностранных судов, заходящих в Кильский канал. Плата за канал прекратилась в 1920-х годах, чтобы стимулировать экономику стран Балтии. Судоходные компании уже требуют от нас какой-то помощи в условиях этих радикальных перемен."
 kiel.19.a: "Проклятые паразиты!"
  
 kiel.20.t: "Кильский канал затоплен"
 kiel.20.d: "Сегодня в результате неожиданного поворота событий диверсионный отряд Кильских сил обороны разрушил Кильский канал. В своей борьбе против Германии военные решили лишить Германию и особенно немецкий флот этого важного участка инфраструктуры, сделав его бесполезным для коммерческих и военных судов. Разрушение канала также затопило окружающие низменности, образовав огромную территорию болот, которая будет препятствовать любому быстрому продвижению. Эти меры доказывают отчаянный характер борьбы, которую ведет кильская армия, и мы, вероятно, увидим новые акты саботажа и партизанской войны, в то время как немецкие войска продвигаются день за днем."
 kiel.20.a: "Германия деградирует дальше."
  
 kiel.21.t: "Просьба из Киля"
 kiel.21.d: "Мы приняли посланников из Киля, предлагающих поддержку нашему союзу. Они ссылаются на наших общих врагов и позволяют нашему человеку разместиться в их стране. Тем не менее, это будет еще одна нация, которую нам нужно будет защитить, и они наверняка будут ожидать, что мы поддержим их небольшие вооруженные силы. Нам нужно решить, стоит ли оно таких затрат."
 kiel.21.a: "Заходите!"
 kiel.21.b: "Зачем нам эти фермеры?"
  
 kiel.22.t: "Крах Нового Кильского банка"
 kiel.22.d: "После недавнего краха в Лондоне Новый Кильский банк, который по большей части заменил Рейхсбанк после создания Кильской зоны и самый важный банк во всей Шлезвиг-Гольштейне, также рухнул, разрушив вместе с ним и нашу экономику."
 kiel.22.a: "Мы должны готовиться к худшему!"
  
 kiel.23.t: "Шлезвигский Совет"
 kiel.23.d: "Тревожные новости пришли сегодня к нам из Киля. Похоже, что эксперимент в Шлезвиге действительно провалился. После провала референдума радикальные левые группы штурмовали мэрию и захватили жизненно важные объекты инфраструктуры. При поддержке населения и местных социал-демократов вооруженные силы и оставшиеся у нас войска решили не продолжать эскалацию насилия дальше. Хотя положительным моментом является то, что Киль по-прежнему настроен против Германии, эти события поставили нашу администрацию в неловкое положение."
 kiel.23.a: "Это не сулит ничего хорошего..."
  
 kiel.24.t: "Социалистическое восстание в Германии"
 kiel.24.d: "Товарищи ликуйте! Сегодня наши братья и сестры восстали против тирании Дресслера и Валькизма, Красные знамена развеваются над городами Севера. Рабочие, фермеры, интеллектуалы и солдаты — все присоединяются к совместной борьбе за свою свободу. С этого дня угнетатели наконец предстанут перед правосудием."
 kiel.24.a: "К финальной борьбе!"
  
 kiel.25.t: "Социалистическое восстание на Севере!"
 kiel.25.d: "Сегодня предательские элементы восстали против нашей полиции, погрузив многие города на севере Рейха в хаос. С этими террористами необходимо срочно разобраться. Мы прикажем нашей армии и полиции стрелять на месте, социалистическая гниль уже давно гниет при старой системе, пора их наконец искоренить. Со своими ошибками столкнется и некомпетентное руководство местной полиции и гарнизона."
 kiel.25.a: "Мы защитим Германию от большевизма!"
  
 kiel.26.t: "Киль просит о поддержке против Германии"
 kiel.26.d: "Сегодня прибыла делегация из Киля. Город является одной из территорий, ожесточенных спорами после окончания Великой войны, и его статус в настоящее время неясен. Их недавно созданному независимому правительству угрожает немецкий реваншизм, и поэтому их делегация заявляет, что они ищут союзников с общими интересами, особенно в сдерживании валькизма. Хотя мы, конечно, могли бы использовать базу, расположенную недалеко от немецких портов, маленькое государство Киль очень уязвимо, и на данный момент немногие страны даже признают его. Принятие этого предложения может оказаться дипломатической авантюрой."
 kiel.26.a: "Германию необходимо сдержать!"
 kiel.26.b: "Абсурдное предложение"
 # hier
 kiel.27.t: "[From.GetName] отправляет поддержку"
 kiel.27.d: "Государство [From.GetName] услышало наши призывы о помощи. После долгих переговоров мы пришли к соглашению, которое предоставит нам столь необходимые материалы и оборудование для наших военных действий. Мы, конечно, в долгу перед ними, но на данный момент оружие — единственное, что сохранит жизнь нашей нации."
 kiel.27.a: "Уф!"
  
 kiel.28.t: "[From.GetName] отказывается от поддержки"
 kiel.28.d: "Государство [From.GetName] отклонило наши просьбы о помощи. Они заявили, что не могут выделить никакой техники для нашего обреченного дела, как они его называют. Любая аренда земли или другая материальная помощь не только создаст нагрузку на их и без того испытывающую трудности экономику, они также опасаются, что военные секреты могут попасть в руки Германии. [From.GetAdjective]ая делегация поздравила нашу храбрость, но в конечном итоге отправила наших людей обратно с пустыми руками."
 kiel.28.a: "Они скоро об этом пожалеют"
  
 kiel.29.t: "Киль предлагает договор о взаимной обороне"
 kiel.29.d: "Сегодня дипломаты из Киля обратились к нашим контактам с предложением сформировать взаимный оборонительный союз, чтобы ограничить любую дальнейшую агрессию валькистов. Они заявляют, что наши страны получат взаимную выгоду от такого соглашения, которое могло бы стать основой для будущего сотрудничества. Хотя это маленькое государство, безусловно, преследует благородные цели, оно стратегически изолировано, и наше признание их статуса и любое соглашение могут спровоцировать дипломатический кризис в отношениях с Германией и ее союзниками."
 kiel.29.a: "Долой валькизм!"
 kiel.29.b: "Датчане не немцы!"
  
 kiel.30.t: "[From.GetName] принимает"
 kiel.30.d: "Сегодня государство [From.GetName] приняло наше предложение о заключении договора о взаимной обороне. После нескольких дней напряженных секретных переговоров наши страны пришли к взаимопониманию. [From.GetAdjective]ое правительство теперь официально признало и подписало все документы, официально подтверждающие договор. После того как публичное заявление было сделано в национальных газетах, Германия немедленно заявила дипломатический протест. Благодаря тщательной подготовке пограничные конфликты и беспорядки со стороны местных валькистских группировок были сведены к минимуму."
 kiel.30.a: "Берлин скоро станет нашим"
  
 kiel.31.t: "[From.GetName] отказывается"
 kiel.31.d: "Сегодня государство [From.GetName] отклонило наши предложения, хотя изначально они симпатизировали нашему делу, но в качестве основной причины своего отказа они ссылались на присущую им опасность и возможность дальнейшей эскалации с Германией и ее союзниками. Хотя эта обеспокоенность понятна, они также продолжали утверждать, что наша небольшая армия и промышленность не добавят никакой ценности их делу против Германии. Дипломатическая встреча носила чисто неформальный характер, и [From.GetAdjective]ое правительство объяснило на пресс-конференции, что они признают только нейтралитет Киля, мандата Лиги Наций, но не более того."
 kiel.31.a: "Их потеря"
  
 kiel.32.t: "Восстание против правительства!"
 kiel.32.d: "До нас дошли новости о том, что в крупных городах рейха вспыхнули различные восстания. Хорошо подготовленные нападения на нашу инфраструктуру и правительственные здания обезглавили командную цепочку в этих районах и сделали наши подавленные и застигнутые врасплох полицейские беспомощными. Наша разведывательная служба подозревает, что за восстанием стоит иностранное подстрекательство, и обнаружила следы крупномасштабной контрабанды оружия через наши границы. С этими предателями нужно будет разобраться как можно скорее, пока мы раскрываем сети, стоящие за всем этим. Пока мы говорим, наши войска приближаются."
 kiel.32.a: "Будь прокляты эти непримиримые люди!"
  
 kiel.33.t: "Мир с Килем?"
 kiel.33.d: "К сожалению, похоже, что наша война против правительства Киля пошла не по плану. Поскольку их войска продолжают продвигаться в Данию, они послали послание мира, требуя, чтобы они получили репарации и гарантии того, что они будут в безопасности в войне против Германии с нашей стороны границы."
 kiel.33.a: "Они победили..."
 kiel.33.b: "Мы не позволим каким-то запрыгавшим немцам диктовать смешные условия."
 kiel.33.c: "Считают ли они себя машинами для убийств?"
  
 kiel.34.t: "[From.GetName] требует белого мира"
 kiel.34.d: "Наша просьба о благоприятном мире, похоже, была отвергнута [From.GetAdjective]им правительством, которое вместо этого потребовал, чтобы мы просто приняли белый мир. Хотя это и прискорбно, это было бы лучше, чем пытаться в одиночку победить их великую силу."
 kiel.34.a: "Лучше перестраховаться, чем потом сожалеть..."
 kiel.34.b: "Пфф, мы можем с ними справиться!"
  
 kiel.35.t: "Закрытие Кильского канала"
 kiel.35.d: "Сегодня правительство-претендент на оккупированном севере объявило, что закроет Кильский канал для международного судоходства, сделав исключения только для сил, союзных городу. Эта акция явно направлена ​​против нас и фактически не позволяет нам объединить наши Северный морской и Балтийский флоты без захода в британские и датские воды. Более того, это решение также наносит ущерб нашим оставшимся гражданским судоходным линиям, которые теперь снова сталкиваются с блокадой практически по сути. Гавани на востоке нашей страны уже ощущают экономические последствия, и в этих городах распространяются волнения."
 kiel.35.a: "Эти имперские болонки рано или поздно предстанут перед правосудием..."
  
 kiel.36.t: "Военный атташе в Киле?"
 kiel.36.d: "Теперь, когда мы сформировали надлежащее правительство и начали набор надлежащей армии, мы столкнулись с рядом трудных решений и проблем. Рейхсвер сосредотачивает войска у нашей границы, и становится все более очевидным, что наши молодые и неопытные силы не смогут им противостоять. Некоторые в нашей администрации предлагали нам обратить внимание на французов, которые добились больших успехов в создании Рейнской армии из простого ополчения. Возможно, мы могли бы повторить это развитие и в Киле. Однако в наших рядах есть те немногие профессиональные военные, которые ненавидят французов со времен Великой войны и настаивают на том, что мы вообще не нуждаемся в их помощи. Теперь это зависит от нашего руководства."
 kiel.36.a: "Нам необходимо и дальше сдерживать Боче!"
 kiel.36.b: "Эти головорезы не заслуживают нашего уважения!"
  
 kiel.37.t: "Французский военный атташе"
 kiel.37.d: "Франция приняла нашу просьбу и направила в Киль небольшой отряд. Эти люди уже имели опыт перевооружения в Рейнской области и теперь сделают все возможное, чтобы помочь нашим усилиям. Это было встречено с возмущением консервативными элементами внутри нашего государства, но это то, к чему французы еще не привыкли за время своего пребывания в Рейнской области. Их опыт и контакты окажут большую помощь нашим военным усилиям."
 kiel.37.a: "Это должно держать Берлин под контролем!"
  
 kiel.38.t: "Парижское предательство"
 kiel.38.d: "Едкие замечания бывших сотрудников рейхсвера можно было услышать, когда в залах Ландтага было объявлено, что французы без особых раздумий отклонили нашу просьбу. Похоже, что мы предоставлены сами себе, когда дело доходит до наращивания военной мощи."
 kiel.38.a: "Чего мы ожидали от этих лягушатников?"
  
 kiel.39.t: "Социалистический всплеск"
 kiel.39.d: "С провалом Второго Кильского восстания национал-коммунистам был нанесён сокрушительный удар. Упустив возможность освободить немецкий народ, радикальные группировки как левого, так и правого толка утратили прежний импульс. Однако образовавшийся вакуум популярности, к сожалению, был заполнен лишь конкурирующими радикальными партиями.\n\nОдной из партий, существенно выигравших от этих изменений, стала Социалистическая рабочая партия. Бывший председатель КПГ, а ныне председатель САП Генрих Брандлер составил себе имя в Киле, который превратился в оплот революционных левых сил. На фоне подъёма ультраправых в Германии САП отстаивает стратегию антивалькистского «народного фронта», при которой все левые партии объединяются для противостояния правым силам. Эту политику также стойко поддерживает Август Тальгеймер — ещё один ветеран-коммунист, выступающий в роли «мозгового центра» САП.\n\nПо мнению Тальгеймера, установление антипарламентских диктатур, напоминающих то, что он называет «бонапартизмом», является шагом к валькизму; он сравнивает приход Дресслера к власти с возвышением Наполеона во Франции в эпоху революции. Таким образом, единый фронт пролетариата против ультраправых сил, которых он считает буржуазной попыткой удержать власть, является для коммунистических сил наилучшим способом прийти к власти. Кроме того, он считает «ультралевую» фракцию КПГ виновной в том, что партия не смогла помешать возвышению Дресслера, что ещё сильнее отдаляет его от бывших соратников.\n\nПодобная позиция естественным образом противопоставила обе партии друг другу, особенно учитывая недоверие САП к Москве, которая направляет значительную помощь и поддержку остаткам КПГ."
 kiel.39.a: "Ничего похожего на борьбу между левыми."
  
 kiel.40.t: "Раскрыта контрабандная операция"
 kiel.40.d: "Во время плановой проверки полицией канала была обнаружена неопознанная партия грузов с военными припасами. Поскольку все оружие и оборудование лишены каких-либо заметных маркировок, трудно определить их происхождение. Тем не менее, многие внутри корпуса подозревают, что они могут происходить из [GER.GetName], расположенного к нашему югу. Среди других подозреваемых - датчане, которые, возможно, пытаются восстановить свой контроль над Килем. Однако мы не можем выдвигать ложные обвинения, и поэтому нам придется выбирать, с какой нацией противостоять по этому вопросу."
 kiel.40.a: "Это явно делает валькистский сброд!"
 kiel.40.b: "Приведите ко мне посла Дании, ему придется это объяснить!"
  
 kiel.41.t: "Аудиенция у немецкого посланника"
 kiel.41.d: "Представитель Рейха был вызван во дворец и после непродолжительного допроса отверг все обвинения. Однако он предупредил нас, что увеличение наших пограничных сил может привести к нежелательной эскалации, и посоветовал нам отказаться от этого вопроса."
 kiel.41.a: "Кем этот сумасшедший себя возомнил?"
  
 kiel.42.t: "Аудиенция у посла Дании"
 kiel.42.d: "Посол Дании был вызван во дворец, и хотя короткий допрос не дал нам ответов, которые мы искали, посол пообещал нам, что они ужесточат пограничную охрану, чтобы гарантировать, что никакие поставки оружия или других нелегальных товаров не смогут проникнуть в нашу страну со своей границы."
 kiel.42.a: "Ну ладно тогда."
  
 kiel.43.t: "[SHO.GetAdjective]ие солдаты вошли в Гамбург"
 kiel.43.d: "Пока мы втянуты в гражданскую войну, кажется, что болонки Парижа и Лондона не остались без дела. Поскольку наша неспособность обеспечить безопасность Гамбурга и ганзейского города находится под угрозой осады и войны, [SHO.GetName] вошел в страну при редкой совместной поддержке Британии и Франции, в результате чего мы не смогли эффективно отреагировать. Тем не менее, они заплатят в свое время."
 kiel.43.a: "Будь они прокляты!"
  
 kiel.44.t: "Шпион из Берлина?"
 kiel.44.d: "С тех пор, как мы пришли к власти, наше правительство оказалось в трясине обвинений со стороны наших предполагаемых левых союзников в том, что мы не более чем «социалкисты», ничем не отличающиеся от Дресслера и его головорезов на юге. Хотя это явно неправда, нам трудно отрицать эти обвинения, особенно когда широко известно о связи Вольфхайма с Пэтелом.\n\nОднако мы столкнулись с другой проблемой, которая даже более насущна. После наших переговоров и последующего компромисса с заблудшими валькистами Киля из нескольких источников стало известно, что министр государственной безопасности Юпп Ховен является шпионом Берлина. Такое обвинение, естественно, превратилось в масштабный скандал во всем коммунистическом мире, еще больше изолируя нас от наших предполагаемых союзников в освобождении трудящихся.\n\nТеперь мы стоим перед выбором. Если мы освободим Ховена, это только продемонстрирует, что мы не более чем пешки большевиков, неспособные даже защитить немцев от фантастической лжи. Однако отказ отпустить Ховена, чьи предполагаемые связи с Абвером трудно опровергнуть, вероятно, лишит нас помощи, в которой мы так отчаянно нуждаемся, если мы хотим освободить Германию."
 kiel.44.a: "Герр Ховен должен уйти ради блага немецкого народа."
 kiel.44.b: "Это сплошная клевета!"
  
 kiel.45.t: "Навсегда неделимый"
 kiel.45.d.start: "Когда тираны Берлина пришли свергнуть нас, мы приготовились к великой борьбе. Борьба, которая затмила всю борьбу, с которой сталкивались мы и наши предки раньше. Даже если бы на нашей стороне была решимость, мало кто ожидал, что наше крошечное государство сможет противостоять натиску террора, развязанному Берлином и его чудовищными головорезами.\n\n"
 kiel.45.d_landespartei: "$kiel.45.d.start$И все же мы выдержали. Падение правительства в Берлине — еще одна гарантия того, что земля Шлезвиг-Гольштейн останется свободной, а фермеры и крестьяне смогут продолжать жить в гармонии и свободе.\n\nОднако все оказалось не так просто. Омерзительные социал-демократы теперь вернулись с окончанием войны, обещая завоевать мир, который мы так милостиво и покорно им принесли. Поскольку экзистенциальная угроза нашему югу на данный момент нейтрализована, похоже, что мы столкнулись с еще одной угрозой в самом Ландтаге. Однако какую бы судьбу нам ни приготовила, мы можем быть спокойны, зная, что ее определит наш народ."
 kiel.45.d_landvolk: "$kiel.45.d.start$Несмотря на это, мы смеялись последними. Теперь, когда Германия побеждена и, вероятно, вскоре разделена, земля Шлезвиг-Гольштейн наконец-то победила ненавистников свободы в Берлине. Раз и навсегда фермеры нашего великого государства снова смогут жить в мире и свободе без диктата каких-либо столичных тиранов, заставляющих нас подчиняться их модернистской программе.\n\nК сожалению, это не так. Поскольку наше существование, по крайней мере на данный момент, обеспечено, несчастные рабочие, купцы и интеллигенция городов выступили и потребовали, чтобы мы ослабили контроль над государством. Однако, хотя их сопротивление не следует воспринимать легкомысленно, мы можем расслабиться, зная, что народ земли Шлезвиг-Гольштейн свободен решать, что будет дальше."
 kiel.45.a: "Мы удержали полосу единства!"
  
 kiel.46.t: "Выборы в Ландтаг [GetYear] года"
 kiel.46.d: "Наконец пришло время народу Шлезвиг-Гольштейна решить, каким будет новое правительство. Прошедшие годы во многом предопределили, какая из партий обладает достаточной популярностью и влиянием, чтобы направить новое государство по тому или иному пути. На кону все 70 мест, и единственный оставшийся вопрос — кто же встанет у руля?"
 kiel.46.a: "Социал-демократы формируют новое правительство!"
 kiel.46.b: "«Ландеспартай» сформирует новое правительство!"
 kiel.46.c: "Левые либералы и социал-демократы формируют коалицию!"
 kiel.46.e: "Альянс правых сил получает большинство!"
  
 kiel.47.t: "Президентские выборы [GetYear]"
 kiel.47.d: "С возвращением демократии в Шлезвиг-Гольштейн пришло время народу решить, кто будет президентом нашего нового государства. Хотя пост президента, по-видимому, является высшей должностью в республике, фактическая власть президента, мягко говоря, недостаточна. Следовательно, партии решили поддержать тех, кто доказал свою популярность, будь то из-за их широкой привлекательности или своих прошлых действий. Когда бюллетени подсчитываются ночью, становится ясно, что..."
 kiel.47.a: "Юлиус Лебер набирает наибольшее количество голосов!"
 kiel.47.b: "Антон Шифферер одерживает победу на выборах!"
 kiel.47.c: "Хинрих Лозе одержал уверенную победу!"
 kiel.47.e: "Карл Шретер завоевал волю народа!"
 kiel.47.f: "Вильгельм Хамкенс добивается превосходства на выборах!"
  
 kiel.48.t: "Будущее движения"
 kiel.48.d: "Мы продвинулись далеко, превратившись из маргинального движения разочарованных фермеров и крестьян, возглавляемых террористами, в освободителей народа земли Шлезвиг-Гольштейн. Мы создали государство, управляемое народом, устойчивое к махинациям интернационалистической клики, которая пытается навязать либеральную чепуху нашему народу, но не может жестоко использовать нас и эксплуатировать.\n\nОднако теперь мы столкнулись с определенной проблемой. Хотя в прошлом мы, возможно, и критиковали политиков и их коварные парламентские трюки, устранение Германии как одной из великих держав привело к тому, что движение умерилось гораздо быстрее, чем мы первоначально надеялись. Умеренные как внутри, так и за пределами движения призвали правительство, наконец, объявить выборы и поддержать волю народа, которого оно, как утверждается, представляет и возглавляет.\n\nИзлишне говорить, что это вызвало резкую реакцию со стороны радикалов движения, которые утверждают, что парламентская демократия является несостоятельной системой и будет лишь приглашать империалистов всего мира опустошать народ и разрушать всякое подобие порядочности и морали. Несмотря на это, такое разжигание страха уже было описано как таковое, и, учитывая ужасы валькизма, его ответвлений и предшественников, должны ли мы действительно так быстро отвергать демократию?"
 kiel.48.a: "Мы не можем жить прошлым."
 kiel.48.b: "Мы никогда больше не бросим наш народ в адский огонь парламентаризма!"
  
 kiel.49.t: "Неизбежное противостояние"
 kiel.49.d.start: "С самого момента создания мандата многие наблюдатели раз за разом предсказывали его неизбежный крах. И хотя многие пророчили, что ликвидация мандата вернёт Шлезвиг-Гольштейн в состав Рейха, время доказало обратное. С приходом к власти ультраправых сил, одержимых идеей снова ввергнуть Германию в заведомо проигрышную войну и ведомых тиранами, стремящимися уничтожить всё, что дорого немецкому народу, война с Берлином казалась неизбежной — если только жители Шлезвиг-Гольштейна не были готовы пожертвовать своей свободой.\n\n"
 kiel.49.d_communist: "$kiel.49.d.start$Теперь, когда южные ублюдки объявляют о «восстановлении порядка» в Шлезвиг-Гольштейне, для немецкого пролетариата пришло время свергнуть злодейский режим, который слишком долго терзал Германию. В 1919 году солдаты и матросы Киля свергли своих господ, освободив себя и едва не распространив революцию по всей Германии, пока свирепые фрайкоровцы жестоко не удушили рабочую революцию в зародыше. И пусть с тех пор мы столкнулись с множеством неудач, этому пришёл конец! Даже если реакционеры удерживают большую часть Германии, мы не отступим от своей революционной миссии!"
 kiel.49.d_nationalist: "$kiel.49.d.start$Похоже, теперь Берлин обратил взор на нас, обещая «освободить» народ бывшего мандата. Какую бы «революцию» ни пытался претворить в жизнь Берлин, она принесла и может принести немецкому народу лишь разруху, нищету и безысходность. Прямо сейчас предатели продолжают плодить абсурдную ложь, чтобы втянуть немецкий народ в безнадёжную войну. Теперь на нас лежит обязанность помешать им поработить немецкий народ — будь то из-за их злого умысла или некомпетентности. Даже если Берлин обладает огромным материальным превосходством, мы не будем прятаться. Они уничтожили Республику — а мы изгоним их самих!"
 kiel.49.d_regionalist: "$kiel.49.d.start$Освободив наш народ от ига мандата, мы сталкиваемся с новым врагом. Следовало ожидать, что Берлин не способен даже помыслить о свободном народе, не в силах постичь никакой иной модели управления, кроме беспощадного гнёта как крестьян, так и рабочих. Теперь они обратили свой взор на нас, обещая «освободить» прекрасный народ нашей страны. И пусть на нас нацелена огромная армада танков, самолётов и артиллерии, нас не запугать и не заставить сдаться. В отличие от берлинских рабовладельцев, мы понимаем, что на самом деле значит быть свободными. Мы будем свободны — так же, как были свободны наши отцы."
 kiel.49.a: "Мы не дрогнем!"
  
 kiel.50.t: "Новый рассвет"
 kiel.50.d: "По мере развития нашего государства пришло время окончательно закрепить в законе то, как оно должно управляться. Теперь, когда угроза с юга в основном миновала, а наша независимость обеспечена, демократические силы за пределами «Ландеспартай» всё смелее призывают к нашей отставке или, как минимум, к отмене чрезвычайного положения, действующего с момента нашего прихода к власти.\n\nПодобные призывы достигли апогея: социал-демократы и либералы действуют сообща, чтобы принудить нас к назначению новых выборов, пусть даже руководство «Ландеспартай» и сомневается в демократии. Не в силах больше сдерживать демократическую волну, мы видим, как демократия окончательно возвращается в Шлезвиг-Гольштейн, и судьба нации вновь решается у избирательных урн."
 kiel.50.a: "Вперёд!"
 kiel_democracy_tt: "§5Выборы в Ландтаг состоятся через 1 месяц, а президентские выборы — месяцем позже.§!"
  
 kiel.51.t: "Парламентский сдвиг"
 kiel.51.d: "Наше решение наконец назначить выборы вызвало тектонический сдвиг на политической арене. Многие удивлены тем, что мы позволяем сместить себя партиям, не столь осведомлённым об интересах Шлезвиг-Гольштейна, как мы. Победа умеренных внутри движения привела к объединению с остатками Национального крестьянского союза и созданию новой Сельской народной партии.\n\nЭтот шаг не остался незамеченным: слияние двух главных правых партий посеяло панику среди левых и их либеральных союзников. В ответ на это социал-демократы и левые либералы сформировали новый «Демократический союз» в оппозицию нашему правительству, обещая дальнейшую демократизацию Шлезвиг-Гольштейна. Возможно, единственным плюсом этого шага стало то, что радикалы прежнего движения перешли в новую партию, хотя от них по-прежнему стоит ждать своенравия."
 kiel.51.a: "Да будет так"
  
 kiel.52.t: "Зеленый Барон"
 kiel.52.d: "Даже если нам хотелось бы думать, что весь Киль поддерживает нас в борьбе с угрозой валькистов, реальность оказывается не такой простой. Как всегда, есть несколько отставших, которые продолжают верить лжи, которую Берлин извергает в мир, будь то из-за эгоистичного неверия в наше дело или из-за искренней веры в немецкое «освобождение». Объединившись в Великом немецком народном союзе, главным лидером пангерманистов в Киле является не кто иной, как Франц фон Базелли.\n\nПроисходящий из семьи, симпатизирующей фолькишам, отец Базелли уже был вовлечен в политику, работал юристом и был частью антисемитской организации. Базелли провёл детство в Киле и окончил среднюю школу в том же году, когда разразилась Великая война. Базелли будет служить на фронте до конца войны, следуя по стопам своего отца и изучая право в Киле и Гамбурге. Базелли присоединился к нескольким различным антиреспубликанским и антимандатным организациям. Испытывая смятение как в мандате, так и в республике, Базелли радикализировался все ближе к крайне правым течениям, находя общую причину в валькистском движении. Занимаясь государственной службой после возвращения в Пиннеберг, Базелли присоединился к VDF в 1931 году и вскоре быстро поднялся до должности муниципального мэра в результате валькистского всплеска, последовавшего за приходом к власти Дресслера.\n\nТеперь Базелли стоит во главе пангерманистов в земле Шлезвиг-Гольштейн, получив дальнейшую известность, несмотря на неудавшееся Второе Кильское восстание. Хотя его надежды на объединение с Германией были разбиты на недавнем референдуме, нет никаких сомнений в том, что он готов передать всю власть Берлину, если у него появится такая возможность. Даже сейчас Базелли продолжает агитировать и призывать войска сдаться вместо того, чтобы сопротивляться навязыванию тирании Берлином – еще одно препятствие, которое мы должны преодолеть в продолжающемся сдерживании валькизма."
 kiel.52.a: "Его место в Германии, желательно за решеткой, пока мы там."
  
 kiel.53.t: "Готфрид Тревиран бежит из Киля"
 kiel.53.d: "Поскольку мы консолидируемся в борьбе как с внутренними, так и с внешними врагами, недавно появились сообщения о том, что Готфрид Тревиранус бежал в Британию, и был довольно хорошо принят политическим классом в Лондоне. Вместе с ним многие бывшие немецкие изгнанники начинают массово покидать страну, направляясь к более зеленым пастбищам в Рейнской области и Франции.\n\nНационалист, выступающий против режима валькистов и его пособников, Тревиранус бежал в Киль вскоре после прихода к власти Дресслера, работая вместе с бывшим канцлером Куртом фон Шлейхером над организацией антивалькистских изгнанников, которые выступали против политических событий в Берлине. Хотя он, возможно, ненавидит нынешний режим больше, чем нас, нет никаких сомнений в том, что он воспользуется своей известностью, чтобы воспрепятствовать любой помощи из Лондона, поступающей к нам, хотя еще неизвестно, будет ли это иметь значение."
 kiel.53.a: "Пропала еще одна крыса Шлейхера"
 SHO_no_british_aid_tt: "§5Из-за его лоббирования мы не сможем обратиться за помощью к Великобритании, если ситуация не станет действительно отчаянной.§!"
  
 kiel.54.t: "Новая вечеринка"
 kiel.54.d: "Когда Дресслер пришел к власти, идея красной Германии, казалось, была утрачена. Буржуазные и капиталистические силы объединились, готовые поддержать Дресслера в его забастовке против пролетариата. Мы, представители и защитники пролетариата, подверглись нападению со всех сторон, партия раскололась, а наши лидеры бежали как на восток, так и на запад.\n\nВ это время скорби мы потеряли Эрнста Тельмана. Лидер партии с 1925 года, Тельман руководил партией, несмотря ни на что, став кандидатом от партии на последних президентских выборах обреченной республики. Однако, несмотря на все это, взлет Дресслера привел к тому, что Тельман просто исчез. Некоторые подозревают, что он сменил личность, пытаясь уклониться от любой ответственности, которую он несет за неспособность партии остановить волну реакции. Другие думают, что Тельман мертв и что он умер либо от стыда, либо от казни, совершенной преступниками в Берлине. В любом случае, многие из тех, кто пользовался у него большим уважением, теперь стали свидетелями того, как их политическая судьба быстро изменилась, когда бразды правления теперь держат в своих руках как межпартийные, так и внешние коммунистические силы. Тем не менее, мы всегда будем помнить человека, который первым возглавил немецкую революцию."
 kiel.54.a: "Он не будет забыт."
  
 kiel.55.t: "Роте Капелле"
 kiel.55.d: "Поскольку мы поворачиваемся к освобождению немецкого пролетариата, мы должны быть готовы использовать любые преимущества, которые мы можем получить. Одной из таких областей, в которой мы можем превзойти свой вес, является разведка, где мы можем использовать симпатии более просвещенных офицеров и солдат для нашей выгоды.\n\nОднако немногие офицеры в Рейхсвере готовы увидеть свет и сотрудничать с нами ради освобождения Германии. Таким образом, большинство из немногих офицеров, которых мы успешно завербовали, являются оппортунистами или очень симпатизируют делу социализма. Одним из таких офицеров является Харро Шульце-Бойзен, молодой офицер Люфтваффе, с которым мы недавно установили контакт. Проведя свои первые политические годы в качестве члена Джунгдо, Бойсен сначала был ослеплен валькизмом и зашел так далеко, что стал крупным лидером, служащим их делу. Однако в результате реакционной борьбы Бойзен был отстранен от власти, и вскоре он осознал бессмысленную природу валькизма и вскоре обратился в сторону коммунизма.\n\nВернувшись в академию, чтобы обучаться на пилота, Бойзен продолжил развивать разведывательную сеть внутри Рейха, которую мы теперь можем использовать в нашу пользу. Хотя его политические симпатии могут оставить некоторые вопросы среди наших более левых товарищей, мы просто благодарны ему за помощь."
 kiel.55.a: "Еще одно доказательство того, что наше дело правое!"
  
 kiel.56.t: "Из России с любовью"
 kiel.56.d: "Сказать, что Второе Кильское восстание стало огромным разочарованием для многих социалистов и левых, значит ничего не сказать. Для многих это была очередная упущенная немецкими левыми возможность освободить пролетариат, долгое время скованный цепями кайзера, затем буржуазной Республики, а в последнее время — реакционными дресслеровцами и их предательскими прихвостнями. На протяжении всего этого периода казалось, что Россия остаётся единственным маяком социализма и примером для всех начинающих революционеров по всему миру.\n\nК нашему сожалению, похоже, у Москвы припасён для нас ещё один неприятный подарок. На фоне отголосков Кильского восстания поступают сообщения о новой волне пожертвований и поддержки Коммунистической партии, при этом Россия является наиболее вероятным виновником этой возобновившейся помощи.\n\nСильно пострадав от прихода к власти Дресслера, КПГ бежала в изгнание, основав базы от Парижа до Москвы. Вынужденные пересмотреть свой «ультралевый» курс, они решили перейти на антивалькистские позиции, а Вальтер Ульбрихт и Вильгельм Пик стали новыми вождями коммунистического лагеря. Несмотря на сильно ослабленное положение, КПГ в изгнании продолжает вести полемику против мандата и немецкого правительства; Ульбрихт остаётся в эмиграции, тогда как, по слухам, Пик скрывается в Киле, ожидая возможности распространить революцию на мандат. Даже если левые мандата сейчас расколоты, мы не можем быть уверены, что это ненадолго, ведь радикальный переворот вполне может создать трамплин для красной угрозы, способной захватить мандат..."
 kiel.56.a: "Проклятые марионетки русских!"
  
 kiel.57.t: "Ярость правых"
 kiel.57.d: "Хотя они всегда были занозой в нашем боку, САП явно начинает брать на себя слишком много. Недавние действия, предпринятые в интересах революции, вызвали осуждение со стороны правого крыла САП; их главный теоретик Август Тальгеймер воспользовался случаем, чтобы осудить нас за совершение очередной «явной левой ошибки» при принятии мер против скрытых реакционеров в наших рядах.\n\nХотя мы уже начали разбираться с этим инакомыслием, это служит нам зловещим предупреждением: мы не можем доверять тем, кто ещё не с нами. По мере того как роковой час борьбы с Берлином становится всё ближе, мы должны быть готовы выступать единым фронтом, иначе мы снова падём поодиночке."
 kiel.57.a: "Ему стоит подумать о том, чтобы действительно сражаться за революцию!"
  
 kiel.58.t: "Щупальца Красного Генерала"
 kiel.58.d: "Когда правительство в изгнании пришло к власти в Киле, их хозяева в Рейнской области понимали, что они признают Курта фон Шлейхера и подчинятся ему, если он и его приспешники захватят власть в Кобленце. Это понимание теперь будет реализовано, поскольку возвышение Шлейхера в Рейнской области приведет к тому, что наше правительство быстро признает законное правительство Германии. Даже если некоторые жалуются на амбиции Шлейхера, нет никаких сомнений в том, что мы преследуем одну и ту же цель."
 kiel.58.a: "НАСТОЯЩАЯ Германия все еще стоит!"
  
 kiel.59.t: "Цена Копенгагена"
 kiel.59.d: "В ответ на нашу просьбу о заключении пакта о ненападении Дания решила предложить встречное предложение, согласно которому мы предоставляем им Фленсбург в обмен на их нейтралитет. Подобная торговля территориями уменьшит нашу легитимность и чрезвычайно ослабит нас, однако некоторые задумываются, стоит ли нам действительно идти на риск войны на два фронта, в которой невозможно выиграть."
 kiel.59.a: "НИКОГДА!"
 kiel.59.b: "Зачем умирать за Фленсбург?"
  
 kiel.60.t: "Ожидаемый ответ"
 kiel.60.d: "Как и следовало ожидать, правительство Киля отклонило наше предложение, посчитав его совершенно неприемлемым. Хотя эти выскочки-немцы, возможно, и не представляют для нас угрозы, любое военное вмешательство в канал может вызвать гнев Британии или Германии на крошечном клочке сельской земли."
 kiel.60.a: "Забудь это."
 kiel.60.b: "Давайте веселиться, как в 1849 году!"
  
 kiel.61.t: "Возвращение ЦК"
 kiel.61.d: "С нашим освобождением Германии от грязных валькистов центральный комитет Коммунистической партии Германии наконец прибыл в [SHO.capital.GetCapitalVictoryPointName] под бурные аплодисменты и празднование. Поскольку варварское самодержавие старого режима Фрейкора было сломлено мощью немецких рабочих, новый глава правительства Вальтер Ульбрихт пообещал работать над сотрудничеством всех антивалькистских сил и разрушением реакционного наследия в Германии."
 kiel.61.a: "Они получат прием, достойный героев-революционеров!"
  
 kiel.62.t: "Немецкий вопрос возобновился"
 kiel.62.d: "Хотя мы освободили свободную Германию, не везде красный флаг развевается без сопротивления. Похоже, что согласно директиве [GRP.overlord.GetNameDef] в [GRP.capital.GetCapitalVictoryPointName] было создано новое социалистическое правительство. Многие ожидают, что мы потребуем, чтобы это правительство было подчинено нашей юрисдикции и нашему правлению, вместо того, чтобы танцевать по прихоти другого государства, которое, похоже, не согласно с той же линией учения Маркса и Ленина, что и мы."
 kiel.62.a: "Германия должна быть свободной!"
 kiel.62.b: "Мы должны вместе работать над революцией!"
  
 kiel.63.t: "[SHO.GetNameDefCap] требует объединения Германии"
 kiel.63.d: "Пришла телеграмма от [SHO.capital.GetCapitalVictoryPointName] с просьбой позволить нашей марионетке в Германии воссоединиться с ними, чтобы осуществить единство немецкого рабочего правительства. Хотя у нас нет оснований отклонять эту совершенно разумную просьбу об объединении двух союзных рабочих государств, некоторые прагматичные люди в министерстве иностранных дел призывают против этого, поскольку это приведет к тому, что мы откажемся от всякого влияния в Германии – если только мы не будем активно требовать сохранения наших интересов в этом регионе."
 kiel.63.a: "Прикажите [GRP.GetNameDef] объединиться с ними."
 kiel.63.b: "Только если мы сохраним влияние в Германии!"
  
 kiel.64.t: "Воссоединение Германии"
 kiel.64.d: "Удивительно, но похоже, что [SHO.capital.GetCapitalVictoryPointName] напрямую встречался с нашими официальными лицами в Германии, а также с лидерами [GRP.GetName], чтобы обсудить их интеграцию в нашу сферу. Стремясь построить новое социалистическое единство, мы можем только радоваться тому, что мировая революция становится все ближе."
 kiel.64.a: "Было бы глупо отказываться."
  
 kiel.65.t: "Цена воссоединения"
 kiel.65.d: "К сожалению, оказывается, что наша просьба о дальнейшем единстве немецких рабочих может быть выполнена только при определенных условиях, которых требует [FROM.GetNameDef]. Стремясь сохранить свое влияние в Германии, они желают услышать, какое предложение мы готовы сделать, чтобы отказаться от их контроля над государством [GRP.GetNameDef] и окончательного единства наших двух правительств. В то время как большинство ожидает, что нам придется, по крайней мере, присоединиться к их блоку, другие предполагают, что репарации или даже прямая вассализация — это то, чего они добиваются, и что мы должны постараться быстро выполнить это, прежде чем они передумают."
 kiel.65.a: "Социалистическое единство — лишь небольшая цена!"
 kiel.65.b: "Они могут получить свои репарации и наше слово дружбы."
 kiel.65.c: "Если это ради немецкого единства..."
 kiel.65.e: "Все это неприемлемо!"
 SHO_fucking_dies: "Если предложение будет принято, игра закончится!"
  
 kiel.66.t: "Ответ из г. [SHO.capital.GetCapitalVictoryPointName]"
 kiel.66.dfaction: "В ответе от г. [SHO.capital.GetCapitalVictoryPointName] было предложено присоединиться к нашему блоку и привлечь в наш альянс социалистическую Германию. Это было бы большим благом, и они могут оказаться ценным союзником, хотя некоторые беспокоятся, что без короткого поводка мы не сможем держать их под контролем или никогда больше не представлять для нас угрозу."
 kiel.66.dfactcessions: "В ответе от г. [SHO.capital.GetCapitalVictoryPointName] было предложено присоединиться к нашему блоку и привлечь в наш альянс социалистическую Германию, а также возместить тяжёлый вред, который предшествовавшее ему правительство грабителей-головорезов нанесло рабочим всего мира. Это было бы большим благом, и они могут оказаться ценным союзником, хотя некоторые беспокоятся, что без короткого поводка мы не сможем держать их под контролем или никогда больше не представлять для нас угрозу."
 kiel.66.dunion: ""
 kiel.66.dnothin: ""
 kiel.66.a: "У них может быть объединение."
 kiel.66.b: "Нет!"
  
 kiel.67.t: "Единое и социалистическое немецкое государство"
 kiel.67.d: ""
 kiel.67.a: "Форвертс!"
  
 kiel.68.t: "[FROM.GetNameDefCap] Отказывается!"
 kiel.68.d: ""
 kiel.68.a: "Предатели и лжесоциалисты!"
  
 kiel.69.t: "Национал-большевистский проект"
 kiel.69.d: ""
 kiel.69.a: "Пиздец"
  
 kiel.70.t: "Новое солнце над Германией"
 kiel.70.d: ""
 kiel.70.a: "Братья, к солнцу, к свободе!"
  
 kiel.71.t: "Поддержка со стороны [From.GetAdjective]ого правительства"
 kiel.71.d: "Сегодня прибыл посланник государства [From.GetName]. Он принес с собой обещания промышленной помощи и военной поддержки, а также слова восхищения нашей борьбой. Капиталисты, возможно, сильны и борются с нами на каждом шагу, но с такими союзниками мы в любом случае превзойдем их."
 kiel.71.a: "Истинная трудовая солидарность сияет в их стране"
  
 kiel.72.t: "Членство в Четвертом Интернационале?"
 kiel.72.d: ""
 kiel.72.a: "Конечно, товарищи!"
 kiel.72.b: "Нелепо!"
  
 kiel.73.t: "[FROM.GetNameDefCap] присоединяется!"
 kiel.73.d: ""
 kiel.73.a: "Навстречу мировой революции!"
  
 kiel.74.t: "[FROM.GetNameDefCap] отказывается!"
 kiel.74.d: ""
 kiel.74.a: "Ясно, что они классовые предатели!"
  
 kiel.75.t: "[FROM.GetNameDefCap] собирает подписи на воссоединение с [target_country.GetAdjective]им народом"
 kiel.75.d: ""
 kiel.75.a: "У них отличное суждение."
 kiel.75.b: "Они недостаточно просвещены, чтобы понять, что [target_country.GetNameDef] — не революционеры."
  
 kiel.76.t: "[FROM.GetNameDefCap] отклоняет нашу петицию!"
 kiel.76.d: ""
 kiel.76.a: "От стыда..."
 ### Focuses 
 SHO_Natpop_republicans: "Националистический переворот"
 SHO_Natpop_republicans_desc: "В такие времена становится ясно, что необходимо сильное опытное руководство, чтобы не допустить полного перехода Киля в руки британцев или немедленного захвата валькистами. Остатки людей Шлейхера уже доказали свою ценность перед британцами, и они, похоже, готовы поддержать наш режим в его политике сдерживания."
  
 SHO_contact_entente: "Переговоры с Антантой"
 SHO_contact_entente_desc: "Понятно, что на данный момент мы находимся во власти Запада. Если они снова введут своих солдат, нам конец. Точно так же, если они оставят нас, будет невозможно предотвратить немедленный захват власти Валькистами. Нам нужно как можно скорее договориться о нашем статусе с Западом и показать, что мы являемся ценным звеном в борьбе с валькизмом."
  
 SHO_Deal_with_danes: "Встреча с Копенгагеном"
 SHO_Deal_with_danes_desc: "Отношения с датчанами, мягко говоря, напряженные, однако мы все знаем, что датчане в лучшем случае неохотно относились к нашей оккупации, а многие категорически отвергали ее. Это основа, над которой мы можем работать. Дания была бы ценным партнером в сфере поставок и торговли, и они наверняка поддержали бы сильное государство между ними и Дресслером."
  
 SHO_return_seized_german_estates: "Вернуть захваченные поместья"
 SHO_return_seized_german_estates_desc: "Многие земли, поместья и имущество были захвачены оккупационными войсками. Нам удалось договориться о полном возвращении всех поместий и земель их старым владельцам в рамках перехода к нашему новому гражданскому правительству."
  
 SHO_reichswehr: "Клика Рейхсвера"
 SHO_reichswehr_desc: "Несколько человек, работавших на Шлейхера, приехали в Киль, чтобы избежать гнева Дресслера. У них до сих пор хорошие связи в немецкой армии. Благодаря своим знаниям, связям и информации они станут ценным ядром новой армии."
  
 SHO_free_city_kiel: "Свободный город"
 SHO_free_city_kiel_desc: "Киль станет Свободным городом под защитой Лиги наций. Он будет служить торговым центром и нейтральным буферным государством севера. Наша немецкая культура и ганзейское наследие будут восстановлены и принесут новую славу. Мы будем самоуправляемыми и свободными ни от тирании Дресслера, ни от военной оккупации Запада. Теперь нам нужно только укрепить наше новое государство."
  
 SHO_welcome_german_exiles: "Принять немецких изгнанников"
 SHO_welcome_german_exiles_desc: "Многие бедные души бежали от преследований в штате Дресслера, кто мы такие, чтобы отсылать наших братьев и сестер. Мы можем использовать все рабочие руки, которые у нас есть, и взамен им будут предоставлены жилье, еда и все, что им нужно. Многие из этих ссыльных — бывшие солдаты, чиновники и рабочие — все профессии, в которых отчаянно нуждается наше молодое государство."
  
 SHO_war_eco: "Всё для войны"
 SHO_war_eco_desc: "Это лишь вопрос времени, когда войска Дресслера пересекут нашу границу и попытаются захватить нашу маленькую страну. Но мы будем готовы к неизбежному. Наши люди учились в одних и тех же академиях, тренировались в одних и тех же казармах и воевали в одних и тех же войнах. Мы знаем их тактику, но будем чтить наши великие военные традиции. При поддержке Запада Киль станет крепостью, взятие которой обойдется им дорого."
  
 SHO_crush_communism: "Сокрушить большевизм"
 SHO_crush_communism_desc: "Красная угроза только ослабляет наше государство и способствует развитию разобщенности и распрей, чего мы не можем принять на данный момент. Их постоянные социалистические восстания уже нанесли достаточно вреда. Мы должны решительно положить конец этой угрозе сейчас. Таким образом мы также сможем доказать свою ценность нашим западным союзникам."
  
 SHO_referendum_lobbing: "Лоббировать референдум"
 SHO_referendum_lobbing_desc: "Чтобы полностью легитимизировать наше правление, мы будем добиваться общественного референдума о будущем нашего нового государства."
  
 SHO_stirke_deal_democrat_opposition: "Работа с оппозицией"
 SHO_stirke_deal_democrat_opposition_desc: "Мы не можем допустить, чтобы разобщенность ослабила наше новое гражданское правительство. Наши люди уже собираются начать переговоры с видными лидерами оппозиции. Единый фронт против валькизма и иностранного засилья, а также за местное развитие и процветание был бы идеальным для нас. У нас уже есть некоторые профсоюзные лидеры, которые согласны с нами в этом видении."
  
 SHO_limited_parliament: "Подчинить Ландтаг"
 SHO_limited_parliament_desc: "Важно, чтобы мы поддерживали демократические традиции и не впадали в деспотизм и тиранию, иначе мы ничем не лучше валькистов. Мы видели результаты злополучного переворота Шлейхера. Однако новый парламент будет строго ограничен в некоторых аспектах, чтобы предотвратить те же проблемы, которые преследовали Веймарскую республику. Сейчас нужен сильный руководитель."
  
 SHO_temp_dictator: "Временный диктатор"
 SHO_temp_dictator_desc: "Мы не можем позволить себе попасть в ловушку партийной политики прямо сейчас. Наша страна находится на грани войны. Что нам сейчас нужно, так это решительное руководство, готовое принять необходимые меры для защиты нашего будущего. Как только кризис будет предотвращен, регулярные парламентские сессии должны возобновиться. Ландтаг сегодня предназначен для генерального комиссара с диктаторскими полномочиями, и именно Ландтаг будет решать, когда снова прекратить это чрезвычайное положение."
  
 SHO_RHI_contacts: "Связи на Рейне"
 SHO_RHI_contacts_desc: "Мы не одиноки в нашей борьбе против Дресслера. Многие элементы, все еще лояльные старому государству, бежали в Рейнское государство, которое недавно, как и мы, было признано самостоятельным субъектом. Рейнская область является такой же мишенью, и поэтому вполне естественно, что мы должны работать вместе с ней. Мы немедленно отправим несколько дипломатов."
  
 SHO_follow_Fatherland_front: "Австрийский пример"
 SHO_follow_Fatherland_front_desc: "Австрийцы создали единый фронт националистов, консерваторов и армии против валькизма и социализма. Этот «Австро-корпоратизм» функционирует на основе классового сотрудничества, веры и внутреннего мира для стабилизации страны. Это хорошая модель, которой мы можем следовать."
  
 SHO_corporatist_society_desc: "Корпоративизм – это экономическая и социальная система, в которой работодатели и работники группируются в корпорации на основе их профессии. Эти корпорации затем выбирают представителей, которые участвуют в правительстве. Эта концепция выступает против регулярной партийной политики и выступает за центральный контроль над государством. Участие в этих корпорациях, конечно, является обязательным. Эта система уже обсуждалась в молодых консервативных кругах и во время канцлерства Шлейхера, но теперь у нас наконец-то появилась возможность ее реализовать. По крайней мере, в небольших масштабах."
  
 SHO_prussian_militarism: "Поощрять милитаризм"
 SHO_prussian_militarism_desc: "Важно, чтобы мы воспитывали боевой дух для защиты нашего нового государства от внешних и внутренних угроз. Наше общество должно быть так же хорошо подготовлено к худшим действиям, как и наша армия. Каждый гражданин будет образован, каждый взрослый человек обучен, и наша добровольческая армия займет престижное место в обществе. Надеюсь, это также привлечет новых сотрудников."
  
 SHO_create_bismarckbund: "Создать Бисмаркбунд"
 SHO_create_bismarckbund_desc: "«Бисмаркбунд» станет нашим собственным национальным ополчением, которому будет поручено поддерживать силы безопасности, рабочие проекты и государственные институты. Их покровителем является сам основатель Германии и национальный герой Бисмарк. Бунд также выступает в роли сил безопасности против многих групп валькистов, и некоторые описывают их как Кильских «Штурмовиков Трутцбунда», очевидно, нелепое сравнение."
  
 SHO_Embrace_naval_trad: "Наше морское наследие"
 SHO_Embrace_naval_trad_desc: "Море всегда звало в наш великий город. Мы всегда были торговцами, мореплавателями и одной из величайших гаваней севера. Хотя нас отстранили от участия в таких городах, как Гамбург или Любек, это день, когда Киль наконец-то сможет написать историю. Мы никогда не можем пренебрегать нашим военно-морским наследием в такой решающий час. Доки уже работают день и ночь, чтобы построить флот, необходимый для наших начинаний — как военный, так и гражданский."
  
 SHO_army_with_state: "Прусская традиция"
 SHO_army_with_state_desc: "Пруссия находится под мертвой хваткой валькизма, но прусский дух не умер. Мало того, что многие из хееров перешли в наше государство, некоторые юнкеры и другие также искали убежища от растущего радикализма правительства валькистов. Прусская дисциплина, честь и эффективность очень живы в Киле."
  
 SHO_official_bund_koingin_louise: "Официализовать «Луизбунд»"
 SHO_official_bund_koingin_louise_desc: "Союз королевы Луизы или «Луизбунд» был создан вскоре после Бисмаркбунда для женщин и девушек нашего государства. Учитывая большой успех первого, нам следует официально оформить и этот Луизбунд. Женщин и девочек научат выполнять экстренную работу, базовым медицинским навыкам, вести домашнее хозяйство и имущество, а также другим необходимым навыкам, чтобы поддержать мужчину на фронте и вести семью дома."
  
 SHO_create_work_program: "Начать рабочие программы"
 SHO_create_work_program_desc: "Чтобы омолодить нашу экономику, мы должны создать программы общественных работ. В Германии ясно, что планы Шлейхера сработали хорошо, хотя теперь Дресслер пожинает плоды. Жесткая экономия не может быть путем вперед. Киль, давай строить!"
  
 SHO_promote_seldte: "Продвигать Зельдте"
 SHO_promote_seldte_desc: "Зельдте хорошо известен в кругах ветеранов, но вначале он был отодвинут в сторону валькистского движения, и его место в Фрайкорах и сообществе ветеранов занял Дресслер. Тем не менее, его организаторские способности исключительны, и его последователи сыграли важную роль в формировании нашего Союза Бисмарка. Мы должны предоставить Зельдте официальную должность в нашем правительстве или армии."
  
 SHO_expand_notprogramme: "Расширить экстренные программы"
 SHO_expand_notprogramme_desc: "Всем ясно, что в обозримом будущем напряженность будет возрастать. На данный момент необходимо расширить программы экстренной помощи, которые уже есть, и еще больше расширить эти меры. Для поддержания общественного порядка будут приняты новые жилищные программы, бесплатные столовые, военные облигации, кредиты и меры безопасности."
  
 SHO_father_modern_germany: "Отец современной Германии"
 SHO_father_modern_germany_desc: "Готфрид Тревиран и его клика предотвратили худшее для нашего города и сдержали призрак валькизма на расстоянии. Несмотря на все трудности, Киль процветает и является одним из центров борьбы с международным валькизмом. Наша Крепость станет искрой, которая зажжет пламя возрожденной Германии."
  
  
  
 SHO_Peoples_revolution: "Победа народа"
 SHO_Peoples_revolution_desc: "Революция, наконец, смогла вытеснить старые буржуазные силы, валькистских ревизионистов и оккупационные силы реакции. Наши рабочие и солдаты храбро сражались, и их храбрость и самопожертвование были вознаграждены. Теперь наша задача – обеспечить безопасность этого нового государства."
  
 SHO_contacts_with_moskau: "Наши советские товарищи"
 SHO_contacts_with_moskau_desc: "Мы сейчас находимся в очень опасной ситуации. Было бы разумно обратиться за поддержкой к другим социалистическим державам. Русские уже прислали нам оружие, но теперь, когда нам не приходится полагаться на контрабанду, мы можем должным образом перевооружиться как можно быстрее, прежде чем Запад задумается о блокаде."
  
 SHO_volksheer: "Народная армия"
 SHO_volksheer_desc: "Мы не позволим нашей армии стать прибежищем реакционных сил или устаревших иерархических структур. Мы видели, как это работало в Веймарской республике. Вместо этого мы должны смоделировать нашу новую армию по образцу ополченцев Красной 100 и Союзов бойцов Красного фронта."
  
 SHO_frauenabteilung: "Женский отдел"
 SHO_frauenabteilung_desc: "Первое классовое различие – это различие между мужчинами и женщинами. Подавление женщин — искусственная норма, поддерживаемая буржуазной культурой. Во времена, предшествовавшие развитию сельского хозяйства, женщины занимали то же место в рабочей силе и тот же социальный статус, что и мужчины, и только с развитием класса были отнесены к второстепенному статусу. Поэтому мы должны признать эту реальность и пропагандировать равное обращение с женщинами и их полное участие в трудовой деятельности."
  
 SHO_United_front: "Обеспечить единство"
 SHO_United_front_desc: "Сектантская борьба преследовала нашу революцию с самого ее начала. Мы должны стремиться сформировать широкий и единый фронт против надвигающейся угрозы валькизма. Пролетариату сейчас необходимо поддержать друг друга. Мы позаботимся о том, чтобы работать против сил инакомыслия и разногласий силами нашего государства и широкой сетью информаторов."
  
 SHO_kiel_fortress: "Крепость «Киль»"
 SHO_kiel_fortress_desc: "Килю предстоит выдержать бурю реакции. Мы построим обширную оборонительную сеть, чтобы наш маяк социализма в Германии выдержал шторм."
  
 SHO_seize_means_production: "Захватить средства производства"
 SHO_seize_means_production_desc: "Наша революция далека от завершения. Наконец-то у нас есть силы начать реструктуризацию нашего государства и экономики. Заводы уже заняты рабочими. Теперь мы официально узаконим новые реалии и национализируем промышленность во имя рабочих. Будут созданы советы по надзору за производством. В то же время крупные помещичьи имения будут дробиться и передаваться в общинные фермерские коллективы. Это только начало нашего модельного состояния."
  
 SHO_War_econ: "Революционная реальность"
 SHO_War_econ_desc: "Хотя мы хотели бы предоставить трудящемуся больше благ с нашими новыми возможностями, мы должны признать нынешнюю ситуацию и признать тот факт, что наше величайшее испытание все еще ждет нас. Мы направим всю нашу промышленную продукцию и излишки на вооружение новой нации и защиту революции, иначе все остальное может оказаться бесполезным."
  
 SHO_support_KDP: "Поддержать революционных товарищей"
 SHO_support_KDP_desc: "Солидарность рабочего выходит за рамки национальности и границ. Мы будем помогать нашим борющимся товарищам, насколько это возможно, где бы они ни находились. Поэтому мы присоединимся к Коммунистическому Интернационалу и глобальной борьбе против реакции."
  
 SHO_crush_moderates: "Укрепить власть коммунизма"
 SHO_crush_moderates_desc: "Мы национализировали промышленность, подавили дивизионистские группы и уничтожили буржуазную власть в нашей стране. Настало время укрепить нашу революцию всеми возможными способами. Мы запретим оставшиеся неприсоединившимися профсоюзы, ассоциации и объединим все левые партии в единый фронт."
  
 SHO_destroy_opposition: "Прикончить реакционеров"
 SHO_destroy_opposition_desc: "В то время как рабочие правят верховно, а советы эффективно выполняют свою работу, нас мучают нападки оставшихся реакционеров, особенно в сельской местности. Мы направим антипартизанские отряды, чтобы разобраться с этими нарушителями спокойствия и подать пример всем, кого поймаем. Это не что иное, как скромные бандиты."
  
 SHO_Danish_deal: "Сделка с Данией"
 SHO_Danish_deal_desc: "Датчане и их отсталая система по праву боятся нашей революции, однако это борьба за будущее, и мы и датчане стоим перед общим врагом. А пока мы закроем границу с Данией и предложим пакт о невмешательстве. Тот, кто хочет покинуть нас и переехать в эту отсталую нацию, может это сделать, но, конечно, ни один датчанин, живущий в нашей стране, не должен бояться репрессий из-за своей национальности, пока он поддерживает наше законное дело. Хотя наши надежды невелики, мы отправим наше предложение в Копенгаген."
  
 SHO_politburo: "Создать Политбюро"
 SHO_politburo_desc: "Политбюро будет центральным органом управления и координации нашего рабочего совета и усилий государства. Его члены избираются из других органов государства и служат нации и рабочему конгрессу."
  
 SHO_Party_congress: "Первый немецкий народный конгресс"
 SHO_Party_congress_desc: "Немецкая революция в самом разгаре. Мы одержали победу над всеми представившимися нам трудностями и обеспечили свое новое государство. Настало время положить конец чрезвычайному положению и начать выборы руководства и направления нашего нового социалистического государства. В этот важный день в Народном зале Киля все советы соберутся на большом конгрессе пролетариата, рабочих, солдат и вождей нашей революции."
  
  
  
 SHO_Pieck: "Православный выбор"
 SHO_Pieck_desc: "Вильгельм Пик – широко известное имя в Германии и далеко за ее пределами. Как основатель КПГ и один из лидеров левого крыла с лучшими связями, следовало ожидать, что фракция Пикса выйдет на первое место. Основатель МОПР (Международной организации помощи борцам революции) имеет хорошие контакты с Россией и присутствовал на последних президентских выборах в Германии, поддерживая кандидата от КПГ. Теперь, когда левые захватили контроль над Килем, он немедленно покинул свое короткое изгнание, чтобы взять на себя руководство революцией в Германии."
  
 SHO_party_primacy: "Консолидировать партию"
 SHO_party_primacy_desc: "В изгнании КПГ находится в руинах, распри и идеологические разногласия разрушают любое единство. Однако Пик, естественный второй после Эрнста Тельмана, увидел в этом хаосе шанс. Фракция Пика приступила к чистке любых диссидентов и ревизионистов, чтобы укрепить свою власть и снова объединить партию. Любые организации вне партии должны будут объединиться или распуститься под руководством Пика."
  
 SHO_est_stasi: "Министерство государственной безопасности"
 SHO_est_stasi_desc: "Необходимо, чтобы мы сдерживали разобщенность и внешнюю разведку. Для этого нам придется создать мощный политический институт, которому будет поручено бороться с контрэволюционными действиями, валькистской подрывной деятельностью и, самое главное, с предательской деятельностью. Для этой задачи сегодня была создана так называемая Deutsche Verwaltung des Inneren."
  
 SHO_german_revolution: "Призыв к Германской революции"
 SHO_german_revolution_desc: "Германия созрела для революции, наше радио «Свободная Германия» слушают по всему королевству Дресслера, а Национальный комитет «Свободная Германия» работает вместе с сопротивлением по ту сторону нашей границы. Это лишь вопрос времени, когда произойдет всеобщее восстание, и тогда мы будем готовы возглавить авангард революции за свободную и социалистическую Германию."
  
 SHO_leader_of_commies: "Авангардистские принципы"
 SHO_leader_of_commies_desc: "Наша партия составит социалистический авангард для подготовки пролетариата к революции и возглавит движение. Мы будем неустанно работать над созданием нашего авангардного государства в Германии. Мы — единственные оставшиеся в живых противники, поэтому наш долг перед нашими товарищами — исполнить и сжечь режим валькистов."
  
 SHO_great_purge: "Очистить бюрократию"
 SHO_great_purge_desc: "Во времена консолидации нам не удалось избавиться от всех нарушителей спокойствия. Более того, мы увидели, кто был надежным союзником, а кто был против нас. Мы извлекли уроки из этого опыта и будем избавляться от таких свиней, как Герман Реммеле и Лауфенберг."
  
 SHO_work_with_german_military_commies: "Компромисс с военными"
 SHO_work_with_german_military_commies_desc: "В ряды НКФД мы вербуем дезертиров рейхсвера, если они политически благонадежны. Это поможет нам повысить профессионализм наших сил, которые на данный момент в основном состоят из остатков Roter Frontkämpferbund. Тот же компромисс необходимо сделать и с истребителями Рейхсбаннера. Если мы хотим иметь шанс, то достаточно будет только обширной и хорошо организованной рабочей милиции. Мы извлекли уроки из наших проблем, связанных с восстаниями в Руре."
  
 SHO_collectivise_economy: "Начать коллективизацию"
 SHO_collectivise_economy_desc: "Мы должны начать наши усилия по коллективизации как можно скорее. В качестве первой меры мы определим размеры крупных поместий и разделим их между фермерами и мелкими землевладельцами. Кроме того, мы создадим принудительные рабочие коллективы, для фермеров будет создан СУГ. ключевые заводы также будут национализированы и переданы под руководство рабочих советов, лояльных нашему центральному плановому комитету."
  
 SHO_create_planning_comission: "Создание комиссий по планированию"
 SHO_create_planning_comission_desc: "Теперь, когда мы начали процесс коллективизации, нам необходимо будет начать работу по централизованному планированию. Будет создана специальная комиссия для организации и надзора за нашими экономическими усилиями, а также для разработки плана на первые четыре года. На данный момент наше внимание будет сосредоточено на производстве товаров, важных для предстоящих военных действий и быстрой индустриализации."
  
 SHO_red_aid: "Восстановить МОПР"
 SHO_red_aid_desc: "Международная организация помощи борцам революции и ее международное крыло были крупнейшей организацией КПГ во времена Веймара. Ее основал Пик, но после переворота Дресслера организация была запрещена в Германии. Теперь мы вновь создадим немецкую секцию Красной помощи в Киле. У МОПР наверняка будет много работы в Киле."
  
 SHO_international_commies: "Мировая революция"
 SHO_international_commies_desc: "Хотя на данный момент мы могли бы обеспечить безопасность Кильской зоны, всем ясно, что захват Рейхом наших позиций — лишь вопрос времени. Мы — одинокий факел социализма в море реакции. Поэтому нам нужны влиятельные друзья за рубежом. Наша обширная сеть изгнанных членов КПГ будет неустанно работать над созданием военного союза и сети гарантий, чтобы сохранить нашу крепость в Европе."
  
 SHO_anti_valkist_propaganda: "Антивалькистские меры"
 SHO_anti_valkist_propaganda_desc: "Валькизм — худшая форма ревизионистской и реакционной мысли, извращенное видение революции, национализма, милитаризма и угнетения. Все наше государство будет неустанно бороться с влиянием валькистов, где бы оно ни показало свою уродливую голову. Мы дискредитируем их ложь в наших газетах и ​​радио, мы будем бороться с их головорезами на улицах и очистим их влияние в наших университетах и ​​бюрократии."
  
 SHO_unify_left_parties: "Сплотить левых"
 SHO_unify_left_parties_desc: "Падением левых во времена Веймара стала их борьба с правым крылом так называемых социал-демократов. Эти социальные валькисты теперь очищены, и мы готовы способствовать объединению всех левых партий в единый фронт против валькистской угрозы."
  
 SHO_work_with_collaborators: "Работа с диссидентами"
 SHO_work_with_collaborators_desc: "Многие уже осознали ошибочность своего пути, и было бы глупо не использовать их знания и влияние в своих интересах. Дезертиры, диссиденты и многие другие также бежали в Киль. Мы, конечно, будем следить за ними, но можем использовать их в свою пользу. Ряд псевдополитических партий, все еще верных нашим основным принципам, успокоит Запад с нашим правлением и позволит нам оказывать влияние на группы людей, которых мы иначе не могли бы достичь. Поэтому наш центральный комитет создаст новую партию Центр, Немецкую национальную партию и Фермерскую партию."
  
  
 SHO_Laufenberg: "Национальная революция"
 SHO_Laufenberg_desc: "Национал-коммунизм — идеология, уникальная для севера Германии. После Рурского кризиса он стал благоприятным и имел свои оплоты в Гамбурге, Киле и Бремене. Их главные идеологи — Генрих Лауфенберг и Фриц Вольфхайм. Национал-коммунизм объединяет социалистические принципы классовой борьбы и синдикалистское экономическое мышление с ультранационалистическими и реваншистскими идеями, на которые повлияли кризис Рура, оккупация войск Антанты и их участие в подавлении рабочих восстаний на севере Германии, а также захват ценных товаров."
  
 SHO_Revanchist_ideals: "Реваншистские идеалы"
 SHO_Revanchist_ideals_desc: "Версальский договор был диктатом иностранных империалистических держав против немецкого рабочего и его отечества. Эти войска не только грабили и грабили нашу нацию, они также расстреливали наших товарищей и оккупировали Германию как одну из своих колоний, в то время как старые толстые капиталисты в Берлине ничего не сделали. Они создали монстра, которым является валькизм, но мы никогда не должны забывать, что рабочий пострадал под французским и британским сапогом так же сильно, как и под валькистским."
  
 SHO_German_worker: "Возвеличить немецкого рабочего"
 SHO_German_worker_desc: "Немецкий рабочий составляет основу марксизма, и мы будем стремиться поддерживать его везде, где это возможно. Наше национальное сообщество осталось в одиночестве после неудач послевоенных революций, и поэтому нам сначала нужно будет создать здесь сильную социалистическую систему, прежде чем мы сможем поддерживать международные идеи."
  
 SHO_German_rebirth: "Германский Феникс"
 SHO_German_rebirth_desc: "Под нашим руководством Германия восстанет из пепла. Национальная революция объединит все знамена под единым курсом, величайшей задачей любого человека, борьбой за свободу и процветание."
  
 SHO_Workers_councils: "Рабочий совет"
 SHO_Workers_councils_desc: "Вместо интеграции уже существующих профсоюзов мы создадим независимые организации экономических рабочих и борцов. Это также станет основой против любой формы компромисса с парламентаризмом и политическими партиями."
  
 SHO_Eastern_diplomacy: "Взор на Восток"
 SHO_Eastern_diplomacy_desc: "Вполне естественно, что молодые нации Германии и Восточной Европы объединяются друг с другом, чтобы защитить себя от имперских амбиций Запада. Мы пошлем наших дипломатов, чтобы положить конец нашему политическому окружению."
  
 SHO_socialist_volk_community: "Социалистическое народное общество"
 SHO_socialist_volk_community_desc: "Volksgemeinschaft — один из немногих достойных восхищения аспектов валькизма, общественной основы для сотрудничества рабочих, выходящей за рамки простой материальной выгоды. Мы должны развивать эту общинную идентичность, чтобы укрепить социалистическую культуру внутри нашего государства против индивидуалистического буржуазного капитализма."
  
 SHO_appeal_to_middle_class: "Обращение к среднему классу"
 SHO_appeal_to_middle_class_desc: "Многие представители среднего класса боятся быть раздавленными между восстанием рабочих и реакцией юнкеров; мы должны показать им, что они являются частью нашего великого проекта и могут только выиграть от разрушения капиталистических обществ, которые сковывают их. Мы будем работать вместе с фермерскими движениями и малым бизнесом и апеллировать к их общему чувству национализма. Они будут интегрированы в свой собственный совет, обладающий значительной автономией и самоуправлением."
  
 SHO_Work_with_landvolk: "Работа с крестьянами"
 SHO_Work_with_landvolk_desc: "Сельские крестьяне — это класс, схожий с рабочими на заводах, которые всё больше обнищали и были вынуждены работать на заводах. Мы признаём их тяжёлое положение и поддерживаем их в рамках рабоче-крестьянского союза. Крестьянское движение обладает значительной энергией и разделяет с нами множество схожих целей, даже если некоторые из них были искажены валькистским движением или национал-популизмом."
  
 SHO_End_Parliamentarianism: "Конец парламентаризму"
 SHO_End_Parliamentarianism_desc: "Парламентаризм – это злополучный путь к власти и управлению, поэтому мы не поддерживаем проведение каких-либо выборов или создание какой-либо партийной системы, подобной российской, вместо этого мы доверяем нашей системе советов. Любые остатки парламентаризма будут изгнаны из нашего государства."
  
 SHO_Approach_valkists: "Компромисс с валькистами?"
 SHO_Approach_valkists_desc: "Валькисты, особенно их национально-революционное крыло вокруг Паэтеля, придерживаются многих убеждений, схожих с нашими; возможно, было бы полезно установить связи с этими кругами и обратиться к любому диссиденту или радикальному валькисту. При поддержке кильских валькистов дипломатия с Германией станет значительно проще, и мы сможем устранить крупную внутреннюю угрозу."
  
 SHO_Create_one_workers_union: "Реорганизовать профсоюзы"
 SHO_Create_one_workers_union_desc: "На данный момент наша страна состоит из бесчисленных профсоюзных рабочих советов и других организаций, нам необходимо сократить количество бюрократии и рационализировать весь процесс, насильственно объединяя и распуская большинство этих организаций."
  
 SHO_Destroy_communist_dissidents: "Укрепить коммунистическое единство"
 SHO_Destroy_communist_dissidents_desc: "многие осуждают нас как ревизионистов, предателей или псевдовалькистов, но мы просто реалисты. Внутренняя разобщенность левых всегда была их падением, и мы не можем терпеть голоса в наших рядах, подрывающие нашу позицию. Мы вынуждены выступить против этих нарушителей спокойствия и вычистить их из наших рядов."
  
 SHO_huntdown_reactionaries: "Уничтожить реакционеров"
 SHO_huntdown_reactionaries_desc: "В нашем государстве, особенно в сельской местности, еще есть бесчисленное множество национал-популистов, нереформированных валькистов и реакционеров. Их террористические акты становятся все смелее. Если мы не хотим, чтобы пятая колонна находилась у нас в тылу, нам придется решительно выступить против них. Нашим отрядам будет приказано стрелять на виду и очищать местность от этих бандитов."
  
  
  
 SHO_Brandler: "Возвращение оппозиции"
 SHO_Brandler_desc: "Конец объединенной КПГ в Германии и хаос, развернувшийся во время изгнания КПГ, были моментом, которого ждали Брандлер и его люди. После успешной революции в Киле он смог вернуться в Германию, несмотря на сопротивление руководства КПГ. Независимый коммунизм Брандлера наконец победил."
  
 SHO_Fight_socdems: "Атаковать социал-«фашистов»"
 SHO_Fight_socdems_desc: "СДПГ — одна из причин, почему революция в Германии провалилась и валькизм смог подняться. Вместо того, чтобы сражаться со своими товарищами, они работали вместе с монархистами и националистами против рабочих. Мы не можем позволить истории повториться"
  
 SHO_spartacusbund_legacy: "Наследие Спартака"
 SHO_spartacusbund_legacy_desc: "Движение «Спартак» положило начало КПГ и преподало нам много важных уроков. Мы будем чтить их наследие и создадим новую КПГ по их образу. Вооруженная борьба против угнетения и империализма может, наконец, начаться."
  
 SHO_Socialist_republic: "Социалистическая Республика"
 SHO_Socialist_republic_desc: "Наше государство свободно, независимо от иностранных держав и капиталистического гнета. Профсоюзы едины, мы создали широкий антивалькистский фронт, и нация защищена от внутренних угроз. Теперь мы действительно можем начать строить общество рабочего в духе Маркса и Энгельса."
  
 SHO_Victorious_council: "Верховенство Советов"
 SHO_Victorious_council_desc: "Наша цель – создание советской республики. Мы победили радикалов внутри КПГ и их старого руководства. Вдохновленные российской системой, мы теперь можем реализовать первоначальное видение немецкого коммунизма."
  
 SHO_Radical_land_reform: "Радикальная земельная реформа"
 SHO_Radical_land_reform_desc: "Первым нашим шагом на пути к новому государственному и общественному порядку будет реформирование собственности и земли. Веймарское правительство всегда уклонялось от этого шага, не осознавая его необходимости. Чем раньше мы начнем, тем лучше. Недавний хаос – это хорошая возможность для нас начать. В то же время мы очистим всех оставшихся националистов и консерваторов, которые сопротивляются нашим усилиям."
  
 SHO_Worker_aid: "Помощь рабочим"
 SHO_Worker_aid_desc: "Необходимо реализовать масштабные социальные программы, направленные на решение наиболее острых проблем. Мы создадим жилье для рабочих, поддержим их права на рабочем месте, обеспечим надлежащее здравоохранение и школы. Сам Киль поражен бедностью и бездомностью, особенно среди представителей низших классов, поскольку это столица нашей революции, и это не может оставаться без внимания."
  
 SHO_Strengthern_councils: "Укрепить советы"
 SHO_Strengthern_councils_desc: "Рабочий больше не будет эксплуатироваться классом капиталистов. Мы немедленно национализируем ключевые отрасли промышленности и расширим возможности местных рабочих советов. Более того, мы расширим сферу ответственности этих советов и поддержим их как неотъемлемую часть нашего государственного аппарата."
  
 SHO_Free_socialist_economy: "Свободная социалистическая экономика"
 SHO_Free_socialist_economy_desc: "На советы будет возложена не только задача бюрократической организации, но также обсуждение и консультирование по вопросам производства и потребления. В советы будут входить как потребители, так и производители, и поэтому становится возможной экономика участия. Более того, справедливые кредиты, автономия рабочих советов и условия труда людей будут поддерживать посткапиталистический экономический порядок."
  
 SHO_Finish_revolution: "Завершить нашу революцию"
 SHO_Finish_revolution_desc: "Киль был свергнут широким фронтом коммунистов, как мы и предполагали. Мы упустили момент и нанесли удар, когда пришло время и шансы были на нашей стороне. Однако сейчас, после того как мы пришли к власти, предстоит еще многое сделать. К счастью, наше руководство едино и наше движение готово."
  
 SHO_Fund_socialist_news: "Финансирование социалистической прессы"
 SHO_Fund_socialist_news_desc: "Мы расширим наше влияние в обществе, задействовав новые ресурсы для финансирования ежедневной газеты «Arbeiterpolitik» и журнала «Gegen den Strom». Они составят конкуренцию прочим, менее надежным изданиям. Это существенно задействует наши пропагандистские возможности, особенно когда мы начнем распространять газеты на оккупированных валькистами землях."
 
 SHO_Farmer_aid: "Помощь фермерам"
 SHO_Farmer_aid_desc: "Как подчеркивает Интернационал красных фермеров, фермеры являются важной частью коммунистической борьбы и имеют потенциал для расширения нашего движения. Теперь, когда мы начали земельные реформы, мы создадим значительные программы помощи и постепенно интегрируем оставшиеся фермерские союзы в наши структуры. Поскольку фермеры также являются основными сторонниками радикальных реакционеров, важно, чтобы мы не выпускали их из поля зрения, а вместо этого привязывали их к нашему государству."
  
 SHO_Fund_rotfrontkampferbund: "Поддержать Красный Фронт"
 SHO_Fund_rotfrontkampferbund_desc: "Красный Фронт — это ядро ​​нашей недавно созданной милиции, которой поручено поддерживать общественный порядок и защищать государство. Если мы хотим преобразовать их в полноценную армию, нам потребуется значительно расширить их численность, подготовку и оснащение."
  
 SHO_Fight_the_reaction: "Борьба с реакционной мыслью"
 SHO_Fight_the_reaction_desc: "Мы не можем доверять предсказаниям о том, что, как только валькизм воцарится, восстанут рабочие, мы видели, что этого никогда не происходило. Вместо этого нам нужно как можно скорее решить эту проблему. Поэтому мы не можем терпеть никаких реакционеров внутри наших границ. Нам нужно нанести удар раньше, чем они это сделают, потому что у них наверняка есть влиятельные друзья, которые только и ждут нашего падения."
  
  
  
 SHO_Landvolk_victory: "Государство фермера"
 SHO_Landvolk_victory_desc: "Наши земли всегда были тесно связаны с сельским хозяйством и сельской жизнью, начиная с самоуправления крестьян в средние века и до сегодняшнего дня, эта традиция не нарушена. Мы постараемся сохранить этот характер для будущего и противостоять силам модернизма и промышленности."
  
 SHO_peasents_army: "Армия крестьян"
 SHO_peasents_army_desc: "Наша страна слишком мала для постоянной армии, подобной немецкой или французской. Вместо этого мы последуем примеру швейцарской системы ополчения и создадим децентрализованное крестьянское ополчение с небольшим элитным ядром."
  
 SHO_Wehrbauern: "Вербауэры"
 SHO_Wehrbauern_desc: "Мы поселим и обучим военных в наших приграничных регионах, чтобы в случае войны они сформировали ополчение для изнурения и сдерживания продвижения противника до подхода основных сил. На них будет возложена организация местного сопротивления, а взамен они получат освобождение от налогов и государственное снаряжение."
  
 SHO_folkish_ideals: "Фёлькишское государство"
 SHO_folkish_ideals_desc: "Фёлкиши имеют представление об истинном государстве, укоренённом в почве и крови своего народа, и видят врагов, которые нападают на эту вековую природную конструкцию со всех сторон. Они не поддались ложным обещаниям валькизма или бездействующих консерваторов, поэтому они являются естественными союзниками и руководителями нашего национального сопротивления."
  
 SHO_resistance_doctrine: "Доктрина сопротивления"
 SHO_resistance_doctrine_desc: ""
  
 SHO_work_with_freikorps: "Работа с Фрайкорами"
 SHO_work_with_freikorps_desc: "Мы, безусловно, чтим старую Имперскую армию и наших доблестных бойцов войны. Фрайкоры всегда был прирожденными солдатами, пока их не увлек Дресслер и их легализм во время президентства. Тем не менее, некоторые из наиболее принципиальных бойцов остались и помогли нам в борьбе против оккупации. Мы должны обязательно включить этих верных людей в ядро ​​нашей милиции."
  
 SHO_resistance_doctraine: "Доктрина сопротивления"
 SHO_resistance_doctraine_desc: "Мы можем проиграть битву или даже войну, но мы всегда будем знать, откуда мы пришли и за какой естественный порядок сражаемся. Наши предки уже пережили немало трудностей, а мы стоим здесь. Мы заставим их гордиться тем, что никогда не отказываемся от наших корней, нашей земли и нашего образа жизни. Они могут прийти и попытаться заставить нас подчиниться, но найдут только смерть."
  
 SHO_Landspartei_victory: "Нация, привязанная к земле"
 SHO_Landspartei_victory_desc: "Наша страна не является ни космополитическим торговым центром, как Великобритания или США, ни социалистическим режимом, как Россия, или культом валькистского лидера, как Германия. Мы неразрывно связаны с нашей землей, историей и традициями, и мы позаботимся о том, чтобы так и оставалось."
  
 SHO_farmer_relief_act: "Закон о помощи фермерам"
 SHO_farmer_relief_act_desc: "После оккупации множеству фермеров грозит банкротство. Мы окажем финансовую помощь стольким хозяйствам, скольким сможем, и спишем их долги — это меньшее, что мы можем сделать. Кроме того, мы предоставим льготные кредиты всем, кто готов восстанавливать своё дело."
  
 SHO_village_resettlement_program: "Расселение деревень"
 SHO_village_resettlement_program_desc: "Поскольку в нашем и без того перенаселенном городе сейчас толпится множество беженцев из самой Германии, нам следует принять меры по возвращению людей на землю. Мы предложим дешевое жилье и раздадим пустующие фермы всем, кто захочет на них работать. Этот новый приток людей должен вернуть новую жизнь во многие почти заброшенные деревни, разбросанные по нашей стране."
  
 SHO_Communal_farming: "Агитация за коллективное хозяйство"
 SHO_Communal_farming_desc: "Стало ясно, что система крупных единоличных имений потерпела крах. Нам необходимо двигаться вперед и максимизировать эффективность и продуктивность земли, которая у нас есть, и для этого мы должны коллективизировать наши фермы и объединить их в конгломераты. Таким образом, мы сможем бросить вызов иностранным производителям по размерам и объему производства и устранить внутреннюю конкуренцию, которая нам только вредит."
  
 SHO_revive_peasents: "Возродить крестьянский класс"
 SHO_revive_peasents_desc: "Сегодня многие рабочие считают себя частью пролетариата, а консервативного крестьянина — устаревшим инструментом подавления в их классовой войне. Вместо этого мы видим, что такое крестьянин на самом деле. Костяк любой консервативной и традиционной нации, олицетворяющий идеал самодостаточного, самостоятельного человека, живущего в единстве со своей страной, своей землей и своей верой. Мы будем работать над пропагандой этой альтернативы пролетариату через наши собственные фермерские профсоюзы и политические партии."
  
 SHO_revitalize_countryside: "Оживить деревни"
 SHO_revitalize_countryside_desc: "Многие люди потеряли работу, переехали в город, а старые усадьбы и деревни были заброшены и заброшены. Это неприемлемое развитие событий, которое активно препятствует нашим мечтам о возрождении сельской местности. Нам необходимо построить лучшую инфраструктуру, предложить больше услуг и электрифицировать сельскую местность, чтобы остановить, а желательно даже обратить вспять эти тенденции. Начнем с того, что хорошие дороги, по крайней мере, помогут передвижению товаров и рабочей силы. Киль – это больше, чем его гавани."
  
 SHO_reagrarianism_program: "Укрепить аграрный сектор"
 SHO_reagrarianism_program_desc: "Для спасения аграрного сектора нашей страны необходимы крупные гранты, и они нам понадобятся быстро. Ведь именно фермы и сельская местность кормят наш народ и создают единственные ценные товары. Веймарские времена оставили сектор опустошенным, но благодаря нашему новому уникальному положению мы, возможно, сможем изменить ситуацию."
  
 SHO_Large_estates: "Создание крупных поместий"
 SHO_Large_estates_desc: "мелкие приусадебные участки и крошечные фермы просто экономически нежизнеспособны. Мы не социалисты и не валькисты, и поэтому мы не будем делить эти рабочие сословия и отдавать их каким-то невежественным рабочим. Эти крупные фермы — наш единственный хороший источник дохода, и им необходимо оставаться прибыльными."
  
 SHO_peasent_state: "Крестьянское государство"
 SHO_peasent_state_desc: "Эта земля всегда была домом трудолюбивых батраков и землевладельцев, пока жадность банкиров и спекулянтов не ввергла нас в кризис и не наводнила наш рынок дешевыми иностранными товарами. У нас выжали каждый пфенниг, а остальное забрали под проценты. Но не больше. Мы защитим нашу нацию и запретим эту практику. Деревня возродится."
  
 SHO_liberal_economics: "Защитить свободный рынок"
 SHO_liberal_economics_desc: "Свободный рынок – это источник жизненной силы нашей немецкой нации. Каждый трудолюбивый человек хочет пожинать плоды своего труда. Накормить всех не задача государства. Вместо этого все ответственные люди готовы работать ради своего существования. Ни крупный бизнес, ни социалистические заблуждения не должны разрушать этот механизм саморегулирования."
  
 SHO_shared_machinery: "Коллективная техника"
 SHO_shared_machinery_desc: "Мы, фермеры, должны держаться вместе. Если мы объединим наши деньги, мы сможем гораздо быстрее модернизировать наши поместья и производства и поддержать друг друга против жадных бизнесменов и их мошенничества с процентами."
  
 SHO_support_petite_bourgeoisie: "Поддержка среднего класса"
 SHO_support_petite_bourgeoisie_desc: "Средний класс является основой нашего государства. Ремесленники, квалифицированные рабочие, малый бизнес и крупные фермеры – вот что поддерживает существование этой нации. Нам нужно убедиться, что мы уменьшаем их бремя и поддерживаем их везде, где можем. Более того, мы должны создать возможности для низших классов повысить социальный статус и качество жизни, чтобы предотвратить классовую борьбу, которая так долго преследовала этот регион. Наше государство выделит большие средства и создаст программы поддержки среднего класса."
  
  
 SHO_Economy_rejuvenation: "Экономическое восстановление"
 SHO_Economy_rejuvenation_desc: "Мы реализуем ряд мер, направленных на оживление нашей экономики, содействие устойчивому росту и восстановление финансовой стабильности перед лицом постоянно растущей нестабильной политической ситуации в Европе. Посредством реформ, инвестиций, новой политики и законодательства мы заложим основу для устойчивого и процветающего экономического будущего."
  
 SHO_expand_railways: "Новые железнодорожные проекты"
 SHO_expand_railways_desc: "Железные дороги являются артериями любой современной страны. Какая польза от наших гаваней и промышленных центров, если мы не можем доставлять в них и вывозить товары? За последние годы наша и без того старая железнодорожная инфраструктура сильно пострадала. Нам потребуется вложить немалое количество ресурсов, чтобы отремонтировать и расширить его."
  
 SHO_modernize_rural_areas: "Модернизировать сельскую местность"
 SHO_modernize_rural_areas_desc: "Сельские районы земли Шлезвиг-Гольштейн — это почти капсула времени. Хотя некоторые могут счесть это романтическим, это активно препятствует нашему развитию и способствует отсталому мышлению и практикам. Мы начнем кампанию, направленную не только на модернизацию сельской инфраструктуры, но и на внедрение в регион современных экономических методов, инструментов и промышленности."
  
 SHO_tax_canal: "Налог на канал"
 SHO_tax_canal_desc: "Канал может быть нашим крупнейшим источником дохода, учитывая его важность для военно-морского флота, и хотя он потерял значительную часть своей ценности, мы все еще можем получить от него некоторую прибыль, мы должны использовать это."
  
 SHO_Promote_free_trade: "Безопасная свободная торговля"
 SHO_Promote_free_trade_desc: "Хотя многие, особенно фермеры, предпочли бы протекционистскую торговую политику, мы не можем рисковать потерей нашего выгодного торгового положения между великими державами Европы. Если мы не хотим, чтобы люди просто оставили нас мертвыми в воде, нам нужно будет убедиться, что мы предлагаем наилучшие возможные возможности. Конечно, нам, возможно, придется пойти на некоторые компромиссы здесь и там, но это не должно нас останавливать."
  
 SHO_expand_maritime_industry: "Расширить морскую отрасль"
 SHO_expand_maritime_industry_desc: "Морская традиция в Киле старая, и мы сделаем все возможное, чтобы ее расширить. Мы будем щедро финансировать новые проекты верфей и расширять гавани наших городов, чтобы они стали по-настоящему современным торговым центром."
  
 SHO_banking_reform: "Начать банковскую реформу"
 SHO_banking_reform_desc: "Банковская система полностью находится в упадке, и на данный момент у нас доминируют иностранные банки и инвесторы. Нам необходимо начать создание центральной банковской системы, если мы хотим добиться успеха в качестве центра экономической торговли в Северной Европе."
  
 SHO_planned_eco: "Переход к плановой экономике"
 SHO_planned_eco_desc: "В нашей нынешней ситуации нам придется обходиться ограниченными ресурсами. Мы не можем рисковать, ставя их на частный бизнес. Вместо этого мы поручим комиссии центрального планирования разработать экономический план на обозримое будущее."
  
 SHO_nationalize_industry: "Национализировать ключевые отрасли"
 SHO_nationalize_industry_desc: "Чтобы помочь нашим усилиям по централизованному планированию и милитаризации предстоящей войны, мы национализируем ключевые отрасли промышленности."
  
 SHO_small_business_support: "Поддержка малого бизнеса"
 SHO_small_business_support_desc: "Малый бизнес является основой нашей промышленности, но сталкивается с растущей конкуренцией со стороны иностранного экспорта. Мы предложим им систему национальной безопасности и предоставим щедрые средства и льготы для защиты их будущего."
  
 SHO_recive_loans: "Дешевые кредиты"
 SHO_recive_loans_desc: "Для дальнейшего улучшения перспектив местного бизнеса и компаний мы начнем выдавать дешевые государственные кредиты. Мы надеемся, что это увеличит наш экономический рост и ограничит влияние иностранных инвесторов."
  
 SHO_Militarization_of_economy: "Подготовка экономики к войне"
 SHO_Militarization_of_economy_desc: "Ни для кого не секрет, что Германия нанесет нам удар в кратчайшие сроки. Нам нужно быть готовыми. Заводы должны быть защищены и готовы к военному производству, и нам также придется столкнуться с возможным нормированием продуктов. Будем надеяться, что мы сможем пережить этот шторм."
  
 SHO_merchant_fleet: "Расширить торговый флот"
 SHO_merchant_fleet_desc: "Сильный торговый флот будет необходим, если мы не хотим оставаться в изоляции. Мы будем инвестировать в самые современные корабли и увеличить общие военно-морские бюджеты."
  
 SHO_defense_organization: "Организовать оборону"
 SHO_defense_organization_desc: "Пришло время разработать план обороны нашей страны на случай немецкого нападения. Наше руководство предложило несколько планов, но окончательный выбор остается за главой правительства."
  
 SHO_offensive_doctrine: "Агрессивная мобилизация"
 SHO_offensive_doctrine_desc: "Хотя наша армия, возможно, еще не двинется прямо на Берлин, мы не можем сидеть сложа руки в наших укреплениях, если хотим выиграть войну против немцев. Мы должны мобилизовать наш народ в максимально возможной степени, пополняя наши ряды и готовя военизированные организации к тотальному наступлению на валькизм."
  
 SHO_civilian_militias: "Сформировать гражданское ополчение"
 SHO_civilian_militias_desc: "Мы расширим военную подготовку для всех гражданских лиц в возрасте от 18 до 60 лет, чтобы в конечном итоге сформировать независимо действующие ополчения, готовые поддержать наши регулярные войска. Эти резервы значительно увеличат численность рабочей силы, которую мы можем выставить."
 SHO_civilian_militias_tt: "Мы развернем §Y3§! дивизии этого вида."
  
 SHO_motorized_divisions: "Моторизовать наши силы"
 SHO_motorized_divisions_desc: "Теперь, когда у нас имеется достаточно развитой промышленности военного времени, будет разумно инвестировать в современные моторизованные силы для быстрых атак и отступлений против более сильного врага."
 SHO_motorized_divisions_tt: "Мы развернем §Y2§! дивизии этого вида."
  
 SHO_develop_anti_tank: "Производство ПТО"
 SHO_develop_anti_tank_desc: "У нас нет промышленных мощностей для размещения собственных танков в сколько-нибудь значительных количествах, но что мы можем сделать, так это создать противотанковое оружие, будь то пушки, мины, винтовки и так далее. Мы оснастим ими наши собственные отряды охотников за танками и устроим им ад!"
  
 SHO_resistance_doctrine2: "Мобилизовать полицейские силы"
 SHO_resistance_doctrine2_desc: "Каждый человек, умеющий стрелять, должен быть готов бороться за нашу безопасность. Значительные полицейские силы Киля должны быть обучены оборонительным боям и иметь план мобилизации, чтобы организовать боевые силы в случае нападения валькистов; и они нападут."
  
 SHO_canal_bunkers: "Укрепление канала"
 SHO_canal_bunkers_desc: "Канал — это сердце нашей нации, и мы не можем рисковать, подвергая его бомбардировкам или подобным атакам. Он станет нашим последним рубежом обороны. Мы укрепят его изо всех сил: возведём бункеры, установим зенитные орудия и всё, что только потребуется."
  
 SHO_fighter_programme: "Создать программу истребителей"
 SHO_fighter_programme_desc: "Хотя у нас есть несколько самолетов-разведчиков, нам не хватает надлежащих военно-воздушных сил, которые могли бы поддержать наши наземные войска. К счастью, с помощью наших союзников мы смогли купить современное авиакрыло, которое можно было бы использовать в качестве сил поддержки наших солдат."
  
 SHO_expand_schleswig_airfield: "Расширить авиабазу Шлезвиг"
 SHO_expand_schleswig_airfield_desc: "Единственная крупная авиабаза, построенная во времена Веймара и родина наших ВВС. Мы значительно расширим и укрепим этот аэродром, чтобы разместить наши расширенные военно-воздушные силы и быть готовыми к любым будущим операциям."
  
 SHO_buy_English_old_submarines: "Купить британские подводные лодки"
 SHO_buy_English_old_submarines_desc: "Чтобы укрепить наш флот, мы могли бы купить несколько подводных лодок у Британии и даже использовать их в качестве образцов для постройки своих собственных. Давайте отправим предложение в Лондон."
  
 SHO_army_reformed: "Современная армия"
 SHO_army_reformed_desc: "Наши разношерстные ополченцы после многих реформ теперь превратились в настоящую армию, хотя и небольшую. У нас нет недостатка в профессионализме и оборудовании. Будем надеяться, что этого достаточно."
  
 SHO_defensive_doctrine: "Укрепите зону канала"
 SHO_defensive_doctrine_desc: "Как мы видели в Великой войне, укрепления могут значительно увеличить эффективность армии и противостоять более слабым силам превосходящим. Как бельгийцы остановили немцев в Первой мировой войне, так и мы остановим немцев в следующей."
  
 SHO_border_bunkers: "Укрепить границу"
 SHO_border_bunkers_desc: "Мы начнем строить большую сеть бункеров и военных позиций вдоль нашей границы в соответствии с нашей оборонительной доктриной."
  
 SHO_artillery_corps: "Расширить артиллерийский корпус"
 SHO_artillery_corps_desc: "Если мы замедлим врага, нам понадобится хорошая артиллерия, чтобы расправиться с его силами. Для решения этой задачи мы значительно расширим и модернизируем имеющиеся войска."
  
 SHO_fortify_position: "Укрепить наши позиции"
 SHO_fortify_position_desc: "Каждый дом станет замком, каждый ров — оборонительной линией, а каждый холм — артиллерийской позицией. Они дорого заплатят, если нападут на нашу крепость Киль."
  
 SHO_protect_supply: "Защитить линии снабжения"
 SHO_protect_supply_desc: "Превосходящие военно-воздушные силы Дресслера, вероятно, будут преследовать наши грузовики и поезда с припасами. Нам нужно будет решить эти проблемы и, по крайней мере, бронировать наши поезда и обеспечивать линии снабжения ночью и как можно более децентрализованно."
  
 SHO_anti_air_positions: "Установка зенитных орудий"
 SHO_anti_air_positions_desc: "То, чего нам не хватает в ВВС, мы можем компенсировать зенитными орудиями. Наши новые позиции зенитной артиллерии сделают воздушное пространство Киля смертельным для любого пилота Рейха."
  
 SHO_hanastic_fleet: "Создание нового Ганзейского флота"
 SHO_hanastic_fleet_desc: "Новый военно-морской флот Киля — гордость нашей нации, как в военном, так и в гражданском плане. Этим кораблям предстоит выполнить важную задачу, и мы желаем их экипажам удачи в будущем."
  
  
 SHO_foreign_policy: "Взгляд наружу"
 SHO_foreign_policy_desc: "Теперь, когда мы разобрались с наиболее острыми внутренними проблемами, нам предстоит разобраться с ситуацией вокруг нас. Важно, чтобы мы нашли хороших партнеров и подготовились к борьбе с теми, кто хочет навредить нашей стране."
  
 SHO_spread_revolution: "Распространение революции"
 SHO_spread_revolution_desc: "Киль является образцом революции в Западной Европе, и многие рабочие только и ждут, чтобы освободиться от ига капитализма. Мы найдем друзей среди многих коммунистических движений по всему континенту."
  
 SHO_soviet_deal: "Знакомьтесь, русские!"
 SHO_soviet_deal_desc: "Мы отправим делегатов в Москву и поговорим о тесном сотрудничестве. Россия наверняка будет заинтересована в правах на стыковку, а также в торговле, и мы сможем использовать всю возможную защиту."
  
 SHO_Support_communism: "Обещание поддержать мировой коммунизм"
 SHO_Support_communism_desc: "Наша нация обязуется полностью поддерживать идеал мировой революции. Мы поможем любому нуждающемуся работнику и присоединимся к хорошей и великой борьбе против реакции."
  
 SHO_Destroy_Dressler: "Подготовка к войне"
 SHO_Destroy_Dressler_desc: "Понятно, что удар Дресслера — лишь вопрос времени. Нам нужно быть готовыми и по возможности упредить любое движение Рейха. Мы мобилизуем наши войска и подготовим наше население."
  
 SHO_Embargo_germany: "Наложить эмбарго на Германию"
 SHO_Embargo_germany_desc: "Никакие товары, никакие корабли, никакие путешествия из Германии или в Германию больше не будут проходить через нашу территорию. Мы порвем все связи, которые у нас еще есть с правительством Дресслера, и вместо этого доверим это нашим союзникам. Мы все еще можем сдерживать валькизм."
  
 SHO_Brit_deal: "Переговоры с Лондоном"
 SHO_Brit_deal_desc: "Мы уже знаем, что британцы — разумные люди, с которыми можно иметь дело. Мы отправим делегацию в Лондон, изложив наше желание присоединиться к их альянсу в качестве ценного союзника против Германии и предложим им права швартовки, а также права размещения войск. Давайте найдём новых друзей по всему каналу."
  
 SHO_Support_opposition: "Спонсировать немецких подпольщиков"
 SHO_Support_opposition_desc: "Хорошо известно, что в Германии еще есть люди, презирающие Дресслера и валькизм. Мы должны установить контакт с этими клетками и поддерживать их всеми возможными способами. Если они поднимут восстание за какими-либо линиями, это может стать той важной поддержкой, которая нам нужна."
 SHO_Support_opposition_tt: "Регионы с отношением §R50% и ниже§! к германской §Yкультурной революции§! будут иметь отрицательные модификаторы."
  
 SHO_Liberate_Germany: "Вторая Братская война"
 SHO_Liberate_Germany_desc: "Наше время пришло. Наконец мы выступаем против Дресслера. По иронии судьбы в центре обеих братских войн находился наш маленький Киль."
  
 SHO_SDPSH_victory: "Победа СДПШГ"
 SHO_SDPSH_victory_desc: "Неожиданным поворотом событий СДПШГ обеспечила себе правительство. СДПГ всегда была основной силой в Киле, но пострадала в начале 30-х годов, когда многие вместо этого обратились к аграрным партиям или коммунистам после провала правительства Германа Мюллера в Германии. Теперь, похоже, у СДПШГ появился второй, хотя и меньший шанс проявить себя. Их умеренный центризм и обещания стабильности склонили на свою сторону многих избирателей, причем даже некоторые умеренно-центристские партии увидели в этом шанс и пообещали поддержать новую Великую коалицию."
  
 SHO_social_economics: "Социальная рыночная экономика"
 SHO_social_economics_desc: "СДПГ всегда была против радикализма коммунизма, вместо этого они выступали за справедливую рыночную систему, которая защищает рабочих посредством сильных социальных систем, профсоюзов и прав рабочих. Государство сохранит за собой право вмешиваться в экономику, чтобы обеспечить честную конкуренцию, подорвать любое доверие и не дать бизнесу стать слишком влиятельным. Однако многие левые осуждают это как социальный валькизм."
  
 SHO_support_unemployed: "Поддержка безработных"
 SHO_support_unemployed_desc: "За последние 10 лет резко возросло число безработных, а вместе с ним и всевозможные социальные проблемы и политические раздоры. Безработица является одной из самых актуальных проблем, помимо валькистской угрозы, и поэтому нам нужно будет бороться с ней как можно ожесточеннее. Помимо жилищных программ и бесплатных столовых, мы создадим рабочие батальоны и будем инвестировать в крупномасштабные инфраструктурные проекты, чтобы обеспечить занятость. Надеемся, что со временем это должно решить проблему."
  
 SHO_nationalize_foreign_industries: "Захватить иностранные активы"
 SHO_nationalize_foreign_industries_desc: "В настоящее время многие иностранные инвесторы и компании владеют важными активами в наших портах и ​​Кильском канале. Многие из них были незаконно приобретены во время оккупации и поэтому подлежат возврату государству. Мы не можем позволить иностранным спекулянтам иметь право голоса в этих жизненно важных частях нашей экономики."
  
 SHO_expand_public_works: "Развернуть общественные работы"
 SHO_expand_public_works_desc: "Чтобы помочь нашему экономическому возрождению, мы значительно расширим государственные проекты и вместо этого сократим финансирование неэффективных сельских субсидий. Очевидно, что эти проекты помогут снизить безработицу и вдохнуть новую энергию в нашу испытывающую трудности экономику."
  
 SHO_free_healthcare: "Поставка доступного здравоохранения"
 SHO_free_healthcare_desc: "Наше правительство приступит к созданию системы предоставления доступных социальных услуг трудящимся нашей страны, и, что наиболее важно, хорошо функционирующей системы здравоохранения, которая на данный момент сильно недоразвита."
  
 SHO_rural_education: "Деревенщина, учись!"
 SHO_rural_education_desc: "Мы создадим школы в сельской местности, чтобы обучать будущее поколение и привносить в эти районы современные идеи и ценности, пытаясь преодолеть разрыв между городом и землей. Многие из них до сих пор обучаются на дому и не могут позволить организациям, связанным с Фёлькишем, влиять на сельское образование."
  
 SHO_state_supported_unions: "Создание демократических профсоюзов"
 SHO_state_supported_unions_desc: "Многие профсоюзы являются либо коммунистическими, либо крестьянскими профсоюзами. Нам необходимо создать функционирующую систему демократических социальных профсоюзов, которые поддерживают рабочий класс и сдерживают радикализм. Эти профсоюзы станут важной опорой усилий нашего правительства."
  
 SHO_bastion_of_german_democracy: "Бастион немецкой демократии"
 SHO_bastion_of_german_democracy_desc: "Впереди нас ждет великая борьба, борьба за свободу немецкого народа. В нашем крошечном государстве на севере на нас лежит обязанность вернуть Германскую Республику, свергнуть коррумпированных реакционеров на юге, которые готовы обречь Германию на войну, в которой невозможно выиграть. Даже если предстоящий путь мрачный и трудный, мы должны твердо стоять как форт, который выдержит все тиранические попытки поработить немецкий народ."
  
 SHO_hit_and_run: "Тактика «бей и беги»"
 SHO_hit_and_run_desc: "Быстрые атаки и быстрые отступления будут нашей тактикой при борьбе с численно превосходящими силами. Нам придется проявить творческий подход, когда мы столкнемся с Рейхсвером. Если наши войска будут достаточно быстрыми, им будет сложно правильно реагировать на наши движения, а это именно то, что нам нужно."
  
 SHO_expand_kiel_fjords_forts: "Дальнейшие усилия по укреплению"
 SHO_expand_kiel_fjords_forts_desc: "Понятно, что город Киль и его окрестности нуждаются в защите, а не только границы. Мы создадим плотное кольцо бункеров и командных позиций, чтобы отразить любое морское вторжение или атаки с воздуха."
  
 SHO_establish_free_ports: "Создать свободные порты"
 SHO_establish_free_ports_desc: "С ростом политической напряженности мы можем стать нейтральной зоной в Европе, по крайней мере, в плане торговли, и предложить свободные гавани с очень низкими тарифами в качестве торговых узлов между политическими блоками. Это, несомненно, принесет капитал и торговый интерес нашей стране."
  
 SHO_help_the_Kieler_Bank: "Спасти Кильский банк"
 SHO_help_the_Kieler_Bank_desc: "Кильский банк уже много лет находится в глубоком кризисе. В наших усилиях по централизации банковской системы мы выручим этот старый институт и частично национализируем его, чтобы стабилизировать нашу экономику."
  
 SHO_invite_krupp: "Пригласить «Крупп»"
 SHO_invite_krupp_desc: "Germaniawerft — одна из крупнейших судостроительных компаний Центральной Европы. Теперь, когда Германия национализирует свою военную промышленность, мы должны связаться с «Крупп» и предложить ему и его семье, а также беженцам из близкого окружения в Киле в обмен на расширение его деловых предприятий здесь. Мы, безусловно, могли бы получить большую пользу от обширных знаний в области военных технологий, которые они могут предложить."
  
 SHO_heart_of_industry: "Сердце северной промышленности"
 SHO_heart_of_industry_desc: "Наши усилия плодотворны. Киль находится на пути к тому, чтобы стать одним из важнейших торговых центров Северной Европы. Наша промышленность процветает, а безработица сокращается. Этот успех принес нам большое расположение населения, а также необходимые ресурсы для дальнейшего расширения вооружений и промышленности Киля."
  
 # Post-War 
 SHO_spartacus_avenged: "Спартак отомстил"
 SHO_spartacus_avenged_desc: "Совершенно неожиданным и в то же время исторически справедливым результатом мы одержали победу над мерзким злом валькистской Германии. Когда-то социализм был всего лишь мечтой немецкого народа, а теперь мы принесем его всей Германии!"
  
 SHO_commence_devalkification: "Начать девалькификацию"
 SHO_commence_devalkification_desc: "Чума валькистов глубоко проникла в общество. Даже дети страдают, поскольку их ввели в заблуждение, заставив поверить в ложь валькистов, что делает достижение коммунизма практически невозможным. Поэтому мы должны начать кампанию по устранению этих элементов."
  
 SHO_strengthen_the_security_apparatus: "Укрепить аппарат безопасности"
 SHO_strengthen_the_security_apparatus_desc: "Несмотря на все наши усилия, валькизм и прочая реакционная чушь продолжает производить впечатление на народ Германии. Аппарат безопасности до сих пор доказал свою неоценимую эффективность в подавлении этого предательского инакомыслия, и поэтому он заслуживает грандиозного расширения."
 SHO_strengthen_the_security_apparatus_tt: "Сокращает время, необходимое для завершения борьбы с §Yячейками Вервольфа§! в регионах на §G60 дней§!."
  
 SHO_reeducate_the_masses: "Перевоспитать массы"
 SHO_reeducate_the_masses_desc: "Массы, по праву унаследовав мощь старой реакционной машины, все еще имеют некоторые сомнительные убеждения. Будь то вредные заговоры меньшинств, владеющих всем, или ложь об опасностях коммунизма, распространяемая капиталистами, мы должны научить их истинному замыслу рабочего государства."
  
 SHO_crush_the_werwolf: "Раздавить «Вервольф»"
 SHO_crush_the_werwolf_desc: "Действуя в тени, «Вервольфы» оказались настоящей головной болью для правительства, убивая невинных и сея ужас среди населения. Раз и навсегда мы должны полностью уничтожить этих предательских реакционеров, если мы хотим сохранить социалистическое государство."
 SHO_crush_the_werwolf_tt: "Сокращает время завершения борьбы с §Yячейками Вервольфа§! в штатах еще на §G60 дней§!."
  
 SHO_reorganize_the_reich_economic_chamber: "Реорганизация экономической палаты Рейха"
 SHO_reorganize_the_reich_economic_chamber_desc: "Старая экономическая палата, хотя и мечтала о ней безрассудный расист, все же не намного хуже капиталистической системы, которую она унаследовала. Мы должны просто реорганизовать эту систему по истинно социалистическим принципам, чтобы гарантировать, что выгоду получат рабочие, а не реакционные партийные головорезы."
  
 SHO_start_the_rationing: "Начать нормирование"
 SHO_start_the_rationing_desc: "Времена тяжелые, и Германия находится в кризисе. В наше время мы не можем позволить людям просто брать все, что они хотят. Мы все должны сохранять ресурсы для общего блага."
  
 SHO_repeal_valkist_economic_laws: "Отменить валькистские экономические законы"
 SHO_repeal_valkist_economic_laws_desc: "Старые валькистские законы ничего не делают, а лишь оставляют плохое впечатление на государство, не говоря уже о том, что они ограничивают возможность рабочих получать выгоду. От нас зависит, не останется ли ни одна реакционная идея или законодательный акт, открытый для эксплуатации оппортунистами."
  
 SHO_transition_to_market_socialism: "Переход к рыночному социализму"
 SHO_transition_to_market_socialism_desc: "Пришло время оставить позади открытое централизованное планирование. В конце концов, свободный рынок по своей сути не является грубым капиталистическим изобретением, а скорее манипулируется капиталистами. Благодаря государственному управлению и силе рабочих мы можем обеспечить процветание всем немцам."
  
 SHO_five_year_plan: "Пятилетний план"
 SHO_five_year_plan_desc: "Централизованное планирование советского государства вызывает у нас огромное благоговение и удивление. Только благодаря свету Советского государства мы смогли увидеть победу Германии, и мы будем следовать ее экономической модели!"
  
 SHO_stick_with_moskau: "Верность Москве"
 SHO_stick_with_moskau_desc: "Советская линия — это верный курс, и мы всем обязаны Советам. Даже в самые тяжёлые времена они никогда не пытались стереть нас в порошок, а лишь помогали нам двигаться к цели мировой революции — которой мы обязательно достигнем вместе!"
  
 SHO_proclaim_the_fourth_internationale: "Провозгласить Четвертый Интернационал"
 SHO_proclaim_the_fourth_internationale_desc: "Старое Московское государство, ставшее красной империей, жестоко и опорочило имя Маркса и Энгельса. Только дом этих выдающихся коммунистов-революционеров может донести их наследие до всего мира."
  
 SHO_dealing_with_separatists: "Борьба с сепаратистами"
 SHO_dealing_with_separatists_desc: "Случилась великая трагедия: во всех уголках Германии сформировались сепаратистские государства. Разумеется, подобные «государства» — не более чем уловка иностранных империалистов, стремящихся лишить немецкого рабочего власти, и мы обязаны покончить с ними немедленно!"
  
 SHO_rhine: "Призраки 1923 года"
 SHO_rhine_desc: "При странном повороте событий рейнские свободные государства одержали победу, как того желали их хозяева в Париже, и теперь они играют тирана над рабочими Рейна. Даже самопровозглашенные социалисты выдают свой идиотизм, выступая за рабочую революцию в Рейнском государстве – какая глупость! Мы разберёмся с ними немедленно!"
  
 SHO_bavaria: "Реакционный форпост"
 SHO_bavaria_desc: "Сначала форпост реакционного сепаратизма в эпоху Кайзеррейха, а затем и Республики, Бавария и южные земли всегда оказывались устойчивыми к любым революциям. Тем не менее, они всегда стремились принять главного предвестника реакции, валькизм, и, следовательно, их нынешний статус не может оставаться в силе."
  
 SHO_prussia: "Освобождение Востока"
 SHO_prussia_desc: "В прусском государстве всегда было очень много людей, которых раздражала тирания юнкеров и их военных собак. Хотя их власть была сокрушена пролетарской и исторической справедливостью, их злые остатки продолжают существовать в виде маленького государства на востоке, чей пролетариат мы освободим!"
  
 SHO_look_onwards: "Новая ситуация"
 SHO_look_onwards_desc: "Теперь, когда Германия обеспечена, мы можем обратиться к внешнему миру. Однако новый мир во многом весьма чужд старому миру, с которым мы знакомы. По мере того, как возникают новые державы, а старые падают, немецкая революция должна найти способ двигаться дальше."
  
 SHO_reach_out_to_norway: "Обратиться к Норвегии"
 SHO_reach_out_to_norway_desc: "Норвежцы придерживаются социалистической правды и являются народом, с которым мы можем без особого труда ужиться. Мы должны обратиться к ним и сформировать социалистический пояс, который передаст Скандинавию в руки международной революции."
  
 SHO_intervention_in_spain: "Интервенция в Испанию"
 SHO_intervention_in_spain_desc: "Наши испанские братья по оружию связаны с нами большой историей, будь то на полях Каталонии или в лесах Ганновера, международная солидарность трудящихся нашла меньше ярких примеров, чем в нашем товариществе. Теперь пришло время вернуть долг и принести международную революцию в Испанию!"
  
 SHO_allies_in_madrid: "Союзники в Мадриде"
 SHO_allies_in_madrid_desc: "Теперь, когда наши испанские товарищи свободны, давайте обратимся к ним за союзом, который будет держать либеральных империалистов Парижа и Рима в напряжении. Вместе международная революция распространится дальше!"
  
  
