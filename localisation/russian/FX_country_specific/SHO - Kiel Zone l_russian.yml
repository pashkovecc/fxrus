 SHO_fortify_the_elbe: "Укрепить Эльбу"
 SHO_invade_denmark: "Месть 1927"
 SHO_invade_denmark_desc: "В 1927 году рабочие Киля провозгласили Первую Кильскую коммуну, но были разгромлены датскими угнетателями. Мы отомстим датчанам."
 SHO_invade_germany: "Вторгнуться в Германию"
 SHO_peace_out_denmark: "Мир с Копенгагеном"
 SHO_peace_out_denmark_desc: "Мы установили оккупацию Ютландского полуострова, но ценой сочувствия всего мира. Поскольку Германия, похоже, готова наброситься на наш народ, возможно, пришло время закончить войну в нашу пользу, пока мы еще можем."
 SHO_Fallen_Gov: "Падший кабинет"
 SHO_flood_canal: "Кильский канал"
 SHO_flood_canal_desc: "Мы должны разработать план, что делать, если в нашу страну вторгнутся Дресслер или датчане. мы взорвем входы в канал, его берега и дамбы, чтобы затруднить оккупацию канала и города Киля."
 SHO_flood_kiel_canal: "Уничтожить канал"
 SHO_contact_german_resistance: "Связаться с немецкими партизанами-социалистами"
 SHO_contact_german_resistance_desc: "Мы свяжемся с нашими братьями по оружию через границу и создадим тесную сеть с местными ячейками сопротивления. Мы будем поддерживать эти группы оружием и ресурсами, пока они будут предоставлять полезную информацию для нашего дела. Когда придет время, эти мужчины и женщины восстанут против своих угнетателей и присоединятся к нашим вооруженным силам в их марше на Берлин."
 SHO_request_equipment: "Запросить оборудование"
 SHO_request_equipment_desc: "Армии понадобится много техники для предстоящей войны в Европе. Наши заводы производят все, что могут, но у наших промышленных мощностей есть очевидный предел. К счастью, у нас есть выгодная сделка с нашими союзниками, позволяющая нам получить доступ к оружию и оборудованию, которое выходит далеко за рамки наших промышленных возможностей."
 SHO_join_entente: "Встреча в Париже"
 SHO_join_entente_desc: "Нам понадобятся союзники, и мы можем найти их только на Западе. Мы пошлем делегацию в Париж, чтобы изложить наше желание присоединиться к Антанте. Хотя это может вызвать у некоторых удивление из-за наших прошлых сторон в Великой войне, мы надеемся, что сможем убедить их, что мы являемся ценным партнером для окружения Германии с запада."
 SHO_join_internationale: "Наше место в мире"
 SHO_join_internationale_desc: "Мы официально вступим в Коминтерн, чтобы обезопасить нашу страну и продолжить более тесное сотрудничество с другими коммунистическими странами."
