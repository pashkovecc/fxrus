 ### НАЦ ДУХИ

 SHO_anglo_danish_reliance: "Зависимость от Англии и Дании"
 SHO_anglo_danish_reliance_desc: "Кильская зона рассчитывает на поддержку датских и британских властей, чтобы защитить их от немедленной немецкой агрессии. Хотя большинство хотело бы воссоединиться с Германией, многие враги режима Дресслера хотят помешать Дресслеру прийти к власти в Киле. Движение «Свободный город» отчаянно желает международного признания, в то время как другие даже предлагали создать национальное правительство в изгнании в Киле. Более того, Киль экономически зависит от западного импорта, что обременяет все эти политические движения."
 SHO_nazbol_gang: "Родина национал-коммунизма"
 SHO_nazbol_gang_desc: "Шлезвиг-Гольштейн после окончания Великой войны был местом беспорядков и восстаний, как со стороны коммунистических рабочих в городских гаванях, так и со стороны бесправных фермеров в сельской местности. Шлезвиг-Гольштейн стал родиной уникальной формы коммунизма, которая в свете оккупации Антанты, репараций и неспособности веймарского правительства также благоприятствовала радикальному национализму. Таким образом, национал-коммунизм, вероятно, сыграет большую роль в будущем Кильской зоны."
 SHO_nazboler_gang: "Авангард национал-коммунизма"
 SHO_nazboler_gang_desc: "Начав со скромного национал-коммунистического движения, оно продвинулось далеко. Когда-то нас высмеивали как слабую группу наглых экстремистов и отсталых мошенников, но мы наконец доказали, что национализм и коммунизм не только могут сосуществовать, но и должны использоваться вместе. Теперь наш долг — не просто поддержать немецкий народ, но продвигать его интересы и осуществить нашу судьбу путем свержения как реакционеров, так и интернационалистов."
 SHO_Unstable_occupation: "Нестабильная оккупация"
 SHO_Unstable_occupation_desc: "Несмотря на множество договоров и обещаний, Кильская зона оставалась оккупированной зоной под управлением милитаристской комиссии, к большому разочарованию ее населения. Сначала Антанта оккупировала Кильский канал после Великой войны в рамках репарации. Это должно было быть лишь временной мерой, но когда Дресслер пришел к власти и казалось, что гражданская война неизбежна, британцы создали Кильский мандат под управлением комиссии, чтобы защитить свои интересы на севере и изолировать Германию. Этот крайне непопулярный шаг оказался противоположным тому, на что надеялись люди, и теперь, когда мандат истекает, а люди становятся все более беспокойными, оккупационному правительству необходимо найти решение."
 SHO_integrating_denmark: "Интеграция территорий"
 SHO_industrial_burdens: "Промышленное бремя"
 SHO_Exiled_German_Intellectuals: "Изгнанные интеллектуалы"
 SHO_kiel_profits: "Киль Профитс"
 SHO_black_wednesday: "Крах «Нового Кильского банка»"
 SHO_black_wednesday_desc: "После краха «Черной среды» наша экономика находится в упадке. Крупнейшие банки рухнули, и многие предприятия обанкротились. Несмотря на все усилия нашего правительства по предотвращению этого кризиса, безработица резко возросла, а долг, а также инфляция достигли ошеломляющих высот."
 SHO_fund_bank_idea: "Спасение «Нового Кильского банка»"
 SHO_free_port: "Свободный порт"
