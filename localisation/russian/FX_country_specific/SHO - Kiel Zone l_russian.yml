l_russian:
 SHO_FUHRERREICH_DESC: "Из всех регионов, которые будут насильственно отторгнуты у Рейха, лишь немногие воплощают в себе мелочность и жестокость таких условий, как Кильская зона. Рожденный в хаосе конца Великой войны, мандат прожил довольно бесцеремонную и нелюбимую жизнь.\n\nС появлением новой Германии и растущей усталостью оккупантов старый мандат вполне может получить новую жизнь. Однако это будет не со стороны оккупантов и не со стороны Берлина, а, скорее, со стороны как иммигрантов, так и уроженцев земли Шлезвиг-Гольштейн, для которых революция кажется почти гарантированной."
  
