### Decisions
 BLR_power_struggle_category_mission: "Борьба за власть" # Power Struggle
 BLR_power_struggle_category_mission_desc: "Убийство атамана привело к вакууму власти в Беларуси, в настоящее время в стране существуют две фракции, борющиеся за власть. Ополчение, состоящее из генералов, которое контролирует силы безопасности в стране, и BNSP, которое контролирует правительство." # The assassination of the Otaman has resulted in a power vacuum in Belarus, currently there are two factions vying for power in the country. The Home Guard, which is composed of the Generals, which controls the security forces in the country, and the BNSP, which controls the government.

 BLR_power_struggle_category: "Борьба за власть" # Power Struggle
 BLR_power_struggle_category_desc: "Убийство атамана привело к вакууму власти в Беларуси, в настоящее время в стране существуют две фракции, борющиеся за власть. Ополчение, состоящее из генералов, которое контролирует силы безопасности в стране, и BNSP, которое контролирует правительство." # The assassination of the Otaman has resulted in a power vacuum in Belarus, currently there are two factions vying for power in the country. The Home Guard, which is composed of the Generals, which controls the security forces in the country, and the BNSP, which controls the government.
 BLR_act_quickly: "Действуйте быстро" # Act Quickly

 BLR_fabricate_crimes: "Сфабриковать преступления" # Fabricate Crimes
 BLR_fabricate_crimes_desc: "Как Ополчение, мы несем ответственность за поддержание порядка и стабильности внутри страны, а это означает, что у нас есть юрисдикция по расследованию преступлений и так далее – и это можно использовать в своих интересах..." # As the Home Guard, we are responsible for maintaining order and stability within the country, that means we have jurisdictions to crime investigations and so on-and that can be used into our advantage...
 BLR_high_society_favours: "Одолжение высшего общества" # High-Society Favours
 BLR_high_society_favours_desc: "С помощью промышленников, честолюбивых магнатов и даже интеллектуалов мы можем незаметно потянуть за некоторые ниточки и убедиться, что все идет в нашу пользу." # With the help of industrialists, aspiring magnates and even intellectuals, we can discreetly pull some strings and make sure that our everything is on our favour.
 BLR_raid_party_meetings: "Рейдовые партийные собрания" # Raid Party Meetings
 BLR_raid_party_meetings_desc: "Мы можем использовать нашу позицию, чтобы эффективно уничтожить саму партию посредством ее собраний. Совершая на них рейды и арестовывая их видных политиков, мы можем ожидать, что их база поддержки сократится." # We can use our position to effectively destroy the party itself, through their meetings. By raiding them, and arresting their prominent politicians, we can expect that their support base will dwindle.
 BLR_harrass_supporters: "Сторонники Харрасса" # Harrass Supporters
 BLR_harrass_supporters_desc: "Влияние и сила национал-социалистов исходят от их сторонников. Мы можем просто угрожать им, чтобы лишить их поддержки и тем самым снизить влияние БНСП в правительстве." # The influence and power of the National-Socialists come from their supporters. We can simply threaten them in order to withdrew their support and thus lower the influence of the BNSP in the government.
 BLR_recruit_conspiritors: "Вербовать заговорщиков" # Recruit Conspiritors
 BLR_recruit_conspiritors_desc: "Нам понадобятся верные люди, если мы хотим уничтожить угрозу валкистов, и через надлежащие каналы связи мы найдем их и переманим на нашу сторону." # We will need loyal men if we are to take down the Valkist menace, and through proper channels of communication, we will find them and bring them to our side.

 BLR_infiltrate_barracks: "Проникнуть в казармы" # Infiltrate the Barracks
 BLR_infiltrate_barracks_desc: "Ополченцы считают, что их планы могут быть в безопасности внутри крепости, однако достаточно одного солдата-отступника, чтобы раскрыть то, что думает и говорит их командование на своих базах." # The Home Guard thinks their plans may be safe within the fortressess, however it can just take one renegade soldier to expose what their command thinks and says inside their bases.
 BLR_newspaper_propaganda: "Газетная пропаганда" # Newspaper Propaganda
 BLR_newspaper_propaganda_desc: "Письменное слово — это оружие высочайшего калибра, и и ополчение, и национал-социалисты признают этот факт. Увеличивая охват наших лояльных СМИ и открывая новые журналы и газеты, мы добьемся того, что наше слово достигнет большего числа людей, чем слово Гвардии." # The written word is a weapon of the highest calibre, and both the Home Guard and the National-Socialists acknowledge this fact. By increasing our loyal media's reach and setting up new magazines and newspapers, we will make sure our word reaches more people than the Guard's.
 BLR_lower_defense_budget: "Меньший оборонный бюджет" # Lower Defense Budget
 BLR_lower_defense_budget_desc: "Чтобы ослабить Ополчение, законодатель представил новый законопроект, сокращающий для него финансирование. Хотя это может их разозлить, но, вероятно, принесет пользу нам в долгосрочной перспективе." # In order to weaken the Home Guard, a legislator submitted a new bill slashing funds for them. This could anger them though, but will probably benefit us in the long term.
 BLR_gather_peasant_support: "Заручитесь поддержкой крестьян" # Gather Peasant Support
 BLR_gather_peasant_support_desc: "Внешний вид может быть всем для нашего сельского населения, и, показав им, что их лидеры заботятся о нас, мы можем увеличить нашу поддержку среди этого жизненно важного сегмента нашего населения." # Appearances can be everything to our rural population, and by showing them that their leaders cared, we can increase our support amongst this vital segment of our population.
 BLR_public_speeches: "Публичные выступления" # Public Speeches
 BLR_public_speeches_desc: "Чтобы увеличить наше влияние, некоторые предлагают нам провести пару популистских выступлений среди населения, от фермеров до квалифицированных рабочих, мы можем пообещать им то, что они хотят, в обмен на их непоколебимую поддержку нашего правительства." # To increase our influence, some suggest that we conduct a couple of populist speech among the population, from farmers to skilled labourers, we can promise them what they want in return for their unwavering support for our government.

 BLR_defense_fortifications: "Оборонительные приготовления" # Defensive Preparations
 BLR_defense_fortifications_desc: ""
 BLR_against_soviets: "Стройте форты против [FROM.GetAdjective]s" # Construct Forts against the [FROM.GetAdjective]s
 BLR_against_ukraine: "Стройте форты против [FROM.GetAdjective]s" # Construct Forts against the [FROM.GetAdjective]s

