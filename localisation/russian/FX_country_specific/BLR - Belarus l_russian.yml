### Focuses
# Power Struggle
 BLR_half_mast: "Половина мачты" # Half Mast
 BLR_half_mast_desc: "Атаман мертв, а вместе с ним и двоевластие в Беларуси. Пока народ Беларуси оплакивает смерть своего первого президента, две фракции соперничают за контроль над нашей молодой нацией. У БНСП, контролирующего правительство, и Ополчения, контролирующего армию, разные взгляды на свою Беларусь, но только один сможет победить." # The Otaman is dead, and with that the diarchy in Belarus. While the people of Belarus and mourning the death of their first President, two factions are vying for control over our young nation. The BNSP which controls the government, and the Home Guard which controls the army, both have different visions of their Belarus but only one shall come out on top.
 BLR_half_mast_tt: "§GЭтот фокус будет автоматически пропущен после убийства атамана.§!" # §GThis focus will be automatically bypassed once the Otaman has been assassinated.§!
 BLR_remember_his_legacy: "Помните его наследие" # Remember his Legacy
 BLR_remember_his_legacy_desc: "Возможно, атаман и мертв, но мы позаботимся о том, чтобы его наследие существовало вечно. Его смерть – это не конец, а только начало. Мы создадим новую Беларусь, свободную от лжи валкистской угрозы; и как только враги будут побеждены, белорусский народ наконец обретет свое долгожданное независимое государство, которым он действительно сможет гордиться." # The Otaman may be dead, but we will ensure that his legacy endures forever. His death is not the end, but is just the beginning, we will forge a new Belarus, free from the lies of the Valkist menace; and once are enemies have been vaniquished, the Belarusian people will finally have their long awaited independent state that they truly can be proud of.
 BLR_remember_his_legacy_tt: "Этот фокус разблокирует все решения для §NHome Guard§!." # This focus will unlock all decisions for the §NHome Guard§!
 BLR_dawn_of_a_new_belarus: "Рассвет новой Беларуси" # Dawn of a new Belarus
 BLR_dawn_of_a_new_belarus_desc: "Смерть атамана действительно прискорбна, но нам, наконец, следует двигаться дальше; и для нас, наконец, двигаться дальше, мы должны провести радикальные реформы в стране. Устраните все будущие угрозы со стороны нашей власти и создайте новое государство по образцу Валкистского государства в Берлине." # The death of the Otaman is quite indeed unfortunate, but we should finally move on; and for us the finally move on, we must enact sweeping reforms in the nation. Eliminate all future threats from our power and forge a new state according to one in the Valkist state in Berlin.
 BLR_dawn_of_a_new_belarus_tt: "Этот фокус разблокирует все решения для §7BNSP§!." # This focus will unlock all decisions for the §7BNSP§!
 BLR_ensure_unit_loyalty: "Обеспечьте лояльность подразделения" # Ensure Unit Loyalty
 BLR_ensure_unit_loyalty_desc: "Один из способов обеспечить нашу власть и влияние на белорусское государство – это обеспечить лояльность наших войск. Таким образом, само Ополчение не может быть использовано против нас." # One way of ensuring that our grip to power and influence to the Belarusian state is to ensure our troops are loyal to us. This way the Home Guard itself cannot be used against us.
 BLR_meet_with_the_moderates: "Встретьтесь с умеренными" # Meet with the Moderates
 BLR_meet_with_the_moderates_desc: "У нас есть одна общая черта с умеренными, такими как демократы, либералы и консерваторы; и мы, и они оба имеем BNSP и сделаем все, что в наших силах, чтобы вытеснить нынешних валькистских болонок из-под их власти. Для этого мы объединимся с умеренными, чтобы гарантировать себе популярность среди населения, когда мы вытесним BNSP." # We have one thing in common with the moderates, such as the democrats, the liberals and the conservatives; we and them both have the BNSP and would do anything in our power to oust the current Valkist lapdogs from their power. In order to do this, we will ally with the moderates to make sure that we have the popularity from the populace when we oust the BNSP.
 BLR_deploy_the_garrisons: "Размещение гарнизонов" # Deploy the Garrisons
 BLR_deploy_the_garrisons_desc: "Чтобы еще больше обеспечить нашу власть и помочь в планировании свержения нынешнего правительства BNSP, нам следует развернуть ряд резервов в различных" # To further ensure our grip to power and help with our planning in ousting the current BNSP Government, we should deploy a number of reserves in various 
 BLR_request_foreign_support: "Запросить зарубежную поддержку" # Request Foreign Support
 BLR_request_foreign_support_desc: "Антанта, особенно французы и итальянцы, любезно поддержали бы наше дело, если бы это означало, что Беларусь не подвергнется угрозе валкистов. Они с радостью прислали бы нам оборудование, которое будет очень полезно в борьбе с БНСП." # The Entente, specifically the French and Italians would kindly support our cause if it would mean Belarus would not fall into the Valkist menace. They would happily send us equipment which will be very beneficial in fight against the BNSP.
 BLR_entente_economic_advisors: "Экономические советники Антанты" # Entente Economic Advisors
 BLR_entente_economic_advisors_desc: "С тех пор Антанта была нашими друзьями, наши отношения с ними ограничивают как немецкое, так и советское влияние в белорусском государстве; и теперь некоторые выступают за то, чтобы мы приняли предложение Парижа и Рима об экономической помощи, чтобы помочь нам в нашей больной экономике." # The Entente have been our friends since, our relationship with them limits both German and Soviet influences in the Belarusian state; and now some advocates that we accept Paris' and Rome's offering of economic assistance to help us in our ailing economy.
 BLR_increase_entente_trade: "Увеличение торговли Антанты" # Increase Entente Trade
 BLR_increase_entente_trade_desc: "Один из способов потепления отношений между нами и Антантой — это увеличение нашей торговли между ними." # One way of warming the relations between us and the Entente, is to increase our trade between them.
 BLR_final_preparations: "Последние приготовления" # Final Preparations
 BLR_final_preparations_desc: "Наша работа почти завершена, подготовка к предстоящей операции близится к завершению. Планы были составлены и доведены до сведения участвующих офицеров; и со временем с болонками разберутся." # Our work is almost done, the preparations for the upcoming operation is nearing complete. Plans have been being drawn and informed towards the involved officers; and in time, the lapdogs will be dealt with.
 BLR_approach_germany: "Подход к Германии" # Approach Germany
 BLR_approach_germany_desc: "Есть только один союзник, которому мы можем доверять в нашей борьбе в Беларуси, — это немцы. Они с радостью одолжили бы нам оборудование, если бы это означало, что Беларусь окажется под нашей властью, ведь в случае катастрофы у них появится еще один союзник на востоке." # There is only one ally we could trust in our struggle in Belarus, and that is the Germans. They would happily lend us equipment if its means that Belarus would be under our rule, after all they will get another ally in the east when disaster comes.
 BLR_invite_german_industrialists: "Пригласите немецких промышленников" # Invite German Industrialists
 BLR_invite_german_industrialists_desc: "Многие немецкие компании выразили заинтересованность в оказании помощи белорусскому правительству в индустриализации страны при условии, что мы не будем регулировать трудовое законодательство в стране." # Multiple German companies have expressed their interests in helping the Belarusian Government in industrializing the country-provided that we maintain wont regulate the labour laws in the country.
 BLR_the_peoples_militia: "Народная милиция" # The People's Militia
 BLR_the_peoples_militia_desc: "Мы не можем доверять Ополчению в защите государства, поэтому есть планы милитаризировать наши ополчения, чтобы бороться с Ополчением в борьбе за власть." # We cannot trust the Home Guard in defending the state, so there are plans into militarize our militias in order to combat the Home Guard against our power struggle.
 BLR_pass_populist_policies: "Проводить популистскую политику" # Pass Populist Policies
 BLR_pass_populist_policies_desc: "Один из способов получить больше влияния – это принять некоторые законы, которые напрямую затрагивают фермеров, крестьян и всех тех, кто небогат. При идеальном исполнении они могут значительно усилить наше влияние на население." # One way of gaining more influence is for us to pass some laws that directly impact farmers, peasants, and all those who are not well-off. When executed perfectly, these could significantly boost our influence over the population.
 BLR_make_accidents_happen: "Создавайте «несчастные случаи»" # Make 'Accidents' Happen
 BLR_make_accidents_happen_desc: "У нашего правительства все еще есть оппозиция и критики, и, учитывая некоторые слухи о том, что они объединяются с Ополчением, чтобы отстранить нас от власти, мы должны предпринять соответствующие действия, чтобы помешать им добиться успеха." # There are still opposition and critics to our government, and with some rumours of them allying with the Home Guard to oust us from power, we should perform appropriate actions to stop them from succeeding.
 BLR_consolidate_state_assets: "Консолидация государственных активов" # Consolidate State Assets
 BLR_consolidate_state_assets_desc: "Из-за ограниченного объема капитала внутри страны правительство проявляло большую активность в экономике, чтобы стимулировать развитие. Это означает, что государство не только владеет значительной его частью, но также имеет раздувание и неэффективность. Консолидация государственных предприятий и их сокращение помогут снизить государственные расходы и, в долгосрочной перспективе, повысить их эффективность." # Because of the limited amount of capital within the country, the government has been highly active in the economy to help spur development. This means that not only does the state owns a significant portion of it, but also bloat and inefficiencies. Consolidated state enterprises and downsizing will help lower state expenses and, in the long-run, improve their efficiency.
 BLR_study_the_home_guard: "Изучите ополчение" # Study the Home Guard
 BLR_study_the_home_guard_desc: "Хотя эти вооруженные хулиганы все больше и больше раздражают правительство своими попытками отодвинуть его на второй план и править единолично, нельзя отрицать, что их методы весьма полезны. Если правительство BNSP хочет укрепить свою власть в стране, мы должны взять хотя бы несколько страниц из их сценария для своих собственных целей." # While these armed hooligans tend to irk the government more and more through their attempts at side-lining him and ruling alone, one cannot deny that their methods are quite useful. If the BNSP government is to cement its power in the country, we have to take at least a few pages from their play-book for our own ends.
# Industrial
 BLR_industrialization_of_belarus: "Индустриализация Беларуси" # Industrialization of Belarus
 BLR_industrialization_of_belarus_desc: "Наша промышленность отстает от остальной части Восточной Европы. Чтобы больше конкурировать с нашими соседями, улучшить нашу страну в целом и решить собственные экономические проблемы, мы должны начать программу индустриализации Беларуси." # Our industry is lagging behind the rest of eastern Europe, to compete more with our neighbors, overall improve our country and to get out of our own economic issues, we must start a program to industrialise Belarus.
 BLR_start_land_reform: "Начало земельной реформы" # Start the Land Reform
 BLR_start_land_reform_desc: "Многие сельскохозяйственные земли в Беларуси принадлежат богатым землевладельцам, которые используют крестьян для эксплуатации из-за своей жадности. Этому необходимо положить конец: правительство уже готовится начать программу земельной реформы с момента обретения независимости, но внутренние беспорядки привели к тому, что она была отложена. Но поскольку правительство укрепляет свою власть, мы теперь можем возобновить реформы на благо Беларуси." # Many agricultural lands within Belarus are being held by wealthy landowners who use the peasants to exploit for their greed. This has to stop, the government is already preparing to initiate its land reform programs since its independence, but internal turmoil has lead to it being postponed. But as the government solidifies its grip onto power, we are now able to resume the reforms for the greater good of Belarus.
 BLR_concessions_to_the_land_owners: "Уступка землевладельцам" # Concession to the Land Owners
 BLR_concessions_to_the_land_owners_desc: "Один из способов перераспределения земли между земледельцами и фермерами состоит в том, чтобы купить ее у помещиков по очень низкой цене, таким образом они все же в некоторой степени компенсируют свои потери." # One way of redistributing land to the tillers and farmers are to purchase them from their landlords in a very cheap price, that way, they are still somewhat compensated for their losses.
 BLR_seize_large_estates: "Захватить большие поместья" # Seize Large Estates
 BLR_seize_large_estates_desc: "Поскольку жадные помещики уже получили огромную прибыль от эксплуатации крестьян и фермеров; отнять у них земли не только справедливо, но и справедливо по отношению к их плохим делам." # Since the greedy landlords have already profited massively from their exploitation of the peasants and farmers; seizing the lands from them is not only fair but also justice to their bad deeds.
 BLR_resolve_land_disputes: "Разрешение земельных споров" # Resolve Land Disputes
 BLR_resolve_land_disputes_desc: "Хотя земельные реформы прошли успешно, многие недовольные лица досаждают нашим судам нелепыми судебными разбирательствами. Мы должны положить конец и решить все это." # While the land reforms have been a success, many uncontented entities have been plaguing our courts within ridiculous proceedings in court. We must end and resolve all of that.
 BLR_mazyr_oil_refinery: "Мозырский НПЗ" # Mazyr Oil Refinery
 BLR_mazyr_oil_refinery_desc: "На юге Беларуси есть нефтеносные пески, но технологии и капитал, необходимые для их добычи и переработки, нам недоступны. Однако мы можем превентивно инвестировать в нефтеперерабатывающую промышленность, что позволит нам производить некоторое количество топлива из импорта сырой нефти, что может оказаться полезным в любом конфликте на границе." # Southern Belarus is home to oil sands, but the technology and capital required to extract and process it are not available to us. However, we can pre-emptively invest in the refining industry, allowing us to produce some fuel from crude oil imports, which may prove instrumental in any conflict at the border.
 BLR_the_mahilou_metallurgical_plant: "Могилевский металлургический завод" # The Mahilou Metallurgical Plant
 BLR_the_mahilou_metallurgical_plant_desc: "Построенный в 1932 году ММЗ является одним из немногих предприятий тяжелой промышленности в стране и одним из немногих производителей стали в Беларуси. Его расширение обеспечит нам увеличение внутреннего производства, ограничит наш дорогостоящий импорт и расширит нашу промышленную базу." # Built in 1932, MMZ is one of the few heavy industries in the nation, being one of the only producers of steel in Belarus. Expanding it will provide us with more domestic production, limit our costly imports, and expand our industrial base.
 BLR_expand_the_recyca_hardware_plant: "Расширение Речицкого метизного завода" # Expand the Rečyca Hardware Plant
 BLR_expand_the_recyca_hardware_plant_desc: "Построенный в 1912 году братьями Владимиром и Барысом Рыками, метизный завод производит тонны гвоздей и проволоки для строительства и других объектов. Будучи одним из первых металлообрабатывающих производств в [194.GetName], оно стало символом промышленности региона и должно быть модернизировано и расширено. Завод потенциально может достичь ежедневного производства 27 тонн гвоздей, необходимых для многих основных строительных проектов." # Built in 1912 by brothers Uladzimir and Barys Ryk, the Hardware Plant manufactures many tons of nails and wires for construction and other assorted projects. Being one of the first metal processing industries in [194.GetName], it has become a symbol of industry in the region and should be modernised and expanded. The plant could potentially reach daily production of 27 tons of nails needed for many basic construction projects.
 BLR_harajzieja_sugar_plant: "Городеский сахарный завод" # Haradzieja Sugar Plant
 BLR_harajzieja_sugar_plant_desc: "В западной части страны расположены многие предприятия пищевой промышленности, а также земли, выращивающие сахарную свеклу. Строительство мощностей по переработке этой свеклы в сахар-рафинад создаст новую отрасль, которая поддержит белорусских фермеров и простимулирует экономику." # The western part of the country is home to many food-processing industries and is home to its sugar beet-growing lands. Building facilities able to process these beets into refined sugar will create a new industry that will support Belarusian farmers and stimulate the economy.
 BLR_zodzina_power_station: "Жодинская электростанция" # Žodzina Power Station
 BLR_zodzina_power_station_desc: "[206.GetCapitalVictoryPointName] — самый промышленно развитый регион страны. Чтобы повысить производительность, наша промышленность должна иметь доступ к большему количеству энергии. Поскольку торф является одним из самых богатых ресурсов в мире, идеальным вариантом было бы построить на нем теплоэлектростанцию, а лучшим местом для этого стал бы город Жодино." # [206.GetCapitalVictoryPointName] is the most industrially-developed region of the country. To increase productivity, our industry must have access to more power. With peat being one of the most plentiful resources around, a thermal power plant using it would be ideal, with the town of Žodzina being the best location.
 BLR_the_maladziecna_machine_tool_plant: "Молодецкий станкостроительный завод" # The Maladziecna Machine Tool Plant
 BLR_the_maladziecna_machine_tool_plant_desc: "Станки необходимы для любого промышленного расширения. Мы достаточно долго полагались на западный импорт станков; пора начинать отечественное производство... после импорта необходимых инструментов из Антанты нам, к сожалению, не хватает." # Machine tools are a necessity for any sort of industrial expansion. We've relied on Western machine tool imports for long enough; it is time to begin domestic production... after importing the necessary tools we lack from the Entente, sadly.
 BLR_minsk_arms_factory: "Минский оружейный завод" # Minsk Arms Factory
 BLR_minsk_arms_factory_desc: "Промышленность Беларуси находится где-то между отсутствием и отсутствием, а это означает, что мы с трудом производим оборудование, необходимое Народной Армии для выполнения своей роли. К счастью, у нашего союзника есть много старого оборудования, которое он готов продать нам по относительно низкой цене, что позволяет нам приобретать дополнительное оборудование, в то время как наша скудная военная промышленность может оставаться сосредоточенной на том, что она действительно может производить." # The industry of Belarus is somewhere between lacking and non-existent, meaning that we struggle to produce equipment the People's Army require to fulfil its role. Thankfully, our ally has a lot of old equipment it is willing to sell to us for relatively cheap, allowing us to acquire extra hardware while our meagre military industry can remain focused on what it can actually produce.
 BLR_expand_the_belarusian_railways: "Расширить Белорусскую железную дорогу" # Expand the Belarusian Railways
 BLR_expand_the_belarusian_railways_desc: "В рамках нашей политики государственной модернизации мы должны расширить железнодорожную сеть в нашей преимущественно аграрной стране. Мы расширим железнодорожную службу, включив в нее эксплуатацию и управление государственными железными дорогами, аудит и надзор за частными ветками, а также проектирование и строительство новых железных дорог." # As part of our policy on state modernisation, we must expand the rail network in our predominantly agrarian nation. We will expand the Railway Service to include operating and managing state railways, auditing and supervision of private branch roads, and the design and construction of new railways.
 BLR_open_new_universities: "Открывайте новые университеты" # Open New Universities
 BLR_open_new_universities_desc: "Недостаток образования для крестьянства всегда был невероятно серьезной проблемой для нашей молодой нации. Мы уже много лет предпринимаем шаги, чтобы исправить это, и будем продолжать делать это в будущем, поскольку образование является основой любой современной страны." # Lack of education for the Peasantry has always been an incredibly potent issue for our fledgling nation. We've been taking steps to rectify this for years now and we shall keep doing so in the future, for education is the backbone of any modern country.
 BLR_black_wednesday_woes: "Черная среда" # Black Wednesday Woes
 BLR_black_wednesday_woes_desc: "Поскольку мы зависим от экономики Запада, особенно Франции и Великобритании, неудивительно, что последствия «Черной среды» быстро достигли нашей страны, поскольку несколько немецких фирм были вынуждены закрыть свои магазины, оставив многих белорусов безработными. Теперь, когда мы решили проблему земельной реформы, которая затрагивает гораздо большую часть нашего населения, мы можем решить эту новую проблему. На данный момент проекты общественных работ займут наших людей, пока мы оцениваем ущерб." # As we are dependent on the economy of the West, specifically France and Britain, it came to no shock that the aftershocks of Black Wednesday quickly reached our nation as several German firms had to close shop, leaving many Belarusians unemployed. Now that we have dealt with the land reform issue, which affects a much greater portion of our population, we can tackle this new challenge. For now, public works projects will keep our people busy as we assess the damage.
 BLR_black_wednesday_woes_tt: "§GЭтот фокус будет автоматически пропущен после краха лондонской фондовой биржи.§!" # §GThis focus will be automatically bypassed once the London Stock Market Crash has occured.§!
 BLR_nationalize_key_industries: "Национализировать ключевые отрасли промышленности" # Nationalize Key Industries
 BLR_nationalize_key_industries_desc: "Предыдущее правительство всегда поддерживало национализацию некоторых ключевых секторов экономики. Когда иностранные фирмы обанкротятся или уйдут из них, у нас есть хорошая возможность восстановиться после их беспорядка и укрепить экономическое положение нашей страны внутри нашей собственной страны." # The previous Government has always supported the nationalisation of some key sectors of the economy. With foreign firms bankrupt or pulling out, we have a good opportunity to pick up after their mess and strengthen our nation's economic position within our own country.
 BLR_new_industrial_tools: "Новые промышленные инструменты" # New Industrial Tools
 BLR_new_industrial_tools_desc: "Если мы хотим индустриализировать Беларусь, мы не должны довольствоваться устаревшими инструментами, когда мы можем иметь более современные, которые могут повысить производительность труда рабочих." # If we want to industrialize Belarus, we must not be contented on obsolete tools when we can have more modern that can improve the productivity of the workers.
 BLR_invest_in_hydroelectricity: "Инвестируйте в гидроэлектроэнергию" # Invest in Hydroelectricity
 BLR_invest_in_hydroelectricity_desc: "На территорию Беларуси и обратно текут две реки, и наши ученые уже выяснили, что течения этих рек можно использовать для выработки электроэнергии. Поскольку у нас нет финансовых возможностей для строительства нескольких таких гидроэлектростанций, мы, однако, можем построить один, чтобы проверить эффективность этих объектов для белорусского общества и экономики." # There are two rivers flowing to and from the Belarusian territory, and our scientists have already found out that the currents produced by these rivers can be used to generate electricity. As we have no financial capability to construct multiple of these hydroelectric power generators, we can however build one in order to test the effectiveness of these facilities to the Belarusian society and economy.
 BLR_subsidize_the_agricultural_sector: "Субсидирование сельскохозяйственного сектора" # Subsidize the Agricultural Sector
 BLR_subsidize_the_agricultural_sector_desc: "После краха лондонской фондовой биржи многие фермеры влезли в долги, что привело к тому, что они не смогли выращивать больше урожая и, в свою очередь, производить больше продуктов питания для внутреннего потребления или на экспорт. Вливание некоторого финансирования в этот сектор помогло бы смягчить некоторые последствия экономического кризиса." # Since the London Stock Market Crash, multiple farmers have gone into debt, this have lead to them not being able to farm more crops and in turn, produce more food for domestic consumption or exportations. Pouring some funding into this sector would help in alleviating some effects of the economic crisis.
 BLR_expand_farm_to_city_connections: "Расширить связи между фермой и городом" # Expand Farm-to-City Connections
 BLR_expand_farm_to_city_connections_desc: "Прежде чем мы сможем приготовить еду, мы купим ее на рынке, а прежде чем она попадет на рынок, ее следует привезти с ферм из сельской местности. Улучшение ситуации с инфраструктурой в этих районах могло бы помочь облегчить бремя, с которым сталкиваются наши фермеры, когда они доставляют на рынки скоропортящиеся товары." # Before we can cook our food we will purchase it from the market, and before it arrives to the market, it should be brought from the farms from the rural areas. Improving the infrastructure situation in these areas could help alleviate the burden faced by our farmers when they are bringing their perishable goods to the markets.
 BLR_modernize_agricultural_tools: "Модернизация сельскохозяйственных инструментов" # Modernize Agricultural Tools
 BLR_modernize_agricultural_tools_desc: "В целях дальнейшей модернизации нашего сельскохозяйственного сектора Министерство сельского хозяйства предложило нам раздать некоторые современные сельскохозяйственные инструменты, такие как гусеничные тракторы, нашим местным фермерам, чтобы они могли работать более продуктивно, получая при этом удовольствие от своей работы." # To further modernize our agricultural sector, the Agriculture Ministry have proposed that we distribute some modern agricultural tools such as tracktors to our local farmers, that way they can be more productive while enjoying their work.
 BLR_increase_food_exports: "Увеличение экспорта продовольствия" # Increase Food Exports
 BLR_increase_food_exports_desc: "Поскольку мы добились самодостаточности в производстве продуктов питания для собственного внутреннего потребления, у нас есть излишки, на которых можно легко получить прибыль. Есть страны, которые нуждаются в таких товарах, и при подходящей цене мы можем им их предоставить." # As we have secured our self-sufficiency in producing food for our own domestic consumption, we have a surplus that could be easily profited. There are countries that are in need to such goods, and with the right price, we can give it to them.
 BLR_end_of_the_economic_catastrophe: "Конец экономической катастрофы" # End of the Economic Catastrophe
 BLR_end_of_the_economic_catastrophe_desc: "Хотя у нас нет промышленного потенциала Великобритании или Франции, наша экономика никогда не была такой процветающей. Безработица находится на рекордно низком уровне, существует процветающий и растущий средний класс, и жизнь начинает улучшаться." # While we do not have the industrial capabilities of Britain or France, our economy have never been this thriving. Unemployment is in an all-time low, there is a thriving and increasing middle class and life are starting to improve.
# Army
 BLR_formalize_the_belarusian_armed_forces: "Оформить Вооруженные Силы Беларуси" # Formalize the Belarusian Armed Forces
 BLR_formalize_the_belarusian_armed_forces_desc: "Формирование Белорусской народной армии было, мягко говоря, непростым делом. Из-за первоначального недоверия со стороны немецкой армии и большевистского переворота формальная армия была создана только в 1919 году, и она столкнулась с дальнейшими трудностями в обеспечении оружия и энтузиазма как со стороны народа, так и со стороны правительства. С возобновлением беспокойства по поводу советской угрозы, наконец, появился интерес к военной реформе и расширению теперь, когда на карту поставлено само выживание нации." # The formation of the Belarusian People's Army was a tumultuous affair, to say the least. With initial distrust from the German Army and a Bolshevik coup, it wouldn't be until 1919 that a formal army was created, and it faced further difficulties in securing arms and enthusiasm from either the people or government. With renewed worries about the Soviet threat, there is finally interest in military reform and expansion now that the nation's very survival is at stake.
 BLR_establish_the_belarusian_air_force: "Создать белорусские ВВС" # Establish the Belarusian Air Force
 BLR_establish_the_belarusian_air_force_desc: "Хотя еще предстоит пройти долгий путь, прежде чем Народная армия сможет самостоятельно защитить небо Беларуси, создание официальных военно-воздушных сил является важным шагом, которым наш народ может по-настоящему гордиться. Воздушная война становится все более важной частью современной войны, и, несмотря на то, что мы поздно начали, белорусский народ наконец-то сможет сражаться с нашими врагами высоко над нашими домами." # While there is still a long way to go before the People's Army can protect the skies of Belarus on its own, the creation of a formal air force is an important step our people can be truly proud of. Air warfare has become an increasingly important part of modern war, and despite our late start, the Belarusian people will finally be able to fight off our enemies high above our homes.
 BLR_fighter_modernization: "Модернизация истребителя" # Fighter Modernization
 BLR_fighter_modernization_desc: "В последние годы мы приступили к разработке собственных проектов истребителей при участии наших западных союзников (в первую очередь Франции). Кажется, наши усилия окупились. Тестирование показало весьма положительный результат. Таким образом, мы должны развернуть нашу недавно разработанную авиацию для массового производства." # In recent years we've taken to developing our own Fighter designs, with some joint effort from our western allies (primarily France). Our efforts have paid off, it seems. Testing has shown a very positive result. As such, we should deploy our newly developed aviation for mass production.
 BLR_bomber_acquisition: "Приобретение бомбардировщика" # Bomber Acquisition
 BLR_bomber_acquisition_desc: "Чтобы эффективно использовать наше превосходство в воздухе, мы должны воспользоваться этой возможностью, чтобы нарушить логистику противника и связанные с войной действия, чтобы переломить ход битвы на местах. Наличие бомбардировочных подразделений именно в этом нам поможет, хотя нам, возможно, придется импортировать их из некоторых опытных стран." # To effectively utilize our air superiority we should take the opportunity to disrupt enemy logistics and war-related activities so turn the tide of the battle in the field. Having bomber units will help us exactly that though we may need to import them from some experienced countries.
 BLR_cas_development: "КАС Девелопмент" # CAS Development
 BLR_cas_development_desc: "Поддержка наших войск на поле боя поможет нам выиграть отдельные сражения и, в конечном итоге, всю войну." # Supporting our troops in the battlefield will help us win the individual battles and in the long run the war.
 BLR_pilot_training: "Обучение пилотов" # Pilot Training
 BLR_pilot_training_desc: "Создание ВВС – это очень большая задача, и без помощи иностранцев она будет просто невозможна. К счастью, наши более сильные союзники имеют гораздо больший опыт ведения воздушной войны и могут помочь нам с инструкторами в подготовке пилотов и механиков для будущего Военно-воздушного флота." # Building an air force is a very big task and it will simply not be possible without help from foreigners. Thankfully, our stronger allies have far more experience in air warfare and can help us with instructors to train pilots and mechanics for the future Military Air Fleet.
 BLR_nowogrodek_airfields: "Аэродромы Новогродек" # Nowogrodek Airfields
 BLR_nowogrodek_airfields_desc: "В районе Новогродека идет устойчивая индустриализация, и на его окраине была создана авиабаза и объекты, необходимые для ремонта самолетов. Расширив авиабазу и ремонтную базу, мы сможем дать толчок белорусской авиационной промышленности и начать самостоятельно готовить механиков и инженеров." # The region of Nowogrodek has been steadily industrialising and an air base was created in its outskirts along with the facilities required to repair aircraft. By expanding the air base and the repair facilities, we can jumpstart the Belarusian aeronautics industry and begin training mechanics and engineers on our own.
 BLR_construct_air_defenses: "Построить противовоздушную оборону" # Construct Air Defenses
 BLR_construct_air_defenses_desc: "Хотя мы наращиваем наши усилия по совершенствованию наших военно-воздушных сил, нам также следует учитывать оборонительную часть воздушной войны, а не только наступление; строительство объектов противовоздушной обороны, таких как зенитные орудия, защитит не только наши города, но и нашу армию." # While we have been beefing up our efforts in improving our air force, we should also consider the defensive part of air warfare not just the offense; building facilities for air defense such as anti-air guns will protect not only our cities but also our military.
 BLR_rocketry_technology: "Ракетные технологии" # Rocketry Technology
 BLR_rocketry_technology_desc: "Ракетная техника дальнего действия является в высшей степени экспериментальной, и поэтому мы ожидали, что наше высшее командование останется равнодушным к этой концепции. Однако они видят необходимость в возможности нанести ответный удар по нашим врагам в зонах, находящихся вне досягаемости ВВС." # Long range rocketry is highly experimental, and as such, we expected our high command to be unmoved by the concept. However, they see the need for the capacity to strike back at our enemies in zones simply outside the reach of the air force.
 BLR_status_of_the_home_guard: "Статус ополчения" # Status of the Home Guard
 BLR_status_of_the_home_guard_desc: "Ополчение — вооруженное крыло Белорусской Народной Республики в сфере обороны и внутренних дел. Однако звучат призывы реформировать его или расширить." # The Home Guard is Belarussian National Republic's armed wing in terms of defense and domestic affairs. However there are calls to reform it or to expand it.
 BLR_the_high_command: "Белвайскрада" # The Belvaiskrada
 BLR_the_high_command_desc: "Белорусский центральный военный совет, или Белвайскрада, был сформирован в ноябре 1917 года для организации первых белорусских воинских частей, но был расформирован в следующем году, когда немецкая армия оккупировала Минск, что отложило создание Народной армии более чем на год. Цель возрожденной Белвайскрады — превратить нынешнее ополчение в полноценную, современную военную силу, которая сможет постоять за себя, насколько это возможно, уделяя особое внимание качеству офицеров, унтер-офицеров и подготовке." # The Belarusian Military Central Council, or Belvaiskrada, was formed in November 1917 to organise the first Belarusian military units, but was disbanded the next year as the German Army occupied Minsk, delaying the creation of the People's Army by over a year. The purpose of the revived Belvaiskrada is to transform the current Home Guard into a proper, modern military force that can stand up on its own as much as possible, focusing on the quality of officers, NCOs, and training.
 BLR_an_art_of_war: "Искусство войны" # An Art of War
 BLR_an_art_of_war_desc: "Как ни стыдно это говорить, но у нас нет более новых руководств по ведению боя, зато есть устаревшие на русском языке. Есть, конечно, неофициальные переводы от образованных офицеров и добровольцев, но официальных руководств на белорусском языке до сих пор нет. С ростом грамотности людей настало время составить современные армейские руководства на нашем родном языке." # As embarrassing as it is to say, we do not have newer manuals for the battlefield, though have an outdates ones in Russian. There are, of course, unofficial translations from educated officers and volunteers, but there are still no formal manuals in Belarusian. With the increasing literacy of the people, it is more than about time to compile modern army manuals in our own language.
 BLR_increase_conscription: "Увеличение призыва на военную службу" # Increase Conscription
 BLR_increase_conscription_desc: "Великая война, без сомнения, показала, что современные войны принимают совершенно безумные масштабы, привлекая воевать миллионы людей со всех сторон. Каждый белорус должен знать, что однажды ему, возможно, придется защищать свою любимую страну от врагов. Мы потерпим поражение только тогда, когда погибнет последний из нас!" # The Great War showed without a doubt that modern wars now take absolutely insane scales, drafting millions to fight on every side. Every Belarussian must know that one day, he may be called to defend his beloved country against the enemies. We will only be defeated when the last of us perish!
 BLR_fortify_defensive_positions: "Укрепляйте оборонительные позиции" # Fortify Defensive Positions
 BLR_fortify_defensive_positions_desc: "Хотя граница по рекам Днепр и Двина отрезает нас от более чем миллиона белорусов, находящихся под советским гнетом, она дает нам и нашим союзникам гораздо лучшую оборонительную позицию, когда Советы неизбежно вернутся." # While the border on the rivers Dnieper and Dvina cuts us off from well over a million Belarusians under Soviet oppression, it gives us and our allies a far better defensive position when the Soviets inevitably return.
 BLR_fortify_defensive_positions_tt: "£decision_icon_small §GРешения§! относительно §cпостройки фортов§! вдоль границы будут §Yразблокированы§!" # £decision_icon_small  §GDecisions§! concerning §cconstructing forts§! along the border will be §Yunlocked§!
 BLR_support_companies: "Поддерживающие компании" # Support Companies
 BLR_support_companies_desc: "Технические войска Народной армии остаются более или менее разовыми, неформальными организациями, инженеров которых часто отправляют на обучение во Францию. С ростом числа образованных технических специалистов в армии пришло время организовать их в формальные подразделения. Кроме того, официальные обозначения получат и наши штурмовые подразделения, также подготовленные по немецкому образцу." # Technical troops in the People's Army remain more-or-less ad-hoc, informal organisations, with engineers often sent to train in France. With the growing number of educated technicians in the army, it is time to organise them into formal units. Furthermore, our assault units, also trained on the German model, will also gain formal designations.
 BLR_equipment_production: "Производство оборудования" # Equipment Production
 BLR_equipment_production_desc: "Мы не должны зависеть от импорта оружия из соседних стран, мы должны вкладывать средства в производство собственного оружия отечественной разработки, которое будут использовать наши солдаты." # We should not be dependent in importing weapons from our neighboring countries, we should pour funding in producing our own home-developed weapons that our soldiers will use.
 BLR_new_arsenals: "Новые Арсеналы" # New Arsenals
 BLR_new_arsenals_desc: "Когда дело дошло до создания военной промышленности, в царскую эпоху Беларусь полностью игнорировалась. Таким образом, в стране отсутствуют даже базовые мощности для производства боеприпасов. В целях снижения нашей зависимости от иностранного импорта и в качестве важной отправной точки развития военно-промышленного комплекса мы начнем строительство предприятий по производству винтовочных и пистолетных боеприпасов." # When it came to establishing military industries, Belarus was thoroughly ignored during the Tsarist era. As such, the country lacks even the basic facilities to produce ammunition. In order to reduce our dependence on foreign imports and as an important entry-point in developing a military industrial sector, we will begin constructing facilities able to produce rifle and pistol ammunition.
 BLR_equipment_standardization: "Стандартизация оборудования" # Equipment Standardization
 BLR_equipment_standardization_desc: "Запасы оружия Ополчения представляют собой эклектичный беспорядок из императорских русских и немецких винтовок, пистолетов и даже артиллерийских орудий разных калибров. Это создает логистический кошмар для армии, поскольку ей приходится поставлять нашим силам множество типов боеприпасов. Эта проблема будет решена только после оптимизации и стандартизации нашего оборудования." # The Home Guard's stockpile of weapons is an eclectic mess of Imperial Russian and German rifles, pistols, and even artillery pieces, all using different calibres. This creates a logistical nightmare for the Army, having to supply many types of ammo to our forces. This issue will only be solved once we streamline and standardise our equipment.
 BLR_artillery_modernization: "Модернизация артиллерии" # Artillery Modernization
 BLR_artillery_modernization_desc: "Артиллерия была ключевым компонентом войны со времен наполеоновских войн и сыграла решающую роль во время Великой войны. Инвестиции в эту технологию были бы чрезвычайно полезны, поскольку артиллерия может вести огонь на расстояния, недоступные для пехоты." # Artillery has been a key component of war ever since the Napoleonic Wars and had played a crucial role during the Great War. Investing in this technology would be extremely helpful as artillery is able to be fired towards distances that infantry cannot reach.
 BLR_cavalry_motorization: "Кавалерийская моторизация" # Cavalry Motorization
 BLR_cavalry_motorization_desc: "По мере улучшения нашей промышленности и инфраструктуры мы, наконец, можем приступить к рассмотрению вопроса о моторизации наших сил. В рамках нашей доктрины сохранения наших войск легкими, мобильными и скрытыми от врага, наша кавалерия получит наибольшую выгоду от автомобилей и бронетехники. Создание бронекавалерии значительно повысит огневую мощь наших мобильных сил." # As our industry and infrastructure improve, we can finally begin considering the motorisation of our forces. As part of our doctrine of keeping our troops light, mobile, and concealed from the enemy, our cavalry force would benefit the most from motor vehicles and armour. The creation of an armoured cavalry will greatly improve the firepower of our mobile forces.
 BLR_tank_procurement: "Закупка танков" # Tank Procurement
 BLR_tank_procurement_desc: "Механизация сельского хозяйства создала самую выдающуюся отрасль Беларуси: сельскохозяйственные тракторы. С развитием нашего автомобильного и сельскохозяйственного машиностроения появилась возможность переоборудовать гражданскую продукцию в военную технику, в том числе танки." # Agricultural mechanisation has created Belarus' most prominent industry: Agricultural tractors. With the growth of our automotive and agricultural machinery industry, it is possible to convert civilian production into military vehicles, including tanks.
 BLR_experimental_tank_corps: "Экспериментальный танковый корпус" # Experimental Tank Corps
 BLR_experimental_tank_corps_desc: "Если и есть одно военное преимущество аграрной страны с растущей механизацией сельского хозяйства, так это то, что многие наши солдаты знакомы с автомобилями. С увеличением количества грузовиков и даже бронетехники на поле боя мы можем использовать их для улучшения нашей логистической ситуации, несмотря на неидеальную инфраструктуру страны." # If there is one military benefit of being an agrarian nation with increasing agricultural mechanisation, it's that many of our soldiers are familiar with motor vehicles. With the increasing number of trucks and even armoured vehicles on the battlefield, we can use it to improve our logistical situation despite the less-than-ideal infrastructure of the country.
 BLR_experimental_tank_corps_tt: "§7Получить §Y[Root.GetAdjective] шаблон бронетехники§! следующего состава:\n - 4 £GFX_unit_light_armor_icon_small батальонов\n - 4 £GFX_unit_motorized_icon_small батальонов;\n\nСоздать дивизию §Y3§! с вновь полученными шаблон§!\n" # §7Receive §Y[Root.GetAdjective] Armored§! template with the following composition:\n - 4 £GFX_unit_light_armor_icon_small battalions\n - 4 £GFX_unit_motorized_icon_small battalions;\n\nSpawn §Y3§! division with newly gained template§!\n
 BLR_automobile_repair_facilities: "Авторемонтные предприятия" # Automobile Repair Facilities
 BLR_automobile_repair_facilities_desc: "Авторемонтный завод [206.GetCapitalVictoryPointName] оказался неотъемлемой частью индустриализации Беларуси, помогая обслуживать и ремонтировать растущее количество автомобилей в сельскохозяйственном и промышленном секторах. Он может и будет мобилизован для участия в военных действиях, ремонтируя и модернизируя технику нашей армии и вооруженных сил наших союзников." # The [206.GetCapitalVictoryPointName] Automobile Repair Plant has proved to be an integral part of Belarus' industrialisation, helping maintain and repair the increasing amount of motor vehicles in the agricultural and industrial sectors. It can and will be mobilised for the war effort, repairing and upgrading the vehicles of our and our allies' military.
 BLR_defense_of_belarus: "Оборона Беларуси" # Defense of Belarus
 BLR_defense_of_belarus_desc: "Наши падшие братья и соотечественники пролили кровь за нашу собственную нацию; и наш долг сейчас – сделать так, чтобы их жертвы ради белорусского государства не были напрасными." # Our fallen brothers and countrymen have bled for us a nation of our own; and we our duty now is to make sure that their sacrifices for the Belarussian state will not be in vain.
# BNSP
 BLR_bnsp_secures_power: "BNSP обеспечивает электроэнергию" # BNSP Secures Power
 BLR_bnsp_secures_power_desc: "После долгой борьбы с предательским ополчением мы закрепили контроль над белорусским государством. Атаман мертв, и вместе со старой Беларусью, которую он сформировал для себя, будет создано новое белорусское государство с новым возрожденным национализмом и идентичностью." # After a long a struggle against the traitorous Home Guard, we have cemented our control over the Belarusian state. The Otaman is dead, and with that, the old Belarus he molded unto himself, a new Belarusian state will be created with a new revived nationalism and identity.
 BLR_bnsp_secures_power_tt: "§GЭтот фокус будет автоматически обойден, как только БНСП получит контроль над Беларусью.§!" # §GThis focus will be automatically bypassed once the BNSP has secured control over Belarus.§!
 BLR_new_economic_plan: "Новый экономический план" # New Economic Plan
 BLR_new_economic_plan_desc: "Поскольку депрессия, вызванная «Черной средой», подошла к концу, мы должны сделать все возможное, чтобы такой коллапс никогда больше не повторился. Для этого нам следует создать правительственную организацию, ориентированную на долгосрочную экономическую политику." # With the depression brought on by Black Wednesday at an end, we must make certain that such a collapse never happens again. To do so, we should establish a governmental organisation focused on long-term economic policy.
 BLR_contracts_with_aeg: "Контракты с AEG" # Contracts with AEG
 BLR_contracts_with_aeg_desc: "Для дальнейшей модернизации сельских регионов Беларуси было предложено партнерство между нами и Allgemeine Elektricitäts-Gesellschaft или AEG. Они будут инвестировать в нашу местную электрическую компанию, которая, в свою очередь, модернизирует свои мощности, чтобы удовлетворить растущий спрос на электроэнергию." # To further modernize the rural regions of Belarus, a partnership between us and the Allgemeine Elektricitäts-Gesellschaft or the AEG has been proposed. They will invest in our local electric company which in turn modernize its facilities to accomodate in the growing demand for electricity.
 BLR_arsenals_of_the_state: "Арсеналы государства" # Arsenals of the State
 BLR_arsenals_of_the_state_desc: "Хотя у нас есть заводы, занимающиеся производством военной продукции, многие из них больше склонны производить музейные копии, чем настоящую военную технику. Потребность в новых арсеналах острая, мы должны действовать и быстро." # While we do have some plants dedicated to production of military goods, many are more apt to produce museum replicas than proper military hardware. The need for new arsenals is urgent, we must act and quickly.
 BLR_create_labour_laws: "Ослабление трудового законодательства" # Loosen Labour Laws
 BLR_create_labour_laws_desc: "За короткое время, когда Грамада пришла к власти, они ввели в действие строгие и всеобъемлющие законы о труде, которые отдавали предпочтение работникам, а не владельцам. Это делает иностранные компании менее склонными инвестировать, даже при относительно более низких затратах. Ослабление этих законов, несмотря на протесты Всебелорусского конгресса профсоюзов, поможет сделать инвестиции в нашу страну более привлекательными." # The short time the Hramada came into power they implemented strong and comprehensive labour laws that favoured workers over owners. This makes foreign companies less eager to invest even with the relatively lower costs. Loosening these laws, despite the protests of the All-Belarusian Congress of Trade Unions, will help make investing in our country more attractive.
 BLR_new_cities: "Новые города" # New Cities
 BLR_new_cities_desc: "Отличный способ подготовиться к нашему экономическому процветанию — это построить новые города, которые смогут сократить население крупных городов страны. Таким образом, люди будут иметь более высокий уровень жизни." # A great way to prepare for our economic prosperity is to build new cities that can reduce the population in major cities in the country. That way, the people will experience a higher standard of living.
 BLR_education_desecularization: "Десекуляризация образования" # Education Desecularization
 BLR_education_desecularization_desc: "Настойчивость БСДП в отношении чисто светского образования оказалась основным препятствием для тяжелого положения наших учреждений. Католическая и Православная церкви стремятся помочь повысить грамотность среди бедных крестьян, большинства населения страны, и привить им хорошие ценности. Мы решим проблему грамотности гораздо проще и быстрее, позволив им снова организовывать школы." # The BSDP's insistence on purely secular education has proved to be a major roadblock for the struggling situation of our institutions. The Catholic and Orthodox churches are keen to help improve literacy among the poor peasants, the majority of the nation's population, and instil good values in them. We will solve the literacy issue much more easily and quickly by letting them organise schools again.
 BLR_belarusian_nationalism: "Белорусский национализм" # Belarusian Nationalism
 BLR_belarusian_nationalism_desc: "Чтобы белорусская нация выжила, у людей должно быть чувство патриотизма, немного пропаганды здесь и там, и многие будут готовы сражаться за свою Родину." # The people needs to have a sense of patriotism in order for the Belarusian nation to survive, a couple of propaganda here and there and many would be willing to fight for their motherland.
 BLR_promote_russophobia: "Пропаганда русофобии" # Promote Russophobia
 BLR_promote_russophobia_desc: "Хотя социализм представляет собой угрозу, нет большей угрозы, чем москвичи Востока, наши старые угнетатели. Они вернутся и снова попытаются нас уничтожить, но мы не можем этого допустить. Мы никогда не сможем вернуться под их сапог, и мы либо победим, либо погибнем в борьбе за существование." # While Socialism is a threat, there is no bigger threat than the Muscovites of the East, our old oppressors. They will return, and they will try to destroy us once again, but we cannot allow it to happen. We can never return under their boot, and we will either prevail or die in our struggle for existence.
 BLR_the_peoples_army: "Народная армия" # The People's Army
 BLR_the_peoples_army_desc: "Наша армия находится в небольшом замешательстве после политического кризиса, и мы должны быстро реорганизовать наши вооруженные силы, чтобы защитить нас от тех, кто может разрушить белорусское государство." # Our army is in slight disarray after the political crisis, and we must move quickly to reorganise our armed forces to protect us from those who would bring down the Belarussian state.
 BLR_the_peoples_army_tt: "\nНесколько §Gстрелковых дивизий§! будут сформированы в различных районах страны." # \nMultiple §GRifle Divisions§! will be raised in various areas of the country.
 BLR_empower_the_rada: "Расширение возможностей Рады" # Empower the Rada
 BLR_empower_the_rada_desc: "В рамках наших реформ, призванных гарантировать, что социалистический переворот никогда не произойдет, мы должны укрепить Раду и Президента. Формально это превратит Белоруссию в президентскую систему вместо парламентской." # As part of our reforms to ensure a Socialist takeover can never happen, we must strengthen the Rada and the President. This will formally transform White Ruthenia into a presidential system instead of a parliamentary one.
 BLR_work_with_the_germans: "Работайте с немцами" # Work with the Germans
 BLR_work_with_the_germans_desc: "«Штальпакт» — это последний мировой барьер против Антанты и ее империалистических тенденций. Крайне важно, чтобы мы углубили наши связи с Германией, чтобы помочь ей победить величайшую угрозу Европы." # The Stahlpakt is the world's last barrier against the Entente and their imperialistic tendencies. It is imperative that we deepen our ties with Germany to help them defeat Europe's greatest threat.
 BLR_german_equipment: "Немецкое оборудование" # German Equipment
 BLR_german_equipment_desc: "Германия и ее запасы техники являются источником жизненной силы наших оборонных усилий. Пока мы не сможем наладить местную промышленность по производству стрелкового оружия, поставки оружия из Вермахта будут нашим единственным средством вооружения." # Germany and their equipment stocks are the lifeblood of our defence efforts. Until we can get a local small arms industry going, arms shipments from the Wehrmacht are our only means of armament.
 BLR_german_officer_training: "Обучение немецких офицеров" # German Officer Training
 BLR_german_officer_training_desc: "Военные оказались спасителями нашей нации, поэтому вполне естественно, что им будет гарантировано представительство в нашем правительстве и Сойме. Таким образом, будет более прямая связь между гражданскими и военными, что позволит последним более своевременно (и законно) вмешиваться в любые социалистические заговоры в будущем." # The military has proven to be our nation's saviour, so it is only natural that they would be guaranteed representation in our government and the Sojm. This way, there will be a more direct connection between civilian and military and will allow the latter to intervene against any Socialist plots in a more timely (and legal) manner in the future.
 BLR_stahlpakt_trade: "Штальпакт Трейд" # Stahlpakt Trade
 BLR_stahlpakt_trade_desc: "Германия не может защитить Европу от социализма и французского империализма в одиночку, а мы слишком долго были незначительной частью рейхспакта. Настало время увеличить наш вклад в общую оборону Миттельевропы, особенно в условиях растущей российской угрозы." # Germany cannot defend Europe from Socialism and French imperialism alone, and we have been a minor part of the Reichspakt for far too long. It is time that we increase our contributions to Mitteleuropa's common defence, especially with the rising Russian threat.
 BLR_the_new_belarus: "Новая Беларусь" # The New Belarus
 BLR_the_new_belarus_desc: "Ясно, что для того, чтобы избежать безбожной социалистической революции, должна произойти Национальная революция, которая уведет нацию от левой агитации. Это то, что представляет собой наше правительство, и мы поведем белорусский народ к будущему, свободному от иностранных агитаторов." # It is clear that to avoid a godless Socialist revolution, a National one must take place to lead the nation away from leftist agitation. This is what our government represents, and we will lead the Belarusian nation towards a future free of foreign agitators.
# Democratic
 BLR_the_home_guard_in_control: "Ополчение под контролем" # The Home Guard in Control
 BLR_the_home_guard_in_control_desc: "Ополчение вмешалось как раз вовремя, чтобы спасти страну от радикальных валкистов из БНСП. Пока в Минске едва улеглась пыль, валькисты взялись за оружие, чтобы продолжить борьбу на селе. Чтобы защитить нацию от них и гарантировать, что мы остаемся свободными от валкизма." # The Home Guard has stepped in just in time to save the country from the radical Valkists of the BNSP. While the dust has barely settled in Minsk, the valkists have taken up arms to continue the fight in the countryside. To secure the nation from them and ensure that we remain free from Valkism.
 BLR_the_home_guard_in_control_tt: "§GЭтот фокус будет автоматически пропущен, как только Ополчение установит контроль над Беларусью.§!" # §GThis focus will be automatically bypassed once the Home Guard has secured control over Belarus.§!
 BLR_secure_the_new_state: "Защитить новое государство" # Secure the New State
 BLR_secure_the_new_state_desc: "Хотя Ополчение контролирует государственный аппарат в Беларуси, все еще существуют угрозы, исходящие от остатков старого правительства БНСП и его сторонников. Нам нужно убедиться, что эти лоялисты не будут проблемой для государства." # While the Home Guard have controlled the apparatus of state in Belarus, there are still lingering threats that is the remnants of the old BNSP Government and their loyalists. We need to make sure that these loyalists won't be a problem for the state.
 BLR_purge_the_ultra_radicals: "Очистите ультрарадикалы" # Purge the Ultra Radicals
 BLR_purge_the_ultra_radicals_desc: "Несмотря на то, что мы серьезно ослабили их своей победой в борьбе за власть, мы не можем недооценивать влияние, которое наши враги оказывают на нацию. Если мы хотим обеспечить процветающее будущее Беларуси, нам нужно будет прекратить охоту на них в горах, лесах и городах. Только тогда наш народ познает мир!" # Despite having severely weakened them with our victory during the power stuggle, we cannot underestimate the influence our enemies hold on the nation. If we want to secure a prosperous future for Belarus, we will need to finish hunting them down through mountains, forests and cities. Only then our nation will know peace!
 BLR_the_new_elections: "Новые выборы" # The New Elections
 BLR_the_new_elections_desc: "Поскольку кризис закончился и государство было очищено от радикальных элементов BNSP, Ополчение решило провести новые выборы как президента, так и членов Сойма. Прислушавшись к этим призывам, мы наконец сможем по-настоящему стать демократической республикой, о которой все мечтали." # With the crisis at an end and the state have been purged from the radical elements of the BNSP, the Home Guard now decided that a new election for both the Presidency and the seats of the Sojm be called. By heeding these calls, we can at last truly become the democratic republic everyone dreamt of.
 BLR_hramada_victory: "Грамада Победа" # Hramada Victory
 BLR_hramada_victory_desc: "Обещая больше реформ в экономическом и социальном плане, Грамада победила на [GetYear] выборах. Что они принесут дальше?" # Promising more reforms economically and socially the Hramada have won the [GetYear] Elections. What would they bring next?
 BLR_hramada_victory_tt: "§GЭтот фокус будет автоматически пропущен после победы Грамады на выборах.§!" # §GThis focus will be automatically bypassed once the Hramada has won the elections.§!
 BLR_christian_democrats_victory: "Победа христианских демократов" # Christian Democrats Victory
 BLR_christian_democrats_victory_desc: "К большому шоку для нации, христианские демократы заняли первое место на выборах. Каковы будут их планы по улучшению Республики?" # In a great shock to the nation, the Christian Democrats have found their way top on the Elections. What would their plans be to improve the Republic?
 BLR_christian_democrats_victory_tt: "§GЭтот фокус будет автоматически пропущен после победы христианских демократов на выборах.§!" # §GThis focus will be automatically bypassed once the Christian Democrats has won the elections.§!
 BLR_the_central_bank: "Белорусский Центральный Банк" # The Belarusian Central Bank
 BLR_the_central_bank_desc: "По сей день у белорусов нет центрального банка. Центральная банковская система Минска позволит малому бизнесу Минска легче финансировать новые предприятия и инвестировать в более эффективное производство." # To this day, the Belarussians do not have a central bank. A central banking system for Minsk will allow its small business class to more easily fund new ventures and invest in more efficient production.
 BLR_education_reforms: "Реформы образования" # Education Reforms
 BLR_education_reforms_desc: "Модернизация учебных программ высшего образования является ключевым шагом в увеличении предложения белорусских экспертов. Только благодаря реформированной школьной системе в западном стиле мы сможем оставаться конкурентоспособными." # Modernising the higher education curriculae is a key step in increasing the supply of Belarusian experts. Only through Western-style reformed school system we can stay competitive.
 BLR_industrial_subsidies: "Промышленные субсидии" # Industrial Subsidies
 BLR_industrial_subsidies_desc: "Черная среда сильно ударила по многим местным предприятиям; без защиты своего правительства – многие компании были вынуждены обанкротиться. Теперь, когда наша экономика медленно восстанавливается, пришло время реинвестировать в нашу гражданскую экономику. Чтобы стимулировать рост бизнеса, правительство предоставит им субсидии в качестве инвестиций и поможет компаниям встать на ноги." # Black Wednesday hit many local businesses hard; without the protection of their government - many companies were forced into bankruptcy. Now that our economy is slowly recovering, it is time to re-invest in our civilian economy. To encourage the growth of businesses, the government will grant them subsidies as an investment and help companies get back on their feet.
 BLR_protect_the_minorities: "Защита меньшинств" # Protect Minorities
 BLR_protect_the_minorities_desc: "Несмотря на все наши усилия по созданию равноправного общества, реальность далеко не идеальна, поскольку даже при наличии конституционных гарантий сохраняется напряженность между этническими группами этой страны. Мы должны не только иметь систематизированные гарантии, но и наши действия должны соответствовать формальностям и возобновлять нашу преданность Личному Принципу." # Despite our best efforts to bring about an equal society, the reality has been less than ideal, as even with constitutional guarantees, there remains tension between that nation's ethnic groups. We must not only have codified guarantees, but our actions must match the formalities and renew our dedication to the Personal Principle.
 BLR_defense_budget: "Оборонный бюджет" # Defense Budget
 BLR_defense_budget_desc: "Сойм должен утвердить более крупный армейский бюджет на предстоящий год. Это, несомненно, поможет гражданской экономике в будущем." # The Sojm must approve of a larger Army budget for the coming year. It will undoubtedly help the civilian economy down the line.
 BLR_promote_civic_nationalism: "Продвигайте гражданский национализм" # Promote Civic Nationalism
 BLR_promote_civic_nationalism_desc: "Формирование белорусской нации было не только усилием белорусского народа. Многие меньшинства вложили свои усилия в строительство нации, которого мы так отчаянно жаждали в течение многих лет. Поэтому нам следует сосредоточиться на продвижении определенного типа национализма. Тот, который лишает своих граждан лояльности, свободы и равенства. Гражданский национализм." # The formation of the Belarusian nation was not only an effort of the Belarusian people. Many minorities lent their effort to the nation building we've been so desperately craving for years. Therefore, we should focus on promoting a specific type of Nationalism. One that takes loyalty, freedom and equality from its citizens. Civic Nationalism.
 BLR_regulate_the_financial_sector: "Регулирование финансового сектора" # Regulate the Financial Sector
 BLR_regulate_the_financial_sector_desc: "Финансовые учреждения в Беларуси не имеют одинаковых характеристик в своих финансовых операциях, причем одно лучше другого. Для процветания белорусского государства нам необходимо быть посредником в этом секторе и гарантировать, что эти учреждения будут в некоторой степени регулироваться." # The financial institutions in Belarus does not have the same specifications in their financial transactions, with one being better than the other, for the Belarusian state to prosper we need to be a middle man in this sector and ensure that this instutions would be somewhat regulated.
 BLR_bread_and_butter: "Хлеб с маслом" # Bread and Butter
 BLR_bread_and_butter_desc: "Каждый дюйм обрабатываемой земли должен быть обработан, Беларусь должна стать житницей Восточной Европы после Украины и процветать, кормя себя и всех своих соседей." # Every inch of cultivable land must be grown on, Belarus shall become the breadbasket of eastern Europe after Ukraine and prosper as she feeds herself and all of her neighbours.
 BLR_protect_the_working_man: "Защитите рабочего человека" # Protect the Working Man
 BLR_protect_the_working_man_desc: "Хотя Грамада успешно приняла Трудовой кодекс до того, как его отстранил от власти атаман, он по-прежнему остается в лучшем случае двусмысленным и имеет множество дыр, которыми можно воспользоваться. Мы создадим и предложим новый Трудовой кодекс, который действительно защитит рабочих, а также владельцев от различного рода эксплуатации." # While the Hramada have successfully passed Labour codes before they have been ousted into power by the Otaman, it is still ambiguous at best and have many holes to exploit. We will create and propose a new Labour code that truly protects the workers and also the owners from different kind of exploitations.
 BLR_the_free_market_bears_fruits: "Свободный рынок приносит плоды" # The Free Market Bears Fruits
 BLR_the_free_market_bears_fruits_desc: "Наша успешная экономическая политика в отношении страны позволила процветающей экономике Беларуси привлечь все больше иностранных инвесторов для инвестиций в различные отрасли белорусской экономики." # Our successfull economic policies for the country have allowed Belarus' thriving economy to attract more and more foreign investors to invest in various sectors of the Belarusian economy.
 BLR_in_conserving_liberty: "В сохранении свободы" # In Conserving Liberty
 BLR_in_conserving_liberty_desc: "Мало того, что у белорусов есть независимая нация. Нация также должна защищать свои ценности и мораль от безбожия и радикализма. Белая Русь теперь вернулась на путь, где она станет примером для остальной Европы, несмотря на наши размеры и мощь." # It is not enough that Belarusians have an independent nation. The nation must also protect its values and morals against godlessness and radicalism. White Ruthenia is now back on a path where it will become an example for the rest of Europe despite our size and power.
 BLR_guaranteed_liberties: "Гарантированные свободы" # Guaranteed Liberties
 BLR_guaranteed_liberties_desc: "Поскольку многие угрозы по всему миру набирают обороты, очень грустно видеть, как наши граждане отчаиваются из-за потенциальной потери своих прав. Однако им не следует бояться, ибо народ Беларуси свободен и останется таковым, со всеми привилегиями, которые влечет за собой эта свобода!" # With many threats around the world ramping up their ante, it's quite sad to see our citizens despair about potentially losing their rights. They should fear not however, for the people of Belarus are free and they shall remain so, with all the privileges this freedom entails!
 BLR_introduce_work_code: "Введение рабочего кода" # Introduce Work Code
 BLR_introduce_work_code_desc: "Трудовой кодекс, главный столп политики христианских демократов, стал реакцией на растущие трудовые конфликты между работодателем и работником. Кодекс, включающий в себя все – от обязательных отпусков до коллективных переговоров, заработной платы, социальных организаций и даже основ системы социального обеспечения – стал идеалом для стран по всему миру." # The main pillar of the Christian Democrats' policy, the Labour code comes as a reaction to the mounting labour conflicts between employer and employee. Incorporating everything from obligatory holidays, collective bargaining, wages, social organisations and even the basis of a social security system, the code has become a ideal for countries across the world.
 BLR_reform_the_taxation_system: "Реформировать налоговую систему" # Reform the Taxation System
 BLR_reform_the_taxation_system_desc: "Налоги, взимаемые с корпораций и их деятельности, лишь препятствуют процветанию нашей страны. Эти налоги должны быть серьезно снижены." # Taxes levied on corporations and their activities only inhibit the ability of our nation to prosper. These taxes must be severely reduced.
 BLR_provide_national_healthcare: "Обеспечить национальное здравоохранение" # Provide National Healthcare
 BLR_provide_national_healthcare_desc: "Один из способов обеспечить здоровье нации – это обеспечить здоровье ее народа. Создание Национальной системы здравоохранения гарантирует, что ни один ребенок, мужчина или женщина не останется без лечения в будущем." # One way to ensure a healthy nation, is to ensure its people are healthy. Setting up the National Healthcare will sure that no child, man or women will go untreated in the future.
 BLR_expand_the_welfare_state: "Расширить государство всеобщего благосостояния" # Expand the Welfare State
 BLR_expand_the_welfare_state_desc: "В духе социал-демократических идеалов мы должны сосредоточиться на расширении национальных программ благосостояния как сельских крестьян, так и горожан." # In the vein of Social Democratic ideals, we should focus on expanding the national welfare programs for both rural peasants and urban dwellers.
 BLR_alleviate_the_workers_stuggle: "Облегчение борьбы рабочих" # Alleviate the Workers' Stuggle
 BLR_alleviate_the_workers_stuggle_desc: "Хотя в Беларуси действуют собственные законы о труде, они очень поспешны и открыты для различных интерпретаций, допуская несправедливость по отношению к рабочему классу. Мы не должны допустить подобных случаев, мы реформируем и укрепим наш Трудовой кодекс, чтобы исключить дальнейшую эксплуатацию." # While Belarus have its own Labour Laws, it is very rushed and have been open to various interpretation, allowing injustice towards the working class. We must not allow this instances to happen, we will reform and strengthen our Labour Code so that no more exploitation can be done.
 BLR_reform_the_police: "Реформировать полицию" # Reform the Police
 BLR_reform_the_police_desc: "Полицейская служба в Беларуси с момента основания республики находится в полном беспорядке. Например, в это учреждение проникли радикалы, вызвав страх среди нашего населения: мы должны реорганизовать и реформировать эту службу для дальнейшего укрепления нашего государства." # The Policing service in Belarus have been quite a mess ever since the Republic's foundation. For instance, radicals have found their way into the institution, citing fear among our population, we must reorganize and reform this service to further strengthen our state.
 BLR_belarussian_schools: "Белорусские школы" # Belarussian Schools
 BLR_belarussian_schools_desc: "Недостаток образования для крестьянства всегда был невероятно серьезной проблемой для нашей молодой нации. Мы уже много лет предпринимаем шаги, чтобы исправить это, и будем продолжать делать это в будущем, поскольку образование является основой любой современной страны." # Lack of education for the Peasantry has always been an incredibly potent issue for our fledgling nation. We've been taking steps to rectify this for years now and we shall keep doing so in the future, for education is the backbone of any modern country.
 BLR_farm_subsidies: "Фермерские субсидии" # Farm Subsidies
 BLR_farm_subsidies_desc: "Сельскохозяйственный сектор страны сильно пострадал и стремительно падает. Чтобы предотвратить широкомасштабный коллапс и бедность среди белорусских фермеров, мы должны вмешаться и гарантировать, что они останутся на плаву благодаря государственным субсидиям." # The agricultural sector of the country has been horribly hit and is rapidly falling. To prevent wide-scale collapse and poverty among Belarus' farmers we must step in to make sure they remain afloat with government subsidies.
 BLR_public_works_initiatives: "Инициативы общественных работ" # Public Works Initiatives
 BLR_public_works_initiatives_desc: "Если работы для народа Беларуси не хватит, мы ее создадим. Мы улучшим наши дороги и инфраструктуру по всей Исландии, теснее свяжем нашу страну и позволим товарам с легкостью перемещаться по нашей стране." # If there isn't enough work for the people of Belarus we will create some. We shall improve our roads and infrastructure across Iceland and tie our country closer together and allow goods to travel across our nation with ease.
 BLR_socialism_in_one_nation: "Социализм в одной нации" # Socialism in One Nation
 BLR_socialism_in_one_nation_desc: "Мы сделали это! Несмотря на недавний мировой кризис, нам удалось выстоять, ведь мы – белорусский народ. Мы будем продолжать идти сквозь историю. Да здравствует Беларусь, гордая и свободная!" # We did it! In spite of the recent world crisis, we've managed to persevere for we are Belarusian people. We shall keep marching throughout history. Long live Belarus, proud and free!
# Foreign Policy
 BLR_konigsberg_conference: "Кенигсбергская конференция" # Königsberg Conference
 BLR_konigsberg_conference_desc: "Чтобы мы могли забрать то, что по праву принадлежит нам, мы должны попросить немцев признать наши территориальные амбиции и претензии в обмен на союз. Немцы, вероятно, согласятся противостоять растущей гегемонии Антанты в Европе." # In order for us to take what is rightfully ours, we must ask the Germans to recognize our territorial ambitions and claims in exchange for an alliance. The Germans would likely to agree to counter the increasing Entente hegemony towards Europe.
 BLR_dreams_of_litvinism: "Мечты о литвинизме" # Dreams of Litvinism
 BLR_dreams_of_litvinism_desc: "Немцы признали наши претензии, и ничто не мешает нам претендовать на балтийскую католическую литвинскую идентичность. Мы восстановим несуществующее Великое Княжество Литовское и объединим народы на его бывших территориях." # The Germans have recognized our claims and nothing is stopping us from claiming the Baltic Catholic Litvin identity. We will restore the defunct Grand Duchy of Lithuania and unite the people in it's former territories.
 BLR_dreams_of_litvinism_tt: "§GЭтот фокус будет автоматически пропущен, как только Германия согласится на наши территориальные претензии§!" # §GThis focus will be automatically be bypassed once Germany has agreed to our territorial claims§!
 BLR_embrace_belarusian_identity: "Примите белорусскую идентичность" # Embrace Belarusian Identity
 BLR_embrace_belarusian_identity_desc: "Пока немцы не согласились с нашими требованиями, мы были вынуждены отказаться от литвинской идентичности в пользу белорусской. Мечта о Великой Беларуси теперь реализована, и нам необходимо освободить наш народ от угнетателей!" # While the Germans did not agree on our claims, we have been forced to reject the Litvin identity in favour of the Belarusian one. The dream of Greater Belarus is now realized, and we need to liberate our people from their oppressors!
 BLR_embrace_belarusian_identity_tt: "§GЭтот фокус будет автоматически обойден, как только Германия откажется признать наши территориальные претензии§!" # §GThis focus will be automatically be bypassed once Germany has refused to recognized to our territorial claims§!
 BLR_claims_in_ukraine: "Претензии в Украине" # Claims in Ukraine
 BLR_claims_in_ukraine_desc: "Ни для кого не секрет, что Украине принадлежит большая часть территорий, принадлежавших Великому княжеству Литовскому в 13 веке. Киев и окружающие его государства должны быть переданы нам, иначе украинцы столкнутся с мощью нашей армии." # It's no secret that Ukraine holds much of the territories that one owned by the Grand Duchy of Lithuania in the 13th Century. Kiev and it's surronding states should be transferred to us or the Ukrainians will face our military's might.
 BLR_demand_lithuanian_lands: "Требуйте литовских земель" # Demand Lithuanian Lands
 BLR_demand_lithuanian_lands_desc: "Чтобы иметь возможность создать Великое Княжество Литовское, мы должны владеть основными литовскими землями. Мы потребуем эти земли у их повелителей, иначе кровь прольется в Прибалтике." # To be able to create the Grand Duchy of Lithuania we must own the core Lithuanian lands itself. We will demand these lands from their overlords or blood will be spilled in the Baltic.
 BLR_liberation_from_the_red_menace: "Освобождение от красной угрозы" # Liberation from the Red Menace
 BLR_liberation_from_the_red_menace_desc: "Многие из наших заявленных территорий находились под контролем [SOV.GetName], и мы немедленно потребуем их. Мы не ожидаем, что они согласятся, но, тем не менее, это будет здорово." # Many of our claimed territories have been under the control of the [SOV.GetName] and we will demand them outright. We don't expect them to accept but it will be great nonetheless.
 BLR_the_grand_dukes: "Великие князья" # The Grand Dukes
 BLR_the_grand_dukes_desc: "Поскольку мы успешно отвоевали наши территории у наших врагов, пришло время провозгласить возрожденное Великое Княжество Белоруссия-Литва; и короновать литовского князя королем!" # As we have successfully reclaimed our territories from our enemies, it is now time to proclaim the revived Grand Duchy of Belarus-Lithuania; and crown the Lithuanian Duke as King!
 BLR_the_grand_dukes_tt: "£decision_icon_small §YРешения§! относительно §Cинтегрирующих территорий§! будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! regarding §Cintegrating territories§! will be §Yunlocked§!
 BLR_join_the_stahlpakt: "Присоединяйтесь к Штальпакту" # Join the Stahlpakt
 BLR_join_the_stahlpakt_desc: "Нет ничего постыдного в том, чтобы признать, что нам понадобится помощь, чтобы не допустить захватчиков, особенно учитывая, что Советы находятся на нашей границе. Германия — наш единственный настоящий союзник здесь, и наша нация, скорее всего, выживет только в составе «Штальпакта». Пока мы работаем над тем, чтобы стать самостоятельным государством, Германия поможет нам в достижении этой цели, и мы останемся верными союзниками в надвигающемся шторме." # There is no shame in admitting that we will need help to keep invaders out, especially with the Soviets at our border. Germany is our only true ally here, and our nation will likely only survive as part of the Stahlpakt. As we work to become a self-reliant nation, Germany will help us towards this goal, and we will remain steadfast allies in the coming storm.
 BLR_join_the_stahlpakt_tt: "£decision_icon_small §YРешение§! относительно §Cсоздания альянса с @GER [GER.GetName]§! будет §Yразблокировано§!" # £decision_icon_small  §YDecision§! concerning §Ccreating an alliance with @GER [GER.GetName]§! will be §Yunlocked§!
 BLR_trust_in_the_west: "Доверие Западу" # Trust in the West
 BLR_trust_in_the_west_desc: "Хотя Франция находится в нескольких милях от нас, ее влияние и гегемония в Европе простираются далеко за ее пределы. Союз с ними — отличный способ сохранить нашу независимость." # While France is miles away from us, their influence and hegemony over Europe stretches far and beyond. An alliance with them is a great way to preserve our independence.
 BLR_trust_in_the_west_tt: "£decision_icon_small §YРешение §! относительно §Cсоздания альянса с @FRA [FRA.GetName]§! будет §Yразблокировано§!" # £decision_icon_small  §YDecision§! concerning §Ccreating an alliance with @FRA [FRA.GetName]§! will be §Yunlocked§!
 BLR_our_polish_ties: "Наши польские связи" # Our Polish Ties
 BLR_our_polish_ties_desc: "Как и наше государство, Польша возродилась из пепла и последствий Великой войны, и их близость к нам — отличный способ обеспечить выживание нашего государства." # Like our state, Poland have been rebirthed from the ashes and aftermatch of the Great War, and their proximity with us is a great way to ensure our state's survival.
 BLR_our_polish_ties_tt: "£decision_icon_small §YРешение§! относительно §Cсоздания альянса с @POL [POL.GetName]§! будет §Yразблокировано§!" # £decision_icon_small  §YDecision§! concerning §Ccreating an alliance with @POL [POL.GetName]§! will be §Yunlocked§!
 BLR_an_offer_to_poland: "Предложение Польше" # An Offer to Poland
 BLR_an_offer_to_poland_desc: "В настоящее время Польша владеет заявленным нами государством [889.GetName], а ее клиентское государство Литва владеет государством Вильнюс, на которое мы претендуем, поэтому возможно предложить им большую денежную компенсацию за передачу права собственности на эту территорию." # Currently Poland owns our claimed state of [889.GetName] and their client state of Lithuania owns the state of Vilnius which we claim, offering a great amount of monetary compensation to them for transfer of ownership of these territory may be possible.
 BLR_demand_our_eastern_territories: "Требуйте наши восточные территории" # Demand Our Eastern Territories
 BLR_demand_our_eastern_territories_desc: "Некоторые из наших восточных губерний оказались под большевистским сапогом, и нам необходимо освободить их от оков социалистической лжи, объединить белорусский народ и восстановить Великую Беларусь." # Some of our eastern provinces have been under the Bolshevik boot, and we need to liberate them for the shackles of the Socialist lie, to unite the Belarusian people and restore Greater Belarus.
 BLR_greater_belarus_restored: "Большая Беларусь восстановлена" # Greater Belarus Restored
 BLR_greater_belarus_restored_desc: "Хотя некоторые считали это невозможным, но нам удалось восстановить Большую Беларусь. Белорусский народ объединился под одним знаменем сильного государства. Мокная Беларусь!" # Although some believed it was impossible but we have managed to restore Greater Belarus. The Belarussian people have been united under a single banner with a strong state. Mocnaja Bielaruś!
 BLR_greater_belarus_restored_tt: "£decision_icon_small §YРешения§! относительно §Cинтегрирующих территорий§! будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! regarding §Cintegrating territories§! will be §Yunlocked§!
 BLR_economic_mobilization: "Экономическая мобилизация" # Economic Mobilization
 BLR_economic_mobilization_desc: "Наши враги принесли с собой грозное оружие для ведения социалистических и империалистических войн. Хотя мы не можем сравниться с ними в вооружении, у нас уникальный боевой дух. Каждый мужчина готов бороться за спасение Родины." # Our enemies have brought with them formidable weapons to fight the Socialist and imperialist wars. While we cannot match them in ordnance, we have a singular fighting spirit. Every man is ready to fight for the salvation of the motherland.
 BLR_cooperating_with_the_abwehr: "Сотрудничество с Абвером" # Cooperating with the Abwehr
 BLR_cooperating_with_the_abwehr_desc: "У немцев есть своя программа шпионажа, но что, если бы обе наши страны работали вместе? Вместо того, чтобы тратить усилия на шпионаж друг за другом, что, если бы они сотрудничали и вместо этого сосредоточили свои усилия на наших врагах?" # The Germans have its own espoinage program, but what if the both of our countries worked together? Rather than wasting effort spying on each other, what if they cooperated and instead spent that effort focused on our enemies?

### Events
 belarus.0.t: "Беларусь, 1936 год." # Belarus, 1936
 belarus.0.d: "Беларусь обрела независимость в ходе Февральской революции 1917 года в России. Белорусский национальный совет был создан из представителей разных регионов и политических сил. Однако и немцы, и большевики отказываются признавать суверенитет совета и не интересуются идеей независимого белорусского государства. После захвата Минска немецкими войсками в 1918 году белорусское правительство было вынуждено уехать в Литву.\n\nСоветский Союз попытался вернуть свои бывшие территории на западе, такие как территории, которые теперь контролируются новыми польским и украинским государствами. Это позволило Станиславу Булак-Балаховичу, атаману, заключить союз против Советов в обмен на земли, которые ранее были оккупированы советом. Многие восприняли это как распродажу атаманом законных регионов, принадлежавших Беларуси, и подвергли резкой критике. Однако, заключив союз, белорусы успешно отразили советские атаки, что позволило подписать Рижский мир в 1922 году.\n\nПосле обретения независимости атаман был приглашен стать президентом новой республики и наблюдал за формальными выборами в 1925 году, в результате которых победила Громада, в результате чего атаман выгнал новое правительство, опасаясь вмешательства Советского Союза. К концу 1929 года атаман правил железной рукой, отменив многие популярные меры, которые подпортили его имидж. Однако в 1935 году новая Национал-социалистическая партия заключила союз с атаманом, сформировав новое правительство, восхищающееся немецким валькизмом. Это сформировало диархию между атаманом и БНСП, поскольку один держит армию, а другой - правительство, что позволило хорошему чувству сотрудничества охватить заседания кабинета министров между Ополчением и БНСП, но продлится ли это долго?" # Belarus gained its independence during the February Revolution of 1917 in Russia, the Belarusian National Council was created from representatives from different regions and of political powers. However, both the Germans and the Bolsheviks refuse to recognise the sovereignity of the council, and was not interested with the idea of an independent Belarusian state. With the capture of Minsk by German forces in 1918, the Belarusian Government was forced to left for Lithuania.\n\nThe Soviet Union have attempted to reclaim their former territories in the west, such as territories that now control by the new Polish and Ukrainian states, this has allowed Stanislaw Bulak-Balachowicz, the Otaman to forge an alliance against the Soviets in exchange for lands that were previously occupied by the council. Many saw this as the Otaman selling out the rightful regions that belonged to Belarus and was heavily critized. However, with an alliance secured, the Belarusians succesfully repelled Soviet attacks allowing for the signing of the Peace of Riga in 1922.\n\nWith independence secured, the Otaman was invited to become the President of the new Republic, and oversaw a formal election in 1925, with results in the Hromada victory, which results in the Otaman outing the new government fearing Soviet involvement. By the end of 1929, the Otaman ruled with an iron fist, reverting many popular policies that diped his image. However, 1935, the new National-Socialist Party formed an alliance with the Otaman, forming a new government that admires German Valkism. This has formed a Diarchy between the Otaman and the BNSP as one holds the army and one the government, allowing good sense of cooperation has swept the cabinet meetings between the Home Guard and the BNSP but would it last?
 belarus.0.a: "Наперад, Беларусь!" # Napierad, Bielaruś!
 belarus.1.t: "Убийство атамана" # Assassination of the Otaman
 belarus.1.d: "При выходе из здания Белорусского национального конгресса генерал Станислав Булак-Балахович атаман был ранен в шею нападавшим, в результате чего он мгновенно скончался. К счастью, нападавшему не удалось сбежать, и он был схвачен ополченцами. В ходе допроса выяснилось, что нападавший является членом Боевой организации социалистов-революционеров, которая организовывала забастовки по всей стране и впоследствии была расформирована и запрещена Ополчением.\nХотя нация все еще находится в шоке от смерти первого президента Беларуси, Ополчение сейчас готовит более жесткие репрессии против этих левых элементов, все еще сохраняющихся в стране, и в делах правительства сейчас борьба за власть ведется между Ополчением и Ополчением. БНСП. Будущее Беларуси сейчас под угрозой." # While exiting the building of the Belarusian National Congress, General Stanisław Bułak-Bałachowicz, the Otaman has been shot point blank by assailant in the neck causing him to die instantly.Fortunately, the assailant has been prevented to escape and was captured by the Home Guard. Under interrogation, it has been found that the assailant is a member of the Socialist-Revolutionary Combat Organization, who have been organizing labour strikes throughout the country and was subsequently dismantled and banned by the Home Guard.\nWhile nation is still in shock to the death of the first President of Belarus, the Home Guard is now preparing a harder crackdown on these leftist elements still lingering the country, and in the affairs of the government, a power struggle now rests between the Home Guard and the BNSP. The future of Belarus is now at stake.
 belarus.1.a: "Нация скорбит..." # The nation mourns...
 belarus.2.t: "Внутренние конфликты в правительстве" # Internal Conflicts in the Government
 belarus.2.d: "Убийство атамана, президента Беларуси, блестящего генерала Станислава Булака-Балаховича, вызвало внутренние разногласия внутри фракций в правительстве. Многие политики, не входящие в BNSP, и некоторые члены ополчения обвиняют правительство BNSP в неспособности справиться с хаосом и нестабильностью в стране. Однако представители BNSP обвинили само Ополчение в неспособности защитить своего номинального главу. Кажется, что хрупкая двоевластие начинает давать трещины." # The assassination of the Otaman, the President of Belarus, the brilliant General Stanisław Bułak-Bałachowicz, has left an internal bickering within the factions in the government. Many politicians not affiliated in the BNSP and some Home Guard members have blamed the BNSP government in failing to address the chaos and instability in the country. However, representatives from the BNSP have blamed the Home Guard itself for failure to protect their figurehead. It seems that the fragile diarchy are beginning to show its cracks.
 belarus.2.a: "Правительство несет ответственность" # The Government is responsible
 belarus.2.b: "Винить надо ополчение." # It's a home guard that should be blamed.
 belarus.3.t: "Возможность в Беларуси" # Opportunity in Belarus
 belarus.3.d: "Поскольку президент Беларуси генерал Станислав Булак-Балахович был убит, белорусы воюют между собой, и до сих пор образовавшийся вакуум власти еще не устранен. Это дает нам возможность вернуть наши земли, которые в настоящее время находятся в руках белорусов.\n\nМы уверены, что белорусы не имеют возможности реагировать или сражаться, когда наши войска пересекут границу и обеспечат контроль над целевыми территориями, хотя мы не уверены, какова будет реакция наших соседей и Европы." # As the President of Belarus, General Stanisław Bułak-Bałachowicz been assassinated, Belarussians are fighting amongst themselves, and until now the power vacuum created, have not been resolved yet. This gives us the opportunity to retake our lands currently in the hands of the Belarusians.\n\nWe are sure that the Belarusians do not have the capability to react or fight when our forces will cross the border and secure control over the target areas, though we are not sure what the reaction of our neighbors and of Europe will be.
 belarus.3.a: "Вернуть земли..." # Reclaim the lands...
 belarus.4.t: "Украина захватила Мозырь и Южный Пинск" # Ukraine Seizes Mozir and South Pinsk
 belarus.4.d: "Увидев возможность наших внутренних распрей в борьбе за власть, войска [UKR.GetAdjective] пересекли южную границу и приступили к оккупации территорий Мозыря и Южного Пинска. Правительство [UKR.GetAdjective] объявило, что эти войска пока останутся на территориях для защиты этнических [UKR.GetAdjective], проживающих в этом районе." # Seeing the opportunity of our internal bickering in the power stuggle, [UKR.GetAdjective] troops have crossed the southern border and have proceeded to occupy the territories of Mozir and South Pinsk. The [UKR.GetAdjective] Government have announced that those troops will stay in the territories for the time being to protect ethnic [UKR.GetAdjective]s living in the area.
 belarus.4.a: "Эти ублюдки!" # Those bastards!
 belarus.5.t: "Возможность в Беларуси" # Opportunity in Belarus
 belarus.5.d: "Поскольку президент Беларуси генерал Станислав Булак-Балахович был убит, белорусы воюют между собой, и до сих пор образовавшийся вакуум власти еще не устранен. Это дает нам возможность вернуть наши земли, которые в настоящее время находятся в руках белорусов.\n\n[UKR.getAdjective] уже захватили контроль над некоторыми территориями на юге, и мы уверены, что белорусы не имеют возможности реагировать или сражаться, когда наши войска пересекут границу и обеспечат контроль над целевыми районами." # As the President of Belarus, General Stanisław Bułak-Bałachowicz been assassinated, Belarussians are fighting amongst themselves, and until now the power vacuum created, have not been resolved yet. This gives us the opportunity to retake our lands currently in the hands of the Belarusians.\n\nThe [UKR.getAdjective] already seized control some of the territories in the south and we are sure that the Belarusians do not have the capability to react or fight when our forces will cross the border and secure control over the target areas.
 belarus.5.a: "Продвинутые люди!" # Zaawansowani ludzie!
 belarus.6.t: "Польша захватывает Новогродек и Гродно" # Poland Seizes Nowogrodek and Grodno
 belarus.6.d: "Видя возможность наших внутренних распрей в борьбе за власть, войска [POL.GetAdjective] пересекли южную границу и приступили к оккупации территорий Новогрудка и Гродно. Правительство [POL.GetAdjective] объявило, что эти войска пока останутся на территориях, поскольку их меньшинства проживают в этом районе." # Seeing the opportunity of our internal bickering in the power stuggle, [POL.GetAdjective] troops have crossed the southern border and have proceeded to occupy the territories of Nowogrodek and Grodno. The [POL.GetAdjective] Government have announced that those troops will stay in the territories for the time being their minorities living in the area.
 belarus.6.a: "Ублюдки!" # Bastards!
 belarus.7.t: "Возможность в Беларуси" # Opportunity in Belarus
 belarus.7.d: "Поскольку президент Беларуси генерал Станислав Булак-Балахович был убит, белорусы воюют между собой, и до сих пор образовавшийся вакуум власти еще не устранен. Это дает нам возможность вернуть наши земли, которые в настоящее время находятся в руках белорусов.\n\n[UKR.getAdjective]s уже захватили контроль над некоторыми территориями на юге и [POL.GetAdjective] на западе, и мы уверены, что у белорусов нет возможности реагировать или сражаться, когда наши войска пересекут границу и обеспечат контроль над целевыми районами." # As the President of Belarus, General Stanisław Bułak-Bałachowicz been assassinated, Belarussians are fighting amongst themselves, and until now the power vacuum created, have not been resolved yet. This gives us the opportunity to retake our lands currently in the hands of the Belarusians.\n\nThe [UKR.getAdjective]s already seized control some of the territories in the south and the [POL.GetAdjective] in the west and we are sure that the Belarusians do not have the capability to react or fight when our forces will cross the border and secure control over the target areas.
 belarus.7.a: "Пора вернуть Беларусь в свои ряды" # Time to bring Belarus into the fold
 belarus.8.t: "Чиновник BNSP арестован ополченцами" # BNSP Official Arrested by the Home Guard
 belarus.8.d: "Видный политик из наших рядов, БНСП, как сообщается, был арестован сегодня в собственном доме по нескольким обвинениям, заявленным Ополчением. Сообщается, что рассматриваемый политик выкачивал средства из государственных программ и переводил их на свой частный банковский счет в Швейцарии. Когда Ополчение объявило об этом, многие среди населения уже поверили утверждениям Ополчения, и, таким образом, наше влияние и популярность пострадали." # A prominent politician from our ranks, the BNSP have reportedly been arrested today from his own home for a couple of charges as stated by the Home Guard. The politician in question have been reportedly siphoning funds from government programs and transferring them to his own private bank account in Switzerland. As the Home Guard announced this development, many within the population have already believed the claims of the Home Guard and thus our influence and popularity have taken a hit.
 belarus.8.a: "Что? Выручите его!" # What? Bail him out!
 belarus.9.t: "Правительство обвиняется в слабой политике" # Government Accused of Weak Policies
 belarus.9.d: "Аркадий Смолич, ярый критик правительства и нынешний лидер БСРХ, обвинил правительство БНСП, прежде всего нынешнего премьер-министра и министра экономики, в слабой политике, которая приносит больше вреда, чем пользы, в экономических и социальных аспектах Беларуси. Правительство пока не прокомментировало обвинения Смолича, в то время как все больше политиков и членов Рады начали подвергать сомнению политику администрации." # Arkady Smolich, a vocal critic of the government and the current leader of the BSRH have accused the BNSP Government primarily the current Prime Minister and the Economic Minister of weak policies that do more harm that good in the economic and societal aspects of Belarus. The government has not yet commented on the accusations by Smolich, while more politicians and members of the Rada have began questioning the policies of the administration.
 belarus.9.a: "Ублюдки!" # Bastards!
 belarus.10.t: "Ополченцев обвиняют в пытках" # Home Guard Accused of Torture
 belarus.10.d: "Сегодня днем ​​в Народный суд был доставлен молодой человек литовского происхождения, утверждавший, что он стал жертвой пыток со стороны ополченцев. Его история включает в себя то, что, когда он гулял по улицам Смолеска, он был по ошибке арестован ополченцами за преступления, которых он не совершал, например, за кражу из пекарни, о которой он даже не знал. Общественный резонанс усилился после того, как эта новость попала в средства массовой информации, а популярность Ополчения серьезно пострадала." # A young man of Lithuanian decent was brought in the People's Court this afternoon claiming that he had been a victim of torture by the Home Guard. His story includes that while he was walking the streets of Smolesk, he was mistakenly arrested by the Home Guard for crimes he didn't commit such as stealing from a bakery he didn't even know about. Public outcry has been increasing since the news reached the media and the popularity of the Home Guard has taken a significant hit.
 belarus.10.a: "Ложь!" # Lies!
 belarus.11.t: "Скандал с ополчением в Гродно" # Home Guard Scandal in Grodno
 belarus.11.d: "Ходят сообщения о том, что некоторые войска, дислоцированные в районе Гродно, устроили хаос в городах. В этих отчетах указывается, что ряд подразделений ополчения в состоянии алкогольного опьянения вели себя очень агрессивно, что приводило к дракам и жертвам среди населения. Хотя нашему командованию еще предстоит проверить эти сообщения, члены BNSP уже воспользовались этими сообщениями, хотя они еще не подтверждены, и в результате наше влияние пострадало." # There are reports circulating that some garrisoned troops in the region of Grodno have caused some havoc in cities. These reports indicates that a number of Home Guard units have been very aggressive whilst drunk, resulting in fights and casualties among the population. While our command have yet to verify these reports, members from the BNSP have already capitalised on these reports while still unconfirmed and our influence have taken a hit as a result.
 belarus.11.a: "Распустить задействованные войска!" # Dismiss the troops involved!
 belarus.12.t: "Переворот" # The Coup
 belarus.12.d: "Кажется, время должно повториться: сегодня утром несколько подразделений Ополчения взяли под стражу несколько правительственных объектов и объектов и арестовали многих видных политиков и правительственных чиновников, связанных с BNSP. Верховное командование ополчения выступило с заявлением, в котором обвинило правительство БНСП в предательских действиях, таких как попытка сотрудничества с Советами в надежде обеспечить свою власть в Беларуси. После переворота Верховное командование сформировало новое правительство и намерено стабилизировать ситуацию на ближайшие недели." # It seems time has to repeat itself as this morning, multiple units from the Home Guard have secured multiple government installations and facilities and have arrested many prominent politicians and government officials aligned with the BNSP. The High Command of the Home Guard have issued a statement accusing the Government of the BNSP to treasonous acts such as attempting to collaborate with the Soviets in hopes to secure their power in Belarus. The High Command have installed a new government following the coup and are following to stabilize the situation for weeks to come.
 belarus.12.a: "Время восстанавливать..." # Time to rebuild...
 belarus.13.t: "BNSP обеспечивает контроль" # BNSP Secures Control
 belarus.13.d: "После смерти своего номинального главы Станислава Булака-Балаховича Ополчение осталось без какого-либо влияния в правительстве и было обнаружено, что оно пытается взять на себя контроль над государственным аппаратом. К счастью, это было раскрыто ранее, что позволило подразделениям, лояльным Беларуси и республике, арестовать ключевых чиновников и командиров Ополчения, а также ряд предательских политиков, которые претендуют на важные позиции, когда БНСП будет отстранена от власти." # With the death of their figurehead, Stanisław Bułak-Bałachowicz, the Home Guard have left without any influence in the government and have been found trying to assume control of the apparatus of state. This fortunately have been exposed earlier, allowing units loyal to Belarus and the Republic to arrest key officials and commanders from the Home Guard as well as a number of treacherous politicians that seeks significant positions when the BNSP is ousted of power.
 belarus.13.a: "Время восстанавливать..." # Time to rebuild...
 belarus.14.t: "Черная среда в Беларуси." # Black Wednesday in Belarus
 belarus.14.d: "Хотя Минск находится в нескольких милях от Лондона и Парижа, Беларусь, к сожалению, ощутила на себе последствия худшего экономического кризиса, который мир когда-либо видел в этом столетии. Поскольку наша экономика во многом зависит от экономики Франции и Великобритании, чтобы оставаться на плаву. Многие иностранные компании уже забрали свои инвестиции в страну, а правительство [FRA.GetAdjective] уже объявило, что прекратит оказывать помощь нашему государству; следовательно, раздувают цены и влияют на население." # While Minsk is miles away from London and Paris, Belarus have unfortunately felt the effects of the worst economic crisis the world has ever seen in this century. As our economy is heavily reliant on the economies of France and Britain to stay afloat. Multiple foreign companies have already pulled their investments in the country and the [FRA.GetAdjective] Government have already announced that they will stop providing aid to our state; therefore inflating the prices and affecting the population.
 belarus.14.a: "Бох имя и дапамоху." # Boh nam u dapamohu...
 belarus.15.t: "Белорусское ополчение" # The Belarusian Home Guard
 belarus.15.d: "Ополчение в настоящее время отвечает за оборону белорусского государства и вопросы внутренней безопасности, такие как полицейская деятельность. Хотя в некоторых областях они оказались наиболее эффективными, можно утверждать, что одна организация не должна иметь столько обязанностей. Следовательно, в правительстве есть предложения по статусу учреждения. Некоторые выступают за их официальное оформление в качестве Белорусской национальной армии, в то время как некоторые хотят создать отдельный институт для армии и сделать Ополчение резервистской силой на случай худшего." # The Home Guard is currently responsible for the defense of the Belarusian state and internal security affairs such as policing. While they have been mostly effective is some areas, one would argue that a single organization should not have this many responsibilities. Hence, there are suggestions within the government on the status of the institution. Some advocate for them to be formalized as the Belarusian National Army, while some want to establish a separate institution for the army and make the Home Guard as a reservist force if the worst comes.
 belarus.15.d.1: "Ополчение в настоящее время отвечает за оборону белорусского государства и вопросы внутренней безопасности, такие как полицейская деятельность. Хотя в некоторых областях они оказались наиболее эффективными, можно утверждать, что одна организация не должна иметь столько обязанностей. Следовательно, в правительстве есть предложения по статусу учреждения. Некоторые выступают за их официальное оформление в качестве Белорусской национальной армии, в то время как некоторые хотят создать отдельный институт для армии и сделать Ополчение резервистской силой на случай худшего. Однако есть и радикальные члены правительства, которые желают, чтобы их распустили навсегда, поскольку они были предателями белорусского народа." # The Home Guard is currently responsible for the defense of the Belarusian state and internal security affairs such as policing. While they have been mostly effective is some areas, one would argue that a single organization should not have this many responsibilities. Hence, there are suggestions within the government on the status of the institution. Some advocate for them to be formalized as the Belarusian National Army, while some want to establish a separate institution for the army and make the Home Guard as a reservist force if the worst comes. However there are also radical members of the government that wishes that they should be disbanded permanently as they have been a traitor to the Belarusian people.
 belarus.15.a: "Оформить их как Белорусскую национальную армию." # Formalize them as the Belarusian National Army
 belarus.15.b: "Создать отдельную белорусскую армию и сделать ее резервистской силой." # Create a separate Belarusian Army and make them a reservist force
 belarus.15.c: "Они предатели и их следует расформировать." # They are traitors and they should be disbanded
 belarus.16.t: "Белорусский вход в [Root.GetFactionName]" # Belarussian Entry to the [Root.GetFactionName]
 belarus.16.d: "Делегация [From.GetCapital.GetCapitalVictoryPointName] прибыла сюда, в [Root.GetCapital.GetCapitalVictoryPointName], чтобы обсудить вступление [From.GetAdjective] в [Root.GetFactionName], официально оформляющее союз между [From.GetName] и [Root.GetName]. Должны ли мы принять?" # A delegation from [From.GetCapital.GetCapitalVictoryPointName] have arrived here in [Root.GetCapital.GetCapitalVictoryPointName] to discuss the [From.GetAdjective] entry to the [Root.GetFactionName] formalizing the alliance between [From.GetName] and [Root.GetName]. Should we accept?
 belarus.16.a: "Конечно, почему бы и нет" # Sure, why not
 belarus.16.b: "Мы не хотим ссоры с Советами." # We do not wish quarrel with the Soviets
 belarus.17.t: "[From.GetAdjective]s принимают" # The [From.GetAdjective]s Accept
 belarus.17.d: "Министерство иностранных дел [From.GetAdjective] и наша делегация в [From.GetCapital.GetCapitalVictoryPointName] подтвердили, что наше вступление в альянс [From.GetFactionName] принято." # The [From.GetAdjective] Foreign Ministry and our delegation in [From.GetCapital.GetCapitalVictoryPointName] have confirmed our entry to the [From.GetFactionName] alliance have been accepted.
 belarus.17.a: "Вместе мы победим!" # Together we will win!
 belarus.18.t: "[From.GetAdjective]s отказались" # The [From.GetAdjective]s Refused
 belarus.18.d: "Министерство иностранных дел [From.GetAdjective] и наша делегация в [From.GetCapital.GetCapitalVictoryPointName] подтвердили, что нам было отказано во вступлении в альянс [From.GetFactionName]." # The [From.GetAdjective] Foreign Ministry and our delegation in [From.GetCapital.GetCapitalVictoryPointName] have confirmed our entry to the [From.GetFactionName] alliance have been refused
 belarus.18.a: "Разочарование..." # Dissapointing...
 belarus.19.t: "Кенигсбергская конференция" # The Königsberg Conference
 belarus.19.d: "Делегаты нашего восточного союзника [From.GetName] прибыли вчера в Кенигсберг, Восточная Пруссия; с нашими собственными делегатами на следующий день. Эта конференция представляет собой встречу делегатов [From.GetAdjective] и [Root.GetAdjective] для обсуждения признания территориальных претензий [From.GetAdjective]. Речь идет о территориях, которыми Великое княжество Литовское владело в XIII и XV веках: от Литвы до Бессарабии с севера на юг и от Бреста до Смоленска с запада на восток. [From.GetAdjectives]s хотят, чтобы мы признали, что им будут предоставлены эти территории, как только возможная война с Советами будет разрешена." # Delegates from our eastern ally, [From.GetName] have arrived yesterday in the Königsberg, East Prussia; with our own delegates following day after. This conference is a meeting between the [From.GetAdjective] and [Root.GetAdjective] delegates to discuss the recognition of [From.GetAdjective] territorial claims. The territories involved are the ones that the Grand Duchy of Lithuania owned during the 13th and 15th centuries-spanning from Lithuania to Bessarabia in north to south and Brest to Smolensk from west to east. The [From.GetAdjectives]s want us to recognise that they will be granted these territories once the eventual war with the Soviets have been resolved.
 belarus.19.a: "Примите их претензии" # Accept their claims
 belarus.19.b: "Отбросьте эту ерунду!" # Dismiss this nonsense!
 belarus.20.t: "[From.GetName] признает наши претензии" # [From.GetName] Recognises our Claims
 belarus.20.d: "Правительство [From.GetAdjective] в [From.GetCapital.GetCapitalVictoryPointName] приняло наши территориальные претензии в Украине, Литве, Польше и России. Эти земли будут переданы нам после разрешения войны с [SOV.GetAdjectives]." # The [From.GetAdjective] Government in [From.GetCapital.GetCapitalVictoryPointName] have accepted our territorial claims in Ukraine, Lithuania, Poland and Russia. These lands will be granted to us after the war with the [SOV.GetAdjectives]s have been resolved.
 belarus.20.a: "Могучая Беларусь!" # Mocnaja Bielaruś!
 belarus.21.t: "[From.GetName] отказывается признать наши претензии" # [From.GetName] Refuses to Recognise our Claims
 belarus.21.d: "Правительство [From.GetAdjective] в [From.GetCapital.GetCapitalVictoryPointName] отказалось признать наши территориальные претензии в Украине, Литве, Польше и России." # The [From.GetAdjective] Government in [From.GetCapital.GetCapitalVictoryPointName] have refused to recognise our territorial claims in Ukraine, Lithuania, Poland and Russia.
 belarus.21.a: "Могучая Беларусь!" # Mocnaja Bielaruś!
 belarus.22.t: "Беларусь требует наши территории!" # Belarus Demands Our Territories!
 belarus.22.d: "Белорусское правительство направило нам ультиматум о том, что мы уступим им наши северные территории, включая Киев. Это возмутительное требование правительства [BLR.GetAdjective] было неожиданно поддержано немцами во время их встречи в Кенигсберге, на которой Германия приняла территориальные амбиции [BLR.GetName] в отношении союза. Это также означает, что если мы откажемся от их требований, мы можем начать войну с Германией." # The Belarusian Government have sent us an ultimatum that we cede our northern territories to them including Kiev. This outrageous demand by the [BLR.GetAdjective] Government have been suprisingly backed by the Germans during their meeting in Konigsberg, which Germany accepted [BLR.GetName]'s territorial ambitions for an alliance. It also means that if we refused their claims we may be starting a war with Germany.
 belarus.22.a: "Мы должны уступить их требованиям" # We must cave in to their demands
 belarus.22.b: "Они заберут его из наших холодных мертвых рук!" # They will take it from our cold dead hands!
 belarus.23.t: "[From.GetName] уступает территории" # [From.GetName] Cedes the Territories
 belarus.23.d: "Правительство [From.GetAdjective] увидело мудрость в своей ситуации и вместо этого решило уступить территории, которые мы требовали, вместо того, чтобы создавать конфликт между нами и ними." # The [From.GetAdjective] Government have seen the wisdom in their situation and have instead opted to cede the territories we demanded instead of creating a conflict between us and them.
 belarus.23.a: "Могучая Беларусь!" # Mocnaja Bielaruś!
 belarus.24.t: "[From.GetName] отказывается выполнять наши требования!" # [From.GetName] Refuses Our Demands!
 belarus.24.d: "Неудивительно, что правительство [From.GetAdjective] в [From.Capital.GetCapitalVictoryPointName] отклонило наши требования об уступке территорий, на которые мы претендуем. Возможно, нам нужно показать им мощь нашей армии." # Unsuprisingly, the [From.GetAdjective] Government in [From.Capital.GetCapitalVictoryPointName] have refused our demands to cede the territories we claim. Maybe we need to show them our military's might
 belarus.24.a: "На войну!" # To War!
 belarus.25.t: "[BLR.GetName] Спрос в Литве" # [BLR.GetName] Demand Lithuania
 belarus.25.d: "Сегодня утром МИД получил требование от правительства [BLR.GetAdjective] о передаче основных земель [LIT.GetAdjective] под контроль [BLR.GetAdjective]. Этот шаг стал результатом их недавней конференции с немцами, признавшими их территориальные претензии на востоке; и отказ уступить их требованиям может привести к войне с их союзниками, особенно с немцами; мы должны принять?" # This morning, the Foreign Ministry have received a demand from the [BLR.GetAdjective] Government for the transfer of core [LIT.GetAdjective] lands into [BLR.GetAdjective] control. This move was the result of their recent conference with the Germans accepting their territorial claims in the east; and refusing to cave to their demands might put us at war with their allies, most notably, the Germans; should we accept?
 belarus.25.a: "Мы не можем рисковать, принимаем их требования" # We can't risk it, accept their demands
 belarus.25.b: "Возмутительно!" # Outrageous!
 belarus.26.t: "[From.GetName] уступает территории" # [From.GetName] Cedes the Territories
 belarus.26.d: "Правительство [From.GetAdjective] увидело мудрость в своей ситуации и вместо этого решило уступить территории, которые мы требовали, вместо того, чтобы создавать конфликт между нами и ними." # The [From.GetAdjective] Government have seen the wisdom in their situation and have instead opted to cede the territories we demanded instead of creating a conflict between us and them.
 belarus.26.a: "Могучая Беларусь!" # Mocnaja Bielaruś!
 belarus.27.t: "[From.GetName] отказывается выполнять наши требования!" # [From.GetName] Refuses Our Demands!
 belarus.27.d: "Неудивительно, что правительство [From.GetAdjective] в [From.Capital.GetCapitalVictoryPointName] отклонило наши требования об уступке территорий, на которые мы претендуем. Возможно, нам нужно показать им мощь нашей армии." # Unsuprisingly, the [From.GetAdjective] Government in [From.Capital.GetCapitalVictoryPointName] have refused our demands to cede the territories we claim. Maybe we need to show them our military's might
 belarus.27.a: "На войну!" # To War!
 belarus.28.t: "[BLR.GetName] Требуйте наши западные территории" # [BLR.GetName] Demand Our Western Territories
 belarus.28.d: "Сегодня утром в МИД поступило требование правительства [BLR.GetAdjective] о передаче наших территорий от Смоленска до Курска. Этот возмутительный шаг [BLR.GetAdjective] вызван тем, что их территориальные претензии были приняты и признаны [GER.GetName], а отказ удовлетворить их требования ставит нас под угрозу войны между немцами. Тем не менее, мы, возможно, способны справиться с немецкой военной машиной, если наша армия будет мобилизована должным образом и эффективно, поэтому остается вопрос: должны ли мы уступить этому возмутительному требованию [BLR.GetAdjective] или нам следует рискнуть войной с ними, что позволит нам вернуть наши собственные территориальные претензии?" # This morning, the Foreign Ministry have received a demand from the [BLR.GetAdjective] Government for the transfer of our territories stretching from Smolensk to just outside Kursk. This outageous move by the [BLR.GetAdjective] has been fueled that their territorial claims have been accepted and recognized by the [GER.GetName] and refusing to their demands puts us at risk of war between the Germans. However, we maybe capable of handling the German war machine if our army is mobilized properly and efficiently, so the question still remains, should we cave to this outrageous demand from the [BLR.GetAdjective] or should we risk a war with them allowing us to reclaim our own territorial claims?
 belarus.28.a: "Мы не можем рисковать, принимаем их требования" # We can't risk it, accept their demands
 belarus.28.b: "Возмутительно!" # Outrageous!
 belarus.29.t: "[From.GetName] уступает территории" # [From.GetName] Cedes the Territories
 belarus.29.d: "Правительство [From.GetAdjective] увидело мудрость в своей ситуации и вместо этого решило уступить территории, которые мы требовали, вместо того, чтобы создавать конфликт между нами и ними." # The [From.GetAdjective] Government have seen the wisdom in their situation and have instead opted to cede the territories we demanded instead of creating a conflict between us and them.
 belarus.29.a: "Могучая Беларусь!" # Mocnaja Bielaruś!
