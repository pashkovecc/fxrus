 belarus.30.d: "Неудивительно, что правительство [From.GetAdjective] в [From.Capital.GetCapitalVictoryPointName] отклонило наши требования об уступке территорий, на которые мы претендуем. Возможно, нам нужно показать им мощь нашей армии." # Unsuprisingly, the [From.GetAdjective] Government in [From.Capital.GetCapitalVictoryPointName] have refused our demands to cede the territories we claim. Maybe we need to show them our military's might
 belarus.30.a: "На войну!" # To War!
 belarus.31.t: "Претензии [BLR.GetAdjective]" # The [BLR.GetAdjective] Claims
 belarus.31.d: "Поскольку война между нами и [SOV.GetName] подошла к концу с поражением красной угрозы, мы теперь обязаны передать территории, на которые претендует наш союзник [BLR.GetAdjective]." # As the war between us and the [SOV.GetName] have reached an end with the defeat of the red menace, we are now obligated to transfer the territories claimed by our [BLR.GetAdjective] ally.
 belarus.31.a: "Отлично..." # Fine...
 belarus.31.b: "Они этого не заслужили!" # They have not earned it!
 belarus.32.t: "Претензии [BLR.GetAdjective]" # The [BLR.GetAdjective] Claims
 belarus.32.d: "Поскольку война между нами и [UKR.GetName] завершилась поражением [UKR.GetAdjective], мы теперь обязаны передать территории, на которые претендует наш союзник [BLR.GetAdjective]." # As the war between us and the [UKR.GetName] have reached an end with the defeat of the [UKR.GetAdjective], we are now obligated to transfer the territories claimed by our [BLR.GetAdjective] ally.
 belarus.32.a: "Отлично..." # Fine...
 belarus.32.b: "Они этого не заслужили!" # They have not earned it!
 belarus.33.t: "Претензии [BLR.GetAdjective]" # The [BLR.GetAdjective] Claims
 belarus.33.d: "Поскольку война между нами и [POL.GetName] завершилась поражением государства [POL.GetAdjective], мы теперь обязаны передать территории, на которые претендует наш союзник [BLR.GetAdjective]." # As the war between us and the [POL.GetName] have reached an end with the defeat of [POL.GetAdjective] state, we are now obligated to transfer the territories claimed by our [BLR.GetAdjective] ally.
 belarus.33.a: "Отлично..." # Fine...
 belarus.33.b: "Они этого не заслужили!" # They have not earned it!
 belarus.34.t: "[BLR.GetName] Требуйте наши западные территории" # [BLR.GetName] Demand Our Western Territories
 belarus.34.d: "Сегодня утром в МИД поступило требование правительства [BLR.GetAdjective] о передаче наших западных территорий. Этот возмутительный шаг со стороны [BLR.GetAdjective] вызван тем, что они входят в альянс [BLR.GetFactionName]. Должны ли мы принять?" # This morning, the Foreign Ministry have received a demand from the [BLR.GetAdjective] Government for the transfer of our western territories. This outageous move by the [BLR.GetAdjective] has been fueled that they are in the [BLR.GetFactionName] alliance. Should we accept?
 belarus.34.a: "Мы не можем рисковать, принимаем их требования" # We can't risk it, accept their demands
 belarus.34.b: "Возмутительно!" # Outrageous!
