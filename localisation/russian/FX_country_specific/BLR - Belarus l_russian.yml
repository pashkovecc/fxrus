 BLR_collectivist_party_long: "Коммунистическая партия (большевиков) Белоруссии§!" # Kamunistyčnaja Partyja (Baĺšavikoŭ) Bielarusi\n§gCommunist Party (Bolsheviks) of Byelorussia§!
