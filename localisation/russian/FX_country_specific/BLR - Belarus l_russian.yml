 belarus.40.t: "Коронация Витаутаса II" # Coronation of Vytautas II
 belarus.40.d: "Наш самый праведный монарх был коронован королем. После его интронизации по всей стране зазвенели церковные колокола и был объявлен день празднования." # Our most righteous monarch has been crowned King. Upon his enthronement, church bells throughout the country rang and a day of celebration was declared.
 belarus.40.a: "Могучая Беларусь!" # Mocnaja Bielaruś!
 belarus.41.t: "[GetYear] Выборы" # [GetYear] Elections
 belarus.41.d: "Согласно Конституции выборы должны проводиться каждые три года. Срок полномочий Сойма истек, и пришло время избрать новый парламент. В Сойме имеется 90 мест, и различные политические партии начали свои кампании. Только три партии имеют шанс получить большинство и сформировать новое правительство. Какой из них возобладает?" # According to the Constitution elections are to be held every three years. The Sojm's term has expired and the time has come to elect a new parliament. There are 90 seats in the Sojm available and various political parties have begun their campaigns. Only three parties have a chance of gaining the majority, thus forming a new government. Which one shall prevail?
 belarus.41.a: "Грамада побеждает!" # Hramada Wins!
 belarus.41.b: "Христианский демократ побеждает!" # Christian Democrat Wins!
 belarus.42.t: "[GetYear] Всеобщие выборы" # [GetYear] General Election
 belarus.42.d: "Поскольку демократия в Беларуси обеспечена, люди снова идут на выборы, чтобы выбрать членов Рады. Грамада и христианские демократы остаются в авангарде румынской демократии, поскольку БНСП потеряла свою актуальность. Их программа мало изменилась со времени предыдущих выборов, подчеркивая укрепление демократических традиций и прогресс страны в экономическом развитии. Однако на этих выборах появились новые претенденты - Народная партия, которая является левоцентристской партией, ориентированной на гражданские вопросы и свободы. И победителем выборов в этом году станет..." # With democracy secured in Belarus, the people go to the polls once more to elect members of the Rada. The Hramada and the Christian Democrats remains on the forefront of Romanian democracy as the BNSP has fallen into irrelevance. Their program has changed little since the previous election, exhalting the cementing of democratic traditions and the country's progress in economic development. However there are new contenders for this election, the People's Party which is a center left party focused on more civil issues and liberties. And the winner for this year's election is...
 belarus.42.a: "...Грамада" # ...the Hramada
 belarus.42.b: "... христианские демократы" # ...the Christian Democrats
 belarus.42.c: "... либералы" # ...the Liberals
 belarus.43.t: "[GetYear] Всеобщие выборы" # [GetYear] General Election
 belarus.43.d: "Поскольку демократия в Беларуси обеспечена, люди снова идут на выборы, чтобы выбрать членов Рады. Грамада и христианские демократы остаются в авангарде румынской демократии, поскольку БНСП потеряла свою актуальность. Их программа мало изменилась со времени предыдущих выборов, подчеркивая укрепление демократических традиций и прогресс страны в экономическом развитии. Однако на этих выборах появились новые претенденты - Народная партия, которая является левоцентристской партией, ориентированной на гражданские вопросы и свободы. И победителем выборов в этом году станет..." # With democracy secured in Belarus, the people go to the polls once more to elect members of the Rada. The Hramada and the Christian Democrats remains on the forefront of Romanian democracy as the BNSP has fallen into irrelevance. Their program has changed little since the previous election, exhalting the cementing of democratic traditions and the country's progress in economic development. However there are new contenders for this election, the People's Party which is a center left party focused on more civil issues and liberties. And the winner for this year's election is...
 belarus.43.a: "...Грамада" # ...the Hramada
 belarus.43.b: "... христианские демократы" # ...the Christian Democrats
 belarus.43.c: "... либералы" # ...the Liberals
 belarus.45.t: "[FROM.GetName] отказывается выполнять свое обещание!" # [FROM.GetName] refuses to fufill their promise!
 belarus.45.d: "Несмотря на их первоначальное обещание признать наши претензии, похоже, что [FROM.GetName] отказался предоставить нам территории, которые они захватили, что приводит к вопросу о том, выйдем ли мы из альянса и рискнем их вмешательством, или мы просто смиримся с потерей этих земель." # Despite their initial promise to recognize our claims, it appears that [FROM.GetName] has refused to grant us the territories that they have taken, leading to the question of whether or not we leave the alliance and risk their intervention or if we simply accept the loss of these lands.
 belarus.45.a: "Они заплатят!" # They shall pay!
 belarus.45.b: "Это безумие..." # This is madness...
 belarus.46.t: "[FROM.GetName] покидает [ROOT.GetFactionName]" # [FROM.GetName] leaves the [ROOT.GetFactionName]
 belarus.46.d: "Несмотря на их бесполезность, похоже, что [FROM.GetAdjectiveCap] решили покинуть [ROOT.GetFactionName] и вместо этого решили пойти своим путем. Подобные действия угрожают новой стратегической реальности, которую мы построили для себя в Европе, и поэтому мы должны быть готовы немедленно сокрушить их за их наглость!" # In spite of their uselessness, it seems that the [FROM.GetAdjectiveCap] have opted to leave the [ROOT.GetFactionName] and have decided to instead go their own way. Such an action threatens the new strategic reality that we have built for ourselves in Europe and we must thus at once be prepared to crush them for their insolence!
 belarus.46.a: "Они доказали свою никчёмность..." # They have proven their unworthiness...
 belarus.46.b: "...но мы можем проявить к ним милосердие" # ...but we can show them mercy

