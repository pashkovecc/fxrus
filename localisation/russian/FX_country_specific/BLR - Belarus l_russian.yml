### Ideas
 BLR_question_of_legitimacy: "Вопрос легитимности" # Question of Legitimacy
 BLR_question_of_legitimacy_desc: "В то время как многие страны Восточной Европы пережили национальное пробуждение во второй половине XIX века, идея белорусской нации начала появляться только в начале XX века. К тому времени, когда Россия пала под властью большевиков, очень немногие белорусы могли даже понять идею национализма, не говоря уже о том, чтобы принять ее, а многие даже считали белорусов не чем иным, как полонизированными русскими или бедными, некультурными крестьянами, недостойными звания «нация». С 1917 года белорусские интеллектуалы ведут тяжелую борьбу за образование и, через него, национальную идентичность бедным и неграмотным крестьянам региона. Даже сейчас большая часть населения в лучшем случае апатична, а в худшем — враждебна к идее белорусской государственности." # While many nations in Eastern Europe have experienced a national awakening in the second half of the 19th century, the idea of a Belarusian nation only started to appear in the early 20th century. By the time Russia fell to the Bolsheviks, very few Belarusians could even comprehend the idea of nationalism, let alone embrace it, and many even considered Belarusians to be nothing but Polonised Russians or poor, uncultured peasants unworthy of the title of "nation". Since 1917, Belarusian intellectuals have been fighting an uphill battle to bring education and, through it, national identity to the poor, illiterate peasants of the region. Even now, the majority of the population is apathetic at best or hostile at worst to the idea of Belarusian nationhood.
 BLR_agriarian_traditions: "Аграрные традиции" # Agrarian Traditions
 BLR_agriarian_traditions_desc: "Беларусь была самым неиндустриальным регионом в Восточной Европе, который изо всех сил пытался модернизировать свою экономику из-за внутренних конфликтов и нестабильности в последние несколько десятилетий. Правительству следует реализовать ряд программ, таких как земельные реформы и субсидирование, чтобы справиться с соседними странами." # Belarus has been the most unindustrialized region in Eastern Europe, struggling to modernize its economy due to its internal conflicts and unstability in the past few decades. The Government should perform a number of programs such as land reforms and subsidizations in order to cope up with its neighboring countries.
 BLR_agriarian_traditions_1: "Аграрные традиции" # Agrarian Traditions
 BLR_agriarian_traditions_1_desc: "Беларусь была самым неиндустриальным регионом в Восточной Европе, который изо всех сил пытался модернизировать свою экономику из-за внутренних конфликтов и нестабильности в последние несколько десятилетий. Правительству следует реализовать ряд программ, таких как земельные реформы и субсидирование, чтобы справиться с соседними странами." # Belarus has been the most unindustrialized region in Eastern Europe, struggling to modernize its economy due to its internal conflicts and unstability in the past few decades. The Government should perform a number of programs such as land reforms and subsidizations in order to cope up with its neighboring countries.
