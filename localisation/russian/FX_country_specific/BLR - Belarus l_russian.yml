 BLR_can_you_read_my_son: "Ты умеешь читать, сын мой?" # Can you Read, my Son?
 BLR_can_you_read_my_son_desc: "Неграмотные крестьяне составляют большинство белорусского народа. Хотя страна вложила огромные финансовые средства в национальные программы грамотности, эффект только начинает проявляться." # Illiterate peasants make up the majority of the Belarusian people. While the nation has made enormous financial investments for a national literacy programs, the effects have been only beginning to show.
 BLR_intense_paranoia: "Сильная паранойя" # Intense Paranoia
 BLR_intense_paranoia_1: "Сильная паранойя" # Intense Paranoia
 BLR_diarchy_stable: "Стабильная двоевластие" # Stable Diarchy
 BLR_diarchy_stable_desc: "В стране два лидера: один - атаман, контролирующий армию, и один - БНСП, контролирующий правительство. Хотя между Ополчением и BNSP существует хорошее ощущение сотрудничества, если возникнет вакуум власти, будут последствия." # There are two leaders of the country, one is the Otaman which controls the army and one is the BNSP, which controls the government. While there is a good-sense of cooperation between the Home Guard and the BNSP, there will be consequences if a power vacuum erupts.
 BLR_power_struggle: "Борьба за власть" # Power Struggle
 BLR_power_struggle_desc: "Атаман — единственный, кто скрепляет хрупкую белорусскую диархию, и своей безвременной смертью он создал вакуум власти, который хотели бы заполнить и Ополчение, и БНСП. На данный момент обе фракции равны, что делает каждое важное решение вопросом компромисса." # The Otaman is the only one who holds the fragile Belarussian Diarchy together, and with his untimely death, has created a power vacuum that both the Home Guard and the BNSP would want to fill-up. For now both factions are evenly matched, which makes every important decision a question of compromise.
 BLR_power_struggle_home_guard: "Борьба за власть – доминирование ополчения" # Power Struggle - Home Guard Dominance
 BLR_power_struggle_home_guard_desc: "Атаман — единственный, кто скрепляет хрупкую белорусскую диархию, и своей безвременной смертью он создал вакуум власти, который хотели бы заполнить и Ополчение, и БНСП. Поскольку Ополчение является фракцией, контролирующей вооруженных людей, очевидно, что Ополчение имеет преимущество в этой великой игре." # The Otaman is the only one who holds the fragile Belarussian Diarchy together, and with his untimely death, has created a power vacuum that both the Home Guard and the BNSP would want to fill-up. As the faction that controls the men with guns, it is obvious that the Home Guard has the upper hand in this great game.
 BLR_power_struggle_nat_soc: "Борьба за власть – доминирование BNSP" # Power Struggle - BNSP Dominance
 BLR_power_struggle_nat_soc_desc: "Атаман — единственный, кто скрепляет хрупкую белорусскую диархию, и своей безвременной смертью он создал вакуум власти, который хотели бы заполнить и Ополчение, и БНСП. Поскольку BNSP контролирует само правительство и имеет наибольшее влияние в борьбе, сохранится ли это положение?" # The Otaman is the only one who holds the fragile Belarussian Diarchy together, and with his untimely death, has created a power vacuum that both the Home Guard and the BNSP would want to fill-up. As the BNSP controls the government itself, and has the most influence in the stuggle, but would this be maintained?
