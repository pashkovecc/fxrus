 BLR_black_wednesday_idea: "Последствия краха лондонского фондового рынка" # London Stock Market Crash Aftermath
 BLR_black_wednesday_idea_desc: "Хотя наша страна находится в нескольких милях от Лондона и Парижа, последствия краха лондонского фондового рынка значительно потрясли страну до глубины души. Экономика уже изо всех сил пытается остаться на плаву, а глобальный экономический кризис ухудшил экономическую ситуацию." # While our country is miles away from London and Paris, the effects of the London Stock Market Crashed has significantly shooked the nation to its core. The economy is already struggling to stay afloat and a global economic crisis has worsen the economic situation.
 BLR_black_wednesday_idea_1: "Последствия краха лондонского фондового рынка" # London Stock Market Crash Aftermath
 BLR_black_wednesday_idea_1_desc: "Хотя наша страна находится в нескольких милях от Лондона и Парижа, последствия краха лондонского фондового рынка значительно потрясли страну до глубины души. Экономика уже изо всех сил пытается остаться на плаву, а глобальный экономический кризис ухудшил экономическую ситуацию." # While our country is miles away from London and Paris, the effects of the London Stock Market Crashed has significantly shooked the nation to its core. The economy is already struggling to stay afloat and a global economic crisis has worsen the economic situation.
 BLR_black_wednesday_idea_2: "Последствия краха лондонского фондового рынка" # London Stock Market Crash Aftermath
 BLR_black_wednesday_idea_2_desc: "Хотя наша страна находится в нескольких милях от Лондона и Парижа, последствия краха лондонского фондового рынка значительно потрясли страну до глубины души. Экономика уже изо всех сил пытается остаться на плаву, а глобальный экономический кризис ухудшил экономическую ситуацию." # While our country is miles away from London and Paris, the effects of the London Stock Market Crashed has significantly shooked the nation to its core. The economy is already struggling to stay afloat and a global economic crisis has worsen the economic situation.
 BLR_black_wednesday_idea_3: "Последствия краха лондонского фондового рынка" # London Stock Market Crash Aftermath
 BLR_black_wednesday_idea_3_desc: "Хотя наша страна находится в нескольких милях от Лондона и Парижа, последствия краха лондонского фондового рынка значительно потрясли страну до глубины души. Экономика уже изо всех сил пытается остаться на плаву, а глобальный экономический кризис ухудшил экономическую ситуацию." # While our country is miles away from London and Paris, the effects of the London Stock Market Crashed has significantly shooked the nation to its core. The economy is already struggling to stay afloat and a global economic crisis has worsen the economic situation.
