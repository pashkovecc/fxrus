 BLR_power_struggle_balance_equal: "§YНа данный момент соотношение сил равное, и обе стороны держат друг друга под контролем.§!" # §YFor now, the balance of power is equal, and both sides are keeping each other in check.§!
 BLR_power_struggle_balance_unequal: "§RБаланс сил был нарушен, что постоянно снижает стабильность нашей страны. Хотя на какое-то время это может быть необходимо, мы должны попытаться решить эту проблему, как только сможем.§!" # §RThe balance of power has been disturbed, continually lowering our nation's Stability. Though this may be necessary for a time, we should try resolve this as soon as we are able.§!
