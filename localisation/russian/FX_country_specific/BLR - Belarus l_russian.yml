 belarus.36.a: "На войну!" # To War!
 belarus.37.t: "Предложение от [BLR.GetName]" # An Offer from [BLR.GetName]
 belarus.37.d: "Сегодня утром МИД получил интересное предложение от правительства [BLR.GetAdjective]. Они хотят купить у нас Белосток и Вильнюс, как утраченное ими заявленное государство; Честно говоря, это очень щедрое предложение с их стороны, но наше население в этом районе может быть отчуждено, если мы примем его." # This morning, the Foreign Ministry have received an interesting offer from the [BLR.GetAdjective] Government. They want to purchase Bialystok and Vilnius from us, as their lost claimed state; it is a very generous offer from them to be honest but our population in the area may be alienated if we accept.
 belarus.37.a: "Одобрить покупку" # Approve the purchase
 belarus.37.b: "Отклонить это" # Decline it
 belarus.38.t: "[From.GetName] уступает территории" # [From.GetName] Cedes the Territories
 belarus.38.d: "Правительство [From.GetAdjective] увидело мудрость в своей ситуации и вместо этого решило уступить территории, которые мы требовали, вместо того, чтобы создавать конфликт между нами и ними." # The [From.GetAdjective] Government have seen the wisdom in their situation and have instead opted to cede the territories we demanded instead of creating a conflict between us and them.
 belarus.38.a: "Могучая Беларусь!" # Mocnaja Bielaruś!
 belarus.39.t: "[From.GetName] отказывается выполнять наши требования!" # [From.GetName] Refuses Our Demands!
 belarus.39.d: "Неудивительно, что правительство [From.GetAdjective] в [From.Capital.GetCapitalVictoryPointName] отклонило наши требования об уступке территорий, на которые мы претендуем. Возможно, нам нужно показать им мощь нашей армии." # Unsuprisingly, the [From.GetAdjective] Government in [From.Capital.GetCapitalVictoryPointName] have refused our demands to cede the territories we claim. Maybe we need to show them our military's might
