 BLR_social_democrat_party_long: "Белорусская Сяланско-Работницкая Грамада\n§gБелорусская Рабочая и Крестьянская Партия§!" # Biełaruskaja Sialanska-Rabotnickaja Hramada\n§gBelarusian Workers' & Peasants' Party§!
 BLR_social_liberal_party: "БНП" # BNP
 BLR_social_liberal_party_long: "Беларусская Народная Партия\n§gБелорусская Национальная Партия§!" # Biełaruskaja Narodnaja Partyja\n§gBelarusian National Party§!
 BLR_market_liberal_party: "БСП" # BSP
 BLR_market_liberal_party_long: "Белорусская Селянская Партия\n§gБелорусская Крестьянская Партия§!" # Biełaruskaja Sialianskaja Partyja\n§gBelarusian Peasant Party§!
 BLR_social_conservative_party: "БХД" # BKhD
 BLR_social_conservative_party_long: "Biełaruskaja Khristianskaya Demokratiya\n§gBelarusian Christian Democrats§!" # Biełaruskaja Khristianskaya Demokratiya\n§gBelarusian Christian Democrats§!
 BLR_authoritarian_democrat_party: "НДП" # NDP
 BLR_authoritarian_democrat_party_long: "Национально-демократическая партия\n§gНационально-демократическая партия§!" # Nacyjanaĺna Demakratyčnaja Partyja\n§gNational Democratic Party§!
 BLR_paternal_autocrat_party: "Пейзаж Абарона" # Krajovaja Abarona
 BLR_paternal_autocrat_party_long: "Краевая Абарона\n§gНациональная оборона§!\n§LКрайовая Абарона — это собрание офицеров и командиров Ополчения, все еще верных покойному атаману. Эти офицеры решительно настроены против правительства БНСП и не считают его немецкими болонками, желающими сделать Беларусь государством-сателлитом Германии. Они сделают все, чтобы остановить и вытеснить БНСП из правительства.§!" # Krajovaja Abarona\n§gNational Defense§!\n§LThe Krajovaja Abarona is a collection of officers and commanders of the Home Guard still loyal to the late Otaman. These officers are strongly against the BNSP government and views them as nothing of German-lapdogs wanting to make Belarus a German satellite state. They would do anything to stop and oust the BNSP from the government.§!
 BLR_national_populist_party: "БНП" # BNP
 BLR_national_populist_party_long: "Белорусская независимая партия§!" # Biełaruskaja Niezaležnickaja Partyja\n§gBelarusian Independent Party§!
 BLR_valkist_party: "БНСП" # BNSP
 BLR_valkist_party_long: "Беларусская Национально-Социалистическая Партия\n§gБелорусская Национал-Социалистическая Партия§!\n§LБНСП или Белорусская Национал-Социалистическая Партия была недавно сформированной партией поклонников немецкого валькизма. Они искали решения проблем молодой независимой Беларуси на примере Германии.§!" # Biełaruskaja Nacyjanal-Sacyjalistyčnaja Partyja\n§gBelarusian National-Socialist Party§!\n§LThe BNSP or the Belarusian National-Socialist Party was a newly formed party by admirers of German Valkism. They sought out solutions to the problems of this young independent nation of Belarus by taking examples from Germany.§!

### Tooltips
