l_russian:
  
 BLR_FUHRERREICH_DESC: "The Belarusian War for Independence was led by the bold man, the Ataman, Stanislav Bulak-Balakhovich. Alongside Poles and Ukrainians he fought against Bolsheviks and signed a peace treaty of Riga in 1922. He's the man who brought peace and independence to Belarus, but is there freedom in Belarus? The army keeps its loyalty to the Ataman, but his desire to control politics too resulted in alliance with belarusian national-socialist party and the isolation from neighboring countries. With growing dissatisfaction within his government, the nation was thrown into unrest, with conflicts erupting between his loyalists from the Home Guard and the BNSP"
