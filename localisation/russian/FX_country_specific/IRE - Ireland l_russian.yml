 ### Events 
 ireland.100.t: "[IRE.GetAdjective] Entry to the [Root.GetFactionName]" #NT!
 ireland.100.d: "The [IRE.GetAdjective] Government have approached us with an interesting proposal, it seems that they are interested in building an alliance with us to combat the British in the emerald isle. While they are still fighting for their very existence, they might a useful ally as they are the \"Gateway to the Atlantic\"." #NT!
 ireland.100.a: "We need the help we can get." #NT!
 ireland.100.b: "They would be a burden" #NT!
 ireland.101.t: "[From.GetNameDef] Accepts" #NT!
 ireland.101.d: "The [From.GetAdjective] Government have accepted our proposal in joining their alliance." #NT!
 ireland.101.a: "Great!" #NT!
 ireland.102.t: "[From.GetNameDef] Refuses" #NT!
 ireland.102.d: "The [From.GetAdjective] Government have refused our proposal in joining their alliance. We will make sure that they will regret this decision one day." #NT!
 ireland.102.a: "Disappointing..." #NT!
  
  
  
