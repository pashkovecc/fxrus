#### Focus Tree ####

 AFG_king_is_dead_long_live_king: "Король умер, да здравствует король" # The King is Dead, Long Live the King
 AFG_king_is_dead_long_live_king_desc: "После смерти короля Мохаммеда Надир-хана Афганистан должен теперь обратить свое внимание на сохранение трона и сохранение монархии." # With the death of King Mohammed Nadir Khan, Afghanistan must now turn its attention to securing the throne and ensuring that the monarchy continues on.
 AFG_new_generation: "Новое поколение" # The New Generation
 AFG_new_generation_desc: "Поскольку монархия в опасности, мы должны гарантировать, что новое поколение лидеров в лице Мохаммеда Захир Хана сможет успешно взять на себя управление и вернуть правительство к стабильности." # With the monarchy in peril, we must ensure that a new generation of leadership in Mohammed Zahir Khan is able to successfully take the helm and guide the government back to stability.
 AFG_secure_musahiban_control: "Обеспечить контроль над Мусахибаном" # Secure Musahiban Control
 AFG_secure_musahiban_control_desc: "После смерти короля Мохаммеда Надир-хана крайне важно, чтобы мы обеспечили сохранение контроля над страной династией Мусахибан - ради всеобщего блага." # After King Mohammed Nadir Khan's death, it is imperative that we ensure the Musahiban dynasty remains in control of the country - for everyone's sake.
 AFG_sons_vengeance: "Месть сына" # The Son's Vengeance
 AFG_sons_vengeance_desc: "Король Мохаммед Захир Хан не жалеет своих мыслей, когда дело касается убийц его отца. Сын отомстит за отца." # King Mohammed Zahir Khan does not have mercy on his mind when it comes to his father's killers. The son will avenge the father.
 AFG_secure_tribal_loyalty: "Обеспечьте племенную лояльность" # Secure Tribal Loyalty
 AFG_secure_tribal_loyalty_desc: "Чтобы обеспечить монархию, нам важно заручиться лояльностью различных племен, которые управляют сельскими районами Афганистана." # In order to secure the monarchy, it's essential that we secure loyalty from the various tribes that govern rural Afghanistan.
 AFG_upheld_status_quo: "Поддерживать статус-кво" # Uphold the Status Quo
 AFG_upheld_status_quo_desc: "Самый верный способ сохранить стабильность и безопасность — ничего не менять. Статус-кво завел нас так далеко; это может помочь нам продвинуться немного дальше." # The most sure-fire way of maintaining stability and security is to change nothing. The status quo has gotten us this far; it can get us a little farther.
 AFG_traditional_style_ruling: "Традиционный стиль правления" # Traditional Style of Ruling
 AFG_traditional_style_ruling_desc: "Важно продолжить наследие династии Мусахибан, сохраняя ее стиль правления и никогда не отклоняясь далеко от традиций." # It is important to carry on the legacy of the Musahiban dynasty by carrying on its style of rule and never straying far from tradition.
 AFG_appeace_religious_leaders: "Умиротворить религиозных лидеров" # Appease Religious Leaders
 AFG_appeace_religious_leaders_desc: "Чтобы сохранить нашу власть над страной, мы должны быть готовы пойти на уступки религиозным лидерам, которые управляют большими собраниями наших сторонников." # In order to maintain our authority over the country, we must be willing to give concessions to the religious leaders who manage large congregations of our supporters.
 AFG_need_for_modernization: "Необходимость модернизации" # A Need For Modernization
 AFG_need_for_modernization_desc: "Афганистан очень сильно отстает от многих своих соседей в области технологий. Крайне важно, чтобы мы начали модернизацию нашей инфраструктуры как можно скорее, чтобы догнать их." # Afghanistan is far, far behind many of its neighbors in technology. It is essential that we begin modernizing our infrastructure as soon as possible to catch up with them.
 AFG_return_of_the_king: "Возвращение короля" # The Return of the King
 AFG_return_of_the_king_desc: "Планируя свое возвращение на афганский трон, Аманулла Хан намеревался изменить всю нацию по образу и подобию своих реформ." # With his planned return to the Afghan throne, Amanullah Khan has set out to re-shape the entire nation in the image of his reforms.
 AFG_harsh_on_banditry: "Жестко к бандитизму" # Harsh on Banditry
 AFG_harsh_on_banditry_desc: "Подавление бандитов, которые бродят и разоряют афганскую сельскую местность, является важным шагом в реструктуризации афганского общества и обеспечении того, чтобы все новые реформы имели длительный срок." # Putting down the bandits who roam and ravage the Afghan countryside is an important step in re-structuring Afghan society and ensuring that all new reforms are set to last.
 AFG_deal_with_musahibans: "Сделка с Мусахибанами" # Deal With the Musahibans
 AFG_deal_with_musahibans_desc: "Когда Аманулла-хан вернулся на трон, пришло время разобраться с выжившими претендентами на власть Мусахибан и раз и навсегда защитить корону от всех потенциальных врагов." # With Amanullah Khan back on the throne, the time has come to deal with the surviving Musahiban claimants, and secure the crown against all potential foes once and for all.
 AFG_reimplement_amanullahs_reforms: "Повторить реформы Амануллы" # Reimplement Amanullah's Reforms
 AFG_reimplement_amanullahs_reforms_desc: "Реформы Амануллы были потеряны или забыты в его отсутствие. Теперь, когда он вернулся, пришло время вновь реализовать их – и пойти еще дальше в воссоздании Афганистана." # Amanullah's reforms have been lost or forgotten in his absence. Now that he has returned, the time has come to reimplement them - and go even further in recreating Afghanistan.
 AFG_civil_rights_for_afghans: "Гражданские права афганцев" # Civil Rights for Afghans
 AFG_civil_rights_for_afghans_desc: "Афганцы слишком долго жили без гражданских прав и свобод, которых они заслуживают. Пришло время закрепить их в законе, чтобы все афганцы могли процветать." # Afghans have gone for far too long without the civil rights and liberties that they deserve. It is time to codify them into law, so that all Afghans may prosper.
 AFG_secure_equal_rights: "Обеспечьте равные права" # Secure Equal Rights
 AFG_secure_equal_rights_desc: "Недопустимо, чтобы некоторые афганцы имели права, которых нет у других. Чтобы создать по-настоящему справедливое и процветающее общество, мы должны обеспечить всем гражданам равный доступ к правам." # It will not do for some Afghans to have rights that others do not. To create a truly just and prosperous society, we must ensure that all citizens have equal access to rights.
 AFG_permanent_parliament: "Постоянный парламент" # A Permanent Parliament
 AFG_permanent_parliament_desc: "Невозможно призывать к сбалансированному и реформированному правительству, не уступив нашу власть постоянному парламенту, который с этого момента будет действовать во время правления каждого короля." # It will not do to call for a rebalanced and reformed government without ceding our power to a permanent Parliament, one which will serve during every king's reign from here on out.
 AFG_sorayas_fight_for_women: "Борьба Сорайи за женщин" # Soraya's Fight for Women
 AFG_sorayas_fight_for_women_desc: "Женщины в основном не представлены в афганском обществе и правительстве. Но внимание нового короля было привлечено к их борьбе, и, возможно, пришло время заняться ими." # Women have largely been unrepresented in Afghan society and government. But the new King's attention has been brought to their struggles, and it may be time to address them.

 AFG_afghan_revolution: "Афганская революция" # The Afghan Revolution
 AFG_afghan_revolution_desc: "Когда народ восстал и сверг монархию, пришло время установить перманентную революцию и истинно народное правительство в Афганистане." # With the popular people rising up and overthrowing the monarchy, the time has come to establish a permanent revolution and a true people's government in Afghanistan.
 AFG_socialism_in_afghanistan: "Социализм в Афганистане" # Socialism in Afghanistan
 AFG_socialism_in_afghanistan_desc: "Подлинное народное правительство – это новый эксперимент в Афганистане. Мы должны сделать все возможное, чтобы обеспечить процветание социализма в Афганистане вопреки многочисленным врагам, которые стремятся его разрушить." # A true people's government is a new experiment in Afghanistan. We must do our best to ensure that socialism in Afghanistan prospers against the many enemies that seek to tear it down.
 AFG_destroy_enemies_revolution: "Уничтожить врагов революции" # Destroy the Enemies of the Revolution
 AFG_destroy_enemies_revolution_desc: "Революция станет по-настоящему безопасной только тогда, когда все ее враги будут полностью и окончательно уничтожены. Для этого мы должны проявлять инициативу; мы должны выслеживать их, пока никого не останется." # The Revolution will only be truly safe once all of its enemies have been completely and utterly destroyed. To do so, we must be proactive; we must hunt them down until none remain.
 AFG_socialist_propaganda: "Социалистическая пропаганда" # Socialist Propaganda
 AFG_socialist_propaganda_desc: "Один из лучших способов достучаться до нашего населения и научить его идеалам революции – это пропагандистские усилия. Инвестиции в эту среду, несомненно, принесут большую поддержку народному правительству." # One of the best ways to reach our population and teach them about the ideals of the revolution is through propaganda efforts. Investing in this medium will surely garner more support for the people's government.
 AFG_tarakis_land_reform: "Земельная реформа Тараки" # Taraki's Land Reform
 AFG_tarakis_land_reform_desc: "Нур Мухаммад Тараки имел тесные связи с Советским Союзом и стремится применить полученные знания о земельной реформе здесь, в Афганистане. Земельная реформа крайне необходима, и он — лучшее, что у нас есть." # Nur Muhammad Taraki has had close ties to the Soviet Union, and seeks to implement the knowledge he learned about land reform there here in Afghanistan. Land reform is desperately needed, and he's the best we have.
 AFG_strengthen_general_secretary: "Укрепить Генерального секретаря" # Strengthen the General Secretary
 AFG_strengthen_general_secretary_desc: "Позиция Генерального секретаря сильна по названию, но не по силе. Пришло время изменить это." # The position of the General Secretary is powerful in name, but not in power. It is time to change that.
 AFG_curb_tribal_influence: "Ограничить племенное влияние" # Curb Tribal Influence
 AFG_curb_tribal_influence_desc: "Лидеры племен смягчили последствия народной революции в сельских районах Афганистана. Пришло время ограничить их власть и провести наши реформы без их вмешательства." # Tribal leaders have mitigated the effects of the people's revolution in rural Afghanistan. It's past time to curb their authority and institute our reforms without them standing in the way.
 AFG_secure_social_justice: "Обеспечить социальную справедливость" # Secure Social Justice
 AFG_secure_social_justice_desc: "Социальная справедливость является важным аспектом революции. Важно, чтобы мы обеспечили всем афганцам равные права перед законом." # Social justice is an essential aspect of the revolution. It is important that we make sure all Afghans have equal rights under the law.
 AFG_rapid_literacy_campaign: "Кампания по быстрой грамотности" # Rapid Literacy Campaign
 AFG_rapid_literacy_campaign_desc: "Для модернизации нашей страны крайне важно обеспечить программы грамотности для сельского населения Афганистана." # In order to modernize our nation, it is essential that we provide literacy programs for Afghanistan's rural population.
 AFG_socialist_modernization: "Социалистическая модернизация" # Socialist Modernization
 AFG_socialist_modernization_desc: "Хотя наша нация должна модернизироваться, важно, чтобы мы помнили о народной революции в наших реформах. Если этого не сделать, это приведет лишь к возвращению ненужных институтов старой монархии." # While our nation must modernize, it's important that we remember the people's revolution in our reforms. Failing to do so would only bring back undue institutions of the old monarchy.
 AFG_renounce_pro_soviet_politics: "Откажитесь от просоветской политики" # Renounce Pro-Soviet Politics
 AFG_renounce_pro_soviet_politics_desc: "Хотя и мы, и Советский Союз революционны по названию, на этом сходство заканчивается. Мы не можем и не должны поддерживать советскую империалистическую политику. Мы должны отказаться от них перед миром." # While both we and the Soviet Union are revolutionary in name, the similarlity ends there. We cannot and must not support Soviet imperialist policies. We must renounce them before the world.
 AFG_establish_parliament: "Создать парламент" # Establish a Parliament
 AFG_establish_parliament_desc: "Народный парламент является таким же важным аспектом социализма, как и любой другой. Благодаря этому мы действительно сможем начать принимать новые, справедливые законы и реформы для Афганистана." # A people's Parliament is as an important aspect of socialism as any. With it, we can truly begin passing new, just laws and reforms for Afghanistan.
 AFG_rights_for_men_and_women: "Права мужчин и женщин" # Rights for Men and Women
 AFG_rights_for_men_and_women_desc: "Права не могут распространяться на один пол, а не на другой среди наших граждан. Они должны быть предоставлены в равной степени мужчинам и женщинам." # Rights cannot be applied to one sex and not the other among our citizenry. They must be granted equally to men and women.
 AFG_free_elections: "Свободные выборы" # Free Elections
 AFG_free_elections_desc: "Народное правительство ничего не значит без свободных выборов. Мы должны обеспечить, чтобы каждый гражданин Афганистана имел право и возможность голосовать, чтобы все голоса были услышаны." # A people's government means nothing without free elections. We must ensure that every Afghan citizen has the right and opportunity to vote, so that all voices are heard.
 AFG_provide_education: "Обеспечить образование" # Provide Education
 AFG_provide_education_desc: "Среди наших сельских реформ – необходимость предоставить образование тем, у кого его нет. Обучение каждого афганца – это огромный шаг вперед на пути к тотальной модернизации." # Among our rural reforms is a need to provide education for those without it. Educating every Afghan citizen is a massive leap forward on the road to total modernization.
 AFG_encourage_progressive_voices: "Поощряйте прогрессивные голоса" # Encourage Progressive Voices
 AFG_encourage_progressive_voices_desc: "Мы должны поощрять и поощрять прогрессивные голоса в нашем правительстве, чтобы мы могли продолжать вечную революцию, совершаемую людьми и для людей." # We must foster and encourage progressive voices within our government, so that we may continue the perpetual revolution of, by, and for the people.
 AFG_strengthen_afghan_democracy: "Укрепить афганскую демократию" # Strengthen Afghan Democracy
 AFG_strengthen_afghan_democracy_desc: "Наша нация сильна настолько, насколько силен ее народ. Укрепление нашей демократии и обеспечение того, чтобы каждый голос был услышан, имеют важное значение для создания справедливого и прочного правительства." # Our nation is only as strong as its people. Strenghtening our democracy and ensuring that every voice is heard is essential in creating a just and lasting government.

 AFG_kalakanis_return: "Возвращение Калакани" # Kalakāni's Return
 AFG_kalakanis_return_desc: "Хабибулла Калакани прибыл из Туркестана и вновь подтвердил свою власть над Афганистаном. С ним начнется новое начало для страны, давно нуждающейся в сильном лидере." # Habibullāh Kalakāni has made his way down from Turkestan, and reasserted his authority over Afghanistan. With him will come a new start for a country long in need of a strong leader.
 AFG_remove_barakzai_kings: "Удалить королей Баракзая" # Remove the Barakzai Kings
 AFG_remove_barakzai_kings_desc: "Афганистан достаточно пострадал под слабым руководством беззубых королей. Пришло время избавиться от них раз и навсегда." # Afghanistan has suffered enough under the weak leadership of kings without teeth. It is time we remove them once and for all.
 AFG_weaken_tribal_identity: "Ослабление племенной идентичности" # Weaken Tribal Identity
 AFG_weaken_tribal_identity_desc: "Племена слишком долго разделяли сельские районы Афганистана. Гораздо лучше, когда люди идентифицируют себя с нацией, а не со своим племенем. Мы должны стремиться к достижению этой цели." # Tribes have divided rural Afghanistan for far too long. It is much better that people identify with the nation rather than their tribe. We must strive to achieve that goal.
 AFG_purge_revolutionaries: "Очистить революционеров" # Purge the Revolutionaries
 AFG_purge_revolutionaries_desc: "Социалисты-революционеры, угрожающие нации, все еще присутствуют в нашем правительстве. Мы должны очистить их раз и навсегда, чтобы обеспечить безопасность и защищенность нашего нового режима." # The socialist revolutionaries who threaten the nation are still present in our government. We must purge them once and for all to ensure the safety and security of our new regime.
 AFG_defender_of_islam: "Защитник Ислама" # The Defender of Islam
 AFG_defender_of_islam_desc: "Хабибулла Калакани должен утвердить свою позицию Защитника ислама, чтобы сплотить сельское население и утвердить доминирование Афганистана в регионе." # Habibullāh Kalakāni must assert his position as the Defender of Islam, both to rally the rural populace and assert Afghan dominance over the region.
 AFG_traditional_gender_roles: "Традиционные гендерные роли" # Traditional Gender Roles
 AFG_traditional_gender_roles_desc: "Некоторые вещи не могут измениться. Роль, которую гендер играет в Афганистане, является одной из них. Мы должны придерживаться традиций, чтобы сохранить стабильность и безопасность." # Some things cannot change. The roles that gender plays in Afghanistan is one of them. We must stick to tradition to retain stability and security.
 AFG_deal_with_aggressive_religions: "Борьба с агрессивными религиями" # Deal With Aggressive Religions
 AFG_deal_with_aggressive_religions_desc: "Агрессивные религии в Афганистане всегда разделяли его народ и ослабляли его правительство. Борьба с ними сейчас необходима для объединения нации." # Aggressive religions within Afghanistan have always divided its people and weakened its government. Dealing with them now is essential to uniting the nation.
 AFG_better_tajik_pashtun_relations: "Улучшение таджикско-пуштунских отношений" # Improve the Tajik-Pashtun Relations
 AFG_better_tajik_pashtun_relations_desc: "Наш новый режим ни к чему не приведет, если мы не улучшим наши отношения с таджикско-пуштунскими племенами, которые правят большей частью сельской страны." # Our new regime will go nowhere unless we improve our relations with the Tajik-Pashtun tribes that rule much of the rural country.
 AFG_bandit_king_afghanistan: "Бандитский король Афганистана" # The Bandit King of Afghanistan
 AFG_bandit_king_afghanistan_desc: "Новый режим Хабибуллы Калакани навсегда изменит историю Афганистана. С этого момента нация не будет слабой или отсталой, а будет сильной и доминирующей." # Habibullāh Kalakāni's new regime will forever change the history of Afghanistan. From here on out, the nation shall not be weak or backwards, but strong and dominant.
 AFG_guerilla_raiders: "Партизанские рейдеры" # Guerilla Raiders
 AFG_guerilla_raiders_desc: "Лучший способ справиться с нашими более слабыми соседями — это совершать набеги на них — быстро и постоянно. Они не будут достаточно сильны и организованы, чтобы остановить нас, и, кроме того, мы получим от этого приличную прибыль." # The best way to handle our weaker neighbors is to raid them - quickly and constantly. They will not be strong or organized enough to stop us, and we'll make a pretty profit off of it besides.

 AFG_develop_nation: "Развивайте нацию" # Develop the Nation
 AFG_develop_nation_desc: "Инфраструктуры в Афганистане всегда остро не хватало. Давно прошло время улучшить ситуацию и улучшить жизнь нашего населения." # Infrastructure in Afghanistan has always been severly lacking. It is far past time to improve upon it and improve the lives of our populace.
 AFG_towards_modernization: "На пути к модернизации" # Towards Modernization
 AFG_towards_modernization_desc: "Модернизация всегда казалась Афганистану недостижимой. Но сейчас он ближе, чем когда-либо, и мы готовы подготовить страну к его приходу." # Modernization has always seemed far out of reach for Afghanistan. But now, it is closer than ever, and we are ready to prepare the nation for its arrival.
 AFG_start_industrialization: "Начать индустриализацию" # Start Industrialization
 AFG_start_industrialization_desc: "Самым основным шагом в процессе модернизации является индустриализация страны. Это даст нам ценные ресурсы, которые мы сможем позже потратить на инфраструктуру и военные улучшения." # The most basic step in the process of modernization is to industrialize the nation. Doing so will give us valuable resources that we can spend on infrastructure and military improvements later on.
 AFG_urbanize_kabul: "Урбанизированный прием" # Urbanize Kabul
 AFG_urbanize_kabul_desc: "Кабул должен выглядеть как столица великой нации, чтобы быть ею. Начало наших усилий по модернизации здесь послужит тому, чтобы сделать его эпицентром общенациональных перемен." # Kabul must look like the capital of a great nation in order to be one. Beginning our modernization efforts here will serve to make it the epicenter of nationwide change.
 AFG_modernize_infrastucture: "Модернизация инфраструктуры" # Modernize Infrastructure
 AFG_modernize_infrastucture_desc: "Давно пора заняться улучшением нашей инфраструктуры – как внутри городов, так и за их пределами. Это превратит нас из отсталой нации в настоящего игрока на мировой арене." # It is long past time to begin improving our infrastructure - both inside and outside of the cities. Doing so will push us from a backwards nation to a true player on the world stage.
 AFG_attract_foreign_investors: "Привлечь иностранных инвесторов" # Attract Foreign Investors
 AFG_attract_foreign_investors_desc: "Инвестиции так же важны, как и государственные программы в создании новой и устойчивой экономики. Привлечение иностранных инвестиций будет трудным, но это важный аспект наших усилий по модернизации." # Investment is just as important as government programs in creating a new and lasting economy. Attracting foreign invesment will be difficult - but it is an essential aspect of our modernization efforts.
 AFG_iranian_imports: "Иранский импорт" # Iranian Imports
 AFG_iranian_imports_desc: "Иран уже давно является одним из наших основных торговых партнеров. Продолжение массового импорта из них важно для поддержания и роста обеих наших экономик." # Iran has long served as one of our major trading partners. Continuing to import from them en masse is important in maintaining and growing both of our economies.
 AFG_grow_domestic_buisnesses: "Развивайте внутренний бизнес" # Grow Domestic Buisnesses
 AFG_grow_domestic_buisnesses_desc: "Мы не можем полагаться исключительно на импорт для поддержания нашего населения. Мы должны обеспечить процветание нашего собственного отечественного бизнеса и обеспечение всего Афганистана." # We cannot rely solely on imports to sustain our populace. We must insure that our own domestic businesses can prosper and provide for all of Afghanistan.
 AFG_market_for_foreign_industries: "Рынок для зарубежной промышленности" # A Market for Foreign Industries
 AFG_market_for_foreign_industries_desc: "Для дальнейшего привлечения иностранных инвестиций мы должны открыть нашу страну как рынок для иностранной промышленности." # To further foreign invesment, we must open our country as a market for foreign industry.
 AFG_search_for_resources: "Поиск ресурсов" # Search for Resources
 AFG_search_for_resources_desc: "Афганистан остается крайне слаборазвитым, а это означает, что еще многое предстоит открыть. Обнаружение огромных запасов природных ресурсов могло бы стать прорывом в наших усилиях по модернизации и индустриализации." # Afghanistan remains severely underdeveloped - which means that there is much still to discover. Finding vast deposits of natural resources could be a breakthrough in our modernization and industrialization efforts.
 AFG_purchase_tribal_land: "Покупка племенной земли" # Purchase Tribal Land
 AFG_purchase_tribal_land_desc: "Чтобы добывать ресурсы, мы должны добывать землю на племенных землях. Покупка земли у этих племен — единственный способ использовать их ресурсы, не вызывая у них необоснованного гнева." # In order to extract resources, we must mine on tribal land. Buying the land from these tribes is the only way to utilize their resources without angering them beyond reason.
 AFG_expand_kabul_university: "Расширить Кабульский университет" # Expand the Kabul University
 AFG_expand_kabul_university_desc: "Высшее образование является еще одним важным элементом наших усилий по модернизации. Расширение Кабульского университета для поощрения стремления к более высоким знаниям — это один шаг, который мы можем сделать, чтобы воплотить эту цель в жизнь." # Higher education is another essential element of our modernization efforts. Expanding the Kabul University to encourage the pursuit of higher knowledge is one step we can take to make that goal a reality.
 AFG_focus_agriculture: "Сосредоточьтесь на сельском хозяйстве" # Focus on Agriculture
 AFG_focus_agriculture_desc: "Накормить наше население так же важно, как и его модернизировать. Мы должны сосредоточиться не только на промышленности, но и на сельском хозяйстве, чтобы население было сытым и здоровым." # Feeding our populace is just as important as modernizing it. We must focus as much on agriculture as industry in order to keep the population fed and healthy.
 AFG_agricultural_infrastructure: "Сельскохозяйственная инфраструктура" # Agricultural Infrastructure
 AFG_agricultural_infrastructure_desc: "Наши методы ведения сельского хозяйства сильно отстают от методов наших соседей. Адаптация того, как мы выращиваем и собираем урожай, является важным шагом на пути к ним." # Our methods of agriculture are far behind those of our neighbors. Adapting how we farm and harvest our crops is an important step in catching up with them.
 AFG_import_foreign_tractors: "Импорт иностранных тракторов" # Import Foreign Tractors
 AFG_import_foreign_tractors_desc: "Хотя у нас еще нет средств для массового производства сельскохозяйственного оборудования, мы можем с тем же успехом импортировать его из зарубежных стран, пока не научимся производить его самостоятельно." # While we do not yet have the means to produce farming equipment en masse, we can just as easily import it from foreign nations until we are able to manufacture them ourselves.
 AFG_modernize_irrigation: "Модернизация ирригации" # Modernize Irrigation
 AFG_modernize_irrigation_desc: "Модернизация ирригационных систем на наших фермах будет иметь большое значение для улучшения нашей сельскохозяйственной системы в целом." # Modernizing our irrigation systems on our farms will go a long way in improving our farming system overall.
 AFG_subsidise_grain_production: "Субсидировать производство зерна" # Subsidise Grain Production
 AFG_subsidise_grain_production_desc: "Субсидирование производства зерна является важным аспектом дальнейшей модернизации сельского хозяйства и питания нашего населения." # Subsidizing our grain production is an important aspect of furthering our agricultural modernization and feeding our populace.
 AFG_fruits_and_nuts: "Фрукты и орехи" # Fruits and Nuts
 AFG_fruits_and_nuts_desc: "Фрукты и орехи должны стать новым продуктом нашего сельского хозяйства и рациона питания, чтобы диверсифицировать нашу сельскохозяйственную промышленность и обеспечить наше население достаточным количеством продовольствия, а остатки можно будет экспортировать." # Fruits and nuts must become a new staple of our agriculture and diets in order to diversify our agriculture industry and provide enough food for our populace with leftovers to export.
 AFG_control_opium_production: "Контроль над производством опиума" # Control Opium Production
 AFG_control_opium_production_desc: "Хотя опиум принес огромную прибыль на черном рынке, мы не можем позволить себе больше рисковать, чтобы он наносил вред нашему населению. Мы должны строго контролировать его производство, чтобы сохранить здоровье и продуктивность нашего населения." # While opium has made extensive profits on the black market, we cannot afford to risk it harming our populace any longer. We must strictly control its production in order to keep our population healthy and productive.
 AFG_new_silk_road: "Новый Шелковый путь" # The New Silk Road
 AFG_new_silk_road_desc: "Новый Шелковый путь торговли и промышленности пройдет прямо через сердце Афганистана. Наши усилия по модернизации в конечном итоге окупятся и сделают нас невероятно богатыми." # The new Silk Road of trade and industry will run right through the heart of Afghanistan. Our modernization efforts will pay off in the end, and make us rich beyond belief.

 AFG_recieve_german_aid: "Получить немецкую помощь" # Receive German Aid
 AFG_recieve_german_aid_desc: "Помощь Германского Рейха могла бы сыграть важную роль в обеспечении наших позиций в регионе и дальнейшем развитии наших усилий по модернизации и индустриализации." # Aid from the German Reich could go a long way in securing our position in the region and furthing our modernization and industrialization drives.
 AFG_recieve_british_aid: "Получите британскую помощь" # Receive British Aid
 AFG_recieve_british_aid_desc: "Помощь Британской империи могла бы сыграть важную роль в обеспечении наших позиций в регионе и дальнейшем развитии наших усилий по модернизации и индустриализации." # Aid from the British Empire could go a long way in securing our position in the region and furthing our modernization and industrialization drives.
 AFG_recieve_soviet_aid: "Получить советскую помощь" # Receive Soviet Aid
 AFG_recieve_soviet_aid_desc: "Помощь Советского Союза могла бы сыграть важную роль в обеспечении наших позиций в регионе и дальнейшем развитии наших усилий по модернизации и индустриализации." # Aid from the Soviet Union could go a long way in securing our position in the region and furthing our modernization and industrialization drives.
 AFG_learn_from_west: "Учитесь у Запада" # Learn From the West
 AFG_learn_from_west_desc: "Наши цели модернизации и индустриализации испытывают сильное влияние Запада. Продолжая учиться у них – даже если их цели могут противоречить нашим собственным – может оказаться чрезвычайно ценным для наших усилий." # Our goals of modernization and industrialization take heavy influence from the West. Continuing to learn from them - even if their goals may be contrary to our own - could be extremely valuable to our efforts.
 AFG_learn_railway_construction: "Изучите железнодорожное строительство" # Learn Railway Construction
 AFG_learn_railway_construction_desc: "Строительство железных дорог – это то, чего Афганистану не хватало на протяжении десятилетий. Нет лучшего способа пересечь страну, чем по железной дороге; это то, к чему мы должны сейчас обратиться в рамках нашей кампании по модернизации." # Railway construction is something that Afghanistan has been lacking for decades. There is no better way to traverse the country than by railroad; something that we must now address in our modernization drive.
 AFG_collaborate_with_germany: "Сотрудничать с Германией" # Collaborate With Germany
 AFG_collaborate_with_germany_desc: "Сотрудничество с валкистами в Германии даст нам ценные инструменты и идеи, которые мы сможем использовать для дальнейшей индустриализации нашей страны и превзойти наших соседей." # Collaboration with the Valkists in Germany will net us valuable tools and ideas that we can use to further industrialize our nation and surpass our neighbors.
 AFG_friend_of_empire: "Друг Империи" # A Friend of the Empire
 AFG_friend_of_empire_desc: "Сотрудничество с Британской империей даст нам ценные инструменты и идеи, которые мы сможем использовать для дальнейшей индустриализации нашей страны и превзойти наших соседей." # Collaboration with the British Empire will net us valuable tools and ideas that we can use to further industrialize our nation and surpass our neighbors.
 AFG_soviet_collaboration: "Советское сотрудничество" # Soviet Collaboration
 AFG_soviet_collaboration_desc: "Сотрудничество с коммунистами Советского Союза даст нам ценные инструменты и идеи, которые мы сможем использовать для дальнейшей индустриализации нашей страны и превзойти наших соседей." # Collaboration with the Communists in the Soviet Union will net us valuable tools and ideas that we can use to further industrialize our nation and surpass our neighbors.

 AFG_reform_afghan_armed_forces: "Реформирование афганских вооруженных сил" # Reform the Afghan Armed Forces
 AFG_reform_afghan_armed_forces_desc: "Наше стремление к модернизации не было бы полным без капитального ремонта наших вооруженных сил, которые отчаянно нуждаются в реформах, если они когда-либо надеются стать сильнее наших соседей." # Our modernization drive would not be complete without overhauling our armed forces, who are desperatly in need of reform if they ever hope to be stronger than our neighbors.

 AFG_afghan_army: "Афганская армия" # The Afghan Army
 AFG_afghan_army_desc: "Афганская армия уже давно использует устаревшую технику и стратегию. Давно пора включить его в наши усилия по модернизации, если не сделать его приоритетом." # The Afghan Army has long used outdated equipment and strategy. It is long past time that it is included in our modernization efforts, if not prioritized.
 AFG_foreign_assistance: "Иностранная помощь" # Foreign Assistance
 AFG_foreign_assistance_desc: "Хотя Афганистан традиционно был изолированной страной, возможно, пришло время обратиться за иностранной помощью в обновлении и индустриализации нашей армии." # While Afghanistan has traditionally been a secluded nation, it may be time to look for foreign assistance in overhauling and industrializing our army.
 AFG_learn_from_previous_wars: "Учитесь на предыдущих войнах" # Learn From the Previous Wars
 AFG_learn_from_previous_wars_desc: "В Афганистане велось множество войн, в том числе против Российской и Британской империй. Важно изучить стратегии этих войн, чтобы сформировать те, которые мы будем использовать в следующих." # Many wars have been fought in Afghanistan, including against the Russian and British Empires. It's important to learn strategies from these wars in order to form those we will use in the next.
 AFG_expand_funding_for_army: "Расширить финансирование армии" # Expand Funding For the Army
 AFG_expand_funding_for_army_desc: "Усилия по модернизации армии не зайдут так далеко без надлежащего финансирования со стороны нашего правительства. Расширение финансирования этих усилий имеет важное значение для их доведения до конца." # Modernization efforts in the army will only get so far without proper funding from our government. Expanding funding to these efforts is essential in seeing them through.
 AFG_modernize_military_communication: "Модернизация военной связи" # Modernize Military Communication
 AFG_modernize_military_communication_desc: "Общение имеет важное значение на поле боя. Мы должны модернизировать наши методы связи в наших вооруженных силах, чтобы иметь шанс противостоять нашим врагам." # Communication is essential on the battlefield. We must modernize our methods of communication within our military in order to stand a chance against our foes.
 AFG_future_of_cavalry: "Будущее кавалерии" # The Future of Cavalry
 AFG_future_of_cavalry_desc: "Хотя кавалерия всегда была основным продуктом афганской армии, она не сможет сравниться с западными танками и бронемашинами. Пришло время решить, следует ли придерживаться традиций или нашего стремления к модернизации." # While cavalry has always been a staple of the Afghan military, it will be no match to Western tanks and armored cars. It is time to decide whether to stick with tradition or our modernization drive.
 AFG_purchase_foreign_trucks: "Покупка иностранных грузовиков" # Purchase Foreign Trucks
 AFG_purchase_foreign_trucks_desc: "Хотя в настоящее время у нас нет промышленности для массового производства собственных бронированных грузовиков, мы более чем в состоянии импортировать их из других стран по дешевке." # While we currently lack the industry to produce armored trucks of our own en masse, we are more than able to import them from other nations for cheap.
 AFG_modernize_equipments: "Модернизация оборудования" # Modernize Equipment
 AFG_modernize_equipments_desc: "Снаряжение, которое использует наша армия, так же важно, как и ее солдаты. Обеспечение того, чтобы все оборудование было модернизировано и соответствовало стандартам, важно для обеспечения готовности наших вооруженных сил противостоять любой угрозе." # The equipment our army uses is just as important as its soldiers. Ensuring that all equipment is modernized and up to standard is important in ensuring that our military is ready to handle any threat.
 AFG_invest_artillary: "Инвестируйте в артиллерию" # Invest in Artillery
 AFG_invest_artillary_desc: "За последние несколько десятилетий артиллерия стала важной частью боевых действий. Если мы хотим иметь возможность конкурировать с Западом в военном превосходстве в Центральной Азии, инвестиции в артиллерию являются важным шагом." # Artillery has become a major part of warfare in the last few decades. If we wish to be able to compete with the West in military superiority in Central Asia, investing in artillery is an essential move.
 AFG_doctrine_for_army: "Доктрина для армии" # A Doctrine for the Army
 AFG_doctrine_for_army_desc: "Наша армия должна иметь доктрину, которой ей следует следовать, если мы надеемся на ее успех." # Our army must have a doctrine to follow if we hope for it to succeed.
 AFG_recruitment_efforts: "Усилия по набору персонала" # Recruitment Efforts
 AFG_recruitment_efforts_desc: "Людские ресурсы необходимы для развития такой армии, как наша. Усилия по вербовке населения в целом могут иметь большое значение для увеличения нашей численности над врагами." # Manpower is essential to a developing an army like our own. Efforts to recruit the general population can go a long way in boosting our numbers over our foes.
 AFG_tribal_recruitment: "Племенной набор" # Tribal Recruitment
 AFG_tribal_recruitment_desc: "Вербовка из избранных племен может иметь большое значение как для усмирения сельского сопротивления в нашей стране, так и для пополнения рядов нашей армии." # Recruiting from select tribes can go a long way in both pacifying rural resistance in our nation and filling the ranks of our army.

 AFG_rebuild_air_force: "Восстановить ВВС" # Rebuild the Air Force
 AFG_rebuild_air_force_desc: "В Афганистане никогда не было больших военно-воздушных сил, но их создание, пусть и небольшое, является необходимым шагом в наших усилиях по модернизации." # Afghanistan has never had much of an air force, but building one - however small - is a necessary step in our modernization drives.
 AFG_soviet_air_planes: "Советские самолеты" # Soviet Airplanes
 AFG_soviet_air_planes_desc: "Закупка самолетов у Советского Союза будет иметь большое значение для укрепления наших военно-воздушных сил и обеспечения нашего господства в воздухе над нашими соседями." # Purchasing airplanes from the Soviet Union will go a long way in strenghtening our air force and ensuring our aerial dominance over our neighbors.
 AFG_british_air_planes: "Британские самолеты" # British Airplanes
 AFG_british_air_planes_desc: "Закупка самолетов у Британской империи будет иметь большое значение для укрепления наших военно-воздушных сил и обеспечения нашего господства в воздухе над нашими соседями." # Purchasing airplanes from the British Empire will go a long way in strenghtening our air force and ensuring our aerial dominance over our neighbors.
 AFG_domestic_air_production: "Внутреннее производство воздуха" # Domestic Air Production
 AFG_domestic_air_production_desc: "Создание наших собственных самолетов будет иметь большое значение для укрепления наших военно-воздушных сил и обеспечения нашего господства в воздухе над нашими соседями, не обременяя нас западными державами." # Building our own airplanes will go a long way in strenghtening our air force and ensuring our aerial dominance over our neighbors without endebting us to Western powers.
 AFG_train_afghan_pilots: "Обучайте афганских пилотов" # Train Afghan Pilots
 AFG_train_afghan_pilots_desc: "Чтобы иметь военно-воздушные силы, нам нужны и самолеты, и пилоты. И мы должны обучать наших собственных афганских пилотов, чтобы воплотить эту мечту в реальность." # In order to have an air force, we must have both planes and pilots. And we must train our own Afghan pilots in order to make this dream a reality.

#### National Spirits ####

 AFG_tribal_influences_afghanistan_idea: "Племенное влияние в Афганистане" # Tribal Influence in Afghanistan
 AFG_tribal_influences_afghanistan_idea_desc: "Племена, особенно пуштунские, имеют большое влияние на управление Афганистаном и жизнь людей в стране. Ограничить это будет сложно, поскольку это означало бы свертывание деятельности важного компонента Афганистана." # Tribes, most of all the Pashtun tribes, hold much influence over the governing of Afghanistan and the lives of the people in the country. It will be hard to curtail this, since doing so would be to curtail the operation of an important component of Afghanistan.
 AFG_tribal_influences_afghanistan1_idea: "Племенная лояльность обеспечена" # Tribal Loyalty Secured
 AFG_tribal_influences_afghanistan2_idea: "Племенное влияние ограничено" # Tribal Influence Curbed
 AFG_tribal_influences_afghanistan3_idea: "Ослабление влияния племени" # Weaken Tribal Influence

 AFG_afghan_nationalism_idea: "Афганский национализм" # Afghan Nationalism
 AFG_afghan_nationalism_idea_desc: "Народ Афганистана — гордый народ со своими мечтами и амбициями. Стремление управлять империей, когда-то такой же большой, как Империя Дуррани, а может быть, даже больше, все еще живо." # The people of Afghanistan are a proud people, with their own dreams and ambitions. The ambition to rule an empire once as big as, or maybe bigger than, the Durrani Empire, is still alive.
 AFG_mounting_opposition_king_idea: "Растущая оппозиция королю" # Mounting Opposition to the King
 AFG_mounting_opposition_king_idea_desc: "Король Мохаммед Надир-хан сталкивается с растущим сопротивлением своему правлению со стороны сторонников Амануллы-хана и Хабибуллы Калакани, а также со стороны социалистов и республиканцев, выступающих против монархии." # King Mohammed Nadir Khan is facing mounting opposition to his rule, from supporters of both Amanullah Khan and Habibullāh Kalakāni, as well as from socialists and republicans that oppose the monarchy.
 AFG_king_is_dead_idea: "Состояние хаоса" # A State of Chaos
 AFG_king_is_dead_idea_desc: "«Король мертв!» Король мертв!» можно услышать по всему Афганистану. Эти слова, наряду с внезапным убийством короля Мохаммеда Надир-хана, привели к большой нестабильности и хаосу в стране. Легитимность правительства действительно подвергается сомнению." # 'The King is Dead! The King is Dead!' can be heard across Afghanistan. These words, along with the sudden assassination of King Mohammed Nadir Khan, have brought on much instability and chaos in the country. The legitimacy of the government is truly being questioned.
 AFG_opposition_mohammed_zahir_idea: "Оппозиция Мохаммеду Захир Хану" # Opposition to Mohammed Zahir Khan
 AFG_opposition_mohammed_zahir_idea_desc: "Новый молодой монарх сталкивается с оппозицией как со стороны сторонников Амануллы-хана, так и со стороны сторонников Хабибуллы Калакани. Но если его дяди будут на его стороне, его правление сохранится." # The new, young monarch is facing opposition from both loyalists of Amanullah Khan, as well as loyalists of Habibullāh Kalakāni. But with his uncles on his side, his reign will survive.
 AFG_opposition_revolution_idea: "Оппозиция революции" # Opposition to the Revolution
 AFG_opposition_revolution_idea_desc: "Реакционеры и монархисты находятся в сильной оппозиции республиканской революции. Это то, с чем нам нужно разобраться, чтобы обезопасить наше правление." # Reactionaries and monarchists are in strong opposition against the Republican Revolution. This is something we need to deal with, in order to secure our rule.
 AFG_opposition_amanullah_idea: "Оппозиция Аманулле Хану" # Opposition to Amanullah Khan
 AFG_opposition_amanullah_idea_desc: "Возвращение короля Амануллы-хана было принято не всеми жителями Афганистана. Но, учитывая его прогрессивные реформы, у него есть сторонники наряду с оппозицией." # The return of King Amanullah Khan has not been accepted by all people in Afghanistan. But with the memory of his progressive reforms, he has supporters alongside the opposition.
 AFG_opposition_kalakani_idea: "Оппозиция Хабибулле Калакани" # Opposition to Habibullāh Kalakāni
 AFG_opposition_kalakani_idea_desc: "Будучи одновременно таджиком и бандитом, Хабибулла Калакани встречает сильное сопротивление. Хотя он может нравиться некоторым консерваторам, пуштуны, которые добиваются правления пуштунов или правительства республиканцев, не очень его любят." # As both a Tajik and a Bandit, Habibullāh Kalakāni is met with much opposition. While some conservatives might like him, he is not so liked by the Pashtuns that seek Pashtun rule or government by the Republicans.
 AFG_opposition_recovering1_idea: "Оставшаяся оппозиция" # Remaining Opposition
 AFG_opposition_recovering2_idea: "Оставшаяся оппозиция" # Remaining Opposition

 AFG_backward_army_and_economy_idea: "Отсталая армия и экономика" # Backward Army and Economy
 AFG_backward_army_and_economy_idea_desc: "И Вооруженные Силы, и Экономика страдают от примитивных структур, стратегий и доктрин. Даже при консервативном правлении мы не можем быть полностью свободными от полезных реформ." # Both the Armed Forces and the Economy suffers from its primitive structures, strategies and doctrines. Even under conservative rule, we can not be completely free from useful reforms.
