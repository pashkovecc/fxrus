#### Events ####

 afghan.0.t: "Королевство Афганистан" # The Kingdom of Afghanistan
 afghan.0.d: "История Афганистана насчитывает много тысячелетий, начиная с исламских и монгольских завоеваний, династии Хотак и империи Дуррани. В начале 20-го века страна управлялась как эмират под руководством эмира Хабибуллы-хана, которому удалось выжить, хотя бы в некоторой степени независимым от Британской и Российской империй.\n\nЭмир был убит во время Великой войны, а его сын Аманулла-хан стал эмиром. Продолжая прогрессивные реформы своего отца, Аманулла также ввёл Афганистан в войну с британцами. Война в конечном итоге закончилась статус-кво. Модернизируя страну, Аманулла также увидит потерю популярности. Восстание таджика Хабибуллы Калакани положило конец правлению Амануллы.\n\nВ 1929 году новым королем Афганистана стал Мохаммед Надир-хан. Его правление положило конец некоторым реформам Амануллы, сохранив при этом некоторое подобие конституционализма. Но популярность короля падает, а поддержка Амануллы Хана или Хабибуллы Калакани все еще присутствует. Новые идеи республиканизма и социализма также начали проникать в Афганистан." # The history of Afghanistan goes back many thousands of years, with both the Islamic and the Mongol conquests, the dynasty of the Hotak, and the Durrani Empire. At the start of the 20th century, the country was ruled as an emirate under emir Habibullah Khan, that managed to survive as, at least somewhat, independent from the British and Russian empires.\n\nThe emir was assassinated during the Great War, with his son, Amanullah Khan, becoming emir. While continuing the progressive reforms of his father, Amanullah also took Afghanistan to war with the British. The war would eventually end in a status quo. While modernizing the country, Amanullah would also see a loss in popularity. The tajik Habibullāh Kalakāni's uprising would be the end of Amanullah's reign.\n\nIn 1929, Mohammed Nadir Khan became the new king of Afghanistan. His reign would see the end of some of Amanullah's reforms, while still keeping some semblance of constitutionalism. But the popularity of the king has been faltering, and support for Amanullah Khan or Habibullāh Kalakāni is still present. New ideas of Republicanism and Socialism have also begun to sneak into Afghanistan.
 afghan.0.a: "Меньше разговоров, больше действий" # Less Talk, More Action

 afghan.1.t: "Индия в восстании" # India in Rebellion
 afghan.1.d: "Наши соседи, жители Индийского субконтинента, открыто восстают против Британской империи. Этот бунт, учитывая его масштабы, может выявить трещины в британской гегемонии. Возможно, пришло время нанести удар и вернуть то, что империя Дуррани потеряла в 19 веке. Но есть также некоторые советники, которые предостерегают от таких агрессивных действий. Они утверждают, что британцы могут нанести ответный удар и победить нас. Какой должна быть наша позиция, зависит от короля и его правительства." # Our neighbours, the people of the Indian subcontinent, are in open revolt against the British Empire. This revolt, with its magnitude, is one that can reveal the cracks in British hegemony. This might be the time to strike and take back what the Durrani Empire lost in the 19th century. But there are also some advisors that give warnings against making such an aggressive move. They argue that the British can strike back and defeat us. It is up to the king and his government what our stance should be.
 afghan.1.a: "Лучшее время для вмешательства!" # Prime Time for Intervention!
 afghan.1.b: "Нет, это просто спровоцирует еще больший конфликт" # No, It Will Just Trigger a Bigger Conflict

 afghan.2.t: "Афганистан захватывает северо-западную границу" # Afghanistan Siezes the North-West Frontier
 afghan.2.d: "Афганская армия воспользовалась возможностью извлечь выгоду из конфликта, бушующего сейчас в Индии. Их армия уже вошла в Северо-Западную пограничную провинцию вместе с другими территориями в этом районе. Хотя агрессию нельзя терпеть, сейчас мы не в состоянии дать ей отпор." # The Afghan army has siezed the opportunity to make gains from the conflict now raging in India. Their army has now marched into the North-West Frontier Province, along with other territories in the area. While the aggression should not be tolerated, it is not in our position right now to fight them back.
 afghan.2.a: "В конце концов они пожалеют об этом" # They Will Eventually Regret It
 afghan.2.b: "Это означает войну!" # This Means War!

 afghan.3.t: "Афганистан захватывает северо-западную границу" # Afghanistan Siezes the North-West Frontier
 afghan.3.d: "Афганская армия воспользовалась возможностью извлечь выгоду из конфликта, бушующего сейчас в Индии. Их армия уже вошла в Северо-Западную пограничную провинцию вместе с другими территориями в этом районе. Эту агрессию нельзя терпеть. Мы можем либо взять на себя инициативу и начать атаку, либо проконсультироваться с Лондоном о том, что нам следует делать." # The Afghan army has siezed the opportunity to make gains from the conflict now raging in India. Their army has now marched into the North-West Frontier Province, along with other territories in the area. This aggression can not be tolerated. We can either take the initiative to launch an attack, or consult with London on what we should do.
 afghan.3.a: "Возглавьте атаку!" # Lead an Attack!
 afghan.3.b: "Лучше всего слышать из Лондона.." # Best to Hear From London..

 afghan.4.t: "Афганская агрессия" # Afghan Aggression
 afghan.4.d: "Новости из наших владений в Индии сообщили нам, что афганская армия захватила Северо-Западную границу. Эта новость вызывает беспокойство, и наши колониальные друзья спрашивают нас, что Империя намерена с этим делать." # News from our possessions in India have told us that the Afghan army has siezed the North-West Frontier. This news is a disturbance, and our colonial friends are asking us what the Empire intends to do with this.
 afghan.4.a: "Как и индийские повстанцы, Афганистан будет разгромлен!" # Like the Indian Rebels, Afghanistan Will be Crushed!
 afghan.4.b: "Мы разберемся с ними позже" # We Will Deal With Them Later

 afghan.5.t: "Афганистан отталкивает нас от Кветты" # Afghanistan Repells Us From Quetta
 afghan.5.d: "Наша армия была отбита от Кветты и не сумела вернуть себе Северо-Западную границу. Наши советники утверждают, что нам следует заключить мир с афганцами и нанести по ним удар позднее." # Our army have been repelled from Quetta and have not managed to take back the North-West Frontier. Our advisors argue that we should make peace with the Afghans and strike at them at a later date.
 afghan.5.a: "Да, давай помиримся" # Yeah, Let's Get Some Peace
 afghan.5.b: "Нет! Война продолжается!" # No! The War Continues!

 afghan.6.t: "Британцы хотят мира" # The British Want Peace
 afghan.6.d: "Нам удалось усадить британцев за стол переговоров. Они позволили нам захватить их северо-западную границу, одновременно захватив Кветту. Конечно, это великая победа!" # We have managed to get the British to the negotiation table. They have let us take their North-West Frontier, while also aquiring Quetta. Certainly, this is a great victory!
 afghan.6.a: "Да здравствует Афганистан!" # Long Live Afghanistan!

 afghan.7.t: "Конфликт между Британской Индией и Афганистаном" # Conflict Between British India and Afghanistan
 afghan.7.d: "Поскольку индийское восстание уже опустошило регион, в Индии возник новый конфликт. На этот раз афганцы пытаются отобрать земли у Раджа. Наши колониальные друзья в Индии уже объявили войну, что не оставляет нам иного выбора, кроме как присоединиться к ней." # With the Indian rebellion already ravaging the region, a new conflict has arisen in India. This time, it is the Afghans attempting to sieze land from the Raj. Our colonial friends in India have already decleared war, which leaves us little choice but to join in.
 afghan.7.a: "В следующий раз вы спросите нас, Индия" # Next Time, You Ask Us, India

 afghan.8.t: "Афганцы были отброшены назад" # The Afghans Have Been Pushed Back
 afghan.8.d: "Британская империя одержала победу в войне против афганцев. Поскольку королевство красных терпит поражение на Северо-Западном фронтире, пришло время послать им наш ультиматум." # The British Empire has been victorious in its war against the Afghans. With the rouge kingdom being defeated in the North-West Frontier, it is time to send them our ultimatum.
 afghan.8.a: "Отправьте им мирное предложение!" # Send Them the Peace Offer!
 afghan.8.b: "Нет, мы должны их раздавить!" # No, We Must Crush Them!

 afghan.9.t: "Мирное предложение от Британии" # Peace Offer From the British
 afghan.9.d: "Мы получили телеграмму от британского руководства, предлагающую нам мир. Поскольку наше королевство теряет свои недавние завоевания в этом конфликте, возможно, было бы разумно принять мир, чтобы не терять больше земель." # We have recieved a telegram from the British leadership, offering us peace. With our kingdom loosing our recent conquest in this conflict, it might be smart to accept the peace so as not to lose any more land.
 afghan.9.a: "Мы должны это принять" # We Have to Accept It
 afghan.9.b: "Это Победа или Смерть! Никакой золотой середины!" # It's Victory or Death! No Middle Ground!

 afghan.10.t: "Убийство Мухаммада Надир-хана" # The Assassination of Muhammad Nadir Khan
 afghan.10.d: "Мухаммад Надир Хан, король Афганистана, был застрелен сегодня во время посещения новой школы в Газни. Убийца был идентифицирован как ученик хазарейской школы. Это событие потрясло всю страну, лоялисты были готовы отомстить за павшего монарха. Некоторые могут рассматривать ситуацию как конец династии. Другие считают, что сейчас самое время действовать против социалистов, республиканцев, хазарейцев и претендентов на трон." # Muhammad Nadir Khan, the king of Afghanistan has today been shot dead while visiting a new school in Ghazni. The assassin has been identified as a Hazara student of the school. This event has shocked the whole country, with loyalists ready to avenge the fallen monarch. Some might see the situation as the end of the dynasty. Others sees it as the time to act against Socialists, Republicans, Hazaras, and contenders for the throne.
 afghan.10.a: "Король умер..." # The King is Dead...

 afghan.11.t: "Уик Залмиан мобилизуется" # Weekh Zalmian Mobilizes
 afghan.11.d: "В условиях нестабильности, вызванной смертью короля, прореформистская полусоциалистическая группа «Вик Залмиан» начала мобилизацию. Они выступают против монархии, рассматривая ее как консервативный институт, выступающий против реформ, и как репрессивную силу над рабочими и народом. Хотя они говорят, что хотят демократической республики, группа также находится под сильным влиянием Советского Союза. Эти связи могут сделать их опасными для Афганского королевства." # With the instability caused by the death of the king, the pro-reformist, semi-socialist group Weekh Zalmian has begun to mobilize. They are opposed to the monarchy, seeing it as a conservative institution opposed to reforms, and as an oppressive force over the workers and the people. While they say that they want a democratic republic, the group is also quite influenced by the Soviet Union. These ties might make them dangerous to the Afghan Kingdom.
 afghan.11.a: "Действительно опасно" # Dangerous Indeed

 afghan.12.t: "Хабибулла Калакани на севере" # Habibullāh Kalakāni Seen in the North
 afghan.12.d: "Сообщается, что предателя Хабибуллу Калакани видели в северных частях Афганистана. Похоже, ему удалось вернуться из ссылки после убийства короля. Одно только его присутствие сумело повысить его популярность, и он приобрел значительное количество последователей. Похоже, им удалось организоваться в прокалаканскую группу под названием «Саккависты». Консервативному посланию Калакани удалось получить поддержку многих, кто опасается того, как Афганистан может развиваться в будущем." # The traitorous Habibullāh Kalakāni is now reported to have been seen in the northern parts of Afghanistan. He seems to have managed to return from exile, following the assassination of the king. His presence alone has managed to grow his popularity, and he has gained a substantial number of followers. It seems like they have managed to organize into a pro-Kalakāni group called the Saqqawists. The conservative message of Kalakāni has managed to get support from many that are afraid of the way Afghanistan might develop itself in the future.
 afghan.12.a: "Возвращение таджика" # The Return of the Tajik

 afghan.13.t: "Аманулла Хан заручился поддержкой" # Amanullah Khan Gains Support
 afghan.13.d: "Бывший король Аманулла Хан до сих пор пользуется большим уважением и имеет собственных последователей в Афганистане. С убийством, возможно, единственного препятствия на пути к возвращению Амануллы, его популярность, естественно, снова возросла. Ходят даже слухи о его сторонниках при королевском дворе. Ходят слухи, что есть желающие свергнуть Мусахибанов в пользу Амануллы-хана." # Former king Amanullah Khan is still highly respected, with a following of his own, in Afghanistan. With the assassination of, what might be, the sole obstacle to Amanullah making a comeback, his popularity has naturally seen a new rise. There are even rumors of some supporters of his within the royal court. Rumors that there are some who want to overthrow the Musahibans, in favor of Amanullah Khan.
 afghan.13.a: "Лучше остерегайтесь" # Better Watch Out

 afghan.14.t: "Казнь хазарейцев" # Execution of the Hazara
 afghan.14.d: "Сегодня состоялась казнь хазарейского студента, убившего короля, а также многих его друзей и семью. Поскольку устранение этих людей уже завершено, многие в суде все еще жаждут дальнейшей мести. Видные офицеры, судя по всему, придерживающиеся пуштунских националистических взглядов, стремились обратить наш гнев на хазарейское население Афганистана. Хотя многие выступают против этого, это может привести к устранению потенциальных врагов государства." # Today, the execution of the Hazara student that assassinated the king, along with many of his friends and family, has taken place. With the removal of these people now complete, there are still many in the court with a taste for further revenge. Prominent officers, seemingly with a Pashtun nationalist outlook, have been eager to turn our wrath against the Hazara population of Afghanistan. While there are many arguing against it, doing so may take out potential enemies to the state in the process.
 afghan.14.a: "Смертей уже было достаточно!" # There Have Been Enough Deaths Already!
 afghan.14.b: "Нам нужно искоренить эту угрозу!" # We Need to Eradicate This Threat!

 afghan.15.t: "Коронация Мухаммеда Захир-хана" # The Coronation of Mohammed Zahir Khan
 afghan.15.d: "Мир установился после убийства короля Мохаммеда Надир-хана, и наконец пришло время короновать его наследника и преемника Мохаммеда Захира. Пока молодому королю всего 22 года, при поддержке его дядей его правление будет закреплено. Надежда на процветающую страну присутствует. Тем не менее, существует некоторая оппозиция королю, но с этим легко справиться." # With peace settling down after the assassination of king Mohammed Nadir Khan, it is finally time to crown his heir and successor, Mohammed Zahir. While the young king is only 22 years old, with the support of his uncles, his reign will be secured. A hope for a prosperous country is present. Still, there is some opposition to the king, but this will be easily taken care of.
 afghan.15.a: "...Да здравствует король!" # ...Long Live the King!

 afghan.16.t: "Новый король хочет совершить турне по Афганистану" # The New King Seeks a Tour of Afghanistan
 afghan.16.d: "Король Мохаммед Захир Хан проявил интерес к поездке по стране, чтобы увидеть, чем он правит. Хотя это является возможностью для поднятия морального духа, в некоторых сообщениях говорится, что это опасно, поскольку сторонники Амануллы Хана и Хабибуллы Калакани все еще скрываются. Республиканцы также могут представлять угрозу для нового короля." # King Mohammed Zahir Khan has showed interest in touring the country, to see what he is ruling over. While this is a possibility for a morale boost, some reports have said it is dangerous with supporters for both Amanullah Khan and Habibullāh Kalakāni still in hiding. Republicans might also pose a threat to the new king.
 afghan.16.a: "Гастроли можно провести позже" # Touring Can be Done Later
 afghan.16.b: "Афганистану нужно увидеть своего короля" # Afghanistan Needs to See Their King

 afghan.17.t: "Смерть нового короля" # The Death of the New King
 afghan.17.d: "Это ужасно! Король Мохаммед Захир Хан и его компания подверглись нападению во время его поездки по стране. Сообщается, что нападавшими были либо республиканцы, либо сторонники Калакани. Независимо от того, кто несет ответственность, в отчете говорится, что король был застрелен, а большая часть его отряда перебита или рассеяна. Это сделало ситуацию слишком нестабильной и может означать конец Королевства, как оно известно." # It is terrible! King Mohammed Zahir Khan and his company was attacked on his tour of the country. It is said that the attackers were either Republicans or Kalakāni loyalists. Regardless of who was responsible, the report says that the king was shot dead, while most of his company was slaughtered or scattered. This has made the situation too unstable, and it might mean the end of the Kingdom as it is known.
 afghan.17.a: "Этого не может быть!" # This Can't Be!

 afghan.18.t: "Народ штурмует дворец" # The People Storm the Palace
 afghan.18.d: "Подпитываемые смертью короля Мохаммеда Надира и короля Мохаммеда Захира, жители Кабула сейчас штурмуют дворец. Были замечены подразделения афганской армии, дезертировавшие на сторону восстания или бегущие из столицы. Возможно, это конец Королевства. Но есть еще один способ выжить. Военные призвали оставшихся правительственных чиновников связаться с сторонниками Амануллы Хана. Но это также будет означать конец власти Мусахибанов." # Fueled by both the death of King Mohammed Nadir and King Mohammed Zahir, the people of Kabul are now storming the palace. Units from the Afghan Army have been seen deserting to the revolt, or fleeing from the capital. This might be the end for the Kingdom. But there is still one way for it to survive. Military officers have urged the remaining Government officials to contact Amanullah Khan's loyalists. But this will also mean the end of the Musahibans' hold on power.
 afghan.18.a: "Лев побежден овцой!" # The Lion is Defeated by the Sheep!
 afghan.18.b: "Свяжитесь с лоялистами Амануллы!" # Contact Amanullah's Loyalists!

 afghan.19.t: "Революция удалась!" # The Revolution Succeeds!
 afghan.19.d: "Народ Афганистана победоносно разгромил реакционную монархию, освободив рабочих и народ от деспотического правления старых королей. Поскольку монархисты либо заключены в тюрьму, либо убиты, либо бегут от наших наступающих сил, революция наконец обеспечена. Да здравствует революция!" # The people of Afghanistan have victoriously defeated the reactionary monarchy, freeing the workers and the people from the oppressive rule of the old kings. With the monarchists either imprisoned, killed, or fleeing from our advancing forces, the Revolution is secured at last. Long Live the Revolution!
 afghan.19.a: "Да здравствует Афганистан!" # Long Live Afghanistan!

 afghan.20.t: "Лоялисты Амануллы захватывают Кабул" # Amanullah Loyalists Seize Kabul
 afghan.20.d: "Благодаря тому, что оставшиеся сторонники мертвого короля объединились с сторонниками Амануллы-хана, революция была подавлена. Хотя это потеря для Мусахибанов, королевство все еще стоит. После этого король Аманулла Хан согласился вернуться в Афганистан из ссылки, чтобы стать королем. Это действительно будет началом новой эры." # With remaining loyalists to the dead king united with the loyalists of Amanullah Khan, the Revolution has been put down. While this is a loss for the Musahibans, the kingdom is still standing. Following this, King Amanullah Khan has agreed to return to Afghanistan from exile to be crowned king. This will be the start of a new era, indeed.
 afghan.20.a: "...Да здравствует король!" # ...Long Live the King!

 afghan.21.t: "Восстание Калакани на севере" # Kalakāni's Uprising in the North
 afghan.21.d: "Таджикский бандит Хабибулла Калакани ополчился против Республики, видя в нас угрозу исламу и традициям Афганистана! Ему удалось заручиться поддержкой среди таджикского населения и даже среди некоторых пуштунских племен, все еще существующих за пределами Кабула. Вскоре нам предстоит искоренить эту угрозу." # The tajik bandit Habibullāh Kalakāni has taken up arms against the Republic, seeing us as a threat to Islam and the traditions of Afghanistan! He has managed to gain support among the Tajik population, and even among some of the Pashtun tribes still existing outside of Kabul. It will soon be up to us to eradicate this threat.
 afghan.21.a: "Революцию невозможно остановить!" # The Revolution Can Not be Stopped!

 afghan.22.t: "Наступление на саккавистов" # Advancing on the Saqqawists
 afghan.22.d: "Мы продумали возможные пути победы над таджикским бандитом и его сторонниками в бою. Многие из наших офицеров предлагают быстрое наступление на север, быстро и решительно подавив восстание. Но есть также много офицеров, которые по-прежнему настроены скептически, утверждая, что контролируемое наступление лучше. От нас зависит, какие планы мы будем реализовывать." # We have planned out possible ways to defeat the tajik bandit and his supporters in battle. Many of our officers suggest a fast advance into the north, crushing the uprising quickly and decisively. But there are also many officers that remain skeptical, saying that a controlled advance is better. It is up to us what plans we will execute.
 afghan.22.a: "Контролируемое продвижение!" # A Controlled Advance!
 afghan.22.b: "Прогресс в освещении!" # A Lighting Advance!

 afghan.23.t: "Победа при Баглане" # Victory at Baghlan
 afghan.23.d: "Благодаря контролируемому продвижению на север мы смогли сохранить наши силы организованными и хорошо снабженными. У города Баглан наши силы встретились с силами Хабибуллы Калакани и других антиреспубликанских сил. Хотя они были относительно организованы и укоренились, их численность была не такой высокой, как наша. С помощью современного российского оружия мы смогли разгромить их и взять Калакани в плен." # With a controlled advance into the North, we have been able to keep our forces organized and well supplied. At the town of Baghlan, our forces met the forces of Habibullāh Kalakāni and other anti-republican forces. While they were relatively organized and entrenched, their numbers was not as high as ours. With modern Russian weapons, we were able to crush them and take Kalakāni captive.
 afghan.23.a: "Настоящая победа революции!" # A True Victory for the Revolution!

 afghan.24.t: "Засада в Талукане" # The Ambush at Taloqan
 afghan.24.d: "Наши войска быстро продвинулись на север. Поначалу казалось, что это будет успешная кампания. Но когда наши силы достигли города Талокан, они попали в засаду Хабибуллы Калакани и других антиреспубликанских сил. Это тяжелая потеря: из кампании вернулись немногие солдаты. Это может даже означать конец революции." # Our forces have taken a fast advance into the North. At first, it looked like it would be a successful campaign. But when our forces reached the town of Taloqan, they were cut off and ambushed by Habibullāh Kalakāni and other anti-republican forces. This is a heavy loss, with few soldiers returning from the campaign. This might even mean the end of the Revolution.
 afghan.24.a: "Какой идиот предложил этот план!" # What Idiot Suggested That Plan!

 afghan.25.t: "Антиреспубликанские силы достигли Кабула" # The Anti-Republican Forces Reach Kabul
 afghan.25.d: "Хабибулле Калакани и другим антиреспубликанским силам удалось добраться до столицы Кабула. Поскольку ресурсов осталось мало, это может стать концом революции. По крайней мере, мы отдадим им все, что у нас есть." # Habibullāh Kalakāni and other anti-republican forces have managed to reach the capital city of Kabul. With little resources left, this might be the end of the Revolution. At least we will give them everything we have.
 afghan.25.a: "За революцию!" # For the Revolution!

 afghan.26.t: "Взятие Кабула" # The Capture of Kabul
 afghan.26.d: "Революция подавлена. Это великая победа Королевства Афганистан. Но с падением республиканцев старые союзники стали новыми врагами. Сторонники Хабибуллы Калакани и сторонники старой монархии сейчас участвуют в игре, чтобы увидеть, кто сможет обеспечить власть и вытеснить другую фракцию." # The Revolution has been put down. This is a great victory for the Kingdom of Afghanistan. But with the fall of the Republicans, old allies have become new enemies. Supporters of Habibullāh Kalakāni and supporters of the old monarchy are now in a game to see who can secure power and oust the other faction.
 afghan.26.a: "Пуштуны обеспечивают власть Аманулле" # The Pashtuns Secure Power for Amanullah
 afghan.26.b: "Таджики обеспечили Калакани властью" # The Tajiks Secure Power for Kalakāni

 afghan.27.t: "Казнь Калакани" # The Execution of Kalakāni
 afghan.27.d: "Теперь, когда Калакани стал нашим пленником, у нас наконец-то появилась возможность пристрелить этого врага революции раз и навсегда. Это также будет противостоянием отсталому бандитизму старого порядка, подобному тому, который представляет Хабибулла Калакани. Его смерть будет означать конец его движения и восстания, которое он возглавил." # With Kalakāni as our captive, we finally have the opportunity to shoot this enemy of the Revolution once and for all. This will also be a stand against the backward banditry of the old order, such as those that Habibullāh Kalakāni represents. His death will mean the end for his movement and the uprising he has led.
 afghan.27.a: "Огонь!" # Fire!

 afghan.28.t: "Советский вопрос" # The Soviet Question
 afghan.28.d: "Поскольку внутренние проблемы решены, пришло, наконец, время взглянуть на то, чего должна достичь эта революция. Модернизация, прогрессивные реформы и социальное обеспечение — это все, чего хочет большинство в Weekh Zalmian, но есть и другие вещи, по которым есть противоположные голоса.\n\nВопрос о нашей позиции, когда дело касается Советского Союза и социализма, разделил многих участников движения. Нур Мухаммад Тараки, один из самых влиятельных лидеров движения, привел веские аргументы в пользу советской ориентации и социализма. Гуль Пача Ульфат, влиятельный автор движения, выступил против советской ориентации. Ясно, что этот вопрос решит будущее Революции." # With internal troubles taken care off, it is finally time to set sight on what this Revolution is supposed to accomplish. Modernization, progressive reforms, and social welfare are all things that most in the Weekh Zalmian want, but there are other things where there are opposing voices.\n\nThe question about our stance when it comes to the Soviet Union and Socialism have many in the movement split. Nur Muhammad Taraki, one of the most powerful leaders of the movement, has made a strong case for Soviet alignment and Socialism. Gul Pacha Ulfat, an influencial author in the movement, has made a case against Soviet alignment. It is clear that this question will decide the future of the Revolution.
 afghan.28.a: "Советы — наши революционные друзья!" # The Soviets are our Revolutionary Friends!
 afghan.28.b: "Советы так же опасны для демократии, как и монархия!" # The Soviets are as Dangerous to Democracy as the Monarchy!

 afghan.29.t: "Социалистическая революция" # A Socialist Revolution
 afghan.29.d: "Газета Weekh Zalmian сегодня объявила революцию социалистической. Кроме того, это движение значительно приблизило Афганистан к Советскому Союзу. При этом Нур Мухаммад Тараки был объявлен генеральным секретарем «Викх Залмиан», что фактически сделало его лидером Афганистана." # The Weekh Zalmian has today declared the Revolution a socialist one. In addition, the movement has also aligned Afghanistan much closer to the Soviet Union. With this, Nur Muhammad Taraki has been declared the General Secretary of the Weekh Zalmian, effectivly making him the leader of Afghanistan.
 afghan.29.a: "Да здравствует революция!" # Long Live the Revolution!

 afghan.30.t: "Демократическая революция" # A Democratic Revolution
 afghan.30.d: "Газета Weekh Zalmian сегодня объявила революцию демократической. Кроме того, движение также осудило Советский Союз за продолжающееся однопартийное правление. При этом Гюль Паша Ульфат был объявлен первым президентом Афганской Республики, что сделало его новым лидером «Недели Залмиан»." # The Weekh Zalmian has today declared the Revolution a democratic one. In addition, the movement has also denounced the Soviet Union for their continuous one-party rule. With this, Gul Pacha Ulfat has been declared the First President of the Afghan Republic, making him the new leader of the Weekh Zalmian.
 afghan.30.a: "Да здравствует Афганская Республика!" # Long Live the Afghan Republic!

 afghan.31.t: "Восстания в Хазараджате" # Uprisings in Hazarajat
 afghan.31.d: "Наша кампания по прекращению угрозы, которую представляют хазарейцы, была непростой. Хазарейские племена ополчились против нас и начали то, что они называют «насильственным умиротворением своих общин». Даже если мы станем более консервативными в нашей деятельности, похоже, что восстание не утихнет." # Our campaign to end the threat that the Hazaras pose has not been easy. Hazara tribes have taken up arms against us and what they call a 'violent pacification of their communities'. Even if we become more conservative in our operations, it seems like the uprising will not die down.
 afghan.31.a: "Ох блин.." # Oh Crap..

 afghan.32.t: "Таджики на Севере стекаются в Калакани" # Tajiks in the North Flock to Kalakāni
 afghan.32.d: "В связи с восстанием среди хазарейских племен в Хазараджате слухи о том, что правительство будет проводить насильственное умиротворение таджиков, заставили некоторых таджиков в Северном Афганистане восстать против нас. Они стекаются к таджикскому бандиту Хабибулле Калакани, видя в нем лучший вариант, чем наше собственное правительство." # With an uprising taking place among the Hazara tribes in Hazarajat, the rumor that the government will pursue violent pacification of the Tajiks has made some Tajiks in Northern Afghanistan turn against us. They are flocking to the tajik bandit Habibullāh Kalakāni, seeing him as a better option than our own government.
 afghan.32.a: "Это не хорошо" # This is Not Good

 afghan.33.t: "Беспорядки в Кабуле" # Riots in Kabul
 afghan.33.d: "В Кабуле и его окрестностях вспыхнули беспорядки среди населения. Хотя многие из более богатых районов Кабула поддерживают наши кампании против хазарейцев, есть и те, кому наши действия неприятны. Пока бунтовщики стоят перед Королевским дворцом, некоторые командиры призывают нас отдать приказ стрелять. Но есть среди них и те, кто не поощряет столь крайние меры." # Riots have broken out among the population in and around Kabul. While many of the richer areas of Kabul are supportive of our campaigns against the Hazaras, there are those that are disgusted by our actions. With the rioters standing in front of the Royal Palace, some commanders urge us to give the order to fire. But there are also those among them that discourage so extreme an action.
 afghan.33.a: "Просто обеспечьте мир" # Just Secure the Peace
 afghan.33.b: "Огонь!" # Fire!

 afghan.34.t: "Конец беспорядкам" # The Riots End
 afghan.34.d: "Беспорядки в Кабуле, похоже, утихают. Поскольку правительство уже пресекло попытки искоренения хазарейских общин, многие участники беспорядков чувствуют себя довольными. Похоже, нам также удалось сохранить мир на Севере, вытеснив Калакани либо в подполье, либо из Афганистана. Мы действительно не знаем. Кажется, пришло время передать трон." # The riots in Kabul seem to be withering away. With the government already halting attempted eradications of Hazara communities, many rioters are finding themselves content. It also looks like we have been able to keep the peace in the North, pushing Kalakāni either underground or out of Afghanistan. We don't really know. It seems like it might be the time to pass the throne on.
 afghan.34.a: "По крайней мере, хорошие новости" # Good News at Least

 afghan.35.t: "Солдаты нападают на своих начальников" # The Soldiers Turn on Their Superiors
 afghan.35.d: "Наш приказ открыть огонь по бунтовщикам не был встречен нашими солдатами с радостью. Им было довольно тревожно, поскольку многие из них отказывались лишать жизни людей, с которыми они могли быть связаны. После того, как приказ был отдан в третий или четвертый раз, некоторые открыли огонь, а большинство направило оружие против своего начальства. Через некоторое время солдаты либо бежали, либо обратились против нашего правительства." # Our order to fire at the rioters was not happily recieved by our soldiers. They was rather uneasy, with many of them refusing to take the lives of people that they might even be related to. After the order was given a third or fourth time, some fired, while most of them turned their weapons against their superiors. After some time, the soldiers had either fled or turned against our government.
 afghan.35.a: "Эти предатели!" # Those Traitors!

 afghan.36.d: "Подпитываемые смертью короля Мохаммеда Надира и нашими попытками искоренить хазарейские общины, жители Кабула сейчас штурмуют дворец. Подразделения афганской армии, в свою очередь, перешли на сторону восстания или бежали из столицы. Возможно, это конец Королевства. Но есть еще один способ выжить. Военные призвали оставшихся правительственных чиновников связаться с сторонниками Амануллы Хана. Но это также будет означать, что Мохаммед Захир не получит шанса стать королем." # Fueled by the death of King Mohammed Nadir and our attempted eradication of Hazara communities, the people of Kabul are now storming the palace. Units from the Afghan Army have in turn deserted to the revolt, or fled from the capital. This might be the end for the Kingdom. But there is still one way for it to survive. Military officers have urged the remaining Government officials to contact Amanullah Khan's loyalists. But this will also mean that Mohammed Zahir will not get the chance to be king.
 afghan.36.a: "Лев побежден овцой!" # The Lion is Defeated by the Sheep!
 afghan.36.b: "Свяжитесь с лоялистами Амануллы!" # Contact Amanullah's Loyalists!

 afghan.37.t: "Состояние Королевства" # The State of the Kingdom
 afghan.37.d: "Мохаммед Захир Хан, новый король Афганистана, сумел обеспечить свое правление. Поскольку на данный момент оппозиция умиротворена, король и его министры обращают внимание на внутренние проблемы Афганистана, чтобы улучшить его. Некоторые министры предложили план модернизации и реформирования Королевства, наращивания его инфраструктуры и промышленного потенциала. Однако это оспаривается более консервативными министрами. Консерваторы утверждают, что Афганистану следует придерживаться политики предыдущего короля Мохаммеда Надир-хана." # Mohammed Zahir Khan, the new King of Afghanistan, has managed to secure his reign. With opposition pacified for now, the King and his ministers are looking inward in order to improve the state of Afghanistan. Some ministers have proposed a plan to modernize and reform the Kingdom, building up its infrastructure and industrial potential. This is, however, challenged by the more conservative ministers. The conservatives argue that Afghanistan should keep to the policies of the previous king, Mohammed Nadir Khan.
 afghan.37.a: "Афганистан нуждается в модернизации!" # Afghanistan Needs to Modernize!
 afghan.37.b: "Давайте придерживаться традиций!" # Let's Stick to Tradition!

 afghan.38.t: "Реформы Амануллы" # Amanullah's Reforms
 afghan.38.d: "Аманулла Хан, новый король Афганистана, теперь контролирует страну. Поскольку на данный момент оппозиция умиротворена, Аманулла начал смотреть в себя. Вместе со своими верными последователями и министрами он объявил о радикальных реформах в Королевстве Афганистан. Наряду с обещанием большего количества прав и свобод Аманулла также пообещал модернизацию инфраструктуры и промышленности страны." # Amanullah Khan, the new King of Afghanistan, now holds control over the country. With opposition pacified for now, Amanullah has begun to look inward. Together with his loyal followers and ministers, he has announced sweeping reforms in the Kingdom of Afghanistan. Along with the promise of more rights and freedoms, Amanullah has also promised a modernization of the country's infrastructure and industry.
 afghan.38.a: "Вперед за прогрессом!" # Forward For Progress!

 afghan.39.t: "Революция продолжается" # The Revolution Continues
 afghan.39.d: "Когда с врагами республиканской революции покончено, пришло, наконец, время заглянуть внутрь себя. Страна Афганистан на протяжении всей своей истории была отсталым государством, сдерживаемым старыми королями и их министрами. Но теперь, будучи республикой, Афганистану необходимо модернизироваться и стать частью 20-го века. Это будут одни из последних шагов нашей революции, которые, наконец, избавят нас от реакционного общества." # With the enemies of the Republican Revolution taken care of, it is finally time for us to look inward. The country of Afghanistan has through its history been a backward state, held back by the old Kings and their ministers. But now, as a Republic, Afghanistan needs to modernize and become a part of the 20th century. This will be some of the final steps in our Revolution, and will finally free us from a reactionary society.
 afghan.39.a: "Да здравствует революция!" # Long Live the Revolution!

 afghan.40.t: "Увертюра к традиции" # An Overture For Tradition
 afghan.40.d: "Новое правление короля Хабибуллы Калакани наконец-то стало безопасным от врагов государства. Когда государство обеспечено, пришло время Афганистану двигаться вперед, но не в направлении порочной модернизации, а в направлении традиций и сельского хозяйства. Это идеально соответствует цели Калакани – защитить ислам, защитить Афганистан и, в свою очередь, защитить свою собственную власть." # The new reign of King Habibullāh Kalakāni is finally safe from the enemies of the state. With the state secured, it is time for Afghanistan to move forward, not in the direction of wicked modernization, but towards tradition and agriculture. This lies perfectly with Kalakāni's goal to Defend Islam, Defend Afghanistan and, in return, Defend his own power.
 afghan.40.a: "Афганистан останется верным!" # Afghanistan Will Stay True!

## Focus Events ##

 afghan.100.t: "Судьба конституционной монархии" # The Fate of the Constitutional Monarchy
 afghan.100.d: "На бумаге Афганистан является конституционной монархией. Даже если король и его правительство обладают большей властью, чем Лойя джирга, они все равно несколько ограничены в своих возможностях. Некоторые правительственные чиновники утверждают, что Лойя Джирга должна вернуться к своей старой роли; собрание созывалось только тогда, когда король нуждался в его присутствии. Но учитывая уже достигнутые успехи, было бы трудно сделать это без сопротивления." # Afghanistan is, on paper, a constitutional monarchy. Even if the King and his Government have more power than the Loya Jirga, they are still somewhat limited in what they can do. Some Government officials argue that the Loya Jirga should be reversed back to its old role; an assembly called on only when the King needed it to be present. But with the advances already made, it would be hard to do this without opposition.
 afghan.100.a: "Пока мы их контролируем, они могут существовать" # So Long As We Control Them, They Can Exist
 afghan.100.b: "Их присутствие больше не нужно" # Their Presence Is Not Needed Anymore

 afghan.101.t: "Суд над Мусахибанами" # The Trial of the Musahibans
 afghan.101.d: "Братья Мусахибан, король Мохаммед Надир Хан и его братья и сестры, уже много лет удерживают власть в Афганистане. Теперь, когда они побеждены и истинный король Афганистана удерживает власть, пришло время предать этих предателей суду. Если о них позаботятся, Афганистан наконец-то освободится из-под их контроля." # The Musahiban brothers, King Mohammed Nadir Khan and his siblings, have held power in Afghanistan for years. Now that they are defeated and the true king of Afghanistan holds onto power, it is time to take these traitors to trial. With them taken care of, Afghanistan will finally be free from their grasp.
 afghan.101.a: "Их наказание будет суровым" # Their Punishment Will be Severe

 afghan.102.t: "Лояльность среди пуштунских племен" # Loyalty Among the Pashtun Tribes
 afghan.102.d: "Нашему правительству удалось договориться с пуштунскими племенами, обеспечив их лояльность Афганистану. Хотя нам пришлось пойти на уступки, наградой за это стало более стабильное и сильное правило. Пока мы можем сохранять их лояльность, они не будут выступать против нашего правления." # Our government has managed to negotiate with the Pashtun Tribes, assuring their loyalty to Afghanistan. While we have had to give them concessions, the rewards for this is a more stable and stronger rule. So long we are able to keep them loyal, they will not oppose our governance.
 afghan.102.a: "Вместе мы сможем сделать Афганистан великим" # Together, We Can Make Afghanistan Great

 afghan.103.t: "Племенное влияние ограничено" # Tribal Influences Curbed
 afghan.103.d: "Хотя мы нажили немало врагов среди пуштунских и хазарейских племен, наши усилия по ограничению их влияния потребуются для того, чтобы освободить низшие классы Афганистана от угнетения. Было бы также странно, если бы революция не принесла справедливых изменений в общество, таких как ограничение влияния указанных племен." # While we have made many an enemy among the Pashtun and Hazara tribes, our efforts to curb their influence will be needed to set the lower classes of Afghanistan free from oppression. It would also be strange if a revolution would not bring just changes to society, such as curbing the influences of said tribes.
 afghan.103.a: "Да здравствует социальная справедливость!" # Long Live Social Justice!

 afghan.104.t: "Слабое влияние племен" # Weaker Tribal Influences
 afghan.104.d: "Влияние племен в Афганистане было успешно ослаблено. Поскольку члены племени приняли идеал, согласно которому племя — это древняя идея, несовместимая с идеей новой афганской нации, пуштунские и хазарейские племена утратили часть своей власти в нашем обществе. Вместе мы построим афганское общество под Богом." # The influence held by the tribes in Afghanistan has successfully been weakened. With tribal members adopting the ideal that the tribe is an ancient idea, not compatible with the idea of the new Afghan nation, the Pashtun and Hazara tribes have lost some of their power in our society. Together, we will build an Afghan society under God.
 afghan.104.a: "Только Бог Над Афганистаном!" # Only God Above Afghanistan!

 afghan.105.t: "Дело об агрессивных религиях" # The Case About Aggressive Religions
 afghan.105.d: "В последние годы роль ислама в Афганистане подверглась сомнению со стороны внешних влияний и религий. Вместе с Российской и Британской империями на нашу родину было принесено христианство, а с Индийского субконтинента широко распространились индуизм, сикхизм и буддизм. После революций в России светские и атеистические влияния стали новым агрессором. Некоторые из этих конфессий, возможно, смогут интегрироваться в исламское общество, но есть аргумент, что в соответствии с Кораном к неверующим вообще нельзя относиться терпимо." # In recent years, Islam's role in Afghanistan has been challenged by outside influences and religions. With the Russian and British empires, Christianity was introduced to our homeland, and from the Indian subcontinent, Hinduism, Sikhism and Buddhism have spread widely. With the revolutions in Russia, secular and atheist influences became a new aggressor. Some of these faiths might be able to integrate into an Islamic society, but there is an argument that nonbelievers should not be tolerated at all, in accordance with the Quran.
 afghan.105.a: "«Сражайтесь с неверующими! Пусть они найдут суровость!»" # 'Fight the Nonbelievers! Let Them Find Harshness!'
 afghan.105.b: "Пока они принимают ислам, они могут оставаться" # So Long They Accept Islam, They Can Stay

 afghan.106.t: "Рейд в Среднюю Азию" # A Raid Into Central Asia
 afghan.106.d: "Обеспечив нашу власть, мы, наконец, предприняли шаги по совершению набегов на наших соседей, чтобы обогатиться. Группа вооруженных людей под предводительством короля Хабибуллы Калакани пересекла границу и направилась в Среднюю Азию. Теперь отряд короля вернулся, неся с собой богатства и славу. Это действительно станет новой нормой для афганского монарха." # With our power secured, we have finally taken the steps to raid our neighbours, in order to enrich ourselves. Led by King Habibullāh Kalakāni, a party of armed men rode over the border into Central Asia. Now, the King's band has returned, carrying riches and glory back with them. This is indeed going to be the new norm for the Afghan monarch.
 afghan.106.a: "Ура! Ура!" # Hurrah! Hurrah!

