 AFG_FUHRERREICH_DESC: "Афганистан имеет долгую историю, связанную как с завоеваниями, так и с множеством династий, управляющих его землей. После Великой войны в Афганистане правление прогрессивного монарха Амануллы-хана рухнуло в результате восстания таджика Хабибуллы Калакани. Однако в 1929 году мусахибаны захватили власть во время правления Мохаммеда Надир-хана. С тех пор королевством управляют в относительном мире. Но и Аманулла Хан, и Калакани все еще на свободе, и с появлением в Афганистане таких идей, как национализм, социализм и республиканизм, одна искра может зажечь огонь и изменить страну навсегда." # Afghanistan has a long history, with both conquests and many dynasties ruling its land. After the Great War, Afghanistan saw the rule of their progressive monarch, Amanullah Khan, fall apart under an uprising by the tajik Habibullāh Kalakāni. In 1929, however, the Musahibans would seize power under the reign of Mohammed Nadir Khan. Since then, the Kingdom has been ruled with relative peace. But both Amanullah Khan and Kalakāni are still at large, and with the rise of ideas like Nationalism, Socialism, and Republicanism in Afghanistan, one spark might light a fire, and change the country forever.

