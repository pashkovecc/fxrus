 ### EVENTS ### 
 slovakia.1.t: "Union with Hungary" #NT!
 slovakia.1.d: "The Hungarians have approached us with an offer, they wish to help us in our fight for independance. The chances of us winning this war on our own are very slim, and sadly the Hungarian soldiers on our border have left us with no other choice. We will become subjects of Hungary, for our own survival." #NT!
 slovakia.1.a: "We will bind our dynsaty to theirs." #NT!
  
 slovakia.2.t: "The Death of Andrej Hlinka" #NT!
 slovakia.2.d: "In a truly sad day for Slovakia, the father of the nation, Andrej Hlinka has passed. Having freed us from the tyrannical Czechs and seeking to defend Slovaks from imperialism from all sides, he will be sorely missed. In his place, the People's Party have at last finalized their lurch to the right - with Hlinka's favorite, Karol Sidor taking over. It seems that Slovakia is now headed for a anti-liberal destiny." #NT!
 slovakia.2.a: "Slovákom som sa narodil, Slovák som a Slovák budem!" #NT!
  
