### EVENTS ###
 slovakia.1.t: "Союз с Венгрией" # Union with Hungary
 slovakia.1.d: "Венгры обратились к нам с предложением, они хотят помочь нам в борьбе за независимость. Шансы на то, что мы выиграем эту войну самостоятельно, очень малы, и, к сожалению, венгерские солдаты на нашей границе не оставили нам другого выбора. Мы станем подданными Венгрии ради собственного выживания." # The Hungarians have approached us with an offer, they wish to help us in our fight for independance. The chances of us winning this war on our own are very slim, and sadly the Hungarian soldiers on our border have left us with no other choice. We will become subjects of Hungary, for our own survival.
 slovakia.1.a: "Мы свяжем нашу династию с их." # We will bind our dynsaty to theirs.

 slovakia.2.t: "Смерть Андрея Глинки" # The Death of Andrej Hlinka
 slovakia.2.d: "В поистине печальный для Словакии день ушел из жизни отец нации Андрей Глинка. Освободив нас от тиранических чехов и стремясь защитить словаков от империализма со всех сторон, его будет очень не хватать. Вместо него Народная партия, наконец, завершила свой сдвиг вправо - к власти пришел фаворит Глинки Кароль Сидор. Похоже, что Словакию сейчас ждет антилиберальная судьба." # In a truly sad day for Slovakia, the father of the nation, Andrej Hlinka has passed. Having freed us from the tyrannical Czechs and seeking to defend Slovaks from imperialism from all sides, he will be sorely missed. In his place, the People's Party have at last finalized their lurch to the right - with Hlinka's favorite, Karol Sidor taking over. It seems that Slovakia is now headed for a anti-liberal destiny.
 slovakia.2.a: "Я родился словаком, я словак и буду словаком!" # Slovákom som sa narodil, Slovák som a Slovák budem!

