### Events
 sra.100.t: "Правительство Чикаго предлагает Союз" # Chicago Government Proposes Union
 sra.100.d: "Представители недавно созданного социалистического правительства в Чикаго обратились к нам с предложением объединить их и наше правительство. Президент [Root.GetLeader] выразил интерес к этому предложению и проконсультировался со своим кабинетом и некоторыми членами законодательного собрания, чтобы принять решение. Хотя в правительстве есть те, кто не поддерживает этот союз, многие в правительстве выступают за." # Representatives from the recently established socialist government in Chicago have approached us proposing unification between them and our government. President [Root.GetLeader] have expressed interests on this proposal, and have consulted with his cabinet and some members of the legislature to make a decision. While there are those in the government who do not support this union, many within the government are in favour.
 sra.100.a: "Вместе мы разорвем цепи! §R(Вы будете аннексированы!)§!" # Together we will break the chains! §R(You will get annexed!)§!
 sra.100.b: "Новая Англия проложит свой собственный путь" # New England will forge its own path
 sra.101.t: "[From.GetName] принимает наше предложение" # [From.GetName] Accepts Our Offer
 sra.101.d: "Правительство [From.GetAdjective] приняло наше предложение об объединении" # The [From.GetAdjective] Government have accepted our proposal for unification
 sra.101.a: "Разорвите цепи!" # Break the chains!
 sra.102.t: "[From.GetName] отказывается от нашего предложения" # [From.GetName] Refuses Our Offer
 sra.102.d: "Правительство [From.GetAdjective] отклонило наше предложение об объединении." # The [From.GetAdjective] Government have refused our proposal for unification.
 sra.102.a: "Кому они вообще нужны?" # Who needs them anyway?
 sra.102.b: "Нью-Йорк все еще наводнен капиталистами..." # New York is still creeped by the capitalists...
