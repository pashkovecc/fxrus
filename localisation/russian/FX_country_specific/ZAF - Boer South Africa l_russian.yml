 #### Focus #### 
 ZAF_Something_Terrible: "Start the Fire" #NT!
 ZAF_Something_Terrible_desc: "The traitors of South Africa shall tremble! We have caught them by surprise, and are now engaged in the fight for the very survival and independence of our nation! Ex Vires Imperium!" #NT!
 ZAF_Chaos_Ladder: "Chaos is a Ladder" #NT!
 ZAF_Chaos_Ladder_desc: "The fight we now embark upon will be a long and brutal one. If we are to have any chance at defeating the traitors of South Africa, we must maintain the element of surprise, and strike with no holds barred." #NT!
 ZAF_Rile_Populace: "Rile up the Populace" #NT!
 ZAF_Rile_Populace_desc: "The population of the Boer states must be fully brought onboard our efforts. Without them, our movement will not have soldiers and workers, and will be doomed to fail. We must make every outreach possible to recruit them." #NT!
 ZAF_German_Separatists: "Support Separatists in Kalahari" #NT!
 ZAF_German_Separatists_desc: "Southwest Africa, given to the Union after the Great War, was once a German colony. As such, there are many in hiding there who are ready to rise up against the South African traitors. All that they would need is a little push..." #NT!
 ZAF_Total_War: "War of Survival" #NT!
 ZAF_Total_War_desc: "If we are to win this fight, we must recruit as much of the populace as possible. Fill the militias with men and women alike; children too if they're old enough. This is a fight for our very survival!" #NT!
 ZAF_Foreign_Aid: "Foreign Aid" #NT!
 ZAF_Foreign_Aid_desc: "As much as we'd like to show the world just how strong we are by defeating the traitors single-handedly, we will require some degree of foreign aid if we are to survive. We must set aside our pride and ask nations sympathetic to our cause for support." #NT!
 ZAF_Way_to_Independence: "Way to Independence" #NT!
 ZAF_Way_to_Independence_desc: "We have secured all of our bases, and waged total war against the traitors in South Africa. Our path to reclaiming our nation is tried and true, and all that remains is to win our war for independence." #NT!
