 # Black Wednesday 
  
 AUSperfecteconomy.1.t: "Black Wednesday" #NT!
 AUSperfecteconomy.1.d: "As news of the London stock exchange crash spreads through Austria, panic grips the streets as looting and violence become common. The crash, following a prolonged decline, has sent shockwaves through the European economy, leading to a spiral of poverty, as millions of enterprises shutting down and millions of workers lost their jobs. As the panic continued in the banks, people ran to the banks to withdraw their money and maybe save their savings. This culminated in banks shutting down and withdrawals being outright refused. The crisis has reached its peak, if we allow it to worsen further, the military may intervene, and our economy may never recover completely..." #NT!
 AUSperfecteconomy.1.a: "May God help us..." #NT!
  
 AUSperfecteconomy.2.t: "The Worst is Over" #NT!
 AUSperfecteconomy.2.d: "Black Wednesday had a horrifying effect on the Austrian economy and the living standards of the country. However, the worst days are over, and now we can attempt a full recovery." #NT!
 AUSperfecteconomy.2.a: "Towards economic recovery!" #NT!
  
 AUSperfecteconomy.3.t: "Weapons to the Heimwehr" #NT!
 AUSperfecteconomy.3.d: "The infamous Treaty of Saint-Germain states that any military factory must be approved and reviewed by the council before construction can begin. However, it does not state that the council must approve the government's purchase of a privately owned factory for military purposes. There is an obstacle, however, in that no equipment can be produced for the military; instead, all of it must be redirected to the civilians to purchase. The Heimwehr, however, is still considered a civilian organization with no ties to the military." #NT!
 AUSperfecteconomy.3.a: "The best we can do at the moment." #NT!
  
 AUSperfecteconomy.4.t: "The Austrian Proposal to the Entente" #NT!
 AUSperfecteconomy.4.d: "In June 1935, Austrian delegates at the Entente Council demanded the nullification of the Treaty of Saint-Germain, citing the reasons for it as: “A measure of defence against a revanchist Germany that is starting to rearm itself, and to guarantee the Entente and Austrian safety, Austria should also begin to rearm”. The session that would decide whether the treaty would or not be nullified was held on the first of January, 1937. The Serbians opposed the Austrian demands, citing the rearmament of Austria as a “means to reconquer their empire”, however, the effects of Black Wednesday and the continuation of Dressler’s policy of revanchism gave the French and Italians the reasoning to accept the Austrian demands. In the end, it was decided that the Treaty of Saint-Germain would be nullified and Austria was permitted full rearmament." #NT!
 AUSperfecteconomy.4.a: "The Treaty of Saint-Germain is finally dead." #NT!
  
 # Militias 
  
 AUSmilitias.1.t: "SDAPÖ and CSP Militias Fight at Vienna" #NT!
 AUSmilitias.1.d: "Ever since the creation of the First Republic, militias gathered up in arms, trying to achieve revolution or silence the opposition. The Ostmärkische Sturmscharen (OS) is not generally seen on the battlefield, generally, the Heimwehr is the one to come looking for fights. The OS is a fighting force like no other though, being lead by prominent Kurt von Schuschnigg. On the other hand, the Republikanischer Schutzbund (RS) is a veteran of urban fighting, having survived years of brutal war - and being even more radicalised by the events of the 15th of July. The three main militias, Heimwehr, Ostmärkische Sturmscharen, and Republikanischer Schutzbund, are in constant battles throughout the country. However, today was bloodier than ''regular''.\n\nIn the streets of Vienna, squadrons of RS militias walked through the city, eventually finding themselves in a confrontation with OS militias, both armed and ready to fight. In a hurried tone, people started leaving as they realised fighting was about to commence. And then, a grenade was thrown at the OS. The fighting was heavy, but the OS militias suffered a total loss, with their squadrons forced to retreat by the RS, which suffered minimal losses. One interesting thing, though, is that grenades are military-grade equipment, that few in the military have access to.\n\nThat means that someone gave the RS military-grade equipment..." #NT!
 AUSmilitias.1.a: "Something is going on behind the curtain..." #NT!
  
 AUSmilitias.2.t: "Retaliation in Vienna" #NT!
 AUSmilitias.2.d: "It was time for payback against the socialists. Their military-grade equipment and vicious brutality against innocent Austrians could only beget a single righteous response. For this, an alliance between the Heimwehr and the Ostmärkische Sturmscharen was struck. As they entered Vienna looking for blood, they would soon find however that the Republikanischer Schutzbund was waiting for them, armed and ready.\n\nIn the chaos that ensued, a hail of bullets and grenades were exchanged across the streets of Vienna. While few had expected the fight to be easy, ultimately the Republikanischer Schutzbund retreated surprisingly quickly, but with one piece of bad news came victory for the right-wing paramilitaries. In the struggle, a key officer of the Schutzbund had perished, well-loved by not just the paramilitary members but also the Viennese population. It seems that retribution for his death will come soon..." #NT!
 AUSmilitias.2.a: "You fools, that will only entice the devil!" #NT!
  
 AUSmilitias.3.t: "Strikes in Vienna" #NT!
 AUSmilitias.3.d: "The furor over the death of the Schutzbund officer was expected to be great, but certainly not to the extent that we can now witness. With the Schutzbund at their beckoning, the Social Democrats have called for a general strike in Vienna until the government prosecutes the paramilitary men who shot down the Schutzbund officer.\n\nThis has caused a breakdown of regular life in the city, with other sympathy strikes already breaking out throughout the rest of the nation. Joining the crowd, radicals like Otto Bauer have strongly urged the government to take steps to begin prosecution of the Sturmscharen and Heimwehr units involved in the retributive strike, threatening failure to do so would indict them as nothing more than agents of reaction. Such a threat has not gone unnoticed, and has only served to radicalize the nation." #NT!
 AUSmilitias.3.a: "And so the rats show their true face." #NT!
  
 AUSmilitias.4.t: "Heimwehr Suppresses Strikers" #NT!
 AUSmilitias.4.d: "Out of the many anti-socialist elements in Austria, few are as feared as the Heimwehr. While broadly speaking a simple anti-socialist patriotic paramilitary, the Heimwehr consists of the local organizations that across the Austrian provinces with each local Heimwehr organization having particular differences from one another. While this has historically made them unwieldy in fighting the government, such issues have now been overshadowed by the Vienna strikes.\n\nDecrying the strikes as nothing but Bolshevik provocation and once again demanding a severe crackdown on their nemesis in the Schutzbund, the Heimwehr have bypassed the government’s approval by taking the initiative and marching into Vienna to deal with the strikers. As blood runs through the streets of Vienna as Heimwehr forces beat down the socialist strikers, condemnation has come from all rungs of Austrian society including even the parliament. Still, it appears that the chancellor himself has remained awfully tight-lipped on the day’s events as the Vienna strikes come to an unceremonious end." #NT!
 AUSmilitias.4.a: "We can use this." #NT!
  
 AUSmilitias.5.t: "The Death of Richard Steidle" #NT!
 AUSmilitias.5.d: "The Heimwehr’s suppression of the Vienna strikes has turned out to be far less desirable than the Heimwehr leaders had hoped. The brutality with which the Heimwehr smashed the strikes shook even ardent conservatives with some openly fearing a Heimwehr dictatorship in the vein of Dressler to the north or like the Serbs in the south. Such a thought has caused the blood of many to run cold, but it has also caused many socialist sympathizers to begin throwing their lot in with the Schutzbund.\n\nOn this day in Graz, federal leader of the Heimwehr Richard Steidle was on his way to meet Styrian Heimwehr to plan ways out of the new challenges that the suppression of Vienna had brought. Whatever was running through his mind however will be for naught, as he was assassinated on his way to the meeting. The culprit was supposedly a lone communist, though most suspect that this assassin was actually put up to it by none other than the hated Schutzbund. Either way, there will be payback." #NT!
 AUSmilitias.5.a: "They have crossed the line, begin military preparations." #NT!
  
 AUSmilitias.6.t: "Ramek’s Order" #NT!
 AUSmilitias.6.d: "It seems that on the orders of the chancellor, the army has begun preparations to crush the Republikanischer Schutzbund at once. Such a move though could only really spark further civil unrest, and even setting aside the outrage that this wholesale shift towards right-wing dictatorship could spark from Paris or Rome, the practical effect may not even be sufficient to stave off revolution. As such and in accordance with law, interior minister Rudolf Ramek has ordered the army to stop preparations and to demobilize - all is well.\n\nOf course not all is well. Chancellor Dollfuß for his part has made his pleasure abundantly clear. Still, the president and more moderate Christian-Socials has refused to let Dollfuß override Ramek’s order or even punish the wayward minister, though his fate in a future cabinet is highly dubious to say the least." #NT!
 AUSmilitias.6.a: "A distasteful choice." #NT!
  
 AUSmilitias.7.t: "Red Vienna Burning" #NT!
 AUSmilitias.7.d: "Red Vienna, as it is called for the socialist activity has finally come to revolution. The elections have been post-poned due to widespread revolt and unreast all across Austria, with the delay of two months, with this revolution, it is certain that Austria is a step from the abyss.\n\nSome call this revolution a democratic revolution, however, we know that this revolution is simply a facade to install a socialist government. The Government is at an impasse on how to solve this issue, which caused the resignation of the President of the Nationalrat, meaning that the next President is the SDAPÖ representative, which will defitinely try to negotiate with the rioters." #NT!
 AUSmilitias.7.a: "Great, socialists in the Presidency." #NT!
  
  
 # Reforms 
  
 AUSreforms.1.t: "The Fiscal Reforms" #NT!
 AUSreforms.1.d: "The state is undergoing massive problems with debt payments and keeping the state machinery working. To prevent further spiraling down the crisis, the economic minister of Austria has declared a state of austerity. State pensions to veterans will be revoked, and politicians' pay is being cut in half. All of these changes will continue in effect until the austerity state is dropped." #NT!
 AUSreforms.1.a: "Anything to end this crisis!" #NT!
  
 AUSreforms.3.t: "The Fate of Steyr-Daimler-Puch" #NT!
 AUSreforms.3.d: "Steyr-Daimler-Puch is a military-based company that came into existence after the fusion of Steyr, Austro-Daimler and Puch into one company. The company has been in financial trouble ever since it came into existence due to the Treaty of Saint-Germain, however, Black Wednesday has made the financial trouble turn into financial ruin and now, the company faces bankruptcy. Since the company is the biggest armament company in Austria, the state is also being involved and some suggest intervention to prevent the company's bankruptcy." #NT!
 AUSreforms.3.a: "Nationalise the Company" #NT!
 AUSreforms.3.b: "Subside the company." #NT!
 AUSreforms.3.c: "Don't intervene." #NT!
  
 AUSprotests.1.t: "Protests Against Austerity in Wien" #NT!
 AUSprotests.1.d: "Wien was thrown into a state of riots ever since the state of austerity has been declared. Many veterans of the Great War feel as if the measure is a spit in the face of those who put themselves at the front in the war to end all wars." #NT!
 AUSprotests.1.a: "Damn it!" #NT!
  
 # Socialist Terrorist 
  
 AUSterrorism.1.t: "Socialist Terrorism" #NT!
 AUSterrorism.1.d: "As the socialists continue to resist our rule, their tactics of terrorism are hurting our system and revealing weakness in our regime. We must address these criminals as soon as possible." #NT!
 AUSterrorism.1.a: "Damn it!" #NT!
  
 # CS 
  
 # SDAPÖ 
  
 # Schuschnigg 
  
 ausks.1.t: "Talks with the Landbund" #NT!
 ausks.1.d: "The Landbund, which was in opposition to the CS after the national crisis has agreed to talks. Inside the Nationalrat, the Landbund made themselves clear about supporting small farmers - they added on top of it, a declaration that land reform will not be carried out extensively." #NT!
 ausks.1.a: "We hope to cooperate as one." #NT!
 ausks.1.b: "What's this, a farmer's state?" #NT!
  
 ausks.3.t: "The Weak Veil" #NT!
 ausks.3.d: "Democracy, while still acting in the Austrian Empire, was checked by the noble power of the Emperor, after the Emperor went away, the French and Italian devils dismantled our institutions, they replaced those timeless institutions with a replica of their disease;\n\nParliamentarism - a weak, frail and disgusting institution. Those who lived under it can agree on one thing: Parliamentarism is a disgrace to the Austrian nation. With the Vaterland Front taking power, the SDAPÖ and KPO being radio silent, and Youth Organizations forced underground, the path is clear to us. It will finally be the time to put an end to the institution all of the "New Conservatives" hate. That is, democracy." #NT!
 ausks.3.a: "Let it burn." #NT!
  
 ausks.4.t: "Loud Speakers, Loud Actors" #NT!
 ausks.4.d: "The ban on socialist parties of all stripes rather than just the tool of Soviet interference that is the KPÖ has endeared very few moderates. In fact, it has only emboldened the Republikanischer Schutzbund and their Social Democrat overlords to intensify resistance against our government. To this end, the question of severity still remains. Should we go all the way and ensure that every single Bolshevik organization is rooted out? Such a thing could require a level of total surveillance and control that would make moderates’ stomachs sink, necessitating a decision on the matter." #NT!
 ausks.4.a: "Keep these troublemakers underground." #NT!
 ausks.4.b: "No quarter." #NT!
  
 ausks.5.t: "The Duel of Two Parties" #NT!
 ausks.5.d: "The Republikanischer Schutzbund have always been the greatest threat to our vision of a godly, united and free Austria. Behind their misleading slogans of equality and liberal democracy, their best promote feeble parliamentarianism while their worst are practically begging hands and knees for a Soviet intervention into our country.\n\nThe rise of Schuschnigg has not caused them to back down either. In fact, they have never been bolder in desiring an overthrow of the government and the creation of a red state in South Europe. Never mind that such a state would be asking for an intervention from all sides, it would simply bring ruin upon the Austrian people. As they rally in their ghoulish factories to destroy the nation, we must prepare ourselves as we face down the Social Democrats for the fate of the Austrian nation. The Austrian people shall choose - bread or Bolshevism?" #NT!
 ausks.5.b: "Let them come!" #NT!
  
 ausks.6.t: "The Kingmaker’s Triumph" #NT!
 ausks.6.d: "With the Heimwehr being slowly integrated via political extortion, their leader, Rüdiger would notice his isolation. Losing the will to continue his political career, it became apparent that retirement is the only choice. It is now a matter of time to see if Rüdiger will survive retirement." #NT!
 ausks.6.a: "He will have a nice house in Lower Austria, believe me." #NT!
  
 ausks.7.t: "United, Even in the Economy" #NT!
 ausks.7.d: "The Austrian nation is diverse in thought, and one of those thoughts are the economic thought. Austrian debacle on the matter gained international attention, becoming a centre for all economists. However, with the London Crash, it was finally shown to the world the dangers of such methods.\n\nWith the crash came millions of people without work, money or food, internationally, a tragedy. For reasons like this that our Chancellor and his Cabinet decided to go further than simple regulations, the economy must work like a body. One where the brain controls and decides, with the other work being automated within the system." #NT!
 ausks.7.a: "That should deal with the main problem." #NT!
  
 ausks.8.t: "The Guide of Independent Austria" #NT!
 ausks.8.d: "While we are German, Austria is more than just another German province to inevitably be bound to Prussian whims. We are more cultured in certain ways than our northern brothers would like to believe, and we certainly hold to our faith more strongly than even the supposedly devout Bavarians who were the first to give themselves up for the Bolshevik-esque Valkist movement.\n\nTo this end, Schuschnigg has called for a renewed effort on our part to separate ourselves from Germany. The rogue government in Berlin already hates us for simply being free, so let us return the favor and make the whole world understand that Austria will always be independent of a tyrannical Germany!" #NT!
 ausks.8.a: "Austria will always be free!" #NT!
  
 ausks.9.t: "Eliminating the German Networks" #NT!
 ausks.9.d: "It is not news that the German Networks for Pan-Germanism are increasing. Ever since the degeat of the Austrian-Hungarian Empire in the Great War, the gunpowder barrel exploded and nationalism and Pan-Germanism runs rampant. The problem with Pan-Germanism at the moment is that, we Austrians, cannot allow our independence to be played with, especially with Germany starting to renew their war machine.\n\nIf Austria is to remain independent, we must clean the rats out. Truth be told though, Dolfuss and Ramek have already been surpressing many of these movements in secrecy, but now we can eliminate them without any worries." #NT!
 ausks.9.a: "Get these rats out of here!" #NT!
  
 ausks.10.t: "Rejuvanating Austrian Nationalism" #NT!
 ausks.10.d: "When our regime came to Austria, millions of Austrians commemorated, as the years of led would finally end. However, with time, that nationalism will eventually start cooling off, and Pan-Germanists count on that to destroy the Austrians from inside out.\n\nWe Austrians must not forget our actual roots. German or not, Austria should come first, in soul and body!" #NT!
 ausks.10.a: "As it should be." #NT!
  
 ausks.12.t: "Where Eagles Clash" #NT!
 ausks.12.d: "As the German Empire and the Austrian Empire fell, a wave of nationalism came to the country, while at the same time, revolutionary thought swept through Europe. At the ends of the Habsburg Empire, Pan-Germanism would reemerge as once it did in 1848. However, the Entente wished for a Pan-German union to never happen, as Germany would have more territory than at the start of the war, and more importantly, they would have a greater industry.\n\nDuring the late 1920s, Austria would accept its status as an independent nation, even if the population disagreed. However, during the Valkist coup of 1932 in Germany, Pan-Germanist started to re-root itself in Austrian politics. Soon, Austria would discover that their northern neighbour no longer saw them as an independent country, it would be a matter of time until the Prussian eagle descended to catch its prey. Now, it is the time to prepare, and more importantly, impale the Prussian eagle!" #NT!
 ausks.12.a: "At your feet, soldier!" #NT!
  
 ausks.13.t: "Propaganda Department" #NT!
 ausks.13.d: "Propaganda - A weapon, agaisnt all foes. Be it political or military, propaganda has a wide use for the government, we must convince the souls of the people that our cause is just, even if not. The creation of the propaganda department makes things easier for us, as we can operate with more organisation to spread our message. From now on, the people of Austria shall know the truth, and they shall be convinced of our justness!" #NT!
 ausks.13.a: "Let them hear what we want." #NT!
  
 ausks.14.t: "Maintaining Order at the Army" #NT!
 ausks.14.d: "With our defences being prepared to ensure Austrian survival, it has come to Jansa's attention some officers, and high-ranking personnel had previous affiliation with the enemy. Today, a report from Jansa, where he advises the nation to "retire" these personnel." #NT!
 ausks.14.a: "We should listen to Jansa." #NT!
  
 ausks.15.t: "Schuschnigg, Father of Austria" #NT!
 ausks.15.d: "For many international observers, Austria's fate would be simple - an hapless pawn of the newly arisen Reich that would go on to enthusiastically fight for barbaric conquest. However, their predictions have clearly been proven wrong. Despite all attempts by the radical government in Berlin, the Austrian people have withstood the attack of the new menace that was Germany and has in concert with the responsible nations of Europe smited the illegal regime from the Earth.\n\nWhile Valkism and its derivatives live on, they are but irrelevant embers of the once-grand flame that encompassed Europe. Meanwhile, Austria remains standing, ready to face the challenges of a new world. Sure, liberalism and its socialist companions still remain and in certain places are stronger than ever, but none can deny that we have won this war. Chancellor Schuschnigg has led our German Austria into a new age, and for this he can only be described as the father of the nation." #NT!
 ausks.15.a: "Die neue Zeit steigt in den Tag!" #NT!
  
 # Habsburg 
  
 AUShabsburg.1.t: "Politics and Art Intertwined" #NT!
 AUShabsburg.1.d: "Hugo von Hofmannsthal entered the room where Otto was sitting, placing himself on the ottoman across the former royal. They were to sit down and create an Austrian identity unique from the division and fragmantation that had festered under a German identity. At the question from Otto, Hofmannsthal could give insight into how to form this identity.\n\nHe began talking about England. How the English admired both military leaders and artists alike, while maintaining their identity. How divisions between the politicians and the artists doesn't exist. Where the subjects are provided with a common base of energy, a singular and pragmatic energy.\n\nEven if these visions might be overstated, there were some teachings in them. Austria had produced many artists during her lifetime. Why bind our identity towards ethnicity or language? These things have easily divided the people, causing many Austrians to view themselves as German. Instead, both Hugo and Otto agreed that unity between politics, art and perhaps faith was the best way forward." #NT!
 AUShabsburg.1.a: "The Austrian Has An Artist's Soul" #NT!
  
 AUShabsburg.2.t: "The Social Monarchist Appointment" #NT!
 AUShabsburg.2.d: "Ernst Karl Winter represents almost everything that makes Austria unique from Germany. A Catholic monarchist, Winter was an early proponent of the Austrian identity. One who also had a big heart for the rights of the Austrian working class. Now, he sat on his first cabinet meeting as an appointed member of Otto's government.\n\nWhile most of Otto's supporters strive towards the right, the appointment of Winter represent a turn towards the left. It was he who came with the slogan: 'stand on the right and think on the left'. His monarchism isn't one of elitism and intolerance. Quite the difference, his role will be to use his expertice from his work as a Journalist and University Professor to promote the Austrian identity in our education system. In addition, he will probably give a lot of input on issues in regards of workers' rights through his Social Working Group." #NT!
 AUShabsburg.2.a: "For the Austrian Worker and His King" #NT!
  
 AUShabsburg.3.t: "Changing of the Guard" #NT!
 AUShabsburg.3.d: "Last week, president Wilhelm Miklas tendered his resignation to the Austrian parliament in a session overseen by Otto von Habsburg. Miklas have served the Austrian people faithfully through many years, but now it is over. With the changing times, new leadership, leadership more willing to work with Otto that is, will be needed to move Austria forward.\n\nA new session was quickly called this week to fulfill the vacancy left by Miklas' departure. During the session, Otto took to the stand, speaking about the need to nominate someone who will bring Austria into the future. He spoke about the instability, the divisions and intolerance of the Republic, painting a nicer picture of the Habsburg dynasty and the Empire. While some believed he would nominate himself, Otto instead ended the speech by nominating Viktor Dankl von Krasnik to follow Miklas as president.\n\nSome remaining opposition figures still oppose this nomination, pointing towards the advanced age of von Krasnik and his loyalties with the Monarchist Restoration Party. However, with our grasp over the Federal Council secure, there is nothing they can do to hinder this appointment. In the end, our Republican opponents will be right. Von Krasnik is old and will not live for long, but he will be a man willing to work with us to make the Imperial Crown ready for Otto in due time." #NT!
 AUShabsburg.3.a: "For Austria's Future!" #NT!
  
 AUShabsburg.4.t: "The Austrians Seeks a Trade Deal" #NT!
 AUShabsburg.4.d: "Austria, under the leadership of their former crown prince Otto von Habsburg, have sent an envoy to Rome. They request a trade agreement between the two realms, seeking to bind closer connections between the Austrian and Italian peoples. While this agreement will be benefitial to us, we should keep in mind Otto's ambitions to restore the old Austro-Hungarian Empire. An empire that claimed Italian lands." #NT!
 AUShabsburg.4.a: "Trade is Harmless, We Agree" #NT!
 AUShabsburg.4.b: "No! We Can't Trust This Habsburg" #NT!
  
 AUShabsburg.5.t: "The Italians Agree" #NT!
 AUShabsburg.5.d: "Our envoy in Rome sends good news back to Vienna. The Italians have agreed on the terms of our trade agreement. With this agreement, both realms will be strengthen. We are hopeful that this is just the first step towards a prosperous relationship." #NT!
 AUShabsburg.5.a: "Great!" #NT!
  
 AUShabsburg.6.t: "The Italians Disagree" #NT!
 AUShabsburg.6.d: "Our envoy in Rome sends bad news back to Vienna. The Italians did not see reason and rejected our proposed trade agreement. There are rumours that the Italians does not trust the leadership of an Habsburg in Austria, fearing for the lands that they took from us during the Great War. Despite this setback, we hope to uphold cordinal relations with them." #NT!
 AUShabsburg.6.a: "You Can't Win Them All" #NT!
  
 AUShabsburg.7.t: "The Austrians Seeks a Trade Deal" #NT!
 AUShabsburg.7.d: "Austria, under the leadership of their former crown prince Otto von Habsburg, have sent an envoy to Sofia. They request a trade agreement between the two realms, seeking to bind closer connections between the Austrian and Bulgarian peoples. With an Habsburg ruling Austria, many see it as a prime opportunity to rekindle our relationship from the Great War. Others want us to reject this, in an rejection to the failures of the past." #NT!
 AUShabsburg.7.a: "Trade is Harmless, We Agree" #NT!
 AUShabsburg.7.b: "No! We Don't Want to Be Draged Into Otto's Ambitions" #NT!
  
 AUShabsburg.8.t: "The Bulgarians Agree" #NT!
 AUShabsburg.8.d: "Our envoy in Sofia sends good news back to Vienna. The Bulgarians have agreed on the terms of our trade agreement. With this agreement, both realms will be strengthen. We are hopeful that this is just the first step towards a prosperous relationship." #NT!
 AUShabsburg.8.a: "Great!" #NT!
  
 AUShabsburg.9.t: "The Bulgarians Disagree" #NT!
 AUShabsburg.9.d: "Our envoy in Sofia sends bad news back to Vienna. The Bulgarians did not see reason and rejected our proposed trade agreement. There are rumours that an agreement with a Habsburg-led Austria reminds them too much about the failures of the Great War. Despite this setback, we hope to uphold cordinal relations with them." #NT!
 AUShabsburg.9.a: "You Can't Win Them All" #NT!
  
 AUShabsburg.10.t: "Austria Calls the Princes" #NT!
 AUShabsburg.10.d: "Austria, under the leadership of the Habsburg prince Otto, has issued a call for the princes of the Habsburg line. One of these princes resides in Hungary. Joseph August has had a residence in our country since the end of the Great War, and has become a likeable figure for the public. Even many Hungarian nationalists view him with high regards and some seek to enthrone him as king of Hungary.\n\nIt would be hard to justify keeping him here if he want to return to his kin in Austria, but some advisors say we should keep him here. However, that would be a decision that could risk tensions with the Austrians." #NT!
 AUShabsburg.10.a: "Farewell, Joseph August" #NT!
  
 AUShabsburg.11.t: "Joseph August Arrives From Hungary" #NT!
 AUShabsburg.11.d: "The Palatine of Hungary, Joseph August, have arrived today in Vienna. Despite his own doubts of leaving Hungary and the signs that the Hungarian government would try to keep him there, he answered the call. He understands that joining our forces isn't a betrayal to the Hungarian people. Soon enough, we will march east and liberate the Hungarian people from their Magyar oppressors." #NT!
 AUShabsburg.11.a: "Welcome to Vienna" #NT!
  
 AUShabsburg.12.t: "The Hungarians Has Hindered Joseph August" #NT!
 AUShabsburg.12.d: "The Hungarians seem to not let Joseph August go free to join his kin in Vienna. Instead of letting him leave, they placed him under house arrest in a fancy Budapest residence. They are probably scared that such a popular figure among the Hungarian people should join his brothers in Austria. Regardless, this is highly inappropriate." #NT!
 AUShabsburg.12.a: "Cursed These Magyars" #NT!
  
 AUShabsburg.13.t: "Austria Calls the Princes" #NT!
 AUShabsburg.13.d: "Austria, under the leadership of the Habsburg prince Otto, has issued a call for the princes of the Habsburg line. One of these princes resides in Poland. Karl Albrecht has had a residence in our country since the end of the Great War, and has found himself a good home in Poland. So much that he is known as a avid Polish patriot. Of course, he could leave if he wants to, but some rumours tells us he might also choose to stay in Poland. That he finds the peace of retirement more fulfilling than Imperial service." #NT!
 AUShabsburg.13.a: "It's Up to Him" #NT!
  
 AUShabsburg.14.t: "Karl Albrecht Arrives From Poland" #NT!
 AUShabsburg.14.d: "The Silesian Prince, Karl Albrecht, have arrived today in Vienna. Despite his deep love for Poland and his previous service for Polish independence, he answered the call. He understands that loyalty to family sometimes overgo loyalty to an adopted country. Hopefully, our dream of a renewed empire have space for the Polish nation. One living in freedom and prosperity." #NT!
 AUShabsburg.14.a: "Welcome to Vienna" #NT!
  
 AUShabsburg.15.t: "Karl Albrecht Rejects the Call" #NT!
 AUShabsburg.15.d: "A letter has been sent to us from Poland. It is signed by the Silesian Prince, Karl Albrecht, himself. He wishes Austria luck and all well under renewed Habsburg rule, but declines to leave for Vienna. Even if we dislike his choice to leave the family and support his adopted country, it was ultimately his choice and we can't force him to travel to Vienna against his will." #NT!
 AUShabsburg.15.a: "Was Worth the Effort" #NT!
  
 AUShabsburg.16.t: "Austria Calls the Princes" #NT!
 AUShabsburg.16.d: "Austria, under the leadership of the Habsburg prince Otto, has issued a call for the princes of the Habsburg line. One of these princes resides in Ukraine. Wilhelm Franz, known in our tounge as Vasyl Vyshyvanyi, has had a residence in our country since the end of the Great War, and has found himself a good home in Ukraine. While his elder brother became a Polish patriot, Wilhelm Franz has been an avid supporter of Ukrainian independence. If he want to, he can leave. However, he is also likely to stay in Ukraine. That he finds his loyalty more to his adopted country than to family ties." #NT!
 AUShabsburg.16.a: "It's Up to Him" #NT!
  
 AUShabsburg.17.t: "Wilhelm Franz Arrives From Ukraine" #NT!
 AUShabsburg.17.d: "The Ukrainian Colonel, Wilhelm Franz, have arrived today in Vienna. Despite his loyalty to Ukraine and the Ukrainian people, he has answered the call. He understands that even if his heart is torn between Ukraine and family, he can't forget that he is first and foremost an Habsburg. We can ourself learn from his love of Ukraine. A nation many see as a likely ally against the Russian Soviet bear." #NT!
 AUShabsburg.17.a: "Welcome to Vienna" #NT!
  
 AUShabsburg.18.t: "Wilhelm Franz Rejects the Call" #NT!
 AUShabsburg.18.d: "A letter has been sent to us from Ukraine. It is signed by the Ukrainian Colonel, Wilhelm Franz, himself. Or even not him, but his Ukrainian alias Vasyl Vyshyvanyi. While he wishes us luck, he admits to not believe that the Empire can be restored. He sees himself no longer as an Habsburg, probably a feeling coming from his more rebellious side, but as Vasyl Vyshyvanyi. He signs of with two final words:\n\nSlava Ukraini!" #NT!
 AUShabsburg.18.a: "Was Worth the Effort" #NT!
  
 AUShabsburg.19.t: "Sibling Rivalry" #NT!
 AUShabsburg.19.d: "The call of the Habsburg princes has undoubtly been answered by more than one set of siblings. One of these sets is Karl Albrecht and Wilhelm Franz. After a ceremony where they was restored to the ranks of officers in the Austrian Armed Forces, a discussion was to be heard between the two brothers. It resulted with the two of them being guided away by nearby guards to prevent further embarrassment.\n\nTheir discussion seems to be sparked by the debate of Galician sovereignty. While Karl Albrecht spoke up in favor of Polish supremacy, this ticked Wilhelm Franz off, who was persistent that the Ukrainian people there should be governed by Ukraine. For Otto, this debate is irrelevant. Galicia belonged to the Empire and it will belong to it again. That's what both of them signed up on." #NT!
 AUShabsburg.19.a: "This is Ridiculous" #NT!
  
 AUShabsburg.20.t: "Wilhelm Franz Leaves For Ukraine" #NT!
 AUShabsburg.20.d: "The Ukrainians have seemingly followed in our steps, seeking to enthrone their own Habsburg. What this means, is that our dear Ukrainian Colonel, Wilhelm Franz, will leave Austria to his new kingdom in the east. As we wink farewell to Wilhelm Franz, we wink farewell to the new king of the Ukrainians: Vasyl I.\n\nLong Live King Vasyl I, Slava Ukraini!" #NT!
 AUShabsburg.20.a: "Heroiam Slava!" #NT!
  
 AUShabsburg.21.t: "Stjepan Sarkotić Retires" #NT!
 AUShabsburg.21.d: "Stjepan Sarkotić have been a great help in lending his Great War expertice to the Austrian army and working within the Croatian émigré community in Vienna to better make Croatia ready for Habsburg rule. However, not everyone can live forever and Sarkotić have felt that his advanced age soon would force him into retirement. While he is still willing to advice the younger generations of generals and leaders in our realm, he will do it from the safety of retirement instead of on the field." #NT!
 AUShabsburg.21.a: "Thank You For Your Service" #NT!
  
 AUShabsburg.22.t: "A Proper Restoration" #NT!
 AUShabsburg.22.d: "President Viktor Dankl von Krasnik has fulfilled his role the past couple of years. Under his presidency, Otto has been able to secure his position as a leader of the Austrian people. Under the guise of an early retirement due to his age, von Krasnik will step down as president. This will leave the room open for Otto to be elevated to the presidency by the now loyal parliament. However, his time as president will be short. In order to ensure the realm's continuing stability, the Republic will be reorganized into the Austrian Kingdom, for a safe and secure society." #NT!
 AUShabsburg.22.a: "A New Order, Born From the Old" #NT!
  
 AUShabsburg.23.t: "Transylvania's Place in the Empire" #NT!
 AUShabsburg.23.d: "When the Austro-Hungarian Empire was formed, Transylvania became a land directly ruled by the Hungarians. This, even though the majority of the region are mostly Romanians, with only a minority population of Hungarians mostly consentrated in what's known as Székely Land. Some in our movement decries the lack of representation that the old system gave to the Romanian people in our Empire. They want us to make Transylvania, or at least a sizeable part of it, separate from Hungary. However, this could also come to bite us later, as many Hungarians view Transylvania as their land, not wanting to separate from it." #NT!
 AUShabsburg.23.a: "It's A Part of Hungary" #NT!
 AUShabsburg.23.b: "We Could Try to Divide Transylvania" #NT!
 AUShabsburg.23.c: "Give All of It to the Transylvanians" #NT!
  
 ### POLITICAL EVENTS ### 
  
 austria.15.t: "The Return to Normalcy" #NT!
 austria.15.d: "Government intervention to save the economy was a hated measure by the Austrian School of Economics, however it came out quite fruitful. Normalcy is returning to Austria, especially after the reactivation of social welfare programs, the people are going back to their jobs and banks are reopening. The horrible days of Black Monday are behind us, and now we only need to catch up with the world." #NT!
 austria.15.a: "An interesting economic experiment." #NT!
  
 austria.16.t: "A New President of the National Council" #NT!
 austria.16.d: "With the resignation of the last president of the Parliament, Karl Renner has risen to presidency of the National Council during a time of crisis. The "Democratic Revolution" created a parliamentary crisis. It is now the duty of the president unite the opposition before the crisis escalates." #NT!
 austria.16.a: "Good luck, Karl." #NT!
  
 austria.17.t: "Dollfuß Assumes Total Control of the Country" #NT!
 austria.17.d: "Dollfuß and the nation had enough of the political bickering of the Nationalrat. He has taken command of the nation against the traitors of Vienna. Vienna is a city, while Austria is a country. Dollfuß has taken matters into his own hands and commanded the Heimwehr inside Vienna alongside the Heer. Now we only witness as the Nationalrat descends into chaos. In a swift motion, key parliament buildings are evacuated due to "emergency concerns" and closed down by Dollfuß." #NT!
 austria.17.a: "There is a new father to the republic." #NT!
  
 # austria.18 REMOVED FOR THIS RELEASE 
  
 austria.19.t: "The Assasination of Dolfuss" #NT!
 austria.19.d: "After dissolving the parliament, forces from the Valkist militias in Vienna started to act. With their desire to takeover and unite Germany and Austria, a small group of Valkists stormed the Chancellery and demanded Dolfuss to leave the country and giveover control to the Valkist forces, when he denied the request, he was shot dead. The attempted coup wouldn't last though, as the Heimwehr and Bundesheer soon invaded the building and shot down the rebels. Schuschnigg and Rüdiger would meet and try to cooperate, to no avail as their differing thoughts got in the way. Now, the political battlefield is open to whoever can place their bids." #NT!
 austria.19.a: "Let's see how this ends..." #NT!
  
 austria.20.t: "The Negotiating Table" #NT!
 austria.20.d: "After what seems like months of violence and internal struggle, the Heimwehr and Schuschnigg agreed to talks, however, another man has spoken for a consensus. Otto Von Habsburg has sent a letter to both Rüdiger and Schuschnigg, promoting the idea of him being a middle man, someone who can try and make amends between the parties - Schuschnigg and Rüdiger refused the invite, but Schuschnigg thanked the would be Emperor for trying.\nThe meeting between Rüdiger and Schuschnigg is soon to arrive, and the cards will be shown to both players." #NT!
 austria.20.a: "Let's hope for peace at our time." #NT!
  
 austria.23.t: "Schuschnigg Assumes the Chancellorship" #NT!
 austria.23.d: "After the death of Dolfuss, Schuschnigg and Rüdiger have been in a political battle to see who will command Austria, but it finally seems like this is over. The political battlefield is now dominated by Schuschnigg and his loyal forces, with the Bundesheer taking over key points in Vienna and maintaining order, it seems that with the takeover, the Heimwehr has started to be absorbed by Schuschnigg and those who don't integrate are destroyed..." #NT!
 austria.23.a: "Long live Austria!" #NT!
  
 austria.24.t: "Negotiations Comes to a Stop" #NT!
 austria.24.d: "The unwillingness of men like Schuschnigg and Rüdiger to come to an agreement shouldn't be surprising. At the negotiation table between the two, they began to bicker. Quickly, the situation turned, with both men leaving the table without any formal agreement. With the situation in Austria more dire than ever, it looks likely that violence would resume. A portion of the Bundesheer not loyal to either men, together with non-aligned militia groups have begun to plan out other alternatives." #NT!
 austria.24.a: "Peace Seems to be Halting" #NT!
  
 austria.25.t: "Otto's Gambit" #NT!
 austria.25.d: "Otto von Habsburg hasn't been inactive during the negotiations between Schuschnigg and Rüdiger. Already, he is forming a circle of men who seek an alternative to the chaos that have held unto Austria since the death of Dollfuß. While an honourable man, some of Otto's loyalists have set forward a plan to end the chaos. The thing is, that it would involve a tiny accident at the Nationalrat just where the negotiations between Schuschnigg and Rüdiger have been taken place. Even if it is underhanded, it could be the only way to save Austria from the death spiral it's currently in." #NT!
 austria.25.a: "Better Be Silent" #NT!
  
 austria.26.t: "Negotiations Continues and Fails" #NT!
 austria.26.d: "Yet another day, yet another failed negotiation, yet more Austrian blood spilled on the streets due to the egos of these men. The plan is ready. Otto has just to give the word..." #NT!
 austria.26.a: "Explode the Nationalrat" #NT!
 austria.26.b: "Wait, No!" #NT!
  
 austria.27.t: "Otto's Triumph" #NT!
 austria.27.d: "An explosion rocked the streets of Vienna this afternoon. It originated at the Nationalrat. The first moments after the explosion, shooting was heard as both Heimwehr and Bundesheer forces loyal to either Rüdiger or Schuschnigg quickly began a few skirmishes against each other, believing they were under attack. After a few hours, however, the situation became to calm down as they found out there were no more explosions coming. What they also found, was both Schuschnigg and Rüdiger dead under the rubble that fell down during the explosion.\n\nForces loyal to Otto von Habsburg quickly entered the scene, with many of the now leaderless soldiers joining ranks. An investigation into the explosion is soon to take place, and while we know what has really happened, the blame will ultimately be placed upon some radical communist lone wolfs.\n\nFor now, Austria needs to heal. It needs to find a new form of normalcy and stability. It needs a steady hand; It needs Otto von Habsburg." #NT!
 austria.27.a: "The Habsburgs Are Back" #NT!
  
 austria.31.t: "Landbund Requests Grants to Farmers" #NT!
 austria.31.d: "As the crisis worsens, the Landbund has requested that we aid the small farmers with some subsides. Helping the farmers will hurt our budget a bit but the Landbund may leave if we don't concede." #NT!
 austria.31.a: "We will concede." #NT!
 austria.31.b: "We can't..." #NT!
  
 austria.32.t: "The Heimwehr's Position" #NT!
 austria.32.d: "With the death of Dollfuß, it seems that Austria is heading towards political turmoil. This is especially so because of the Heimwehr, which now acts as the main roadblock between Schuschnigg, the sucessor of Dollfuß's legacy and control of the Austrian state. Even if Schuschnigg for many Heimwehr leaders is far too moderate however, perhaps there is some merit in leaving things be and seeing how things pass by over the next month?" #NT!
 austria.32.a: "The Heimwehr recedes into the background." #NT!
 austria.32.b: "The Heimwehr shall fight vigorously!" #NT!
 austria.32.tt: "In 30 days, the following event will trigger:" #NT!
  
 austria.38.t: "$rhein.republic.23.t$" #NT!
 austria.38.d: "Today, a delegation from Vienna of all places have come in, suggesting an alliance. $rhein.republic.23.d$" #NT!
 austria.38.a: "We must come together!" #NT!
 austria.38.b: "This is absurd!" #NT!
  
 austria.39.t: "Koblenz Accepts!" #NT!
 austria.39.d: "The Koblenz government has accepted our offer of alliance against the false German government! With this, we now officially recognize them as the legitimate German government, in contrast to the tyrants of Berlin and together we shall struggle until victory or death!" #NT!
 austria.39.a: "Together against Berlin!" #NT!
  
 austria.40.t: "Rhenish Folly" #NT!
 austria.40.d: "In a truly unfortunate turn of events, our offer of friendship was rejected totally by the Koblenz government. It seems that we will have to fight for the future of our state without German brotherhood." #NT!
 austria.40.a: "Not every German government can be trusted..." #NT!
  
 # FOREIGN MINISTRY 
  
 austria.33.title: "[FROM.GetNameDef] Proposes a Deal." #NT!
 austria.33.desc: "An ambassador from [FROM.GetNameDef] has approached [ROOT.GetLeader] with a proposal of a defensive pact between [FROM.GetNameDef] and [ROOT.GetNameDef]. This plan is being sold as a way to keep peace in the region, but some within [ROOT.GetRulingPartyLong] believe it will allow [ROOT.GetNameDef] to expand without us being able to intervene." #NT!
 austria.33.a: "We shall accept this plan for peace." #NT!
 austria.33.b: "We should not align ourselves to [FROM.GetNonIdeologyName]." #NT!
  
 austria.34.title: "[FROM.GetNameDef] Accepts the Deal" #NT!
 austria.34.desc: "Our ambassador has returned with good news, [FROM.GetNameDef] and [ROOT.GetNameDef] have joined together to keep the peace. Hopefully this should stabilize the region." #NT!
 austria.34.a: "Great news!" #NT!
  
 austria.35.title: "[FROM.GetLeader] Says No!" #NT!
 austria.35.desc: "Our ambassador has returned with bad news, [FROM.GetNameDef] and [ROOT.GetNameDef] will not move closer together. Is this a sign of things to come?" #NT!
 austria.35.a: "A shame, but not unexpected." #NT!
  
 austria.36.title: "Jansa's Plan Within [CZE.GetNameDef]" #NT!
 austria.36.desc: "Field Marshal Jansa from [FROM.GetNameDef] has proposed to expand Jansa's forts into [ROOT.GetNameDef] across the Sudetendland, to prevent [GER.GetNameDef] from invading our countries with ease. We would need to contribute a lot of industrial power to the plan, but [GER.GetAdjective] expansionism will lead to war eventually." #NT!
 austria.36.a: "An excellent preventative measure." #NT!
 austria.36.b: "We cannot afford this." #NT!
  
 austria.37.title: "[FROM.GetLeader] Rejects Jansa's Plan" #NT!
 austria.37.desc: "Field Marshal Jansa has returned with bad news, [FROM.GetNameDef] will not contribute towards his plan of a fortification line in the Sudetenland." #NT!
 austria.37.a: "A shame, but not unexpected." #NT!
  
