 #EVENTS 
  
 austria.1.t: "The Status of Austria" #NT!
 austria.1.d: "In 1914, the Austrian Empire had entered the Great War with high hopes for victory, both to assert their dominance over Serbia, and to avenge the life of the Archduke. However, not all was well for them, as they found themselves getting thrown back more and more on every front they fought. The Austrian Empire and Austria-Hungary were on edge. They were finally pushed off of it in 1918, the Weltkrieg was over, Austria-Hungary fell, and in that fall, Austria would emerge as a separate nation once again. Hungary is a republic, and so is Austria now; they have both exiled their former emperor and princes. The Weltkrieg, a conflict started by Austria, would be the final nail in the coffin for the Austrian Empire.\n\nThe treaty which concluded Austria’s fate would prove worse than what many had thought possible. Austria would not only lose a majority of its territory, but it would even lose the privilege to have a respectable fighting force, constricted at a paltry thirty-thousand men not to mention ruinous reparations. To the Austrians, Austria had lost its independence - stripped of their liberty and their destiny put in the hands of the French. Revanchism thus took hold in Austria, from the communists to valkists.\n\nIn 1919 and 1920, the Austrian government made several attempts to unify with the German Republic to the north, but to no avail, as the Entente continued to reject any form of unification between the two nations. On 1 October 1920, the Austrian constitution was enacted and elections were soon called. The parliamentary elections of 1920 saw the Social Democrats lose their majority in parliament, and the new majority in the senate was the CSP. The CSP continued to have a comfortable majority for most of the years between 1920 and 1927, when their majority was almost broken.\n\nIn January 1927, nationalists attacked Schutzbund members heading back to the train station, injuring several and killing two people, one of them being an eight-year-old boy. These deaths were controversial, and their funeral on 2 February was attended by thousands, with trade unions declaring a 15-minute general strike throughout Austria to mark the funeral. On 5 July, the trial of three Frontkämpfervereinigung members who were accused of the shooting began in Vienna. After nine days, the jury acquitted them. This revolted the nation, and on 15 July, a revolt was called. It began with strikes, but after the police used force, the socialist militias began to open fire on the police and reactionary militias. In the end, the Landwehr had to be called in to disperse the revolt, but even after the revolt ended, Heimwehr militias broke into the homes of SPÖ-KPO-affiliated citizens and murdered them and their families. The April Revolt left a deep wound in the Austrian political system. After the revolt ended, SPÖ demanded justice for the families and workers who were shot and killed in the night raids, but not much was being done with the CSP government in place, and so in December 1929, another revolt was called, this time by the KPÖ.\nThe 1929 Revolt was the spark for the Austrian Civil War, the SPÖ sided with the government, this decision damaged even further their reputation. The civil war ended in January 1930, one month after the initial skirmishes. On the 12th of April 1930, there was an attempt by the Heimwehr to take over the government, however, it was quickly defeated and the many allies of then-chancellor Karl Buresch were dismissed. In 1931, the chancellor himself was dismissed and Engelbert Dollfuß would take over.\n\nAs a new year dawns, the international political climate has certainly changed for the worse. Germany in the north is looking increasingly revanchist, seeking unification with Austria by any means necessary. Our southern protector in Rome meanwhile faces internal problems that could interfere in a future decision to protect Austria from the Germans. Finally, France, the main enemy of Germany, and \"protector\" of Austria has been dealing with internal strife - endless strikes, extremist opposition clashing with each other in the streets and its military in shambles...It would be safe to assume that France is the new \"Sick man of Europe\".\n\nIn Austria, internal politics have also riled up once more, with the valkists having received guns and support from Germany to continue and deepen their operations, the communists have now created their own front to fight the valkists, the \"Front of National Freedom\". These two political forces have been at clashes with each other for at least 3 years now and it only intensifies with each year. The parliament is dominated by the conservative right while a sufficient social-democrat left opposition has gained support due to the conservative failure of protecting the streets and their own independence. It is safe to assume that Austria is alone in this new era, an era of brutal political violence." #NT!
 austria.1.a: "Towards freedom!" #NT!
  
