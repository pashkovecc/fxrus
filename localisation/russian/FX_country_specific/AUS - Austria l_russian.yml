#IDEAS
 AUS_treaty_of_saint_germain: "Сен-Жерменский договор" # Treaty of Saint-Germain
 AUS_treaty_of_saint_germain_desc: "Сен-Жерменский договор был навязан Австрии Антантой в 1919 году; договор положил конец Австро-Венгрии и Австрийской империи, 60% австрийских земель были захвачены другими странами, австрийские войска были ограничены 30 000 человек, а военные заводы должны были быть демонтированы. Австрии не пришлось платить репарации, но даже в этом случае земля была отнята, а унижение договора не было забыто населением.\n\nНесмотря на то, что договор нанес ущерб промышленности, австрийцы знают, как обойти договор. Традиция началась со второго канцлера. Игнац Шпейль будет использовать военизированные организации, чтобы держать армию на плаву и, что более важно, сохранять спокойствие населения.\n\nПереговоры между Австрией и Советом Антанты проводятся регулярно, австрийцы стараются изо всех сил смягчить последствия договора, и посредством переговоров Антанта изменила лимит с 30 000 человек до 70 000 человек в 1923 году.\nВ июне В 1935 году австрийские делегаты в Совете Антанты потребовали аннулирования Сен-Жерменского договора, они утверждали, что Антанта и Австрия должны сотрудничать вместе против немецкого реваншизма, и поэтому сессия должна состояться в январе 1937 года." # The Treaty of Saint-Germain was imposed on Austria by the Entente in 1919; the treaty put an end to Austria-Hungary and the Austrian Empire, 60% of the Austrian land was taken by other nations, the Austrian Forces were limited to 30.000 men, and the military factories were to be dismantled. Austria didn't have to pay reparations, but even so, the land taken away and the humiliation of the treaty has not been forgotten by the population.\n\nEven though the treaty took a toll on the industry, the Austrians know how to circunvent the treaty. The tradition began with the second chancellor. Ignaz Speil would use paramilitary organisations to keep the military afloat, and more importantly, to keep the populus quiet.\n\nNegotiations between Austria and the Entente Council are regular, the Austrians trying as much as they can to lower the effects of the treaty, and through negotiations, the Entente changed the limit from 30,000 men to 70,000 men in 1923.\nIn June 1935, Austrian delegates at the Entente Council demanded the nullification of the Treaty of Saint-Germain, they argued that the Entente and Austria should cooperate together against the German revanchism, and so, a session is to be held on January 1937.
