 austria.1.t: "Статус Австрии" # The Status of Austria
 austria.1.d: "В 1914 году Австрийская империя вступила в Великую войну с большими надеждами на победу, как для того, чтобы утвердить свое господство над Сербией, так и для того, чтобы отомстить за жизнь эрцгерцога. Однако не все у них было хорошо, поскольку их все больше и больше отбрасывали назад на каждом фронте, на котором они сражались. Австрийская империя и Австро-Венгрия были на грани. В 1918 году их окончательно вытеснили из нее, Вельткриг закончился, Австро-Венгрия пала, и этой осенью Австрия снова стала отдельной нацией. Венгрия — республика, как и Австрия сейчас; они оба сослали своего бывшего императора и принцев. Вельткриг, конфликт, начатый Австрией, станет последним гвоздем в гроб Австрийской империи.\n\nДоговор, определивший судьбу Австрии, окажется хуже, чем многие считали возможным. Австрия не только потеряет большую часть своей территории, но даже потеряет привилегию иметь приличную боевую силу, ограниченную жалкими тридцатью тысячами человек, не говоря уже о разрушительных репарациях. Для австрийцев Австрия потеряла свою независимость – лишилась свободы, а их судьба оказалась в руках французов. Таким образом, в Австрии распространился реваншизм, от коммунистов до валькистов.\n\nВ 1919 и 1920 годах австрийское правительство предприняло несколько попыток объединиться с Германской Республикой на севере, но безуспешно, поскольку Антанта продолжала отвергать любую форму объединения между двумя странами. 1 октября 1920 года была принята конституция Австрии, и вскоре были назначены выборы. На парламентских выборах 1920 года социал-демократы потеряли большинство в парламенте, и новым большинством в сенате стала CSP. CSP продолжала иметь комфортное большинство на протяжении большей части лет между 1920 и 1927 годами, когда их большинство было почти сломлено.\n\nВ январе 1927 года националисты напали на членов Шуцбунда, возвращавшихся на вокзал, ранив нескольких и убив двух человек, один из которых был восьмилетним мальчиком. Эти смерти вызвали споры, и на их похороны 2 февраля пришли тысячи людей, а профсоюзы объявили 15-минутную всеобщую забастовку по всей Австрии, чтобы отметить похороны. 5 июля в Вене начался суд над тремя членами Frontkämpfervereinigung, обвиняемыми в стрельбе. Через девять дней присяжные оправдали их. Это возмутило нацию, и 15 июля было объявлено восстание. Все началось с забастовок, но после того, как полиция применила силу, социалистические ополчения начали открывать огонь по полиции и реакционным ополчениям. В конце концов для разгона восстания пришлось вызвать Ландвер, но даже после того, как восстание закончилось, ополченцы Хеймвера ворвались в дома граждан, связанных с СПЁ-КПО, и убили их и их семьи. Апрельское восстание оставило глубокую рану в австрийской политической системе. После окончания восстания SPÖ потребовала справедливости для семей и рабочих, которые были застрелены во время ночных рейдов, но при наличии правительства CSP мало что было сделано, и поэтому в декабре 1929 года было вызвано еще одно восстание, на этот раз КПÖ.\nВосстание 1929 года стало искрой Гражданской войны в Австрии, SPÖ встала на сторону правительства, это решение еще больше повредило их репутации. Гражданская война закончилась в январе 1930 года, через месяц после первых стычек. 12 апреля 1930 года Хеймвер предпринял попытку захватить правительство, однако она была быстро разбита, а многие союзники тогдашнего канцлера Карла Буреша были отправлены в отставку. В 1931 году сам канцлер был уволен, и его место занял Энгельберт Дольфус.\n\nС наступлением нового года международный политический климат определенно изменился к худшему. Германия на севере выглядит все более реваншистской, стремясь к объединению с Австрией любыми необходимыми средствами. Тем временем наш южный защитник в Риме сталкивается с внутренними проблемами, которые могут помешать будущему решению защитить Австрию от немцев. Наконец, Франция, главный враг Германии и «защитница» Австрии, имеет дело с внутренними раздорами - бесконечными забастовками, экстремистской оппозицией, сталкивающейся друг с другом на улицах, и ее вооруженными силами в беспорядках... Можно было бы с уверенностью предположить, что Франция - новый «больной человек Европы».\n\nВ Австрии внутренняя политика также обострилась еще раз: валькисты получили оружие и поддержку от Германии для продолжения и углубления своих операций, теперь коммунисты создали собственный фронт борьбы с валькистами «Фронт национальной свободы». Эти две политические силы находятся в противостоянии друг с другом уже как минимум 3 года и с каждым годом оно только усиливается. В парламенте доминируют правые консерваторы, в то время как достаточная социал-демократическая левая оппозиция получила поддержку из-за неспособности консерваторов защитить улицы и свою собственную независимость. Можно с уверенностью предположить, что Австрия одинока в эту новую эпоху, эпоху жестокого политического насилия." # In 1914, the Austrian Empire had entered the Great War with high hopes for victory, both to assert their dominance over Serbia, and to avenge the life of the Archduke. However, not all was well for them, as they found themselves getting thrown back more and more on every front they fought. The Austrian Empire and Austria-Hungary were on edge. They were finally pushed off of it in 1918, the Weltkrieg was over, Austria-Hungary fell, and in that fall, Austria would emerge as a separate nation once again. Hungary is a republic, and so is Austria now; they have both exiled their former emperor and princes. The Weltkrieg, a conflict started by Austria, would be the final nail in the coffin for the Austrian Empire.\n\nThe treaty which concluded Austria’s fate would prove worse than what many had thought possible. Austria would not only lose a majority of its territory, but it would even lose the privilege to have a respectable fighting force, constricted at a paltry thirty-thousand men not to mention ruinous reparations. To the Austrians, Austria had lost its independence - stripped of their liberty and their destiny put in the hands of the French. Revanchism thus took hold in Austria, from the communists to valkists.\n\nIn 1919 and 1920, the Austrian government made several attempts to unify with the German Republic to the north, but to no avail, as the Entente continued to reject any form of unification between the two nations. On 1 October 1920, the Austrian constitution was enacted and elections were soon called. The parliamentary elections of 1920 saw the Social Democrats lose their majority in parliament, and the new majority in the senate was the CSP. The CSP continued to have a comfortable majority for most of the years between 1920 and 1927, when their majority was almost broken.\n\nIn January 1927, nationalists attacked Schutzbund members heading back to the train station, injuring several and killing two people, one of them being an eight-year-old boy. These deaths were controversial, and their funeral on 2 February was attended by thousands, with trade unions declaring a 15-minute general strike throughout Austria to mark the funeral. On 5 July, the trial of three Frontkämpfervereinigung members who were accused of the shooting began in Vienna. After nine days, the jury acquitted them. This revolted the nation, and on 15 July, a revolt was called. It began with strikes, but after the police used force, the socialist militias began to open fire on the police and reactionary militias. In the end, the Landwehr had to be called in to disperse the revolt, but even after the revolt ended, Heimwehr militias broke into the homes of SPÖ-KPO-affiliated citizens and murdered them and their families. The April Revolt left a deep wound in the Austrian political system. After the revolt ended, SPÖ demanded justice for the families and workers who were shot and killed in the night raids, but not much was being done with the CSP government in place, and so in December 1929, another revolt was called, this time by the KPÖ.\nThe 1929 Revolt was the spark for the Austrian Civil War, the SPÖ sided with the government, this decision damaged even further their reputation. The civil war ended in January 1930, one month after the initial skirmishes. On the 12th of April 1930, there was an attempt by the Heimwehr to take over the government, however, it was quickly defeated and the many allies of then-chancellor Karl Buresch were dismissed. In 1931, the chancellor himself was dismissed and Engelbert Dollfuß would take over.\n\nAs a new year dawns, the international political climate has certainly changed for the worse. Germany in the north is looking increasingly revanchist, seeking unification with Austria by any means necessary. Our southern protector in Rome meanwhile faces internal problems that could interfere in a future decision to protect Austria from the Germans. Finally, France, the main enemy of Germany, and \"protector\" of Austria has been dealing with internal strife - endless strikes, extremist opposition clashing with each other in the streets and its military in shambles...It would be safe to assume that France is the new \"Sick man of Europe\".\n\nIn Austria, internal politics have also riled up once more, with the valkists having received guns and support from Germany to continue and deepen their operations, the communists have now created their own front to fight the valkists, the \"Front of National Freedom\". These two political forces have been at clashes with each other for at least 3 years now and it only intensifies with each year. The parliament is dominated by the conservative right while a sufficient social-democrat left opposition has gained support due to the conservative failure of protecting the streets and their own independence. It is safe to assume that Austria is alone in this new era, an era of brutal political violence.
 austria.1.a: "К свободе!" # Towards freedom!

# Normal Austrian Events
 austria.2.t: "Расправа с валкистами в Австрии" # Valkist Crackdown in Austria
 austria.2.d: "Австрийцы начали операцию по подавлению валкистов, а также многих других пангерманских элементов в своей стране, в результате чего многие из этих сил пересекли границу с Германией, некоторые из них получили ценную информацию, а другие не смогли ничего предложить." # The Austrians have started an operation to crackdown on Valkists as well as many other pan-German elements in their nation, causing many of these forces to cross the border into Germany, some with valuable information and others with nothing to offer.
 austria.2.a: "Мы приедем за Австрией." # We will come for Austria.

