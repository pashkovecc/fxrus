# Black Wednesday

 AUSperfecteconomy.1.t: "Черная среда" # Black Wednesday
 AUSperfecteconomy.1.d: "По мере того как новости о крахе Лондонской фондовой биржи распространяются по Австрии, паника охватывает улицы, а грабежи и насилие становятся обычным явлением. Крах, последовавший за длительным спадом, вызвал потрясение в европейской экономике, приведя к спирали бедности, поскольку миллионы предприятий закрылись, а миллионы работников потеряли свои рабочие места. Поскольку паника в банках продолжалась, люди бежали в банки, чтобы забрать свои деньги и, возможно, спасти свои сбережения. Это привело к закрытию банков и полному отказу в снятии средств. Кризис достиг своего пика, и если мы позволим ему усугубиться дальше, могут вмешаться военные, и наша экономика может никогда не восстановиться полностью..." # As news of the London stock exchange crash spreads through Austria, panic grips the streets as looting and violence become common. The crash, following a prolonged decline, has sent shockwaves through the European economy, leading to a spiral of poverty, as millions of enterprises shutting down and millions of workers lost their jobs. As the panic continued in the banks, people ran to the banks to withdraw their money and maybe save their savings. This culminated in banks shutting down and withdrawals being outright refused. The crisis has reached its peak, if we allow it to worsen further, the military may intervene, and our economy may never recover completely...
 AUSperfecteconomy.1.a: "Да поможет нам Бог..." # May God help us...

 AUSperfecteconomy.2.t: "Худшее уже позади" # The Worst is Over
 AUSperfecteconomy.2.d: "Черная среда оказала ужасающее воздействие на австрийскую экономику и уровень жизни в стране. Однако худшие дни уже позади, и теперь мы можем попытаться полностью восстановиться." # Black Wednesday had a horrifying effect on the Austrian economy and the living standards of the country. However, the worst days are over, and now we can attempt a full recovery.
 AUSperfecteconomy.2.a: "К восстановлению экономики!" # Towards economic recovery!

 AUSperfecteconomy.3.t: "Оружие для Хеймвера" # Weapons to the Heimwehr
 AUSperfecteconomy.3.d: "Печально известный Сен-Жерменский договор гласит, что любой военный завод должен быть одобрен и рассмотрен советом, прежде чем можно будет начать строительство. Однако в нем не говорится, что совет должен одобрить покупку правительством частной фабрики для военных целей. Однако существует препятствие, заключающееся в том, что для армии не может быть произведено никакое оборудование; вместо этого все это должно быть перенаправлено на покупку гражданским лицам. Однако Хеймвер по-прежнему считается гражданской организацией, не связанной с военными." # The infamous Treaty of Saint-Germain states that any military factory must be approved and reviewed by the council before construction can begin. However, it does not state that the council must approve the government's purchase of a privately owned factory for military purposes. There is an obstacle, however, in that no equipment can be produced for the military; instead, all of it must be redirected to the civilians to purchase. The Heimwehr, however, is still considered a civilian organization with no ties to the military.
 AUSperfecteconomy.3.a: "Лучшее, что мы можем сделать на данный момент." # The best we can do at the moment.

 AUSperfecteconomy.4.t: "Австрийское предложение Антанте" # The Austrian Proposal to the Entente
 AUSperfecteconomy.4.d: "В июне 1935 года австрийские делегаты в Совете Антанты потребовали аннулирования Сен-Жерменского договора, мотивируя это следующим образом: «В качестве меры защиты от реваншистской Германии, начинающей перевооружаться, и для обеспечения безопасности Антанты и Австрии Австрия должна также начать перевооружение». Заседание, на котором решалось, будет ли договор признан недействительным, состоялось первого января 1937 года. Сербы выступили против австрийских требований, ссылаясь на перевооружение Австрии как на «средство отвоевать свою империю», однако последствия «Черной среды» и продолжение политики реваншизма Дресслера дали французам и итальянцам повод принять австрийские требования. В конце концов было решено, что Сен-Жерменский договор будет аннулирован и Австрии будет разрешено полное перевооружение." # In June 1935, Austrian delegates at the Entente Council demanded the nullification of the Treaty of Saint-Germain, citing the reasons for it as: “A measure of defence against a revanchist Germany that is starting to rearm itself, and to guarantee the Entente and Austrian safety, Austria should also begin to rearm”. The session that would decide whether the treaty would or not be nullified was held on the first of January, 1937. The Serbians opposed the Austrian demands, citing the rearmament of Austria as a “means to reconquer their empire”, however, the effects of Black Wednesday and the continuation of Dressler’s policy of revanchism gave the French and Italians the reasoning to accept the Austrian demands. In the end, it was decided that the Treaty of Saint-Germain would be nullified and Austria was permitted full rearmament.
 AUSperfecteconomy.4.a: "Сен-Жерменский договор окончательно умер." # The Treaty of Saint-Germain is finally dead.

# Militias

 AUSmilitias.1.t: "Ополченцы SDAPÖ и CSP сражаются в Вене" # SDAPÖ and CSP Militias Fight at Vienna
 AUSmilitias.1.d: "С момента создания Первой Республики ополченцы собирались с оружием в руках, пытаясь совершить революцию или заставить замолчать оппозицию. Ostmärkische Sturmscharen (OS) обычно не видно на поле боя, обычно в поисках боев приходит Хеймвер. Однако ОС является уникальной боевой силой, которую возглавляет выдающийся Курт фон Шушниг. С другой стороны, Республиканский Шуцбунд (РС) является ветераном городских боев, пережившим годы жестокой войны и ставшим еще более радикальным после событий 15 июля. Три основных формирования — Хеймвер, Остмаркише Штурмшарен и Республиканский шуцбунд — ведут постоянные бои по всей стране. Однако сегодняшний день был более кровавым, чем «обычный».\n\nНа улицах Вены эскадроны ополченцев РС шли по городу, в конечном итоге оказавшись в противостоянии с ополченцами ОС, как вооруженными, так и готовыми к бою. Люди торопливо начали расходиться, поняв, что вот-вот начнутся бои. И тогда в ОС была брошена граната. Бои были тяжелыми, но ополченцы ОС понесли полные потери, а их эскадрильи были вынуждены отступить РС, понесшие минимальные потери. Однако есть одна интересная вещь: гранаты — это оборудование военного уровня, к которому имеют доступ немногие в армии.\n\nЭто означает, что кто-то дал РС оборудование военного уровня..." # Ever since the creation of the First Republic, militias gathered up in arms, trying to achieve revolution or silence the opposition. The Ostmärkische Sturmscharen (OS) is not generally seen on the battlefield, generally, the Heimwehr is the one to come looking for fights. The OS is a fighting force like no other though, being lead by prominent Kurt von Schuschnigg. On the other hand, the Republikanischer Schutzbund (RS) is a veteran of urban fighting, having survived years of brutal war - and being even more radicalised by the events of the 15th of July. The three main militias, Heimwehr, Ostmärkische Sturmscharen, and Republikanischer Schutzbund, are in constant battles throughout the country. However, today was bloodier than ''regular''.\n\nIn the streets of Vienna, squadrons of RS militias walked through the city, eventually finding themselves in a confrontation with OS militias, both armed and ready to fight. In a hurried tone, people started leaving as they realised fighting was about to commence. And then, a grenade was thrown at the OS. The fighting was heavy, but the OS militias suffered a total loss, with their squadrons forced to retreat by the RS, which suffered minimal losses. One interesting thing, though, is that grenades are military-grade equipment, that few in the military have access to.\n\nThat means that someone gave the RS military-grade equipment...
 AUSmilitias.1.a: "Что-то происходит за кулисами..." # Something is going on behind the curtain...

 AUSmilitias.2.t: "Возмездие в Вене" # Retaliation in Vienna
 AUSmilitias.2.d: "Настало время расплаты с социалистами. Их военное оборудование и жестокая жестокость по отношению к невинным австрийцам могли вызвать только один праведный ответ. Для этого был заключен союз между Хеймвером и Восточными штурмшаренами. Войдя в Вену в поисках крови, они вскоре обнаружили, что Республиканский шуцбунд поджидает их, вооруженный и готовый.\n\nВ последовавшем хаосе по улицам Вены пронесся град пуль и гранат. Хотя мало кто ожидал, что борьба будет легкой, в конечном итоге Республиканский шуцбунд отступил на удивление быстро, но с одной плохой новостью пришла победа правых военизированных формирований. В ходе борьбы погиб ключевой офицер Шуцбунда, которого любили не только члены военизированных формирований, но и население Вены. Кажется, расплата за его смерть наступит скоро..." # It was time for payback against the socialists. Their military-grade equipment and vicious brutality against innocent Austrians could only beget a single righteous response. For this, an alliance between the Heimwehr and the Ostmärkische Sturmscharen was struck. As they entered Vienna looking for blood, they would soon find however that the Republikanischer Schutzbund was waiting for them, armed and ready.\n\nIn the chaos that ensued, a hail of bullets and grenades were exchanged across the streets of Vienna. While few had expected the fight to be easy, ultimately the Republikanischer Schutzbund retreated surprisingly quickly, but with one piece of bad news came victory for the right-wing paramilitaries. In the struggle, a key officer of the Schutzbund had perished, well-loved by not just the paramilitary members but also the Viennese population. It seems that retribution for his death will come soon...
 AUSmilitias.2.a: "Вы, дураки, это только соблазнит дьявола!" # You fools, that will only entice the devil!

 AUSmilitias.3.t: "Забастовки в Вене" # Strikes in Vienna
 AUSmilitias.3.d: "Ожидалось, что фурор по поводу смерти офицера шуцбунда будет большим, но, конечно, не до такой степени, которую мы можем наблюдать сейчас. Под руководством Шуцбунда социал-демократы призвали к всеобщей забастовке в Вене до тех пор, пока правительство не привлечет к ответственности военизированных формирований, застреливших офицера Шуцбунда.\n\nЭто привело к нарушению нормальной жизни в городе, а другие забастовки сочувствия уже вспыхнули по всей остальной стране. Присоединившись к толпе, такие радикалы, как Отто Бауэр, настоятельно призвали правительство предпринять шаги, чтобы начать судебное преследование подразделений Штурмшарена и Хеймвера, участвовавших в карательном ударе, угрожая, что если они не сделают этого, то их можно будет обвинить как не более чем агентов реакции. Такая угроза не осталась незамеченной и лишь способствовала радикализации нации." # The furor over the death of the Schutzbund officer was expected to be great, but certainly not to the extent that we can now witness. With the Schutzbund at their beckoning, the Social Democrats have called for a general strike in Vienna until the government prosecutes the paramilitary men who shot down the Schutzbund officer.\n\nThis has caused a breakdown of regular life in the city, with other sympathy strikes already breaking out throughout the rest of the nation. Joining the crowd, radicals like Otto Bauer have strongly urged the government to take steps to begin prosecution of the Sturmscharen and Heimwehr units involved in the retributive strike, threatening failure to do so would indict them as nothing more than agents of reaction. Such a threat has not gone unnoticed, and has only served to radicalize the nation.
 AUSmilitias.3.a: "И вот крысы показывают свое истинное лицо." # And so the rats show their true face.

 AUSmilitias.4.t: "Ополчение подавляет нападающих" # Heimwehr Suppresses Strikers
 AUSmilitias.4.d: "Из многих антисоциалистических элементов в Австрии немногие вызывают такой страх, как Хеймвер. В общих чертах, Хеймвер представляет собой простое антисоциалистическое патриотическое военизированное формирование, но он состоит из местных организаций, действующих в австрийских провинциях, причем каждая местная организация Хеймвера имеет особые отличия друг от друга. Хотя исторически это делало их громоздкими в борьбе с правительством, сейчас эти вопросы были омрачены венскими забастовками.\n\nНазвав забастовки ничем иным, как большевистской провокацией, и вновь потребовав суровых мер против своего врага в Шуцбунде, Хеймвер обошёл одобрение правительства, взяв на себя инициативу и отправившись в Вену, чтобы разобраться с забастовщиками. Пока кровь течет по улицам Вены, когда силы Хеймвера разбивают забастовщиков-социалистов, осуждение исходит со всех слоев австрийского общества, включая даже парламент. Тем не менее, похоже, что сам канцлер оставался крайне молчаливым в отношении событий дня, поскольку забастовки в Вене бесцеремонно завершились." # Out of the many anti-socialist elements in Austria, few are as feared as the Heimwehr. While broadly speaking a simple anti-socialist patriotic paramilitary, the Heimwehr consists of the local organizations that across the Austrian provinces with each local Heimwehr organization having particular differences from one another. While this has historically made them unwieldy in fighting the government, such issues have now been overshadowed by the Vienna strikes.\n\nDecrying the strikes as nothing but Bolshevik provocation and once again demanding a severe crackdown on their nemesis in the Schutzbund, the Heimwehr have bypassed the government’s approval by taking the initiative and marching into Vienna to deal with the strikers. As blood runs through the streets of Vienna as Heimwehr forces beat down the socialist strikers, condemnation has come from all rungs of Austrian society including even the parliament. Still, it appears that the chancellor himself has remained awfully tight-lipped on the day’s events as the Vienna strikes come to an unceremonious end.
 AUSmilitias.4.a: "Мы можем использовать это." # We can use this.

 AUSmilitias.5.t: "Смерть Ричарда Стейдла" # The Death of Richard Steidle
 AUSmilitias.5.d: "Подавление Хеймвером венских забастовок оказалось гораздо менее желательным, чем надеялись руководители Хеймвера. Жестокость, с которой Хеймвер подавлял забастовки, потрясла даже ярых консерваторов, причем некоторые открыто опасались диктатуры Хеймвера в духе Дресслера на севере или сербов на юге. От такой мысли у многих застыла кровь, но она также побудила многих сторонников социалистов присоединиться к Шуцбунду.\n\nВ этот день в Граце федеральный лидер Хеймвера Рихард Штайдл направлялся на встречу со Штирийским Хеймвером, чтобы спланировать пути выхода из новых проблем, вызванных подавлением Вены. Однако все, что приходило ему в голову, было напрасным, поскольку он был убит по дороге на встречу. Виновником предположительно был одинокий коммунист, хотя большинство подозревает, что этого убийцу на самом деле подговорил не кто иной, как ненавистный Шуцбунд. В любом случае расплата будет." # The Heimwehr’s suppression of the Vienna strikes has turned out to be far less desirable than the Heimwehr leaders had hoped. The brutality with which the Heimwehr smashed the strikes shook even ardent conservatives with some openly fearing a Heimwehr dictatorship in the vein of Dressler to the north or like the Serbs in the south. Such a thought has caused the blood of many to run cold, but it has also caused many socialist sympathizers to begin throwing their lot in with the Schutzbund.\n\nOn this day in Graz, federal leader of the Heimwehr Richard Steidle was on his way to meet Styrian Heimwehr to plan ways out of the new challenges that the suppression of Vienna had brought. Whatever was running through his mind however will be for naught, as he was assassinated on his way to the meeting. The culprit was supposedly a lone communist, though most suspect that this assassin was actually put up to it by none other than the hated Schutzbund. Either way, there will be payback.
 AUSmilitias.5.a: "Они перешли черту, начинают военные приготовления." # They have crossed the line, begin military preparations.

 AUSmilitias.6.t: "Орден Рамека" # Ramek’s Order
 AUSmilitias.6.d: "Похоже, что по приказу канцлера армия начала подготовку к немедленному разгрому Республиканского шуцбунда. Однако такой шаг на самом деле может только спровоцировать дальнейшие гражданские волнения, и даже если не принимать во внимание возмущение, которое этот массовый сдвиг в сторону правой диктатуры может вызвать в Париже или Риме, практический эффект может быть даже недостаточным, чтобы предотвратить революцию. Таким образом, в соответствии с законом министр внутренних дел Рудольф Рамек приказал армии прекратить подготовку и демобилизоваться - все хорошо.\n\nКонечно, не все хорошо. Канцлер Дольфус, со своей стороны, совершенно ясно выразил свое удовлетворение. Тем не менее, президент и более умеренные христианско-социальные партии отказались позволить Дольфусу отменить приказ Рамека или даже наказать своенравного министра, хотя его судьба в будущем кабинете министров весьма сомнительна, если не сказать больше." # It seems that on the orders of the chancellor, the army has begun preparations to crush the Republikanischer Schutzbund at once. Such a move though could only really spark further civil unrest, and even setting aside the outrage that this wholesale shift towards right-wing dictatorship could spark from Paris or Rome, the practical effect may not even be sufficient to stave off revolution. As such and in accordance with law, interior minister Rudolf Ramek has ordered the army to stop preparations and to demobilize - all is well.\n\nOf course not all is well. Chancellor Dollfuß for his part has made his pleasure abundantly clear. Still, the president and more moderate Christian-Socials has refused to let Dollfuß override Ramek’s order or even punish the wayward minister, though his fate in a future cabinet is highly dubious to say the least.
 AUSmilitias.6.a: "Неприятный выбор." # A distasteful choice.

 AUSmilitias.7.t: "Красная Вена горит" # Red Vienna Burning
 AUSmilitias.7.d: "Красная Вена, как ее называют за социалистическую деятельность, наконец пришла к революции. Выборы были отложены из-за широкомасштабного восстания и беспорядков по всей Австрии, с задержкой на два месяца, благодаря этой революции, очевидно, что Австрия находится на шаг от пропасти.\n\nНекоторые называют эту революцию демократической революцией, однако мы знаем, что эта революция - просто фасад для установления социалистического правительства. Правительство зашло в тупик, как решить этот вопрос, что привело к отставке президента Национального собрания, а это означает, что следующим президентом станет представитель СДАПÖ, который обязательно попытается вести переговоры с бунтовщиками." # Red Vienna, as it is called for the socialist activity has finally come to revolution. The elections have been post-poned due to widespread revolt and unreast all across Austria, with the delay of two months, with this revolution, it is certain that Austria is a step from the abyss.\n\nSome call this revolution a democratic revolution, however, we know that this revolution is simply a facade to install a socialist government. The Government is at an impasse on how to solve this issue, which caused the resignation of the President of the Nationalrat, meaning that the next President is the SDAPÖ representative, which will defitinely try to negotiate with the rioters.
 AUSmilitias.7.a: "Отлично, социалисты в президентстве." # Great, socialists in the Presidency.


# Reforms

 AUSreforms.1.t: "Фискальные реформы" # The Fiscal Reforms
 AUSreforms.1.d: "Государство испытывает огромные проблемы с выплатой долгов и обеспечением работоспособности государственной машины. Чтобы предотвратить дальнейшее развитие кризиса, министр экономики Австрии объявил режим жесткой экономии. Государственные пенсии ветеранам будут отменены, а зарплата политиков сократится вдвое. Все эти изменения будут действовать до тех пор, пока режим жесткой экономии не будет отменен." # The state is undergoing massive problems with debt payments and keeping the state machinery working. To prevent further spiraling down the crisis, the economic minister of Austria has declared a state of austerity. State pensions to veterans will be revoked, and politicians' pay is being cut in half. All of these changes will continue in effect until the austerity state is dropped.
 AUSreforms.1.a: "Всё, чтобы положить конец этому кризису!" # Anything to end this crisis!

 AUSreforms.3.t: "Судьба компании Steyr-Daimler-Puch" # The Fate of Steyr-Daimler-Puch
 AUSreforms.3.d: "Steyr-Daimler-Puch — военная компания, возникшая после слияния компаний Steyr, Austro-Daimler и Puch в одну компанию. У компании были финансовые проблемы с момента ее создания из-за Сен-Жерменского договора, однако Черная среда превратила финансовые проблемы в финансовый крах, и теперь компании грозит банкротство. Поскольку компания является крупнейшей компанией по производству вооружений в Австрии, в этом также участвует государство, и некоторые предлагают вмешаться, чтобы предотвратить банкротство компании." # Steyr-Daimler-Puch is a military-based company that came into existence after the fusion of Steyr, Austro-Daimler and Puch into one company. The company has been in financial trouble ever since it came into existence due to the Treaty of Saint-Germain, however, Black Wednesday has made the financial trouble turn into financial ruin and now, the company faces bankruptcy. Since the company is the biggest armament company in Austria, the state is also being involved and some suggest intervention to prevent the company's bankruptcy.
 AUSreforms.3.a: "Национализировать компанию" # Nationalise the Company
 AUSreforms.3.b: "Утихомирить компанию." # Subside the company.
 AUSreforms.3.c: "Не вмешивайтесь." # Don't intervene.

 AUSprotests.1.t: "Протесты против мер жесткой экономии в Вене" # Protests Against Austerity in Wien
 AUSprotests.1.d: "В Вене начались беспорядки с тех пор, как был объявлен режим жесткой экономии. Многие ветераны Великой войны считают, что эта мера — плевок в лицо тем, кто встал на фронт, чтобы положить конец всем войнам." # Wien was thrown into a state of riots ever since the state of austerity has been declared. Many veterans of the Great War feel as if the measure is a spit in the face of those who put themselves at the front in the war to end all wars.
 AUSprotests.1.a: "Блин!" # Damn it!

# Socialist Terrorist

 AUSterrorism.1.t: "Социалистический терроризм" # Socialist Terrorism
 AUSterrorism.1.d: "Поскольку социалисты продолжают сопротивляться нашему правлению, их тактика терроризма наносит ущерб нашей системе и обнажает слабость нашего режима. Мы должны как можно скорее разобраться с этими преступниками." # As the socialists continue to resist our rule, their tactics of terrorism are hurting our system and revealing weakness in our regime. We must address these criminals as soon as possible.
 AUSterrorism.1.a: "Блин!" # Damn it!

# CS

# SDAPÖ

# Schuschnigg

 ausks.1.t: "Переговоры с Ландбундом" # Talks with the Landbund
 ausks.1.d: "Ландбунд, который находился в оппозиции к ХС после национального кризиса, согласился на переговоры. Внутри Национального совета Ландбунд ясно дал понять о поддержке мелких фермеров - они добавили к этому заявление о том, что земельная реформа не будет проводиться широко." # The Landbund, which was in opposition to the CS after the national crisis has agreed to talks. Inside the Nationalrat, the Landbund made themselves clear about supporting small farmers - they added on top of it, a declaration that land reform will not be carried out extensively.
 ausks.1.a: "Мы надеемся сотрудничать как единое целое." # We hope to cooperate as one.
 ausks.1.b: "Это что, фермерский штат?" # What's this, a farmer's state?

 ausks.3.t: "Слабая завеса" # The Weak Veil
 ausks.3.d: "Демократия, еще действовавшая в Австрийской империи, была сдержана благородной властью Императора, после ухода Императора французские и итальянские дьяволы разрушили наши учреждения, они заменили эти вневременные учреждения копией своей болезни;\n\nПарламентаризм - институт слабый, немощный и отвратительный. Те, кто жил при нем, могут согласиться в одном: парламентаризм – это позор австрийской нации. С приходом к власти Фатерландского фронта, молчанием по радио СДАПО и КПО, а молодежными организациями, вынужденными уйти в подполье, путь для нас открыт. Наконец-то наступит время положить конец институту, который ненавидят все «новые консерваторы». То есть демократия." # Democracy, while still acting in the Austrian Empire, was checked by the noble power of the Emperor, after the Emperor went away, the French and Italian devils dismantled our institutions, they replaced those timeless institutions with a replica of their disease;\n\nParliamentarism - a weak, frail and disgusting institution. Those who lived under it can agree on one thing: Parliamentarism is a disgrace to the Austrian nation. With the Vaterland Front taking power, the SDAPÖ and KPO being radio silent, and Youth Organizations forced underground, the path is clear to us. It will finally be the time to put an end to the institution all of the "New Conservatives" hate. That is, democracy.
 ausks.3.a: "Пусть горит." # Let it burn.

 ausks.4.t: "Громкие динамики, громкие актеры" # Loud Speakers, Loud Actors
 ausks.4.d: "Запрет социалистических партий всех мастей, а не просто инструмент советского вмешательства, каким является КПÖ, понравился очень немногим умеренным. Фактически, это только придало смелости Республиканскому шуцбунду и их социал-демократическим повелителям усилить сопротивление нашему правительству. В связи с этим вопрос о серьезности все еще остается. Должны ли мы пойти до конца и добиться искоренения каждой большевистской организации? Подобная вещь может потребовать такого уровня тотального наблюдения и контроля, который заставит умеренных желудков сжаться, что потребует принятия решения по этому вопросу." # The ban on socialist parties of all stripes rather than just the tool of Soviet interference that is the KPÖ has endeared very few moderates. In fact, it has only emboldened the Republikanischer Schutzbund and their Social Democrat overlords to intensify resistance against our government. To this end, the question of severity still remains. Should we go all the way and ensure that every single Bolshevik organization is rooted out? Such a thing could require a level of total surveillance and control that would make moderates’ stomachs sink, necessitating a decision on the matter.
 ausks.4.a: "Держите этих нарушителей спокойствия в подполье." # Keep these troublemakers underground.
 ausks.4.b: "Никакой пощады." # No quarter.

 ausks.5.t: "Дуэль двух сторон" # The Duel of Two Parties
 ausks.5.d: "Республиканский шуцбунд всегда представлял собой величайшую угрозу нашему представлению о благочестивой, единой и свободной Австрии. За своими вводящими в заблуждение лозунгами равенства и либеральной демократии их лучшие представители продвигают слабый парламентаризм, в то время как их худшие практически на коленях просят советскую интервенцию в нашу страну.\n\nВозвышение Шушнига не заставило их отступить. Фактически, они никогда не были более смелыми в своем желании свержения правительства и создания красного государства в Южной Европе. Неважно, что такое государство будет требовать вмешательства со всех сторон, оно просто принесет гибель австрийскому народу. Пока они собираются на своих омерзительных фабриках, чтобы уничтожить нацию, мы должны подготовиться к борьбе с социал-демократами за судьбу австрийской нации. Австрийский народ выберет – хлеб или большевизм?" # The Republikanischer Schutzbund have always been the greatest threat to our vision of a godly, united and free Austria. Behind their misleading slogans of equality and liberal democracy, their best promote feeble parliamentarianism while their worst are practically begging hands and knees for a Soviet intervention into our country.\n\nThe rise of Schuschnigg has not caused them to back down either. In fact, they have never been bolder in desiring an overthrow of the government and the creation of a red state in South Europe. Never mind that such a state would be asking for an intervention from all sides, it would simply bring ruin upon the Austrian people. As they rally in their ghoulish factories to destroy the nation, we must prepare ourselves as we face down the Social Democrats for the fate of the Austrian nation. The Austrian people shall choose - bread or Bolshevism?
 ausks.5.b: "Пусть они приходят!" # Let them come!

 ausks.6.t: "Триумф Создателя королей" # The Kingmaker’s Triumph
 ausks.6.d: "Поскольку Хеймвер медленно интегрировался посредством политического вымогательства, их лидер Рюдигер заметил свою изоляцию. Потеряв желание продолжать политическую карьеру, стало очевидно, что выход на пенсию – единственный выход. Теперь вопрос времени, переживет ли Рюдигер пенсию." # With the Heimwehr being slowly integrated via political extortion, their leader, Rüdiger would notice his isolation. Losing the will to continue his political career, it became apparent that retirement is the only choice. It is now a matter of time to see if Rüdiger will survive retirement.
 ausks.6.a: "Поверьте, у него будет хороший дом в Нижней Австрии." # He will have a nice house in Lower Austria, believe me.

 ausks.7.t: "Объединение, даже в экономике" # United, Even in the Economy
 ausks.7.d: "Австрийская нация разнообразна по мышлению, и одной из таких мыслей является экономическая мысль. Разгром Австрии по этому вопросу привлек международное внимание и стал центром внимания всех экономистов. Однако лондонский крах наконец показал миру опасность таких методов.\n\nС крахом миллионы людей остались без работы, денег и еды, что стало международной трагедией. По таким причинам, что наш канцлер и его кабинет решили пойти дальше простых правил, экономика должна работать как единое целое. В одном мозг контролирует и принимает решения, а в другом работа автоматизируется внутри системы." # The Austrian nation is diverse in thought, and one of those thoughts are the economic thought. Austrian debacle on the matter gained international attention, becoming a centre for all economists. However, with the London Crash, it was finally shown to the world the dangers of such methods.\n\nWith the crash came millions of people without work, money or food, internationally, a tragedy. For reasons like this that our Chancellor and his Cabinet decided to go further than simple regulations, the economy must work like a body. One where the brain controls and decides, with the other work being automated within the system.
 ausks.7.a: "Это должно решить главную проблему." # That should deal with the main problem.

 ausks.8.t: "Путеводитель независимой Австрии" # The Guide of Independent Austria
 ausks.8.d: "Хотя мы немцы, Австрия — это больше, чем просто еще одна немецкая провинция, неизбежно связанная с прихотями Пруссии. Мы в некоторых отношениях более культурны, чем хотелось бы верить нашим северным братьям, и мы определенно держимся нашей веры сильнее, чем даже якобы набожные баварцы, которые первыми отдали себя большевистскому валькистскому движению.\n\nС этой целью Шушниг призвал к возобновлению усилий с нашей стороны по отделению от Германии. Правительство-изгой в Берлине уже ненавидит нас просто за то, что мы свободны, поэтому давайте ответим тем же и заставим весь мир понять, что Австрия всегда будет независимой от тиранической Германии!" # While we are German, Austria is more than just another German province to inevitably be bound to Prussian whims. We are more cultured in certain ways than our northern brothers would like to believe, and we certainly hold to our faith more strongly than even the supposedly devout Bavarians who were the first to give themselves up for the Bolshevik-esque Valkist movement.\n\nTo this end, Schuschnigg has called for a renewed effort on our part to separate ourselves from Germany. The rogue government in Berlin already hates us for simply being free, so let us return the favor and make the whole world understand that Austria will always be independent of a tyrannical Germany!
 ausks.8.a: "Австрия всегда будет свободной!" # Austria will always be free!

 ausks.9.t: "Уничтожение немецких сетей" # Eliminating the German Networks
 ausks.9.d: "Не новость, что количество немецких сетей пангерманизма растет. С тех пор, как Австро-Венгерская империя разгромилась в Великой войне, пороховая бочка взорвалась, и национализм и пангерманизм стали безудержными. Проблема пангерманизма на данный момент заключается в том, что мы, австрийцы, не можем позволить, чтобы нашей независимостью играли, особенно когда Германия начинает обновлять свою военную машину.\n\nЕсли Австрия хочет оставаться независимой, мы должны вычистить крыс. По правде говоря, Дольфус и Рамек уже тайно подавляли многие из этих движений, но теперь мы можем без каких-либо опасений ликвидировать их." # It is not news that the German Networks for Pan-Germanism are increasing. Ever since the degeat of the Austrian-Hungarian Empire in the Great War, the gunpowder barrel exploded and nationalism and Pan-Germanism runs rampant. The problem with Pan-Germanism at the moment is that, we Austrians, cannot allow our independence to be played with, especially with Germany starting to renew their war machine.\n\nIf Austria is to remain independent, we must clean the rats out. Truth be told though, Dolfuss and Ramek have already been surpressing many of these movements in secrecy, but now we can eliminate them without any worries.
 ausks.9.a: "Уберите отсюда этих крыс!" # Get these rats out of here!

 ausks.10.t: "Возрождение австрийского национализма" # Rejuvanating Austrian Nationalism
 ausks.10.d: "Когда наш режим пришел в Австрию, миллионы австрийцев праздновали, что годы его правления наконец-то закончатся. Однако со временем этот национализм в конечном итоге начнет остывать, и пангерманисты рассчитывают на то, что это уничтожит австрийцев изнутри.\n\nМы, австрийцы, не должны забывать о своих настоящих корнях. Немец или нет, Австрия должна быть на первом месте душой и телом!" # When our regime came to Austria, millions of Austrians commemorated, as the years of led would finally end. However, with time, that nationalism will eventually start cooling off, and Pan-Germanists count on that to destroy the Austrians from inside out.\n\nWe Austrians must not forget our actual roots. German or not, Austria should come first, in soul and body!
 ausks.10.a: "Как и должно быть." # As it should be.

 ausks.12.t: "Где сражаются орлы" # Where Eagles Clash
 ausks.12.d: "Когда Германская империя и Австрийская империя пали, в страну пришла волна национализма, в то же время по Европе прокатилась революционная мысль. На закате Габсбургской империи пангерманизм вновь возникнет, как это произошло в 1848 году. Однако Антанта желала, чтобы пангерманский союз никогда не возникал, поскольку у Германии было бы больше территории, чем в начале войны, и, что более важно, у них была бы большая промышленность.\n\nВ конце 1920-х годов Австрия приняла бы свой статус независимой нации, даже если население не соглашалось. Однако во время валкистского переворота 1932 года в Германии пангерманисты начали вновь укореняться в австрийской политике. Вскоре Австрия обнаружит, что их северный сосед больше не считает ее независимой страной, и это будет вопросом времени, когда прусский орел спустится, чтобы поймать свою добычу. Теперь пришло время подготовить и, что более важно, пронзить прусского орла!" # As the German Empire and the Austrian Empire fell, a wave of nationalism came to the country, while at the same time, revolutionary thought swept through Europe. At the ends of the Habsburg Empire, Pan-Germanism would reemerge as once it did in 1848. However, the Entente wished for a Pan-German union to never happen, as Germany would have more territory than at the start of the war, and more importantly, they would have a greater industry.\n\nDuring the late 1920s, Austria would accept its status as an independent nation, even if the population disagreed. However, during the Valkist coup of 1932 in Germany, Pan-Germanist started to re-root itself in Austrian politics. Soon, Austria would discover that their northern neighbour no longer saw them as an independent country, it would be a matter of time until the Prussian eagle descended to catch its prey. Now, it is the time to prepare, and more importantly, impale the Prussian eagle!
 ausks.12.a: "У твоих ног, солдат!" # At your feet, soldier!

 ausks.13.t: "Отдел пропаганды" # Propaganda Department
 ausks.13.d: "Пропаганда — оружие против всех врагов. Будь то политическая или военная пропаганда, она имеет широкую пользу для правительства, мы должны убедить души людей в том, что наше дело правое, даже если оно и неверно. Создание отдела пропаганды облегчит нам задачу, поскольку мы сможем действовать более организованно для распространения нашей информации. Отныне народ Австрии узнает правду и убедится в нашей правоте!" # Propaganda - A weapon, agaisnt all foes. Be it political or military, propaganda has a wide use for the government, we must convince the souls of the people that our cause is just, even if not. The creation of the propaganda department makes things easier for us, as we can operate with more organisation to spread our message. From now on, the people of Austria shall know the truth, and they shall be convinced of our justness!
 ausks.13.a: "Пусть они услышат то, что мы хотим." # Let them hear what we want.

 ausks.14.t: "Поддержание порядка в армии" # Maintaining Order at the Army
 ausks.14.d: "Поскольку наша оборона была готова обеспечить выживание Австрии, внимание Янсы привлекло внимание некоторых офицеров и высокопоставленных лиц, которые ранее были связаны с врагом. Сегодня репортаж Янсы, где он советует нации «уволить» этих кадров." # With our defences being prepared to ensure Austrian survival, it has come to Jansa's attention some officers, and high-ranking personnel had previous affiliation with the enemy. Today, a report from Jansa, where he advises the nation to "retire" these personnel.
 ausks.14.a: "Нам следует послушать Янсу." # We should listen to Jansa.

 ausks.15.t: "Шушниг, отец Австрии" # Schuschnigg, Father of Austria
 ausks.15.d: "Для многих международных наблюдателей судьба Австрии была бы простой: несчастная пешка вновь возникшего Рейха, которая продолжала бы с энтузиазмом сражаться за варварские завоевания. Однако их прогнозы явно оказались ошибочными. Несмотря на все попытки радикального правительства в Берлине, австрийский народ выдержал атаку новой угрозы, которой стала Германия, и совместно с ответственными странами Европы разгромил незаконный режим на Земле.\n\nПока валькизм и его производные живут, они являются всего лишь несущественными угольками некогда великого пламени, охватившего Европу. Между тем, Австрия продолжает стоять на ногах, готовая противостоять вызовам нового мира. Конечно, либерализм и его социалистические спутники все еще существуют и в некоторых местах сильнее, чем когда-либо, но никто не может отрицать, что мы выиграли эту войну. Канцлер Шушниг привел нашу немецкую Австрию в новую эпоху, и за это его можно назвать только отцом нации." # For many international observers, Austria's fate would be simple - an hapless pawn of the newly arisen Reich that would go on to enthusiastically fight for barbaric conquest. However, their predictions have clearly been proven wrong. Despite all attempts by the radical government in Berlin, the Austrian people have withstood the attack of the new menace that was Germany and has in concert with the responsible nations of Europe smited the illegal regime from the Earth.\n\nWhile Valkism and its derivatives live on, they are but irrelevant embers of the once-grand flame that encompassed Europe. Meanwhile, Austria remains standing, ready to face the challenges of a new world. Sure, liberalism and its socialist companions still remain and in certain places are stronger than ever, but none can deny that we have won this war. Chancellor Schuschnigg has led our German Austria into a new age, and for this he can only be described as the father of the nation.
 ausks.15.a: "Новое время начинается днем!" # Die neue Zeit steigt in den Tag!

# Habsburg

 AUShabsburg.1.t: "Политика и искусство переплетаются" # Politics and Art Intertwined
 AUShabsburg.1.d: "Гуго фон Гофмансталь вошел в комнату, где сидел Отто, и уселся на тахту напротив бывшего королевского двора. Они должны были сесть и создать австрийскую идентичность, уникальную из разделения и фрагментации, которые гноились под немецкой идентичностью. На вопрос Отто Гофмансталь смог дать представление о том, как сформировать эту идентичность.\n\nОн начал говорить об Англии. Как англичане восхищались как военачальниками, так и художниками, сохраняя при этом свою идентичность. Как не существует разделения между политиками и художниками. Там, где субъектам предоставляется общая основа энергии, особая и прагматичная энергия.\n\nДаже если эти видения могут быть преувеличены, в них были некоторые учения. За свою жизнь Австрия родила множество художников. Зачем связывать нашу идентичность с этнической принадлежностью или языком? Эти вещи легко разделили людей, заставив многих австрийцев считать себя немцами. Вместо этого и Гюго, и Отто согласились, что единство политики, искусства и, возможно, веры — лучший путь вперед." # Hugo von Hofmannsthal entered the room where Otto was sitting, placing himself on the ottoman across the former royal. They were to sit down and create an Austrian identity unique from the division and fragmantation that had festered under a German identity. At the question from Otto, Hofmannsthal could give insight into how to form this identity.\n\nHe began talking about England. How the English admired both military leaders and artists alike, while maintaining their identity. How divisions between the politicians and the artists doesn't exist. Where the subjects are provided with a common base of energy, a singular and pragmatic energy.\n\nEven if these visions might be overstated, there were some teachings in them. Austria had produced many artists during her lifetime. Why bind our identity towards ethnicity or language? These things have easily divided the people, causing many Austrians to view themselves as German. Instead, both Hugo and Otto agreed that unity between politics, art and perhaps faith was the best way forward.
 AUShabsburg.1.a: "У австрийца душа художника" # The Austrian Has An Artist's Soul

 AUShabsburg.2.t: "Назначение социал-монархиста" # The Social Monarchist Appointment
 AUShabsburg.2.d: "Эрнст Карл Винтер представляет почти все, что делает Австрию уникальной по сравнению с Германией. Католический монархист, Винтер был одним из первых сторонников австрийской идентичности. Тот, кто также искренне боролся за права австрийского рабочего класса. Теперь он присутствовал на своем первом заседании кабинета министров в качестве назначенного члена правительства Отто.\n\nВ то время как большинство сторонников Отто стремятся вправо, назначение Винтера представляет собой поворот влево. Именно он пришел с лозунгом: «Стой справа и думай слева». Его монархизм не является элитизмом и нетерпимостью. Разница лишь в том, что его роль будет заключаться в том, чтобы использовать свой опыт работы журналистом и профессором университета для продвижения австрийской идентичности в нашей системе образования. Кроме того, он, вероятно, внесет большой вклад по вопросам прав трудящихся через свою социальную рабочую группу." # Ernst Karl Winter represents almost everything that makes Austria unique from Germany. A Catholic monarchist, Winter was an early proponent of the Austrian identity. One who also had a big heart for the rights of the Austrian working class. Now, he sat on his first cabinet meeting as an appointed member of Otto's government.\n\nWhile most of Otto's supporters strive towards the right, the appointment of Winter represent a turn towards the left. It was he who came with the slogan: 'stand on the right and think on the left'. His monarchism isn't one of elitism and intolerance. Quite the difference, his role will be to use his expertice from his work as a Journalist and University Professor to promote the Austrian identity in our education system. In addition, he will probably give a lot of input on issues in regards of workers' rights through his Social Working Group.
 AUShabsburg.2.a: "За австрийского рабочего и его короля" # For the Austrian Worker and His King

 AUShabsburg.3.t: "Смена караула" # Changing of the Guard
 AUShabsburg.3.d: "На прошлой неделе президент Вильгельм Миклас подал в австрийский парламент заявление об отставке на заседании под председательством Отто фон Габсбурга. Миклас верой и правдой служил австрийскому народу на протяжении многих лет, но теперь все закончилось. В условиях перемен для продвижения Австрии вперед потребуется новое руководство, то есть руководство, более готовое работать с Отто.\n\nНа этой неделе была быстро созвана новая сессия, чтобы заполнить вакансию, образовавшуюся после ухода Микласа. В ходе заседания Отто выступил с речью о необходимости номинировать кого-то, кто приведет Австрию в будущее. Он говорил о нестабильности, разногласиях и нетерпимости республики, рисуя более красивую картину династии Габсбургов и Империи. Хотя некоторые полагали, что он выдвинет свою кандидатуру, Отто вместо этого закончил речь, выдвинув кандидатуру Виктора Данкла фон Красника в качестве президента после Микласа.\n\nНекоторые оставшиеся деятели оппозиции по-прежнему выступают против этого назначения, указывая на преклонный возраст фон Красника и его лояльность к Партии восстановления монархии. Однако, поскольку наша власть над Федеральным советом надежна, они ничего не могут сделать, чтобы помешать этому назначению. В конце концов, наши оппоненты-республиканцы будут правы. Фон Красник стар и проживет недолго, но он будет человеком, готовым работать с нами, чтобы в свое время подготовить Императорскую Корону для Отто." # Last week, president Wilhelm Miklas tendered his resignation to the Austrian parliament in a session overseen by Otto von Habsburg. Miklas have served the Austrian people faithfully through many years, but now it is over. With the changing times, new leadership, leadership more willing to work with Otto that is, will be needed to move Austria forward.\n\nA new session was quickly called this week to fulfill the vacancy left by Miklas' departure. During the session, Otto took to the stand, speaking about the need to nominate someone who will bring Austria into the future. He spoke about the instability, the divisions and intolerance of the Republic, painting a nicer picture of the Habsburg dynasty and the Empire. While some believed he would nominate himself, Otto instead ended the speech by nominating Viktor Dankl von Krasnik to follow Miklas as president.\n\nSome remaining opposition figures still oppose this nomination, pointing towards the advanced age of von Krasnik and his loyalties with the Monarchist Restoration Party. However, with our grasp over the Federal Council secure, there is nothing they can do to hinder this appointment. In the end, our Republican opponents will be right. Von Krasnik is old and will not live for long, but he will be a man willing to work with us to make the Imperial Crown ready for Otto in due time.
 AUShabsburg.3.a: "За будущее Австрии!" # For Austria's Future!

 AUShabsburg.4.t: "Австрийцы стремятся к торговой сделке" # The Austrians Seeks a Trade Deal
 AUShabsburg.4.d: "Австрия под руководством своего бывшего наследного принца Отто фон Габсбурга направила посла в Рим. Они требуют заключения торгового соглашения между двумя королевствами, стремясь связать более тесные связи между австрийским и итальянским народами. Хотя это соглашение будет для нас выгодным, нам следует помнить об амбициях Отто по восстановлению старой Австро-Венгерской империи. Империя, претендовавшая на итальянские земли." # Austria, under the leadership of their former crown prince Otto von Habsburg, have sent an envoy to Rome. They request a trade agreement between the two realms, seeking to bind closer connections between the Austrian and Italian peoples. While this agreement will be benefitial to us, we should keep in mind Otto's ambitions to restore the old Austro-Hungarian Empire. An empire that claimed Italian lands.
 AUShabsburg.4.a: "Торговля безвредна, мы согласны" # Trade is Harmless, We Agree
 AUShabsburg.4.b: "Нет! Мы не можем доверять этому Габсбургу" # No! We Can't Trust This Habsburg

 AUShabsburg.5.t: "Итальянцы согласны" # The Italians Agree
 AUShabsburg.5.d: "Наш посланник в Риме передает хорошие новости обратно в Вену. Итальянцы согласовали условия нашего торгового соглашения. Благодаря этому соглашению обе сферы будут укреплены. Мы надеемся, что это лишь первый шаг на пути к благополучным отношениям." # Our envoy in Rome sends good news back to Vienna. The Italians have agreed on the terms of our trade agreement. With this agreement, both realms will be strengthen. We are hopeful that this is just the first step towards a prosperous relationship.
 AUShabsburg.5.a: "Большой!" # Great!

 AUShabsburg.6.t: "Итальянцы не согласны" # The Italians Disagree
 AUShabsburg.6.d: "Наш посланник в Риме отправляет плохие новости обратно в Вену. Итальянцы не увидели причины и отвергли предложенное нами торговое соглашение. Ходят слухи, что итальянцы не доверяют руководству Габсбургов в Австрии, опасаясь за земли, которые они отобрали у нас во время Великой войны. Несмотря на эту неудачу, мы надеемся сохранить с ними теплые отношения." # Our envoy in Rome sends bad news back to Vienna. The Italians did not see reason and rejected our proposed trade agreement. There are rumours that the Italians does not trust the leadership of an Habsburg in Austria, fearing for the lands that they took from us during the Great War. Despite this setback, we hope to uphold cordinal relations with them.
 AUShabsburg.6.a: "Вы не можете победить их всех" # You Can't Win Them All

 AUShabsburg.7.t: "Австрийцы стремятся к торговой сделке" # The Austrians Seeks a Trade Deal
 AUShabsburg.7.d: "Австрия под руководством своего бывшего наследного принца Отто фон Габсбурга направила в Софию посла. Они требуют заключения торгового соглашения между двумя королевствами, стремясь связать более тесные связи между австрийским и болгарским народами. Поскольку Австрией правят Габсбурги, многие видят в этом прекрасную возможность возродить наши отношения после Великой войны. Другие хотят, чтобы мы отвергли это, отказавшись от неудач прошлого." # Austria, under the leadership of their former crown prince Otto von Habsburg, have sent an envoy to Sofia. They request a trade agreement between the two realms, seeking to bind closer connections between the Austrian and Bulgarian peoples. With an Habsburg ruling Austria, many see it as a prime opportunity to rekindle our relationship from the Great War. Others want us to reject this, in an rejection to the failures of the past.
 AUShabsburg.7.a: "Торговля безвредна, мы согласны" # Trade is Harmless, We Agree
 AUShabsburg.7.b: "Нет! Мы не хотим, чтобы нас втянули в амбиции Отто" # No! We Don't Want to Be Draged Into Otto's Ambitions

 AUShabsburg.8.t: "Болгары согласны" # The Bulgarians Agree
 AUShabsburg.8.d: "Наш посланник в Софии передает хорошие новости обратно в Вену. Болгары согласовали условия нашего торгового соглашения. Благодаря этому соглашению обе сферы будут укреплены. Мы надеемся, что это лишь первый шаг на пути к благополучным отношениям." # Our envoy in Sofia sends good news back to Vienna. The Bulgarians have agreed on the terms of our trade agreement. With this agreement, both realms will be strengthen. We are hopeful that this is just the first step towards a prosperous relationship.
 AUShabsburg.8.a: "Большой!" # Great!

 AUShabsburg.9.t: "Болгары не согласны" # The Bulgarians Disagree
 AUShabsburg.9.d: "Наш посланник в Софии отправляет плохие новости обратно в Вену. Болгары не увидели причины и отвергли предложенное нами торговое соглашение. Ходят слухи, что соглашение с Австрией, возглавляемой Габсбургами, слишком напоминает им о неудачах Великой войны. Несмотря на эту неудачу, мы надеемся сохранить с ними теплые отношения." # Our envoy in Sofia sends bad news back to Vienna. The Bulgarians did not see reason and rejected our proposed trade agreement. There are rumours that an agreement with a Habsburg-led Austria reminds them too much about the failures of the Great War. Despite this setback, we hope to uphold cordinal relations with them.
 AUShabsburg.9.a: "Вы не можете победить их всех" # You Can't Win Them All

 AUShabsburg.10.t: "Австрия зовет принцев" # Austria Calls the Princes
 AUShabsburg.10.d: "Австрия под руководством габсбургского принца Оттона объявила призыв к принцам линии Габсбургов. Один из этих принцев проживает в Венгрии. Йозеф Август проживал в нашей стране после окончания Великой войны и стал фигурой, симпатичной публике. Даже многие венгерские националисты относятся к нему с большим уважением, а некоторые стремятся возвести его на престол как король Венгрии.\n\nБыло бы трудно оправдать его удержание здесь, если он хочет вернуться к своим родственникам в Австрии, но некоторые советники говорят, что мы должны оставить его здесь. Однако такое решение может привести к возникновению напряженности в отношениях с австрийцами." # Austria, under the leadership of the Habsburg prince Otto, has issued a call for the princes of the Habsburg line. One of these princes resides in Hungary. Joseph August has had a residence in our country since the end of the Great War, and has become a likeable figure for the public. Even many Hungarian nationalists view him with high regards and some seek to enthrone him as king of Hungary.\n\nIt would be hard to justify keeping him here if he want to return to his kin in Austria, but some advisors say we should keep him here. However, that would be a decision that could risk tensions with the Austrians.
 AUShabsburg.10.a: "Прощай, Джозеф Август." # Farewell, Joseph August

 AUShabsburg.11.t: "Йозеф Август прибыл из Венгрии" # Joseph August Arrives From Hungary
 AUShabsburg.11.d: "Палатин Венгрии Йозеф Август прибыл сегодня в Вену. Несмотря на его собственные сомнения по поводу выезда из Венгрии и признаки того, что венгерское правительство попытается удержать его там, он ответил на призыв. Он понимает, что объединение наших сил не является предательством венгерского народа. Достаточно скоро мы двинемся на восток и освободим венгерский народ от его мадьярских угнетателей." # The Palatine of Hungary, Joseph August, have arrived today in Vienna. Despite his own doubts of leaving Hungary and the signs that the Hungarian government would try to keep him there, he answered the call. He understands that joining our forces isn't a betrayal to the Hungarian people. Soon enough, we will march east and liberate the Hungarian people from their Magyar oppressors.
 AUShabsburg.11.a: "Добро пожаловать в Вену" # Welcome to Vienna

 AUShabsburg.12.t: "Венгры помешали Йозефу Августу" # The Hungarians Has Hindered Joseph August
 AUShabsburg.12.d: "Венгры, похоже, не позволяют Йозефу Августу свободно присоединиться к своим родственникам в Вене. Вместо того, чтобы отпустить его, они поместили его под домашний арест в шикарном будапештском особняке. Вероятно, они боятся, что столь популярный среди венгерского народа деятель присоединится к своим братьям в Австрии. В любом случае, это крайне неуместно." # The Hungarians seem to not let Joseph August go free to join his kin in Vienna. Instead of letting him leave, they placed him under house arrest in a fancy Budapest residence. They are probably scared that such a popular figure among the Hungarian people should join his brothers in Austria. Regardless, this is highly inappropriate.
 AUShabsburg.12.a: "Проклятые мадьяры" # Cursed These Magyars

 AUShabsburg.13.t: "Австрия зовет принцев" # Austria Calls the Princes
 AUShabsburg.13.d: "Австрия под руководством габсбургского принца Оттона объявила призыв к принцам линии Габсбургов. Один из этих князей проживает в Польше. Карл Альбрехт проживал в нашей стране с конца Великой войны и нашел себе хороший дом в Польше. Настолько, что он известен как заядлый польский патриот. Конечно, он мог бы уехать, если бы захотел, но, по некоторым слухам, он также может решить остаться в Польше. Что он находит мир на пенсии более удовлетворительным, чем имперскую службу." # Austria, under the leadership of the Habsburg prince Otto, has issued a call for the princes of the Habsburg line. One of these princes resides in Poland. Karl Albrecht has had a residence in our country since the end of the Great War, and has found himself a good home in Poland. So much that he is known as a avid Polish patriot. Of course, he could leave if he wants to, but some rumours tells us he might also choose to stay in Poland. That he finds the peace of retirement more fulfilling than Imperial service.
 AUShabsburg.13.a: "Это зависит от него" # It's Up to Him

 AUShabsburg.14.t: "Карл Альбрехт прибыл из Польши" # Karl Albrecht Arrives From Poland
 AUShabsburg.14.d: "Силезский принц Карл Альбрехт прибыл сегодня в Вену. Несмотря на его глубокую любовь к Польше и его предыдущее служение независимости Польши, он ответил на призыв. Он понимает, что верность семье иногда превосходит преданность приемной стране. Будем надеяться, что в нашей мечте об обновленной империи есть место для польской нации. Тот, кто живет в свободе и процветании." # The Silesian Prince, Karl Albrecht, have arrived today in Vienna. Despite his deep love for Poland and his previous service for Polish independence, he answered the call. He understands that loyalty to family sometimes overgo loyalty to an adopted country. Hopefully, our dream of a renewed empire have space for the Polish nation. One living in freedom and prosperity.
 AUShabsburg.14.a: "Добро пожаловать в Вену" # Welcome to Vienna

 AUShabsburg.15.t: "Карл Альбрехт отклоняет вызов" # Karl Albrecht Rejects the Call
 AUShabsburg.15.d: "Нам прислали письмо из Польши. Его подписал сам силезский принц Карл Альбрехт. Он желает Австрии удачи и всего наилучшего при возобновленном правлении Габсбургов, но отказывается уезжать в Вену. Даже если нам не нравится его решение покинуть семью и поддержать приемную страну, в конечном итоге это был его выбор, и мы не можем заставить его поехать в Вену против его воли." # A letter has been sent to us from Poland. It is signed by the Silesian Prince, Karl Albrecht, himself. He wishes Austria luck and all well under renewed Habsburg rule, but declines to leave for Vienna. Even if we dislike his choice to leave the family and support his adopted country, it was ultimately his choice and we can't force him to travel to Vienna against his will.
 AUShabsburg.15.a: "Стоило затраченных усилий" # Was Worth the Effort

 AUShabsburg.16.t: "Австрия зовет принцев" # Austria Calls the Princes
 AUShabsburg.16.d: "Австрия под руководством габсбургского принца Оттона объявила призыв к принцам линии Габсбургов. Один из этих князей проживает в Украине. Вильгельм Франц, известный на нашем языке как Василий Вышиваный, после окончания Великой войны проживал в нашей стране и нашел себе хороший дом на Украине. В то время как его старший брат стал польским патриотом, Вильгельм Франц был ярым сторонником независимости Украины. Если он захочет, он может уйти. Однако он, скорее всего, тоже останется в Украине. Что он больше верен своей приемной стране, чем семейным связям." # Austria, under the leadership of the Habsburg prince Otto, has issued a call for the princes of the Habsburg line. One of these princes resides in Ukraine. Wilhelm Franz, known in our tounge as Vasyl Vyshyvanyi, has had a residence in our country since the end of the Great War, and has found himself a good home in Ukraine. While his elder brother became a Polish patriot, Wilhelm Franz has been an avid supporter of Ukrainian independence. If he want to, he can leave. However, he is also likely to stay in Ukraine. That he finds his loyalty more to his adopted country than to family ties.
 AUShabsburg.16.a: "Это зависит от него" # It's Up to Him

 AUShabsburg.17.t: "Вильгельм Франц прибыл из Украины" # Wilhelm Franz Arrives From Ukraine
 AUShabsburg.17.d: "Украинский полковник Вильгельм Франц прибыл сегодня в Вену. Несмотря на свою преданность Украине и украинскому народу, он ответил на призыв. Он понимает, что даже если его сердце разрывается между Украиной и семьей, он не может забыть, что он прежде всего Габсбург. Мы сами можем поучиться у него любви к Украине. Нация, которую многие считают вероятным союзником в борьбе с русским советским медведем." # The Ukrainian Colonel, Wilhelm Franz, have arrived today in Vienna. Despite his loyalty to Ukraine and the Ukrainian people, he has answered the call. He understands that even if his heart is torn between Ukraine and family, he can't forget that he is first and foremost an Habsburg. We can ourself learn from his love of Ukraine. A nation many see as a likely ally against the Russian Soviet bear.
 AUShabsburg.17.a: "Добро пожаловать в Вену" # Welcome to Vienna

 AUShabsburg.18.t: "Вильгельм Франц отклоняет вызов" # Wilhelm Franz Rejects the Call
 AUShabsburg.18.d: "Нам прислали письмо из Украины. Его подписал сам украинский полковник Вильгельм Франц. Или даже не он, а его украинский псевдоним Василий Вышиваный. Желая нам удачи, он признает, что не верит в возможность восстановления Империи. Он видит себя уже не Габсбургом (вероятно, это чувство исходит от его более бунтарской стороны), а Василием Вышиваным. Он подписывает двумя заключительными словами:\n\nСлава Украина!" # A letter has been sent to us from Ukraine. It is signed by the Ukrainian Colonel, Wilhelm Franz, himself. Or even not him, but his Ukrainian alias Vasyl Vyshyvanyi. While he wishes us luck, he admits to not believe that the Empire can be restored. He sees himself no longer as an Habsburg, probably a feeling coming from his more rebellious side, but as Vasyl Vyshyvanyi. He signs of with two final words:\n\nSlava Ukraini!
 AUShabsburg.18.a: "Стоило затраченных усилий" # Was Worth the Effort

 AUShabsburg.19.t: "Соперничество между братьями и сестрами" # Sibling Rivalry
 AUShabsburg.19.d: "На призыв принцев Габсбургов, несомненно, откликнулись не одна группа братьев и сестер. Один из таких наборов — Карл Альбрехт и Вильгельм Франц. После церемонии восстановления их в офицерских званиях австрийских вооруженных сил между двумя братьями должна была состояться дискуссия. В результате их обоих увели ближайшие охранники, чтобы предотвратить дальнейшее замешательство.\n\nИх дискуссия, похоже, вызвана дебатами о суверенитете Галиции. Хотя Карл Альбрехт выступал за превосходство Польши, это вызвало раздражение Вильгельма Франца, который настаивал на том, что украинским народом там должна управлять Украина. Для Отто эти дебаты не имеют значения. Галиция принадлежала Империи и будет принадлежать ей снова. Это то, на что они оба подписались." # The call of the Habsburg princes has undoubtly been answered by more than one set of siblings. One of these sets is Karl Albrecht and Wilhelm Franz. After a ceremony where they was restored to the ranks of officers in the Austrian Armed Forces, a discussion was to be heard between the two brothers. It resulted with the two of them being guided away by nearby guards to prevent further embarrassment.\n\nTheir discussion seems to be sparked by the debate of Galician sovereignty. While Karl Albrecht spoke up in favor of Polish supremacy, this ticked Wilhelm Franz off, who was persistent that the Ukrainian people there should be governed by Ukraine. For Otto, this debate is irrelevant. Galicia belonged to the Empire and it will belong to it again. That's what both of them signed up on.
 AUShabsburg.19.a: "Это смешно" # This is Ridiculous

 AUShabsburg.20.t: "Вильгельм Франц уезжает в Украину" # Wilhelm Franz Leaves For Ukraine
 AUShabsburg.20.d: "Украинцы, похоже, последовали нашему примеру, стремясь возвести на престол своих Габсбургов. Это означает, что наш дорогой украинский полковник Вильгельм Франц покинет Австрию и отправится в свое новое королевство на востоке. Прощаясь с Вильгельмом Францем, мы прощаемся с новым королем украинцев Василием I.\n\nДа здравствует король Василий I, Слава Украины!" # The Ukrainians have seemingly followed in our steps, seeking to enthrone their own Habsburg. What this means, is that our dear Ukrainian Colonel, Wilhelm Franz, will leave Austria to his new kingdom in the east. As we wink farewell to Wilhelm Franz, we wink farewell to the new king of the Ukrainians: Vasyl I.\n\nLong Live King Vasyl I, Slava Ukraini!
 AUShabsburg.20.a: "Heroiam Slava!" # Heroiam Slava!

 AUShabsburg.21.t: "Степан Саркотич уходит в отставку" # Stjepan Sarkotić Retires
 AUShabsburg.21.d: "Степан Саркотич оказал большую помощь в передаче своего опыта Великой войны австрийской армии и работе в хорватской эмигрантской общине в Вене, чтобы лучше подготовить Хорватию к правлению Габсбургов. Однако не каждый может жить вечно, и Саркотич чувствовал, что его преклонный возраст вскоре вынудит его уйти на пенсию. Хотя он по-прежнему готов давать советы молодому поколению генералов и лидеров в нашем королевстве, он будет делать это, находясь в безопасности на пенсии, а не на поле боя." # Stjepan Sarkotić have been a great help in lending his Great War expertice to the Austrian army and working within the Croatian émigré community in Vienna to better make Croatia ready for Habsburg rule. However, not everyone can live forever and Sarkotić have felt that his advanced age soon would force him into retirement. While he is still willing to advice the younger generations of generals and leaders in our realm, he will do it from the safety of retirement instead of on the field.
 AUShabsburg.21.a: "Спасибо за ваше обслуживание" # Thank You For Your Service

 AUShabsburg.22.t: "Правильная реставрация" # A Proper Restoration
 AUShabsburg.22.d: "Президент Виктор Данкл фон Красник последние пару лет выполнял свою роль. Под своим президентством Отто смог закрепить за собой позицию лидера австрийского народа. Под предлогом досрочного выхода на пенсию по возрасту фон Красник уйдет с поста президента. Это оставит возможность для избрания Отто на пост президента теперь уже лояльным парламентом. Однако его время на посту президента будет коротким. Чтобы обеспечить постоянную стабильность королевства, республика будет реорганизована в Австрийское королевство для безопасного и надежного общества." # President Viktor Dankl von Krasnik has fulfilled his role the past couple of years. Under his presidency, Otto has been able to secure his position as a leader of the Austrian people. Under the guise of an early retirement due to his age, von Krasnik will step down as president. This will leave the room open for Otto to be elevated to the presidency by the now loyal parliament. However, his time as president will be short. In order to ensure the realm's continuing stability, the Republic will be reorganized into the Austrian Kingdom, for a safe and secure society.
 AUShabsburg.22.a: "Новый порядок, рожденный из старого" # A New Order, Born From the Old

 AUShabsburg.23.t: "Место Трансильвании в Империи" # Transylvania's Place in the Empire
 AUShabsburg.23.d: "Когда была образована Австро-Венгерская империя, Трансильвания стала землей, управляемой непосредственно венграми. И это несмотря на то, что большинство жителей региона составляют в основном румыны, и лишь меньшинство венгров в основном согласны с тем, что известно как Земля Секели. Некоторые в нашем движении осуждают отсутствие представительства, которое старая система дала румынскому народу в нашей Империи. Они хотят, чтобы мы отделили Трансильванию или, по крайней мере, значительную ее часть от Венгрии. Однако это может коснуться нас и позже, поскольку многие венгры рассматривают Трансильванию как свою землю и не желают отделяться от нее." # When the Austro-Hungarian Empire was formed, Transylvania became a land directly ruled by the Hungarians. This, even though the majority of the region are mostly Romanians, with only a minority population of Hungarians mostly consentrated in what's known as Székely Land. Some in our movement decries the lack of representation that the old system gave to the Romanian people in our Empire. They want us to make Transylvania, or at least a sizeable part of it, separate from Hungary. However, this could also come to bite us later, as many Hungarians view Transylvania as their land, not wanting to separate from it.
 AUShabsburg.23.a: "Это часть Венгрии" # It's A Part of Hungary
 AUShabsburg.23.b: "Мы могли бы попытаться разделить Трансильванию" # We Could Try to Divide Transylvania
 AUShabsburg.23.c: "Отдать все трансильванцам" # Give All of It to the Transylvanians

### POLITICAL EVENTS ###

 austria.15.t: "Возвращение к нормальной жизни" # The Return to Normalcy
 austria.15.d: "Вмешательство правительства ради спасения экономики было ненавистной мерой Австрийской школы экономики, однако оно оказалось весьма плодотворным. В Австрию возвращается нормальная жизнь, особенно после возобновления программ социального обеспечения, люди возвращаются на свои рабочие места, а банки вновь открываются. Ужасные дни «Черного понедельника» остались позади, и теперь нам остается только догонять мир." # Government intervention to save the economy was a hated measure by the Austrian School of Economics, however it came out quite fruitful. Normalcy is returning to Austria, especially after the reactivation of social welfare programs, the people are going back to their jobs and banks are reopening. The horrible days of Black Monday are behind us, and now we only need to catch up with the world.
 austria.15.a: "Интересный экономический эксперимент." # An interesting economic experiment.

 austria.16.t: "Новый президент Национального совета" # A New President of the National Council
 austria.16.d: "После отставки последнего председателя парламента Карл Реннер стал президентом Национального совета во время кризиса. «Демократическая революция» привела к парламентскому кризису. Теперь долг президента объединить оппозицию до эскалации кризиса." # With the resignation of the last president of the Parliament, Karl Renner has risen to presidency of the National Council during a time of crisis. The "Democratic Revolution" created a parliamentary crisis. It is now the duty of the president unite the opposition before the crisis escalates.
 austria.16.a: "Удачи, Карл." # Good luck, Karl.

 austria.17.t: "Дольфус берет на себя полный контроль над страной" # Dollfuß Assumes Total Control of the Country
 austria.17.d: "Дольфусу и нации надоели политические разногласия «Национальной крысы». Он взял на себя командование нацией против предателей Вены. Вена — город, а Австрия — страна. Дольфус взял дело в свои руки и командовал Хеймвером в Вене вместе с Хеером. Теперь мы лишь являемся свидетелями того, как Национальная крыса погружается в хаос. Ключевые здания парламента были срочно эвакуированы из-за «чрезвычайных проблем» и закрыты Дольфусом." # Dollfuß and the nation had enough of the political bickering of the Nationalrat. He has taken command of the nation against the traitors of Vienna. Vienna is a city, while Austria is a country. Dollfuß has taken matters into his own hands and commanded the Heimwehr inside Vienna alongside the Heer. Now we only witness as the Nationalrat descends into chaos. In a swift motion, key parliament buildings are evacuated due to "emergency concerns" and closed down by Dollfuß.
 austria.17.a: "У республики новый отец." # There is a new father to the republic.

# austria.18 REMOVED FOR THIS RELEASE

 austria.19.t: "Убийство Дольфуса" # The Assasination of Dolfuss
 austria.19.d: "После роспуска парламента в Вене начали действовать силы валкистского ополчения. Стремясь захватить власть и объединить Германию и Австрию, небольшая группа валкистов штурмовала канцелярию и потребовала от Дольфуса покинуть страну и передать контроль силам валкистов. Когда он отклонил эту просьбу, его застрелили. Однако попытка государственного переворота продлилась недолго, поскольку вскоре Хеймвер и Бундесшир вторглись в здание и расстреляли повстанцев. Шушниг и Рюдигер встречались и пытались сотрудничать, но безуспешно, поскольку мешали их разные мысли. Теперь поле политической битвы открыто для всех, кто может сделать свои ставки." # After dissolving the parliament, forces from the Valkist militias in Vienna started to act. With their desire to takeover and unite Germany and Austria, a small group of Valkists stormed the Chancellery and demanded Dolfuss to leave the country and giveover control to the Valkist forces, when he denied the request, he was shot dead. The attempted coup wouldn't last though, as the Heimwehr and Bundesheer soon invaded the building and shot down the rebels. Schuschnigg and Rüdiger would meet and try to cooperate, to no avail as their differing thoughts got in the way. Now, the political battlefield is open to whoever can place their bids.
 austria.19.a: "Посмотрим, чем это закончится..." # Let's see how this ends...

 austria.20.t: "Стол переговоров" # The Negotiating Table
 austria.20.d: "После месяцев насилия и внутренней борьбы Хеймвер и Шушниг согласились на переговоры, однако другой человек высказался за консенсус. Отто фон Габсбург отправил письмо Рюдигеру и Шушнигу, продвигая идею о том, что он является посредником, кем-то, кто может попытаться исправить ситуацию между сторонами - Шушниг и Рюдигер отказались от приглашения, но Шушниг поблагодарил будущего императора за попытку.\nВстреча между Рюдигером и Шушнигом скоро наступит, и карты будут показаны обоим игрокам." # After what seems like months of violence and internal struggle, the Heimwehr and Schuschnigg agreed to talks, however, another man has spoken for a consensus. Otto Von Habsburg has sent a letter to both Rüdiger and Schuschnigg, promoting the idea of him being a middle man, someone who can try and make amends between the parties - Schuschnigg and Rüdiger refused the invite, but Schuschnigg thanked the would be Emperor for trying.\nThe meeting between Rüdiger and Schuschnigg is soon to arrive, and the cards will be shown to both players.
 austria.20.a: "Будем надеяться на мир в наше время." # Let's hope for peace at our time.

 austria.23.t: "Шушниг становится канцлером" # Schuschnigg Assumes the Chancellorship
 austria.23.d: "После смерти Дольфуса Шушниг и Рюдигер вели политическую битву за то, кто будет командовать Австрией, но, похоже, все закончилось. На поле политической битвы сейчас доминируют Шушниг и его верные силы, при этом Бундешир захватывает ключевые точки в Вене и поддерживает порядок; кажется, что с приходом к власти Хеймвер начал поглощаться Шушнигом, а те, кто не интегрируется, уничтожаются..." # After the death of Dolfuss, Schuschnigg and Rüdiger have been in a political battle to see who will command Austria, but it finally seems like this is over. The political battlefield is now dominated by Schuschnigg and his loyal forces, with the Bundesheer taking over key points in Vienna and maintaining order, it seems that with the takeover, the Heimwehr has started to be absorbed by Schuschnigg and those who don't integrate are destroyed...
 austria.23.a: "Да здравствует Австрия!" # Long live Austria!

 austria.24.t: "Переговоры заходят в тупик" # Negotiations Comes to a Stop
 austria.24.d: "Нежелание таких людей, как Шушниг и Рюдигер, прийти к соглашению не должно удивлять. За столом переговоров между ними начались препирательства. Ситуация быстро изменилась: оба мужчины покинули стол без какого-либо официального соглашения. Поскольку ситуация в Австрии более тяжелая, чем когда-либо, вполне вероятно, что насилие возобновится. Часть Бундешира, не лояльная ни к одному из мужчин, вместе с неприсоединившимися группами ополченцев начала планировать другие альтернативы." # The unwillingness of men like Schuschnigg and Rüdiger to come to an agreement shouldn't be surprising. At the negotiation table between the two, they began to bicker. Quickly, the situation turned, with both men leaving the table without any formal agreement. With the situation in Austria more dire than ever, it looks likely that violence would resume. A portion of the Bundesheer not loyal to either men, together with non-aligned militia groups have begun to plan out other alternatives.
 austria.24.a: "Мир, кажется, останавливается" # Peace Seems to be Halting

 austria.25.t: "Гамбит Отто" # Otto's Gambit
 austria.25.d: "Отто фон Габсбург не бездействовал во время переговоров между Шушнигом и Рюдигером. Он уже формирует круг людей, которые ищут альтернативу хаосу, который царил в Австрии после смерти Дольфуса. Несмотря на то, что Отто был благородным человеком, некоторые из сторонников Отто выдвинули план, как положить конец хаосу. Дело в том, что это будет связано с небольшим несчастным случаем в Национальном рате, как раз там, где проходили переговоры между Шушнигом и Рюдигером. Даже если это будет закулисно, это может быть единственным способом спасти Австрию от смертельной спирали, в которой она сейчас находится." # Otto von Habsburg hasn't been inactive during the negotiations between Schuschnigg and Rüdiger. Already, he is forming a circle of men who seek an alternative to the chaos that have held unto Austria since the death of Dollfuß. While an honourable man, some of Otto's loyalists have set forward a plan to end the chaos. The thing is, that it would involve a tiny accident at the Nationalrat just where the negotiations between Schuschnigg and Rüdiger have been taken place. Even if it is underhanded, it could be the only way to save Austria from the death spiral it's currently in.
 austria.25.a: "Лучше молчи" # Better Be Silent

 austria.26.t: "Переговоры продолжаются и терпят неудачу" # Negotiations Continues and Fails
 austria.26.d: "Еще один день, еще одни провальные переговоры, еще больше австрийской крови пролилось на улицах из-за эго этих людей. План готов. Отто остается только дать слово..." # Yet another day, yet another failed negotiation, yet more Austrian blood spilled on the streets due to the egos of these men. The plan is ready. Otto has just to give the word...
 austria.26.a: "Взорвать Национальный совет" # Explode the Nationalrat
 austria.26.b: "Подожди, нет!" # Wait, No!

 austria.27.t: "Триумф Отто" # Otto's Triumph
 austria.27.d: "An explosion rocked the streets of Vienna this afternoon. Оно возникло в Nationalrat. В первые мгновения после взрыва была слышна стрельба: силы Хеймвера и Бундешира, верные Рюдигеру или Шушнигу, быстро начали несколько стычек друг с другом, полагая, что они подверглись нападению. After a few hours, however, the situation became to calm down as they found out there were no more explosions coming. Они также обнаружили, что Шушниг и Рюдигер были мертвы под обломками, упавшими во время взрыва.\n\nСилы, верные Отто фон Габсбургу, быстро вышли на сцену, и многие из теперь уже лишенных лидера солдат присоединились к рядам. Вскоре будет проведено расследование взрыва, и хотя мы знаем, что на самом деле произошло, в конечном итоге вина будет возложена на некоторых радикальных коммунистов-одиночек.\n\nНа данный момент Австрии необходимо выздороветь. It needs to find a new form of normalcy and stability. Ему нужна твердая рука; Ему нужен Отто фон Габсбург." # An explosion rocked the streets of Vienna this afternoon. It originated at the Nationalrat. The first moments after the explosion, shooting was heard as both Heimwehr and Bundesheer forces loyal to either Rüdiger or Schuschnigg quickly began a few skirmishes against each other, believing they were under attack. After a few hours, however, the situation became to calm down as they found out there were no more explosions coming. What they also found, was both Schuschnigg and Rüdiger dead under the rubble that fell down during the explosion.\n\nForces loyal to Otto von Habsburg quickly entered the scene, with many of the now leaderless soldiers joining ranks. An investigation into the explosion is soon to take place, and while we know what has really happened, the blame will ultimately be placed upon some radical communist lone wolfs.\n\nFor now, Austria needs to heal. It needs to find a new form of normalcy and stability. It needs a steady hand; It needs Otto von Habsburg.
 austria.27.a: "Габсбурги вернулись" # The Habsburgs Are Back

 austria.31.t: "Ландбунд запросил гранты для фермеров" # Landbund Requests Grants to Farmers
 austria.31.d: "Поскольку кризис усугубляется, Ландбунд потребовал, чтобы мы помогли мелким фермерам с помощью некоторых субсидий. Помощь фермерам немного ударит по нашему бюджету, но Ландбунд может уйти, если мы не уступим." # As the crisis worsens, the Landbund has requested that we aid the small farmers with some subsides. Helping the farmers will hurt our budget a bit but the Landbund may leave if we don't concede.
 austria.31.a: "Мы уступим." # We will concede.
 austria.31.b: "Мы не можем..." # We can't...

 austria.32.t: "Позиция Хеймвера" # The Heimwehr's Position
 austria.32.d: "Со смертью Дольфуса кажется, что Австрия движется к политическому хаосу. Это особенно актуально из-за Хеймвера, который сейчас действует как главный контрольно-пропускной пункт между Шушнигом, наследником наследия Дольфуса, и контролем над австрийским государством. Даже если Шушниг для многих лидеров Хеймвера является слишком умеренным, возможно, есть какой-то смысл оставить все как есть и посмотреть, как все будет развиваться в следующем месяце?" # With the death of Dollfuß, it seems that Austria is heading towards political turmoil. This is especially so because of the Heimwehr, which now acts as the main roadblock between Schuschnigg, the sucessor of Dollfuß's legacy and control of the Austrian state. Even if Schuschnigg for many Heimwehr leaders is far too moderate however, perhaps there is some merit in leaving things be and seeing how things pass by over the next month?
 austria.32.a: "Хеймвер отходит на второй план." # The Heimwehr recedes into the background.
 austria.32.b: "Хеймвер будет сражаться решительно!" # The Heimwehr shall fight vigorously!
 austria.32.tt: "Через 30 дней произойдет следующее событие:" # In 30 days, the following event will trigger:

 austria.38.t: "$rhein.republic.23.t$" # $rhein.republic.23.t$
 austria.38.d: "Сегодня приехала делегация из Вены, откуда ни возьмись, и предложила союз. $rhein.republic.23.d$" # Today, a delegation from Vienna of all places have come in, suggesting an alliance. $rhein.republic.23.d$
 austria.38.a: "Мы должны собраться вместе!" # We must come together!
 austria.38.b: "Это абсурд!" # This is absurd!

 austria.39.t: "Кобленц принимает!" # Koblenz Accepts!
 austria.39.d: "Правительство Кобленца приняло наше предложение союза против лжегерманского правительства! Благодаря этому мы теперь официально признаем их законным правительством Германии, в отличие от тиранов Берлина, и вместе мы будем бороться до победы или смерти!" # The Koblenz government has accepted our offer of alliance against the false German government! With this, we now officially recognize them as the legitimate German government, in contrast to the tyrants of Berlin and together we shall struggle until victory or death!
 austria.39.a: "Вместе против Берлина!" # Together against Berlin!

 austria.40.t: "Рейнская глупость" # Rhenish Folly
 austria.40.d: "К несчастью, наше предложение дружбы было полностью отвергнуто правительством Кобленца. Похоже, нам придется бороться за будущее нашего государства без немецкого братства." # In a truly unfortunate turn of events, our offer of friendship was rejected totally by the Koblenz government. It seems that we will have to fight for the future of our state without German brotherhood.
 austria.40.a: "Не каждому немецкому правительству можно доверять..." # Not every German government can be trusted...

# FOREIGN MINISTRY

 austria.33.title: "[FROM.GetNameDef] предлагает сделку." # [FROM.GetNameDef] Proposes a Deal.
 austria.33.desc: "Посол [FROM.GetNameDef] обратился к [ROOT.GetLeader] с предложением заключить оборонительный пакт между [FROM.GetNameDef] и [ROOT.GetNameDef]. Этот план преподносится как способ сохранить мир в регионе, но некоторые в [ROOT.GetRulingPartyLong] полагают, что он позволит [ROOT.GetNameDef] расширяться без нашего вмешательства." # An ambassador from [FROM.GetNameDef] has approached [ROOT.GetLeader] with a proposal of a defensive pact between [FROM.GetNameDef] and [ROOT.GetNameDef]. This plan is being sold as a way to keep peace in the region, but some within [ROOT.GetRulingPartyLong] believe it will allow [ROOT.GetNameDef] to expand without us being able to intervene.
 austria.33.a: "Мы примем этот план мира." # We shall accept this plan for peace.
 austria.33.b: "Нам не следует присоединяться к [FROM.GetNonIdeologyName]." # We should not align ourselves to [FROM.GetNonIdeologyName].

 austria.34.title: "[FROM.GetNameDef] принимает сделку" # [FROM.GetNameDef] Accepts the Deal
 austria.34.desc: "Наш посол вернулся с хорошими новостями: [FROM.GetNameDef] и [ROOT.GetNameDef] объединились, чтобы сохранить мир. Надеюсь, это должно стабилизировать ситуацию в регионе." # Our ambassador has returned with good news, [FROM.GetNameDef] and [ROOT.GetNameDef] have joined together to keep the peace. Hopefully this should stabilize the region.
 austria.34.a: "Отличные новости!" # Great news!

 austria.35.title: "[FROM.GetLeader] говорит нет!" # [FROM.GetLeader] Says No!
 austria.35.desc: "Наш посол вернулся с плохими новостями: [FROM.GetNameDef] и [ROOT.GetNameDef] не будут сближаться. Является ли это знаком грядущих событий?" # Our ambassador has returned with bad news, [FROM.GetNameDef] and [ROOT.GetNameDef] will not move closer together. Is this a sign of things to come?
 austria.35.a: "Обидно, но не неожиданно." # A shame, but not unexpected.

 austria.36.title: "План Янсы в рамках [CZE.GetNameDef]" # Jansa's Plan Within [CZE.GetNameDef]
 austria.36.desc: "Фельдмаршал Янса из [FROM.GetNameDef] предложил расширить форты Янсы до [ROOT.GetNameDef] по всей Судетской области, чтобы предотвратить легкое вторжение [GER.GetNameDef] в наши страны. Нам нужно будет внести в этот план много промышленной мощи, но экспансионизм [GER.GetAdjective] в конечном итоге приведет к войне." # Field Marshal Jansa from [FROM.GetNameDef] has proposed to expand Jansa's forts into [ROOT.GetNameDef] across the Sudetendland, to prevent [GER.GetNameDef] from invading our countries with ease. We would need to contribute a lot of industrial power to the plan, but [GER.GetAdjective] expansionism will lead to war eventually.
 austria.36.a: "Отличная профилактическая мера." # An excellent preventative measure.
 austria.36.b: "Мы не можем себе этого позволить." # We cannot afford this.

 austria.37.title: "[FROM.GetLeader] отвергает план Янсы" # [FROM.GetLeader] Rejects Jansa's Plan
 austria.37.desc: "Фельдмаршал Янса вернулся с плохими новостями: [FROM.GetNameDef] не будет участвовать в реализации его плана по созданию линии укреплений в Судетах." # Field Marshal Jansa has returned with bad news, [FROM.GetNameDef] will not contribute towards his plan of a fortification line in the Sudetenland.
 austria.37.a: "Обидно, но не неожиданно." # A shame, but not unexpected.

