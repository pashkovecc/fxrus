 #IDEAS 
 AUS_treaty_of_saint_germain: "Treaty of Saint-Germain" #NT!
 AUS_treaty_of_saint_germain_desc: "The Treaty of Saint-Germain was imposed on Austria by the Entente in 1919; the treaty put an end to Austria-Hungary and the Austrian Empire, 60% of the Austrian land was taken by other nations, the Austrian Forces were limited to 30.000 men, and the military factories were to be dismantled. Austria didn't have to pay reparations, but even so, the land taken away and the humiliation of the treaty has not been forgotten by the population.\n\nEven though the treaty took a toll on the industry, the Austrians know how to circunvent the treaty. The tradition began with the second chancellor. Ignaz Speil would use paramilitary organisations to keep the military afloat, and more importantly, to keep the populus quiet.\n\nNegotiations between Austria and the Entente Council are regular, the Austrians trying as much as they can to lower the effects of the treaty, and through negotiations, the Entente changed the limit from 30,000 men to 70,000 men in 1923.\nIn June 1935, Austrian delegates at the Entente Council demanded the nullification of the Treaty of Saint-Germain, they argued that the Entente and Austria should cooperate together against the German revanchism, and so, a session is to be held on January 1937." #NT!
