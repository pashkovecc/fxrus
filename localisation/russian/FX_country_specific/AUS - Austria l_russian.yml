 AUS_federations_within_a_federation_desc: ""

 AUS_prepare_local_parliaments: "Подготовьте местные парламенты" # Prepare Local Parliaments
 AUS_prepare_local_parliaments_desc: ""

 AUS_special_autonomies: "Особые автономии" # Special Autonomies
 AUS_special_autonomies_desc: ""

 AUS_the_danube_federation: "Дунайская Федерация" # The Danube Federation
 AUS_the_danube_federation_desc: ""

 AUS_layout_federalisation: "Макет Федерализация" # Layout Federalisation
 AUS_layout_federalisation_desc: "Прежде чем мы начнем воссоединять старые земли Габсбургов, нам необходимо спланировать федеральное решение. Проблемой, возникшей в старой империи, было отсутствие представительства многих национальностей Империи. Федерализация призвана сбалансировать единство с самоуправлением различных народов Империи." # Before we even begin to reunite old Habsburg lands, we need to plan out a federalized solution. The problems that arose in the old empire, was a lack of representation for the many nationalities of the Empire. Federalization is meant to balance unity with the self-governance of the different peoples of the Empire.

 AUS_titles: "Титулы" # Titles
 AUS_titles_desc: "Старые австрийские титулы были упразднены с провозглашением республики. В одних случаях дворянские поместья захватывали республиканцы, в других случаях собственность оставляли в покое. Восстановление старых титулов — верный способ добиться легитимности нашего дела, а также склонить на нашу сторону некоторых мелких аристократов." # The old Austrian titles were disbanded when the Republic was declared. In some cases, noble estates were seized by Republicans, in other cases, property was left alone. Restoring the titles of old is a sure way to gain legitimacy to our cause, as well as swinging some petty nobles over to our side.

 AUS_appoint_ernst_karl_winter: "Назначить Эрнста Карла Винтера" # Appoint Ernst Karl Winter
 AUS_appoint_ernst_karl_winter_desc: "Эрнст Карл Винтер — журналист, социолог и политик, друг покойного канцлера Энгельберта Дольфуса. Убежденный католик и австрийский монархист, Винтер часто вступал в оппозицию немецким националистическим идеям, которые часто преследуют немецкую нацию, более приверженную протестантским и республиканским идеалам. Уинтер отстаивал концепцию «социальной монархии», королевства, в котором права рабочих уважаются посредством соединения монархизма с социал-демократией." # Ernst Karl Winter is a journalist, sociologist and politician who was a friend of the late chancellor Engelbert Dollfuß. A committed Catholic and Austrian monarchist, Winter has often come into opposition to German nationalist ideas, which often pursues a German nation more beholden to protestant and republican ideals. Winter has championed the concept of a “social monarchy”, a kingdom where the rights of the workers are respected through the mending of Monarchism with Social Democracy.

 AUS_work_with_hugo: "Работать с Хьюго" # Work with Hugo
 AUS_work_with_hugo_desc: "Гуго фон Гофмансталь — поэт, драматург и прозаик, за плечами которого долгая карьера автора либретто для опер Рихарда Штрауса. Он также поддерживал моральный дух Австро-Венгерской империи во время Великой войны своими речами и статьями. У Гюго есть несколько идей об искусстве и политике, а также о том, как мы можем способствовать большей независимости австрийской культуры от немецкого национализма и современного экстремизма." # Hugo von Hofmannsthal is a poet, dramatist and novelist who has a long career of writing libretti for the operas of Richard Strauss. He was also a morale booster for the Austro-Hungarian Empire during the Great War through his speeches and articles. Hugo has a few ideas on both art and politics, and how we can promote Austrian culture more independence from German nationalism and the extremisms of today.

 AUS_our_imperial_claims: "Наши имперские претензии" # Our Imperial Claims
 AUS_our_imperial_claims_desc: "Пришло время предъявить права на все земли Австро-Венгерской империи. От Тирольских Альп до Карпат. От улиц Праги до полей Венгрии. Учитывая запланированное восхождение Оттона на пост следующего императора, нам необходимо собрать воедино части новой империи." # It is time to lay claim to all the land of the Austro-Hungarian Empire. From the Tyrollean alps to the Carpathian mountains. From the streets of Prague to the fields of Hungary. With the planned ascension of Otto as the next emperor, we need to set the pieces together for the new empire.

 AUS_allies_in_nobility: "Союзники в дворянстве" # Allies in Nobility
 AUS_allies_in_nobility_desc: "Многие дворяне уже присоединились к нашему делу, надеясь увидеть восстановление своих титулов и славы под властью Габсбургов. Хотя некоторые из них были довольны восстановлением дворянских титулов, нам необходимо заручиться поддержкой тех дворян, которые еще остались. Многие из них все еще цепляются за Христианско-социал-социалистов или Ландбунд. Однако со временем они начнут видеть, что в Вене появилось новое руководство." # Already, many nobles have gathered to our cause, hoping to see their titles and glories restored under Habsburg rule. While some of them were pleased by our restoration of noble titles, we need to secure the support of the nobles who still are left standing. Many of them still cling on to the Christian-Socials or the Landbund. With time, however, they will begin to see that there is a new leadership in Vienna.

 AUS_ban_KPO: "Запретить КПЁ" # Ban KPÖ
 AUS_ban_KPO_desc: "Коммунистическая партия Австрии всегда означала неприятности. Было бы хорошо, если бы они хотели поддержать рабочий класс только для достижения большего количества прав, но нет. Они стремятся спровоцировать революцию и нестабильность в Австрии, и ради чего? Быть сателлитом своих русских повелителей в Советском Союзе? Они чуть ли не хуже валкистов — оба предатели Австрии и зачинщики революции. Нам следует начать запрещать хотя бы один из них." # The Communist Party of Austria has always meant trouble. It would be fine if they only wanted to support the working class to achieve more rights, but no. They seek to instigate revolution and instability in Austria, and for what? To be a satellite to their Russian overlords in the Soviet Union? They are almost worse than the Valkists - both of them traitorous forces to Austria and instigators of revolution. We should begin to ban at least one of them.

 AUS_new_imperial_constitution: "Новая имперская конституция" # New Imperial Constitution
 AUS_new_imperial_constitution_desc: "Отто выдвинул новую конституцию. С изменениями, которые облегчат будущую реставрацию. Определив цель нашего королевства и людей, стоящих за нами, мы можем начать создавать новое австрийское государство." # Otto has put forward a new constitution. With changes that will make the future restoration an easier task. With the goal of our realm set and the people behind us, we can begin to forge a new Austrian state.

 AUS_otto_speech: "Речь Отто" # Otto’s Speech
 AUS_otto_speech_desc: "Хотя мы хорошо поработали с нынешним президентом Вильгельмом Микласом, он по-прежнему является членом старого правящего истеблишмента. Его лояльность не связана с Партией восстановления монархии, и мы опасаемся, что он будет работать против некоторых из наших самых амбициозных целей. Однако он долгое время находился на посту президента, и его срок продлился из-за кризиса и нестабильности. В знак восстановления стабильности мы постараемся отправить его на пенсию. Силой своих речей Отто открыл нового президента и новую эпоху." # While we have worked well with the current president, Wilhelm Miklas, he is still a member of the old governing establishment. His loyalty does not lie with the Monarchist Restoration Party, and we are afraid that he will work against some of our most ambitious goals. However, he has resided as president for a long time, with his term enlarged by crisis and instability. As a sign of restored stability, we will seek to give him a retirement. Through the power of his speeches, Otto would usher in a new president and a new age.

 AUS_the_eagles_legacy: "Наследие Орлов" # The Eagles Legacy
 AUS_the_eagles_legacy_desc: "Наследие Габсбургов и Австро-Венгерской империи в лучшем случае неоднородно. Хотя мы создали одну из величайших империй, которые когда-либо видела Европа, многие также помнили ее как автократическую организацию, у которой слишком мало ума для реформ. Нам необходимо перековать наше наследие, построив новую империю, основанную как на традициях, так и на реформах." # The legacy of the Habsburgs and the Austro-Hungarian Empire is spotty at best. While we forged one of the greatest empires Europe had ever seen, many also remembered it as an autocratic body with too little wit to reform. We need to reforge our legacy, building a new empire on both tradition and reform.

 AUS_keep_officers_at_check: "Держите офицеров под контролем" # Keep Officers at Check
 AUS_keep_officers_at_check_desc: "Не каждый офицер в армии верен нашему видению. Некоторые более лояльны к делу валкистов в Германии, стремясь стереть Австрию с карты мира в пользу Великой Германии. Другие вообще против нашего монархизма. Досрочный выход на пенсию этих нарушителей спокойствия будет гарантией того, что армия не нанесет нам удар в спину при первой же возможности." # Not every officer in the army is loyal to our vision. Some are more loyal towards the Valkist cause in Germany, seeking to wipe Austria off the map in favor of a Greater Germany. Others are generally opposed to our monarchism. Giving these troublemakers an early retirement would ensure that the army doesn’t stab us in the back at their first opportunity.

 AUS_defenders_of_democracy: "Защитники демократии" # Defenders of Democracy
 AUS_defenders_of_democracy_desc: "Некоторые военизированные формирования в Австрии руководствуются идеями демократии. Хотя Лига защиты республиканцев выступает против нашей монархической идеологии, у нее есть члены, которые могли бы работать вместе с нами против общего врага и для защиты демократии. Мы должны объединить продемократические силы из этих ополчений в армейское подразделение, готовое защитить нашу демократию." # Some of the paramilitary forces in Austria are motivated by the cause of democracy. While the Republican Protection League opposes our monarchist ideology, they have members who could work with us against a common enemy and for the protection of democracy. We should combine pro-democratic forces from these militias into an army unit ready to defend our democracy.

 AUS_imperial_democracy: "Имперская демократия" # Imperial Democracy
 AUS_imperial_democracy_desc: "Наше имперское видение – это не авторитаризм, а демократия. Мы стремимся создать демократическую федерацию многих наций, объединенных под мудрым руководством императора. Слишком многие верят, что стабильность можно восстановить только посредством диктатуры, но мы стремимся достичь большего идеала." # Our imperial vision isn’t one of authoritarianism, but one of democracy. We seek to create a democratic federation of many nations, united under the wise leadership of an emperor. Too many believe that stability can only be restored through dictatorship, but we seek to accomplish a greater ideal.

 AUS_trade_with_italy: "Торговля с Италией" # Trade with Italy
 AUS_trade_with_italy_desc: "У Австрии не всегда были хорошие отношения с Италией. Хотя они и оккупируют бывшие земли Габсбургов, было бы неразумно противодействовать им, пока мы не будем к этому готовы. В знак доброй воли нам следует заключить с ними взаимное торговое соглашение. Показав им на данный момент, что Австрия готова оставаться другом даже под властью Габсбургов." # Austria hasn’t always had a good relationship with Italy. While they do occupy former Habsburg lands, it wouldn’t be wise to antagonise them before we are ready. As a sign of goodwill, we should reach out for a mutual trade agreement with them. Showing them, for now, that Austria is willing to still be a friend even under Habsburg rule.

 AUS_trade_with_bulgaria: "Торговля с Болгарией" # Trade with Bulgaria
 AUS_trade_with_bulgaria_desc: "Болгария могла бы стать хорошей страной для улучшения отношений. Как и мы, они разделяют поражение в Великой войне и имеют интересы против других стран, которые сейчас владеют бывшими землями Габсбургов. Хотя мы не обязательно будем заинтересованы в альянсе, мы могли бы заключить с ними торговое соглашение." # Bulgaria could be a good country to facilitate better relations. Like us, they share the defeat of the Great War and have interests against other countries that now hold former Habsburg lands. While we wouldn’t necessarily be interested in an alliance, we could foster a trade agreement with them.

 AUS_expose_the_demons: "Разоблачить демонов" # Expose the Demons
 AUS_expose_the_demons_desc: "Многих в Австрии привлекают ложные надежды валькизма. Эта новая форма немецкого национализма стремится подорвать наше правительство. Мы должны раскрыть людям уродливые стороны этой идеологии, заставив их понять, что Австрия никогда не сможет пасть и утратить свою идентичность из-за валкистской Германии." # Many in Austria are attracted by the false hopes of Valkism. This new form of German nationalism seeks to undermine our government. We have to expose the ugly sides behind this ideology to the people, making them understand that Austria can never fall and lose our identity to a Valkist Germany.

 AUS_revere_the_angels: "Почитай ангелов" # Revere the Angels
 AUS_revere_the_angels_desc: "Мы не можем позволить людям потерять веру в демократию. Нам нужно показать им, что эта система может работать, и пропагандировать ее среди всех австрийцев. Давайте развернём продемократическую пропаганду, которая поддержит как наше движение, так и других демократов-единомышленников в Австрии." # We can’t let the people lose faith in democracy. We need to show them that this system can work, and to promote it for all Austrians. Let’s turn out pro-democratic propaganda, that will prop up both our movement, as well as other like-minded democrats in Austria.

 AUS_attract_hungarian_refugees: "Привлечь венгерских беженцев" # Attract Hungarian Refugees
 AUS_attract_hungarian_refugees_desc: "Реваншистская диктатура в Венгрии привела к исходу диссидентов из страны, многие из которых принадлежат к немецкому меньшинству страны. Мы встретим их с распростертыми объятиями." # The revanchist dictatorship in Hungary has led to an exodus of dissidents from the country, many of whom are from the country’s German minority. We shall welcome them with open arms.

 AUS_an_alliance_with_officers: "Союз с офицерами" # An Alliance with Officers
 AUS_an_alliance_with_officers_desc: "Многие австрийские офицеры, как бывшие, так и нынешние, служили под властью Габсбургов во время Великой войны и считают возвращение Габсбургов благословением. Они узнали, что Республика означает нестабильность и хаос, и мечтают о величии Империи. Создавая союзы с офицерством и продвигая сторонников Габсбургов, мы создадим сильного союзника в армии." # Many Austrian officers, both former and current ones, served under Habsburg rule during the Great War and see the return of the Habsburgs as a blessing. They have learned that the Republic means instability and chaos, and dream of the greatness of the Empire. By creating alliances with the officers and promoting Habsburg loyalists, we will create a strong ally in the army.

 AUS_recall_stjepan_sarkotic: "Вспомним Степана Саркотича" # Recall Stjepan Sarkotic
 AUS_recall_stjepan_sarkotic_desc: "Степан Саркотич — старый и уважаемый ветеран Великой войны. Тот, у которого многие наши молодые офицеры могут многому научиться. Кроме того, он является центральной фигурой в хорватской эмигрантской общине в Австрии, и его присутствие у нас могло бы оказаться полезным, чтобы сделать хорватов более счастливыми в будущем правлении Габсбургов." # Stjepan Sarkotić is an old, respected veteran from the Great War. One that many of our younger officers can learn a lot from. In addition, he is a central figure in the Croatian émigré community in Austria, and having him with us could prove useful in making the Croatians more happy with future Habsburg rule.

 AUS_reforming_the_kuk: "Реформирование кук" # Reforming the k.u.k
 AUS_reforming_the_kuk_desc: "Императорская и Королевская армия, также известная как Общая армия, была самой крупной частью австро-венгерских вооруженных сил и ярким признаком былой славы нашей Империи. Чтобы восстановить славу империи Габсбургов, нам необходимо реформировать Общую армию и сделать ее предметом зависти Европы." # The Imperial and Royal Army, also known as the Common Army, was the largest part of the Austro-Hungarian armed forces and a strong sign of our Empire’s former glory. To restore the glories of the Habsburg Empire, we need to reform the Common Army and make it the envy of Europe.

 AUS_akademisches_corps_ottonen: "Академический корпус Оттонена" # Akademisches Corps Ottonen
 AUS_akademisches_corps_ottonen_desc: "Академический корпус Оттонена с 1920-х годов играет важную роль в противодействии немецким националистическим тенденциям в Австрии и в распространении ценностей Европейской Империи – Объединенной Европы, управляемой Габсбургами. С распространением валькизма и народных настроений Корпус стал более инклюзивным для еврейской общины Австрии." # The Akademisches Corps Ottonen has since the 1920s played an important role to counter the German nationalist tendencies in Austria, and to spread the values of a European Empire - a United Europe ruled by the Habsburgs. Increasingly, with the spread of Valkism and völkish sentiments, the Corps have become more inclusive to the Jewish community in Austria.

 AUS_calling_all_princes: "Обращение ко всем принцам" # Calling all Princes
 AUS_calling_all_princes_desc: "Хотя многие Габсбурги вернулись в Австрию, когда к власти пришел Отто фон Габсбург, принцы семьи Габсбургов до сих пор живут по всей Европе. Нам нужно дать понять, что им нужно вернуться и служить семье, снова служить Империи." # While many Habsburgs came back to Austria when Otto von Habsburg came to power, princes of the Habsburg family still live all over Europe. We need to send the call that they need to come back and serve the family, to serve the Empire yet again.

 AUS_reform_royal_academies: "Реформа королевских академий" # Reform Royal Academies
 AUS_reform_royal_academies_desc: "Императорская Австрия не была страной, чуждой обучению и инновациям. Фактически, наука и учение должны стать краеугольным камнем нашей новой Империи. Мы должны реформировать наши учебные заведения, продвигать образование и сочетать эти ценности с идеалами монархизма и общеевропейского сотрудничества." # Imperial Austria was not a land foreign to learning and innovation. In fact, science and teachings should be a cornerstone of our new Empire. We should reform our institutions of learning, promoting education and blending these values with the ideals of monarchism and pan-European cooperation.

 AUS_creating_a_resistance_network: "Создание сети сопротивления" # Creating a Resistance Network
 AUS_creating_a_resistance_network_desc: ""

 AUS_destroy_militias: "Уничтожить ополченцев" # Destroy Militias
 AUS_destroy_militias_desc: "Ополченцы – это беда для нашей прекрасной нации. Это остатки темных времен, которые продолжаются и преследуют нас каждый момент бодрствования. Хотя насилие на улицах в основном утихло, мы не можем допустить, чтобы монополия на насилие оказалась в руках некоторых головорезов. Времена меняются, и мальчикам, играющим в войну, больше нет места." # Militias are a blight on our beautiful nation. They are remnants of a dark time which linger on and haunt us every waking moment. While the violence on the streets has mostly died down, we can not allow for the monopoly of violence to be placed in the hands of some thugs. With changing times, there is no more room for boys playing war.

 AUS_integrate_moderate_militiamen: "Интегрируйте умеренных ополченцев" # Integrate Moderate Militiamen
 AUS_integrate_moderate_militiamen_desc: "Хотя многие ополченцы продолжают причинять вред нашей прекрасной нации, есть и те, кто желает реформироваться и интегрироваться. Хотя нам нужно уничтожить худших из этих головорезов, некоторые из них могут оказаться полезными в наших вооруженных силах. Давайте дадим некоторым из них возможность добиться успеха, чтобы они не вернулись к этим бандитским путям." # While many militiamen continue to be a blight on our beautiful nation, there are those willing to be reformed and integrated. While we need to bring down the worst of these thugs, some can prove to be useful in our armed forces. Let’s give some of them an opportunity to succeed, so they don’t return to these thuggish ways.

 AUS_the_matter_of_loyalty: "Вопрос лояльности" # The Matter of Loyalty
 AUS_the_matter_of_loyalty_desc: "Лояльность очень важна для выживания австрийского народа, и поэтому мы должны с ней справиться. Многие агенты Германии все еще существуют, и их необходимо раздавить!" # Loyalty is highly pertinent for the survival of the Austrian people and hence we must deal with it. Many agents of Germany are still out there, and they must be crushed!

 AUS_a_strict_doctrine: "Строгая доктрина" # A Strict Doctrine
 AUS_a_strict_doctrine_desc: "Новый к.у.к. — это армия, верная короне и народу Австрии. Они не сломаются и не будут тратить время на отклонения в мельчайших деталях. Таким образом, мы сможем создать армию, которая сможет противостоять Германии и защитить Австрийское королевство." # The new k.u.k. is an army that is loyal to the crown and the people of Austria. They will not break and will not waste their time deviating over minute details. This way, we will be able to develop an army that can both stand against Germany and protect the Austrian realm.

 AUS_basically_jansas_plan_but_with_resistance: "Планируйте доктрину сопротивления" # Plan a Doctrine of Resistance
 AUS_basically_jansas_plan_but_with_resistance_desc: "Мы должны быть готовы к тому, что дела пойдут на спад и к тому, что Германия встретится с нами с подавляющим численным превосходством. Однако при недостатке численности у нас есть дух и умы, поскольку немцы гораздо более перенапряжены, чем мы, и поэтому мы должны быть готовы заставить их прорваться к крепости Австрии!" # We must be ready for things to go south and for Germany to face us with overwhelming numerical superiority. What we however lack in numbers we have in spirit and brains, for the Germans are far more overextended than we are and hence we must be ready to force them to crack on fortress Austria!

 AUS_learning_from_the_isonzo: "Уроки Изонцо" # Learnings from the Isonzo
 AUS_learning_from_the_isonzo_desc: "Битвы при Изонцо обошлись нам дорого — и мы даже не были нападавшими! Мы должны быть готовы учиться на своих ошибках и исправить нашу тактику в горах и снабжении, чтобы нам никогда больше не пришлось столкнуться с такой перспективой 13-го Изонцо." # The Battles of the Isonzo was a costly experience for us - and we were not even the attackers! We must be ready to learn from our mistakes and rectify our tactics in the mountains and supplies so that we may never again have to face such a prospect of a 13th Isonzo.

