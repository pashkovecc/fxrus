 # VATERLAND FRONT 
  
 AUS_vaterland_front_long_name: "Vaterland Front" #NT!
 AUS_vaterland_front_name: "VF" #NT!
  
 # ARMY FOCUS 
  
 AUS_burn_treaty_of_linz: "Burn the Treaty of Saint-Germain" #NT!
 AUS_burn_treaty_of_linz_desc: "Under the current stipulations of the Saint-Germain treaty, we might as well head to Berlin pleading for mercy today. For Austria to be safe, free and proud, the Saint-Germain treaty cannot stand any longer." #NT!
  
 AUS_reform_general_staff: "Reform the General Staff" #NT!
 AUS_reform_general_staff_desc: "General staff reforms may not seem on the surface to be terribly important, but they are key to waging war efficiently and effectively. An effort to ensure that this branch of the military is modern will also herald a total modernization of the army." #NT!
  
 AUS_modernize_theresian_military_academy: "Modernise the Theresian Military Academy" #NT!
 AUS_modernize_theresian_military_academy_desc: "The Austrian military tradition is long, but the last two decades of technological development have left behind our strategies and plans in the dust. A modernization of the academy must begin to uphold Austria." #NT!
  
 AUS_preserve_army_traditions: "Preserve Army Traditions" #NT!
 AUS_preserve_army_traditions_desc: "We have a long, if not necessarily totally illustrious military history. Still, no one can deny who our forefathers were, and their victories, from Aspern-Essling to Caporetto. In these times where even the Austrian state’s future is uncertain, military traditions ought to be upheld." #NT!
  
 AUS_eimannsberger_kampfwagenkrieg: "Eimannsberger’s Kampfwagenkrieg" #NT!
 AUS_eimannsberger_kampfwagenkrieg_desc: "Despite what our northern neighbors might believe, Austrian theory still trumps their own. Despite the claims of their eminent radicals like Heinz Guderian, his work is clearly stolen from our very own Ludwig von Eimannsberger, whose theories on the deployment of armor in mobile warfare must be taken seriously." #NT!
  
 AUS_support_local_tank_production: "Support Local Tank Production" #NT!
 AUS_support_local_tank_production_desc: "Unfortunately like many of the poorer nations in Europe, the best that we can do in regards to armor production is to simply import and modify foreign-made tanks as we need. This is by no means a desirable situation however, and hence we should try to rectify it to the best of our ability." #NT!
  
 AUS_expand_alpine_fortifications: "Expand Alpine Fortifications" #NT!
 AUS_expand_alpine_fortifications_desc: "The Alps are hard to get passed through even in normal conditions, however, we are not in a position to bet on victory. The Germans will use anything and everything to destroy our defences, we need to reinforce every part of our country, and this includes the Alps." #NT!
  
 AUS_armored_spearhead: "Armored Spearhead" #NT!
 AUS_armored_spearhead_desc: "Austria may be a small nation, but small nations can clearly still punch above their weight as seen from Serbia in 1914. With recent developments into armor tactics pioneered by our generals, Austrian tanks shall soon be ready to smash through the enemy’s lines and achieve victory!" #NT!
  
 AUS_mountain_artillery: "Integrate Mountain Artillery" #NT!
 AUS_mountain_artillery_desc: "We will likely be facing our enemies in mountainous terrain, where regular artillery works rather dismally compared to usual. Thankfully, there is a remedy, that being mountain artillery which can be easily hauled up by our forces and capable of withstanding the tough conditions of the mountains." #NT!
  
 AUS_expand_the_gebirgsjager: "Expand the Gebirgsjäger" #NT!
 AUS_expand_the_gebirgsjager_desc: "Fighting at an altitude of more than quadruple digits weighs on the soul and requires a special set of skills. The Gebirgsjäger are our elite fighters in this theatre, a theatre we can expect to face plenty of combat in. As such, an expansion of this vaunted force is very much needed." #NT!
  
 AUS_expand_logistic_capabilities: "Expand Logistical Capabilities" #NT!
 AUS_expand_logistic_capabilities_desc: "No army can survive without food in their stomachs and shoes on their feet. Weapons too must be supplied to the troops if we are to even have hope in protecting our sovereignty, and to this we must endeavor to safeguard and expand our logistical efforts to ensure that all of Austria’s sons can fight as best they can." #NT!
  
 AUS_motorize_the_heer: "Motorisation of the Heer" #NT!
 AUS_motorize_the_heer_desc: "The era of the horse is over. While we may still extensively rely on horses for transportation, motorization is mandatory if the army is to modernize. We cannot be stuck walking on foot and waiting for supplies to reach while the enemy runs circles around us." #NT!
  
 AUS_anti_tank_weaponry: "Implementation of Anti-Tank Weaponry" #NT!
 AUS_anti_tank_weaponry_desc: "If there is a cheap way to counter the overwhelming strength of the panzers, it is anti-tank weaponry. Whether they are specialized pieces, grenades or even novel pieces of technology, any such item should be utilized for us to resist at low cost the enemy’s tanks." #NT!
  
 AUS_modernize_equipment: "Modernise the Volksheer Equipment" #NT!
 AUS_modernize_equipment_desc: "After the humiliating defeat in the Great War, the Austrian military remnants formed the Volksheer, this force is old, and frankly, a relic of the past. Buresch and other chancellors tried to improve the situation, but nothing much was achieved. However, now without the limitations of the past, we can finally start the modernisation of our equipment." #NT!
  
 AUS_fund_military_innovations: "Fund Military Innovations" #NT!
 AUS_fund_military_innovations_desc: "The old k.u.k. army always left something to be desired when it came to military technology. We still suffer from the general dearth of investment into military technology, which is vital if we are to somehow resist the menaces to Austrian freedom." #NT!
  
 AUS_create_paratrooper_units: "Create Airborne Units" #NT!
 AUS_create_paratrooper_units_desc: "Few could have dreamed of an era where soldiers would come not just from the ground or from sea, but from the air. The potential uses of airborne forces are so numerous that it may very well be a worthy investment even for us." #NT!
  
 AUS_use_civillian_pilot_schools: "Use Civilian Pilot Schools" #NT!
 AUS_use_civillian_pilot_schools_desc: "Our pilots need to learn how to fly, but this was unfortunately hindered by the strict stipulations of Saint-Germain. Luckily, there are many civilian pilot schools whose experts can help us in setting up an air force." #NT!
  
 AUS_buy_planes_from_eastern_europe: "Buy Planes from Eastern Europe" #NT!
 AUS_buy_planes_from_eastern_europe_desc: "Even if they are not the best of the best, we cannot be picky when it comes to what aircraft we can pick. The nations of Eastern Europe have indicated their willingness to sell us planes that we will need to control Austria’s skies." #NT!
  
 AUS_build_brumowski_air_base: "Construct the Brumowski Air Base" #NT!
 AUS_build_brumowski_air_base_desc: "For the air force to be of any use, there must be some sort of base that our pilots can take off from. Civilian runways and other hastily created structures just will not cut it anymore - a proper air base is needed." #NT!
  
 AUS_produce_austrian_fighters: "Produce Austrian Fighters" #NT!
 AUS_produce_austrian_fighters_desc: "LIke many foreign nations, much of our aircraft hails from abroad, designed or manufactured by potential future enemies of Austria. While this is mainly a matter of practical necessity, it too is a shameful legacy for one of the chief combatants in the Great War. Let us thus see to it that an Austrian fighter controls Austrian skies." #NT!
  
 AUS_produce_austrian_bombers: "Produce Austrian Bombers" #NT!
 AUS_produce_austrian_bombers_desc: "It may seem like a fantasy, but an Austrian bomber project could very well prove to be a decisive factor in the next war. All theory points towards the triumph of the bomber from the skies, and our enemies will certainly think twice if an armada of bombers is prepared to flatten their factories and terrorize their people." #NT!
  
 AUS_adopt_dive_bomber_tactics: "Adopt Dive Bomber Tactics" #NT!
 AUS_adopt_dive_bomber_tactics_desc: "Dive bombing is a risky manoeuvre to pull off in some ways, but it is one that results in devastating accuracy for the bomber. This will be crucial if we are to help our air force support the troops on the ground, who already stand outnumbered by many of our foes." #NT!
  
 AUS_finish_air_defense_systems: "Finish the Austrian Air Defence System" #NT!
 AUS_finish_air_defense_systems_desc: "While it is unfortunate, the truth is that we are very unlikely to hold any kind of air supremacy in our future wars, at least in the immediate future. An air defence system is hence vital if we are to resist the enemy’s efforts to terrorize our people into submission through bombing." #NT!
  
 AUS_armed_forces_of_austria_modernized_and_united: "The Formation of the Bundesheer" #NT!
 AUS_armed_forces_of_austria_modernized_and_united_desc: "We can be proud of how much the Austrian military, once little more than a parade force, can now stand as one of the bastions of freedom and dignity in Central Europe. Austria shall not falter, and freedom shall be protected!" #NT!
  
 # INDUSTRIAL FOCUS 
  
 AUS_economic_recovery: "Towards Economic Recovery" #NT!
 AUS_economic_recovery_desc: "The worst of the recent economic crisis has passed, and thus we ought to restart our efforts to recover some semblance of economic prosperity - lest we end up at the mercy of Germany." #NT!
  
 AUS_fiscal_reforms: "Fiscal Reforms" #NT!
 AUS_fiscal_reforms_desc: "Old spending habits have proven wasteful, while critically undervalued ventures remain unfunded. Our fiscal situation is in dire need of reform, and with the economic crash there is no time like the present for it." #NT!
  
 AUS_dealing_with_equipment: "Dealing with Equipment" #NT!
 AUS_dealing_with_equipment_desc: "Although our industrial base is lacking compared to the titans to our north and south, we still inherit the legacy of the extensive companies that equipped the armies of the Dual Monarchy. As such, we must be ready to deal with such matters - even if only to maintain their legacy." #NT!
  
 AUS_fate_of_steyr: "Fate of Steyr-Daimler-Puch" #NT!
 AUS_fate_of_steyr_desc: "Steyr-Daimler-Puch is one of the largest weapons manufacturers in Austria, and they are crucial in equipping all of our soldiers with armaments. However, it still remains out of our reach and hence we must decide if we are to simply cooperate closely with them or if we should take on a stronger role regarding them." #NT!
  
 AUS_import_equipment: "Import Equipment" #NT!
 AUS_import_equipment_desc: "We simply are unable to produce everything that we need when it comes to military equipment. Even if rifles and machine guns can be made here, boots, bandages and other essentials in modern war still must be imported, and hence we must do so post-haste." #NT!
  
 AUS_national_contracts: "Contracts with Austrian Companies" #NT!
 AUS_national_contracts_desc: "In these unstable times, only cooperation between government and private enterprise can see Austria through. While Austrian manufacturers may not be the largest in the world, their products are still vital to our survival and thus contracts for their weapons must be executed at once!" #NT!
  
 AUS_nationalise_factories: "Nationalise Factories" #NT!
 AUS_nationalise_factories_desc: "With hard times falling on all of Austria, many factories are beginning to go out of business. However, such a thing can only mean a further downward spiral into economic degeneration, with the only cure being nationalization of failing factories." #NT!
  
 AUS_expand_frei_arbei: "Freiwilliger Arbeitsdienst" #NT!
 AUS_expand_frei_arbei_desc: "Under the laborious Saint-Germain Treaty, many young men became unable to join the army where their only prospects may have been laid. Now with the economic crisis, masses of sullen young workers are chafing under unemployment and threaten societal stability. The only remedy is a labor service to reinvigorate their spirit and the economy." #NT!
  
 AUS_catholic_works: "Invest in Catholic Works" #NT!
 AUS_catholic_works_desc: "Catholicism is one of the bedrock of the Austrian state, differentiating us greatly from our zealous German brothers from the north. Their good works include education, charity and other things that all come together to make them worthy of state investment, especially in these times of crisis." #NT!
  
 AUS_bail_out_agriculture: "Bail Out Agriculture" #NT!
 AUS_bail_out_agriculture_desc: "Austrian agriculture has been hit hard by the recent crash, with foreclosures and destitution becoming the fate of many poor rural laborers. A bailout for now is the only way we can stop this disastrous situation from worsening." #NT!
  
 AUS_electrify: "Electrify the Country" #NT!
 AUS_electrify_desc: "It is ironic that one of the former great powers of Europe has yet to electrify the nation, while our once weak neighbors speed ahead into the modern age. If we are to take on the true German way, we must ensure that both the city and countryside have at least electricity!" #NT!
  
 AUS_empower_corporations: "Empower the Corporations" #NT!
 AUS_empower_corporations_desc: "Corporations are a crucial part of Austrian society, and they are thankfully not prone to competing with one another - an endeavor that will only encourage waste on pointless innovations. Their empowerment is vital for our economic recovery." #NT!
  
 AUS_reform_the_corporate_system: "Reform the Corporate System" #NT!
 AUS_reform_the_corporate_system_desc: "The folly of large companies controlling the market has shown itself in an laughably cruel form in the London Stock Market crash. A wholesale reform of the system is needed to see the Austrian economy properly bounce back." #NT!
  
 AUS_rethink_power_plant: "The Tauern Hydroelectric Power Plant" #NT!
 AUS_rethink_power_plant_desc: "When opened, the Tuern Hydroelectric dam will be one of the largest in Europe, greatly reducing our dependence on energy resources such as coal." #NT!
  
 AUS_infraestructure_initiatives: "Infrastructure Initiatives" #NT!
 AUS_infraestructure_initiatives_desc: "Injections into the economy will prove necessary if we are to restore our former prosperity. Infrastructure is a vital part of modern development, yet past governments have neglected this part of governance. Let us rectify this at once by calling on the Austrian people to pave a new Austria in the cities and countryside!" #NT!
  
 AUS_end_austerity: "End Austerity" #NT!
 AUS_end_austerity_desc: "Austerity may have once been useful, but it is not a pleasant experience. With the crisis subsiding further, austerity is now in fact proving to be a hindrance to further growth and must thus be done away with." #NT!
  
 AUS_bundesbahn: "Expand the Bundesbahn" #NT!
 AUS_bundesbahn_desc: "Railways are a crucial part of the economy, so it is obvious that some new investment into their development is necessary. An expansion of the Bundesbahn will help to bind Austrians closer together, and will provide much needed work for many." #NT!
  
 AUS_expand_social_programs: "Expand Social Programs" #NT!
 AUS_expand_social_programs_desc: "The most destitute in society do not deserve their miserable situation, and in any case they are better off receiving morsels from us instead of stealing them from innocents. If we are to curb the harsh effects of economic depression, some help for the people is needed." #NT!
  
 AUS_vienna_uni_investment: "Invest in the University of Vienna" #NT!
 AUS_vienna_uni_investment_desc: "Austrian education shall build the Austria of tomorrow, instilling in all an Austrian identity rather than one bound to Berlin. An expansion of Vienna’s world famous facilities will help our scientific endeavors, as well as grant our people more opportunities to grow Austria’s prestige and strength." #NT!
  
 AUS_a_recovering_economy: "Recovering Economy" #NT!
 AUS_a_recovering_economy_desc: "The economic crisis has been harsh on our people, but we have not only survived. The crisis has given us the chance to reinvigorate the Austrian economy, for a better tomorrow where Austria stands free and prosperous." #NT!
  
 AUS_credianstalt: "Integrate the Creditanstalt" #NT!
 AUS_credianstalt_desc: "The Creditanstalt crash of 1931 was one that crippled the economies of not just Austria, but of Germany too. With millions having found their savings wiped out, we have to ensure that such a thing never happens again. This can only be done through the integration of the Creditanstalt into the government." #NT!
  
 AUS_expand_sudbahn: "Expand the Südbahn" #NT!
 AUS_expand_sudbahn_desc: "Our connections with the rest of the world by rail remain rather small, hampering our ability to trade. Expanding the Südbahn into Slovenia will help to alleviate relations with our southern neighbor, as well as allowing us to connect further into the world economy." #NT!
  
 AUS_expand_mines: "Expand Austrian Mines" #NT!
 AUS_expand_mines_desc: "Even if we are not able to pursue full autarky, some self-sufficiency regarding natural resources is key for our development and national security. The mines of Austria still remain generally unexploited and are practically begging for some exploration and expansion for the nation’s gain." #NT!
  
 AUS_steyr_expansion: "Expand the Steyr-Daimler-Puch" #NT!
 AUS_steyr_expansion_desc: "Steyr-Daimler-Puch has survived the recent crisis and as the largest weapons manufacturer in Austria is crucial to national security. Investments into the company will not go to waste." #NT!
  
 AUS_invest_into_graz: "Invest in Graz" #NT!
 AUS_invest_into_graz_desc: "Many think of Vienna when they think of Austria, but Vienna is not the only city in the country. Graz stands as one of the few cities in the homeland that can rival Vienna and is well-worthy of some development." #NT!
  
 AUS_resource_prospects: "Resource Prospects" #NT!
 AUS_resource_prospects_desc: "Local resources are cheaper and safer to procure than dependency on imported raw goods. As resource prospecting has been a critically underdeveloped sector, we must be ready to go full-force in developing Austria’s resource potential." #NT!
  
 AUS_expand_agricultural_sector: "Expand the Agricultural Sector" #NT!
 AUS_expand_agricultural_sector_desc: "With agriculture surviving the recent crisis, we must now revive it. A healthy agrarian sector is the only way for the long-term viability of the Austrian nation, making investments into mechanization and rural infrastructure vital." #NT!
  
 AUS_favor_industry: "Favour Industrial Interests" #NT!
 AUS_favor_industry_desc: "The sad reality is that agriculture is not viable for Austrians to pursue. The farmers must simply realize that Austria is not able to be self-sufficient in a diminished state, especially when the alternative is cheaper food for the people as a whole. Industrial interests are right - tariffs on food must be removed!" #NT!
  
 AUS_protect_austrian_farmers: "Protect Austrian Farmers" #NT!
 AUS_protect_austrian_farmers_desc: "Foreign agriculture is simply an un-Austrian import for the greedy capitalists of Vienna, Graz and Salzburg to satiate their endless consumption. We must protect the people of the land from the threat of foreign-made foods which in any case create a dependency on foreign peoples." #NT!
  
 AUS_way_to_autarky: "On the Road to Autarky" #NT!
 AUS_way_to_autarky_desc: "Autarky is not an undesirable objective, for it is a sign of an independent and strong nation as well as people. Through further agricultural development, we can ensure no Austrian shall ever go hungry again." #NT!
  
 # FOREIGN MINISTRY FOCUS 
  
 AUS_expand_the_foreign_ministry: "Expand the Foreign Ministry" #NT!
 AUS_expand_the_foreign_ministry_desc: "With our position in Europe fragile, it is imperative we expand the foreign ministry, to strengthen ties with other states economically, as well as aid us in deterring German aggression." #NT!
  
 AUS_ally_czechia: "An Ally in Prague" #NT!
 AUS_ally_czechia_desc: "In Prague, like-minded brothers opposed to Berlin's imperial ambitions stand as well. While we may have our disagreements over their German minority, we hold far more history in common than many realize, making an alliance between our peoples an important goal." #NT!
  
 AUS_subjugate_czechia: "Liberate Sudeten Germans" #NT!
 AUS_subjugate_czechia_desc: "The Sudeten Germans are our brothers, both in history and blood. The irresponsible Prague statelet seeks to subjugate them however, and to this we must protect the Sudeten Germans by all means necessary, even force." #NT!
  
 AUS_attack_hungary: "Strike Hungary" #NT!
 AUS_attack_hungary_desc: "Our Magyar neighbor has never been the nicest, especially not in recent times. Now they have fallen to the lowest of the low, and for this they need to be corrected." #NT!
  
 AUS_purchase_polish_artillery: "Purchase Polish Artillery" #NT!
 AUS_purchase_polish_artillery_desc: "The Poles have a much greater base from which they can manufacture and prepare themselves against the German menace. With ties having improved between us over the last decade, let us reap its fruits by acquiring desperately needed equipment for ourselves." #NT!
  
 AUS_expand_the_jansas_plan: "Expand Jansa's Plan" #NT!
 AUS_expand_the_jansas_plan_desc: "We now have the ability to build in Czech territory, which will let us work with Czechs in building a line that will be far too difficult for the Germans to crack - at least if they would like to keep their men from perishing pointlessly!" #NT!
  
 AUS_send_an_attache_to_spain: "Study the Spanish Civil War" #NT!
 AUS_send_an_attache_to_spain_desc: "The Spanish Civil War has turned out to be different from the Great War, with an emphasis on rapid movement and use of aircraft in coordination with armoured vehicles. It must be studied greatly. " #NT!
  
 AUS_reclaim_tyrol: "Reclaim Tyrol" #NT!
 AUS_reclaim_tyrol_desc: "The Tyroleans cry out for freedom, awaiting the day where they are ruled by Germans rather than uncaring Roman elites. While the Italians are strong, the German will is stronger and we shall liberate our brothers!" #NT!
  
 AUS_vienna_accord: "The Vienna Accords" #NT!
 AUS_vienna_accord_desc: "For all intents and purposes, the Entente are but the lesser of two highly devilish foes that we must face in the coming years. An alliance with them would be a disgrace to everything our forefathers fought for, not to mention that relying on them is plainly unreliable. Instead, we should reach out to the Koblenz government who like us also oppose the Valkist menace and stand together in the containment of Berlin." #NT!
 AUS_vienna_accord_tt: "We will invite [RHI.GetNameDef] to an alliance to combat the [GER.GetAdjective] threat." #NT!
  
 AUS_join_entente: "Join the Entente" #NT!
 AUS_join_entente_desc: "It is a truly unfortunate thing, but the Entente are our best bet of maintaining independence. Obviously, such a thing would not be terribly palatable to the nation, but with Germany on the march, there is simply no other choice." #NT!
  
 AUS_demand_slovenia: "Retake Slovenia" #NT!
 AUS_demand_slovenia_desc: "Slovenia is rightfully German, yet the Serbs continue to subjugate and extract wealth from the poor Slovenes and Germans that inhabit it. It is our duty to liberate Slovenia from this irresponsible government!" #NT!
  
 AUS_send_an_attache_to_spf: "[SPF.GetNameDef]" #NT!
 AUS_send_an_attache_to_spa: "[SPA.GetNameDef]" #NT!
 AUS_send_an_attache_to_spr: "[SPR.GetNameDef]" #NT!
 AUS_send_an_attache_to_spm: "[SPM.GetNameDef]" #NT!
  
 AUS_send_an_attache_to_spain_tooltip: "Send an §Yattaché§! to §Y[AUS_send_an_attache_to_spain_loc]§!." #NT!
 AUS_foreign_one_cze: " Has a §YDefensive Pact§! with [CZE.GetFlag]§Y[CZE.GetNameDef]§!." #NT!
 AUS_in_120_days: "In 120 days:" #NT!
 AUS_foreign_jansas_plan_cze: "Jansa's Plan - Construction" #NT!
 AUS_foreign_jansas_plan_aus: "Jansa's Plan - Construction" #NT!
  
 # POLITICAL FOCUS 
  
 AUS_starting_anew: "A New Year, Old Challenges" #NT!
 AUS_starting_anew_desc: "As 1936 dawns on our nation, Austria’s fate remains unclear. With a resurgent Germany to the north, and continued uncertainty in all of our neighbors, how will things evolve for Austria in the coming year?" #NT!
  
 AUS_taking_a_loan: "Taking Another Loan" #NT!
 AUS_taking_a_loan_desc: "We need cash, badly. Economic ruin has been the main thing on everyone’s mind following the criminal behavior of the banks in 1931, and to continue our economic recovery, we must be ready to do what is needed." #NT!
  
 AUS_continue_investing_brr: "New Austrian Projects" #NT!
 AUS_continue_investing_brr_desc: "To reinvigorate the economy, more investment is needed than ever. With our recent loan, we will be able to repay it tenfold if we invest it prudently." #NT!
  
 AUS_military_sector: "Secret Deals with the Heimwehr" #NT!
 AUS_military_sector_desc: "The Heimwehr are a strong political faction within the republic and are not to be trifled with. We thankfully however share with them a common understanding of the evils of socialism, which we can leverage to ensure their aid." #NT!
  
 AUS_strengthen_the_graz_csp: "Ostmärkische Sturmscharen Graz" #NT!
 AUS_strengthen_the_graz_csp_desc: "Graz is a vital part of the Austrian nation, but it still remains up in the air as to whom it holds allegiance to. The Ostmärkische Sturmscharen are a loyal paramilitary, and a strengthening of their presence in Graz will do much good." #NT!
  
 AUS_reinforce_csp_at_burgenland: "Ostmärkische Sturmscharen Burgenland" #NT!
 AUS_reinforce_csp_at_burgenland_desc: "As their only truly cordial neighbor, the Hungarians have been awfully tight-lipped on the question of Burgenland by ultranationalist standards. Still, it would not hurt to consolidate our hold on the province, if only to silence potential dissent from Budapest’s agents." #NT!
  
 AUS_the_parliament_restores_order: "Parliament Restores Order" #NT!
 AUS_the_parliament_restores_order_desc: "" #NT!
  
 AUS_to_the_strongest: "The Strongest Prevails" #NT!
 AUS_to_the_strongest_desc: "" #NT!
  
 AUS_dolfuss_successor: "Schuschnigg Takes Control" #NT!
 AUS_dolfuss_successor_desc: "Dollfuß’s death has hit all Austrian patriots very hard, but we struggle nevertheless. The new way forward for Austria is clear, one that is not weighed down by democracy, with his heir, Kurt Scuschnigg at the helm." #NT!
  
 # Schuschnigg 
 AUS_new_constitution: "Draft a Temporary Constitution" #NT!
 AUS_new_constitution_desc: "A new constitution that overrides the ineffectiveness of parliamentary democracy is in order, which with the backing of the military will be especially key in ensuring a godly and orderly Austria." #NT!
  
 AUS_promulgate_the_may_constitution: "Promulgate The May Constitution" #NT!
 AUS_promulgate_the_may_constitution_desc: "We shall complete Dollfuß’s work by ensuring that his well-laid constitution on the new corporate order in Austria is seen through. No more shall ineffective liberalism malaise Austria!" #NT!
  
 AUS_corporatism: "Economical Corpus" #NT!
 AUS_corporatism_desc: "To first build the corporate state, we must ensure that the planning and theory of the corporate state is well understood by the public at large. Marxism and its class-warfare drivel shall be smashed into the dust!" #NT!
  
 AUS_future_of_unions: "The Future of Unions" #NT!
 AUS_future_of_unions_desc: "Unions are not inherently evil, but they sink to the unfortunate status of tools of class warfare by the International. We must ensure that any united body of the working class is only united with the rest of Austrian society." #NT!
  
 AUS_eliminate_socialist_parties: "Eliminate Socialism" #NT!
 AUS_eliminate_socialist_parties_desc: "Out with socialism! This is the one motto most of sane humanity can agree with. We must ensure that Bolshevism and all of its derivatives have been thoroughly exterminated from Austrian society." #NT!
  
 AUS_eliminate_parliamentarism: "Rip the Parliamentarian Veil" #NT!
 AUS_eliminate_parliamentarism_desc: "Parliamentarianism is a joke, but a disastrous one at that. Far from seeing a more prosperous Austria, it has only divided us and caused us great harm, making its death the only way for a new Austria." #NT!
  
 AUS_unitary_economy: "Der Ständestaat" #NT!
 AUS_unitary_economy_desc: "The Ständestaat is on the horizon of being created, but maintaining it will not be a simple task. Yet, we already see its effects as Austrian society becomes harmonious once more - three cheers to the Ständestaat!" #NT!
  
 AUS_establish_the_front: "Establish the Vaterländische Front" #NT!
 AUS_establish_the_front_desc: "A broad front that overcomes political parties is needed if we are to see Austria independent and harmonious again. The Fatherland Front shall be just the vehicle to ensure this." #NT!
  
 AUS_buy_loyalty: "Buy Loyalty" #NT!
 AUS_buy_loyalty_desc: "Fear is not necessarily the most effective motivator. Gold can be just as, if not more effective in persuading our political rivals to join us in pursuing a better Austria for tomorrow." #NT!
  
 AUS_crush_socialist_militias: "Crush the Schutzbund" #NT!
 AUS_crush_socialist_militias_desc: "Socialist thugs are the best way to describe the supposed \"protection league\" that is the Republikanischer Schutzbund. Its disintegration shall ensure none can threaten our rule." #NT!
  
 AUS_ally_moderate_hemiwehr: "Deal with the Heimwehr" #NT!
 AUS_ally_moderate_hemiwehr_desc: "The Heimwehr are like-minded brothers in the pursuit of a corporate, united Austrian state. Even if they have had their difficulties with pan-German madmen, they can still be worked with to ensure that our regime has solid backing." #NT!
  
 AUS_intergrate_allies_in_landbund: "Integrate Landbund Allies" #NT!
 AUS_intergrate_allies_in_landbund_desc: "The Landbund are a group with whom we can easily compromise with and whose programme relating to the land we can agree with. To make it a true corporate front, let us bring them into the Fatherland Front." #NT!
 AUS_intergrate_allies_in_landbund_tt: "Gives §Y[ROOT.GetName]§! §Y1 political power§! for each percentage of popularity in the §Ysocial liberal§! and §Ymarket liberal§! ideologies. Currently: [?pp_to_give|Y]" #NT!
  
 AUS_intergrate_allies_in_CS: "Integrate CS Allies" #NT!
 AUS_intergrate_allies_in_CS_desc: "The Christian-Socials were the bulwark of all that is right in Austria during the days of the republic, and up until now remain our staunchest allies. Their entry into the Fatherland Front shall cement its status as the voice of the nation." #NT!
 AUS_intergrate_allies_in_CS_tt: "Gives §Y[ROOT.GetName]§! §Y1 political power§! for each percentage of popularity in the §Ysocial conservative§! ideology. Currently: [?party_popularity_100@social_conservative|Y]" #NT!
  
 AUS_eliminate_valkist_networks: "Eliminate German-Völkisch Networks" #NT!
 AUS_eliminate_valkist_networks_desc: "The various Völkisch groups claim to be patriotic, but in reality are nothing but a fifth column for Berlin to use against us. They must be hunted down swiftly. " #NT!
  
 AUS_schuschnigg_for_independence: "The Father of the Nation" #NT!
 AUS_schuschnigg_for_independence_desc: "Kurt Schuschnigg is not a mere tinpot dictator, but rather a guide for the new Austria. The Germans to the north desire to see Austria broken up into individual states that are to be made into Prussian dummies - and for this we shall not stand!" #NT!
  
 AUS_new_nationalism: "Rejuvenate Austrian Nationalism" #NT!
 AUS_new_nationalism_desc: "Austrian nationalism has been an unfortunately weak phenomenon ever since 1919, and often the most patriotic in our nation are not for Austria but rather for Germany! We must see to it that a truly Austrian nationalism takes hold, rather than conceding to Berlin our national hope." #NT!
  
 AUS_christian_values: "Reinforce Christianity" #NT!
 AUS_christian_values_desc: "What separates us from Germany, or anyone else for that matter? A true Austrian tenant is our faith in God, and our willingness to hold on to it even in spite of what bolsheviks and pagans might think. Catholicism is the bedrock of the Austrian nation, to which we must be true." #NT!
  
 AUS_the_youth: "Expand Christian Youth Programmes" #NT!
 AUS_the_youth_desc: "What is a nation without its youth? The youth of Austria have easily manipulated minds, which with the bevy of malicious actors are at great risk of manipulation whether by Berlin or Moscow. We must expand Christian youth programmes to protect them!" #NT!
  
 AUS_ost_guard: "Purify the Bundesgendarmerie" #NT!
 AUS_ost_guard_desc: "The gendarmerie are a key part of maintaining order, but their potential infiltration by unwelcome elements is certainly not something we can take lightly. They must be properly vetted to ensure that only Austrian patriots serve in them." #NT!
  
 AUS_the_new_constitution: "Amend the Constitution" #NT!
 AUS_the_new_constitution_desc: "From now on, the Fatherland Front shall be the only power in Austria. The corporate state can now be truly realized, where all in society cooperate harmoniously for a greater goal of Austrian greatness - where liberal democracy is but a dark chapter of our past." #NT!
  
 AUS_giving_the_ministry_of_agriculture: "Concede to the Landbund" #NT!
 AUS_giving_the_ministry_of_agriculture_desc: "The Landbund knows what to do when it comes to agricultural policy, and in fulfillment of our agreement with them they may dictate what our agricultural policy shall be." #NT!
  
 AUS_expand_help_to_farmers: "Subsidise Small Farming" #NT!
 AUS_expand_help_to_farmers_desc: "Among those hit hardest by Black Wednesday were the small farmers. We shall prop them up with generous subsidies and tax cuts to ensure their survival." #NT!
  
 AUS_defending_austria: "Defending the Fatherland" #NT!
 AUS_defending_austria_desc: "We may have consolidated ourselves internally, but externally lay a far greater threat. The Reich, unrecognizable from our Great War brother, now only hungers for a mad empire stretching from Lisbon to the Urals, and in which we are nothing but a pawn. We must ensure that we can withstand them." #NT!
  
 AUS_prepare_for_storm: "Prepare for The Storm" #NT!
 AUS_prepare_for_storm_desc: "To weather the coming storm, we must prepare ourselves like never before. Every citizen shall be ready to sacrifice for the nation and for our future freedom." #NT!
  
 AUS_destroy_fuhrer_network: "Anti-Subversive Operations" #NT!
 AUS_destroy_fuhrer_network_desc: "There are many subversive elements just waiting for the right call by Berlin to wreak havoc upon our nation. If we are to maintain Austrian freedom, we need to root these traitors out." #NT!
  
 AUS_propaganda_department: "Expand Propaganda Department" #NT!
 AUS_propaganda_department_desc: "Propaganda has shown itself to be a useful tool in ensuring compliance and even fervor. While it may not always be truthful, the truth is a luxury in war. Let us expand our propaganda efforts for a more ready population." #NT!
  
 AUS_anti_anchluss_campaign: "Anti-Anschluß Campaign" #NT!
 AUS_anti_anchluss_campaign_desc: "The entire world still thinks of us as nothing more than a soon-to-be part of Berlin’s empire. They however must be proven wrong and understand that we are not unwitting victims of Germany’s schemes and that we are a free and proud people." #NT!
  
 AUS_south_tyrol_propaganda: "South Tyrol Propaganda" #NT!
 AUS_south_tyrol_propaganda_desc: "Among the many lands snatched away from us after the Great War was Sudtirol. Its German speaking population looks towards Vienna for salvation. We must deliver them." #NT!
  
 AUS_mobolize_the_population: "Mobilise the Public" #NT!
 AUS_mobolize_the_population_desc: "The public must be ready, ready to struggle and fight for Austrian independence. Mass rallies, an increase in propaganda and continuous national broadcasts will ensure everyone is ready to fight for Austria!" #NT!
  
 AUS_conscription: "Enforce Conscription" #NT!
 AUS_conscription_desc: "We need every man who can fight to fight, even if this comes at the cost of civilian comfort. These times are not times of ease, and every Austrian man must do his part to protect our way of life." #NT!
  
 AUS_jansa_plan: "Jansa's Defence Plan" #NT!
 AUS_jansa_plan_desc: "Alfred Jansa has concocted a defence plan that will ensure that we are able to hold out against Berlin until further intervention by the Western powers to our rescue. It has the support of the general staff, and is worthy of our support too." #NT!
  
 # Monarchy 
  
 AUS_attack_italy: "Attack Italy" #NT!
 AUS_attack_italy_desc: "" #NT!
  
 AUS_monarchy_restored: "Return of the Habsburgs" #NT!
 AUS_monarchy_restored_desc: "The Republic, with all its instability and disorder, is on its way out. With the success of Otto von Habsburg’s gambit, he and his clique, the Monarchist Restoration Party, has risen to power. Otto and his followers seek a rebirth of the old monarchy into a renewed and modern form. Like a Phoenix from the ashes of death, the Habsburgs will rise again." #NT!
  
 AUS_austria_hungary: "Austria-Hungary" #NT!
 AUS_austria_hungary_desc: "" #NT!
  
 AUS_a_federal_kuk: "A Fdederal k.u.k" #NT!
 AUS_a_federal_kuk_desc: "" #NT!
  
 AUS_award_the_ottomen: "Award the Ottomen" #NT!
 AUS_award_the_ottomen_desc: "" #NT!
  
 AUS_restore_the_dragoons: "Restore the Dragoons" #NT!
 AUS_restore_the_dragoons_desc: "" #NT!
  
 AUS_the_new_status_quo: "The new Status Quo" #NT!
 AUS_the_new_status_quo_desc: "" #NT!
  
 AUS_all_around_the_danube: "All Around the Danube" #NT!
 AUS_all_around_the_danube_desc: "" #NT!
  
 AUS_expand_imperial_mining_operations: "Expand Imperial Mining Operations" #NT!
 AUS_expand_imperial_mining_operations_desc: "" #NT!
  
 AUS_connect_the_country: "Connect the Country" #NT!
 AUS_connect_the_country_desc: "" #NT!
  
 AUS_the_triune_kingdom_of_illyria: "The Triune Kingdom of Illyria" #NT!
 AUS_the_triune_kingdom_of_illyria_desc: "In the Pre-war years the late Franz Ferdinand was a staunch supporter of creating a third kingdom in the dual monarchy, the so-called Trialist idea. It could help us secure the loyalty of the South Slavs, most of whom resent being dominated by the Serbs." #NT!
  
 AUS_combat_serbian_nationalism: "Combat Serbian Nationalism" #NT!
 AUS_combat_serbian_nationalism_desc: "" #NT!
  
 AUS_the_question_of_transylvania: "The Question of Transylvania" #NT!
 AUS_the_question_of_transylvania_desc: "" #NT!
  
 AUS_federations_within_a_federation: "Federations within a Federation" #NT!
 AUS_federations_within_a_federation_desc: "" #NT!
  
 AUS_prepare_local_parliaments: "Prepare Local Parliaments" #NT!
 AUS_prepare_local_parliaments_desc: "" #NT!
  
 AUS_special_autonomies: "Special Autonomies" #NT!
 AUS_special_autonomies_desc: "" #NT!
  
 AUS_the_danube_federation: "The Danube Federation" #NT!
 AUS_the_danube_federation_desc: "" #NT!
  
 AUS_layout_federalisation: "Layout Federalisation" #NT!
 AUS_layout_federalisation_desc: "Before we even begin to reunite old Habsburg lands, we need to plan out a federalized solution. The problems that arose in the old empire, was a lack of representation for the many nationalities of the Empire. Federalization is meant to balance unity with the self-governance of the different peoples of the Empire." #NT!
  
 AUS_titles: "Titles" #NT!
 AUS_titles_desc: "The old Austrian titles were disbanded when the Republic was declared. In some cases, noble estates were seized by Republicans, in other cases, property was left alone. Restoring the titles of old is a sure way to gain legitimacy to our cause, as well as swinging some petty nobles over to our side." #NT!
  
 AUS_appoint_ernst_karl_winter: "Appoint Ernst Karl Winter" #NT!
 AUS_appoint_ernst_karl_winter_desc: "Ernst Karl Winter is a journalist, sociologist and politician who was a friend of the late chancellor Engelbert Dollfuß. A committed Catholic and Austrian monarchist, Winter has often come into opposition to German nationalist ideas, which often pursues a German nation more beholden to protestant and republican ideals. Winter has championed the concept of a “social monarchy”, a kingdom where the rights of the workers are respected through the mending of Monarchism with Social Democracy." #NT!
  
 AUS_work_with_hugo: "Work with Hugo" #NT!
 AUS_work_with_hugo_desc: "Hugo von Hofmannsthal is a poet, dramatist and novelist who has a long career of writing libretti for the operas of Richard Strauss. He was also a morale booster for the Austro-Hungarian Empire during the Great War through his speeches and articles. Hugo has a few ideas on both art and politics, and how we can promote Austrian culture more independence from German nationalism and the extremisms of today." #NT!
  
 AUS_our_imperial_claims: "Our Imperial Claims" #NT!
 AUS_our_imperial_claims_desc: "It is time to lay claim to all the land of the Austro-Hungarian Empire. From the Tyrollean alps to the Carpathian mountains. From the streets of Prague to the fields of Hungary. With the planned ascension of Otto as the next emperor, we need to set the pieces together for the new empire." #NT!
  
 AUS_allies_in_nobility: "Allies in Nobility" #NT!
 AUS_allies_in_nobility_desc: "Already, many nobles have gathered to our cause, hoping to see their titles and glories restored under Habsburg rule. While some of them were pleased by our restoration of noble titles, we need to secure the support of the nobles who still are left standing. Many of them still cling on to the Christian-Socials or the Landbund. With time, however, they will begin to see that there is a new leadership in Vienna." #NT!
  
 AUS_ban_KPO: "Ban KPÖ" #NT!
 AUS_ban_KPO_desc: "The Communist Party of Austria has always meant trouble. It would be fine if they only wanted to support the working class to achieve more rights, but no. They seek to instigate revolution and instability in Austria, and for what? To be a satellite to their Russian overlords in the Soviet Union? They are almost worse than the Valkists - both of them traitorous forces to Austria and instigators of revolution. We should begin to ban at least one of them." #NT!
  
 AUS_new_imperial_constitution: "New Imperial Constitution" #NT!
 AUS_new_imperial_constitution_desc: "Otto has put forward a new constitution. With changes that will make the future restoration an easier task. With the goal of our realm set and the people behind us, we can begin to forge a new Austrian state." #NT!
  
 AUS_otto_speech: "Otto’s Speech" #NT!
 AUS_otto_speech_desc: "While we have worked well with the current president, Wilhelm Miklas, he is still a member of the old governing establishment. His loyalty does not lie with the Monarchist Restoration Party, and we are afraid that he will work against some of our most ambitious goals. However, he has resided as president for a long time, with his term enlarged by crisis and instability. As a sign of restored stability, we will seek to give him a retirement. Through the power of his speeches, Otto would usher in a new president and a new age." #NT!
  
 AUS_the_eagles_legacy: "The Eagles Legacy" #NT!
 AUS_the_eagles_legacy_desc: "The legacy of the Habsburgs and the Austro-Hungarian Empire is spotty at best. While we forged one of the greatest empires Europe had ever seen, many also remembered it as an autocratic body with too little wit to reform. We need to reforge our legacy, building a new empire on both tradition and reform." #NT!
  
 AUS_keep_officers_at_check: "Keep Officers at Check" #NT!
 AUS_keep_officers_at_check_desc: "Not every officer in the army is loyal to our vision. Some are more loyal towards the Valkist cause in Germany, seeking to wipe Austria off the map in favor of a Greater Germany. Others are generally opposed to our monarchism. Giving these troublemakers an early retirement would ensure that the army doesn’t stab us in the back at their first opportunity." #NT!
  
 AUS_defenders_of_democracy: "Defenders of Democracy" #NT!
 AUS_defenders_of_democracy_desc: "Some of the paramilitary forces in Austria are motivated by the cause of democracy. While the Republican Protection League opposes our monarchist ideology, they have members who could work with us against a common enemy and for the protection of democracy. We should combine pro-democratic forces from these militias into an army unit ready to defend our democracy." #NT!
  
 AUS_imperial_democracy: "Imperial Democracy" #NT!
 AUS_imperial_democracy_desc: "Our imperial vision isn’t one of authoritarianism, but one of democracy. We seek to create a democratic federation of many nations, united under the wise leadership of an emperor. Too many believe that stability can only be restored through dictatorship, but we seek to accomplish a greater ideal." #NT!
  
 AUS_trade_with_italy: "Trade with Italy" #NT!
 AUS_trade_with_italy_desc: "Austria hasn’t always had a good relationship with Italy. While they do occupy former Habsburg lands, it wouldn’t be wise to antagonise them before we are ready. As a sign of goodwill, we should reach out for a mutual trade agreement with them. Showing them, for now, that Austria is willing to still be a friend even under Habsburg rule." #NT!
  
 AUS_trade_with_bulgaria: "Trade with Bulgaria" #NT!
 AUS_trade_with_bulgaria_desc: "Bulgaria could be a good country to facilitate better relations. Like us, they share the defeat of the Great War and have interests against other countries that now hold former Habsburg lands. While we wouldn’t necessarily be interested in an alliance, we could foster a trade agreement with them." #NT!
  
 AUS_expose_the_demons: "Expose the Demons" #NT!
 AUS_expose_the_demons_desc: "Many in Austria are attracted by the false hopes of Valkism. This new form of German nationalism seeks to undermine our government. We have to expose the ugly sides behind this ideology to the people, making them understand that Austria can never fall and lose our identity to a Valkist Germany." #NT!
  
 AUS_revere_the_angels: "Revere the Angels" #NT!
 AUS_revere_the_angels_desc: "We can’t let the people lose faith in democracy. We need to show them that this system can work, and to promote it for all Austrians. Let’s turn out pro-democratic propaganda, that will prop up both our movement, as well as other like-minded democrats in Austria." #NT!
  
 AUS_attract_hungarian_refugees: "Attract Hungarian Refugees" #NT!
 AUS_attract_hungarian_refugees_desc: "The revanchist dictatorship in Hungary has led to an exodus of dissidents from the country, many of whom are from the country’s German minority. We shall welcome them with open arms." #NT!
  
 AUS_an_alliance_with_officers: "An Alliance with Officers" #NT!
 AUS_an_alliance_with_officers_desc: "Many Austrian officers, both former and current ones, served under Habsburg rule during the Great War and see the return of the Habsburgs as a blessing. They have learned that the Republic means instability and chaos, and dream of the greatness of the Empire. By creating alliances with the officers and promoting Habsburg loyalists, we will create a strong ally in the army." #NT!
  
 AUS_recall_stjepan_sarkotic: "Recall Stjepan Sarkotic" #NT!
 AUS_recall_stjepan_sarkotic_desc: "Stjepan Sarkotić is an old, respected veteran from the Great War. One that many of our younger officers can learn a lot from. In addition, he is a central figure in the Croatian émigré community in Austria, and having him with us could prove useful in making the Croatians more happy with future Habsburg rule." #NT!
  
 AUS_reforming_the_kuk: "Reforming the k.u.k" #NT!
 AUS_reforming_the_kuk_desc: "The Imperial and Royal Army, also known as the Common Army, was the largest part of the Austro-Hungarian armed forces and a strong sign of our Empire’s former glory. To restore the glories of the Habsburg Empire, we need to reform the Common Army and make it the envy of Europe." #NT!
  
 AUS_akademisches_corps_ottonen: "Akademisches Corps Ottonen" #NT!
 AUS_akademisches_corps_ottonen_desc: "The Akademisches Corps Ottonen has since the 1920s played an important role to counter the German nationalist tendencies in Austria, and to spread the values of a European Empire - a United Europe ruled by the Habsburgs. Increasingly, with the spread of Valkism and völkish sentiments, the Corps have become more inclusive to the Jewish community in Austria." #NT!
  
 AUS_calling_all_princes: "Calling all Princes" #NT!
 AUS_calling_all_princes_desc: "While many Habsburgs came back to Austria when Otto von Habsburg came to power, princes of the Habsburg family still live all over Europe. We need to send the call that they need to come back and serve the family, to serve the Empire yet again." #NT!
  
 AUS_reform_royal_academies: "Reform Royal Academies" #NT!
 AUS_reform_royal_academies_desc: "Imperial Austria was not a land foreign to learning and innovation. In fact, science and teachings should be a cornerstone of our new Empire. We should reform our institutions of learning, promoting education and blending these values with the ideals of monarchism and pan-European cooperation." #NT!
  
 AUS_creating_a_resistance_network: "Creating a Resistance Network" #NT!
 AUS_creating_a_resistance_network_desc: "" #NT!
  
 AUS_destroy_militias: "Destroy Militias" #NT!
 AUS_destroy_militias_desc: "Militias are a blight on our beautiful nation. They are remnants of a dark time which linger on and haunt us every waking moment. While the violence on the streets has mostly died down, we can not allow for the monopoly of violence to be placed in the hands of some thugs. With changing times, there is no more room for boys playing war." #NT!
  
 AUS_integrate_moderate_militiamen: "Integrate Moderate Militiamen" #NT!
 AUS_integrate_moderate_militiamen_desc: "While many militiamen continue to be a blight on our beautiful nation, there are those willing to be reformed and integrated. While we need to bring down the worst of these thugs, some can prove to be useful in our armed forces. Let’s give some of them an opportunity to succeed, so they don’t return to these thuggish ways." #NT!
  
 AUS_the_matter_of_loyalty: "The Matter of Loyalty" #NT!
 AUS_the_matter_of_loyalty_desc: "Loyalty is highly pertinent for the survival of the Austrian people and hence we must deal with it. Many agents of Germany are still out there, and they must be crushed!" #NT!
  
 AUS_a_strict_doctrine: "A Strict Doctrine" #NT!
 AUS_a_strict_doctrine_desc: "The new k.u.k. is an army that is loyal to the crown and the people of Austria. They will not break and will not waste their time deviating over minute details. This way, we will be able to develop an army that can both stand against Germany and protect the Austrian realm." #NT!
  
 AUS_basically_jansas_plan_but_with_resistance: "Plan a Doctrine of Resistance" #NT!
 AUS_basically_jansas_plan_but_with_resistance_desc: "We must be ready for things to go south and for Germany to face us with overwhelming numerical superiority. What we however lack in numbers we have in spirit and brains, for the Germans are far more overextended than we are and hence we must be ready to force them to crack on fortress Austria!" #NT!
  
 AUS_learning_from_the_isonzo: "Learnings from the Isonzo" #NT!
 AUS_learning_from_the_isonzo_desc: "The Battles of the Isonzo was a costly experience for us - and we were not even the attackers! We must be ready to learn from our mistakes and rectify our tactics in the mountains and supplies so that we may never again have to face such a prospect of a 13th Isonzo." #NT!
  
 AUS_SDAPO_wins: "SDAPO Wins" #NT!
 AUS_SDAPO_wins_desc: "" #NT!
  
 AUS_agrarian_socialism: "Agrarian Socialism" #NT!
 AUS_agrarian_socialism_desc: "" #NT!
  
 AUS_mobilise_workers: "Mobilise Workers" #NT!
 AUS_mobilise_workers_desc: "" #NT!
  
  
