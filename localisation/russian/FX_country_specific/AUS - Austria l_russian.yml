# VATERLAND FRONT

 AUS_vaterland_front_long_name: "Отечественный фронт" # Vaterland Front
 AUS_vaterland_front_name: "ВФ" # VF

# ARMY FOCUS

 AUS_burn_treaty_of_linz: "Сжечь Сен-Жерменский договор" # Burn the Treaty of Saint-Germain
 AUS_burn_treaty_of_linz_desc: "Согласно нынешним положениям Сен-Жерменского договора, мы могли бы сегодня же отправиться в Берлин с мольбой о пощаде. Чтобы Австрия была в безопасности, свободна и горда, Сен-Жерменский договор больше не может действовать." # Under the current stipulations of the Saint-Germain treaty, we might as well head to Berlin pleading for mercy today. For Austria to be safe, free and proud, the Saint-Germain treaty cannot stand any longer.

 AUS_reform_general_staff: "Реформа Генерального штаба" # Reform the General Staff
 AUS_reform_general_staff_desc: "Реформы генерального штаба на первый взгляд могут показаться не такими уж важными, но они являются ключом к эффективному и действенному ведению войны. Усилия по обеспечению того, чтобы этот род войск был современным, также ознаменуют полную модернизацию армии." # General staff reforms may not seem on the surface to be terribly important, but they are key to waging war efficiently and effectively. An effort to ensure that this branch of the military is modern will also herald a total modernization of the army.

 AUS_modernize_theresian_military_academy: "Модернизировать Терезианскую военную академию" # Modernise the Theresian Military Academy
 AUS_modernize_theresian_military_academy_desc: "Австрийская военная традиция имеет давнюю историю, но последние два десятилетия технологического развития оставили позади наши стратегии и планы. Модернизация академии должна начаться для поддержки Австрии." # The Austrian military tradition is long, but the last two decades of technological development have left behind our strategies and plans in the dust. A modernization of the academy must begin to uphold Austria.

 AUS_preserve_army_traditions: "Берегите армейские традиции" # Preserve Army Traditions
 AUS_preserve_army_traditions_desc: "У нас долгая, хотя и не обязательно полностью выдающаяся военная история. Тем не менее, никто не может отрицать, кем были наши предки и их победы, от Асперн-Эсслинга до Капоретто. В наше время, когда даже будущее австрийского государства неопределенно, военные традиции следует поддерживать." # We have a long, if not necessarily totally illustrious military history. Still, no one can deny who our forefathers were, and their victories, from Aspern-Essling to Caporetto. In these times where even the Austrian state’s future is uncertain, military traditions ought to be upheld.

 AUS_eimannsberger_kampfwagenkrieg: "Война на колесницах Эйманнсбергера" # Eimannsberger’s Kampfwagenkrieg
 AUS_eimannsberger_kampfwagenkrieg_desc: "Несмотря на то, во что могут верить наши северные соседи, австрийская теория по-прежнему превосходит их собственную. Несмотря на заявления их выдающихся радикалов, таких как Хайнц Гудериан, его работа явно украдена у нашего собственного Людвига фон Эйманнсбергера, чьи теории о применении бронетехники в мобильной войне следует воспринимать серьезно." # Despite what our northern neighbors might believe, Austrian theory still trumps their own. Despite the claims of their eminent radicals like Heinz Guderian, his work is clearly stolen from our very own Ludwig von Eimannsberger, whose theories on the deployment of armor in mobile warfare must be taken seriously.

 AUS_support_local_tank_production: "Поддержка местного производства танков" # Support Local Tank Production
 AUS_support_local_tank_production_desc: "К сожалению, как и во многих беднейших странах Европы, лучшее, что мы можем сделать в отношении производства брони, — это просто импортировать и модифицировать танки иностранного производства по мере необходимости. Однако это ни в коем случае не является желательной ситуацией, и поэтому мы должны попытаться исправить ее в меру своих возможностей." # Unfortunately like many of the poorer nations in Europe, the best that we can do in regards to armor production is to simply import and modify foreign-made tanks as we need. This is by no means a desirable situation however, and hence we should try to rectify it to the best of our ability.

 AUS_expand_alpine_fortifications: "Расширить альпийские укрепления" # Expand Alpine Fortifications
 AUS_expand_alpine_fortifications_desc: "Альпы труднопроходимы даже в обычных условиях, однако мы не можем делать ставку на победу. Немцы будут использовать все и вся, чтобы разрушить нашу оборону, нам необходимо усилить каждую часть нашей страны, включая Альпы." # The Alps are hard to get passed through even in normal conditions, however, we are not in a position to bet on victory. The Germans will use anything and everything to destroy our defences, we need to reinforce every part of our country, and this includes the Alps.

 AUS_armored_spearhead: "Бронированное острие" # Armored Spearhead
 AUS_armored_spearhead_desc: "Австрия, может быть, и маленькая нация, но малые нации явно все еще могут превосходить свои силы, как это было видно на примере Сербии в 1914 году. Благодаря недавним разработкам в тактике бронетехники, впервые предложенным нашими генералами, австрийские танки вскоре будут готовы прорваться через ряды врага и одержать победу!" # Austria may be a small nation, but small nations can clearly still punch above their weight as seen from Serbia in 1914. With recent developments into armor tactics pioneered by our generals, Austrian tanks shall soon be ready to smash through the enemy’s lines and achieve victory!

 AUS_mountain_artillery: "Интеграция горной артиллерии" # Integrate Mountain Artillery
 AUS_mountain_artillery_desc: "Скорее всего, нам придется столкнуться с врагами в гористой местности, где штатная артиллерия работает довольно мрачно по сравнению с обычной. К счастью, есть средство защиты — горная артиллерия, которую наши силы могут легко перевезти и которая способна противостоять суровым горным условиям." # We will likely be facing our enemies in mountainous terrain, where regular artillery works rather dismally compared to usual. Thankfully, there is a remedy, that being mountain artillery which can be easily hauled up by our forces and capable of withstanding the tough conditions of the mountains.

 AUS_expand_the_gebirgsjager: "Развернуть Альпинист" # Expand the Gebirgsjäger
 AUS_expand_the_gebirgsjager_desc: "Бои на высоте более четырехзначных цифр тянут душу и требуют особого набора навыков. Gebirgsjäger — наши элитные бойцы на этом театре военных действий, на котором мы можем рассчитывать на множество боев. Таким образом, расширение этих хваленых сил очень необходимо." # Fighting at an altitude of more than quadruple digits weighs on the soul and requires a special set of skills. The Gebirgsjäger are our elite fighters in this theatre, a theatre we can expect to face plenty of combat in. As such, an expansion of this vaunted force is very much needed.

 AUS_expand_logistic_capabilities: "Расширить логистические возможности" # Expand Logistical Capabilities
 AUS_expand_logistic_capabilities_desc: "Ни одна армия не может выжить без еды в желудке и без обуви на ногах. Оружие также необходимо поставлять войскам, если мы хотим хотя бы иметь надежду на защиту нашего суверенитета, и для этого мы должны стараться защищать и расширять наши логистические усилия, чтобы гарантировать, что все сыновья Австрии могут сражаться как можно лучше." # No army can survive without food in their stomachs and shoes on their feet. Weapons too must be supplied to the troops if we are to even have hope in protecting our sovereignty, and to this we must endeavor to safeguard and expand our logistical efforts to ensure that all of Austria’s sons can fight as best they can.

 AUS_motorize_the_heer: "Моторизация Heer" # Motorisation of the Heer
 AUS_motorize_the_heer_desc: "Эпоха лошадей закончилась. Хотя мы все еще можем широко полагаться на лошадей в качестве транспортных средств, автомобилизация обязательна для модернизации армии. Мы не можем сидеть сложа руки и ждать, пока прибудут припасы, пока враг кружит вокруг нас." # The era of the horse is over. While we may still extensively rely on horses for transportation, motorization is mandatory if the army is to modernize. We cannot be stuck walking on foot and waiting for supplies to reach while the enemy runs circles around us.

 AUS_anti_tank_weaponry: "Внедрение противотанкового вооружения" # Implementation of Anti-Tank Weaponry
 AUS_anti_tank_weaponry_desc: "Если и есть дешевый способ противостоять подавляющей силе танков, то это противотанковое вооружение. Будь то специализированные орудия, гранаты или даже новые технологии, любой такой предмет должен быть использован, чтобы мы могли с минимальными затратами противостоять танкам противника." # If there is a cheap way to counter the overwhelming strength of the panzers, it is anti-tank weaponry. Whether they are specialized pieces, grenades or even novel pieces of technology, any such item should be utilized for us to resist at low cost the enemy’s tanks.

 AUS_modernize_equipment: "Модернизируйте оборудование Volksheer" # Modernise the Volksheer Equipment
 AUS_modernize_equipment_desc: "После унизительного поражения в Великой войне остатки австрийских военных сформировали Фолькшир, эту силу старую и, честно говоря, пережиток прошлого. Буреш и другие канцлеры пытались улучшить ситуацию, но ничего особенного добиться не удалось. Однако теперь, без ограничений прошлого, мы наконец можем приступить к модернизации нашего оборудования." # After the humiliating defeat in the Great War, the Austrian military remnants formed the Volksheer, this force is old, and frankly, a relic of the past. Buresch and other chancellors tried to improve the situation, but nothing much was achieved. However, now without the limitations of the past, we can finally start the modernisation of our equipment.

 AUS_fund_military_innovations: "Фонд «Военные инновации»" # Fund Military Innovations
 AUS_fund_military_innovations_desc: "Старый к.у.к. армия всегда оставляла желать лучшего, когда дело касалось военной техники. Мы по-прежнему страдаем от общей нехватки инвестиций в военные технологии, которые жизненно важны, если мы хотим каким-то образом противостоять угрозам свободе Австрии." # The old k.u.k. army always left something to be desired when it came to military technology. We still suffer from the general dearth of investment into military technology, which is vital if we are to somehow resist the menaces to Austrian freedom.

 AUS_create_paratrooper_units: "Создание воздушно-десантных подразделений" # Create Airborne Units
 AUS_create_paratrooper_units_desc: "Мало кто мог мечтать об эпохе, когда солдаты придут не просто с земли или с моря, но и с воздуха. Возможности использования воздушно-десантных войск настолько многочисленны, что это вполне может стать достойной инвестицией даже для нас." # Few could have dreamed of an era where soldiers would come not just from the ground or from sea, but from the air. The potential uses of airborne forces are so numerous that it may very well be a worthy investment even for us.

 AUS_use_civillian_pilot_schools: "Используйте школы гражданских пилотов" # Use Civilian Pilot Schools
 AUS_use_civillian_pilot_schools_desc: "Нашим пилотам необходимо научиться летать, но этому, к сожалению, помешали строгие условия Сен-Жермена. К счастью, существует множество школ гражданских пилотов, специалисты которых могут помочь нам в создании военно-воздушных сил." # Our pilots need to learn how to fly, but this was unfortunately hindered by the strict stipulations of Saint-Germain. Luckily, there are many civilian pilot schools whose experts can help us in setting up an air force.

 AUS_buy_planes_from_eastern_europe: "Покупайте самолеты из Восточной Европы" # Buy Planes from Eastern Europe
 AUS_buy_planes_from_eastern_europe_desc: "Даже если они не лучшие из лучших, мы не можем быть придирчивыми, когда дело касается выбора самолета. Страны Восточной Европы выразили готовность продать нам самолеты, которые нам понадобятся для контроля над небом Австрии." # Even if they are not the best of the best, we cannot be picky when it comes to what aircraft we can pick. The nations of Eastern Europe have indicated their willingness to sell us planes that we will need to control Austria’s skies.

 AUS_build_brumowski_air_base: "Построить авиабазу Брумовски." # Construct the Brumowski Air Base
 AUS_build_brumowski_air_base_desc: "Чтобы военно-воздушные силы принесли хоть какую-то пользу, должна быть какая-то база, с которой наши пилоты могли бы взлетать. Гражданские взлетно-посадочные полосы и другие наспех созданные сооружения уже просто не поместят — нужна полноценная авиабаза." # For the air force to be of any use, there must be some sort of base that our pilots can take off from. Civilian runways and other hastily created structures just will not cut it anymore - a proper air base is needed.

 AUS_produce_austrian_fighters: "Производство австрийских истребителей" # Produce Austrian Fighters
 AUS_produce_austrian_fighters_desc: "Как и во многих иностранных государствах, большая часть наших самолетов родом из-за границы, разработана или произведена потенциальными будущими врагами Австрии. Хотя это в основном вопрос практической необходимости, это также позорное наследие для одного из главных участников Великой войны. Давайте позаботимся о том, чтобы австрийский истребитель контролировал австрийское небо." # LIke many foreign nations, much of our aircraft hails from abroad, designed or manufactured by potential future enemies of Austria. While this is mainly a matter of practical necessity, it too is a shameful legacy for one of the chief combatants in the Great War. Let us thus see to it that an Austrian fighter controls Austrian skies.

 AUS_produce_austrian_bombers: "Производство австрийских бомбардировщиков" # Produce Austrian Bombers
 AUS_produce_austrian_bombers_desc: "Это может показаться фантазией, но проект австрийского бомбардировщика вполне может оказаться решающим фактором в следующей войне. Все теории указывают на триумф бомбардировщика с неба, и наши враги наверняка подумают дважды, если армада бомбардировщиков будет готова сравнять с землей их заводы и терроризировать их народ." # It may seem like a fantasy, but an Austrian bomber project could very well prove to be a decisive factor in the next war. All theory points towards the triumph of the bomber from the skies, and our enemies will certainly think twice if an armada of bombers is prepared to flatten their factories and terrorize their people.

 AUS_adopt_dive_bomber_tactics: "Принять тактику пикирующих бомбардировщиков" # Adopt Dive Bomber Tactics
 AUS_adopt_dive_bomber_tactics_desc: "Бомбардировка с пикирования — это в некотором смысле рискованный маневр, но он приводит к разрушительной точности для бомбардировщика. Это будет иметь решающее значение, если мы хотим помочь нашим военно-воздушным силам поддержать наземные войска, численность которых уже превосходит многих наших противников." # Dive bombing is a risky manoeuvre to pull off in some ways, but it is one that results in devastating accuracy for the bomber. This will be crucial if we are to help our air force support the troops on the ground, who already stand outnumbered by many of our foes.

 AUS_finish_air_defense_systems: "Завершить австрийскую систему ПВО" # Finish the Austrian Air Defence System
 AUS_finish_air_defense_systems_desc: "Хоть это и прискорбно, но правда в том, что мы вряд ли сможем удержать какое-либо господство в воздухе в наших будущих войнах, по крайней мере, в ближайшем будущем. Поэтому система противовоздушной обороны жизненно важна, если мы хотим противостоять попыткам врага запугать наш народ и заставить его подчиниться посредством бомбардировок." # While it is unfortunate, the truth is that we are very unlikely to hold any kind of air supremacy in our future wars, at least in the immediate future. An air defence system is hence vital if we are to resist the enemy’s efforts to terrorize our people into submission through bombing.

 AUS_armed_forces_of_austria_modernized_and_united: "Формирование Бундешира" # The Formation of the Bundesheer
 AUS_armed_forces_of_austria_modernized_and_united_desc: "Мы можем гордиться тем, насколько австрийские вооруженные силы, когда-то не более чем парадные силы, теперь могут выступать в качестве одного из бастионов свободы и достоинства в Центральной Европе. Австрия не поколеблется, и свобода будет защищена!" # We can be proud of how much the Austrian military, once little more than a parade force, can now stand as one of the bastions of freedom and dignity in Central Europe. Austria shall not falter, and freedom shall be protected!

# INDUSTRIAL FOCUS

 AUS_economic_recovery: "На пути к экономическому восстановлению" # Towards Economic Recovery
 AUS_economic_recovery_desc: "Худшее из недавнего экономического кризиса прошло, и поэтому нам следует возобновить наши усилия по восстановлению некоторого подобия экономического процветания – иначе мы окажемся во власти Германии." # The worst of the recent economic crisis has passed, and thus we ought to restart our efforts to recover some semblance of economic prosperity - lest we end up at the mercy of Germany.

 AUS_fiscal_reforms: "Фискальные реформы" # Fiscal Reforms
 AUS_fiscal_reforms_desc: "Старые привычки тратить деньги оказались расточительными, а критически недооцененные предприятия остаются нефинансированными. Наша финансовая ситуация остро нуждается в реформе, а в условиях экономического краха сейчас для этого самое подходящее время." # Old spending habits have proven wasteful, while critically undervalued ventures remain unfunded. Our fiscal situation is in dire need of reform, and with the economic crash there is no time like the present for it.

 AUS_dealing_with_equipment: "Работа с оборудованием" # Dealing with Equipment
 AUS_dealing_with_equipment_desc: "Хотя наша промышленная база уступает титанам на севере и юге, мы все еще унаследовали наследие обширных компаний, которые снабжали армии Двойной монархии. Таким образом, мы должны быть готовы решать такие вопросы – хотя бы только для того, чтобы сохранить их наследие." # Although our industrial base is lacking compared to the titans to our north and south, we still inherit the legacy of the extensive companies that equipped the armies of the Dual Monarchy. As such, we must be ready to deal with such matters - even if only to maintain their legacy.

 AUS_fate_of_steyr: "Судьба компании Steyr-Daimler-Puch" # Fate of Steyr-Daimler-Puch
 AUS_fate_of_steyr_desc: "Steyr-Daimler-Puch — один из крупнейших производителей оружия в Австрии, и они играют решающую роль в оснащении всех наших солдат оружием. Однако это все еще остается вне нашей досягаемости, и поэтому мы должны решить, должны ли мы просто тесно сотрудничать с ними или нам следует взять на себя более сильную роль в отношении них." # Steyr-Daimler-Puch is one of the largest weapons manufacturers in Austria, and they are crucial in equipping all of our soldiers with armaments. However, it still remains out of our reach and hence we must decide if we are to simply cooperate closely with them or if we should take on a stronger role regarding them.

 AUS_import_equipment: "Импортное оборудование" # Import Equipment
 AUS_import_equipment_desc: "Мы просто не в состоянии производить все, что нам нужно, когда речь идет о военной технике. Даже если здесь можно производить винтовки и пулеметы, ботинки, бинты и другие предметы первой необходимости в современной войне все равно придется импортировать, и, следовательно, мы должны делать это поспешно." # We simply are unable to produce everything that we need when it comes to military equipment. Even if rifles and machine guns can be made here, boots, bandages and other essentials in modern war still must be imported, and hence we must do so post-haste.

 AUS_national_contracts: "Контракты с австрийскими компаниями" # Contracts with Austrian Companies
 AUS_national_contracts_desc: "В эти нестабильные времена только сотрудничество между правительством и частным бизнесом может помочь Австрии выжить. Хотя австрийские производители, возможно, и не являются крупнейшими в мире, их продукция по-прежнему жизненно важна для нашего выживания, и поэтому контракты на их оружие должны быть выполнены немедленно!" # In these unstable times, only cooperation between government and private enterprise can see Austria through. While Austrian manufacturers may not be the largest in the world, their products are still vital to our survival and thus contracts for their weapons must be executed at once!

 AUS_nationalise_factories: "Национализировать заводы" # Nationalise Factories
 AUS_nationalise_factories_desc: "В то время как для всей Австрии наступают тяжелые времена, многие заводы начинают закрываться. Однако это может означать лишь дальнейшее нисходящее движение к экономическому вырождению, единственным лекарством от которого является национализация обанкротившихся заводов." # With hard times falling on all of Austria, many factories are beginning to go out of business. However, such a thing can only mean a further downward spiral into economic degeneration, with the only cure being nationalization of failing factories.

 AUS_expand_frei_arbei: "Волонтерская служба" # Freiwilliger Arbeitsdienst
 AUS_expand_frei_arbei_desc: "В соответствии с трудоемким Сен-Жерменским договором многие молодые люди лишились возможности вступить в армию, где, возможно, были заложены их единственные перспективы. Сейчас, в условиях экономического кризиса, массы угрюмых молодых рабочих раздражаются безработицей и угрожают социальной стабильности. Единственное средство — это трудовая повинность, призванная оживить их дух и экономику." # Under the laborious Saint-Germain Treaty, many young men became unable to join the army where their only prospects may have been laid. Now with the economic crisis, masses of sullen young workers are chafing under unemployment and threaten societal stability. The only remedy is a labor service to reinvigorate their spirit and the economy.

 AUS_catholic_works: "Инвестируйте в католические работы" # Invest in Catholic Works
 AUS_catholic_works_desc: "Католицизм — одна из основ австрийского государства, сильно отличающая нас от наших ревностных немецких братьев с севера. Их добрые дела включают образование, благотворительность и другие вещи, которые в совокупности делают их достойными государственных инвестиций, особенно в эти кризисные времена." # Catholicism is one of the bedrock of the Austrian state, differentiating us greatly from our zealous German brothers from the north. Their good works include education, charity and other things that all come together to make them worthy of state investment, especially in these times of crisis.

 AUS_bail_out_agriculture: "Спасение сельского хозяйства" # Bail Out Agriculture
 AUS_bail_out_agriculture_desc: "Австрийское сельское хозяйство сильно пострадало от недавнего кризиса: потеря права выкупа и нищета стали судьбой многих бедных сельских рабочих. Спасение на данный момент является единственным способом остановить ухудшение этой катастрофической ситуации." # Austrian agriculture has been hit hard by the recent crash, with foreclosures and destitution becoming the fate of many poor rural laborers. A bailout for now is the only way we can stop this disastrous situation from worsening.

 AUS_electrify: "Электрифицировать страну" # Electrify the Country
 AUS_electrify_desc: "По иронии судьбы, ни одна из бывших великих держав Европы еще не электрифицировала нацию, в то время как наши некогда слабые соседи устремляются вперед в современную эпоху. Если мы хотим идти по истинно немецкому пути, мы должны обеспечить, чтобы и в городе, и в деревне было хотя бы электричество!" # It is ironic that one of the former great powers of Europe has yet to electrify the nation, while our once weak neighbors speed ahead into the modern age. If we are to take on the true German way, we must ensure that both the city and countryside have at least electricity!

 AUS_empower_corporations: "Расширьте возможности корпораций" # Empower the Corporations
 AUS_empower_corporations_desc: "Корпорации являются важной частью австрийского общества, и, к счастью, они не склонны конкурировать друг с другом, а это лишь поощряет трату средств на бессмысленные инновации. Расширение их прав и возможностей жизненно важно для нашего экономического восстановления." # Corporations are a crucial part of Austrian society, and they are thankfully not prone to competing with one another - an endeavor that will only encourage waste on pointless innovations. Their empowerment is vital for our economic recovery.

 AUS_reform_the_corporate_system: "Реформировать корпоративную систему" # Reform the Corporate System
 AUS_reform_the_corporate_system_desc: "Безрассудство крупных компаний, контролирующих рынок, проявилось в смехотворно жестокой форме во время краха Лондонской фондовой биржи. Чтобы австрийская экономика смогла должным образом прийти в норму, необходима масштабная реформа системы." # The folly of large companies controlling the market has shown itself in an laughably cruel form in the London Stock Market crash. A wholesale reform of the system is needed to see the Austrian economy properly bounce back.

 AUS_rethink_power_plant: "Тауэрнская гидроэлектростанция" # The Tauern Hydroelectric Power Plant
 AUS_rethink_power_plant_desc: "После открытия плотина Тюрнской гидроэлектростанции станет одной из крупнейших в Европе, что значительно снизит нашу зависимость от энергетических ресурсов, таких как уголь." # When opened, the Tuern Hydroelectric dam will be one of the largest in Europe, greatly reducing our dependence on energy resources such as coal.

 AUS_infraestructure_initiatives: "Инфраструктурные инициативы" # Infrastructure Initiatives
 AUS_infraestructure_initiatives_desc: "Инъекции в экономику окажутся необходимыми, если мы хотим восстановить былое процветание. Инфраструктура является жизненно важной частью современного развития, однако правительства прошлых лет пренебрегали этой частью управления. Исправим это немедленно, призвав австрийский народ проложить новую Австрию в городах и деревнях!" # Injections into the economy will prove necessary if we are to restore our former prosperity. Infrastructure is a vital part of modern development, yet past governments have neglected this part of governance. Let us rectify this at once by calling on the Austrian people to pave a new Austria in the cities and countryside!

 AUS_end_austerity: "Конец жесткой экономии" # End Austerity
 AUS_end_austerity_desc: "Жесткая экономия, возможно, когда-то была полезна, но это неприятный опыт. Поскольку кризис продолжает утихать, политика жесткой экономии фактически оказывается препятствием для дальнейшего роста, и поэтому с ней необходимо покончить." # Austerity may have once been useful, but it is not a pleasant experience. With the crisis subsiding further, austerity is now in fact proving to be a hindrance to further growth and must thus be done away with.

 AUS_bundesbahn: "Расширить Федеральную железную дорогу" # Expand the Bundesbahn
 AUS_bundesbahn_desc: "Железные дороги являются важной частью экономики, поэтому очевидно, что необходимы новые инвестиции в их развитие. Расширение Бундесбана поможет теснее сплотить австрийцев и предоставит многим столь необходимую работу." # Railways are a crucial part of the economy, so it is obvious that some new investment into their development is necessary. An expansion of the Bundesbahn will help to bind Austrians closer together, and will provide much needed work for many.

 AUS_expand_social_programs: "Расширить социальные программы" # Expand Social Programs
 AUS_expand_social_programs_desc: "Самые обездоленные члены общества не заслуживают своего жалкого положения, и в любом случае им лучше получать кусочки от нас, а не воровать их у невинных. Если мы хотим обуздать суровые последствия экономической депрессии, необходима некоторая помощь людям." # The most destitute in society do not deserve their miserable situation, and in any case they are better off receiving morsels from us instead of stealing them from innocents. If we are to curb the harsh effects of economic depression, some help for the people is needed.

 AUS_vienna_uni_investment: "Инвестируйте в Венский университет" # Invest in the University of Vienna
 AUS_vienna_uni_investment_desc: "Австрийское образование должно построить Австрию завтрашнего дня, прививая всем австрийскую идентичность, а не привязанную к Берлину. Расширение всемирно известных объектов Вены поможет нашим научным усилиям, а также предоставит нашему народу больше возможностей для роста престижа и силы Австрии." # Austrian education shall build the Austria of tomorrow, instilling in all an Austrian identity rather than one bound to Berlin. An expansion of Vienna’s world famous facilities will help our scientific endeavors, as well as grant our people more opportunities to grow Austria’s prestige and strength.

 AUS_a_recovering_economy: "Восстановление экономики" # Recovering Economy
 AUS_a_recovering_economy_desc: "Экономический кризис жестоко отразился на нашем народе, но мы не только выжили. Кризис дал нам возможность оживить австрийскую экономику для лучшего будущего, когда Австрия будет свободной и процветающей." # The economic crisis has been harsh on our people, but we have not only survived. The crisis has given us the chance to reinvigorate the Austrian economy, for a better tomorrow where Austria stands free and prosperous.

 AUS_credianstalt: "Интегрируйте Кредитанштальт" # Integrate the Creditanstalt
 AUS_credianstalt_desc: "Крах Creditanstalt 1931 года нанес ущерб экономике не только Австрии, но и Германии. Поскольку миллионы людей обнаружили, что их сбережения уничтожены, мы должны гарантировать, что подобное никогда не повторится. Это можно сделать только через интеграцию Creditanstalt в правительство." # The Creditanstalt crash of 1931 was one that crippled the economies of not just Austria, but of Germany too. With millions having found their savings wiped out, we have to ensure that such a thing never happens again. This can only be done through the integration of the Creditanstalt into the government.

 AUS_expand_sudbahn: "Расширить Зюдбан" # Expand the Südbahn
 AUS_expand_sudbahn_desc: "Наши железнодорожные связи с остальным миром остаются довольно небольшими, что ограничивает нашу способность торговать. Расширение Южной железной дороги на территорию Словении поможет улучшить отношения с нашим южным соседом, а также позволит нам глубже подключиться к мировой экономике." # Our connections with the rest of the world by rail remain rather small, hampering our ability to trade. Expanding the Südbahn into Slovenia will help to alleviate relations with our southern neighbor, as well as allowing us to connect further into the world economy.

 AUS_expand_mines: "Расширить австрийские шахты" # Expand Austrian Mines
 AUS_expand_mines_desc: "Даже если мы не сможем добиться полной автаркии, некоторая самодостаточность в отношении природных ресурсов является ключом к нашему развитию и национальной безопасности. Шахты Австрии по-прежнему в целом остаются неразработанными и практически требуют некоторой разведки и расширения на благо страны." # Even if we are not able to pursue full autarky, some self-sufficiency regarding natural resources is key for our development and national security. The mines of Austria still remain generally unexploited and are practically begging for some exploration and expansion for the nation’s gain.

 AUS_steyr_expansion: "Расширить Steyr-Daimler-Puch" # Expand the Steyr-Daimler-Puch
 AUS_steyr_expansion_desc: "Компания Steyr-Daimler-Puch пережила недавний кризис и, будучи крупнейшим производителем оружия в Австрии, имеет решающее значение для национальной безопасности. Инвестиции в компанию не пропадут даром." # Steyr-Daimler-Puch has survived the recent crisis and as the largest weapons manufacturer in Austria is crucial to national security. Investments into the company will not go to waste.

 AUS_invest_into_graz: "Инвестируйте в Грац" # Invest in Graz
 AUS_invest_into_graz_desc: "Многие думают о Вене, когда думают об Австрии, но Вена – не единственный город в стране. Грац является одним из немногих городов на родине, который может соперничать с Веной и заслуживает некоторого развития." # Many think of Vienna when they think of Austria, but Vienna is not the only city in the country. Graz stands as one of the few cities in the homeland that can rival Vienna and is well-worthy of some development.

 AUS_resource_prospects: "Перспективы ресурсов" # Resource Prospects
 AUS_resource_prospects_desc: "Местные ресурсы дешевле и безопаснее добывать, чем зависимость от импортного сырья. Поскольку разведка ресурсов является критически слаборазвитым сектором, мы должны быть готовы приложить все усилия к развитию ресурсного потенциала Австрии." # Local resources are cheaper and safer to procure than dependency on imported raw goods. As resource prospecting has been a critically underdeveloped sector, we must be ready to go full-force in developing Austria’s resource potential.

 AUS_expand_agricultural_sector: "Расширить сельскохозяйственный сектор" # Expand the Agricultural Sector
 AUS_expand_agricultural_sector_desc: "Поскольку сельское хозяйство пережило недавний кризис, мы должны теперь возродить его. Здоровый аграрный сектор — единственный путь к долгосрочной жизнеспособности австрийской нации, поэтому инвестиции в механизацию и сельскую инфраструктуру жизненно важны." # With agriculture surviving the recent crisis, we must now revive it. A healthy agrarian sector is the only way for the long-term viability of the Austrian nation, making investments into mechanization and rural infrastructure vital.

 AUS_favor_industry: "Отдавайте предпочтение промышленным интересам" # Favour Industrial Interests
 AUS_favor_industry_desc: "Печальная реальность такова, что австрийцы не могут заниматься сельским хозяйством. Фермеры должны просто осознать, что Австрия не способна быть самодостаточной в уменьшенном состоянии, особенно когда альтернативой является более дешевое питание для народа в целом. Промышленные интересы правы: тарифы на продукты питания должны быть отменены!" # The sad reality is that agriculture is not viable for Austrians to pursue. The farmers must simply realize that Austria is not able to be self-sufficient in a diminished state, especially when the alternative is cheaper food for the people as a whole. Industrial interests are right - tariffs on food must be removed!

 AUS_protect_austrian_farmers: "Защитите австрийских фермеров" # Protect Austrian Farmers
 AUS_protect_austrian_farmers_desc: "Иностранное сельское хозяйство — это просто неавстрийский импорт для жадных капиталистов Вены, Граца и Зальцбурга, призванный насытить их бесконечное потребление. Мы должны защитить жителей страны от угрозы продуктов питания иностранного производства, которые в любом случае создают зависимость от иностранных народов." # Foreign agriculture is simply an un-Austrian import for the greedy capitalists of Vienna, Graz and Salzburg to satiate their endless consumption. We must protect the people of the land from the threat of foreign-made foods which in any case create a dependency on foreign peoples.

 AUS_way_to_autarky: "На пути в Автаркию" # On the Road to Autarky
 AUS_way_to_autarky_desc: "Автаркия не является нежелательной целью, поскольку она является признаком независимой и сильной нации, а также народа. Благодаря дальнейшему развитию сельского хозяйства мы можем гарантировать, что ни один австрийец больше никогда не будет голодать." # Autarky is not an undesirable objective, for it is a sign of an independent and strong nation as well as people. Through further agricultural development, we can ensure no Austrian shall ever go hungry again.

# FOREIGN MINISTRY FOCUS

 AUS_expand_the_foreign_ministry: "Расширить МИД" # Expand the Foreign Ministry
 AUS_expand_the_foreign_ministry_desc: "Поскольку наше положение в Европе хрупко, нам крайне важно расширить министерство иностранных дел, укрепить экономические связи с другими государствами, а также помочь нам в сдерживании немецкой агрессии." # With our position in Europe fragile, it is imperative we expand the foreign ministry, to strengthen ties with other states economically, as well as aid us in deterring German aggression.

 AUS_ally_czechia: "Союзник в Праге" # An Ally in Prague
 AUS_ally_czechia_desc: "В Праге также стоят братья-единомышленники, выступающие против имперских амбиций Берлина. Хотя у нас могут быть разногласия по поводу их немецкого меньшинства, у нас гораздо больше общего в истории, чем многие думают, что делает союз между нашими народами важной целью." # In Prague, like-minded brothers opposed to Berlin's imperial ambitions stand as well. While we may have our disagreements over their German minority, we hold far more history in common than many realize, making an alliance between our peoples an important goal.

 AUS_subjugate_czechia: "Освободить судетских немцев" # Liberate Sudeten Germans
 AUS_subjugate_czechia_desc: "Судетские немцы — наши братья как по истории, так и по крови. Однако безответственное пражское государство стремится их подчинить, и для этого мы должны защитить судетских немцев всеми необходимыми средствами, даже силой." # The Sudeten Germans are our brothers, both in history and blood. The irresponsible Prague statelet seeks to subjugate them however, and to this we must protect the Sudeten Germans by all means necessary, even force.

 AUS_attack_hungary: "Забастовка Венгрии" # Strike Hungary
 AUS_attack_hungary_desc: "Наш мадьярский сосед никогда не был самым добрым, особенно в последнее время. Сейчас они опустились до самого низкого из низких, и для этого их необходимо исправить." # Our Magyar neighbor has never been the nicest, especially not in recent times. Now they have fallen to the lowest of the low, and for this they need to be corrected.

 AUS_purchase_polish_artillery: "Покупка польской артиллерии" # Purchase Polish Artillery
 AUS_purchase_polish_artillery_desc: "Поляки имеют гораздо большую базу, на которой они могут подготовиться и подготовиться к немецкой угрозе. Поскольку за последнее десятилетие связи между нами улучшились, давайте пожнем плоды этого, приобретя для себя крайне необходимое оборудование." # The Poles have a much greater base from which they can manufacture and prepare themselves against the German menace. With ties having improved between us over the last decade, let us reap its fruits by acquiring desperately needed equipment for ourselves.

 AUS_expand_the_jansas_plan: "Развернуть план Янсы" # Expand Jansa's Plan
 AUS_expand_the_jansas_plan_desc: "Теперь у нас есть возможность строить на территории Чехии, что позволит нам вместе с чехами построить линию, которую немцам будет слишком трудно прорвать - по крайней мере, если они хотят уберечь своих людей от бессмысленной гибели!" # We now have the ability to build in Czech territory, which will let us work with Czechs in building a line that will be far too difficult for the Germans to crack - at least if they would like to keep their men from perishing pointlessly!

 AUS_send_an_attache_to_spain: "Изучите гражданскую войну в Испании." # Study the Spanish Civil War
 AUS_send_an_attache_to_spain_desc: "Гражданская война в Испании отличается от Великой войны акцентом на быстрое передвижение и использование авиации в координации с бронетехникой. Это надо тщательно изучить." # The Spanish Civil War has turned out to be different from the Great War, with an emphasis on rapid movement and use of aircraft in coordination with armoured vehicles. It must be studied greatly. 

 AUS_reclaim_tyrol: "Вернуть Тироль" # Reclaim Tyrol
 AUS_reclaim_tyrol_desc: "Тирольцы жаждут свободы, ожидая того дня, когда ими будут править немцы, а не равнодушная римская элита. Пока итальянцы сильны, воля немцев сильнее, и мы освободим наших братьев!" # The Tyroleans cry out for freedom, awaiting the day where they are ruled by Germans rather than uncaring Roman elites. While the Italians are strong, the German will is stronger and we shall liberate our brothers!

 AUS_vienna_accord: "Венские соглашения" # The Vienna Accords
 AUS_vienna_accord_desc: "По сути, Антанта — лишь меньший из двух крайне дьявольских врагов, с которыми нам придется столкнуться в ближайшие годы. Союз с ними был бы позором для всего, за что боролись наши предки, не говоря уже о том, что полагаться на них явно ненадежно. Вместо этого нам следует обратиться к правительству Кобленца, которое, как и мы, также выступает против валкистской угрозы и вместе сдерживает сдерживание Берлина." # For all intents and purposes, the Entente are but the lesser of two highly devilish foes that we must face in the coming years. An alliance with them would be a disgrace to everything our forefathers fought for, not to mention that relying on them is plainly unreliable. Instead, we should reach out to the Koblenz government who like us also oppose the Valkist menace and stand together in the containment of Berlin.
 AUS_vienna_accord_tt: "Мы пригласим [RHI.GetNameDef] в альянс для борьбы с угрозой [GER.GetAdjective]." # We will invite [RHI.GetNameDef] to an alliance to combat the [GER.GetAdjective] threat.

 AUS_join_entente: "Присоединяйтесь к Антанте" # Join the Entente
 AUS_join_entente_desc: "Это действительно прискорбно, но Антанта — наш лучший способ сохранить независимость. Очевидно, что такая вещь не была бы очень приятна нации, но, учитывая марш Германии, другого выбора просто нет." # It is a truly unfortunate thing, but the Entente are our best bet of maintaining independence. Obviously, such a thing would not be terribly palatable to the nation, but with Germany on the march, there is simply no other choice.

 AUS_demand_slovenia: "Возьми Словению" # Retake Slovenia
 AUS_demand_slovenia_desc: "Словения по праву является немецкой, однако сербы продолжают порабощать и выкачивать богатство у населяющих ее бедных словенцев и немцев. Наш долг – освободить Словению от этого безответственного правительства!" # Slovenia is rightfully German, yet the Serbs continue to subjugate and extract wealth from the poor Slovenes and Germans that inhabit it. It is our duty to liberate Slovenia from this irresponsible government!

 AUS_send_an_attache_to_spf: "[SPF.GetNameDef]" # [SPF.GetNameDef]
 AUS_send_an_attache_to_spa: "[SPA.GetNameDef]" # [SPA.GetNameDef]
 AUS_send_an_attache_to_spr: "[SPR.GetNameDef]" # [SPR.GetNameDef]
 AUS_send_an_attache_to_spm: "[SPM.GetNameDef]" # [SPM.GetNameDef]

 AUS_send_an_attache_to_spain_tooltip: "Отправьте §Yattaché§! на §Y[AUS_send_an_attache_to_spain_loc]§!." # Send an §Yattaché§! to §Y[AUS_send_an_attache_to_spain_loc]§!.
 AUS_foreign_one_cze: "Имеет §YЗащитный пакт§! с [CZE.GetFlag]§Y[CZE.GetNameDef]§!." #  Has a §YDefensive Pact§! with [CZE.GetFlag]§Y[CZE.GetNameDef]§!.
 AUS_in_120_days: "Через 120 дней:" # In 120 days:
 AUS_foreign_jansas_plan_cze: "План Янсы — Строительство" # Jansa's Plan - Construction
 AUS_foreign_jansas_plan_aus: "План Янсы — Строительство" # Jansa's Plan - Construction

# POLITICAL FOCUS

 AUS_starting_anew: "Новый год, старые вызовы" # A New Year, Old Challenges
 AUS_starting_anew_desc: "В нашей стране наступает 1936 год, судьба Австрии остается неясной. Как будут развиваться события в Австрии в наступающем году, учитывая возрождающуюся Германию на севере и сохраняющуюся неопределенность среди всех наших соседей?" # As 1936 dawns on our nation, Austria’s fate remains unclear. With a resurgent Germany to the north, and continued uncertainty in all of our neighbors, how will things evolve for Austria in the coming year?

 AUS_taking_a_loan: "Взять еще один кредит" # Taking Another Loan
 AUS_taking_a_loan_desc: "Нам очень нужны деньги. Экономический крах был главной темой, о которой все думали после преступного поведения банков в 1931 году, и чтобы продолжить восстановление экономики, мы должны быть готовы сделать то, что необходимо." # We need cash, badly. Economic ruin has been the main thing on everyone’s mind following the criminal behavior of the banks in 1931, and to continue our economic recovery, we must be ready to do what is needed.

 AUS_continue_investing_brr: "Новые австрийские проекты" # New Austrian Projects
 AUS_continue_investing_brr_desc: "Для оживления экономики необходимо больше инвестиций, чем когда-либо. Благодаря нашему недавнему кредиту мы сможем погасить его в десять раз, если вложим его разумно." # To reinvigorate the economy, more investment is needed than ever. With our recent loan, we will be able to repay it tenfold if we invest it prudently.

 AUS_military_sector: "Секретные сделки с Хеймвером" # Secret Deals with the Heimwehr
 AUS_military_sector_desc: "Хеймвер — сильная политическая фракция внутри республики, и с ней нельзя шутить. Однако мы, к счастью, разделяем с ними общее понимание зла социализма, которое мы можем использовать, чтобы обеспечить им помощь." # The Heimwehr are a strong political faction within the republic and are not to be trifled with. We thankfully however share with them a common understanding of the evils of socialism, which we can leverage to ensure their aid.

 AUS_strengthen_the_graz_csp: "Остмаркише Штурмшарен Грац" # Ostmärkische Sturmscharen Graz
 AUS_strengthen_the_graz_csp_desc: "Грац является жизненно важной частью австрийской нации, но вопрос о том, кому он предан, все еще остается под вопросом. Ostmärkische Sturmscharen являются лояльными военизированными формированиями, и усиление их присутствия в Граце принесет много пользы." # Graz is a vital part of the Austrian nation, but it still remains up in the air as to whom it holds allegiance to. The Ostmärkische Sturmscharen are a loyal paramilitary, and a strengthening of their presence in Graz will do much good.

 AUS_reinforce_csp_at_burgenland: "Восточная штурмбанден Бургенланд" # Ostmärkische Sturmscharen Burgenland
 AUS_reinforce_csp_at_burgenland_desc: "Будучи своим единственным по-настоящему сердечным соседом, венгры по ультранационалистическим меркам были ужасно молчаливы в вопросе о Бургенланде. Тем не менее, не помешало бы укрепить нашу власть в провинции, хотя бы для того, чтобы заставить замолчать потенциальное инакомыслие со стороны агентов Будапешта." # As their only truly cordial neighbor, the Hungarians have been awfully tight-lipped on the question of Burgenland by ultranationalist standards. Still, it would not hurt to consolidate our hold on the province, if only to silence potential dissent from Budapest’s agents.

 AUS_the_parliament_restores_order: "Парламент восстанавливает порядок" # Parliament Restores Order
 AUS_the_parliament_restores_order_desc: ""

 AUS_to_the_strongest: "Сильнейший побеждает" # The Strongest Prevails
 AUS_to_the_strongest_desc: ""

 AUS_dolfuss_successor: "Шушниг берет на себя управление" # Schuschnigg Takes Control
 AUS_dolfuss_successor_desc: "Смерть Дольфуса очень сильно ударила по всем австрийским патриотам, но мы, тем не менее, боремся. Новый путь вперед для Австрии ясен, он не отягощен демократией, во главе которой стоит его наследник Курт Шушниг." # Dollfuß’s death has hit all Austrian patriots very hard, but we struggle nevertheless. The new way forward for Austria is clear, one that is not weighed down by democracy, with his heir, Kurt Scuschnigg at the helm.

# Schuschnigg
 AUS_new_constitution: "Проект временной конституции" # Draft a Temporary Constitution
 AUS_new_constitution_desc: "Необходима новая конституция, которая преодолеет неэффективность парламентской демократии, которая при поддержке военных будет особенно ключевой в обеспечении благочестивой и упорядоченной Австрии." # A new constitution that overrides the ineffectiveness of parliamentary democracy is in order, which with the backing of the military will be especially key in ensuring a godly and orderly Austria.

 AUS_promulgate_the_may_constitution: "Обнародовать майскую конституцию" # Promulgate The May Constitution
 AUS_promulgate_the_may_constitution_desc: "Мы завершим работу Дольфуса, обеспечив, чтобы его хорошо продуманная конституция о новом корпоративном порядке в Австрии была доведена до конца. Неэффективный либерализм больше не будет беспокоить Австрию!" # We shall complete Dollfuß’s work by ensuring that his well-laid constitution on the new corporate order in Austria is seen through. No more shall ineffective liberalism malaise Austria!

 AUS_corporatism: "Экономический корпус" # Economical Corpus
 AUS_corporatism_desc: "Чтобы сначала построить корпоративное государство, мы должны обеспечить, чтобы планирование и теория корпоративного государства были хорошо поняты широкой общественностью. Марксизм и его чушь о классовой борьбе будут разгромлены в прах!" # To first build the corporate state, we must ensure that the planning and theory of the corporate state is well understood by the public at large. Marxism and its class-warfare drivel shall be smashed into the dust!

 AUS_future_of_unions: "Будущее профсоюзов" # The Future of Unions
 AUS_future_of_unions_desc: "Профсоюзы не являются злом по своей сути, но они опускаются до неудачного статуса инструментов классовой войны Интернационала. Мы должны обеспечить, чтобы любое объединенное тело рабочего класса было объединено только с остальным австрийским обществом." # Unions are not inherently evil, but they sink to the unfortunate status of tools of class warfare by the International. We must ensure that any united body of the working class is only united with the rest of Austrian society.

 AUS_eliminate_socialist_parties: "Ликвидировать социализм" # Eliminate Socialism
 AUS_eliminate_socialist_parties_desc: "Долой социализм! Это единственный девиз, с которым может согласиться большинство здравомыслящих людей. Мы должны добиться того, чтобы большевизм и все его производные были полностью искоренены в австрийском обществе." # Out with socialism! This is the one motto most of sane humanity can agree with. We must ensure that Bolshevism and all of its derivatives have been thoroughly exterminated from Austrian society.

 AUS_eliminate_parliamentarism: "Разорвите парламентскую вуаль" # Rip the Parliamentarian Veil
 AUS_eliminate_parliamentarism_desc: "Парламентаризм – это шутка, но притом губительная. Он не только не увидел более процветающей Австрии, но лишь разделил нас и причинил нам большой вред, сделав свою смерть единственным путем для новой Австрии." # Parliamentarianism is a joke, but a disastrous one at that. Far from seeing a more prosperous Austria, it has only divided us and caused us great harm, making its death the only way for a new Austria.

 AUS_unitary_economy: "Корпоративное государство" # Der Ständestaat
 AUS_unitary_economy_desc: "Ständestaat находится на горизонте создания, но поддерживать его будет непростой задачей. Тем не менее, мы уже видим его последствия: австрийское общество снова становится гармоничным – трижды ура Ständestaat!" # The Ständestaat is on the horizon of being created, but maintaining it will not be a simple task. Yet, we already see its effects as Austrian society becomes harmonious once more - three cheers to the Ständestaat!

 AUS_establish_the_front: "Создание Отечественного фронта" # Establish the Vaterländische Front
 AUS_establish_the_front_desc: "Если мы хотим снова увидеть Австрию независимой и гармоничной, необходим широкий фронт, преодолевающий политические партии. Отечественный фронт должен стать именно тем средством, которое обеспечит это." # A broad front that overcomes political parties is needed if we are to see Austria independent and harmonious again. The Fatherland Front shall be just the vehicle to ensure this.

 AUS_buy_loyalty: "Купить Лояльность" # Buy Loyalty
 AUS_buy_loyalty_desc: "Страх не обязательно является самым эффективным мотиватором. Золото может быть таким же, если не более эффективным, средством убедить наших политических соперников присоединиться к нам в стремлении к лучшей Австрии завтрашнего дня." # Fear is not necessarily the most effective motivator. Gold can be just as, if not more effective in persuading our political rivals to join us in pursuing a better Austria for tomorrow.

 AUS_crush_socialist_militias: "Разрушьте защитную связь" # Crush the Schutzbund
 AUS_crush_socialist_militias_desc: "Бандиты-социалисты — лучший способ описать предполагаемую «лигу защиты», то есть Республиканский шуцбунд. Его распад должен гарантировать, что никто не сможет угрожать нашему правлению." # Socialist thugs are the best way to describe the supposed \"protection league\" that is the Republikanischer Schutzbund. Its disintegration shall ensure none can threaten our rule.

 AUS_ally_moderate_hemiwehr: "Сделка с Хеймвером" # Deal with the Heimwehr
 AUS_ally_moderate_hemiwehr_desc: "Хаймвер — братья-единомышленники, стремящиеся к созданию корпоративного, единого австрийского государства. Даже если у них были трудности с пангерманскими сумасшедшими, с ними все равно можно работать, чтобы обеспечить нашему режиму надежную поддержку." # The Heimwehr are like-minded brothers in the pursuit of a corporate, united Austrian state. Even if they have had their difficulties with pan-German madmen, they can still be worked with to ensure that our regime has solid backing.

 AUS_intergrate_allies_in_landbund: "Интегрируйте союзников Ландбунда" # Integrate Landbund Allies
 AUS_intergrate_allies_in_landbund_desc: "Ландбунд — это группа, с которой мы можем легко пойти на компромисс и с чьей программой в отношении земли мы можем согласиться. Чтобы сделать его настоящим корпоративным фронтом, давайте включим их в Отечественный фронт." # The Landbund are a group with whom we can easily compromise with and whose programme relating to the land we can agree with. To make it a true corporate front, let us bring them into the Fatherland Front.
 AUS_intergrate_allies_in_landbund_tt: "Дает §Y[ROOT.GetName]§! §Y1 политической власти§! за каждый процент популярности в идеологиях §Yсоциально-либеральной§! и §Yрыночно-либеральной§!. В настоящее время: [?pp_to_give|Y]" # Gives §Y[ROOT.GetName]§! §Y1 political power§! for each percentage of popularity in the §Ysocial liberal§! and §Ymarket liberal§! ideologies. Currently: [?pp_to_give|Y]

 AUS_intergrate_allies_in_CS: "Интегрируйте союзников по CS" # Integrate CS Allies
 AUS_intergrate_allies_in_CS_desc: "Христианско-социальные партии были оплотом всего правого в Австрии во времена республики и до сих пор остаются нашими самыми верными союзниками. Их вступление в Отечественный фронт укрепит его статус голоса нации." # The Christian-Socials were the bulwark of all that is right in Austria during the days of the republic, and up until now remain our staunchest allies. Their entry into the Fatherland Front shall cement its status as the voice of the nation.
 AUS_intergrate_allies_in_CS_tt: "Дает §Y[ROOT.GetName]§! §Y1 политической власти§! за каждый процент популярности §Yсоциально-консервативной§! идеологии. В настоящее время: [?party_popularity_100@social_conservative|Y]" # Gives §Y[ROOT.GetName]§! §Y1 political power§! for each percentage of popularity in the §Ysocial conservative§! ideology. Currently: [?party_popularity_100@social_conservative|Y]

 AUS_eliminate_valkist_networks: "Ликвидировать немецко-фёлькишские сети" # Eliminate German-Völkisch Networks
 AUS_eliminate_valkist_networks_desc: "Различные группы Völkisch заявляют о своей патриотичности, но на самом деле они представляют собой не что иное, как пятую колонну, которую Берлин может использовать против нас. Их нужно быстро выследить." # The various Völkisch groups claim to be patriotic, but in reality are nothing but a fifth column for Berlin to use against us. They must be hunted down swiftly. 

 AUS_schuschnigg_for_independence: "Отец нации" # The Father of the Nation
 AUS_schuschnigg_for_independence_desc: "Курт Шушниг — не просто жестяной диктатор, а, скорее, проводник новой Австрии. Немцы на севере желают видеть Австрию разбитой на отдельные государства, которые должны быть превращены в прусские манекены – и мы этого не потерпим!" # Kurt Schuschnigg is not a mere tinpot dictator, but rather a guide for the new Austria. The Germans to the north desire to see Austria broken up into individual states that are to be made into Prussian dummies - and for this we shall not stand!

 AUS_new_nationalism: "Возродить австрийский национализм" # Rejuvenate Austrian Nationalism
 AUS_new_nationalism_desc: "Австрийский национализм был, к сожалению, слабым явлением с 1919 года, и зачастую самые патриотические чувства в нашей стране принадлежат не Австрии, а скорее Германии! Мы должны позаботиться о том, чтобы подлинно австрийский национализм укрепился, а не уступил Берлину нашу национальную надежду." # Austrian nationalism has been an unfortunately weak phenomenon ever since 1919, and often the most patriotic in our nation are not for Austria but rather for Germany! We must see to it that a truly Austrian nationalism takes hold, rather than conceding to Berlin our national hope.

 AUS_christian_values: "Укрепить христианство" # Reinforce Christianity
 AUS_christian_values_desc: "Что отличает нас от Германии или кого-либо еще в этом отношении? Настоящим австрийским арендатором является наша вера в Бога и наша готовность держаться ее, несмотря на то, что могут подумать большевики и язычники. Католицизм — это основа австрийской нации, которой мы должны быть верны." # What separates us from Germany, or anyone else for that matter? A true Austrian tenant is our faith in God, and our willingness to hold on to it even in spite of what bolsheviks and pagans might think. Catholicism is the bedrock of the Austrian nation, to which we must be true.

 AUS_the_youth: "Расширить христианские молодежные программы" # Expand Christian Youth Programmes
 AUS_the_youth_desc: "Что такое нация без молодежи? Молодежь Австрии легко манипулирует умами, которые вместе со множеством злонамеренных субъектов подвергаются большому риску манипулирования со стороны Берлина или Москвы. Мы должны расширить христианские молодежные программы, чтобы защитить их!" # What is a nation without its youth? The youth of Austria have easily manipulated minds, which with the bevy of malicious actors are at great risk of manipulation whether by Berlin or Moscow. We must expand Christian youth programmes to protect them!

 AUS_ost_guard: "Очистить Бундесжандармерию" # Purify the Bundesgendarmerie
 AUS_ost_guard_desc: "Жандармерия играет ключевую роль в поддержании порядка, но к потенциальному проникновению в нее нежелательных элементов, безусловно, нельзя относиться легкомысленно. Они должны пройти надлежащую проверку, чтобы гарантировать, что в них служат только австрийские патриоты." # The gendarmerie are a key part of maintaining order, but their potential infiltration by unwelcome elements is certainly not something we can take lightly. They must be properly vetted to ensure that only Austrian patriots serve in them.

 AUS_the_new_constitution: "Внести поправки в Конституцию" # Amend the Constitution
 AUS_the_new_constitution_desc: "Отныне Отечественный фронт будет единственной силой в Австрии. Корпоративное государство теперь может быть по-настоящему реализовано, где все в обществе гармонично сотрудничают ради великой цели – австрийского величия – где либеральная демократия является лишь темной главой нашего прошлого." # From now on, the Fatherland Front shall be the only power in Austria. The corporate state can now be truly realized, where all in society cooperate harmoniously for a greater goal of Austrian greatness - where liberal democracy is but a dark chapter of our past.

 AUS_giving_the_ministry_of_agriculture: "Уступить Ландбунду" # Concede to the Landbund
 AUS_giving_the_ministry_of_agriculture_desc: "Ландбунд знает, что делать с сельскохозяйственной политикой, и во исполнение нашего соглашения с ним он может диктовать, какой должна быть наша сельскохозяйственная политика." # The Landbund knows what to do when it comes to agricultural policy, and in fulfillment of our agreement with them they may dictate what our agricultural policy shall be.

 AUS_expand_help_to_farmers: "Субсидирование малого фермерства" # Subsidise Small Farming
 AUS_expand_help_to_farmers_desc: "Среди тех, кто больше всего пострадал от «Черной среды», были мелкие фермеры. Мы поддержим их щедрыми субсидиями и снижением налогов, чтобы обеспечить их выживание." # Among those hit hardest by Black Wednesday were the small farmers. We shall prop them up with generous subsidies and tax cuts to ensure their survival.

 AUS_defending_austria: "Защищая Отечество" # Defending the Fatherland
 AUS_defending_austria_desc: "Возможно, мы консолидировались внутри страны, но снаружи таится гораздо более серьезная угроза. Рейх, неотличимый от нашего брата по Великой войне, теперь жаждет только безумной империи, простирающейся от Лиссабона до Урала, в которой мы всего лишь пешка. Мы должны гарантировать, что сможем им противостоять." # We may have consolidated ourselves internally, but externally lay a far greater threat. The Reich, unrecognizable from our Great War brother, now only hungers for a mad empire stretching from Lisbon to the Urals, and in which we are nothing but a pawn. We must ensure that we can withstand them.

 AUS_prepare_for_storm: "Готовьтесь к буре" # Prepare for The Storm
 AUS_prepare_for_storm_desc: "Чтобы выдержать надвигающуюся бурю, мы должны подготовиться как никогда раньше. Каждый гражданин должен быть готов пожертвовать собой ради нации и ради нашей будущей свободы." # To weather the coming storm, we must prepare ourselves like never before. Every citizen shall be ready to sacrifice for the nation and for our future freedom.

 AUS_destroy_fuhrer_network: "Антидиверсионные операции" # Anti-Subversive Operations
 AUS_destroy_fuhrer_network_desc: "Есть много подрывных элементов, которые ждут правильного призыва из Берлина, чтобы нанести ущерб нашей стране. Если мы хотим сохранить свободу Австрии, нам необходимо искоренить этих предателей." # There are many subversive elements just waiting for the right call by Berlin to wreak havoc upon our nation. If we are to maintain Austrian freedom, we need to root these traitors out.

 AUS_propaganda_department: "Расширить отдел пропаганды" # Expand Propaganda Department
 AUS_propaganda_department_desc: "Пропаганда показала себя полезным инструментом обеспечения подчинения и даже энтузиазма. Хотя это не всегда может быть правдой, на войне правда — это роскошь. Давайте расширим наши пропагандистские усилия для более подготовленного населения." # Propaganda has shown itself to be a useful tool in ensuring compliance and even fervor. While it may not always be truthful, the truth is a luxury in war. Let us expand our propaganda efforts for a more ready population.

 AUS_anti_anchluss_campaign: "Антипрофсоюзная кампания" # Anti-Anschluß Campaign
 AUS_anti_anchluss_campaign_desc: "Весь мир по-прежнему думает о нас как о не более чем о будущей части берлинской империи. Однако они должны доказать свою неправоту и понять, что мы не являемся невольными жертвами планов Германии и что мы свободный и гордый народ." # The entire world still thinks of us as nothing more than a soon-to-be part of Berlin’s empire. They however must be proven wrong and understand that we are not unwitting victims of Germany’s schemes and that we are a free and proud people.

 AUS_south_tyrol_propaganda: "Пропаганда Южного Тироля" # South Tyrol Propaganda
 AUS_south_tyrol_propaganda_desc: "Среди многих земель, отнятых у нас после Великой войны, был Южный Тироль. Немецкоязычное население ищет спасения в Вене. Мы должны их доставить." # Among the many lands snatched away from us after the Great War was Sudtirol. Its German speaking population looks towards Vienna for salvation. We must deliver them.

 AUS_mobolize_the_population: "Мобилизовать общественность" # Mobilise the Public
 AUS_mobolize_the_population_desc: "Общество должно быть готово, готово бороться и бороться за независимость Австрии. Массовые митинги, усиление пропаганды и постоянные национальные трансляции обеспечат готовность каждого сражаться за Австрию!" # The public must be ready, ready to struggle and fight for Austrian independence. Mass rallies, an increase in propaganda and continuous national broadcasts will ensure everyone is ready to fight for Austria!

 AUS_conscription: "Принудить к воинской повинности" # Enforce Conscription
 AUS_conscription_desc: "Нам нужен каждый человек, который может сражаться, чтобы сражаться, даже если это будет происходить за счет комфорта гражданского населения. Сейчас нелегкие времена, и каждый австрийский мужчина должен внести свой вклад в защиту нашего образа жизни." # We need every man who can fight to fight, even if this comes at the cost of civilian comfort. These times are not times of ease, and every Austrian man must do his part to protect our way of life.

 AUS_jansa_plan: "План защиты Янсы" # Jansa's Defence Plan
 AUS_jansa_plan_desc: "Альфред Янса разработал план обороны, который гарантирует, что мы сможем продержаться против Берлина до дальнейшего вмешательства западных держав, которые придут нам на помощь. Она пользуется поддержкой генерального штаба и достойна и нашей поддержки." # Alfred Jansa has concocted a defence plan that will ensure that we are able to hold out against Berlin until further intervention by the Western powers to our rescue. It has the support of the general staff, and is worthy of our support too.

# Monarchy

 AUS_attack_italy: "Нападение на Италию" # Attack Italy
 AUS_attack_italy_desc: ""

 AUS_monarchy_restored: "Возвращение Габсбургов" # Return of the Habsburgs
 AUS_monarchy_restored_desc: "Республика, со всей ее нестабильностью и беспорядком, находится на пути к упадку. Благодаря успеху гамбита Отто фон Габсбурга он и его клика, Партия монархической реставрации, пришли к власти. Отто и его последователи стремятся к возрождению старой монархии в обновленной и современной форме. Подобно Фениксу из пепла смерти, Габсбурги восстанут снова." # The Republic, with all its instability and disorder, is on its way out. With the success of Otto von Habsburg’s gambit, he and his clique, the Monarchist Restoration Party, has risen to power. Otto and his followers seek a rebirth of the old monarchy into a renewed and modern form. Like a Phoenix from the ashes of death, the Habsburgs will rise again.

 AUS_austria_hungary: "Австро-Венгрия" # Austria-Hungary
 AUS_austria_hungary_desc: ""

