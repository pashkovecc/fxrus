 AUS_FUHRERREICH_DESC: "Once one of the greatest empires in Europe, the Austrian nation has been beaten, broken and battered into being a rump state, considered among many as one of the few unsaveable nations from the newly awakened Germany’s wrath.\n\nBut must this be so? Even if the republic faces great difficulty in all sorts of things, the Austrian people still desire freedom and life. Many political factions in the country await their opportunity - to give the Austrian people freedom and once and for all cement a new Austria for a new age."
  
