 AUS_expand_imperial_mining_operations: "Расширить имперские горнодобывающие операции" # Expand Imperial Mining Operations
 AUS_expand_imperial_mining_operations_desc: ""

 AUS_connect_the_country: "Соедините страну" # Connect the Country
 AUS_connect_the_country_desc: ""

 AUS_the_triune_kingdom_of_illyria: "Триединое королевство Иллирия" # The Triune Kingdom of Illyria
 AUS_the_triune_kingdom_of_illyria_desc: "В предвоенные годы покойный Франц Фердинанд был убежденным сторонником создания третьего королевства в рамках двойной монархии, так называемой идеи триалиста. Это могло бы помочь нам обеспечить лояльность южных славян, большинство из которых недовольны доминированием сербов." # In the Pre-war years the late Franz Ferdinand was a staunch supporter of creating a third kingdom in the dual monarchy, the so-called Trialist idea. It could help us secure the loyalty of the South Slavs, most of whom resent being dominated by the Serbs.

 AUS_combat_serbian_nationalism: "Борьба с сербским национализмом" # Combat Serbian Nationalism
 AUS_combat_serbian_nationalism_desc: ""

 AUS_the_question_of_transylvania: "Вопрос о Трансильвании" # The Question of Transylvania
 AUS_the_question_of_transylvania_desc: ""

