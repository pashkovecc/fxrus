#### Events ####

#SecularDebate

 seculardebate.1.t: "Правительство решает светские дебаты" # The Government tackles the Secular Debate
 seculardebate.1.d: "В преддверии выборов возникли серьезные дебаты по вопросу секуляризации в Сальвадоре. В то время как некоторые, особенно те, кто имеет корпоративные интересы, желают уменьшить власть Церкви, другие считают, что это противоречило бы основополагающим ценностям нации. Более того, существует убеждение, что светские организации, такие как United Fruit Company, станут еще сильнее, даже слишком сильными, по мере того как они заполнят вакуум власти. Нам следует постараться урегулировать дебаты как можно лучше в ближайшие месяцы, иначе проблема потребует радикальных решений." # With the election forthcoming, a major debate has arisen over the issue of secularization in El Salvador. While some, particularly those with corporate interests, wish to diminish the power of the Church, others hold it would be a contradiction of the nation's founding values. Furthermore, there is a belief that secular entities like the United Fruit Company would grow even stronger, too strong, as they fill the vacuum of power. We should seek to settle the debate as best we can in the coming months, or else the issue will call for radical solutions.
 seculardebate.1.a: "Дебаты начинаются..." # The Debate begins...
 seculardebate.2.t: "Светские дебаты: Церковь слишком сильна?" # The Secular Debate: Is the Church too powerful?
 seculardebate.2.d: "В сельских регионах нашей страны католическая церковь обладает огромной властью. Те, кто идет против пропагандируемых убеждений своих местных священников, редко достигают хотя бы малейшей власти, а на национальном уровне богатство и влияние Церкви были решающим фактором для многочисленных законопроектов и политических мер. Хотя в последние годы это влияние уменьшилось, немногие будут предпринимать какие-либо действия, запрещенные священником, даже если они будут на благо нации. Некоторые спрашивают, не слишком ли это большая мощность? Может ли Сальвадор быть настоящей эгалитарной республикой с такой властью духовенства? Но, конечно, на самом деле есть только одна группа, которая могла бы успешно противостоять влиянию Церкви: United Fruit Company." # In the rural regions of our country, the Catholic Church wields immense power. Those who go against the promoted beliefs of their local priests rarely achieve even a modicum of power, and on a national level, the wealth and influence of the Church has been a deciding factor for numerous bills and policies. While this sway has diminished in recent years, few will take any action a priest forbids, even if it were in the benefit of the nation. Some ask, is this too much power? Can El Salvador be a proper, egalitarian republic with the clergy holding such sway? But, of course, there is really only one group that could push away the Church's influence successfully: the United Fruit Company.
 seculardebate.2.a: "Во что бы то ни стало должна быть четкая грань между Церковью и Государством!" # There must be a clear line between Church and State by any means!
 seculardebate.2.b: "Мы всегда будем набожной страной, а не корпоративной марионеткой!" # We will always be a devout country, not a corporate puppet!
 seculardebate.3.t: "Светские дебаты: компания слишком сильна?" # The Secular Debate: Is the Company too powerful?
 seculardebate.3.d: "С тех пор, как американцы вновь заявили о себе на континенте, United Fruit Company стала как никогда могущественным призраком по всей Центральной Америке. Затем, когда США возобновили политику так называемого разрушения доверия, Компания сосредоточила свою власть в Центральной Америке. Но кризис в нескольких странах и революция в Гватемале привели к тому, что компания сосредоточила свое внимание здесь, в Сальвадоре. Они создали оплот, чтобы спрятаться от трастовых атак правительства США через свои дочерние компании. Тропическая радиотелеграфная компания контролирует нашу коммуникационную инфраструктуру, Служба тропического строительства обслуживает наши дороги, Боеприпасы Белого флота снабжают нашу армию, а совместное предприятие UF-Socony снабжает топливом наши корабли и электричеством. Всем недавним президентам приходилось лишь на словах соглашаться с ними и заключать закулисные сделки, чтобы обеспечить свое собственное избрание. Излишне говорить, что некоторые хотят разорвать эту корпоративную власть. Поскольку нам не хватает автономии правительства от них, кажется, что Католическая церковь может попытаться ослабить власть UFCO." # Ever since the Americans reasserted themselves across the continent, the United Fruit Company has grown as ever powerful spectre across all of Central America. Then, as the US renewed a policy of so-called trustbusting, the Company focused its power in Central America. But blight in several countries and revolution in Guatemala has seen the Company focus itself here in El Salvador. They have made a stronghold to hide from the US Government's trustbusting via their child companies. The Tropical Radio and Telegraph Company controls our communications infrastructure, the Tropical Construction Service maintains our roads, White Fleet Munitions supplies our military, and the UF-Socony Joint Venture fuels our ships and electricity. All recent presidents have had to pay them lip-service and make backroom deals to ensure their own election. Needless to say, some wish to break this corporate hold. As we are lacking government autonomy from them, it seems it may be up to the Catholic Church to work to weaken UFCO's grasp.
 seculardebate.3.a: "Их укрепление означает, что когда они получают выгоду, мы получаем выгоду." # Their entrenchment means that when they benefit, we benefit.
 seculardebate.3.b: "Что бы сделал Иисус? Выгоните торговцев и менял!" # What would Jesus do? Whip the merchants and money-changers out!
 seculardebate.4.t: "Светские дебаты: пустой участок" # The Secular Debate: An Empty Lot
 seculardebate.4.d: "Недавний спор, вызвавший протесты в Сан-Сальвадоре, стал почти типичным примером дебатов, охвативших нацию. У источника пустой участок. Несколько лет назад на этом участке когда-то располагался местный магазин, который был выкуплен и снесен UFCO. Строительство нового магазина одежды так и не было полностью одобрено, и участок затерялся в море документации, оставшись нетронутым. Местные жители начали использовать его как место встреч, и оно стало местом, где местные священники проводили проповеди на открытом воздухе, поскольку в ближайшей церкви нет необходимой вместимости. UFCO вновь обнаружила этот участок и прибыла, чтобы обнаружить, что прихожане установили скамьи ручной работы и кафедру. После того, как корпоративные головорезы вычистили этих верующих, ситуация только ухудшилась. Некоторые считают, что этот участок следует использовать так, как желает сообщество, учитывая его заброшенность, но другие утверждают, что это была частная собственность, и что единственная причина, по которой этот вопрос подлежит обсуждению, заключается в том, что теперь в нем участвует Церковь." # In an almost quintessential showcase of the debate gripping the nation, a recent dispute has sparked protests in San Salvador. An empty lot is at the source. Years ago, this lot was once a local shop that was bought out and demolished by UFCO. The construction of a new clothing store was never fully approved, and the lot was lost in a sea of paperwork, left untouched. The locals of the neighborhood began to use it as a meeting place, and it became a place where local priests have held outdoor sermons, as the nearest church lacks the needed capacity. UFCO rediscovered the lot, and arrived to find the parishioners had placed hand-crafted pews and a pulpit. After corporate thugs cleared these faithful out, the situation has only gotten worse. Some feel the lot should be used how the community wishes, given its abandonment, but others argue that it was private property, and that the only reason the issue is up for debate is because the Church is now involved.
 seculardebate.4.a: "Нравится вам это или нет, но это была собственная земля. Церковь не может просто занять его." # Like it or not, it was owned land. The Church can't just occupy it.
 seculardebate.4.b: "Спустя столько лет участок принадлежит сообществу, а не компании." # After so many years, the lot belongs to the community, not the company.
 seculardebate.5.t: "Светские дебаты: выходной" # The Secular Debate: A Day Off
 seculardebate.5.d: "Очередной скандал сотрясает нашу маленькую страну. Служба тропического строительства всегда привлекала для своих проектов как местную, так и иностранную рабочую силу. Недавно большая петиция и угроза забастовки со стороны христианских рабочих позволили предоставить выходные по воскресеньям. Чтобы компенсировать убытки, компания призвала еврейских сотрудников заполнить этот день, предложив более высокооплачиваемые часы. Однако у этих рабочих были свои требования: предоставить им выходные в субботу. Воодушевленные этим, сотрудники-мусульмане, недавно прибывшие после того, как UFCO создала рекрутинговый центр в Финикии, попросили выходные в пятницу после обеда для джума-намаза в обмен на возможность работать по субботам и воскресеньям с нормальной оплатой. Компания согласилась на оба требования, как только стало ясно, что они не увидят значительных потерь в средствах, но значительно повысят моральный дух сотрудников. Однако католическая церковь возмущена тем, что она называет «расширением прав и возможностей язычников» со стороны компании, и объявила забастовку в знак протеста. Теперь компания добивается вмешательства правительства." # Yet another scandal is rocking our small country. The Tropical Construction Service has always brought in both local and foreign labor for its projects. Recently, a large petition and threatening of strike by Christian workers allowed for the granting of Sundays off. In a move to recoup losses, the company encouraged Jewish employees to fill this day, with higher paying hours offered. However, these workers had their own demands, requesting that they be allowed Saturdays off for Sabbath. Encouraged by this, Muslim employees, a recent influx after UFCO created a recruiting outpost in Phoenicia, requested Friday afternoons off for the jumu'ah prayer, in exchange for being able to work both Saturdays and Sundays at normal pay. The company agreed to both demands once it was clear they would see no sizeable loss in funds, but a sizeable gain in employee morale. However, the Catholic Church is outraged at what it calls the "empowering of heathens" by the company, and has called a strike in protest. The company now seeks government intervention.
 seculardebate.5.a: "Прекратить забастовку. Компания действовала честно." # Break up the strike. The company was only being fair.
 seculardebate.5.b: "Церковь права. Это опасный плюралистический прецедент." # The Church is right. This is a dangerous pluralist precedent.
 seculardebate.6.t: "Светские дебаты: United Fruit против Акосты" # The Secular Debate: United Fruit v. Acosta
 seculardebate.6.d: "Сейчас дело передано в высшие суды. Эмилио Хустиниано Акоста Вергара, бывший предприниматель и продавец, был привлечен к ответственности по ряду долгов United Fruit Textile & Clothing Company, а также Tropical Radio and Telegraph Company и даже White Fleet Munitions. Несколько лет назад, в результате длинной и сложной серии событий, Акоста создал множество разнообразных предприятий, получая деньги из различных источников, среди которых дочерние компании UFCO были наиболее известными. Агент доверия обманул их и попытался использовать обещания больших доходов от первоначальных инвестиций в различные мошеннические идеи и предприятия. Используя деньги других инвесторов в качестве доказательства прибыли, он накопил и потратил значительную часть денег, прежде чем обналичить их. Он бежал и, предположительно, по дороге нашел Бога, присоединившись к монастырю как «Брат Эмилио». \n\nОтказавшись от своей лжи и жадности, пожилой мужчина охотно обратился в суд после того, как его обнаружили несколько месяцев назад. Будучи монахом-эстетом, Акоста не имеет ничего общего с своим именем, кроме известности ныне печально известной «Схемы Акосты». Его инвесторы, однако, требуют компенсации, поскольку они все еще находятся в пределах срока давности, хотя и едва, и утверждают, что исчезновение Акосты не защищает его. Они также отмечают, что Акоста отдал монастырю остальную часть своих денег, достаточную для покрытия большей части убытков компаний. Они хотят вернуть эти деньги." # A case has risen now to the highest courts. Emilio Justiniano Acosta Vergara, a former entrepreneur and salesman, has been called in on a number debts by the United Fruit Textile & Clothing Company, as well as the Tropical Radio and Telegraph Company, and even White Fleet Munitions. A few years ago, through a long, complicated series of events, Acosta created a numerous variety of ventures, taking money from various sources, with these UFCO child companies being the most prominent. The confidence man swindled them and attempted to use promises of large returns on initial investments in a variety of fraudulent ideas and businesses. Using money from other investors as proof of returns, he amassed and spent a sizeable portion of the money before cashing out. He went on the run, and supposedly found God on the way, joining a monastery as 'Brother Emilio'. \n\nSwearing off his lying and greedy ways, the aged man willingly came to court after he was discovered a few months ago. As an aesthetic monk, Acosta has nothing to his name but notoriety of the now infamous 'Acosta Scheme.' His investors, however, are demanding compensation, as they are still within the statue of limitations, if barely, and claim that Acosta's disappearance does not protect him. They also note that Acosta gave the rest of his money, enough to cover much of the companies' losses, to the monastery. They want that money back.
 seculardebate.6.a: "Деньги были украдены, куда бы они ни пошли. Правило в пользу корпораций." # The money was stolen, no matter where it went. Rule in favor of the corporations.
 seculardebate.6.b: "Он изменился, и деньги теперь принадлежат монастырю. Решение в пользу Акосты." # He's a changed man, and the money is now the monastery's. Rule in favor of Acosta.
 seculardebate.7.t: "Светские дебаты: тупик" # The Secular Debate: An Impasse
 seculardebate.7.d: "Несмотря на наши усилия, светские дебаты продолжаются, возможно, даже хуже, чем раньше, поскольку в центре внимания оказались несколько крупных событий. У обеих сторон есть свои точки зрения, и никто не уверен, какая из них действительно будет доминировать, тем более что многие члены Национально-демократической партии заявляют о нейтралитете по этому вопросу. Кажется, дело решится одним и только одним: выборами." # Despite our efforts, the Secular Debate rages on, perhaps even worse than before as the spotlight was shined on several major events. Both sides have their points, and no one is certain which will truly dominate, particularly as many members of the National Democratic Party have claimed neutrality on the issue. It seems the matter will be settled by one thing and one thing only: the election.
 seculardebate.7.a: "На выборы!" # To the polls!

#1937 Elections

 ELS_election.1.t: "Выборы 1937 года: ситуация" # The Election of 1937: The Situation
 ELS_election.1.d: "Поскольку приход к власти президента Карлоса Мелендеса Рамиреса был одобрен как Соединенными Штатами, так и позднее United Fruit Company, правила политическая династия, переходившая от одного утвержденного наследника к другому, и с течением времени богатая землевладельческая элита уступила власть либо Церкви, либо Компании, причем каждый президент в цепочке подчинялся тому или другому. Однако президент Хосе Кастельянос Контрерас был одним из лучших в этой цепочке, прислушиваясь к бедам людей и пытаясь сбалансировать корпоративные интересы и популистские настроения, не поддаваясь распаду государства, заставляя коррумпированную Национально-демократическую партию работать на благо народа. Но хождение по этой тонкой линии нанесло вред этому человеку, и его последняя попытка реформировать нацию путем поддержки либерала, но с хорошими связями Фернандо Руиса в качестве его преемника провалилась, когда Руис совершил «самоубийство» выстрелом в затылок. Это заставило Национально-демократическую партию бороться за его замену, а это означает, что теперь есть возможность для других, более радикальных партий. Поскольку их нейтралитет в светских дебатах осуждается большинством, у демократов мало шансов..." # Since the assumption of power by President Carlos Meléndez Ramirez was approved by both the United States and later the United Fruit Company, a political dynasty has ruled, passing from one approved heir to another, and as time went on, the wealthy landowning elite lost power to either the Church or the Company, with each presidency in the chain bowing to one or the other. However, President José Castellanos Contreras has been one of the best in that chain, listening to people's woes and attempting to balance corporate interests and populist sentiments without giving way to a breakdown of the state, shifting the corrupt National Democratic Party to work for bettering the people. But walking this fine line has taken a toll on the man, and his last attempt at reforming the nation by backing the liberal but well connected Fernando Ruiz as his successor has failed, when Ruiz committed 'suicide' via a shot to the back of the head. This has left the National Democratic Party scrambling to replace him, and this means there is now a window for other, more extreme parties. With their neutrality in the Secular Debate decried by most, the Democrats have poor odds...
 ELS_election.1.a: "Может ли победить сильнейший?" # May the best man win?
 ELS_election.2.t: "Выборы 1937 года: кандидаты" # The Election of 1937: The Candidates
 ELS_election.2.d: "Не имея явного наследника, Национально-демократическая партия стала партнером Партии процветания, политической группы, почти открыто поддерживаемой UFCO. Заменив мертвого Руиса, они теперь назвали своим кандидатом загадочного герцога Родольфо. Когда-то богатый банкир был неизвестен, и немногие до сих пор знают, как он вообще выглядит, но партийная машина усердно работала над тем, чтобы вселить его имя в головы, а корпорации следят за тем, чтобы их работники голосовали должным образом. \n\nВ ответ оппозиция объединилась посредством агрессивных аннексий со стороны радикально христианского и авторитарного Фронта спасения, который открыто моделирует себя по образцу валкистов в Германии. Их лидер, бывший генерал и маргинальный оккультист Максимилиано Эрнандес Мартинес, использовал хаос перед выдвижением герцога для пылкой рекламы, перехватывая радиоволны UFCO, чтобы разглагольствовать и ожесточать критику правительства. Его популярность растет с каждым днем, и его личные люди, так называемые «добровольцы-крестоносцы», начали запугивать всех остальных противников Дьюка, заставляя их поддержать его." # Without a clear heir, the National Democratic Party has partnered with the Prosperity Party, a near openly UFCO-backed political group. Replacing the dead Ruiz, they now have named the mysterious Rodolfo Duke as their candidate. The wealthy banker was once unknown, and few still know what he even looks like, but the party machine has been hard at work to put his name in everyone's heads, and the corporations are ensuring their workers vote properly. \n\nIn counter, the opposition has coalesced through aggressive annexations by the radically Christian and authoritarian Salvationist Front, which openly models itself after the Valkists in Germany. Their leader, former general and fringe occultist Maximiliano Hernández Martínez, has used the chaos before Duke's nomination to fervently promote himself, hijacking UFCO radio waves to give long rants and scalding criticisms of the government. His popularity grows each day, and his own personal men, so-called 'Crusader Volunteers', have begun intimidating all other opponents to Duke into supporting him.
 ELS_election.2.a: "Теневые банкиры и религиозные фанатики. Диос мио..." # Shadowy bankers and religious zealots. Dios mio...
 ELS_election.3.t: "Выборы 1937 года: выступления" # The Election of 1937: The Speeches
 ELS_election.3.d: "Всего через три месяца после выборов Герцог и Эрнандес начали выступать с речами; или, скорее, в случае Дьюка, он заставлял других произносить свои речи. Все высказывания Дьюка начинаются с заявления о том, что, поскольку он занят обрисовыванием политики и законодательства на благо нации, он нашел время, чтобы написать речь, но, к сожалению, не может произнести ее сам, поскольку работает. Риторика Дьюка о процветании и экономическом росте несет во многом ту же идею, что и большинство корпоративных лоббистов, но его идеи начали вызывать мысли: может ли Сальвадор использовать корпорации в своих интересах? Напротив, Эрнандес сам отправился в плавание, используя пламенную риторику, которая находит отклик у большей части сельской местности и воодушевляет верующих. Он призывает Сальвадор занять свое место под солнцем как сильная нация, стать духовным лидером Америки на пути Бога и Праведности." # Only three months from the election, Duke and Hernández have begun giving speeches; or rather, in Duke's case, having others give his speeches. All of Duke's have begun by stating that, as he is busy outlining policy and legislation for the betterment of the nation, he has taken the time to write a speech, but unfortunately cannot give it himself as he works. Duke's rhetoric of prosperity of growth holds much the same message as most corporate lobbyists, but his ideas have begun to spark a thought: could El Salvador use the corporations in its benefit? In contrast, Hernández has taken to the waves himself, using fiery rhetoric that resonates with much of the rural countryside and invigorates the religious. He calls for El Salvador to take its place in the sun as a strong nation, to be a spiritual leader for the Americas on the path of God and Righteousness.
 ELS_election.3.a: "У обоих есть сильные стороны..." # Both have some strong points...
 ELS_election.4.t: "Выборы 1937 года: итоги" # The Election of 1937: The Results
 ELS_election.4.d: "Это была напряженная гонка крайностей, без каких-либо ударов, когда плакаты и глашатаи Дюка встречали марши и радиоразглагольствования Эрнандеса. Среднего пути не существует, поскольку пыл охватил всю страну, разделяя семьи и общины, выбирающие свою сторону. Компания или Церковь. Партия или Фронт. Богатство или Вера. События светских дебатов, безусловно, повлияли на выборы, и теперь мы видим, какую судьбу выбрала нация. И цифры подведены. Победитель и президент..." # It was a tight race of extremes, with no punches pulled as the posters and criers of Duke met the marches and radio rants of Hernández. There is little middle ground, as the fervor has swept the nation, dividing families and communities as they choose their side. The Company, or the Church. The Party, or the Front. Wealth, or Faith. The events of the Secular Debate certainly weighed in on the election, and now we see what fate the nation has chosen. And the numbers have come in. The winner, and President is...
 ELS_election.4.a: "Родольфо Дюк! Мы все будем богатыми!" # Rodolfo Duke! We're all gonna be rich!
 ELS_election.5.t: "Выборы 1937 года: итоги" # The Election of 1937: The Results
 ELS_election.5.d: "Это была напряженная гонка крайностей, без каких-либо ударов, когда плакаты и глашатаи Дюка встречали марши и радиоразглагольствования Эрнандеса. Среднего пути не существует, поскольку пыл охватил всю страну, разделяя семьи и общины, выбирающие свою сторону. Компания или Церковь. Партия или Фронт. Богатство или Вера. События светских дебатов, безусловно, повлияли на выборы, и теперь мы видим, какую судьбу выбрала нация. И цифры подведены. Победитель и президент..." # It was a tight race of extremes, with no punches pulled as the posters and criers of Duke met the marches and radio rants of Hernández. There is little middle ground, as the fervor has swept the nation, dividing families and communities as they choose their side. The Company, or the Church. The Party, or the Front. Wealth, or Faith. The events of the Secular Debate certainly weighed in on the election, and now we see what fate the nation has chosen. And the numbers have come in. The winner, and President is...
 ELS_election.5.a: "Максимилиано Эрнандес Мартинес! Слава Господу!" # Maximiliano Hernández Martínez! Praise the Lord!
 ELS_election.6.t: "Запретный особняк" # The Forbidden Mansion
 ELS_election.6.d: "Очевидно, страдая от довольно неприятного кашля, Родольфо Дьюк написал свою приветственную речь и поручил другому прочитать ее вместо себя. Однако, чтобы развеять слухи о том, что его не существует, новый президент помахал толпе возле Президентского большого особняка, роскошного дома, построенного вторым президентом Мелендесом. С тех пор были представлены новые законы, написанные Дьюком и явно направленные на усиление симбиоза United Fruit Company и правительства Сальвадора. Его сообщения и уведомления часты, «Президентские уведомления» время от времени вывешиваются на городских площадях, но этого человека редко видят, даже его собственный персонал и кабинет министров, которые действуют через посредников. Только представителям UFCO регулярно разрешают его видеть, двери президентского офиса закрываются и запираются, как только они входят, но нация, по крайней мере, может быть уверена, что он работает и выполняет свои обещания." # Apparently suffering from a rather nasty cough, Rodolfo Duke wrote his acceptance speech and had another read it in his place. To quell rumors that he did not exist, however, the new President did give a wave to a crowd outside of the Presidential Grand Mansion, a lavish home built by the second President Meléndez. Since then, new legislation has been presented, all written by Duke, and all obviously intended to increase the symbiosis of the United Fruit Company and the government of El Salvador. His messages and notices are frequent, with "Presidential Notifications" being posted in town squares every so often, but the man is rarely seen, even by his own staff and cabinet, who deal through intermediaries. Only UFCO representatives are regularly allowed to see him, the doors of the President's office closed and locked once they enter, but the nation can at least be assured that he is at work fulfilling his promises.
 ELS_election.6.a: "Если он там, мы, по крайней мере, знаем, что он добивается цели!" # If he's in there, we at least know he's getting things done!
 ELS_election.7.t: "Господь будет править" # The Lord Shall Reign
 ELS_election.7.d: "После своей приветственной речи президент Эрнандес сделал шокирующее заявление: он не будет президентом. Вместо этого он займет новую должность государственного уполномоченного, которая будет обладать почти всеми теми же полномочиями. Но официальный глава государства и правитель нации не будет простым человеком. Вместо этого это будет Иисус Христос, наш Господь и Спаситель, Царь царей, а теперь и Президент президентов." # After his acceptance speech, President Hernández has made a shocking announcement: he will not be president. Instead, he will assume the new office of State Mandatary, which will hold almost all the same powers. But the official head of state, and ruler of the nation, will not be a mere man. Instead, it will be Jesus Christ, Our Lord and Saviour, King of Kings, and now President of Presidents.
 ELS_election.7.a: "Совершенно символический поступок, конечно." # An entirely symbolic act, of course.
 ELS_election.7.b: "...и Он будет царствовать во веки веков." # ...and He will reign forever and ever.
 ELS_election.8.t: "Корпоративное поглощение" # Corporate Takeover
 ELS_election.8.d: "Прошел месяц президентства Родольфо Дюка, и многие из его «советников» начали сомневаться в том, что иллюзия республики действительно необходима. Народ встал на сторону Дюка, верит в его политику, и не секрет, что он создает корпоративистское государство. Некоторые утверждают, что фарс должен быть прекращен, компании прямо заявляют о контроле над страной. На этих людей обычно пристально смотрят, пока они не перестанут говорить." # A month into the presidency of Rodolfo Duke, and many of his "advisors" have begun to question of the illusion of a republic is truly needed. The people sided with Duke, believe in his policies, and it is no secret he is creating a corporatist state. Some argue that the farce should be ended, the company outright declare control of the country. These people are usually given hard glares until the stop talking.
 ELS_election.8.a: "Дураки. Голосование доказывает им, насколько они с нами согласны." # Fools. The Vote proves to them how much they agree with us.
 ELS_election.8.b: "Но они правы! Конец притворству!" # But they're right! End the sham!

#Crusaders & Mercenaris

 ELS_crusaders.1.t: "Инициатива крестоносцев" # Crusaders Initiative
 ELS_crusaders.1.d: "Наши добровольцы-крестоносцы сыграли важную роль в обеспечении победы партии и силы нашего нового, славного государства. Теперь, когда мы более надежно консолидировали власть, лидеры добровольческих отрядов попросили нас расширить их роль и использовать их для укрепления нашей армии. После демонтажа большей части UFCO в нашей стране, множество молодых мужчин-христиан остались без работы. Они могли бы хорошо послужить нам солдатами нашего славного дела!" # Our Crusader-Volunteers were instrumental in ensuring the victory of the party and the strength of our new, glorious state. Now that we have consolidated power more securely, leaders of the volunteer units have asked we expand their role and use them to bolster our military. With our dismantling of much of UFCO in our country, plenty of young, Christian men are out of work. They could serve us well as soldiers for our glorious cause!
 ELS_crusaders.1.a: "Мы должны подготовиться к нашему расширению." # We must prepare for our expansion.
 ELS_crusaders.2.t: "Крестоносцы готовы!" # The Crusaders Are Ready!
 ELS_crusaders.2.d: "Потребовались многие месяцы рекламы, вербовки, обучения и идеологической обработки, но, наконец, мы превратили Крестоносцев-добровольцев в настоящую военную силу. Мандат, изложенный ранее, наконец-то выполнен, и хотя требуется больше времени для подготовки боевых планов и учений, у Сальвадора теперь есть армия, которая может его защитить!" # It has taken many months of advertising, recruiting, training, and indoctrination, but at last we have expanded the Crusader-Volunteers into a proper military force. The mandate set out before has at last been reached, and while more time to prepare battleplans and exercise drills is needed, El Salvador now has a military that cna defend her!
 ELS_crusaders.2.a: "Наточите лезвия и приготовьте метафорические требушеты!" # Sharpen your blades and prepare the metaphorical trebuchets!
 ELS_crusaders.3.t: "Наш великий крестовый поход" # Our Great Crusade
 ELS_crusaders.3.d: "Мы подготовили обширный план борьбы, чтобы нанести удар в самое сердце окружающей нас коррупции. Регионы Гондураса и Гватемалы, кишащие социалистическими еретиками и американскими подхалимами. Мы должны нанести удар, освободить благочестивые народы на этой территории и приветствовать их в нашей славной и благословенной стране. Мы готовы. Пришло время." # We have prepared an extensive battle plan to strike at the heart of corruption that surrounds us. The regions of Honduras and Guatemala, crawling with socialist heretics and America's bootlickers. We must strike, liberate the pious peoples in this territory, and welcome them into our glorious and blessed nation. We're ready. It is time.
 ELS_crusaders.3.a: "Бог хочет!" # Deus Vult!

 ELS_PMC.1.t: "Предложение частной охраны" # Private Security Proposal
 ELS_PMC.1.d: "Теперь, когда контроль над Сальвадором как полностью корпоративным государством признан и закреплен, мы можем начать рассматривать возможность расширения власти компании как в геополитическом, так и в экономическом плане. С этой целью члены совета предложили нанять и обучить частных охранных подрядчиков — наемников — для оказания помощи в этом начинании. Опрашивается ряд людей и групп." # Now that control of El Salvador as a totally corporate state has been recognized and solidified, we can now begin to consider expanding the power of the company in geopolitical as well as economic means. To this end, members of the board have proposed the hiring and training of private security contractors — mercenaries — to aid in this endeavor. A number of people and groups are being interviewed.
 ELS_PMC.1.a: "Надеюсь, они не будут слишком дорогими..." # Hopefully they won't be too expensive...
 ELS_PMC.2.t: "Подписаны контракты с ЧВК" # PMC Contracts Signed
 ELS_PMC.2.d: "После длительного процесса интервью, испытаний и демонстраций против местных повстанцев мы наконец подписали контракты на формирование армии частных охранных компаний. Теперь нам просто нужно время, чтобы обучить их нашим боевым планам." # After a lengthy process of interviews, testing, and demonstrations against local insurgents, we have at last signed the contracts for the formation of army of private security companies. Now we just need some time to train them for our battleplans.
 ELS_PMC.2.a: "Добро пожаловать в семью UFCO, господа!" # Welcome to the UFCO family, gentlemen!
 ELS_PMC.3.t: "Арест национальных активов" # National Asset Seizures
 ELS_PMC.3.d: "Все установлено. Деньги были переведены, наши войска знают стратегию наизусть, и мы установили контакт с готовыми к сотрудничеству людьми как в Гватемале, так и в Гондурасе. Наши огромные плантации и фабрики, захваченные социалистическим правительством, снова станут нашими." # Everything is set. The money has been transfered, our troops know the strategy by heart, and we've made contact with cooperative individuals in both Guatemala and Honduras. Our vast plantations and factories that have been seized by the socialist government will again be ours.
 ELS_PMC.3.a: "Это просто хороший бизнес." # It's just good business.

