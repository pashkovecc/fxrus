### Description ###
 FIN_FUHRERREICH_DESC: "После Великой войны Финляндия стала независимой страной. После сотен лет правления Швеции и России финский народ увидит себя свободным. Однако после этого нация окажется втянутой в гражданскую войну между белыми-антисоциалистами и красными-социалистами. Гражданская война, завершившаяся победой белых, оставила свой след в политике и обществе Финляндии. Даже в этом случае Финляндия является страной, переживающей огромное процветание, почти золотой век в истории Финляндии.\nКонечно, это процветание продлится долго." # After the Great War, Finland saw itself emerge as an independent nation. After hundreds of years under Swedish and Russian rule, the Finnish people would see themselves free. Following this, however, the nation would be thrown into a civil war between the anti-socialist Whites and the socialist Reds. A civil war that ended in White victory, it have made its mark on the politics and society of Finland. Even then, Finland is a nation experiencing immense prosperity, almost a golden age in the history of Finland.\nSurely this prosperity will last.
 FX_Finland: "Финское национальное древо фокусов" # Finnish National Focus Tree
### National Spirits ###
 FIN_finland_marches_on_idea: "Финляндия марширует!" # Finland Marches On!
 FIN_finland_marches_on_idea_desc: "После долгой борьбы независимость Финляндии от России и Швеции в основном была обеспечена. У нашей страны нет намерений снова оказаться под сапогом русских, но мы также можем быть настороже в отношении влияния и намерений нашего западного соседа." # After much struggle, Finnish independence from the Russians and Swedish has been mostly assured. Our nation has no intents to again come under the boot of the Russians, but we might also be on guard regarding the influence and intentions of our western neighbour.
 FIN_agrarian_society_idea: "Аграрное общество" # Agrarian Society
 FIN_agrarian_society_idea_desc: "Более 70% территории страны находится в аграрном секторе экономики, а страна в целом слабо индустриализирована. Это серьёзно сдерживает нашу производительность и отставание на мировой арене." # Over 70% of the country is in the Agrarian sector of the economy, and the country as a whole is poorly industrialized. This seriously hinders our output and lagging behind on the world stage.
 FIN_legacy_civil_war_idea: "Наследие гражданской войны" # Legacy of the Civil War
 FIN_legacy_civil_war_idea_desc: "Прошло почти 20 лет с тех пор, как в Финляндии разразилась гражданская война, и ее последствия наблюдаются до сих пор. Это может быть в основном ясно из политики Республики, с растущим движением Лапуа и тревожными чувствами, которые правые испытывают в отношении социал-демократов." # Nearly 20 years have passed since the civil war struck Finland, and its effects are still being seen today. This might be mostly clear in the politics of the Republic, with the growing Lapua Movement, and the anxious feelings right-wingers have around the Social Democrats.
 FIN_silver_decade_idea: "Серебряное десятилетие" # Hopea Vuosikymmen
 FIN_silver_decade_idea_desc: "Серебряное десятилетие — это название, которое популярно называли 1930-е годы в Финляндии. Несмотря на наследие, оставленное гражданской войной, медленную индустриализацию и угрозу, исходящую от Советского Союза, эта эпоха была стабильной и процветающей в истории независимой Финляндии." # The Silver Decade, is the name popularly given to the 1930s in Finland. Despite the legacy left behind by the civil war, the slow industrialization and the threat posed by the Soviet Union, this era has been a stable and prosperous one in the history of the independent Finland.

 FIN_silver_decade1_idea: "Серебряное десятилетие" # Hopea Vuosikymmen
 FIN_silver_decade1_idea_desc: "Серебряное десятилетие — это название, которое популярно называли 1930-е годы в Финляндии. Несмотря на наследие, оставленное гражданской войной, медленную индустриализацию и угрозу, исходящую от Советского Союза, эта эпоха была стабильной и процветающей в истории независимой Финляндии." # The Silver Decade, is the name popularly given to the 1930s in Finland. Despite the legacy left behind by the civil war, the slow industrialization and the threat posed by the Soviet Union, this era have been a stable and prosperous one in the history of the independent Finland.

