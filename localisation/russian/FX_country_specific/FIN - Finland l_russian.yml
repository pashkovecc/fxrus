### Decisions ###
 FIN_foreign_policy: "Внешняя политика Финляндии" # The Foreign Policy of Finland
 FIN_foreign_policy_desc: "Финская нация находится в достаточно сложной ситуации на мировой арене. Зажатая между влияниями Советского Союза, Великобритании и Германии, наша внешняя политика вполне может стать политикой, ориентированной на великую державу или находящейся в состоянии нейтралитета. Хотя союз может сделать нас открытыми для иностранного влияния во внутренней политике, он также может дать нам безопасность во все более враждебном мире.\n\nВ качестве альтернативы мы можем попытаться реализовать националистическую цель создания Великой Финляндии, освобождения карельских финнов и установления господства над окружающими землями, освобождая братьев финского народа от иностранных угнетателей.\n\nКакой бы путь мы ни выбрали, пока Финляндия остается независимой, наша внешняя политика будет хорошим начинанием." # The Finnish nation is in quite a situation upon the world stage. Sandwished between the influences of the Soviet Union, the United Kingdom and Germany, our foreign policy might very well become one in alignment with a Great Power or in a state of neutrality. While alignment might make us open for foreign influence in domestic policies, it might also give us safety in an increasingly hostile world.\n\nAlternativly, we can try to pursue the Nationalist goal of establishing Greater Finland, freeing the Karelian Finns and establish dominion over surrounding lands, freeing the brothers of the Finnish nation from foreign oppressors.\n\nWhatever route we might take, so long Finland stays independent, our foreign policy will be a good endavour.

