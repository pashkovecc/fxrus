### Focus Tree ###
 FIN_finnish_defence_forces: "Силы обороны Финляндии" # Finnish Defense Forces
 FIN_finnish_defence_forces_desc: "Несмотря на нашу победу над силами красных во время гражданской войны в Финляндии, призрак коммунизма по-прежнему угрожает нашей стране. За последние 20 лет Финляндия подготовила и оснастила крупнейшую военную силу в Скандинавии, чтобы сдержать любое советское наступление. Силы обороны Финляндии, или «Пуолустусвоймат», поддерживаемые в достаточном составе за счет строгого призыва на военную службу и профессионально обученные ведению зимней войны, готовы обескровить Советский Союз, если этот ужасный конфликт когда-либо осуществится.\n\nХотя финны готовы защищать каждый дюйм своей нации, скудный бюджет нашего правительства застопорил столь необходимые реформы. Поскольку Советский Союз продолжает модернизировать свои силы, мы должны продолжать следовать этому примеру." # Despite our victory over Red aligned forces during the Finnish Civil War, the Spectre of Communism still threatens our nation. For the last 20 years Finland has trained and equipped the largest military force in Scandinavia in order to deter any Soviet advances. Kept up to strength through strict conscription and expertly trained in winter warfare the Finnish Defense Force or \"Puolustusvoimat\" is prepared to bleed the Soviet Union dry if that dreaded conflict were to ever come to fruition.\n\nWhile Finns are prepared to defend every inch of their nation, our government's meager budget has stalled much needed reforms. As the Soviet Union continues to modernize their forces, we must continue to follow suit.

 FIN_finnish_navy: "Финский флот" # Finnish Navy
 FIN_finnish_navy_desc: "Когда Финляндия добилась независимости от Российской империи и сохранила этот статус, несмотря на советское давление, наш флот состоял из устаревших российских кораблей времен правления Александра III. Хотя с 1927 года предпринимаются усилия по модернизации финского военно-морского флота, прогресс отстает от графика. Мы должны возобновить эти усилия, если хотим защитить береговую линию нашей страны от советского Балтийского флота." # When Finland achieved its independence from the Russian Empire, maintaining that status despite Soviet pressure, our Navy was composed of obsolete Russian vessels from the reign of Alexander III. While efforts have been ongoing since 1927 to modernize the Finnish navy, progress has been falling behind schedule. We must renew these efforts if we are to protect our nation's coastline from the Soviet's Baltic Fleet.
 FIN_gunboat_modernization: "Модернизация канонерской лодки" # Gunboat Modernization
 FIN_gunboat_modernization_desc: "В настоящее время в арсенале ВМС Финляндии имеются 4 канонерские лодки, разделенные на классы «Уусимаа» и «Турунмаа» соответственно. Эти сторожевые корабли были спроектированы еще в эпоху Трариста для использования в Российском Императорском Флоте и начинают показывать свой возраст. Если мы хотим идти в ногу с Советами, мы должны начать модернизацию нашего существующего флота или инвестировать в совершенно новые современные корабли, чтобы заменить наши нынешние стареющие суда." # The Finnish Navy currently employs 4 Gunboats within it's arsenal divided between the Uusimaa class and Turunmaa class respectively. These guard ships were designed back in the Trarist era for use in the Imperial Russian Navy and are beginning to show their age. If we are to keep up with the Soviets, we must begin upgrading our existing fleet or invest in brand new modern ships to replace our current aging vessels.
 FIN_turku_naval_bases: "Создание Берегового полка Турку" # Establishing Turku Coastal Regiment
 FIN_turku_naval_bases_desc: "Поскольку напряженность в отношениях с Советским Союзом растет, мы должны подготовить наши крупные прибрежные города к морским атакам. Было предложено создать новый оборонительный отряд в районе Турку для защиты города от атак с моря. Береговой полк Турку, или «Турун Ранниккорыкментти», вооруженный береговыми батареями, обеспечит городу оборону, необходимую для отражения нападения противника." # As tensions grow with the Soviet Union we must prepare our major coastal cities for naval attacks. It has been proposed that a new defensive uit could be established around the region of Turku to defend the city from naval attacks. Armed with coastal batteries, the Turku Coastal Regiment or \"Turun Rannikkorykmentti\" will provide the city with the defenses needed to ward off an enemy attack.
 FIN_prioritize_coastal_defence: "Приоритизация береговой обороны" # Prioritize Coastal Defence
 FIN_prioritize_coastal_defence_desc: "Суровые погодные условия в Балтийском море вынуждают многие наши суда заходить в наши порты в зимний сезон. Если бы Советы были достаточно смелыми или, возможно, настолько глупыми, чтобы вторгнуться в нашу страну зимой, только наши меньшие корабли береговой обороны смогли бы действовать эффективно. Эти корабли могут пробивать лед и смогут перехватывать советские ледокольные корабли. Если мы хотим обеспечить функционирование нашего военно-морского флота в течение года, мы сосредоточим наше финансирование на меньших кораблях береговой обороны." # Harsh weather in the Baltic sea forces many of our vessels to dock in our ports during the Winter season. If the Soviets were bold enough, or perhaps stupid enough to invade our nation during the winter only our smaller coastal defense ships would be able to operate effectivly. These ships can break through the ice and would be able to intercept the Soviet's own ice breaking capable ships. If we are to maintain year long operation of our navy we focus our funding towards smaller coastal defense ships.
 FIN_defend_bay_of_finland: "Защитить Финский залив" # Defend the Gulf of Finland
 FIN_defend_bay_of_finland_desc: "Если бы разразилась война с Советским Союзом, ясно, что главным театром военно-морских действий стал бы Финский залив. Наша столица Хельсинки, расположенная на берегу Финского залива, находится в опасной близости от Советского Союза, но ее архаичная береговая оборона восходит к царской эпохе. Мы должны модернизировать береговую оборону вокруг города, если хотим защитить его от советского Балтийского флота. На близлежащем прибрежном острове под названием «Куивасаари» в настоящее время находится старое русское военно-морское орудие «Обуховский 52 калибра образца 1907 года». Это самая мощная корабельная пушка, действующая в советском ВМФ. Возвращение этого оружия в боевую готовность, несомненно, сдержит любые советские военно-морские наступления." # If war were to break out with the Soviet Union, it's clear that the Gulf of Finland would be main theatre of naval operations. Our capital, Helsinki, which rest upon the shores of the Gulf of Finland, lies dangerously close to the Soviet Union but it's archaic coastal defenses date back to Tsarist era. We must modernize coastal defenses around the city if we are to protect it from the Soviet Baltic Fleet. A nearby coastal island called \"Kuivasaari\" is currently the resting place of an old Russian \"Obukhovskii 52-caliber Pattern 1907\" Naval gun. This is the most powerful naval canon in operation in the Soviet navy. Bringing that weapon back up to operational capacity would surely deter any Soviet naval advances.
 FIN_modernize_submarine_force: "Модернизация подводных сил" # Modernize the Submarine Force
 FIN_modernize_submarine_force_desc: "В составе ВМС Финляндии имеется только один класс подводных лодок — «Ветехинен». Этот класс был спроектирован и построен в 1920-х годах и уступает по характеристикам более современным судам. Пришло время инвестировать в подводные лодки класса «Весикко», современный дизайн которых увеличивает прочность корпуса, но весит лишь вдвое меньше, чем класс «Ветехинен»." # The Finnish navy only operates a single class of submarines, The \"Vetehinen\". This class was designed and built in the 1920's and is falling behind in performance compared to more modern vessels. It is time to invest in the \"Vesikko\" class of Submarines, who's modern design increases hull strength while only weighing half as much as the \"Vetehinen\" class.
 FIN_prioritize_convoy_raiding: "Отдавайте приоритет рейдам на конвои" # Prioritize Convoy Raiding
 FIN_prioritize_convoy_raiding_desc: "Ленинград сохраняет статус одного из важнейших экономических центров Советского Союза. Большая часть международной торговли, предназначенной для северной России, проходит через порты Ленинграда. Если мы хотим остановить действия Советов в случае войны, мы должны остановить любой советский конвойный корабль, проходящий через Финский залив. Мы обескровим Советы и на суше, и на море!" # Leningrad maintains the status of one of the Soviet Union's most important economic centers. Most international trade destined for northern Russia passes through Leningrad's ports. If we are to stall the Soviet's in the event of war, we must distrupt any Soviet convoy ship that passees through the Gulf of Finland. We will bleed the Soviets dry on both land and sea!
 FIN_panssarilaiva: "Бронированный корабль" # Panssarilaiva
 FIN_panssarilaiva_desc: "«Панссарилайва» или «броненосные корабли» составляют основу финских военно-морских сил. Их гибкая конструкция позволяет им преуспеть во многих задачах: от рейдов на конвои до противовоздушной обороны. Броненосец класса Вяйнямойнен «Ильмаринен» даже удостоился чести быть флагманом ВМС Финляндии. Этот класс должен быть расширен и модернизирован, чтобы противостоять собственным военно-морским разработкам СССР." # \"Panssarilaiva\" or \"Armored Ships\" make up the core of Finnish naval force. Their flexible design allows them to excel in many roles ranging from convoy raiding to anti air defense. The Vainamoinen class armored ship \"Ilmarinen\" even has the honor of being the Finnish Navy's Flagship. It's class should be expanded and modernized to counter the Soviet's own naval developments.
 FIN_protect_merchant_navy: "Защитите торговый флот" # Protect the Merchant Navy
 FIN_protect_merchant_navy_desc: "Финляндия находится в хорошей позиции, чтобы доминировать в судоходстве на Балтике, если Советский Союз нападет. Хотя наш военно-морской флот может остановить крупные перемещения советского Балтийского флота, советские военно-воздушные силы и подводные лодки все еще могут преследовать наш торговый флот. Мы должны сосредоточить наши военно-морские усилия на защите наших собственных кораблей от любых советских атак, одновременно лишая коммунистов свободы передвижения в Финском заливе." # Finland stands in a good position to dominate shipping in the Baltic if the Soviet Union were to attack. While our navy can halt major movements from the Soviet's Baltic Fleet, The Soviet air force and submarines may still be able to harass our Merchant Navy. We must focus our naval efforts in protecting our own shipping from any Soviet attacks while denying the communists any freedom of movement in the Gulf of Finland.
 FIN_modern_minelayer_ships: "Современные минные пласты" # Modern Mine layers
 FIN_modern_minelayer_ships_desc: "В составе ВМС Финляндии имеется только один специализированный минный заградитель — корабль царской эпохи «Лоухи». В отчете ВМС Финляндии отмечалось, что этот корабль «не особенно хорош в постановке мин из-за своей низкой скорости, плохих мореходных качеств и недостаточного места для хранения». Очевидно, что если мы хотим сохранить военно-морское превосходство над Советским Союзом, нам необходимо ввести в строй современные минные заградители. Минные заградители класса «Пуккио» были спроектированы как современное судно для замены нынешнего арсенала минных заградителей. Нам просто нужно инвестировать средства, необходимые для его строительства." # The Finnish Navy only employs a single dedicated minelayer, the Tsarist era vessel \"Louhi\". A report by the Finnish navy noted that this ship was \"not particularly good at minelaying due to its slow speed, bad seakeeping qualities and inadequate storage space.\". Clearly if we are to maintain naval superiority over the Soviet's we will need to commission modern minelaying vessels. The \"Pukkio\" class of minelayers has been designed as a modern vessel to replace our current mine laying arsenal. We just need to invest the funding needed to build it.

 FIN_civil_guards_prominence: "Известность гражданской гвардии" # Civil Guards Prominence
 FIN_civil_guards_prominence_desc: "Хотя предпринимались попытки отодвинуть Гражданскую гвардию на второй план с целью централизации вооруженных сил, очевидно, что это неправильное направление для национальной безопасности нашей страны. Огромная география и небольшая численность населения Финляндии требуют от нашей страны быстрого реагирования на любую угрозу с помощью местных сил. Несмотря на то, что Гражданская гвардия была решающим краеугольным камнем в разгроме красных сил во время Гражданской войны, в последние годы она была понижена в звании до резервистских сил, а централизованные Силы обороны Финляндии взяли на себя большую часть прежних обязанностей Гражданской гвардии. Советский Союз мог в любой момент атаковать превосходящими силами. Мы должны усилить местную гражданскую гвардию-милатис, чтобы она стала нашей линией обороны на передовой, если Советы решат вторгнуться." # While there have been efforts to sideline the Civil Guard in order to centralize the armed force it's clear that this has been the wrong direction for our country's national security. Finland's immense geography and small population requires our nation to respond to any threat quickly with local forces. Despite being a critical cornerstone in the defeat of the red force during the Civil War, the Civil Guard has been demoted to a reservist force in recent years with the centralized Finnish Defence Force taking over most of the Civil Guard's former responsibilities. The Soviet Union could attack with overwhelming force at any time. We must reinforce local Civil Guard milatis to become our front line defense if the Soviets choose to invade.
 FIN_reform_jager_training: "Обучение охотников за реформами" # Reform Jäger Training
 FIN_reform_jager_training_desc: "Егеры возникли как группа финских националистов, которые вызвались добровольцами и обучались офицерам бывшей Германской империи, чтобы стать элитной легкой пехотой. Во время Гражданской войны в Финляндии эти войска поддерживали критический моральный дух и обучали своих белых союзников. Их новаторское использование тактической мобильности, которую они привезли из Германии, легло в основу финской военной теории, но эпоха Гражданской войны сильно отличалась от нынешней. Мы должны модернизировать использование легкой и мобильной пехоты для современной эпохи войны." # Jägers originated as a group of Finnish nationalists who volunteered and trained to become elite light infantry by officers from the former German Empire. During the Finnish Civil war these troops provided critical morale and training to their White allies. Thier innovative use of tactical mobility they had brought back from Germany provided the basis of Finnish military theory but the era of the Civil War is very different than now. We must modernize our use light and mobile infantry for the modern era of war
 FIN_separate_army_and_politics: "Отдельная армия и политика" # Separate Army and Politics
 FIN_separate_army_and_politics_desc: "Военным институтам нет места в правительстве, контролируемом гражданами. Разрешение офицерам занимать государственные должности — это опасный путь к автократии, поэтому мы должны создать законы, чтобы предотвратить это." # Military institutions have no place in a civilian-controlled government. Allowing officers to hold public positions is a dangerous path to autocracy, so we should create laws to prevent it.
 FIN_karjala_line: "Карельская линия" # The Karelia Line
 FIN_karjala_line_desc: "По мере роста напряженности в отношениях с Советским Союзом становится ясно, что наша южная граница находится под угрозой вторжения. Карелия огромна и покрыта густыми лесами. Если мы воспользуемся преимуществами сурового местного географического положения, мы сможем построить мощную оборонительную линию, которую Советы не смогут преодолеть." # As tensions grow with the Soviet Union it's clear that our southern border is at risk of invasion. The Karelia region is massive and heavily forested. If we take advantage of the harsh local geography, we can build a formidable defensive line that the Soviets would be hopeless to overcome.
 FIN_study_old_tactics: "Изучите старую тактику" # Study Old Tactics
 FIN_study_old_tactics_desc: "Мы не должны полностью игнорировать уроки наших предков: некоторые из величайших военных умов, когда-либо живших на свете, родились тысячи лет назад." # We should not completely disregard the lessons of our ancestors, some of the greatest military minds to ever live were born thousands of years ago.
 FIN_red_guard_takes_lead: "Красная гвардия берет на себя инициативу" # Red Guard Takes The Lead
 FIN_red_guard_takes_lead_desc: "Красная гвардия получила решающее преимущество, мы должны воспользоваться этой возможностью, прежде чем она уйдет от нас." # The Red Guard have gained a decisive advantage, we should seize this opportunity before it passes us.
 FIN_meanmaa_line: "Линия Меэнмаа" # The Meänmaa Line
 FIN_meanmaa_line_desc: "Хотя отношения со Швецией со времени нашей независимости в основном были дружественными, радикально меняющаяся атмосфера в Европе быстро меняет некогда давний баланс сил на континенте. Мы должны быть готовы к угрозам со стороны любой страны. Если бы шведские войска вторглись, это быстро превратило бы весь регион Меанмаа в ледяной ад. Мы должны укрепить реку Торне, чтобы лишить шведов возможности закрепиться на «Нашей земле»." # While relations with Sweden have mostly been friendly since our Independence, the radically evolving atmosphere in Europe is quickly changing the once long standing balance of power on the Continent. We must be prepared for threats from any nation. If Swedish troops were to invade, it would quickly turn the entire Meänmaa region into a frozen hellscape. We must reinforce the Torne River to deny the Swedes any foothold on \"Our Land\".
 FIN_modernize_equipments: "Модернизация оборудования" # Modernize Equipment
 FIN_modernize_equipments_desc: "Устаревшее вооружение поставит нас в явно невыгодное положение по сравнению с нашими лучше оснащенными противниками, поэтому нам следует удвоить наши усилия по модернизации армии." # Outdated weaponry will put us at a distinct disadvantage against our better-equipped foes, we should redouble our efforts to modernize the army.
 FIN_modern_ski_infantry: "Современная лыжная пехота" # Modern Ski Infantry
 FIN_modern_ski_infantry_desc: "Финляндия — страна снега, и ту естественную защиту, которую она нам обеспечивает, невозможно переоценить. Тем не менее, нам необходимо иметь возможность эффективно преодолевать эти условия, если мы хотим в полной мере использовать преимущества естественной местности." # Finland is a land of snow, and the natural defense that this provides us cannot be overstated. Still, we need to be able to traverse these conditions effectively if we are to take full advantage of the natural terrain.
 FIN_artillary_efforts: "Артиллерийские усилия" # Artillery Efforts
 FIN_artillary_efforts_desc: "Большие орудия доказали свою ценность во время Великой войны, и каждая боеспособная армия теперь имеет сотни или даже тысячи артиллерийских орудий. Было бы разумно принять эту растущую тенденцию." # Large guns proved their worth during the Great War, and every capable army is now host to hundreds or even thousands of artillery pieces. We would be wise to adopt this growing trend.
 FIN_motorization_efforts: "Усилия по автомобилизации" # Motorization Efforts
 FIN_motorization_efforts_desc: "Моторизованная пехота может передвигаться по суше с невероятной скоростью, обеспечивая надежное содержание, и многие военные историки даже провозгласили ее пехотой будущего." # Motorized infantry can traverse land at incredible speeds for rock-bottom upkeep, and they have even been declared the infantry of the future by many military historians.
 FIN_lotta_svard: "Лотта Меч" # Lotta Svärd
 FIN_lotta_svard_desc: "«Лотта Свард», возникшая во время гражданской войны в Финляндии, представляет собой добровольную вспомогательную военизированную организацию для женщин. В то время как мужчин призывали для борьбы с Красными силами и их коммунистическими союзниками, члены «Лотта Свард» работали в полевых госпиталях и даже на позициях предупреждения о воздушных налетах. Поскольку угроза войны снова возрастает и на службу призывают все больше людей, мы должны призвать «Лотту Свард» на помощь нашей армии в защите нашей страны." # Originating during the Finnish Civil War, the \"Lotta Svärd\" is a voluntary auxiliary paramilitary organisation for women. While men were being conscripted away to fight the Red Forces and their communist allies, members of the \"Lotta Svärd\" would operate field hospitals and even air raid warning positions. As the threat of war rises once again and more men are being called into service, we must call upon the \"Lotta Svärd\" to assist our army in the defense of our country.
 FIN_sisu: "Содержание" # Sisu
 FIN_sisu_desc: "Сису – уникальная финская черта – идея о том, что в трудные времена нужно обладать смелостью, выносливостью, настойчивостью и решительностью. Мы должны подчеркнуть необходимость внедрения сису в финские войска, придавая им истинное значение, необходимое для надлежащей защиты нации." # A uniquely Finnish trait, sisu is the idea that, during tough times, one must possess courage, stamina, perseverance, and determination. We must emphasise the point of ingraining sisu into the Finnish troops, providing them with the true meaning needed to properly defend the nation.
 FIN_encourage_new_thinking: "Поощряйте свободомыслие" # Encourage Freethinking
 FIN_encourage_new_thinking_desc: "Нам необходимо быть источником инноваций и изобретений, если мы хотим оставаться на волне современной науки и техники, поэтому мы должны продвигать свободомыслие через наши образовательные учреждения." # We need to be a source of innovation and invention if we are to remain on the curve of modern science and technology, as such we should promote freethinking through our educational institutions.
 FIN_red_army_training: "Обучение Красной Армии" # Red Army Training
 FIN_red_army_training_desc: "За последние десятилетия Красная Армия пережила много боевых действий и в результате стала высокоэффективной военной силой. Мы могли бы многому научиться, сотрудничая с ними." # The Red Army has seen much fighting in recent decades, and they have become a highly effective military force as a result. There is much we could learn from cooperating with them.

 FIN_finnish_air_force: "Финские ВВС" # Finnish Air Force
 FIN_finnish_air_force_desc: "Контроль над небом жизненно важен в современной войне, и для достижения этой цели нам понадобятся современные ВВС Финляндии." # Control of the skies is vital in modern warfare, and in order to achieve that goal we will need a modern Air Force for Finland.
 FIN_aircraft_purchases: "Покупки самолетов" # Aircraft Purchases
 FIN_aircraft_purchases_desc: "Тысячи самолетов по всей Европе находятся на хранении в ожидании нового конфликта. Нам следует воспользоваться возможностью приобрести некоторые из этих самолетов для пополнения наших собственных сил." # Thousands of aircraft across Europe sit in storage awaiting another conflict. We should take the opportunity to purchase some of these aircraft to supplement our own forces.
 FIN_reach_out_foreign_suppliers: "Обратитесь к иностранным поставщикам" # Reach Out to Foreign Suppliers
 FIN_reach_out_foreign_suppliers_desc: "Есть много сторон, заинтересованных в производстве для нас дорогих деталей, поэтому нам следует обратиться к ним и начать переговоры." # There are many parties interested in producing expensive parts for us, so we should reach out to them and begin negotiations.
 FIN_foreign_air_manifactures: "Иностранные производители самолетов" # Foreign Air Manufactures
 FIN_foreign_air_manifactures_desc: "Зачем строить собственные самолеты, если мы можем заставить других сделать это за нас? Поскольку экономика находится в той форме, в которой она находится, у нас наконец-то есть такая возможность, так что давайте ею воспользуемся." # Why build our own airplanes when we can get others to do it for us? With the economy in the shape it’s in, we finally have that option, so let’s seize it.
 FIN_upgrade_air_bases: "Модернизируйте авиабазы" # Upgrade the Air Bases
 FIN_upgrade_air_bases_desc: "Старые взлетно-посадочные полосы из грязи и снега больше не подходят для современных самолетов, нам придется инвестировать в создание взлетно-посадочных полос с асфальтом, чтобы предотвратить ненужный ущерб нашим самолетам." # The old dirt and snow airstrips are no longer suitable for modern aircraft, we will need to invest in creating asphalt runways in order to prevent unnecessary damage to our aircraft.
 FIN_develop_finnish_fighters: "Развивайте финских истребителей" # Develop Finnish Fighters
 FIN_develop_finnish_fighters_desc: "Уникальное географическое положение Финляндии создало ряд проблем, к которым современные самолеты из других частей Европы просто не приспособлены. В качестве лекарства нам необходимо создать внутренний производственный сектор." # Finland’s unique geography has created a set of problems that modern aircraft from other parts of Europe simply aren’t adapted to. As a remedy, we need to create a domestic manufacturing sector.
 FIN_domestic_aircraft_industry: "Отечественная авиационная промышленность" # Domestic Aircraft Industry
 FIN_domestic_aircraft_industry_desc: "Производство и проектирование самолетов внутри страны дадут нам значительные преимущества перед нашими врагами в случае их вторжения." # Manufacturing as well as designing aircraft at home will give us significant advantages over our foes should they invade.
 FIN_study_civil_war_boat_planes: "Изучите лодочные самолеты времен Гражданской войны." # Study Civil War Boat Planes
 FIN_study_civil_war_boat_planes_desc: "Лодочные самолеты гораздо более универсальны и мобильны, чем приземляющиеся, поэтому нам следует изучить, как их улучшить, чтобы мы могли воспользоваться ими." # Boat planes are much more versatile and mobile than those bound to land, we should investigate how to improve upon them so we may take advantage of them.
 FIN_study_civil_war_bombers: "Изучите бомбардировщики времен Гражданской войны." # Study Civil War Bombers
 FIN_study_civil_war_bombers_desc: ""
