 FIN_aftermath_mantsala_uprising: "Последствия восстания в Мянтсяля" # Aftermath of the Mäntsälä Uprising
 FIN_aftermath_mantsala_uprising_desc: "Восстание в Мянтсяля привело к приходу в Финляндию нового руководства. Поскольку демократия находится на паузе, новое руководство будет иметь возможность возродить Финляндию из тяжелого положения и исцелить эту нацию от раскола." # The Mäntsälä Uprising has seen new leadership come to Finland. With democracy at pause, this new leadership will have the power to revive Finland from its harsh situation and heal this nation from division.
 FIN_aftermath_mantsala_uprising2: "Последствия восстания в Мянтсяля" # Aftermath of the Mäntsälä Uprising
 FIN_aftermath_mantsala_uprising2_desc: "Восстание в Мянтсяля привело к приходу в Финляндию нового руководства. Поскольку демократия стоит на паузе, новая и революционная Финляндия увидит, что страна избавлена ​​от капитализма и политических распрей." # The Mäntsälä Uprising has seen new leadership come to Finland. With democracy at pause, a new and revolutionary Finland will see the country relieved from capitalism and political strife.

 FIN_mannerheim_in_power: "Маннергейм у власти" # Mannerheim in Power
 FIN_mannerheim_in_power_desc: "Маннергейм и Белая гвардия взяли под свой контроль Финляндию, пообещав временно взять под свой контроль страну до тех пор, пока не будет восстановлена ​​стабильность." # Mannerheim and the White Guard have taken control of Finland, promising to temporarily take control of the nation until stability can be restored.
