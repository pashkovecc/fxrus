 FIN_winter_war_idea_desc: "В ходе борьбы финнов с русским медведем они поняли, что должны использовать погоду и местность в своих интересах в смертельных битвах на истощение." # With the Finnish struggle against the Russian Bear, they have figured that they must use their weather and terrain to their advantage in deadly battles of attrition.

