 FIN_finnish_revolution: "Финская революция" # Finnish Revolution
 FIN_finnish_revolution_desc: "Финским красным силам наконец удалось захватить капиталистическую Белую республику в Финляндии. Наконец, мы можем возродить мечту неудавшихся красных финских сил, которые боролись за эту революцию почти 20 лет назад. Эта революция станет спасительной милостью от жестокого капиталистического порядка и политических распрей, установившихся в Финляндии." # The Finnish red forces has finally managed to overtake the capitalist White republic in Finland. Finally, we can revive the dream of the failed Red Finnish forces who fought for this revolution almost 20 years ago. This revolution will be a saving grace from the cruel capitalist order and the political strifes that has established itself in Finland.
