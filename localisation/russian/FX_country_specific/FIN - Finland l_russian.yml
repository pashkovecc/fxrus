### Bio ###
 POLITICS_PER_EVIND_SVINHUFVUD_DESC: "Пер Эвинд Свинхувуд — третий и нынешний президент Финляндии. Родившийся в 1861 году, Свинхувуд имеет долгую историю в политике страны, выступая со времен российского правления страной, ее независимости, гражданской войны и послевоенного восстановления. Свинхувуд имеет опыт работы как в финской, так и в младофинской партиях, будучи ведущим членом консервативной фракции «ласточек» последней. Во время обретения независимости Свинхувуд играл важную роль и занимал пост председателя Сената, государственного регента и первого премьер-министра республики.\n\nС тех пор Свинхувуд был крупным лидером Национальной коалиционной партии и сильным консервативным голосом, выступающим против социализма и левых. Одно можно сказать наверняка; ни один социал-демократ или коммунист не станет членом правительства при Пере Эвинде Свинхуввуде президентом.\n\n§BСоциальный консерватор§!" # Pehr Evind Svinhufvud is the third and current President of Finland. Born in 1861, Svinhufvud have a long history in the politics of the country, serving since the years of Russian rule over the country, through its independence, civil war and post-war rebuilding. Svinhufvud has a background in both the Finnish and the Young Finnish parties, being a leading member of the conservative "swallows" faction of the latter. During independence, Svinhufvud played a major role and served as Chairman of the Senate, State Regent and the First Prime Minister of the Republic during this time.\n\nSince then, Svinhufvud has been a major leader in the National Coalition Party and a strong conservative voice against socialism and the Left. One thing is certain; no Social Democrat or Communist will become a government member with Pehr Evind Svinhufvud as President.\n\n§BSocial Conservative§!
 POLITICS_RISTO_HEIKKI_RYTI_DESC: "Ристо Хейкки Рюти — пятый и нынешний президент Финляндии, ставший главным кандидатом после отставки Кёсти Каллио. Рюти родился в 1889 году и начал свою карьеру как политик в области экономики и как фигура заднего плана в послевоенный период. Он молодой политик, мало принимавший активного участия в независимости Финляндии и гражданской войне. После гражданской войны Рюти был членом парламента и министром финансов, прежде чем стать президентом республики.\n\nХотя он относительно молод в финской политике, есть надежда, что Рюти сможет использовать свой опыт в области финансов, экономики и внешней деятельности, чтобы стать компетентным президентом Финляндии. Национальный прогрессист, Рюти является экономическим либералом и выступает против как советского социализма, так и валкистов, восхищаясь британской культурой и американским свободным предпринимательством.\n\n§YLiberal§!" # Risto Heikki Ryti is the fifth and current President of Finland, becoming the prime candidate following the resignation of Kyösti Kallio. Born in 1889, Ryti started his career as a politician in economics and as a background figure in the post-war period. He is a young politician, with little active part in the independence of Finland and the civil war. After the civil war, Ryti served as a member of parliament and finance minister, before becoming President of the Republic.\n\nWhile relatively young in Finnish politics, there are hopes that Ryti will be able to use his experience in finance, economics and the foreign field in being a competent President of Finland. A National Progressive, Ryti is an economic liberal, and is opposed to both Soviet socialism and the Valkists, admiring British culture and American free enterprise.\n\n§YLiberal§!
 POLITICS_KYOSTI_KALLIO_DESC: "Кёсти Каллио — четвертый и нынешний президент Финляндии. Каллио родился в 1873 году и, как и бывший президент Свинхувуд, является опытным политиком до и во время независимости Финляндии. Видный лидер Аграрной лиги и защитник республики, Каллио был среди тех, кто выступал против попытки установления монархии в Финляндии. В 1920-е годы он также занимал пост премьер-министра республики и является инициатором «Лекса Каллио», легализации, которая позволила государству покупать землю для поощрения новых поселений.\n\nХотя Каллио политически умеренный и выступает против монархии и злоупотреблений президентской властью, он также является антикоммунистом и сторонником запрета с глубокой христианской верой. Будучи аграрием, я должен посмотреть, принесет ли его президентство лучшее будущее финским фермерам.\n\n§OAgrarian§!" # Kyösti Kallio is the fourth and current President of Finland. Born in 1873, Kallio is, similar to former President Svinhufvud, a veteran politician from before and during the independence of Finland. A prominent leader of the Agrarian League and a defender of the Republic, Kallio was among those opposed to the attempted establishment of a monarchy in Finland. During the 1920s, he has also served as Prime Minister of the Republic and is the brain behind "Lex Kallio", legalisation that allowed the state to buy land to encourage new settlements.\n\nWhile politically moderate and opposed to monarchy and abuse of Presidential power, Kallio is also an anti-communist and prohobitionist with a deep Christian faith. As an Agrarian, it is to see if his presidency will bring a better future for the Finnish farmer.\n\n§OAgrarian§!
 POLITICS_VAINO_TANNER_DESC: "Вяйно Таннер — четвертый и нынешний президент Финляндии. Еще более удивительно то, что он является первым президентом-социалистом в истории республики. Таннер родился в 1881 году и является пионером кооперативного движения в Финляндии, а также ведущим социал-демократом. Во время гражданской войны Таннер оставался нейтральным. После гражданской войны Таннер начал вести социал-демократов к умеренности и парламентаризму. Похоже, что с его избранием на пост президента ему удалось реабилитировать свою партию в финской политике и обществе.\n\nДаже при такой умеренности Таннер столкнулся с жесткой оппозицией со стороны бывшего президента Свинхувуда и других антикоммунистов. С избранием его на пост президента ему придется доказать, что он верен Финляндии, а не социалистической революции.\n\n§RСоциал-демократ§!" # Väinö Tanner is the fourth and current President of Finland. More surprisingly, is that he is the first socialist President in the history of the Republic. Born in 1881, Tanner is a pioneer in the cooperative movement in Finland, as well as a leading Social Democrat. During the civil war, Tanner remained neutral. After the civil war, Tanner began to lead the Social Democrats towards moderation and parliamentarianism. With his election to the Presidency, it looks like he has managed to rehabilitate his party in Finnish politics and society.\n\nEven with this moderation, Tanner has faced stiff opposition from former President Svinhufvud and other anti-communists. With the election of him into the office of Presidency, he will have to prove that he is loyal to Finland and not to the socialist revolution.\n\n§RSocial Democrat§!
 POLITICS_CARL_GUSTAV_MANNERHEIM_DESC: "Карл Густав Маннергейм – единственный и неповторимый маршал Финляндии. Родившийся в 1867 году Маннергейм стал свидетелем перехода Финляндии от российского владычества к сегодняшней республике. Начав свою военную карьеру в Российской императорской армии в 1887 году, Маннергейм прошел через многое, в том числе через сражения на Восточном фронте Великой войны. После обретения Финляндией независимости в 1917 году Маннергейм стал ведущим офицером молодых вооруженных сил страны, приведя белых к победе в гражданской войне. Находясь в должности государственного регента Финляндии и добиваясь признания независимости Финляндии от Великобритании и США, он отошел от политической жизни и не занимал никаких государственных должностей.\n\nУвидев новые угрозы у дверей Финляндии, Маннергейм решил вернуться, чтобы руководить страной старательно и без корыстных мотивов. Он утверждает, что это делается для того, чтобы служить отечеству и защищать его, отвергая партийную политику Республики. Вот некоторые из качеств, которые делают его величайшим государственным деятелем Финляндии.\n\n§gMannerheimerite§!" # Carl Gustaf Mannerheim is the one and only Marshal of Finland. Born in 1867, Mannerheim has seen Finland go from Russian dominion to the Republic of today. Starting his military carrier in the Imperial Russian Army in 1887, Mannerheim have been through much, including fighting on the Eastern Front of the Great War. After Finland becoming independent in 1917, Mannerheim became a leading officer in the country's young armed forces, leading the Whites to victory in the civil war. While serving as State Regent of Finland and securing the recognition of Finnish independence from Britain and the United States, he retreated from political life and held no public office.\n\nWith new threats at the door of Finland, Mannerheim has decided to return to lead the country diligently and without selfish motives. He claim this is to serve and secure the fatherland, rejecting the partisan politrcs of the Republic. This is some of the things that makes him Finland's greatest statesman.\n\n§gMannerheimerite§!
 POLITICS_VIHTORI_KOSOLA_DESC: "Вихтори Косола — лидер правого движения «Лапуа» и глава финского государства. Его семья родилась в 1884 году и быстро переехала в Лапуа после того, как сгорел семейный фермерский дом. Повзрослев, Косола провел годы в сельском хозяйстве и скотоводстве. В первые годы Великой войны Косола стал вербовщиком Егерского движения, финских добровольцев в Германии. Это привело к его аресту, но после русской революции он был освобожден. Косола во время гражданской войны активно участвовал в Белой гвардии и присоединился к Аграрной лиге.\n\nВ 1920-е годы Косола стал участником штрейкбрехерской организации и был среди спикеров первых собраний движения Лапуа. Теперь движение Лапуа наконец использовало свою мощь, чтобы захватить власть в Финляндии, поставив Вихтори Косолу во главе нации.\n\n§WNationalist§!" # Vihtori Kosola is the leader of the right-wing Lapua Movement and the head of the Finnish state. Born in 1884, his family quickly moved to Lapua after the family farmhouse had burned down. Growing up, Kosola spend his years in farming and cattle-breeding. In the early years of the Great War, Kosola became a recruiter for the Jäger Movement, Finnish volunteers to Germany. This led to his arrest, but following the Russian Revolution, he found himself released. Kosola was during the civil war active in the White Guard and joined the Agrarian League.\n\nDuring the 1920s, Kosola became involved in a strikebreakers' organization, and was among the speakers of the first Lapua Movement meetings. Now, the Lapua Movement have finally used its might to seize power in Finland, placing Vihtori Kosola at the head of the nation.\n\n§WNationalist§!
 POLITICS_VILHO_ANNALA_DESC: "Вилхо Аннала — лидер правого движения Лапуа и глава финского государства. Аннала родился в 1888 году в Лапуа и приобрел известность, будучи студентом Хельсинкского университета, где в последние годы Великой войны он редактировал студенческую газету Ylioppilaslehti. Он также стал экономистом и пошел работать государственным служащим, став одним из ведущих государственных служащих Финляндии.\n\nВ 1931 году Аннала присоединилась к движению Лапуа. Он был одним из наиболее радикальных членов, выступал за корпоративизм, делал движение более дружественным по отношению к рабочему классу и выступал против влияния промышленников. Приняв участие в восстании Мянсала, Аннала еще больше увеличил свою власть. Наконец, теперь он также может направить движение в сторону более радикальной идеологии, вдохновленной валькистами.\n\n§WNationalist§!" # Vilho Annala is the leader of the right-wing Lapua Movement and the head of the Finnish state. Born in 1888, Annala was born in Lapua and came to prominence as a student at the University of Helsinki, where he edited the student newspaper Ylioppilaslehti during the closing years of the Great War. He also became an economist and went to work as a civil servant, becoming one of Finland's leading civil servants.\n\nIn 1931, Annala joined the Lapua Movement. He was one of the more radical members, favoring corporatism, making the movement more friendly to the working class and opposed the influence of industrialists. With a playing role in the Mäntsälä uprising, Annala have further increased his power. Finally, he is now also able to steer the movement towards a more radical and valkist-inspired ideology.\n\n§WNationalist§!
 POLITICS_KULLERVO_MANNER_DESC: "Куллерво Маннер — лидер Коммунистической партии и председатель Финляндии. Маннер родился в 1880 году в семье многих священнослужителей: его отец был священником, а дед по материнской линии - пастором. После окончания средней школы Маннер начал работать журналистом и основал газету «Тюёляйнен». До обретения Финляндией независимости Маннер также был членом парламента от социал-демократов. Во время гражданской войны в Финляндии Маннер был назначен председателем Финской народной делегации и командовал Красной гвардией. После гражданской войны Маннеру пришлось бежать в Советскую Россию.\n\nВ России Маннер вместе со своими товарищами основал Коммунистическую партию Финляндии, готовую однажды вернуться. Когда революция, наконец, произошла, Куллерво Маннер вернулся из ссылки, чтобы возглавить Финляндию на пути к социализму.\n\n§RSocialist§!" # Kullervo Manner is the leader of the Communist Party and the Chairman of Finland. Born in 1880, Manner came from a family with many clerics, with his father being a priest and his maternal grandfather a pastor. After Manner graduated from high school, he began working as a journalist and founded a newspaper called Työläinen. Before Finnish independence, Manner also served as a member of parliament to the Social Democrats. During the Finnish civil war, Manner was appointed Chairman of the Finnish People's Delegration and commanded the Red Guards. After the civil war, Manner had to flee to Soviet Russia.\n\nIn Russia, Manner, along with his comrades founded the Finnish Communist Party, ready to return one day. With the revolution finally taking place, Kullervo Manner has returned from his excile to lead Finland on the road to socialism.\n\n§RSocialist§!
 POLITICS_OTTO_WILLE_KUUSINEN_DESC: "Отто Вилле Куусинен — председатель Финляндии. Куусинен родился в 1881 году и в ранние годы учился в Хельсинкском университете. Здесь он стал активным членом студенческого союза и проявил интерес к фенноманскому консерватизму и алкиоизму. После этого Куусинен стал более радикальным, присоединился к социал-демократам и стал лидером социалистической революции в Финляндии. После гражданской войны в Финляндии Куусинен был вынужден бежать в Советскую Россию, где он принял участие в создании Коммунистической партии Финляндии и стал соратником Вячеслава Молотова.\n\nПосле 15 лет изгнания ситуация в Финляндии наконец повернулась в пользу революции. Благодаря новой социалистической революции в Финляндии Куусинен успешно сумел использовать Красную гвардию, чтобы взять на себя руководство в этой новой Финляндии.\n\n§RSocialist§!" # Otto Wille Kuusinen is the Chairman of Finland. Born in 1881, Kuusinen did attend the University of Helsinki in his early years. Here, he became an active member of the students' union, and had an interest for Fennoman conservatism and Alkioism. Afterward, Kuusinen became more radical, joined the Social Democrats, and was a leader in the socialist revolution in Finland. After the Finnish civil war, Kuusinen had to flee to Soviet Russia, where he became involved in the establishment of the Finnish Communist Party and became an assosiate of Vyacheslav Molotov.\n\nAfter 15 years of excile, the situation in Finland has now finally turned in favour of revolution. With a new socialist revolution in Finland, Kuusinen have successfully managed to use the Red Guards to take leadership in this new Finland.\n\n§RSocialist§!
 POLITICS_OSKARI_TOKOI_DESC: "Оскари Токой является председателем Финляндии. Токой родился в 1873 году в фермерской семье, его отец также занимался торговлей лошадьми. В детстве семья Токоя столкнулась с тяжелой экономической ситуацией, а Оскари всего несколько лет учился в гимназии. В 17 лет Токой покинул семейную ферму и эмигрировал в Америку. В Америке Токой работал на угольных и твердометаллических шахтах, но потеря работы вынудила его отправиться на работу, прежде чем вернуться в Финляндию. В Финляндии Токой был избран членом парламента от социал-демократов и встал на сторону красных во время гражданской войны в Финляндии.\n\nПосле гражданской войны Токой снова эмигрировал и снова оказался в Америке. После революции Токой вернулся в Финляндию и сумел подняться на вершину новой политической системы Финляндии.\n\n§RSocialist§!" # Oskari Tokoi is the Chairman of Finland. Born in 1873, Tokoi was born into a farmer family, with his father also being a horse-trader. Growing up, Tokoi's family faced a grim economic situation, while Oskari was only enrolled a few years in a grammar school. At the age of 17, Tokoi quit the family farm to emigrate to America. In America, Tokoi worked in the coal and hard metal mines, but loss of employment would force him to travel for work before returning to Finland. In Finland Tokoi became elected a member of parliament for the Social Democrats and sided with the Reds during the Finnish Civil War.\n\nAfter the civil war, Tokoi emigrated once more, and once more ended up in America. With the revolution, Tokoi has returned to Finland, and managed to rise to the top of Finland's new political system.\n\n§RSocialist§!

