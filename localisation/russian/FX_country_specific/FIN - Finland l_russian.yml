 FIN_estonian_contacts: "Свяжитесь с эстонскими союзниками" # Contact Estonian Allies

 FIN_aland_game: "Аландская игра" # The Åland Game
 FIN_aland_game_desc: "Аландские острова снова оказались в центре внимания, поскольку в этом районе пройдет предстоящий референдум. В наших интересах обеспечить, чтобы референдум прошел в нашу пользу.\n\n§YФинляндия§! в настоящее время поддерживает [ROOT.GetFinlandSupport] ([?FIN_aland_game_var|Y0])\n\n§YШвеция§! в настоящее время поддерживает [ROOT.GetSwedenSupport] ([?SWE_aland_game_var|Y0])" # The islands of Åland has once again become a center of focus, with the incoming referendum set in the area. It will be in our interest to secure that the referendum goes in our favor.\n\n§YFinland§!'s support is currently [ROOT.GetFinlandSupport] ([?FIN_aland_game_var|Y0])\n\n§YSweden§!'s support is currently [ROOT.GetSwedenSupport] ([?SWE_aland_game_var|Y0])

