 FIN_finlands_bold_opportunity: "Смелая возможность Финляндии" # Finland's Bold Opportunity
 FIN_finlands_bold_opportunity_desc: "Видя, что медведь на нашем востоке занят немцами, мы используем свой шанс, прежде чем потеряем свой шанс навсегда. Благодаря экономическим, военным и государственным реформам мы можем стать силой, которую Красная угроза никогда не сможет подчинить. Волк, которого они никогда не смогут укротить. Чистящая сила, способная уничтожить великое пятно на земле — Советский Союз. Суоми восстанет!" # Seeing that the bear to our east is busy with the Germans, we use our opportunity before we lose our chance forever. With economy, military, and government reforms, we can become a power the Red Menace will never be able to subdue. A wolf they can never put down. The cleaning force to vanquish the great stain of the earth, the Soviet Union. Suomi shall rise!
 FIN_strengthening_the_mannerheim_line: "Укрепление линии Маннергейма" # Strengthening The Mannerheim Line
 FIN_strengthening_the_mannerheim_line_desc: "Поскольку Советский Союз находится прямо на нашей границе, а наш великий город Выборг находится в руках русских, мы должны защитить нашу сердцевину, где находится наше сельское хозяйство и промышленность. Благодаря расширенной программе укреплений на линии Маннергейма, линии фортов, названной в честь нашего великого Карла Густава Эмиля Маннергейма, мы не позволим силам Матери-России когда-либо добраться до Хельсинки." # With the Soviets right on our border, and our great city of Viipuri just out of the Russian hands, we must defend our heartland where our agriculture and industry lies. With an extended fortification program on the Mannerheim line, a fort line named after our great Carl Gustaf Emil Mannerheim, we will keep the forces of Mother Russia from ever making it to Helsinki.
 FIN_expanding_the_army: "Расширение армии" # Expanding the Army
 FIN_expanding_the_army_desc: "Видя мощь Красной Армии с ее бесчисленным количеством людей, мы должны провести реформы нашей собственной армии, чтобы помочь улучшить наши вооруженные силы и сломить моральный дух врага. Потому что вы не хотите сражаться с врагом, который намного сильнее и опытнее вас. Видя, что ваша борьба бесполезна и вскоре вы будете побеждены и убиты ими." # Seeing the might of the Red Army with its uncountable amount of men, we have to input our own army reforms to help improve our armed forces and break the enemy morale. For you dont want to fight an enemy that is much more powerful and experienced than you. Seeing that your fight is futile and you will soon be overpowered and massacred by them.
 FIN_WINTER_WAR_DIVISIONS_tt: "§7Получите §Y 5 [Root.GetAdjective] дивизий «Зимняя война»§! в следующем составе:\n - 9 £GFX_unit_infantry_icon_small батальонов с:\n - 1 £GFX_unit_engineer_icon_small Инженерная поддержка\n - 1 £GFX_unit_artillery_icon_small Поддержка Артиллерия;§!\n\n§YСоздать 5§! дивизий с новым приобретенным шаблоном по адресу: §Y[111.GetName]§!" # §7Receive §Y 5 [Root.GetAdjective] 'Winter War'§! divisions with the following composition:\n - 9 £GFX_unit_infantry_icon_small battalions with:\n - 1 £GFX_unit_engineer_icon_small Engineer Support\n - 1 £GFX_unit_artillery_icon_small Support Artillery;§!\n\n§YSpawn 5§! divisions with the newly acquired template at: §Y[111.GetName]§!
 FIN_preparing_the_airforce: "Подготовка ВВС" # Preparing the Airforce
 FIN_preparing_the_airforce_desc: "Поскольку Советский Союз твердо контролирует небо, мы должны заявить о себе, прежде чем они разнесут нас в пыль. Благодаря расширению производства авиации однажды мы увидим наши самолеты над Москвой, а не советские наркоманы над Хельсинки." # With the Soviet Union in firm control of the skies, we have to assert ourselves before they blow us to dust. With extended air production, we will one day see our planes over Moscow rather than Soviets air junkies over Helsinki.
 FIN_construction_of_military_factories: "Строительство военных заводов" # Construction of Military Factories
 FIN_construction_of_military_factories_desc: "Для производства техники для питания и вооружения наших бойцов в полевых условиях необходимо еще больше развивать финскую военную промышленность. Сдавая в аренду государственные средства военным производственным компаниям, мы можем дать нашим людям все, что им нужно для хорошей борьбы." # For production of equipment to feed and arm our men out in the fields, it is necessary to build the Finnish military industry up even more. By leasing out government funds to military production companies, we can give our men all they will need to fight well.
 FIN_preparing_the_economy: "Подготовка экономики" # Preparing the Economy
 FIN_preparing_the_economy_desc: "Наша экономика по сравнению с мощью, с которой мы боремся, не самая великая, и она нужна нам для нашей армии. Конечно, не так давно мы подошли к нашему серебряному десятилетию, но после краха лондонской фондовой биржи мы были сброшены вниз с экономической опоры, поскольку она рухнула под нами. Поэтому необходимо провести экономические реформы и сократить государственные расходы, чтобы вложить их в нашу военную машину, чтобы мы могли развивать экономику для войны." # Our economy compared to the power we are fighting is not the greatest, and we need it for our military. Sure we came our of our silver decade not long ago, but ever since the London Stock Market Crash, we have been thrown down the economic pillar as it collapsed under us. So it is needed for economic reforms and reduced government spending to put into our war machine so we can have an economy developed for war.
 FIN_winter_war: "Зимняя война" # Winter War
 FIN_winter_war_desc: "Используя зиму в своих интересах, мы можем превратить российскую угрозу в мясорубку. Под этим я подразумеваю войны на истощение. Если русские замерзнут насмерть или будут зарезаны нашими тренированными зимой лыжниками, мы сможем, наконец, положить конец настоящей русской армии в четвертом сезоне." # By using the winter to our advantage, we can liquidify the Russian menace into the meat grinder. By that I mean wars of attrition. If the Russians freeze to death or get cut down by our winter trained skiiers, we can finally put an end to a true Russian army during the fourth season.
 FIN_declare_our_claims: "Заявить наши претензии" # Declare our Claims
 FIN_declare_our_claims_desc: "Заявив о своих претензиях к русским, мы можем предупредить мир об амбициях Финляндии. Мир может говорить и ссориться о нас, но мы будем действовать. Финляндия наконец покажет зубы." # By declaring our claims to the Russians, we can alert the world of Finlands ambitions. The world can talk and squabble about us but we will power on. Finland will finally show its teeth.
 FIN_for_victory: "За Победу!" # For Victory!
 FIN_for_victory_desc: "Мы приняли все необходимые меры предосторожности, чтобы гарантировать, что война с Советским Союзом не станет полномасштабной катастрофой. С нашей винтовкой и лыжами мы можем навсегда разделить серп и молот. Маршируйте на Москву и разрушьте их ужасный режим. Оккупируйте Мурманск и далеко за его пределами. Финляндия всегда будет великой! Хаккаа пяэлле!" # We have done all needed precautions to assure that a war with the Soviet Union wouldn't be a full blown disaster. With our rifle and our skis, we can seperate the hammer and sickle forever. March on Moscow and tear their horrible regime apart. Occupy Murmansk and far beyond. Finland will forever be great! Hakkaa päälle!



### Events ###
 finland.0.t: "Государство Финляндия" # The State of Finland
 finland.0.d: "Финляндия получила независимость после революции 1917 года в России. Первые годы были немного непростыми, поскольку гражданская война в Финляндии между красными и белыми поразила нацию, посетив братьев в разногласиях друг с другом и оставив после себя наследие, с которым Финляндии еще предстоит иметь дело. В ходе гражданской войны Финляндия также потеряет Аландские острова в пользу Швеции, что частично осложнит отношения между двумя странами.\n\nХотя существовали планы создания Финляндского королевства с немецким королем, этот план провалился после поражения Германской империи в Великой войне. Монархистам консервативной Национальной коалиционной партии пришлось отказаться от идеи Финского королевства, и мечта вскоре умерла. Была создана Финляндская Республика, в которой доминировали либералы и консерваторы.\n\nПосле гражданской войны идея Великой Финляндии получила распространение в стране среди правых. Наряду с антисоветским характером этой мечты она стала основой для формирования движения Лапуа. В то же время социал-демократы становятся растущей силой в Финляндии, превращаясь в более социал-демократическую и патриотическую партию. Но в правых группах по-прежнему существуют тревожные чувства по поводу них, а президент отказывается разрешить формирование правительства с их участием.\n\nНесмотря на это, Финляндия в последнее время пережила процветающее время, обычно называемое Серебряным десятилетием, с сильным ростом в условиях стабильной правящей коалиции. Некоторые обеспокоены тем, что эта эпоха может скоро закончиться, и проблемы, беспокоящие финское общество, вновь возникнут. Другие более оптимистично смотрят на будущее Финляндии." # Finland gained its independence following the 1917 Revolutions in Russia. The first years were a little rocky, as the Finnish Civil War between the Reds and the Whites struck the nation, placing brothers at odds with each other and leaving a legacy Finland still have to deal with. Under the civil war, Finland would also see the loss of Åland to Sweden, something that would partially hamper the relationship between the two countries.\n\nWhile there was plans to establish a Kingdom of Finland, with a German king, this plan failed following the defeat of the German Empire in the Great War. Monarchists in the conservative National Coalition Party had to give up the idea of a Finnish Kingdom, and the dream shortly died. The Republic of Finland was established, dominated by the liberals and conservatives.\n\nSince the civil war, the idea of a Greater Finland gained traction in the country among right-wingers. Along with the anti-sovietist nature of this dream, it became the foundation for the formation of the Lapua Movement. At the same time, the Social Democrats have become a growing force in Finland, with their evolution to a more social-democratic and patriotic party. But there are still anxious feelings over them in right-wing groups, with the President refusing to allow the formation of a government with them in it.\n\nDespite this, Finland have seen a prosperous time lately, commonly called the Silver Decade, with strong growth under a stable governing coalition. Some worry that this era might soon see its end, with the issues plaguing Finnish society reappearing. Others are more optimistic about the future of Finland.
 finland.0.a: "Утро вечера мудренее!" # Aamu on iltaa viisaampi!

 finland.1.t: "Год выборов в Финляндии" # Election Year in Finland
 finland.1.d: "Парламентские выборы 1936 года уже не за горами, учитывая хорошую ситуацию в финской экономике и укрепление сельскохозяйственного сектора, похоже, что правящее коалиционное правительство, состоящее из Аграрной лиги, Национальной коалиции и Национальных прогрессивных партий, имеет возможность добиться успеха.\n\nХотя социал-демократы, скорее всего, не смогут сформировать правительство или участвовать в нем, они, скорее всего, сохранят свое большинство в парламенте. Президент твердо отверг их участие, а Аграрная лига приняла нынешнюю систему. С другой стороны, нет подозрений, что Движение Лапуа добьется успеха на этих выборах, даже если есть консерваторы, выступающие против нынешнего правительства.\n\nПолитики уже дают обещания и развешивают плакаты на улицах Финляндии, выражая здоровье финской демократии." # The 1936 Parliamentary Elections are soon around the corner, with the good situation of the Finnish economy and the strengthen agricultural sector, it looks like the governing coalition government, made up of the Agrarian League, National Coalition and National Progressive parties, have the posibility to make gains.\n\nWhile the Social Democrats are most likely unable to form a government or participate in one, they are likely to hold on to their plurality in the Parliament. The President have been firm in his rejection of their participation and the Agrarian League have been accepting in the current system. On the other end, it is not suspected that the Lapua Movement will make gains in this election, even if there are conservatives that oppose the current government.\n\nAlready are politicians making promises and hanging posters in the streets of Finland, expressing the health of the Finnish democracy.
 finland.1.a: "Какой замечательный год для финна!" # What a Great Year to be a Finn!

 finland.2.t: "Парламентские выборы 1936 года" # The 1936 Parliamentary Election
 finland.2.d: "Сейчас подсчитаны результаты парламентских выборов 1936 года. С ростом благосостояния и роста при нынешнем правительстве мнение Аграрной лиги и Национальной коалиционной партии возросло. Социал-демократы и движение Лапуа не смогли добиться каких-либо успехов, оставив парламент, большинство членов которого представляют одну из правящих партий." # The result of the 1936 Parliamentary Election are now been counted. With the increasing prosperity and growth under the current government, the opinion of the Agrarian League and the National Coalition Party have seen an increase. The Social Democrats and the Lapua Movement have not been able to make any gains, leaving a Parliament where the majority of the members are from one of the governing parties.
 finland.2.a: "Победа коалиционного правительства!" # A Victory for the Coalition Government!

 finland.3.t: "Крах лондонской фондовой биржи" # The London Stock Market Crash
 finland.3.d: "Экономический крах произошел в Лондоне, в Соединенном Королевстве. Поскольку один из наших основных экспортных и торговых партнеров истекает кровью, растут опасения, что этот кризис вскоре поразит Финляндию. Некоторые утверждают, что Серебряное десятилетие может закончиться раньше, но премьер-министр Юхо Сунила заявил, что в эти времена нам следует сохранять спокойствие." # An economic crash have occured in London, in the United Kingdom. With one of our major export and trading partners bleeding, it is a growing fear that this crisis will soon hit Finland. Some have claimed that the Silver Decade might meet an early end, but Prime Minister Juho Sunila has stated that we should stay calm in these times.
 finland.3.a: "Серебряное десятилетие портится" # The Silver Decade Sours

 finland.4.t: "Конец Серебряного десятилетия" # The End of the Silver Decade
 finland.4.d: "В результате краха лондонской фондовой биржи финская экономика пережила спад. Безработица растет, экспорт остановлен, а предприятия начали переживать банкротства. Надпись на стене. Серебряное десятилетие в Финляндии завершилось, и нас настало время кризиса. В политическом плане это почти раскололо правящее коалиционное правительство, но под руководством Юхо Сунила и Пера Эвинда Свинхувуда оно может пережить этот кризис." # With the London Stock Market Crash, the Finnish economy have experienced a fall. Unemployment is on the rise, exports have been halted and businesses have begun to experience bankruptcy. The writing is on the wall. The Silver Decade in Finland is now over, and a time of crisis is now upon us. Politically, this have nearly torn apart the ruling coalition government, but with the leadership of Juho Sunila and Pehr Evind Svinhufvud, it might survive this crisis.
 finland.4.a: "Давайте молиться за скорейшее выздоровление!" # Let's Pray For a Quick Recovery!

 finland.5.t: "Смерть премьер-министра" # The Death of the Prime Minister
 finland.5.d: "Премьер-министр Юхо Сунила был найден мертвым в своей резиденции в Хельсинки. Кажется, он умер по естественным причинам, но худшего времени для смерти не могло быть. После ухода Сунилы коалиционное правительство повисло на волоске. Аграрная лига во главе с Кёсти Каллио начала искать у социал-демократов новых партнеров в правительстве. Это начало злить президента Пера Эвинда Свинхувуда и его Национальную коалиционную партию. Тем временем новым премьер-министром станет Аймо Каяндер из Национальной прогрессивной партии." # Prime Minister Juho Sunila has been found dead in his residence in Helsinki. It seems to be from natural causes, that he died of, but it could not be any worse time to die on. With Sunila gone, the coalition government is hanging in a thin tread. The Agrarian League, with Kyösti Kallio at its head, have begun to see towards the Social Democrats for new government partners. This has begun to anger President Pehr Evind Svinhufvud and his National Coalition Party. In the meantime, Aimo Cajander from the National Progressive Party, will become the new Prime Minister.
 finland.5.a: "Какое время умирать!" # What a Time to Die On!

 finland.6.t: "Аграрная лига покидает правительство" # The Agrarian League Leaves the Government
 finland.6.d: "В правящем коалиционном правительстве возникли разногласия по поводу того, какой путь восстановления собирается выбрать Финляндия. Особенно в отношении того, что делать финским фермерам. В то время как Национальная коалиция и Национальные прогрессивные партии выступают за жесткую экономию и ограниченное вмешательство, Аграрная лига хочет, чтобы правительство помогло фермерам, страдающим от банкротства и лишения права выкупа заложенного имущества. Хотя правительство сейчас не имеет большинства в парламенте, Аграрная лига на этот раз выступила против вотума недоверия, ссылаясь на продолжающийся кризис. Президент Свинхувуд по-прежнему твердо отвергает создание правительства с социал-демократами." # Tentions have stirred up in the governing coalition government over what way to recovery Finland is going to take. Especially in regards to what to do for the Finnish farmers. While the National Coalition and National Progressive parties favouring austerity and limited intervention, the Agrarian League wants the government to help the farmers that are suffering from bankruptcy and foreclousures. While the government has no majority in the Parliament now, the Agrarian League have opposed a vote of no confidence in this time, citing the ongoing crisis. President Svinhufvud is still firm in his rejection of a government with the Social Democrats.
 finland.6.a: "Мы восстановим коалицию" # We Will Rebuild the Coalition

 finland.7.t: "Вяйно Таннер и оппозиция" # Väinö Tanner and the Opposition
 finland.7.d: "Оппозиция, в которой доминируют социал-демократы, горячо критикует правительство. Вяйно Таннер, лидер социал-демократов, увидел растущую поддержку среди новых безработных и среди фермеров Финляндии. Он обвиняет правительство и президента в том, что они мешают парламентскому большинству управлять страной. Социал-демократы выступают за сильный интервенционизм со стороны финского государства, обеспечивающий защиту рабочих и фермеров и усиление государственного контроля над бизнесом и промышленностью. Это прямо противоречит мерам, которые хочет принять правительство." # The opposition, dominated by the Social Democrats, has been ardent in criticising the government. Väinö Tanner, the leader of the Social Democrats, has seen an increasing support among the newly unemployed and among the farmers of Finland. He blames the government and the president for hindering a parliamentary majority to govern the country. The Social Democrats favours strong interventionism from the Finnish state, with protections for the workers and farmers and more state control of the businesses and industries. This is directly opposed to the measures the government wants to take.
 finland.7.a: "Они просто хотят развалить Финляндию" # They Just Want to Tear Apart Finland

 finland.8.t: "Деятельность движения Лапуа" # The Lapua Movement's Activities
 finland.8.d: "Движение Лапуа — это движение, объединяющее как радикальных консерваторов, так и финских националистов. Они также являются ярыми антисоциалистами, и с ростом социал-демократов в эту эпоху они становятся все более и более агрессивными. Из-за попыток убийств и террора со стороны членов организации по отношению к социал-демократам некоторые хотят, чтобы мы запретили организацию. Одна из проблем заключается в том, что у нас нет никаких дел против движения, а только против его членов. Однако нам нужно знать, чтобы бороться с ними, когда они заходят слишком далеко." # The Lapua Movement is a movement encompassing both radical conservatives and Finnish nationalists. They are also strong anti-socialists, and with the growth of the Social Democrats in this era, they have become more and more aggressive. With attempts of assassinations and terror from members towards Social Democrats, some want us to ban the organization. One problem is that we do not have any case against the movement, just its members. We need to be aware, however, to tackle them when they go too far.
 finland.8.a: "Опасное движение" # A Dangerous Movement

 finland.9.t: "Инцидент в Мянтсяля" # The Mäntsälä Incident
 finland.9.d: "В городе Мянтсяля местный социал-демократический митинг сегодня был прерван членами движения Лапуа и белогвардейцами. Похоже, что склонность к насилию среди членов этих организаций поощряется руководством Движения Лапуа, которое приводит доводы в пользу запрета этой организации. После этого инцидента, похоже, собираются члены Движения Лапуа, многие из которых вооружены винтовками и другим оружием. Это может перерасти в нечто большее, чем просто единичный инцидент." # In the town of Mäntsälä, a local Social Democratic meeting was interrupted today by members of the Lapua Movement and the White Guard. The violent additudes of the members of these organizations seem to be encouraged by the leadership in the Lapua Movement, making a case for banning the organization. Following this incident, it looks like members of the Lapua Movement are assembling, with many bearing rifles and other weapons. This might develop into something more than just a lone incident.
 finland.9.a: "Это может быть опасно" # This Can be Dangerous

 finland.10.t: "Марш на Хельсинки" # The March on Helsinki
 finland.10.d: "Многие члены движения Лапуа и Белой гвардии начали марш на столицу Хельсинки с целью свержения правительства и парламента. Идея о том, что правительство слишком неэффективно, чтобы справиться с нынешним кризисом, была широко распространена среди белогвардейцев и даже в неполитических частях армии. После этих событий вновь появилась Красная гвардия, многие из которых столь же вооружены и опасны. Пока неизвестно, что будет из этой ситуации." # Many members of the Lapua Movement and the White Guard have started a march upon the capital of Helsinki, to depose the government and parliament. The idea that the government is too inefficient to take care of the current crisis, has been widespread among the members of the White Guard and even in the non-political parts of the army. Following these events, the Red Guard has reemerged, many equally armed and dangerous. It is yet to see what will develop out of this situation.
 finland.10.a: "Эти предатели!" # Those Traitors!

 finland.11.t: "Битва за Хельсинки" # The Battle of Helsinki
 finland.11.d: "Сейчас идет борьба за захват ключевых важных структур в Хельсинки, белогвардейцы и красногвардейцы сражаются на улицах. Подразделений, лояльных нынешнему правительству, немного, но в городе много тех, кто верен Республике.\n\nФельдмаршал Карл Густав Маннергейм возглавляет защиту парламента и правительства в Хельсинки. Маннергейм по-прежнему пользуется уважением среди белогвардейцев, и многие считают, что у него есть шанс заставить их предать движение Лапуа в пользу прихода к власти Маннергейма.\n\nС другой стороны, белогвардейцы могут не рискнуть пойти против движения Лапуа, своего правого антисоциалистического союзника, рассматривая это как возможное предательство антисоциалистического дела. Поскольку Белая гвардия так важна, обе стороны теперь пытаются заручиться ее поддержкой." # A struggle to take over the key important structures in Helsinki is now underway, with White and Red guardsmen in battle from street to street. Units loyal to the current government are few, still there are many within the city who are loyal to the Republic.\n\nField Marshal Carl Gustav Mannerheim is leading the defense of the parliament and government in Helsinki. Mannerheim is still respected among members of the White Guard, and many believe he has a chance of making them betray the Lapua Movement in favor of Mannerheim taking power.\n\nOn the other hand, the White Guard members might not risk going against the Lapua Movement, their right-wing anti-socialist ally, seeing it as a possible betrayal of the anti-socialist cause. With the White Guard being so important, both sides now try to secure their support.
 finland.11.a: "Маннергейму удается сплотить белую гвардию" # Mannerheim Manages to Rally the White Guard
 finland.11.b: "Белая гвардия отказывается переходить на другую сторону" # The White Guard Refuses to Shift Side

 finland.12.t: "Маннергейм совершает переворот в правительстве" # Mannerheim Coups the Government
 finland.12.d: "Имея под своим командованием Белую гвардию, фельдмаршал Карл Густав Маннергейм счел необходимым совершить государственный переворот. Хотя социал-демократы и аграрии решительно выступают против этого захвата власти, Маннергейм доказывает, что это единственный способ гарантировать, что радикалы не захватят власть. Большинство членов парламента и правительства заявили, что их это устраивает, а президент призвал Маннергейма сформировать правительство." # With the White Guard under his command, Field Marshal Carl Gustav Mannerheim have seen it necessary to coup the government. While the Social Democrats and the Agrarians are stronly opposed to this seizure of power, Mannerheim have made the case that this is the only way to secure that radicals does not sieze power. Most of the parliament and the government have expressed that they are fine by this, with the president calling upon Mannerheim to form a government.
 finland.12.a: "Во имя спасения Республики!" # In Order to Save the Republic!

 finland.13.t: "Переворот Красной Гвардии" # The Red Guard Coup
 finland.13.d: "Благодаря белогвардейцам под командованием фельдмаршала Маннергейма движение Лапуа пока усмирено. Но угроза для Республики все еще существует. Красная гвардия все еще находится на улицах и, похоже, не уйдет без боя. Однако весьма вероятно, что Маннергейму удастся их победить." # With the White Guard under the command of Field Marshal Mannerheim, the Lapua Movement have been pacified for now. But there are still a threat present to the Republic. The Red Guard is still out on the streets, and it does not look like they will go out without a fight. It is highly likely, however, that Mannerheim will be able to defeat them.
 finland.13.a: "Маннергейм побеждает красных" # Mannerheim Defeats the Reds
 finland.13.b: "Красная гвардия совершает переворот в правительстве" # The Red Guard Coups the Government

 finland.14.t: "Стабильность начинает возвращаться" # Stability Begins to Return
 finland.14.d: "После умиротворения как социалистов, так и националистов ситуация начала восстанавливаться. Многие считают, что сейчас самое время вернуть власть обратно в руки парламента, президента и настоящего правительства. Но есть и те, кто утверждает, что политики не способны вывести Финляндию из кризиса, не ссорясь по политическим вопросам. Поэтому некоторые сторонники Маннергейма хотят, чтобы он объявил чрезвычайное положение, захватил исполнительную власть и сверг парламент. Несмотря на диктаторские меры, возможно, потребуется дальнейшая стабилизация Финляндии." # With both socialists and nationalists pacified, the situation have begun to restabalize. Many sees it as a prime time to return power back into the hands of the parliament, president and the true government. But there are also some that argues that the politicians are unable to lead Finland through the crisis without bickering over politics. Therefore, some supporters of Mannerheim wants him to have a state of emergency declared, seize executive powers and overturn the parliament. While dictatorial measures, it might be necessary to further stabilize Finland.
 finland.14.a: "Демократия будет продолжаться" # Democracy Will Continue
 finland.14.b: "Республику надо спасти" # The Republic Must be Saved

 finland.15.t: "Движение Лапуа захватывает власть" # The Lapua Movement Seizes Power
 finland.15.d: "Поскольку Белая гвардия остается верной движению Лапуа, движению удалось захватить власть. Хотя Маннергейм вышел в отставку, на сторону этого движения теперь становятся другие генералы и офицеры. Социал-демократы уже начали уходить в подполье, а некоторые члены Национальной коалиции и Национальных прогрессивных партий заняли коллаборационистскую позицию по отношению к движению Лапуа. Это действительно конец Финляндской Республики." # With the White Guard staying loyal to the Lapua Movement, the movement has managed to sieze power. While Mannerheim has retired, other generals and officers are now taking the side of this movement. Social Democrats have already started to go underground, with some in the National Coalition and National Progressive parties taking a collaborationist stance towards the Lapua Movement. This is truely the end of the Finnish Republic.
 finland.15.a: "Финляндия свободная от предателей!" # A Finland Free From Traitors!

 finland.16.t: "Переворот Красной Гвардии" # The Red Guard Coup
 finland.16.d: "Хотя движение Лапуа сейчас управляет Финляндией, Красная гвардия никуда не делась. Представляя угрозу новому финскому правительству, они имеют возможность отобрать власть у нашего нового националистического правительства. При поддержке консерваторов и военных деятелей, склоняющихся к белым, мы сможем дать им отпор, но красные могут получить союзника в лице социал-демократов. До сих пор неясно, кто удержит власть в Финляндии." # While the Lapua Movement is now governing Finland, the Red Guard have not gone away. Posing as a threat to the new Finnish government, they have the possibility to sieze power from our new nationalist government. With the support of conservatives and White-leaning military figures, we should be able to fight them off, but the Reds might gain an ally in the Social Democrats. It is still uncertain who will hold on to power in Finland.
 finland.16.a: "Красная гвардия побеждена" # The Red Guard is Defeated
 finland.16.b: "Красная гвардия побеждает" # The Red Guard is Victorious

 finland.17.t: "Предстоящие президентские выборы" # Upcoming Presidential Election
 finland.17.d: "Президентские выборы 1937 года уже не за горами. Учитывая нынешний кризис в стране, очень маловероятно, что президент Пер Эвинд Свинхувуд сможет баллотироваться на второй срок на посту президента Финляндии. Еще предстоит увидеть, приведет ли смена караула к стабильности и формированию стабильного правительства." # The 1937 Presidential election are around the corner. With the country in the current crisis, there is very unlikely that President Pehr Evind Svinhufvud will be able to secure a second term as president of Finland. It is yet to see if a change in guard will bring upon the stability to form a stable government.
 finland.17.a: "Давайте посмотрим, что происходит" # Let us See What Happens

 finland.18.t: "Президентские выборы 1937 года" # The 1937 Presidential Election
 finland.18.d: "Сейчас приближаются президентские выборы 1937 года. Тысячи людей вышли и проголосовали в поддержку одного из имеющихся кандидатов или за предпочитаемую ими партию. Поскольку коллегия выборщиков готова отдать свои голоса, в воздухе витает ожидание того, какой кандидат станет президентом Финляндии.\n\nДействующий президент Пер Эвинд Свинхувуд от Национальной коалиционной партии имеет небольшой шанс выиграть еще один срок. В условиях экономического кризиса, в котором оказалась Финляндия, многие утверждают, что антисоциалистическая позиция президента замедлила потенциал восстановления Финляндии. Эту позицию президент не планирует менять.\n\nОдним из наиболее вероятных кандидатов на победу является Кюёсти Каллио от Аграрной лиги. Каллио — кандидат, который может получить поддержку как со стороны избирателей-центристов, так и со стороны социал-демократов. Его считают хорошим кандидатом для тех, кто устал от президента Свинхувуда, но не желает принимать президента Таннера.\n\nПоследним кандидатом, имеющим шанс на победу, является кандидат от Социал-демократической партии Вяйно Таннер. Хотя некоторые считают, что маловероятно, что за него проголосуют избиратели-несоциалисты, некоторых аграриев может быть достаточно, чтобы он стал президентом.\n\nПосле подсчета голосов кажется, что один из кандидатов выиграл выборы." # The 1937 Presidential Election are now upon us. Thousands have gone out and voted in support of one of the candidates available, or for their preferred party. With the electoral college ready to give out their votes, it is anticipation in the air of which candidate will come out as President of Finland.\n\nIncumbent president Pehr Evind Svinhufvud, from the National Coalition Party, have a slim chance to win another term. With the economic crisis Finland finds itself in, many have claimed that the President's anti-socialist stance, have slowed down the potential to rebuild Finland. This is a stance the President have no plan to change.\n\nOne of the most likeliest candidates to win are the Agrarian League's Kyösti Kallio. Kallio is a candidate that can gain support both from the centrist electors, as well as from the Social Democratic ones. He is seen as a good candidate for those sick of President Svinhufvud, but unwilling to accept a President Tanner.\n\nThe last candidate with a chance of winning is the Social Democratic candidate Väinö Tanner. While some believes that it is unlikely that the non-socialist electors will vote for him, some Agrarian ones might be enough to get him into the Presidency.\n\nWith the ballot being counted, there looks like one of the candidates have won the election.
 finland.18.a: "Звоню Каллио!" # Kyösti Kallio!
 finland.18.b: "Черт Таннер!" # Väinö Tanner!
 finland.18.c: "Пер Эвинд Свинхувуд!" # Pehr Evind Svinhufvud!

 finland.19.t: "Доверие к правительству" # Confidence in the Government
 finland.19.d: "С избранием Кёсти Каллио от Аграрной лиги на пост президента Финляндии встал вопрос о вынесении вотума недоверия. Новый президент высказал мнение о допуске социал-демократов в правительство, и единственное, что помешало этому, - это антисоциалистические идеалы экс-президента Пера Эвинда Свинхувуда. Но некоторые члены Аграрной лиги отвергают сотрудничество с социалистическими социал-демократами и хотят восстановить старую коалицию. К какому выбору подтолкнет страну новый президент?" # With the election of the Agrarian League's Kyösti Kallio to the Presidency of Finland, the question of presenting a vote of no confidence have appeared. The new president have voiced the opinion to let the Social Democrats into government, and the only thing that have hindered this was ex-president Pehr Evind Svinhufvud's anti-socialist ideals. But some in the Agrarian League rejects cooperation with the socialist Social Democrats, and wants to rebuild the old coalition. What choice will the new president stir the country towards.
 finland.19.a: "Вотум недоверия!" # A Vote of No Confidence!
 finland.19.b: "Давайте попробуем снова обратиться к правительству!" # Let's Try to Reapproach the Government!

 finland.20.t: "Вотум недоверия" # The Vote of No Confidence
 finland.20.d: "Со сменой президента был вынесен вотум недоверия кабинету Каяндера. Поскольку социал-демократы, Аграрная лига и большинство независимых проголосовали за, большинство парламента перешло на сторону недоверия.\n\nС падением кабинета Кахандера была представлена ​​новая альтернатива. Социал-демократы и аграрии начали дискуссию по поводу формирования коалиционного правительства. Этот новый «альянс» получил разговорное название «Красная Земля». Поскольку обе партии контролируют большинство в парламенте, вполне вероятно, что это правительство получит доверие, позволяющее ему править." # With the change in the Presidency, there have been presented a vote of no confidence in the Cajander cabinet. With the Social Democrats, Agrarian League and most independents voting in favour, the majority of the Parliament have landed on the side of no confidence.\n\nWith the fall of the Cajander cabinet, a new alternative have been presented. The Social Democrats and the Agrarians have started discussion over the formation of a coalition government. This new 'alliance' have gotten the colloquial name 'Red Earth'. With the two parties controlling a majority of the Parliament, it is likely this government will get the confidence to rule.
 finland.20.a: "Посмотрим, куда пойдет Финляндия с этой «красной землей»" # Let's See Where Finland Goes With This 'Red Earth'

 finland.21.t: "Формирование правительства «Красной Земли»" # The Formation of the 'Red Earth' Government
 finland.21.d: "Новое коалиционное правительство, состоящее из Социал-демократической партии и Аграрной лиги, завоевало доверие парламента и теперь собирается заменить старый кабинет Каяндера. Возникает вопрос, какой политик от какой партии возглавит это правительство, и, по сути, на какие вопросы правительство будет опираться.\n\nКандидатом от социал-демократов на пост премьер-министра является Карл Август Фагерхольм; молодой шведоязычный социал-демократ. Фагерхольм считается хорошим кандидатом, поскольку он не имеет связей с социал-демократами времен гражданской войны и является сторонником нейтральной Финляндии.\n\nДругим кандидатом от Аграрной лиги является Урхо Калева Кекконен, еще один молодой политик из Финляндии. Он быстро поднялся в Аграрной лиге, но его также считают несколько проблематичным из-за его предыдущего членства в правых националистических группах.\n\nНесмотря на это, президент и парламентские группы надеются, что одна из них сможет проявить себя как компетентные лидеры правительства." # The new coalition government, made up of the Social Democratic Party and the Agrarian League, have gained the confidence of the Parliament, and are now going to replace the old Cajander cabinet. There is a question on what politician from which party are going to lead this government, and in effect what issues the government will lean on.\n\nThe Social Democratic candidate for Prime Minister is Karl August Fagerholm; a young Swedish-speaking social democrat. Fagerholm is seen as a good candidate since he have no connections with the civil-war era Social Democrats, and are a proponent of a neutral Finland.\n\nThe other candidate, from the Agrarian League, is Urho Kaleva Kekkonen, another young politician in Finland. He has risen fast in the Agrarian League, but is also seen as slightly problematic for his previous membership in right-wing nationalist groups.\n\nRegardless, the President and the Parliament groups hopes that one of these can prove themselves as competent leaders of government.
 finland.21.a: "Урхо Кекконен!" # Urho Kekkonen!
 finland.21.b: "Карл Август Фагерхольм!" # Karl August Fagerholm!

 finland.22.t: "Национальная коалиция - Аграрные переговоры" # National Coalition - Agrarian Negotiations
 finland.22.d: "В целях сохранения статус-кво была запланирована встреча двух лидеров Национальной коалиционной партии и Аграрной лиги, Пера Эвинда Свинхувуда и Кёсти Каллио соответственно. Большим вопросом переговоров будет вопрос о том, насколько правительство должно вмешаться, чтобы сохранить собственность и права фермеров. В связи с ростом случаев отчуждения права выкупа, аграрии пытаются договориться о поддержке фермеров Финляндии в эти трудные времена." # With the intentions of keeping the status quo intact, a meeting have been planned between the two leaders of the National Coalition Party and the Agrarian League, Pehr Evind Svinhufvud and Kyösti Kallio respectively. The negotiation's big issue will be regarding how much the government need to step in to preserve the properties and rights of the farmers. With rising cases of foreclousures happening, the Agrarians are trying to negotiate support for the farmers of Finland in these trying times.
 finland.22.a: "Посмотрим, что будет согласовано" # Let Us See What Will be Agreed Upon

 finland.23.t: "Конец переговоров" # The End of the Negotiations
 finland.23.d: "После нескольких дней переговоров между президентом Кёсти Каллио и экс-президентом Пером Эвиндом Свинхувудом наконец появились признаки продвижения к завершению переговоров. Один вопрос все еще на устах людей; «Что произойдет с фермерами и выкупами?». В данном случае было согласовано следующее." # After days of negotiations between president Kyösti Kallio and the ex-president Pehr Evind Svinhufvud, there is finally signs of the progression towards an end of the negotiations. One question is still on the lips of the people; 'What is going to happen regarding the farmers and the foreclousures?'. In this case, the following have been agreed upon.
 finland.23.a: "Фермерам нужна наша поддержка!" # The Farmers Have Our Support!
 finland.23.b: "Мы не можем предоставить дополнительную поддержку" # We Can Not Give Extra Support

 finland.24.t: "Формирование нового правоцентристского правительства" # The Formation of a New Centre-Right Government
 finland.24.d: "Новое коалиционное правительство, состоящее из Национальной коалиционной партии, Национальной прогрессивной партии и Аграрной лиги, завоевало доверие парламента. В воздухе висит вопрос, собирается ли премьер-министр Каяндер продолжать руководить страной, или премьер-министром станет кандидат от аграриев или Национальной коалиции.\n\nАграрная лига представляет Урхо Калеву Кекконена в качестве своего кандидата. Хотя он молод и не долгое время был членом Аграрной лиги, его считают человеком, который может объединить центристов и правых, поскольку он ранее был членом правых националистических организаций.\n\nНациональная коалиция представляет Юхо Кусти Паасикиви своим кандидатом на пост премьер-министра. Паасикиви намного старше Кекконена и является членом Национальной коалиции со времен гражданской войны. Имея опыт работы в финской политике, многие видят в нем гораздо лучшую альтернативу Каяндеру, чем Кекконен.\n\nНесмотря на это, президент и парламентские группы надеются, что одна из них сможет проявить себя как компетентные лидеры правительства." # The new coalition government, made up of the National Coalition Party, the National Progressive Party and the Agrarian League, have gained the confidence of the Parliament. It is a question in the air if prime minister Cajander is going to continue to lead, or if a candidate from the Agrarians or the National Coalition is going to be prime minister.\n\nThe Agrarian League presents Urho Kaleva Kekkonen as their candidate. While he is young and have not been an Agrarian League member for long, he is seen as someone that can unite the centrist and the right-wing, with his previous membership in right-wing nationalist organizations.\n\nThe National Coalition presents Juho Kusti Paasikivi as their candidate to become prime minister. Paasikivi are much older than Kekkonen and have been a member of the National Coalition since the civil war. Experienced with Finnish politics, many see him as a much better alternative to Cajander than what Kekkonen is.\n\nRegardless, the President and the Parliament groups hopes that one of these can prove themselves as compitent leaders of government.
 finland.24.a: "Аймо Каяндер – хороший компромисс" # Aimo Cajander is a Good Compromice
 finland.24.b: "Урхо Кекконен!" # Urho Kekkonen!
 finland.24.c: "Юхо Кусти Паасикиви!" # Juho Kusti Paasikivi!

 finland.25.t: "Конец переговоров" # The End of the Negotiations
 finland.25.d: "После нескольких дней переговоров между президентом Пером Эвиндом Свинхувудом и Кёсти Каллио наконец появились признаки продвижения к завершению переговоров. Находясь под давлением вопроса о поддержке фермеров, аграрный лидер не смог убедить президента поддержать фермеров. Официально позиция по этому вопросу не определена, с возможностью пойти в обе стороны в будущем." # After days of negotiations between president Pehr Evind Svinhufvud and Kyösti Kallio, there is finally signs of the progression towards an end of the negotiations. Pressed on the issue of farmer support, the Agrarian leader was unable to convince the president to go through with supporting the farmers. Officially, the position on the issue are not set, with the possibility to go both ways in the future.
 finland.25.a: "По крайней мере, это более гибкая позиция" # At Least it is a More Flexible Position

 finland.26.t: "Президент Кёсти Каллио перенес инсульт" # President Kyösti Kallio Had a Stroke
 finland.26.d: "Президент Кьёсти Каллио уже начал достигать преклонного возраста, когда вступил в должность президента, и теперь, похоже, его время на посту президента закончилось. Недавно у 67-летнего президента случился инсульт, что вызвало опасения, сможет ли президент продолжать свое пребывание на посту. Члены как правительства, так и оппозиции призвали президента Каллио уйти в отставку, чтобы уделить приоритетное внимание своему здоровью, и он также объявил, что сделает это через несколько недель." # President Kyösti Kallio was already beginning to reach an old age when he entered the Presidency and now, it looks like his time in the seat is over. Recently, the 67 year old President experienced a stroke, awaking concerns if the President can continue his tenure. Both members from the government and the opposition have urged President Kallio to resign in order to prioritize his health, and he have also announced that he would after some weeks.
 finland.26.a: "Надеюсь, с президентом все в порядке" # Hope the President is Okay

 finland.27.t: "Президент Кёсти Каллио уходит в отставку" # President Kyösti Kallio Resigns
 finland.27.d: "Сегодня президент Кёсти Каллио объявил перед финским народом, что уходит в отставку с поста президента Финляндии. Поскольку старый президент уходит, новые кандидаты заняли четвертое место в своей заявке на пост президента. Среди этих кандидатов - Ристо Рюти, которого уходящий президент считает лучшим кандидатом." # Today, President Kyösti Kallio announced before the Finnish nation that he would resign from his position as President of Finland. With the old President on his way out, new candidates have come fourth in their bid for the Presidency. Among these candidates are Risto Ryti, who is seen as the best available candidate by the outgoing president.
 finland.27.a: "Нам нужно избрать нового президента" # We Need to Elect a New President

 finland.28.t: "Президентские выборы [GetYear]" # The [GetYear] Presidential Election
 finland.28.d: "После отставки Кёсти Каллио встал вопрос о том, кто станет его преемником. Хотя выборы, кажется, завершились в пользу фаворитного кандидата Ристо Хейкки Рюти, существует небольшая оппозиция со стороны левых, кандидатом от которых является социал-демократ Йохан Хело. Хело считается представителем левого социалистического крыла своей партии, и он может быть слишком поляризующим, чтобы заручиться поддержкой достаточного количества парламентариев или даже сторонников социал-демократов. Хотя прогнозируется, что Рюти победит, выборы могут преподнести сюрприз." # With the resignation of Kyösti Kallio, the question have come up about who is going to succeed him. While the election seems to end up in favor of the favorite candidate, Risto Heikki Ryti, there is a slight opposition from left-wingers, with Social Democrat Johan Helo as their candidate. Helo is seen as someone on the socialist left-wing of his party, and might be too polarizing to gain the support of enough Parliamentarians, or even from those in the Social Democrats. While it is projected that Ryti is going to win, the election might give a surprise.
 finland.28.a: "Ристо Рюти победил, как и предполагалось" # Risto Ryti Won, As Suspected
 finland.28.b: "Йохан Хело одерживает неожиданную победу" # Johan Helo Gains a Surprising Win

 finland.29.t: "Президент Йохан Хело отправил в отставку правительство" # President Johan Helo Dismisses the Government
 finland.29.d: "Новый президент Йохан Хело недавно распустил правительство, заявив, что оно неприемлемо в нынешних условиях. Хотя, скорее всего, это связано с тем, что он социалист, но это вызвало некоторые волнения в политической системе Финляндии." # The new president, Johan Helo, have now recently dismissed the government, stating it is not an acceptable government in the current climate. While it is most likely because he is a socialist, this has made some unrest in the political system of Finland.
 finland.29.a: "Вместо этого нам следовало бы пойти с Рюти" # We Should Have Gone With Ryti Instead

 finland.30.t: "Формирование правительства Пеккалы" # The Formation of the Pekkala Government
 finland.30.d: "Новый президент назначил правительство социал-демократов во главе с Мауно Пеккалой. Хотя президент Йохан Хело утверждает, что это будет лучше представлять народ Финляндии, многие консерваторы и центристы рассматривают это как захват власти социалистами. Это может даже стать немного некрасивым." # A Social Democratic government headed by Mauno Pekkala have now been appointed by the new president. While president Johan Helo claims this will better represent the Finnish people, it is seen by many conservatives and centrists as a socialist power grab. This might even get a little ugly.
 finland.30.a: "Новое правительство для народа!" # A New Government For the People!

 finland.31.t: "Маннергейм совершает переворот в правительстве" # Mannerheim Coups the Government
 finland.31.d: "Части финской армии в сопровождении Белой гвардии теперь выступили против вновь назначенного правительства и президента Йохана Хело. Переворот, возглавляемый фельдмаршалом Карлом Густавом Маннергеймом, оправдан тем, что он воспринимается как опасное развитие финской демократии. До сих пор не ясно, кто победит, поскольку подпольные красные силы и левые элементы армии восстали в поддержку президента Хело и премьер-министра Пеккалы." # Elements of the Finnish army, acompanied by the White Guard, have now moved against the newly appointed government and the presidency of Johan Helo. Led by Field Marshal Carl Gustav Mannerheim, the coup is justified by what is percieved as a dangerous development for Finnish democracy. It is still not set who is going to win, as underground Red forces and left-wing elements of the army have rissen up in support of President Helo and Prime Minister Pekkala.
 finland.31.a: "Маннергейм сохраняет власть" # Mannerheim Secures Power
 finland.31.b: "Красные разгромили Маннергейма" # The Reds Defeat Mannerheim

 finland.32.d: "Учитывая опасность для демократии, которую представляли теперь свергнутые президент Хело и премьер-министр Пеккала, пришло время повторить президентские выборы. Хотя выборы открыты для других кандидатов, по сути, это гарантированная победа Ристо Хейкки Рюти, который также был предпочтительным кандидатом на предыдущих выборах. Это также хорошая возможность для фельдмаршала Маннергейма вернуть власть парламенту и народу Финляндии в форме правительства во главе с аграрным политиком Урхо Кекконеном." # With the danger to democracy that was President Helo and Prime Minister Pekkala now deposed, it is time to redo the presidential election. While the election is open for other candidates, it is basically a secured win for Risto Heikki Ryti, who also was a preferred choice when the previous election was up. This is also a good opportunity for Field Marshal Mannerheim to hand power back to the Parliament and to the People of Finland, in the form of a government led by Agrarian politician Urho Kekkonen.
 finland.32.a: "Наконец-то победа Ристо Рюти" # Finally a Win for Risto Ryti

 finland.33.t: "Финская революция" # The Finnish Revolution
 finland.33.d: "В то время как Маннергейм и его клика правых бандитов потерпели поражение, элементы Красной гвардии, которые помогли победить его, теперь подняли свое оружие против демократической республики. Учитывая ту силу, которой они обладают сейчас, единственный вариант, который есть у нашего правительства, — это уступить их требованию. Да здравствует Социалистическая революция!" # While Mannerheim and his clique of right-wing bandits have been defeated, the Red guard elements that helped to defeat him have now raised their weapons against the democratic republic. With the strength they have now, the only option our government have is to give in to their demand. Long Live the Socialist Revolution!
 finland.33.a: "Да здравствует Социалистическая революция!" # Long Live the Socialist Revolution!

 finland.34.t: "Президентские выборы [GetYear]" # The [GetYear] Presidential Election
 finland.34.d: "В Финляндии пройдут новые президентские выборы. Несмотря на то, что на пост президента рассматривается множество кандидатов, наиболее вероятным результатом будет переизбрание нынешнего президента. Однако в этом может быть нет уверенности, особенно если Финляндия столкнется с какими-либо конфликтами или кризисами." # New Presidential Election is to be held in Finland. While there are a bunch of candidates being considered to be elected President, the most likely result will be to see the current President re-elected. This might however not be certain, especially if Finland is facing any conflicts or crises.
 finland.34.a: "Вяйно Таннер переизбран!" # Väinö Tanner Re-elected!
 finland.35.a: "Ристо Рюти переизбран!" # Risto Ryti Re-elected!
 finland.36.a: "Пер Эвинд Свинхувуд переизбран!" # Pehr Evind Svinhufvud Re-elected!
 finland.34.b: "Карл Густав Маннергейм избран!" # Carl Gustav Mannerheim is Elected!

 finland.100.t: "Возвращение к демократии?" # A Return to Democracy?
 finland.100.d: "Поскольку будущее Финляндской Республики обеспечено, возникает вопрос, настало ли время для Карла Густава Маннергейма вернуть власть парламенту и восстановить демократию. Хотя многие поддерживают такое решение, некоторые в окружении Маннергейма указывают на опасность предоставления политикам управлять страной. Существует опасность, что политика станет важнее нации. От Маннергейма зависит, будет ли восстановлена ​​демократия или продолжится ли Финляндия под его руководством." # With the future of the Republic of Finland secured, the question has come up if it is time for Carl Gustav Mannerheim to give power back to the Parliament and restore democracy. While many support such a decision, some in Mannerheim's circle points out the danger with letting politicians rule the country. There is a danger that politics would become more important than the nation. It is up to Mannerheim if democracy shall be restored, or if Finland shall continue under his guiding hand.
 finland.100.a: "Демократия должна быть восстановлена!" # Democracy Must be Restored!
 finland.100.b: "Люди верят правлению Маннергейма!" # People Have Trust in the Reign of Mannerheim!

 finland.101.t: "Финская демократия восстановлена!" # Finnish Democracy Restored!
 finland.101.d: "Карл Густав Маннергейм только что сложил свои полномочия, вернув их парламенту и народу Финляндии. Прозванный финским Цинциннатом, он снискал большое уважение за свое правление и готовность восстановить финскую демократию. Даже среди правых националистов и левых социал-демократов Маннергейм стал соответствующей фигурой. Восстановление демократии означает возвращение Пера Эвинда Свинхувуда на пост президента и Аймо Каяндера на пост премьер-министра." # Carl Gustav Mannerheim have just now given up his powers, giving them back to the Parliament and the people of Finland. Hailed as Finland's Cincinnatus, he has gathered great respect for his governing and his willingness to restore the Finnish democracy. Even among right-wing nationalists and left-wing social democrats, Mannerheim have become an respective figure. With democracy restored, that means the return of Pehr Evind Svinhufvud as President and Aimo Cajander as Prime Minister.
 finland.101.a: "Спасибо, фельдмаршал" # Thank You, Field Marshal

 finland.102.t: "Правительство Лапуа" # The Lapua Government
 finland.102.d: "Когда во главе стоит Движение Лапуа, настало время установить новый стиль управления финской нацией. Хотя движение по большей части представляет собой единую силу, между фракциями движения существуют некоторые разногласия. Консервативная фракция во главе с Германом Гуммерусом больше заинтересована в сохранении финского общества, закона и порядка, в то время как националистическая фракция во главе с Вилхо Анналой поддерживает более радикальное движение, более соответствующее валькизму Германии. Нужно будет посмотреть, какой корень движение будет уделять приоритетное внимание." # With the Lapua Movement in charge, it is time to establish a new style of governing the Finnish nation. While the movement are for the most part a unified force, there are some cracks between factions of the movement. A conservative faction led by Herman Gummerus are more interested in conserving Finnish society, law and order, while a nationalist faction led by Vilho Annala supports a more radical movement, more in line with the Valkism of Germany. It will be to see what root the movement will prioritize.
 finland.102.a: "Мы не валкистское движение!" # We Are Not a Valkist Movement!
 finland.102.b: "Мы — настоящее националистическое движение!" # We Are a True Nationalist Movement!

 finland.103.t: "Создание Народной делегации" # The Establishment of the People's Delegation
 finland.103.d: "Когда власть Коммунистической партии Финляндии гарантирована, пришло время официально восстановить Финскую народную делегацию. Делегация, которую снова возглавит Куллерво Маннер, будет действовать в качестве государственного органа Финляндии, защищая права людей и трудящихся. Это также будет фронтом для продвижения социализма в Финляндии." # With the power of the Finnish Communist Party assured, it is time to formally reestablish the Finnish People's Delegation. Chaired once more by Kullervo Manner, the Delegation will act as the government body in Finland, securing the rights of the people and the workers. It will also be a front to promote Socialism in Finland.
 finland.103.a: "За Финляндию! За социализм!" # For Finland! For Socialism!

 finland.104.t: "Оппозиция манере" # Opposition to Manner
 finland.104.d: "С восстановлением Народной делегации появилось правительство, занимающееся защитой прав финского народа. Но, будучи ее председателем, Куллерво Маннер пользуется справедливой поддержкой ядра Коммунистической партии, он встречает оппозицию со стороны фракций партии. В делегации был вынесен вотум недоверия Маннеру. Хотя Маннер может сохранить доверие со стороны партии и делегации, если маргиналы партии объединятся против него, он легко потерпит поражение." # With the reestablishment of the People's Delegation, there is a government to promote the rights of the Finnish people. But while it's chairman, Kullervo Manner is fairly supported by the core of the Communist Party, he meets opposition from the factions of the party. A motion of no confidence has been raised against Manner inside the Delegation. While Manner might hold on to confidence from the party and the Delegation, if the fringes of the party unite against him, he will easily be defeated.
 finland.104.a: "Манер Держись!" # Manner Hold On!
 finland.104.b: "Манера отсутствует!" # Manner is Out!

 finland.105.t: "Новый глава делегации" # The New Chair of the Delegation
 finland.105.d: "После изгнания Маннера в Народной делегации образовался вакуум власти. Хотя у ортодоксальной социалистической фракции Коммунистической партии нет сильных кандидатов, по два кандидата от каждой фракции партии кажутся самыми сильными претендентами. Отто Вилле Куусинен, лидер Красной гвардии, рассматривается как естественный преемник Маннера на посту главы делегации. Но его радикальные взгляды и политика могут также оттолкнуть его от более умеренных крыльев партии. С другой стороны, Оскари Токой, выходец из левого крыла социал-демократов, является сильным кандидатом от антиавторитарной социалистической фракции партии. Он кажется более умеренным и может помочь интегрировать остальных социал-демократов в партию. Но его самая большая оппозиция исходит от влиятельной Красной гвардии." # With Manner kicked out, there is now a power vacuum in the People's Delegation. While the Ortodox Socialist faction of the Communist Party has no strong candidates, two candidates from each fringe of the party seem to be the strongest contenders. Otto Wille Kuusinen, the leader of the Red Guard, is seen to be the natural successor to Manner as Chairman of the Delegation. But his radical views and policies might also alienate him from the more moderate wings of the party. On the other hand, Oskari Tokoi, originating from the left-wing of the Social Democrats, he is a strong candidate for an Anti-Authoritarian Socialist faction of the party. He seems more moderate and can help integrate the rest of the Social Democrats into the party. But his greatest opposition comes from the influential Red Guard.
 finland.105.a: "Отто Вилле Куусинен" # Otto Wille Kuusinen
 finland.105.b: "Оскари Токой" # Oskari Tokoi

 finland.110.t: "Парламентские выборы [GetYear]" # The [GetYear] Parliamentary Election
 finland.110.d: "Учитывая, что в Финляндии недавно восстановлена ​​демократия, будет правильным провести новые парламентские выборы. Хотя мы оставим нынешнего президента на срок, его место должен занять новый парламент. Таким образом, наш народ будет представлен должным образом." # With democracy newly restored in Finland, it is only right to hold a new parliamentary election. While we will keep the current President out his term, a new parliament need to take its place. This way, our people will be properly represented.
 finland.110.a: "Сильные центристские выступления" # A Strong Centrist Showings
 finland.110.b: "Социал-демократический всплеск" # A Social Democratic Surge
 finland.110.c: "Консервативный импульс" # A Conservative Boost

 finland.111.d: "В Финляндской Республике состоятся новые парламентские выборы. Прошло три года с момента последних парламентских выборов, и мы с нетерпением ожидаем того, на что будут опираться результаты выборов этого года." # New Parliamentary Elections are to be held in the Republic of Finland. With three years since last Parliamentary Election, it is anticipation over what the results of this year's election will land on.

 finland.112.t: "Центристское правительство?" # A Centrist Government?
 finland.112.d: "Учитывая сильные результаты центристских партий на недавних парламентских выборах, возникает вопрос, стоит ли нам выбирать новое правительство, чтобы отклонить это. Хотя с нынешним правительством все в порядке, некоторые люди будут немного раздражены, если мы проигнорируем это." # With the strong showing of the centrist parties in the recent parliamentary election, it has presented a question if we should pick a new government to deflect this. While the current government is fine, it would make some people a little grumpy if we ignored this.
 finland.112.a: "Давайте сохраним действующую власть" # Let's Keep the Current Government
 finland.112.b: "Это центристское, аграрное правительство!" # A Centrist, Agrarian Government it is!
 finland.112.c: "Это центристское, либеральное правительство!" # A Centrist, Liberal Government it is!

 finland.113.t: "Левое правительство?" # A Leftist Government?
 finland.113.d: "Учитывая сильные позиции левых политических сил на недавних парламентских выборах, возник вопрос, стоит ли нам выбирать новое правительство, чтобы отклонить это решение. Хотя с нынешним правительством все в порядке, некоторые люди будут немного раздражены, если мы проигнорируем это." # With the strong showing of the political left-wing in the recent parliamentary election, it has presented a question if we should pick a new government to deflect this. While the current government is fine, it would make some people a little grumpy if we ignored this.
 finland.113.a: "Давайте сохраним действующую власть" # Let's Keep the Current Government
 finland.113.b: "Это социал-демократическое правительство!" # A Social Democratic Government it is!

 finland.114.t: "Консервативное правительство?" # A Conservative Government?
 finland.114.d: "Учитывая сильные результаты консервативных партий на недавних парламентских выборах, возникает вопрос, стоит ли нам выбирать новое правительство, чтобы отклонить это. Хотя с нынешним правительством все в порядке, некоторые люди будут немного раздражены, если мы проигнорируем это." # With the strong showing of the conservative parties in the recent parliamentary election, it has presented a question if we should pick a new government to deflect this. While the current government is fine, it would make some people a little grumpy if we ignored this.
 finland.114.a: "Давайте сохраним действующую власть" # Let's Keep the Current Government
 finland.114.b: "Консервативное правительство!" # A Conservative Government it is!

 finland.120.t: "Антисоветская линия" # The Anti-Sovietist Line
 finland.120.d: "Хотя в Финляндии есть те, кто хочет, чтобы мы снова сблизились с Советским Союзом, мы сделали выбор в пользу продолжения антисоветской политики. Наряду с опасностью социализма, Советы также являются средством защиты российской угрозы и угнетения финской нации. Эта линия приведет к тому, что финская нация станет нацией, противостоящей ужасам Советского Союза." # While there are those in Finland who want us to reapproach the Soviet Union, we have taken the choice to continue an Anti-Soviet policy. Along with the danger that is socialism, the Soviets are also a conuation of the Russian threat and oppression against the Finnish nation. This line will see the Finnish nation becoming a nation to oppose the terrors of the Soviet Union.
 finland.120.a: "Финляндия будет сильной" # Finland Will be Strong

 finland.121.t: "Новый подход к Советскому Союзу" # The New Approach to the Soviet Union
 finland.121.d: "Хотя в Финляндии есть те, кто хочет, чтобы мы продолжали занимать враждебную позицию по отношению к Советскому Союзу, мы решили переосмыслить нашу позицию по отношению к ним. Более дружелюбный тон по отношению к Советскому Союзу покажет, что мы готовы дать миру шанс, оставив в то же время старую борьбу позади. Пока Советский Союз способен принять нас как независимую республику, мы, по крайней мере, можем перестать быть врагами." # While there are those in Finland who want us to continue with a hostile stance against the Soviet Union, we have decided to rethink our position towards them. A friendlier tone towards the Soviet Union will show that we are willing to give peace a chance, while also leaving old struggles behind. As long as the Soviet Union is able to accept us as an independent Republic, we can at least stop being foes.
 finland.121.a: "Давайте начнем строить этот мир" # Let's Start Building This Peace

 finland.122.t: "Мечта о Великой Финляндии" # The Dream of Greater Finland
 finland.122.d: "Мечта о Великой Финляндии всегда активно преследовалась националистическими элементами внутри страны, но никогда не поднималась в залах правительства. До сегодняшнего дня. Сегодня правительство Финляндии издало заявление о том, что в последующие годы страна будет активно реализовывать мечту о Великой Финляндии. Хотя это встретило некоторую оппозицию со стороны пацифистов в нашей стране, а также со стороны наших соседей, националисты отпраздновали это как начало создания Великого финского национального государства." # The dream of a Greater Finland have always been one actively pursued by Nationalist elements inside the country, but has never been taken up in the halls of government. Until today. Today, the government of Finland issued a proclamation that the nation would, in the following years, activly pursue the dream of a Greater Finland. While this have been met with some opposition from pacifists in our country, as well as from our neighbors, Nationalists have celebrated this as the start of a Greater Finnish nation state.
 finland.122.a: "Финляндия заслуживает величия!" # Finland Deserves Greatness!

 finland.123.t: "Эстонские контакты" # Estonian Contacts
 finland.123.d: "Эстонский народ в основном рассматривается как братский народ финскому народу. Оба являются балтийскими финнами, которых объединяет общая история иностранного угнетения и борьбы за независимость. Даже если есть эстонцы, которые хотят, чтобы их нация была независимой, есть и те, кто выступает за объединение Финляндии и Эстонии. Используя наше влияние, мы могли бы привлечь эстонцев на свою сторону и расширить возможности тех, кто поддерживает наш план. Надеюсь, нам удастся удовлетворить даже эстонских националистов." # The Estonian nation are mostly seen as a brother-people to the Finnish nation. Both are Baltic Finn people, linked through a shared history of foreign oppression and fight for independence. Even if there are Estonians that wants their nation independent, there are some that favours a unification between Finland and Estonia. Using our influence, we might be able to get the Estonians on board and empowering those in favour of our plan. Hopefully, we will be able to satisfy even the Estonian nationalists.
 finland.123.a: "Братья должны держаться вместе" # Brethren Should Stick Together

 finland.124.t: "Финское влияние в Эстонии" # Finnish Influence in Estonia
 finland.124.d: "Наш северный сосед Финляндия начал влиять на политику и общество Эстонии в сторону панфиннских настроений. Хотя идея панфинской Великой Финляндии звучит интересно, она вызывает некоторую оппозицию в Эстонии. Некоторые эстонские националисты также видят в этом способ уничтожить эстонскую идентичность в пользу финской. Они хотят, чтобы наше правительство лишило финнов возможности влиять на нас." # Our northern neighbor, Finland, have begun to influence the politics and society of Estonia towards Pan-Finn sentiments. While the idea of a Pan-Finn Greater Finland sounds interesing, it does gather some opposition in Estonia. Some Estonian nationalists also sees it as a way to eliminate the Estonian identity in favor of a Finnish one. They want our government to deny the Finnish a chance in influencing us.
 finland.124.a: "Давайте не будем спешить.." # Let us Not be to Hasty..
 finland.124.b: "Отвергните этот финский экспансионизм!" # Reject This Finnish Expantionism!

 finland.125.t: "Советско-финский договор [GetYear]" # The Finno-Soviet Treaty of [GetYear]
 finland.125.d: "Сегодня делегаты и дипломаты Финляндии и Советского Союза встречаются, чтобы окончательно нормализовать отношения между двумя странами. Хотя наша история демонстрирует некоторую враждебность, мы надеемся найти новое направление, в котором Финляндия и Советский Союз смогут сотрудничать и дружить, несмотря на различия между нашими странами." # Today, delegates and diplomats from Finland and the Soviet Union meet to finally normalize relations between the two countries. While our history have shown some animosity, our hope is to carve out a new direction where Finland and the Soviet Union can cooperate and be friends, despite the differences between our countries.
 finland.125.a: "За мир и рост" # For Peace and Growth

 finland.126.t: "Финляндия предлагает финно-советский договор" # Finland Proposes a Finno-Soviet Treaty
 finland.126.d: "Наш сосед Финляндия протянула дружескую руку Советскому Союзу. На этот раз они предлагают нам советско-финский договор, который будет способствовать дальнейшей дружбе и сотрудничеству между нашими двумя народами. Хотя это способствовало бы дальнейшему миру во всем мире, некоторые из наших министров заявили, что Финляндия делает это, чтобы защитить себя от советской агрессии, что это скорее причина, чем содействие миру. Можем ли мы им доверять, когда они находятся так близко от Ленинграда?" # Our neighbor Finland have reached out a friendly hand to the Soviet Union. This time, they proposes for us a Finno-Soviet treaty that will help further friendship and cooperation between our two nations. While this would help further peace in the world, some of our ministers have said that Finland does it to protect themselves from Soviet aggression, that this is more of a reason than to promote peace. Can we even trust them when they are so near Leningrad?
 finland.126.a: "Давайте подпишем этот договор!" # Let's Sign That Treaty!
 finland.126.b: "Никакого договора с финнами!" # No Treaty With the Finn!

 finland.127.t: "Советский Союз соглашается на наш договор" # The Soviet Union Agrees to Our Treaty
 finland.127.d: "Советский Союз согласился на Советско-финский договор, что подтверждает дружественный характер сотрудничества между двумя странами. Это большой шаг для Финляндии в ее новом направлении противостояния Советскому Союзу." # The Soviet Union have agreed to the Finno-Soviet Treaty, reassuring a friendly and cooperative nature between the two nations. This is a great step for Finland in its new direction when contfronting the Soviet Union.
 finland.127.a: "Ура! Ура!" # Hurrah! Hurrah!

 finland.128.t: "Советский Союз отвергает наш договор" # The Soviet Union Rejects Our Treaty
 finland.128.d: "Советский Союз отверг Советско-финский договор, показав нам, что они не заинтересованы в развитии дружбы и сотрудничества. Будем надеяться, что они изменят свое мнение в будущем, но новый договор кажется маловероятным." # The Soviet Union have rejected the Finno-Soviet Treaty, showing us that they are not interested in the promotion of friendship and cooperation. Hopefully, they will change their opinion in the future, but another treaty seems unlikely.
 finland.128.a: "Ну тогда.." # Well Then..

 finland.129.t: "Финляндия хочет присоединиться к нашему альянсу" # Finland Want to Join Our Alliance
 finland.129.d: "Финский дипломат в Германии обратился к нам с предложением. Это означает впустить Финляндию в наш альянс с перспективой помощи в борьбе с иностранной агрессией взамен. Это звучит как хорошая идея, но она также может помешать нашим отношениям с Советским Союзом." # The Finnish diplomat to Germany have approached us with an offer. It is to allow Finland into our alliance, with the prospect of help against foreign aggression in return. It sounds like a good idea, but might also be one that would hamper with our relations to the Soviet Union.
 finland.129.a: "Скажите, что мы приветствуем их" # Say That We Welcome Them
 finland.129.b: "Финны нам не нужны" # We Don't Need the Finns

 finland.130.t: "Немцы принимают нас в свой союз" # The Germans Accept us Into Their Alliance
 finland.130.d: "Наша дипломатическая миссия в Берлин принесла свои плоды. Сегодня мы получили телеграмму с подробным известием о том, что Финляндия теперь является официальным членом Штальпакта, альянса, возглавляемого Германским Рейхом. Хотя это и демонстрирует отказ от нейтралитета, мы надеемся, что этот новый союз будет в основном положительным для финской нации." # Our diplomatic mission to Berlin has bore fruits. Today, we acquired a telegram detailing the news that Finland now is an official member of the Stahlpakt, the alliance headed by the German Reich. While this demonstrates a break from neutrality, we hope this new alliance will be mostly positive for the Finnish nation.
 finland.130.a: "Какая честь!" # What an Honour!

 finland.131.t: "Немцы отвергают нас в своем союзе" # The Germans Reject us Into Their Alliance
 finland.131.d: "Наша дипломатическая миссия в Берлин вернулась с пустыми руками. Сегодня мы получили потрясающую новость о том, что Германия отказалась от членства Финляндии в своем альянсе «Штальпакт». Хотя это и является неудачей, мы надеемся, что она будет временной." # Our diplomatic mission to Berlin has returned empty-handed. Today, we received the earth-shattering news that Germany has rejected Finland's membership into their alliance, the Stahlpakt. While this is a setback, we hope that it will be a temporary one.
 finland.131.a: "Это будет их потеря" # That Will Be Their Loss

 finland.132.t: "Финляндия хочет присоединиться к нашему альянсу" # Finland Want to Join Our Alliance
 finland.132.d: "Финский дипломат в Великобритании обратился к нам с предложением. Это означает впустить Финляндию в наш альянс с перспективой помощи в борьбе с иностранной агрессией взамен. Это звучит как хорошая идея, но она также может помешать нашим отношениям с Советским Союзом." # The Finnish diplomat to the United Kingdom have approached us with an offer. It is to allow Finland into our alliance, with the prospect of help against foreign aggression in return. It sounds like a good idea, but might also be one that would hamper with our relations to the Soviet Union.
 finland.132.a: "Почему мы должны заботиться о Советах? Садитесь на борт!" # Why Should We Care About the Soviets? Hop Onboard!
 finland.132.b: "Финны нам не нужны" # We Are In No Needs of the Finns

 finland.133.t: "Британцы принимают нас в свой союз" # The British Accept us Into Their Alliance
 finland.133.d: "Наша дипломатическая миссия в Лондон принесла свои плоды. Сегодня мы получили телеграмму с подробным известием о том, что Финляндия теперь является официальным членом Альянса защиты Империи, альянса, возглавляемого Великобританией. Хотя это и демонстрирует отказ от нейтралитета, мы надеемся, что этот новый союз будет в основном положительным для финской нации." # Our diplomatic mission to London has bore fruits. Today, we acquired a telegram detailing the news that Finland now is an official member of the Imperial Protection Alliance, the alliance headed by the United Kingdom. While this demonstrates a break from neutrality, we hope this new alliance will be mostly positive for the Finnish nation.
 finland.133.a: "Какая честь!" # What an Honour!

 finland.134.t: "Британцы отвергают нас в своем союзе" # The British Reject us Into Their Alliance
 finland.134.d: "Наша дипломатическая миссия в Лондон вернулась с пустыми руками. Сегодня мы получили потрясающую новость о том, что Великобритания отказалась от членства Финляндии в своем альянсе, Альянсе Имперской Защиты. Хотя это и является неудачей, мы надеемся, что она будет временной." # Our diplomatic mission to London has returned empty-handed. Today, we received the earth-shattering news that the United Kingdom has rejected Finland's membership into their alliance, the Imperial Protection Alliance. While this is a setback, we hope that it will be a temporary one.
 finland.134.a: "Это будет их потеря" # That Will Be Their Loss

 finland.135.t: "Финляндия хочет присоединиться к нашему альянсу" # Finland Want to Join Our Alliance
 finland.135.d: "Финский дипломат во Франции обратился к нам с предложением. Это означает впустить Финляндию в наш альянс с перспективой помощи в борьбе с иностранной агрессией взамен. Это звучит как хорошая идея, но она также может помешать нашим отношениям с Советским Союзом." # The Finnish diplomat to France have approached us with an offer. It is to allow Finland into our alliance, with the prospect of help against foreign aggression in return. It sounds like a good idea, but might also be one that would hamper with our relations to the Soviet Union.
 finland.135.a: "Финляндия может пригодиться" # Finland Can Come In Handy
 finland.135.b: "Нам не нужен снег и деревья, чтобы сдержать Германию" # We Do Not Need Snow and Trees to Contain Germany

 finland.136.t: "Французы принимают нас в свой союз" # The French Accept us Into Their Alliance
 finland.136.d: "Наша дипломатическая миссия в Париж принесла свои плоды. Сегодня мы получили телеграмму с подробным известием о том, что Финляндия теперь является официальным членом Континентальной Антанты, альянса, возглавляемого Францией. Хотя это и демонстрирует отказ от нейтралитета, мы надеемся, что этот новый союз будет в основном положительным для финской нации." # Our diplomatic mission to Paris has bore fruits. Today, we acquired a telegram detailing the news that Finland now is an official member of the Continental Entente, the alliance headed by France. While this demonstrates a break from neutrality, we hope this new alliance will be mostly positive for the Finnish nation.
 finland.136.a: "Какая честь!" # What an Honour!

 finland.137.t: "Французы отвергают нас в своем союзе" # The French Reject us Into Their Alliance
 finland.137.d: "Наша дипломатическая миссия в Париж вернулась с пустыми руками. Сегодня мы получили потрясающую новость о том, что Франция отказалась от членства Финляндии в своем альянсе, Континентальной Антанте. Хотя это и является неудачей, мы надеемся, что она будет временной." # Our diplomatic mission to Paris has returned empty-handed. Today, we received the earth-shattering news that France has rejected Finland's membership into their alliance, the Continental Entente. While this is a setback, we hope that it will be a temporary one.
 finland.137.a: "Это будет их потеря" # That Will Be Their Loss

 finland.138.t: "Финляндия обратилась к нам с просьбой провести референдум на Аландских островах" # Finland Petition us to Hold a Referendum on Åland
 finland.138.d: "Финские дипломаты связались с нами, пытаясь ходатайствовать о проведении референдума на Аландских островах. Финские делегаты утверждают, что мы должны дать людям это решение, поскольку мы отняли его, когда оккупировали Аландские острова. В Швеции к этому относятся неоднозначно. Некоторые шведские националисты поддерживают его, поскольку он может показать, насколько жители Аландских островов поддерживают возможность быть частью Швеции, в то время как другие отвергают его, рассматривая это как подчинение давлению Финляндии. От нас зависит, что мы будем делать." # Finnish diplomats have contacted us, trying to petition us to hold a referendum on Åland. The Finnish delegates argues that we should give the people that decision since we took it away when we occupied Åland. In Sweden, there are mixed feelings about this. Some Swedish nationalists support it, since it can show how supportive the people of Åland is to be a part of Sweden, while others reject it, seeing it as kowtowing to Finnish pressure. It is up to us what we are going to do.
 finland.138.a: "Референдум! Мы выиграем легко!" # Referendum! We Will Win it Easily!
 finland.138.b: "Мы не можем дать им шанс" # We Can't Give Them the Chance

 finland.139.t: "Швеция согласилась провести референдум" # Sweden Accept Holding a Referendum
 finland.139.d: "Хорошие новости пришли от наших шведских соседей. Они позволили провести референдум на Аландских островах. Хотя это шаг к тому, чтобы мы вернули себе землю, предстоит еще много работы. Хотя на островах есть те, кто нас поддерживает, большинство на островах настроено прошведски. У нас есть шанс использовать наше влияние, чтобы направить референдум в нашу сторону, но нам лучше его использовать." # Good news have arrived from our Swedish neighbors. They have allowed the referendum to hold place on the Åland islands. While this is a step in the direction of us regaining the land, there are still a lot of work left to do. While there are those on the islands supporting us, a majority on the islands are pro-Sweden. There is a chance for us to use our influence to steer the referendum in our direction, but we better use it.
 finland.139.a: "Теперь работа начинается" # Now, the Work Begins

 finland.140.t: "Швеция отказалась от проведения референдума" # Sweden Reject Holding a Referendum
 finland.140.d: "Плохие новости пришли от наших шведских соседей. Они отклонили референдум о проведении на Аландских островах, сославшись на тот факт, что люди там не недовольны тем, что являются частью Швеции. Мы видим, что они боятся потерять эти острова, и мы продолжим претендовать на них." # Bad news have arrived from our Swedish neighbors. They have rejected the referendum to hold place on the Åland islands, citing the fact that the people there are not unhappy of being a part of Sweden. We can see that they are afraid of losing these islands, and we will continue to stake our claim on them.
 finland.140.a: "Они боятся потерять это" # They Are Afraid to Lose It

 finland.141.t: "Победа Швеции на референдуме!" # Swedish Victory in the Referendum!
 finland.141.d: "К сожалению для нас, Швеция выиграла референдум на Аландских островах. Для нас это вызывает небольшое смущение. Хотя для нас это большое разочарование, нам нужно хотя бы признать этот результат и двигаться дальше." # Sadly for us, Sweden have won the referendum on the Åland islands. This comes as a slight embarrasment for us. While it is a big disappointment for us, we need to at least recognize this result and move on.
 finland.141.a: "У нас был шанс" # We Had Our Chance

 finland.142.d: "Когда стали известны результаты референдума на Аландских островах, мы были обеспокоены тем, что он закончится победой Финляндии. Теперь, когда подсчет голосов завершен, стало ясно, что победа неизбежна. После объявления явной победы Швеции шведские флаги еще немного развевались над нашей страной, включая Аландские острова. Сегодня праздник продлится до рассвета, ведь Аланды – шведские!" # As the result of the Åland referendum ticked in, we were worried that it would end in a Finnish victory. Now, with the counting finishing up, it is clear that victory is certain. With a clear Swedish victory being declared, Swedish flags waved an extra bit over our country, Åland included. Today, the celebration will last until dawn, because Åland is Swedish!
 finland.142.a: "Аландские острова – шведы!" # Åland är Svenska!

 finland.143.t: "Неопределенный результат референдума!" # Uncertain Result in the Referendum!
 finland.143.d: "Судя по завершению референдума, результат будет очень близким. В условиях этой неопределенности существует реальный страх, что результат будет настолько близким, что его можно будет подделать. Даже если шведы заверили нас в своей справедливости, у нас все равно есть опасения." # With the referendum finishing up, it looks like the result is going to be very close. With this uncertainty, there are a real fear that the result will be so close that it can be tampered with. Even if the Swedes have assured us that they are fair, we still have our worries.
 finland.143.a: "Результат может быть очень близким" # The Result Might be Very Close

 finland.144.d: "Судя по завершению референдума, результат будет очень близким. Хотя мы подсчитываем каждый поданный голос, он настолько близок, что при желании мы могли бы повлиять на результат. Это беспокоит некоторых финнов. Мы должны заверить их, что останемся справедливыми, независимо от того, каким будет результат." # With the referendum finishing up, it looks like the result is going to be very close. While we are counting every vote cast, it is so close that if we wanted to we could affect the result. That is a worry some Finns have. We should assure them that we will remain fair, regardless what the outcome will be.

 finland.145.t: "Победа Финляндии на референдуме!" # Finnish Victory in the Referendum!
 finland.145.d: "Когда начались результаты референдума на Аландских островах, мы боялись, что шведы так легко победят. К счастью, кампания, похоже, оправдала себя, поскольку результат показывает победу Финляндии, несмотря на то, что острова населены шведскоязычным населением. По нашей стране и на Аландских островах развевались финские и финно-шведские флаги. Сегодня действительно праздник!" # As the result of the Åland referendum ticked in, we were afraid that the Swedes would win this easily. Luckly, the campaign seems to have paid of, as the result shows a Finnish victory, despite the islands being inhabited by Swedish speakers. Finnish and Finno-Swede flags have waved through our country and on the Åland islands. Today, it is truly a day to celebrate!
 finland.145.a: "Аландские острова – шведы!" # Ahvenanmaa on Ruotsalainen!

 finland.146.d: "К нашему сожалению, Финляндия выиграла референдум на Аландских островах. Для нас это вызывает небольшое смущение. Хотя для нас это большое разочарование, нам нужно хотя бы признать этот результат и двигаться дальше." # Sadly for us, Finland have won the referendum on the Åland islands. This comes as a slight embarrasment for us. While it is a big disappointment for us, we need to at least recognize this result and move on.
 finland.146.a: "Это не хорошо" # That's Not Good

 finland.147.t: "Подсчет завершается" # The Counting Finishes Up
 finland.147.d: "После нескольких дней подсчета и двойного подсчета голосов, поданных на референдуме, мы наконец начали видеть вырисовывающуюся картину. Мы уже готовы направить письмо финнам с указанием результата. И цифры, которые мы имеем с Аландских островов, показывают..." # After days counting and double-counting the votes that has been cast in the referendum, we have finally begun to see a picture emerging. Already, we are ready to forward a letter to the Finns revealing the result. And the numbers that we have from Åland reveals...
 finland.147.a: "Близкая шведская победа" # A Close Swedish Victory
 finland.147.b: "Близкая финская победа" # A Close Finnish Victory

 finland.148.d: "К сожалению для нас, Швеция выиграла референдум на Аландских островах. Для нас это вызывает небольшое смущение. Хотя для нас это большое разочарование, нам нужно хотя бы признать этот результат и двигаться дальше. Из-за того, насколько близок был референдум, многие финские националисты не пойдут дальше. Вместо этого они утверждают, что шведы обманули. Хотя на данный момент у нас все решено, мы не знаем, возникнет ли этот вопрос снова в будущем." # Sadly for us, Sweden have won the referendum on the Åland islands. This comes as a slight embarrasment for us. While it is a big disappointment for us, we need to at least recognize this result and move on. Because of how close the referendum was, many Finnish nationalists will not move on. Instead, they claim that the Swedes have cheated. While we issue are laid at peace for now, we don't know if the question will reappear in the future.

 finland.149.d: "Когда начались результаты референдума на Аландских островах, мы боялись, что шведы так легко победят. К счастью, кампания, похоже, оправдала себя, поскольку результат показывает близкую победу финнов, несмотря на то, что острова населены шведскоязычным населением. По нашей стране и на Аландских островах развевались финские и финно-шведские флаги. Сегодня действительно праздник!" # As the result of the Åland referendum ticked in, we were afraid that the Swedes would win this easily. Luckly, the campaign seems to have paid of, as the result shows a close Finnish victory, despite the islands being inhabited by Swedish speakers. Finnish and Finno-Swede flags have waved through our country and on the Åland islands. Today, it is truly a day to celebrate!

 finland.150.t: "Аландское соглашение" # The Åland Agreement
 finland.150.d: ""
 finland.150.a: "Добро пожаловать домой, Аландские острова" # Welcome Home, Ahvenanmaa
 finland.151.t: "[FROM.GetNameDef] запрашивает вход в [ROOT.GetFactionName]" # [FROM.GetNameDef] Requests Entry to [ROOT.GetFactionName]
 finland.151.d: "Дипломаты [FROM.GetAdjective] связались с нами и попросили доступ в [ROOT.GetFactionName]. [FROM.GetNameDef] решил объявить войну [SOV.GetNameDef] и поэтому хочет присоединиться к нашему альянсу." # [FROM.GetAdjective] diplomats have reached us asking entry to [ROOT.GetFactionName]. [FROM.GetNameDef] decided to declare war to [SOV.GetNameDef], and thus they want to join our alliance.
 finland.151.a: "Конечно, нам всегда хочется больше друзей!" # Sure, we always want more friends!
 finland.151.b: "Нет" # No
 finland.152.t: "[FROM.GetNameDef] принял наш запрос на вступление в [FROM.GetFactionName]." # [FROM.GetNameDef] accepted our request to join the [FROM.GetFactionName]
 finland.152.d: ""
 finland.152.a: "Радуйтесь" # Rejoice
 finland.153.t: "[FROM.GetNameDef] отклонил нашу просьбу присоединиться к [FROM.GetFactionName]." # [FROM.GetNameDef] rejected our request to join the [FROM.GetFactionName]
 finland.153.d: ""
 finland.153.a: "Будь они прокляты!" # Damn them
 finland.154.t: "Должны ли мы присоединиться к [GER.GetFactionName]?" # Should we join [GER.GetFactionName]?
 finland.154.d: "После того, как мы объявили войну [SOV.GetNameDefCap], а [GER.GetNameDefCap] тоже, вполне логично, что мы хотим присоединиться к [GER.GetFactionName], не так ли?" # After we declared war to [SOV.GetNameDefCap], while [GER.GetNameDefCap] did too, it's only logical that we want to join the [GER.GetFactionName], should we?
 finland.154.a: "Конечно, мы должны!" # Of course we should!
 finland.154.b: "Нет" # No
 finland.155.t: "[FROM.GetNameDefCap] решает передать нам заявленные состояния!" # [FROM.GetNameDefCap] decides to transfer us our claimed states!
 finland.155.d: "После того, как [FROM.GetFactionName] выиграли войну с [SOV.GetNameDefCap], они решили передать нам заявленные нами государства в Карелии. [FIN.GetLeader] пожал руку [GER.GetLeader] после того, как соглашение было принято." # After the [FROM.GetFactionName] won the war against [SOV.GetNameDefCap], they decided to transfer to us our claimed states in Karelia. [FIN.GetLeader] handshaked [GER.GetLeader], after the agreement had been accepted.
 finland.155.a: "Тост за наших друзей [FROM.GetAdjective]!" # A toast to our [FROM.GetAdjective] friends!

