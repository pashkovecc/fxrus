 FIN_conquer_finnish_interior_idea_desc: "Более 70% территории страны находится в аграрном секторе экономики, а страна в целом слабо индустриализирована. Это серьёзно сдерживает нашу производительность и отставание на мировой арене." # Over 70% of the country is in the Agrarian sector of the economy, and the country as a whole is poorly industrialized. This seriously hinders our output and lagging behind on the world stage.
