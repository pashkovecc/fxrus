 FIN_punainen_maapera: "Красная почва" # Punainen Maaperä
 FIN_punainen_maapera_desc: "Социал-демократам и аграриям удалось сформировать коалиционное правительство после распада правоцентристской правительственной коалиции. В воздухе витает уверенность, что мы сможем спасти Финляндию от экономических трудностей и устранить политический разрыв между левыми и правыми." # The Social Democrats and the Agrarians have managed to form a coalition government in the aftermath of the collapse of the centre-right government coalition. There is confidence in the air that we will be able to rescue Finland from economic hardships and heal the political divide between left and right.
