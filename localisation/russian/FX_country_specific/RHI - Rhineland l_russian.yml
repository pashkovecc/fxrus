 RHI_rohr_ag_mio_desc: "$rohr_ag_RHI_MIO$\n§L$rohr_ag_desc$§!\n"
 rohr_ag_RHI_MIO: "Cutting-Edge Automotive Manufacturer"
 rohr_ag_desc: "Formed by Hans Gustav Röhr together with German industrialist Hugo Greffenius in 1926, Röhr Auto AG started as a civilian automobile company, manufacturing cutting-edge passenger cars for export to France and the Reich. Initially presenting cutting-edge designs which gained recognition in Paris and Berlin, Röhr Auto experienced a downturn in revenue during the later '20s and into the Great Depression.\n\nWhen the Valkists assumed power in Germany, however, Röhr Auto experienced a rapid influx of capital and talent as many Germans fled into the French-occupied Rhineland. Today, Röhr Auto AG exists as one of the Rhine's strongest domestic manufacturing companies, with a wide variety of locally-designed and foreign-licensed cars and trucks under manufacture."
  
