 RHI_baumer_aero_parachutes: "Bäumer-Patentfallschirm"
 baumer_aero_upgrade_3_2_tt: "§LIts inspiration began with Paul Bäumer's experience as one of the first ever pilots to be saved by parachute deployment after he was shot down flying for the Fliegercorps in 1918. The "Bäumer Patent Parachute" designed by Bäumer Aero incorporates a safer, more user-friendly construction which is designed with survival rate in mind.§!"
