 # the luftwaffe!! 
 RHI_rheinish_luftwaffe: "Рейнское Люфтваффе"
 RHI_rheinish_luftwaffe_desc: "С момента образования независимого Рейна вопросы обороны спонсировались союзными войсками. Неудивительно, что и наши военно-воздушные силы основаны на опыте французских и британских летчиков. Межсоюзнические инструкторы сформировали небольшие силы, состоящие из устаревших самолетов Антанты и захваченных немецких самолетов. Очевидно, что в случае вторжения наши силы будут играть лишь небольшую вспомогательную роль, но даже для этой задачи они, похоже, не готовы."
  
 RHI_anti_aircraft_batteries: "Зенитные батареи"
 RHI_anti_aircraft_batteries_desc: "Разместив зенитные батареи по всей стране, мы сможем обеспечить защиту и безопасность воздушного пространства над Рейном от любых вражеских самолетов, нацеленных на нашу промышленность и население."
  
 RHI_air_supermacy_doctraine: "Взять контроль над небом"
 RHI_air_supermacy_doctraine_desc: "Для того чтобы выдержать вторжение, оперативный контроль над воздушным пространством имеет первостепенное значение. Предоставление немцам превосходства в истребительной авиации означает неизбежное разрушение мостов через Рейн и, как следствие, окружение наших союзников на восточном берегу."
  
 RHI_adopt_ground_support_doctrine: "Доктрина наземной поддержки"
 RHI_adopt_ground_support_doctrine_desc: "Совершенно очевидно, что в случае вторжения наши немногочисленные бойцы не будут иметь никаких шансов против немцев. Поэтому мы должны сосредоточить свои усилия на поддержке союзников целенаправленными наземными атаками: не дав немцам времени на восстановление и перегруппировку, мы остановим их наступление."
  
 RHI_adopt_light_fighter_doctrine: "Воздушные бои над Рейном"
 RHI_adopt_light_fighter_doctrine_desc: "Сосредоточившись на производстве высококачественных истребителей для поражения и перехвата других летательных аппаратов, мы можем обеспечить безопасность наших пилотов и воздушного пространства для противодействия вражеским воздушным силам в наших или их воздушных районах."
  
 RHI_expand_pilot_training: "Расширить обучение пилотов"
 RHI_expand_pilot_training_desc: "Подобно тому, как винтовка бесполезна, если ею владеет идиот, наши гораздо более дорогие самолеты должны получать больше хорошо подготовленных пилотов, чтобы обеспечить максимально эффективное использование потенциала самого самолета."
  
 RHI_interessengemeinschaft_flugsport: "Усилить интерес к авиации"
 RHI_interessengemeinschaft_flugsport_desc: "«Группа по интересам в области авиационных видов спорта» — это летная школа недалеко от Майнца, где учились летать такие люди, как Антони Фоккер. Как частная ассоциация, она сама по себе не имеет военного значения, но является хорошим способом поиска и вербовки начинающих летчиков в рейнские Люфтваффе. Если мы хотим развивать местные таланты и сделать наши силы по-настоящему рейнскими, нам следует инвестировать в летную школу и расширять ее ресурсы."
  
 RHI_buy_french_surplus: "Купить французские излишки"
 RHI_buy_french_surplus_desc: "Благодаря нашим непосредственным связям с Францией, нам несложно запросить у них несколько старых самолетов. В конце концов, пару лет назад наши силы почти полностью состояли из их устаревших бипланов времен Второй мировой войны. Поэтому запросить у них относительно новые, устаревшие самолеты сейчас не составит труда, учитывая, что их новые модели уже производятся."
  
 RHI_copy_dive_bombers: "Скопировать пикирующие бомбардировщики"
 RHI_copy_dive_bombers_desc: "Военные игры и промышленные авиашоу показали, что французы разработали мощную летающую артиллерию. Их выдающееся качество невозможно воспроизвести с помощью нашего ограниченного бюджета на НИОКР, поэтому нам следует просто скопировать французские разработки. В конце концов, зачем нам тратить ресурсы на проект, который уже доведен до совершенства, когда наша оборона имеет недостатки во многих других важных областях?"
  
 RHI_buy_brit_surplus: "Купить британские излишки"
 RHI_buy_brit_surplus_desc: "В ходе недавних военных учений наши атташе были поражены тем, каких поразительных успехов добилась британская авиационная промышленность за эти годы. Теперь, когда мы можем быть уверены, что их запасы более ранних разработок будут лишь пылиться на складах, вполне возможно, что мы попросим их поддержать наши собственные вооруженные силы."
  
 RHI_research_better_engine_blocks: "Инвестировать в двигатели"
 RHI_research_better_engine_blocks_desc: "Британский Hawker Hurricane — один из самых надежных самолетов на сегодняшний день. Во многом это заслуга его эффективного двигателя Rolls-Royce-Merlin. Если мы хотим достичь аналогичного уровня надежности и экономичности самолетов, нам следует предоставить нашим автомобильным компаниям больше экономических стимулов для разработки двигателей, которые также легко ремонтируются."
  
 RHI_research_improved_equipment: "Спонсировать развитие авиации"
 RHI_research_improved_equipment_desc: "Нынешнее состояние наших военно-воздушных сил неприемлемо и не позволяет вести настоящую войну в небе. Наши экономисты говорят, что, направив больше средств в авиационную промышленность, мы сможем быстрее разрабатывать более совершенные самолеты. Имея значительные средства для расходования и инвестиций, мы должны увеличить финансирование нашего авиационного производства и развития потенциала!"
  
 RHI_fund_bunkers: "Построить бункеры"
 RHI_fund_bunkers_desc: "Мы должны взглянуть правде в глаза: нашей армии может оказаться недостаточно, чтобы предотвратить войну на наших землях. Поэтому нам необходимо инвестировать в оборонительные укрепления на случай, если это произойдет, иначе мы дадим врагу полную свободу действий для ведения войны на наших землях, где ему заблагорассудится."
  
 RHI_research_armored_trains: "Защита поездов"
 RHI_research_armored_trains_desc: "В преддверии надвигающейся войны мы осознали, что логистика является важным аспектом ведения боевых действий. К сожалению, это означает, что наши враги, скорее всего, будут атаковать наши линии снабжения, как и наши поезда. Мы должны обеспечить, чтобы наши поезда выдержали грядущий натиск и доставили нашим солдатам столь необходимые припасы, если война когда-нибудь начнётся."
  
 RHI_expand_the_flliegerhorste: "Расширить авиабазы"
 RHI_expand_the_flliegerhorste_desc: "Наши нынешние авиабазы ​​слишком малы и их слишком мало, чтобы эффективно использовать постоянно растущие военно-воздушные силы. Необходимость в новых, более крупных авиабазах уже определена и подтверждена. Нам следует мобилизовать наших инженеров для реконструкции существующих авиабаз и подготовки полос земли для новых баз."
  
 RHI_standardize_luftwaffe: "Стандартизировать Люфтваффе"
 RHI_standardize_luftwaffe_desc: "Нам необходимо стандартизированное оборудование, оборудование, которое мы сможем производить в огромных масштабах, чтобы гарантировать господство наших военно-воздушных сил в небе; иначе мы окажемся в безнадежной ситуации постоянной модернизации нашего оборудования."
  
 RHI_specialize_luftwaffe: "Элитные истребители"
 RHI_specialize_luftwaffe_desc: "Как показывают конфликты по всему миру, в воздушных боях зачастую большее значение имеет пилот, чем сам самолет. Нам необходимо продвигать программы, которые повышают опыт рядового солдата в ведении воздушной войны во всех аспектах. Постоянно обучая наших пилотов, мы можем гарантировать, что каждый человек, каждый самолет и каждый снаряд, отправленные на войну в небе, будут использованы максимально эффективно."
  
 RHI_train_paratroppers: "Создать воздушно-десантные силы"
 RHI_train_paratroppers_desc: "Если что-то и сделали валькисты правильно, так это создали возднушно-десантные силы. Наблюдать за тем, как эти храбрые люди десантируются на вражеские позиции, всегда было для нас захватывающим зрелищем, и настало время возродить её."
  
 RHI_begin_fighter_mass_production: "Массовость истребителей"
 RHI_begin_fighter_mass_production_desc: "Наши военные аналитики отмечали, что для господства в небе необходимо заполнить воздушное пространство истребителями, чтобы обеспечить постоянное прикрытие и численное превосходство. Мы должны переналадить работу наших заводов для производства большего количества образцов истребителей, чтобы противостоять, преодолевать и доминировать над военно-воздушными силами противника."
  
 ## economy tree 
 RHI_revival_of_economy: "Оживить экономику"
 RHI_revival_of_economy_desc: "Наша экономика уже некоторое время находится в состоянии стагнации, и это начинает вести к депрессии. Мы должны предотвратить такой сценарий, предоставляя возможности для национальных и международных бизнесменов, чтобы наша страна могла инвестировать и возобновить экономический рост."
  
 RHI_refund_the_rwe: "Поддержка RWE AG"
 RHI_refund_the_rwe_desc: "После слияния RWE и RAG добыча угля в Руре практически монополизирована одной компанией. Из-за этого свободный рынок не может предложить наилучшую цену; достаточно простого разговора с советом директоров, чтобы согласовать детали сделки. Это соглашение позволит разработать наиболее экономически эффективный план для правительства и сохранить государственные контракты, субсидии и налоговые льготы для RWE."
  
 RHI_continue_electrification: "Продолжить электрификацию"
 RHI_continue_electrification_desc: "Благодаря помощи нашего доброго друга из RWE мы можем решать задачи электрификации как никогда раньше. Современные угольные электростанции, такие как Fortuna I и II, обеспечили Кёльну доступ к дешевой электроэнергии — формула, легко воспроизводимая в других крупных городах вдоль Рейна. Электрификация сельских городов займет немного больше времени, поскольку транспортировка угля по Рейну — самый простой способ обеспечить стабильные поставки топлива."
  
 RHI_expand_resource_extractions: "Расширение добычи ресурсов"
 RHI_expand_resource_extractions_desc: "Процветание Рейнско-Рурского региона обусловлено наличием крупной судоходной реки в сочетании с богатыми месторождениями руды и угля поблизости. Вполне логично увеличить финансирование геологоразведочных компаний, занимающихся изучением новых потенциальных месторождений, и предоставить компаниям RWE и Thyssen-Krupp дешевые права на добычу полезных ископаемых."
  
 RHI_support_local_manfacturing_businesses: "Поддержать местное производство"
 RHI_support_local_manfacturing_businesses_desc: "Профессии инженеров, колесников, плотников, мыловаров или мельников составляют промышленную основу нашей экономики. Недавно процветающий «средний бизнес» (Mittelstand) дал волю совершенно новому классу рабочих. Теперь им больше не нужно делить двухъярусные кровати с коллегами, а можно позволить себе содержать семью собственным трудом – это новая тенденция."
  
 RHI_social_security_programme: "Система социального обеспечения"
 RHI_social_security_programme_desc: "Система социального обеспечения может обеспечить большую экономическую безопасность и рост как для отдельного человека, так и для государства. Поэтому создание Национальной организации социального обеспечения является первоочередной задачей, если мы хотим сделать людей счастливыми и увеличить их число."
  
 RHI_print_rhenishe_mark: "Рейнская марка"
 RHI_print_rhenishe_mark_desc: "Для того чтобы утвердить свою финансовую независимость от Парижа и Лондона, нам понадобится новая валюта, обеспеченная центральным банком."
  
 RHI_nationalize_coal_industry: "Защитим наш уголь"
 RHI_nationalize_coal_industry_desc: "Французы первоначально оккупировали Саарскую область по одной причине: из-за угля. Уголь является дефицитным ресурсом во французской промышленности, и Первая мировая война показала, что французская военная машина в значительной степени зависит от угля — будь то для поездов, отопления или производства материалов. Национализация угольных шахт — тема для обсуждения, однако мы должны убедиться, что Рейнская область стоит на первом месте. Мы должны дать понять французам, что, даже будучи союзниками, они все равно должны платить как иностранцы."
  
 RHI_support_local_arms_manfacturing: "Наращивание вооружения"
 RHI_support_local_arms_manfacturing_desc: "В случае масштабного конфликта крайне важно иметь достаточные запасы оружия, чтобы обеспечить каждого солдата оружием, а каждое подразделение — десятками грузовиков. Поэтому мы должны поощрять военную промышленность к наращиванию производства путем строительства новых заводов и оказания ей помощи в исследованиях."
  
 RHI_use_kaiserreich_knowledge: "Привлечения иностранных экспертов"
 RHI_use_kaiserreich_knowledge_desc: "Хотя Рейнская область — это край изобретательности и инноваций, нам по-прежнему не хватает опытных кадров, чтобы наши исследовательские возможности действительно соответствовали необходимым стандартам. Однако наше положение одной из свободных немецких земель предоставило нам возможность использовать жизненно важные знания, которые переселились в более свободную страну, тем самым улучшив наши технологические возможности."
  
 RHI_build_the_schnellstrassen: "Построить «Шнельштрассен»"
 RHI_build_the_schnellstrassen_desc: "Такие проекты, как «Автобан» в валькистской Германии, вызывают огромную зависть у наших политиков и народа. Пришло время предоставить автомобилистам Рейна равные возможности с нашими братьями на востоке. Министерство транспорта предложило «Закон о скоростных автомагистралях», чтобы устранить это неравенство. Две трассы с севера на юг и три с востока на запад сделают наши автомагистрали связующим звеном между Восточной и Западной Европой."
  
 RHI_christian_socialism: "Отвергнуть бесчеловечный капитализм"
 RHI_christian_socialism_desc: "Капитализм вывел многие страны из аграрного феодального общества в эпоху современности и индустриализации. Однако слишком часто это причиняет вред тем, кому нечего терять, сосредотачиваясь на эксплуатации личности до предела, а затем выбрасывая её, как крошки с тарелки. Мы выше этого варварства, мы не будем играть роль безжалостных угнетателей, вместо этого мы будем играть роль защитников народа."
  
 RHI_social_market_economy: "Социальная рыночная экономика"
 RHI_social_market_economy_desc: "Отказ от монополистических последствий капитализма означает обращение рейнского капитализма к потребностям народа. Задача правительства будет заключаться в том, чтобы направлять свободный рынок на благо благосостояния каждого. Создание социального государства и укрепление бизнеса среднего класса станут нашими главными приоритетами."
  
 RHI_establish_the_betriebsrat: "Формирование Бетрибсратов"
 RHI_establish_the_betriebsrat_desc: "Для более эффективного удовлетворения непосредственных потребностей сотрудников мы обязуемся создавать в компаниях советы по управлению человеческими ресурсами. Эти советы будут избираться демократическим путем внутри компаний и представлять интересы работников при переговорах с работодателями. В отличие от профсоюзов, эти органы гораздо более разрознены, не имея возможности проводить забастовки по всей стране, но обладая достаточным количеством прямых действий для удовлетворения потребностей пролетариата."
  
 RHI_establish_central_bank: "Основать Центральный банк"
 RHI_establish_central_bank_desc: "Создание центрального банка имеет решающее значение для поддержания экономической стабильности и содействия устойчивому росту, обеспечивая стабильную валюту и эффективные платежные системы; центральный банк повысит доверие инвесторов и населения, что крайне важно для экономического процветания. Его роль в обеспечении экономической стабильности незаменима для национального роста и процветания"
  
 RHI_look_towards_britain_and_lowlands: "Наши северные соседи"
 RHI_look_towards_britain_and_lowlands_desc: "Из всех стран Европы Великобритания, безусловно, является самой сильной. Дополнительным доказательством этого являются здоровые отношения, которые она смогла установить со странами Бенилюкса. Мы могли бы начать новые отношения с Великобританией, чтобы помочь нам в наших проблемах, особенно как демократическая страна."
  
 RHI_negotiate_with_american_investors: "Переговоры с Уолл-стрит"
 RHI_negotiate_with_american_investors_desc: "Уолл-стрит — это крупнейшая в мире фондовая биржа. Это может оказаться благом для нашего штата, особенно учитывая заинтересованность американцев в демократической стране, подобной нашей. Пришло время обратиться за помощью к крупнейшей республике Западного полушария, которая находится на передовой демократии."
  
 RHI_negotiate_british_arms_deal: "Привлечь британскую помощь"
 RHI_negotiate_british_arms_deal_desc: "Французы — не единственные, кто может помочь нам в восстановлении нашей страны. Великобритания может помочь нам во многих отношениях: в строительстве, торговых сделках и, что наиболее важно, в производстве вооружений. Они не имеют себе равных, когда дело доходит до создания военной техники. Если мы сможем завоевать их расположение, то сможем вместе с ними построить нашу военную машину."
  
 RHI_clear_workers_slums: "Очистка трущоб"
 RHI_clear_workers_slums_desc: "Эти трущобы — не дома. Они построены настолько плохо, что не обеспечивают настоящего комфорта. Давайте снесем эти хижины и выплатим компенсацию рабочим, чтобы у них появилась возможность жить под лучшей крышей."
  
 RHI_modernize_rural_areas: "Модернизация сёл"
 RHI_modernize_rural_areas_desc: "Из-за привлекательности городов молодое поколение пренебрегает нашей скромной сельской местностью. Если мы покажем им, что их скромные жилища можно восстановить, они поймут, что их дома — это житницы страны."
  
 RHI_continue_french_economic_intergration: "Разумный выбор"
 RHI_continue_french_economic_intergration_desc: "Было бы глупо с нашей стороны прекратить французскую помощь. Мы решили возобновить с ними экономический договор и обеспечить процветание нашего Рейнланда."
  
 RHI_renegotiate_coal_shipments: "Пересмотреть поставки угля"
 RHI_renegotiate_coal_shipments_desc: "Рейнская область десятилетиями славилась своими запасами угля и умеренно эксплуатировалась Германской империей. Однако после поражения в Первой мировой войне добыча и разведка угля были приостановлены. По сути, оккупация союзников запретила экспорт угля в Германию, что, в свою очередь, привело к сокращению инвестиций. Если бы мы смогли заключить торговое соглашение с Францией и странами Бенилюкса, наша «угольная промышленность» наверняка бы сбалансировала текущий торговый дефицит и создала рабочие места."
  
 RHI_franco_rheinish_economic_union: "Укрепление взаимного сотрудничества"
 RHI_franco_rheinish_economic_union_desc: "Укрепление экономического сотрудничества — единственный способ по-настоящему оправиться от «Черной среды». Парижу нужны уголь и сталь, нам нужны инвестиции. Наши два государства должны развиваться вместе."
  
 RHI_begin_austerity_programmes: "Начать жесткую экономию"
 RHI_begin_austerity_programmes_desc: "Лондонский кризис особенно сильно ударил по нашей экономике, поскольку британские инвесторы практически полностью ушли из страны. Нам необходимо сбалансировать бюджет, чтобы выжить. "
  
 RHI_stop_state_investment: "Прекратить госинвестиции"
 RHI_stop_state_investment_desc: "Для сбалансирования бюджета необходимо принять радикальные меры. Министрам правительства поручено выявить ненужные инвестиции и сократить их финансирование. Практически каждый сектор будет тщательно проверен и сокращен до минимума, необходимого для поддержания функционирования государства. Наибольший удар придется на инфраструктуру, образование, НИОКР, жилищное строительство и вооруженные силы, что, вероятно, приведет к резкому росту безработицы. В краткосрочной перспективе это обеспечит финансовую гибкость для нашего кабинета министров, но может привести к непредвиденным структурным дефицитам в последующие годы."
  
 RHI_begin_rationing_supplies: "Ввести нормирование"
 RHI_begin_rationing_supplies_desc: "В случае войны, можно с уверенностью предположить, что запасы продовольствия необходимо будет сохранять, и, что еще важнее, распределять их по пайкам. Не стоит ждать начала войны, нужно использовать её как базовую подготовку для армии. Мы никогда не знаем, когда враг нанесет удар, поэтому нам необходимо обеспечить наших солдат и людей продовольствием. Хотя бы немного."
  
 RHI_court_auction_failling_assets: "Обесцененные судебные активы"
 RHI_court_auction_failling_assets_desc: "Многие государственные программы за последние несколько лет практически не демонстрируют роста использования и прибыльности. Эти несущественные расходы — верный способ высвободить денежные средства, просто продавая их на аукционах и передавая в руки свободного рынка. Такие услуги, как общественный транспорт и вывоз мусора, а также государственные фермы и электростанции, которые и до обвала фондового рынка находились в стагнации, являются привлекательными способами диверсификации для крупных компаний. В основном потому, что мы продаем их за ничтожную долю от их реальной стоимости."
  
 RHI_begin_public_work_intiatives: "Начать общественные работы"
 RHI_begin_public_work_intiatives_desc: "Наши государственные службы находятся в плачевном состоянии. Прекращение инвестиций после начала Первой мировой войны и последующая халатность привели к тому, что школы, ратуши, спортивные сооружения и общественный транспорт пришли в упадок. Все эти сектора нуждаются в обновлении, и если мы хотим, чтобы государство функционировало в долгосрочной перспективе, огромные инвестиции не подлежат обсуждению."
  
 RHI_fund_infrastructure: "Связать Рейн"
 RHI_fund_infrastructure_desc: "Артерии нашей промышленности состоят из рек, автодорог и железнодорожных путей. Чтобы расширить производство, необходимо обновить инвестиции в эти направления. Для поддержки рабочих следует обеспечить доступный транспорт в города и из них. Заброшенные дороги и забытые пути будут модернизированы для расширения инфраструктурной сети. Наконец, судоходство получит поддержку за счёт строительства новых доков, мостов и соединения речных путей каналами."
  
 RHI_modernize_industrial_parks: "Модернизировать промышленность"
 RHI_modernize_industrial_parks_desc: "Хотя рейнская промышленность довольно развита, она далеко не во всех отношениях современна. Эти старые машины снижают эффективность и, что более важно, прибыль. Модернизация должна происходить постепенно, иначе Рейнская область продолжит терять темпы развития, а её промышленный регион станет пережитком прошлого."
  
 RHI_expand_the_rheinishe_eisenbahn: "Расширить железные дороги"
 RHI_expand_the_rheinishe_eisenbahn_desc: "Рейнская железнодорожная сеть является основой нашей инфраструктуры и соединяет наши промышленные центры. Однако она устарела и могла бы быть расширена для удовлетворения растущих потребностей нашей страны. Такой проект, безусловно, является масштабным начинанием, но он, несомненно, улучшит положение нашего государства."
  
 RHI_create_housing_intiatives: "Поощряйте жилищные инициативы."
 RHI_create_housing_intiatives_desc: "После войны и роста безработицы в годы кризиса доступное жилье стало проблемой в наших перенаселенных городах. Для решения этой проблемы мы можем начать строительство новых жилых комплексов с государственным жильем для тех, кто не может позволить себе обычные цены на жилье. Эта инициатива приветствуется как католиками, так и социал-демократами."
  
 RHI_create_the_arbeitsdienst: "Создать Арбайтсдинст"
 RHI_create_the_arbeitsdienst_desc: "Впереди нас ждет множество масштабных проектов, и нам потребуется рабочая сила, способная справиться с этими задачами. Поэтому нам следует создать рабочую службу и объединить многочисленные местные программы трудоустройства, уже существующие в стране. Эти программы не только обеспечат нас столь необходимой рабочей силой, но и помогут бороться с безработицей, а также отвлечь молодых людей от радикальных взглядов и дать им возможность заняться чем-то полезным. В целом, это хорошая инициатива."
  
 ## army tree 
 RHI_rhenish_army: "Стража на Рейне"
 RHI_rhenish_army_desc: "Наше государство расположено вдоль Рейна, в самом сердце Европы. Мы являемся точкой пересечения латинского и германского миров. С момента кровавого рождения нашей нации нам приходилось постоянно быть начеку, опасаясь тех, кто хотел прийти и повесить нас за измену, а также наших так называемых союзников, стремящихся еще больше ущемить наши права как свободных жителей Рейнланда. Для защиты нам нужны сильные, целеустремленные и способные люди, готовые защитить народ Рейна от всех, кто хочет снова нас поработить."
  
 RHI_joint_exercises_with_lowlands: "Совместные учения в низменностях"
 RHI_joint_exercises_with_lowlands_desc: "Важно, чтобы мы не становились чрезмерно зависимыми от Франции. Нидерландские равнины и Бельгия представляют для нас особый стратегический интерес, и мы являемся дружественными соседями со схожими целями. Нам следует стремиться к более тесному военному сотрудничеству и проведению учений с этими странами. Несомненно, наши вооруженные силы могли бы извлечь пользу друг от друга."
  
 RHI_contact_dissident_reichswehr_officers: "Контакт с диссидентами Рейхсвера"
 RHI_contact_dissident_reichswehr_officers_desc: "Рейхсвер обладает одним из лучших офицерских корпусов в Европе и является закаленной в боях силой, закаленной в пламени Первой мировой войны. Наши ополченцы могли бы многому научиться и значительно повысить свой профессионализм, если бы мы могли использовать их знания и опыт. К сожалению, однако, большая часть Рейхсвера встала на сторону Дресслера. Тем не менее, есть несколько диссидентов, которые вместе с Куртом фон Шлейхером были вынуждены уйти с власти. Мы должны разыскать этих людей и с распростертыми объятиями приветствовать всех тех, кто не желает служить интересам валькистской армии. Риск того стоит."
  
 RHI_invite_french_military_advisors: "Сотрудничать с Францией"
 RHI_invite_french_military_advisors_desc: "Как бы больно это ни было признать, мы не сможем выжить без Франции. Валькистская угроза слишком велика, чтобы наши небольшие силы могли противостоять ей в одиночку. Пришло время зарыть топор войны и искать взаимного сотрудничества. Хотя этот шаг, безусловно, будет непопулярен среди многих, откровенно экспансионистская внешняя политика Рейха уже убедила немало людей, особенно тех, кто подвергается политическим преследованиям, в том, что нам необходимо сформировать прочный союз с западными державами, если мы хотим выжить в ближайшие годы. На данный момент Франция — единственная, кто может предложить необходимую защиту. "
  
 RHI_joint_defence_strategy: "Стратегия совместной обороны"
 RHI_joint_defence_strategy_desc: "Хотя это и нежелательно, мы должны сблизиться с Западом и позволить нашей стране выступать в качестве базы операций Антанты, если хотим быть защищенными от Берлина в случае войны. Мы включим наши ополченческие силы и оборонительные позиции вдоль Рейна в военные планы Антанты. Кроме того, следует создать объединенное верховное командование, включив наши силы в оборонительные линии Антанты."
  
 RHI_use_reichswehr_old_surplus: "Задействовать излишки Рейхсвера"
 RHI_use_reichswehr_old_surplus_desc: "Разоружение Имперской армии и эвакуация Рейхсвера из Рейнланда привели к тому, что на территории Рейнланда осталось большое количество вооружения. Хотя оно несколько устарело, это оружие всё ещё вполне пригодно к использованию и может оказаться жизненно важным в нашем стремлении к профессионализации рейнских ополчений. Мы постараемся стандартизировать оборудование и методы обучения, используя эти полезные запасы, и, надеюсь, в ближайшем будущем сможем должным образом оснастить некоторые дивизии."
  
 RHI_knife_in_dressler_reich: "Удар в сердце Берлина"
 RHI_knife_in_dressler_reich_desc: "Наше стратегическое положение крайне ценно для западных союзников: мы угрожаем одному из самых богатых ресурсами промышленных центров Рейха и даём убежище любым диссидентам. Тайные операции можно проводить прямо из безопасного Кобленца, а рейнская граница стала одной из самых укреплённых и охраняемых в мире. Антанта знает о нашем стратегическом преимуществе, и мы можем использовать это в своих интересах."
 RHI_create_rhenish_officer_corp: "Рейнский офицерский корпус"
 RHI_create_rhenish_officer_corp_desc: "Создав официальный и организованный офицерский корпус, мы обеспечим грамотное командование на поле боя. Это поможет превратить разрозненные отряды ополчения, поддерживаемые Францией, в полноценную армию и снизить зависимость от французских военных специалистов. В состав корпуса должны войти люди с реальным опытом: мы привлекаем офицеров в отставке, политических диссидентов и местных лидеров."
 RHI_incorporate_schutztruppe: "Интеграция штурмовиков"
 RHI_incorporate_schutztruppe_desc: "Штурмовики с гордостью защищали наше молодое государство в трудную минуту, однако их политизированность и жестокие методы вызывают крайнее недовольство рейнского населения. Из-за последних событий нам необходимо создать новую армию, а готовность штурмовиков сражаться за Рейнланд делает их идеальной основой. Искоренив непокорные элементы, установив дисциплину и организовав при помощи французов стабильное снабжение и жалованье, мы пресечём их перегибы и сформируем боеспособную современную армию."
 RHI_trad_army: "Проверенный временем путь"
 RHI_trad_army_desc: "Великая война преподала нам немало уроков и показала, как ведётся современная война. Сосредоточившись на уже зарекомендовавших себя стратегиях, мы сможем обезопасить своё будущее в эти турбулентные времена. Подавляющая огневая мощь и эшелонированная оборона в сочетании с мобильной доктриной позволят нам противостоять любой угрозе."
 RHI_mobilize_forces: "Развитие маневренности"
 RHI_mobilize_forces_desc: "Нам нужна новая, современная армия. Великая война показала, насколько важна мобильность на поле боя. Мы не можем позволить себе увязнуть в окопной войне, поэтому сделаем ставку на небольшие моторизованные соединения, способные быстро разворачиваться и обходить превосходящего по численности противника. Для этого мы вложим значительные средства в расширение инфраструктуры, моторизацию войск и гибкие боевые доктрины."
 RHI_rhein_military_industry: "Собственный военпром"
 RHI_rhein_military_industry_desc: "Избавившись от зависимости от других, потенциально враждебных государств в сфере военного производства, мы гарантируем, что любой агрессор столкнётся с сильным Рейнландом. Мы расширим существующие предприятия и предоставим щедрые субсидии всему, что укрепляет обороноспособность страны. В такие времена милитаризация экономики становится вопросом выживания нации."
 RHI_modernize_equipment: "Модернизировать снаряжение"
 RHI_modernize_equipment_desc: "Наше нынешнее снаряжение состоит главным образом из старых запасов времён Великой войны и того, чем смогла поделиться французская армия. Нам явно не хватает передовых технологий. И если для простых отрядов ополчения, поддерживавших порядок, этого было достаточно, то для регулярной армии это смертный приговор. Старое вооружение выглядит скорее наполеоновским, чем современным. Если мы хотим противостоять соперникам, нам нужно развиваться или погибнуть. Растущая промышленность и западные союзники окажут нам в этом огромную помощь."
 RHI_swiss_militia: "Швейцарская модель"
 RHI_swiss_militia_desc: "Вооружённые силы Швейцарии, в отличие от профессиональной армии, строятся на основе ополчения: каждый гражданин призывного возраста обязан пройти службу. Учитывая подавляющее численное превосходство Берлина, мы должны быть готовы к тотальной борьбе, привлекающей весь рейнский народ. Доктрина национальной обороны швейцарцев может стать для нас отличным примером, и нам следует обратиться за военными консультациями к этому вооружённому нейтральному государству."
 RHI_citizen_support_mandate: "Мандат на поддержку обороны"
 RHI_citizen_support_mandate_desc: "Граждане будут обязаны оказывать содействие обороне страны всеми способами, которые государство сочтёт необходимыми. Это расширяет систему ополчения и включает вспомогательные функции: работу в сфере здравоохранения, военной промышленности и других обеспечивающих отраслях. Взамен каждый гражданин получает право на определённые льготы. Так формируется законодательная база для милитаризации экономики и всеобщей мобилизации на случай войны без нарушения личных прав граждан. Кроме того, это помешает богатым и влиятельным людям вывозить ценные ресурсы из страны."
 RHI_lower_recruit_age: "Снизить призывной возраст"
 RHI_lower_recruit_age_desc: "Нам придётся снизить призывной возраст, чтобы перекрыть нехватку людских ресурсов и сформировать боеспособную армию, способную сдерживать врага до прибытия союзников. Годные к службе юноши 16 лет смогут привлекаться к вспомогательным ролям, а с 17 лет — к участию в боевых действиях. Кроме того, мы разрешим женщинам служить на вспомогательных должностях. Хоть этот шаг и вызывает споры, он абсолютно необходим."
  
 RHI_anti_tank: "Противотанковое вооружение"
 RHI_anti_tank_desc: "Поскольку у нас нет ресурсов для создания полноценных танковых войск, следует сосредоточиться на повышении боеспособности пехотных отделений. Разработка противотанкового вооружения позволит нашей пехоте наконец противостоять стальным монстрам на поле боя."
 RHI_bicycle_troops: "Эксперименты с велосипедами и мотоциклами"
 RHI_bicycle_troops_desc: "Пока наши бельгийские и французские соседи исследуют военный потенциал велосипедов и мотоциклов, наше командование с интересом наблюдает за этими испытаниями. Двухколесный транспорт выглядит дешевой и перспективной альтернативой для повышения мобильности армии и компенсации дефицита грузовиков, а также отлично подходит для городской тактики ополчения."
 RHI_rhenish_line: "Рейнская линия"
 RHI_rhenish_line_desc: "Рейн — наша важнейшая линия обороны, ведь наша страна практически лишена стратегической глубины. Мы должны направить все фортификационные усилия на эту рубежную линию. Мы возьмём пример с линии Мажино, построенной нашими союзниками. Рейн станет нашим щитом против валькистского экспансионизма. Строительство обширной сети укреплений и бункеров уже началось."
 RHI_french_artillery: "Закупка французской артиллерии"
 RHI_french_artillery_desc: "Как бы нам ни хотелось полагаться на собственную военную промышленность, французы далеко продвинулись в этой области и обладают куда большими производственными мощностями. Нам следует закупить у них снаряжение и излишки со складов, чтобы обеспечить максимальную огневую мощь и закрыть текущий дефицит. Это значительно ускорит создание полноценного артиллерийского кулака."
 RHI_train_tank_force: "Подготовка танковых войск"
 RHI_train_tank_force_desc: "На фоне продолжающейся моторизации нам стоит инвестировать и в бронетанковый авангард, который возглавит пехоту и сможет противостоять вражеским танкам. Это небольшое элитное соединение будет закрывать бреши в нашей обороне и оперативно перебрасываться туда, где пехоте грозит поражение. Наша промышленность уже подготовила несколько эскизных проектов рейнских танков."
 RHI_tank_division_tt: "Мы развернём §Y1§! дивизию этого типа."
 RHI_thunder_on_rhein: "Гром над Рейном"
 RHI_thunder_on_rhein_desc: "Рейн укреплен артиллерией, зенитными орудиями и бункерами до самого горизонта, а наши танки готовы отразить любое вражеское вторжение. Щит и меч свободного Рейнланда готовы к бою."
 RHI_create_landwehren: "Создание Ландвера"
 RHI_create_landwehren_desc: "Организовав ополчение в местные группы сопротивления, мы сможем изматывать войска противника, если они прорвут нашу линию обороны и оккупируют наши земли, пока не прибудет поддержка с Запада. Это обеспечит некоторую глубину обороны и выиграет время. Кроме того, это сделает структуру нашего ополчения более организованной."
 RHI_incorporate_schutzbund: "Интеграция стрелковых союзов"
 RHI_incorporate_schutzbund_desc: "Стрелковые союзы (Schützenbünde) объединяют охотников, спортсменов и местных жителей, которые тренируются в стрельбе и проводят культурные праздники. Они могут стать важной частью не только местного патриотизма, но и нашей обороны от иностранного вторжения, ведь эти опытные стрелки станут идеальными резервистами."
 RHI_fund_luftschutz: "Финансирование Люфтшутцбунда"
 RHI_fund_luftschutz_desc: "Оказывая помощь гражданскому союзу противовоздушной обороны (Люфтшутцбунд), мы сможем более эффективно защитить Рейнланд от бомбардировок и налётов вражеской авиации. Знание того, что мы готовы к худшему и не являемся лёгкой мишенью, укрепит моральный дух граждан. Наша стратегия ПВО будет строиться вокруг первоочередной защиты крупных населённых пунктов."
  
 # Political 
  
 # Start! 
  
 RHI_leaving_mandate: "План вывода войск?"
 RHI_leaving_mandate_desc: "Поскольку ликвидация мандата с каждым днём всё ближе, возможно, нам следует разработать план мирного и организованного вывода войск?"
 RHI_lend_separatists_strength: "Повысить авторитет сепаратистов"
 RHI_lend_separatists_strength_desc: "Сепаратисты — единственные истинные борцы за демократию на этих рубежах, пока изгнанники продолжают бесноваться из-за провала своих бездарных и высокомерных замыслов. Даже если они не отличались высоким профессионализмом, они способны измениться."
 RHI_lend_separatists_strength_tt: "§lЭто облегчит приход к власти сепаратистского правительства§!"
 RHI_integrate_weimar_refugees: "Интеграция веймарских беженцев"
 RHI_integrate_weimar_refugees_desc: "Веймарские беженцы олицетворяют настоящую попытку немцев создать демократическое государство, в то время как сепаратисты — не более чем жаждущие власти марионетки. Мы должны как можно скорее дать веймарским эмигрантам шанс гарантировать, что Рейнланд останется свободным."
 RHI_integrate_weimar_refugees_tt: "§SЭто облегчит приход к власти республиканского правительства§!"
 RHI_fate_of_equipment: "Судьба снаряжения"
 RHI_fate_of_equipment_desc: "В Рейнланде находится множество складов со снаряжением, и мы обязаны решить, как с ним поступить, пока оно не затерялось и не попало на чёрный рынок."
 RHI_begin_limited_withdrawals: "Начать частичный вывод войск"
 RHI_begin_limited_withdrawals_desc: "Даже если полномасштабный вывод войск сейчас непрактичен, постепенное сокращение контингента определённо будет тепло встречено жителями Рейнланда. Когда силы Антанты начнут уходить, немцы смогут вздохнуть спокойно, зная, что теперь сами решают свою судьбу."
 RHI_increase_industrial_output: "Увеличить производство"
 RHI_increase_industrial_output_desc: "За оставшееся время нам следует увеличить промышленное производство, чтобы удовлетворить интересы Парижа и Брюсселя, желающих получить ресурсы Рейнланда в качестве репараций за жестокие сражения Великой войны. Это существенно облегчит процесс вывода войск."
 RHI_fly_green_white_red: "Поднять зелёно-бело-красный флаг"
 RHI_fly_green_white_red_desc: "Пришло время для свободного Рейнланда, избавленного от исконной тирании Пруссии и диктаторских замашек германского государства. Здесь зародится новый демократический идеал, который, возможно, удастся распространить и на остальную Германию."
 RHI_crush_nationalist_movements: "Подавить националистические настроения"
 RHI_crush_nationalist_movements_desc: "Германские националисты, сражаются ли они под чёрно-бело-красным или чёрно-красно-золотым знаменем, всегда были угрозой для нормального общества. Даже если их идеи сами по себе не вызывают отторжения, методы, которыми они сеют террор и бандитизм, должны быть пресечены!"
 RHI_negotiate_koblenz_government: "Урегулировать вопрос с Кобленцем"
 RHI_negotiate_koblenz_government_desc: "С наступлением биржевого краха недовольство правительством нарастало, и народный гнев, похоже, обрушился на сепаратистское и республиканское движения. Зайдя так далеко в поддержке сепаратистов, мы обязаны как минимум вступить с ними в переговоры."
 RHI_has_koblenz_government: "§7В настоящее время действует сепаратистское правительство в Кобленце§!"
 RHI_lift_spd_ban: "Снять запрет с социалистов"
 RHI_lift_spd_ban_desc: "Социал-демократическая партия Германии, более известная как СДПГ, вовсе не является нашим идеологическим врагом, а её усилия по защите немецкой демократии определенно заслуживают уважения. И всё же попытка восстания в 1933 году осквернила их репутацию. Давайте разрешим им реорганизоваться во имя более свободной Германии."
 RHI_german_industry_compromise: "Компромисс с немецкими промышленниками"
 RHI_german_industry_compromise_desc: "Немецкие промышленники никогда не были друзьями республики и тем более социал-демократов, но многие из них бежали от «большевистских» веяний восточного Рейха. Возможно, мы сможем заключить с ними сделку, чтобы смягчить экономический переход после нашего ухода и обеспечить более гармоничный и демократический Рейнланд в будущем."
 RHI_withhold_separatist_funding: "Приостановить финансирование сепаратистов"
 RHI_withhold_separatist_funding_desc: "Когда сепаратисты не терроризируют население во имя своей якобы страны, они просто истощают наши ресурсы. Учитывая, что их деятельность активно поддерживается нашими ведомствами, возможно, стоит преподать им урок экономии и научить обходиться собственными средствами..."
  
