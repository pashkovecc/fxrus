 RHI_eec: "Европейская экономическая зона" # Europäische Wirtschaftszone
 RHI_eec_desc: "Европейская экономическая зона, также известная как Европейская экономическая зона, теперь пытается объединить Европу, чтобы новая Великая война никогда больше не произошла. Поскольку Германия успешно восстала из пепла, новая Зона теперь может попытаться сохранить мир в Европе и связать Европу ближе друг к другу экономически и политически." # The Europäische Wirtschaftszone, also known as the European Economic Zone now attempts to unite Europe further together so that another Great War may never once again occur. With Germany having successfully rising from the ashes, the new Zone may now attempt to preserve peace in Europe and bind Europe closer together economically and politically.
 RHI_zol: "Таможенный союз" # Zollverein
 RHI_zol_desc: "Возрожденный Zollverein, созданный после поражения Германии и последующей децентрализации, теперь выступает в качестве одного из столпов нового Германского Союза. Взяв свое название от таможенного союза, который объединил Германию сто лет назад, новый Zollverein теперь продолжит работать в направлении будущего, в котором свободные немцы повсюду смогут торговать и работать вместе в мире и процветании." # The reborn Zollverein, created in the aftermath of Germany's defeat and subsequent decentralization now stands as one of the pillars of the new German Union. Taking its namesake from the customs union that bound together Germany a century before, the new Zollverein will now continue to work towards the future where free Germans everywhere can trade and work together in peace and prosperity.

