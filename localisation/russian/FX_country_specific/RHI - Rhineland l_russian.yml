 # Living in a democracy... 
 RHI_democratic_bills_cat: "Democracy in Action"
 RHI_democratic_bills_cat_desc: "As the last bastion of German democracy, we are not able to enact laws at mere personal whims. Rather, we must be ready to enact legislation with the support of the parliament, now in-exile from the Berlin regime. To this end, we must be ready to bargain with other parties lest they either water down or entirely block the legislation necessary for the republic's continued survival.\n\n[RHI_is_bill_up_desc][RHI_federals_check]"
 RHI_bill_is_up_desc: "§LThe stances of the interested political forces are as follows:\n\n[RHI_bill_spd_support]\n\n[RHI_bill_liberal_support]\n\n[RHI_bill_zentrum_support]\n\n[RHI_bill_schleicher_support]\n\n[RHI_bill_reichswehr_support]§!"
 RHI_bill_not_up_desc: "§LCurrently no bills are up - thus leaving the remaining democratic parties in place.\n\nThe §SSocial Democrats§! as was the case before Dressler is the most popular party for workers, though the §Creformist bent§! of the §SSPD§! in the Rhineland is significant.\n\nThe two liberal parties, the §lDemocrats§! and §mPeople's Party§! live on in a mostly atrophied form. The §mDVP§! in particular however has the upper hand due to support from industrial firms that while not as numerous as in the Ruhr still lend support and funding to the liberal cause as a whole. Many note that the two parties are however moving closer to one another over time, perhaps making for a convergence once democracy is restored.\n\nThe §6Centre§! is the dominant party in the Catholic Rhineland, with the powerful §gGerman Trade Union Confederation§! and other Catholic welfare and social groups granting this party an extremely broad base. Many note that there is an increasing push in the party towards the creation of an non-denominational democratic party in the face of Valkist terror.§!"
  
