 otto_wolff_RHI_MIO: "Steelworking Concern"
 otto_wolff_desc: "Founded in Köln in 1904 by Otto Wolff and Ottmar E. Strauß, Otto-Wolff began its life as a steel-trading and steel-wrecking company. Achieving a monthly turnover of more than a million reichsmarks by 1914, the company experienced yet another jump in growth at the start of the Great War. After the signing of the Treaty of Versailles, its eponymous owner gained prominence among various pro-France industrialists in the Rhineland, supporting the French bid to establish an independent Rhine.\n\nBoth a primary facilitator and beneficiary of trade with France during the Rhineland Mandate, Otto-Wolff is today the largest steelworking company in the Rhine."
  
