 # Parties 
 RHI_vanguardist_party: "ЛПСГ"
 RHI_vanguardist_party_long: "Лига пролетарских бойцов за свободную Германию\n§LОснованная в конце 1932 года после прихода к власти Дресслера, Лига пролетарских бойцов в настоящее время служит силовой поддержкой операций КПГ в Рейнской области. Первоначально жестоко нападая на любые несоциалистические силы, которые она считала подходящими, ЛПБ столкнулась с массированными репрессиями как со стороны местных мандатных сил, так и со стороны местных немецких ополченцев.\n\nПосле изменения курса от тотальной оппозиции к стратегии народного фронта, ЛПСГ в последние месяцы смягчила свою яростную антимандатную риторику, временами даже, кажется, избегая дальнейших конфликтов с мандатными силами. Тем не менее, эти коммунистические террористы продолжают представлять угрозу для Рейнской области, нависая над всеми, кто не следует революционной линии, — поэтому их подавление является для многих первоочередной задачей.§!"
  
 RHI_collectivist_party: "РОП"
 RHI_collectivist_party_long: "Революционная оппозиция профсоюзов\n§LЗародившись в самых радикальных элементах социал-демократических свободных профсоюзов, Революционная оппозиция профсоюзов (РОП) сформировалась по всей Германии в конце 1928 года. Не сумев примириться с социал-демократическими профсоюзами, РОП вскоре вступила в союз с коммунистами, став ведущим коммунистическим профсоюзом в Германии. Не имея достаточной поддержки среди работающего рабочего класса и часто лишённая правительством возможности вести полноценные переговоры с работодателями, РОП оказалась одной из многих левых организаций, разгромленных Дресслером после его прихода к власти в 1932 году. Хотя организация всё ещё существует в заметном составе в Рейнской области, многие ожидают, что РОП вскоре прекратит своё существование, поскольку главной целью коммунистов станет антивалькистское единство.§!"
  
 RHI_libertarian_socialist_party: "ССРР"
 RHI_libertarian_socialist_party_long: "Союз свободных рабочих Рейнской области\n§LОснованный в конце 1919 года, Союз свободных рабочих Германии (CCРГ) стал крупнейшей синдикалистской организацией в Германии в республиканскую эпоху. Первоначально относительно популярный в Руре, ССРГ постепенно сокращался из-за внутренних распрей и дезертирства, уменьшившись с пика в сотни тысяч до нескольких тысяч к моменту прихода к власти Дресслера. Несмотря на дезертирство и репрессии, этот анархо-синдикалистский союз выдержал испытание временем, оставаясь в Рейнской области, где играет незначительную роль в качестве альтернативы опасному РОП и реформистским свободным профсоюзам, всё ещё действующим в Рейнской области. Тем не менее, многие предсказывают, что нынешний ССРР не просуществует ещё одно поколение.§!"
  
 RHI_social_democrat_party: "РЛН/Фронт свободы"
 RHI_social_democrat_party_long: "Рейнская лига независимости/Фронт свободы\n§LБудучи предшественницей немецких социалистических движений, Социал-демократическая партия Германии переживала не лучшие времена в Рейнской области. После окончания Первой мировой войны социал-демократы на Рейне оказались оторванными от Германии и вынужденными действовать под управлением мандатного правительства, отражавшего все беды Германии в Новом Свете. Из этого хаоса возникла новая организация. Основанная журналистом и профессиональным подстрекателем Йозефом Фридрихом Маттесом, Рейнская лига независимости начала привлекать значительную часть рабочего класса, который по своей природе поддерживал социал-демократов. Получая значительные средства из Парижа и еще большее негодование из Берлина, эти сепаратисты вскоре стали предпочтительной сепаратистской организацией для французов, уставших от некомпетентности Дортена.\n\nПосле прихода к власти Дресслера в 1932 году Рейнская СДПГ пережила большой рост численности, за которым вскоре последовали жестокие репрессии со стороны французских войск за их очевидную непримиримость. После бегства их лидеров в Прагу и Киль Рейнская СДПГ рухнула, преобразовавшись в гораздо более мягкий Фронт свободы. Основанная на противостоянии валькистской угрозе любой ценой, их сравнительно лояльный тон по отношению к мандату не стал причиной их краха, и мало кто предвидел, что в последующие годы на Рейне установится какая-либо социальная демократия.§!"
  
 RHI_social_democrat_party_start_unbanned: "РЛН/СДПГ"
 RHI_social_democrat_party_start_unbanned_long: "Рейнская лига независимости/Социал-демократическая партия Германии\n§LБудучи предшественницей немецких социалистических движений, Социал-демократическая партия Германии переживала не лучшие времена в Рейнской области. После окончания Первой мировой войны социал-демократы на Рейне оказались оторванными от Германии и вынужденными действовать под управлением мандатного правительства, отражавшего все беды Германии в Новом Свете. Из этого хаоса возникла новая организация. Основанная журналистом и профессиональным подстрекателем Йозефом Фридрихом Маттесом, Рейнская лига независимости начала привлекать значительную часть рабочего класса, который по своей природе поддерживал социал-демократов. Получая значительные средства из Парижа и еще большее негодование из Берлина, эти сепаратисты вскоре стали предпочтительной сепаратистской организацией для французов, уставших от некомпетентности Дортена.\n\nПосле прихода к власти Дресслера в 1932 году Рейнская СДПГ пережила большой рост численности, за которым вскоре последовали жестокие репрессии со стороны французских войск за их очевидную непримиримость. После бегства их лидеров в Прагу и Киль Рейнская СДПГ рухнула, преобразовавшись в гораздо более мягкий Фронт Свободы. В условиях нынешнего затишья, снятие запрета на деятельность СДПГ привело к возвращению социал-демократов к Рейну. Тем не менее, приведет ли это к их возвращению к власти — это уже совсем другая история.§!"
  
 RHI_social_democrat_party_start_unbanned_tt: "Рейнская лига независимости/Социал-демократическая партия Германии"
  
 RHI_social_liberal_party: "МК"
 RHI_social_liberal_party_long: "Майский клуб\n§LИстория немецкого либерализма — долгая и болезненная, особенно с учётом сохраняющегося раскола среди его сторонников. История Майского клуба начинается с истории Либеральной ассоциации. Основанная в 1924 году, её члены-учредители, перешедшие из Демократической партии, эта организация, созданная для того, чтобы положить конец либеральному расколу, парадоксальным образом способствовала ему взаимной враждебностью между собой и демократами. Несмотря на первоначальные успехи, ассоциация вскоре ослабла, пока на выборах 1928 года не получила новый импульс благодаря плачевным результатам либеральных партий, сделав либеральное единство актуальной целью. Тем не менее, либерального единства так и не было достигнуто. Потеряв первоначальный импульс, полученный после поражений на выборах, организация начала стагнировать и в конечном итоге пришла в упадок. В условиях ухудшения ситуации в Германии поддержка либеральных партий вскоре начала снижаться, что в конечном итоге привело к приходу к власти Адама Дресслера. После этого сильного потрясения остатки либеральных партий сплотились в рамках мандатного режима. Изначально возникшие как местные инициативы по объединению либералов, эти объединения, сформировавшиеся после распада республики, вскоре начали сотрудничество в более широком масштабе. Все еще подавленные при мандатном режиме, многие задаются вопросом, является ли это возрождением немецкого либерализма или всего лишь предсмертными вздохами обреченной идеологии.§!"
  
 RHI_market_liberal_party: "ННП/РНО/Лига фермеров"
 RHI_market_liberal_party_long: "Немецкая народная партия/Рейнское народное объединение/Лига свободных фермеров\n§LРейнская область всегда была домом для большой и влиятельной группы промышленных магнатов и банкиров. Поскольку сердце немецкой промышленности располагалось на берегах могучей реки, неудивительно, что экономические группы интересов всегда находили свое призвание в рейнской политике. С приходом к власти Дресслера несколько экономических групп интересов теперь борются за влияние в подавленном политическом ландшафте.\n\nНаиболее распространенной, но противоречивой группой являются остатки Немецкой народной партии, многие из которых бежали от «зеленого террора», охватившего Германию в 1932 году. Возглавляемая Эдуардом Дингельдеем, партия изо всех сил пытается удержаться на плаву без поддержки промышленных интересов, которые яростно борются с идеей любого либерального политического единства и превращения ННП в партию среднего класса. Таким образом, многие считают, что нынешняя ННП не доживет до следующего правительства.\n\nОправившись от унизительного провала 1924 года, Рейнское народное объединение едва ли восстановилась. Собирая хоть какую-то поддержку у среднего класса и тех, кто был отчужден Центром, Народное объединение остается одной из немногих влиятельных сил в сепаратистском движении, хотя и все еще страдает от сомнительного руководства Дортена. Рейнская область также не является полностью однородным промышленным регионом, поскольку многие крестьяне зарабатывают на жизнь на территории мандата, особенно на юге. С приходом к власти Дресслера многочисленные разрозненные аграрные группы объединились в Лигу свободных фермеров, надеясь представлять интересы крестьян в противовес интересам крупной промышленности.§!"
  
 RHI_social_conservative_party: "Центр"
 RHI_social_conservative_party_long: "Партия Центра\n§LВ немецкой политике мало партий, столь же исторически значимых, как Партия Центра, особенно в католической Рейнской области. Сформированная из прусской Культуркампф, «Центр» служила опорой немецкой политики, являясь важнейшим центристским оплотом республики до роковых дней 1932 года. В католическом Рейнланде «Центр» была ведущей партией для избирателей и для многих жителей Рейнской области единственной надеждой избежать дальнейшего господства безбожной валькистской угрозы на востоке. Однако жизнь «Центра» в республиканские годы не была безоблачной: партия неоднократно оказывалась на грани распада из-за вопроса о создании межконфессиональной партии. Многие консерваторы особенно выступали за то, чтобы открыть партию для протестантов, создав новую Христианскую народную партию, которая служила бы оплотом против социализма и других левых элементов, а также защищала бы интересы католического рабочего класса.\n\nОднако с падением Германии под натиском валькизма этот вопрос отошел на второй план, уступив место более насущному – следует ли сотрудничать? Хотя мандат не запрещает деятельность партии, ее враждебность к продолжающейся оккупации пока принесла ей лишь дальнейшее насилие между оккупантами и оккупированными. В то время как веймарские изгнанники призывают к сопротивлению империализму, местные жители Рейна видят ситуацию иначе – особенно когда речь идет о выборе между относительной безопасностью французской защиты и жестокими тиранами Берлина. Какое бы будущее ни ждало Рейнскую область, Центр обязательно встретит его – готов он или нет.§!"
  
 RHI_authoritarian_democrat_party: "МРВК"
 RHI_authoritarian_democrat_party_long: "Межсоюзническая Рейнская Верховная Комиссия\n§LК чему привели десятилетия оккупации? Экономический хаос, политические распри и социальные потрясения, среди прочих бед, обрушились на мандат, некогда сиявший маяком демократии.\n\nСозданная в конце Первой мировой войны, Межсоюзническая Рейнская Верховная Комиссия с тех пор является главным руководящим органом Рейнской области. Представляя британские, американские, бельгийские и, особенно, французские интересы в этом регионе, её существование никогда не было лёгким. Делегаты и их армии обеспечивали оккупацию территории, и между бывшими союзниками велись бесчисленные словесные и письменные споры, особенно по поводу судьбы региона в целом.\n\nВвергнутая в очередной кризис после прихода к власти Дресслера в 1932 году, она, как многие уверены, может не просуществовать и года после этого. Находясь на грани краха, где сепаратисты с пистолетами «Лебель» сражаются на улицах с вооруженными пистолетами «Маузер» националистами, очередной кризис, скорее всего, обречет эту устаревшую администрацию на гибель.§!"
  
 RHI_paternal_autocrat_party: "ОГФ"
 RHI_paternal_autocrat_party_long: "Общество графа Шлиффена - Рейнская региональная ассоциация\n§LНа первый взгляд, кажется, что Общество графа Шлиффена — это типичное объединение офицеров-ветеранов. Как и во всех подобных обществах в Германии, можно предположить, что многие его члены являются убежденными валькистами.\n\nКак ни странно, это не относится к рейнскому отделению, причиной создания которого стал человек, чьи интриги и махинации оказали огромное влияние на недавнюю историю Германии — Курт фон Шлейхер.\n\nПосле неудавшегося путча против Дресслера в 1932 году Шлейхер оказался в серьезной беде. Ему специально приготовили петлю, и он вместе со своей свитой бежал в Рейнский мандат, где объединился с офицерами-антивалькистами всех уровней, чтобы сформировать новое Общество графа Шлиффена.\n\nХотя в мандате могут считать это общество доброжелательным собранием сочувствующих друг другу стариков, реальность совершенно иная. Распространяя тонны ужасающих антивалькистских рассказов и брошюр, общество стало инструментом для стареющего Шлейхера, позволяющим ему вернуть себе власть и вывести Германию из кризиса, в котором она находится. Кризис 1932 года так и не закончился — пока в Берлине правят бандиты, потомки старой Германии не сдадутся.§!"
  
 RHI_national_populist_party: "ГРНП"
 RHI_national_populist_party_long: "Германо-рейнская народная партия\n§LМандат принес немецкому населению множество ужасов, реальных или вымышленных. Будь то реальные случаи жестокости по отношению к мирному населению со стороны все более недовольных оккупантов или их сенсационные заявления, мало кто из немцев испытывает симпатию к администрации мандата. Однако среди многих противников мандата есть и те, кто выступает не только против иностранной оккупации, но даже против республиканского правления. Германо-рейнская народная партия (ГРНП) не может быть в полной мере описана как обычная партия в традиционном смысле, ее истинная цель — направлять общегерманские настроения в политическую деятельность. Как преемница длинной череды запрещенных пангерманских партий, ГРНП в настоящее время является основным инструментом невалькистской, антиреспубликанской силы в Рейнской области, хотя она часто вызывала недовольство Берлина из-за своей более традиционной фёлькишской ориентации.§!"
  
 RHI_valkist_party: "ПСВР"
 RHI_valkist_party_long: "Патриотический союз валькистов Рейнланда\n§LНемецкая мечта в Рейнской области никогда не рушилась, но она изменилась. Когда-то оплот убежденных националистических республиканцев и противников Веймарской республики, антимандатное движение приняло новую, более мрачную форму. Основанная Альбертом Лео Шлагетером, Патриотический союз валькистов стал главным инструментом противодействия продолжению правления Рейнского мандата. Тесно связанные с первоначальным блоком фронтовиков в Германии, рейнские валькисты участвуют в террористической деятельности, сравнимой разве что с деятельностью самых радикальных коммунистов. Однако, несмотря на жесткие репрессии со стороны мандатной власти, валькистские силы продолжают действовать в Рейнланде, и многие опасаются, что конец мандата может ознаменовать подъем валькизма. Тем не менее, их народная поддержка во многом минимальна, и захват власти может предвещать нечто более мрачное на горизонте Рейнланда.§!"
  
