#Events

# Where it started

 rhein.0.t: "Граница демократии" # The Frontier of Democracy
 rhein.0.d: "Когда в Рейнской области наступает новый год, многие жители Рейнской области чувствуют дурное предчувствие. Приход Дресслера в Берлин, по-видимому, положил конец любой возможности простого и мирного воссоединения с Рейхом, и французы явно не желают отказываться от своей короны, полученной в Великой войне.\n\nТак кто же поведет рейнский народ к свободе и свободе? Многие говорят, что это местные рейнландцы — те, кто встанет на защиту простого человека в Кобленце, Ахене и Кёльне. Даже если на данный момент они расколоты, многие говорят, что их мечты о свободной Рейнской области — это мечта, которой следует следовать, мечта, в которой Пруссия никогда больше не подчинит себе свободные государства Германии.\n\nА может быть, и нет? Другие утверждают, что эти рейнские агитаторы и политики сохраняют свою актуальность только благодаря махинациям французского империализма. Многие оплакивают мандат, который они приравнивают к марионеточной конфедерации, созданной Наполеоном; они верны старой Германии, Германии, которая когда-то была свободной и демократической. «Веймарцы» состоят из изгнанных демократов, спасающихся от все более тиранического и агрессивного режима Дресслера. Эти группы, конечно, мало любят сепаратистов, а также французов, которые отвечают им взаимностью. В конце концов, как можно доверять этим бывшим соперникам Франции столь ценный Рейн? Не говоря уже о том, как ранее они бросили свой предполагаемый народ на произвол судьбы под французским господством; они не находят много друзей за пределами британского и американского секторов.\n\nТак какова будет судьба Рейна? Мандат живет в заемное время, так что теперь остается единственный вопрос - лояльность..." # As a new year dawns on the Rhineland, many a Rhinelander feel a great foreboding. The rise of Dressler in Berlin has seemingly ended any possibility for simple and peaceful reunification with the Reich and the French clearly have no desire to vacate their crown prize from the Great War.\n\nSo who will lead the Rhenish people into liberty and freedom? Many say that it is the local Rhinelanders - those who will stand up for the common man in Koblenz, Aachen and Köln. Even if they are splintered as of now, many say that their dreams of a free Rhineland is the dream to follow, one where Prussia will never again subjugate the free states of Germany.\n\nOr maybe not? Others argue that these Rhenish agitators and politicians only remain relevant due to the machinations of French imperialism. Many bemoan the mandate that they equate to the puppet confederation established by Napoleon; their loyalty is to the old Germany, a Germany that was once free and democratic. The 'Weimarers' consist of exiled democrats, fleeing from the increasingly tyrannical and aggressive Dressler regime. These groups of course have little love for the separatists, as well as the French who reciprocate in kind. After all, how can these former rivals of France be trusted with the intensely valuable Rhine? Not to mention how they had previously abandoned their supposed people to their fate under French domination; they do not find many friends outside of the British and American sectors.\n\nSo what will the Rhine's fate be? The mandate lives on borrowed time, so now the only question remaining is one of loyalty...
 rhein.0.a: "Это последний год мандата?" # Is this the mandate's last year?
 RHI_adenauer_is_king: "§CКак ведущий политик Рейнской области, Конрад Аденауэр останется доминирующей силой в рейнской политике. Потребуется серьезная встряска, чтобы ему могли законно угрожать другие фракции.§!" # §CAs the leading politician in the Rhineland, Konrad Adenauer will remain as the dominant force in Rhenish politics. It will take a serious shake-up for him to be legitimately threatened by the other factions.§!
