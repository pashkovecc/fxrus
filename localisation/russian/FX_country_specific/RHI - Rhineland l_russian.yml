 ### History 
 RHI_FUHRERREICH_DESC: "Рейнская область — промышленное сердце Германии, и всё же ныне она отделена от своей родины. Рожденный из хаоса и скорби на исходе Великой войны, Рейнский мандат знавал лучшие годы. Оккупация со стороны Антанты, кажется, затянулась навечно, и возмущение Западом накопилось до предела — многие жаждут вернуться домой, в Германию.\n\nНо несмотря на это, в Рейнской области всё ещё живёт новая надежда на свободную Германию. Германию, не подвластную тиранам, Германию, где каждая земля и каждый человек смогут жить свободно. Под каким бы флагом они ни стояли, народ Рейнской области будет сражаться за свою свободу."
  
