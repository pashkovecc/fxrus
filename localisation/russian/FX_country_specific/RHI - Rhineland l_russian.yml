 RHI_bill_with_effect_tt: "§4Мы начнем принимать законы, последствия которых будут иметь разный масштаб. Если мы проведем законопроект с максимальной популярностью, то получим следующее:§!\n" # §4We will begin to legislate and pass a bill that will have effects of varying scale. Should we pass through a bill with maximum popularity, we will receive the following:§!\n
 RHI_schleicher_holds_on: "§RЭто довольно шаткая ситуация для Шлейхера, поскольку его власть, вероятно, будет освобождена, если он не получит одновременно поддержку армии и, по крайней мере, объединенную гражданскую поддержку в размере §Y35%§! со стороны элементов §gNF§! и §PDVF§!.§!" # §RThis is a rather tenuous situation for Schleicher, with his grip on power likely to be released unless he has both the support of the army and at least a combined civilian support of §Y35%§! by both §gNF§! and §PDVF§! elements.§!
 RHI_schleicher_they_do_be_angry: "§rХотя с нами все будет в порядке, если мы оправдаем многочисленные ожидания обновленного правительства Шлейхера, мы должны быть готовы столкнуться с §oхудшим§!, если мы не оправдаем ожиданий от нас гражданского населения и военных.§!" # §rWhilst we should be fine if we have met the many expectations of a renewed Schleicher government, we must be prepared to face the §oworst§! if we fail to fufill the civilian's and military's expectations of us.§!
 RHI_schleicher_lackey: "§3Хорст фон Ресторф - довольно мягкий персонаж, его основная роль - неизвестная фигура, которая может дать Шлейхеру некоторое прикрытие, пока Шлейхер не сможет оставить позади республиканские партии - хотя это значительно замедлит приход Шлейхера к власти.§!" # §3Horst von Restorff is a rather benign character, with his primary role being an unknown figure that can grant Schleicher some cover until Schleicher can leave behind the republican parties - though it will greatly slow Schleicher's rise to power.§!
 RHI_schleicher_power: "§3Хотя это может еще больше укрепить власть Шлейхера, демократам это не понравится.§!" # §3Whilst this may further consolidate Schleicher's grip on power, this will not go over well with the democrats.§!
 RHI_schleicher_liberals: "§3Привлечение национал-либералов в совет может не помочь Шлейхеру заручиться поддержкой профсоюзов, поэтому нам лучше действовать осторожно...§!" # §3Bringing in with the national liberals on the council may not help Schleicher in winning over union support, so we better tread lightly...§!
 RHI_waiting_for_mil_dependent: "§3Если мы не §rсильно расстроили§! офицеров рейхсвера, они успокоятся, если мы либо выполним следующие действия:§!\n-§YСвяжитесь с диссидентами рейхсвера§!\n-§YПолитический Бургфриден§!\n-§YМилитаризация государства и строительство наши вооружения§!" # §3If we have not §rmajorly upset§! the Reichswehr officers, they will calm down if we have either completed the following foci:§!\n-§YContact Reichswehr Dissidents§!\n-§YPolitical Burgfrieden§!\n-§YMilitarize the State and Build up our Armaments§!
