 # Republicans 
 RHI_republican_stability_cat: "The Legacy of Weimar"
 RHI_republican_stability_cat_desc: "Finally, we have gained the opportunity to right 1932. The subjugation of the German people by the Valkists and their ilk must be punished.\n\nYet, we face an uphill battle. Many Germans remain skeptical or even outright hostile to our government, and the Rhineland was never the hotbed of republican democracy anyways. Hence it now lies on us to regain the trust of the German people, to once and for all prove that German democracy is not dead.[RHI_republican_stability_entry]"
 RHI_republican_stability_entry_there: "\n\nEvery month, §5Republican Stability§! will increase, though how much it does increase by will depend on several factors including the §Gpopularity of the current government§!, §othe strength of our enemies§! and §Cmeasures taken by the democratic government§!; that is assuming we continue to stabilize.\n\nThe situation thus follows:\n§YRepublican Stability§! is at[?RHI_Republican_Stability|%+] with it being projected to change by [RHI_republican_stability_add] next month.\n\nThis is because:\n[RHI_republican_stability_coalition_add]\n[RHI_reichswehr_mood]"
  
