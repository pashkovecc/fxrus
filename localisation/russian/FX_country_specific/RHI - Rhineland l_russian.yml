 # ok real stuff now 
  
 RHI_together_with_france: "Вместе с Францией"
 RHI_together_with_france_desc: "Тирания, охватившая Германию, угрожает нашим демократическим ценностям. Даже если некоторые недальновидно недовольны идеей сближения с ней, мы должны укрепить наши связи с верным защитником нашей независимости и демократии — Францией."

 RHI_separatist_tt: "§gК власти пришла сепаратистская коалиция во главе с §4Центром§! или лагерем §SМаттеса§!-§mДортена§!§!"

 # Аденауэр 

 RHI_adenauer_and_french: "Восхождение Аденауэра"
 RHI_adenauer_and_french_desc: "Аденауэр стал заметной фигурой в Рейнланде. С самого основания Рейнской Республики его взгляды на отношения Франции и Германии сделали его предпочтительным кандидатом для французского правительства. Если он займёт пост канцлера, стоит ожидать укрепления связей между Францией и Рейнской Республикой."

 RHI_hand_seat_gov_adenauer: "Французский спасательный круг"
 RHI_hand_seat_gov_adenauer_desc: "Хотя мы ценим нашу независимость, нельзя отрицать, что наше выживание зависит от дальнейшей поддержки нашего правительства Францией. Учитывая это, нам следует направить французскому правительству запрос о сближении, чтобы установить более тесные связи, даже если это потребует отказа от части нашей автономии."

 RHI_joint_military_exercises: "Совместные военные учения"
 RHI_joint_military_exercises_desc: "Защита демократии — наша цель и наш долг. Для её достижения нам необходима подготовленная армия. Мы пригласим французов организовать совместные военные учения, где обе наши нации научатся лучше защищать то, что мы ценим: демократию и свободу."

 RHI_invite_french_advisors: "Пригласить французских советников"
 RHI_invite_french_advisors_desc: "Хотя наша германская армия вполне компетентна в вопросах обороны страны, для нанесения ответного удара по любым иностранным агрессорам нам потребуется помощь французских военных, даже если ради этого придётся отказаться от наших германских тактических доктрин."

 RHI_francogerman_economic_treaty: "Франко-германский экономический договор"
 RHI_francogerman_economic_treaty_desc: "Хотя французы и немцы исторически не были союзниками, мы можем наконец положить конец давнему спору из-за железной руды, протянув оливковую ветвь мира французскому правительству. Подписание экономического договора позволит и немцам, и французам улучшить отношения и оживить торговлю."

 RHI_promote_antiprussianism: "Продвижение антипруссианизма"
 RHI_promote_antiprussianism_desc: "Германская империя на самом деле была Прусской империей — народы внутри неё не имели права голоса ни в каких вопросах. Многие разочарованные старики твердят о том, как «хорошо» было в прошлые времена, но мы-то знаем правду, и её должно узнать всё население!"

 RHI_promote_catholic_identity: "Продвижение католической идентичности"
 RHI_promote_catholic_identity_desc: "Наша гордая нация — это не просто народ немцев, это нация христиан, верных морали Отца, Сына и Святого Духа. Мы должны донести эту истину до нашего населения, чтобы приблизить народ — и всех нас — к Его Царствию."

 RHI_replace_french_with_schutztruppe: "Прощание с французами"
 RHI_replace_french_with_schutztruppe_desc: "Французы выполнили свой долг по защите границы, но мы должны предложить немецкое решение немецкой проблемы. Давайте попрощаемся с французами и реформируем немецкие шутцтруппе. Надеемся, это стабилизирует обстановку в стране и вернёт доверие народа."

 RHI_diplomatic_mission_paris: "Миссия в Париж"
 RHI_diplomatic_mission_paris_desc: "В знак благодарности за помощь пришло время отдать французам должное и нанести визит в Париж. Давайте залечим старые раны и встретим наших братьев с распростёртыми объятиями!"

 RHI_appoint_matthes: "Назначить Маттеса"
 RHI_appoint_matthes_desc: "Маттес, убеждённый противник Пруссии и радикалов, зарекомендовал себя как отличный союзник народа Рейна и в последнее время снискал огромную поддержку. В интересах нашей нации будет передать ему эстафету руководства германским народом, ведь он, похоже, единственный, кто готов к бурям грядущего."

 RHI_crackdown_extremism: "Борьба с радикалами"
 RHI_crackdown_extremism_desc: "Радикалы, будь то социалисты или консерваторы, известны как головная боль для рейнского государства. Их крайние идеалы зашли слишком далеко: революционеры и реакционеры лишь мешают развитию, и потому их необходимо заставить замолчать любыми средствами."

 RHI_ratify_new_constitution: "Ратификация новой конституции"
 RHI_ratify_new_constitution_desc: "Новая конституция Рейнланда наконец написана, остался последний шаг — ратифицировать её. С этим актом для Рейнланда настанет новый рассвет; давайте возрадуемся приходу новой эры."

 RHI_create_verfassungsgericht: "Создать Ферфассунгсгерихт"
 RHI_create_verfassungsgericht_desc: "Чтобы защитить конституцию от недобросовестных деятелей, мы создадим Ферфассунгсгерихт (Verfassungsgericht). Этот орган будет выполнять функции федерального и конституционного суда республики. На него будет возложена обязанность оценивать решения лидеров и проверять их на соответствие конституционному порядку страны."

 RHI_west_german_republic: "Западногерманская Республика"
 RHI_west_german_republic_desc: "За все исторические катастрофы Германии вину несёт Пруссия. Теперь нам нужна новая Германия — Германия без слепого ярого милитаризма и радикализма Прусской империи. И мы построим лучшую Германию, которая сможет по праву закрепить за собой статус одной из величайших держав Европы."
 # Matthes and Dorten 
  
 RHI_matthes_dorten: "Маттес и Дортен"
 RHI_matthes_dorten_desc: "Маттес и Дортен — похожие люди с похожими целями. Несмотря на имеющиеся разногласия, оба они обладают военным опытом и стремятся сохранить автономию Рейнланда. Поэтому их следует привлечь к нашим усилиям по защите страны — будь то в агитации или на военной службе."

 RHI_work_french_military_advisors: "Сотрудничество с французскими военными советниками"
 RHI_work_french_military_advisors_desc: "Французская армия не имеет равных в Европе, и французы доказали готовность поддержать нас, если мы решим сражаться за свою независимость. Чтобы защититься от щупалец Берлина, мы примем лучших военных экспертов Европы."

 RHI_support_regionalism: "Поддержка регионализма"
 RHI_support_regionalism_desc: "Прусская система канула в прошлое: мы стремимся создать истинную федерацию равноправных земель. Ни одна земля, будь она столичной или нет, не должна иметь решающего преимущества перед другими."

 RHI_promote_rhenish_identity: "Продвижение рейнской идентичности"
 RHI_promote_rhenish_identity_desc: "Мы не пруссаки и не немцы — мы народ Рейна, и требование уважения к нам абсолютно! Многие из наших жителей застряли в неопределённости между прусской и германской идентичностью, и пришло время показать им третий — и единственный истинный — путь."

 RHI_blame_prussian_agression: "Осуждение прусской агрессии"
 RHI_blame_prussian_agression_desc: "Наша общая история с Пруссией превратила нас в таких же поджигателей войны, как и они! Мы не будем сидеть сложа руки и не позволим их варварским нравам влиять на нашу нацию!"

 RHI_unite_rhenish_movement: "Объединение рейнского движения"
 RHI_unite_rhenish_movement_desc: "Наш народ жаждет — более того, нуждается в единстве ради продвижения рейнского идеала. Нам следует пригласить все прорейнские движения в наше правительство, чтобы сформировать единый и сплочённый фронт!"
 RHI_separatist_sentiment_boost: "§OВ результате §2сепаратистские настроения§! будут раз в два месяца увеличиваться на [?RHI_separatist_sentiment_100|%+=], что изменит динамический дух следующим образом:§!\nСтабильность: [?RHI_separatist_sentiment_change|%+=]\nПоддержка войны: [?RHI_separatist_sentiment_change_2|%+=]\nЗащита от смены идеологии: [?RHI_separatist_sentiment_change_2|%+=]"

 RHI_curb_infighting: "Прекратить междоусобицы"
 RHI_curb_infighting_desc: "В период первого движения за независимый и свободный Рейнланд наше «объединённое» движение столкнулось с катастрофической грызнёй — настолько ожесточённой, что катастрофу 1923 года можно целиком списать именно на этот факт. К сожалению, подобные раздоры до сих пор бушуют на всех уровнях, и мы обязаны положить им конец!"

 RHI_one_must_go: "Разрешить кризис руководства"
 RHI_one_must_go_desc: "Хотя союз Маттеса и Дортена привёл к осознанию наших гордых рейнских корней, этот путь омрачался их бесконечными спорами. Антисоциалист Дортен попросту не смог ужиться с популистом Маттесом, и теперь кризис между ними достиг апогея..."
 RHI_one_must_go_trigger: "Мы достигли стадии «$RHI_separatist_sentiment_3$» или преодолели её"

 RHI_cultivate_popular_support: "Завоевать поддержку народа"
 RHI_cultivate_popular_support_desc: "Без поддержки народа наше правительство обречено на крах. Нам нужны люди, которые будут сражаться за нас, говорить от нашего имени и голосовать за нас! Мы должны создать чувство полного единства между народом и властью — чувство того, что бюрократические барьеры остались лишь призраком ушедшей эпохи."
 RHI_separatist_volunteers: "§OМы развернём добровольческие дивизии по всей Рейнской области§!"

 RHI_rhenish_nationalism_against_expansionism: "Сопротивление внешней экспансии"
 RHI_rhenish_nationalism_against_expansionism_desc: "Рейнская идентичность и рейнский национализм, хоть и вызывают неприязнь у этнических немцев, могут стать мощным орудием защиты республики от германской военной машины. С верой в сердце мы встретим немецкую угрозу без страха и сомнений: вперед, рейнцы!"

 RHI_romanticism_german_bund: "Романтизация Германского союза"
 RHI_romanticism_german_bund_desc: "Германский союз (Deutscher Bund) был конфедерацией германских государств: хотя они не были единым целым, в них жило ощущение чего-то большего. Немецкие народы гордились принадлежностью к нему и при этом сохраняли свою автономию. Однако пруссаки и австрийцы в своей жажде власти подчинили себе большую часть Германии, не думая о порядке. Именно мы должны напомнить людям об утерянных ценностях Германии."

 RHI_law_and_order: "Восстановить закон и порядок"
 RHI_law_and_order_desc: "Наша страна в хаосе, на улицах царят преступность и падение нравов, пока политики перекладывают вину друг на друга. Нам нужны решительные действия, и прямо сейчас: мы должны действовать быстро, пока окончательно не потеряли контроль над государством!"

 RHI_rhenish_state_born: "Рождение свободного государства"
 RHI_rhenish_state_born_desc: "Наше государство ещё молодо, оно родилось из смеси искренних надежд и интересов иностранных держав. Однако теперь мы стоим оплотом свободы против тиранических сил валькизма. Рейнланд станет передовым рубежом демократии — ныне и присно!"
 RHI_rhenish_state_born_trigger: "Мы достигли стадии «$RHI_separatist_sentiment_5$»"
 RHI_we_win_sep_mechanic: "§OНовое рейнское государство окончательно закрепит свои позиции, что позволит нам выйти за рамки простых общественных настроений§!"
  
 # Республиканцы

 RHI_claim_the_mantle_of_republic: "Принять наследие Республики"
 RHI_claim_the_mantle_of_republic_desc: "Была некогда старая мечта — мечта о республике всех германских народов, украденная националистами в Берлине. Рейн должен вновь зажечь факел свободы и, держа его в руках, принять наследие Республики!"

 RHI_republican_tt: "§gК власти пришла республиканская коалиция во главе с §C«Веймарским»§! или §m«Федералистским»§! лагерем§!"

 RHI_german_republicans_take_power: "Защитить веймарское наследие"
 RHI_german_republicans_take_power_desc: "Хотя Рейнланд исторически никогда не считался оплотом немецкой демократии, теперь он им безусловно является. Бывшие веймарские республиканцы взяли под контроль молодое государство, и теперь остается лишь увидеть, удастся ли взять реванш за 1919 год."

 RHI_republican_coalition: "Республиканская коалиция"
 RHI_republican_coalition_desc: "Прежние правительства слишком сильно страдали от раскола и мелких политических междоусобиц. Когда немецкая демократия переживает крупнейший кризис, исходящий как от революционеров, так и от реакционеров, партии республики обязаны найти компромисс."

 RHI_diplomatic_mission_west: "Дипломатическая миссия на Запад"
 RHI_diplomatic_mission_west_desc: "Как ни печально, наше стратегическое положение весьма мрачно. Хотя валькистский режим и питает иллюзорные надежды стать европейской сверхдержавой, он всё ещё представляет угрозу. Только западные державы в Лондоне и Париже способны стать достаточно сильным оплотом, чтобы противостоять террору Берлина."

 RHI_pursue_querfront: "Курс на кверфронт"
 RHI_pursue_querfront_desc: "Долгое время социал-демократы оставались на обочине, а их популярность в Рейнланде исторически была весьма скромной. Однако с возрождением республики их поддержка выросла, и в условиях кризиса немецкой демократии следует рассмотреть вариант коалиции с ними."

 RHI_begin_talks_with_vienna: "Начать переговоры с Веной"
 RHI_begin_talks_with_vienna_desc: "Хотя Австрия исторически и не являлась самой стойкой демократией в Европе, ей также угрожают безумные амбиции Берлина. Необходимо взять на себя инициативу по сдерживанию Германии, чтобы помешать валькистской угрозе захлестнуть Европу, иначе демократия везде будет погашена навсегда."

 RHI_form_antivalkist_alliances: "Создание антивалькистских союзов"
 RHI_form_antivalkist_alliances_desc: "Теперь, когда мы свободны, мы оказались в затруднительном положении. Находясь бок о бок с гораздо более крупным и опасным берлинским правительством, которое как никогда готово уничтожить последний шанс Германии на искупление, мы должны идти на компромиссы и сотрудничать с другими странами, чтобы дать отпор и навсегда смыть опасное валькистское пятно с карты Европы."

 RHI_invite_schleischer_hos: "Пригласить Шлейхера"
 RHI_invite_schleischer_hos_desc: "Как бывший канцлер, Курт фон Шлейхер обладает неоспоримой легитимностью в глазах общественности. Закрепив за собой поддержку, возвращение ему поста канцлера, несомненно, поможет укрепить позиции республики — даже если его амбиции явно выходят за рамки обычного канцлерства."

 RHI_continue_council: "Укрепить Совет"
 RHI_continue_council_desc: "Шлейхер — крыса. Хотя формально он и не является преступником, ему и его реакционным приспешникам нельзя доверить восстановление немецкой демократии. Пусть даже это решение и не идеально, только Совету можно доверить продолжение борьбы за демократическую Германию."

 RHI_restore_position_president: "Восстановить пост президента"
 RHI_restore_position_president_desc: "Чтобы закрепить легитимность нашего альтернативного правительства, необходимо сделать шаги к принятию на себя функций прежней власти. Хотя этот процесс в целом завершён, теперь мы должны восстановить пост президента — ключевую должность для сохранения демократии."

 RHI_continued_state_emergency: "Продлить чрезвычайное положение"
 RHI_continued_state_emergency_desc: "В роковом 1932 году мы ввели чрезвычайное положение, чтобы помешать Дресслеру и его приспешникам прийти к власти. Хотя нам и не удалось предотвратить становление его коррумпированного режима, мы получили второй шанс. Как и в 1932 году, государству должны быть даны полномочия для защиты республики — и мы не упустим этот шанс!"

 RHI_work_loyal_trade_unions: "Сотрудничать с лояльными профсоюзами"
 RHI_work_loyal_trade_unions_desc: "В борьбе против валькизма и за республику мы должны заключить союз с профсоюзами, которые играют ключевую роль в завоевании поддержки рабочих. Даже если лояльность некоторых профсоюзов вызывает сомнения, это не должно мешать нашему сотрудничеству с остальными."

 RHI_militarise_state: "Милитаризовать государство"
 RHI_militarise_state_desc: "Мы слишком слабы и обязаны защитить наше государство и народ любой ценой. Мы не можем позволить врагам и конкурентам опередить нас. Мы должны догнать их и продемонстрировать Европе нашу растущую экономическую и военную мощь. Начиная с самого фундамента, мы приступим к милитаризации."
  
 RHI_political_burgfrieden: "Политический бургфриден" # Political Burgfrieden
 RHI_political_burgfrieden_desc: "Республика находится в кризисе, кризисе настолько серьезном, что вся немецкая демократия окажется под угрозой уничтожения, если мы потерпим неудачу. Поэтому сейчас не время для ссор в Рейхстаге, а для всех партий, выступающих за свободу и демократию, объединиться против двойной угрозы валькизма и коммунизма." # The republic is in crisis, a crisis so severe all of German democracy is at risk of being annihilated should we fail. Now is therefore not the time for the Reichstag to bicker, but rather for all parties in favour of liberty and democracy to band together against the dual threat of Valkism and communism.

 RHI_bulwark_against_valkism: "Оплот против валькизма" # Bulwark against Valkism
 RHI_bulwark_against_valkism_desc: "Война неизбежна. Когда Берлин начнет свой нечестивый крестовый поход, мы станем одной из его первых целей. мы должны дать отпор гуннам, иначе мы рискуем снова впасть в варварство." # War is inevitable. When Berlin embarks on its unholy crusade, we will be one of its first targets. we must repel the Huns, or risk Europe falling to barbarism once more.

 RHI_german_unitary_state: "Немецкое унитарное государство" # German Unitary State
 RHI_german_unitary_state_desc: "Германия и немцы, со времен Германии была одна мечта – объединить немцев в рамках великого немецкого государства. Единый, неделимый союз, охватывающий всех говорящих на немецком языке. Однако мы не можем допустить возникновения внутриполитических разногласий, поскольку такой случай может полностью разрушить нашу мечту." # Germany and Germans, ever since the Germania, there was one dream - uniting the Germans under a great German state. An united, indivisible union that would span around all German speakers. However, we cannot let internal political divisions happen, as such a case can make our dream collapse entirely.

 RHI_dorten_adenauer_federalism: "Освободить земли" # Free the States
 RHI_dorten_adenauer_federalism_desc: "Слишком долго многие великие земли Рейха сдерживались и угнетались мертвой хваткой прусской угрозы. С помощью грубой силы пруссаки подчинили и подчинили другие законные немецкие земли своей экстремистской, автократической культуре. Наш долг – сломить эту власть." # For too long, the many great states of the Reich have been kept down and oppressed by the stranglehold of the Prussian menace. Through brute force, the Prussians subsumed and dominated other rightful German lands into their extremist, autocratic culture. It is our duty to break this power.

 RHI_support_federalist_vision: "Поддержать федерализм" # Support the Federalist Vision
 RHI_support_federalist_vision_desc: "Федерализм и права земель — главный вопрос, который мы наконец займемся. Мы поддержим федералистскую мысль и видение. Каждое государство объединилось в память о погибших в революции 1848 года." # Federalism and the rights of states, a main issue that we will finally tackle. We will endorse the federalist thought and vision. Each state united together in memory of those who died in the revolution of 1848.

 RHI_continue_proposed_reforms: "Продолжить предложенные реформы" # Continue the Proposed Reforms
 RHI_continue_proposed_reforms_desc: "Продолжая пересматривать и реформировать Рейх, мы добились большого прогресса. Однако временный характер многих наших реформ просто не дает Федеративной Республике адекватной возможности обладать властью и делегировать обязанности. Мы должны и впредь продолжать такие реформы." # As we continue to revise and reform the Reich, we have made much progress. However, the temporary nature of many of our reforms simply fail to adequately enable the Federal Republic to wield power and delegate duties. We must henceforth continue such reforms.

 RHI_create_rheinischer_rundfunk: "Создать Рейнский Рундфунк" # Create the Rheinischer Rundfunk
 RHI_create_rheinischer_rundfunk_desc: "Rheinischer Rundfunk — проект, созданный правительством с целью не только пропаганды, но и информирования наших граждан о текущих событиях в Рейнской области. Об этом проекте только говорили, но пришло время воплотить его в жизнь." # The Rheinischer Rundfunk, a project made up by the government to not only propagandise, but to inform our citizens of ongoing affairs in Rhineland. This project has been only talked about, but it is time to make it a reality.

 RHI_no_more_prussian_hegemony: "Никакой прусской гегемонии" # No More Prussian Hegemony
 RHI_no_more_prussian_hegemony_desc: "Объединение Германии, несомненно, было делом Пруссии. Бисмарк начал войну против своих собратьев-немцев, унизив Австрию, а также поглотив такие государства, как Ганновер и некоторые, в состав самой Пруссии. Их фарс должен закончиться." # German Unification was undeniably a Prussian affair. Bismarck went to war against fellow Germans, humiliating Austria, as well as absorbing states such as Hanover and some into Prussia itself. Their farce must end.

 RHI_amend_weimar_constitution: "Поправки в Веймарскую конституцию" # Amend the Weimar Constitution
 RHI_amend_weimar_constitution_desc: "Даже если старую, устаревшую Веймарскую конституцию не следует забывать, она оказалась непрочной. Это необходимо изменить и модернизировать до настоящего времени. Если бы в Конституцию были внесены поправки, которые принесли бы нам пользу, мы были бы на пути к тому, чтобы стать европейской державой." # Even if the old, outdated Weimar Constitution should not be forgotten, it proved to be frail. This must be changed and modernised to the present. If the Constitution was to be amended in ways that benefited us, we would be on the way to becoming a European power.

 RHI_design_federal_republic: "Проект Федеративной Республики" # Design a Federal Republic
 RHI_design_federal_republic_desc: "Старый Рейх просто слишком контролировал государства, чтобы предотвратить такую ​​катастрофу, как 1932 год. Если бы центральное правительство позволило штатам просто решать проблемы, пока они не стали угрозой для немецкой демократии, Дресслер просто вошел бы в историю как неудавшийся подражатель Белграда. Эпоха старого Рейха закончилась." # The old Reich was simply far too controlling of the states to prevent such a catastrophe as 1932. Had the central government allowed the states to simply deal with the problems until it became a risk to German democracy, Dressler would simply go down in history as a failed emulator of Belgrade. The era of the old Reich is finished.

 RHI_form_great_coalition: "Формирование великой коалиции" # Form a Great Coalition
 RHI_form_great_coalition_desc: "Даже если мы все расходимся во мнениях практически по всем вопросам политики и вопросов, партии старой республики пока не могут позволить себе ссориться во время величайшего кризиса немецкой демократии. Коалиция социал-демократов и правых центристов — это просто первый шаг к восстановлению демократии по всей Германии." # Even if we all disagree on nearly all policies and issues, the parties for the old republic cannot allow themselves to bicker in German democracy’s greatest crisis yet. A coalition from the social democrats to those right of the centre is simply the first step towards a restoration of democracy across Germany.

 RHI_limit_freedom_press: "Ограничить свободу прессы" # Limit the Freedom of Press
 RHI_limit_freedom_press_desc: "Слишком много неурегулированных и конфиденциальных правительственных дел становится достоянием общественности, что может спровоцировать беспорядки и поставить под сомнение легитимность нашего правительства. Ограничивая и контролируя фабрикацию прессы, мы ограничиваем публичную критику государства в нежестокой форме." # There are far too many unsettled and confidential government affairs being released that may spark unrest and questioning of the legitimacy of our government. By limiting and monitoring the fabrication of the press,  we are limiting public criticism about the state in a non-brutal manner. 

 RHI_reform_state_organs: "Реформа государственных органов" # Reform the State Organs
 RHI_reform_state_organs_desc: "Многие государственные органы заполнены бюрократами, которые в лучшем случае являются пособниками Франции, а в худшем — откровенно враждебны демократии. Даже если их рабочие места необходимы, они просто обладают слишком большой властью, что не подобает свободной республике. Таким образом, необходимо принять меры по децентрализации, чтобы обеспечить нашу демократию и свободу." # Many of the organs of state are filled with bureaucrats who are at best French collaborators and at worst outright hostile to democracy. Even if their jobs are necessary, they simply wield too much power, unbefitting of a free republic. Decentralization measures should thus be taken to secure our democracy and freedom.

 RHI_accept_german_refugees: "Принять немецких беженцев" # Accept German Refugees
 RHI_accept_german_refugees_desc: "После катастрофы 1932 года многие немцы начали бежать в более свободные страны, выступающие за демократию. Однако мы еще не выделили ресурсы для того, чтобы каждый немец мог достичь границ демократии до того, как он будет захвачен тоталитарным правительством. Поэтому давайте предпримем шаги, чтобы гарантировать, что мы станем форпостом немецкой свободы." # Ever since the disaster of 1932, many Germans have begun to flee into freer nations that stand for democracy. However, we have not yet dedicated resources to ensuring that every German can reach the frontier of democracy before they are seized by the totalitarian government. Therefore, let us take steps to ensure that we stand as the outpost of German freedom.

 RHI_das_ganze_deutschland_soll_es_sein: "Das Ganze Deutschland Soll es Sein!" # Das Ganze Deutschland Soll es Sein!
 RHI_das_ganze_deutschland_soll_es_sein_desc: "Многие в наших рядах в лучшем случае скептически относятся к идее о том, что мы являемся законным правительством Германии. Многие иностранцы также придерживаются мнения, что мы всего лишь французский протекторат. Этому необходимо положить конец, если мы действительно хотим принести свободу всей Германии." # Many within our ranks are at best skeptical of the notion that we are the legitimate German government. Many foreigners also hold on to the view that we are merely a French protectorate. This must end if we are to truly bring liberty to all of Germany.

 RHI_federal_german_state: "Федеративная Республика" # The Federal Republic
 RHI_federal_german_state_desc: "Предстоящий путь не будет ни легким, ни простым. Мы выступаем против более могущественного врага, с ненасытным желанием уничтожить свободу и втянуть Германию в войну, в которой невозможно победить, в которой она будет разорвана на части и унижена во второй раз. Но мы будем упорны, немецкий народ ждет, чтобы мы принесем ему свободу – единство, справедливость и свободу!" # The road ahead will not be easy, nor will it be simple either. We stand against a mightier foe, with a ravenous desire to destroy liberty and bring Germany into an unwinnable war that will see it ripped apart and humiliated a second time. But we will persevere, the German people await us to bring them their freedom - for unity, justice and freedom!

 RHI_phoenix_of_republic: "Возрождение Республики" # The Republic Reborn
 RHI_phoenix_of_republic_desc: "Подобно Фениксу, из пепла Веймара родилась новая республика. Республика, которая выдержит все угрозы, республика, воплощающая демократию, истинно свободное государство." # Like a Phoenix, from the ashes of Weimar, a new republic was born. A republic that will endure against all threats, a republic that enshrines democracy, a true free state.


# preparations for great war and the fighting it
 RHI_the_antivalkist_struggle: "Антивалькистская борьба" # The Antivalkist Struggle
 RHI_the_antivalkist_struggle_desc: "Валькизм в бурю покорил сердца и умы Германии и стал почти синонимом немецкого национализма и немецкой культуры. Нам необходимо вооружиться против любых форм вторжений валкистов и вычистить их из души Германии, в прямом и переносном смысле. Мы будем в авангарде международной борьбы против валькизма, и однажды черно-красно-золотое знамя снова поднимется над Рейхстагом." # Valkism has conquered the hearts and minds of Germany in a storm and has become almost synonymous with German nationalism and German culture. We need to arm ourselves against any form of Valkist incursions and purge them from Germany's soul, literally and figuratively. We will be at the forefront of the international charge against Valkism and one day, the Black-Red-Gold banner will fly above the Reichstag again.

 RHI_calm_before_storm: "Затишье перед бурей" # Calm Before the Storm
 RHI_calm_before_storm_desc: "Мы все хорошо осведомлены о трудностях, которые нас ждут, и мы позаботимся о том, чтобы быть настолько подготовленными, насколько это возможно. Все государство неустанно работает над этим моментом. Мы готовы и молча ожидаем того, что будет дальше." # We are all well aware of the struggles that will await us and we will make sure that we are as prepared as we can be. The entire state is working tirelessly towards this moment. We are ready and we are silently awaiting what is to come.

 RHI_collect_overseas_support: "Поддержка из-за границы" # Collect Overseas Support
 RHI_collect_overseas_support_desc: "Чтобы противостоять врагам, которые нас окружают, и многочисленным вызовам, с которыми сталкивается наше государство, нам придется заручиться поддержкой из-за границы. Наша нация будет готова работать со всеми, кто готов поддержать нас в борьбе с нашими врагами и помочь нам достичь целей, которые мы перед собой поставили. Ведь сотрудничество и взаимопомощь – это путь к прочному миру и процветанию." # To stand on our own against the enemies that surround us and the many challenges our state faces we will have to shore up support from overseas. Our nation will be ready to work with all those that are ready to support us against our enemies and help us to reach the goals we have set for ourselves. After all, cooperation and mutual aid is the way to lasting peace and prosperity. 

 RHI_obtain_foreign_recognition: "Получить зарубежное признание" # Obtain Foreign Recognition
 RHI_obtain_foreign_recognition_desc: "Наше признание ограничено, возможно, слишком сильно. Наша легитимность важна, будь то моральный дух, пропаганда или дипломатия. Нам нужно добиться как можно большего признания. При такой степени легитимности мы сможем без особых хлопот проводить дипломатические миссии." # Our recognition is limited, perhaps too much. Our legitimacy is important, be it for morale, propaganda or diplomacy. We need to obtain as much recognition as we can. With that degree of legitimacy, we will be able to conduct diplomatic missions without much hassle.

 RHI_sponsor_catholic_resistance: "Поддержать католическое сопротивление" # Sponsor Catholic Resistance
 RHI_sponsor_catholic_resistance_desc: "Одним из главных противников валкизма является сам Бог, многие члены партии валкистов хотят видеть христианство мертвым или порабощенным. Мы, последователи Бога, не позволим этому случиться. Пусть каждый католический проповедник знает, что он не одинок в этой борьбе. Католицизм устоит и выживет!" # One of the main opponents of Valkism is God himself, many within the Valkist party wish to see Christianity dead, or subjugated. We, followers of God, will not let that happen. Let every Catholic preacher know that they are not alone in this fight. Catholicism will resist and survive!

 RHI_mobilize_the_people: "Подготовка к тотальной войне" # Prepare for Total War
 RHI_mobilize_the_people_desc: "Война на горизонте Европы и нас. Чтобы обеспечить наше выживание на Рейне, нам необходимо подготовить каждый аспект нашего общества к участию в тотальной войне, все и вся должны быть готовы отдать все свои силы ради Рейна." # War is on the horizon of Europe, and us. To ensure our survival of the Rhine we need to prepare every aspect of our society to engage in total war, everyone and everything shall be prepared to give their all for the Rhine.

 RHI_guard_the_rhine: "Укрепить Рейн" # Fortify the Rhine
 RHI_guard_the_rhine_desc: "Основная цель любой страны, находящейся в состоянии войны, — защитить свою землю любой ценой. Таким образом, мы должны укрепить наши земли, граничащие с линиями Пруссии и Франции; если война когда-либо обрушится на наши земли, мы сдержим волну." # The primary objective for any country in war is to protect its land at any cost. As such we should fortify our lands bordering the Prussian and French lines, should war ever crash into our lands, we will hold back the wave.

 RHI_storm_unleashed: "Буря развязалась" # The Storm Unleashed
 RHI_storm_unleashed_desc: "Оно началось, маршируют солдаты, катятся танки, летают самолеты и народы сталкиваются друг с другом. Мы готовы встретиться с нашими врагами, и наши солдаты готовы встретиться с врагом в бою." # It has begun, soldiers are marching, tanks are rolling, planes are flying and nations clash against each other. We are ready to face our enemies and our soldiers are eager to meet the foe in battle.

 RHI_enforce_political_burgfreiden: "Сломить раскол" # Break Factionalism
 RHI_enforce_political_burgfreiden_desc: "Во времена борьбы мы не можем позволить себе воевать друг с другом и разрушать наше национальное единство. Любая форма агитации, которая поставит под угрозу военные действия, будет караться по всей строгости закона. В эти времена мы едины как один народ и одно государство." # In times of struggle, we can not afford to fight each other and break down our national cohesion. Any form of agitation that will jeopardise the war effort will be punished with the full force of the law. In these times we stand united as one people and one state.

 RHI_convert_rhenish_industry: "Военная машина на реке Рейн" # War Machine on the River Rhine
 RHI_convert_rhenish_industry_desc: "Наша промышленность крупна и хорошо развита по сравнению с тем, что было несколько лет назад, и готова поддержать наши военные усилия. Мы должны и дальше инвестировать все, что можем, в расширение наших заводов и перевод их на производство военного времени. Полностью милитаризованная промышленность — это то, к чему нам следует стремиться, если мы надеемся иметь шанс противостоять нашим врагам. Ведь даже лучшим солдатам нужны винтовки и боеприпасы." # Our industry is large and well developed compared to a few years back and ready to support our war efforts. We should further invest what we can to enlarge our factories and convert them to war time production. A fully militarised industry is what we should aim for if we hope to stand a chance against our enemies. After all, even the best soldiers need rifles and ammunition.

 RHI_coordinate_with_entente: "Координация с французами" # Coordinate with the French
 RHI_coordinate_with_entente_desc: "Мы будем координировать наши военные усилия с нашими западными союзниками для максимальной эффективности против наших врагов. Объединившись, мы выстоим против натиска тирании. Мы уже создаем единый генеральный штаб и начнем обучать наши войска и поддерживать оборонительные позиции друг друга." # We will coordinate our war efforts with our western allies for maximum efficiency against our foes. United we will stand against the onslaught of tyranny. We are already in the process of setting up a united general staff and will begin to train our troops and support each other's defensive positions.

 RHI_our_last_stand: "Наш последний бой" # Our Last Stand
 RHI_our_last_stand_desc: "И даже если все рухнет, наши люди не склонятся перед нашими врагами, укрепления вдоль Рейна, укрепления, защищающие наши города, будут нашей последней стойкой. Мы будем бороться за каждое поле, каждую улицу и каждый дом. Никто не сможет сказать, что мы сдались без борьбы." # And even if everything comes crashing down, our men will not bow to our enemies, the fortifications along the Rhine, the fortifications that defend our cities will be our last stand. We will fight for each field, each street and each house. Nobody will be able to say we did go down without a struggle.

 RHI_truce_communists: "Перемирие с коммунистами?" # A Truce with the Communists?
 RHI_truce_communists_desc: "Несмотря на то, что мы в корне не согласны с радикальными социалистами, нам придется признать реальность ситуации и рассмотреть идею перемирия с группами, чтобы решить более серьезные проблемы. В конце концов, старая Республика была разрушена, потому что мы не смогли увидеть более великого врага, сражаясь с ним." # Even though we fundamentally disagree with the radical socialists, we will have to face the reality of the situation and should entertain the idea of a truce with the groups to face the larger issues at hand. After all, the old Republic was destroyed because we were not able to see the greater enemy while fighting with them.

# Securing that tree 
 RHI_securing_the_state: "Обеспечение безопасности государства" # Securing the State
 RHI_securing_the_state_desc: "Когда валкисты у наших дверей, вся основа существования нашей нации находится под угрозой краха. Нам нужно будет создать новую идентичность, но как это будет выглядеть, еще неизвестно..." # With the Valkists at our door, the entire basis for our nation's existence is at risk of collapse. We will need to forge a new identity, but what this will look like remains to be seen...

 RHI_rhenish_exceptionalism: "Отстаивать рейнскую исключительность" # Espouse Rhenish Exceptionalism
 RHI_rhenish_exceptionalism_desc: "Жители Рейна исключительны во всех великих качествах, мы — люди, на которых равняются другие, наша культура соблазнительна, наш ум острый. К сожалению, мало кто в мире знает, насколько велики рейнские люди. Давайте мы им расскажем." # The people of the Rhine are exceptional in all great qualities, we are the people that others look up to, our culture is enticing, our minds sharp. Unfortunately not enough of the world knows how great the Rhenish people are. Let us tell them.

 RHI_anti_prussian_propaganda: "Субсидии националистическим СМИ" # Subsidise Nationalist Media
 RHI_anti_prussian_propaganda_desc: "Националистические СМИ — мощный инструмент, они могут формировать мысли и, что более важно, внешний вид государства. Субсидирование средств массовой информации может быть не только отличным способом стимулирования экономики, но и распространением нашего голоса и наших идеалов. Надо помнить нашим людям, чтобы они не спали под прусским сапогом, иначе они вас раздавят, если вы не обратите внимания." # The Nationalist Media is a powerful tool, it can shape the thoughts and more importantly, the appearance of the state. Subsidising the media can be not only a great way to encourage the economy, but to spread our voice, and to spread our ideals. We must remember our people to not sleep under the Prussian boot, as they will crush you if you don’t pay attention

 RHI_professionalize_schutztruppe: "Профессионализация штурмовиков" # Professionalize the Schutztruppe
 RHI_professionalize_schutztruppe_desc: "Штурмовики могут сделать очень многое только при милицейском обучении. Чтобы лучше защитить нас, нам нужна профессионализация, а не кучка взрослых, играющих в солдат. Штурмовики получат всю необходимую поддержку для профессионализации своего корпуса, будь то совет по реформе или военная подготовка, мы это организуем." # The Schutztruppe can only do so much with militia training. To better protect us, we need professionalisation instead of a bunch of adults playing soldier. The Schutztruppe will get all the support they need to professionalise their corps, be it a reform council or military training, we will arrange it.

 RHI_french_economic_treaty: "Сделка с Парижем" # Deal with Paris
 RHI_french_economic_treaty_desc: "Французы причинили нам вред в прошлом, теперь пришло время отложить соперничество в сторону, поскольку нас зовут более насущные дела на востоке. Подписания экономического договора должно быть достаточно, чтобы сдержать дальнейшие французские предприятия. Не следует забывать, что французы теперь не только союзник, но и оплот против валькизма." # The French have done damage to us in the past, now, it is time to put the rivalry to the side, as more pressing matters in the east call to us. Signing an economic treaty should be enough to deter further French ventures. We shouldn’t forget that the French are now not only an ally, but a bulwark against Valkism.

 RHI_declare_rival_government: "Правительство Кобленца" # The Koblenz Government
 RHI_declare_rival_government_desc: "Несмотря на нашу нынешнюю позицию по отношению к незаконному правительству валкистов в Берлине, нам еще предстоит официально объявить себя отдельным от них правительством. Кто мог бы считать простой режим представителем истинной Германии? С этой целью мы объявим новое правительство — свободное республиканское правительство в Кобленце." # Despite our current stance towards the illegitimate Valkist government in Berlin, we still have yet to officially declare ourselves a separate government from them. Who would consider a mere regime as the representative of true Germany? To this end, we shall declare a new government - a free, republican government in Koblenz.

 RHI_encourage_reichswehr_defections: "Уговорить офицеров Рейхсвера" # Coax Reichswehr Officers
 RHI_encourage_reichswehr_defections_desc: "Известно, что Рейхсвер глубоко консервативен, иногда даже реакционен. Тем не менее, на протяжении всего своего существования Рейхсвер и Берлин часто враждовали. Пришло время воспользоваться этим фактом и призвать этих офицеров наконец оставить государство гнить." # It is known that the Reichswehr is deeply conservative, sometimes, even reactionary. Nevertheless, the Reichswehr and Berlin have been often been at odds all throughout their existence. It is time to take advantage of this fact, and encourage these officers to finally leave the state to rot.

 RHI_work_with_catholic_church: "Сотрудничество с католической церковью" # Cooperate with the Catholic Church
 RHI_work_with_catholic_church_desc: "Согласен немец с государством или нет, существует консенсус в том, что он служит Богу. Служение Богу и служение государству могут быть одним и тем же, если мы будем говорить с католической церковью. Это сотрудничество, если они согласятся, принесет пользу всем немцам в Рейнской области." # Whether a German agrees with the state or not, there is a consensus that they serve God. Serving God and serving the state could be the same, if we articulate with the Catholic Church. This cooperation, if they accept, would be of benefit to all Germans inside the Rhineland.

 RHI_united_against_valkism: "Возродить Объединенные фронты" # Revive United Fronts
 RHI_united_against_valkism_desc: "Немецкий народ сейчас сталкивается с величайшей опасностью. Валькизм и все его производные отравили остальную часть Германии, втянув ее народ в сон, от которого он не сможет проснуться в одиночку. Даже если мы с ними не согласны, каждому потенциальному другу в борьбе с валькизмом, будь то коммунисты, радикальные сепаратисты или даже иностранные союзники, необходимо раз и навсегда разбить валкизм." # The German people now face their greatest peril yet. Valkism and all of its derivatives have poisoned the rest of Germany, dragging her people into a slumber that they cannot wake from alone. Even if we disagree with them, every potential friend in the fight against Valkism, whether it be communists, radical separatists or even foreign allies is necessary to once and for all smite Valkism.


#Unification Trees

# A very German Union
 RHI_the_german_union: "Германский союз" # The German Union
 RHI_the_german_union_desc: "Когда-то Германия была конфедерацией государств. Каждая земля имела собственного правителя и свои законы — при условии, что они соответствовали законодательству союзных органов. Подобно Соединённым Штатам, мы умели улаживать разногласия при возникновении внутренних конфликтов. И хотя в итоге конфедерация распалась, нельзя отрицать, что она просуществовала несколько десятилетий в столь бурную эпоху — особенно после Наполеоновских войн. Пришло время вернуть её к жизни и гарантировать, что она просуществует до скончания веков. Германский союз возродится!" # A long time ago, Germany was once a confederation of states. Each state had its leader and laws, so long as it followed the confederation’s legislature. Akin to the United States, we were able to settle our differences whenever there were problems with each other. While it ended with its dissolution, we cannot deny how it still survived for a few decades in such a chaotic era, especially after the Napoleonic wars. It’s time we bring it back and ensure that it will survive until the end of time. The German Union will be reborn!

 RHI_secure_rights_member_states: "Защитить права земель" # Secure the States' Rights
 RHI_secure_rights_member_states_desc: "Одной из причин краха прежней конфедерации стала наша неспособность обуздать внутренние междоусобицы и заставить её членов идти на компромисс. Чтобы не повторить этой ошибки, мы должны гарантировать, что каждая земля, независимо от её размеров, имеет полное право защищать себя в суде. Союз будет строго пресекать любые попытки участников повлиять на суд с помощью взяток или силы. В любых делах мы должны сохранять максимально цивилизованный подход." # One of the reasons the past confederation failed is that we were unable to curb the infighting between members and their ability to compromise with each other. If we want to avoid this mistake, we must ensure that every state, no matter how big or small, has every right to defend itself in trial. The Union does not take lightly on members who wish to sway the court with bribery or force. We must be ready to stay as civil as possible in all affairs.

 RHI_outline_competences_lander: "Полномочия земель" # The Competencies of the Länder
 RHI_outline_competences_lander_desc: "Земли — это субъекты, входящие в состав Германии. В рамках строительства новой немецкой демократии мы должны решить, каким объёмом власти и ответственности они должны обладать." # The Lander are the constituent states of Germany. As part of the construction of the new German democracy, we must decide how much power and responsibilities they should have.

 RHI_keep_sectors_jurisdiction_union: "Сохранить ключевые сферы юрисдикции" # Maintain Key Jurisdictions
 RHI_keep_sectors_jurisdiction_union_desc: "Чтобы Германия могла эффективно функционировать, центральному правительству придётся взять часть контроля на себя. Внешняя политика, железные дороги и, в меньшей степени, вооружённые силы не могут быть оставлены на усмотрение отдельных земель — их управление должно быть централизованным и должным образом скоординированным." # For Germany to effectively function, the central government will have to take some control. Foreign policy, the railways and to a lesser extent the military cannot be left at the whims of the states - their control must be centralized and coordinated accordingly.

 RHI_create_bundesrat: "Созвать Федеральный совет" # Convene the Federal Council
 RHI_create_bundesrat_desc: "Федеральный совет имеет свои корни в Сейме Конфедерации Германской Конфедерации и служил верхней палатой Имперского Рейхстага. С его первой сессией будут сделаны первые шаги к свободе государств и народов!" # The Federal Council has its roots in the Confederate Diet of the German Confederation, and served as the upper house for the Imperial Reichstag. With its first session, the first steps towards the freedom of the states and the people shall be made!

 RHI_outline_duties_of_union: "Обязанности Союза" # The Duties of the Union
 RHI_outline_duties_of_union_desc: "Как союз, каждое государство имеет право на свои собственные экономические интересы. Однако разве мы не сильнее вместе? Вместе мы воссоздадим старый Zollverein и обеспечим, чтобы Германия могла стоять единой и сильной на мировой арене." # As a union, every state is entitled to their own economic interests. However, are we not stronger together? Together, we shall re-create the Zollverein of old and ensure that Germany can stand united and strong on the world stage.

 RHI_enact_reform_union_law: "Принять Кодекс федеральных законов" # Enact A Federal Law Code
 RHI_enact_reform_union_law_desc: "Новой Германии нужен новый свод законов. Старые валкистские законы будут отменены, и мы обеспечим установление универсального порядка, на котором сможет строиться каждое государство, и в результате это не приведет к безумной анархии или диктаторской тирании." # A new Germany needs a new law code. The old Valkist laws shall be repealed and we shall ensure that a universal order may be established that each state can build upon without the result being one of mad anarchy or dictatorial tyranny.

 RHI_create_bundesgericht: "Создать Федеральный суд" # Create the Bundesgericht
 RHI_create_bundesgericht_desc: "С созданием федерального закона мы также должны опасаться различий в применении закона. Не в каждом штате есть схожие нормы, которые хорошо подходят для одинакового применения закона, поэтому крайне важно создать федеральный суд для толкования закона." # With the creation of federal law, we must also be wary of differing enforcement of the law. Not every state has similar norms that lend themselves well to similar enforcement of law, making it paramount that we establish a federal court to interpret the law.

 RHI_outline_reformed_emergency_decrees: "Реформировать чрезвычайные указы" # Reform Emergency Decrees
 RHI_outline_reformed_emergency_decrees_desc: "Согласно Веймарской конституции, президент Германии обладал чрезвычайными полномочиями. Хотя это оказалось полезным, когда партии не смогли сформировать коалиционное правительство, это также помогло подорвать немецкую демократию. Оно будет реформировано." # Under the Weimar constitution, the German President possessed emergency powers. While this proved useful when parties couldnt form a coalition government, it also helped to erode German democracy. It shall be reformed.

 RHI_implement_bundesexekution: "Осуществить федеральное исполнение" # Implement Bundesexekution
 RHI_implement_bundesexekution_desc: "Bundesexecution — это действие, применяемое против членов, не подчиняющихся законам Конфедерации. Хотя у него есть свое применение, оно привело к австро-прусской войне, в результате которой Германская Конфедерация распалась после ее окончания. На этот раз мы введем такое правило, но оно будет пересмотрено Бундесратом, гарантируя, что все члены не будут следовать за государством-членом, которое было наказано самим законом, иначе они тоже будут наказаны вместе с ним." # Bundesexecution is an act used against members who disobey the laws of the Confederation. While it has its uses, it led to the Austro-Prussian War where the German Confederation dissolved after its end. This time, we will implement such a rule but will be revised under the Bundesrat, ensuring that all members should not follow the member state that was punished by the law itself, lest they too would be punished alongside them. 

 RHI_establish_elitoc: "Исполнительное руководство" # Executive Leadership
 RHI_establish_elitoc_desc: "Всякий раз, когда во времена кризиса или войны Римская республика устанавливала диктатора, который должен был преодолеть огромный кризис, независимо от того, удастся ли ему это или нет. Мы должны отзеркалить себя в прошлом и работать в будущем. Всякий раз, когда нам угрожают, демократическим путем появляется лидер, который сможет пройти через это, и народ будет волею народа сохранить его или нет." # Whenever in times of crisis or war, the Roman Republic installed a dictator, one who would navigate through the immense crisis, if it would succeed or not. We must mirror ourselves in the past and work to the future. Whenever we are threatened, a leader shall democratically emerge to navigate through it, and it will be the people’s will for it to remain or not.

 RHI_form_directory: "Сформировать каталог" # Form the Directory
 RHI_form_directory_desc: "Политические разногласия в Веймаре привели к провалу — отсутствие компромисса между партиями и лидерами создало возможность для Дресслера и его приспешников нанести удар. Суть проблемы очевидна: раскол между государствами. Однако проблема идет дальше, поскольку избрание одного лидера закрепляет их движение. Директория была бы лучше, поскольку мы представляли бы все интересы без закрепленного движения." # Political bickering in Weimar led to failure - the lack of compromise of parties and leaders created the opportunity for Dressler and his lackeys to strike. The heart of the problem is evident: division between the states. The problem goes further though, as electing one leader enshrines their movement. A directory would be better, as we would be representing all of the interests without an enshrined movement.

 RHI_west_german_republic_back: "Зацементируйте Западную Республику" # Cement the Western Republic
 RHI_west_german_republic_back_desc: "Оспаривать шансы значит быть смелым: Западногерманская республика будет светом для тех, кто в ней нуждается, для тех, кто бежит из анархических государств на запад с востока. Когда Германия побеждена, а Пруссия повержена, давайте зажжем факел, чтобы увидеть, как горит гидра." # To contest the odds is to be brave - The West German Republic will be a light for those in need, for those fleeing from the anarchistic states to the west from the east. With Germany beaten and Prussia laid low, let us light the torch so we can watch the hydra burn.

 RHI_maintain_rhenish_supremacy: "Поддерживать господство Рейна" # Uphold Rhenish Supremacy
 RHI_maintain_rhenish_supremacy_desc: "Основой нашей республики является Рейнская область, и поэтому к ней следует относиться с достоинством и уважением, которых она не получила в прошлом. Их проблемы – это наши проблемы, и мы должны помочь всем, чем можем. Хотя мы могли бы извлечь выгоду из поддержки других государств, нам сначала нужно поддержать самих себя." # The backbone of our republic is the Rhineland, and as such should be treated with the dignity and respect it failed to receive in the past. Their problems are our problems and we must help in whatever we can. While we could profit from other states' support, we first need to maintain ourselves.

 RHI_reach_out_to_hessians: "Договориться с гессенцами" # Settle with the Hessians
 RHI_reach_out_to_hessians_desc: "Хотя мы не можем забыть Рейнскую область и ее значение, гессенцы также требуют части нашей работы. Обращение к ним может оказаться полезным в качестве еще одного столпа поддержки нашей популярности и республики. Кроме того, гессенцы с каждым днем ​​доказывают себя могущественным союзником." # While we cannot forget the Rhineland and its importance, the Hessians also demand part of our work. Reaching out to them may prove beneficial as another pillar to support our popularity and republic. Besides that, the Hessians are proving themselves to be a powerful ally each day that passes.

 RHI_reconcile_republicans: "Реинтегрировать республиканцев" # Reintegrate the Republicans
 RHI_reconcile_republicans_desc: "У республиканцев Веймара была мечта, которая не могла быть достигнута в неспокойные времена, но теперь, когда республика была восстановлена, мечта о Веймаре возродилась вновь, с удвоенной силой. Республиканцы, которые когда-то потеряли мечту, теперь находятся в пределах досягаемости для реинтеграции, и, наконец, смерть нашей Старой Республики будет действительно отомщена." # The Republicans of Weimar had a dream that couldn’t be achieved in turbulent times, but now that the republic was restored, the dream of Weimar just reemerged, with double the strength.The republicans that once lost the dream are now in range for reintegration, and finally, the death of our Old Republic shall truly be avenged.

 RHI_destroy_all_prussianism: "Закрепите свободы штатов" # Enshrine the States' Freedoms
 RHI_destroy_all_prussianism_desc: "Всякий раз, когда свободе штатов угрожали, никто не отвечал. Пруссаки злоупотребили своей властью, чтобы закрепить Пруссию на вершине государственной иерархии. Но Пруссия мертва. Пруссия и его пороки остались в забытом прошлом, но некоторые все еще верят в них. Для безопасности республики и Германии мы должны их очистить." # Whenever the freedom of the states was threatened, no one answered. The Prussians abused their authority to enshrine Prussia at the top of the hierarchy of states - But Prussia is dead. Prussianism and its evils are a forgotten past, but some still believe in them. For the safety of the republic and Germany, we must clean them out.

 RHI_devolve_further_autonomy: "Передача ответственности государству" # Devolve State Responsibilities
 RHI_devolve_further_autonomy_desc: "Мы видели риски, которые централизованное немецкое государство представляет для свободы немецкого народа, особенно таких репрессивных государств, как Пруссия. Мы должны обеспечить, чтобы отдельные государства могли не просто дышать, но и процветать!" # We have seen the risks that a centralised German state poses to the liberty of the German people - especially states as oppressive as Prussia. We must ensure that the individual states are not merely able to breathe, but to prosper!

 RHI_ally_regionalist_parties: "Сотрудничать с регионалистами" # Collaborate with Regionalists
 RHI_ally_regionalist_parties_desc: "Существует множество региональных партий, таких как Немецко-ганноверская партия и Баварская народная партия. Сотрудничество с ними позволит нам провести дальнейшую федерализацию Германии." # There exist many regional parties such as the German-Hanoverian Party and the Bavarian People's Party. Cooperation with them will enable us to further federalise Germany.

 RHI_first_among_dem_states: "Первое свободное государство" # The First Free State
 RHI_first_among_dem_states_desc: "Откуда зародилась свобода в ныне свободной Германии? Конечно, прусское Веймарское государство могло быть демократическим, но откуда взялась истинная свобода? Рейнская область была местом нашего происхождения, и ей должны быть должным образом предоставлены признание и привилегии в качестве первого штата Союза." # Where did liberty in the now-free Germany originate from? Sure, the Prussian Weimar state may have been democratic, but where did true freedom come from? The Rhineland was where we came from and must be duly granted recognition and privileges as the first state of the Union.

 RHI_promise_bavaria_more_autonomy: "Работа с баварцами" # Work with the Bavarians
 RHI_promise_bavaria_more_autonomy_desc: "Бавария была крупнейшим государством Германской империи после Пруссии и имела сильную региональную идентичность. Поэтому мы должны работать с ними, чтобы гарантировать, что целостность Союза может быть сохранена вдали от централизующих сил Севера." # Bavaria was the largest state in the German Empire after Prussia, and has a strong regional identity. We therefore should work with them to ensure that the Union’s integrity can be maintained away from the centralizing forces of the North.

 RHI_leverage_northern_resentment: "Используйте северное недовольство" # Leverage Northern Resentment
 RHI_leverage_northern_resentment_desc: "Непримиримость юга во многих случаях нельзя отрицать, особенно если вспомнить 1923 и 1932 годы. Северогерманским землям есть из-за чего расстраиваться, что поможет нам в обеспечении сотрудничества всех государств в новом Союзе." # The intransigence of the south cannot be denied in many cases, especially if one remembers 1923 and 1932. The north German states have much to be upset about, which will help us in ensuring the cooperation of all states in the new Union.

 RHI_ehre_freiheit_vaterland: "Честь свободу отечества" # Ehre Freiheit Vaterland
 RHI_ehre_freiheit_vaterland_desc: "Германия и ее народ свободны. Вместо диктатуры какого-либо одного большого города или государства каждый немец может свободно сражаться и жить своей жизнью, не опасаясь централистского контроля. Even if we may disagree at times, Germany shall ascend in liberty and grace!" # Germany and her people are free. Instead of a dictatorship from any one big city or state, every German is free to fight their battles and live their lives without fearing centralist control. Even if we may disagree at times, Germany shall ascend in liberty and grace!

 RHI_in_service_of_germany: "Служение Родине" # Serving the Homeland
 RHI_in_service_of_germany_desc: "Даже если мы не разделяем тех же властолюбивых желаний, что и прусские короли, интересы Германии все равно необходимо отстаивать. Необходимо предотвратить унижение по воле самодержавных славян и перспективное подчинение западным державам, чтобы Германия не оказалась рабыней мира." # Even if we do not share the same power-hungry desires of the Prussian kings, Germany’s interests must still be upheld. Humiliation at the whims of autocratic Slavs and a prospective subjugation to the Western powers must be averted - lest Germany finds herself a slave of the world.

 RHI_implement_national_armies: "Создание национальных армий" # Implement National Armies
 RHI_implement_national_armies_desc: "Разве это не право свободного государства защищать себя? Хотя перспектива федерализации национальных армий может вызвать у некоторых крипто-пруссаков тошноту, реальность такова, что свободная Германия должна позволить своим штатам выбирать лучший способ защиты." # Is it not a free state’s right to defend themselves? Although the prospect of federalizing the national armies may churn the stomach for some crypto-Prussians, the reality is that a free Germany must allow her states to decide the best way to defend themselves.

 RHI_allow_former_reichswehr: "Реаллоу бывшие офицеры рейхсвера" # Reallow Former Reichswehr Officers
 RHI_allow_former_reichswehr_desc: "Хотя это и неприятно, но очевидно, что лучший способ восстановить армию – это нанять бывших членов рейхсвера. У них есть талант и опыт, которые новая армия не может себе позволить игнорировать." # While somewhat distasteful, it is clear the best way to rebuild the army is to employ ex-Reichswehr members.They have talent and experience the new army cannot afford to ignore. 

 RHI_expel_reactionary_officers: "Вымести прусскую гниль" # Sweep Out Prussian Rot
 RHI_expel_reactionary_officers_desc: "Бывшим сотрудникам рейхсвера нельзя доверять. Армия Веймара никогда не заботилась об интересах республики, подрывая демократию при каждой возможности. Было бы глупо их нанимать." # The former Reichswehr personnel cannot be trusted. The army of Weimar never had the Republic's best interests at heart, undermining democracy at every opportunity. It would be foolish to employ them.

 RHI_formulate_defensive_strategy: "Наброски планов обороны" # Outline Defence Plans
 RHI_formulate_defensive_strategy_desc: "Хотя мы не ожидаем начала войны, на мировой арене все еще существуют потенциальные враги. Не помешало бы разработать новые оборонительные планы на случай нападения." # While we do not expect war to break out, there are still potential enemies on the world stage. It would not hurt to create new defensive plans in case of attack.

 RHI_establish_zentralbehorde: "Установить центральную власть" # Establish the Zentralbehörde
 RHI_establish_zentralbehorde_desc: "Даже в новой Германии, которую мы создаем, все еще есть много жалких радикалов, которые хотели бы видеть себя новым диктатором Германии. Мы должны сокрушить их, чтобы они не обманули людей ложными обещаниями, - что и будет сделано под руководством Zentralbehörde!" # Even in the new Germany we are creating, there are still many pitiful radicals who would like to see themselves as the new dictator of Germany. We must crush them lest they fool the people with false promises - which shall be done under the Zentralbehörde!

 RHI_crush_valkism_communism: "Раздавить экстремистов" # Crush the Extremists
 RHI_crush_valkism_communism_desc: "Будь то остатки валкистов или выскочки красные, экстремизм все еще гниет в Союзе. Мы сделаем следующий шаг, чтобы гарантировать, что это заражение радикалов будет уничтожено раз и навсегда!" # Whether they be Valkist remnants or upstart reds, extremism still festers in the Union. We shall take the next step to ensure that this infestation of radicals will once and for all be extinguished!

 RHI_legacy_of_48: "Вспоминая 48'" # Remembering 48'
 RHI_legacy_of_48_desc: "Мы помним наследие наших предков. Их стремление к свободной и либеральной Германии в свободной и либеральной Европе нельзя просто забыть. Даже если мы не сможем донести эту задачу до остальной Европы, мы не подведем их – ведь Германия станет маяком свободы и жизни в Европе!" # We remember the legacy of our ancestors. Their desire for a free and liberal Germany in a free and liberal Europe cannot be simply forgotten. Even if we are unable to carry this task to the rest of Europe, we shall not let them down - for Germany shall become a beacon of liberty and life in Europe!

 RHI_reaffirm_peace_commitment: "Подтвердить мирные обязательства" # Reaffirm Peace Commitments
 RHI_reaffirm_peace_commitment_desc: "Когда мир был запятнан поджигателями войны, Германия оказалась в проигрыше в двух мировых войнах. При этом сколько бесчисленных невинных людей погибло? Сколько еще матерей должно потерять своих сыновей? Сколько еще детей остались сиротами? Мы должны взять на себя обязательства по миру, чтобы гарантировать, что Германия никогда не забудет об этом." # When peace was tarnished by warmongers, Germany found herself on the losing end of two world wars. In doing so, how many countless innocents have lost their lives? How many more mothers must lose their sons? How many more children find themselves orphans? We must commit to peace to ensure that Germany never forgets.

 RHI_towards_a_united_europe: "На пути к объединенной Европе" # Towards a United Europe
 RHI_towards_a_united_europe_desc: "Единственный способ обрести мир на европейском континенте – это создать единую Европу и объединить все европейские народы под одним флагом и одной страной. Даже если сегодня нам это кажется невозможным, нельзя считать слишком трудным не попытаться. Следовательно, мы должны заложить основу и работать в направлении свободной и процветающей Европы!" # The only way to find peace in the European continent is by creating a united Europe and bringing all the European peoples under one flag, and one country. Even if this seems impossible for us today, it cannot be deemed too hard to not try. We must hence set the groundwork and work towards a free and prosperous Europe!

 RHI_a_policy_of_neutrality: "Заявляем о нашем нейтралитете" # Declare Our Neutrality
 RHI_a_policy_of_neutrality_desc: "Первая мировая война обескровила немецкую нацию. Отцов и сыновей отправили умирать в окопах. Во втором случае Германия стала полем битвы, принеся разрушения, невиданные со времен Наполеона и Тридцатилетней войны. Мы больше не будем идти к завоевательным войнам или быть шахматной доской для великих держав!" # The German nation was bled dry by the first Great War. Fathers and sons were sent to die in the trenches. The second one saw Germany become a battleground, bringing devastation not seen since Napoleon and The Thirty Years War. No more shall we march towards wars of conquest, or be a chessboard for great powers!

 RHI_create_reconstructionfonds: "Создать фонд реконструкции" # Create Reconstructionfonds
 RHI_create_reconstructionfonds_desc: "Частного капитала недостаточно, чтобы увидеть восстановление Германии: государства также не могут копить все свои богатства только для себя. Германия может оправиться от ужасов войны только сообща, поэтому создание общего фонда восстановления является абсолютным приоритетом." # Private capital is not enough to see that Germany is rebuilt - the states too cannot hoard all of their riches for just themselves. Germany can only recover from the horrors of war together - making the creation of a shared fund for reconstruction an absolute priority.

 RHI_create_union_broadcasting_company: "Федеральная радиовещательная корпорация" # Bundes-Rundfunk-Gesellschaft
 RHI_create_union_broadcasting_company_desc: "Вдохновленное BBC, создание государственной службы вещания станет защитой от частных СМИ и позволит нам создать стандартизированную сеть радиостанций по всей Германии, которая будет противостоять потоку лжи, распространяемой радикалами." # Inspired by the BBC, creating a state run broadcasting service would provide a bulwark against private media outlets and enable us to create a standardised network of radio stations across Germany that will counter the flood of falsities spread by radicals.

 RHI_establish_landergewerkschaften: "Создавать национальные союзы" # Establish Landergewerkschaften
 RHI_establish_landergewerkschaften_desc: "Мы должны обеспечить, чтобы ни один рабочий в Германии не чувствовал себя слишком эксплуатируемым капиталом, чтобы он не обратился к марксизму. Для этого мы должны добиться того, чтобы во всех штатах на благо трудящихся были созданы профсоюзы, которые всегда были конструктивными." # We must ensure that no worker in Germany feels too exploited by capital, lest they turn towards Marxism. To this end, we must ensure that trade unions, which have always been constructive, are established in all states to the benefit of the workers.

 RHI_decentralised_banking_system: "Децентрализовать банки" # Decentralize the Banks
 RHI_decentralised_banking_system_desc: "Рейхсбанк играл ключевую роль в финансировании имперской и валкистской военной машины. Понятно, что идея центрального банка, хотя и полезна, но слишком опасна, и ее следует избегать." # The Reichsbank played a key role in financing the Imperial and Valkist War machines. It is clear the idea of a central bank, while useful, is too dangerous as it is employed and must be avoided. 

 RHI_work_with_the_industrialists: "Работайте с промышленниками" # Work with the Industrialists
 RHI_work_with_the_industrialists_desc: "Очевидно, что самый быстрый путь к восстановлению — это сотрудничество с различными промышленниками. Их почти неограниченные ресурсы стали бы большим подспорьем для процесса восстановления." # It is clear the fastest way towards reconstruction is by cooperating with the various industrialists. Their almost unlimited resources would be a great boon for the reconstruction process.

 RHI_destroy_prussian_arsenals: "Уничтожить прусскую военную машину" # Destroy the Prussian War Machine
 RHI_destroy_prussian_arsenals_desc: "Ясно, что лучший способ обезвредить прусского орла — это уничтожить огромные арсеналы. Поэтому такие корпорации, как Крупп и Маузер, будут распущены, а их заводы перепрофилированы не для интересов коррумпированных олигархов, а для благосостояния народа." # It is clear the best way to neuter the Prussian eagle is to destroy the great arsenals. Corporations such as Krupp and Mauser will therefore be dissolved, and their factories repurposed, not for the interests of corrupt oligarchs but for the people's welfare.

 RHI_keep_military_preparations: "Поддержание военного производства" # Maintain Military Production
 RHI_keep_military_preparations_desc: "Хотя многие в правительстве желают демилитаризации, очевидно, что на горизонте все еще существуют угрозы Германии. Поэтому мы должны убедиться, что мы готовы защитить Германию и ее независимость." # While many in the government wish for demilitarisation, it is clear that there are still threats to Germany on the horizon. Therefore we must ensure that we are ready and prepared to protect Germany and her independence.

 RHI_union_worker_laws: "Принять меры защиты работников" # Enact Worker Protections
 RHI_union_worker_laws_desc: "Рабочий класс не должен эксплуатироваться хищническими капиталистами и жадными политиками. Защита трудящихся должна быть включена в число основных гражданских прав, гарантированных и охраняемых законом." # The working class must not be exploited by predatory capitalists and greedy politicians. Protections for the workers ought to be covered as basic civil rights, one guaranteed and enforced by law.

 RHI_create_bundesbahn: "Создать Бундесбан" # Create the Bundesbahn
 RHI_create_bundesbahn_desc: "Надежная система дорог не только поможет оживить экономику и снизить безработицу, но и позволит людям путешествовать из одного конца страны в другой, по-настоящему объединяя Германию." # A robust system of roads would not only help revive the economy and reduce unemployment, but enable people to travel from one end of the country to another, truly uniting Germany. 

 RHI_establish_federal_airfields: "Стройте федеральные аэродромы" # Build Federal Airfields
 RHI_establish_federal_airfields_desc: "Система федеральных аэродромов окажется наиболее выгодной для коммерческих и военных целей. Таким образом, небо Германии будет принадлежать только нам." # A system of federal airfields would prove most beneficial for commercial and military purposes. That way the skies of Germany shall be ours alone.

 RHI_expand_the_ports: "Расширить немецкие порты" # Expand German Ports
 RHI_expand_the_ports_desc: "Многие порты Германии лежат в руинах из-за конфликта. В рамках реконструкции начнется общегосударственная программа ремонта, расширения и строительства верфей, сухих доков и портовых сооружений." # Many of Germany's ports lie in ruins due to the conflict. As part of reconstruction, a nationwide programme of repairing, expanding and building of  shipyards, dry docks and port facilities shall commence. 

 RHI_the_heart_of_europe: "Промышленное сердце Европы" # The Industrial Heart of Europe
 RHI_the_heart_of_europe_desc: "Рейнская область не только географически является центром Европы, но и торговым центром со времен средневековья. Река Рейн является важной артерией экономической жизни, протекающей через континент. Благодаря непрерывным инвестициям, промышленному расширению и тяжелому труду мы создали экономическую державу, которая входит в число лучших в мире. Машины работают, трубы, усеивающие горизонт, поднимают в небо густой дым, а железнодорожные пути прорезают холмы и поля этого растущего чуда человечества. Бьющееся сердце машин и стали." # The Rhineland is not only geographically the center of Europe, it has been a trading center since the Middle Ages. The Rhine River is a major artery of economic life flowing through the continent. Through continuous investments, industrial expansion, and hard labor we have created an economic powerhouse that is among the top of the world. Machines are running, chimneys dotting the horizon are blowing thick smoke into the sky, and railway lines cut through the rolling hills and fields of this growing marvel of mankind. A beating heart of machines and steel.


## the final republican tree
 RHI_phoenix_of_republic: "Республика возрождается" # The Republic Reborn
 RHI_phoenix_of_republic_desc: "В своем величайшем испытании немецкая демократия победила. Зверь Валкист и все его производные были разгромлены, а власти тирании в Германии был нанесен непоправимый удар. Давайте отпразднуем этот день; день, когда феникс республики снова восстанет!" # In its greatest trial yet, German democracy has won. The Valkist beast and all of its derivatives have been smashed and the power of the tyranny in Germany has been dealt an irrevocable blow. Let us celebrate this day; the day where the phoenix of the republic rises once again!

 RHI_rebuilding_the_republic: "Восстановление Республики" # Rebuilding the Republic
 RHI_rebuilding_the_republic_desc: "Старая республика, возможно, и умерла, но ее стойкие защитники продолжали неустанно бороться с тиранией и вернуть дух свободы на немецкие земли. Теперь у нас есть возможность построить что-то новое, нечто великое, что сохранится на века. Да здравствует Германия, да здравствует Республика!" # The old Republic may have died but its stalwart defenders have continued tirelessly to fight against tyranny and bring back the spirit of freedom to the German lands. We now have the opportunity to build something new, something great that will last for centuries to come. Long live Germany, long live the Republic!

 RHI_reform_banking_sector: "Реформировать банки" # Reform the Banks
 RHI_reform_banking_sector_desc: "Банковская система возникла в коррумпированную и хрупкую эпоху Веймара, когда инфляция резко возросла, а вся экономика находилась на грани полного краха. Мы должны гарантировать, что мы защитим себя от любого ущерба экономике, если произойдет кризис, и если мы реформируем ее в тех аспектах, над которыми необходимо работать, мы, возможно, даже сможем принести нам пользу." # The banking system dates back to the corrupt, fragile era of the Weimar where inflation soared and the entire economy was on the utter brink of total collapse. We must ensure that we are keeping ourselves safe from any damage to the economy if a crisis were to occur and if we reform it in aspects that must be worked on we perhaps could even benefit us.

 RHI_dealing_with_the_railways: "Работа с железными дорогами" # Dealing with the Railways
 RHI_dealing_with_the_railways_desc: "Наша железнодорожная система слишком дезорганизована и ушла в прошлое. Мы должны показать нашим врагам, что мы сильнее их и можем легко перевезти большое количество предметов всего за пару дней. Это принесет нам огромную пользу в торговле и снабжении, поскольку мы сможем в кратчайшие сроки перемещать предметы между фронтами!" # Our railway system is far too disorganized and of a bygone age. We must show to our enemies that we are stronger than them and can easily be capable of transporting large amounts of items in just a couple of days. This will massively benefit us in trade and supply as we will be able to transfer items across fronts in no time!

 RHI_compromise_remaining_industrialists: "Заручиться промышленной поддержкой" # Elicit Industrial Support
 RHI_compromise_remaining_industrialists_desc: "Остальные промышленники, в основном более мелкая рыба, чем могущественные промышленные магнаты старой Республики, должны присоединиться к нашему новому республиканскому проекту, если мы дадим им некоторые уступки. Поскольку мы стремимся к свободной рыночной экономике в отличие от валкистов или социалистов, мы, безусловно, можем найти золотую середину. Поддержка промышленности наверняка значительно облегчит восстановление и реализацию новых проектов." # The remaining industrialists, mostly smaller fish than the powerful barons of industry of the old Republic, should be on board with our new Republican project if we give them some concessions. Since we aim for a free market economy opposed to the Valkists or socialists, we can surely find a middle ground. The support of industry will most certainly make rebuilding and new projects much easier.

 RHI_decide_grain_issue: "Зерновой вопрос" # The Grain Issue
 RHI_decide_grain_issue_desc: "Цены на зерно были предметом разногласий со времен старой республики, из-за торговли многие фермеры были в состоянии конкурировать с импортом и, таким образом, столкнулись с финансовыми трудностями. Основной причиной появления партий аграрных интересов и радикализации сельского населения было сосредоточение внимания на городском развитии над сельскими проблемами. Мы будем поддерживать субсидии на зерно, но сосредоточимся на реформировании нашего сельского хозяйства посредством инвестиций в более экономически устойчивые модели. Теперь, когда Юнкерсов больше нет, компромисс должен быть трудным, но возможным. Между тем, продовольственная безопасность позволит найти среднесрочное решение, заключающееся в том, что государство закупит излишки продуктов." # The grain prices have been a point of contention since the old republic, due to trade, many farmers were to able to compete with imports and thus went into financial hardship. A large reason for the agrarian interest parties and radicalisation of the rural population was the focus on urban development over rural issues. We will uphold the grain subsidies but focus to reform our agriculture through investments into more economically sustainable models. Now that the Junkers are gone, a compromise should be hard but possible. Meanwhile the food security will allow for a midterm solution with the state buying surplus products.

 RHI_learn_mistakes_weimar: "Решение структурных проблем" # Address Structural Problems
 RHI_learn_mistakes_weimar_desc: "Было много проблем, которые преследовали старую республику и продолжали присутствовать в Рейнской области. Кроме того, учитывая характер создания нашего государства, мы вынесли на политическую сцену множество новых проблем. Чтобы модернизировать наше государство и предотвратить усугубление этих проблем, нам нужно будет провести расследование и реформировать нашу администрацию, а также приложить все усилия к решению этих структурных проблем. Будь то коррупция, неэффективная бюрократия или неразвитая инфраструктура, мы будем полны решимости построить фундамент сильной Германии." # There have been many problems which plagued the old Republic and continued to be present in the Rhineland. Additionally, with the nature of how our state was created, we introduced a lot of new issues into the political scene. To modernise our state and prevent the festering of these issues, we will need to investigate and reform our administration and invest our full efforts into solving these structural issues. Be it corruption, inefficient bureaucracy or underdeveloped infrastructure, we will be determined to build the foundation for a strong Germany.

 RHI_spectre_prussia: "Прусский призрак" # The Prussian Ghost
 RHI_spectre_prussia_desc: "Прусский призрак по сей день преследует Германию. С момента создания Германии Пруссия была самым консервативным, раздутым бюрократическим и аристократическим государством во всей Германии. Юнкерсы, кайзер и военные составляли большую часть политики – это наследие преследует нас, и пришло время изгнать прусского демона." # The Prussian ghost, it haunts Germany to this day. Ever since the creation of Germany, Prussia has been the most conservative, bureaucracy-bloated, and aristocratic-based state in all of Germany. The Junkers, the Kaiser and the Military made up the majority of the politics - this legacy haunts us, and it is time to exorcise the Prussian demon.

 RHI_break_regionalist_sentiments: "Разрушить регионалистские настроения" # Break Regionalist Sentiments
 RHI_break_regionalist_sentiments_desc: "Продолжающаяся борьба между землями и Берлином позволила реакционерам, а затем и валкистам прийти к власти в Баварии, а затем и во всей стране. Левые аналогичным образом пытались захватить рабочих Саксонии и Тюрингии. Это не может повториться, и мы не должны допустить, чтобы местничество и регионализм снова стали угрозой республике и демократии." # The ongoing struggles between the Länder and Berlin has allowed the reactionaries and later Valkists to come to power in Bavaria and then the nation. The left similarly tried to capture the workers of Saxony and Thuringia. This can not happen again and we should not allow localism and regionalism to be a threat to the Republic and democracy again.

 RHI_red_prussia: "Республиканский оплот" # The Republican Stronghold
 RHI_red_prussia_desc: "При Отто Брауне Пруссия превратилась в оплот республиканских и реформистских идей, как ни одно другое государство Германии. В течение многих лет у нее было стабильное и современное правительство, несмотря на социалистический подтекст, который может привнести такое правительство под руководством СДПГ, оно служит отличным напоминанием о том, на что способна компетентная администрация даже в тех обстоятельствах, с которыми она столкнулась тогда. Мы должны вернуть дух этой Пруссии и стереть реакционную Пруссию с лица земли Германии." # Under Otto Braun, Prussia was expanded to be a stronghold of republican and reformist ideas like no other state in Germany. It had a stable and modern government for years, despite the socialist undertones such a SPD led government may bring, it serves as a great reminder what a competent administration is able to do even under the circumstances it faced back then. We should bring back the spirit of this Prussia and wipe the reactionary Prussia clean from Germany’s slate.

 RHI_downsize_the_giant: "Уменьшите гиганта" # Downsize the Giant
 RHI_downsize_the_giant_desc: "Прусское государство доминировало в политике Германии таким образом, который больше не соответствует нашим демократическим и либеральным идеям. Это могло быть понятно во времена имперской Германии, когда немецкое государство на самом деле было всего лишь Прусской империей, но сегодня для этого уже нет причин. Как видно из того, как Шлейхер с помощью своих военных головорезов сверг ее правительство и использовал Пруссию для эффективного управления всей оставшейся Германией, размеры Пруссии делают ее громоздким государством. В этот критический момент рейхсреформа имеет первостепенное значение, и мы должны создать настоящую федеративную Германию." # The Prussian state has dominated politics of Germany in a way that is not befitting our democratic and liberal ideas anymore. It might have been understandable during the times of imperial Germany, when the German state was really just a Prussian Empire, but today there is no reason for this anymore. As seen in how Schleicher toppled its government with his military goons and used Prussia to effectively rule over all of Germany that remained, Prussia’s size makes it an unwieldy state. At this critical point, Reichsreform is of the utmost importance and we ought to establish a proper federal Germany.

 RHI_emancipate_reichsrat: "Компромисс со Штатами" # Compromise with the States
 RHI_emancipate_reichsrat_desc: "Со времен Империи местничество и партикуляристские интересы преследовали политику. Мы, конечно, понимаем федералистскую историю Германии и те преимущества, которые она нам принесла, но нам необходимо обеспечить реализацию и признание прав федерального правительства, чтобы обеспечить плавное и эффективное управление. В конце концов, мы все видели ловушку старой Республики. Поэтому мы закрепим в нашей конституции Länderkompetenzen и пункт о 5% партийном представительстве, одновременно признавая права штатов в других областях, таких как образование и полицейские обязанности." # Since the days of the Empire, localism and particularist interests have plagued politics.We do of course realise the federalist history of Germany and the benefits it has brought to us but we need to ensure that the rights of the federal government are realised and recognized to ensure smooth and effective governance. After all, we all saw the pitfall of the old Republic. Therefore we will enshrine the Länderkompetenzen and a 5% clause for party representation in our constitution while recognizing the rights of the states in other areas like education and policing duties.

 RHI_reverse_berlin_centralization: "Обратная централизация Берлина" # Reverse Berlin's Centralization
 RHI_reverse_berlin_centralization_desc: "Валкисты перекроили границы немецких государств, игнорируя традиционные границы и региональную идентичность. Германия — это не нация одной расы, а совокупность множества идентичностей с разными культурами. Это вмешательство из Берлина должно закончиться." # The Valkists redrew the borders of the German States, ignoring traditional boundaries and regional identities. Germany is not a nation of one race but a collection of multiple identities with different cultures. This meddling from Berlin shall end.

 RHI_remove_prussia: "Добить Пруссию" # Finish Off Prussia
 RHI_remove_prussia_desc: "Пруссия, не только как политическая единица, но и как идея, является источником бед Германии. Они отправили миллионы людей умирать в окопах, в то время как прусский милитаризм обрушивал на Европу невыразимые страдания на протяжении нескольких поколений. Пруссия должна умереть, чтобы Германия могла жить." #  Prussia, not only as a political entity but as an idea, is the source of Germany’s woes. They sent millions to die in the trenches, while Prussian militarism unleashed untold misery upon Europe for generations. Prussia must die so  Germany can live.

 RHI_replace_reichsrat: "Открытие Федеративной Республики" # Inaugurate the Federal Republic
 RHI_replace_reichsrat_desc: "Для Германии настал исторический момент, чтобы начать путь преобразований. Открывая новую республику, мы закладываем основу для единой, прогрессивной нации, приверженной идеалам равенства, справедливости и коллективного процветания. Отныне Пруссия не может угрожать немецкой демократии." # The historic moment has arrived for Germany to embark on a transformative journey. By inaugurating the new republic, we lay the foundation for a unified, progressive nation committed to the ideals of equality, justice, and collective prosperity. From now on, Prussia cannot threaten German democracy.

 RHI_redraw_state_boundaries: "Размер состояния баланса" # Balance State Size
 RHI_redraw_state_boundaries_desc: "Основная причина, по которой пруссаки доминировали в Германии, заключалась в их огромных размерах. Мы не можем допустить, чтобы это произошло в нашей новой республике, где многие государства могут естественным образом объединиться или остаться слишком маленькими или большими. Мы немедленно исправим это, чтобы сохранить равновесие внутри нации." # The main reason the Prussians dominated Germany in the first place was their sheer size. We cannot let this happen in our new republic, where many states may naturally organize or remain too small or large. We shall rectify this at once to maintain an equilibrium within the nation.

 RHI_leave_the_states_be: "Оставьте Штаты в покое" # Leave the States Be
 RHI_leave_the_states_be_desc: "Мы не должны агрессивно утверждать свое доминирование над политикой наших государств-членов, в конце концов, все различные немецкие регионы имеют свою местную идентичность, которую нужно защищать и которой следует жить, так же, как и Рейнская область. Вместо этого нам следует стремиться работать со штатами как с партнерами в рамках федерального порядка. Как настоящий союз немецкого народа, мы станем чем-то большим, чем просто сумма наших частей, и будем защищать местную самобытность и обычаи. Германское государство, наконец, действительно станет немецким, а не только прусским, только австрийским или только рейнским." # We should not aggressively assert our dominance over the politics of our member states, after all, the various German regions all have their local identities to protect and live by, just like the Rhineland has. We should aim to work with the states as partners in a federal order instead. As a true union of the German people we will become more than the sum of our parts and protect local identities and customs. The German state will finally truly be German instead of only Prussian, only Austrian or only Rhenish. 

 RHI_seize_junker_estates: "Захватить Юнкер Эстейтс" # Seize Junker Estates
 RHI_seize_junker_estates_desc: "Юнкерсы — жадные дураки, которые больше всего любят набивать свои карманы. Немцам хватит! Пора объявить, что все юнкеры должны сдать свои имения правительству; чтобы они не хотели, чтобы их забрали силой!" # The Junkers are greedy fools who love nothing more than to fill their own pockets. The Germans have had enough! It is time to declare that all Junkers must surrender their estates to the government; lest they want them taken by force!

 RHI_eliminate_reactionary_groups: "Очистить реакционеров" # Clean Out Reactionaries
 RHI_eliminate_reactionary_groups_desc: "Теперь, когда мы обеспечили безопасность нашей нации, нам необходимо избавиться от оставшихся реакционных жестких позиций, чтобы открыть путь к новому и лучшему будущему для Германии. Чтобы не повторять ошибок прошлого, мы сосредоточимся на уничтожении любой радикальной националистической группы, которая может возникнуть снова. Не имеет значения, будут ли они сражаться против красных, как показала нам старая Республика. В конце концов, если бы у них была такая возможность, они всегда выступили бы против нас, поэтому никакого сотрудничества с этими реакционными националистами быть не может и никогда не будет." # Now that we have secured our nation, we need to get rid of the remaining reactionary hardlines to open the path towards a new and better future for Germany. To not redo the mistakes of the past we will focus on destroying whatever radical nationalistic group that may arise again. It makes no difference if they fight against the reds as the old Republic has shown us. At the end of the day they would always move against us if they have the chance, therefore there can be and never will be any cooperation with these reactionary nationalists.

 RHI_the_new_threat: "Сосредоточьтесь на новой угрозе" # Focus on the New Threat
 RHI_the_new_threat_desc: "Мы сражались против националистов, мы победили валкистов, пора перестать закрывать глаза на остающуюся угрозу нашей свободе. Мы не можем позволить себе почувствовать чувство вины, заставив отказаться от нашей национальной гордости и веры в свободу только потому, что валкисты и другие радикалы злоупотребляли ценностями чести и патриотизма. Именно они, КПГ, их красные ополченцы и профсоюзные деятели-ренегаты, в трудные времена решили бороться против нашего государства и демократии. Нам нужно наконец изгнать этого демона." # We have fought against the nationalists, we defeated the Valkists, it is time that we stop closing our eyes to the remaining threat to our freedom. We can not let ourselves be guilt tripped into abandoning our national pride and trust in freedom just because Valkists and other radicals abused the values of honour and patriotism. It was them, the KPD, their Red militias and renegade trade unionists, who in times of need decided to fight against our state and democracy. We need to finally exorcise this demon.

 RHI_cultural_offensive_valkism: "Очернить валкистскую культуру" # Villainize Valkist Culture
 RHI_cultural_offensive_valkism_desc: "Валкизм прочно укоренился в нашем обществе. Они бросают вызов давним традициям и морали немецкой культуры. У этих людей нет чувства морали, нет бога и нет истинного видения немецкого государства, кроме их фетиша войны и страданий.  Пришло время показать нашим людям, что они ублюдки, которые пытаются отравить их разум ложными обещаниями и порочной ложью." # Valkism has ingrained itself into our society. They defy the long traditions and morals of German culture. These men have no sense of morality, no god, and no true vision for a German state besides their fetish for war and misery.  It is time we show our people that they are bastards who attempt to poison their minds with false promises and vicious lies.

 RHI_break_valkist_strangelhold_bavaria: "Операция «Погружение с головы»" # Operation Kopfsprung
 RHI_break_valkist_strangelhold_bavaria_desc: "Валкисты отступили в свои последние оплоты в Баварии и пытаются превратить ее в независимое государство. Полиция и военные готовы начать рейд, чтобы предотвратить это последнее восстание и раз и навсегда покончить с валкистами." # The Valkists have retreated to their last strongholds in Bavaria and are attempting to turn it into an independent state. The police and the military are ready to launch the raid to prevent this last insurrection and finish off the Valkists once and for all.

 RHI_end_prussian_militarism: "Преодолеть прусский милитаризм" # Overcome Prussian Militarism
 RHI_end_prussian_militarism_desc: "Наши дни милитаризма и прусской автократии прошли, нет места юнкерам или ОХЛ - мы, наследники республиканской мантии, должны иметь в виду демократию и свободу, будь то в военной или в политической системе. Старики могут справиться, но в новую эпоху появляются новые идеи, заслуживающие внимания." # Our days of militarism and Prussian autocracy are gone, there is no place for the Junkers or OHL - we, the heirs of the republican mantle, must have democracy and freedom in mind, be it in the military or in political system. The old men can cope, but with a new era, there are new ideas that deserve the spotlight.

 RHI_the_question_of_former_valkists: "Разберитесь с оставшимися валкистами" # Deal with the Remaining Valkists
 RHI_the_question_of_former_valkists_desc: "Валькизм – это болезнь, если его вовремя не устранить, он будет распространяться как болезнь. Чтобы не допустить новой войны и возвращения реваншизма, мы должны ликвидировать оставшиеся очаги сопротивления, никаких переговоров с повстанцами нет." # Valkism is a sickness, if it is not eliminated in time, it will spread like one. To prevent another war, and revanchism from coming back, we must eliminate the remaining pockets of resistance, there is no negotiations with rebels.

 RHI_einigkeit_und_recht_und_freiheit: "Единство, справедливость и свобода" # Einigkeit und Recht und Freiheit
 RHI_einigkeit_und_recht_und_freiheit_desc: "Einigkeit und Recht und Freiheit, единство немецкого народа, справедливость для всех и свобода для всех. Неофициальный девиз республики — хороший способ описать наши цели: служить населению — значит иметь честь. Мы прошли трудный путь, чтобы оказаться там, где мы находимся сейчас - от простой базы в Рейнской области до яркой Германской Республики, пути демократии... Предстоящий путь кажется нам светлым, пусть все знают, что республиканская мечта сбылась." # Einigkeit und Recht und Freiheit, unity of the German people, justice for all and freedom to all. The unofficial motto of the republic is a good way of describing our goals, to serve the population is to have honour. We crossed a rough path to be where we are now - from a simple base in the Rhineland, to the bright German Republic, the path of democracy... The path ahead seems bright for us, let all know that the republican dream has come true.

 RHI_defending_the_republic: "Защищая Республику" # Defending the Republic
 RHI_defending_the_republic_desc: "Недостаточно того, что мы свободны от ига иностранного угнетения и внутренней тирании, нам необходимо обеспечить, чтобы так и оставалось. Поэтому необходимо будет построить сильное государство как на поле битвы, так и в сердцах его людей, чтобы противостоять всем тиранам, которые стремятся поставить под угрозу наш образ жизни." # It is not enough that we are free from the yokes of foreign oppression and homegrown tyranny, we will need to ensure that it stays this way. Therefore it will be necessary to build a strong state both at the field of battle and in the hearts of its people to resist all tyrants which aim to threaten our way of life.

 RHI_purge_reichswehr: "Чистка антиреспубликанских офицеров" # Purge Anti-Republican Officers
 RHI_purge_reichswehr_desc: "Мы усвоили, что революции успешны только в том случае, если значительная часть военного командования поддерживает предательские элементы. Мало того, мы также узнали, что значительная часть наших офицеров до краев наполнена реакционными окаменелостями. Мы должны действовать, если хотим очистить нашу армию офицерами с республиканскими взглядами и обеспечить выживание демократии." # We have learned that revolutions are only successful if a large part of the military command supports traitorous elements. Not only that, but we have also learned that a large proportion of our officers are filled to the brim with reactionary fossils. We must act if we are to purify our military with republican-minded officers and ensure the survival of democracy.

 RHI_forgive_the_opportunists: "Простите оппортунистов" # Forgive the Opportunists
 RHI_forgive_the_opportunists_desc: "Многие могли присоединиться к валкистам из-за давления и просто для того, чтобы спастись от чрезмерных репрессий. Нам необходимо открыть возможность этим людям вернуться в лоно демократического государства, которое у них было отобрано. Когда речь идет о вооруженных силах, этот факт может быть особенно очевиден, ведь со времен правления Шлейхера ко многим офицерам и старым дворянам относились с крайним недоверием. Наша армия, безусловно, выиграет, если мы вручим им оливковую ветвь." # Many might have joined the Valkists out of pressure and to simply save themselves from the excessive repression. We need to open avenues for those people to return to the fold of the democratic state that was taken from them. When it comes to the armed forces, this fact might be especially evident, after all, since Schleicher's reign, many officers and old nobles were viewed with extreme distrust. Our army would certainly benefit if we hand an olive branch to them.

 RHI_build_democratic_army: "Восстановить армию" # Rebuild the Army
 RHI_build_democratic_army_desc: "Армия состоит из реакционных офицеров, желающих подорвать демократию в нашей стране. Если мы хотим обеспечить демократию, нам необходимо создать демократическую армию. Тот, где солдат знает, что борется за свой голос, за право голоса, за право на справедливость и единство. Один, единый, выше реакционной политики." # The army is made out of reactionary officers, who desire to subvert democracy in our country. If we wish to secure democracy, we need to create a democratic army. One where a soldier knows he fights for his voice, for the right to vote, for the right of justice and unity. One heer, united, above reactionary politics.

 RHI_business_oriented_foreign_policy: "В мир" # Into the World
 RHI_business_oriented_foreign_policy_desc: "Учитывая, что промышленный центр Германии находится под нашим правлением, а также приток иностранных компаний, открывающих свои предприятия, мы должны обеспечить, чтобы Германия стала не только арсеналом европейской демократии, но и ее мастерской!" # With Germany's industrial heartland under our rule and an influx of foreign companies setting up shop, we must ensure Germany not only becomes the arsenal of European Democracy, but also its workshop! 

 RHI_oppose_tyrannical_socialism: "Выступайте против коммунистического экспансионизма" # Oppose Communist Expansionism
 RHI_oppose_tyrannical_socialism_desc: "Радикальные социалисты и коммунисты будут стремиться использовать людей в качестве оружия против единства нашей нации, чтобы разрушить все, чем мы пожертвовали, чтобы построить. Их влияние растет с каждым расширением, с каждой нацией, которая попадает под их манипуляции, и на это мы говорим: «Больше нет!»" # Radical socialists and communists would seek to weaponize the people against the unity of our nation to tear down all that we have sacrificed to build. Their influences grow with every expansion, with every nation that falls under their manipulation, and to that, we say \"No more!\"

 RHI_support_reichsbanner: "Реформировать рейхсбаннер" # Reform the Reichsbanner
 RHI_support_reichsbanner_desc: "Организация, которая борется за демократию, организация, которая борется с валькизмом - Рейхсбаннер был рожден для защиты конституции, их усилия по защите немецкого народа заслуживают похвалы. Хотя хорошо иметь таких людей, как они, это мало что изменит, если их тактика и командование устареют, возможно, секретный правительственный атташе поможет им реформироваться..." # An organisation that fights for democracy, an organisation that fights Valkism - the Reichsbanner was born for the defence of the constitution, their efforts to defend the German people deserve merit. While it is good to have people like them, it won’t change much if their tactics, and command are outdated, perhaps a secret government attache will help them reform...

 RHI_economic_cooperation: "Европейское экономическое сотрудничество" # European Economic Cooperation
 RHI_economic_cooperation_desc: "С победой демократии мы признаем, что путь к процветанию и стабильности лежит через единство с нашими европейскими соседями. Выступая за дальнейшее европейское экономическое сотрудничество, мы будем интегрировать нашу экономику с другими европейскими странами, способствуя созданию атмосферы взаимного роста и солидарности. ЕЭК сосредоточится на создании общих рынков, согласовании социалистической экономической политики и инвестициях в трансграничную инфраструктуру. Посредством этих усилий мы стремимся снизить торговые барьеры, улучшить совместное использование ресурсов и способствовать коллективному процветанию. Укрепление этих экономических связей не только поддержит наши социалистические цели, но и обеспечит прочный мир и сотрудничество на континенте." # With the victory of democracy, we recognize that the path to prosperity and stability lies in unity with our European neighbours. By advocating for further European economic cooperation, we will integrate our economy with fellow European nations, fostering a climate of mutual growth and solidarity. The EEC will focus on establishing common markets, aligning socialist economic policies, and investing in cross-border infrastructure. Through these efforts, we aim to reduce trade barriers, enhance resource sharing, and promote collective prosperity. Strengthening these economic ties will not only support our socialist goals but also ensure lasting peace and cooperation on the continent.

 RHI_final_treaty_western_powers: "Никогда больше мировой войны" # Never Another Weltkrieg
 RHI_final_treaty_western_powers_desc: "Некогда процветающий Рейх на пути к становлению хозяином Европы был застигнут врасплох чумой Вельткрига, и процветающие улицы Берлина превратились в бедные трущобы с постоянными гражданскими волнениями и столкновениями. Мы никогда не должны пытаться вмешаться в какой-либо Вельткриг, иначе страдания нашего и немецкого народа будут стоить больше, чем мы можем себе представить..." # The once prosperous Reich on the road to becoming the master of Europe was taken by surprise by the plague of the Weltkrieg and what was the thriving streets of Berlin turned into poor slums with constant civil unrest and clashes. We must never ever try to get involved in any Weltkrieg otherwise the suffering for our and the German people will cost more than we can ever imagine... 

 RHI_spd: "Возвращение социал-демократии" # The Return of Social Democracy
 RHI_spd_desc: "СДПГ была главной продемократической партией, но после Великой войны радикализм Германии обратился к реакционерам, и СДПГ не смогла предотвратить приход Дресслера к власти. Однако на этом все не закончилось, СДПГ никогда не угасала, бывшие члены помнят ее наследие, которое теперь будет продолжаться в свободной Германии!" # The SPD has been the main pro-Democracy party, but ever since the Great War, Germany radicalism turned to the reactionaries, and the SPD was unable to avert Dressler’s rise to power. However, that was not the end of it, the SPD never faded away, ex-members remember its legacy that will now continue in a free Germany!

 RHI_democratize_bureaucracy: "Демократизация бюрократии" # Democratize the Bureaucracy
 RHI_democratize_bureaucracy_desc: "Бюрократический класс часто был полон реакционеров и других антидемократических элементов. Правительство Веймара попыталось демократизировать и модернизировать бюрократию, но в конце концов из этого вышла только коррупция. Нам нужно перестроить его и превратить в бюрократию, которая будет поддерживать республику." # The bureaucratic class has often been filled with reactionaries and other anti-democratic elements. The Weimar government attempted to democratise, and modernise the bureaucracy, but in the end, only corruption emerged from it. We need to rebuild it and turn it into a bureaucracy that will uphold the republic.

 RHI_expand_reichsbanner: "Развернуть рейхсбаннер" # Expand the Reichsbanner
 RHI_expand_reichsbanner_desc: "Несмотря на то, что усилия Рейхсбаннера достойны уважения, они по-прежнему остаются небольшой организацией по сравнению с другими военизированными формированиями. В их и наших интересах защитить Германию, и поэтому мы поможем им расширить свою организацию." # Even though the Reichsbanner’s efforts are honourable, they are still a small organisation compared to the other paramilitaries. It is in theirs, and our best interest to protect Germany, and as such, we will help them expand their organisation.

 RHI_united_front_policies: "Поддержите антивалкистские фронты" # Support Anti-Valkist Fronts
 RHI_united_front_policies_desc: "Растущая волна валкизма угрожает дестабилизировать регионы стратегического значения. Чтобы противодействовать этой растущей угрозе, мы должны оказать поддержку антивалкистским движениям по всему миру. Предоставляя военную помощь, финансовые ресурсы и разведывательную поддержку, мы можем усилить эти группировки, дестабилизировать валкистские режимы и усилить свое влияние. Скоординированные усилия будут включать в себя поставки оружия, обучение бойцов сопротивления и проведение тайных операций по подрыву авторитета валкистов. Эта стратегия не только препятствует распространению валкизма, но и объединяет различные фракции с нашими долгосрочными геополитическими целями, обеспечивая глобальный баланс сил, благоприятный для наших интересов." # The rising tide of Valkism threatens to destabilise regions of strategic importance. To counteract this growing menace, we must extend our support to anti-Valkist movements across the globe. By providing military aid, financial resources, and intelligence support, we can strengthen these factions, destabilise Valkist regimes, and promote our influence. Coordinated efforts will include supplying arms, training resistance fighters, and conducting covert operations to undermine Valkist authority. This strategy not only hampers the spread of Valkism but also aligns various factions with our long-term geopolitical goals, ensuring a global balance of power favourable to our interests.

 RHI_rally_the_workers: "Сплотите рабочих" # Rally the Workers
 RHI_rally_the_workers_desc: "Захват Веймарского правительства реакционерами и валькистами продемонстрировал, что только рабочие смогут защитить немецкую свободу и демократию от диктатуры немногих." # The takeover of the Weimar government by reactionaries and  valkists have demonstrated that only the workers will protect German liberty and democracy from the dictatorship of the few.

 RHI_remove_false_socialists: "Акцизные ложные социалисты" # Excise False Socialists
 RHI_remove_false_socialists_desc: "Слово «социализм» оказывает, по-видимому, совершенно магическое воздействие на немецкий народ, который стекается к тому, кто самым смелым образом обещает социализм. Валкисты знали это и воспользовались недовольством людей реальностью, чтобы продать им ложь, которая на самом деле привела только к порабощению рабочих. Многие предполагаемые социал-демократы присоединились к ним в этом предприятии, и именно эту группу мы должны изгнать." # Socialism as a word has seemingly an utterly magical effect on the German people, who flock to whoever promises socialism in the most bold way. The Valkists knew this and capitalized on people’s grievances with reality to sell them lies that really only resulted in the worker’s enslavement. Many supposed social democrats joined them in this venture, and it is this group that we must expel.

 RHI_eschew_reformist_principles: "Откажитесь от реформистских принципов" # Eschew Reformist Principles
 RHI_eschew_reformist_principles_desc: "Время полумер и компромиссов прошло. Реформистские принципы ослабляют наше революционное рвение и препятствуют нашему пути к истинной идеологической чистоте. Мы должны избегать этого сдерживающего влияния и полностью принять радикальные преобразования. Отвергая реформизм, мы можем устранить контрпродуктивные элементы в наших рядах, сосредоточиться на наших бескомпромиссных целях и вызвать волну пылкой преданности среди наших последователей. Этот решительный шаг не только укрепит нашу идеологическую позицию, но и вдохновит наших сторонников, гарантируя, что наша революция останется незапятнанной умеренностью и будет полностью привержена нашему окончательному видению преобразованного общества." # The time for half-measures and compromises has passed. Reformist principles dilute our revolutionary zeal and hinder our path to true ideological purity. We must eschew these moderating influences and fully embrace radical transformation. By rejecting reformism, we can eliminate counterproductive elements within our ranks, focus on our uncompromising goals, and inspire a wave of fervent dedication among our followers. This decisive move will not only solidify our ideological stance but also inspire our supporters, ensuring that our revolution remains untainted by moderation and wholly committed to our ultimate vision of a transformed society.

 RHI_the_democratic_shield: "Демократический щит" # The Democratic Shield
 RHI_the_democratic_shield_desc: "В эти неспокойные времена защита нашей демократии от внешних и внутренних угроз имеет первостепенное значение. Мы должны стремиться укрепить демократические институты нашей страны как партия, создавшая республику. Укрепляя гражданские свободы, способствуя политическому участию и обеспечивая прозрачность, мы можем по-настоящему отомстить за наши неудачи до 1932 года." # In these turbulent times, safeguarding our democracy against external and internal threats is paramount. We must aim to fortify our nation's democratic institutions, as the party that created the republic. By enhancing civil liberties, promoting political participation, and ensuring transparency, we can truly avenge our failures up to 1932.

 RHI_push_interparty_cooperation: "Стремитесь к межпартийному сотрудничеству" # Push for Interparty Cooperation
 RHI_push_interparty_cooperation_desc: "Чтобы обеспечить стабильность и прогресс нашего недавно сформированного правительства, крайне важно, чтобы мы настаивали на межпартийном сотрудничестве. Способствуя диалогу и сотрудничеству между различными политическими фракциями, мы можем создать более инклюзивную и устойчивую политическую среду. Вместе мы сможем создать гармоничный политический ландшафт, который будет поддерживать наши социалистические принципы и вести нашу страну вперед." # To ensure the stability and progress of our newly-formed government, it is imperative that we push for inter-party cooperation. By fostering dialogue and collaboration between various political factions, we can create a more inclusive and resilient political environment. Together, we can create a harmonious political landscape that upholds our socialist principles and drives our nation forward.

 RHI_implement_social_programs: "Реализация социальных программ" # Implement Social Programs
 RHI_implement_social_programs_desc: "Благосостояние наших граждан имеет первостепенное значение для успеха нашей социалистической нации. Реализуя комплексные социальные программы, мы можем обеспечить каждому члену общества доступ к основным услугам и поддержке. Это не просто обязанность, а свидетельство нашей приверженности построению честного и справедливого общества для всех." # The well-being of our citizens is paramount to the success of our socialist nation. By implementing comprehensive social programs, we can ensure that every member of society has access to essential services and support. This is not just a duty but a testament to our commitment to building a fair and just society for all.

 RHI_expel_soviet_agents: "Изгнать жестоких революционеров" # Expel Violent Revolutionaries
 RHI_expel_soviet_agents_desc: "Целостности нашего государства угрожают экстремисты, которые стремятся подорвать принципы нашей революции посредством насилия и хаоса. Чтобы защитить нашу нацию и поддержать демократию, мы должны принять решительные меры и изгнать этих жестоких революционеров из наших рядов. Мы должны сохранить стабильность и легитимность нашего социалистического правительства." # The integrity of our state is threatened by extremists who seek to undermine the principles of our revolution through violence and chaos. To safeguard our nation and uphold democracy, we must take decisive action to expel these violent revolutionaries from our ranks. We must preserve the stability and legitimacy of our socialist government.

 RHI_reform_social_democracy: "Немецкая социал-демократия" # German Social Democracy
 RHI_reform_social_democracy_desc: "По мере того, как в Германии наступает новая эра, мы успешно создали правительство для немецкого народа и для него. Несмотря на то, что социалистические ценности по-прежнему важны, наше бессилие перед приходом к власти валкистов определило для нас новое направление. Мы никогда больше не позволим мелочным расприм и уступкам радикалам разрушить нашу демократию!" # As a new age dawns on Germany, we have successfully created a government for and by the German people. Whilst socialist values are still nonetheless important, our impotence before the Valkist takeover has determined for us a new direction. We will never again let petty infighting and concessions to radicals destroy our democracy!

 RHI_spd_coalitions: "Работа с социал-демократами" # Working with the Social Democrats
 RHI_spd_coalitions_desc: "Despite ideological differences, collaboration with the Social Democrats presents an opportunity to strengthen our socialist government and advance the interests of the working class. By forging a democratic alliance, we can leverage the expertise and resources of the Social Democrats to implement key policies and initiatives.”

 RHI_begin_social_programs: "Начать социальные программы" # Begin Social Programs
 RHI_begin_social_programs_desc: "Создавая новые социальные программы, такие как социальное обеспечение и сеть экономической безопасности, мы можем защитить наших граждан от колебаний нестабильных капиталистических рынков»." # By creating new social programs such as welfare and an economic safety net, we can protect our citizens from the fluctuations of the unstable capitalist markets."

 RHI_ddp: "Либеральное возрождение" # The Liberal Revival
 RHI_ddp_desc: "После падения Веймарской республики демократы вместе с другими партиями отправились в ссылку на Рейн. В великой борьбе либералы веймарской эпохи выжили и превратились в новую партию. С нашей победой над валькизмом в Германии действительно возродился либерализм." # After the Weimar Republic fell, the Democrats alongside other parties went into exile on the Rhine. Through great struggle, the liberals of the Weimar era survived, reforming themselves into a new party. With our victory over Valkism, liberalism has been truly revived in Germany.

 RHI_naumanns_legacy: "Наследие Науманна" # Naumann's Legacy
 RHI_naumanns_legacy_desc: "Фридрих Науманн, создатель и основатель ДДП, а главное, немец, мечтающий о свободе. Либерализм и свобода, поскольку ДДП была создана, чтобы служить этим принципам. Даже после его смерти наследие его имени будет жить в немецкой нации и в наших принципах." # Friederich Naumann, the creator and founder of the DDP, most importantly, a German with dreams of liberty. Liberalism and freedom, as the DDP was created to serve those principles. Even after his death, the legacy of his name will live on in the German nation and in our principles.

 RHI_democratic_coalition: "Сплочение сторонников республиканцев" # Rally Republican Backers
 RHI_democratic_coalition_desc: "Теперь, когда мы защитили наше государство и, наконец, добились самоопределения, нам необходимо сплотиться в великую коалицию против радикалов с обеих сторон политического спектра, чтобы обеспечить стабильный и разумный подход к политике. Создание такой великой коалиции потребует немало усилий, но она поможет нам в эти годы кризиса." # Now that we have secured our state and finally achieved our self determination, we need to rally in a great coalition against radicals on both sides of the political spectrum to provide a stable and sensible approach to politics. Such a great coalition will be a good bit of work to achieve but it will help us in these years of crisis.

 RHI_expand_civil_protections: "Расширить гражданскую защиту" # Expand Civil Protections
 RHI_expand_civil_protections_desc: "Наш народ должен быть в такой же безопасности, как и наше государство, поэтому мы должны принять процедуры для расширения нашей защиты свободы и независимости нашего народа. Нам необходимо обеспечить, чтобы права и свободы наших граждан должным образом ценились и применялись в отношении радикальных людей. Мы не можем вернуться во времена старой республики, когда радикалы выходили на улицы, чтобы запугать демократических избирателей или избивать рабочих, используя свое право на протест." # Our people should be as secure as our state is, as such we must enact procedures to expand our defences of the liberty and independence of our people. We need to ensure that the rights and freedoms of our citizens are properly valued and enforced against radical people. We can not go back to the times of the old Republic, where radicals went to the streets to intimidate democratic voters or beat down workers using their right to protest.

 RHI_party_of_middle: "Средний класс Юнайтед" # The Middle-Class United
 RHI_party_of_middle_desc: "Кто защитит республику и нацию? Рабочий класс привлекают многочисленные обещания социал-демократии, в то время как реакционная элита проводит время, мечтая о возвращении в Кайзеррейх. Только буржуазия может преодолеть разрывы в обществе и построить свободную и демократическую Германию!" # Who will defend the republic and the nation? The working class are drawn towards the many promises of social democracy, while the reactionary elite spend their time dreaming of returning to the Kaiserreich. Only the bourgeois can bridge the gaps in society and bring about a free and democratic Germany!

 RHI_corporate_kickbacks: "Используйте деловые связи" # Exploit Business Ties
 RHI_corporate_kickbacks_desc: "Знакомство с людьми внутри бизнеса часто может быть прибыльным, особенно если их знает и государство. Мы будем стремиться раздавать выгодные контракты бизнесменам, которым доверяют, чтобы ускорить экономическое развитие нашей страны. В конце концов, мы стремимся укрепить нашу нацию, и нет ничего лучше, чем создать сильную взаимозависимую сеть корпораций, деловых кругов и финансовых институтов. Кредиты наших банков финансируют бизнес в нашем штате для оплаты проектов, которые развивают нашу инфраструктуру и так далее... Все должно работать как хорошо смазанная машина." # Getting to know people inside businesses can often be lucrative, especially if the state knows them too. We will aim to hand out lucrative contracts to well trusted businessmen to increase the economic development of our nation. After all, we aim to strengthen our nation and there is nothing better to do that than to forge a strong interdependent network of corporations, business interests and money institutions. Loans from our banks funding business in our state to pay for projects which further our infrastructure and so on... Everything should run like a well oiled machine.

 RHI_assert_germanies_independence: "Поощряйте националистические взгляды" # Encourage Nationalist Views
 RHI_assert_germanies_independence_desc: "Германия свободна, после многих лет борьбы, лет издевательств над нами юнкеров и диктаторов Германия действительно свободна. Мы не можем позволить всему этому прогрессу пойти насмарку, будь то по вине агитаторов или иностранных держав. Мы будем выступать за государство, которое защищает личную свободу, независимость нашей страны от всех иностранных держав и свободу рынков, прессы и нашей экономики. За подлинно демократическую Германию." # Germany is free, after years of struggle, years of the Junkers and dictators abusing us, Germany is truly free. We cannot let all of this progress go down the drain, be it because of agitators or foreign powers. We will stand for a state that protects personal freedom, the independence of our nation from all foreign powers and the freedom of the markets, the press and our economy. For a truly democratic Germany.

 RHI_bolster_white_collar_unions: "Поддержите профсоюзы «белых воротничков»" # Bolster White Collar Unions
 RHI_bolster_white_collar_unions_desc: "Старые либеральные партии и особенно ДВП всегда слишком полагались на поддержку крупного бизнеса и тяжелой промышленности. Как можно обеспечить либеральное участие в жизни общества, если единственные либералы, известные молодежи, — это старые и зачастую элитарные люди? Мы должны поддержать профсоюзы «белых воротничков» в стремлении к доминированию буржуазии, чтобы гарантировать, что республика сможет удержаться не только наверху, но и на середине." # The old liberal parties and especially the DVP were always too reliant on big business and heavy industry for backing. How can liberal participation in society be made if the only liberals known to the youth are old and often elitist men? We must back the white-collar unions in a bid for bourgeois dominance to ensure that the republic can hold not just from the top, but also the middle.

 RHI_free_fair_market: "Свободный и справедливый рынок" # The Free and Fair Market
 RHI_free_fair_market_desc: "Мы далеко ушли от времен квазифеодальной юнкерской экономики и социалистической тирании. Сегодня у нас есть твердые законы и права, которые позволяют каждому человеку в нашем штате преследовать свои собственные интересы, изобретательно извлекать выгоду и работать на благо общества. Таким образом, экономический продукт этой среды используется для обеспечения дальнейшей стабильности рынка, предотвращения роста недобросовестной деловой практики и инвестиций в благосостояние населения. Этот процесс мы называем Soziale Marktwirtschaft." # We have come far from the times of the quasi feudal Junker led economy and the socialist tyranny. Today we have firm laws and rights in place that allow each man in our state to pursue his own interests and benefit with ingenuity and work towards the greater good of society. The economic product from this environment is thus used to ensure the continued stability of the market, prevent the rise of unfair business practices and invest into the welfare of the population. A process we call Soziale Marktwirtschaft.

 RHI_german_industry_reigns: "Восходящий Орел" # The Eagle Ascendant
 RHI_german_industry_reigns_desc: "Германия снова восстает из пепла войны и разрушений. Наша промышленная продукция значительна, и мы стали ценным партнером во всем мире. Делать политику в Европе, не учитывая нас, стало невозможно. Благодаря хорошим связям и сотрудничеству с нашими соседями мы глубоко влились в европейское сообщество и, наконец, преодолели политическую изоляцию после войны." # Germany is rising from the ashes of war and destruction again. Our industrial output is considerable and we have become a valuable partner throughout the world. Making politics in Europe without considering us has become impossible. Through good connections and cooperation with our neighbours we have deeply ingrained ourselves into the European community and finally overcame the political isolation since the war.

 RHI_ddp_coalitions: "Сотрудничество с либералами" # Cooperation with the Liberals
 RHI_ddp_coalitions_desc: "Чтобы построить широкую коалицию центра, нам следует работать со многими небольшими либеральными движениями, возникшими после распада старой республики. Эти партии доказали свою гибкость и готовность присоединиться к демократическому правительству. Хотя, безусловно, существуют разногласия, особенно в отношении идей реформистского социалистического пути СДПГ и христианского консерватизма, они уже выразили готовность выработать компромисс, если мы примем минимальный консенсус. Хороший партнер для нашего правительства." # To build a broad coalition of the centre, we should work with the many small liberal movements that have emerged since the end of the old Republic. These parties have proven flexible and ready to join a democratic government. While there certainly are differences, especially towards the ideas of the SPD’s reformist socialist path and the Christian conservatism, they have already expressed their willingness to work out a compromise as long as we accept a minimum consensus. A good partner for our government.

 RHI_encourage_neoliberalism: "Поддержите неолиберализм" # Support Neoliberalism
 RHI_encourage_neoliberalism_desc: "Мы видели последствия эгоистичного и нерегулируемого капитализма в прошлом. Если Германия хочет процветать и ее народ преуспевает, мы должны поощрять бизнес не просто сражаться, а скорее действовать сообща с рабочими в совместных усилиях по обеспечению процветания всей Германии." # We have seen the effects of selfish and unregulated capitalism in the past. If Germany is to prosper and her people succeed, we must encourage businesses to not simply combat, but rather make common cause with the workers in a joint effort to gain prosperity for all of Germany.

 RHI_enforce_minority_protections: "Обеспечение защиты меньшинств" # Enforce Minority Protections
 RHI_enforce_minority_protections_desc: "Даже самые незначительные меньшинства могут быстро превратиться в радикальную группу из десятков тысяч человек в одночасье, если мы продолжим позволять этнической напряженности продолжаться. Мы должны посвятить себя защите этих меньшинств от тех, кто может причинить им вред, и особенно от тех, кто стремится превратить их в оружие. В конце концов, все субъекты демократического государства подпадают под его юрисдикцию и, следовательно, имеют те же права и защиту, что и их соотечественники." # Even the smallest of minorities can quickly turn into a radicalized group of tens of thousands overnight should we continue to allow ethnic tension to continue. We must dedicate to protecting these minorities from those that would do those harm, and especially those that seek to weaponize them. After all, all subjects of a democratic state fall under its jurisdiction and therefore also share the same rights and protection as their fellow Germans.

 RHI_zentrum: "Центр держит" # The Centre Holds
 RHI_zentrum_desc: "Центр всегда был движением простой и скучной разумной политики, далекой от популистских криков левых и радикальных правых. Даже во времена Веймарской республики Центр был готов стать частью крупных коалиций всех тех демократов, которые готовы делать то, что лучше для народа, а не то, что, по их мнению, лучше для его идеологии или прибыли. С тех пор Центр столкнулся с бесчисленными атаками со всех сторон, но, тем не менее, мы здесь, доказывая, что простая разумная политика всегда побеждает тупой и сенсационный популизм." # The Centre has always been the movement of plain and simple boring sensible politics far removed from the populist screaming of the radical left and the radical right. Even in the times of the Weimar Republic, the Center was ready to be part of large coalitions of all those democrats who are willing to do what is best for the people, not what they think is best for their ideology or profit. The Center since then has faced countless attacks from all directions but yet here we are, proving that simple sensible politics always wins over dumb and sensationalist populism.

 RHI_fortify_democratic_principles: "Укрепляйте демократические принципы" # Fortify Democratic Principles
 RHI_fortify_democratic_principles_desc: "Падение республики показало нам, что происходит, когда истинные демократы становятся меньшинством в республике. Вместо того, чтобы ссориться друг с другом, все истинные лидеры, все партии и все люди должны объединиться в одном благородном курсе — защите нашей свободы и защите наших демократических идеалов. Мы не можем терпеть ни одно движение или институт, которые открыто противостоят демократии, и мы сделаем все возможное, чтобы изгнать этих демонов в нашем новом государстве. Народ должен править и никто кроме народа." # The fall of the Republic has shown us what happens when true democrats become a minority in a Republic. Instead of bickering against each other, all true leaders, all parties and all men have to be united in one noble course, the defence of our freedom and the defence of our democratic ideals. We can tolerate no movement or institution which is openly opposed to democracy and we will do our best to exorcise these demons in our new state. The people have to rule and no one but the people.

 RHI_defend_christian_values: "Защищайте христианские ценности" # Defend Christian Values
 RHI_defend_christian_values_desc: "Наши христианские ценности подвергаются нападкам со стороны радикалов, безбожных коммунистов и, прежде всего, движения валкистов. Как защитники того, что правильно в Германии, мы должны противостоять любому подавлению нашей веры и решительно давать отпор любым нападкам на Церковь и ее институты. Только наша консервативная христианская мораль и ценности защищают нас от варварства, охватившего современный мир." # Our Christian values are under attack from radicals, godless communists, and most of all, the Valkist movement. As the defenders of that which is right in Germany, we must resist any suppression of our faith and firmly fight back against any attacks against the Church and its institutions. Only our conservative christian morals and values defend us from the barbarism that has gripped the modern world.

 RHI_incorporate_protestant_christians: "Покиньте Башню" # Leave the Tower
 RHI_incorporate_protestant_christians_desc: "Партия «Центрум» гордится своей католической базой поддержки и своей католической политикой. Однако, если мы когда-нибудь захотим увидеть Германию объединенной, нам придется отказаться от этого разделения. Протестанты любимы Христом так же, как и католики. Не надо их разделять в нашей партии, хоть они и поклоняются ему по-разному." # The Zentrum party is proud of their Catholic support base, and its Catholic policies. However, if we ever wish to see Germany united, we will need to abandon this division. Protestants are loved under Christ just as Catholics are. There is no need to divide them in our party, even though they worship him differently.

 RHI_aid_the_farmers: "Помощь фермерам" # Aid the Farmers
 RHI_aid_the_farmers_desc: "В нашей промышленно развитой стране мы, к сожалению, пренебрегаем благополучием фермеров, чьи руки кормят всех, от бедных до богатых. Они заслуживают большего от нашей страны, поэтому мы должны предоставить экономическую помощь и помощь оборудованием, чтобы погасить наши долги и способствовать экономическому росту в этом заброшенном секторе." # In our industrialized nation we have regrettably neglected the well-being of the farmers whose hands feed all from the poor to the rich. They deserve more from our nation, as such we should provide economic and equipment aid to repay our debts and promote economic growth from this neglected sector.

 RHI_maintain_z_integrity: "Поддерживайте нашу честность" # Maintain our Integrity
 RHI_maintain_z_integrity_desc: "Честность Zentrum никогда не подведет, наши избиратели выбрали нас за то, что мы обещали и что мы должны выполнить, в противном случае мы потерпели бы неудачу как партия и как лидеры. Мы останемся защитниками католицизма в Германии, ибо разве мы еще не доказали свою состоятельность в величайшем испытании немецкой демократии?" # The Zentrum integrity will never fail, our voters picked us for what we promised and we should deliver, otherwise, we have failed as a party and as leaders. As the defenders of Catholicism in Germany we shall stay, for have we not proven ourselves in the greatest trial of German democracy yet?

 RHI_defend_the_states: "Защитить Штаты" # Defend the States
 RHI_defend_the_states_desc: "Государства старой республики едва находились под властью Пруссии и господства Берлина, теперь, когда мы, наконец, у власти, мы осуществим долгожданную реформу Рейха, о которой уже мечтали в 1920-х годах, и защитим ее благородные цели. Никто, ни человек, ни правительство не может нарушать священные права государств. Мы предотвратим создание еще одного унитарного патерналистского правительства и вместо этого доверимся немецкому федерализму." # The states of the old Republic barely were dominated by the power of Prussia and the supremacy of Berlin, now that we are finally in power, we shall bring the long awaited Reichsreform which was already dreamed up in the 1920s and defend it noble goals. No one, man or government can violate the sacred rights of the states. We will prevent the establishment of another unitary paternalistic government and instead trust in German federalism.

 RHI_combat_spd: "Борьба с СДПГ" # Combat the SPD
 RHI_combat_spd_desc: "The socialist threat posed by the SPD whilst tame is still something that must be resisted. Not only do they seek to lure away Catholics from their true defenders with their false promises, but their socialist nature enables them to make common cause with anti-republican forces in the destruction of Germany. We must take measures to combat them, both in the government and the public.”

 RHI_party_of_the_right: "Партия правых" # Party of the Right
 RHI_party_of_the_right_desc: "Мы — стойкие защитники консерватизма, христианских ценностей и традиционного образа жизни. Ни варвары-валькизмы, ни социалистические бандиты никогда не будут угрожать нашему образу жизни, нашим семьям, нашим детям и будущему нашей нации. Мы обеспечим безопасность и процветание всех, кто живет под нашим правительством, и выступим за мир и сотрудничество во всей Европе." # We are the stalwart defenders of conservatism, christian values and the traditional way of life. Neither Valkism barbarians nor socialist bandits shall ever threaten our way of life, our families, our children and the future of our nation. We will ensure the security and prosperity of all those that live under our government and stand for peace and cooperation throughout Europe.

 RHI_zentrum_coalitions: "Компромисс с Центром" # Compromising with the Centre
 RHI_zentrum_coalitions_desc: "Центр постоянно меняется и склонен к диалогу, и нам нужны союзники для выживания и комфорта нашего правительства. Возможно, предложение им оливковой ветви поможет исправить раскол между нашими партиями." # The Centre is ever-changing and prone to conversation, and we need allies for our government's survival and comfort. Perhaps offering an olive branch to them may help mend the rift between our parties.

 RHI_beat_revolutionary_tendencies: "Цензурные революционные тенденции" # Censor Revolutionary Tendencies
 RHI_beat_revolutionary_tendencies_desc: "Революционеры по обе стороны партии продвигают идеи, которые могут поставить под угрозу наше положение на мировой арене как в дипломатическом, так и в военном отношении. Еще в наших источниках говорят, что революции готовятся невидящими глазами. Нам необходимо действовать быстро, чтобы предотвратить дальнейшую поддержку этих радикальных организаций и их возвращение к нормальной жизни." # Revolutionaries on both sides of the aisle promote ideas that would endanger our position on the global stage both diplomatically and militarily. There’s also talk from our sources that revolutions are being prepared from unseeing eyes. We need to act quickly to prevent further support from going into these radical organizations and back into normality.

 RHI_lighten_federal_restrictions: "Ослабление федерального участия" # Lighten Federal Involvement
 RHI_lighten_federal_restrictions_desc: "Одной из проблем, с которыми сегодня сталкивается наш народ, является властное правительство, которое замедляет все с помощью правил. Мы должны предоставить людям и предприятиям достаточно места для свободной деятельности без немигающего ока правительства, висящего над головой." # One of the problems facing our people today is the overbearing government that slows everything down with regulations. We should allow the people and businesses ample space to operate freely without the unblinking eye of the government hanging overhead.

 RHI_empower_unions: "Расширение возможностей дружественных союзов" # Empower Friendly Unions
 RHI_empower_unions_desc: "Хотя профсоюзы всегда являются непостоянной темой, мы должны стремиться работать вместе с теми, кто разделяет демократическое видение нашего государства, и таким образом заручиться поддержкой рабочего класса. Цель социальной рыночной экономики, приносящей пользу всем, будет все ближе. Нам нужно только предотвратить новую радикализацию этих профсоюзов, будь то валькистские или социалистические." # While trade unions are always a fickle topic, we should aim to work together with those that subscribe to our state's democratic vision and gain the support of the working class that way. The goal of a social market economy that benefits everyone will be ever closer. We only need to prevent another radicalisation of these unions be it Valkist or Socialist. 

 RHI_ally_local_parties: "Союзные местные партии" # Ally Local Parties
 RHI_ally_local_parties_desc: "Многие местные партии разделяют интересы «Центрума», многие разделяют интересы в федерализации, другие — в христианском образовании, но, в конечном итоге, они поддерживают часть нашей повестки дня. Будут организованы встречи с лидерами этих партий в надежде на достижение общих целей." # Many local parties share interests with the Zentrum, many share interests in federalisation, others in Christian education, but at the end of the day, they support parts of our agenda. Meetings with the leaders of these parties are to be arranged, in the hopes of achieving common goals.


### "Я люблю республику" tree # I love the republic
 RHI_national_opposition: "Национальное движение" # The National Movement
 RHI_national_opposition_desc: "Германия и идея Рейха еще не умерли, поскольку мы являемся ее факелоносцами. Национальные республиканцы доказали свою ценность, восстановив Рейнскую область как первую провинцию восстановленного Рейха. Идеи Шлейхера о новом корпоративном государстве поведут нас вперед против валькистского варварства и слабости первой республики. Никаких больше французов, никаких сепаратистов, только сила и единство ради Отечества." # Germany and the idea of the Reich are not yet dead, as we are its torch-bearers. The national republicans have proven their worth with the reconstruction of the Rhineland as the first province of a restored Reich. Schleicher’s ideas of a new corporate state will guide us forward against Valkist barbarism and the weakness of the first Republic. No more French, no more separatists, only strength and unity for the Fatherland.

 RHI_german_fatherland_front: "Укрепить фронт" # Entrench the Front
 RHI_german_fatherland_front_desc: "Фронт — единственный способ выжить нашей нации против врагов изнутри и снаружи. Отечественный фронт придет, чтобы упорядочить общественную жизнь нашего государства и объединить все аспекты жизни общества ради безопасного и надежного государства. Более того, мы будем сотрудничать с государствами-единомышленниками за рубежом, чтобы сформировать сильный военный фронт. Отечественный фронт сегодня – это бьющееся сердце нашей нации." # The Front is the only way our nation will survive against enemies from within and without. The Fatherland Front will come to order the public life of our state and incorporate all aspects of society, for a safe and secure state. Furthermore we will cooperate with like minded states abroad to form a strong military front. The Fatherland Front today is the beating heart of our nation.

 RHI_sammlungspolitik: "Политика сбора" # Sammlungspolitik
 RHI_sammlungspolitik_desc: "Хотя кайзер был некомпетентен, есть одна его политика, которую мы видим полезной: Sammlungspolitik. Нам необходимо объединить людей и партии под одним знаменем, чтобы добиться целей Германии. Против социалистической риторики и против тех, кто делает нас слабыми." # While the Kaiser was incompetent, there is one policy of his that we see use for: Sammlungspolitik. We need to unite the people and parties under one banner to push the German goals. Against socialist rhetoric and against those who make us weak.

 RHI_the_right_values: "Усиление антисоциалистической риторики" # Heighten Anti-Socialist Rhetoric
 RHI_the_right_values_desc: "Социалистического зверя можно убить не мечом, а словом. Информируя народ об опасностях социалистической гидры, мы можем укрепить традиционное немецкое общество от всех врагов. Всякий раз, когда появляется Гидра, ручка должна быть в состоянии остановить ее, а пресса должна быть в состоянии убить ее." # The socialist beast is not one you can kill with a sword, but with words. Informing the people against the dangers of the socialist hydra, we can entrench the traditional German society against all foes. Whenever the Hydra appears, a pen should be able to stop it, and the press should be able to kill it.

 RHI_empower_reactionary_zentrum: "Поддержите реакционеров в Центруме" # Support Reactionaries in Zentrum
 RHI_empower_reactionary_zentrum_desc: "Хотя Шлейхера и не ненавидят в Центруме, ему определенно не хватает поддержки. Его централистские тенденции не нашли отклика у многих федералистов в партии. Однако прусское крыло во главе с Францем фон Папеном оказалось податливым Шлейхеру, предоставив нам прекрасную возможность." # Whilst Schleicher is not detested by those in Zentrum, he most certainly lacks support. His centralist tendencies have not struck a chord with the many federalists in the party. However, the Prussian wing led by Franz von Papen has proven amenable to Schleicher, granting us an excellent opportunity.

 RHI_align_national_socialists: "Ассимилируйте патриотических социал-демократов" # Assimilate Patriotic Social Democrats
 RHI_align_national_socialists_desc: "Хотя большинству социал-демократов нельзя доверять, некоторые готовы последовать примеру членов СДПГ, поддержавших войну. Сделав некоторые символические уступки, мы сможем привлечь их в свои ряды." # While most of the Social Democrats can't be trusted, there are some willing to follow the example of the SPD members who supported the war. By making some token concessions, we can bring them into the fold.

 RHI_lip_service_promises: "Программы обслуживания губ" # Lip Service Programs
 RHI_lip_service_promises_desc: "Чтобы убедиться, что рабочие сотрудничают с нами, и предотвратить любые ненужные забастовки, мы должны обязательно реализовать некоторые популярные программы и реформы, ориентированные на рабочих. Большинство простых людей удовлетворены, если их основные потребности удовлетворены, и тогда этих немногих идеологических радикалов можно смело игнорировать. Простые реформы должны легко осуществляться с минимальными затратами и предотвращать более серьезные проблемы, такие как забастовки или даже поддержка левых движений." # To make sure that the workers cooperate with us and to prevent any unnecessary strikes, we should make sure to make some popular worker oriented programs and reforms. Most of the common people are satisfied if their basic needs are met and those few ideological radicals can then be safely ignored. Simple reforms should be easy to implement at a minimal cost and prevent larger issues like strikes or even support for left-wing movements.

 RHI_align_big_business: "Выровнять большой бизнес" # Align Big Business
 RHI_align_big_business_desc: "Промышленники до сих пор довольно симпатизировали нашему делу, поскольку мы положили конец французской оккупации. Ведь валкисты в своем отношении к экономике едва ли лучше марксистов. Однако до сих пор большинство крупного бизнеса не хотели нас поддерживать из-за нестабильности и сомнительного характера нашего правительства. Но поскольку эти проблемы больше не являются чем-то само собой разумеющимся, мы должны развивать эти деловые связи и согласовывать этих людей с нашими целями." # The Industrialists so far were rather sympathetic to our cause, since we ended the French occupation. After all, the Valkists in their attitude to the economy are barely better than Marxists. However so far most of the big businesses were reluctant to support us due to the instability and questionable character of our government. But since these problems are not a given anymore we should pursue these business ties and align these people with our goals.

 RHI_former_dnvp_connections: "Используйте реакционных союзников" # Utilize Reactionary Allies
 RHI_former_dnvp_connections_desc: "Хорошо известно, что не все правые движения поддерживают валькистов, существовала активная правая оппозиция Дресслеру, начиная с восстания Людвига фон Кар в Баварии. Многие из них принадлежат к старой элите, высшему обществу или даже армии и поэтому наверняка станут хорошими союзниками, пока мы сможем держать их под контролем." # It is well known that not all right wing movements favor the Valkists, there was an active right wing opposition to Dressler going back as far as Ludwig von Kahr’s rebellion in Bavaria. Many of them are from the old elites, higher society or even the army and would therefore surely make good allies as long as we can keep them under control.

 RHI_incorporate_schutzvereine: "Интегрировать стрелковый клуб" # Integrate the Schützenverein
 RHI_incorporate_schutzvereine_desc: "То, что в настоящее время является гражданским спортом, может быть полезно для нашей стратегии глубокоэшелонированной обороны и дальнейшей милитаризации общества. Нам следует поощрять участие и сильные местные традиции этих организаций и выделять им некоторые средства. Если мы сделаем их профессиональными, они могли бы помочь нам в целом познакомить людей с оружием, боем и товариществом без явного военного призыва. Тот, кто раньше держал в руках пистолет, более полезен для нашего дела." # What is currently a civilian sporting activity, could be useful for our in depth defence strategy and further militarisation of society. We should encourage the participation and strong local traditions of these organisations and allocate some funds to them. If we professionalise them, they could help us to generally introduce people to weaponry, combat and comradery without an overt military draft. Someone who has held a gun before is more useful for our cause.

 RHI_use_monarchist_imagery: "Используйте монархические образы" # Use Monarchist Imagery
 RHI_use_monarchist_imagery_desc: "Монархия, хотя и была слабой и хрупкой, все же имела удивительно большое количество сторонников. Созданный ею национализм также был удивительным: даже в Веймаре Германская империя и ее учреждения оставили след в жизни людей. Мундир, армия, слава прусской армии. Все это были факторы, но все они были приписаны монархии, и мы не должны позволить этому пропасть даром. Использование монархии в качестве инструмента пропаганды – это всего лишь то, как движется лодка в Германии." # The monarchy, whilst weak and frail, still had a surprisingly large number of supporters. The nationalism it created was also surprising, even in the Weimar, the German Empire and its institutions left a mark on the people. The uniforms, the military, the glory of the Prussian army. All of these were factors, but all attributed to the monarchy, we shouldn’t let this go to waste. Using the monarchy as a propaganda tool is merely how the boat in Germany goes.

 RHI_end_liberals: "Подавить либеральную оппозицию" # Suppress Liberal Opposition
 RHI_end_liberals_desc: "Либералы, идеалисты-оппортунисты, те, кто, пусть и невольно, сделали нашу нацию слабее. Эти голоса до сих пор раздаются после Веймара, хотя их организация должна была сгореть из-за распада демократии." # The liberals, idealist opportunists, those who even if unwillingly, made our nation weaker. These voices still echo after Weimar, even though their organisation should’ve burned with the failing democracy.

 RHI_repudiate_versailles: "Осудить Версаль" # Denounce Versailles
 RHI_repudiate_versailles_desc: "Версаль, абсолютно ужасный договор, навязанный нам после нашего позорного поражения в Великой войне. Договор сделал нас слабыми, уязвимыми и побежденными в экономическом, политическом и военном отношении. Мы открыто осудим этот договор как символ экспансионизма и эгоизма союзников, Deutschland Uber Alles!" # Versailles, the absolute horrid treaty imposed upon us after our embarrassing defeat in the Great War. The treaty has made us weak, vulnerable, and economically, politically, and militarily defeated. We shall outright denounce this treaty as a symbol of Allied expansionism and selfishness, Deutschland Uber Alles!

 RHI_rule_by_decree: "Правило по указу" # Rule By Decree
 RHI_rule_by_decree_desc: "В такие времена демократические принципы оказались непригодными, мы увидели, куда нас привела некомпетентность Веймарской республики. Мы должны следовать идеям Шлейхера и Папена и ввести чрезвычайное положение, чтобы быстро принять закон без какого-либо длительного процесса. В любом случае парламент уже поддерживает наше правительство." # In times like these, the democratic principles have proven to be unsuitable, we have seen where the ineptitude of the Weimar Republic has led us. We should follow the ideas of Schleicher and Papen and establish a state of emergency to quickly pass legislation without any lengthy process. The parliament already supports our government anyways.

 RHI_loyal_bureaucracy: "Защитите бюрократию" # Secure the Bureaucracy
 RHI_loyal_bureaucracy_desc: "Бюрократия – это старый способ организации, призванный остановить коррупцию. Однако с расширением бюрократии все больше и больше людей с разными мнениями могут стать важными исками, поэтому реформы, даже без налета коррупции, могут быть остановлены и отложены. Чтобы предотвратить антигерманскую бюрократию, нам следует взять дело в свои руки и поставить пешки на стол, прямо у ферзя." # Bureaucracy is an old way of organisation, meant to stop corruption. However, with the expansion of bureaucracy, more and more people, with different opinions can become important suits, so reforms, even without the taint of corruption, can get stopped and delayed. To prevent anti-German bureaucracy, we should take matters into our own hands, and place the pawns at the table, right at the queen.

 RHI_loyal_officer_clique: "Расширьте возможности лояльных офицеров" # Empower Loyal Officers
 RHI_loyal_officer_clique_desc: "С момента создания нашего нового правительства мы не смогли адекватно компенсировать тем, кто всегда стоял на стороне немецкой нации и ее народа. Такого больше не будет – наши братья по оружию заслужили долгожданное повышение по службе." # Ever since the creation of our new government, we have failed to adequately compensate those who have always stood at the side of the German nation and her people. This will no longer be the case - our brothers-in-arms deserve their long awaited promotions.

 RHI_centralize_control: "Удалить все препятствия" # Remove All Roadblocks
 RHI_centralize_control_desc: "Как бы нам ни хотелось обеспечить прочность нашего правления, в нашем распоряжении просто нет абсолютной власти для этого. С этой целью мы должны гарантировать, что весь контроль в Рейхе перейдет в наши руки, чтобы мы не позволили регионам отделиться и поставить под угрозу безопасность Германии." # As much as we would like to ensure our reign holds strong, we simply do not have the absolute power at our disposal to do so. To this end, we must ensure all control in the Reich falls into our hands - lest we allow regions to break away and risk Germany’s security.

 RHI_arrest_ringleaders: "Арест коммунистических лидеров" # Arrest Communist Ringleaders
 RHI_arrest_ringleaders_desc: "Похоже, что коммунисты добились небольших успехов после падения нелегитимного берлинского правительства. Если и было что-то, в чем мы могли бы согласиться с предателями 1932 года, так это опасность коммунистов, которым недолго осталось оставаться свободными!" # It appears that the communists have made small gains following the fall of the illegitimate Berlin government. If there was one thing we could agree with the traitors of 1932 on, it was the danger of the communists - who shall not remain free for much longer!

 RHI_authoritarian_republic: "За пределами Веймарской анархии" # Beyond Weimar's Anarchy
 RHI_authoritarian_republic_desc: "Анархия старой республики продемонстрировала, что демократия непостоянна и что мы не можем рисковать, позволив революционерам левых и правых заразить республику. Если новая Германия хочет выжить, мы должны гарантировать, что только конструктивные партии центра будут продвигать Германию вперед." # The anarchy of the old republic has demonstrated that democracy is fickle and that we cannot risk the danger of allowing revolutionaries from the left and the right to infest the republic. If the new Germany is to endure, we must ensure that only the constructive parties of the center will bring Germany forward.

 RHI_wehrstaat: "Верштат" # The Wehrstaat
 RHI_wehrstaat_desc: "Понятно, что единственный способ защитить Германию от радикализма – это руководствоваться военными. Все учреждения должны быть подчинены потребностям армии и военных действий. Более того, духовная защита нации также должна быть организована в соответствии с всеобъемлющим идеалом войны. Вместе мы выдержим шторм ради нового рассвета Германии." # It's clear the only way to protect Germany from radicalism is if guided by the military. All institutions shall be subordinated to the needs of the army and the war effort. Furthermore, spiritual defence of the nation should also be organised under an all encompassing ideal of war. Together we will weather the storm for a new dawn of Germany.

 RHI_papens_new_state: "Примите новое государство" # Adopt the New State
 RHI_papens_new_state_desc: "Неумелая парламентская система долго не просуществует. Вместо этого возглавит сильный исполнительный президент, поддерживаемый экспертами, которые положат конец спорам, угрожающим счастью Германии. Хотя восстановление монархии является нашей конечной целью, ситуация должна развиваться дальше. До тех пор мы будем править под руководством уполномоченного президента в соответствии с этими принципами." # The inept parliamentary system shall not be for much longer. Instead, a strong executive president shall lead, supported by experts who shall end the bickering that threatens Germany’s happiness. Whilst the restoration of the monarchy is our final goal, the situation must develop further. Until then, we will rule with an empowered President under these principles.

 RHI_germany_lives_on: "Германия жива и марширует!" # Deutschland Lebt Und Marschiert Weiter!
 RHI_germany_lives_on_desc: "Германия пережила в прошлом множество кризисов, всегда находила путь назад и всегда адаптировалась к обстоятельствам. Ни Варус, ни Наполеон, ни Дресслер не смогли этого изменить. Германия, которую мы выковали, как и Второй Рейх, выкована кровью и железом, и наши предки улыбаются нам, потому что мы обеспечили новый рассвет идеи единого Германского Рейха." # Germany has survived many crises in the past, has always found its way back and always adapted itself to the circumstances. No Varus, No Napoleon and no Dressler were able to change this. The Germany we have forged, like the second Reich is forged by blood and iron and our ancestors smile upon us for we have secured a new dawn for the idea of a united German Reich.

 RHI_republican_vanguard: "Республиканский авангард" # The Republican Vanguard
 RHI_republican_vanguard_desc: "В эпоху загнивающей республики всегда был только один стойкий приверженец порядочности и нравственности – армия. Рейхсвер верен национальному делу и понимает, что Германии не подходят ни бешеная революция, ни гнилая реакция." # There has always only been one stalwart of decency and morality in the age of the decadent republic - the army. The Reichswehr is faithful to the national cause and understands that neither rabid revolution nor rotten reaction is suitable for Germany.

 RHI_expand_secret_service: "Расширить секретную службу" # Expand the Secret Service
 RHI_expand_secret_service_desc: "Хотя на первый взгляд валкистская тайная полиция была неприятной, она была эффективной машиной. Возможно, его можно было бы перепрофилировать и помиловать некоторых членов?" # While on the surface distasteful, the Valkist secret  police was an efficient machine. Perhaps it could be repurposed and certain members pardoned?

 RHI_enable_the_reformers: "Слушатель выше политики" # A Heer Above Politics
 RHI_enable_the_reformers_desc: "С самого начала немецкие военные диктовали внутреннюю и внешнюю политику, игнорируя потребности людей на каждом шагу. Единственный способ спасти Германию – это деполитизировать Хеер." # From its inception the German military has dictated internal and foreign policy, disregarding the needs of the people at every turn. The only way to save Germany is to depoliticize the Heer.

 RHI_bring_back_fronde: "Освободите валкистов" # Release the Valkists
 RHI_bring_back_fronde_desc: "В старом рейхсвере существует мнение, что Германия должна вести тотальную войну ради победы в следующей войне и что рейхсвер должен быть бастионом немецкого национализма и лояльности. Несмотря на то, что многие из этих офицеров, к сожалению, остались верны злым валкистам, их можно реабилитировать и вернуть, чтобы снова сделать Германию могущественной." # There is a line of thought in the old Reichswehr that Germany must engage in a total war for victory in the next war and that the Reichswehr ought to be the bastion of German nationalism and loyalty. Even though many of these officers sadly remained loyal to the wicked Valkists, they can be rehabilitated and brought back to make Germany mighty once again.

 RHI_oath_of_loyalty: "Мандатные клятвы верности" # Mandate Oaths of Loyalty
 RHI_oath_of_loyalty_desc: "К счастью, наша девалькификация показала этим офицерам ошибочность их действий. Они увидели, что валкизм сделает с их умами, а также какие последствия он принесет нашим соседям. Сегодня мы требуем, чтобы эти люди отказались от своих прежних убеждений и присягнули на верность государству." # Thankfully, our devalkification has shown these officers the errors of their ways. They have seen what Valkism would do to their minds, along with the repercussions it will bring to our neighbors. Today, we demand that these men renounce their previous beliefs and pledge their loyalty to the state.

 RHI_schleiching_foreign_policy: "Новый Свет" # The New World
 RHI_schleiching_foreign_policy_desc: "Новый мир, в котором мы находимся, сильно отличается от того, в котором когда-то работали Шлейхер и его союзники. С появлением новых держав и отступлением старых, пришло время Германии сыграть свою роль." # The new world that we find ourselves in is far different than the one that Schleicher and his allies once worked in. With new powers on the rise and old ones receding, the time has come for Germany to make its play.

 RHI_demobilize_the_nation: "Демобилизовать нацию" # Demobilize the Nation
 RHI_demobilize_the_nation_desc: "Во времена валкистов они готовились к войне против Европы и, возможно, остального мира. Мы не должны этого допустить, потому что если мы это сделаем, каждый мужчина, женщина и ребенок умрут из-за этих дураков. Мы должны немедленно прекратить производство всей военной техники, чтобы не дать иностранным державам повода идти на Берлин." # During the time of the Valkists, they have been preparing for war against Europe and possibly, the rest of the world. We shouldn’t let that happen because if we do, every man, woman, and child would die for those fools. We should immediately halt production of all military equipment lest we give foreign powers a reason to march towards Berlin.

 RHI_appease_foreign_powers: "Умиротворить западные державы" # Appease the Western Powers
 RHI_appease_foreign_powers_desc: "С появлением валкистов Франция и Британия стали опасаться пороховой бочки, которая может взорваться. На данный момент мы можем показать им, что мы на пути к созданию мирного общества. Если им нужны дополнительные доказательства, мы более чем готовы предоставить им разумные уступки и восстановить доверие, которое у нас есть, ради всеобщего блага." # With the rise of the Valkists, France and Britain have become wary of the powderkeg that would explode. For now, we’re able to show them that we’re on our way to creating a peaceful society. If they’re eager for more proof, we’re more than willing to grant them reasonable concessions and rebuild the trust that we have for the good of all.

 RHI_prioritize_recovery: "Начало Великой Реставрации" # Begin the Great Restoration
 RHI_prioritize_recovery_desc: "После войны наш народ страдает от того, что его средства к существованию были уничтожены. Мы должны восстановить наши здания и поддержать жизни, которые были сохранены в результате создания мирной Рейнской области. Наше Великое Восстановление начинается прямо сейчас!" # After the war, our people suffer that their livelihood has been destroyed. We must rebuild our buildings and foster the lives that were spared in creating a peaceful Rhineland. Our Great Restoration begins now!

 RHI_ride_the_valkist_wave: "Оседлать милитаристскую волну" # Ride the Militarist Wave
 RHI_ride_the_valkist_wave_desc: "Валкисты и их стайка сумасшедших головорезов часто ошибались во многих аспектах, но они были правы в отношении важности военного арсенала. Волна милитаризма, охватившая Германию в слабую республиканскую эпоху, стала большим благом для авторитета Германии в мире, и мы должны идти по ней настолько далеко, насколько можем." # The Valkists and their gaggle of crazed thugs were often wrong in many different aspects, but they were right about the importance of a military arsenal. The wave of militarism that swept Germany during the feeble republican era was a great boon to Germany’s stature in the world and we must ride this as far as we can.

 RHI_rebuild_mil_factories: "Восстановить потенциал вооружения" # Rebuild Armament Capacity
 RHI_rebuild_mil_factories_desc: "Хотя мы дали миру шанс, к нашему великому несчастью, война приближается к нашему порогу. К счастью, наши заводы готовы создавать наше оружие. Пришло время немецкому народу объединиться против нашего общего врага." # Even though we have given peace a chance, it is with great misfortune that war is coming to our doorstep. Luckily, our factories stand ready to create our weapons. The time has come for the German people to unite against our common enemy.

 RHI_prepare_for_more_war: "Максимизируйте подготовку к войне" # Maximize War Preparations
 RHI_prepare_for_more_war_desc: "Хотя мы готовы к предстоящей войне, мы еще многое можем сделать, чтобы быть полностью готовыми. Строя форты, создавая новые фабрики, мобилизуя наши силы, мы должны максимально использовать то, что у нас есть, чтобы наша нация была готова к предстоящему натиску. Никогда больше мы не окажемся неподготовленными к предстоящей войне!" # While we stand ready for the oncoming war, there are still many things we can do to ensure that we are fully prepared. Building forts, creating more factories, mobilizing our forces, we have to maximize what we have so that our nation is ready for the upcoming onslaught. Never again shall we be unprepared for the upcoming war!

 RHI_open_industrial_contacts: "Возобновить промышленные контакты" # Reopen Industrial Contacts
 RHI_open_industrial_contacts_desc: "Было бы глупо не заручиться помощью промышленных картелей. Пришло время запланировать встречу с представителями различных оружейных компаний, чтобы обсудить, как лучше всего милитаризировать экономику." # It would be folly to not enlist the aid of the industrial cartels. It's time to schedule a meeting with the various arms companies to see how best to militarise the economy.

 RHI_militarized_autarky: "Военизированная автаркия" # Militarized Autarky
 RHI_militarized_autarky_desc: "Поддержание страны — трудная задача, но еще труднее содержать и поддерживать армию. Военизированное общество, подготовленное к таким трудностям, не пошатнется в такой ситуации. Для этого нам необходимо милитаризировать наше существование, милитаризировать то, как мы действуем и как мы занимаемся сельским хозяйством, требуется и должна быть обеспечена дисциплина во всей стране." # Sustaining the country is a hard task, but it is even harder to maintain and sustain an army. A militarized society prepared for such hardship will not falter in such a situation. For that, we need to militarize our sustenance, to militarize how we act and how we farm, discipline through the whole nation is required and shall be made.

 RHI_allgemeine_gewerkschaft: "Объедините профсоюзы" # Unite the Trade Unions
 RHI_allgemeine_gewerkschaft_desc: "Профсоюзы уязвимы для социалистического влияния, если их предоставить самим себе. Объединение всех профсоюзов в национальный профсоюз позволило бы нам удовлетворять потребности рабочих, но держать их под пристальным наблюдением." # The trade unions are vulnerable to socialist influence if left to their own devices. Merging all unions into a national trade union would enable us to address the needs of workers, but keep them under close watch.

 RHI_nationalize_important_industry: "Национализировать важные отрасли промышленности" # Nationalize Important Industries
 RHI_nationalize_important_industry_desc: "Некоторые отрасли промышленности, такие как угольная и сталелитейная, слишком важны, чтобы их можно было оставлять в частных руках. Все должно быть подчинено потребностям Хир. Мы не можем рисковать раком, которым является военная спекуляция." # Some industries such as coal and steel are too important to be left in private hands. Everything must be subordinated to the needs of the Heer. We cannot risk the cancer that is war profiteering.

 RHI_rapid_industrial_expansion: "Быстрое промышленное расширение" # Rapid Industrial Expansion
 RHI_rapid_industrial_expansion_desc: "В настоящее время объем промышленного производства крайне недостаточен. Великие фабрики должны расширяться ради благополучия отечества и ради того, чтобы мир стал свидетелем возвращения Германии к господству." # Currently, industrial output is woefully inadequate. The great factories must expand, for the well-being of the fatherland and for the world to witness Germany’s return to ascendancy.

 RHI_create_corporatist_order: "Немецкий корпоративистский орден" # The German Corporatist Order
 RHI_create_corporatist_order_desc: "Социалисты с радостью разделяют и эксплуатируют немцев посредством классовой войны, а промышленники, если их не остановить, с радостью продадут своих соотечественников, если им представится такая возможность. Только классовое сотрудничество может защитить рабочих и предотвратить вмешательство пятой колонны в немецкое единство." # The socialists gladly divide and exploit Germans through class warfare, and the industrialists, if left unchecked, would gladly sell out their countrymen if given the chance. Only class cooperation can protect the workers and prevent fifth columnists from tampering with German unity.

# Ideas
 RHI_french_reparations: "Французские репарации" # French Reparations
 RHI_french_reparations_desc: "Со времен Великой войны Париж предъявлял свои требования к нашим ресурсам в виде репараций, угля, стали, промышленной продукции, зерна – всего, от чего они могли бы получить выгоду. Экономическое бремя принесло много страданий новому государству, и главная цель каждой фракции - положить конец этому соглашению." # Ever since the Great War, Paris has imposed their demands for our resources as reparations, coal, steel, industrial products, grain - everything they could benefit from. The economic burden has brought much misery to the new state and it is a main goal for every faction to end this arrangement
 RHI_political_powderkeg: "Политическая пороховая бочка" # Political Powderkeg
 RHI_political_powderkeg_desc: "[RHI.GetName] с момента своего создания представляет собой нестабильный марионеточный режим, служащий исключительно французским интересам. Политическая фракционность и радикализм процветают, и только французские войска, а также финансируемые французами Schutztruppen способны поддерживать порядок. Националисты стремятся к воссоединению, социалисты хотят свергнуть военно-буржуазное правительство, а рейнские сепаратисты хотят создать свободное рейнское государство. Лишь недавний подъем Дресслера и приток беженцев-демократов в некоторой степени усилили поддержку молодого государства. Тем не менее, никто не удовлетворен статус-кво, и французское военное правительство осознает, что одной искры достаточно, чтобы насилие вспыхнуло снова." # The [RHI.GetName] since its establishment is an unstable puppet regime solely serving French interests. Political factionalism and radicalism is rampant and only French troops as well as the french funded Schutztruppen are able to keep order. Nationalists aim for reunification, socialists want to overthrow the military bourgeois government and the Rhenish separatists want to establish a free Rhenish state. Only the recent rise of Dressler and the influx of democrat refugees as somewhat galvanized support for the young state. Still, nobody is satisfied with the status quo and the French military government is aware that a single spark is enough for violence to erupt again.
 RHI_rhenish_disarment: "[RHI.GetAdjective] Разоружение" # [RHI.GetAdjective] Disarmament
 RHI_rhenish_disarment_desc: "После Великой войны Рейнская область оказалась под военной защитой [FRA.GetName] и Бельгии. Только сепаратистская Schutztruppe, предложенная гражданскими советниками, финансировалась французской армией. Поскольку продолжающаяся оккупация становилась все более невозможной, вопрос о перевооружении Рейна стал главной темой." # After the Great War, the Rhineland was put under the military protection of [FRA.GetName] and Belgium. Only the separatist Schutztruppe, proposed by the civilian advisors was funded by the French army. With ongoing occupation becoming increasingly unfeasible, the question for Rhenish rearmament became a major topic.
 RHI_rhenish_schutztruppen: "[RHI.GetAdjective] войска защиты" # [RHI.GetAdjective] Schutztruppen
 RHI_rhenish_schutztruppen_desc: "Schutztruppen являются сердцем рейнского сепаратистского движения, подобно Freikorps или коммунистическим ополчениям в Германии. Это военизированное и политическое движение, борющееся за свои собственные политические цели, в основном за независимую Рейнскую область, хотя внутри они разобщены по поводу природы Рейнского государства, некоторые просто выступают за отделение от Пруссии внутри Германской империи, в то время как другие отдают предпочтение Западногерманской республике как части рыхлого союза немецких государств. Однако ясно одно: Schutztruppe, какими бы жестокими и радикальными они ни были, являются единственной силой, помимо французов, которая может поддерживать порядок." # The Schutztruppen are the heart of the Rhenish separatist movement, similar to the Freikorps or Communist militias in Germany, they are a paramilitary and political movement, fighting for their own political goals, mainly a independent Rhineland, although internally disunited over the nature of the Rhenish state, some merely favoring a split from Prussia within the German Empire while others favor a West German Republic as part of a loose alliance of German states. One thing is clear however, the Schutztruppe, as cruel and radical as they might be are the only force besides the French that can keep order

