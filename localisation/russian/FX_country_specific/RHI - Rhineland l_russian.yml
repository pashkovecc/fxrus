 baumer_aero_RHI_MIO: "High-Speed Air Designer"
 baumer_aero_desc: "Founded in Hamburg, Germany in 1922 by German Great War pilot Paul Bäumer, Bäumer Aero began its life as a sportplane manufacturer, known for production of the Bäumer Sausewind a moderately successful highly-maneuverable sportplane employing a then-revolutionary elliptical wing design.\n\nAfter the Valkists took power in Germany, Bäumer and his company moved to the Rhineland, where they found moderate success designing sporting gliders and planes despite French restrictions on Rhenish military aviation. The development of the Bäumer Bä 7 was subject to some controversy in 1934 when French supervisors accused the company of designing a sportplane "with the capabilities of a fighter plane"."
  
