 RHI_cashout_benefits: "§gМы объявим наши федеральные реформы завершенными до того, как тираны в Берлине будут побеждены. Хотя это потребует §rзатрат§!, мы сможем провести некоторые дополнительные реформы, которые повысят нашу §4Федерализацию§!.§!" # §gWe will declare our federal reforms completed before the tyrants in Berlin have been defeated. Whilst this will come at a §rcost§!, we will be able to force through some additional reforms that will boost our §4Federalisation§!.§!
