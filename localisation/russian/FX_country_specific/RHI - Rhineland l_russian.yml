 rhein.1.t: "Дисфункциональная экономика" # A Dysfunctional Economy
 rhein.1.d: "Многие вещи в мандате ненормальны, особенно после прихода к власти Дресслера и последующей изоляции Рейнской области от ее исторического немецкого правительства. Однако одна вещь, которая не осталась нормальной с момента создания мандата, - это ее экономика - или, скорее, ее эксплуатация.\n\nРазгромив немцев в Великой войне, Антанта воспользовалась возможностью, чтобы продиктовать немцам мирный договор, который был воспринят немцами с крайним презрением. Поскольку Рейнская область была передана Франции, на Рейне вскоре разразился хаос, и французские войска вторглись, чтобы потребовать свою часть мира. Однако это длилось недолго, и вскоре хаос привел к созданию военного совета, а вскоре после получения мандата - унизительного дела для любого немца.\n\nВ течение следующих двух десятилетий мандат ковылял, и само его существование нанесло серьезный удар по связям внутри Антанты. Поскольку французы желают защитить свои границы, мандат приведет к утечке рабочей силы и капитала, в то время как многочисленные отрасли промышленности на Рейне будут ослаблены бессмысленным грабежом солдат, ограниченный доступ к рынкам и доминирующий подход французов в мандате приведут к тому, что экономика Рейна окажется в самой низкой точке...\n\nИ поскольку мандат вступает в следующий год, многие задаются вопросом, как же экономика будет функционировать снова. Как долго еще некогда процветающий Рейн будет истекать кровью, пока не побелеет? Поскольку французы подрывают весь свой авторитет, а другие державы кажутся слишком слабыми, чтобы разрешить продолжающийся кризис, есть только одна сторона, которая извлекает выгоду из этого печального положения дел - Берлин." # Many things are not normal in the mandate, most especially following the rise of Dressler and the subsequent isolation of the Rhineland from its historical German government. One thing however that has not remained normal since the mandate’s establishment is its economy - or rather its exploitation.\n\nHaving decisively beaten the Germans in the Great War, the Entente would take the opportunity to dictate to the Germans a peace treaty that was viewed with utter contempt by the Germans. With the Rhineland having been granted to France, chaos would soon erupt on the Rhine with French troops moving in to claim their part of the peace. This however would not last and soon the chaos prompted the establishment of a military council and shortly after a mandate, a humiliating affair for any German.\n\nOver the course of the next two decades, the mandate would hobble along, with its very being having dealt severe blows to the bonds within the Entente. With the French desiring to secure their borders, the mandate would find itself bleeding manpower and capital whilst the numerous industries on the Rhine would be weakened by the wanton plunder of soldiers, low market access and a domineering approach by the French in the mandate would see the Rhenish economy brought to its lowest point yet...\n\nAnd as the mandate enters another year, many wonder how on earth the economy will function again. How much longer can the once prosperous Rhine bleed until it turns white? With the French blowing all their credibility away and the other powers seemingly too weak to solve the continuous crisis, there is only one party that benefits from this sad state of affairs - Berlin.
 rhein.1.a: "Это придется сделать..." # This will have to do...

 rhein.2.t: "Валькизм под судом" # Valkism on Trial
 rhein.2.d: "В качестве иностранного мандата, навязанного победителями в Великой войне, можно ожидать, по крайней мере, некоторого уровня националистической активности со стороны немцев. С ростом валкизма в Германии это, естественно, привело к тому, что группы валкистов в рамках мандата попытались подорвать мандат, так что Германия сможет легко вернуть себе контроль над мандатом. Некоторые валькисты были задержаны во время попытки совершить насильственные террористические акты в рамках мандата, а теперь предстали перед судом.\n\nС одной стороны, эти валькисты, несомненно, виновны в попытке вызвать террор и ущерб рейнскому народу из-за своей идеологии. Многие бывшие изгнанники из Рейха даже требуют своей казни, чтобы послужить предупреждением для потенциальных валькистов, утверждая, что их смерть в конечном итоге спасет жизни гораздо большему количеству людей. С другой стороны, такой шаг, скорее всего, будет воспринят Берлином как чрезвычайно воинственный шаг и еще больше усилит напряженность, не говоря уже о довольно суровом наказании за неудавшиеся террористические атаки. В итоге суд приходит к выводу..." # As a foreign mandate imposed by the victors of the Great War, one may expect at least some level of nationalist activity by the Germans. With the rise of Valkism in Germany, this has naturally led to Valkist groups within the mandate attempting to subvert the mandate such that Germany will be able to easily take back control of the mandate. Having been apprehended amidst their attempt to commit violent terrorist acts in the mandate, some valkists have now gone on trial.\n\nOn one hand, these valkists are undeniably culpable for their attempt to inflict terror and damage upon the Rhenish people for their ideology. Many former exiles from the Reich even demand their execution to serve as a warning for any would-be valkists, arguing that their deaths will ultimately save the lives of many more people. On the other hand, such a move would most certainly be treated as an extremely belligerent move by Berlin and would spike tensions even more, not to mention the rather extreme punishment for their failed terror attacks. In the end, the court finds...
 rhein.2.a: "...обвиняемому, виновному по некоторым пунктам обвинения, рекомендовано тюремное заключение." # ...the defendant guilty on some charges, imprisonment recommended.
 rhein.2.b: "...обвиняемому, виновному по всем пунктам обвинения, рекомендован смертный приговор." # ...the defendant guilty on all charges, death sentence recommended.

 rhein.3.t: "Союзники по межсоюзническому мандату" # The Allies of the Inter-Allied Mandate
 rhein.3.d: "Хотя французы, возможно, и являются главным действующим лицом в Межсоюзном совете, они в нем не одиноки. Поскольку Франции было отказано в уступке Рейнской области, Антанта решила создать совет, состоящий из союзных войск, которому было поручено вести повседневные дела мандата. В совете присутствуют не только французские, но и американские, британские и бельгийские официальные лица, при поддержке своих национальных сил.\n\nОбладая наибольшим интересом к Рейнской области, французы, несомненно, дали о себе знать, что привело к недовольству оставшихся союзников в рамках мандата высокомерия Парижа. Опасаясь окружения со стороны профранцузского государства и самой Франции, бельгийцы продолжают поддерживать Йозефа Смитса и его «Рейнскую республиканскую народную партию», надеясь отколоть сепаратистское движение от французов.\n\nОднако не каждый член мандата желает поддерживать сепаратистское движение. Не питая особой симпатии к поддерживаемым Францией сепаратистам, англоязычные члены мандата оказались заслужившими расположение «веймарцев», желающих восстановить демократию не только в Рейнской области, но и во всей Германии. Поскольку мандат все еще борется с межсоюзными раздорами, мы должны решить, должны ли мы предоставить другим союзникам некоторую территорию для действий или же Франция должна иметь приоритет, будучи основным источником финансирования и рабочей силы для мандата." # Whilst the French may be the main actor on the Inter-Allied council, they are not alone on it. With France’s concession of the Rhineland denied, the Entente opted to set-up a council made up of the Allied forces, with the council being tasked with running the mandate’s day-to-day affairs. On the council are not only French, but American, British and Belgian officials, all backed up with their national forces.\n\nHolding the most interest in the Rhineland, the French have undoubtedly made their presence felt, leading to resentment by the remaining Allies within the mandate of Paris’s hubris. Fearing encirclement by a pro-French state and France itself, the Belgians have maintained support for Josef Smeets and his \"Rhenish Republican People’s Party\", hoping to cleave the separatist movement from the French.\n\nHowever, not every mandate member desires to support the separatist movement. Having little sympathy with the French-backed separatists, the Anglo members of the mandate have found themselves well-courted by the \"Weimarers\" who desire to restore democracy to not just the Rhineland, but all of Germany. With the mandate still struggling with inter-allied squabbles, we must decide if we should grant the other allies some ground to operate or if France should take precedence - being the main source of funding and manpower for the mandate.
 rhein.3.a: "Давайте не будем раскачивать лодку?" # Let's not rock the boat shall we?
 rhein.3.b: "Без Франции не было бы мандата!" # Without France, there would be no mandate!

 rhein.4.t: "Призрак, бродящий по Европе" # The Spectre Haunting Europe
 rhein.4.d: "К сожалению, как и любая другая страна, мы страдаем от бича коммунизма. Всегда доставляя серьезную неприятность мандатному правительству с момента его создания в 1919 году, КПГ и ее проклятые производные всегда преследовали и препятствовали нашим целям в Рейнской области. Даже после их бесславного бегства из Рейха в 1932 году коммунисты по-прежнему оставались занозой на нашем глазу, вызывая волнение, хотя мы по большей части оставили их в покое.\n\nПоскольку их террористический заговор был сорван, а главари пойманы, у нас теперь есть выбор: предать их суду или просто избавиться от них посредством тюремного заключения и казни. Хотя последний вариант, безусловно, является типичным для мандата, возможно, нам стоит сейчас проявить некоторую снисходительность? Поскольку мандат балансирует на грани краха, может быть, следует проявить милосердие?" # Unfortunately like any other country, we suffer from the scourge of communism. Having always proved a grave nuisance to the mandate government since its establishment in 1919, the KPD and its cursed derivatives have always harassed and impeded our objectives in the Rhineland. Even after their inglorious flight from the Reich in 1932, the communists have still served as a thorn in our side, agitating even though we have mostly left them alone.\n\nWith a terror plot of theirs having been foiled and the ringleaders caught, we now have the choice to place them on trial or to simply rid ourselves of them through imprisonment and execution. Whilst the latter option is most certainly one typical of the mandate, perhaps it may do us well to show some leniency now? With the mandate teetering on the edge of collapse, maybe mercy ought to be in the cards?
 rhein.4.a: "Мы должны полностью их очистить!" # We must purge them entirely!
 rhein.4.b: "Они имеют такое же право на справедливое судебное разбирательство, как и все остальные." # They have just as much right to a fair trial as anyone else.

 rhein.5.t: "Беженцы из Германии" # Refugees from Germany
 rhein.5.d: "После катастрофы 1932 года террор режима валкистов и их отряда реакционных головорезов и благородных головорезов стал еще более очевидным. Жестоким подавлением любой формы сопротивления многие немцы, осознав свою любовь к свободе, решили бежать, в основном на Запад, где спасение может лежать в Вашингтоне, Лондоне и Париже. Однако большинство из них вскоре оказались здесь, либо в результате депортации, либо по приглашению своих соотечественников-эмигрантов из Германии.\n\nДаже если они предпочитают жить здесь, а не в мандате, многие немецкие беженцы прибывают ни с чем. Многие были вынуждены бежать, не имея времени подготовиться и защитить свое имущество от тиранов в Берлине. Поскольку немецкие беженцы продолжают накапливаться в мандате, условия их жизни стали, мягко говоря, ужасными. Поскольку многих немцев это огорчило, раздался общий призыв хотя бы принять некоторые меры для помощи жертвам валкистского террора. Однако такие действия могут только придать смелости сепаратистам, которые могут представить такие действия как еще одно доказательство разрушения Рейнской области от рук прусской низости." # Ever since the catastrophe of 1932, the terror of the Valkist regime and their squad of reactionary thugs and noble goons have made themselves more evident. With their brutal suppression of any form of resistance, many Germans, realizing their love for liberty have opted to flee, mainly to the West where salvation may lay in Washington, London and Paris. However, most of them have soon found themselves here, whether through deportation or invitation by their fellow German exiles.\n\nEven if they prefer it here than in the mandate, many German refugees arrive with nothing. Many were forced to flee without any time to prepare nor protect their belongings from the tyrants in Berlin. As German refugees continue to collect in the mandate, their living conditions have grown dire to say the least. With many Germans finding this upsetting, there has been a common call to at least take some measures to aid the victims of Valkist terror. Such actions however may only embolden the separatists, who may frame such actions as further proof of the Rhineland’s ruination at the hands of Prussian lowlifes.
 rhein.5.a: "Обидно, но мы мало что можем сделать." # Upsetting, but there is little we can do.
 rhein.5.b: "Мы не можем просто оставить их в нищете!" # We can't just leave them in squalor!

 rhein.6.t: "Создание Rheinische Rundfunk AG" # The Creation of Rheinische Rundfunk AG
 rhein.6.d: "Даже если мандат часто тормозил прогресс, он, безусловно, не предотвращал его. Поскольку мандатный совет наконец разрешил создание радиовещательной станции в Рейнской области, вскоре радиовещательная станция будет создана по всей Рейнской области.\n\nПередавая музыку, а также развлечения, RRAG также стала объектом восхищения и ненависти за организацию политических дебатов и общественно-политических лекций. Позволяя умеренным республиканцам и сепаратистам в определенное время участвовать в дебатах, RRAG стимулирует дальнейшую политическую активность в рамках своего мандата. Хотя это, несомненно, привело к усилению антивалкистских настроений в Рейнской области, некоторые в мандатном правительстве опасаются, что этот инструмент может означать для будущего мандата." # Even if the mandate has often stalled progress, it most certainly has not prevented it. With the mandate council finally allowing for a radio broadcasting station in the Rhineland, it would not be long before a broadcasting station would be set up across the entire Rhineland.\n\nBroadcasting music as well as general entertainment, the RRAG has also become admired and hated for its hosting of political debates and socio-political lectures. Allowing moderate republicans and separatists to debate at certain times, RRAG has inspired further political activity within the mandate. Whilst this has undoubtedly led to a strengthening of anti-Valkist sentiment within the Rhineland, some in the mandate government fear just what a tool may mean for the mandate’s future.
 rhein.6.a: "Посмотрим." # We shall see.

 rhein.7.t: "Лондонский крах" # The London Crash
 rhein.7.d: "В результате катастрофического поворота событий лондонский фондовый рынок рухнул. Хотя большинство из нас ожидало, что в результате произойдет некая форма экономического спада, результаты оказались для нас почти катастрофическими. Поскольку все сторонники мандата сейчас страдают от той или иной формы экономического кризиса, экономика мандата ухудшилась, поскольку безработица снова стремительно растет." # In a disastrous turn of events, the London stock market has crashed. Though most of us expected there to be some form of economic downturn as a result, the results have proven near-catastrophic for us. With all of the mandate’s backers now suffering some form of economic crisis, the mandate’s economy has taken a turn for the worse as unemployment skyrockets once again.
 rhein.7.a: "Боже, помоги нам!" # Gott, hilf uns!

 rhein.8.t: "Второе правительство Кобленца" # The Second Koblenz Government
 rhein.8.d: "После лондонского краха и последующей экономической депрессии многие рейнские рабочие снова оказались без работы. Многие обращаются к радикалам, которые обещают революцию как слева, так и справа; но больше, чем когда-либо, они обращаются к сепаратистскому движению.\n\nПолучая широкую поддержку со стороны масс недовольных, безработных рабочих, сепаратистские движения воспользовались шансом и провозгласили собственное правительство в Кобленце. При поддержке и подстрекательстве французских войск, оккупирующих этот район, это новое правительство Кобленца угрожает нашему режиму и теперь, похоже, готовится править за пределами Кобленца." # With the London crash and subsequent economic depression, many Rhenish workers have once more found themselves without a job. Many turn to the radicals, who promise revolution from both left and right; but more than ever, they turn to the separatist movement.\n\nGaining widespread traction from the masses of discontented, unemployed workers, the separatist movements have seized the chance and have declared a government of their own in Koblenz. Aided and abetted by the French troops occupying the area, this new Koblenz government threatens our regime and now seem to be readying themselves to rule beyond Koblenz.
 rhein.8.a: "Ба!" # Bah!

 rhein.9.t: "Англо-ответ" # The Anglo Response
 rhein.9.d: "Поскольку продолжение действия мандата теперь сомнительно, мандатный совет союзников решил продолжить распри и пререкания – с той лишь разницей, что это предмет. Полагая, что недемократический характер мандата и жестокость Франции несут ответственность за нынешние беспорядки, связанные с мандатом, Лондон и Вашингтон призвали провести выборы в рамках мандата, чтобы помочь определить судьбу Рейнской области.\n\nУчитывая общее отсутствие электоральной поддержки сепаратистов, такой призыв, несомненно, подорвет французское влияние в будущей Рейнской области. Кроме того, что произойдет, если радикалы получат электоральное благо?" # With the mandate’s continuation now doubtful, the Allied mandate council has opted to continue their infighting and bickering - the only difference being the subject. Believing that the mandate’s undemocratic nature and French heavy-handedness to be responsible for the mandate’s current unrest, London and Washington have called for elections to be held in the mandate to help determine the fate of the Rhineland.\n\nConsidering the general lack of electoral support for the separatists, such a call would undoubtedly undermine French influence in the future Rhineland. Besides, what would happen if the radicals experienced an electoral boon?
 rhein.9.a: "Возможно, они правы..." # They may have a point...
 rhein.9.b: "Какое право эти трусы имеют нами командовать?" # What right do these cowards have to order us around?

 rhein.10.t: "Стоимость оккупации" # The Costs of Occupation
 rhein.10.d: "Хотя мандат правительства, возможно, и не продлится долго для этого мира, затраты на него, безусловно, уже здесь. Поскольку глобальный экономический кризис сильно ударил по претендентам на мандат, средства для мандата быстро иссякают, которые и без того едва могли существовать.\n\nКак и ожидалось, это вызвало переполох в мандате, поскольку плохая финансовая ситуация продолжает ухудшаться - особенно из-за того, что французы не могут помочь субсидировать оккупацию. Это оставляет нам только два варианта: либо мы поднимем налоги для населения – что, вероятно, приведет к всплеску национализма и массовым протестам на улицах, либо мы обратимся к Кобленцу, чтобы помочь нам собрать средства – средства, которые они уже нужны себе и, вероятно, соберут для нас посредством массовой волны насилия…" # Whilst the mandate government may not be long for this world, the costs of it most certainly are here. With the global economic crisis hitting the mandate’s runners hard, funds have been rapidly drying up for the mandate which could already only barely get by.\n\nPredictably, this has caused a stir in the mandate as the poor fiscal situation only continues to get worse - most especially with the French unable to help subsidize the occupation. This only leaves us with two options, either we raise taxes on the populace - likely leading to a surge of nationalism and massive protests in the streets or we reach out to Koblenz to help us collect funds - funds that they already need for themselves and are likely to collect for us through a massive wave of violence...
 rhein.10.a: "Поднимите налоги!" # Raise the taxes!
 rhein.10.b: "У Кобленца может быть для нас есть решение." # Koblenz may have a solution for us.

 rhein.11.t: "Радикальный всплеск" # The Radical Surge
 rhein.11.d: "Учитывая, что Рейн страдает от экономического кризиса, следовало ожидать, что экстремисты выйдут из строя и дестабилизируют мандат. Будь то изгнанные коммунисты или агенты Берлина, они агитируют против правительства и только ухудшают нашу ситуацию.\n\nК сожалению, у нас мало вариантов. Один из вариантов – просто позволить оккупационным войскам разобраться с этим, как они делали это в последние несколько лет, хотя это неизбежно только вызовет еще большее недовольство по отношению к любому иностранному присутствию и подчеркнет бремя, с которым приходится иметь дело оккупационным войскам. Другой вариант — натравить Schutztruppe на коммунистов и валькистов, хотя их профессиональные отношения оставляют желать лучшего..." # With the Rhine suffering from an economic crash, it was to be expected that extremists would come out of the woodwork to destabilize the mandate. Whether they be exiled communists or agents of Berlin, they agitate against the government and only act to make our situation worse.\n\nRather unfortunately, there are few options we can take. One option is to simply let the occupation troops deal with it as they have for the last few years, though this will inevitably only spark more discontent towards any foreign presence and stress the burden the occupation troops must deal with. Another option is to unleash the Schutztruppe onto the communists and Valkists, though their professional attitudes leave much to be desired...
 rhein.11.a: "С этим разберется Schutztruppe!" # The Schutztruppe shall deal with it!
 rhein.11.b: "Оккупационным войскам придется сделать..." # The occupation troops will have to do...

 rhein.12.t: "Национальная конференция" # The National Conference
 rhein.12.d: "Время пришло. Поскольку конференция состоится сегодня, на ней будет решена судьба Рейнской области. Многие из них находятся на грани, поскольку Рейн является домом для многих любящих свободу немцев. Мало того, здесь живут те, кто будет сопротивляться валкистскому террору и тирании до последнего вздоха.\n\nИ так всё и началось. Когда все делегаты выступят со своими речами, раскол внутри Рейнской области будет полностью очевиден. Были ожесточенные споры и восторженные аплодисменты. Тем не менее конференция продолжилась, и вскоре должно было состояться голосование. Голосование, которое определит судьбу Рейнской области. Голосование, которое может даже решить судьбу Германии." # The time has come. With the conference to be held today, the fate of the Rhineland will be determined with it. Many are on edge, for the Rhine is home to many liberty loving Germans. Not only that, it is home to those who would resist Valkist terror and tyranny until their last breath.\n\nAnd so it began. With all delegates giving their speeches, the division within the Rhineland would be on full display. There were vicious arguments and rapturous applause. Nevertheless, the conference proceeded onwards and soon, a vote would be made. A vote that would determine the Rhineland’s fate. The vote that may even decide Germany’s fate.
 rhein.12.a: "Давайте посмотрим..." # Let us see...

 rhein.13.t: "Сепаратистский триумф" # The Separatist Triumph
 rhein.13.d: "Со времен бесславного конца империи Гогенцоллернов в Рейнской области редко существовало особенно стабильное правительство. Будь то неудачи 1919 или 1923 годов, рейнским сепаратистам всегда не удавалось по-настоящему удержать власть.\n\nЭто изменилось.\n\nС их победой на национальной конференции Рейнланд, похоже, обретает будущее, в котором она будет полностью отделена от Пруссии и, возможно, даже от Рейха. Но такой курс сопряжен с определенными условиями; как могло маленькое молодое Рейнское государство пережить очевидные амбиции Германии? За сепаратистской завесой независимости скрывается французское влияние, настолько сильное, что некоторые могут даже поверить, что это французский контроль. Сепаратистская Рейнская область - это не просто страна, противостоящая Германии, но и союзница Франции.\n\nИ так и будет..." # Ever since the inglorious end of the Hohenzollern’s empire, the Rhineland has rarely experienced a particularly stable government. Whether it be the failures of 1919 or 1923, the Rhenish separatists have always failed to truly hold onto power.\n\nThis has changed.\n\nWith their victory in the national conference, the Rhineland appears to be due for a future where it is wholly separate from Prussia, and maybe even the Reich. But such a course comes with strings attached; how could the small, young state of the Rhine survive Germany’s obvious ambitions? Behind the separatist curtain of independence lies French influence, so overreaching that some may even believe it to be French control. A separatist Rhineland is not merely one opposed to Germany, but one allied to France.\n\nAnd so it shall be...
 rhein.13.a: "Новый рассвет..." # A new dawn...

 rhein.14.t: "Республиканский триумф" # The Republican Triumph
 rhein.14.d: "Поскольку перспективы Германии в войне потускнели до точки гарантированного поражения, немецкий народ восстал. Они восстали против глупой и бессмысленной борьбы, создав новую республику. Республика, которая была бесцеремонно уничтожена в результате насильственного захвата власти Дресслером.\n\n1932 год войдет в историю как конец первой немецкой республики, но [GetYear] станет годом, который история запомнит, когда республика возродилась. Конечно, на данный момент такой исход кажется крайне маловероятным, учитывая относительное отсутствие энтузиазма со стороны Парижа, а также растущее недовольство Берлина нашим существованием. Таким образом, наша победа будет незабываемой - если она вообще произойдет.\n\nТем не менее, так и будет..." # With Germany’s prospects in the war having dimmed to the point of guaranteed defeat, the German people rose up. They rose up against the stupid and pointless fighting, creating a new republic. A republic that was unceremoniously disposed of in Dressler’s violent takeover.\n\n1932 will go down in history as the end of the first German republic, but [GetYear] shall be the year history remembers when the republic was reborn. Of course such an outcome seems as of now to be highly improbable, considering the relative lack of enthusiasm on the part of Paris as well as Berlin’s increased ire at our existence. Our victory would thus be one to remember - assuming it even happens.\n\nNevertheless, so it shall be...
 rhein.14.a: "Новый рассвет..." # A new dawn...

 rhein.15.t: "Сказка о трёх рейнландцах" # The Tale of Three Rhinelanders
 rhein.15.d: "Как и ожидалось, успех сепаратистов на национальной конференции не был встречен некоторыми хорошо. Поскольку республиканцы ополчились на то, что они считают победой Франции в Рейнской области, даже общая оппозиция не может остановить сепаратистов от внутреннего соперничества.\n\nТеперь решается, какие сепаратистские группы заслуживают бразды правления. Самым достойным многие скажут, что это Конрад Аденауэр. Будучи давним мэром Кёльна и лидером католического Центра в прежнем мандате, Аденауэр заслужил репутацию весьма компетентного и прагматичного человека. Поскольку французы, скорее всего, останутся, многие полагают, что Париж готов заключить сделку с Аденауэром вместо того, чтобы довериться своей старой лошади.\n\nТак кто именно были эти лошади? Йозеф Маттес и Ганс Адам Дортен, получившие известность благодаря своим сепаратистским действиям, являются ярыми сепаратистами, ненавидящими Пруссию и решительно поддерживаемыми французами. К сожалению, они заработали далеко не звездную репутацию, не в последнюю очередь из-за своей склонности растрачивать многие возможности, предоставленные Францией, а также из-за их общей нехватки популярности и опыта на политическом ландшафте Рейна.\n\nТем не менее, отказ от них стал бы признанием масштабного провала со стороны Парижа с момента начала действия мандата и наверняка разозлил бы французских крайне правых до безумия из-за предполагаемого предательства Дортена. И все же, наверняка можно найти какое-то решение?" # As expected, separatist success at the national conference has not been well-received by some. With the republicans up in arms about what they view as France’s victory in the Rhineland, not even general opposition can stop the separatists from having internal rivalries.\n\nNow the decision is which separatist groups deserve the reigns of power. The most deserving many would say is Konrad Adenauer. As the longtime mayor of Cologne and the leader of the catholic Centre in the former mandate, Adenauer has gained a reputation for being rather competent as well as pragmatic. With the French likely to remain, many believe that Paris is ready to cut a deal with Adenauer instead of putting their trust into their old horse.\n\nSo who exactly were these horses? Coming to prominence through their separatist actions, Josef Matthes and Hans Adam Dorten are both hardcore separatists, hateful of Prussia and strongly backed by the French. Unfortunately, they have accrued a less than stellar reputation, not least because of their tendency to waste the many French-provisioned opportunities and for their general lack of popularity and experience in the Rhenish political landscape.\n\nYet giving up on them would admit a massive failure on Paris’s part since the beginning of the mandate, and would most certainly rile the French far-right into a frenzy over Dorten’s supposed betrayal. Still, surely some sort of solution can be made?
 rhein.15.a: "Мэр - человек для этой работы!" # The mayor is the man for the job!
 rhein.15.b: "Мы не забываем наших друзей." # We do not forget our friends.

 rhein.16.t: "Ноябрь на Рейне" # November on the Rhine
 rhein.16.d: "Победа республиканцев на национальной конференции не была встречена всеобщим одобрением. Реакция Франции была в лучшем случае приглушенной, а пресса впала в истерику по поводу того, что Рейнская область вскоре будет передана «Бош» в Берлине.\n\nКонечно, такие заявления явно смехотворны. Особенно с образованием маловероятного союза. Опасаясь потенциального возвращения старого Веймарского правительства в Рейнскую область, Дортен и Маттес шокировали политическую сферу, объявив о своем взаимном сотрудничестве. Хотя такого союза может быть достаточно, чтобы предоставить им власть над Рейном, они могут сделать это только по велению «веймареров» - реальных победителей национальной конференции.\n\nСвои претензии на власть законно укрепились, и республиканцы, бежавшие из Германии, объявили о своем присутствии всему миру. Они, конечно, получают большую поддержку со стороны Лондона и Вашингтона, которые считают, что их готовность восстановить демократию в Рейнской области и, возможно, даже в Германии, является похвальной вещью. Кажется, даже Париж готов развернуться и поддержать республиканское правительство. В конце концов, что может быть более фатальным для режима валкистов, чем конкурирующее демократическое правительство?\n\nИ все же истинную судьбу Рейна будет решать не Берлин и не Париж, а рейнский народ. Рабочие, фермеры и бизнесмены некогда процветающего Рейна теперь должны принять свое решение ради истинного наследника республики..." # The victory of the republicans at the national conference has not been met with universal acclaim. The French reaction has been at best muted and the press has entered hysterics about how the Rhineland will soon be handed over to the \"Boche\" in Berlin.\n\nOf course such claims are obviously laughable. Most especially with the formation of an unlikely alliance. Fearing the potential return of the old Weimar government to the Rhineland, Dorten and Matthes have shocked the political realm by announcing their mutual cooperation. Whilst such an alliance may be enough to grant them rulership over the Rhine, they are only able to do so at the behest of the \"Weimarers\" - the real winners of the national conference.\n\nWith their claim to power legitimately strengthened, the republicans who fled from Germany have made their presence known to the whole world. They certainly experience plenty of support from London and Washington, who feel that their willingness to restore democracy to the Rhineland and maybe even Germany is an admirable thing. Even Paris seems ready to turn around and support the republican government. After all, what would be more fatal for the Valkist regime than a rival democratic government?\n\nStill, the Rhine’s true fate will be decided not by Berlin, nor Paris but by the Rhenish people. The workers, farmers and businessmen of the once-prosperous Rhine must now make their decision, for the true inheritor of the republic...
 rhein.16.a: "...будут те, кто даст нам свободу." # ...shall be those who would give us our freedom.
 rhein.16.b: "...будут те, кто боролся за демократию, за республику!" # ...shall be those who struggled for democracy, for the republic!

 rhein.17.t: "Уход французов" # The French Withdrawal
 rhein.17.d: "Окончание мандата следовало ожидать, но довольно резкий характер вывода наверняка не был ожидаемым. После победы на национальной конференции республиканское правительство вскоре оказалось лишено поддержки Парижа. С выводом войск союзников этот мандат вскоре стал прежним, поскольку аплодисменты коренных немцев можно было услышать от Аахена до Шпейера.\n\nДаже если судьба свободной Германии останется неопределенной после однолетнего периода защиты, сейчас мы можем праздновать." # The end of the mandate was to be expected, but the rather abrupt nature of the withdrawal most certainly was not. With their victory in the national conference, the republican government would soon find itself lacking in Paris’s backing. With the withdrawal of Allied troops, the mandate would soon become the former mandate as the cheers of the native Germans could be heard from Aachen to Speyer.\n\nEven if the fate of free Germany remains uncertain beyond the single year protection period, for now we can celebrate.
 rhein.17.a: "Им не следует иметь его, свободный немецкий Рейн!" # Sie sollen ihn nicht haben, den freien deutschen Rhein!
 rhein.17.tr: "§LНе будет им свободного немецкого Рейна!§!" # §LThey shall not have it, the free German Rhine!§!

 rhein.18.t: "Немецкая угроза" # The German Menace
 rhein.18.d: "Похоже, что, несмотря на наше желание оставаться в стороне от Берлина, они всегда находят способ подорвать нас. Сообщения показали, что волнения в мандате возросли до беспрецедентной точки, что в сочетании с резким увеличением числа иностранных агентов из Германии позволяет предположить, что среди жителей Рейнланда наблюдается нечто большее, чем просто националистическая волна." # It seems that despite our wish to remain undisturbed by Berlin, they always find a way to undermine us. Reports have indicated that agitation in the mandate has increased to an unprecedented point, which combined with the surge in foreign agents from Germany suggest that there is more than simply a nationalist wave amongst the Rhinelanders.
 rhein.18.a: "Будь прокляты эти ублюдки, шагающие гусиным шагом!" # Curse those goose stepping bastards!

 rhein.19.t: "Конец линии" # The End of the Line
 rhein.19.d: "Мандат не будет действовать в следующем году.\n\nТеперь это безошибочная истина. Поскольку хаос кризиса все больше и больше разрушает мандат, мандатные державы согласились прекратить действие мандата. Однако такой образ действий привел к дальнейшему конфликту, поскольку мандатные державы разошлись во мнениях относительно того, как лучше всего уйти из Рейнской области. Не станет ли беззащитная Рейнская область легкой добычей немцев?\n\nТак было решено. Предполагалось провести национальную конференцию по судьбе Рейнской области, на которой конкурирующие фракции смогут высказать свое мнение. Таким образом, Рейнская область наверняка не окажется в катастрофе после вывода войск союзников. Таким образом, с этого момента Рейн сможет стоять на своих ногах." # The mandate will not see the next year.\n\nThis is now an unmistakable truth. With the chaos of the crash now unravelling the mandate more and more, the mandate powers have agreed to end the mandate. Such a course of action however led to further conflict, with the mandate powers disagreeing on how to best withdraw from the Rhineland. Would not a defenseless Rhineland be easy prey for the Germans?\n\nSo it was decided. A national conference for the fate of the Rhineland was to be held, where the competing factions would be able to make themselves heard. This way, the Rhineland would surely not fall into catastrophe once Allied forces withdraw. From then on, the Rhine would thus be able to stand on its own two feet.
 rhein.19.a: "Еще нет..." # Not yet...

 rhein.20.t: "Хаос на Рейне" # Chaos on the Rhine
 rhein.20.d: "По мере того, как судьба и история продолжаются, другая историческая несправедливость теперь готова исправиться. Наши шпионы в отвратительном империалистическом рейнском мандате сообщили, что должна быть проведена национальная конференция, на которой иностранные марионетки Лондона и Парижа будут диктовать, как лучше всего прикрыть продолжающуюся эксплуатацию Рейнской области Антантой.\n\nОднако это также дает возможность. Нашим товарищам по мандату не терпится добиться возвращения Рейна в собственность Германии. Чтобы добиться этого, нам следовало бы добиться того, чтобы, пока Рейн не будет освобожден, ложный режим никогда не знал покоя!" # As destiny and history along with it roll on, another historical injustice now readies to correct itself. Our spies in the disgusting imperialist Rhenish mandate have reported that a national conference is to be held, one where the foreign puppets of London and Paris dictate how best to dress up the Entente’s continued exploitation of the Rhineland.\n\nHowever, this also provides an opportunity. Our comrades in the mandate are itching for a moment to ensure that the Rhine returns to Germany. To obtain this, we would do well to ensure that until the Rhine is liberated, the false regime will never know rest!
 rhein.20.a: "Это наш шанс!" # This is our chance!

 rhein.21.t: "Конец мандата" # The End of the Mandate
 rhein.21.d: "Поскольку вскоре должно было быть создано новое рейнское правительство, мандат испустил последний вздох. В [GetDateText] межсоюзнический мандат официально закончится. Рейнская область теперь была свободна.\n\nКонечно, такое заявление не учитывает реальность ситуации на местах. Хотя официально Рейн может быть свободным, продолжающееся присутствие французских войск и продолжающаяся поддержка Франции сепаратистов не остались незамеченными. Более того, некоторые аналитики в Америке и Великобритании осудили вывод войск как простую передачу Рейнской области амбициозной и мстительной Франции. Как они могли предать Рейнскую область французскому империализму? Несмотря на это мнение иностранцев, мало кто не согласится с тем, что Рейн никогда не был более свободным, чем когда-либо прежде." # With a new Rhenish government soon to be established, the mandate would draw its last breath. At [GetDateText], the Inter-Allied mandate would officially end. The Rhineland was now free.\n\nOf course such a statement fails to appreciate the reality of the situation on the ground. Whilst the Rhine may officially be free, the continued presence of French troops and the continued backing of France for the separatists have not gone unnoticed. In fact, some analysts in America and Britain have decried the withdrawal as simply handing over the Rhineland to an ambitious and vengeful France. How could they betray the Rhineland to French imperialism? In spite of this foreign judgement, few would disagree that the Rhine has never been freer than ever before.
 rhein.21.a: "Часы стоят твердо и верно, часы на Рейне!" # Fest steht und treu die Wacht, die Wacht am Rhein!
 rhein.21.tr: "§LТвердо и верно стоит Дозор, Дозор на Рейне!§!" # §LFirm and true stands the Watch, the Watch on the Rhine!§!

 rhein.22.t: "Инвестиции на Рейне?" # Investments on the Rhine?
 rhein.22.d: "Недавно мы получили известие из Кобленца об их просьбе о некоторой помощи и инвестициях с нашей стороны в Рейн. Они заявляют, что если мы вложим в них средства, мы сможем получить обратно стоимость наших денег в десять или более раз, поскольку они обещают помочь нам в сдерживании ревизионистских держав, где бы они ни находились. Однако, возможно, это не так уж и выгодно, учитывая их весьма уязвимое географическое положение." # Recently, we have received word from Koblenz pertaining to their request for some aid and investments on our part into the Rhine. They claim that should we invest into them, we will be able to receive back our money's worth ten-fold or more as they promise to help us in containing the revisionist powers, wherever they may be. However, this may not be so worthwhile considering their rather vulnerable geographical position.
 rhein.22.a: "Рейн – это фонтан возможностей." # The Rhine is a fountain of opportunities.
 rhein.22.b: "Давай не будем туда..." # Let's not go there...

 rhein.23.t: "Инвестиции от [FROM.Capital.GetCapitalVictoryPointName]" # Investments from [FROM.Capital.GetCapitalVictoryPointName]
 rhein.23.d: "Похоже, что [FROM.GetName] прислушался к нашему призыву, пообещав инвестировать в нас и предоставить нам капитал и навыки, чтобы помочь превратить Рейнскую область в нечто, что действительно может стать чудом индустриального мира." # It appears that [FROM.GetName] has heeded our call, promising to invest into us and grant us the capital and skill to help develop the Rhineland into something that can truly be the industrialized world's wonder.
 rhein.23.a: "Отличный!" # Excellent!

 rhein.24.t: "[FROM.GetName] отказывается нам помогать!" # [FROM.GetName] refuses to help us!
 rhein.24.d: "К сожалению, похоже, что [FROM.GetName] из-за трусости или неуместного чувства недоверия отказался инвестировать в Рейнскую область, оставив ее без выгод, которые мог бы дать такой шанс." # Rather unfortunately, it seems that [FROM.GetName], out of cowardice or a misplaced sense of distrust has refused to invest into the Rhineland, leaving them without the gains that such a chance would have granted.
 rhein.24.a: "Пусть будет так." # So be it.

 rhein.25.t: "Проблема репараций" # The Problem of Reparations
 rhein.25.d: "После Великой войны мы заработали себе некоторую компенсацию за все разрушения, которые немцы устроили, посредством справедливо суровых репараций. Эти репарации были жизненно важны для нашей экономической ситуации, позволяя нам отплатить Вашингтону и восстановиться после войны. Однако молодая немецкая республика саботировала все наши усилия по получению того, что нам причиталось, что привело к текущим сегодняшним событиям.\n\nТеперь правительство Рейна пришло к нам с просьбой пересмотреть условия и в конечном итоге снизить сумму, которую от них требуют. Даже несмотря на то, что такое изменение может вызвать здесь некоторый общественный резонанс, оно будет иметь жизненно важное значение для восстановления нашего рейнского союзника, что особенно важно в сегодняшние неспокойные времена." # In the aftermath of the Great War, we earned ourselves some recompense for all the destruction that the Germans unleashed via rightfully harsh reparations. These reparations were vital to our economic situation, enabling us to repay Washington and for us to rebuild after the war. However, the young German republic sabotaged our every effort to extract what we were owed - leading to the current events of today.\n\nNow, the Rhenish government has come to us requesting to renegotiate and ultimately lower that which is required of them. Even though such a change may spark some public outcry here, it will be vital to our Rhenish ally's recovery, especially important in today's uncertain times.
 rhein.25.a: "Им нужно стоять на своих местах." # They need to stand on their own.
 rhein.25.b: "Абсурдно, смешно и даже жалко." # Absurd, laughable, pathetic even.

 rhein.26.t: "[FROM.GetName] принимает!" # [FROM.GetName] accepts!
 rhein.26.d: "По праву, тяжелые потери для невинных немцев были навсегда отменены, и французы теперь готовы оставить нам более легкое бремя в плане погашения наших долгов." # Rightfully, the heavy tolls on innocent Germans have been lifted evermore, with the French now willing to leave us with a lighter burden in terms of repaying our debts.
 rhein.26.a: "Отличный." # Excellent.

 rhein.27.t: "[FROM.GetName] отказывается!" # [FROM.GetName] refuses!
 rhein.27.d: "К сожалению, [FROM.GetName] отказался снизить размер репараций, от которых нам так отчаянно необходимо избавиться, чтобы иметь хоть какую-то надежду на выздоровление. Это не предвещает ничего хорошего в будущем..." # Disappointingly, [FROM.GetName] has refused to lower the reparations that we so desperately need to rid ourselves of to have any hope of recovery. This bodes poorly for the future...
 rhein.27.a: "Как они могли?" # How could they?

 rhein.28.t: "Экономическое сотрудничество с Рейном?" # Economic Cooperation with the Rhine?
 rhein.28.d: "Поскольку наши союзники закрепились на Рейне, кажется, что они теперь прибыли в Париж с просьбой об более глубоком экономическом сотрудничестве между нами и ними. Это, безусловно, триумф французской дипломатии, поскольку теперь он открывает ворота для доступа к прибыльным рейнским ресурсам, которые дадут нам огромное преимущество перед немцами и защитят наши позиции на континенте." # With our allies having secured themselves on the Rhine, it seems that they have now come to Paris asking for deeper economic cooperation between us and them. This is most certainly a triumph for French diplomacy as it now opens the gateway for access to the lucrative Rhenish resources that would grant us a huge advantage against the Germans and secure our position on the continent.
 rhein.28.a: "Давайте вместе двигаться к процветанию!" # Let us move towards prosperity together!
 rhein.28.b: "Мы прекрасно справляемся сами." # We are doing just fine on our own.

 rhein.29.t: "На пути к экономическому единству" # Towards Economic Unity
 rhein.29.d: "Как и ожидалось, [FROM.GetName] принял наш запрос на более глубокое экономическое сотрудничество. Это не только поможет нам оправиться от крушения, которое повергло Рейн в катастрофу, но также позволит нам медленно, но верно работать над достижением истинного мира в Европе – после того, как зверь Валкист, конечно, будет убит." # As expected, [FROM.GetName] has accepted our request for deeper economic cooperation. This will not only help us to recover from the crash that plunged the Rhine into catastrophe, but will also let us slowly but surely work towards true peace in Europe - once the Valkist beast has been slain of course.
 rhein.29.a: "Большой!" # Great!

 rhein.30.t: "Смущающий отказ" # A Confounding Refusal
 rhein.30.d: "По какой-то причине кажется, что [FROM.GetName] отказался от нашего предложения о более тесном экономическом сотрудничестве, хотя ранее они просили нас об этом." # For some reason, it seems that [FROM.GetName] has refused our offer for closer economic cooperation despite their previously having requested us to do so.
 rhein.30.a: "Как они такие слепые?" # How are they so blind?

 rhein.35.t: "План вывода средств?" # A Withdrawal Plan?
 rhein.35.d: "Каким будет новый курс действий по мандату в этом году? Поскольку мандат становится все более хрупким, перспектива его прекращения и вывода войск Антанты из Рейнской области становится все более вероятной. Конечно, многие внутриполитические группы выступают против этого, поскольку они опасаются, что возвращение Рейнской области немецким правительством в Берлине, которое презирает как французских коллаборационистов, так и веймарских изгнанников, станет вопросом времени.\n\nЭто оставляет нам два варианта. План вывода позволит провести взвешенный, организованный и эффективный вывод войск из Рейнской области, что также будет оценено по достоинству, когда придет время. Особенно этому способствовало сепаратистское движение, которое желает упорядоченной передачи власти в свободной Рейнской области в свои руки. С другой стороны, подготовка к выводу войск будет означать, что Рейнская область открыта для захвата или, для некоторых, «освобождения», как это может выразиться в Берлине. Это привело к тому, что лагерь «Веймарер» резко выступил против любой идеи вывода войск, поскольку Рейнская область должна оставаться защищенной и служить маяком немецкой свободы." # What shall be the new course of action for the mandate this year? With the mandate appearing ever tenuous, the prospect of the mandate’s end and the withdrawal of Entente forces from the Rhineland has become ever more likely. Of course, many domestic political groups oppose such a thing for they fear it would be a matter of time before the Rhineland is then retaken by the German government in Berlin who despises both French collaborators and the Weimar exiles.\n\nThis then leaves us with two options. A withdrawal plan would allow for a measured, organized and efficient withdrawal of forces from the Rhineland, which would also be well-appreciated once the time comes. This especially has been pushed for by the separatist movement which desires an orderly transition of power for a free Rhineland to their hands. On the other hand, preparing for withdrawal would indicate that the Rhineland was open for the taking, or for some the \"liberation\" as Berlin may put it. This has caused the \"Weimarer\" camp to be highly opposed to any notion of withdrawal, for the Rhineland must remain protected and serve as a beacon of German freedom.
 rhein.35.a: "Это лучший вариант действий." # It is the best course of action.
 rhein.35.b: "Какая детская фантазия!" # What a childish fantasy!
 rhein.35.a.tt: "§lЭто облегчит экономический переход после истечения срока действия мандата§!" # §lThis will make the economic transition easier once the mandate comes to an end§!

 rhein.36.t: "Судьба оборудования" # The Fate of the Equipment
 rhein.36.d: "В Рейнской области имеется множество складов снаряжения, среди прочего, как устаревших, так и современных винтовок, пулеметов и артиллерийских орудий, которые необходимо подготовить на случай немецкого нападения. Конечно, модернизация арсенала Рейнской области в рамках подготовки к потенциальному нападению Германии становится все более популярной темой для разговоров среди руководителей мандата, поскольку французы и бельгийцы призывают превратить Рейнскую область в бастион, против которого не сможет пройти агрессия валкистов.\n\nОднако с предстоящим выводом войск такой вопрос стал просто непрактичным. Хотя модернизация существующих складов оборудования в Рейнской области завершилась, возникли некоторые споры о том, следует ли оставить какое-то оборудование для использования местными силами. Хотя оно могло попасть в руки немцев, сторонники такой позиции утверждают, что рейнландцам необходимо предоставить какие-то способы сохранять себя свободными и независимыми от прусского господства." # There are many equipment stores in the Rhineland, with both dated and modern rifles, machine guns and artillery pieces among other things that are to be readied in the scenario of a German attack. To be sure, the modernization of the Rhineland arsenal in preparation for a potential German attack has become an ever more popular talking point among the mandate’s directors, with the French and Belgians urging for the Rhineland to be turned into a bastion against which Valkist aggression cannot pass.\n\nWith an impending withdrawal however, such a matter has become a simply impractical possibility. While the modernization of the existing equipment stores in the Rhineland has ended, there have been some debates as to whether some equipment should be left behind for the local forces to use. Although it could fall into the hands of the Germans, supporters of such a position argue that the Rhinelanders must be given some ways to keep themselves free and independent of Prussian domination.
 rhein.36.a: "Оставьте немного в «удобных» местах на будущее." # Keep some in \"convenient\" places, for the future.
 rhein.36.b: "Подготовьте его к возврату" # Prepare it for return
 rhein.36.tt: "§lПосле истечения срока действия мандата мы получим дополнительное £GFX_rifle_texticon §Y2500§! пехотное снаряжение, £GFX_support_texticon §Y750§! вспомогательное оборудование и £GFX_artillery_texticon §Y750§! артиллерийское оборудование.§!" # §lOnce the mandate's time is up, we will gain an additional £GFX_rifle_texticon §Y2500§! infantry equipment, £GFX_support_texticon §Y750§! support equipment and £GFX_artillery_texticon §Y750§! artillery equipment.§!

 rhein.37.t: "Встреча с сепаратистами" # Meeting the Separatists
 rhein.37.d: "Несмотря на официальный запрет практически всех видов политической деятельности в пределах Рейнской области, комиссия всегда закрывала глаза на сепаратистское движение. В конце концов, цель сепаратистов по созданию более четкой рейнской культуры вряд ли можно назвать «политической», по крайней мере, если вы спросите французские или бельгийские силы, которые охраняют сектора своих стран.\n\nТаким образом, встреча между недавно сформированным сепаратистским правительством в Кобленце и дипломатами комиссии была далеко не напряженной. Пока камеры мигали и снимали переговоры между двумя сторонами, многие были удивлены тем, насколько гладко прошёл весь переговорный процесс. Правительство Кобленца на данный момент распустится. В свою очередь, его лидеры и Schutztruppe не только получили легальный статус для политической организации без малейшего намека на неполитические мотивы, но и сепаратистское движение позволило бы своим лидерам войти в правительство в качестве советников будущей новой Рейнской области. Это разозлило не только Берлин, но даже немецких националистов в мандате, которые считают это предательством всего, что обещал мандат – но кто воспринимает таких людей всерьез?" # Despite the official ban on nearly all types of political activity within the Rhineland mandate, the separatist movement has always received a blind eye from the commission. After all, the goal of the separatists for a more distinct Rhenish culture can hardly be described as \"political\", at least if you ask the French or Belgian forces that guard their nations’ sectors.\n\nAs such, the meeting between the newly formed separatist government at Koblenz and the commission’s diplomats was far from tense. As cameras flashed and filmed the negotiations between the two sides, many were surprised at just how smoothly the entire negotiation process was. The Koblenz government would dissolve itself for the moment. In return, its leaders and the Schutztruppe were not only granted legal status to politically organize themselves without even a pretense of non-political motive, but the separatist movement would have its leaders enter the government as advisors for the new Rhineland to come. This has riled up not just Berlin, but even German nationalists in the mandate who see this as a betrayal of everything the mandate had promised - but who takes such people seriously?
 rhein.37.a: "На этом можно закончить." # That should wrap this up.

 rhein.38.t: "Сепаратистская ярость" # Separatist Fury
 rhein.38.d: "Когда комиссия заявила, что все финансирование сепаратистского движения должно быть прекращено, ожидаемое возмущение со стороны сепаратистов было ощутимым. Всего через несколько часов после заявления и Дортен, и Маттес неожиданно опубликовали совместное послание, в котором осудили принятие мандата как полное предательство Рейнской области и ее народа, при этом оба призвали к гражданскому сопротивлению правительству.\n\nВозможно, что еще более неприятно, Дортен и Маттес задействовали свой самый мощный актив - французскую националистическую прессу. Поскольку французские националисты повторяют рассказы Дортена о предательстве, французы решили сократить финансирование мандата в целом, что значительно усложнило наши операции. Тем не менее, этот шаг может ознаменовать крах сепаратистского движения, поскольку его зависимость от французского финансирования начинает давать о себе знать все больше и больше." # When the commission declared that all funding for the separatist movement was to be halted, the expected outrage from the separatists was palpable. Mere hours following the declaration, both Dorten and Matthes have surprisingly released a joint message denouncing the mandate’s move as a total betrayal of the Rhineland and her people, with both calling for civil resistance against the government.\n\nPerhaps more unpleasantly, Dorten and Matthes have levied their most powerful asset - the French nationalist press. With French nationalists echoing Dorten’s screeds of betrayal, the French have decided to cut funding to the mandate as a whole - making our operations far more difficult. Still, this move could herald a collapse of the separatist movement as its dependency on French funding begins to make itself felt more and more.
 rhein.38.a: "Они могут кричать сколько угодно!" # They can scream all they want!

# Separatists

 rhein.separatist.0.t: "Разъединенное Рейнландское движение" # The Disunited Rhineland Movement
 rhein.separatist.0.d: "Наконец-то рейнские сепаратисты добились своей долгожданной роли лидеров Рейнской области. Благодаря освобождению Рейнской области дух Лорелей высвободится, и Рейнская область наконец сможет процветать вдали от прусской тирании!\n\nОднако все не так просто. И Маттесу, и Дортену приходится преодолевать множество разногласий, более того, некоторые даже считают, что их разногласия настолько велики, что исключают любое представление о сотрудничестве между ними.\n\nПоскольку французы предоставили сепаратистам мать всех возможностей раз и навсегда выполнить свое обещание о свободной, антипрусской Рейнской области, первый вопрос, на который теперь необходимо ответить, - кто возьмет на себя преимущество? Кто станет первым министром-президентом Рейнского свободного государства?" # At long last, the Rhenish separatists have achieved their long-dreamt of role as the Rhineland’s leaders. Through the Rhineland’s liberation, the spirit of Lorelei will be unleashed and the Rhineland will be finally able to prosper away from Prussian tyranny!\n\nThings however are not so simple. Both Matthes and Dorten have many differences to work through, in fact some even believe that their differences are so great as to preclude any notion of cooperation between the two.\n\nWith the French having given the mother of all opportunities to the separatists to once and for all fulfil their promise of a free, anti-Prussian Rhineland, the first question that must now be answered is who will take preeminence? Who will be the first Ministerpräsident of the Rhenish Free State?
 rhein.separatist.0.a: "Дортен — человек часа." # Dorten is the man of the hour.
 rhein.separatist.0.b: "Маттес – тот чемпион, который нам нужен." # Matthes is the champion we need.

 rhein.separatist.1.t: "Рейнское посольство?" # A Rhenish Embassy?
 rhein.separatist.1.d: "По мере того как международная ситуация продолжает развиваться, продолжают появляться новые государства. Сегодня прибыла делегация «Рейнского свободного государства» с просьбой разрешить открытие посольства в нашей стране. Хотя это помогло бы установить дипломатические отношения с новым государством, такая попытка, несомненно, навлекла бы на себя гнев Германии и ей подобных. Так что же нам делать?" # As the international situation continues to evolve, new states continue to emerge. Today, a delegation from the \"Rhenish Free State\" have arrived to request permission to establish an embassy in our country. Whilst this would help to establish diplomatic relations with the new state, such an endeavour would undoubtedly incur the wrath of Germany and the likes. So what shall we do?
 rhein.separatist.1.a: "Они странные ребята, но мы можем принять их просьбу." # They are odd little fellows, but we can accept their request.
 rhein.separatist.1.b: "Мы не будем иметь дело с французскими марионетками!" # We will not engage with French puppets!

 rhein.separatist.2.t: "[FROM.GetName] принимает!" # [FROM.GetName] accepts!
 rhein.separatist.2.d: "Похоже, что наша просьба о признании и открытии дипломатических отношений с [FROM.GetName] была принята. Это, несомненно, улучшит наши дипломатические и внутренние позиции, продемонстрировав, что мы являемся законным движением, которое желает только защитить свободу Рейнской области и ее народа." # It appears that our plea for recognition and the opening of diplomatic relations with [FROM.GetName] has been accepted. This will no doubt improve our standing diplomatically and domestically, demonstrating that we are a legitimate movement that only desires to protect the freedom of the Rhineland and her people.
 rhein.separatist.2.a: "Доказательство того, что наше дело правое!" # Proof that our cause is just!

 rhein.separatist.3.t: "[FROM.GetName] отказывается!" # [FROM.GetName] refuses!
 rhein.separatist.3.d: "К сожалению, похоже, что [FROM.GetName] не увидел причины и решил отвергнуть наши дипломатические попытки. Даже если мы не можем позволить себе затаить обиду по этому поводу, это все равно серьезный удар по сдерживанию прусской угрозы в Европе." # Unfortunately, it seems that [FROM.GetName] has not seen reason, opting to rebuff our overtures of diplomacy. Even if we cannot afford to hold a grudge over this, this is still a severe blow to the containment of the Prussian menace in Europe.
 rhein.separatist.3.a: "Очень жаль." # Too bad.

 rhein.separatist.4.t: "Дортен высказывается" # Dorten Speaks Out
 rhein.separatist.4.d: "Поскольку мы продолжаем строить новое Рейнское государство, кажется, что у наших «друзей» в его строительстве возникли сомнения. В ответ на наши недавние действия Дортен и его команда представителей буржуазной элиты выступили против нас, назвав нас криптобольшевиками и попытавшись свергнуть Рейнскую революцию в сторону марионеточного государства, управляемого Францией и Бельгией.\n\nДаже если такие обвинения явно абсурдны, это лишь продемонстрировало нестабильность и разобщенность внутри «Объединённого» движения. Пока Дортен остается занозой на нашем глазу, с которой нам придется работать, мы мало что можем сделать..." # As we continue to build the new Rhenish state, it seems that our \"friends\" in its construction have second doubts. In reaction to our recent actions, Dorten and his crew of bourgeois elitists have spoken out against us, denouncing us as crypto-bolsheviks and attempting to subvert the Rhenish revolution towards a puppet state ran by France and Belgium.\n\nEven if such accusations are patently absurd, this has only served to demonstrate the instability and disunity within the \"United\" movement. As long as Dorten remains as a thorn in our side who we are to work with, there is little we can do...
 rhein.separatist.4.a: "Он не только подхалим, но и некомпетентен!" # Not only is he a toady, but incompetent to boot!

 rhein.separatist.5.t: "Трещины внутри движения" # Cracks Within the Movement
 rhein.separatist.5.d: "Кажется, что, поскольку мы продолжаем работать над созданием Рейнской республики, свободной от прусского влияния и террора, есть те, кто хотел бы подорвать наш проект. Из-за наших недавних начинаний социалисты, объединившиеся вокруг Маттеса и Смитса, осудили нас как изнеможенных буржуа, которые неспособны действительно принести среднему жителю Рейна то облегчение, в котором они нуждаются. Некоторые даже зашли так далеко, что объявили нас марионетками Парижа, стремящимися поработить немецкий народ.\n\nХотя такие обвинения, без сомнения, совершенно нелепы и очень богаты, исходящие от бельгийского Смитса и французского Маттеса, это не пролило хорошего света на движение, поскольку «Объединенное» движение, кажется, раскрывает свою истинную природу." # It seems that as we continue working towards a Rhenish republic free from Prussian influence and terror, there are those who would like to subvert our project. Due to our recent undertakings, socialists coalescing around Matthes and Smeets have decried us as effete bourgeois who are unable to really bring the average Rhinelander the relief they need. Some have even gone so far as to declare us puppets of Paris who seek to enslave the German people.\n\nWhilst such accusations are no doubt totally ridiculous and very rich coming from the Belgian Smeets and French Matthes, this has not shone a good light onto the movement as the \"United\" movement seems to reveal its true nature.
 rhein.separatist.5.a: "Социализм – это болезнь." # Socialism is a disease.

 rhein.separatist.6.t: "Дортен против Маттеса" # Dorten Vs. Matthes
 rhein.separatist.6.d: "Это произошло.\n\nС момента своего появления на свет в 1923 году Йозеф Фридрих Маттес всегда находился в противоречии с Гансом Адамом Дортеном. Оба лидера движения ослаблены нежелательной базой, отсутствием подлинной народной поддержки, а также многочисленными ошибками в управлении и ошибками. В то время как Дортен пытался обвинить «прусских агентов» во всех неудачах, Маттес пошел еще дальше, разжигая заговоры о предполагаемом заговоре Берлина с целью сломить дух рейнландца. Когда Дортен попытался связаться с «Центрумом», Маттес двинулся вперед на полной скорости, привлекая как можно больше недовольных рабочих, чтобы сеять хаос среди врагов сепаратистов. Пока Дортен отдыхал в Париже, Маттес кричал о революции со стороны сокращающегося движения.\n\nНо те дни прошли, теперь два лидера оказались в состоянии оказывать влияние. Еще более волшебным образом им удалось предотвратить разрушение государства. Но теперь приближается новый кризис, который, по-видимому, готов снова сломить рейнское движение. Учитывая вторую национальную конференцию, созванную для определения судьбы движения, похоже, только один из них сможет выйти на первое место.\n\nТак кто же это будет? Маттес всегда был смутьяном, хулиганом, чье главное умение – заставить людей подать на него в суд. Между тем Дортен неоднократно не оправдал ожиданий, возложенных на него Парижем, а теперь и нашим народом – и все для того, чтобы он просто обвинил Пруссию в бедах Рейнской области. Более того, межсекционные разногласия заставили Маттеса и Дортена отойти в сторону: теперь Дортен находит поддержку в среднем классе, а Маттес сплачивает рабочих Рейнской области на свою сторону. Единственный вопрос сейчас заключается в том, кто более достоин роли лидеров Рейнской области." # It has happened.\n\nSince his rise to prominence in 1923, Josef Friedrich Matthes has always found himself at odds with Hans Adam Dorten. Both leaders of a movement enfeebled by its undesirable base, lack of genuine popular support and many mismanagements and bunglings. Where Dorten seeked to blame \"Prussian Agents\" for any failures, Matthes went further, sparking conspiracies of a supposed plot by Berlin to smash the Rhinelander’s spirits. When Dorten attempted to reach out to Zentrum, Matthes went full-speed ahead, bringing as many disaffected workers as he could to wreak havoc upon the separatist’s enemies. While Dorten was vacationing in Paris, Matthes would be shrieking cries of revolution from the dwindling movement.\n\nBut those days are over, now the two leaders found themselves in a position to exert influence. Even more magically, they succeeded at preventing the state’s destruction. But now another crisis approaches, seemingly ready to break the Rhenish movement once again. With a second national conference called to determine the fate of the movement, only one seems poised to come out on top.\n\nSo who will it be? Matthes has always been a firebrand, a blowhard whose main skill is at getting people to sue him. Meanwhile, Dorten has repeatedly failed to live up to the expectations placed on him by Paris and now our own people - all for him to simply blame Prussia for the Rhineland’s troubles. Furthermore, sectional differences have caused Matthes and Dorten to drift, with Dorten now finding succour in the middle-class and Matthes rallying the workers of the Rhineland to his cause. The only question now is who is more worthy as the Rhineland’s leaders.
 rhein.separatist.6.a: "Когда Дортену удавалось добиться успеха?" # When has Dorten ever succeeded?
 rhein.separatist.6.b: "Маттес — подонок, социалист и лох!" # Matthes is a scumbag, socialist and sucker!
 rhein_separatist_matthes_support: "§SМы будем играть с точки зрения Йозефа Фридриха Маттеса и Лиги независимости.§!" # §SWe will play from the viewpoint of Josef Friedrich Matthes and the Independence League.§!
 rhein_separatist_dorten_support: "§mМы будем играть с точки зрения Ганса Адама Дортена и Народного объединения.§!" # §mWe will play from the viewpoint of Hans Adam Dorten and the People's Association.§!

 rhein.separatist.7.t: "Объединенное движение разваливается" # The United Movement Collapses
 rhein.separatist.7.d: "Ожидать, что такой неудачник, как Дортен, хорошо воспримет свое поражение, было бы действительно фантастическим желанием, но мало кто ожидал, что Дортен сделает после осуждения Маттеса и его победоносной Лиги независимости. После ожидаемого осуждения Маттеса как подстрекателя толпы и криптобольшевика Дортен вскоре удивил всех, призвав фракцию «Народная ассоциация» в ВРБ к расколу. После его ухода вместе с дополнительными словами о предательстве, спровоцированном Пруссией, оставшаяся фракция Смита, состоящая из подхалимов, поддерживаемых Бельгией, также расколется, и в этот момент в «Объединенном Рейнландском движении» останется только Маттес.\n\nХотя это, несомненно, является большим ударом по легитимности сепаратистского движения, многие также видят в этом возможность наконец дать Рейнской области лидерство, необходимое ей для ее возрождения. После того, как Дортен оставил все свои государственные посты, новым премьер-министром стал Вильгельм фон Метцен, давний союзник Маттеса и респектабельный, устойчивый политик из двух. Без какой-либо реакционной или буржуазной партии, которая могла бы им помешать, Лига независимости может, наконец, начать движение к Рейнской республике." # Expecting a sore loser like Dorten to take his loss well would be a fanciful wish indeed, but few expected what Dorten would do after denouncing Matthes and his victorious Independence League. Following his expected denunciations of Matthes as a rabble-rouser and crypto-bolshevik, Dorten would soon surprise everyone by calling the \"People’s Association\" faction within the VRB to split. Following his departure along with additional words on Prussian-induced betrayal, Smeet’s rump faction of Belgian-backed sycophants would also split at which point the \"United Rhineland Movement\" would only have Matthes remaining in it.\n\nWhilst undoubtedly a great blow to the legitimacy of the separatist movement, many also see it as an opportunity to finally give the Rhineland the leadership she needs for her revitalization. With Dorten resigning all his public offices, Wilhelm von Metzen, long-time ally of Matthes and the respectable, steady politician of the two has been made the new prime minister. With no reactionary nor bourgeois party to hinder them, the Independence League can finally begin building towards the Rhenish Republic.
 rhein.separatist.7.dorten: "Благодаря своим связям с большим бизнесом и отталкивающему характеру коллег Маттеса Дортен легко выиграл голосование на национальной конференции. Потерпев поражение, Маттесу вскоре не останется иного выбора, кроме как отойти на второстепенную позицию в сепаратистском движении. Никогда не позволявший такой потере оставаться без ответа, Маттес вскоре впал в яростную ярость по отношению к Дортену, назвав его некомпетентным реакционным и французским инструментом. Однако еще более тревожно то, что Маттес затем призвал к полному расколу фракции «Лиги независимости» внутри VRB. Вскоре после этого Смитс и его команда рабских подхалимов также отделились от движения, что привело к гибели «Объединённого Рейнского движения».\n\nХотя это, несомненно, большой удар по легитимности нового свободного государства, многие увидели в этом золотой шанс. Шанс для жителей Рейнской области раз и навсегда избавиться от прусской нечисти и раз и навсегда освободить жителей Рейнской области. После того как Маттес откажется от всех своих государственных должностей, пост премьер-министра займет Герман Кламт, недавний соратник Дортена и влиятельная фигура среди бизнес-классов. Теперь никто не будет противостоять Дортену в его стремлении к свободе Рейнской области." # With his ties to big business and the off-putting nature of Matthes’s colleagues, Dorten found himself easily winning at the vote of the national conference. Defeated, Matthes would soon have no choice but to slink back to a secondary position within the separatist movement. Never one to let such a loss go unanswered, Matthes would soon fly into a furious rage towards Dorten, denouncing him as an incompetent reactionary and French tool. More worryingly however, Matthes would then go on to call for the \"Independence League\" faction within the VRB to split entirely. Not long after, Smeets and his crew of slavish-sycophants would also split from the movement, culminating in the death of the \"United Rhineland Movement\".\n\nWhilst this is undeniably a great blow to the legitimacy of the new free state, many have seen it as a golden chance. The chance for the people of the Rhineland to once and for all throw off the Prussian scum and liberate the Rhinelanders once and for all. With Matthes resigning all of his public offices, Hermann Klamt, a recent associate of Dorten and influential figure amongst the business classes would take the office of prime minister. Now, no one will oppose Dorten in his quest for the Rhineland’s freedom.
 rhein.separatist.7.a: "Долой народ, вверх, господин Маттес!" # Up with the people, up with Herr Matthes!
 rhein.separatist.7.b: "Мы наконец оставили позади отбросы 1923 года." # We have finally left behind the dregs of 1923.

 rhein.separatist.8.t: "Вторая национальная конференция" # The Second National Conference
 rhein.separatist.8.d: "Открывая конференцию длинной речью о единстве, [RHI.GetLeader] столкнулся с неоспоримым сопротивлением со стороны противостоящей сепаратистской фракции. Поскольку многие ожидали либо неожиданного возвращения, либо сокрушительной победы своей команды, атмосфера, несомненно, была напряженной. Тем не менее, конференция, казалось бы, прошла очень гладко: делегаты от каждой участвующей стороны изложили свои взгляды и пристрастия без особого сопротивления.\n\nОднако вскоре наступил момент истины. Момент, когда будет решена судьба Рейнской области. Был проведен вотум недоверия правительству. Вскоре голоса сначала были подсчитаны, а потом, наконец...\n\nРезультаты были подведены." # Opening the conference with a long speech on unity, [RHI.GetLeader] faced undeniable opposition from the opposing separatist faction. With many anticipating either a surprise comeback or crushing victory for their side, the atmosphere was undeniably tense. However, the conference would seemingly go by very smoothly, with delegates from every attending party stating their views and allegiances with little pushback.\n\nSoon however, the moment of truth would arrive. The moment where the fate of the Rhineland would be determined. A vote of no confidence in the government was held. Soon, the votes were initially counted and then finally...\n\nThe results were tallied.
 rhein.separatist.8.a: "Вот и все." # This is it.

 rhein.separatist.9.t: "Социалистическая дилемма" # The Socialist Dilemma
 rhein.separatist.9.d: "В преддверии очередной национальной конференции Йозеф Смитс и его «Республиканская народная партия» столкнулись с серьезным вопросом. Перед самым слабым из всех трех движений, РВП, стоит теперь трудный вопрос; следует ли им попытаться сотрудничать с Дортеном или с Маттесом?\n\nХотя такой выбор может показаться довольно простым из-за антисоциалистических взглядов Дортена и социалистического происхождения Маттеса, результаты движения Маттеса оказались катастрофическими для РВП. Потеряв многих из-за дезертирства из-за недовольства диктаторскими тенденциями Смитса, РВП просто существует как остатки социалистической партии, а ее статус третьего колеса в движении является ее неизбежной судьбой.\n\nС другой стороны, антисоциализм Дортена может оказаться полезным в возвращении тех, кто стремился бы предоставить рейнским рабочим их революцию через независимость. Естественно, в краткосрочной перспективе Дортен окажется болезненным, но не лучше ли потерять свою актуальность, чем рискнуть всем ради успеха?" # With another national conference coming up, Josef Smeets and his \"Republican People’s Party\" now face a serious question. The weakest out of all three movements, the RVP now faces a difficult question; should they attempt to cooperate with Dorten or with Matthes?\n\nWhilst such a choice may seem rather simple due to Dorten’s anti-socialist leanings and Matthes’s socialist origins, the results of Matthes’s movement have proved disastrous for the RVP. Having lost many to defections due to dissatisfaction with Smeets’s dictatorial tendencies, the RVP simply exists as a rump socialist party, with its status as the third wheel in the movement being its unavoidable fate.\n\nOn the other hand, Dorten’s anti-socialism may prove useful in bringing back those who would seek to grant the Rhenish workers their revolution through independence. Naturally, Dorten will prove painful in the short term, but would it be better to fade into irrelevance than to risk it all for success?
 rhein.separatist.9.a: "Нам необходимо остановить эту реформистскую шараду." # We need to stop this reformist charade.
 rhein.separatist.9.b: "Дортен окажется лишь худшим из двух зол." # Dorten will only prove to be the worse of two evils.

 rhein.separatist.10.t: "Нерешительное движение" # The Faltering Movement
 rhein.separatist.10.d: "Сказать, что дела у движения идут не очень хорошо, было бы легкомыслием. Поскольку наша легитимность по прошествии достаточного времени все еще находится в руинах, ВРБ сильно потеряла импульс и теперь отчаянно продвигается вперед только из-за своей явной инерции в качестве правящей партии.\n\nКонечно, такое положение дел не осталось незамеченным для нашей оппозиции. Осознав открывающуюся перед ними возможность, лидеры оппозиции коллективно осудили [RHI.GetLeader], прежде чем потребовать, чтобы мы передали им власть. Поскольку этого явно не произойдет, нам остается только подождать и посмотреть, что они будут делать дальше..." # To say that things have not been going well for the movement would be putting it lightly. With our legitimacy still in shambles after ample time, the VRB has lost much momentum, now desperately chugging along only through its sheer inertia as the ruling party.\n\nOf course, this state of affairs has not gone unnoticed by our opposition. Realizing the opportunity that lay before them, the opposition leaders have collectively denounced [RHI.GetLeader] before demanding that we turn over power to them. With this obviously not due to happen, we can only wait and see what they will do next...
 rhein.separatist.10.a: "Будь прокляты эти раскольники!" # Curse those splitters!

 rhein.separatist.11.t: "Рейнская трагедия" # The Rhenish Tragedy
 rhein.separatist.11.d: "Хотя многие, возможно, праздновали нашу грандиозную победу на Рейнской национальной конференции в предыдущие годы, такие празднования оказались, по меньшей мере, несколько преждевременными. Правительство Кобленца, омраченное распрями и отсутствием легитимности, несомненно, допустило серьезные ошибки в Рейнской области. Несмотря на нашу почти бесконечную поддержку, простая истина заключается в том, что они не справились с задачей правительства.\n\nИ что дальше? Большинство призывают нас сохранить поддержку, но заставить прекратить распри и обеспечить сохранение лояльности Рейнской области. Однако некоторые «ястребы» призывают к гораздо более рискованному, но потенциально гораздо более выгодному подходу. Оставаясь в стороне с тех пор, как к власти пришло правительство Кобленца, Конрад Аденауэр мог бы оказаться гораздо более компетентной фигурой для руководства Рейнской областью, потенциально более способной принести пользу нашим интересам." # Whilst many may have celebrated our grand victory at the Rhenish national conference in previous years, such celebrations have proved to be a tad early to say the least. Marred by infighting and a lack of legitimacy, the Koblenz government has undoubtedly bungled things massively in the Rhineland. Despite our near-endless support, the simple truth is that they have not acquitted themselves well to the task of government.\n\nSo what next? Most call for us to maintain support, but force an end to the infighting and ensure that the Rhineland remains loyal. Some hawks however call for a much riskier, but potentially much more beneficial approach. Having remained at the sidelines since the Koblenz government took hold, Konrad Adenauer could prove a much more competent figure to lead the Rhineland, potentially being more able to benefit our interests.
 rhein.separatist.11.a: "Действительно трагедия..." # A tragedy indeed...
 rhein.separatist.11.b: "Хватит!" # Enough is enough!

 rhein.separatist.12.t: "Ярость Парижа" # Paris's Ire
 rhein.separatist.12.d: "Хотя ослабление сепаратистского движения, возможно, было очевидно для большинства внешних наблюдателей, один наблюдатель только сейчас обратил внимание на нашу довольно неудачную ситуацию. После нескольких резких телеграмм и разговоров французы заявили о своей готовности продолжать поддерживать нас, но ценой прекращения наших внутренних разногласий.\n\nХотя такая цена может показаться вовсе не ценой, которую нужно заплатить, она лишь продемонстрировала неэффективность правительства в решении ситуации. Учитывая, что должна быть созвана вторая национальная конференция, единственное, что сейчас можно сказать наверняка, это то, что нынешнее правительство обязательно ждет трудное будущее - при условии, что оно вообще переживет эту конференцию." # Whilst the faltering separatist movement may have been obvious to most outside observers, one observer has only now taken notice of our rather unfortunate situation. Following some strongly worded telegrams and conversations, the French have indicated their willingness to continue backing us up, but at the cost of ending our internal squabbles.\n\nWhilst such a cost may not seem like a price to pay at all, it has only demonstrated the government’s ineffectual handling of the situation. With a second national conference due to be called, the only thing certain now is that the current government is bound to have a rough future ahead of it - assuming it even survives the conference that is.
 rhein.separatist.12.a: "Большой..." # Great...

 rhein.separatist.13.t: "Конец ВРБ" # The End of the VRB
 rhein.separatist.13.d: "Немыслимое произошло. Поскольку Париж был недоволен тем, как мы справляемся с ситуацией, похоже, они решили продать нас в пользу мэра Кельна Конрада Аденауэра. Будучи создателем королей в Рейнской области, наша неспособность обеспечить легитимность привела к тому, что он получил большую власть, превратив его в наиболее предпочтительный вариант для французов.\n\nПоскольку французы требуют, чтобы мы присоединились к правительству Аденауэра, у нас нет выбора. Единственное, на что мы можем надеяться, это то, что с этого момента ситуация не ухудшится..." # The unthinkable has happened. With Paris having become dissatisfied with our handling of the situation, it seems that they have opted to sell us out in favour of mayor of Cologne Konrad Adenauer. Once the kingmaker in the Rhineland, our inability to secure legitimacy has caused him to gain much power, turning him into the much preferred option for the French.\n\nWith French pressure demanding that we accede to Adenauer’s government, we have little choice. The only thing we can hope for is that things will not get worse from here on out...
 rhein.separatist.13.a: "Так дошло до этого..." # So it came to this...

 rhein.separatist.14.t: "Будущее Рейнской области" # The Rhineland's Future
 rhein.separatist.14.d: "Время пришло.\n\nПоскольку сепаратистское движение слишком долго было втянуто в запутанную внутреннюю политику, борьба стала просто невыносимой. Поскольку коалиционное правительство продолжает демонстрировать свою несостоятельность, была созвана национальная конференция, призванная определить будущее Рейнской области." # The time has come.\n\nWith the separatist movement having been embroiled in messy internal politics for far too long, the infighting has simply become too unbearable. With a continued coalition government demonstrating itself to be untenable, a national conference has been called, all to determine the future of the Rhineland.
 rhein.separatist.14.a: "Давайте займемся этим!" # Let's get to it!

 rhein.separatist.15.t: "[FROM.GetName] просит независимости" # [FROM.GetName] Asks for Independence
 rhein.separatist.15.d: "Поскольку наш рейнский союзник продолжает укрепляться, сегодня поступил смелый запрос из Кобленца. В нем они просят нас сократить наше влияние в Рейнской области и фактически позволить им стать независимыми. Хотя это не обязательно плохо, «ястребы» критикуют это как уловку с целью вернуть Рейнскую область в руки Германии." # With our Rhenish ally continuing to entrench themselves, a bold request has come in today from Koblenz. In it, they ask for us to scale down our influence in the Rhineland and to effectively allow them to become independent. Whilst this is not necessarily a bad thing, hawks have railed against this as a ploy to land the Rhineland back into the hands of Germany.
 rhein.separatist.15.a: "Они уже БЕСПЛАТНЫ." # They already ARE free.
 rhein.separatist.15.b: "Они заслужили свою свободу." # They have earned their freedom.

 rhein.separatist.16.t: "[FROM.GetName] отказывается" # [FROM.GetName] refuses
 rhein.separatist.16.d: "К сожалению, похоже, что [FROM.GetName] отказался предоставить нам полную независимость, ссылаясь на нынешнее существование режима Валкистов как на требование для их дальнейшей защиты нас. Хотя это, без сомнения, ошибка в борьбе с валькизмом, мы можем оставить это в покое только до тех пор, пока Германия не будет по-настоящему разгромлена." # Sadly, it appears that [FROM.GetName] has refused to grant us total independence, citing the current existence of the Valkist regime as a requirement for their continued protection of us. Whilst this is no doubt a misstep in the fight against Valkism, we can only leave this be until Germany is truly defeated.
 rhein.separatist.16.a: "И ожидать от них чего-то другого..." # And to expect anything else from them...

 rhein.separatist.17.t: "[FROM.GetName] освобождает нас" # [FROM.GetName] Releases Us
 rhein.separatist.17.d: "Удивительно, но [FROM.Capital.GetCapitalVictoryPointName] решил оставить нас в покое, позволив нам выступать в качестве равноправного партнера. Это, без сомнения, великая победа в наших постоянных усилиях по созданию свободной, независимой Рейнской области в более безопасной и процветающей Европе." # Surprisingly, [FROM.Capital.GetCapitalVictoryPointName] has decided to leave us be, allowing us to step forth as an equal partner. This is without a doubt a great victory in our continued effort towards a free, independent Rhineland in a safer, more prosperous Europe.
 rhein.separatist.17.a: "Как и должно быть." # As they should.

 rhein.separatist.18.t: "Рейнский триумф" # The Rhenish Triumph
 rhein.separatist.18.d: "С падением Германии факт стал совершенно очевидным: свободная Рейнская область никуда не денется.\n\nДаже во время невзгод войны некоторые все еще сомневались в способности Рейнского государства противостоять прусской угрозе. Даже наши союзники за границей в частном порядке высмеивали нас за то, что мы не более чем марионетка французов, но теперь никто не может отрицать, что Рейнская область свободна и что именно мужественное руководство [RHI.GetLeader] довело остатки свободного немецкого народа до конца войны.\n\nПосле окончания войны сепаратистское движение получило больше легитимности, чем когда-либо. Бывшие скептики теперь хвалят правительство, и мнение о том, что мы не более чем французские марионетки, больше не существует. Дух Лорелей действительно высвободился!" # With the fall of Germany, a fact has been made abundantly apparent - a free Rhineland is here to stay.\n\nEven in the tribulations of war, some still doubted the ability for the Rhenish state to withstand the Prussian menace. Even our allies abroad privately mocked us for being little more than a puppet of the French, but now no one can deny that the Rhineland is free and that it was to the courageous leadership of [RHI.GetLeader] that saw the remnants of a free German people through to the end of the war.\n\nWith the war now over, the separatist movement has received more legitimacy than ever. Former skeptics now praise the government and the view that we are little more than French puppets stands no longer. The spirit of Lorelei has truly been unleashed!
 rhein.separatist.18.d_vrb: "С падением Германии факт стал совершенно очевидным: свободная Рейнская область никуда не денется.\n\nДаже во время невзгод войны некоторые все еще сомневались в способности Рейнского государства противостоять прусской угрозе. Даже наши союзники за границей в частном порядке высмеивали нас за то, что мы не более чем марионетка французов, но теперь никто не может отрицать, что Рейнская область свободна и что именно мужественное руководство Объединенного Рейнского движения довело остатки свободного немецкого народа до конца войны.\n\nПосле окончания войны сепаратистское движение получило больше легитимности, чем когда-либо. Бывшие скептики теперь хвалят правительство, и мнение о том, что мы не более чем ссорящиеся французские марионетки, больше не существует. Дух Лорелей действительно высвободился!" # With the fall of Germany, a fact has been made abundantly apparent - a free Rhineland is here to stay.\n\nEven in the tribulations of war, some still doubted the ability for the Rhenish state to withstand the Prussian menace. Even our allies abroad privately mocked us for being little more than a puppet of the French, but now no one can deny that the Rhineland is free and that it was to the courageous leadership of the United Rhenish Movement that saw the remnants of a free German people through to the end of the war.\n\nWith the war now over, the separatist movement has received more legitimacy than ever. Former skeptics now praise the government and the view that we are little more than bickering French puppets stands no longer. The spirit of Lorelei has truly been unleashed!
 rhein.separatist.18.a: "Были ли когда-нибудь сомнения?" # Was there ever any doubt?

 rhein.separatist.19.t: "Федеральное вмешательство" # Federal Intervention
 rhein.separatist.19.d: "К сожалению, похоже, что центральное правительство имеет твердые взгляды на наше нынешнее правительство. Получив юридическое разрешение на вмешательство в дела нашего государства, федеральные войска вошли в столицу и насильственно отстранили правящее правительство от власти в пользу другого, поддерживающего политику Франкфурта." # Unfortunately, it appears that the central government has strong views on our current government. With the legal clearance to intervene into our state, federal troops have moved into the capital and forcibly removed the ruling government from power in favour of one more aligned with Frankfurt’s policies.
 rhein.separatist.19.a: "От стыда..." # For shame...

# Adenauer

 rhein.adenauer.0.t: "Удивительная акция" # An Astonishing Promotion
 rhein.adenauer.0.d: "Поскольку Центр взял на себя роль новых лидеров Рейнской области, возникли большие опасения по поводу статуса нового правительства. Хотя переход от главного местного политического деятеля мандата к лидеру Рейнской области может показаться не таким уж большим изменением, он, безусловно, стал причиной беспокойства нового Рейнского Свободного Государства. Хотя большая часть Центрума в ныне бывшем мандате желает сохранить независимость Рейнской области как от пруссаков, так и от парижан, сепаратизм не очень популярен, и многие все еще жаждут свободной Рейнской области в свободной Германии.\n\nТем не менее, Аденауэр и вместе с ним Рейнский Центр теперь имеют задачу вести новое государство вперед. Поскольку французы остались в Рейнской области по просьбе Z, главного администратора Саара, Жозеф Луи Андлауэр взял на себя роль связующего звена между правительством и Францией, а государственные должности перешли в руки Центра. Давний бастион Центра в годы республики, многие ждут с оптимизмом, а также опасаются будущего, которое ждет новорожденное Рейнское государство." # With the Centre having taken on the role as the Rhineland’s new leaders, there was much fear on what the status of the new government would be. Whilst going from the premier local political figure in the mandate to leader of the Rhineland may not seem like much of a change, it most certainly has become a cause of concern for the new Rhenish Free State. Although most of Zentrum in the now-former mandate desires to maintain the Rhineland’s independence from both the Prussians and the Parisians, separatism is not terribly popular and many still yearn for a free Rhineland in a free Germany.\n\nNevertheless, Adenauer and along with him Rhenish Zentrum now have the task of leading the new state forward. With the French having remained in the Rhineland at the request of Z, chief administrator of the Saarland, Joseph Louis Andlauer has taken the role as the liaison between the government and France with government positions having fallen into the hands of Zentrum. The long-time bastion of Zentrum during the years of the republic, many await with optimism and also dread the future that will await the newly born Rhenish state.
 rhein.adenauer.0.a: "Нам предстоит многое сделать..." # We have got much to do...

 rhein.adenauer.1.t: "Приглашение военных советников [FRA.GetAdjective]" # Invitation of [FRA.GetAdjective] Military Advisors
 rhein.adenauer.1.d: "Сегодня французские советники прибыли в нашу столицу, чтобы начать обучение и сотрудничество с нашей зарождающейся армией. Даже если отношения между немцами и Парижем будут непростыми, мы можем быть спокойны, зная, что самая сильная армия в Европе находится здесь, чтобы направлять наших храбрых людей в сохранении свободы Рейнской области." # Today, French advisors have arrived at our capital to begin teaching and cooperating with our nascent military. Even if the relationship between the Germans and Paris are fraught, we can rest easy knowing that the strongest army in Europe is here to guide our brave men in the preservation of the Rhineland’s freedom.
 rhein.adenauer.1.a: "Давайте работать вместе ради сохранения демократии!" # Let us work together towards democracy’s preservation!

 rhein.adenauer.2.t: "Создание Конституционного Суда" # The Creation of the Verfassungsgericht
 rhein.adenauer.2.d: "Когда в свободной республике наконец-то воцарился порядок, пришло время нейтрализовать Рейнскую область от множества токсичных экстремистов, которые готовы увидеть террор и смерть, готовясь к осуществлению своих причудливых желаний. С согласия наших союзников был создан новый конституционный суд, который обеспечит возможность организации в нашей молодой демократии только конструктивных, демократических партий, а не деструктивных и обструкционистских радикалов." # With order finally reigning in the free republic, the time has come to neutralize the Rhineland from the many toxic extremists who are prepared to see to terror and death in preparation for their fanciful desires. With the consent of our allies, a new constitutional court has been established that will ensure only the constructive, democratic parties are allowed to organize in our young democracy instead of destructive and obstructionist radicals.
 rhein.adenauer.2.a: "Давайте поддержим нашу демократию!" # Let us uphold our democracy!

 rhein.adenauer.3.t: "Дипломатическая миссия [RHI.GetAdjective] в Париже" # The [RHI.GetAdjective] Diplomatic Mission to Paris
 rhein.adenauer.3.d: "Поскольку наша дипломатическая миссия отправляется в Париж, нам предстоит многое решить, что будет на повестке дня. Есть много вещей, которые нам нужны от французов, но многие не согласны с тем, каким должен быть порядок дня.\n\nНекоторые говорят, что нам нужно добиться большей свободы вдали от Парижа - это ослабление их относительного контроля над нами. Другие требовали, чтобы мы попросили вернуть наш уголь и сталь в наши руки. Конечно, некоторые также высказали предложение, что мы просто запросим дополнительные инвестиции у французов, и они с гораздо большей вероятностью примут это предложение." # As our diplomatic mission sets off for Paris, we have much to decide what shall be on the agenda. There are many things that we need from the French, but many disagree on what shall be the order of the day.\n\nSome say that we need to attain more freedom away from Paris - that is the loosening of their relative control over us. Others have demanded that we ask for our coal and steel to be back in our hands. Of course, some have also floated the suggestion that we simply request additional investments from the French, a proposal they are far more likely to accept.
 rhein.adenauer.3.a: "Попросите больше автономии" # Ask for more autonomy
 rhein.adenauer.3.b: "Запрос прав на ресурсы на землю [RHI.GetAdjective]" # Request for resource rights to [RHI.GetAdjective] land
 rhein.adenauer.3.c: "Запросить развитие инфраструктуры" # Request infrastructure development
 rhein.adenauer.3.e: "Запросить помощь в развитии исследований" # Request aid in research development
 rhein.adenauer.3_tt: "§YОни с большей вероятностью выполнят следующее, хотя §rне§! гарантировано, что они это сделают§!" # §YThey will be more likely to proceed with the following, although it is §rnot§! guaranteed they will do so§!

 rhein.adenauer.4.t: "[RHI.GetName] просит помощи" # [RHI.GetName] requests assistance
 rhein.adenauer.4.d: "Рейнская делегация прибыла сегодня в Париж, чтобы встретиться с нашими дипломатами для переговоров о помощи и содействии их молодому государству. В ходе дискуссий о признании среди других обычно ожидаемых тонкостей, рейнская делегация совершенно ясно изложила свои цели.\n\n" # A Rhenish delegation has arrived in Paris today, meeting with our diplomats to negotiate over aid and assistance to their fledgling state. Amidst discussions for recognition among other usually expected niceties, the Rhenish delegation have made their aims abundantly clear.\n\n
 rhein.adenauer.4.da: "$rhein.adenauer.4.d$Они поставили своей главной целью большую независимость. Хотя немцы очень высоко оценили бы это, многие националисты осудили это как типичное тевтонское предательство нашей щедрости и призвали нас отклонить их призыв и уступить чему-то меньшему." # $rhein.adenauer.4.d$They have made their primary goal being greater independence. While this would be very well-appreciated by the Germans, many nationalists have decried this as a typical Teuton betrayal of our generosity and have urged us to reject their call and concede something less.
 rhein.adenauer.4.db: "$rhein.adenauer.4.d$Эта цель будет заключаться в передаче прав на ресурсы тому, что они считают законным правительством Германии, которое желает работать над достижением окончательного мира в Европе. Хотя некоторые «ястребы» предостерегают от отказа от такого преимущества, большинство согласны с тем, что это станет первым шагом на пути к дружественной Германии." # $rhein.adenauer.4.d$That goal would be for the turning over of resource rights to what they view as a legitimate German government that desires to work towards the ultimate achievement of peace in Europe. Although some hawks have warned against giving up such an advantage, most agree that it would be the first step towards a friendly Germany.
 rhein.adenauer.4.dc: "$rhein.adenauer.4.d$Рейнцы запросили развитие инфраструктуры, относительно небольшую инвестицию, которая могла бы оказаться ценной для привязки их к нашей сфере. Тем не менее, некоторые призывают вместо этого хранить ресурсы дома." # $rhein.adenauer.4.d$The Rhenish have requested infrastructure development, a relatively small investment that could prove valuable in tying them to our sphere. Still, some have urged that we keep the resources at home instead.
 rhein.adenauer.4.dd: "$rhein.adenauer.4.d$Их цели оказались довольно мягкими - просто некоторая помощь в дальнейшем технологическом развитии. Это, несомненно, окажется взаимовыгодным, хотя до сих пор оно не привлекло ярых националистов." # $rhein.adenauer.4.d$Their aims have proven to be rather mild - simply some aid in the furthering of their technological development. This would no doubt prove mutually beneficial, although it has still yet to appeal to the rabidly nationalist.
 rhein.adenauer.4.a: "Дайте им автономию" # Give them their autonomy
 rhein.adenauer.4.b: "Удалить права ресурса [FRA.GetName]" # Remove [FRA.GetName] resource rights
 rhein.adenauer.4.c: "Стройте больше инфраструктуры" # Build more infrastructure
 rhein.adenauer.4.e: "Дайте им некоторую исследовательскую помощь" # Give them some research aid
 rhein.adenauer.4.f: "Они ничего не получают!" # They get nothing!

 rhein.adenauer.5.t: "Французский «Мост жизни»" # The French Lifeline
 rhein.adenauer.5.d: "Сегодня наша просьба о полноценном союзе, а также о поддержке со стороны французов была получена французами. Учитывая продолжающееся присутствие французских войск и средств в новом Рейнском государстве, такие вопросы были формальностью.\n\nХотя такие отношения с французами, несомненно, окажутся плодотворными и жизненно важной частью любой стратегии сопротивления расширению Берлина, мы должны опасаться постоянного французского присутствия. Некоторые даже говорят, что если его будет слишком много, антифранцузская часть общества обретет силу, чтобы пригласить Пруссию обратно в Рейнскую область и вызвать разрушение нашей демократии. В любом случае, нам следует действовать осторожно..." # Today our request for a full-fledged alliance as well as support by the French was received by the French. Considering the continued presence of French troops and funds in the new Rhenish state, such matters were a formality.\n\nWhilst such a relationship with the French shall undoubtedly prove to be fruitful and the vital part of any strategy to resist Berlin's expansion, we must be wary of continuous French presence. Some even say that should there be too much of it, the anti-French section of the public will gain the strength to invite Prussia back into the Rhineland and cause the destruction of our democracy. Either way, we ought to tread lightly...
 rhein.adenauer.5.a: "Пусть будет так." # So be it.

 rhein.adenauer.6.t: "[FRA.GetNameDef] отказывает нам!" # [FRA.GetNameDef] denies us!
 rhein.adenauer.6.d: "К несчастью, [FRA.GetNameDef] решил отказать нам, тем самым превратив всю дипломатическую миссию в пустую трату времени. Хуже того, пресса пронюхала об этом предательстве и, в свою очередь, привела к резкому росту антифранцузских настроений до уровня, невиданного со времен кризиса 1923 года." # In a truly unfortunate turn of events, [FRA.GetNameDef] has opted to refuse us, thereby making the entire diplomatic mission a total waste of time. Worse, the press has caught wind of this betrayal and has in turn caused anti-French sentiments to spike to levels not seen since the crisis of 1923.
 rhein.adenauer.6.a: "Какая пустая трата времени..." # What a waste of time...

 rhein.adenauer.7.t: "Победа во Второй Великой войне" # Victory in the Second Great War
 rhein.adenauer.7.d: "Прошли годы с момента захвата Германии зверским тираном, известным как Адам Дресслер. Тем временем лидеры поднимались и падали, а старый порядок Антанты теперь безвозвратно изменился. Переведя взгляд с невинных немцев на народы Европы, прусская угроза обнаружила, что откусывает гораздо больше, чем может проглотить - конечным результатом является подчинение остальной части Германии смерти и разрушению.\n\nТеперь мы обратимся к новой эре. Мы вышли победителями из этой войны, немецкий народ свободен от валькизма и его банд головорезов. Остается только догадываться, суждено ли Рейнской области отделиться или взять под свое крыло другие немецкие государства, но сейчас мы можем быть спокойны, зная, что экзистенциальный террор Европы побежден." # Years have gone by since the takeover of Germany by the bestial tyrant known as Adam Dressler. In the meantime, leaders have risen and fallen - with the old Entente order now irrevocably different. Turning its eyes from innocent Germans towards the peoples of Europe, the Prussian menace found itself biting off far more than it could chew - the end result being the subjugation of the rest of Germany to death and destruction.\n\nNow we shall turn towards the new era. We have come out victorious in this war, the German people are free from Valkism and its gaggles of thugs. Whether the Rhineland is fated to be separate, or to take the other German states under its wing is anyone’s guess, but for now we can rest easy knowing that the existential terror of Europe has been vanquished.
 rhein.adenauer.7.a: "Мы празднуем – и скорбим." # We celebrate - and mourn.

 rhein.adenauer.8.t: "Изменение политических ветров" # Shifting Political Winds
 rhein.adenauer.8.d: "Аппетит к сепаратизму в Рейнской области всегда был довольно небольшим, и парадоксально то, что немногие движения столь же разделены, как рейнские сепаратисты. Раньше расколовшаяся между левой Лигой независимости и твердо буржуазной правой Народной ассоциацией, захват середины привел к тому, что последняя медленно, но верно утратила свою значимость.\n\nНеудивительно, что конспиративный, тщеславный и часто неистовый лидер Народной ассоциации Ганс Адам Дортен лишился большей части своей поддержки. Никогда не забывая о своем предполагаемом «предательстве» со стороны Аденауэра в 1919 году, Дортен регулярно и на каждом шагу отказывался сотрудничать с нашим правительством. Это, в сочетании с потерей благосклонности Франции, не сулит ничего хорошего его движению, поскольку оно начало терять сторонников. Смерть его движения теперь освящена его роспуском, поскольку его сторонники переходят к оставшемуся либеральному движению, в результате чего в Рейнской области осталось только одно по-настоящему сепаратистское движение." # The appetite for separatism in the Rhineland has always been rather small, making it ironic that few movements are as divided as the Rhenish separatists. Formerly split between the left-leaning Independence League and the firmly bourgeois right-wing People’s Association, the takeover of the middle has caused the latter to slowly but surely lose its relevance.\n\nIt is hardly surprising that the conspiratorial, vain and often boisterous leader of the People’s Association, Hans Adam Dorten has withered away much of his support. Having never forgotten his supposed ‘betrayal’ at the hands of Adenauer in 1919, Dorten has regularly refused to cooperate with our government at every turn. This, combined with his loss of French favour, has not bode well for his movement as it began to haemorrhage supporters. The death of his movement has now been consecrated with its disbandment as supporters move towards the rump liberal movement, leaving only one truly separatist movement in the Rhineland.
 rhein.adenauer.8.a: "Его не пропустят." # He will not be missed.

# Republicans

 rhein.republic.1.t: "Призрак Веймара" # The Ghost of Weimar
 rhein.republic.1.d: "С приходом к власти Дресслера и крайне правых на востоке в целом республика, возникшая в результате Веймарской декларации в тот холодный день 1919 года, несомненно, умерла. Многие, конечно, считают ее судьбу неизбежной, а существующий вывод просто входит в число наиболее вероятных и желанных судеб немецкой нации. Однако радикальный характер Дресслера и его бандитских лиг подтолкнул многих немцев к более широкому миру, причем многие оказались здесь по личным или политическим причинам.\n\nКонечно, многие в мандате по-прежнему желают только выжить, но по мере того, как дни мандата становятся все более сочтенными, многие нервно ожидают вакуума власти, который последует за любым выводом союзников. Многие доверяют своим местным лидерам, другие предпочитают следовать за поддерживаемыми французами сепаратистами, но новая ситуация придала смелости новой фракции - «веймарцам», как их часто насмешливо называют или иным образом желающим вернуться в республику.\n\nСбежав от террора, развязанного режимом валкистов, они теперь действуют в Рейнской области, агитируя за то, чтобы Рейнская область стала следующим бастионом немецкой демократии. Поскольку сепаратистов обычно считают французскими хакерами, эта точка зрения нашла неоспоримую популярность среди слоев рейнского населения, хотя они и испытывают отвращение к продолжающемуся французскому присутствию в Рейнской области.\n\nКонечно, их желание вернуться в республиканское правительство также вызвало серьезное сопротивление со стороны ведущих деятелей Рейнской области. Будь то их ледяное отношение к федерализму, страх, что их правление приведет к новой войне или просто их узкая привлекательность, республиканцам предстоит многое сделать, если они хотят возродить Германию 1928 года." # With the rise of Dressler and the far-right in general in the east, the republic that arose from the declaration at Weimar on that cold day in 1919 has undeniably died. Many of course see its fate as inevitable, with the existing conclusion simply being amongst the most likely and desired fates of the German nation. However, the radical nature of Dressler and his thuggish leagues have propelled many Germans towards the wider world, with many ending up here out of personal or political reasons.\n\nOf course, many in the mandate still desire only to get by, but as the mandate’s days grow more numbered, many nervously anticipate the power vacuum that would follow any Allied withdrawal. Many put their faith in their local leaders, others opt to follow the French-backed separatists, but the new situation has emboldened a new faction - the  \"Weimarers\" as they are often denoted derisively or otherwise desire a return to the republic.\n\nHaving fled from the terror unleashed by the Valkist regime, they now operate within the Rhineland, agitating for the Rhineland to become the next bastion of German democracy. With the separatists commonly viewed as French hacks, this view has found undeniable popularity amongst sections of the Rhenish populace - sickened as they are by continued French presence in the Rhineland.\n\nOf course, their desire to return to the republican government has also sparked major pushback from leading Rhenish figures. Whether it be their icy disposition towards federalism, the fear that their rule will lead to another war or simply their narrow appeal, the republicans have much to do if they are to have a chance to resurrect the Germany of 1928.
 rhein.republic.1.a: "Разве они ни разу не потерпели неудачу?" # Haven’t they failed once?
  
 rhein.republic.2.t: "Сепаратистское возмущение" # Separatist Outrage
 rhein.republic.2.d: "Не все восприняли наше провозглашение как наследников Германской республики хорошо, мерзкие сепаратистские элементы, поддерживаемые французами, начали атаковать и преследовать наши силы на каждом углу. Хотя с ними разбираются быстро и безжалостно, это по-прежнему раздражает укоренившуюся Schutztruppe, что на каждом шагу делает укрепление нашего правления все более головной болью." # Not all have taken our proclamation as the inheritors of the German republic well, vile separatist elements backed by the French have begun to attack and harass our forces at every corner. Whilst they are being dealt with swiftly and ruthlessly, this has still proven irritating with the entrenched Schutztruppe making cementing our rule more of a headache at every turn.
 rhein.republic.2.a: "Считали ли они себя предателями?" # Have they considered not being traitors?

 rhein.republic.3.t: "Вторая бургфриденская политика" # The Second Burgfriedenspolitik
 rhein.republic.3.d: "Как всегда, социал-демократы не проявили особого единства в вопросе сотрудничества с правительством. Благодаря нашему политическому перемирию с ними перед лицом подавляющей силы Берлина, некоторые левые внутри СДПГ осудили умеренных за их готовность сотрудничать с тем, что они считают коррумпированным республиканским правительством. Хотя они и не восстали открыто против правительства, они оказались не очень восприимчивы к любой форме сотрудничества и отделились от социал-демократов во всем, кроме названия." # As always, the social democrats have not proven particularly united on the issue of cooperation with the government. With our political truce with them in the face of Berlin's overwhelming strength, some leftists within the SPD have denounced the moderates for their willingness to cooperate with what they see as a corrupt republican government. Even though they have not outright rebelled against the government, they have not proven very receptive to any form of cooperation and have split from the social democrats in all but name.
 rhein.republic.3.a: "Левые всегда были непримиримыми." # Leftists have always been intransigent.
  
 rhein.republic.4.t: "Шлейхер Кабинет" # Kabinett Schleicher
 rhein.republic.4.d: "С большим ожиданием Курт фон Шлейхер был восстановлен в должности законного канцлера страны, которая вскоре станет единственной Германией в мире. Хотя у некоторых есть опасения по поводу компетентности и убеждений Шлейхера, особенно принимая во внимание катастрофу 1932 года, многих успокоило обещание Шлейхера править в интересах республики и действовать в качестве временного канцлера до тех пор, пока республика действительно не сможет вернуться к народу.\n\nТем не менее, Шлейхеру не просто будет предоставлена ​​самая влиятельная должность в правительстве. Поскольку в глубине души он был военным и о его истинной цели в отношении Германии ходили многочисленные слухи, республиканский совет не позволил Шлейхеру просто короновать себя как своего рода верховного диктатора. Решив остаться на своем месте, республиканский совет вынудил Шлейхера, по крайней мере, разделить власть с советом до тех пор, пока не будут решены дальнейшие политические вопросы. Хотя это и ограничит более жаждущие власти амбиции Шлейхера, это может послужить для него возможностью заручиться поддержкой..." # With great anticipation, Kurt von Schleicher has been reinstated as the rightful chancellor of what will soon-be the only Germany in the world. Although some have worries over Schleicher’s competence and beliefs, especially taking the catastrophe of 1932 into account, many have been eased by Schleicher’s promise to reign in the republic’s interests and to act as a caretaker chancellor until the republic can truly return to the people.\n\nNevertheless, Schleicher will not simply be granted the most powerful position in the government. As a military man at heart and with many rumours about his true aim for Germany abound, the republican council would not simply let Schleicher crown himself as some sort of supreme dictator. Opting to remain in place, the republican council has forced Schleicher to at least share power with the council until further political matters are settled. Though this will curb Schleicher’s more power hungry ambitions, it could serve as an opportunity for him to shore up support...
 rhein.republic.4.a: "Все-таки Шлейхер всегда был за республику, верно?" # Still, Schleicher has always stood for the republic, right?
 
 rhein.republic.5.t: "Старый канцлер" # The Old Chancellor
 rhein.republic.5.d: "Подъем республиканских сил не остался незамеченным на Рейне, и многие говорили о потенциальном возвращении республиканцев, которое было бы настолько шокирующим и внушающим трепет, что даже революция 1919 года была бы посрамлена. Конечно, такое преувеличенное предположение выставляет часто разделенных и во многих случаях слабых республиканцев в очень хорошем свете, особенно когда речь идет о презумпции республиканской демократии.\n\nПосле своего бесславного изгнания в 1932 году Курт фон Шлейхер бежал вместе со своими гражданскими и военными союзниками на Рейн, где он и многие другие сейчас остаются. Шлейхер, которого валькистская пропаганда высмеивает как труса и французского предателя, Шлейхер, безусловно, не предатель. Будучи ярым националистом и милитаристом, его действия по предотвращению восхождения Дресслера на пост президента вряд ли можно было бы назвать демократическим, поскольку многие республиканцы в частном порядке высмеивали автократические стремления Шлейхера. Тем не менее, его широкие связи с Рейхсвером сделали его важной частью лагеря «Веймареров», и его амбиции наверняка не ослабли.\n\nДаже тогда, может быть, Шлейхер осознал свою ошибку? Многие республиканцы считают, что ему можно доверять и что как конституционный канцлер, несправедливо свергнутый валькистской толпой, он имеет полное право стать канцлером, если республиканцы захватят власть и удержатся. В конце концов, неужели он не будет настолько жадным, чтобы попытаться установить новую диктатуру?" # The rise of the republican forces has not gone unnoticed in the Rhine, with many speaking of a potential republican comeback that would be so shocking and awe-inspiring even the revolution of 1919 would be put to shame. Of course, such an exaggerated suggestion puts the oft-divided and in many cases weak republicans in a very good light, most especially when it comes to the presumption of republican democracy.\n\nFollowing his inglorious ousting in 1932, Kurt von Schleicher fled along with his civilian and military allies to the Rhine where he and many others now stay. Schleicher mocked by valkist propaganda as a coward and French sell-out, Schleicher is most certainly not a sell-out. A fervent nationalist and militarist, his gambit to prevent Dressler’s ascension to the presidency could hardly be described as democratic with many republicans privately scoffing at Schleicher’s autocratic desires. Nevertheless, his widespread connections to the Reichswehr has made him a crucial part of the \"Weimarer\" camp and his ambitions have most certainly not waned.\n\nEven then, maybe Schleicher has seen the error of his ways? Many republicans believe that he can be trusted and that as the constitutional chancellor who was unjustly overthrown by the valkist mob, he has every right to be the chancellor should the republicans take and hold on to power. After all, surely he would not be so greedy as to attempt another dictatorship?
 rhein.republic.5.a: "Может быть, он изменился?" # Maybe he has changed?

 rhein.republic.6.t: "Республиканское возрождение" # The Republican Revival
 rhein.republic.6.d: "Когда в 1932 году республика пала, многие думали, что немецкая демократия — это просто смехотворная мечта группы слабых, но действующих из лучших побуждений людей. Эти пессимисты или сторонники валкистов считали нас совершенно неспособными дать отпор и противостоять валкистским ублюдкам.\n\nГде сейчас скептики и циники? Своей победой на национальной конференции мы не только оживили, но даже придали смелости новому республиканскому движению. Ибо, если мы сможем преодолеть железную хватку французов, мы сможем собрать эту волю для победы над валькизмом, победы демократии и освобождения немецкого народа от бандитского режима Берлина.\n\nЭто легче сказать, чем сделать. И было решено, что республиканские партии объединятся в этот новый священный союз, мало чем отличающийся от того, который был заключен в Париже во время Великой войны. Поскольку Германия находится в руках темных сил, теперь на нас лежит ответственность исправить эту ошибку Европы и построить новую Германию к лучшему." # When the republic fell in 1932, many had thought that German democracy was simply a laughable dream of a bunch of weak but well-meaning men. These pessimists or valkist-sympathizers thought us totally incapable of being able to fight back and resist the Valkist bastards.\n\nWhere are the naysayers and cynics now? With our victory at the national conference we have not only revitalized, but even emboldened the new republican movement. For if we could overcome the iron grip of the French, we will be able to muster that will into the defeat of valkism, the victory of democracy and the liberation of the German people from Berlin’s thuggish regime.\n\nThis is easier said than done. And so it was decided that the republican parties would come together in this new sacred union, not unlike the one made in Paris during the Great War. With Germany in the hands of dark forces, the responsibility is now on us to fix this mistake of Europe and build a new Germany for the better.
 rhein.republic.6.a: "Вперед!" # Vorwärts!

 rhein.republic.7.t: "Прусская ярость" # Prussian Fury
 rhein.republic.7.d: "Сегодня бывшие офицеры рейхсвера во главе с Францем фон Рокесом и Куртом Либманом без предупреждения прибыли в Кобленц и потребовали объяснить, почему мы решили работать с социал-демократами, которые пока остаются вне коалиции. Несмотря на то, что они, казалось, были удовлетворены причиной республиканского единства, вызывает беспокойство то, что они даже пришли спросить, почему это было сделано. Разве они не лояльны республике и Германии?" # Today, former Reichswehr officers led by Franz von Roques and Curt Liebmann have arrived to Koblenz without notice, demanding to know why we have decided to work with the social democrats who as of now remain outside of the coalition. Even though they seemed to have been satisfied with the reason for republican unity, it is worrying that they have even come to ask why such a thing has been done. Are they not loyal to the republic and to Germany?
 rhein.republic.7.a: "Они могли бы остаться со своими хозяевами в Цоссене..." # They could have remained with their masters at Zossen...

 rhein.republic.8.t: "Бессмертный враг Республики" # The Republic’s Undying Foe
 rhein.republic.8.d: "Похоже, что, несмотря на наши первоначальные попытки, бывший рейхсвер снова захотел вступить в бой с республиканским правительством. По-видимому, подстрекаемые Шлейхером и другими ультраконсервативными элементами внутри коалиции, военные яростно протестовали против нашего сотрудничества с социал-демократами, заявляя, что СДПГ каким-то образом предала Германию или являются криптобольшевиками, которые попытаются подчинить нас Москве.\n\nНесмотря на довольно нелепый характер этих утверждений, они, безусловно, раскрыли истинные цвета рейхсвера - красно-бело-черные. Таким образом, мы должны решить, следует ли нам попытаться пойти с ними на компромисс или нам следует просто подождать, пока они сдадутся - ведь они не попытаются сделать что-то глубоко глупое?" # It seems that despite our initial attempts, the former Reichswehr have once more desired to come to blows with the republican government. Seemingly egged on by Schleicher and other ultra-conservative elements within the coalition, the military has protested vehemently against our collaboration with the social democrats, claiming that the SPD have somehow betrayed Germany or are crypto-bolsheviks who will attempt to subjugate us to Moscow.\n\nDespite the rather ridiculous nature of these claims, it has certainly revealed the true colours of the Reichswehr, that being red-white-black. As such, we must decide whether we should attempt to compromise with them or if we should simply wait for them to give up - surely they would not attempt to do something profoundly stupid?
 rhein.republic.8.a: "Мы можем их переждать." # We can wait them out.
 rhein.republic.8.b: "Давайте бросим им кость." # Let’s throw them a bone.
 rhein.republic.8.c: "Возможно, СДПГ — не самые подходящие партнеры..." # Maybe the SPD are not the most suitable partners...

 rhein.republic.9.t: "Пустая угроза?" # A Hollow Threat?
 rhein.republic.9.d: "К сожалению, похоже, что офицеры рейхсвера, выступающие против нашей новой позиции по отношению к товарищеским демократическим партиям, не могли вынести одной лишь мысли о сотрудничестве с социал-демократами. Объявив нас неспособными управлять республикой из-за нашего желания работать с социал-демократами, они пригрозили уйти в отставку, если мы не прекратим никаких попыток работать с СДПГ.\n\nТакая угроза, естественно, взбудоражила многих в совете, особенно из-за их намеков на предпочтительность национально-либерального кабинета под руководством ДВП, который, по-видимому, обещал работать со Шлейхером и другими элементами рейхсвера для «восстановления» республики. Хотя некоторые предлагали нам просто позволить им уйти в отставку, другие возражали, что мы не можем позволить этим опытным офицерам просто покинуть нас и что это поставит под угрозу все республиканское дело. К счастью, некоторые офицеры рейхсвера проявили готовность помочь нам договориться с офицерами о компромиссе, что, возможно, было бы нашим лучшим шансом предотвратить дальнейший кризис." # Rather unfortunately, it seems that the Reichswehr officers who oppose our new stance towards fellow democratic parties could not handle the mere thought of working with the social democrats. Declaring us incapable of running the republic due to our desire to work with the social democrats, they have threatened to resign unless we withdraw any attempts to work with the SPD.\n\nSuch a threat has naturally brought many in the council up in arms, most especially because of their hinting at the preferability of a national liberal cabinet run by the DVP who have seemingly promised to work with Schleicher and other Reichswehr elements to \"restore\" the republic. Although some have suggested for us to simply let them resign, others have retorted that we cannot allow these experienced officers to simply leave us and that it would risk the entire republican cause to do so. Thankfully, some Reichswehr officers have shown a willingness to help us negotiate a compromise with the officers, something that would perhaps be our best shot at preventing any further crisis.
 rhein.republic.9.d.feds: "К сожалению, похоже, что офицеры рейхсвера, выступающие против нашей новой позиции по отношению к товарищеским демократическим партиям, не могли вынести одной лишь мысли о сотрудничестве с социал-демократами. Заявив, что мы неспособны управлять республикой из-за нашего желания работать с социал-демократами, они пригрозили уйти в отставку, если мы не прекратим никаких попыток работать с СДПГ.\n\nДортен воспользовался этой возможностью, заявив, что рейхсвер прав в своих оценках и, таким образом, их угроза является признаком того, что сотрудничество с социал-демократами совершенно немыслимо. Этот ироничный поворот событий поставил правительство в неудачное положение, поскольку уступка рейхсверу была бы несомненной демонстрацией слабости. С другой стороны, маловероятно, что военные выступят против нас, по крайней мере на данный момент.\n\nОднако есть и другой путь, поскольку некоторые офицеры рейхсвера продемонстрировали готовность пойти на компромисс в обмен на благосклонность к военным. Учитывая, что война на горизонте, разве это приемлемо?" # Rather unfortunately, it seems that the Reichswehr officers who oppose our new stance towards fellow democratic parties could not handle the mere thought of working with the social democrats. Declaring us incapable of running the republic due to our desire to work with the social democrats, they have threatened to resign unless we withdraw any attempts to work with the SPD.\n\nDorten has seized this opportunity, declaring that the Reichswehr are correct in their assessment and thus that their threat is a sign that cooperation with the social democrats is utterly inconceivable. This ironic turn of events has pressured the government into an unfortunate position, for conceding to the Reichswehr would be an undeniable show of weakness. On the other hand, it's highly unlikely that the military will act against us at least for the moment.\n\nThere is also however another road, for some Reichswehr officers have displayed a willingness to compromise in return for a favour to the military. With war on the horizon, surely that is acceptable?
 rhein.republic.9.a: "Мы не можем рисковать безопасностью республики." # We can’t risk the republic’s safety.
 rhein.republic.9.b: "Позвоните в пользу." # Call in favours.
 rhein.republic.9.c: "Они имеют право уйти в отставку!" # They are free to resign!

 rhein.republic.10.t: "Офицеры успокоились" # The Officers Calm Down
 rhein.republic.10.d: "Похоже, что благодаря нашей прошлой политике офицеры рейхсвера перестали суетиться по поводу нашей коалиции с социал-демократами. Хотя их истинная преданность все еще вызывает сомнения, мы можем вздохнуть спокойно, зная, что, по крайней мере на данный момент, безопасность республики не была скомпрометирована." # It seems that due to our past policies, the Reichswehr officers have stopped fussing over our coalition with the social democrats. Although their true alleigances are still in doubt, we can breathe easy knowing that at least for now, the republic’s security has not been compromised.
 rhein.republic.10.a: "Отличный!" # Excellent!
  
 rhein.republic.11.t: "Уступки офицерам" # Concessions to the Officers
 rhein.republic.11.d: "Хотя образ прусского офицера может представлять собой образ солдата, который легко может работать со своими однополчанами, в нынешнем кризисе это не проявило себя в полной мере. Многие офицеры желают разного, и это в наших интересах. Мы можем обещать многое, но для многих наиболее заманчивым будет запрет на пост каких-либо министров-социал-демократов. Хотя это не будет хорошо воспринято социал-демократами после их присоединения, это, по крайней мере, на начальном этапе принесет нам большую выгоду при небольших затратах. Другой альтернативой было бы предложить им более жесткое и более единое правительство, которое было бы готово тратить больше средств на их предприятия. Конечно, мы могли бы просто позволить им жаловаться, но вряд ли это каким-то образом решит кризис." # Although the image of the Prussian officer may be one of a soldier who is easily able to work with his fellow soldiers, this has not demonstrated itself totally in the current crisis. Many officers desire different things and it is so to our advantage. We can promise many things, but the most alluring to many would be the barring of any social democrat ministers. Although this would not be received well by the social democrats once they join, it would at least initially grant us plenty of gain for little cost. Another alternative would be to offer them a tougher, more united government that would be willing to spend more on their ventures. Of course, we could simply just let them complain, though this is unlikely to solve the crisis in any way.
 rhein.republic.11.a: "Они могут быть уверены, что министров-социалистов не будет." # They can be assured there will be no socialist ministers.
 rhein.republic.11.b: "Подкуп их окажется наиболее ценным." # Bribing them will prove most valuable.
 rhein.republic.11.c: "Заверьте их, что мы будем избегать сотрудничества с предателями." # Assure them that we will avoid working with traitors.
 rhein.republic.11.e: "Забудь это." # Forget it.
  
 rhein.republic.12.t: "Судьба Совета" # The Council’s Fate
 rhein.republic.12.d: "Наша уступка изгнанникам рейхсвера уже поставила под угрозу стабильность первого кабинета министров возрожденной республики. Жалуясь на нежелание обеспечить гражданский контроль над временным рейхсвером, левые либералы и прогрессивные центристы в совете пригрозили расколом, поскольку Вирт обнаруживает, что его положение в совете все больше подвергается опасности. Независимо от причины их уступки, многие утратили доверие к нынешнему совету, возглавляемому Центрумом, который сможет продолжать управлять временной республикой.\n\nИз-за этого некоторые крайне правые политики, особенно Шлейхер, предложили Эдуарду Дингельдею взять на себя бразды правления в качестве главы совета. Национал-либерал, не испытывающий никаких сомнений в отношении авторитарных амбиций Шлейхера, Дингельдей заявил о своей готовности занять место Вирта во главе совета - наряду с последующим захватом совета правыми." # Our concession to the Reichswehr exiles has already threatened the stability of the first cabinet in the revived republic. Complaining about unwillingness to enforce civilian control on the provisional Reichswehr, the left-liberals and progressive centrists in the council have threatened to split as Wirth finds his position in the council ever more in peril. No matter the reason for their concession, many have lost confidence in the current Zentrum-led council to continue running the provisional republic.\n\nOut of this, some far-right politicians and especially Schleicher have suggested Eduard Dingeldey to take the reigns as head of the council. A national liberal with few qualms towards Schleicher’s authoritarian ambitions, Dingeldey has indicated his willingness to take Wirth’s place at the head of the council - along with the ensuing right-wing takeover of the council.
 rhein.republic.12.a: "Мы можем продолжать без криптобольшевиков." # We can continue without crypto-bolsheviks.
 rhein.republic.12.b: "Возможно, что-то более предпочтительное оправдано..." # Maybe something more preferable is warranted...

 rhein.republic.13.t: "Размещение социал-демократов" # Placing the Social Democrats
 rhein.republic.13.d: "Поскольку социал-демократы вошли в коалицию, пришло время решить, как мы будем действовать с ними в правительстве. Являясь одной из крупнейших партий в коалиции, социал-демократы потребовали предоставить им важные посты, соответствующие их популярности и влиянию.\n\nКлючевой член социал-демократов в изгнании, Рудольф Гильфердинг был предложен в качестве нового рейхсвиртшафтсминистра. Однако это встретило немедленное сопротивление со стороны либералов в коалиции, особенно тех, кто сосредоточился вокруг Отто Гюго в ДВП и ненавидит социалиста Гильфердинга.\n\nДругие высказались о предоставлении Пауля Герлаха, давнего социал-демократа в мандате, который оказался стойким противником валькизма и как популярный местный социал-демократ в Рейнской области. Хотя это в конечном итоге отодвинуло бы социал-демократов на второстепенную позицию в борьбе с демократией, некоторые подчеркивают, что мы отдаем им должное даже за то, что рассматриваем их кандидатуры на должность в правительстве." # With the social democrats in the coalition, the time has now come to decide how we shall proceed with them in government. As one of the largest parties in the coalition, the social democrats have demanded that they be granted important posts, relative to their popularity and influence.\n\nA key member of the social democrats in exile, Rudolf Hilferding has been floated as becoming the new Reichswirtschaftsminister. However, this has been met with immediate opposition from the liberals in the coalition, especially those concentrated around Otto Hugo in the DVP who detest the socialist Hilferding.\n\nOthers have floated granting Paul Gerlach, a long-time social democrat in the mandate who proved staunchly opposed to Valkism and as a popular local social democrat in the Rhineland. Even though this would ultimately relegate the social democrats to a secondary position in the fight against democracy, some emphasize the credit that we are granting them for even considering them for a position in the government.
 rhein.republic.13.a: "Умиротворите их экономикой." # Appease them with the economy.
 rhein.republic.13.b: "Им лучше защищать демократию." # They’re better off defending democracy.
 rhein.republic.13.c: "Им нет места в правительстве." # They have no place in government.
  
 rhein.republic.14.t: "Переговоры с Францией" # Negotiations with France
 rhein.republic.14.d: "Сегодня наши лучшие дипломаты направились в Париж, чтобы встретиться там с французами, чтобы обеспечить защиту временного правительства до тех пор, пока Берлин не будет разгромлен. Хотя они могущественны и очень заинтересованы в обеспечении безопасности стратегической Рейнской области, Франция не выразила особого сочувствия нашему делу, и мы, возможно, не сможем добиться от них каких-либо условий." # Today, our finest diplomats have been headed towards Paris, there to meet with the French to ensure the provisional government’s protection until Berlin is crushed. Although they are powerful and they have great interest in ensuring the safety of the strategic Rhineland, France has not expressed much sympathy for our cause and we may be unable to extract any terms from them.
 rhein.republic.14.a: "Лучше бы все прошло хорошо..." # This better go well...
  
 rhein.republic.15.t: "Возвращение республиканцев" # The Return of the Republicans
 rhein.republic.15.d: "Похоже, что, несмотря на наши первоначальные опасения, Рейнское государство еще не развалилось, а его делегаты прибыли сегодня в Париж, чтобы просить союза против Берлина. Несмотря на то, что это будет дипломатический переворот в борьбе против Берлина, некоторые националисты возражают, что они просто будут использовать нас, чтобы разбить Берлин, после чего они снова развернутся и начнут противодействовать нам - или, что еще хуже, обратятся к большевизму." # It seems that despite our initial fears, the Rhenish state has not yet collapsed, with their delegates having arrived in Paris today to request an alliance against Berlin. Even though this will be a diplomatic coup in the fight against Berlin, some nationalists have countered that they will simply use us to beat Berlin after which they will turn around and antagonize us once more - or worse, turn towards Bolshevism.
 rhein.republic.15.a: "Давайте защитим Европу вместе!" # Let’s defend Europe together!
 rhein.republic.15.b: "Нам нужно больше причин, чтобы впустить их." # We need more reason to let them in.
 rhein.republic.15.c: "Абсурдное предложение." # An absurd proposal.

 rhein.republic.16.t: "Альянс против Берлина" # Alliance against Berlin
 rhein.republic.16.d: "[FROM.GetName] разумно принял наше вступление в [FROM.GetFactionName], чтобы мы могли вместе сражаться против Германии. Отныне мы сможем рассчитывать на то, что величайшая республика Европы сможет противостоять и в конечном итоге свергнуть валкистский террор в Германии." # [FROM.GetName] has seen reason, accepting our entry into the [FROM.GetFactionName] so that we may fight together against Germany. From now on, we will be able to count on Europe’s greatest republic to resist and eventually overturn Valkist terror in Germany.
 rhein.republic.16.a: "Мы стоим на переднем крае демократии!" # We stand as the frontier of democracy!
  
 rhein.republic.17.t: "[FROM.GetName] требует уступок" # [FROM.GetName] Demands Concessions
 rhein.republic.17.d: "Хотя [FROM.GetName] не отклонил нашу просьбу о вступлении в альянс, они потребовали от нас уступок, чтобы погасить то, что, по их мнению, они по праву должны из-за первой войны и их беспорядочного ухода. Хотя это не будет непомерной ценой за защиту от Германии, некоторые говорят, что это ослабит национальный характер нашего правительства." # Although [FROM.GetName] has not turned down our request to join in an alliance, they have demanded concessions from us to repay what they see as rightfully owed to them due to the first war and their messy withdrawal. Whilst this would not be an exorbitant price to pay for protection against Germany, some say that this will dilute the national character of our government.
 rhein.republic.17.a: "Отлично." # Fine.
 rhein.republic.17.b: "Никогда!" # Never!
  
 rhein.republic.18.t: "Отказ Кобленца" # Koblenz’s Refusal
 rhein.republic.18.d: "К сожалению, похоже, что Кобленц отказался от идеи присоединения к нашему альянсу любой ценой. Несмотря на то, что некоторые националисты приняли это и призвали подготовиться к созданию Германии с Рейном, многие на набережной Орсе опасаются перспективы Германии, обладающей огромными полномочиями - Германии, которая желает тотальной мести Франции.\n\nТаким образом, некоторые призывают нас в любом случае впустить Рейнов, на случай, если Берлин попытается посягнуть на суверенитет Рейна. Другие, однако, возражали, что Рейнцы в любом случае слишком ненадежны, особенно с учетом их статуса конкурирующего правительства." # Rather unfortunately, it seems that Koblenz has refused the notion of joining our alliance at any cost. Even though some nationalists have accepted this and have called for preparing ourselves for a Germany with the Rhine, many in Quai d'Orsay are fearful of the prospect of a greatly empowered Germany - a Germany that desires total revenge upon France.\n\nAs such, some have called for us to let the Rhenish in anyways, just in case Berlin attempts to infringe upon Rhenish sovereignty. Others have countered however that the Rhenish are simply too untrustworthy anyways, especially with their status as a rival government.
 rhein.republic.18.a: "В любом случае, они никогда не вызывали особого доверия..." # They were never very trustworthy anyways...
 rhein.republic.18.b: "Мы не можем оставить Рейн на произвол судьбы!" # We cannot leave the Rhine to its fate!
  
 rhein.republic.19.t: "[FROM.GetName] отказывается!" # [FROM.GetName] refuses!
 rhein.republic.19.d: "К сожалению, похоже, что [FROM.GetName] отклонил нашу просьбу о вступлении в их альянс, а их дипломаты в частном порядке заявили о своих сомнениях в нашем успехе. Даже если это пренебрежение не будет забыто, у нас мало вариантов, так что же нам делать?" # Sadly, it seems that [FROM.GetName] has rejected our request to join their alliance, with their diplomats in private stating their doubtfulness of our success. Even though this slight will not be forgotten, we have few options, so what shall we do?
 rhein.republic.19.a: "Тогда мы остаемся одни." # We stand alone then.
 rhein.republic.19.b: "Возможно, Лондон сможет защитить нас?" # Perhaps London can protect us?
 rhein.republic.19.c: "Рим — наш единственный выбор." # Rome is our only choice.
  
 rhein.republic.20.t: "Рейнский союзник?" # A Rhenish Ally?
 rhein.republic.20.d: "Не имея возможности обратиться к Франции, кажется, что [FROM.GetName] попросил присоединиться к нашему альянсу, чтобы противостоять немецкому экспансионизму. Хотя это было бы большим благом для предотвращения дальнейшего расширения Берлина без сопротивления, это было бы потенциально опасно втягивать нас в войну против Германии - особенно учитывая враждебный характер отношений между Берлином и Кобленцем." # Unable to turn to France, it seems that [FROM.GetName] has requested to join our alliance so as to resist German expansionism. Even though this would be a great boon towards preventing Berlin from expanding any further without resistance, it would be potentially dangerous in dragging us into a war against Germany - most especially considering the hostile nature of relations between Berlin and Koblenz.
 rhein.republic.20.a: "Нам нужно сдержать Германию." # We need to contain Germany.
 rhein.republic.20.b: "Это розыгрыш или что-то в этом роде?" # Is this a practical joke or something?
  
 rhein.republic.21.t: "[FROM.GetName] принимает!" # [FROM.GetName] accepts!
 rhein.republic.21.d: "В отличие от французов, [FROM.GetName], похоже, лучше понимает наше тяжелое положение. Сегодня дипломаты из [FROM.GetName] и нашего правительства встретились, чтобы обсудить детали союза между нашими странами, и многие празднуют это как победу мира и демократии." # Unlike the French, it appears that [FROM.GetName] has been more understanding of our plight. Today, diplomats from [FROM.GetName] and our government have met to hammer out the details of an alliance between our nations, with many celebrating this as a victory for peace and democracy.
 rhein.republic.21.a: "Отличный!" # Excellent!
  
 rhein.republic.22.t: "Рейнское предательство" # The Rhenish Betrayal
 rhein.republic.22.d: "Когда мы и наши бывшие союзники учредили мандат, это было при том понимании, что Рейнская область в свое время будет передана нам в качестве доминиона или территории. Мы пролили кровь за Антанту в Великой войне, чтобы остановить империалистические амбиции кайзера, и нам по праву принадлежала Рейнская область. Как всегда хитрые, Вашингтон и Лондон имели другие планы, стремясь помешать нам реализовать то, что они ошибочно считали наполеоновскими амбициями.\n\nНаши худшие опасения теперь оправдались. Поскольку рейнцы совершили серьезную ошибку, воспользовавшись неудачами мертвой республики, они решили вместо этого присоединиться к [RHI.GetFactionName] в катастрофической попытке самозащиты. Хуже всего то, что это серьезно скомпрометировало наши планы на вторую войну с Германией. Теперь, когда они стоят в одиночестве между нами и Рейхом, Рейнское государство наверняка обречено, и немцы сделают все возможное, чтобы перенести боевые действия на территорию, где сейчас находится несчастное правительство Кобленца. В любом случае, это стало катастрофой для наших стратегических перспектив." # When we and our former allies instated the mandate, it was with the understanding that the Rhineland would in due time be granted to us, as dominion or as territory. We bled for the Entente in the Great War to stop the Kaiser’s imperialistic ambitions, and we were rightfully owed the Rhineland. Crafty as ever, Washington and London had other plans, seeking to prevent us from what they mistakenly saw as Napoleonic ambitions.\n\nOur worst fears have now come to be. With the Rhenish making a grave mistake in going with the failures from the dead republic, they have opted to instead join the [RHI.GetFactionName] in a disastrous bid for self-protection. Worst of all, this has severely compromised our plans for a second war with Germany. Now that they stand alone between us and the Reich, the Rhenish state is most certainly doomed, and the Germans will do all that they can to place the fighting within the area where the wretched Koblenz government now lies. Either way, this has been a disaster for our strategic prospects.
 rhein.republic.22.a: "Все наши планы..." # All of our plans...
  
 rhein.republic.23.t: "Ось Кобленц-Вена" # The Koblenz-Vienna Axis
 rhein.republic.23.d: "Поскольку угроза войны становится все более близкой, мы должны сделать все, чтобы защитить наше государство от Германии. Рейнская область, несмотря на высокую степень нестабильности и пангерманизма, имеет потенциал стать авангардом в войне против Германии, привлекая внимание со стороны Альп. Сопротивляемся вместе немецкой угрозе, как братья. Незаконченная революция 1848 года получит шанс отомстить раз и навсегда." # With the threat of war becoming more close, we must do everything to defend our state from Germany. The Rhineland, whilst having a great degree of instability and pan-Germanism, has the potential to serve as the vanguard in the war against Germany, drawing attention from the Alps. Resisting together against the German menace, as brothers. The revolution of 1848, unfinished, will have its chance to be avenged, once and for all.
 rhein.republic.23.a: "Мы вместе дадим отпор Германии!" # We will resist Germany together!
 rhein.republic.23.b: "Мы не можем надеяться вместе противостоять Германии." # We cannot hope to resist Germany together.
  
 rhein.republic.24.t: "Австрийская глупость" # Austrian Folly
 rhein.republic.24.d: "При очень печальном повороте событий Вена отклонила нашу просьбу о союзе. Хотя они ссылаются на такие причины, как безнадежность нашего сопротивления Германии в одиночку и идеологические разногласия, они, похоже, скрывают настоящую причину - их собственную проклятую гордость." # In a truly sad turn of events, Vienna has refused our request for an alliance. Whilst they cite reasons such as the hopelessness of us resisting Germany alone and ideological differences, these seem to mask the real reason - their own cursed pride.
 rhein.republic.24.a: "Тревожно." # Worrying.
  
 rhein.republic.25.t: "Союз свободных рабочих" # The Free Workers’ Union
 rhein.republic.25.d: "Кажется, что в нашем стремлении обеспечить лояльность профсоюзов FAUR остался таким же упрямым, как и прежде. Остатки несостоявшегося Союза свободных рабочих Германии, FAUR, влачат довольно жалкое существование в ныне бывшем мандате. Из-за своей ограниченной популярности среди рабочих в промышленном бассейне Рейнской области, FAUR изо всех сил пытался подняться на ноги, и для многих это казалось просто еще одним социалистическим движением, которое нужно раздавить.\n\nОднако, учитывая усилия по обеспечению лояльности профсоюзов, многие опасаются, что это приведет к значительному увеличению влияния FAUR как основного профсоюза, выступающего против сотрудничества с правительством. Таким образом, многие готовы уничтожить этого вредителя раз и навсегда." # In our quest to ensure the loyalty of the trade unions, it seems that the FAUR has remained as obstinate as ever. The remnants of the failed Free Worker’s Union of Germany, the FAUR has lived a rather miserable existence in the now-former mandate. With their limited popularity amongst the workers in the industrial basin of the Rhineland, the FAUR has struggled to get off the ground and for many seemed like just another socialist movement to crush.\n\nWith the effort towards the loyalty of the trade unions however, many have feared that this will result in a massive increase in FAUR influence as the primary trade union opposed to cooperation with the government. As such, many are prepared to crush this pest once and for all.
 rhein.republic.25.a: "Они еще долго не будут бесплатными!" # They will not be free for much longer!
 rhein.republic.25.b: "Подобные разговоры разделяют нас." # This kind of talk divides us.

 rhein.republic.26.t: "Конец Союза свободных рабочих" # The End of the Free Workers’ Union
 rhein.republic.26.d: "С запретом FAUR профсоюзы, выступающие против истеблишмента, были полностью и по-настоящему разгромлены. После того, как их лидеры были арестованы, а их организационные центры подвергнуты набегам и конфискованы, кажется, что анархо-синдикализм в Германии был полностью и по-настоящему разгромлен.\n\nВместо этого левая тенденция в социал-демократах стала главным защитником социализма за пределами радикальных коммунистов, хотя они все еще оказываются слишком маленькими и слишком умеренными, чтобы социализм в Германии не нанес массированный удар." # With the banning of the FAUR, the anti-establishment unions have been well and truly crushed. With their leaders arrested and their organizational centres raided and impounded, it seems that anarcho-syndicalism in Germany has been well and truly crushed.\n\nIn its stead, the leftist tendency in the Social Democrats have become the main champion for socialism outside of the radical Communists, though they still prove too small and too moderate for socialism in Germany to have not taken a massive blow.
 rhein.republic.26.a: "Там, где им место – на свалке истории." # Into where they belong - the dustbin of history.
  
 rhein.republic.27.t: "Разочарование в армии" # Disappointment in the Military
 rhein.republic.27.d: "Исторически являясь консервативным бастионом республиканского правительства, Рейхсвер оправдал эту репутацию, поскольку антиреспубликанские высказывания и настроения в Рейхсвере, по-видимому, резко возросли. В результате нашей неспособности выполнить данные им обещания многие жалуются на продолжающуюся потерю поддержки.\n\nДаже если это не окажется смертельным для стабильности правительства, это, несомненно, станет огромным ударом по нашим попыткам заслужить расположение этой клики реакционеров и изменить наш имидж с одного из предательских лжецов." # Historically a conservative bastion in the republican government, the Reichswehr have lived up to this reputation as anti-republican remarks and sentiments in the Reichswehr have seemingly increased drastically. A result of our inability to fufill our promises to them, many lament our continued loss of support.\n\nEven though this will not prove deadly to the government’s stability, it is no doubt a huge blow to our attempt to curry favour from this clique of reactionaries and change our image from one of backstabbing liars.
 rhein.republic.27.a: "Проклятые реакционеры!" # Damnable reactionaries!

 rhein.republic.28.t: "Курт фон Шлейхер уходит в отставку" # Kurt von Schleicher Retires
 rhein.republic.28.d: "Что можно сказать о Курте фон Шлейхере?\n\nОт простого офицера кайзеровской армии до самого влиятельного офицера старой республики Курт фон Шлейхер оставался в Веймарской республике гораздо дольше, чем многие ожидали. Хотя Шлейхер лично выступал против республиканского правительства и был прагматичным предателем, естественным местом обитания которого был Берлин, тем не менее он многое сделал для временного мира Бендлерблока с правительством - вплоть до катастрофы 1932 года.\n\nНо даже в 1932 году Шлейхер не дрогнул. Когда к власти пришел Дресслер и потребовал от Шлейхера расплаты за свои преступления, «красный генерал» бежал в Рейнскую область вместе со своими соотечественниками. Вскоре Шлейхер снова наладит все возможные связи и поддержку в мандате, хотя это далось нелегко из-за репрессий мандата и общего отсутствия легитимности после фиаско 1932 года.\n\nОщущая себя все более отстраненным и неуместным, а затем хронически плохое здоровье, Шлейхер теперь решил уйти в отставку. Пока одни празднуют, а другие оплакивают уход Шлейхера с политической сцены, нет никаких сомнений в том, что Шлейхер изменил лицо республики...\n\nК лучшему или к худшему." # What is there to say about Kurt von Schleicher?\n\nFrom a mere officer of the Kaiser’s army to the most influential officer in the old republic, Kurt von Schleicher has remained with the Weimar republic for much longer than many anticipated. Although personally opposed to the republican government and a pragmatic backstabber whose natural habitat was in Berlin, Schleicher nevertheless did much to contribute to the Bendlerblock’s temporary peace with the government - right up until the disaster of 1932.\n\nBut even in 1932, Schleicher did not waver. When Dressler came to power and demanded that Schleicher pay for his crimes, the "Red General" fled to the Rhineland along with his compatriots. Soon, Schleicher would again build up whatever connections and support he could in the mandate, though this did not come easy with mandate crackdowns and a general lack of legitimacy following the debacle of 1932.\n\nFinding himself increasingly sidelined and irrelevant, followed by chronically poor health, Schleicher has now opted to retire. As some celebrate and others mourn the departure of Schleicher from the political scene, there is little doubt that Schleicher has changed the face of the republic...\n\nFor better or for worse.
 rhein.republic.28.d_schleiching: "Что можно сказать о Курте фон Шлейхере?\n\nОт простого офицера кайзеровской армии до самого влиятельного офицера старой республики Курт фон Шлейхер оставался в Веймарской республике гораздо дольше, чем многие ожидали. Хотя Шлейхер лично выступал против республиканского правительства и был прагматичным предателем, естественным местом обитания которого был Берлин, тем не менее он многое сделал для временного мира Бендлерблока с правительством - вплоть до катастрофы 1932 года.\n\nНо даже в 1932 году Шлейхер не дрогнул. Когда к власти пришел Дресслер и потребовал от Шлейхера расплаты за свои преступления, «красный генерал» бежал в Рейнскую область вместе со своими соотечественниками. Вскоре Шлейхер снова наладит все возможные связи и поддержку в мандате, хотя это далось нелегко из-за репрессий против мандата и общего отсутствия легитимности после фиаско 1932 года.\n\nОднако в результате рокового поворота событий Шлейхер вскоре снова оказался у власти. При поддержке своих союзников Шлейхер вскоре искупил свою вину, раз и навсегда победив угрозу валкистов. Тем не менее, стресс войны и хронически плохое здоровье настигли его. Официально заявив, что его миссия будет достигнута, Шлейхер решил уйти в отставку. Поскольку большинство, за исключением нескольких радикалов, поздравляют Шлейхера несколькими скорбными заявлениями, нет никаких сомнений в том, что Шлейхер навсегда изменил лицо Германии...\n\nВ лучшую или худшую сторону." # What is there to say about Kurt von Schleicher?\n\nFrom a mere officer of the Kaiser’s army to the most influential officer in the old republic, Kurt von Schleicher has remained with the Weimar republic for much longer than many anticipated. Although personally opposed to the republican government and a pragmatic backstabber whose natural habitat was in Berlin, Schleicher nevertheless did much to contribute to the Bendlerblock’s temporary peace with the government - right up until the disaster of 1932.\n\nBut even in 1932, Schleicher did not waver. When Dressler came to power and demanded that Schleicher pay for his crimes, the "Red General" fled to the Rhineland along with his compatriots. Soon, Schleicher would again build up whatever connections and support he could in the mandate, though this did not come easy with mandate crackdowns and a general lack of legitimacy following the debacle of 1932.\n\nIn a fateful turn of events however, Schleicher would soon find himself back in power. With the support of his allies, Schleicher would soon redeem himself by vanquishing the Valkist threat once and for all. Nevertheless, the stress of war and his chronically poor health has now caught up with him. Officially stating his mission to be achieved, Schleicher has now opted to retire. As most beyond a few radicals congratulate Schleicher with a few mournful statements, there is little doubt that Schleicher has changed the face of Germany forever...\n\nFor better or for worse.
 rhein.republic.28.a: "До свидания..." # Goodbye...
 rhein_republic_schleicher_bredow: "§PВ качестве доверенного лица Фердинанд фон Бредов теперь временно возьмет на себя бразды правления государством, пока не будет выяснено будущее Германии§!" # §PAs his trusted lieutenant, Ferdinand von Bredow shall now temporarily take the reigns of state until Germany's future has been ascertained§!
 rhein_republic_schleicher_goerdeler: "§gКак близкий политический союзник Карл Фридрих Герделер теперь временно возьмет на себя роль канцлера, пока не будет выяснено будущее Германии§!" # §gAs a close political ally, Carl Friedrich Goerdeler will now temporarily take the role of chancellor until Germany's future has been ascertained§!
  
 rhein.republic.29.t: "Вопрос о президентстве" # The Question of the Presidency
 rhein.republic.29_schleicher_overthrown: "Несмотря на его коварные махинации, республика стойко противостояла амбициям фон Шлейхера, и теперь он ушел. Вместо него обновленный республиканский совет теперь должен решить, восстанавливать или нет старое президентство на данном этапе.\n\nНекоторые говорят, что такой шаг окажется полезным для демонстрации того, что мы являемся законным правительством в Германии. Однако на данный момент многие боятся предоставлять кому-либо власть рейхспрезидента - чтобы не испытать еще одного Шлейхера." # Despite his devious machinations, the republic has stood fast against the ambitions of von Schleicher and now he has departed. In his stead, the renewed republican council now has to decide whether or not to restore the old presidency at this current juncture.\n\nSome say that such a move would prove instrumental to demonstrating ourselves as the legitimate government in Germany. However, many are afraid of granting anyone the power of the Reichspräsident at this point in time - lest we experience another Schleicher.
 rhein.republic.29_normal: "Благодаря поддержке совета многие теперь уверены, что республиканское правительство закрепилось в Кобленце. Теперь совет должен решить, восстанавливать или нет старое президентство на данном этапе.\n\nНекоторые говорят, что такой шаг окажется полезным для демонстрации того, что мы являемся законным правительством в Германии. Поскольку Маркс зарекомендовал себя как демократический бастион, многие уверены, что рейхспрезидент окажется стойким защитником демократии. Однако такой шаг может оказаться контрпродуктивным для нашего желания восстановить республику и немецкую демократию. Восстановление такого мощного положения сейчас может вызвать дальнейший раскол и дать радикалам шанс обречь республику на гибель. Так что же это будет?" # With the council having been bolstered, many are now certain that the republican government has entrenched itself in Koblenz. Now, the council has to decide whether or not to restore the old presidency at this current juncture.\n\nSome say that such a move would prove instrumental to demonstrating ourselves as the legitimate government in Germany. With Marx having proven himself as a democratic bastion, many are confident that the Reichspräsident will prove to be a staunch defender of democracy. However, such a move may prove counterproductive to our desire to restore the republic and German democracy. Restoring such a powerful position now may cause further division and provide the chance for radicals to doom the republic. So what shall it be?
 rhein.republic.29.a: "Мы законное правительство, так давайте докажем это." # We are the rightful government, so let’s prove it.
 rhein.republic.29.b: "Сейчас не оптимальное время." # Now is not the optimal time.
  
 rhein.republic.30.t: "Следующий рейхспрезидент" # The Next Reichspräsident
 rhein.republic.30.d: "После восстановления должности президента республика теперь должна решить, кто возьмет на себя роль следующего президента республики. Такая роль обладает огромной силой и, в свою очередь, порождает большую ответственность. Поскольку бывший президент Маркс отказался вернуть себе пост президента, теперь мы должны решить, кто возьмет на себя роль следующего президента.\n\nОдним из предложенных вариантов является Карл Жаррес, занявший второе место. баллотируясь в 1925 году в качестве кандидата правых на пост президента, Жаррес обеспечит большую легитимность, поскольку сам Жаррес будет популярен среди рейнских городов. Однако некоторые опасаются, что он слишком правый для такого титула, особенно с учетом радикального характера того, против кого мы выступаем. Многие в Zentrum предложили Карла Шпикера, бывшего руководителя прессы и плодовитого редактора и издателя. Как более прогрессивный член «Центрума», многие считают, что Шпайкер окажется более подходящим президентом в борьбе с валкизмом, особенно с учетом его антивалкистского послужного списка.\n\nОднако, поскольку «Центрум» выдвинул кандидата, демократам и социал-демократам не удалось превзойти. Они выдвинули собственных кандидатов, причем демократы поддержали Хартмана фон Рихтгофена, бывшего банкира и стойкого либерального республиканца с хорошими связями. Тем временем социал-демократы поддерживают Вильгельма Зольмана, социал-демократа с долгим опытом работы в ныне бывшем мандате. Учитывая, что так много фигур готовы принять вызов, теперь остается только посмотреть, кто возьмет на себя эту ключевую роль." # With the restoration of the position of president, the republic must now decide who shall take the role as the next president of the republic. Such a role is one of great power, begetting great responsibility in turn. With former president Marx having declined to take back the post of president, we must now decide who shall take the role of the next president.\n\nOne option that has been floated is the presidential runner-up Karl Jarres. Running in 1925 as the right’s choice for president, Jarres will provide much legitimacy with Jarres himself being popular amongst the Rhenish cities. However, some fear that he is simply too right wing for such a title, most especially with the radical nature of who we are opposing. Many in Zentrum have suggested Carl Spiecker, a former press chief and prolific editor and publisher. As a more progressive member of Zentrum, many feel that Speicker will prove to be a more appropriate president in the struggle against Valkism - especially with Speicker’s antivalkist track record.\n\nWith Zentrum having proposed a candidate however, the Democrats and Social Democrats could not be outdone. They have proposed candidates of their own, with the Democrats supporting Hartmann von Richthofen, a former banker and a well-connected and staunch liberal republican. The Social Democrats meanwhile back Wilhelm Sollmann, a social democrat with a long history in the now-former mandate. With so many figures ready to step up to the challenge, now it only remains to see who shall take this key role.
 rhein.republic.30.a: "Карл Жаррес – опытный руководитель!" # Karl Jarres - a seasoned executive!
 rhein.republic.30.b: "Карл Шпикер – борец с антивалкистами!" # Carl Spiecker - an antivalkist fighter!
 rhein.republic.30.c: "Гартман фон Рихтгофен – настоящий республиканец!" # Hartmann von Richthofen - a true republican!
 rhein.republic.30.e: "Вильгельм Зольман – доблестный демократ!" # Wilhelm Sollmann - a valiant democrat!
  
 rhein.republic.31.t: "Укрепление нашей позиции" # Consolidating our Hold
 rhein.republic.31.d: "Когда мы приступили к восстановлению позиции президента в правительстве, многие задавались вопросом, что будет делать печально известный амбициозный Шлейхер с такой влиятельной должностью. Исторически сложилось так, что Шлейхер ограничивал свои хитрые дела политическими закулисами, и следовало ожидать, что сам Шлейхер не пожелает занять президентский пост.\n\nФактически, Шлейхер до сих пор не смог выдвинуть на пост президента кого-либо, кто одновременно облегчил бы жизнь многим демократам, а также работал бы и сотрудничал с группой Шлейхера. Такая реальность во многом обусловлена ​​тем, что Республиканский совет решил остаться в качестве сдерживать известные амбиции Шлейхера. Препятствуя консолидации его власти на каждом шагу, нет никаких сомнений в том, что республиканский совет препятствовал работе по восстановлению республики и поэтому с этим необходимо разобраться.\n\nНо как? Некоторые предполагают, что в качестве канцлера и избранного канцлера рейхсвера Шлейхер может просто вытеснить нынешнего главу совета, прогрессивного Йозефа Вирта, и стать главой республиканского совета. Это, безусловно, предоставило бы Шлейхеру сверх меры полномочия, но это быстро разозлило бы демократов, которые сочли бы это очевидным захватом власти.\n\nТак может быть, неизвестность была бы полезна? Известный восточнопрусский деятель Хорст фон Ресторф бежал в бывший мандат в 1933 году, спасаясь от революционного гнева, который Дресслер обрушил на всю Германию. Оставаясь в безвестности, его прежние связи с националистами и кажущаяся нормальность сделали его в глазах Шлейхера идеальным кандидатом на временное руководство советом. После того как Шлейхер укрепит свое правление, он покончит с этой демократической ошибкой и раз и навсегда обезопасит себя от демократической непримиримости." # When we moved to restore the position of president in the government, many had wondered what the infamously ambitious Schleicher would do with such a powerful position. Historically limiting his savvy dealings to political backrooms, it was to be expected that Schleicher himself would not desire to take the presidency.\n\nIn fact, Schleicher so far has been unable to forward anyone as president that would both relieve the many democrats and also work and cooperate with Schleicher’s group. Such a reality is mainly due to the Republican Council, having opted to remain as a check on Schleicher’s well-known ambitions. Stymying his consolidation of power at every turn, there is little doubt that the republican council have impeded the work towards restoring the republic and as such must be dealt with.\n\nBut how? Some suggest that as chancellor and as the Reichswehr’s chosen chancellor, Schleicher can simply force out the current council head, the progressive Joseph Wirth and make himself head of the republican council. This would certainly grant Schleicher powers beyond measure, but it would quickly rile up the democrats who would see this as the obvious power grab that it is.\n\nSo maybe an unknown would be good? An East Prussian notable, Horst von Restorff fled to the former mandate in 1933 to escape the revolutionary wrath that Dressler unleashed upon all of Germany. Having remained in obscurity, his former connections with the Nationalists and seeming normalcy have made him the perfect candidate in Schleicher’s eyes to temporarily take charge of the council. After Schleicher has consolidated his rule, he will then do away with this democratic mistake and secure himself from democratic intransigence once and for all.
 rhein.republic.31.a: "Мы будем действовать по мере необходимости – то есть, как нам заблагорассудится." # We shall operate as necessary - that is as we please.
 rhein.republic.31.b: "Мы надеемся, что этот фон Ресторф развеет их опасения." # This von Restorff will hopefully allay their fears.

 rhein.republic.32.t: "Разочаровывающая запись" # A Discouraging Entry
 rhein.republic.32.t_enabling: "Повтор 1932 года" # A Repeat of 1932
 rhein.republic.32.d_enabling: "Курт фон Шлейхер, последний канцлер законного правительства до того, как бандиты Дресслера были обрушены на Германию, казалось, был неудержим. Получив шанс провести закон, который, по сути, сделал бы его высшим органом власти в Германии, провал закона выявил истинное отсутствие поддержки Шлейхера в правительстве. Теперь, когда его гамбит окончен, дальнейшее пребывание на посту Шлейхера кажется несостоятельным..." # The last chancellor of the rightful government before Dressler’s thugs were unleashed upon Germany, Kurt von Schleicher was seemingly unstoppable. Having gotten the chance to force through a law to essentially make him the supreme authority in Germany, the law’s failure has revealed the true lack of support Schleicher has in the government. With his gambit now over, Schleicher’s continued tenure seems untenable...
 rhein.republic.32.d: "Канцлер Шлейхер в последнее время не добился хороших результатов. Столкнувшись с постоянными политическими поражениями, первоначальный энтузиазм в отношении старого канцлера, по-видимому, исчез, и лишь немногие консерваторы остались поддерживать генерала. Его неспособность творить свою предполагаемую политическую магию лишила его большой благосклонности среди офицеров рейхсвера, которых он предположительно представляет, поскольку они считали его всего лишь политиком, а не настоящим солдатом. Привлеченный к власти с надеждой, что он изменит судьбу республики, неспособность Шлейхера сделать это оттолкнула его от многих немцев, которые теперь видят в нем еще одного политика-неудачника." # Chancellor Schleicher has not had a good run as of recent. Facing continuous political defeats, the initial enthusiasm for the old chancellor has seemingly vanished with only a scant few conservatives remaining to back the general. His inability to work his supposed political magic has lost him much favour amongst the Reichswehr officers he supposedly represents, with their view that he was merely a politician and not a real soldier. Brought in with the expectation that he would change the fortunes of the republic, Schleicher’s inability to do so has alienated him from many Germans, who now see him as another failed politician.
 rhein.republic.32.a: "Не хорошо..." # Not good...

 rhein.republic.33.t: "Верховный канцлер" # The Chancellor Supreme
 rhein.republic.33.d: "Поскольку Закон о разрешении принят, а республиканский совет теперь совершенно неспособен остановить Шлейхера, следующий шаг Шлейхера теперь ясен. Поскольку оставшаяся демократическая оппозиция больше боится [GER.GetLeader], чем Шлейхера, Шлейхер теперь оказывается без какой-либо оппозиции полному контролю своей клики.\n\nТем не менее, Шлейхеру еще предстоит принять больше решений. Хотя его оппозиция невелика, Шлейхер не имеет особой народной поддержки, будь то среди жителей Рейнланда или даже среди немцев в целом. Если Шлейхер попытается полностью консолидировать свой контроль, он окажется в кризисе легитимности, который будет иметь катастрофические последствия для любых амбиций по возвращению Берлина. Однако приверженность той или иной форме гражданского правительства была бы в лучшем случае временной мерой для Шлейхера, который действительно желает задействовать рейхсвер в защите Германии." # With the Enabling Act passed and the republican council now totally incapable of stopping Schleicher, Schleicher’s next step is now clear. With the remaining democratic opposition more afraid of [GER.GetLeader] than of Schleicher, Schleicher now finds himself without any opposition to his clique’s total control.\n\nNevertheless, Schleicher still has more decisions to make. Although his opposition is few, Schleicher has little popular support, whether amongst the Rhinelanders or even the Germans at large. Should Schleicher attempt to totally consolidate his control, he will find himself in a crisis of legitimacy - one that would be disastrous for any ambitions of reclaiming Berlin. However, adhering to some form of civilian government would be a temporary arrangement at best for Schleicher who truly desires to entrench the Reichswehr into the defence of Germany.
 rhein.republic.33.a: "Рейхсвер защитит Германию!" # The Reichswehr shall protect Germany!
 rhein.republic.33.b: "Не будем заходить слишком далеко..." # Let’s not go too far...

 rhein.republic.34.t: "Демократическая оппозиция" # Democratic Opposition
 rhein.republic.34.d.restorff: "К сожалению для нас, похоже, что назначение Ресторфа не сработало так, как мы надеялись. Несмотря на то, что мы рассчитывали на то, что мелкий совет просто поймет, что мы придерживаемся консервативного направления, похоже, они реализовали уловку гораздо быстрее, чем мы ожидали.\n\nВо главе с бывшим канцлером Йозефом Виртом, «Республиканский союз», как они стали известны, объединились, чтобы осудить нас как попытку разрушить достижения ноябрьской революции. Хотя политические партии еще не полностью отказались от поддержки, мы должны быть готовы действовать осторожно - иначе Шлейхер снова окажется вне поста канцлера." # Unfortunately for us, it appears that Restorff’s appointment has not worked as much as we would have hoped. Even though we had counted on the petty council to simply understand that we are coming from a conservative direction, it seems they realized the ploy much faster than we had expected.\n\nLed by former chancellor Joseph Wirth, the \"Republikanische Union\" as they have become known have banded together to denounce us as attempting to destroy the accomplishments of the November revolution. Even though the political parties have yet to totally withdraw support, we must be ready to tread lightly - lest Schleicher find himself out of the chancellorship again.
 rhein.republic.34.d.schleicher: "Вполне ожидаемый поворот событий: и либералы, и социалисты категорически не согласились с решением Шлейхера взять на себя роль главы совета. Такое недемократическое сочетание сил, смешанное с диктаторскими амбициями Шлейхера, не могло не привести к его столкновению с демократами, которые сейчас мобилизовались, чтобы бросить вызов Шлейхеру.\n\nВо главе с бывшим канцлером Йозефом Виртом, «Республиканский союз», как они стали известны, объединились, чтобы осудить нас как попытку разрушить достижения Ноябрьской революции. Хотя политические партии еще не полностью отказались от поддержки, мы должны быть готовы действовать осторожно - иначе Шлейхер снова окажется вне поста канцлера." # In a rather expected turn of events, liberals and socialists have all disagreed vehemently with Schleicher’s decision to take on the role of head of the council. Such an undemocratic combination of powers mixed with the dictatorial ambitions of Schleicher was bound to lead to his butting of heads with the democrats, who have now mobilized to challenge Schleicher.\n\nLed by former chancellor Joseph Wirth, the \"Republikanische Union\" as they have become known have banded together to denounce us as attempting to destroy the accomplishments of the November revolution. Even though the political parties have yet to totally withdraw support, we must be ready to tread lightly - lest Schleicher find himself out of the chancellorship again.
 rhein.republic.34.a: "Они имеют право жаловаться." # They are free to complain.
 rhein.republic.34.b: "Мы не можем позволить себе быть разделенными." # We cannot let ourselves be divided.

 rhein.republic.35.t: "Закон о разрешении" # The Enabling Act
 rhein.republic.35.d: "Поскольку фирма Шлейхера находится под его контролем, а «Республиканский союз» погрузился в мелкие распри и вскоре потерял свою актуальность, время пришло. Давно опасавшийся за свои автократические амбиции, Шлейхер, наконец, приготовил свой удар по немецкой демократии.\n\nСсылаясь на экзистенциальную угрозу Берлина и провалы демократической системы, Шлейхер подготовил закон, который гарантирует, что канцлеру будут предоставлены все прерогативы действовать в интересах немецкого государства, а парламентские и судебные институты будут сведены «временно/» к, по сути, консультативным функциям. Уверенный в своих шансах, Шлейхеру пришло время завершить начатое." # With Schleicher firm in his control and the \"Republikanische Union\" having devolved into petty infighting and soon-to-be irrelevancy, the time has come. Long feared for his autocratic ambitions, Schleicher has finally readied his coup de grâce for German democracy.\n\nCiting the existential threat of Berlin and the failures of the democratic system,  Schleicher has prepared an act that will ensure that the chancellor will be granted all prerogatives to act in the interests of the German state and that the parliamentary and judicial institutions will be reduced, \"temporarily/", to what would essentially be advisory roles. Confident in his chances, the time has come for Schleicher to finish what he has started.
 rhein.republic.35.a: "Мы исправим старые ошибки." # We shall right old wrongs.
  
 rhein.republic.36.t: "Шлейхер унижен" # Schleicher Humiliated
 rhein.republic.36.d_enabling: "Совершив неудачу поистине эпических масштабов, Шлейхер не смог провести Закон о полномочиях через оставшуюся часть рейхстага. Несмотря на все свои постоянные махинации и попытки консолидировать власть, Шлейхер оказался неспособен свергнуть республиканские институты, которые защищали немецкую демократию в течение многих лет, пока борющаяся нация прыгала от кризиса к кризису.\n\nБлагодаря этой неудаче Шлейхер теперь зарекомендовал себя как еще один пережиток реакционного прошлого, который держится за законное немецкое правительство. Даже столкнувшись с могущественным противником изнутри, республика выжила и одержала победу. Подав прошение об отставке перед оставшимся рейхстагом, Шлейхер снова погрузился в бесславную судьбу - и все это в то время, как судьба республики становится все светлее и светлее." # In a failure of truly epic proportions, Schleicher has failed to pass the Enabling Act through the rump Reichstag. In spite of all his continuous machinations and attempts to consolidate power, Schleicher has proven incapable of dislodging the republican institutions that protected German democracy for many years as the struggling nation bounced from crisis to crisis.\n\nWith this failure, Schleicher has now proven himself as yet another relic of the reactionary past that hangs onto the rightful German government. Even when faced with a mighty opponent from within, the republic survived and came out on top. Tendering his resignation to the rump Reichstag, Schleicher has now sunk back into an inglorious destiny - all whilst the republic’s destiny grows ever and ever brighter.
 rhein.republic.36.d: "К сожалению, «Республиканский союз» не просто погрузился в ту пропасть, из которой он родился. Столкнувшись с огромным уровнем непопулярности из-за своей довольно посредственной работы, оппозиция Шлейхера теперь только растет и растет. Многие даже полагают, что Шлейхер скоро уйдет и никогда не вернется в коридоры власти.\n\nТеперь Шлейхер стоит перед выбором. Хотя сохранение контроля кажется крайне маловероятным, такая судьба может быть лучше, чем просто вернуться в общество в качестве опозоренного и несостоявшегося канцлера. И все же, как, черт возьми, Шлейхер сможет сохранить контроль, если он не сдастся?" # Rather unfortunately, the \"Republikanische Union\" have not merely sunk back into the abyss from which they were born. Facing massive levels of unpopularity for his rather mediocre performance, Schleicher’s opposition now only grows and grows. Many even believe that Schleicher will soon withdraw and never return to the halls of power.\n\nNow Schleicher faces a choice. Although remaining in control seems extremely unlikely, such a fate may be better than simply slinking back into the public as a disgraced and failed chancellor. Yet, how on earth will Schleicher maintain control if he does not give up?
 rhein.republic.36.a: "Мы никогда не сдадимся!" # We will never surrender!
 rhein.republic.36.b: "Все кончено." # It is over.
  
 rhein.republic.37.t: "Шлейхер исключен" # Schleicher Expelled
 rhein.republic.37.d: "Шлейхер, по-видимому, не сдвинулся с места в качестве канцлера, пытаясь удержаться на своем посту и не уйти в отставку.\n\nДля него это закончилось плохо.\n\nВ [GetDateText] Шлейхер внезапно проснулся из-за массовой всеобщей забастовки. Вскоре после этого Шлейхер будет арестован и заключен под стражу, поскольку «Республиканский союз» захватил власть в результате довольно бескровного переворота. Поскольку Шлейхера покинули те, кто, казалось бы, был ему верен вплоть до Кобленца, эра Красного Генерала, похоже, закончилась самым недостойным образом." # In a shocking move, Schleicher has seemingly not budged on being the chancellor, attempting to hold onto his position and to not resign.\n\nThis has gone poorly for him.\n\nAt [GetDateText], Schleicher would find himself suddenly awoken by a massive general strike. Not long after, Schleicher would be arrested and brought into custody as the \"Republikanische Union\" had seized power in what has turned out to be a rather bloodless coup. With Schleicher being deserted by those who seemingly were loyal to him all the way to Koblenz, the era of the Red General has seemingly ended in a most undignified manner.
 rhein.republic.37.a: "Что там с республикой и нестабильностью?" # What is it with the republic and instability?
  
 rhein.republic.38.t: "Надир Республики" # The Republic’s Nadir
 rhein.republic.38.d: "За многие недели и месяцы валькисты на Рейне получили власть и влияние, превосходящие самые худшие кошмары правительства. Вдохновленные желанием Берлина вернуть себе Рейнскую область, валкисты превратились из простых головорезов в организованную и радикальную силу, готовую раз и навсегда уничтожить новое республиканское правительство на Рейне.\n\nТеперь ситуация достигла апогея, сообщения показали, что валкисты начали полномасштабное наступление за контроль над Рейном, а мэры северных городов уже эвакуировались в Кобленц, где многие из них все еще сильны. Хотя правительство еще не рухнуло, многие опасаются худшего." # For many weeks and months, the valkists on the Rhine have gained power and influence far beyond the worst nightmares of the government. Buoyed by Berlin’s desire to retake the Rhineland, the Valkists have evolved from being mere thugs to being an organized and radicalized force - ready to once and for all destroy the new republican government on the Rhine.\n\nNow things have come to a head, reports have indicated that the Valkists have launched a full-on offensive for control on the Rhine, with mayors of the northern cities having already evacuated to Koblenz where many still stand strong. Although the government has yet to collapse, many fear the worst.
 rhein.republic.38.a: "Это конец?" # Is this the end?

 rhein.republic.39.t: "Прибытие валкистской революции" # The Valkist Revolution Arrives
 rhein.republic.39.d: "Хотя первоначальные сообщения могли указывать на то, что недавняя операция валкистов не будет обычной, мало кто ожидал развернувшегося насилия. Призывая своих соотечественников восстать против «предательского» правительства, бандиты-валкисты жестоко убили как республиканцев, так и невинных людей. На балконе Кёльнерской ратуши Альберт Лео Шлагетер вышел из укрытия, чтобы провозгласить победу Национальной революции.\n\nВместе с этим прозвучал призыв к оружию, и все это с намерением уничтожить республику раз и навсегда. Хуже всего то, что, похоже, Германия приблизилась к границе, готовясь вмешаться и уничтожить немецкую демократию раз и навсегда. Поскольку Германия вскоре нападет, а республика сильно ослаблена гражданскими волнениями в Рейнской области, кажется, что эпоха республики действительно закончилась." # Whilst initial reports may have indicated that the recent Valkist operation would not be a routine one, few expected the violence that unfolded. Calling on their compatriots to rebel against the \"traitorous\" government, valkist thugs have savagely murdered many republicans and innocents alike. On the balcony of the Kölner Rathaus, Albert Leo Schlageter has emerged from hiding to proclaim the victory of the National Revolution.\n\nAlong with this, a call of arms was made, all with the intent to destroy the republic once and for all. Worst of all, it seems that Germany has made movements to the border, readying themselves to intervene and destroy German democracy once and for all. With Germany soon to attack and the republic badly weakened by the civil unrest across the Rhineland, it seems that the era of the republic is truly over.
 rhein.republic.39.a: "Это плохо." # This is bad.
  
 rhein.republic.40.t: "Кровь на Рейне" # Blood on the Rhine
 rhein.republic.40.d_germany: "Кажется, что это настоящий акт справедливости: наши храбрые братья на Рейне, которые вот уже много месяцев ведут борьбу с предателями и трусами Кобленца, вышли победителями. Теперь, когда крысы изгнаны из северной Рейнской области, наши войска готовы к первой фазе освободительной войны - войне, в которой немцы снова будут триумфально стоять на Рейне.\n\nДаже несмотря на то, что наша информация предполагает, что французы, по-видимому, подготовились к интервенции, мы не боимся империалистов-лягушек. Слишком долго они порабощали и ломали наш народ, лишая нас возможности осуществить нашу праведную судьбу славы. Их разлагающуюся республику и разваливающуюся империю нужно будет только сломать, прежде чем Германия сможет снова выстоять – Deutschland, erwache!" # In a true act of justice, it seems that our brave brothers in the Rhine who have for many months now taken up the struggle against the traitors and cowards of Koblenz have come out victorious. With the rats now chased out from the northern Rhineland, our troops are ready for the first phase of the war of liberation - the war that will see Germans once again standing triumphantly on the Rhine.\n\nEven though our intel suggests that the French have seemingly readied themselves for an intervention, we are not afraid of the frog-eating imperialists. For too long they have subjugated and broken our people, barring us from our righteous destiny of glory. Their decaying republic and crumbling empire will only have to be broken before Germany can stand true once more -  Deutschland, erwache!
 rhein.republic.40.d_france: "Вызывает тревогу то, что в Париж наводнили сообщения о том, что республиканцы в бывшем рейнском мандате столкнулись не с чем иным, как с полной катастрофой. Поскольку немецкие агенты призывают местных жителей восстать против правительства, Германия теперь готова атаковать и захватить Рейнскую область. Набережная д'Орсе уже отчаянно пытается использовать все средства дипломатической поддержки правительства Кобленца, призывая правительства противостоять зверям, обосновавшимся в Аахене.\n\nНо этой меры слишком мало. Поскольку Германия готова атаковать Рейнскую область, ее успешный захват приведет к угрозе нашей безопасности. Боше нельзя позволить вернуться в Рейнскую область. Даже если другие страны будут осуждать и жаловаться, мы не можем допустить падения Рейнской области." # Disturbingly, reports have been flooding into Paris that the Republicans in the former Rhenish mandate have faced nothing more than total catastrophe. With German agents calling on the locals to rebel against the government, Germany is now poised to attack and seize the Rhineland. Already, Quai d'Orsay has frantically attempted all means of diplomatic support for the Koblenz government, urging governments to oppose the brutes that base themselves in Aachen.\n\nBut this measure is too little. With Germany ready to pounce on the Rhineland, their successful seizure would result in the compromising of our security. The Boche cannot be allowed to return to the Rhineland. Even if other nations condemn and complain, we cannot let the Rhineland fall.
 rhein.republic.40.a: "Час настал – смерть захватчикам!" # The Hour has come - death to the invaders!
 rhein.republic.40.b: "Немцы идут – мобилизуйте армию!" # The Germans are coming - mobilize the army!
  
 rhein.republic.41.t: "Тевтоны возвращаются" # The Teutons Return
 rhein.republic.41.d: "Если предыдущие события привели к потоку сообщений, то вторжение Германии на Рейн вызвало цунами. Поскольку гунны сделали свой выбор в пользу уничтожения правительства Кобленца, мы достигли точки невозврата. Как бывший главный генерал в мандате, Манжен вызвался вернуться в Рейнскую область, чтобы навести порядок – хотя это определенно приведет к войне с Германией. Многие считают это необходимым, поскольку, если Германии удастся совершить немыслимое, Франция окажется в самой большой опасности с 1914 года." # If the previous events resulted in a flood of reports, the German invasion of the Rhine has caused a tsunami. With the Huns having made their choice to destroy the Koblenz government, we now reach a point of no return. As the former chief general in the mandate, Mangin has volunteered to return to the Rhineland to restore order - although this will definitely lead to a war with Germany. Many deem this necessary for should Germany manage the unthinkable, France will be in its greatest peril since 1914.
 rhein.republic.41.a: "Операция Greenlight Mangin." # Greenlight Mangin’s operation.
 rhein.republic.41.b: "Мы пока не можем позволить себе еще одну войну." # We cannot afford another war yet.
  
 rhein.republic.42.t: "Революция на реке Рейн" # Revolution on the River Rhine
 rhein.republic.42.d: "Настоящие и преданные немцы Рейнской области долго ждали. Они терпеливо ждали того дня, когда немецкий флаг снова развевается над прекрасным Рейном.\n\nЭтот день настал.\n\nС восстанием рейнских валькистов пришло время вернуть Рейнскую область Рейху. Даже если французы готовы нанести удар, мы не можем оставить наших товарищей на произвол судьбы под новой французской оккупацией." # For a long time, the true and loyal Germans of the Rhineland waited. They patiently awaited the day where the German flag would once again fly all over the beautiful Rhine.\n\nThis day has now come.\n\nWith the revolt of the Rhenish valkists, the time has come for the Rhineland to return to the Reich. Even if the French are ready to strike, we cannot leave our comrades to their fate under a new French occupation.
 rhein.republic.42.a: "Мы не бросим наших братьев!" # We will not abandon our brothers!
 rhein.republic.42.b: "Мы пока не можем надеяться на победу." # We cannot hope to win yet.
  
 rhein.republic.43.t: "Немцы отступают" # The Germans Back Down
 rhein.republic.43.d: "В поистине славный день для Франции Берлин отступил из-за разрушающегося Рейна, поскольку мы вмешиваемся, чтобы восстановить порядок и свободу угнетенному рейнскому народу. Наша ставка на великую реку действительно окупилась!" # In a truly glorious day for France, Berlin has backed down over the collapsing Rhine as we intervene to restore order and liberty to the oppressed Rhenish people. Our gamble on the great river has truly paid off!
 rhein.republic.43.a: "Да здравствует Франция!" # Vive la France!
  
 rhein.republic.44.t: "Пэрис Кауэрс" # Paris Cowers
 rhein.republic.44.d: "Проявляя характерную для Германии трусость, французы отступили в вопросе того, что по праву является законной родиной Германии. Поскольку Франция отказывается вмешиваться в дела слабеющей республики, теперь на нас лежит задача обеспечить, чтобы немцы Рейна снова стали свободными!" # In a show of characteristic cowardice, the French have backed down over what is rightfully Germany’s rightful homeland. With France refusing to intervene into the failing republic, now it lies on us to ensure that the Germans of the Rhine are free once more!
 rhein.republic.44.a: "Шторм! Шторм! Шторм!" # Sturm! Sturm! Sturm!
  
 rhein.republic.45.t: "Стать возвращается" # Mangin Returns
 rhein.republic.45.d: "Учитывая неспособность правительства противостоять немецкой агрессии, мало кто ожидал, что французы просто будут стоять в стороне и позволят своему ненавистному сопернику просто захватить весь Рейн. Не имея легитимности и действительно значительной боевой силы, правительство, похоже, подчинилось своей обреченной судьбе как простой французский инструмент, который должен делать то, что говорит Париж.\n\nОднако им не придется нести этот позор. Чувствуя разочарование из-за нашей постоянной неспособности справиться с ситуацией, [FRA.GetNameDef], похоже, выбрал более прямой подход. При поддержке старого героя войны Шарля Манжена французские войска заняли ключевые правительственные здания и свергли старое правительство. Чтобы заменить разваливающуюся администрацию, было введено военное положение, за которым последовало создание ограниченного консультативного правительства.\n\nНесмотря на то, что его безжалостный и любимый своими войсками, правление Манжена оказалось предзнаменованием грядущих событий. Потому что Рейн больше не свободен, и его судьба — стать еще одним полем битвы в разрушительной Великой войне, которая искоренит жизни миллионов людей." # With the failure of the government to resist German aggression, few expected the French to simply stand by and let their hated rival simply take over the entire Rhine. Without legitimacy or really much of a fighting force, the government has seemingly submitted to their doomed fate as a mere French tool that must do as Paris says.\n\nThey will not however have to bear this shame. Feeling frustrated at our continuous inability to handle the situation, it seems that [FRA.GetNameDef] has opted for a more direct approach. Backed by the old war hero Charles Mangin, French troops have occupied key government buildings and have deposed the old government. To replace the crumbling administration, martial law followed by the installment of a limited advisory government has taken place.\n\nRuthless as he is well-liked by his troops, Mangin’s rule has proven a sign of things to come. For the Rhine is no longer free - and its fate is to be yet another battleground of a calamitous Great War to uproot the lives of millions.
 rhein.republic.45.a: "История повторяется..." # History repeats itself...
  
 rhein.republic.46.t: "Возвращение в Рейх" # Returning to the Reich
 rhein.republic.46.d: "С нашей победой на Рейне праведные повстанцы теперь полностью передали контроль Рейху. Поскольку французы возвращаются в свою несчастную страну, мы можем раз и навсегда с гордостью провозгласить, что Германия снова свободна!" # With our victory in the Rhine, the righteous rebels have now totally turned over control to the Reich. As the French retreat back to their wretched nation, we can once and for all proudly proclaim that Germany is free once again!
 rhein.republic.46.a: "Рейн свободен!" # Frei ist der Rhein!
  
 rhein.republic.47.t: "Красное Высокопреосвященство" # The Red Eminence
 rhein.republic.47.d: "По мере продвижения республики вперед ее охватила довольно странная атмосфера. Выжидая своего часа, силы Курта фон Шлейхера бездействовали, набирая влияние и связи, чтобы гарантировать, что их положение не останется в опасности.\n\nОднако у Шлейхера гораздо большие амбиции, чем кто-либо мог надеяться. Благодаря угрозе отступления валкистов и поддержке разнообразной коалиции социалистов, либералов и реакционеров, влияние Шлейхера теперь выросло далеко за пределы того, чего он достиг в старой республике.\n\nНе имея никого, кто мог бы его остановить, Шлейхер теперь бросил жребий. В довольно резком письме этот ублюдок призвал нас восстановить его в должности бывшего канцлера и реформировать коалиционное правительство, которое будет подчиняться ему и его подчиненным.\n\nКонечно, это просто ознаменовало бы конец республики. Хотя мы можем рассчитывать на поддержку широкой общественности, может быть уже слишком поздно по-настоящему сопротивляться захвату власти Шлейхером..." # As the republic marches forward, a rather odd atmosphere has engulfed the republic. Biding their time, the forces of Kurt von Schleicher have sat back, gaining influence and connections all to ensure that their position does not remain in peril.\n\nSchleicher however has much greater ambitions than any could possibly hope. With the Valkist menace on the retreat and a varied coalition of socialists, liberals and reactionaries backing him, Schleicher’s influence has now risen far beyond what he had attained in the old republic.\n\nWithout anyone to stop him, Schleicher has now cast the die. In a rather strongly worded letter, the bastard has urged us to reinstate him as former chancellor and reform a coalition government that would be under him and his underlings.\n\nOf course, this would simply herald the end of the republic. Although we can count on the general public backing us, it may be too late to truly resist Schleicher’s takeover...
 rhein.republic.47.a: "Они просто слишком сильны." # They are simply too powerful.
 rhein.republic.47.b: "Мы не допустим эту неудачу и ничего не опозорим!" # We will not grant this failure and disgrace anything!

 rhein.republic.48.t: "1932 Отомщен" # 1932 Avenged
 rhein.republic.48.d: "Еще раз: сейчас мы стоим на поворотном этапе в истории Германии. Поскольку несчастные предатели на Востоке продолжают терроризировать и порабощать Германию и мир в целом, только ответственное и благородное правительство сможет возродить Германию и вернуть ей законное место в мире.\n\nОднако народные настроения, к сожалению, не считают Шлейхера ответственным правительством, необходимым для спасения Германии от ее страданий. Поскольку Шлейхера поспешно назначили на пост канцлера, генерал, не теряя времени, защитил свою власть от республиканских партий, каждая из которых была возмущена приходом Шлейхера к власти. Даже если Шлейхер не был валькистом, это не мешало ему сохранять лояльность к демократии.\n\nНо сейчас всё это не имеет значения. Запугав правительство и заставив его принять Закон о полномочиях, который предоставляет ему неограниченную юридическую и политическую власть, [RHI.GetNameDef] больше не является границей демократии - последует только разрушение." # Once more, we now stand at a turning point in Germany’s history. As the wretched traitors in the East continue to terrorize and subjugate Germany and the world at large, only responsible and honourable government will be able to resurrect Germany and bring her back her rightful place in the world.\n\nHowever, popular sentiments unfortunately do not place Schleicher as the responsible government necessary to save Germany from her misery. With Schleicher hurriedly hailed into the role of chancellor, the general would waste no time in securing his power from the republican parties - all of whom were outraged at Schleicher’s takeover. Even if Schleicher was not a valkist, it did not preclude him from his loyalty to democracy.\n\nBut none of that matters now. Intimidating the government into accepting an Enabling Act that grants him unlimited legal and political power, [RHI.GetNameDef] is the frontier of democracy no longer - only destruction shall follow.
 rhein.republic.48.a: "Кто отомстил?" # Who has been avenged?
  
 rhein.republic.49.t: "Военный переворот" # Military Coup
 rhein.republic.49.d: "Хотя мы ожидали от генерала поразительной реакции, его следующего шага мало кто ожидал. Обвинив нас как предательское правительство за то, что мы сейчас отдаем приоритет предполагаемому национальному благу, Шлейхер использовал своих военных союзников для марша на [ROOT.Capital.GetCapitalVictoryPointName], при этом его союзники захватили власть и контроль над Рейнской областью.\n\nПоскольку реакция Парижа и Берлина в лучшем случае была приглушенной, кажется, что Шлейхер теперь здесь, чтобы остаться. Объявив себя канцлером и легко проведя через запуганный парламент закон о полномочиях, Шлейхер теперь безраздельно правит в падшей республике. Объявив Берлин предателем Германии, первым делом планируется превратить Рейнскую область в военную машину по освобождению Германии.\n\nОднако мало кто испытывает большой энтузиазм по поводу правления Шлейхера. Поскольку слухи о предстоящей всеобщей забастовке изобилуют азартной игрой Шлейхера, кажется, что судьба Рейнской области полна мрачной неопределенности..." # Even though we expected a striking reaction from the general, few expected his next move. Denouncing us as a traitorous government for now prioritizing the supposed national good, Schleicher has used his military allies to march on [ROOT.Capital.GetCapitalVictoryPointName], with his allies securing power and control across the Rhineland.\n\nWith reaction from Paris and Berlin both muted at best, it seems that Schleicher is now here to stay. Declaring himself as chancellor and easily passing an Enabling Act through the intimidated parliament, Schleicher now reigns supreme in the fallen republic. Denouncing Berlin as traitors to Germany, the first order of business is slated to be the conversion of the Rhineland into a war machine to liberate Germany.\n\nFew however feel terribly enthusiastic for Schleicher’s rule. With rumours of an impending general strike abounding at Schleicher’s gamble, it seems that the Rhineland’s fate is one of dark uncertainty...
 rhein.republic.49.a: "Кажется, у господина Люттвица есть свои поклонники..." # It seems Herr Lüttwitz has his admirers...
  
 rhein.republic.50.t: "Борьба заканчивается" # The Struggle Ends
 rhein.republic.50.d: "Новый рассвет сияет над Германией, особенно в [ROOT.Capital.GetCapitalVictoryPointName]. Когда в республику вновь вернулась стабильность, стремление к антидемократическому и антиреспубликанскому правительству, наоборот, кануло в пропасть. Даже если Германия не будет в такой безопасности, как в 1927 году, мы можем сказать, что республика не падет и не падет!" # A new dawn shines over Germany, most especially in [ROOT.Capital.GetCapitalVictoryPointName]. With stability returning to the republic once again, the desire for anti-democratic and anti-republican government has inversely ebbed into the abyss. Even if Germany is not as safe as it was in 1927, we can say that the republic shall not and will not fall!
 rhein.republic.50.a: "Отличный!" # Excellent!

 rhein.republic.51.t: "Республиканский порядок" # The Republican Order
 rhein.republic.51.d: "После победы над темными силами Берлина, казалось бы, произошло немыслимое. Несмотря на все препятствия, сложившиеся против них, республиканский порядок восторжествовал в борьбе с валькизмом и диктатурой. Поскольку Германия снова стала нашей, многие бывшие сепаратисты и другие отчужденные деятели решили уйти в отставку или снова скатились в безвестность, где им и место. Пока освобожденные немцы радуются победе демократии, давайте отпразднуем этот великий момент!" # Having prevailed against the dark forces of Berlin, the unthinkable has seemingly happened. In spite of all the odds stacked against them, the republican order has triumphed in the struggle against valkism and dictatorship. As Germany is ours once again, many former separatists and other estranged figures have thus opted to retire, or have slinked back into obscurity where they belong. As liberated Germans rejoice at democracy’s victory, let us celebrate this grand moment!
 rhein.republic.51.a: "Давайте позаботимся о новой Германии!" # Let us see to a new Germany!

 rhein.republic.52.t: "Конец союзнической гарантии" # The End of the Allied Guarantee
 rhein.republic.52.d: "Прошел год после освобождения Рейнской области, и нам предстоит столкнуться с некоторыми реалиями существования самостоятельного государства. Один из них, естественно, является нашей защитой. Поскольку союзные державы опасаются внезапного возвращения Германии после их вывода, теперь нам предстоит постоять за себя. В то время как некоторые празднуют это как доказательство нашей жизнеспособности, другие опасаются перспективы войны, в которой невозможно победить, против более крупной Германии." # With a year having passed since the liberation of the Rhineland, we must face some of the realities of being a state that stands on our own. One of those naturally being our defence. With the Allied powers fearing a sudden return of Germany after their withdrawal, now it lies on us to fend for ourselves. Whilst some celebrate this as proof of our viability, others fear the prospect of an unwinnable war against a larger Germany.
 rhein.republic.52.a: "Посмотрим..." # We shall see...

 rhein.republic.53.t: "Совет поддерживает Шлейхера" # The Council Endorses Schleicher
 rhein.republic.53.d: "Испытывая общее ухудшение поддержки и влияния с 1919 года, национал-либералы под руководством Эдуарда Дингельдея обнаружили, что их политические перспективы несколько обновились после их прихода в совет. Однако поддержка их незначительна, поскольку многие центристы считают, что ДВП просто зашла слишком далеко в праве, чтобы когда-либо примириться.\n\nС приходом фон Шлейхера на пост канцлера ДВП предприняла шаги по сотрудничеству с генералом, насколько это возможно. Известный как прагматичный офицер, Шлейхер не отрицал этих достижений, но также не смог полностью снискать расположение наиболее буржуазных буржуазных элементов в новом республиканском правительстве. Поскольку амбиции Шлейхера хорошо известны, некоторые даже опасаются, что союз между ними лишь провозгласит Германию чуть менее реакционной, чем тираны Берлина." # Experiencing a general malaise of support and influence since 1919, the National Liberals under Eduard Dingeldey found their political prospects somewhat renewed following their rise to the council. However, support for them is tenuous, with many centrists believing that the DVP is simply too far gone to the right to ever reconcile.\n\nWith the entering of von Schleicher as chancellor, the DVP has now taken steps to cooperate with the general as far as possible. Known for being a pragmatic officer, Schleicher has not denied these advances, but has also not wholly ingratiated himself with the most bourgeois of bourgeois elements in the new republican government. With Schleicher’s ambitions well-known, some even fear that an alliance between the two would only herald a Germany slightly less reactionary than the tyrants of Berlin.
 rhein.republic.53.a: "Поздравляю, мистер Шлейхер." # Congratulations, Herr Schleicher.

 rhein.republic.54.t: "Внеочередная конференция Немецкой народной партии" # Extraordinary Conference of the German People’s Party
 rhein.republic.54.d: "При весьма своеобразном повороте событий ДВП вновь оказалась во главе правительства. Однако Дингельдей не является Штреземаном, поскольку его появление и руководство ДВП привели к постоянной борьбе за сохранение своего существования. В основе раскола партии лежит вопрос: кого представляет ДВП?\n\nПоскольку ДВП распалась, а ее члены бегут к мандату, возвращение ДВП после возрождения республики снова спровоцировало конфликт в партии. Молодые либералы, группа относительно молодых либералов, после кризиса начала 1920-х годов призывали к тому, чтобы ДВП действительно стала народной партией, пользующейся широкой популярностью не только среди традиционных капиталистов, поддерживающих партию, но и объединяющей класс буржуазии точно так же, как Центр объединяет католиков. Возглавляемые Фрэнком Глатцелем, «Молодые либералы» также нашли большую поддержку среди профсоюзов «белых воротничков», хотя их связи с валькистским движением «Молодые консерваторы» не помогли примирить их с партией.\n\nОднако другая сторона партии не оказалась намного более либеральной. Решительно выступая за интересы тяжелой промышленности, правое крыло партии, среди многих представителей которой были Отто Гюго и Адольф Хейк, решительно выступало против любых попыток перехода к либеральному единству. Хуже всего то, что многие в их рядах предпочитают союз с реакционерами в Рейнской области, желая объединить ДВП в стойкую правую партию.\n\nДингельдей теперь оказывается в загадке. Придя к власти из-за его кажущейся готовности к дальнейшему либеральному единству, оказалось гораздо труднее противостоять наступлению основных сторонников партии, особенно в эти необычные времена." # In a rather peculiar turn of events, the DVP has once again found itself at the head of government. However, Dingeldey is no Stresemann with his rise and running of the DVP having resulted in its continuous struggle to even maintain its existence. At the core of the split in the party is the question: who does the DVP represent?\n\nWith the DVP dissolving itself and its members fleeing to the mandate, the return of the DVP following the revival of the republic has once again sparked a conflict in the party. The Young Liberals, a group of relatively younger liberals have since the crises of the early 1920 called for the DVP to truly become a people’s party, one with widespread appeal not just amongst the traditional capitalists that support the party, but one that unites the bourgeois class just like how Zentrum unites Catholics. Led by Frank Glatzel, the Young Liberals have also found much support among white-collar unions, though their ties to the valkist-adjacent Young Conservative movement has not done well to reconcile them with the party.\n\nHowever, the other side of the party does not prove itself to be much more liberal. Sternly in favour of the interests of heavy industry, the right-wing of the party, with many spokesmen amongst them being Otto Hugo and Adolf Heuck have strongly opposed any attempt to move to liberal unity. Worse of all, many in their ranks prefer an alignment with the reactionaries in the Rhineland, desiring to merge the DVP into a staunch party of the right.\n\nDingeldey now finds himself in a conundrum. Having been placed into power for his seeming willingness to further liberal unity, it has proven far more difficult to resist the advance of the party’s main backers - especially in these extraordinary times.
 rhein.republic.54.a: "Мы должны создать партию середины." # We must forge the party of the middle.
 rhein.republic.54.b: "Мы не забудем наших покровителей." # We shall not forget our backers.

 rhein.republic.55.t: "Справедливый совет?" # An Amenable Council?
 rhein.republic.55.d: "Поскольку вопрос о президентстве навис над республиканским правительством, Шлейхер теперь сталкивается с довольно странным препятствием. Несмотря на то, что многие должности в совете занимают члены ДВП, республиканский совет, возглавляемый Эдуардом Дингельдеем, по-прежнему весьма упрямо относится к заигрываниям Шлейхера. Несмотря на симпатию к некоторым позициям генерала, эзотерический характер союза Шлейхера с профсоюзами и некоторыми социал-демократами заставил деловых сторонников ДВП сильно усомниться в пригодности Шлейхера в качестве национального лидера.\n\nОднако совет не решил хранить молчание. Либо чувствуя, что их собственная власть ослабевает, либо власть Шлейхера растет, ДВП обратилась к Шлейхеру, чтобы помочь ему в его дальнейшей консолидации власти. По их мнению, Шлейхер может остаться на посту канцлера и покончить с республиканским советом, как только этого потребует ситуация в стране. В свою очередь, между Шлейхером и ДВП будет заключен союз, в котором Шлейхеру будет разрешено делать все необходимое, пока Германия не воссоединится.\n\nЭтот союз, безусловно, значительно облегчит захват власти Шлейхером. Тем не менее, это фундаментально испортило бы то, что Шлейхер получил от поддержки рабочего класса, и может даже сделать его зависимым от прихотей молодых либералов и их конкурентов из крупного бизнеса. Такое состояние было бы просто безумием, и кроме того; Германия в период ее величайшего кризиса не нуждается в дальнейшей политике между двумя партиями." # With the question of the presidency looming over the republican government, Schleicher now faces a rather odd roadblock. Even though DVP members staff many of the roles in the council, the republican council, led by Eduard Dingeldey still remains quite obstinate to Schleicher’s advances. Although sympathetic to some of the general’s positions, the esoteric nature of Schleicher’s alliance with the unions and certain social democrats has caused the business backers of the DVP to heavily doubt Schleicher’s suitability as the national leader.\n\nHowever, the council has not decided to remain silent. Either feeling their own power weakening or Schleicher’s power growing, the DVP has reached out to Schleicher to aid him in his continued consolidation of power. In their view, Schleicher can remain as chancellor and do away with the republican council once the national situation determines it so. In return, an alliance between Schleicher and the DVP will be made with Schleicher allowed to do whatever is necessary until Germany is reunited.\n\nThis alliance would certainly greatly ease Schleicher’s takeover. That said, it would fundamentally sully what Schleicher has gained in working-class support and may even cause him to be subject to the whims of the young liberals and their big business rivals. Such a state would simply be mere folly, and besides; Germany at her greatest time of crisis does not need further politicking between two parties.
 rhein.republic.55.a: "Ничего из этого не нужно — Шлейхеру нужны обе роли." # None of this is necessary - Schleicher needs both roles.
 rhein.republic.55.b: "Давайте выслушаем их." # Let's hear them out.

 rhein.republic.56.t: "Закон о национальной ориентации" # The National-Minded Act
 rhein.republic.56.d: "Поскольку Шлейхер все сильнее контролирует ситуацию, пришло время либералам выполнить свою часть сделки. С помощью ДВП Шлейхер, которого давно опасались за свои автократические амбиции, наконец, подготовил свой удар по немецкой демократии.\n\nСсылаясь на экзистенциальную угрозу Берлина и провалы демократической системы, Шлейхер подготовил закон, который гарантирует, что канцлеру будут предоставлены все прерогативы действовать в интересах немецкого государства, а парламентские и судебные институты будут сокращены «временно/», до того уровня, который, по сути, будет быть консультативными ролями. Уверенный в своих шансах, Шлейхеру пришло время завершить начатое." # With Schleicher ever firmer in his control, the time has come for the liberals to hold up their end of the deal. With the aid of the DVP, Schleicher, long feared for his autocratic ambitions, has finally readied his coup de grâce for German democracy.\n\nCiting the existential threat of Berlin and the failures of the democratic system,  Schleicher has prepared an act that will ensure that the chancellor will be granted all prerogatives to act in the interests of the German state and that the parliamentary and judicial institutions will be reduced, \"temporarily/", to what would essentially be advisory roles. Confident in his chances, the time has come for Schleicher to finish what he has started.
 rhein.republic.56.a: "Мы будем защищать национальные интересы!" # We shall defend the national interest!

 rhein.republic.57.t: "Победа молодых либералов" # Victory for the Young Liberals
 rhein.republic.57.d: "Несмотря на всю оппозицию, Закон о полномочиях был принят. Однако дело не зашло так далеко, как хотелось бы Шлейхеру. Далекий от первоначального всемогущего канцлера, без сомнения, Шлейхер теперь вынужден вновь заявить о важности личных свобод. Хуже всего то, что либеральное отношение к этому закону привело к тому, что Шлейхер столкнулся с давлением с целью уступок со своей стороны промышленникам и профсоюзам белых воротничков, которые поддерживают DVP, что поставило его перед выбором между сотрудничеством с профсоюзами и выполнением этих уступок.\n\nКонечно, не все так плохо. Шлейхер по-прежнему правит, обладая почти неконтролируемой властью, и немногие смогут остановить его, если ему понадобится что-то протолкнуть. Тем не менее, Шлейхеру придется ждать дольше, чтобы достичь полной власти, а из-за его плохого здоровья он, возможно, не сможет получить гораздо больше возможностей..." # In the face of all opposition, the Enabling Law has passed. However, it has not passed as far as Schleicher would have liked. Far from the original all-powerful chancellor without question, Schleicher now finds himself forced to restate the importance of personal freedoms. Worse of all, the liberal handling of the act has resulted in Schleicher facing pressure for concessions on his end to the industrialists and white-collar unions who back the DVP, forcing him into a bind between cooperating with the unions and fulfilling these concessions.\n\nOf course it is not all bad. Schleicher still reigns with nearly unchecked powers, few will be able to stop him should he need to force something through. Yet, Schleicher will have to wait for longer to attain full power, which owing to his poor health may not be something he has much more off...
 rhein.republic.57.a: "Пусть будет так." # So be it.

 rhein.republic.58.t: "Сельскохозяйственный кризис" # The Agricultural Crisis
 rhein.republic.58.d: "Когда Германия наконец освободилась от напасти валкистов, вопрос сельского хозяйства снова вышел на передний план. Хотя валкисты обещали оживить сельское хозяйство, реальность такова, что немецкие фермеры по-прежнему неспособны конкурировать с дешевыми иностранными продуктами питания без помощи правительства в форме протекционизма.\n\nЭто, естественно, взъерошило перья либералов внутри нашего правительства, а также многих промышленников, которые хотят больше сытых рабочих для своих фабрик и полной индустриализации Германии. С другой стороны, многие сельские элементы решительно выступают против таких мер и угрожают поддержать оппозиционные консервативные партии, которые, конечно же, не проведут либерализацию сельскохозяйственного рынка. Следовательно, теперь правительство должно решить – что ему делать?" # With Germany finally liberated from the Valkist scourge, the question of agriculture once again has creeped into the forefront. Whilst the Valkists promised to revitalize agriculture, the reality is that German farmers still remain incapable of competing with cheap foreign foodstuffs without aid from the government in the form of protectionism.\n\nThis has naturally ruffled the liberal feathers within our government as well as many industrialists, who desire more well-fed workers for their factories and the total industrialization of Germany. On the other hand, many rural elements deeply oppose such measures and threaten to support opposing conservative parties that will certainly not put into effect any liberalisation of the agriculture market. The government must hence now decide - what shall it do?
 rhein.republic.58.a: "Времена изменились..." # Times have changed...
 rhein.republic.58.b: "Мы должны защитить наших местных фермеров!" # We must defend our local farmers!
 rhein.republic.58.c: "Возможно, нам удастся найти компромисс?" # Perhaps we can find a compromise?

 rhein.republic.59.t: "Народный консервативный союз" # The People's Conservative Union
 rhein.republic.59.d: "После его возвращения к власти Шлейхер и его союзники не теряли времени даром, чтобы все его потенциальные союзники смогли объединиться и поддержать канцлера в его начинаниях. С этой целью политики, принадлежащие к самым разным партиям и объединениям, объединились, чтобы сформировать «Народноконсервативный союз», организацию, которая преодолевает глупую и мелочную природу партийных партий с широким фронтом поддержки со стороны всего немецкого народа. Даже если некоторые сомневаются в демократической природе этого фронта, будет трудно найти в нем что-то неправильное, особенно учитывая, что у ворот стоит Берлин." # Following his return to power, Schleicher and his allies have not wasted any time in ensuring that all of his potential allies are able to come together and support the chancellor in his endeavors. To this end, politicians hailing from all sorts of parties and affiliations have banded together to form the \"Volkskonservative Union\", an organization that overcomes the silly and petty nature of partisan parties with a broad front of support by all the German people. Even if some doubt the democratic nature of this front, it would be difficult to find anything wrong with it - especially with Berlin at the gates.
 rhein.republic.59.a: "Давайте перековать систему!" # Let us reforge the system!

 rhein.republic.60.t: "В защиту Рейха" # In Defence of the Reich
 rhein.republic.60.d: "Несмотря на надежды многих демократов, реальность такова, что «красный генерал» и канцлер Курт фон Шлейхер был кем угодно, только не ответственным демократическим лидером. Укрепив свою власть в исполнительной власти и централизовав контроль над правительством, Шлейхер теперь не встречает сопротивления, и немногие в Кобленце даже могут подумать о восстании против нового правительства.\n\nТаким образом, следующим шагом было покончить с имиджем демократической коалиции партий. Устаревший Народно-консервативный союз должен был быть заменен настоящим правительством, стоящим за немецкий народ и вместе с ним. Новый Германский Отечественный фронт отныне должен защищать Германию от опасностей необузданного радикализма и неэффективного либерализма." # Despite the hopes of many democrats, the reality is that the ‘Red General’ and chancellor Kurt von Schleicher was anything but a responsible democratic leader. Consolidating his hold in the executive and centralizing control for the government, Schleicher now stands unopposed with few in Koblenz even able to consider rebellion against the new government.\n\nThe next step was thus to do away with the image of a democratic coalition of parties. The antiquated People’s Conservative Union was to be replaced by a true government standing for and with the German people. The new German Fatherland Front shall from now on protect Germany from the dangers of unbridled radicalism and ineffective liberalism.
 rhein.republic.60.a: "В новую Германию!" # To a new Germany!

 rhein.republic.61.t: "В Верштат" # Into The Wehrstaat
 rhein.republic.61.d: "Мы вышли победителями, но со Шлейхером не все в порядке. Страдая от пагубной анемии с момента своего прихода к власти, Шлейхер из-за здоровья отодвинул его на задний план, пока мы восстанавливали Германию. В этом вакууме будущее правительства Шлейхера казалось неопределенным. Не превратится ли это в фальшивую демократию между в целом согласными партиями? Смогут ли бароны прошлого совершить грандиозное политическое возвращение?\n\nОднако сейчас, оглядываясь назад, эти прогнозы смехотворно неверны. Шлейхер всегда был армейским человеком – теперь с укрепившейся верой в необходимость готовности Германии к следующей войне. Если в Европе были две катастрофические войны подряд, что мешает третьей? Если - нет - когда разразится следующая война, Германия должна одержать верх над всеми державами.\n\nИ так и будет, величайший защитник немецкого народа в своей истории - армия должна гарантировать, что Германия не проиграет." # We have come out victorious, but all is not well with Schleicher. Suffering from pernicious anemia ever since his rise to power, Schleicher’s health forced him into the backseat as we rebuilt Germany. Out of this vacuum, the future of Schleicher’s government seemed uncertain. Would it turn into a phony democracy between generally agreeable parties? Would the barons of old make a grand political comeback?\n\nThese predictions are now however in hindsight laughably untrue. Schleicher was always a man of the army - now with a reinforced belief in the necessity of Germany’s readiness for the next war. If there have been two consecutive calamitous wars in Europe, what is preventing the third? If - no - when the next war breaks out, Germany must come out on top over all powers.\n\nAnd so it shall be, the greatest protector of the German people in her history - the army shall ensure Germany does not come out short.
 rhein.republic.61.a: "Слава Германии!" # Heil Deutschland!

 rhein.republic.62.t: "Республиканская реформация" # The Republican Reformation
 rhein.republic.62.d: "Мы вышли победителями, но со Шлейхером не все в порядке. Страдая от пагубной анемии с момента своего прихода к власти, Шлейхер из-за здоровья отодвинул его на задний план, пока мы восстанавливали Германию. В этом вакууме будущее правительства Шлейхера казалось неопределенным. Не превратится ли это в фальшивую демократию между в целом согласными партиями? Совершит ли бароны прошлого грандиозное политическое возвращение?\n\nРеспубликанская система всегда оказывалась в некоторых отношениях весьма достойной восхищения для Германии. Несмотря на попытки марксистов и правых радикалов свергнуть систему силой, они потерпели неудачу перед лицом устойчивости республиканцев. Даже коварный Дресслер мог прийти к власти только благодаря народной воле немецкого народа, как бы прискорбно это ни было. Помня об уроках 1932 года, на этот раз мы позаботимся о том, чтобы Германию не сотрясали террористы всех мастей и цветов.\n\nНа этот раз Германия окажется в восходящей позиции, которую она всегда заслуживала." # We have come out victorious, but all is not well with Schleicher. Suffering from pernicious anemia ever since his rise to power, Schleicher’s health forced him into the backseat as we rebuilt Germany. Out of this vacuum, the future of Schleicher’s government seemed uncertain. Would it turn into a phony democracy between generally agreeable parties? Would the barons of old make a grand political comeback?\n\nThe republican system has always proved rather admirable in some respects for Germany. In spite of the attempts of Marxists and right-wing radicals to overthrow the system by force, they failed in the face of republican resilience. Even the scheming Dressler could only take power through the popular will of the German people, unfortunate as that may be. With the lessons of 1932 in mind, this time we shall ensure that Germany is not rocked by terrorists of all stripes and colours.\n\nThis time, Germany will find herself in the ascendant position she has always deserved.
 rhein.republic.62.a: "Немецкий народ больше никогда не будет бояться!" # The German people will never again be afraid!
 rhein_authoritarian_republic: "§gВыборы в Рейхстаг пройдут через 30 дней, в ходе которых будут отданы предпочтение партиям, которые всегда выступали против социализма. Президентские выборы состоятся через 150 дней после этого.§!" # §gReichstag elections will be held in 30 days, favouring parties that have always stood against socialism. Presidential elections will take place 150 days after that.§!

 rhein.republic.63.t: "Новое состояние" # Neue Staat
 rhein.republic.63.d: "Мы вышли победителями, но со Шлейхером не все в порядке. Страдая от пагубной анемии с момента своего прихода к власти, Шлейхер из-за здоровья отодвинул его на задний план, пока мы восстанавливали Германию. В этом вакууме будущее правительства Шлейхера казалось неопределенным. Не превратится ли это в фальшивую демократию между в целом согласными партиями? Совершит ли бароны прошлого грандиозное политическое возвращение?\n\nСтарая республика всегда была продуктом пролетарского сброда и презренных марксистов. В своей в лучшем случае ошибочной, а в худшем случае злонамеренной попытке изменить старую систему, они опрокинули все, что делало Германию великой. Хотя монархия, по общему признанию, оставляла желать лучшего, пришедшая на смену республика была простым партийным упражнением в большевизме.\n\nК счастью, этого больше не будет. Благодаря усилиям элиты Германия теперь вернулась в руки самых способных людей, готовых вернуть себе место в мире." # We have come out victorious, but all is not well with Schleicher. Suffering from pernicious anemia ever since his rise to power, Schleicher’s health forced him into the backseat as we rebuilt Germany. Out of this vacuum, the future of Schleicher’s government seemed uncertain. Would it turn into a phony democracy between generally agreeable parties? Would the barons of old make a grand political comeback?\n\nThe old republic was always the product of proletarian rabble and despicable Marxists. In their at best misguided and at worst malicious attempt to change the old system, they overturned everything that made Germany great. Although the monarchy admittedly left much to be desired, the republic that replaced it was a simple partisan exercise in Bolshevism.\n\nThankfully, this shall no longer be the case. Through the efforts of the elite, Germany is now back in the hands of the most capable men - ready to reclaim her spot in the world.
 rhein.republic.63.a: "Мы исправили старые ошибки." # We have righted old wrongs.

 rhein.republic.64.t: "Выборы [GetYear]" # The [GetYear] Elections
 rhein.republic.64.d: "Прошли годы с тех пор, как немецкий народ смог высказаться на выборах. Хотя полностью либерально-демократическая система нежелательна, выборы являются ключом к тому, чтобы люди были довольны и услышаны. Чтобы гарантировать честность выборов, мы взяли на себя смелость гарантировать, что только самые надежные партии смогут легко принять в них участие.\n\nТеперь это соревнование между Консервативной народной партией, поддерживаемой в основном сельской местностью, а также социальными консерваторами, и Немецкой народной партией, обновленной партией среднего класса, которая обеспечит процветание Германии на долгие годы вперед." # Years have passed since the German people were able to make themselves heard at the polls. While an entirely liberal democratic system is not desirable, elections are key to ensuring that the people are content and heard. To ensure the integrity of the elections, we have taken the liberty to ensure only the most reliable of parties can easily participate.\n\nNow, it is a competition between the Conservative People’s Party, supported mainly by the rural countryside as well as social conservatives and the German People’s Party, a reinvigorated party of the middle class that will ensure German prosperity for years to come.
 rhein.republic.64.a: "Легкая победа КВП!" # An easy win by the KVP!
 rhein.republic.64.b: "Расстройство со стороны ДВП!" # An upset by the DVP!

 rhein.republic.65.t: "Выборы президента Рейха [GetYear]" # Reichspräsidentenwahl [GetYear]
 rhein.republic.65.d: "Рейхспрезидент всегда был стойким защитником свободы Германии и республики, начиная с революции 1919 года. Поскольку период кризиса закончился, немецкий народ теперь выйдет на выборы нового президента, который будет определять мировоззрение страны на долгие годы вперед." # The Reichspräsident has always been a staunch defender of Germany’s freedom and of the republic since the revolution of 1919. With the period of crisis over, the German people shall now go forth to elect a new president who will shape the outlook of the country for years to come.
 rhein.republic.65.a_goerdeler: "Господин Герделер приведет Германию в новую эпоху!" # Herr Goerdeler shall bring Germany into a new age!
 rhein.republic.65.a_silverberg: "Опыт Сильверберга – это то, что нужно Германии!" # Silverberg's expertise is what Germany needs!

 rhein.republic.66.t: "Новый руководитель" # A New Executive
 rhein.republic.66.d: "Поскольку мы стремимся построить новую Германию, возникает вопрос о том, кто возглавит ее. Хотя Герделер хорошо нам послужил, некоторые предпочли бы, чтобы он отошёл на второй план, когда в борьбу вступают другие силы. Одной из таких сил являются католические консерваторы, ранее входившие в состав Центрума до конца монархии. Хотя правление валкистов сильно ударило по ним, они все же заставили свои голоса быть услышанными, желая, чтобы барон Герман фон Люнинк занял пост рейхспрезидента до тех пор, пока не наступит подходящее время для восстановления монархии.\n\nС другой стороны, некоторые считают, что эти аристократические голоса плохо подходят для новой Германии. Ассоциация Германа с его молодым братом-консерватором Фердинандом фон Люнинком также не была воспринята хорошо некоторыми, которые считают, что Герберт фон Бозе должен взять на себя роль рейхспрезидента, возможно, даже навсегда." # As we endeavor to build a new Germany, the question of who shall take the lead has arisen. While Goerdeler has served us well, some would prefer that he take a back seat as other forces come into the fray. One such force are the Catholic conservatives, previously party to Zentrum until the end of the monarchy. Whilst Valkist rule has hit them hard, they have still made their voices heard with their desire for the the baron Hermann von Lüninck to take the position as Reichspräsident until the time is right for a restoration of the monarchy.\n\nOn the other hand, some feel that these aristocratic voices are ill-suited for a new Germany. The association of Hermann with his Young Conservative brother Ferdinand von Lüninck has also not been taken well by some, who feel that Herbert von Bose ought to take the role as Reichspräsident, potentially even permanently.
 rhein.republic.66.a: "Господин Люнинк понравится аристократам." # Herr Lüninck will please the aristocrats.
 rhein.republic.66.b: "Бозе позаботится о возрождении Германии." # Bose will see to Germany's resurrection.

 rhein.republic.67.t: "Глава государства?" # A Chief of State?
 rhein.republic.67.d: "Поскольку старое гражданское правительство теперь полностью поглощено военным аппаратом, мы должны решить, кто смело поведет Германию в будущее. Некоторые полагают, что руководитель прессы Эрих Маркс справился бы с такой ролью, поскольку его опыт работы с общественностью потенциально может оказаться полезным.\n\nС другой стороны, правой рукой Шлейхера всегда был Фердинанд фон Бредов. Хотя Бредов всегда был человеком тени, в новом Рейхе больше нет необходимости прятаться за занавеской. Кроме того, некоторые военные офицеры предостерегают от открытого военного вторжения: должность рейхспрезидента должна оставаться на позиции опытных политиков." # With the old civilian government now entirely enmeshed within the military apparatus, we must now decide who will boldly lead Germany into the future. Some have floated that press chief Erich Marcks would be adept at such a role, with his experience in dealing with the public potentially proving useful.\n\nOn the other hand, Schleicher’s right hand man has always been Ferdinand von Bredow. While Bredow has always been a man of the shadows, there is little need to hide behind a curtain anymore in the new Reich. Additionally, some military officers have cautioned against overt military intrusion - the Reichspräsident ought to remain a position held by experienced politicians.
 rhein.republic.67.a: "Эрих Маркс обеспечит общественное обращение." # Erich Marcks will provide public appeal.
 rhein.republic.67.b: "Бредов всегда верно служил воле Шлейхера." # Bredow has always served Schleicher's will faithfully.
 rhein.republic.67.c: "Возможно, гражданское лицо было бы лучше?" # Perhaps a civilian face would be better?

 rhein.republic.68.t: "Восстановление поста президента" # Restoration of the Presidency
 rhein.republic.68.d: "Теперь, когда Германия свободна от тирании валкистов, Веймарская конституция и все ее статьи теперь должны выполняться без каких-либо препятствий. До сих пор чрезвычайные обстоятельства, в которых оказалась республика, требовали, чтобы дело демократии возглавлял совет, а не президент - но теперь и этот совет утратил свою цель. С этой целью был созван основной рейхстаг, чтобы решить, кто будет следующим президентом - решение, к которому нельзя относиться легкомысленно, учитывая конституционную власть президента.\n\nПоскольку ужасы валкистской тирании и фронта Дресслера все еще присутствуют в умах многих, [RHI_conservative_party] предложил Карла Шпикера, журналиста, широко известного в антивалкистских кругах из-за его неутомимого осуждения диктатуры и берлинского режима. Проявив также большую склонность, чем его коллеги-члены [RHI_conservative_party], к работе с другими партиями, Шпикер является любимым кандидатом на пост президента.\n\nНикогда не предоставляя [RHI_conservative_party] свободу действий, социал-демократы выдвинули своего собственного кандидата в лице Рудольфа Брайтшайда. Сбежав в Рейнскую область после прихода к власти Дресслера, Брайтшайд неустанно выступал в качестве одного из главных защитников народного фронта против валькизма, что в сочетании с его поддержкой окончательного примирения с Францией заставило СДПГ выдвинуть его своим кандидатом. Несмотря на плохую репутацию Брайтшайда среди националистов, его призывы к миру сделали его популярным в Германии, уставшей от войны.\n\nПо-видимому, делая ставку на тупик между [RHI_conservative_party] и СДПГ, либеральные партии решили выдвинуть третьего собственного кандидата - Августа Вебера. После прихода к власти Дресслера Вебер бежал в Рейнскую область, где работал над организацией остатка либерального движения, призванного противостоять валькизму и работать над восстановлением свободной Германии в Рейнской области. Будучи сторонником либерального единства и имеющим хороший опыт борьбы с валкистской угрозой, Вебер стал темной лошадкой на президентских выборах." # With Germany now free from Valkist tyranny, the Weimar constitution and all of its articles now ought to be implemented without any impediment. Up until now, the extraordinary circumstances that the republic found herself under required that a council rather than a president lead the cause for democracy - but now this council too has lost its purpose. To this end, the rump Reichstag has been convened to decide who the next president shall be - a decision that is not to be taken lightly considering the president’s constitutional power.\n\nWith the horrors of Valkist tyranny and of Dressler’s front still present in the minds of many, the [RHI_conservative_party] has proposed Carl Spiecker, a journalist of much renown among anti-Valkist circles due to his tireless denunciation of dictatorship and of the Berlin regime. Having also displayed a greater tendency than his fellow [RHI_conservative_party] members to work with other parties, Spiecker is the favourite candidate to be appointed president.\n\nNever one to give the [RHI_conservative_party] a free hand, the Social Democrats have forwarded their own candidate in Rudolf Breitscheid. Having fled to the Rhineland following Dressler’s takeover, Breitscheid has tirelessly served as one of the main advocates for a popular front against Valkism, which combined with his advocacy for final reconciliation with France has caused the SPD to nominate him as their candidate. Breitscheid’s poor reputation among nationalists notwithstanding, his calls for peace have made him popular in a Germany weary of war.\n\nSeemingly banking on a deadlock between the [RHI_conservative_party] and SPD, the liberal parties have opted to nominate a third candidate of their own - August Weber. Following Dressler’s takeover, Weber fled to the Rhineland, working to organise the rump liberal movement in the mandate to oppose Valkism and to work towards rebuilding a free Germany in the Rhineland. An advocate for liberal unity and with a good track record in opposition to the Valkist menace, Weber’s dark horse status in the presidential selection could be overcome.
 rhein.republic.68.a: "Шпикер добьет предателей валкистов!" # Spiecker will finish off the Valkist traitors!
 rhein.republic.68.b: "Нам нужен взгляд Брайтшайда на будущее." # We need Breitscheid’s eye towards the future.
 rhein.republic.68.c: "Вебер борется за Республику!" # Weber fights for the Republic!


# Federals!

 rhein.federals.0.t: "Федеральный проект" # The Federal Project
 rhein.federals.0.d: "По мере того, как мы идем вперед к истинной свободе Германии, мы должны быть готовы раскрыть множество причин, по которым прусское господство задушило остальную часть Германии после объединения. От армии до бюрократии слишком много прусских агентов или даже откровенных пруссаков пытаются помешать нам создать федеративную Германию, в которой все государства объединятся для защиты наших свобод. В результате одного грандиозного шага Германия будет навсегда освобождена от Пруссии.\n\nРеальность, однако, немного менее сурова. Даже если многие полагают, что для того, чтобы болезнь Германии исчезла, Пруссию нужно просто стереть с лица земли, мало кто ожидает, что такой шаг не встретит большого сопротивления. На всех уровнях общества мы должны быть готовы не только подавить недовольство Пруссии, но и доказать, что федерализм — это путь вперед для Германии." # As we march forward towards the true freedom of Germany, we must be ready to unravel the many ways that Prussian domination has suffocated the rest of Germany since unification. From the army to the bureaucracy, far too many Prussian agents or even outright Prussians attempt to stop us from bringing about a federal Germany where all states band together to protect our freedoms. In one grand sweep, Germany will be liberated from Prussia forever.\n\nThe reality however is a little bit less severe. Even if many believe that Prussia will merely have to be stricken from the record for Germany’s malaise to disappear, few expect that there will be little resistance to such a move. At all levels of society, we must be ready to not only suppress Prussian discontent, but we must prove that federalism is the way forward for Germany.
 rhein.federals.0.a: "Это может вызвать проблемы..." # This may cause trouble...

 rhein.federals.1.t: "Маловероятный союз" # An Unlikely Alliance
 rhein.federals.1.d: "Потерпев поражение на национальной конференции, сепаратистский лагерь раскололся, и их последний шанс на власть, по-видимому, был полностью разрушен исходом конференции. Из этих развалин оба сепаратиста выступили непримиримыми врагами: Дортен объявил своего бывшего союзника социалистом, прусским агентом, а Маттес порицал очевидную некомпетентность Дортена и обвинял его в недавних бедах движения.\n\nИз этого хаоса Аденауэр теперь окажется единственным жителем Рейнланда, способным помешать «веймарцам» утвердить прусское господство над новым Рейнское государство. Поскольку республиканское движение казалось неудержимым, казалось, что единственный верный способ смягчить ущерб, нанесенный республиканским блоком, - это навязать им истинные желания жителей Рейна.\n\nТак оно и было. Вместе с Аденауэром Дортен объединил своих союзников, чтобы сформировать единую федералистскую партию в сотрудничестве с «Центрумом», альянс, который стал полной неожиданностью как для отечественных, так и для международных наблюдателей. Даже если республике предстоит выжить, маловероятно, что эта новая республика будет иметь много общего со своим предыдущим воплощением." # Finding themselves beat at the national conference, the separatist camp splintered, with their last chance at power seemingly totally ruined by the outcome of the conference. From this rubble, both separatists have come out as irreconcilable foes with Dorten denouncing his former ally as a socialist, Prussian agent and Matthes decrying Dorten’s apparent ineptitude and blaming him for the movement’s recent ills.\n\nOut of this chaos, Adenauer would now find himself as the only Rhinelander capable of stopping the \"Weimarers\" from asserting Prussian dominance over the new Rhenish state. With the republican movement seeming unstoppable, it appeared that the only true way to mediate the damage done by a republican bloc would be to force the true wishes of the Rhinelander upon them.\n\nAnd so it was. Together with Adenauer, Dorten has brought his allies together to form a united federalist party in cooperation with Zentrum, an alliance that has come as a total surprise to both domestic and international observers. Even if the republic is to endure, there is little expectation that this new one will share much in common with its previous incarnation.
 rhein.federals.1.a: "Два сепаратиста... за республику?" # Two separatists...for the republic?

 rhein.federals.2.t: "Примирение Центра" # Reconciling the Centre
 rhein.federals.2.d: "Приступая к реализации нашего федерального проекта, следующий вопрос, который мы должны себе задать, заключается в том, кто возьмет на себя бразды правления государством. И Аденауэр, и Дортен возглавляют довольно разные блоки, даже если их политика не слишком отличается. Ситуация усложняется тем, что многие не уверены в том, насколько влиятельной будет власть президента в новой федеративной республике. Поскольку власть президента неопределенна, а конкурирующие фракции, похоже, не желают выбирать компромиссного кандидата, придется сделать выбор." # As we embark on our federal project, the next question we must ask ourselves is as to who shall take the reins of state. Both Adenauer and Dorten lead rather different blocs even if their policies are not all-too dissimilar. To complicate matters, many are unsure as to how powerful the presidency shall be in a new federal republic. With the power of the president vague and the competing factions seemingly unwilling to settle on a compromise candidate, a choice will have to be made.
 rhein.federals.2.a: "Аденауэр пользуется необходимым доверием." # Adenauer has the credibility necessary.
 rhein.federals.2.b: "Дортен умиротворит сепаратистов." # Dorten will appease the separatists.

 rhein.federals.3.t: "Вопрос о рейхсвере" # The Reichswehr Question
 rhein.federals.3.d: "К сожалению, кажется, что рейхсвер, наполненный прусскими офицерами, не очень благосклонно отнесся к нашему новому курсу действий. Хотя они и правы в том, что социал-демократы, возможно, не самые желательные партнеры, они поставили себе целью открыто упрекнуть нас за попытку работать демократически и в интересах республики.\n\nКак бы то ни было, многие республиканцы видят, что им еще предстоит открыто поддержать кого-то, кто пытается искоренить нынешний федералистский проект. Таким образом, некоторые предлагают нам уступить некоторые позиции этому прусскому пристанищу или, по крайней мере, пообещать улучшить ситуацию там, где республика потерпела неудачу." # Disappointingly, it seems that the Reichswehr - infested with Prussian officers has not taken our new course of action very kindly. Although they are right that the social democrats may not be the most desirable partners, they have made it a point to openly rebuke us for attempting to work democratically and in the interests of the republic.\n\nBe that as it may, many republicans can see that they have yet to openly support someone who seeks to uproot the current federalist project. As such, some have suggested that we concede some ground to this Prussian haven, or at the very least promise to improve where the republic failed.
 rhein.federals.3.a: "Они увидят, что мы предоставляем ответственное правительство." # They will see that we grant responsible government.
 rhein.federals.3.b: "Просто оставьте их в покое — мы разберемся с ними, как только Берлин будет побежден." # Just leave them be - we will deal with them once Berlin is defeated.
 rhein.federals.3.c: "У них нет ни для чего оснований!" # They have no grounds for anything!

 rhein.federals.4.t: "Прусский оплот" # The Prussian Bulwark
 rhein.federals.4.d: "Как и ожидалось, прусские офицеры, похоже, больше не смогли взять наши цели. Ссылаясь на свою непримиримость с нынешним правительством, значительная часть офицеров рейхсвера предпочла официально уйти в отставку. Хотя это, несомненно, нанесет огромный удар по нашему военному потенциалу, многие возражают, что теперь у нас будет больше возможностей проводить военную реформу и что в долгосрочной перспективе это будет к лучшему." # As expected, the Prussian officers seemingly could not take any more of our goals. Citing their irreconcilability with the current government, a good chunk of the Reichswehr officers have opted to officially retire. Whilst this will no doubt prove a tremendous blow to our military potential, many counter that we will now be more able to pursue military reform and that it will have been for the better in the long run.
 rhein.federals.4.a: "Пруссаки избавились от себя..." # The Prussians got rid of themselves...

 rhein.federals.5.t: "Разрыв говорит" # Severing Speaks Out
 rhein.federals.5.d: "Даже несмотря на то, что мы продолжаем работать над освобождением Германии, все еще кажется, что некоторые старые республиканские деятели не могут не высказывать свою несправедливую критику нашего образа жизни. В связи с недавними событиями против нас выступил Карл Северинг, бывший министр внутренних дел Пруссии от социал-демократов. Нарисовав нас разрозненной группой рейнских сепаратистов, он заявил, что мы просто позволим Германии разделить на несколько государств.\n\nДаже если он не встретил упреков, его критика сигнализирует о продолжающемся недовольстве среди «веймареров» в правительстве и общественности. Поскольку это присутствие ощущается повсюду, многие считают, что их сотрудничество может не продолжаться долго, если мы продолжим идти по этому пути." # Even as we continue to work towards Germany’s freedom, it still seems some old republican figures cannot help but blather their unfair critique of our ways. Due to recent events, Carl Severing, the former Social Democrat interior minister for Prussia has spoken out against us. Painting us as a loose band of Rhenish separatists, he has claimed that we will simply allow Germany to be split up into several states.\n\nEven if he has not been met with rebuke, his criticism signals continued discontentment amongst the \"Weimarers\" in the government and public. With the presence felt everywhere, many feel that their cooperation may not continue for much longer if we continue down this path.
 rhein.federals.5.a: "С какой стати мы должны его слушать?" # Why on EARTH should we listen to him?

 rhein.federals.6.t: "Радикальная оппозиция" # Radical Opposition
 rhein.federals.6.d: "По мере того, как мы продолжаем идти по пути к свободе Германии, кажется, что некоторые экстремисты все еще не могут удержаться от террора невинных гражданских лиц. За последние несколько недель в Рейнской области произошел всплеск экстремистского террора. Независимо от того, провозглашают ли они нас разделителями рабочих или национал-предателями, действия этих большевиков и валькистов препятствуют нашим усилиям по превращению Германии в подлинно федеративную и свободную нацию." # As we continue down our path towards Germany's freedom, it seems that some extremists still cannot help themselves from terrorizing innocent civilians. Over the last few weeks, an uptick in extremist terror has struck the Rhineland. Whether they proclaim us as dividers of the workers or national traitors, the actions of these Bolsheviks and Valkists have hindered our efforts at turning Germany into a truly federal and free nation.
 rhein.federals.6.a: "Доказательство того, что пруссачество ведет к разрушению." # Proof that Prussianism leads to destruction.

 rhein.federals.7.t: "Проблема Пфальца" # The Palatinate Problem
 rhein.federals.7.d: "Поскольку беженцы продолжают бежать от прусской тирании, похоже, возникла довольно специфическая проблема - проблема Пфальца.\n\nС момента нашего прихода к власти сепаратисты Пфальца заняли положение в нашем правительстве, которое дало им большую власть по сравнению с тем, когда они были простыми пособниками французов. С этой целью они продолжали агитировать со своих властных позиций за обещание свободного Пфальца, отказа от баварского правления и к созданию собственного свободного государства или, по крайней мере, автономного государства в пределах свободной Рейнской области. Эта группа, возглавляемая Францем Йозефом Хайнцем, казалось бы, оставалась относительно незначительной по сравнению с огромными организациями, возглавляемыми DFP и Центрумом.\n\nОднако после бегства многих баварских политиков многие из этих беженцев призвали нас игнорировать сепаратистов Пфальца или даже прямо упрекнуть их. Даже если они имеют относительно небольшое влияние, эти политики могут оказаться решающими для восстановления поддержки в Баварии, как только мы свергнем Берлин. И все же не было бы позором предать наших старых союзников?" # As refugees continue to flee from Prussian tyranny, it seems that a rather peculiar problem has come out - the issue of the Palatinate.\n\nEver since our rise to power, the Palatinate separatists have occupied a position in our government that has lent them much power compared to when they were mere collaborators of the French. To this end, they have continued to agitate from their positions of power for the promise of a free Palatinate, away from Bavarian rule and towards a free state of their own or at least an autonomous state within a free Rhineland. Led by Franz Josef Heinz, this group would have seemed to remain relatively minor as compared to the massive organizations led by the DFP and Zentrum.\n\nWith the flight of many Bavarian politicians however, many of these refugees have urged us to ignore the Palatinate separatists or even to outright rebuke them. Even if they have little influence comparatively, these politicians may prove crucial to regaining support in Bavaria once we have overthrown Berlin. Still, would it not be disgraceful to betray our old allies?
 rhein.federals.7.a: "Нам нужно мыслить масштабно." # We need to think big.
 rhein.federals.7.b: "Дресслер вырос из Баварии – зачем нам позволять этим ублюдкам что-то решать?" # Dressler rose from Bavaria - why would we let those bastards decide anything?

 rhein.federals.8.t: "Сепаратистский блюз" # Separatist Blues
 rhein.federals.8.d: "При неудачном, но ожидаемом повороте событий, сепаратисты Пфальца не очень хорошо восприняли новость о своей маргинализации. Комментируя нашу враждебность по отношению к их сепаратизму, члены нашего кабинета из Палатината пригрозили уйти в отставку и полностью уйти, что угрожает стабильности нашего кабинета.\n\nДаже в этом случае это, возможно, не было огромным ударом. Так продолжалось до тех пор, пока другие рейнские сепаратисты не начали объединяться вокруг сепаратистов Пфальца. Объединенные в своей оппозиции тому, что, по их мнению, мы отдаем предпочтение старому порядку и старой структуре республики, эти сепаратисты как блок начали злобно лоббировать против нас и представляют реальную угрозу стабильности, сохраняющейся в ДФП. Таким образом, многие призывали нас изменить свою позицию и отдать предпочтение сепаратистам, а не баварцам – в конце концов, какая от них польза от нас сейчас?" # In an unfortunate but expected turn of events, the Palatinate separatists have not taken the news of their marginalisation well. Commenting on our hostility towards their separatism, the Palatinate members of our cabinet have threatened to resign and leave outright - threatening the stability of our cabinet.\n\nEven so, this may not have been a huge blow. That would be until fellow Rhenish separatists began to rally behind the Palatinate separatists. United in their opposition towards what they perceive as us favouring the old order and old structure of the republic, these separatists as a bloc have begun to viciously lobby against us and pose a true risk to stability remaining in the DFP. As such, many have called for us to reverse our stance and favour the separatists over the Bavarians - after all, what use do they have for us now?
 rhein.federals.8.a: "Может быть, эти изгнанники не так уж и важны..." # Maybe these exiles are not so important...
 rhein.federals.8.b: "Сейчас мы не можем изменить курс." # We cannot reverse course now.

 rhein.federals.9.t: "Баварская ярость" # Bavarian Fury
 rhein.federals.9.d: "Наши недавние действия по обеспечению автономии Пфальца не были встречены особенно положительно среди баварских изгнанников. В некоторых поистине полемических статьях баварские журналисты сравнивали нас с Пруссией и заявляли, что истинная цель Аденауэра и Дортена — просто превратить Рейнскую область в новую Пруссию. Хотя такое обвинение настолько гнусно, что его следует высмеять, некоторые предлагают вместо этого достичь мира с баварцами и пойти на компромисс с ними, чтобы сохранить стабильность в правительстве." # Our recent actions towards the autonomy of the Palatinate have not been received terribly positively amongst the Bavarian exiles. In some truly polemical articles, Bavarian journalists have compared us to Prussia and stated that Adenauer and Dorten’s true aim is to simply turn the Rhineland into a new Prussia. Although such an accusation is so heinous that it ought to be laughed out, some have suggested that we instead reach for peace with the Bavarians and compromise with them so as to maintain stability in the government.
 rhein.federals.9.a: "Давайте бросим им кость." # Let's throw them a bone.
 rhein.federals.9.b: "Они не имеют права указывать нам, как управлять страной." # They have no right to tell us how to run a country.

 rhein.federals.10.t: "Сепаратистский выезд" # The Separatist Departure
 rhein.federals.10.d: "Сепаратисты в правительстве сделали смелый шаг и выполнили свое обещание. Отказываясь сотрудничать дальше с правительством, которое, по их мнению, враждебно по отношению к их автономии, сепаратисты Пфальца вместе со своими рейнскими друзьями покинули правительство.\n\nТакой шаг нанес почти смертельный удар по власти Дортена в федералистском движении. Поскольку большая часть его электората либо ушла, либо разочаровалась в борьбе, его впадение в немилость вполне может наступить раньше, чем ему хотелось бы." # In a bold move, the separatists in-government have made good on their promise. Refusing to cooperate any further with a government that they feel is hostile towards their autonomy, the Palatinate separatists along with their Rhenish friends have left the government.\n\nSuch a move has proved a near-fatal blow to Dorten’s power within the federalist movement. With much of his base having either left or grown disillusioned from the infighting, his fall from grace may very well come sooner than he would like.
 rhein.federals.10.a: "Будь они прокляты!" # Curse them!

 rhein.federals.11.t: "Довольные баварцы" # Satisfied Bavarians
 rhein.federals.11.d: "Несмотря на первоначальное возмущение нашей готовностью уступить пфальцским сепаратистам, баварские эмигранты, по-видимому, начали сдерживать свое недовольство правительством. Поскольку на данный момент главной угрозой свободе Германии является Берлин, многие изгнанники из Рейха решили сплотить ряды с сепаратистами, готовыми бороться против навязывания тирании и отчаяния свободным немцам." # In spite of their initial outrage at our willingness to concede to the Palatinate separatists, the Bavarian exiles have seemingly begun to pipe down their discontent with the government. With Berlin being the primary threat to Germany’s freedom as of now, the many exiles from the Reich have opted to close ranks with the separatists - prepared to fight against the imposition of tyranny and despair upon the free Germans.
 rhein.federals.11.a: "Не обычное зрелище..." # Not a usual sight...

 rhein.federals.12.t: "Федеральный вопрос" # The Federal Question
 rhein.federals.12.d: "Хотя большинство предсказывали, что в какой-то момент мы провозгласим свое намерение возглавить более федеральную и свободную Германию, в этом еще предстоит убедиться. Многие республиканцы все еще надеются, что создание федеративного государства можно отложить до тех пор, пока Германия не освободится от своих валькистских повелителей.\n\nВ свою очередь, новоиспеченный лагерь федералистов боролся за то, чтобы новая федеративная республика стала нашей главной целью. Конечно, некоторые предложения о будущей федерации оказались не чем иным, как красиво сформулированными предложениями о конфедерации немецких государств, которая увидела бы Германию более разделенной, чем когда-либо в ее истории. Тем не менее, политический спрос на те или иные действия по определению будущего государства вырос до небывало высокого уровня, и теперь мы должны решить, будем ли мы продолжать создание новой федеративной Германии." # Although most predicted that we would at some point proclaim our intent to lead a more federal and free Germany, this has yet to be made certain. Many republicans still hold out hope that the federal state can be delayed until Germany has been liberated from her valkist overlords.\n\nIn turn, the newly-minted federalist camp has fought for our goal for a new federal republic to be our main goal. Of course, some proposals for the federation to come have proved nothing more than nicely worded proposals for a confederation of German states that would see Germany more divided than ever in its history. Nevertheless, the political demand for some form of action to determine the state’s future has grown to an all-time high, and now we must decide if we are to proceed with the creation of the new federal Germany.
 rhein.federals.12.a: "Вперед!" # Onwards!
 rhein.federals.12.b: "Давайте не будем слишком поспешными." # Let's not be too hasty.

 rhein.federals.13.t: "«Веймареры» наносят ответный удар" # The \"Weimarers\" Strike Back
 rhein.federals.13.d: "После инаугурационной речи [RHI.GetLeaderName] должны были начаться дебаты о будущем свободной Германии. К сожалению, первые минуты вскоре будут наполнены не надеждой и видением федерального видения, а горечью и злобой старых республиканцев. Указывая на почти неоспоримую власть Дресслера в Баварии как на пример безумного федерализма и на то, что валкистское движение объединяется с теми, кто выступает за более федеральное решение, «веймарцы» сделали продолжение конференции по меньшей мере трудным делом.\n\nТаким образом, мы можем идти двумя путями. Их обструкционизм и простое нежелание работать внутри системы не сделали эти окаменелости 1920 года привлекательными для широкой публики. С другой стороны, многие отмечают, что изгнание этих республиканцев подорвет легитимность не только федералистского движения, но и республиканской мантии, которую мы утверждаем." # Following the inaugural speech of [RHI.GetLeaderName], the debate on the future of free Germany was to begin. Unfortunately, the first minutes would soon be filled with not the hope and vision of the federal vision, but the bitterness and venom of the old republicans. Pointing to Dressler’s near uncontested hold in Bavaria as an example of federalism run mad and that the Valkist movement allying with those who would favour a more federal solution, the \"Weimarers\" have made continuing the conference a difficult affair to say the least.\n\nWe can thus tread upon two paths. Their obstructionism and plain unwillingness to work within the system has not endeared these fossils of 1920 to the general public. On the other hand, many point out that expelling these republicans would sully the legitimacy of not only the federalist movement, but also the republican mantle that we claim to uphold.
 rhein.federals.13.a: "Они могут заблудиться." # They can get lost.
 rhein.federals.13.b: "Выслушайте их." # Hear them out.

 rhein.federals.14.t: "Контракт или диктант?" # Vertrag oder Diktat?
 rhein.federals.14.d: "Шли дни, и на передний план обсуждения вышел еще один болезненный вопрос. Ненавистный Версальский договор, диктат Запада Германии — это тема, которую немногие немцы хотели бы обсуждать, и еще меньше немцев когда-либо приняли бы. Официальное отторжение Рейнской области ради ее немецкой родины среди других непонятных и жестоких условий не вызывало никаких сомнений в том, что договор необходимо, по крайней мере, пересмотреть, а то и вовсе отменить.\n\nНо это было в прошлом. В настоящее время Берлин категорически отверг договор, в то время как нам теперь предоставлен выбор: принять на себя обязательства, которые договор теоретически связывает Германию. Учитывая, что Лондон и Париж больше заинтересованы в разгроме Берлина, чем в сдерживании нас, мало кто обеспокоен исходом повторных переговоров. С другой стороны, полное принятие договора не вызовет любви к нам ни у одного уважающего себя немца и может даже сигнализировать о постоянной потере глобального уважения и престижа." # As the days have worn on, another painful matter has risen to the forefront of discussion. The hated treaty of Versailles, the dictate of the West upon Germany is a topic that few Germans would like to discuss and even fewer would ever accept. Officially ripping away the Rhineland for its German homeland amongst other baffling and cruel stipulations, there was little doubt that the treaty had to at least be re-negotiated, if not overturned entirely.\n\nBut that was the past. In the present, Berlin has outright rejected the treaty whilst we are now left with the choice of taking up the commitments that the treaty theoretically binds Germany with. Considering that London and Paris are more interested in the defeat of Berlin than in restraining us, few are worried about the outcome of the renegotiation. On the other hand, accepting the treaty in entirety would not endear us to any self-respecting German and may even signal the permanent loss of global respect and prestige.
 rhein.federals.14.a: "Мы должны принять реальность." # We must accept reality.
 rhein.federals.14.b: "Без комментариев." # No comment.

 rhein.federals.15.t: "Возрождение федеральной структуры" # Reviving the Federal Structure
 rhein.federals.15.d: "По мере продолжения конференции стало возникать все больше вопросов о том, как именно будет действовать новое государство. Насколько могущественным будет новое центральное правительство? Могут ли государства выбрать любое правительство, которое они пожелают? Какой будет столица этой новой республики? Будет ли новое федеральное государство вообще федеративной республикой?\n\nМногие сепаратисты, особенно те, кто является союзником Ганса Адама Дортена, предпочитают возродить ту или иную форму немецкой конфедерации. Объединение Германии Пруссией было ошибкой, и не только в смысле прусского угнетения, но и в смысле насильственного связывания государств ближе, чем они когда-либо могли бы возникнуть естественным путем. Со своей стороны, Аденауэр, по-видимому, остался посередине, явно не желая злить теперь совершенно разъяренных членов Центрума в пользу враждебного Дортена.\n\nПоскольку многие республиканцы объявляют призывы сепаратистов изменой и отказываются уступать им какие-либо позиции, теперь нам предстоит выйти из тупика. Это, конечно, легче сказать, чем сделать, но не слишком ли сложно будет отложить столь важный вопрос на потом?" # As the conference rolls on, more questions about how exactly the new state will operate have begun to emerge. How powerful will the new central government be? Can states opt for any government they wish? What shall the capital of this new republic be? Will the new federal state even be a federal republic?\n\nMany separatists, especially those allied with Hans Adam Dorten vastly prefer to revive some form of German confederation. The unification of Germany by Prussia was a mistake and not merely in the sense of Prussian oppression, but the forced binding of states closer together than they would have ever naturally come. For his part, Adenauer has seemingly remained in the middle, clearly unwilling to anger the now utterly enraged members of Zentrum in favour of the hostile Dorten.\n\nWith many republicans declaring the calls by the separatists as treason and refusing to concede any ground to them, now it is up to us to break the deadlock. This of course is easier said than done, but surely it would not be too difficult to postpone such an important question until later?
 rhein.federals.15.a: "...потребуется равноправная конфедерация государств." # ...will necessitate an equal confederation of states.
 rhein.federals.15.b: "...потребуется союз свободных государств." # ...will require a union of free states.
 rhein.federals.15.c: "...это будет вопрос в другой раз." # ...will be a matter of another time.

 rhein.federals.16.t: "Последние слова" # The Last Words
 rhein.federals.16.d: "По мере того, как конференция подходит к концу, многие участники конференции чувствуют надежду и оптимизм, которых никогда раньше не было со времен революции 1920 года. Однако теперь то, что мы говорим последним перед закрытием, стало горячим вопросом в закулисных кабинетах правительства. Некоторые считают, что нам следует подчеркнуть важность воссоединения, хотя это может создать впечатление, что федеративное государство будет средством достижения цели – свободной Германии. С другой стороны, федералисты призывают нас придерживаться идеи федерализма: не будет ли прусская демократия в конце концов такой же ужасной, как немецкая тирания?" # As the conference begins to wind down, many in the conference are feeling hope and optimism that has never before been witnessed since the revolution of 1920. Now however, what we say last before closing has become a hot issue in the backrooms of government. Some opine that we should emphasize the importance of reunification, though this would give the impression that a federal state would be the means to an end that is free Germany. On the other hand, federalists have urged us to stick to the federalist message - would not a Prussian democracy in the end be as awful as a German tyranny?
 rhein.federals.16.a: "Объединенная Германия важнее всего!" # A united Germany is most important!
 rhein.federals.16.b: "Что хорошего в единстве без свободы?" # What is the good in unity without freedom?

 rhein.federals.17.t: "Промышленный скептицизм" # Industrial Skepticism
 rhein.federals.17.d: "Похоже, что, несмотря на все наши усилия, направленные на то, чтобы смягчить интеграцию социал-демократов в коалицию, некоторые из наших промышленных сторонников выразили серьезную обеспокоенность. Самое важное то, что Пол Сильверберг, ведущий сталелитейный и угольный магнат, сплотил ключевую группу промышленников в знак протеста против вступления СДПГ в нашу коалицию. Хотя это, очевидно, их право на это, это все равно вызывает вопросы относительно их истинных намерений..." # It seems that despite our best efforts to sooth over our integration of the social democrats into the coalition, some of our industrial backers have raised serious concerns. Most relevant of all, Paul Silverberg, a key steel and coal magnate, has rallied a key group of industrialists in protesting the entry of the SPD into our coalition. Whilst this is obviously their right to do so, it still raises questions as to their true intent...
 rhein.federals.17.a: "Серьезно?" # Seriously?

 rhein.federals.18.t: "Капиталистический бунт" # The Capitalist Revolt
 rhein.federals.18.d: "Шаг, который был ожидаемым, но тем не менее шокирующим, заключался в том, что промышленное крыло ДФП теперь пригрозило выйти из партии. При поддержке крупных магнатов Пола Сильверберга, эти корпоративные марионетки потребовали, чтобы мы полностью разорвали союз с социал-демократами, иначе они уйдут вместе со всей финансовой и материальной поддержкой, предоставленной DFP тяжелой промышленностью.\n\nТеперь это ставит нас в затруднительное положение. Учитывая, что ДФП является важнейшим партнером в коалиции, допустить их дальнейший развал не будет в интересах продвижения федералистского государства. С другой стороны, многие считают, что такая угроза пуста и мало что дает, кроме веса некоторых элит." # In a move that was to be expected but still shocking all the same, the industrial wing of the DFP has now threatened to secede from the party. Supported by major magnates Paul Silverberg, these corporate puppets have demanded that we break off from allying with the social democrats entirely, otherwise they will leave along with all the financial and material support granted to the DFP by heavy industry.\n\nThis now puts us in a difficult position. With the DFP as a crucial partner in the coalition, allowing them to collapse further would not be in the interest of forwarding the federalist state. On the other hand, many feel that such a threat is hollow and with little to it beyond the weight of some elites..
 rhein.federals.18.a: "Они не могут определять нашу демократию." # They cannot determine our democracy.
 rhein.federals.18.b: "Мы должны принести некоторые болезненные жертвы во имя свободы." # We must make some painful sacrifices in the name of freedom.

 rhein.federals.19.t: "Изношенная коалиция" # Fraying Coalition
 rhein.federals.19.d: "Наше решение приостановить коалиционные переговоры с социал-демократами, как и ожидалось, не было ими воспринято хорошо. Назвав нашу капитуляцию перед тяжелой промышленностью реакционной, социал-демократы зашли так далеко, что отказались от любого дальнейшего сотрудничества с демократическим правительством, пока мы идем по нынешнему пути.\n\nЭтот подстрекательский ответ можно встретить только путем дальнейших переговоров или путем принятия решения твердо противостоять социал-демократам. Хотя первый вариант действий, несомненно, окажется дорогостоящим и трудным, второй может оказаться слишком опасным, чтобы его рассматривать, если мы не сможем полагаться на слабость СДПГ." # Our decision to stall coalition negotiations with the social democrats has predictably not been taken well by them. Denouncing our capitulation to heavy industry as reactionary, the social democrats have even gone so far as to refuse any further collaboration with the democratic government so long as we continue down the current path.\n\nThis incendiary response can only be met by either further negotiation or by deciding to stand fast against the social democrats. Whilst the former course of action will no doubt prove costly and difficult, the latter may prove to be too dangerous to consider unless we can rely on the SPD’s weakness.
 rhein.federals.19.a: "Они вольны оставаться безнадежными обструкционистами." # They are free to remain hopelessly obstructionist.
 rhein.federals.19.b: "Компромисс – это наш бизнес." # Compromise is our business.

 rhein.federals.20.t: "Еще одно поражение социал-демократии" # Another Defeat for Social Democracy
 rhein.federals.20.d: "Поскольку СДПГ отказалась от какого-либо дальнейшего сотрудничества, а мы отказываемся продолжать сотрудничество с ними, пока они это делают, похоже, что мы зашли в тупик с социалистами. К счастью для нас, такой тупик не оказался выгодным для социал-демократов. Поскольку их политика обструкционизма оказалась неспособной помешать нам управлять страной, социал-демократы снова погрузились в нестабильность, и стало очевидно, что они не вернутся в качестве заслуживающей доверия политической силы в ближайшее время." # With the SPD having refused any further cooperation and our refusal to continue cooperation with them as long as they do so, it appears that we have reached an impasse with the socialists. Luckily for us, such an impasse has not proven beneficial for the social democrats. With their policy of obstructionism proving unable to stop us from governing, the social democrats have devolved back into instability with it becoming apparent that they will not return as a credible political force any time soon.
 rhein.federals.20.a: "Социализм не заразит Рейн!" # Socialism shall not infect the Rhine!

 rhein.federals.21.t: "Провал демократии" # A Failure of Democracy
 rhein.federals.21.d: "Похоже, мы неправильно сделали ставку, отказавшись от дальнейшего сотрудничества с социал-демократами. Успешно представив нас слабыми центристами, неспособными спасти немецкую демократию, социал-демократы доказали свою способность бороться с нами как с конкурирующей политической силой, а это означает, что они останутся занозой на нашем глазу на долгие годы." # It seems that we have gambled wrongly when it came to refusing further cooperation with the social democrats. Successfully framing us as feeble centrists unable to rescue German democracy, the social democrats have proven able to combat us as a rival political force - meaning that they will remain as a thorn in our side for the years to come.
 rhein.federals.21.a: "Проклятие..." # Damn...

 rhein.federals.22.t: "Промышленная сделка" # The Industrial Bargain
 rhein.federals.22.d: "Кажется, что промышленники выполнили свое обещание, расколов Свободных демократов в еще одном случае либерального раскола. Поскольку Немецкая народная партия реформируется, превращаясь в рабов тяжелой промышленности, теперь мы должны решить, сможем ли мы каким-то образом повернуть эту ситуацию в свою пользу.\n\nК счастью для нас, промышленники дали нам шанс сделать это. Угрожая лишить законного республиканского правительства всей финансовой и материальной поддержки, промышленники, похоже, готовы увидеть, как федеральный проект пойдёт прахом. Однако если мы будем сотрудничать с другими демократическими партиями, мы наверняка сможем противостоять им и заставить других магнатов по крайней мере подчиниться, если не подчиниться." # It seems that the industrialists have made good on their promise, splitting the Free Democrats in yet another case of liberal splintering. As the German People’s Party reforms along the lines of being the slaves of heavy industry, we must now decide whether we will be able to somehow turn this situation in our favour.\n\nLuckily for us, the industrialists have given us the chance to do so. Threatening to withhold all financial and material support from the rightful republican government, the industrialists are seemingly prepared to see that the federal project go up in smoke. If we cooperate with the other democratic parties however, we will most certainly be able to resist them and to force the other magnates into at least compliance if not submission.
 rhein.federals.22.a: "Он, конечно, шутит?" # Surely he is kidding?
 rhein.federals.22.b: "Может быть, есть золотая середина?" # Maybe there is a middle ground?

 rhein.federals.23.t: "Забастовка магнатов" # The Strike of the Magnates
 rhein.federals.23.d: "К сожалению, кажется, что промышленники выполнили свое обещание прекратить всякую материальную и финансовую поддержку от нас. С уходом Сильверберга из правительства наши экономические перспективы наверняка ухудшились, поскольку многие задаются вопросом, сколько времени пройдет, прежде чем мы сможем компенсировать потерю экономического производства." # Rather unfortunately, it seems that the industrialists have made good on their promise to withhold all material and financial support from us. With Silverberg leaving the government, our economic prospects have most certainly diminished as many wonder how long it will take before we can make up for the lost economic output.
 rhein.federals.23.a: "Магнаты бастуют? Как иронично..." # Magnates striking? How ironic...

 rhein.federals.24.t: "Сильверберг уходит в отставку" # Silverberg Resigns
 rhein.federals.24.d: "Вместе с другими демократическими партиями мы выступили против махинаций тяжелой промышленности. Поскольку другие магнаты, похоже, боятся слишком сильно раскачивать лодку и настроить общественность против них, Сильверберг оказался в неприемлемой ситуации. Объявив сегодня о своей отставке, промышленник, похоже, навсегда покинул правительство, поскольку демократия продолжает гордо стоять на Рейне. Его замена, в свою очередь, должна, как мы надеемся, быть гораздо более подходящей для демократии и нынешнего правительства." # Together with the other democratic parties, we have made our stand against the machinations of heavy industry. With other magnates seemingly afraid of rocking the boat too much and turning the public against them, Silverberg has found himself in an untenable situation. Announcing his resignation today, the industrialist has seemingly left government for good as democracy continues to proudly stand on the Rhine. His replacement should in turn hopefully be much more amenable to democracy and the current government.
 rhein.federals.24.a: "Никто не будет скучать по нему..." # No one will miss him...

 rhein.federals.25.t: "Компромиссы повсюду" # Compromises All Over
 rhein.federals.25.d: "Кажется, что весь кризис, в котором мы оказались, удалось разрядить, пусть и самым посредственным способом. Поскольку наши переговоры завершились компромиссом как с левыми, так и с правыми, правительство может быть спокойным, зная, что мир сохранен – хотя и только за счет нашего авторитета и имиджа..." # It seems that the whole crisis that we found ourselves in has been defused, if only in the most mediocre way possible. With our negotiations having culminated in compromises with both the left and the right, the government can rest easy knowing that peace has been maintained - though only at the cost of our credibility and image...
 rhein.federals.25.a: "По крайней мере, никто не восстал!" # At least no one revolted!

 RHI_reichstagwahl: "Выборы в Рейхстаг [GetYear]" # Reichstagswahl [GetYear]
 RHI_bundestagwahl: "Федеральные выборы [GetYear]" # Bundestagswahl [GetYear]
 RHI_landtagwahl: "Государственные выборы [GetYear]" # Landtagswahl [GetYear]
 rhein.federals.26.d: "В свободной Германии пришло время провести выборы, чтобы все немцы могли услышать свои голоса. На руинах погибшего Рейха возникло несколько основных партий, стремящихся оказаться во главе правительства.\n\nТрадиционная партия умеренных консерваторов и католиков, Центрум, получила новый импульс в результате недавней войны, хотя это произошло из-за того, что Центр столкнулся с наибольшим количеством разногласий с начала старой республики. Поскольку партия еще не решила, будет ли она продолжать поддерживать католическую мантию или превратиться в межконфессиональную консервативную партию, многие предсказывают, что окончательная судьба партии будет решена на выборах.\n\n[RHI_spd_election_desc]\n\n[RHI_lib_election_desc]" # With a free Germany, the time has come for elections to be held so that all Germans may make their voices heard. Out of the rubble of the deceased Reich, several main parties have emerged - seeking to find themselves at the head of government.\n\nThe traditional party for moderate conservatives and Catholics, Zentrum has been reinvigorated by the recent war, though this has come with the Centre facing the most divisions since the beginning of the old republic. With the party undecided whether it shall continue to uphold the Catholic mantle or to turn itself into a cross-denominational conservative party, many predict the elections will decide as to the party’s ultimate fate.\n\n[RHI_spd_election_desc]\n\n[RHI_lib_election_desc]
 RHI_spd_election: "Несмотря на сокрушительные неудачи последних десятилетий, социал-демократы успешно оправились. Традиционно являясь партией рабочего класса, многие надеются, что возрожденный демократический дух и вновь обретенный социалистический дух приведут к тому, что СДПГ вернется к электоральному доминированию, которое она когда-то имела во время Веймарской революции." # In spite of their crippling failures during the past decades, the Social Democrats have successfully bounced back. Traditionally the party for the working class, many hope that the reinvigorated democratic spirit and a newfound socialist spirit will lead to the SPD returning to the electoral dominance they once held during Weimar.
 RHI_ru_election: "Со свободной Рейнской областью открылась новая партия немецкого пролетариата. Лига независимости, возглавляемая напыщенным Йозефом Фридрихом Маттесом, переименовала себя в «Рейнский союз», пообещав лучшую жизнь давно борющимся рабочим Рейнской области. Получив легитимность в ходе недавнего конфликта, некоторые предсказывают, что они могут даже принять на себя мантию социал-демократии – по крайней мере, в Рейнской области." # With a free Rhineland, the new party for the German proletariat has unveiled itself. Led by the bombastic Josef Friedrich Matthes, the Independence League has rebranded itself as the \"Rhenish Union\", promising a better life for the long-struggling workers of the Rhineland. Having been legitimized over the course of the recent conflict, some predict that they might even take on the mantle of social democracy - at least in the Rhineland.
 RHI_dstvp_election: "Либеральное движение столкнулось со многими неудачами в течение веймарской эпохи, но, пожалуй, самым разрушительным на сегодняшний день стал раскол либерального движения. Поскольку ДВП и ДДП находились на противоположных сторонах одной и той же либеральной медали, обе партии пытались объединить политическое движение буржуазного среднего класса в единую политическую партию. Хотя это могло закончиться неудачей еще в 1930 году, новая политическая атмосфера оказалась благоприятствующей слиянию либеральных партий, что стало выполнением наследия, которое Штреземан надеялся оставить после себя." # The liberal movement has faced many failures over the course of the Weimar era, but perhaps the most crippling by far was the splintering of the liberal movement. With the DVP and DDP on opposite sides of the same liberal coin, both parties attempted to fuse the bourgeois middle-class political movement together in a single political party. Whilst this might have ended in failure back in 1930, the new political atmosphere has proved conducive to the merger of the liberal parties - fulfilling the legacy Stresemann hoped to leave behind.
 RHI_dpd_election: "Мало кто мог предсказать, что печально известный сепаратист Ганс Адам Дортен когда-либо станет преобладающим лидером либерального движения, но его союз с Аденауэром вскоре изменил судьбу. После отмены чрезвычайного положения в Рейхе Дортен сотрудничал с другими либералами, чтобы сформировать гораздо более широкую и федералистскую буржуазную партию, несомненно, пользующуюся значительным благосклонностью к промышленникам вдоль Великого Рейна." # Few could have predicted that the infamous separatist Hans Adam Dorten would ever become the predominant leader of the liberal movement, but his alliance with Adenauer would soon shift fate. With the end of the state of emergency in the Reich, Dorten has collaborated with other liberals to form a much more big-tent and federalist bourgeois party, no doubt with significant favour towards the industrialists along the great Rhine.
 RHI_rhp_election: "Однако Лига независимости — не единственное сепаратистское движение, претерпевшее ребрендинг после победы рейнского духа. Собирая тех, кто не является ни католиком, ни марксистом, Рейнская народная ассоциация во главе с Хансом Адамом Дортеном преобразовалась в «Рейнскую партию Родины», обещая создать более свободную и процветающую Рейнскую область. Хотя Дортен, возможно, и не самый стойкий либерал в бывшем Рейхе, энтузиазм по поводу сепаратистского движения придал его движению актуальность, смешанную со страхом перед предполагаемым радикализмом Маттеса." # The Independence League however is not the only separatist movement to have rebranded following the victory of the Rhenish spirit. Gathering those who are neither Catholic nor Marxist, the Rhenish People’s Association led by Hans Adam Dorten has reformed into the \"Rhenish Homeland Party\", promising to bring about a more free and prosperous Rhineland. While Dorten may not be the staunchest liberal in the former Reich, enthusiasm for the separatist cause has buoyed his movement into relevance, mixed with a fear of the supposed radicalism of Matthes.
 RHI_irrelevant_libs: "Однако либеральному лагерю повезло меньше. Поскольку и социал-демократы, и Центр высасывают большую часть политического кислорода, либералы не помогли себе и расколом между больным движением Дортена и старыми либералами Веймара. Таким образом, их борьба на этих выборах во многом спорна, и теперь единственным фактором, на который они играют, является исход будущего либерального движения." # The liberal camp however has not been so lucky. With both the social democrats and Centre sucking out much of the political oxygen, the liberals have not helped themselves either with a split between Dorten’s ailing movement and the old liberals of Weimar. Their contest in this election is thus in many ways moot and now the only factor they play is the outcome of the future liberal movement.
 rhein.federals.26.a: "Истина-Закон-Свобода-выберите центр!" # Wahrheit - Recht - Freiheit - wählt Zentrum!
 rhein.federals.26.b: "Мы хотим свободных граждан – свободной экономики – голосуйте за [RHI_lib_name]!" # Wir wollen Freie Bürger - Freie Wirtschaft - wählt [RHI_lib_name]!
 rhein.federals.26.c: "Сила в единстве – голосуйте за [RHI_spd_name]!" # In der Eintracht liegt die Macht - wählt [RHI_spd_name]!
 RHI_postwar_zentrum: "§LПравда - Справедливость - Свобода - Центр голосования!§!\n\n§CМы будем играть на этих выборах с точки зрения Центра.§!" # §LTruth - Justice - Freedom - vote Centre!§!\n\n§CWe will play these elections from the perspective of Zentrum.§!
 RHI_postwar_liberals: "§LМы хотим свободных граждан - свободной экономики - голосуйте [RHI_lib_name]!§!\n\n§OМы будем играть на этих выборах с точки зрения [RHI_lib_name].§!" # §LWe want free citizens - free economy - vote [RHI_lib_name]!§!\n\n§OWe will play these elections from the perspective of the [RHI_lib_name].§!
 RHI_postwar_socdems: "§LВ этом сила единства - голосуйте [RHI_spd_name]!§!\n\n§SМы будем играть на этих выборах с точки зрения [RHI_spd_name].§!" # §LTherein Unity Lies Power - vote [RHI_spd_name]!§!\n\n§SWe will play these elections from the perspective of the [RHI_spd_name].§!

 rhein.federals.26.tt: "§2С окончанием войны антивалкистские настроения охватили всю страну, что сделало валкизм крайне непопулярным§!" # §2With the end of the war, an anti-Valkist mood has settled in across the nation - making Valkism highly unpopular§!

 rhein.federals.27.t: "Башня" # The Tower
 rhein.federals.27.d: "Каково будущее Центра? С момента установления республики этот вопрос не давал покоя старой партии. Созданная для противостояния «Культуркампфу», развязанному Бисмарком после образования Германии, партия служила оплотом республики. Тем не менее, он изо всех сил пытается решить, чем ему стать. Для многих членов партии сохранение статуса исключительно католической партии может лишь означать постоянную неспособность противостоять социал-демократам по ключевым вопросам, а также вынудить партию вечно играть третье колесо в коалициях. Превращение партии в межконфессиональную христианскую партию с дружественными рабочими аспектами позволило бы ей раз и навсегда одержать победу над своими либеральными и левыми конкурентами.\n\nС другой стороны, такое открытие партии для всех конфессий просто привело бы к концу консервативных протестантских партий, которые засоряли старую республику. Это также означало бы общий сдвиг вправо, которому, таким образом, противостояли многие представители левого крыла партии, которые считают, что наибольшей оппозицией Центруму исторически были протестантские прусские правые, а не социал-демократы, с которыми они чувствуют большую демократическую близость." # What is the future of Zentrum? Ever since the arrival of the republic, this question has haunted the old party. Created to oppose the Kulturkampf waged by Bismarck following the formation of Germany, the party has served as a bulwark of the republic. Yet, it struggles to decide what it shall become. For many within the party, keeping the party as an exclusively Catholic party can only herald a continued inability to oppose the social democrats on key issues as well as force the party to forever play third wheel in coalitions. The opening of the party into a cross-denominational Christian party with labour friendly aspects would allow it to once and for all triumph over its liberal and left-wing competitors.\n\nOn the other hand, such an opening of the party to all denominations would simply result in the end of the conservative Protestant parties that littered the old republic. This would also mean an overall shift to the right which has thus been opposed by many on the left-wing of the party who feel that the greatest opposition to Zentrum historically has been the protestant Prussian right rather than the social democrats with which they feel a greater democratic affinity for.
 rhein.federals.27.a: "Центрум остался и останется!" # Zentrum has remained and shall remain!
 rhein.federals.27.b: "Пришло время покинуть башню." # It is time to leave the tower.

 rhein.federals.28.t: "Разделенная середина" # The Divided Middle
 rhein.federals.28.d: "Даже несмотря на единство либеральных партий, направление немецкого либерализма все еще остается неясным. Одной из ошибок 1932 года, которая остается неоспоримой, является потеря народной поддержки валкистов. Эта потеря привела к избранию Дресслера и последующему краху Веймара. Хотя социал-демократия и ее популистские подражатели всегда будут оставаться привлекательными для рабочего класса, это не означает, что немецкий либерализм также не должен прилагать усилия, чтобы что-то ему дать. В конце концов, разве не правда, что все немцы должны иметь равные возможности?\n\nКонечно, правое крыло новой партии требует иного мнения. Поддержки рабочего класса было недостаточно для того, чтобы валькизм закрепился. Раскол партий среднего класса на ссорящиеся группы интересов, которые в конечном итоге танцевали под обманчивую дудку валькизма, подорвал способность старой Народной партии противостоять валкистскому движению. Немецкий либерализм находит своих сторонников преимущественно среди среднего класса, так не должен ли он оставаться там?" # Even with the unity of the liberal parties, the direction of German liberalism still remains murky. One of the mistakes of 1932 that remains undeniable is the loss of popular support to the Valkists. This loss resulted in the election of Dressler and the ensuing collapse of Weimar. While social democracy and its populist imitators will always remain attractive to the working class, it does not mean that German liberalism ought also to not make an effort to provide something to them. After all, is it not true that all Germans should have equal opportunity?\n\nOf course, the right-wing of the new party begs to differ. Support from the working class was not enough for Valkism to take hold. The splintering of the middle class parties into squabbling interest groups that ultimately danced to Valkism’s deceiving tune crippled the ability of the old People’s Party to oppose the Valkist movement. German liberalism finds its supporters predominantly among the middle class, so should its focus not remain there?
 rhein.federals.28.a: "Границу класса необходимо пересечь." # The class boundary must be crossed.
 rhein.federals.28.b: "Мы никогда не подчинимся пролам!" # We will never subjugate ourselves to proles!

 rhein.federals.29.t: "Будущее социал-демократии" # Social Democracy's Future
 rhein.federals.29.d: "Неспособность социал-демократов предотвратить рост валькизма, несомненно, будет рассматриваться как одна из самых позорных глав в долгой истории партии. Еще более важным будет безудержное сотрудничество между жестокими валкистами и гипернационалистическими тенденциями внутри партии, которое можно рассматривать только как чудовищное предательство демократии и республики. Как бы то ни было, реальность большевизма и других более радикальных тенденций лишь ожесточила сердца многих социал-демократов к экстремизму – нужны действия, но не насилие!\n\nНа первый план выходят отношения между социал-демократами и коммунистами. Выступая против либеральной демократии и республики, КПГ, возможно, была так же виновна, как и валкисты, которым, как они утверждали, они противостояли при падении республики. Эта линия мысли вызвала множество бурных дебатов внутри СДПГ. Разве валкизм не мог бы закрепиться, если бы утвердился единый фронт пролетариата?" # The failure of the social democrats to prevent the rise of Valkism is no doubt one that will be looked upon as one of the most shameful chapters of the party’s long history. Even more so will be the rampant collaboration between the brutish Valkists and hyper-nationalist tendencies within the party, which can only be deemed as a monstrous betrayal of democracy and the republic. Be that as it may, the reality of Bolshevism and other more radical tendencies have only hardened the hearts of many social democrats to extremism - action is needed, but not violence!\n\nComing to the foray is the relationship between the social democrats and the communists. Standing against liberal democracy and the republic, the KPD were arguably just as culpable as the Valkists they claimed to oppose in the fall of the republic. This line of thought has inspired much vigorous debate within the SPD, surely Valkism could not have taken hold if a united front of the proletariat had taken hold?
 rhein.federals.29.a: "Мы не можем скатиться к еще большему радикализму." # We cannot slip into more radicalism.
 rhein.federals.29.b: "Только объединенная сила рабочих остановит валькизм!" # Only the united power of the workers will stop Valkism!

 rhein.federals.30.t: "Либеральное примирение" # The Liberal Reconciliation
 rhein.federals.30.d: "После восстановления республики немецкий либерализм должен был определить свой следующий шаг. Разделение либеральных партий на две ссорящиеся партии среднего класса, несомненно, было одним из величайших провалов ноябрьской революции и большим сожалением величайшего государственного деятеля республики Густава Штреземана.\n\nТеперь, когда приближаются выборы, либеральные партии увидели в этом шанс раз и навсегда объединиться для создания единого фронта немецкого либерализма. Демократическая партия и Народная партия объединились вокруг либеральных принципов Германии, а также двойной победы как немецкого государства, так и народа, будь то из рабочего класса или на самом верху. Объединение в новую немецкую государственную народную партию многие видят в этом потенциальном индикаторе возрождения либерализма как силы в немецкой политике." # With the republic’s restoration, German liberalism had to decide its next move. The division of the liberal parties into two squabbling parties of the middle class was undoubtedly one of the great failures of the November revolution and a great regret of the republic’s greatest statesman, Gustav Stresemann.\n\nNow with elections coming soon, the liberal parties have seen this as the chance to once and for all come together for a united front of German liberalism. The Democratic Party and People’s Party have united around a liberal principle for Germany as well as the dual victory of both the German state and people, whether they be from the working class or at the very top. Coalescing into a new German State People’s Party, many see this as a potential indicator of the revival of liberalism as a force in German politics.
 rhein.federals.30.a: "Знак грядущих событий?" # A sign of things to come?

 rhein.federals.31.t: "Результаты [GetYear]" # Ergebnisse [GetYear]
 rhein.federals.31.d: "Судьбоносный день настал. Учитывая, что не только Рейнская область, но и Германия в целом находятся на перепутье своей истории, многие предсказывают, что эти выборы окажутся самыми судьбоносными с 1932 года. Учитывая, что все партии сплотились в меру своих возможностей, а демократическое будущее Германии выглядит светлым, кажется, что выборы привели к..." # The fated day has come. With not merely the Rhineland, but Germany as a whole at a crossroads in her history, many predict that these elections will prove to be the most fateful since 1932. With all parties rallying to the best of their ability and the democratic future of Germany looking bright, it seems that the elections have resulted in...
 rhein.federals.31.a: "Социал-демократическое большинство!" # A Social Democrat majority!
 rhein.federals.31.b: "[RHI_conservative_party] большинство!" # A [RHI_conservative_party] majority!
 rhein.federals.31.c: "Лево-либеральная коалиция!" # A Left-Liberal coalition!
 rhein.federals.31.e: "Республиканская коалиция!" # A Republican coalition!
 rhein.federals.31.f: "Правая коалиция!" # A Right-Wing coalition!
 rhein.federals.31.g: "Левая коалиция!" # A Left-Wing coalition!
 rhein.federals.31.h: "Большая коалиция!" # A Grand coalition!
 rhein.federals.31.l: "Либеральное большинство?!" # A Liberal majority?!

 rhein.federals.32.t: "Новое либеральное движение" # The New Liberal Movement
 rhein.federals.32.d: "Глава возрожденного либерального движения, будучи убежденным сепаратистом, шокировал многих, но для Дортена это просто переход к чему-то новому. Благодаря тому, что его партия успешно сплачивает либеральный средний класс и открывает новые веяния в немецкой политике, Дортен переименовал DFP, «продукт кризиса», в более общую Демократическую партию Германии – DPD.\n\nОднако это название не может по-настоящему отразить новую линию либеральной политики. Выступая по-прежнему за продолжающуюся децентрализацию государств, а также за полное уничтожение прусского влияния в политике, эта новая партия вполне может сигнализировать об усилении сепаратизма в немецкой жизни в обозримом будущем." # The head of the revitalized liberal movement being a staunch separatist has shocked many, but for Dorten it is simply a transition into something new. With his party successfully rallying the liberal middle class and new winds in German politics, Dorten has rebranded the DFP, a \"product of crisis\" into a more generic Democratic Party of Germany - DPD.\n\nThe name however fails to truly capture the new line of liberal politics. Advocating still for a continued decentralization of the states as well as the total annihilation of Prussian influence from policy, this new party may well signal the entrenchment of separatism in German life for the foreseeable future.
 rhein.federals.32.a: "Интересных моментов предостаточно." # Interesting times abound.

# Same as rhein.federals.26
 rhein.federals.33.d: "Наступили новые выборы. Хотя последние выборы, без сомнения, были самыми значительными со времени падения старой республики, эти новые выборы, тем не менее, по-прежнему вызывают столь же горячую борьбу со стороны партий всех сторон, которые видят в них возможность достичь беспрецедентной значимости." # New elections have come around. While the last ones were no doubt the most significant since the end of the old republic, these new elections are still nevertheless just as hotly contested with parties on all sides seeing this as their opportunity to rise to unprecedented relevance.
 rhein.federals.33.a: "Социал-демократы захватывают правительство!" # The Social Democrats take the government!
 rhein.federals.33.b: "[RHI_conservative_party] большинство!" # A [RHI_conservative_party] majority!
 rhein.federals.33.c: "Либеральное расстройство!" # A Liberal upset!

 rhein.federals.34.t: "Наши союзники в правительстве" # Our Allies in Government
 rhein.federals.34.d: "После завершения выборов пришло время выбрать партнера по коалиции для нового правительства. Многие партии борются за определенное влияние на принятие будущих решений, поскольку немецкая демократия продолжает свою великую работу по обеспечению свободы, единства и справедливости для всех. Тем не менее, слишком большое количество партнёров может не создать жизнеспособное правительство, что заставит нас решать, каким будет наш следующий шаг." # With the elections over, the time has come for us to pick our coalition partner for the new government. Many parties vye for some influence in future decision-making as German democracy continues its great work of bringing about freedom, unity and justice to all. Still, too many partners may not create a viable government, forcing us to decide what our next move shall be.
 rhein.federals.34.a: "Либералы будут способствовать нашей повестке дня." # The liberals will aid our agenda.
 rhein.federals.34.b: "Социал-демократы вполне могут оказаться полезными" # The Social Democrats may well prove useful
 rhein.federals.34.c: "Центр – наши естественные союзники!" # The Centre are our natural allies!
 rhein.federals.34.e: "В наше время необходима большая коалиция!" # A grand coalition in these times is needed!

 rhein.federals.35.t: "Возмущенные левые" # The Outraged Left
 rhein.federals.35.d: "Граница между социал-демократией и истинным социализмом исторически оставалась довольно расплывчатой. Это совершенно очевидно в СДПГ, нынешней правящей партии, которая сейчас испытывает из-за этого внутренние трения. Недавняя политика нашего правительства, по-видимому, сигнализировала об очевидном повороте вправо среди левых СДПГ, что вызвало враждебность со стороны их фракции. Хотя мы могли бы успокоить их, замедлив предполагаемую «правую» политику, такая уступка вполне может нанести ущерб нашей способности работать с центром и вызвать дальнейший внутренний раскол." # The line between social democracy and true socialism has historically remained rather vague. This is quite apparent in the SPD, the current ruling party which is now experiencing internal friction due to it. Our government’s recent policies have seemingly signalled an apparent turn to the right among the left-wing of the SPD, which has incurred hostility from their faction. While we could appease them by slowing down supposed ‘rightist’ policy, such a concession may very well harm our ability to work with the center and cause further internal division.
 rhein.federals.35.a: "Они не более чем инструменты коммунистов." # They are nothing more than tools of communists.
 rhein.federals.35.b: "Умиротворите их." # Appease them.

 rhein.federals.36.t: "Призрак Спартака" # The Ghost of Spartakus
 rhein.federals.36.d: "История отношений между СДПГ и крайне левыми в Германии часто была полна предательств со стороны каждой заинтересованной стороны. Теперь мы подходим к еще одной потенциальной точке трения между немецкими левыми, но, к сожалению, похоже, что она исходит изнутри. Более умеренные элементы в партии ясно выразили свое недовольство нашим предполагаемым поворотом к радикализму, который теперь открывает дверь для остановки любого процесса пролетарского единства в Германии. Хотя они правы в том, что крайне левые не всегда считали демократический процесс важным, некоторые призывают нас продолжать идти по этому пути, чтобы мы не повторили ошибок прошлого и не оттолкнули немецкий пролетариат." # The history between the SPD and the far-left in Germany has often been fraught, with betrayal at every corner by every party concerned. We now reach another potential point of friction between the German left, except it unfortunately seems to come from within. More moderate elements in the party have made clear their displeasure at our supposed turn to radicalism, which now opens the door to halting any process of proletarian unity in Germany. While they are right that the far left have not always held the democratic process as important, some urge us to continue down this route lest we repeat the errors of old and alienate the German proletariat.
 rhein.federals.36.a: "Мы не будем совершать ошибок прошлого." # We will not make the mistakes of the past.
 rhein.federals.36.b: "У них есть смысл..." # They have a point...

 rhein.federals.37.t: "Устранение валкистов" # The Removal of Valkists
 rhein.federals.37.d: "Нет большего пятна в истории социал-демократии, чем переход многих из них в валкистское движение. Их обманом заставили поверить в ложного бога Дресслера, и их бегство не принесло ничего, кроме позора немецким рабочим, а также значительно усложнило процесс девалькификации.\n\nЭтому теперь конец. С сегодняшнего дня в СДПГ могут быть вновь приняты только самые банальные члены организации Валкист и их тираническая команда. Все бывшие элементы, сотрудничавшие с валкистской бедой, будь то высокопоставленные бюрократы или простые члены партии, должны быть исключены из партии – долой валкистизм!" # There is no greater stain on the history of social democracy as is the defection of many of them to the Valkist movement. Fooled into believing the false god of Dressler, their defection has done nothing but bring shame upon the German worker as well as make the process of de-Valkification far more difficult.\n\nThis now ends. From today onwards, only the most banal members of the Valkist organization and their tyrannical crew may be re-accepted into the SPD. All former elements who cooperated with the Valkist scourge, whether they be high-ranking bureaucrats or lowly party members, shall be purged from the party - down with Valkism!
 rhein.federals.37.a: "Их предательство запомнят как следует." # Their betrayal will be remembered as it should be.

 rhein.federals.38.t: "Революция развязана" # The Revolution Unleashed
 rhein.federals.38.d: "Пришло время революции сделать следующий шаг. Поскольку социал-демократическое движение теперь твердо настроено на единство всех рабочих против двойной гидры капитализма и валкизма, бывший канцлер подал в отставку. Вместо него канцлером был назначен Отто Гротеволь, поскольку Германия теперь готовится продолжать полезную работу демократии для народа и для народа." # The time has come for the revolution to take the next step. With the social democratic movement now firmly trained towards the unity of all workers against the dual hydras of capitalism and Valkism, the now-former chancellor has resigned. In his stead, Otto Grotewohl has been appointed chancellor as Germany now readies herself to continue the good work of a democracy for and by the people.
 rhein.federals.38.a: "Дух 1919 года вернулся!" # The spirit of 1919 has returned!

 rhein.federals.39.t: "Коммунистический вопрос" # The Communist Question
 rhein.federals.39.d: "Хотя крах республики можно возложить на ультраправых, которые дестабилизировали демократию, прежде чем приступить к полному диктаторскому свержению республики, большую часть вины можно также возложить на коммунистов. КПГ и ее родственные партии были такими же антиреспубликанскими, как и валькисты, которых они провозглашают ненавидеть, позиционируя себя как «единственную настоящую антивалкистскую партию».\n\nЭто предательство должно быть наказано. Коммунисты, конечно, по-прежнему не являются друзьями демократии и во многом все еще цепляются за желание видеть советскую Германию, где истинным хозяином является Москва. И все же, может быть, не стоит слишком торопиться? Многие до сих пор помнят свое сотрудничество в борьбе с валкизмом, помощь, которая была крайне необходима во время беспрецедентного кризиса." # As much as the failure of the republic can be put at the feet of the far-right, who destabilized democracy before engaging in a total dictatorial overthrow of the republic, much of the blame can also be put on the communists. The KPD and its sister parties were all just as anti-republican as the Valkists they proclaim to hate, indulging themselves as the ‘only true anti-Valkist party’.\n\nThis treachery ought to be punished. The communists certainly still remain no friend of democracy and in many ways still cling on to the desire to see a Soviet Germany where the true master is Moscow. Still, perhaps we should not be too hasty? Many still remember their cooperation in fighting Valkism, aid that was sorely needed in a time of unprecedented crisis.
 rhein.federals.39.a: "Они предали республику – и получат по заслугам." # They betrayed the republic - and will get what they deserve.
 rhein.federals.39.b: "Это слишком много, не так ли?" # This is a bit much, is it not?

 rhein.federals.40.t: "Либеральное слияние" # The Liberal Merger
 rhein.federals.40.d: "С созданием нового республиканского правительства на Рейне, похоже, остатки ДВП потеряли терпение по отношению к демократам. Сотрудничая с довольно незначительной, но влиятельной Рейнской народной ассоциацией, ДВП и РВ потрясли политическую систему новостями о своем слиянии в единую партию.\n\nПоскольку такое действие кажется совершенно неуместным для национал-либералов ДВП, многие размышляют о том, как это слияние вообще было допущено. Будь то давление со стороны промышленных магнатов прежнего мандата или симпатия к строгому антисоциализму Дортена, нет никаких сомнений в том, что теперь новая либеральная партия будет бороться за свободную Германию." # With the creation of a new republican government on the Rhine, it seems that the rump DVP have lost their patience with the Democrats. Working with the rather minor yet influential Rhenish People's Association, the DVP and RV have sent shockwaves through the political system with news of their merger into a singular party.\n\nWith such an action seeming totally out of place for the national liberals of the DVP, many have speculated as to how the merger was even let through. Whether it be due to pressure by the industrial magnates of the former mandate or sympathy with Dorten’s strict anti-socialism, there is little doubt that now, a new liberal party shall fight towards a free Germany.
 rhein.federals.40.a: "Это не похоже на решение..." # This does not seem like a solution...

# something something unification(none of these are organized...)
# writers, use [?RHI.unification_path.GetTokenLocalizedKey] to get the currently selected unification path
 rhein.unification.1.t: "[?RHI.unification_path.GetTokenLocalizedKey]" # [?RHI.unification_path.GetTokenLocalizedKey]
 german_union: "Унижение Пруссии" # Prussia's Humiliation
 german_republic: "1919 г. отомщен" # 1919 Avenged
 authoritarian_german_republic: "Возвращение Шлейхера" # Schleicher's Comeback
 rhein.unification.1.d: "Мало кто думал, что это возможно, но когда солнце рассветает над новым миром, истина становится ясной. Благодаря отваге наших войск и мужеству немецкого народа мы не только освободили Германию от сокрушительной тяжести валкистской тирании, но теперь приняли на себя мантию новой Германии. Этот день, несомненно, запомнят с любовью как момент, когда Германия наконец сможет вздохнуть и вернуть себе свое место в мире." # Few thought it possible, but as the sun dawns upon a new world, the truth makes itself clear. Through the bravery of our forces and the courage of the German people, we have not only freed Germany from the crushing weight of Valkist tyranny, but now have taken the mantle as the new Germany. This day will no doubt be remembered fondly as the point where Germany at last is able to breathe and reclaim her place in the world.
 rhein.unification.1.a: "Да здравствует свободная Германия!" # Es lebe das freie Deutschland!
 rhein.unification.1.tr: "§LДа здравствует свободная Германия!§!" # §LLong live Free Germany!§!

 rhein.unification.2.t: "Сближение с Германией?" # Rapprochement with Germany?
 rhein.unification.2.d: "Новое правительство Германии обратилось к нам с просьбой, которая, безусловно, кажется странной, но в то же время значительной. Они просили нас примириться и похоронить обиды Великой войны и последовавшей за ней войны, а также всю напряженность, существовавшую с тех пор.\n\nЭто предложение было встречено с большим ликованием, особенно теми, кто достаточно взрослый, чтобы помнить ужасы первой войны. Новое правительство Германии доказало свою ответственность, и нет никаких сомнений в том, что примирение является первым шагом к вечному миру в Европе." # The new German government has come to us with a request, a request that by far seems peculiar and yet significant. They have asked for us to reconcile and to bury the grudges of the Great War and the war following that as well as all the tensions that have existed since then.\n\nThis offer has been met with much jubilation, especially by those old enough to remember the horrors of the first war. The new German government has proven responsible and there is no doubt that reconciliation is the first step towards eternal peace in Europe.
 rhein.unification.2.a: "Нам нужно оставить шрамы прошлого позади." # We need to leave the scars of old behind.
 rhein.unification.2.b: "Никогда не забывайте – и гуннам никогда не будут прощены!" # Never forget - and the Huns will never be forgiven!

 rhein.unification.3.t: "Согласование с [FROM.GetNameDef]" # Reconciliation with [FROM.GetNameDef]
 rhein.unification.3.d: "Похоже, что наше предложение [FROM.GetNameDef] было любезно встречено: к нам направилась делегация, чтобы обсудить дальнейшие детали нашего примирения. Это будет первый шаг к новой, более мирной Европе." # It seems that our offer to [FROM.GetNameDef] has been met graciously, with a delegation making its way over to negotiate further details of our reconciliation. This will be the first step towards a new, more peaceful Europe.
 rhein.unification.3.a: "Давайте помиримся." # Let us make peace.

 rhein.unification.4.t: "[FROM.GetNameDefCap] отказывается мириться" # [FROM.GetNameDefCap] Refuses to Reconcile
 rhein.unification.4.d: "К сожалению, наше предложение [FROM.GetNameDef] было жестоко отвергнуто. Похоже, что в своей мстительной позиции по отношению к нам [FROM.GetNameDef] решили нанести вред делу мира в Европе." # Sadly, our offer to [FROM.GetNameDef] has been viciously shot down. It seems that in their vengeful attitude towards us, [FROM.GetNameDef] has opted to harm the cause of peace in Europe.
 rhein.unification.4.a: "Ну что ж." # Oh well.

 rhein.unification.5.t: "Членство в Европейском экономическом сообществе?" # Membership in the European Economic Community?
 rhein.unification.5.d: "Сегодня мы получили предложение от [FROM.GetNameDef] присоединиться к их недавно созданному экономическому союзу. Получив новый импульс, несмотря на жестокую войну, которая только недавно закончилась, эта новая Германия провозгласила свое желание объединить Европу не в войне, а в мире. Хотя эта цель действительно интригует своим потенциалом, некоторые, более подозрительно относящиеся к Германии, призывают нас полностью отказаться от нее - до тех пор, пока Германия снова не докажет, что ей можно доверять." # Today, we have received an offer from [FROM.GetNameDef] to join their newly created economic union. Having been reinvigorated despite the brutal war that only recently ended, this new Germany has proclaimed its desire to bring Europe together not in war but instead peace. While this goal is truly intriguing as to the potential it contains, some more suspicious of Germany have urged that we refuse it outright - until Germany has proved herself trustworthy again.
 rhein.unification.5.a: "Мы можем от этого только выиграть." # We can only gain from this.
 rhein.unification.5.b: "Германия никогда не будет заслуживать доверия." # Germany will never be trustworthy.

 rhein.unification.6.t: "[FROM.GetNameDefCap] Принимает!" # [FROM.GetNameDefCap] Accepts!
 rhein.unification.6.d: "Мы получили известие, что [FROM.GetNameDef] с радостью принял наше предложение, и дипломаты обеих сторон встретились, чтобы формализовать такое положение дел. Теперь мы можем вместе продолжать надеяться на более процветающую и мирную Европу." # We have received word that [FROM.GetNameDef] has happily accepted our offer, with diplomats on both sides meeting to formalize this state of affairs. We can now continue to look forward to a more prosperous and also peaceful Europe, together.
 rhein.unification.6.a: "Давайте выпьем за новую Европу!" # Let us toast to a new Europe!

 rhein.unification.7.t: "[FROM.GetName] Отказывается!" # [FROM.GetName] Refuses!
 rhein.unification.7.d: "К несчастью, [FROM.GetNameDef] отказался от нашего предложения о членстве в новом экономическом сообществе. К сожалению, нам придется попытаться построить новую, более мирную и процветающую Европу без помощи [FROM.GetNameDef]." # In an unfortunate turn of events, [FROM.GetNameDef] has refused our offer of membership in the new economic community. We will sadly have to attempt to build a new, more peaceful and prosperous Europe without the aid of [FROM.GetNameDef].
 rhein.unification.7.a: "Как они могли?" # How could they?

 rhein.unification.8.t: "[RHI.GetNameDefCap] покидает [THIS.GetFactionName]" # [RHI.GetNameDefCap] Leaves the [THIS.GetFactionName]
 rhein.unification.8.d: "Похоже, что после окончания военных действий [RHI.GetNameDef] решил пойти своим путём. Хотя некоторые, возможно, предвидели это, поскольку немецкое государство предпочло бы обеспечить свое собственное будущее в мире, другие встревожены, опасаясь, что их уход может ознаменовать дальнейшую потерю влияния в Германии и, возможно, в остальной Европе." # With the end of hostilities, it seems that [RHI.GetNameDef] has opted to go its own way. While some may have seen this coming as the German state would rather secure its own future in the world, others are dismayed, fearing that their withdrawal could herald a further loss of influence in Germany and potentially the rest of Europe.
 rhein.unification.8.a: "Позор." # A shame.


# "Вкус" # Flavor

 rhein.flavor.1.t: "Шульте, Фриц" # Schulte, Fritz
 rhein.flavor.1.d: "Родился: 28.7.1890 в Хюстене.\nПрофессия: рабочий\nГражданин: Германского рейха\nПсевдонимы: Зима, Фидлер.\n\nБудучи фанатичным коммунистом с 1922 года, Шульте был депутатом рейхстага от коммунистов, национальным лидером Революционного союза оппозиции. До декабря 1932 года он нелегально руководил остатками этого союза в Германии. Бывший член Политбюро и ЦК КПСС. Член Красной помощи. Беглец с 1930 года!\nС мая 1932 года он работал курьером коммунистов в Германии.\n\n1933: Прага - отправился в Прагу для участия в заседании Политбюро.\n\n1934: Стокгольм - Деятельность неизвестна.\n\n1935: Копенгаген - Является главой объединенного фронта ссыльных красных профсоюзов, базирующихся в городе. Имеет связи с политическими офисами коммунистов в Париже и за рубежом." # Born: 28.7.1890 in Hüsten\nProfession: Worker\nCitizen of: German Reich\nAliases: Winter, Fiedler.\n\nHaving been a fanatical communist since 1922, Schulte was a Reichstag member for the communists, national leader of the Revolutionary Union Opposition. Until December 1932, he had illegally guided the remnants of this union in Germany. Former member of the Political Bureau and the Central Committee of the Communist Party. Member of Red Aid. A fugitive since 1930!\nSince May 1932, he has acted as a courier for the communists in Germany.\n\n1933: Prague - Went to Prague to participate in a Politburo meeting.\n\n1934: Stockholm - Activity unknown.\n\n1935: Copenhagen - Is the head of the united front of exiled red trade unions based in the city. Has connections to the political offices of the communists in Paris and abroad.
 rhein.flavor.1.a: "Он не может бежать вечно!" # He can’t run forever!

 rhein.flavor.2.t: "Межреакционная борьба" # Inter-Reactionary Struggles
 rhein.flavor.2.d: "Даже если антипрусские настроения были значительно подкреплены приходом к власти тиранического берлинского правительства, непрерывный натиск прусских террористических атак и сопротивление близоруких социалистов доказали, что нам предстоит пройти долгий путь в отношении общественной поддержки.\n\nДаже если наши французские благодетели привели нас к власти, мы должны быть осторожны, чтобы не позволить ситуации выйти из-под контроля - иначе нас выгонят так же быстро, как мы пришли..." # Even if anti-Prussian sentiments have been greatly bolstered by the rise of the tyrannical Berlin government, the continuous onslaught of Prussian terror attacks and resistance by myopic socialists have proven that we have a long way to go in regards to public support.\n\nEven if our French benefactors have propelled us to power, we must be careful not to let things get too out of hand - lest we find ourselves kicked out as fast as we came in...
 rhein.flavor.2.a: "Будем надеяться, что они оба проиграют!" # Let's hope they both lose!

 rhein.flavor.3.t: "Социалисты и сепаратисты" # Socialists and Separatists
 rhein.flavor.3.d: "Сепаратистское движение имеет богатую историю, и в его рядах уже долгое время ведется борьба. Будь то Дортен и его долгое сотрудничество с французскими властями или Маттес и его неумелая неумелая работа с большей частью предоставленной ему помощи, сепаратисты Рейнской области часто теряли многое в обмен на небольшую выгоду для своих французских благотворителей.\n\nПроисходя из рабочего класса, Йозеф Смитс сделал себе имя как один из передовых радикалов сепаратистского движения. Первоначально Смитс был политиком независимых социал-демократов, но вскоре присоединился к, казалось бы, растущему сепаратистскому движению, получив помощь от бельгийцев для создания якобы социалистической, в основном революционной сепаратистской партии. За годы своего мандата Смитс, по большей части не имеющий никакого значения, пережил множество покушений, а с ростом сепаратистского движения обрел второе дыхание в популярности. Помимо него, другие видные социалисты, такие как Карл Лейднер и Георг Кунц, также распространяли призывы к социализму наряду с независимостью Рейнской области от Пруссии, что осложняло наши отношения с Лондоном и Парижем." # The separatist movement is a storied one, with infighting having plagued its ranks for a long time. Whether it be Dorten and his long past with the French authorities, or Matthes and his inept bungling of much of the aid granted to him, the Rhineland separatists have often lost much in return for little gain for their French benefactors.\n\nHailing from a working class background, Josef Smeets made a name for himself as one of the foremost radicals of the separatist movement. Originally a politician for the Independent Social Democrats, Smeets would soon hop onto the seemingly growing separatist movement, gaining aid from the Belgians to set up an ostensibly socialist, mainly revolutionary separatist party. Having floated in mainly irrelevancy during the years of the mandate, Smeets would survive many assassination attempts and with the rise of the separatist movement has gained a second wind in popularity. Besides him, other prominent socialists like Carl Leidner and Georg Kunz also spread the call for socialism along with the Rhineland's independence from Prussia - making our relations with London and Paris difficult.
 rhein.flavor.3.a: "Какая головная боль..." # What a headache...

 rhein.flavor.4.t: "Молодое Рейнское государство" # The Young Rhenish State
 rhein.flavor.4.d: "Даже если антипрусские настроения были значительно подкреплены приходом к власти тиранического берлинского правительства, непрерывный натиск прусских террористических атак и сопротивление близоруких социалистов доказали, что нам предстоит пройти долгий путь в отношении общественной поддержки.\n\nДаже если наши французские благодетели привели нас к власти, мы должны быть осторожны, чтобы не позволить ситуации выйти из-под контроля - иначе нас выгонят так же быстро, как мы пришли..." # Even if anti-Prussian sentiments have been greatly bolstered by the rise of the tyrannical Berlin government, the continuous onslaught of Prussian terror attacks and resistance by myopic socialists have proven that we have a long way to go in regards to public support.\n\nEven if our French benefactors have propelled us to power, we must be careful not to let things get too out of hand - lest we find ourselves kicked out as fast as we came in...
 rhein.flavor.4.a: "Со временем они научатся..." # They will learn in time...

 rhein.flavor.5.t: "Национальный террор" # Völkisch Terror
 rhein.flavor.5.d: "Мы только что получили сообщения от местных сил безопасности о том, что пангерманские террористы совершили нападение на правительственные учреждения и инфраструктуру, пытаясь посеять страх и хаос в Рейнской области. Хотя у них есть разногласия с Берлином, эти подонки преследуют одну и ту же цель: снова подчинить Рейнскую область прусскому господству и уничтожить нашу свободу." # We have just received reports from local security forces that pan-German terrorists have launched an attack on government offices and infrastructure, attempting to induce fear and chaos into the Rhineland. Whilst they have their differences with Berlin, these scumbags share the same goal of subjugating the Rhineland back to Prussian domination and of the destruction of our freedom.
 rhein.flavor.5.a: "Будь они прокляты!" # Damn them!

 rhein.flavor.6.t: "Валкистская агитация" # Valkist Agitation
 rhein.flavor.6.d: "Недавно поступили тревожные сообщения о том, что в последнее время наблюдается всплеск волнений валкистов. Помимо обычных брошюр и радиопередач, валкистские ораторы начали проводить демонстрации, гневно осуждая нас, а иногда даже подстрекая людей к бунту и повергая Рейн в хаос. Хотя с ними в основном разобрались, их возвращение является еще одним свидетельством ненасытного желания Берлина сожрать Европу и уничтожить свободу на континенте." # Recently, disturbing reports have come in suggesting that there has been a surge in Valkist agitation as of late. Besides the usual pamphlets and broadcasts, Valkist speakers have begun making demonstrations, angrily denouncing us and at times even inciting people to riot and launch the Rhine into chaos. Though they have been mostly dealt with, their return is yet another indication of Berlin's unsatiated desire to gobble up Europe and destroy freedom on the continent.
 rhein.flavor.6.a: "Предателям и пораженцам здесь не место!" # Traitors and defeatists have no place here!

 rhein.flavor.7.t: "Коммунистическое вредительство" # Communist Wrecking
 rhein.flavor.7.d: "Несмотря на наши попытки освободить рейнских рабочих от позорного положения создателей прусской армии посредством огромного количества оружия, которое может производить Рейн, некоторые предполагаемые «освободители», похоже, думают иначе. Недавние сообщения показали, что коммунисты начали намеренно саботировать производство, выводить из строя важное оборудование и вообще отказываться работать. Хотя с этим быстро разобрались, мы все равно должны сохранять бдительность..." # Despite our attempts to liberate the Rhenish workers from the disgraceful position as the creators of Prussian armies through the massive level of arms the Rhine can output, some supposed \"liberators\" seem to think otherwise. Recent reports have shown that communists have begun deliberately sabotaging production, wrecking important equipment and generally refusing to work. Whilst this has been quickly dealt with, we must still remain vigilant...
 rhein.flavor.7.a: "Паразиты..." # Parasites...

 rhein.flavor.8.t: "Антивалкистская организация" # Anti-Valkist Organizing
 rhein.flavor.8.d: "Наша позиция как последней остановки перед попытками Берлина поглотить и в процессе уничтожить Западную Европу привлекла в Рейнскую область многих фанатиков антивалкистского движения. Многие из них, достойные восхищения в своем противостоянии тирании Берлина, к сожалению, также являются социалистами, которые предпочли бы, чтобы нас свергли и заменили каким-то типом социалистического режима, при этом большинство из них стекается в социалистические партии Смитса и коммунистов. В любом случае, их работа усложнила нашу работу." # Our position as the last stop before Berlin attempts to swallow and in the process destroy Western Europe has attracted many zealots of the anti-Valkist movement to the Rhineland. Admirable in their opposition to Berlin’s tyranny, many are unfortunately also socialists who would rather see us overthrown and replaced by some type of socialist regime with most of them flocking to the socialist parties of Smeets and the communists. Either way, their work has made our job more difficult.
 rhein.flavor.8.a: "Ба!" # Bah!

 rhein.flavor.10.t: "Антивалкистское движение за рубежом" # The Anti-Valkist Movement Overseas
 rhein.flavor.10.d: "Даже если большинство антивалкистских эмигрантов из Германии по праву приехали в Рейнскую область, чтобы подготовиться к антивалкистскому крестовому походу, некоторые из них выбрали более эзотерические места для продолжения борьбы. Что касается Мексики и Швейцарии, мы должны продолжать работать над сопротивлением и окончательным уничтожением валкистской Германии, и для этого требуется их помощь.\n\nОднако некоторые сетуют на нашу просьбу к зарубежным немцам, как на комнатную собачку, при этом сепаратисты особенно презирают идею о том, что Рейнская область примет мантию антивалкистской Германии. Многие также считают, что зарубежные группы мало что могут предложить по сравнению с гораздо более централизованным и могущественным Рейнским государством в наших усилиях по сопротивлению и уничтожению валкизма. Тем не менее, Рейнская область не может надеяться сравниться с Германией в одиночку." # Even if most anti-Valkist émigrés from Germany have rightfully come to the Rhineland to prepare themselves for the anti-Valkist crusade, some have chosen more esoteric locations to continue the struggle. As far as Mexico and as close as Switzerland, we must continue to work towards the resistance and eventual destruction of Valkist Germany and to do so requires their aid.\n\nHowever, some bemoan our request to overseas Germans as lap dog behaviour, with separatists especially despising the idea that the Rhineland will take the mantle of the anti-Valkist Germany. Many also believe that overseas groups have little to offer compared to the much more centralised and powerful Rhenish state in our efforts to resist and destroy Valkism. Nevertheless, the Rhineland cannot hope to match Germany alone.
 rhein.flavor.10.a: "Мы возьмем все, что сможем!" # We'll take anything we can get!

 rhein.flavor.11.t: "Движение свободной Германии" # Bewegung Freies Deutschland
 rhein.flavor.11.d: "В последние несколько лет времена сильно ударили по Германии, и многие немцы не видели другого выбора, кроме как мигрировать. Многие бежали в мандаты, другие в Америку и еще многие в разные места. Одним из таких мест была Мексика, где синархическое правительство неохотно давало немецким эмигрантам возможность затаиться. Другой была Швейцария, страна, известная своим нейтралитетом.\n\nНе только в этих государствах, но и во многих других, эти эмигранты не сталкивались ни с чем, кроме проблем, в сплочении любого рода антивалкистского движения, даже если такие движения кажутся нам явно выгодными. Тем не менее решимость истинного немецкого государства призвала их к действию. Движение «Свободная Германия», организованное во многих отделениях по всему миру, включая Швецию и Великобританию, пожертвовало все, что могло, на наше дело, хотя оно и узаконило многочисленные левые элементы внутри него." # With times having hit Germany hard in the last few years, many Germans saw no choice but to migrate. Many fled to the mandates, others to America and many more to a variety of places. One such place has been Mexico, with the synarchist government begrudgingly allowing the German émigrés the opportunity to lay low. Another has been Switzerland, a nation famed for its neutrality.\n\nIn not only these states but many others, these émigrés have faced nothing but trouble in rallying any kind of anti-Valkist movement, even if such movements seem obviously beneficial to us. Nevertheless, the resoluteness of the true German state has called them to action. Organized in many chapters across the world including Sweden and Britain, the Free Germany Movement has donated what it can to our cause - though it has legitimized the numerous leftist elements within it.
 rhein.flavor.11.a: "Долой валькизм!" # Down with valkism!

 rhein.flavor.12.t: "Соединенные в Штатах" # United in the States
 rhein.flavor.12.d: "Хотя большинство немцев, бегущих в Америку, отказываются участвовать в какой-либо политической деятельности, есть те, кто готов продолжать антивалкистскую борьбу оттуда. Поскольку социал-демократы, ныне известные как SoPaDe, терпят постоянные бедствия после прихода к власти Валкиста в 1932 году, финансирование вскоре станет серьезной проблемой для партии, возглавившей ноябрьскую революцию.\n\nЧтобы облегчить это, в Нью-Йорке будет создана «Немецкая рабочая делегация», целью которой будет сбор средств и поддержка изгнанных социал-демократов через связи с американским рабочим движением. Однако эта делегация не добилась такого успеха, как надеялись - в первую очередь из-за разделения левых сил.\n\nЗигфрид Ауфхойзер, долгое время являвшийся председателем Allgemeiner Freier Angestelltenbund, начал призывать внутри SoPaDe к союзу со своим заклятым врагом в лице коммунистов для создания антивалкистского движения против Берлина. За это Ауфхойзер вскоре был исключен из социал-демократов, но, тем не менее, он вместе с Карлом Бёхелем продолжал агитировать в Америке за более левую СДПГ – и все с целью свержения и уничтожения злого режима [GER.GetLeader]." # Whilst most Germans who flee to America refuse to partake in any kind of political activity, there are some who are prepared to continue the anti-Valkist struggle from there. With the social democrats, now known as SoPaDe having suffered continuous disasters since the Valkist takeover in 1932, funding would soon become a major worry for the party that led the November revolution.\n\nTo alleviate this, a \"German Labour Delegation\" would be set up in New York City, aiming to raise funds and support for the exiled social democrats through connections with the American labour movement. However, this delegation has not been as successful as hoped - most especially because of leftist division.\n\nLong-time chairman of the Allgemeiner freier Angestelltenbund, Siegfried Aufhäuser would begin to call within the SoPaDe for an alliance with their arch-nemesis in the communists for an anti-valkist movement against Berlin. For this, Aufhäuser would soon find himself expelled from the social democrats, but nevertheless he alongside Karl Böchel continue to agitate from America for a more leftist SPD - all with the goal of the overthrow and destruction of [GER.GetLeader]’s wicked regime.
 rhein.flavor.12.a: "Доказательство того, что валькизм может объединить только одну группу – своих противников." # Proof that valkism can only unite one group - its opponents.

 rhein.flavor.13.t: "Пожертвования из Парижа" # Donations from Paris
 rhein.flavor.13.d: "Хотя поворот Берлина к тирании в первую очередь затронул добрых немцев, которые хотят сохранить себя и свою страну свободными, не каждая целевая группа пользуется таким большим уважением. Дьявольские коммунисты с их бесконечными атаками на республику, которая позволила им это сделать, в первую очередь окажутся мишенью валькистов, и в конечном итоге они рассеются по ветру от Парижа до Праги и Москвы.\n\nОднако при довольно тревожном повороте событий эти антиреспубликанские, антидемократические силы, по-видимому, отправили нам символическое количество помощи. Хотя наши запросы, по-видимому, остались без внимания, наши левые союзники против валькизма указали, что это, вероятно, вызвано некоторым чувством взаимного противодействия желанию Берлина подчинить Германию бесчувственному, равнодушному правительству, которое стремится только уничтожить демократию и свободу на этой земле. Даже если в нынешних обстоятельствах от такой помощи и не откажутся, она все равно вызывает некоторые вопросы..." # Whilst Berlin’s turn towards tyranny has primarily affected the good Germans who want to keep themselves and their country free, not every targeted group has been so well-regarded. The devilish communists, with their endless attacks on the republic that enabled them in the first place would find themselves targeted first by the valkists, eventually scattering into the wind from Paris to Prague to Moscow.\n\nIn a rather perturbing turn of events however, these anti-republican, anti-democratic forces have seemingly sent us a token amount of aid. Whilst our inquiries seemingly fall on deaf ears, our left-wing allies against valkism have indicated that this is likely out of some sense of mutual opposition to Berlin’s desire to subjugate Germany under an unfeeling, uncaring government that only seeks to eliminate democracy and freedom from this earth. Even if such aid is not to be refused under the current circumstances, it still raises some questions...
 rhein.flavor.13.a: "Стоит ли нам провериться на яд?" # Should we check for poison?

 rhein.flavor.14.t: "Немецкое Сопротивление" # The German Resistance
 rhein.flavor.14.d: "Хотя было бы трудно сказать, что ни одному немцу не нужно мужества, чтобы противостоять валькизму в нашей свободной Рейнской области, было бы совершенно невозможно измерить, насколько смелы некоторые из нас. В прогнившем Рейхе есть несколько смельчаков, которые решаются изо всех сил помочь нам и саботировать попытки Берлина уничтожить Европу.\n\nОдин из них — Карло Мирендорф, бывший социал-демократ. Затаившись после своего жестокого заключения в тюрьму после прихода к власти Дресслера, Мирендорф остался в Германии, налаживая связи с другими антиправительственными элементами в попытке свергнуть и восстановить свободу Германии. Несмотря на эти тяжелые условия, он успешно собрал некоторые средства и, что наиболее важно, разведданные, которые мы, в свободной Германии, можем использовать, когда придет время раз и навсегда свергнуть Берлин с его золотого трона." # Whilst it would be hard to say that no courage is needed for any German to resist valkism in our free Rhineland, it would be totally impossible to measure just how courageous some among us are. Within the rotten Reich, there lay some brave souls who venture out of their way to help us and sabotage Berlin’s attempts to destroy Europe.\n\nOne among them is Carlo Mierendorff, a former social democrat. Having laid low following his brutal incarceration in the aftermath of Dressler’s takeover, Mierendorff has remained in Germany, making connections with other anti-government elements in a bid to overthrow and restore Germany’s freedom. In spite of these tough conditions, he has successfully raised some funds and most importantly intelligence for us in free Germany to use when the time comes once and for all to throw Berlin from its golden throne.
 rhein.flavor.14.a: "Храбрый..." # Brave...

 rhein.flavor.15.t: "Режим Кобленца" # The Koblenz Regime
 rhein.flavor.15.d: "Поскольку Европа приближается все ближе и ближе к войне, кажется, что [RHI.GetNameDef] обратился к нам с просьбой признать их законным правительством перед лицом Германии. Даже если их цель справедлива, мало кто отрицает, что это еще сильнее свяжет нас с сдерживанием Германии и может навсегда подорвать отношения с ними в обозримом будущем." # With Europe edging closer and closer to war, it seems that [RHI.GetNameDef] has reached out to us, asking us to recognize them as a legitimate government in the face of Germany. Even if their cause is just, there is little denying that this will bind us closer to containing Germany and may permanently torpedo relations with them for the foreseeable future.
 rhein.flavor.15.a: "Мы за демократию!" # We stand for democracy!
 rhein.flavor.15.b: "Незаметно продемонстрировать нашу поддержку." # Discreetly show our support.
 rhein.flavor.15.c: "Давайте не будем рисковать гневом Берлина по безнадежному делу." # Let's not risk Berlin's wrath for a hopeless cause.

 rhein.flavor.16.t: "[FROM.GetName] узнает нас!" # [FROM.GetName] recognizes us!
 rhein.flavor.16.d: "Как и ожидалось, [FROM.GetName] признал нас ответственным и законным правительством Рейнской области. Притязания Берлина на Рейн, по сути, были ослаблены, и мы, в свою очередь, получили больше союзников против угрозы немецкой экспансии." # As hoped for, [FROM.GetName] has recognized us as a responsible and legitimate government in the Rhineland. Berlin’s claim to the Rhine has in essence been weakened and we in turn gain more allies against the threat of German expansion.
 rhein.flavor.16.a: "Ура!" # Huzzah!

 rhein.flavor.17.t: "[FROM.GetName] принимает нас!" # [FROM.GetName] accepts us!
 rhein.flavor.17.d: "Мы получили ответ от [FROM.GetName], в котором говорится, что они молчаливо примут наши претензии как ответственного и законного рейнского правительства, но не смогут нас полностью признать. Хотя такой шаг, несомненно, разочаровывает, его следовало ожидать." # We have received a reply from [FROM.GetName] that suggests that they will tacitly accept our claim as the responsible and legitimate Rhenish government, but that they are not able to fully recognize us. Whilst undoubtedly disappointing, such a move should have been expected.
 rhein.flavor.17.a: "Лучше, чем ничего..." # Better than nothing...

 rhein.flavor.18.t: "[FROM.GetName] игнорирует нас!" # [FROM.GetName] ignores us!
 rhein.flavor.18.d: "К сожалению, похоже, что [FROM.GetName] проигнорировал наш запрос, оставив нас на произвол судьбы в Берлине. Хотя они не обязательно будут прогерманскими, нельзя отрицать, что это нанесло серьезный удар по перспективам сдерживания Германии." # Unfortunately, it seems that [FROM.GetName] has ignored our request, leaving us to the dogs in Berlin. Whilst they may not necessarily be pro-German, it cannot be denied that this has dealt a major blow to the prospect of containing Germany.
 rhein.flavor.18.a: "Неужели они не осознают своей глупости?" # Do they not realize their foolishness?
  
 rhein.flavor.19.t: "The Eagle and the Rooster"
 rhein.flavor.19.d: "Even though we have secured the Rhenish people’s freedom and independence for years to come, there are some who seemingly disagree with the notion of a free Rhenish state. Revolted at our beneficial French ties, Pan-Germanists have taken it upon themselves to expel French influence, in turn causing the French to grow more distrustful of us. If we are to keep the Rhineland free, we must tread lightly..."
 rhein.flavor.19.a: "This does not bode well..."
 RHI_random_anti_separatists: "§YDue to the public's icy opinion on separatism, we will randomly be harrassed by radicals, well-meaning or otherwise.§!"
  
 rhein.flavor.20.t: "[FROM.GetName] asks for weapons"
 rhein.flavor.20.d: "We have received a request from [FROM.Capital.GetCapitalVictoryPointName] that would have us send them military equipment for them to use to build up their defences. Whilst this has the advantage of reinforcing the anti-Valkist bulwark, it may come at the more important cost of our defence."
 rhein.flavor.20.a: "Let us strengthen our buffer."
 rhein.flavor.20.b: "Nonsense, we can handle the Germans ourselves."
  
 rhein.flavor.21.t: "[FROM.GetName] aids us!"
 rhein.flavor.21.d: "Thankfully, [FROM.GetName] has accepted our request for arms, boosting our efforts to build up a force that can resist Germany’s attempts to bring us into their decaying, tyrannical empire."
 rhein.flavor.21.a: "To liberty!"
  
 rhein.flavor.22.t: "[FROM.GetName] refuses us!"
 rhein.flavor.22.d: "Sadly, it seems that [FROM.GetName] has refused to grant us any kind of weaponry, leaving us to produce our own weaponry. Even if they do not realize it, this will not bode well for a war against Berlin."
 rhein.flavor.22.a: "Their loss."
  
 rhein.flavor.23.t: "Terror on the Rhine"
 rhein.flavor.23.d: "Once known for its tranquility and peaceful nature, the Rhine has seen less bloody days. With polarization between French forces and local Germans reaching an all-time high, there can be no doubt that the free Rhenish state is not in a state to resist any kind of attack - let alone one by Germany.\n\nThis has not gone unnoticed in either Paris nor Berlin, recent reports have indicated that troops have already begun to mass along the Rhine with both powers seeming closer than ever to war with the other. Either way, it seems that the Rhenish state may soon enter a dark period in its history..."
 rhein.flavor.23.a: "This is bad."
  
 rhein.flavor.24.t: "The French Takeover"
 rhein.flavor.24.d: "It appears that Berlin has blinked first.\n\nWith French influence at an all-time high, it would not take long before the Tricolour would find itself waving along the streets of Koblenz and Aachen. With the government no longer able to maintain order, the French have opted to simply move in and ensure that order reigns. As government offices find themselves under French control, many have also realized that the French have opted to commandeer much of Rhenish industry and seem on the verge of taking control of virtually every part of the state.\n\nThe reality is that the Rhineland is no longer free. The supposed [RHI.GetName] has now become nothing more than a protectorate, dominated by the French who now prepare to turn the Rhineland into a redoubt against German expansionism. Even despite their seething hatred of these events, Berlin can ill-afford to bash its head against the new Rhenish fortress as the only fate that now befalls the Rhineland is one of exploitation."
 rhein.flavor.24.a: "Shame..."
  
 rhein.flavor.25.t: "Anarchy on the Rhine"
 rhein.flavor.25.d: "Things have utterly collapsed.\n\nWith a very loose coalition of pan-German groups vying for dominance, such an outcome should have been expected. Yet, few realized just what would be the outcome of their victory. With the old government now all but on paper, the many cities on the Rhine from Aachen to Cologne to Ludwigshafen have begun to fall into anarchy. As petty cliques engage in shootouts across the street, terrorists from the communist and valkist groups have already begun declaring governments to launch forth a revolution in the Rhineland.\n\nBut there will be no such revolution. The simple fact is that the state has failed and that the Rhineland is essentially doomed. The only thing that remains to be seen is whether or not Germany or France will swoop in first to rescue the civilians from this state of affairs..."
 rhein.flavor.25.a: "..."
  
 rhein.flavor.26.t: "Berlin on the Hunt"
 rhein.flavor.26.d: "Even if we would like to keep ourselves out of Germany, it seems that Germany cannot stick their nose elsewhere. Once more, Germany has proclaimed their ambitions to the world, desiring to not only overturn Versailles but to also destroy the liberal world order that has given humanity so much.\n\nEven though this is not a declaration of war, many have begun treating it as the first step towards a much bigger conflict. Some even believe that Germany may first strike us before anyone else, making preparations for the grand conflict even more urgent. No matter when or where Germany strikes, we would do well to watch."
 rhein.flavor.26.a: "Worrying."
  
 rhein.flavor.27.t: "The Valkist Strike"
 rhein.flavor.27.d: "So it goes.\n\nFrom their loudspeakers and from their podiums, the Germans speak of an "Hour of Destiny", one where they finally overturn the world order set in 1919 and one that has presided over Germany’s growth and recovery from the war. Yes, there were many missteps and mishandlings, but it was one where the average German lived better than during the archaic days of the Kaiserreich. But now the Reich seeks to steal more, unsatiated with the freedom of Germany, they now must consume and destroy the freedom of all of Europe.\n\nWith Germany now ready to once more enter a cataclysmic war of conquest against Europe, they have set their sights on us. Ready and willing to crush us into dust and smother what’s remaining of free Germany, we must be ready to stand against them. Even if we are all Germans, we will make sure they pay for every inch of land they claim to "liberate"."
 rhein.flavor.27.a: "Es lebe die Freiheit!"
 rhein.flavor.27.tr: "§LLong live freedom!§!"
 RHI_disable_bop_push: "All missions in the balance of power will be cancelled"
  
 rhein.flavor.28.t: "The Parisian Dreamers"
 rhein.flavor.28.d: "The main driver behind the mandate’s creation, the role of the French on the Rhine has often been a source of fear, pride or resentment for all powers involved. With exaggerated fears of French annexation, Paris has had to play a careful balancing act to neither aggravate London nor their domestic nationalists. Luckily for them, they would not be alone in their wish for an autonomous Rhineland, away from Berlin’s dominion.\n\nA former solicitor in the Prussian administration, Hans Adam Dorten would grow to resent the administration that he had served, being mobilized in 1914 and returning from the Great War with a near-psychotic hatred of all things Prussian. Soon, Dorten would dedicate himself to the cause of Rhenish separatism. Following several failed attempts to gain popularity for himself, Dorten would soon find a benefactor in the French, who generously lent him aid at every possible point. Staunchly opposed to any cooperation with the social democrats, Dorten would find himself isolated from most of the political establishment, resulting in his creation of the ‘Rhenish People’s Association’ - an extra-parliamentary organization built for the sole purpose of forwarding Dorten’s ideal for a free Rhenish state. Having found little support amongst the Rhenish public, Dorten wields significant influence amongst the scant few middle-class separatists and as such still is able to command some support from the French.\n\nNevertheless, Dorten’s inability to rally much public support has proven a major deal breaker for the French, who much prefer Josef Friedrich Matthes. A former journalist, Matthes came from a lower-class background and would spend the first few years following Germany’s defeat in the Great War roaming the country, avoiding lawsuits and starting newspapers. Having become a part of the French administration, Matthes would run a black market for tobacco, becoming an editor for the French press in the mandate and soon gaining support among the numerous unemployed and downtrodden workers in the Rhineland. Despite the failure of the first United Rhineland movement, Matthes would continue agitating for a freer Rhenish state - though he has mostly gained the reputation as a French tool amongst those who remain unsympathetic to separatism.\n\nOwing their few political successes to French backing, the Rhenish separatists have not earned a glowing reputation across the mandate - with scandals over their French benefactors being frequent and expected. Many even believe that once the mandate ends, the separatists will find themselves as a sinking treasure ship with no sails."
 rhein.flavor.28.a: "If only they weren’t so incompetent..."
  
 rhein.flavor.29.t: "No More Truce"
 rhein.flavor.29.d: "With the end of the struggle against Valkism and the wretched tyrants of Berlin and Munich, the political truce between the many parties has come to an end. While this was no doubt expected, it is still nevertheless quite unfortunate that free Germans are still unable to overcome petty differences."
 rhein.flavor.29.a: "Alright..."
  
 rhein.flavor.30.t: "The Unthinkable?"
 rhein.flavor.30.d: "With free Germany currently in a mortal struggle for her survival, some have called for a truce with the communists of Germany. Having been an active thorn in our side at the best of times and a threat to Germany’s stability and freedom at the worst, the communists have seemingly scaled down their activities against us with the current war.\n\nAs such, some of our government has called for a truce to be made with the communists. Until Valkism has been vanquished from Germany, they and us will cooperate as far as possible for the ultimate destruction of the Berlin regime. Although this has already been decried as blatant opportunism by some, times are dark and we will certainly need all the help we can get in the struggle."
 rhein.flavor.30.a: "In these times, nothing is off the table."
 rhein.flavor.30.b: "NEVER!"
  
 rhein.flavor.31.t: "Communist Denial"
 rhein.flavor.31.d: "Rather myopically, the communists have denied our request for a truce with the usual revolutionary tone - with a rather puzzling lack of self-preservation clear in their response. As such, we will have to deal with the dual hydras of the red scourge as well as the green one too."
 rhein.flavor.31.a: "As should have been expected."
  
 rhein.flavor.32.t: "A United Front"
 rhein.flavor.32.d: "Surprisingly, the communists have agreed to our request for a truce per their apparent turn in doctrine. Already, communist agitation has shifted away from their anti-republican messaging and the KPD has already begun speaking in our favour both in Germany and abroad."
 rhein.flavor.32.a: "Everything against Valkism!"
  
 rhein.flavor.33.t: "Beginning of the Valkist Trials"
 rhein.flavor.33.d: "With the restoration of justice to Germany and the smiting of the hydra known as Valkism, it is high time for us to begin punishing these thugs for their crimes against the German people and all known decency. With the support of the international community, the courts have now ordered the infamous Valkists of the old Reich to trial. Many onlookers have already begun making predictions as to what the verdict will be - death, imprisonment or acquittal? Some have even gone so far as to say that the trials will leave a mark on whether Germany can truly move beyond Valkism - will it, can it or should it?"
 rhein.flavor.33.a: "Let us get to work!"
  
 rhein.flavor.34.t: "The Valkist Trials: Leaders"
 rhein.flavor.34.d: "As the trials begin, many across Germany and the world have begun watching with great interest as to how we will try the leaders of the Valkist nation. Whether they claim to not be "real valkists" like Artur Mahraun or they proclaim their martyrdom like Ernst von Salomon, many are itching to know whether it shall be the noose or eternal disgrace that shall punish these grand losers.\n\nOn one hand, punishing them with the death penalty is certainly called for. It is not like they would not have done the same thing to us. However, some urge caution as these Valkist traitors still command great respect from many in Germany and their execution may cause a stir."
 rhein.flavor.34.a: "Hang them all!"
 rhein.flavor.34.b: "Show leniency to just the repentant."
  
 rhein.flavor.35.t: "The Valkist Trials: Reichswehr"
 rhein.flavor.35.d: "Next on the stand are the Reichswehr generals. The names of many supposed "heroes" have been read out to the court - Rundstedt, Bock, Kluge, Guderian and so on. Denounced by the court as traitors to Germany, few think that they will be able or even willing to return to active duty and especially not command of the current Reichswehr.\n\nHowever, some civilian leaders have gone a step further, urging that this opportunity be used to ensure that the Reichswehr will no longer act as the bulwark of reaction in the new republic. A republicanization of the military has long been desired - and this trial could prove the spark for such a programme. This of course has been rejected by many existing Reichswehr officers - who themselves may be purged as a result. Furthermore, the disgraced officers have spoken out not just to the court, but to the press here and abroad, speaking rather surprisingly of having been opposed to Dressler’s plans at every step of the way. Although their veracity in being oppositional is questionable, many have eaten up their story, making a harsh punishment harsh on us as well. In any event, what verdict does the court decide on?"
 rhein.flavor.35.a: "They have disgraced Germany and themselves."
 rhein.flavor.35.b: "They can be forgiven."
 rhein.flavor.35.c: "The Stormtroopers are the ones responsible!"
  
 rhein.flavor.36.t: "The Valkist Trials: Reichsgruppe Industrie"
 rhein.flavor.36.d: "Despite their programme of defaced Bolshevism, the Valkists and their allies managed to enlist the cooperation or at least obedience of much of German industry. This might be understandable had we not been present, but the existence of a German exile government demonstrates that at their core, the Reichsgruppe Industrie and their associates are nothing more than profit-driven cowards.\n\nWith large corporate figures like Gustav Krupp and Hjalmar Schacht on trial, many wonder if the verdict will be harsh upon the accused. Coming out in defence for the accused have been the liberal establishment and other magnates of industry and finance, with Paul Silverberg even writing a personal letter to [ROOT.GetLeader] pleading clemency. On the side of accusers, socialists of all stripes have declared the industrialists guilty as charged, pointing to them as not just enablers, but pushers of the Valkist regime. In spite of all of this, what shall the court decide?"
 rhein.flavor.36.a: "They shall face justice."
 rhein.flavor.36.b: "They were coerced - let them off."
 rhein.flavor.36.c: "Punish only the worst offenders."
  
 rhein.flavor.37.t: "Thorough De-Valkification?"
 rhein.flavor.37.d: "As the trials wrap up, some both in Germany but especially overseas have urged not just punishment for the top, but also the clearing out of the potential hidden cadres of Valkists throughout society. Many suffer the terrorism of the Werwolf, who hide in the alleys, sewers and forests of Germany in filth and dirt to unleash their hatred upon society. A thorough questioning of potential Valkist party members, along with a cleansing of bureaucracy and public life of Valkists could also go a long way in protecting the new Germany.\n\nOn the other hand, such a notion is terribly unpopular in Germany. After all, the current government struggled its way to this position - does it really need to butt into every citizen’s affairs to ensure their political alignment? Is that not a Valkist thing to do? While the streets, plazas and buildings may no longer hold the heraldry of Valkism, should we go one step further to ensure that this noxious ideology never returns?"
 rhein.flavor.37.a: "We are not tyrants."
 rhein.flavor.37.b: "We must ensure this rot infects society no longer!"
  
 rhein.flavor.38.t: "Issue of the Railways"
 rhein.flavor.38.d: "The railways of the old Weimar state were taken under the wing of the government, being coagulated and directed by one massive state-run entity known as the Deutsche Reichsbahn. With this, the Reichsbahn would be tied to the state - and soon it was tied to the Valkist state. Under the control of the Valkists, the Reichsbahn would soon be one of the foremost "coordinated" institutions in Dressler’s Reich.\n\nNow Dressler is gone, but the railways have gone nowhere. While retaking control of the Reichsbahn has been deemed by many as the most practical outcome, other more liberal-minded individuals have urged for privatizing the railways and making them less susceptible to authoritarian tendencies."
 rhein.flavor.38.a: "Take control of them."
 rhein.flavor.38.b: "More government intervention?"
  
 rhein.flavor.40.t: "Schleicher’s Legacy"
 rhein.flavor.40.d: "With Schleicher leaving the picture, the fate of the new government, unchained from republican notions of freedom and democracy has now been put into question. While many agree that the republic shall not make a return, few can agree on what the next step forward for new Germany is. The Reichswehr have put forth a recommendation that a new totalitarian "Wehrstaat" - defence state must be created to prepare Germany for the inevitable third clash between Germany and her enemies. Some of course reject this as destabilizing to the future of Germany - a new state that eventually will replace the republic must be created with the aristocracy at the top as they rightfully were. There too are moderates who believe both to be too far gone for the republic we restored - a new republic that will ensure socialism, Valkism and all derivatives of Marxism are relegated to the past should be established. Whatever the choice is however, it will shape Germany for the year to come.\n\nSo then, what shall it be?"
 rhein.flavor.40.a: "The Defence State must be realized!"
 rhein.flavor.40.b: "The republic must be destroyed entirely!"
 rhein.flavor.40.c: "A new, popular order is called for."
  
 rhein.flavor.41.t: "The French Invasion"
 rhein.flavor.41.d: "The French have always been among the German people’s most determined foes. Few in our government can claim to hold much admiration of them beyond cultural ties, and in any event their imperialistic and domineering tendencies are the greatest roadblocks to the dream of European unity.\n\nNow the fears of French intervention have come true, as troops led by general Charles Mangin have marched in and raised the Tricolour. With the government unable to forcefully resist both France and the practically guaranteed coming German intervention thereof, the French have found their occupation to be relatively swift and bloodless. As government offices find themselves under French control, many have also realized that the French have opted to commandeer much of Rhenish industry.\n\nThe Rhineland has lost its freedom, with the government’s only purpose being to turn the Rhineland into a redoubt against German expansionism. Even despite their seething hatred of these events, Berlin can ill-afford to bash its head against the new Rhenish fortress as the only fate that now befalls the Rhineland is one of exploitation."
 rhein.flavor.41.a: "..."
  
