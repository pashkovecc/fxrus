 RHI_simson_mio_desc: "$simson_RHI_MIO$\n§L$simson_desc$§!\n"
 simson_RHI_MIO: "Firearms & Automotive Manufacturer"
 simson_desc: "Founded in 1854 by the brothers Löb and Moses Simson in Suhl, the original Simson & Co. company began its life producing gun barrels. Branching out to bicycle and steam engine production in 1871, Simson & Co. began developing in-house engine manufacture, expanding to a second factory to manufacture passenger cars in 1907. Simson expanded greatly during the Great War, producing rifles, machine guns, and automobiles for the Heer throughout the war.\n\nAfter the Great War, Simson was one of a few companies permitted to manufacture firearms for the then-Reichswehr under the Treaty of Versailles, a state of affairs that lasted until the rise of the Valkists. Fearing expropriation, the owners moved a number of their assets to the Rhineland, where they had already opened several factories during the wartime years.\n\nToday, Simson lives on in the Rhine, after its assets in the Reich were seized by the new government."
  
