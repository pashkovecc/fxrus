 RAJ_revolt5: "Ready the Princely Armies" #NT!
 RAJ_revolt5_tt: "§gWe will raise §Y4§! infantry divisions in §CKashmir§!, §CHyderabad§!, §CTranvancore§! and §CMysore§! to fight for us§!" #NT!
  
