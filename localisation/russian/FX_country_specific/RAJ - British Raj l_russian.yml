 ### Ideas 
 RAJ_Incoming_Revolt: "Incoming Revolt" #NT!
 RAJ_Incoming_Revolt_desc: "Our intelligence operatives have discovered a plot by rebel leaders to initiate a revolt in June. We must be abundantly cautious, and prepared to meet it with extreme force." #NT!
 RAJ_poor_conditions: "Appalling Conditions" #NT!
 RAJ_poor_conditions_desc: "A plethora of poor working conditions for the population has generated great resentment to our rule in India, almost at every turn in politics we are presented with demands to improve the situation." #NT!
 RAJ_colonial_administration: "Colonial Administration" #NT!
 RAJ_colonial_administration_desc: "While we can claim to rule India, there is no question as to who rules us. Due to this arrangement many view our Government as illegitimate and are as such unwilling to fight to ensure its survival. Additionally many of the country's best minds prefer to leave rather than stay, hampering our research capabilities." #NT!
 RAJ_poor_training: "Inefficient Training" #NT!
 RAJ_poor_training_desc: "Improper training procedures and a general lack of discipline in the army has led to it being an incredibly incapable force, suited only for policing. On the bright side we can at least train our soldiers quicker." #NT!
 RAJ_reconquest_campaign: "Beginning the Reconquest" #NT!
 RAJ_exiled_government: "Our Government in Exile" #NT!
 RAJ_anti_british: "Anti-British Sentiment" #NT!
 RAJ_anti_british_desc: "The population of the British Raj has been overcome by a staunch anti-British sentiment. Many in Indian politics would like to see the British Empire gone from the subcontinent entirely. So long as this is the predominant thought in India, we will struggle to make any headway in winning the hearts and souls of our population." #NT!
 RAJ_princely_states: "The Princely States" #NT!
 RAJ_princely_states_desc: "The Princely States have long been semi-autonomous kingdoms within the Raj. Providing them autonomy has assaunged some unrest within their borders, but our lack of direct control over them creates a drag on our administration. Balancing the autonomy of these states is important to the survival of the Raj." #NT!
 RAJ_Indian_Officers: "Indian Officers" #NT!
 RAJ_british_business: "British Business" #NT!
 RAJ_building_indian_industry: "Building Indian Industry" #NT!
 RAJ_improved_conditions: "Improving Conditions" #NT!
 RAJ_new_nation: "A New Nation" #NT!
 RAJ_limited_intervention: "Indian Civil War" #NT!
 RAJ_limited_intervention_desc: "Civil War has enveloped the Indian subcontinent and our administration is in shambles. We must wait for our overlord's decision before we can recieve any outside support from the already weakened British sphere." #NT!
 RAJ_decentral_command_idea: "Officer Autonomy" #NT!
 RAJ_central_command_idea: "Centralised Command" #NT!
 RAJ_support_unions: "Supported Unions" #NT!
 RAJ_economic_recovery: "Economic Recovery Plan" #NT!
 RAJ_spectre_of_revolt: "Spectre of 1936" #NT!
 RAJ_council_of_state: "Council of State" #NT!
 RAJ_crushing_of_dissent: "Nationalist Crackdown" #NT!
 RAJ_jewel_of_empire: "Imperial Crown Jewel" #NT!
 RAJ_princely_federation: "Federation of Princes" #NT!
 RAJ_princely_autonomy: "Автономные княжества"
 RAJ_princely_allies: "$RAJ_princely_autonomy$" #NT!
  
 ### Focuses 
 RAJ_British_Indian_Army: "The British Indian Army" #NT!
 RAJ_British_Indian_Army_desc: "The Raj has had its own army - the British Indian Army - for decades. Its effecitveness has been debated, however, and perhaps it is now time to look at potential reform." #NT!
 RAJ_Centralise_the_Armys_Command: "Centralise the Army's Command" #NT!
 RAJ_Centralise_the_Armys_Command_desc: "Command of the armies must be taken out of the hands of the princes and centralised in a small group of commanders. This is the only efficient way, though it will take time to make the princes realise it." #NT!
 RAJ_Formalise_the_General_Staff: "Formalise the General Staff" #NT!
 RAJ_Formalise_the_General_Staff_desc: "The British Indian army continues to expand and modernize, hence necessitating a more modern and advanced form of control and communications. An ad-hoc general staff has been in place so far, but now it is time to formalize it." #NT!
 RAJ_Motorisation_of_the_Army: "Motorisation of the Army" #NT!
 RAJ_Motorisation_of_the_Army_desc: "Modernizing our army by introducing motorized units will greatly enhance its mobility and effectiveness on the battlefield, allowing us to respond swiftly to threats." #NT!
 RAJ_Military_Research_Council: "Military Research Council" #NT!
 RAJ_Military_Research_Council_desc: "Military research is slowly but surely becoming a very important part of modern war. For a country so far behind relative to her size, we must ensure that the British-Indian army has the most modern equipment available." #NT!
 RAJ_Expand_Support_Capacity: "Expand Support Capacity" #NT!
 RAJ_Expand_Support_Capacity_desc: "Support equipment will be vital for the future in ensuring that the cost of modern war is not too great to inspire mass unrest. We should hence invest into the creation of new support battalions to help our soldiers." #NT!
 RAJ_New_Munitions_Factory: "New Munitions Factories" #NT!
 RAJ_New_Munitions_Factory_desc: "Constructing new munitions factories will bolster our ability to produce the weapons and ammunition required to sustain our military efforts." #NT!
 RAJ_Expand_the_Officers_School: "Expand the Officer's School" #NT!
 RAJ_Expand_the_Officers_School_desc: "Establishing a Military Academy specifically for Indian officers and commanders is essential to training the next generation of leaders of the British Indian Army." #NT!
 RAJ_Maintain_Officer_Autonomy: "Maintain Officer Autonomy" #NT!
 RAJ_Maintain_Officer_Autonomy_desc: "Working with the princes to make their common command of the army more efficient, but still respecting their rights, is the best way to keep morale high and maintain national unity." #NT!
 RAJ_Reinforce_Command: "Centralised Planning" #NT!
 RAJ_Reinforce_Command_desc: "The existing command structure has served the Army well for decades. Reinforcing it is the best and only way to prevent the Army from drifting away from our administration." #NT!
 RAJ_Improved_Basic_Training: "Improved Basic Training" #NT!
 RAJ_Improved_Basic_Training_desc: "The best way to bring our army up to modern standards is to initiate training reforms. We will continue to be woefully behind our enemies otherwise." #NT!
 RAJ_Equipment_Upgrades: "Equipment Upgrades" #NT!
 RAJ_Equipment_Upgrades_desc: "We continue to use outdated equipment issued to us by the British. Only by buying new equipment licenses and upgrading our current weapons and gear can we bring our army into the modern age." #NT!
 RAJ_Cohesive_Strategy: "A Cohesive Strategy" #NT!
 RAJ_Cohesive_Strategy_desc: "It cannot do for different divisions of the army to have different plans of action. We must standardize our strategy to ensure that the entire army is on the same page in any conflicts." #NT!
 RAJ_Signals_Department: "Signals Department" #NT!
 RAJ_Signals_Department_desc: "As troops become increasingly mechanised and combat is focused on squad operations, we will have to improve our communications significantly. Wars are no longer fought in lines and trenches, and units moving quickly must be in constant communication with each other in order to coordinate effectively. In addition to expanding the Signals Department and by providing radios to as many squads as possible, we will also adopt the No. 83 coloured smoke grenades for soldiers to use." #NT!
  
 RAJ_Indian_Airforce: "Airforce of the Raj" #NT!
 RAJ_Indian_Airforce_desc: "Creating an Indian Airforce is essential to beginning our conquest of the skies." #NT!
 RAJ_Adjust_Manufacturies: "Adjust Manufacturies" #NT!
 RAJ_Adjust_Manufacturies_desc: "Unfortunately, our current manufacturies are not equipped to handle the production of new planes for our air force. We must adjust these factories and production lines to be able to do so." #NT!
 RAJ_Create_Command_Structure: "Create A Command Structure" #NT!
 RAJ_Create_Command_Structure_desc: "Creating a command structure for our new Air Force is essential in creating an Air Force that will successfully defend our country and its interests." #NT!
 RAJ_New_Airbases: "New Airbases" #NT!
 RAJ_New_Airbases_desc: "Air superiority is won by swarming the skies with planes. Mass producing them is the first step in achieving that goal." #NT!
 RAJ_Strategy_for_Skies: "A Strategy for the Skies" #NT!
 RAJ_Strategy_for_Skies_desc: "We must have a cohesive strategy as it comes to aerial warfare; only then can we successfully coordinate its operations with the Army and Navy." #NT!
 RAJ_Prioritize_Fighters: "Prioritize Fighters" #NT!
 RAJ_Prioritize_Fighters_desc: "We need to prioritize the creation of fighters over bombers; if the Great War has taught us anything, it's that modern wars are won by exercising complete control over the skies." #NT!
 RAJ_Prioritize_Bombers: "Prioritize Bombers" #NT!
 RAJ_Prioritize_Bombers_desc: "We need to prioritize the creation of bombers over fighters; if the Great War taught us anything, it's that modern wars are won by absolutely and completely destroying the enemy." #NT!
 RAJ_Wings_Over_India: "Wings Over India" #NT!
 RAJ_Wings_Over_India_desc: "The skies of India must become our domain, and more specifically, the domain of our new air force." #NT!
 RAJ_Radio_Communications: "Radio Communications" #NT!
 RAJ_Radio_Communications_desc: "Across such a vast continent, radio communication is absolutely mandatory for quick communication. While this technology may not be widely spread yet, we shall see to it that it is!" #NT!
 RAJ_Defend_the_Indian_Skies: "Defend the Indian Skies" #NT!
 RAJ_Defend_the_Indian_Skies_desc: "There are many potential threats that lay on the horizon. The spectre of Soviet, Japanese or even French bombers raining down terror upon unsuspecting India is a future that remains quite undesirable. Hence, we must ready our air defences, both on ground and in the sky!" #NT!
  
 RAJ_Raj_Navy: "A Raj Navy" #NT!
 RAJ_Raj_Navy_desc: "The British Indian Army requires a British Indian Navy to supplement it. Building ships and docks should be our priority to secure our country." #NT!
 RAJ_New_Dockyards: "New Dockyards" #NT!
 RAJ_New_Dockyards_desc: "We can't build new ships without having dockyards to build them. Focusing on the construction of new dockyards must be undertaken now before we can focus on any other aspect of our new Navy." #NT!
 RAJ_Shipbuilding_Techniques: "Shipbuilding Techniques" #NT!
 RAJ_Shipbuilding_Techniques_desc: "We are far behind the rest of the world when it comes to shipbuilding. But using their techniques is not out of the question when it comes to producing our own ships." #NT!
 RAJ_Strategy_for_Waves: "A Strategy for the Waves" #NT!
 RAJ_Strategy_for_Waves_desc: "We require a cohesive strategy to control the seas around India, and the time to begin planning one out is now." #NT!
 RAJ_Ocean_Supremacy: "Ocean Supremacy" #NT!
 RAJ_Ocean_Supremacy_desc: "Controlling the seas completely is essential to our strategies. Protecting India from the sea means dominating the waves." #NT!
 RAJ_Battleship_Designs: "Battleship Designs" #NT!
 RAJ_Battleship_Designs_desc: "Battleships will be the bread and butter of our strategy to control the seas. We must assert our supremecy outright." #NT!
 RAJ_Control_Deep: "Control the Deep" #NT!
 RAJ_Control_Deep_desc: "Instead of attempting to dominate the waves, a much better strategy for our Navy is to dominate the deep, and create a safety net of submarines around the Raj." #NT!
 RAJ_Submarine_Designs: "Submarine Designs" #NT!
 RAJ_Submarine_Designs_desc: "Submarines will be the bread and butter of our strategy to control the deep. We must assert our supremecy subtly." #NT!
 RAJ_Carrier_Ambitions: "Carrier Ambitions" #NT!
 RAJ_Carrier_Ambitions_desc: "Creating aircraft carriers is a daunting prospect, especially in the face of established naval supremecy. But we will not stand down. We must not be cowed. We must create a Navy for the new age." #NT!
 RAJ_Fund_Karachi_Dockyards: "Fund Karachi Shipyards" #NT!
 RAJ_Fund_Karachi_Dockyards_desc: "Investing in the Karachi Dockyards will bolster our naval capabilities, enabling us to construct and maintain a modern fleet to safeguard our maritime interests." #NT!
 RAJ_Cruiser_Models: "Cruiser Models" #NT!
 RAJ_Cruiser_Models_desc: "To build up the British-Indian navy, we will need modern cruiser models to patrol the vast Indian ocean. There is simply no other way for us to deter potential French and Japanese incursions that may even cut us off from the mother country" #NT!
 RAJ_Naval_Aviation: "Naval Aviation" #NT!
 RAJ_Naval_Aviation_desc: "Naval aviation is a new field of war, one that holds much potential. We should invest in it, most especially to make up for our rather lacklustre naval tradition compared to the Japanese or even the French." #NT!
  
 RAJ_Third_Roundtable_Talks: "Third Roundtable Talks" #NT!
 RAJ_Third_Roundtable_Talks_desc: "Once more, we have reached an impasse regarding Indian self-rule. Despite the best attempts of the government, the Government of India 1935 Act has failed and hence we have been set back to the drawing board of what we shall do next." #NT!
 RAJ_Embrace_British_Industry: "Embrace British Industry" #NT!
 RAJ_Embrace_British_Industry_desc: "As much as it may pain us, the most efficient way to achieve our ultimate goal is to embrace the British industry already present within our country." #NT!
 RAJ_Reject_British_Industry: "Reject British Industry" #NT!
 RAJ_Reject_British_Industry_desc: "As much difficulty it may give us, the only way to achieve our ultimate goal is to reject the industry that the British have forced upon us, and to create our own styles and methods." #NT!
 RAJ_Gujarat_Oil_Exploration: "Gujarat Oil Exploration" #NT!
 RAJ_Gujarat_Oil_Exploration_desc: "There have been reports that there is oil in the region of Gujarat, which so far has not experienced much development. We should prospect for this vital resource to ensure imperial strength and prosperity." #NT!
 RAJ_Deals_With_Vickers: "Deals with Vickers" #NT!
 RAJ_Deals_With_Vickers_desc: "Vickers is one of the biggest British arms companies and their know-how as well as technical aid will prove vital to establishing Indian self-sufficiency in defence. We should hence reach out to them for the construction of Indian plants." #NT!
 RAJ_Rural_Electrification: "Rural Electrification" #NT!
 RAJ_Rural_Electrification_desc: "The rural countryside continues to suffer in dismal poverty, causing much of the population to be weak and restless. Electrification will bring about the wonders of modernity to India and will aid imperial interests for years to come." #NT!
 RAJ_The_Reserve_Bank_of_India: "The Reserve Bank of India" #NT!
 RAJ_The_Reserve_Bank_of_India_desc: "With economic troubles still plaguing India, a central bank is vital to ensuring economic stability and sanity. While this move has been held off by colonial traditionalists, the reality is that the best course of action is to establish a bank that will regulate the currency of the Crown Jewel." #NT!
 RAJ_Expand_Raniganj_Coalfield: "Expand Raniganj Coalfield" #NT!
 RAJ_Expand_Raniganj_Coalfield_desc: "As one of the oldest coal fields in India, Raniganj will prove immensely important to industrialization of British India and to building its utility to the empire and beyond." #NT!
 RAJ_Subsidize_the_Textile_Industry: "Subsidize the Textile Industry" #NT!
 RAJ_Subsidize_the_Textile_Industry_desc: "Textiles are a vital part of Indian exports, especially to the core of the British empire. We must subsidize it to ensure that it does not go hungry for funds and aid." #NT!
 RAJ_Agricultural_Modernisation: "Agricultural Modernisation" #NT!
 RAJ_Agricultural_Modernisation_desc: "Most of the country remains agricultural, meaning no economic policy is complete without at least some rural aid. Agricultural modernization through mechanization and equipment will help to relieve the burden faced by many Indians." #NT!
 RAJ_Industrial_Cooperation: "Industrial Cooperation" #NT!
 RAJ_Industrial_Cooperation_desc: "Cooperating with the British is the best way to improve upon our already-existing industry and build new factories." #NT!
  
 RAJ_Incoming_Storm: "Incoming Storm" #NT!
 RAJ_Incoming_Storm_desc: "Our intelligence reports indicate that a major crisis is brewing within the Raj. Whispers of rebellion and unrest are growing louder, and we must act swiftly to prepare for the storm ahead. Strengthening our administration and military readiness will be critical to weathering this impending challenge." #NT!
 RAJ_Wartime_Mobilisation: "Emergency Mobilisation" #NT!
 RAJ_Wartime_Mobilisation_desc: "The growing unrest within the Raj demands immediate action. We must mobilize all available resources and manpower to prepare for any potential conflict that may arise." #NT!
 RAJ_Expand_the_Intelligence_Bureau: "Expand the Intelligence Bureau" #NT!
 RAJ_Expand_the_Intelligence_Bureau_desc: "To counter the rising threats, we must expand our intelligence capabilities. A stronger intelligence bureau will allow us to uncover plots and maintain control over the Raj." #NT!
 RAJ_Appoint_Stopford: "Appoint Stopford" #NT!
 RAJ_Appoint_Stopford_desc: "Appointing a capable and experienced leader like Stopford will strengthen our administration and ensure decisive action during these turbulent times." #NT!
 RAJ_Appeal_to_Westminster: "Appeal to Westminster" #NT!
 RAJ_Appeal_to_Westminster_desc: "The situation in the Raj is dire. We must appeal to Westminster for additional support and resources to stabilize the region and maintain British control." #NT!
 RAJ_Increase_Training: "Increase Training" #NT!
 RAJ_Increase_Training_desc: "Our forces are ill-prepared for the challenges ahead. Increasing training efforts will ensure our troops are ready to face any threat with discipline and efficiency." #NT!
 RAJ_After_Storm: "Calm After the Storm" #NT!
 RAJ_After_Storm_desc: "With the crisis subsiding, it is time to focus on rebuilding and stabilizing the Raj. We must ensure that peace and order are restored across the region." #NT!
 RAJ_Reconcile_with_the_People: "Reconcile with the People" #NT!
 RAJ_Reconcile_with_the_People_desc: "To prevent further unrest, we must reconcile with the people of the Raj. Addressing their grievances and fostering unity will be key to maintaining stability." #NT!
 RAJ_Ensure_Loyalty_of_the_Princes: "Ensure Loyalty of the Princes" #NT!
 RAJ_Ensure_Loyalty_of_the_Princes_desc: "The loyalty of the Princely States is crucial to the survival of the Raj. We must take steps to ensure their continued allegiance to the British administration." #NT!
 RAJ_Establish_the_Propaganda_Office: "Establish the Propaganda Office" #NT!
 RAJ_Establish_the_Propaganda_Office_desc: "A dedicated propaganda office will help us control the narrative and maintain public support for our administration during these challenging times." #NT!
 RAJ_Start_Reconstruction: "Start Reconstruction" #NT!
 RAJ_Start_Reconstruction_desc: "The recent turmoil has left the Raj in disarray. We must begin reconstruction efforts to rebuild infrastructure and restore normalcy to the region." #NT!
 RAJ_Ramp_Up_Relief_Efforts_for_Peasants: "Ramp Up Relief Efforts for Pesants" #NT!
 RAJ_Ramp_Up_Relief_Efforts_for_Peasants_desc: "The rural population has suffered greatly during the crisis. Increasing relief efforts for peasants will help alleviate their hardships and reduce discontent." #NT!
 RAJ_Compromise_with_the_Unions: "Compromise with the Unions" #NT!
 RAJ_Compromise_with_the_Unions_desc: "Labor unrest threatens to destabilize the Raj further. Compromising with the unions will help maintain industrial productivity and prevent strikes." #NT!
 RAJ_Education_Reforms: "Education Reforms" #NT!
 RAJ_Education_Reforms_desc: "Investing in education reforms will ensure a brighter future for the Raj. A well-educated population will contribute to the region's stability and prosperity." #NT!
  
 RAJ_Troubled_Future: "Our Troubled Future" #NT!
 RAJ_Troubled_Future_desc: "The Raj has been through troubled times before, but the issues we face today are unparalleled. We must confront them head-on if we are to prevail." #NT!
 RAJ_Reform_and_Reconciliation: "Reform and Reconciliation" #NT!
 RAJ_Reform_and_Reconciliation_desc: "The only way to gain our own autonomy and independence is through reform and reconciliation with the British system that currently rules us." #NT!
 RAJ_Top_Down_Reform: "Top Down Reform" #NT!
 RAJ_Top_Down_Reform_desc: "The most efficient kind of reform we should seek must be from the top down. It is the duty of the administrators of the Raj to bring about the change necessary." #NT!
 RAJ_Administrative_Changes: "Administrative Changes" #NT!
 RAJ_Administrative_Changes_desc: "Substantial changes in how we administrate our nation must be made if we are to pursue proper reform." #NT!
 RAJ_Bottom_Up_Reform: "Bottom Up Reform" #NT!
 RAJ_Bottom_Up_Reform_desc: "The most efficient kind of reform we shoudl seek must be from the bottom up. It is our duty to listen to the people to bring about the change necessary." #NT!
 RAJ_Listen_to_People: "Listen to the People" #NT!
 RAJ_Listen_to_People_desc: "The people are our final arbiters. We have a responsibility to them - and a responsibility to the future of the Raj - to listen to their needs and act accordingly." #NT!
 RAJ_Status_Quo: "Status Quo" #NT!
 RAJ_Status_Quo_desc: "With proper reform and reconciliation, the current situation under British rule is the best way to maintain the stability and peace of the British Raj." #NT!
 RAJ_Request_British_Assistance: "Request British Assistance" #NT!
 RAJ_Request_British_Assistance_desc: "While it may be humiliating to some, we cannot go forward without aid from the British. If we want to create a great nation, we must use every tool at our disposal." #NT!
 RAJ_Restrict_Communication: "Restrict Communication" #NT!
 RAJ_Restrict_Communication_desc: "Consolidating our control over the Raj is the best way to bring about peace and prosperity. Working to restrict any communication between would-be rebels is an excellent way to avoid further conflict." #NT!
 RAJ_Time_Tested_Solution: "The Time-Tested Solution" #NT!
 RAJ_Time_Tested_Solution_desc: "If the British and the Empire have taught us one thing, it is that the best way to rule is by force." #NT!
 RAJ_Gentle_Hand: "A Gentle Hand..." #NT!
 RAJ_Gentle_Hand_desc: "We must be prepared to offer concessions and handouts where necessary..." #NT!
 RAJ_Iron_Fist: "...And An Iron Fist" #NT!
 RAJ_Iron_Fist_desc: "...but also to crush any sign of rebellion at first sight." #NT!
 RAJ_Dominion_Status: "Request Dominion Status" #NT!
 RAJ_Dominion_Status_desc: "Over the years, the British have provided Dominion status for several of their former colonies - Canada, Australia, New Zealand, South Africa. The best way to maintain the status quo while seeking reform is to become a Dominion in our own right." #NT!
 RAJ_Simon_Commission: "The Simon Commission" #NT!
 RAJ_Simon_Commission_desc: "The British have chosen to provide for our freedom with a Commission of white British men. While it is obviously not what we desired, it is what we will be forced to work with." #NT!
 RAJ_Sitaramayya_Commission: "The Sitaramayya Commission" #NT!
 RAJ_Sitaramayya_Commission_desc: "The British have granted us with the ability to provide for our own freedom with a Commission split between British and Indian negotiators. This is the best way forward, and the best way to bring about a bright Indian future." #NT!
 RAJ_Subdue_Nationalists: "Subdue the Nationalists" #NT!
 RAJ_Subdue_Nationalists_desc: "The nationalists threaten to become violent if their every demand is not met. We must subdue them in order to ensure a peaceful transition into independence and nationhood." #NT!
 RAJ_Boost_Moderates: "Boost the Moderates" #NT!
 RAJ_Boost_Moderates_desc: "The moderates in our state are much more valuable to the negotiation process and independence than the extreme nationalists. Boosting their standing in negotiations is the best way to proceed." #NT!
 RAJ_New_State_Apparatus: "A New Apparatus of State" #NT!
 RAJ_New_State_Apparatus_desc: "One of the most pressing issues we face is to create an entirely new appratus of state. Our administration, as well as our system of government, must be decided now to provide for the future of India." #NT!
 RAJ_Free_Elections: "Free Elections" #NT!
 RAJ_Free_Elections_desc: "We have lacked the very basic building block of democracy as long as we have been ruled by the British. Free and fair elections are what we should seek, and what we must seek going forward." #NT!
 RAJ_Assume_Control: "Assume Control of the Military" #NT!
 RAJ_Assume_Control_desc: "Taking control of our own military is a step long overdue. If we are to break with the British, they can no longer control that which defends our nation." #NT!
 RAJ_Transition: "Transition to Dominionhood" #NT!
 RAJ_Transition_desc: "The only way forward, without war or violence, is to transition to Dominionhood. While it is not full independence, it is still independence." #NT!
 RAJ_Enough: "Enough is Enough" #NT!
 RAJ_Enough_desc: "We have dealt with British rule for far too long. Enough is enough." #NT!
 RAJ_Call_of_People: "Call of the People" #NT!
 RAJ_Call_of_People_desc: "The people will no longer be silenced. Listen. Can you hear them sing?" #NT!
 RAJ_Untenable: "No Longer Tenable" #NT!
 RAJ_Untenable_desc: "The status quo is simply no longer tenable. We can no longer pretend like the British rule over India is acceptable. It is time for us to seize our independence and shape our own destiny." #NT!
 RAJ_Worth: "Is it Worth It?" #NT!
 RAJ_Worth_desc: "Is breaking with the British Empire worth it? This is a question we must ask ourselves. Can we sustain ourselves without the Empire's support? These questions must be answered before we can move forward." #NT!
 RAJ_Withdraw: "Time to Withdraw" #NT!
 RAJ_Withdraw_desc: "It is time to move on." #NT!
 RAJ_Independence_Path: "A Path to Independence" #NT!
 RAJ_Independence_Path_desc: "Laying out the path to independence is essential to achieving the ultimate goal. We must work with the British to get it done." #NT!
 RAJ_Domestic_Reform: "Domestic Reform" #NT!
 RAJ_Domestic_Reform_desc: "While leaving the British Empire is our foremost concern, domestic reform is also necessary to ensure that our nation will withstand the test of time." #NT!
 RAJ_British_System: "Maintain the British System" #NT!
 RAJ_British_System_desc: "We are already pushing our limits by becoming our own, independent nations. Writing our own legal codes is too much work to realisitically undertake; maintaining the laws we've been given is the best way forward." #NT!
 RAJ_Reinforce_Legal_Codes: "Maintain Current Legal Codes" #NT!
 RAJ_Reinforce_Legal_Codes_desc: "The easiest way forward is to maintain the legal codes that the British have given us, and reforming them only where absolutely necessary." #NT!
 RAJ_Indian_System: "Create an Indian System" #NT!
 RAJ_Indian_System_desc: "The British have ruled us with their laws for far too long. Creating our own Indian legal system is the best way forward, and the best way to create our own national identity." #NT!
 RAJ_Draft_New_Codes: "Draft New Legal Codes" #NT!
 RAJ_Draft_New_Codes_desc: "In order to create our own system of laws, we must undertake the long process of drafting entirely new legal codes." #NT!
 RAJ_Foreign_Relations: "Establish Foreign Relations" #NT!
 RAJ_Foreign_Relations_desc: "Establishing foreign relations is one of the most important things a newly born nation can do. Working on that here and now can only help us in the long run." #NT!
 RAJ_Break_with_British: "Break with the British" #NT!
 RAJ_Break_with_British_desc: "The best way forward is to break our ties with the British Empire. The only way India can become truly great and independent is to start anew." #NT!
 RAJ_Leave_IPA: "Leave the IPA" #NT!
 RAJ_Leave_IPA_desc: "Leaving the Imperial Protection Alliance is the best and fastest way to show the British that we are no longer a part of their sphere." #NT!
 RAJ_Keep_with_British: "Keep with the British" #NT!
 RAJ_Keep_with_British_desc: "As a new nation, it's essential that we have established allies. Remaining friends with the British, even if it keeps us in their sphere, is essential to fulfilling this." #NT!
 RAJ_Reinforce_Foreign_Ties: "Reinforce Our Foreign Ties" #NT!
 RAJ_Reinforce_Foreign_Ties_desc: "If a newly independent nation needs one thing, it's ties to other nations. We must reinforce the ties that bind us to our potential allies in order to make this a reality." #NT!
 RAJ_Gradual_Independence: "Gradual Independence" #NT!
 RAJ_Gradual_Independence_desc: "The path to independence is long, but it is a path that we shall take, one step at a time. Our future shall be bright, and our nation shall be great." #NT!
  
 RAJ_new_viceroy: "A New Viceroy?" #NT!
 RAJ_new_viceroy_desc: "The fallout of the Indian rebellion has yet to fully manifest and still it is already clear that some clear mistakes were made in the lead-up to the rebellion. Improper measures, corruption at a worrying level and plain mismanagement led us to this point, putting into question Linlithgow’s suitability for the job." #NT!
  
 RAJ_consolidate_british_rule: "Consolidate British Rule" #NT!
 RAJ_consolidate_british_rule_desc: "The unruly Indian rabble that rose up against us has demonstrated that even appearing to give an inch to them will only cause them to demand a mile. No compromise on the British hold on India shall be made!" #NT!
 RAJ_consolidate_british_rule_tt: "§YOur government will change to §gPaternal Autocrat§!§!" #NT!
  
 RAJ_control_council_state: "Subjugate the Council of State" #NT!
 RAJ_control_council_state_desc: "The Council of State, while practically speaking is under our thumb, still poses a threat to the potential power that the new central British Indian bureaucracy shall hold, especially with its Indian constituents. Let us ensure that all new laws and decrees need not be obstructed by this body." #NT!
  
 RAJ_ruthless_suppression: "Destroy Rebel Remnants" #NT!
 RAJ_ruthless_suppression_desc: "The remaining Indian rebels that stalk the countryside are by imperial law bandits and traitors to the empire. Their continued defiance only risks sending poor India into the hands of the Germans, Soviets or even Japanese. We must uproot this group once and for all." #NT!
  
 RAJ_levy_loyal_princes: "Levy Loyal Princes" #NT!
 RAJ_levy_loyal_princes_desc: "The princely states of the empire have for the most part remained generally loyal, though naturally the rebellion has put a damper on the mood of many officials for cooperation with local Indians. Still, our shared interests in maintaining the status quo will go a long way in securing our rule." #NT!
  
 RAJ_crown_jewel_of_empire: "Crown Jewel of the Empire" #NT!
 RAJ_crown_jewel_of_empire_desc: "For now, we have secured India as a firm and faithful part of the empire. Although some may argue that we have only kicked the can down the road on the issue of Indian independence, for now we can rest easy knowing that India remains steady for king and country." #NT!
  
 RAJ_a_new_age: "New Age for India" #NT!
 RAJ_a_new_age_desc: "The most eventful chapter in recent Indian history has only shown one thing - independence will come eventually. We can choose to either resist in futility, in turn ruining imperial prestige and our efforts in developing the continent or we can choose to take this as a sign - to reform." #NT!
  
 RAJ_compromise_former_rebels: "Compromise with Former Rebels" #NT!
 RAJ_compromise_former_rebels_desc: "The nature of the recent uprising has resulted in many former rebels either fleeing back into hiding amongst the massive Indian population or overseas with sympathizers in Berlin, Tokyo and Moscow. They may prove a critical thorn in our side if they are not neutralized - which can be best done through compromise." #NT!
  
 RAJ_upgrade_princely_status: "Elevate Princely Status" #NT!
 RAJ_upgrade_princely_status_desc: "The princely states of India have always relied on a rather one-sided relationship with the British crown, even in spite of which they have remained loyal to the British cause. Let us reward them for their service to the empire, without which we would not be here today." #NT!
  
 RAJ_increase_indian_participation: "Increase Indian Participation" #NT!
 RAJ_increase_indian_participation_desc: "The simple reality is that the burdens of modernization and development necessitate more people - people which we currently lack. Even if hardliners question their reliability, local Indians have proven to be adept at running the imperial bureaucracy, regardless if they add a slightly more local touch." #NT!
  
 RAJ_all_india_federation: "The All-India Federation" #NT!
 RAJ_all_india_federation_desc: "With London having given us the greenlight for what the fate of India shall be, let us at once inaugurate the new order on the continent. The king-emperor may reign above, but India has now entered a new age - an independent and firm bulwark of the empire!" #NT!
  
 RAJ_request_dominion_status: "Request Dominion Status" #NT!
 RAJ_request_dominion_status_desc: "Over the years, the British have provided Dominion status for several of their former colonies - Canada, Australia, New Zealand, South Africa. The best way to maintain the status quo while seeking reform is to become a Dominion in our own right." #NT!
 RAJ_request_dominion_status_tt: "§YIf we attain dominion status, the following effects will happen:§!" #NT!
  
 RAJ_foreign_policy: "Into the World" #NT!
 RAJ_foreign_policy_desc: "Although we remain firmly committed to the cause of king and country, India must still decide eventually what her fate shall be in the world. Will she go forth together with the empire and lead the British empire in Asia to glory? Or will she follow London's directives? Only time will tell." #NT!
  
  
 #### Exiled Raj 
 RAJ_ex: "Exile to Ceylon" #NT!
 RAJ_ex_desc: "Our worst fears have come to pass. Our government - or what remains of it - is now exiled to an island in the Indian Ocean, just close enough to the mainland for us to see what we lost. We must regroup and recover, and forge a path forward." #NT!
 RAJ_Regroup: "Regroup Our Forces" #NT!
 RAJ_Regroup_desc: "What forces remain to us remain rather scattered across the island. We must bring them together and re-organize in order to create a fighting force strong enough to repel our enemies and perhaps reconquer what we lost." #NT!
 RAJ_Reconquer: "Reconquer India" #NT!
 RAJ_Reconquer_desc: "We may have been pushed from the continent, but we refuse to believe we have lost the Raj forever. With British assistance, the reconquest of the subcontinent is within our grasp. We will have much work, and much planning, before we can return. But we shall return." #NT!
 RAJ_Ceylon_Industry: "Industry of Ceylon" #NT!
 RAJ_Ceylon_Industry_desc: "The island of Ceylon has little industry, if any. Most of it is ancient, but can suit our needs if repurposed." #NT!
 RAJ_Ceylon_Garrison: "The Ceylon Garrison" #NT!
 RAJ_Ceylon_Garrison_desc: "The small garrison that the British kept on Ceylon is mostly made up of native peoples. We must accomodate them if we wish to grow our own fighting force." #NT!
 RAJ_Revive_Industry: "Revive Old Industries" #NT!
 RAJ_Revive_Industry_desc: "The old industry that litters Ceylon can serve our purposes, if revived correctly. We must focus on making these old factories churn out arms and ammunition for our reconquest." #NT!
 RAJ_Ceylon_Infrastructure: "Infrastructure of Ceylon" #NT!
 RAJ_Ceylon_Infrastructure_desc: "Most of Ceylon remains cluttered with jungle, and very little infrastructure exists to accomodate our forces. We must build up the island's resources in order to properly prepare the reconquest." #NT!
 RAJ_Ceylon_Repurposed: "Ceylon Repurposed" #NT!
 RAJ_Ceylon_Repurposed_desc: "Ceylon, a small island in the Indian Ocean, has now become our base of operations, and shall serve as a launchpad for our reconquest of the Indian mainland." #NT!
 RAJ_Stockpile: "Weapons from the British Stockpile" #NT!
 RAJ_Stockpile_desc: "While we are able to use Ceylon industry to produce arms and ammunition, we must still pressure the British to provide material aid for the coming reconquest." #NT!
 RAJ_Training: "New Training Methods" #NT!
 RAJ_Training_desc: "It is clear that our current army cannot take on the rebels now controlling mainland India without significant adjustment." #NT!
 RAJ_Conscription: "Conscript Ceylonese Soldiers" #NT!
 RAJ_Conscription_desc: "With the British largely abandoning us, we must rely on native Ceylonese conscripts to bolster our numbers for the reconquest." #NT!
 RAJ_New_Army: "A New Army" #NT!
 RAJ_New_Army_desc: "We must remake our forces in a new image; one which will allow us to defeat the rebels that now occupy the Indian mainland." #NT!
 RAJ_Against_India: "Against the Indian States" #NT!
 RAJ_Against_India_desc: "The time has come to wage war against the Indian 'states' that now occupy the subcontinent. Preparations near completion; the reconquest is nearly ready to proceed." #NT!
 RAJ_Crossing_the_Straits: "Crossing the Straits" #NT!
 RAJ_Crossing_the_Straits_desc: "It will be necessary for us to cross the water in order to reconquer the Raj. We must prepare our forces for naval landings and invasions so we can take the fight to the continent as soon as possible." #NT!
 RAJ_Pressure_British: "Pressure the British" #NT!
 RAJ_Pressure_British_desc: "Despite all of our preparations, it will not be possible for us to invade the Indian mainland without British assistance. We must petition and pressure them for aid until they give in. And then our reconquest can begin..." #NT!
  
 ### Decisions 
 RAJ_national_reforms: "National Reforms" #NT!
 RAJ_improving_conditions: "Improve Living and Working Conditions" #NT!
 RAJ_reforming_military: "Reforming the Military" #NT!
 RAJ_reforming_admin: "Reforming the Administration" #NT!
 RAJ_countdown: "Impending Revolt" #NT!
 RAJ_reach_out_to_muslim_league: "Negotiate with the Muslim League" #NT!
 RAJ_reach_out_to_muslim_league_desc: "As the foremost representative of Indian muslims - a key demographic that we can still sway somewhat - we should reach out to the Muslim League for their neutrality or even support in any coming rebellion." #NT!
 RAJ_cooperation_with_hm: "Reach Out to the Hindu Mahasabha" #NT!
 RAJ_cooperation_with_hm_desc: "While their brand of Hindu nationalism stands very much against the stability of the empire, the relative irrelevance of the Hindu Mahasabha and their allied paramilitary in the RSS has pushed them into being amenable to tacitly aiding us in the coming rebellion - especially in the struggle against communism." #NT!
 RAJ_cooperation_with_hm_tt: "§gOnce the revolt breaks out, we will receive the following benefits§!" #NT!
 RAJ_quick_crackdown: "Crackdown on Nationalists" #NT!
 RAJ_quick_crackdown_desc: "A short crackdown will help to buy us time before the revolt inevitably hits." #NT!
 RAJ_quick_crackdown_3: "§gWe have launched crackdowns at least 3 times§!" #NT!
 RAJ_revolt1: "Create Emergency Industries" #NT!
