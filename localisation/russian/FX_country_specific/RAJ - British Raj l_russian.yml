l_russian:
  
 RAJ_FUHRERREICH_DESC: "The British Raj stands at a crossroads in 1936. Decades of unrest, economic exploitation, and political suppression have left the subcontinent simmering with discontent. The whispers of rebellion grow louder, and the administration must decide whether to reform, or rule with an iron fist.\n\nThe failure of the Government of India Act 1935 has already put India's future in the empire into question. Will the Raj maintain its place as the jewel of the British Empire, or will it crumble under the weight of its own contradictions? The future of India—and the Empire—hangs in the balance." #NT!
  
