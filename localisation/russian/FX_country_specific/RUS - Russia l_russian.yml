 #### events #### 
 rus.0.t: "Изгнанники"
 rus.0.d: "Земля русских когда-то была третьей по величине империей в мире, простиравшейся на три континента. Несмотря на свой статус военной державы, в основном аграрная и неиндустриализированная Российская империя сильно отставала от своих европейских соседей. В 1914 году, после того как эрцгерцог Австрии был застрелен сербом в Сараево, Россия мобилизовала силы для защиты своего сербского союзника от вторгающейся австрийской армии. Так началась Великая война между русскими, британцами и французами с одной стороны и немцами, австрийцами и османами — с другой.\n\nВеликая война не была похожа ни на одну другую. По мере продвижения Центральных держав на восток моральный дух падал, а недовольство росло, пока в 1917 году не достигло точки кипения, когда большая часть России поднялась с оружием в руках против монархии, что положило начало Февральской революции. В конце концов Царь отрекся от престола в пользу революционеров, представлявших собой нестабильный союз между Петроградским советом во главе с коммунистами-большевиками и Временным правительством во главе с республиканцами. Уличные бои и наступление немецкой армии привели к распаду этого союза и объявлению Гражданской войны, которая должна была решить судьбу России — между социалистами-большевиками под предводительством революционера Владимира Ленина и широким антибольшевистским Белым движением.\n\nК 1920 году подконтрольная белым территория в России сократилась до отдельных очагов и эксклавов в Сибири и Центральной Азии. Колчак, Верховный правитель Белых сил, был схвачен и передан большевикам. Он официально ушел в отставку и передал весь контроль над гражданской и военной властью белых в Сибири своему последнему генералу в этом регионе — атаману Семенову. К февралю атаман и его казачья армия были полностью окружены в Забайкалье, связываясь с подконтрольным союзникам и чехословакам Приморьем только через железные дороги, находившиеся под контролем японцев. Сибирская интервенция стала главным фактором дальнейшего выживания Белой армии. В интервенции принимали участие Япония, Чехословацкий корпус, США, Италия, Великобритания и Франция, а также тысячи поляков и канадцев. Все стороны интервенции преследовали схожие, но все же разные цели и принимали в ней самое активное участие. США, Франция, Италия и Великобритания стремились не допустить попадания военных материалов в руки большевиков, спасти Чехословацкий корпус и восстановить Восточный фронт. В то же время японцы преследовали более империалистические цели, стремясь либо расширить свою сферу влияния, либо просто создать буферное государство. Их ставленником был Семенов в Чите. Примечательно, что Япония отправила для участия в боях в Сибири 70 000 военнослужащих, в то время как президент Теодор Рузвельт направил 30 000."
 rus.0.a: "Дальше"
 rus.1.d: "После пленения и отставки Колчак был впоследствии казнен. Потеряв своего главного союзника, французы и британцы вскоре полностью эвакуировались из Сибири, однако поддержка со стороны Японии продолжилась, так как Семенов сумел договориться о дальнейшей помощи с неохотно шевшими на контакт Соединенными Штатами. 6 апреля 1920 года в Чите была провозглашена небелая Дальневосточная республика. США и Япония быстро вступили в диалог с этой Дальневосточной республикой. И Япония, и США настаивали на включении Забайкальского правительства Семенова в переговоры, однако Дальневосточная республика отказалась, после чего США и Япония оперативно прекратили диалог и вернулись к поддержке Забайкальского правительства Семенова. В конечном итоге правительство Дальневосточной республики было полностью выбито из Забайкалья. К 1922 году американо-японские силы, а также белые войска успешно контролировали обширные территории Амура, Забайкалья, Приморья и Приморской области, в то время как Гражданская война зашла в тупик с крайне редкими столкновениями с обеих сторон. Большевики начали возвращаться домой. 25 октября 1922 года белые армии и их японские и американские союзники подавили крупное коммунистическое восстание, что стало последним конфликтом в Гражданской войне, фактически положив ей конец.\n\nС этим фактическим завершением Гражданской войны во внутреннем обиходе Белое правительство именовало себя Временным Особым Совещанием при Войсковом Атамане на Восточной Окраине (Всероссийским Белым правительством на Восточной Окраине Забайкалья, Амура и Приморья). Однако большинство стран называют его Российским Белым правительством или просто Белым правительством. Хотя большинство государств до сих пор не признают Советский Союз и вместо этого считают Белое правительство законной администрацией России, у него нет достаточной военной мощи, чтобы подкрепить эти притязания. В рамках усилий по дальнейшей консолидации власти и легитимности этого нового государственного образования Япония и Соединенные Штаты совместно с Италией, Великобританией и Францией учредили гарантию «Союзнической комиссии по Восточной России» для надзора за независимостью Белого правительства и, несмотря на принятие Григорием Семеновым титула Верховного правителя, создания видимости демократии в регионе путем учреждения законодательной Думы с избирательным процессом. Однако эти выборы по сей день систематически сфальсифицированы, а Дума остается крайне слабой, состоящей в основном из сторонников белого движения и близких им союзных консервативных движений. На сегодняшний день большая часть власти по-прежнему находится в руках Семенова и белых генералов, а все остальные государственные органы выполняют лишь функцию формального одобрения."
 rus.2.d: "Неназванный генерал дал показания перед Союзнической комиссией по Восточной России о том, что Григорий Семенов растратил государственные средства. Если эта информация станет достоянием общественности, правительству будет нанесен огромный ущерб, а и без того хрупкий имидж Белого правительства ухудшится еще сильнее."
 rus.3.d: "Несмотря на все усилия правительства, информация о растратах Семенова утекла в массы! Хотя расследование источников утечки уже началось с целью пресечь ее распространение, слухи указывают на то, что к этому делу приложили руку сочувствующие демократам бюрократы, работающие на Союзническую комиссию по Восточной России. Если это подтвердится и Комиссия действительно замешана в утечке, ее автономный и всесильный статус означает, что у нас связаны руки и мы не можем остановить распространение новостей. Боже, спаси нас!"
 rus.4.d: "В ответ на слабость действующей администрации демократические и популистские партии начали переговоры о создании возможного Единого фронта для участия в выборах. Хотя мы всегда могли бы фальсифицировать результаты работы наших демократических институтов и угрожать их членам, чтобы они не участвовали, присутствие западных наблюдателей и текущая непопулярность нашего правительства, вызванная скандалом с растратами, связывают нам руки, не давая предпринять какие-либо действия, дабы не сделать себя еще более непопулярными."
 rus.5.d: "После успешных переговоров демократические силы наконец сформировали коалицию, чтобы сломить текущий статус-кво. Назвав себя «Национальным союзом спасения», они ставят своей целью свержение режима и создание демократического государства. Хотя в прошлом подобные попытки установления демократии жестко подавлялись, переходы военных на сторону их блока и нестабильность правительства препятствуют этим усилиям."
 rus.6.d: "В Владивостоке вспыхнули протесты в поддержку Национального союза спасения и против Семенова. Что еще хуже, местный гарнизон отказался подавлять бунтующих, а многие солдаты и вовсе пополнили их ряды, призывая к демократии!"

 rus.7.d: "Попытки подавить протесты во Владивостоке лишь подлили масла в огонь, и антиправительственные восстания охватили все Приморье. Сотни людей вышли на улицы, участвуя как в мирных маршах, так и в жестоких столкновениях, протестах и мятежах. Полицейские силы и гарнизоны быстро оказались смяты или же открыто перешли на сторону восставших! У правительства остался лишь один выход, если оно планирует выжить."
 rus.8.d: "Правительство официально потеряло контроль даже над своими военными дивизиями, которые отказались сражаться с протестующими. Переход этих войск под предводительством группы продемократически настроенных офицеров на сторону противника не только пополнил ряды антиправительственных сил, но и привел к коллапсу нашей военной организации и сплоченности."
 rus.9.d: "Протесты переросли в открытый мятеж, и Приморье было полностью захвачено силами, противостоящими Амуро-Забайкальской администрации. Там Национальный союз спасения сформировал временную альтернативную администрацию со штаб-квартирой во Владивостоке и готовится провести масштабные правительственные реформы, а также обеспечить построение новой демократической парадигмы. Попытка сокрушить этих мятежников, скорее всего, будет означать для нас конец, поскольку ползут слухи о том, что даже Союзная комиссия по Восточной России начала переговоры с администрацией Владивостока и планирует поддержать их более стабильный и демократический режим вместо Амуро-Забайкальского правительства."
 rus.10.d: "Союзная восточная комиссия официально признала предателей во Владивостоке законным Белым правительством России. Это станет сильнейшим ударом по забайкальским лоялистам, и уже сейчас очевидно, что их администрация долго не продержится."
 rus.11.d: "Все источники указывают на то, что временное правительство Владивостока готовит наступление на последние провинции, сохраняющие верность Забайкальской администрации. Хотя у них и большая армия, они наверняка не смогут их одолеть."
 rus.12.d: "Предатели начали наступление на последние лояльные провинции на западе страны. Хотя победа правительства не гарантирована, все еще есть шанс отбросить их назад и наказать за совершенные преступления."
 rus.13.d: "Мятежники пересекли реку Амур и уже находятся на пути к тому, чтобы свергнуть старую гвардию. Немногочисленные сторонники, все еще поддерживающие старую гвардию, начинают нервничать, и возникает угроза новой волны дезертирства."
 rus.14.d: "С наступлением нового дня генералы Белого движения становятся все более настороженными и встревоженными антиправительственной волной, которая прокатилась по регионам Амура и теперь приближается к Чите."
 rus.15.d: "После долгих боев с мятежниками белогвардейское военное управление приняло решение официально сложить полномочия и допустить оккупацию и передачу Читы из своих рук. Администрация Владивостока празднует победу, а ведущие члены Союза спасения заявили о своей приверженности созданию России, в которой будет представлен простой человек, свободной от социализма."
 rus.16.d: "Сегодня был долгий день для новой администрации Белой России: начались масштабные административные реформы, призванные обеспечить надлежащее построение демократии в этой стране, а также были проведены арест и суд над Семеновым за коррупцию и антигосударственную деятельность, наряду с реорганизацией армии. Но все эти усилия того стоят, как утверждает НП, поскольку становится ясно, что в Белой России наступила новая эра."
 rus.17.d: "Во Временном правительстве возник политический тупик касательно отношения к сочувствующим Советам. Хотя все согласны с тем, что СССР должен быть уничтожен, а Россия восстановлена, октябристы и ключевые фигуры Союза спасения предлагают запретить в Белой России организации, выступающие за пацифизм или какой-либо компромисс с социализмом или СССР. Однако такая позиция не устраивает другие партии, которые выступают за свободную демократию без авторитаризма. Хотя любая из сторон могла бы одержать победу в этих дебатах, это раскололо бы нынешнюю администрацию и привело бы к политической нестабильности. Таким образом, компромисс, подкрепленный референдумом, стал рассматриваться как вполне рабочий вариант."
 rus.18.d: "Компромисс в виде проведения референдума, несмотря на свою суть, совершенно не нашел поддержки у основной фракции Союза спасения и октябристов. Таким образом, политический кризис во временном правительстве лишь обострился."
 rus.19.d: "Политический хаос и нестабильность, вызванные этим тупиком во временном правительстве, привели к сильному недовольству со стороны народа, большая часть которого не была особо заинтересована в идее демократии, а скорее присоединилась к восстанию ради свержения старой власти после обещаний «новой» эры для Белой России — без распрей и коррупции. Этот политический вакуум был воспринят как прекрасная возможность некоторыми амбициозными белыми генералами и антилиберальными деятелями, которые начали предлагать иные, менее демократичные взгляды на концепцию нового правительства."
 rus.20.d: "После долгих и утомительных дебатов во временном правительстве было решено, что лучший способ разобраться с этой политической проблемой — провести избирательный процесс, временно организованный с некоторыми ограничениями для пацифистов и просоветских сил, которые могут быть сняты или оставлены в зависимости от результатов выборов. Иными словами, решение проблемы было отложено на будущее."
 rus.21.d: "Временное правительство назначило выборы на ближайшее будущее в присутствии наблюдателей от Союзной восточной комиссии для обеспечения их легитимности. Остается надеяться, что этот избирательный процесс принесет хорошие плоды."

 rus.22.t: "Выборы [GetYear] года"
 rus.22.d: "Наступили выборы! За лидерство в Белой России борются два основных блока, на сторону которых встало большинство политиков: популистский Союз спасения Родины и левый Союз Возрождения, а также более умеренный Национальный центр. У каждого из них есть свое видение того, как реформировать страну, как обеспечить экономический рост и как эффективно стабилизировать правительство."
 rus.22.a: "Побеждает Союз спасения Родины"
 rus.22.b: "Побеждает Союз Возрождения"
 rus.22.c: "Побеждает Национальный центр"
 rus.23.t: "Обвал Лондонской фондовой биржи бьет по России"
 rus.23.a: "Сущий ужас!"
 rus.23.d: "Неожиданно и незаметно последствия обвала Лондонской фондовой биржи затронули Восточную Азию и теперь принесли в нашу страну экономические проблемы. Компании ушли из региона, доходы снизились, безработица резко выросла, и теперь мы оказались в дестабилизированном и разрушенном положении."
 rus.24.d: "В связи с резким сокращением государственного бюджета и серьезными финансовыми трудностями, было предложено приватизировать значительную часть крупнейших государственных компаний. Эти компании будут приватизированы в пользу предприятий, менее пострадавших от кризиса, и, вероятно, принесут определенные выгоды (а также проблемы). Что вы думаете по этому поводу?"
 rus.25.t: "Россия вновь едина!"
 rus.25.d: ""
 rus.25.a: "Наконец-то Россия снова станет свободной"
 rus.26.t: "Слухи о контрреволюции"
 rus.26.d: "Мало кто может забыть борьбу 1919 года, когда мы и реакционные «белые псы» сражались за то, вернется ли Россия к мрачной реакции или же ее ждет блестящее социалистическое освобождение. Хотя мы успешно одержали победу над большинством этих царских отбросов, худшие из них все еще обитают в глубине Дальнего Востока, где русские рабочие тяготятся иностранным господством.\n\nСейчас циркулируют сообщения о том, что правительство Владивостока снова поднимает свою уродливую голову. Службы безопасности обнаружили тайные склады оружия и техники, предположительно предназначенные для использования предателями, скрывающимися в наших рядах. Хотя по всей Сибири уже введены репрессии, это все еще вселяет страх в сердца руководства — а что, если произойдет контрреволюция?"
 rus.26.a: "Тревожно..."
 rus.27.t: "Переименовать Народоград"
 rus.27.d: "Мы отвоевали Народоград. Поскольку город теперь свободен от большевиков, переименование его во что-нибудь подходящее было бы вполне логичным."
 rus.27.a: "Новая Россия, новые названия. Переименуйте в Волгоград."
 rus.27.b: "Нужно вернуть былое величие! Царицын!"
 rus.27.c: "Народоград — прекрасное название, несмотря на его популистский характер."
 rus.28.t: "Переименовать Ленинград"
 rus.28.d: "Мы отвоевали Ленинград. Как можно заметить, Шерлок, мы не большевики. Сохранять его название в честь предателя России было бы нелепо."
 rus.28.a: "Петроград больше подходит для русского города."
 rus.28.b: "Санкт-Петербург — его первоначальное название, переименование было ошибкой."
 rus.29.t: "Россия в нашем альянсе?"
 rus.29.d: "Шаг, способный изменить баланс сил: российское правительство официально подало заявку на вступление в [Root.GetFactionName]. Российские официальные лица подчеркивают необходимость обеспечения безопасности, экономического сотрудничества и создания единого фронта против общих угроз. Перспектива вступления России в нашем союзе вызвала споры среди государств-членов: одни приветствуют потенциальный рост мощи и стабильности, другие же с осторожностью относятся к намерениям России и последствиям этого шага для будущего альянса. Пока начинаются обсуждения, мир внимательно следит за тем, примут ли Россию в эти ряды."
 rus.29.a: "Пусть вступают!"
 rus.29.b: "Разве они не проиграли в прошлый раз?"
 rus.30.t: "Предложение России принято"
 rus.30.d: "После тщательного обсуждения руководство альянса [Root.GetFactionName] приняло решение одобрить заявку России на вступление. Это решение рассматривается как серьезный сдвиг в международном балансе сил, ведь теперь Россия стоит плечом к плечу со своими новыми союзниками. Сторонники этого шага надеются, что партнерство принесет большую безопасность и стабильность, в то время как критики по-прежнему с осторожностью относятся к долгосрочным планам России. А пока мир наблюдает за тем, как Россия занимает свое место в рядах альянса [Root.GetFactionName]."
 rus.30.a: "Начинается новая глава."
 rus.31.t: "Предложение России отклонено"
 rus.31.d: "После долгих дебатов руководство альянса [Root.GetFactionName] решило отклонить просьбу России о вступлении. Это решение разочаровало российских чиновников и спровоцировало споры среди государств-членов о дальнейшем направлении развития альянса. Теперь, столкнувшись с сохраняющейся неопределенностью на мировой арене, Россия должна пересмотреть свою дипломатическую стратегию."
 rus.31.a: "Удар по планам России."
 rus.32.t: "Требование воссоединения с Москвой"
 rus.32.d: "В условиях меняющегося хода истории российское правительство выдвинуло официальное требование коллаборационистскому режиму в Москве: распустить свою администрацию и объединиться с законным Российским государством. Российские официальные лица утверждают, что только единая Россия способна восстановить порядок, суверенитет и национальную гордость. Этот ультиматум вызвал шок в Москве: одни считают объединение неизбежным, другие же видят в нем угрозу своей хрупкой автономии. Теперь мир ждет, как Москва ответит на это дерзкое требование."
 rus.32.a: "Отправить ультиматум."
 rus.32.b: "Они там сошли с ума?"
 rus.33.t: "Москва соглашается на воссоединение"
 rus.33.d: "После напряженных переговоров коллаборационистское правительство в Москве и его сюзерен согласились распустить администрацию и объединиться с Российским государством. Российские чиновники прибыли в город для контроля над переходным процессом, и над Москвой вновь развевается триколор. Это мирное объединение провозглашается важнейшим шагом на пути к восстановлению единства и мощи России, а по всей стране, вновь ставшей единой, вспыхнули торжества."
 rus.33.a: "Россия вновь едина!"
 rus.34.t: "Москва отказывается от воссоединения"
 rus.34.d: "Коллаборационистское правительство в Москве и его сюзерен отвергли наше требование об объединении, настаивая на сохранении своей независимости и собственной администрации. Этот отказ вызвал гнев у многих в России, где его расценили как предательство национального единства. Теперь правительству предстоит решить: ответить ли силой или же отступить и переосмыслить свои дальнейшие действия."
 rus.34.a: "У нас нет иного выбора, кроме как объявить войну!"
 rus.34.b: "Мы отступим... пока что."
  
 rusur.1.d: "После напряженной предвыборной гонки на выборах победил Союз возрождения. Они пообещали создать прогрессивное социальное государство, помочь экономике и продолжить борьбу с СССР."
 rusur.2.d: "Сегодня на своем рабочем месте был убит один из министров нашего правительства — Борис Савинков. Считается, что покушение было совершено большевиками, и это знаменует собой конец жизненного пути важной фигуры в деле строительства нашего государства. В стране уже объявлен день траура."
 rusnus.1.d: "НСС — весьма своеобразная партия — одержал победу на выборах, а октябристы стали их младшим партнером по коалиции. Кабинет министров во главе с Врангелем и Георгиевским уже приступает к работе. Они начали выдавать кредиты фермерам для механизации сельского хозяйства, попутно закладывая основу для национализации ключевых отраслей промышленности и реформы системы школьного образования."
 rusnus.2.d: "Политические дискуссии привели к расколу в нашей правящей партии. На правом фланге образовалась фракция, называющая себя «неостолыпинцами», во главе которой встал Аркадий Столыпин — сын того самого Столыпина. Они хотят модернизировать столыпинские идеи и применить их в новом политическом контексте. В противовес этим набирающим силу реформаторам-традиционалистам был также учрежден Союз Молодой России. Взяв за образец идеалы валькистской Германии и используя некоторые концепции СССР для создания более сильной России, они призывают к жесткому тоталитарному государству, управляющему строго контролируемой экономикой."
 rusnus.3.d: "В рамках своей программы НСС предлагает и стремится реализовать создание технократического правительства, которое будет представлять профессионалов и квалифицированных специалистов в своих областях. Это предложение подразумевает роспуск парламента и немедленное назначение ученых, писателей и инженеров для формирования нового парламентского института. Хотя народ голосовал за НСС, зная об этой идее, вся оппозиция выступает против их взглядов, и реализация этих планов, скорее всего, потребует авторитарных и антидемократических мер. Стоит ли нам согласиться с предложением НСС?"
 rusnus.4.d: "."
 rusnus.5.d: "В рамках своей программы НСС предлагает и стремится реализовать создание технократического правительства, которое будет представлять профессионалов и квалифицированных специалистов в своих областях. Это предложение подразумевает роспуск парламента и немедленное назначение ученых, писателей и инженеров для формирования нового парламентского института. Хотя народ голосовал за НСС, зная об этой идее, вся оппозиция выступает против их взглядов, и реализация этих планов, скорее всего, потребует авторитарных и антидемократических мер. Стоит ли нам согласиться с предложением НСС?"
 rusnus.7.d: "Партийный парламент был разогнан силой, и на его место формируется новый технократический орган. Чтобы обеспечить жизнеспособность этой идеи, НСС планирует базировать формирование подобного законодательного органа как на признании заслуг, так и на выборном процессе, в котором профессионалы будут избирать представителей своего же класса. Этот процесс должен завершиться в ближайшие дни, знаменуя собой наступление новой эры управления в Белой России."
 rusnp.1.d: "Политический тупик в нынешнем временном правительстве привел к политической радикализации, а также заставил международных игроков всерьез обеспокоиться стабильностью в стране. Судя по всему, японские чиновники втайне от правительства проводили встречи с военными, обсуждая способы решить эту проблему раз и навсегда."
 rusnp.2.d: "Фактический крах правительства и вчерашнее заявление НСС и октябристов об отказе подчиниться требованиям некоторых просоветских предательских партий придали военным решимости и убедили их в том, что единственный выход из нынешнего затруднительного положения — это переворот при поддержке извне. Таким образом, группа высокопоставленных военных во главе со Спиридоном Дионисьевичем Меркуловым, финансируемая и направляемая Японией, сегодня утром вторглась в правительственные здания и приостановила действие конституции. Хотя это решение далеко от идеала, оно, скорее всего, сможет сдержать политический хаос в достаточной мере, чтобы предотвратить прямое военное вмешательство в Белую Россию со стороны японцев или, что еще хуже, Советов — по крайней мере, в идеальном мире. Однако некоторые подозревают, что эта японская поддержка — лишь уловка, призванная скрыть их истинные намерения по вторжению в Белую Россию."
 rusnp.3.d: "Понимая, что им нас не отбросить, Япония согласилась на белый мир. Единственное выдвинутое ими условие заключается в том, что Российское государство не будет национализировать японские компании и активы без выплаты компенсаций."
 rusnp.4.d: "Благодаря нашим успехам в войне с Японией и даже захвату Кореи, они были вынуждены предложить нам мирный договор, который позволяет нам беспрепятственно национализировать японские компании в России без каких-либо компенсаций."
 rusnp.5.d: "Прошлой ночью Корнилов ушел из жизни. Тяжелое бремя управления страной в эти суровые времена пагубно сказалось на его здоровье и привело к смерти. Его естественным преемником становится заместитель — Дитерихс, человек весьма радикальных взглядов."
 rusnp.6.d: "Мы начинаем операцию «Очарина» — план по ликвидации предательских элементов в нашем государстве. Она включает в себя арест социалистов, демократов и других групп, противостоящих нашему правлению."
 
 rusinf.1.d: "Американское влияние на нашу страну невелико. Хочется верить, что это позволит нашему правительству действовать автономно."
 rusinf.2.d: "Шаг за шагом, используя дипломатические, политические и экономические рычаги, США расширяют свое влияние на нашу страну. Нам следует быть осторожными."
 rusinf.3.d: "Тот уровень влияния, который США сейчас имеют на нашу страну, вызывает серьезные опасения, и с этим необходимо что-то делать."
 rusinf.4.d: "Тот уровень влияния, который США сейчас имеют на нашу страну, вызывает серьезные опасения, и с этим необходимо что-то делать."
 rusinf.5.d: "Постепенно наращивая свое влияние на нашу страну, американцы теперь держат Белую Россию в кармане. Они оказывают колоссальное влияние и контролируют нашу политику, администрацию, а также следят за принятием большинства государственных и экономических решений."
 rusinf.6.d: "Японское влияние на нашу страну невелико. Хочется верить, что это позволит нашему правительству действовать автономно"
 rusinf.7.d: "Шаг за шагом, используя дипломатические, политические и экономические рычаги, США расширяют свое влияние на нашу страну. Нам следует быть осторожными."
 rusinf.8.d: "Тот уровень влияния, который Япония сейчас имеет на нашу страну, вызывает серьезные опасения, и с этим необходимо что-то делать."
 rusinf.9.d: "Постепенно наращивая свое влияние на нашу страну, японцы теперь держат Белую Россию в кармане. Они оказывают колоссальное влияние и контролируют нашу политику и администрацию, а также следят за принятием большинства государственных и экономических решений."
 rusinf.10.d: "Белая Россия недавно обратилась с просьбой об увеличении инвестиций в их гражданский сектор. Если мы пойдем на этот шаг, то, скорее всего, получим определенные дипломатические выгоды."
 rusinf.11.d: "Соединенные Штаты согласились увеличить объемы инвестиций в нашу гражданскую экономику. Будем надеяться, что это принесет пользу нашей стране."
 rusinf.12.d: "Белая Россия недавно обратилась с просьбой об увеличении инвестиций в их военный сектор. Если мы пойдем на этот шаг, то, скорее всего, получим определенные дипломатические выгоды."
 rusinf.13.d: "Соединенные Штаты согласились увеличить объемы инвестиций в нашу военную экономику. Будем надеяться, что это принесет пользу нашей стране."
 rusinf.14.d: "США отказались от дальнейших инвестиций в нашу военную экономику."
 rusinf.15.d: "США отказались от дальнейших инвестиций в нашу гражданскую экономику."
 rusinf.16.d: "Белая Россия недавно обратилась к нам с просьбой помочь в вооружении их солдат. Если мы пойдем на этот шаг, то, скорее всего, получим определенные дипломатические выгоды."
 rusinf.17.d: "Соединенные Штаты согласились помочь нам с вооружением наших солдат. Будем надеяться, что это принесет пользу нашей стране."
 rusinf.18.d: "США отказались предоставлять нам пехотное снаряжение."
  
 ruscoup.1.d: "Воспользовавшись моментом слабости прежнего националистического правительства, продемократически настроенные военные совершили государственный переворот. Стремясь исправить ошибки националистов, новое временное военное правительство надеется вернуть России демократию и стабильность, а также вновь утвердить ее в качестве законного противника Советского Союза."
 ruscoup.2.d: "При поддержке октябристов прежнее правительство было свергнуто теми фракциями НСС, которые ранее оказались отстранены от власти. Провозгласив необходимость создания эффективного и реалистичного правительства, способного выполнить свои обещания и возобновить войну против Советского Союза, они стремятся воплотить в жизнь собственные политические взгляды. Однако между этими ранее оттесненными фракциями уже разгорелась ожесточенная борьба за власть, исход которой определит облик нового режима. Если верх одержат неостолыпинцы, страну ждет традиционалистский реформизм. Если же победит Союз Молодой России, государство пойдет по пути радикального авторитаризма."
 ruscoup.3.d: "Попытки Деникина построить диктатуру, вопреки собственным обещаниям восстановить демократию, привели к тому, что он был свергнут в результате переворота, организованного Петром Врангелем."
 ruscoup.4.d: "Наконец, спустя все эти годы, в стране состоялись полноценные выборы. Теперь остается лишь один вопрос: кто одержит в них победу?"
  
