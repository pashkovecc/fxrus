 ### War Tree 
 RUS_Prepare_Against_the_Bolshevik_Devil: "Двадцатилетний крестовый поход"
 RUS_Prepare_Against_the_Bolshevik_Devil_desc: "Даже когда весь остальной мир продолжает склоняться к подлым идеям красной тирании, мы продолжаем борьбу с большевистскими дьяволами. Как бы мы ни устали, как бы ни одряхлели и ни заболели, мы никогда не сдадимся красному зверю!"
 RUS_Gather_Volunteers: "Сбор добровольцев"
 RUS_Gather_Volunteers_desc: "Правда в том, что никто не хочет, чтобы большевистская тирания поглотила его нацию. Желающие со всех уголков мира готовы рискнуть своей жизнью ради антибольшевистской борьбы, и мы будем этому способствовать."
 RUS_Get_Local_Support: "Связь с лоялистами в Союзе"
 RUS_Get_Local_Support_desc: "От казака, который просто заботится о своей общине, до владельца бизнеса, желающего добиться успеха в жизни, — есть много тех, кто при красных познал лишь угнетение и нищету. Мы обратимся к ним, чтобы продолжить борьбу за святую Русь!"
 RUS_Start_Reconstruction: "Начало реконструкции"
 RUS_Start_Reconstruction_desc: "В одном из величайших триумфов справедливости в истории красная угроза была сокрушена, и теперь свободная Россия стоит на ногах! Хотя это повод для празднования, текущее состояние нации оставляет желать лучшего — это должно быть немедленно исправлено!"
 RUS_Instituting_Martial_Law: "Введение военного положения"
 RUS_Instituting_Martial_Law_desc: "Даже несмотря на то, что мы освободили Россию от большевистского тирана, хаос и анархия все еще царят по всей стране. Красные бандиты и прочие оппортунисты пользуются шансом эксплуатировать народ — но это продлится недолго!"
 RUS_Privitazing_Soviet_Companies: "Приватизация советских предприятий"
 RUS_Privitazing_Soviet_Companies_desc: "У большевиков была нелепая система тотального государственного контроля над экономикой — то, что человек не может просто так спланировать. Чтобы получить средства и перекалибровать экономику, мы должны гарантировать присутствие власти частного бизнеса."
 RUS_Land_Return_Question: "Деколлективизация земель"
 RUS_Land_Return_Question_desc: "Даже если крепостное право нежелательно, частная собственность является неотъемлемым правом для всех. Сельскохозяйственные колхозы — это неэффективный и жестоко насаждаемый метод большевистского контроля, от которого мы избавимся!"
 RUS_Recruit_New_Bureaucrats: "Набор новых бюрократов"
 RUS_Recruit_New_Bureaucrats_desc: "Большевистские бюрократы на всех уровнях власти продолжают гнить, незаметно отвращая нас от той свободы, за которую русский народ сражался, истекал кровью и умирал. Однако этому придет конец, потому что они могут рассчитывать на отправку домой сразу после того, как новые, лояльные русские докажут свою готовность служить."
 RUS_Reform_the_Soviet_School_System: "Реформа советской школьной системы"
 RUS_Reform_the_Soviet_School_System_desc: "Коммунистические инсинуации продолжают отравлять умы наших детей — будущее России. Вступает в силу немедленно, будет начат масштабный пересмотр этой безмозглой системы, чтобы гарантировать, что Россия возродится вновь."
  
 ### Economy 
 RUS_New_Five_Year_Plan: "Новый пятилетний план"
 RUS_New_Five_Year_Plan_desc: "Последние десятилетия мы оставались в этой холодной части мира с небольшим количеством промышленности и слишком большой зависимостью от японцев и американцев в плане экономического жизнеобеспечения. Взять пример с красных может быть слишком радикальным шагом для некоторых, но это окажется необходимым, если свобода должна снова воцариться в России."
 RUS_Nationalise_the_Siberian_Railways: "Национализация сибирских железных дорог"
 RUS_Nationalise_the_Siberian_Railways_desc: "Сибирские железные дороги, которые мы сейчас контролируем, — это наш билет к западному освобождению, однако мы больше не контролируем их из-за явного иностранного влияния. Однако, учитывая, что мир приближается к войне, мы не можем позволить свободной торговле преобладать над национальными интересами."
 RUS_Resource_Exploitation: "Эксплуатация ресурсов"
 RUS_Resource_Exploitation_desc: "Дальний Восток и Сибирь являются домом для огромных запасов богатств в виде полезных ископаемых и, возможно, даже нефти. Крайне важно, чтобы мы эксплуатировали эти ресурсы в полной мере."
 RUS_Expand_Vladivostok_Port: "Расширить порт Владивосток"
 RUS_Expand_Vladivostok_Port_desc: "Будучи крупнейшим городом на Дальнем Востоке, Владивосток является нашим связующим звеном с внешним миром и с нашими тихоокеанскими благодетелями. Учитывая, что в скором времени ожидается дальнейшая торговля и поставки, нам следует расширить порт для дальнейшего использования."
 RUS_Subsidize_The_Samz: "Субсидировать САЗ"
 RUS_Subsidize_The_Samz_desc: "Рожденный в результате сотрудничества между Фордом и нашим правительством, Столыпинский автомобильный завод является одной из немногих отечественных компаний, работающих в свободной России и специализирующихся на моторизованных транспортных средствах, что окажется неоценимым в нашем освобождении России."
 RUS_Military_Industrial_Complex: "Военно-промышленный комплекс"
 RUS_Military_Industrial_Complex_desc: "В эти кризисные времена все должно служить военным интересам. Если вы можете делать тракторы, вы также можете делать танки! Таким образом, все гражданское производство должно быть преобразовано в форму, полезную и для военных."
 RUS_Save_Local_Companies: "Спасение местных компаний"
 RUS_Save_Local_Companies_desc: "В условиях кризиса, поразившего мировую экономику и нас тоже, местные компании обнаруживают, что им не везет и у них нет денег. Даже если это противоречит обычным экономическим советам, мы должны спасти их, чтобы сохранить нашу экономику на плаву и быть готовыми к борьбе с большевиками."
 RUS_New_Economic_Deals: "Новые экономические соглашения"
 RUS_New_Economic_Deals_desc: "Торговля с Японией и Америкой — это все хорошо и прекрасно, но она делает нас уязвимыми перед непостоянством этих великих держав. Антибольшевистский крестовый поход нельзя оставлять в зависимости от них, и, следовательно, нужны новые торговые партнеры."
 RUS_Halt_the_Economic_Crash: "Остановка экономического краха"
 RUS_Halt_the_Economic_Crash_desc: "Хотя экономический крах был смягчен, необходимо предпринять полномасштабные правительственные усилия для предотвращения дальнейшего спада экономики, чтобы гарантировать, что свободная Россия не останется без гроша для борьбы с большевизмом."
 RUS_Develop_the_Rural_Regions: "Развитие сельских регионов"
 RUS_Develop_the_Rural_Regions_desc: "В связи с возобновлением нашего крестового похода, маячащего на горизонте, настало время посвятить все предстоящей войне. Даже если большевики превзойдут нас числом, наша воля восторжествует!"
 RUS_Cooperate_with_Sberbank: "Дальневосточный центральный банк"
 RUS_Cooperate_with_Sberbank_desc: "Хотя многие опасаются, что дальневосточный оплот в конечном итоге превратится в сепаратистское государство, реальность такова, что центральный банк, созданный сейчас, принесет гораздо больше пользы, чем потенциальные будущие политические последствия. Это поможет нам координировать экономику и контролировать нашу валюту, что будет способствовать дальнейшему развитию нашей экономики."
 RUS_Economic_Miracle: "Экономическое чудо"
 RUS_Economic_Miracle_desc: "Возможно, чудесным образом российская экономика совершила грандиозное восстановление после ужасных лет большевистского террора. Вскоре весь мир снова будет бояться русского медведя, пробудившегося после десятилетий красного правления!"
 RUS_Negotiate_with_American_Investors: "Переговоры с американскими инвесторами"
 RUS_Negotiate_with_American_Investors_desc: "Американцы могут похвастаться крупнейшей экономикой в мире, а их инвесторы жаждут рынков для отправки своих денег. России неизбежно потребуется индустриализация, и капитал, привлеченный американцами, имеет для этого решающее значение."
 RUS_Sway_Japanese_Investments: "Привлечение японских инвесторов"
 RUS_Sway_Japanese_Investments_desc: "Хотя отношения с Токио всегда были прохладными, их инвесторы, без сомнения, являются одними из самых способных и заинтересованных в развитии Дальнего Востока. Мы должны приложить усилия, чтобы привлечь этих инвесторов и капитал, которым они располагают, который нам так отчаянно нужен."
 RUS_Modern_Engine_of_War: "Современный двигатель войны"
 RUS_Modern_Engine_of_War_desc: "Фабрики и мастерские свободной России работают неплохо, но они, безусловно, могли бы быть более эффективными и обширными. При достаточном усердии, смелости и усилиях мы сможем создать поистине пугающий арсенал для сокрушения большевизма!"
 RUS_Synthetic_Chemistry: "Синтетическая химия"
 RUS_Synthetic_Chemistry_desc: "Новые разработки новой эпохи, несомненно, имеют решающее значение для нас, чтобы принять их во внимание, если мы хотим модернизировать Россию, среди которых синтетическая нефть и каучук. Мы должны инвестировать в такие вещи, если хотим обеспечить самодостаточность."
  
 ### Navy 
 RUS_Trade_Interception: "Подводная война"
 RUS_Trade_Interception_desc: "Учитывая скудность военно-морской инфраструктуры, не позволяющую российскому флоту нанести решающий контрудар, мы должны сосредоточить свои усилия на наиболее экономичном способе завоевать господство на море — подводной войне."
 RUS_Defend_Shipping: "Оборона конвоев"
 RUS_Defend_Shipping_desc: "Владивосток и Тихий океан в целом — это наша артерия жизни, связывающая нас с Токио и Вашингтоном. Если мы позволим красным и их союзникам безнаказанно устраивать рейды в этом регионе, мы рискуем полным крахом всех наших условий!"
 RUS_New_Dockyards: "Модернизация верфей Владивостока"
 RUS_New_Dockyards_desc: "Новые верфи необходимы, если мы хотим, чтобы наши недавние военно-морские начинания принесли хоть какой-то результат, ведь помимо качества нам нужно и количество!"
 RUS_Adopt_Experimental_Technologies: "Внедрение экспериментальных технологий"
 RUS_Adopt_Experimental_Technologies_desc: "По всему миру начинают внедряться экспериментальные военно-морские технологии — от пополнения запасов под водой до противогидролокационных покрытий. Мы должны использовать эти инновации в полной мере!"
 RUS_New_Cruisers: "Крейсеры типа «Петроград»"
 RUS_New_Cruisers_desc: "Нам необходим новый тип крейсеров для модернизации флота — с лучшим бронированием, орудиями и большей скоростью."
 RUS_Modern_Naval_Tactics: "Современная военно-морская тактика"
 RUS_Modern_Naval_Tactics_desc: "Были разработаны новые военно-морские тактики, и мы должны убедиться, что наши офицеры освоили ведение боя новой эпохи, дабы не допустить повторения Цусимы."
  
 ### Army and Air Force 
 RUS_Modernize_the_White_Army: "Модернизация Белой армии"
 RUS_Modernize_the_White_Army_desc: "Славная Белая армия переживала и лучшие времена. Пока мы мужественно защищаем остатки свободной России от большевистского террора, красные быстро догоняют по технологиям не только нас, но и весь остальной мир — и мы должны принять этот вызов!"
 RUS_Construct_New_Airports: "Строительство аэродрома Хабаровск-Центральный"
 RUS_Construct_New_Airports_desc: "Небо России во время гражданской войны, возможно, и не было самым спокойным, но оно точно покажется таковым по сравнению с тем, что произойдет, когда мы возобновим наш священный крестовый поход. ВВС стали незаменимы, и мы должны обеспечить надлежащую инфраструктуру для их поддержки."
 RUS_Torpedo_Bomber_Project: "Проект торпедоносцев"
 RUS_Torpedo_Bomber_Project_desc: "Экономичный и дешевый способ выводить из строя самые могущественные корабли — отечественная разработка торпедоносцев окажется решающей, если мы хотим вернуть себе хоть какое-то господство на море."
 RUS_State_Aviation_Directorate: "Государственное управление авиации"
 RUS_State_Aviation_Directorate_desc: "Частные интересы — это замечательно, но они вряд ли смогут быстро создать самолеты, подходящие для наших будущих войн. Необходимо создать новое управление, которое будет контролировать и направлять развитие нашей авиации."
 RUS_New_Fighters: "Новые истребители"
 RUS_New_Fighters_desc: "Без новых истребителей мы останемся воевать против обновившихся ВВС Красной армии на одних лишь бипланах. Мы должны модернизировать наши истребители, если хотим обеспечить господство в воздухе."
 RUS_Ground_Support_Integration: "Интеграция поддержки сухопутных войск"
 RUS_Ground_Support_Integration_desc: "Хотя контроль над небом будет иметь решающее значение для будущей победы, основную работу всё же выполняет армия. Мы должны стремиться к максимальному взаимодействию между видами войск, чтобы быстрыми темпами уничтожить противника."
 RUS_Strategic_Destruction_Doctrine: "Доктрина стратегического уничтожения"
 RUS_Strategic_Destruction_Doctrine_desc: "Контроль над небом станет одним из главных залогов будущих побед, а вместе с ним приходит возможность обрушить террор на головы противников. Когда их промышленная и гражданская база окажутся в руинах, ни один враг не сможет оказать сопротивление!"
 RUS_Air_Defence_Infrastructure: "Инфраструктура противовоздушной обороны"
 RUS_Air_Defence_Infrastructure_desc: "Дальний Восток исторически не изобиловал авиацией, что привело к слабой системе ПВО. Согласно данным нашей разведки, красные готовы обрушить террор на мирных жителей, что заставляет нас немедленно подготовить ПВО для защиты нашего народа и промышленности."
 RUS_Radio_Systems: "Системы радиосвязи"
 RUS_Radio_Systems_desc: "Радиосвязь абсолютно необходима для оперативной передачи информации, особенно на суровых и бескрайних просторах Сибири. Мы должны немедленно внедрить эту технологию в Белую армию перед неизбежной решающей схваткой с большевиками!"
 RUS_Aviation_Academies: "Авиационные академии"
 RUS_Aviation_Academies_desc: "До сих пор наши ВВС представляли собой лишь набор разрозненных структур, укомплектованных энтузиастами. Чтобы исправить это, нам следует создать полноценные академии, которые привлекут настоящие таланты для укрепления нашего превосходства в воздухе."
 RUS_Superior_Aviation_Engineering: "Передовое авиастроение"
 RUS_Superior_Aviation_Engineering_desc: "Большевики и их соратники ничего не смыслят в настоящем мастерстве, ведь они провели последние двадцать лет, заражая остальной мир своей безрассудной идеологией. Наши же самолеты будут доведены до абсолютного совершенства, хотя бы для того, чтобы противостоять грядущим красным ордам."
 RUS_Found_the_ADV: "Создание АДВ"
 RUS_Found_the_ADV_desc: "Представьте себе витязя Белой армии, отважно прыгающего с парашютом из самолета, чтобы освободить Россию от подлых красных! Картина воистину захватывающая, и вскоре она станет реальностью благодаря этому новому роду войск Белой армии."
 RUS_Acquire_New_Weapons: "Закупка нового вооружения"
 RUS_Acquire_New_Weapons_desc: "Как мы можем вести новую войну без нового оружия? С момента прошлой войны технологии совершили огромный шаг вперед, и это в полной мере относится к стрелковому вооружению, которое нам необходимо обновить."
 RUS_Recruitment_Drive: "Призывная кампания"
 RUS_Recruitment_Drive_desc: "Народ может этого не осознавать, но освобождение России — это самый насущный вопрос для каждого из нас, кто живет в свободной России. Все должны услышать о грядущем освобождении и вступить в наши ряды!"
 RUS_Review_the_Russian_White_Army: "Реорганизация Белой армии"
 RUS_Review_the_Russian_White_Army_desc: "Мы должны решить прямо сейчас, какова будет наша доктрина. Ведь даже при наличии технического прогресса он окажется бесполезным, если мы будем использовать его неправильно и дадим красным победить."
 RUS_Russian_Autarky: "Русская автаркия"
 RUS_Russian_Autarky_desc: "Русский народ стойко переносит любые невзгоды на пути к окончательному триумфу. И хотя красные предали его в 1917 году, свободная Россия все еще стоит, и теперь мы сможем двигаться вперед раз и навсегда, без красных провокаторов на каждом углу!"
 RUS_Avoid_Errors_of_the_Great_War: "Учесть ошибки Великой войны"
 RUS_Avoid_Errors_of_the_Great_War_desc: "Само собой разумеется, Великая война вряд ли была примером идеального русского военного искусства. Ошибки в логистике, некомпетентные офицеры и низкий боевой дух препятствовали нашим успехам — и мы обязаны это исправить."
 RUS_Fund_the_IRD: "Финансирование ИРД"
 RUS_Fund_the_IRD_desc: "Ракетостроение — это совершенно новая область, но она обладает огромным потенциалом для военного применения. Безнаказанно обрушивать террор с небес — будь то на поле боя или на города — станет нашим важнейшим преимуществом."
 RUS_Lessons_of_General_Winter: "Уроки «Генерала Мороза»"
 RUS_Lessons_of_General_Winter_desc: "Многие наши сражения будут проходить в лютом холоде, и если история чему-то нас и научила, так это тому, какие суровые испытания погода может устроить великим армиям. Мы должны подготовить наших солдат к таким условиям, если они собираются сражаться за свободу России."
 RUS_Bullet_Rain: "Шквал огня"
 RUS_Bullet_Rain_desc: "Мы не можем надеяться сравняться с красными в живой силе, что заставляет нас либо вести заведомо проигрышную войну, либо сосредоточить усилия на другом аспекте. Этим аспектом станет огневая мощь, которая спасет нас и сметёт красных в небытие!"
 RUS_New_Era_of_Warfare: "Новая эра военной науки"
 RUS_New_Era_of_Warfare_desc: "Подвижная война, продемонстрированная немцами в Великой войне — это единственный верный путь новой современной доктрины. Огневая мощь не сможет соревноваться с мобильностью, и красные окажутся в замешательстве, пока мы будем обходить их со всех сторон!"
 RUS_Three_Tier_Officer_Training: "Трёхуровневая подготовка офицеров"
 RUS_Three_Tier_Officer_Training_desc: "Трёхуровневая подготовка офицеров поможет распределить кадры в соответствии с их навыками и компетенциями, превратив наш офицерский корпус в современный и эффективный боевой механизм вместо неэффективной и неоднородной силы."
 RUS_Modern_Howitzers: "Современные гаубицы"
 RUS_Modern_Howitzers_desc: "Новая артиллерия необходима, чтобы вывести нашу армию на новый уровень, где более тяжелые и точные батареи будут вселять страх в сердца врагов. Необходимо приложить все усилия для интеграции этой техники в наши войска!"
 RUS_Advancement_Doctrine: "Доктрина планомерного наступления"
 RUS_Advancement_Doctrine_desc: "Медленно, но верно армия будет методично продвигаться по полю боя в соответствии со строгим и научно обоснованным графиком. Данный способ ведения войны гарантирует наш триумф над дезорганизованными красными, которые будут разгромлены по всем направлениям!"
 RUS_Refurbish_Munitions_Factory: "Модернизация заводов боеприпасов"
 RUS_Refurbish_Munitions_Factory_desc: "Текущие центры производства вооружения на Дальнем Востоке оставляют желать лучшего из-за устаревших методов производства и ничтожных объемов. С этим покончено: новые инвестиции будут направлены на модернизацию этих заводов на благо будущей России."
 RUS_Replace_the_AVS_1936: "Замена АВС-36"
 RUS_Replace_the_AVS_1936_desc: "АВС-36 зарекомендовала себя как неплохое стрелковое оружие, но она ненадежна и сложна в производстве. Мы должны постепенно заменить её чем-то столь же эффективным, но гораздо более надежным."
 RUS_Maskirovka: "Искусство маскировки"
 RUS_Maskirovka_desc: "Маскировка — русское искусство военной дезинформации — имеет давние традиции в отечественной военной мысли. Хотя преимущества введения противника в заблуждение очевидны, огромные лесистые пространства Восточной Европы создают идеальные условия для создания фантомных армий и ложных вторжений."
 RUS_Military_Research: "Военные исследования"
 RUS_Military_Research_desc: "Военные технологии постоянно развиваются и меняются, заставляя нас адаптироваться. Если мы не сделаем этого, наши армии столкнутся с технологически превосходящим противником и будут разгромлены."
 RUS_Offensive_Spirit: "Наступательный дух"
 RUS_Offensive_Spirit_desc: "Культ наступления — это то, что наша армия должна принять без колебаний, ведь мы не сможем освободить Россию, не взяв инициативу в свои руки. Все усилия должны быть направлены на подготовку наших войск к атаке, вместо того чтобы ждать, пока большевики сокрушат нас!"
 RUS_Unrelenting_Offensive: "Непрерывное наступление"
 RUS_Unrelenting_Offensive_desc: "Наши полки идут вперед и не остановятся. Белая армия с её новыми механизированными частями будет продвигаться до тех пор, пока не победит и не разгромит большевистский сброд — только вперед!"
 RUS_Army_of_Steel: "Стальная армия"
 RUS_Army_of_Steel_desc: "Бронетехника и другие современные боевые машины пополнили ряды нашей армии, давая ей преимущество над силами красных на Дальнем Востоке. С ними наше продвижение уже не остановить, и Россия будет освобождена!"
  
