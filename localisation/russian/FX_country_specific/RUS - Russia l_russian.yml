 RUS_FUHRERREICH_DESC: "Белый режим держится. С момента подавления последнего большевистского восстания во Владивостоке прошло два года, и остатки Белой армии утвердили свою власть на Дальнем Востоке. Благодаря поставкам японского и американского оружия дело Белого движения еще не проиграно.\n\nНо не все так благополучно. Семенов и его клика погрязли во внутренних интригах, а изменившаяся международная обстановка поставила под сомнение дальнейшую поддержку Белого дела, поставив освобождение России под угрозу. Лишь время покажет, станет ли это государство на окраине будущим возрожденной России или окажется ее последним изгнанием."
  
 #### Political Parties #### 
 RUS_vanguardist_party: "РКП"
 RUS_vanguardist_party_long: "Российская Коммунистическая Партия"
 RUS_collectivist_party: "РКП"
 RUS_collectivist_party_long: "Российская Коммунистическая Партия"
 RUS_libertarian_socialist_party: "РКП"
 RUS_libertarian_socialist_party_long: "Российская Коммунистическая Партия"
 RUS_social_democrat_party: "ПСР"
 RUS_social_democrat_party_long: "Партия социалистов-революционеров\n§LПартия была основана в 1900 году. Ее идеология основывается на народничестве, а ее идейными предшественниками считаются Александр Герцен и Петр Лавров. Со временем партия разделилась на два крыла. Правое крыло выступало за сотрудничество между классами и придерживалось патриотических взглядов. Левое крыло исповедовало аграрный социализм. До 1909 года партия прибегала к политическому террору, что вызывало многочисленные споры. В этот период от нее откололись Союз социалистов-революционеров-максималистов и Народно-социалистическая партия. Во время Гражданской войны в России левое крыло партии поддержало большевиков, тогда как правое примкнуло к Белому движению.§!"
 RUS_social_liberal_party: "НСП"
 RUS_social_liberal_party_long: "Народно-социалистическая партия§LНародно-социалистическая партия — популистская партия, основанная в 1906 году. Ее истоки восходят к народничеству и движению легального народничества. Своими идейными предшественниками партия считает Николая Михайловского и Александра Герцена. Во время Гражданской войны в России выдвигалось предложение об объединении с Трудовой группой, однако оно не получило достаточной поддержки и так и не было реализовано. После окончания Гражданской войны партия обосновалась на территориях, контролируемых Белым движением, и выступала в поддержку демократического строя. Это поставило ее в оппозицию к правительству Григория Семенова, установившему диктаторский режим.§!"
 RUS_market_liberal_party: "Кадеты"
 RUS_market_liberal_party_long: "Конституционно-демократическая партия\n§LПартия кадетов была основана в 1905 году Павлом Милюковым в ходе Русской революции. В первые годы своего существования она придерживалась весьма радикальных взглядов, выступая за всеобщее избирательное право и даже допуская возможность установления республики. Со временем партия заняла более умеренные позиции. Во время Гражданской войны в России кадеты значительно сместились вправо, отказавшись от многих своих социально-прогрессивных идей."
 RUS_social_conservative_party: "ВНЦ"
 RUS_social_conservative_party_long: "Всероссийский национальный центр\n§LНациональный центр состоит из бывших членов Конституционно-демократической партии (кадетов), которым не нравились идеи руководства. Они хотят восстановить монархию и сократить бюрократию в экономике. Они также хотят улучшить систему образования.§!"
 RUS_authoritarian_democrat_party: "РС"
 RUS_authoritarian_democrat_party_long: "Российский союз"
 RUS_paternal_autocrat_party: "Союз 17 октября"
 RUS_paternal_autocrat_party_long: "Союз 17 октября"
 RUS_national_populist_party: "НП"
 RUS_national_populist_party_long: "Националистические прогрессисты\n§LНационалистические прогрессисты — это многочисленная группа реакционных генералов. Их цель — уничтожение Советского Союза и искоренение любого влияния Японии. Они выступают против правительства, поскольку рассматривают его как продолжение японского влияния.§!"
 RUS_valkist_party: "НСС"
 RUS_valkist_party_long: "Национальный союз солидарности\n§LНСС — весьма своеобразная партия. Она выступает за создание государства, где верхняя палата парламента будет полностью состоять из ученых, инженеров, писателей и т.д., а нижняя — из бизнесменов. Они также стремятся к проведению социально-прогрессивных реформ и объединению всех людей русской культуры. Изначально они были своего рода молодежной организацией октоберистов, но позже переросли партию. Их преданность демократии неизвестна, но они яростно выступают против Григория Семенова, считая его слабым лидером.§!"
 RUS_american_delegation: "Американская делегация"
 RUS_american_delegation_long: "Американская делегация"
 RUS_imperial_japanese_Delegation: "Японская делегация"
 RUS_imperial_japanese_Delegation_long: "Имперская японская делегация"
 RUS_UDDF: "СЗРС"
 RUS_UDDF_long: "Союз защиты Родины и Свободы\n§LСЗРС была основана в марте 1918 года Борисом Савинковым как организация для его союзников. В ее состав входили как генералы, так и бывшие социалисты. Он стремился создать государство всеобщего благосостояния, провести земельную реформу и поддержать демократию в стране.§!"
 RUS_national_maximalist_party: "НМ"
 RUS_national_maximalist_party_long: "Национал-максималисты\n§LНационал-максималисты — это организация, которая рассматривает революцию лишь как еще одну часть истории. Ее возглавляет христианский социалист. В ее ряды также входят евразийцы и остатки Союза Молодой России.§!"
 RUS_oktoberist: "Союз 17 октября"
 RUS_oktoberist_long: "Союз 17 октября"
  
