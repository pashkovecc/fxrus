 ### Old Guard 
 RUS_Expand_Okhrana: "Объединить службы безопасности"
 RUS_Expand_Okhrana_desc: "Хотя в своем нынешнем виде Департамент государственной безопасности существует лишь с 1930 года, он опирается на богатое наследие отечественного сыска. Ведомство добилось больших успехов под руководством Клавдия Фосса, но его полномочия можно расширить не только за счет борьбы с внутренним экстремизмом. Его функции пересекаются со Отделом особого назначения МВД (ООН), ориентированным в основном на внешнюю разведку, и Пятым отделом Военного министерства. Объединение просто необходимо для этой раздутой системы."
 RUS_Deal_with_the_Opposition: "Разобраться с оппозицией"
 RUS_Deal_with_the_Opposition_desc: "Демократическая оппозиция всегда была занозой в нашем боку, но теперь этому придет конец. Кнутом или пряником, мы обеспечим их лояльность — по крайней мере, на время..."
 RUS_Reintegrate_the_Penal_Battalions: "Реорганизовать штрафбаты"
 RUS_Reintegrate_the_Penal_Battalions_desc: "Порой солдаты совершают преступления, а иногда на это идут даже офицеры. Для них у нас есть институт штрафных частей, но он мал и используется лишь от случая к случаю. Охрана предложила реорганизовать штрафные подразделения для их более эффективного применения."
 RUS_Invite_Japanese_Advisors: "Привлечь японских советников"
 RUS_Invite_Japanese_Advisors_desc: "В эти тяжелые времена японские советники играют ключевую роль, помогая нам реформировать армию и восстановить экономику — пусть даже ценой их растущего влияния..."
  
