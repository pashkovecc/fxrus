 ####Ideas#### 
 RUS_russian_emigres: "Русские эмигранты"
 RUS_russian_emigres_desc: "Русские эмигранты, бежавшие на Дальний Восток после распада Российской империи и подъема Советского Союза, принесли с собой богатый багаж знаний, культуры и связей. Хотя их присутствие укрепляет наши связи с зарубежными державами и предоставляет ценный опыт, их раздвоенность в лояльности и различные взгляды на будущее России создают внутреннюю напряженность. Их влияние напоминает о расколе в нашей стране, поскольку Советский Союз контролирует большую часть центральной части России."
 RUS_allied_eastern_comission: "Союзническая комиссия по Восточной России"
 RUS_allied_eastern_comission_desc: "Союзническая комиссия по Восточной России осуществляет надзор за нашим правительством, обеспечивая стабильность и защищая иностранные интересы. Хотя их поддержка имеет решающее значение для нашего выживания, их влияние ограничивает нашу автономию, и зачастую они ставят свои собственные интересы выше наших национальных интересов."
 RUS_democratic_opposition: "Демократическая оппозиция"
 RUS_democratic_opposition_desc: "Возглавляемая Василием Маклаковым и Виктором Черновым, эта коалиция представляет собой объединение реформистов, либералов и социалистов, выступающих за политические свободы, демократическое управление и социальную справедливость. Хотя их идеалы находят отклик у многих, их присутствие бросает вызов нынешнему режиму и угрожает дестабилизировать хрупкий баланс сил, поскольку они продвигают реформы, которые некоторые считают слишком радикальными для страны, все еще восстанавливающейся после многолетних потрясений."
 RUS_old_army: "Устаревшая армия"
 RUS_old_army_desc: "Наша армия, несмотря на опыт, страдает от устаревших доктрин, оборудования и организационной неэффективности. Модернизация армии необходима для обеспечения нашего выживания как перед внутренними, так и перед внешними угрозами, но она потребует значительных ресурсов и реформ."
 RUS_funding_army: "Массовые военные расходы"
 RUS_Black_Wednesday: "Экономический кризис"
 RUS_Black_Wednesday_desc: "Мировая экономика погрузилась в хаос после обвала Лондонской фондовой биржи. Последствия этой экономической катастрофы прокатились по всему миру, и Россия не является исключением. Торговля замедлилась, безработица выросла, и хрупкая экономика нашей страны сейчас находится под огромным давлением. Для стабилизации ситуации и предотвращения дальнейшего спада потребуются радикальные меры."
