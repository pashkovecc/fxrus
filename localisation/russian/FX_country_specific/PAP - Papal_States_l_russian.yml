### Ideas
 PAP_holy_see: "Святой Престол" # The Holy See
 PAP_holy_see_desc: "[PAP.GetNameDefCap] является временным центром власти Католической церкви и возглавляется Папой Римским, Епископом Рима и лидером Церкви по должности. С более чем 300 миллионами верующих по всему миру, действия и слова Папства имеют уникальный вес, которого нет больше нигде на земле." # [PAP.GetNameDefCap] is the temporal seat of power for the Catholic Church and led by the Pope, the Bishop of Rome and ex officio leader of the Church. With more than 300 million worshippers across the world, the actions and words of the Papacy carry a unique weight that is seen nowhere else on earth.
