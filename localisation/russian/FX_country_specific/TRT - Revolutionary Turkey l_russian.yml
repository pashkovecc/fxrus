#### Focus ####
 TRT_emergency_session: "Экстренная сессия" # Emergency Session
 TRT_emergency_session_desc: "Убийство покойного султана Абдулмеджида II стало неожиданностью для многих, в том числе и для членов самого правительства. Ясно, что необходимо созвать чрезвычайную сессию, чтобы решить судьбу и направление развития нашего народа..." # Following the assassination of the late Sultan Abdülmecid II has come as a surprise to many, including those within the government themselves. It is clear that an emergency session must be convened in order to decide the fate and direction of our nation...
 TRT_death_of_an_empire: "Смерть Империи" # Death of An Empire
 TRT_death_of_an_empire_desc: "Похоже, Османской империи больше нет, а парламент выступает за упразднение империи и создание нового, турецкого государства." # The Ottoman Empire is no more, it seems, with the parliament in favour of abolishing the empire and bringing about the establishment of a new, Turkish state.
 TRT_consolidation_of_power: "Консолидация власти" # Consolidation of Power
 TRT_consolidation_of_power_desc: "К счастью, похоже, что Дому Османа удалось удержать власть и позволить Османской империи продолжать существование под ее контролем." # Thankfully, it seems as though the House of Osman has managed to hold onto power and allow for the continuation of the Ottoman Empire under its grip.

 TRT_turanist_victorious: "Туранист Победа" # Turanist Victory
 TRT_turanist_victorious_desc: "Туранисты после создания турецкого государства смогли захватить власть и заручиться доверием большинства делегатов. Проповедуя пантюркистскую платформу наряду с сильным и единым турецким государством, безусловно, будет интересно посмотреть, как они повлияют на нацию..." # The Turanists, following the establishment of the Turkish state, were able to seize power and secure the confidence of the majority of delegates. Preaching a pan-Turkic platform alongside a strong and united Turkish state, it will certainly be interesting to see how they will impact the nation...
 TRT_promote_pan_turkism: "Продвигайте пантюркизм" # Promote Pan-Turkism
 TRT_promote_pan_turkism_desc: "Очевидно, что наша судьба заключается не в том, чтобы ассоциировать себя с европейцами или арабами, а в потеплении отношений с нашими тюркскими братьями. Ведь мы генетически схожи и сами тюрки происходят от выходцев из Средней Азии." # Rather than associating ourselves with the Europeans or the Arabs, it is clear that our destiny lies with the warming of relations with our Turkic brothers. After all, we are genetically similar and the Turkish people themselves are descended from the Central Asians.
 TRT_indoctrinate_the_youth: "Внушайте молодёжи" # Indoctrinate the Youth
 TRT_indoctrinate_the_youth_desc: "Мы должны воодушевить молодежь и помочь ей осознать важность верности не только нашим целям, но и самому государству. Если мы хотим вступить в эпоху процветания, мы должны обеспечить активность молодежи в этом стремлении." # We must invigorate the youth and help them realize the importance of not only loyalty to our goals, but to the state itself. If we are to usher in an era of prosperity, we must ensure that the youth are active in such a pursuit.
 TRT_extend_our_power: "Расширьте нашу силу" # Extend our Power
 TRT_extend_our_power_desc: "Просто получить большинство в парламенте недостаточно; мы должны обеспечить, чтобы наше правление проникло в жизнь всех людей и ощущалось по всей стране. Мы должны расширить свое влияние, чтобы должным образом консолидировать нашу власть, гарантируя, что никто не сможет бросить вызов нашему правлению." # Simply attaining a majority in parliament is not enough; we must ensure that our rule is pervasive in the lives of all of the people and felt throughout the nation. We must extend our reach in order to properly consolidate our power, ensuring that nobody can challenge our rule.
 TRT_empower_paramilitary_groups: "Расширение возможностей военизированных группировок" # Empower Paramilitary Groups
 TRT_empower_paramilitary_groups_desc: "Сильный лидер эффективно управляет, заставляя своих подданных бояться его гнева; расширяя возможности военизированных группировок, которые верны нашему делу, мы можем гарантировать, что люди будут бояться нас и, следовательно, подчиняться любым приказам, которые мы отдаем." # A strong leader rules effectively through keeping his subjects fearful of his wrath; by empowering paramilitary groups that are loyal to our cause we can ensure that the people will fear us and, subsequently, obey any orders we dish out.
 TRT_increased_weapons_production: "Увеличение производства оружия" # Increased Weapons Production
 TRT_increased_weapons_production_desc: "Ключевым моментом является снабжение не только военных, но и наших военизированных формирований. Для этого мы должны приказать всем доступным заводам увеличить производство оружия, что позволит нам поставлять большее количество людей за более короткий промежуток времени." # Supplying not only the military but also our paramilitary groups is key. In order to do so, we must order all available factories to up their arms production, therefore allowing us to supply a greater amount of men in a shorter amount of time.
 TRT_begin_recruitment_campaigns: "Начните кампании по набору персонала" # Begin Recruitment Campaigns
 TRT_begin_recruitment_campaigns_desc: "Хотя закупка оружия является шагом в правильном направлении, мы также требуем, чтобы мужчины использовали это оружие, если когда-либо возникнет такая необходимость. Вот почему мы должны начать кампании по вербовке и укрепить военный дух турок." # While the procurement of arms is a step in the right direction, we also require men to use those arms if the need ever arises. That is why we must begin recruitment campaigns and invigorate the military spirit of Turks.
 TRT_crush_internal_enemies: "Сокрушить внутренних врагов" # Crush Internal Enemies
 TRT_crush_internal_enemies_desc: "Мы не можем позволить внутренним врагам бродить и угрожать безопасности и стабильности государства. Вот почему мы должны взять на себя обязательство уничтожить и избавить нацию от любой внутренней угрозы, которая может возникнуть." # We cannot allow internal enemies to roam and threaten the security and stability of the state. That is why we must commit to destroying and ridding the nation of any internal threat that may arise.
 TRT_reformation_of_the_state: "Реформация государства" # Reformation of the State
 TRT_reformation_of_the_state_desc: "Многим хорошо известно, что Османская империя была устаревшим и загнивающим государством, которое держалось только благодаря чистой случайности. Если мы хотим гарантировать, что та же трагедия не постигает турецкое государство, мы должны работать над внутренним и внешним реформированием самого государства." # It is well known to many that the Ottoman Empire was an outdated and decadent state, hanging on only through sheer luck. If we are to ensure that the same tragedy does not befall the Turkish state, we must work towards the internal and external reformation of the state itself.
 TRT_promote_industrialism: "Продвигать индустриализм" # Promote Industrialism
 TRT_promote_industrialism_desc: "Чтобы обеспечить более высокий уровень жизни внутри турецкой нации, наряду с ее постепенной индустриализацией, мы должны начать обращать внимание на создание финансируемых государством заводов." # In order to allow for a greater standard of living within the Turkish nation, alongside its gradual industrialization, we must begin to turn our gaze towards the establishment of state sponsored factories.
 TRT_work_with_the_masses: "Работа с массами" # Work with the Masses
 TRT_work_with_the_masses_desc: "Мы должны утвердить свою репутацию как нации людей, созданной людьми и для людей. Вот почему мы должны работать с массами и обеспечивать их лояльность. Таким образом, мы можем свести к минимуму вероятность инакомыслия против нашего правила." # We must establish our reputation as a nation of the people, by the people, for the people. That is why we must work with the masses and secure their loyalty. That way, we can minimize the chance of dissent against our rule.
 TRT_develop_intelligence_organizations: "Развивайте разведывательные организации" # Develop Intelligence Organizations
 TRT_develop_intelligence_organizations_desc: "Чтобы подготовиться к возникновению каких-либо внутренних угроз, мы должны стремиться к созданию современных и эффективных разведывательных организаций, обладающих возможностями, необходимыми для борьбы с любыми угрозами." # In order to prepare for the event of any sort of internal threats, we must look towards the establishment of modern, and effective, intelligence organizations that possess the capabilities required to deal with any sort of threat.
 TRT_assassination_of_prominent_leftists: "Убийство видных левых" # Assassination of Prominent Leftists
 TRT_assassination_of_prominent_leftists_desc: "Левым нет места в турецком государстве. Они извергают и проповедуют наполненные ненавистью и ложные идеологические обещания, пытаясь завоевать доверие людей посредством лжи. Поскольку мирного способа справиться с ними нет, мы должны запачкать руки на благо нации." # Leftists have no place within the Turkish state. They spew and preach hate-filled and false ideological promises, attempting to gain the trust of the people through lies. Seeing as there is no peaceful way to deal with them, we must dirty our hands for the betterment of the nation.
 TRT_tear_down_old_institutions: "Снести старые институты" # Tear Down Old Institutions
 TRT_tear_down_old_institutions_desc: "Османская империя страдала от множества неэффективных и коррумпированных организаций, которые были не в состоянии выполнить даже самые простые задачи. Разрушив эти банальные институты, мы сможем обеспечить создание собственных, более эффективных институтов, которые в значительной степени будут нам лояльны." # The Ottoman Empire was plagued by a plethora of ineffective and corrupt organizations that were unable to fulfil even the simplest of tasks. By tearing down these trite institutions, we can ensure the establishment of our own, more effective institutions which will largely be loyal to us.
 TRT_rid_ourselves_of_bureaucratic_decadence: "Избавьтесь от бюрократического упадка" # Rid Ourselves of Bureaucratic Decadence
 TRT_rid_ourselves_of_bureaucratic_decadence_desc: "Нанимая эффективных и лояльных бюрократов, а также принимая меры по борьбе с коррупцией и обеспечивая соблюдение более строгих стандартов, мы можем гарантировать, что бюрократический упадок, от которого страдала поздняя Османская империя, не станет занозой на нашем глазу." # By hiring effective and loyal bureaucrats, while also passing anti-corruption measures and enforcing stricter standards, we can ensure that the bureaucratic decadence that had plagued the late Ottoman Empire shall not be a thorn in our side.
 TRT_judicial_control: "Судебный контроль" # Judicial Control
 TRT_judicial_control_desc: "Установив контроль над судебной системой, мы сможем начать консолидацию власти и обеспечить более лояльное правительство. Кроме того, у нас будет возможность контролировать и принимать решения, которые мы поддерживаем." # By establishing control of the judiciary, we can begin the consolidation of power and ensure a more loyal government. In addition, we will have the ability to control and decide rulings that we support.
 TRT_shut_down_parliament: "Закрыть парламент" # Shut Down Parliament
 TRT_shut_down_parliament_desc: "Парламент является банальным институтом и обеспечивает лишь паралич и нерешительность внутри правительства. Что действительно нужно людям, так это сильный лидер, способный править быстро, решительно и эффективно, а не вынужденный слушать споры обособленной элиты." # Parliament is a banal institution and only provides for paralysis and indecisiveness within the government. What the people truly need is a strong leader who possesses the ability to rule quickly, decisively, and effectively rather than being forced to listen to the bickering of the detached elite.

 TRT_kemalist_victorious: "Кемалистская победа" # Kemalist Victory
 TRT_kemalist_victorious_desc: "Кемалисты, после создания турецкого государства, смогли прийти к власти в разгар политического кризиса в нынешней Турецкой Республике. Выступая за платформу модернизации, кемалисты уже начали работу по формированию новой турецкой нации." # The Kemalists, following the establishment of a Turkish state, were able to come to power in the midst of a political crisis in the now Republic of Turkey. Advocating a platform of modernization, the Kemalists have already begun work on shaping the new Turkish nation.
 TRT_a_new_alphabet: "Новый алфавит" # A New Alphabet
 TRT_a_new_alphabet_desc: "Вместо того, чтобы использовать арабскую письменность, которая сама по себе устарела и не соответствует потребностям турецкого языка, лучше всего нам сбросить оковы Османской империи и использовать латинское письмо для нового турецкого языка." # Rather than use the Arabic script, which itself is outdated and ill-suited to the needs of the Turkish language, it is best we throw off the shackles of the Ottoman Empire and use a latin scripture for the new Turkish language.
 TRT_ban_the_fez: "Запретить Фес" # Ban the Fez
 TRT_ban_the_fez_desc: "Одним из больших вопросов, касающихся модернизации, является феска. Многие ведущие кемалисты считают его символом ориентализма и отсталости. Возможно, лучше всего будет отказаться от головного убора в пользу шляп западного стиля." # One of the big questions with regards to modernization is the fez. Seen by many leading Kemalists as a symbol of Orientalism and backwardness, it is perhaps best we ditch the headdress for western style hats.
 TRT_western_legal_code: "Западный правовой кодекс" # Western Legal Code
 TRT_western_legal_code_desc: "Вместо того, чтобы сохранять Мецелле, возможно, лучше было бы основывать наш гражданский кодекс на швейцарском. Таким образом, мы действительно сможем открыть эпоху модернизации нашей молодой республики и завоевать легитимность в глазах западных стран." # Rather than retaining Mecelle, perhaps it is best we base our civil code off of that of the Swiss one. That way, we can truly usher in an era of modernization for our young republic and garner legitimacy in the eyes of the Western nations.
 TRT_parliamentary_democracy: "Парламентская демократия" # Parliamentary Democracy
 TRT_parliamentary_democracy_desc: "Сохранение и даже совершенствование парламентской демократии является ключом к обеспечению демократической нации и должного представительства населения. Мы не допустим, чтобы демократические идеалы были поставлены под угрозу, независимо от ситуации." # Retaining, and even refining, parliamentary democracy is key to ensuring for a democratic nation and a properly represented populace. We shall not allow for democratic ideals to be compromised, no matter the situation.
 TRT_gregorian_calendar: "Григорианский календарь" # Gregorian Calendar
 TRT_gregorian_calendar_desc: "Поскольку это наиболее широко используемый гражданский календарь в мире, вполне естественно, что мы начинаем переходить на григорианский календарь, а не сохранять календарь Руми." # The most widely used civic calendar internationally, it is only natural that we begin the adoptation of the Gregorian calendar rather than retaining the Rumi calendar.
 TRT_reorganize_our_bureaucracy: "Реорганизуйте нашу бюрократию" # Reorganize our Bureaucracy
 TRT_reorganize_our_bureaucracy_desc: "Коррумпированная и неэффективная бюрократия была одной из самых больших проблем поздней Османской империи. Реорганизовав и укомплектовав нашу бюрократию квалифицированными политиками и государственными служащими, мы можем надеяться на процветание как государство." # The corrupt and inefficient bureaucracy was one of the biggest issues of the late Ottoman Empire. By reorganizing and staffing our bureaucracy with qualified politicians and civil servants can we hope to thrive as a state.
 TRT_bolster_the_armed_forces: "Укрепить Вооруженные Силы" # Bolster the Armed Forces
 TRT_bolster_the_armed_forces_desc: "Если идеалы лаицизма или демократии внутри нашей страны когда-либо будут поставлены под угрозу, обязанностью военных является обеспечение строгого укрепления этих идеалов и отстранение нарушителя от власти. Мы не можем позволить внутренним угрозам свергнуть нашу великую нацию." # If the ideals of laicism or democracy within our nation are ever compromised, it is the duty of the military to ensure that the ideals are strictly reinforced and the offender removed from a position of power. We cannot allow internal threats to topple our great nation.
 TRT_institute_laicism: "Институт Лаицизма" # Institute Laicism
 TRT_institute_laicism_desc: "Ключевым аспектом модернизации является обеспечение четкого определения и соблюдения разделения между религией и государством. Дав понять, что лаицизм станет ключевым компонентом республики, мы сможем гарантировать, что наша нация и ее население полностью модернизируются." # A key aspect of modernization is ensuring the separation between religion and the state is clearly defined and enforced. By making it clear that laicism will be made a key component of the republic can we ensure that our nation, and its population as well, will fully modernize.
 TRT_land_reform: "Земельная реформа" # Land Reform
 TRT_land_reform_desc: "Создавая современные фермы, мы можем обеспечить развитие наших сельскохозяйственных технологий." # Through the establishment of modern farms can we ensure the advancement of our agricultural techniques.
 TRT_social_equality: "Социальное равенство" # Social Equality
 TRT_social_equality_desc: "Приступив к реформированию османского идеала общественной сферы, мы сможем начать формировать мысли наших граждан и обеспечить более социально активное и гражданско-сознательное население." # By taking to reforming the Ottoman ideal of the public sphere can we begin to shape the thoughts of our citizens and allow for a more socially active and civically conscious population.
 TRT_womens_rights: "Права женщин" # Women's Rights
 TRT_womens_rights_desc: "Мы должны поощрять равное участие и права турецких женщин, чтобы по-настоящему модернизировать нашу нацию." # We must encourage the equal participation and rights of Turkish women so as to truly modernize our nation.
 TRT_the_sciences_and_the_arts: "Науки и искусства" # The Sciences and the Arts
 TRT_the_sciences_and_the_arts_desc: "Содействуя развитию науки и искусства, мы можем обеспечить более образованное и академически настроенное население. Это, в свою очередь, позволит нам добиться успехов в самых разных областях." # By promoting the sciences and the arts can we allow for a more educated and academically minded population. This, in turn, will allow us to make strides in a variety of fields.
 TRT_village_institutes: "Деревенские институты" # Village Institutes
 TRT_village_institutes_desc: "Создавая сельские институты, мы можем гарантировать, что все турецкие граждане, проживающие в городах или в сельской местности, смогут получить высокий уровень образования." # By establishing village institutes we can ensure that all Turkish citizens, urban or rural dwelling, can secure a high standard of education.
 TRT_financial_reform: "Финансовая реформа" # Financial Reform
 TRT_financial_reform_desc: "Установив новые стандарты наших финансов, создав центральный банк и разобравшись с нашими внешними долгами, мы сможем обеспечить финансовую стабильность республики." # By establishing new standards for our finances, creating a central bank, and dealing with our foreign debts can we ensure the financial stability of the republic.
 TRT_state_owned_enterprise: "Государственное предприятие" # State-Owned Enterprise
 TRT_state_owned_enterprise_desc: "Мы должны заняться созданием спонсируемых и контролируемых правительством организаций, которые, как мы надеемся, позволят нам продвигать индустриализм в Турции. Это, в свою очередь, позволит нам индустриализировать нашу страну беспрецедентными темпами." # We must take to creating government-sponsored and government-controlled organizations which will, hopefully, allow for us to promote industrialism within Turkey. This will, in turn, allow us to industrialize our nation at an unprecedented rate.
 TRT_the_turkish_constitution: "Конституция Турции" # The Turkish Constitution
 TRT_the_turkish_constitution_desc: "Чтобы обрести легитимность в международном сообществе и в глазах нашего народа, а также укрепить наше видение Турции, мы должны начать разработку и ратификацию истинно турецкой конституции." # In order to gain legitimacy within the international community and the eyes of our people, alongside solidifying our vision for Turkey, we must begin to draft and ratify a truly Turkish constitution.
 TRT_guardians_of_the_constitution: "Хранители Конституции" # Guardians of the Constitution
 TRT_guardians_of_the_constitution_desc: "Мы должны и дальше укреплять наши вооруженные силы, чтобы они могли успешно защищать идеалы, заложенные в конституции, и, в свою очередь, продвигать и обеспечивать стабильность в Турции." # We must further bolster our armed forces as to allow for them to successfully defend the ideals laid out in the constitution and, in turn, promote and enforce stability in Turkey.

 TRT_a_moderate_empire: "Умеренная империя" # A Moderate Empire
 TRT_a_moderate_empire_desc: "Мы не можем позволить радикальным силам прийти к власти внутри империи и подорвать нашу репутацию во всем мире. Посадив на трон султана Ахмеда Нихада, мы надеемся либерализовать нашу империю и добиться того, чего не смогли наши предшественники. То есть вестернизация нашей империи." # We cannot allow for radical forces to take power within the empire and erode our reputation worldwide. By placing Sultan Ahmed Nihad on the throne, we can hopefully liberalize our empire and accomplish what our predecessors could not. That is, the westernization of our empire.
 TRT_assertion_of_royal_prerogatives: "Берем дело в свои руки" # Taking Matters into our Own Hands
 TRT_assertion_of_royal_prerogatives_desc: "Мы больше не можем позволять внешним и даже внутренним силам диктовать нашу политику. Мы должны взять дело в свои руки и сформировать будущее Османской империи для будущих поколений!" # No longer can we allow external, and even internal, forces to dictate our policy. We must take matters into our own hands and shape the future of the Ottoman Empire for the generations to come!
 TRT_rewrite_the_constitution: "Переписать Конституцию" # Rewrite the Constitution
 TRT_rewrite_the_constitution_desc: "Действующая конституция во многих аспектах очень неясна или устарела. Переписав его, мы сможем добиться легитимности в глазах нашего народа и накопить больше власти, чтобы довести до конца любые будущие реформы." # The current constitution is very unclear or outdated in many aspects. By rewriting it, we can garner legitimacy in the eyes of our people and amass greater power to see through any future reforms.
 TRT_dealing_with_the_bureaucracy: "Борьба с бюрократией" # Dealing with the Bureaucracy
 TRT_dealing_with_the_bureaucracy_desc: "Очевидная истина – это упадок и неэффективность османской бюрократии. Укомплектовав нашу бюрократию квалифицированными и добросовестными государственными служащими, мы можем обеспечить большую эффективность внутри нашего государства." # An apparent truth is the decadence and inefficiency of the Ottoman bureaucracy. By staffing our bureaucracy with qualified and scrupulous civil servants, we can allow for greater efficiency within our state.
 TRT_finish_the_tanzimat_reforms: "Завершить реформы Танзимата" # Finish the Tanzimat Reforms
 TRT_finish_the_tanzimat_reforms_desc: "Хотя реформы Танзимата в некоторой степени либерализовали нашу империю, сами реформы не зашли достаточно далеко и произошли очень поздно. Мы должны избегать ошибок наших предшественников, если хотим пережить эти трудные времена." # While the Tanzimat reforms did liberalize our empire to an extent, the reforms themselves did not go far enough and came at a very late time. We must avoid the mistakes of our predecessors if we are to survive these trying times.
 TRT_decentralized_rule: "Децентрализованное правило" # Decentralized Rule
 TRT_decentralized_rule_desc: "Подчиняясь губернаторам различных провинций, а не управляя напрямую из Константинийе, мы можем обеспечить большее представительство нашего народа." # By deferring to the governors of the various provinces, rather than directly governing from Kostantiniyye, can we ensure the greater representation of our people.
 TRT_reform_the_banking_system: "Реформировать банковскую систему" # Reform the Banking System
 TRT_reform_the_banking_system_desc: "Продолжая реформирование и капитальный ремонт нашей банковской системы, а также расширяя возможности центрального банка, мы сможем обеспечить стабильность нашей валюты." # By continuing the reformation and overhaul of our banking system, and empowering the central bank, can we ensure the stability of our currency.
 TRT_work_to_pay_off_our_debts: "Работайте, чтобы погасить наши долги" # Work to Pay Off our Debts
 TRT_work_to_pay_off_our_debts_desc: "OPDA уже давно истощает нашу экономику и сковывает нас, лишая экономической независимости. Только расплатившись с долгами перед кредиторами, мы сможем проводить независимую экономическую политику." # The OPDA has long been a drain on our economy and has shackled us, disallowing economic independence. Only by paying off our debts to our creditors can we pursue an independent economic policy.
 TRT_multi_party_system: "Многопартийная система" # Multi-Party System
 TRT_multi_party_system_desc: "Продвигая многопартийную систему, которая сама по себе будет демократической, можем ли мы надеяться на полное представительство взглядов нашего народа, одновременно укрепляя идею о том, что наша страна является парламентской демократией." # By promoting a multi-party system, which in itself will be democratic, can we hope to allow for the full representation of the views of our people while also solidifying the idea that our nation is a parliamentary democracy.
 TRT_transition_to_a_constitutional_monarchy: "Переход к конституционной монархии" # Constitutional Monarchy Transition
 TRT_transition_to_a_constitutional_monarchy_desc: "Исторически султан обладал огромной властью и влиянием в Османской империи. Делегируя задачи ключевым членам правительства и взяв на себя роль конституционного монарха, мы можем надеяться на либерализацию нашей империи и обеспечение процветания демократии." # Historically, the Sultan has held great power and influence within the Ottoman Empire. By delegating tasks to key members of the government and taking on a role of a constitutional monarch can we hope to liberalize our empire and allow for democracy to flourish.
 TRT_provide_education_to_the_people: "Обеспечивать образование людям" # Provide Education to the People
 TRT_provide_education_to_the_people_desc: "Крайне важно, чтобы мы поощряли и способствовали развитию образованных граждан. Это, в свою очередь, позволит сделать население более граждански сознательным и сильным." # It is key that we promote and allow for the development of an educated citizenry. This, in turn, will allow for a more civically conscious and stronger population.
 TRT_ensure_judicial_fairness: "Обеспечить судебную честность" # Ensure Judicial Honesty
 TRT_ensure_judicial_fairness_desc: "Ключевым элементом любого демократического общества является наличие независимой судебной власти. Создавая высокие стандарты для нашей судебной системы, мы можем обеспечить отсутствие коррупции в империи." # A key staple of any democratic society is the presence of an independent judiciary. By creating high standards for our judiciary we can allow for a lack of corrpution in the empire.
 TRT_ending_corruption: "Покончить с коррупцией" # Ending Corruption
 TRT_ending_corruption_desc: "Коррупция посредством взяток, услуг и других методов уже давно разрешена внутри империи. Определив и внедрив строгий набор стандартов для наших политиков и государственных служащих, мы можем победить эту проблему, которая так долго мучила нашу великую империю." # Corruption, through bribes, favours, or other methods, has long been allowed within the empire. By defining and enforcing a strict set of standards for our politicians and civil servants, we can defeat this issue which has plagued our great empire for so long.
 TRT_an_inclusive_empire: "Инклюзивная империя" # An Inclusive Empire
 TRT_an_inclusive_empire_desc: "Мы никогда не должны допускать, чтобы демократические и инклюзивные идеалы империи были поставлены под угрозу. Порядок, установленный султаном Ахмедом IV, должен сохраниться для будущих поколений. Да здравствует султан и да здравствует османский народ!" # We must never allow for the democratic and inclusive ideals of the empire to be compromised. The order established by Sultan Ahmed IV must remain for generations to come. Long live the Sultan and long live the Ottoman people!
 TRT_reform_the_political_system: "Реформировать политическую систему" # Reform the Political System
 TRT_reform_the_political_system_desc: "Политическая система, которая, во многом благодаря британцам, в некоторой степени близка к системе западных стран. Очевидно, что мы должны положить конец этой системе, поскольку она представляет собой контроль Запада над нашей страной." # The political system, which, in large part due to the British, is somewhat close to that of the Western nations. It is clear that we must put an end to this system as it represents Western control over our nation.
 TRT_establish_control_over_the_judiciary: "Установить контроль над судебной властью" # Establish Control over the Judiciary
 TRT_establish_control_over_the_judiciary_desc: "Ключевым моментом является установление контроля над судебной властью. Мы не можем допустить, чтобы мошеннические элементы внутри правительства препятствовали прогрессу, достигнутому султаном." # Establishing control over the judiciary is key. We cannot allow for rogue elements within the government to hinder the progress made by the Sultan.
 TRT_appoint_a_loyal_grand_vizier: "Назначьте верного великого визиря" # Appoint a Loyal Grand Vizier
 TRT_appoint_a_loyal_grand_vizier_desc: "Чтобы укрепить нашу власть над правительством, мы должны назначить опытного, но лояльного Великого Визиря. Таким образом, мы можем свести к минимуму разногласия внутри правительства." # In order to solidify our power over the government, we must take to appointing an experienced, yet loyal, Grand Vizier. That way, we can minimize dissent within the government.
 TRT_solidify_the_power_of_the_sultan: "Укрепить власть султана" # Solidify the Power of the Sultan
 TRT_solidify_the_power_of_the_sultan_desc: "Мы должны напомнить ветвям власти, что султан, суверен османского народа, обладает наибольшей властью и формирует государство." # We must remind the branches of the government that the Sultan, the sovereign of the Ottoman people, holds the most power and shapes the state.
 TRT_reeducate_the_masses: "Перевоспитать массы" # Re-educate the Masses
 TRT_reeducate_the_masses_desc: "Программы перевоспитания играют ключевую роль, если мы хотим мобилизовать тех, кто моложе, и вдохновить их сражаться за империю." # Re-education programs are key if we are to mobilize those that are younger and inspire them to fight for the empire.
 TRT_silence_all_opposition: "Заставить замолчать оппозицию" # Silence the Opposition
 TRT_silence_all_opposition_desc: "Оппозиция, которая долгое время была занозой на нашем глазу, в настоящее время чрезвычайно активна. Мы должны заставить их замолчать ради общего блага империи." # Long having been a thorn in our side, the opposition has been extremely vocal during present times. We must take to silencing them for the greater good of the empire.
 TRT_disband_parliament: "Распустить парламент" # Disband Parliament
 TRT_disband_parliament_desc: "Парламенту было предоставлено слишком много власти и свободы правления, что мешает нашей империи и служит лишь сдерживанию власти султана. Мы должны немедленно упразднить этот устаревший и упадочный институт." # Parliament has been given too much power and free reign, hindering our empire and only serving to hold back to Sultan's power. We must abolish this outdated and decadent institution immediately.
 TRT_the_phoenix: "Феникс" # The Phoenix
 TRT_the_phoenix_desc: "Подобно фениксу, мы восстали из пепла и находимся на пути восстановления величия нашей империи. Да здравствует султан Осман IV!" # Like a phoenix, we have risen from the ashes and are on the path of restoring our empire to greatness. Long live Sultan Osman IV!
 TRT_economic_mobilization: "Экономическая мобилизация" # Economic Mobilization
 TRT_economic_mobilization_desc: "Мы должны быстро начать преобразование нашей экономики из экономики, которая в основном базируется на гражданских целях, в экономику, которая служит для укрепления и обеспечения армии всем необходимым." # We must quickly begin the conversion of our economy from that of one that is largely civilian based to one that serves to strengthen and provide the military with what it needs.
 TRT_mandatory_conscription: "Обязательная воинская повинность" # Mandatory Conscription
 TRT_mandatory_conscription_desc: "Для осуществления наших планов по восстановлению былого величия Османской империи нам требуются трудоспособные мужчины для службы под нашим командованием и укомплектования нашей армии." # In order to carry out our plans of restoring the former greatness of the Ottoman Empire, we require able-bodied men to serve under our command and staff our army.

 TRT_foreign_policy: "Внешняя политика" # Foreign Policy
 TRT_foreign_policy_desc: "Крайне важно, чтобы мы начали брать будущее нашей страны в свои руки и самостоятельно решать вопросы внешней политики, которые требуют нашего немедленного внимания." # It is paramount that we begin to take the future of our nation into our own hands and independently deal with the foreign policy issues that demand our immediate attention.
 TRT_remil_istanbul: "Ремилитаризация Стамбула" # Remilitarize Istanbul
 TRT_remil_istanbul_desc: "По окончании Великой войны Антанта вынудила нас демилитаризовать пролив Босфор в рамках договора, положившего конец войне. Пришло время взять дело в свои руки и официально положить конец этой политике." # Upon the conclusion of the Great War, we were forced by the Entente to demilitarize the Bosphorus Straits as part of the treaty that had ended the war. It is time we take matters into our own hands and officially end the policy.
 TRT_join_stahlpakt: "Подайте заявку на вступление в Штальпакт" # Apply to Join the Stahlpakt
 TRT_join_stahlpakt_desc: "Германия, которая когда-то была ярым союзником во время Великой войны, снова накопила власть и начинает вступать в новую эпоху превосходства. Если мы хотим обеспечить себе место в ближайшие годы, вполне естественно, что мы присоединимся к ним в союзе дружбы." # Germany, once an ardent ally during the Great War, has once again amassed power and is beginning to enter a new age of supremacy. If we are to ensure our place in the coming years, it is only natural that we join them in an alliance of friendship.
 TRT_demand_trabzon: "Спрос Трабзон" # Demand Trabzon
 TRT_demand_trabzon_desc: "Район Трабзон, ныне большей частью контролируемый Арменией, по праву принадлежит нашему народу. Таким образом, мы должны вернуть его любыми необходимыми средствами." # The region of Trabzon, now controlled, for the most part, by Armenia, rightfully belongs to our nation. As such, we must take it back by any means necessary.
 TRT_crush_arm: "Раздавить Армению" # Crush Armenia
 TRT_crush_arm_desc: "Мы больше не можем, чтобы Армения оставалась угрозой на наших границах. В нынешнем виде их владение нашими основными землями ослабляет нас. Мы должны немедленно решить эту проблему." # We can no longer Armenia to remain a threat on our borders. As it currently stands, their possession of our core lands weakens us. We must remedy this issue at once.
 TRT_erz_pleb: "Жители Эрзурума" # Erzurum Plebiscite
 TRT_erz_pleb_desc: "Учитывая, что большинство граждан Эрзурума составляют турки, вполне естественно, что мы просим провести плебисцит, который, скорее всего, закончится в нашу пользу." # Seeing as the majority of the citizens within Erzurum are Turkish, it is only natural that we ask for a plebiscite that will, most likely, end in our favour.
 TRT_destroy_kurds: "Уничтожить курдов" # Destroy the Kurds
 TRT_destroy_kurds_desc: "Курды владеют Ваном, что имеет геополитическое значение, когда дело доходит до наших отношений с Ираном. Мы должны вернуть себе этот кусок земли любой ценой." # The Kurds possess Van, which is geopolitically important when it comes to our dealings with Iran. We must retake this piece of land at all costs.
 TRT_conquer_arabia: "Покори арабов" # Conquer the Arabs
 TRT_conquer_arabia_desc: "Чтобы восстановить наше присутствие на Ближнем Востоке, мы должны вернуть себе наши земли на юге. Однако это будет непросто, и мы должны подготовиться к тяжелой войне." # In order to re-establish our presence within the Middle East, we must take to retaking our lands back in the south. This will not be easy, however, and we must prepare ourselves for an arduous war.
 TRT_put_down_the_mashriqis: "Положите Машрики" # Put Down the Mashriqis
 TRT_put_down_the_mashriqis_desc: "Британцы сочли целесообразным заявить права на наши владения, взяв с собой Левант и создав в этом районе государство Машрики. Мы должны исправить эту ошибку и немедленно вернуть себе нашу законную территорию!" # The Brits have seen fit to claim our domain for themselves, taking with them the Levant and creating a Mashriqi state in the area. We must correct this wrong, and re-claim our rightful territory at once!
 TRT_demand_aydin: "Требуйте Айдын из Греции" # Demand Aydin from Greece
 TRT_demand_aydin_desc: "Греции слишком долго разрешалось владеть Айдыном, основным государством нашей великой нации. Мы должны потребовать вернуть эту территорию или вернуть ее любыми другими необходимыми средствами." # Greece has, for far too long, been allowed to own Aydin, a core state of our great nation. We must demand the territory back, or take it back by any other means necessary.
 TRT_reclaim_west: "Верните наши западные земли!" # Reclaim our Western Lands!
 TRT_reclaim_west_desc: "Наши западные земли, особенно Измир и Тракия, являются ключом к установлению нашего присутствия в Европе и Эгейском море, а также к обеспечению нашего контроля над Босфором. Мы должны вернуть эти земли любой ценой." # Our western lands, especially Izmir and Trakya, are key to establishing our presence in the Europe and the Aegean Sea in addition to ensuring our control over the Bosphorus. We must take back these lands at all costs.
 TRT_petition_italy: "Петиция Италия" # Petition Italy
 TRT_petition_italy_desc: "Весь наш доступ к Средиземному морю перекрыт итальянцами, владеющими нашим южным побережьем. Важно, чтобы мы любой ценой вернули себе контроль над этой землей." # The entirety of our access to the Mediterranean is blocked off by the Italians, who are in possession of our southern coast. It is important that we regain control of this land at all costs.
 TRT_maltaya_status: "Статус Мальтайи" # Status of Maltaya
 TRT_maltaya_status_desc: "После Великой войны французам были переданы части южной Анатолии. Мы должны немедленно исправить этот вопрос и потребовать права собственности на нашу землю." # The French were given portions of southern Anatolia following the Great War. We must correct this issue at once and demand ownership of our land.

 TRT_economic_affairs: "Экономические вопросы" # Economic Affairs
 TRT_economic_affairs_desc: "После обвала лондонского рынка создается впечатление, что наша и без того находящаяся в упадке экономика только еще больше пострадала от последовавшей за этим паники. Похоже, настала необходимость переоценки нашей экономической политики." # Following the London Market Collapse, it seems as though our already declining economy has only been hurt even more by the ensuing panic. It seems the re-evaluation of our economic policies are in order.
 TRT_resource_exploitation: "Эксплуатация ресурсов" # Resource Exploitation
 TRT_resource_exploitation_desc: "Анатолия — богатый ресурсами регион, в котором добывается много хрома и стали. Мы должны воспользоваться изобилием этих ресурсов и начать добычу полезных ископаемых." # Anatolia is a resource rich region, with much chromium and steel existing within the region itself. We must take advantage of our abundance of these resources and begin mining operations.
 TRT_industrial_development: "Промышленное развитие" # Industrial Development
 TRT_industrial_development_desc: "Если мы хотим когда-либо догнать наших европейских коллег, нам крайне важно начать индустриализацию страны. Активно спонсируя строительство государственных заводов, мы можем начать способствовать постепенной индустриализации нашей страны." # If we are to ever catch up to our European counterparts, it is key that we begin the industrialization of the nation. By actively sponsoring the construction of state-owned factories, we can begin to allow for the gradual industrialization of our nation.
 TRT_agricultural_methods: "Сельскохозяйственные методы" # Agricultural Methods
 TRT_agricultural_methods_desc: "Совершенствуя методы ведения сельского хозяйства и инструменты, используемые нашими фермерами, мы можем обеспечить больший объем сельскохозяйственного производства более эффективными темпами." # By upgrading our agricultural methods and the tools used by our farmers, we can ensure greater agricultural output at a more efficient pace.
 TRT_nationalization_of_railways: "Национализация железных дорог" # Nationalization of Railways
 TRT_nationalization_of_railways_desc: "В нынешнем виде OPDA имеет очень большое влияние, когда дело касается владения железными дорогами в нашей стране. Хотя это может разозлить некоторые страны, крайне важно, чтобы мы вернули себе контроль над нашей экономикой и отстояли свою независимость на мировой арене." # As it stands, the OPDA is very much influential when it comes to the ownership of railways within our nation. While this may anger a few nations, it is paramount that we retake control of our economy and assert our independence on the world stage.
 TRT_austerity_programs: "Программы жесткой экономии" # Austerity Programs
 TRT_austerity_programs_desc: "Чтобы обеспечить восстановление нашей экономики, мы должны сократить расходы в отдельных областях. Хотя в краткосрочной перспективе это будет непопулярная мера, она будет чрезвычайно полезна, вытащив нас из экономической колеи, в которой мы оказались." # In order to allow for the recovery our economy, we must cut spending in select areas. While this will be an unpopular measure in the short term, it will be extremely beneficial in pulling us out of the economic rut we've found ourselves in.
 TRT_subsidization_of_industry: "Субсидирование промышленности" # Subsidization of Industry
 TRT_subsidization_of_industry_desc: "Субсидирование вновь созданных заводов, спонсируемых государством, позволит нам снять бремя с самих заводов, а также позволит повысить производительность." # Subsidizing the newly created state-sponsored factories will go a long way in allowing for us to take the burden off of the factories themselves while also allowing for greater productivity.
 TRT_broaden_our_horizons: "Расширьте наш кругозор" # Broaden our Horizons
 TRT_broaden_our_horizons_desc: "Важно, чтобы мы начали думать о том, чтобы обратить свой взор за границу и искать торговых партнеров, которые помогут нам справиться с экономическим кризисом, в котором мы оказались втянуты." # It is important that we begin to consider pivoting our gaze abroad and seeking out trade partners to help aid us with the economic crisis we have found ourselves embroiled in.
 TRT_foundation_of_the_defence_industry: "Фонд оборонной промышленности" # Foundation of the Defence Industry
 TRT_foundation_of_the_defence_industry_desc: "Ключевым моментом является то, что для увеличения производства пушек и других видов оружия мы начинаем разрешать создание заводов, которые могут помочь нам подготовить почву для создания полноценной оборонной промышленности." # It is key that, in order to boost our production of guns and other types of weapons, we begin allowing for the creation of factories that can aid us with setting the stage for the foundation of a proper defence industry.
 TRT_establishment_of_radio_networks: "Создание радиосетей" # Establishment of Radio Networks
 TRT_establishment_of_radio_networks_desc: "Создание условий для создания радиосетей позволит обеспечить экономическое развитие в области радиолокационных технологий, а также обеспечит более тесную связь между людьми и средствами массовой информации." # Paving the way for the creation of radio networks will allow for economic development in the field of RADAR technology while also ensuring greater communication between the people and the media.
 TRT_koc_holding: "Коч Холдинг" # Koç Holding
 TRT_koc_holding_desc: "Сотрудничество с Koç Holding, одной из крупнейших и наиболее известных фирм в нашей стране, было бы выгодно с точки зрения дальнейшей индустриализации нашей страны, а также оказания помощи в создании рабочих мест." # Working with Koç Holding, one of the biggest and most well-known firms in our nation, would be advantageous in terms of the further industrialization of our nation alongside assisting with job creation efforts.
 TRT_anatolian_railway: "Анатолийская железная дорога" # Anatolian Railway
 TRT_anatolian_railway_desc: "Стимулируя создание Анатолийской железной дороги, мы сможем лучше связать наши основные земли и обеспечить эффективную транспортировку товаров и войск." # By spurring the creation of an Anatolian Railway, we can better link our core lands and ensure for the efficient transportation of goods and troops.
 TRT_the_central_bank: "Центральный банк" # The Central Bank
 TRT_the_central_bank_desc: "Обеспечение стабильности центрального банка будет иметь большое значение для обеспечения стабильности нашей валюты и удовлетворенности потребителей." # Ensuring the stability of the central bank will go a long way in ensuring the stability of our currency and consumer satisfaction.
 TRT_kirikkale_steel: "Кырыккале Сталь" # Kırıkkale Steel
 TRT_kirikkale_steel_desc: "Было бы разумно начать добычу полезных ископаемых в Кырыккале, который богат запасами стали, чтобы еще больше увеличить нашу экономическую продукцию на мировых рынках." # It would be wise to begin resource extraction operations in Kırıkkale, which is bountiful in terms of the steel resources it possesses, in order to further boost our economic output to the world markets.
 TRT_robert_college: "Роберт Колледж" # Robert College
 TRT_robert_college_desc: "Основанный в 1863 году американским филантропом и американским миссионером, Роберт-Колледж превратился в ведущее высшее учебное заведение в стране. Обеспечив финансирование университета и укомплектовав его квалифицированными кадрами, мы сможем обеспечить более высокий образовательный уровень наших граждан." # Founded in 1863 by an American philanthropist and an American missionary, Robert College has grown to become the top institution of higher education within the nation. By ensuring the funding of the university alongside staffing it with qualified personnel, we can allow for the greater educational development of our citizenry.
 TRT_redistribution_of_land: "Перераспределение земли" # Redistribution of Land
 TRT_redistribution_of_land_desc: "Перераспределение земли среди фермеров, которые смогут лучше ее использовать, вместо того, чтобы позволять ей постепенно гнить в руках богатых, является ключевым моментом, если мы хотим достичь максимального экономического результата." # Redistributing land to the farmers who can make better use of it, rather than allowing it gradually rot in the hands of the rich, is key if we are to achieve maximum economic output.
 TRT_economic_prosperity: "Экономическое процветание" # Economic Prosperity
 TRT_economic_prosperity_desc: "Похоже, что годы экономических инвестиций в нужные области наряду с постепенной, но устойчивой индустриализацией страны позволили нам, наконец, заявить о себе как об экономически стабильной стране." # It seems as though years of economic investment in the proper fields alongside the gradual, yet steady, industrialization of the nation has allowed for us to finally declare ourselves as economically stable.

 TRT_inspecting_the_military: "Инспектирование военных" # Inspecting the Military
 TRT_inspecting_the_military_desc: "Важно, чтобы мы обратили свой взор на возможную профессионализацию и дальнейшее развитие нашей армии, чтобы не оказаться осажденными со всех сторон враждебными и иностранными державами, стремящимися разрушить наше великое государство." # It is important that we turn our gaze towards the eventual professionalization and further development of our military, lest we find ourselves besieged on all sides by hostile and foreign powers, eager to dismantle our great state.
 TRT_military_colleges: "Военные колледжи" # Military Colleges
 TRT_military_colleges_desc: "Инвестирование в военные колледжи — отличный способ обеспечить формирование надлежащего и квалифицированного офицерского корпуса, способного справиться с любыми проблемами, с которыми он может столкнуться." # Investing in military colleges is a great way to ensure the development a proper and skilled officer corps, able to defeat whatever challenges it may face.
 TRT_professionalization_of_the_military: "Профессионализация военных" # Professionalization of the Military
 TRT_professionalization_of_the_military_desc: "Мы должны обеспечить, чтобы все наши люди были в отличной форме в случае войны. Все наши люди должны иметь уверенность в том, что они будут должным образом обучены и снабжены." # We must ensure that all of our men are in top shape in the event of a war. All of our men must have the assurance that they will be properly trained and supplied.
 TRT_field_exercises: "Полевые учения" # Field Exercises
 TRT_field_exercises_desc: "Проведение полевых учений — лучший способ убедиться, что мы в курсе любых доктрин и способны бороться с этими новыми доктринами. Кроме того, полевые учения помогут дисциплинировать наши войска." # Conducting field exercises is the best way to ensure that we are up to date on any sort of doctrines and are able to combat those newer doctrines. In addition, field exercises will help discipline our troops.
 TRT_equipment_modernization: "Модернизация оборудования" # Equipment Modernization
 TRT_equipment_modernization_desc: "Модернизация нашего старого оборудования и оборудования имеет ключевое значение, если мы хотим получить преимущество над нашими врагами. Кроме того, улучшение наших производственных возможностей, безусловно, является приоритетом для любой хорошо снабжаемой армии." # Upgrading our old equipment and hardware is key if we are to gain an advantage over our enemies. In addition, improving our production capabilities is certainly a priority for any well-supplied military.
 TRT_british_assistance: "Британская помощь" # British Assistance
 TRT_british_assistance_desc: "Крайне важно обратиться к британцам, которые известны своими профессиональными вооруженными силами, и заручиться военной помощью." # It is vital that we turn to the British, who are renowned for their professional armed forces, and secure military aid.
 TRT_german_assistance: "Немецкая помощь" # German Assistance
 TRT_german_assistance_desc: "Крайне важно, чтобы мы обратились к немцам, которые известны своими хорошо дисциплинированными вооруженными силами, и заручились военной помощью." # It is vital that we turn to the Germans, who are renowned for their well disciplined armed forces, and secure military aid.
 TRT_gendarmerie_general_command: "Главное командование жандармерии" # Gendarmerie General Command
 TRT_gendarmerie_general_command_desc: "Чтобы более эффективно охранять нашу страну, мы должны начать направлять больше средств в пользу Главного командования жандармерии, что позволит нам нанимать больше и более квалифицированных сотрудников правоохранительных органов." # In order to more effectively police our nation, we must begin to divert greater funding towards the Gendarmerie General Command, allowing us to higher more, and higher quality, law enforcement officers.
 TRT_field_artillery: "Полевая артиллерия" # Field Artillery
 TRT_field_artillery_desc: "Артиллерия была ключевым компонентом войны со времен наполеоновских войн и сыграла решающую роль во время Вельткрига. Инвестиции в эту технологию были бы чрезвычайно полезны, поскольку артиллерия может вести огонь на расстояния, недоступные для пехоты." # Artillery has been a key component of war ever since the Napoleonic Wars and had played a crucial role during the Weltkrieg. Investing in this technology would be extremely helpful as artillery is able to be fired towards distances that infantry cannot reach.
 TRT_general_staff: "Генеральный штаб" # General Staff
 TRT_general_staff_desc: "Обеспечивая, чтобы только высшие офицеры могли служить в Генеральном штабе, мы можем гарантировать удовлетворение административных, логистических и оперативных потребностей наших вооруженных сил." # By ensuring that only top officers are allowed to serve as the General Staff, we can ensure that the administrative, logistical, and operational needs of our military are met.
 TRT_contracts_with_royal_arsenal: "Контракты с Королевским Арсеналом" # Contracts with Royal Arsenal
 TRT_contracts_with_royal_arsenal_desc: "Учитывая, что Великобритания более чем готова помочь нам в модернизации наших вооруженных сил, возможно, было бы лучше обратиться к Royal Arsenal, одной из их ведущих компаний, и заключить контракт на новое оборудование." # Seing as Britain has been more than willing to assist us in the modernization of our military, perhaps it would best to reach out to Royal Arsenal, one of their top companies, and secure a contract for new equipment.
 TRT_contracts_with_mauser: "Контракты с Маузером" # Contracts with Mauser
 TRT_contracts_with_mauser_desc: "Учитывая, что Германия более чем готова помочь нам в модернизации наших вооруженных сил, возможно, было бы лучше обратиться к Mauser, одной из их ведущих компаний, и заключить контракт на новое оборудование." # Seing as Germany has been more than willing to assist us in the modernization of our military, perhaps it would best to reach out to Mauser, one of their top companies, and secure a contract for new equipment.
 TRT_support_equipment: "Вспомогательное оборудование" # Support Equipment
 TRT_support_equipment_desc: "Логистика, полевые госпитали и инженеры — важнейшие элементы поддержки любого подразделения. Если мы хотим сражаться умнее, обеспечить сохранение наших людей и выйти победителями, мы должны добиться успехов в области вспомогательного оборудования." # Logistics, field hospitals, and engineers are all crucial support elements to any division. If we are to fight smarter, and allow for the preservation of our men and emerge victorious, we must make strides in the field of support equipment.
 TRT_armoured_vehicles: "Бронированные автомобили" # Armoured Vehicles
 TRT_armoured_vehicles_desc: "Моторизованная пехота имеет решающее значение, поскольку она обеспечивает защиту от огня противника и может помочь перебросить наши войска из одного места в другое на быстрой скорости." # Motorised infantry is crucial in that it provides protection from enemy fire and can help transfer our troops from one place to another at swift speeds.
 TRT_tank_research: "Исследование танков" # Tank Research
 TRT_tank_research_desc: "Танки, изобретенные британцами в 1916 году во время Вельткрига, способны прорывать линии противника и обладают невиданной ранее огневой мощью. Исследование брони будет иметь решающее значение для любых будущих военных усилий." # Invented by the British in 1916 during the Weltkrieg, tanks are able to breakthrough enemy lines and possess firepower never before seen. Researching armour will be crucial to any future war efforts.
 TRT_special_forces_command: "Командование спецназа" # Special Forces Command
 TRT_special_forces_command_desc: "Инвестирование средств в создание оперативной группы спецназа имеет решающее значение, если мы хотим проводить тайные операции эффективным и результативным образом." # Investing funds into the creation of a special forces task force is crucial if we are to conduct covert operations in an efficient and effective manner.
 TRT_rearmament: "Перевооружение" # Rearmament
 TRT_rearmament_desc: "Мы должны начать медленное, но неуклонное перевооружение наших войск, чтобы быть готовыми к любым угрозам, внутренним или внешним." # We must begin the slow, yet steady, rearmament of our troops in order to ready ourselves for any threats, internal or external.
 TRT_maintaining_readiness: "Поддержание готовности" # Maintaining Readiness
 TRT_maintaining_readiness_desc: "Поддержание боеготовности перед лицом противника и подготовка даже к самым злейшим противникам являются ключом к любой современной военной силе." # Maintaining readiness in the face of adversary and preparing for even the worst of opponents is key to any modern military force.
 TRT_engineering_schools: "Инженерные школы" # Engineering Schools
 TRT_engineering_schools_desc: "Модернизация нашего вспомогательного оборудования и возможность специализации в армии являются ключом к улучшению нашей тактики." # Upgrading our support equipment and allowing for specialization within the military is key to improving our tactics.

 TRT_naval_considerations: "Военно-морские соображения" # Naval Considerations
 TRT_naval_considerations_desc: "Крайне важно, чтобы мы обратили внимание на расширение и поддержание нашего военно-морского флота, особенно учитывая быстрые изменения, происходящие в военно-морской войне, и большое значение, придаваемое обладанию надлежащим военно-морским флотом." # It is paramount that we turn our gaze towards the expansion and maintainence of our navy, especially considering the rapid changes being made to naval warfare and the great importance being placed on the possessesion of a proper navy.
 TRT_naval_infantry: "Морская пехота" # Naval Infantry
 TRT_naval_infantry_desc: "Инвестируя в ресурсы, необходимые для создания и развития морской пехоты, мы можем надеяться вести войну непредвиденным и эффективным образом." # By investing in the resources to allow for the foundation and development of marines can we hope to conduct warfare in an unforseen and effective manner.
 TRT_commission_naval_cruisers: "Комиссионные военно-морские крейсеры" # Commission Naval Cruisers
 TRT_commission_naval_cruisers_desc: "Крайне важно начать ввод в строй современных военно-морских крейсеров, чтобы лучше защищаться от угрозы современных кораблей противника." # It is key that we begin commissioning modern naval cruisers so as to better defend from the threat of modern enemy ships.
 TRT_sabotaging_enemy_supply_lines: "Саботаж линий снабжения противника" # Sabotaging Enemy Supply Lines
 TRT_sabotaging_enemy_supply_lines_desc: "Чтобы обеспечить возможность эффективно уничтожать морские пути противника и наносить удары по неподготовленным кораблям противника, мы должны начать строительство подводных лодок." # In order to ensure that we can effectively destroy enemy shipping routes and strike at unprepared enemy ships, we must begin the construction of submarines.
 TRT_pendik_naval_shipyard: "Военно-морская верфь Пендик" # Pendik Naval Shipyard
 TRT_pendik_naval_shipyard_desc: "Чтобы увеличить наши возможности судостроения, мы должны обратиться к созданию военно-морской верфи в Пендике, районе на азиатской стороне Босфора." # In order to increase our shipbuilding capabilities, we must turn towards the establishment of a naval shipyard in Pendik, a district on the Asian side of the Bosphorus.
 TRT_naval_doctrines: "Военно-морские доктрины" # Naval Doctrines
 TRT_naval_doctrines_desc: "Предоставление нашим адмиралам возможности координировать и наносить на карту маршрут, по которому пройдет наш флот, а также обучение наших военно-морских офицеров адаптации к этим новым методам будет иметь решающее значение для модернизации и укрепления нашего военно-морского флота." # Allowing our admirals to co-ordinate and map our the route our navy will take alongside training our naval officers to adapt to these new techniques will be crucial in modernising and strengthening our navy.
 TRT_building_destroyers: "Разрушители зданий" # Building Destroyers
 TRT_building_destroyers_desc: "Эсминцы — прочные и маневренные корабли, используемые для защиты основных кораблей, конвоев и боевых групп. Нам следует рассмотреть возможность создания большего их количества." # Destroyers are both durable and manoeuvrable ships that are used to defend the main vessels, convoys, and battle groups. We should look into creating more of them.
 TRT_naval_air_coordination: "Координация военно-морских сил" # Naval-Air Co-ordination
 TRT_naval_air_coordination_desc: "Важно, чтобы мы позволили координировать действия военно-морского флота и военно-воздушных сил, чтобы использовать различные виды ведения войны невиданными ранее способами. Таким образом, мы сможем одновременно контролировать воздух и море." # It is important that we allow for co-ordination between the navy and the air force so as to utilize various types of warfare in never before seen ways. That way, we can simultaneously control the air and the sea.
 TRT_reliance_on_battleships: "Опора на линкоры" # Reliance on Battleships
 TRT_reliance_on_battleships_desc: "Линкоры, которые часто рекламируются как самые мощные корабли в истории военно-морских войн, будут иметь решающее значение, если мы хотим обеспечить свой контроль над морями." # Battleships, which have often been touted as the most powerful ships in the history of naval warfare, will be crucial if we are to ensure our control of the seas.
 TRT_bartin_naval_base: "Военно-морская база Бартин" # Bartın Naval Base
 TRT_bartin_naval_base_desc: "Чтобы разместить больше кораблей, мы должны обратиться к созданию современной военно-морской базы. Сильным кандидатом на создание этой новой военно-морской базы является Бартын, город в провинции Зонгулдак." # In order to house more ships, we must turn to the creation of a modern naval base. A strong candidate for this new naval base is Bartın, a city in the Zonguldak province.
 TRT_directorate_of_naval_affairs: "Управление военно-морских дел" # Directorate of Naval Affairs
 TRT_directorate_of_naval_affairs_desc: "Управление военно-морских дел позволит нам лучше организовать наши корабли, сделать логистические перевозки более эффективными и обеспечить разведку вражеских кораблей." # The Directorate of Naval Affairs will allow us to better organize our ships, make logistical transportation more effective, and secure intelligence on enemy ships.

 TRT_examining_the_air_force: "Изучение ВВС" # Examining the Air Force
 TRT_examining_the_air_force_desc: "Крайне важно, чтобы мы обратили внимание на расширение и поддержание наших военно-воздушных сил, особенно учитывая быстрые изменения, происходящие в воздушной войне, и большое значение, придаваемое обладанию надлежащими военно-воздушными силами." # It is paramount that we turn our gaze towards the expansion and maintainence of our air force, especially considering the rapid changes being made to aerial warfare and the great importance being placed on the possessesion of a proper air force.
 TRT_invest_in_fighters: "Инвестируйте в бойцов" # Invest in Fighters
 TRT_invest_in_fighters_desc: "Чтобы обеспечить превосходство в воздухе и уничтожение самолетов противника, мы должны начать инвестировать в истребители." # In order to ensure aerial superiority and the destruction of enemy planes, we must begin to invest in fighter planes.
 TRT_bomber_research: "Исследования бомбардировщиков" # Bomber Research
 TRT_bomber_research_desc: "Бомбардировщики имеют решающее значение для военных действий, поскольку они позволяют эффективно уничтожать линии снабжения противника, но из удаленного района, а это означает, что в конечном итоге мы нанесем больший ущерб, потеряв при этом меньше жизней." # Bomber planes are crucial to the war effort in that they allow for the destruction of enemy supply lines effectively, yet from a remote area meaning that, at the end of the day, we will cause more damage while losing fewer lives.
 TRT_close_air_support: "Непосредственная авиационная поддержка" # Close Air Support
 TRT_close_air_support_desc: "Защита наших людей со всех сторон, особенно с неба, имеет первостепенное значение для военных действий. Мы должны начать исследование технологии непосредственной авиационной поддержки." # The protection of our men from all angles, especially the sky, is paramount to the war effort. We must begin to research close air support technology.
 TRT_konya_airbase: "Авиабаза Конья" # Konya Airbase
 TRT_konya_airbase_desc: "Конья, занимающая центральное положение в нашей стране, имеет первостепенное значение для того, чтобы позволить нам установить превосходство в воздухе над Малой Азией." # Konya, which possesses a central location within our nation, is paramount with regards to allowing us to establish air superiority over Asia Minor.
 TRT_naval_bombers: "Военно-морские бомбардировщики" # Naval Bombers
 TRT_naval_bombers_desc: "Благодаря сотрудничеству военно-морского флота и военно-воздушных сил мы можем обеспечить превосходство в воздухе, где бы мы ни находились. Мы будем править землей и морями!" # By having the navy and the air force co-operate, we can ensure aerial superiority no matter where we are. We shall rule the land and the seas!
 TRT_aerial_doctrines: "Воздушные доктрины" # Aerial Doctrines
 TRT_aerial_doctrines_desc: "Мы должны научить наших пилотов новым методам управления самолетами. Таким образом, мы сможем перехитрить врага и значительно улучшить наше понимание воздушной войны." # We should teach our pilots new methods on how to fly planes. That way, we can outsmart the enemy and greatly increase our understanding of aerial warfare.
 TRT_light_aircraft_focus: "Легкий самолет Фокус" # Light Aircraft Focus
 TRT_light_aircraft_focus_desc: "Лучше всего наше время было бы потрачено на инвестиции в легкие самолеты, такие как бои и непосредственная поддержка с воздуха." # Our time would be best served in investing in light aircraft such as fights and close air support.
 TRT_eskisehir_air_school: "Эскишехирская авиационная школа" # Eskişehir Air School
 TRT_eskisehir_air_school_desc: "Создав авиационную школу в Эскишехире, мы сможем обеспечить обучение пилотов нового поколения, которые позволят лучше понять воздушную войну." # By establishing an aviation school in Eskişehir, we can allow for the education of a new generation of pilots which will allow for a greater understanding of aerial warfare.
 TRT_heavy_aircraft_focus: "Тяжелый самолет в фокусе" # Heavy Aircraft Focus
 TRT_heavy_aircraft_focus_desc: "Лучше всего наше время было бы потрачено на инвестиции в тяжелые самолеты, такие как бомбардировщики и военно-морские самолеты." # Our time would be best served in investing in heavy aircraft such as bombers and naval aircraft.

#### Focus2 ####
 TRT2_emergency_session: "Экстренная сессия" # Emergency Session
 TRT2_emergency_session_desc: "Убийство покойного султана Абдулмеджида II стало неожиданностью для многих, в том числе и для членов самого правительства. Ясно, что необходимо созвать чрезвычайную сессию, чтобы решить судьбу и направление развития нашего народа..." # Following the assassination of the late Sultan Abdülmecid II has come as a surprise to many, including those within the government themselves. It is clear that an emergency session must be convened in order to decide the fate and direction of our nation...
 TRT2_death_of_an_empire: "Смерть Империи" # Death of An Empire
 TRT2_death_of_an_empire_desc: "Похоже, Османской империи больше нет, а парламент выступает за упразднение империи и создание нового, турецкого государства." # The Ottoman Empire is no more, it seems, with the parliament in favour of abolishing the empire and bringing about the establishment of a new, Turkish state.
 TRT2_consolidation_of_power: "Консолидация власти" # Consolidation of Power
 TRT2_consolidation_of_power_desc: "К счастью, похоже, что Дому Османа удалось удержать власть и позволить Османской империи продолжать существование под ее контролем." # Thankfully, it seems as though the House of Osman has managed to hold onto power and allow for the continuation of the Ottoman Empire under its grip.

 TRT2_turanist_victorious: "Туранист Победа" # Turanist Victory
 TRT2_turanist_victorious_desc: "Туранисты после создания турецкого государства смогли захватить власть и заручиться доверием большинства делегатов. Проповедуя пантюркистскую платформу наряду с сильным и единым турецким государством, безусловно, будет интересно посмотреть, как они повлияют на нацию..." # The Turanists, following the establishment of the Turkish state, were able to seize power and secure the confidence of the majority of delegates. Preaching a pan-Turkic platform alongside a strong and united Turkish state, it will certainly be interesting to see how they will impact the nation...
 TRT2_promote_pan_turkism: "Продвигайте пантюркизм" # Promote Pan-Turkism
 TRT2_promote_pan_turkism_desc: "Очевидно, что наша судьба заключается не в том, чтобы ассоциировать себя с европейцами или арабами, а в потеплении отношений с нашими тюркскими братьями. Ведь мы генетически схожи и сами тюрки происходят от выходцев из Средней Азии." # Rather than associating ourselves with the Europeans or the Arabs, it is clear that our destiny lies with the warming of relations with our Turkic brothers. After all, we are genetically similar and the Turkish people themselves are descended from the Central Asians.
 TRT2_indoctrinate_the_youth: "Внушайте молодёжи" # Indoctrinate the Youth
 TRT2_indoctrinate_the_youth_desc: "Мы должны воодушевить молодежь и помочь ей осознать важность верности не только нашим целям, но и самому государству. Если мы хотим вступить в эпоху процветания, мы должны обеспечить активность молодежи в этом стремлении." # We must invigorate the youth and help them realize the importance of not only loyalty to our goals, but to the state itself. If we are to usher in an era of prosperity, we must ensure that the youth are active in such a pursuit.
 TRT2_extend_our_power: "Расширьте нашу силу" # Extend our Power
 TRT2_extend_our_power_desc: "Просто получить большинство в парламенте недостаточно; мы должны обеспечить, чтобы наше правление проникло в жизнь всех людей и ощущалось по всей стране. Мы должны расширить свое влияние, чтобы должным образом консолидировать нашу власть, гарантируя, что никто не сможет бросить вызов нашему правлению." # Simply attaining a majority in parliament is not enough; we must ensure that our rule is pervasive in the lives of all of the people and felt throughout the nation. We must extend our reach in order to properly consolidate our power, ensuring that nobody can challenge our rule.
 TRT2_empower_paramilitary_groups: "Расширение возможностей военизированных группировок" # Empower Paramilitary Groups
 TRT2_empower_paramilitary_groups_desc: "Сильный лидер эффективно управляет, заставляя своих подданных бояться его гнева; расширяя возможности военизированных группировок, которые верны нашему делу, мы можем гарантировать, что люди будут бояться нас и, следовательно, подчиняться любым приказам, которые мы отдаем." # A strong leader rules effectively through keeping his subjects fearful of his wrath; by empowering paramilitary groups that are loyal to our cause we can ensure that the people will fear us and, subsequently, obey any orders we dish out.
 TRT2_increased_weapons_production: "Увеличение производства оружия" # Increased Weapons Production
 TRT2_increased_weapons_production_desc: "Ключевым моментом является снабжение не только военных, но и наших военизированных формирований. Для этого мы должны приказать всем доступным заводам увеличить производство оружия, что позволит нам поставлять большее количество людей за более короткий промежуток времени." # Supplying not only the military but also our paramilitary groups is key. In order to do so, we must order all available factories to up their arms production, therefore allowing us to supply a greater amount of men in a shorter amount of time.
 TRT2_begin_recruitment_campaigns: "Начните кампании по набору персонала" # Begin Recruitment Campaigns
 TRT2_begin_recruitment_campaigns_desc: "Хотя закупка оружия является шагом в правильном направлении, мы также требуем, чтобы мужчины использовали это оружие, если когда-либо возникнет такая необходимость. Вот почему мы должны начать кампании по вербовке и укрепить военный дух турок." # While the procurement of arms is a step in the right direction, we also require men to use those arms if the need ever arises. That is why we must begin recruitment campaigns and invigorate the military spirit of Turks.
 TRT2_crush_internal_enemies: "Сокрушить внутренних врагов" # Crush Internal Enemies
 TRT2_crush_internal_enemies_desc: "Мы не можем позволить внутренним врагам бродить и угрожать безопасности и стабильности государства. Вот почему мы должны взять на себя обязательство уничтожить и избавить нацию от любой внутренней угрозы, которая может возникнуть." # We cannot allow internal enemies to roam and threaten the security and stability of the state. That is why we must commit to destroying and ridding the nation of any internal threat that may arise.
 TRT2_reformation_of_the_state: "Реформация государства" # Reformation of the State
 TRT2_reformation_of_the_state_desc: "Многим хорошо известно, что Османская империя была устаревшим и загнивающим государством, которое держалось только благодаря чистой случайности. Если мы хотим гарантировать, что та же трагедия не постигает турецкое государство, мы должны работать над внутренним и внешним реформированием самого государства." # It is well known to many that the Ottoman Empire was an outdated and decadent state, hanging on only through sheer luck. If we are to ensure that the same tragedy does not befall the Turkish state, we must work towards the internal and external reformation of the state itself.
 TRT2_promote_industrialism: "Продвигать индустриализм" # Promote Industrialism
 TRT2_promote_industrialism_desc: "Чтобы обеспечить более высокий уровень жизни внутри турецкой нации, наряду с ее постепенной индустриализацией, мы должны начать обращать внимание на создание финансируемых государством заводов." # In order to allow for a greater standard of living within the Turkish nation, alongside its gradual industrialization, we must begin to turn our gaze towards the establishment of state sponsored factories.
 TRT2_work_with_the_masses: "Работа с массами" # Work with the Masses
 TRT2_work_with_the_masses_desc: "Мы должны утвердить свою репутацию как нации людей, созданной людьми и для людей. Вот почему мы должны работать с массами и обеспечивать их лояльность. Таким образом, мы можем свести к минимуму вероятность инакомыслия против нашего правила." # We must establish our reputation as a nation of the people, by the people, for the people. That is why we must work with the masses and secure their loyalty. That way, we can minimize the chance of dissent against our rule.
 TRT2_develop_intelligence_organizations: "Развивайте разведывательные организации" # Develop Intelligence Organizations
 TRT2_develop_intelligence_organizations_desc: "Чтобы подготовиться к возникновению каких-либо внутренних угроз, мы должны стремиться к созданию современных и эффективных разведывательных организаций, обладающих возможностями, необходимыми для борьбы с любыми угрозами." # In order to prepare for the event of any sort of internal threats, we must look towards the establishment of modern, and effective, intelligence organizations that possess the capabilities required to deal with any sort of threat.
 TRT2_assassination_of_prominent_leftists: "Убийство видных левых" # Assassination of Prominent Leftists
 TRT2_assassination_of_prominent_leftists_desc: "Левым нет места в турецком государстве. Они извергают и проповедуют наполненные ненавистью и ложные идеологические обещания, пытаясь завоевать доверие людей посредством лжи. Поскольку мирного способа справиться с ними нет, мы должны запачкать руки на благо нации." # Leftists have no place within the Turkish state. They spew and preach hate-filled and false ideological promises, attempting to gain the trust of the people through lies. Seeing as there is no peaceful way to deal with them, we must dirty our hands for the betterment of the nation.
 TRT2_tear_down_old_institutions: "Снести старые институты" # Tear Down Old Institutions
 TRT2_tear_down_old_institutions_desc: "Османская империя страдала от множества неэффективных и коррумпированных организаций, которые были не в состоянии выполнить даже самые простые задачи. Разрушив эти банальные институты, мы сможем обеспечить создание собственных, более эффективных институтов, которые в значительной степени будут нам лояльны." # The Ottoman Empire was plagued by a plethora of ineffective and corrupt organizations that were unable to fulfil even the simplest of tasks. By tearing down these trite institutions, we can ensure the establishment of our own, more effective institutions which will largely be loyal to us.
 TRT2_rid_ourselves_of_bureaucratic_decadence: "Избавьтесь от бюрократического упадка" # Rid Ourselves of Bureaucratic Decadence
 TRT2_rid_ourselves_of_bureaucratic_decadence_desc: "Нанимая эффективных и лояльных бюрократов, а также принимая меры по борьбе с коррупцией и обеспечивая соблюдение более строгих стандартов, мы можем гарантировать, что бюрократический упадок, от которого страдала поздняя Османская империя, не станет занозой на нашем глазу." # By hiring effective and loyal bureaucrats, while also passing anti-corruption measures and enforcing stricter standards, we can ensure that the bureaucratic decadence that had plagued the late Ottoman Empire shall not be a thorn in our side.
 TRT2_judicial_control: "Судебный контроль" # Judicial Control
 TRT2_judicial_control_desc: "Установив контроль над судебной системой, мы сможем начать консолидацию власти и обеспечить более лояльное правительство. Кроме того, у нас будет возможность контролировать и принимать решения, которые мы поддерживаем." # By establishing control of the judiciary, we can begin the consolidation of power and ensure a more loyal government. In addition, we will have the ability to control and decide rulings that we support.
 TRT2_shut_down_parliament: "Закрыть парламент" # Shut Down Parliament
 TRT2_shut_down_parliament_desc: "Парламент является банальным институтом и обеспечивает лишь паралич и нерешительность внутри правительства. Что действительно нужно людям, так это сильный лидер, способный править быстро, решительно и эффективно, а не вынужденный слушать споры обособленной элиты." # Parliament is a banal institution and only provides for paralysis and indecisiveness within the government. What the people truly need is a strong leader who possesses the ability to rule quickly, decisively, and effectively rather than being forced to listen to the bickering of the detached elite.

 TRT2_kemalist_victorious: "Кемалистская победа" # Kemalist Victory
 TRT2_kemalist_victorious_desc: "Кемалисты, после создания турецкого государства, смогли прийти к власти в разгар политического кризиса в нынешней Турецкой Республике. Выступая за платформу модернизации, кемалисты уже начали работу по формированию новой турецкой нации." # The Kemalists, following the establishment of a Turkish state, were able to come to power in the midst of a political crisis in the now Republic of Turkey. Advocating a platform of modernization, the Kemalists have already begun work on shaping the new Turkish nation.
 TRT2_a_new_alphabet: "Новый алфавит" # A New Alphabet
 TRT2_a_new_alphabet_desc: "Вместо того, чтобы использовать арабскую письменность, которая сама по себе устарела и не соответствует потребностям турецкого языка, лучше всего нам сбросить оковы Османской империи и использовать латинское письмо для нового турецкого языка." # Rather than use the Arabic script, which itself is outdated and ill-suited to the needs of the Turkish language, it is best we throw off the shackles of the Ottoman Empire and use a latin scripture for the new Turkish language.
 TRT2_ban_the_fez: "Запретить Фес" # Ban the Fez
 TRT2_ban_the_fez_desc: "Одним из больших вопросов, касающихся модернизации, является феска. Многие ведущие кемалисты считают его символом ориентализма и отсталости. Возможно, лучше всего будет отказаться от головного убора в пользу шляп западного стиля." # One of the big questions with regards to modernization is the fez. Seen by many leading Kemalists as a symbol of Orientalism and backwardness, it is perhaps best we ditch the headdress for western style hats.
 TRT2_western_legal_code: "Западный правовой кодекс" # Western Legal Code
 TRT2_western_legal_code_desc: "Вместо того, чтобы сохранять Мецелле, возможно, лучше было бы основывать наш гражданский кодекс на швейцарском. Таким образом, мы действительно сможем открыть эпоху модернизации нашей молодой республики и завоевать легитимность в глазах западных стран." # Rather than retaining Mecelle, perhaps it is best we base our civil code off of that of the Swiss one. That way, we can truly usher in an era of modernization for our young republic and garner legitimacy in the eyes of the Western nations.
 TRT2_parliamentary_democracy: "Парламентская демократия" # Parliamentary Democracy
 TRT2_parliamentary_democracy_desc: "Сохранение и даже совершенствование парламентской демократии является ключом к обеспечению демократической нации и должного представительства населения. Мы не допустим, чтобы демократические идеалы были поставлены под угрозу, независимо от ситуации." # Retaining, and even refining, parliamentary democracy is key to ensuring for a democratic nation and a properly represented populace. We shall not allow for democratic ideals to be compromised, no matter the situation.
 TRT2_gregorian_calendar: "Григорианский календарь" # Gregorian Calendar
 TRT2_gregorian_calendar_desc: "Поскольку это наиболее широко используемый гражданский календарь в мире, вполне естественно, что мы начинаем переходить на григорианский календарь, а не сохранять календарь Руми." # The most widely used civic calendar internationally, it is only natural that we begin the adoptation of the Gregorian calendar rather than retaining the Rumi calendar.
 TRT2_reorganize_our_bureaucracy: "Реорганизуйте нашу бюрократию" # Reorganize our Bureaucracy
 TRT2_reorganize_our_bureaucracy_desc: "Коррумпированная и неэффективная бюрократия была одной из самых больших проблем поздней Османской империи. Реорганизовав и укомплектовав нашу бюрократию квалифицированными политиками и государственными служащими, мы можем надеяться на процветание как государство." # The corrupt and inefficient bureaucracy was one of the biggest issues of the late Ottoman Empire. By reorganizing and staffing our bureaucracy with qualified politicians and civil servants can we hope to thrive as a state.
 TRT2_bolster_the_armed_forces: "Укрепить Вооруженные Силы" # Bolster the Armed Forces
 TRT2_bolster_the_armed_forces_desc: "Если идеалы лаицизма или демократии внутри нашей страны когда-либо будут поставлены под угрозу, обязанностью военных является обеспечение строгого укрепления этих идеалов и отстранение нарушителя от власти. Мы не можем позволить внутренним угрозам свергнуть нашу великую нацию." # If the ideals of laicism or democracy within our nation are ever compromised, it is the duty of the military to ensure that the ideals are strictly reinforced and the offender removed from a position of power. We cannot allow internal threats to topple our great nation.
 TRT2_institute_laicism: "Институт Лаицизма" # Institute Laicism
 TRT2_institute_laicism_desc: "Ключевым аспектом модернизации является обеспечение четкого определения и соблюдения разделения между религией и государством. Дав понять, что лаицизм станет ключевым компонентом республики, мы сможем гарантировать, что наша нация и ее население полностью модернизируются." # A key aspect of modernization is ensuring the separation between religion and the state is clearly defined and enforced. By making it clear that laicism will be made a key component of the republic can we ensure that our nation, and its population as well, will fully modernize.
 TRT2_land_reform: "Земельная реформа" # Land Reform
 TRT2_land_reform_desc: "Создавая современные фермы, мы можем обеспечить развитие наших сельскохозяйственных технологий." # Through the establishment of modern farms can we ensure the advancement of our agricultural techniques.
 TRT2_social_equality: "Социальное равенство" # Social Equality
 TRT2_social_equality_desc: "Приступив к реформированию османского идеала общественной сферы, мы сможем начать формировать мысли наших граждан и обеспечить более социально активное и гражданско-сознательное население." # By taking to reforming the Ottoman ideal of the public sphere can we begin to shape the thoughts of our citizens and allow for a more socially active and civically conscious population.
 TRT2_womens_rights: "Права женщин" # Women's Rights
 TRT2_womens_rights_desc: "Мы должны поощрять равное участие и права турецких женщин, чтобы по-настоящему модернизировать нашу нацию." # We must encourage the equal participation and rights of Turkish women so as to truly modernize our nation.
 TRT2_the_sciences_and_the_arts: "Науки и искусства" # The Sciences and the Arts
 TRT2_the_sciences_and_the_arts_desc: "Содействуя развитию науки и искусства, мы можем обеспечить более образованное и академически настроенное население. Это, в свою очередь, позволит нам добиться успехов в самых разных областях." # By promoting the sciences and the arts can we allow for a more educated and academically minded population. This, in turn, will allow us to make strides in a variety of fields.
 TRT2_village_institutes: "Деревенские институты" # Village Institutes
 TRT2_village_institutes_desc: "Создавая сельские институты, мы можем гарантировать, что все турецкие граждане, проживающие в городах или в сельской местности, смогут получить высокий уровень образования." # By establishing village institutes we can ensure that all Turkish citizens, urban or rural dwelling, can secure a high standard of education.
 TRT2_financial_reform: "Финансовая реформа" # Financial Reform
 TRT2_financial_reform_desc: "Установив новые стандарты наших финансов, создав центральный банк и разобравшись с нашими внешними долгами, мы сможем обеспечить финансовую стабильность республики." # By establishing new standards for our finances, creating a central bank, and dealing with our foreign debts can we ensure the financial stability of the republic.
 TRT2_state_owned_enterprise: "Государственное предприятие" # State-Owned Enterprise
 TRT2_state_owned_enterprise_desc: "Мы должны заняться созданием спонсируемых и контролируемых правительством организаций, которые, как мы надеемся, позволят нам продвигать индустриализм в Турции. Это, в свою очередь, позволит нам индустриализировать нашу страну беспрецедентными темпами." # We must take to creating government-sponsored and government-controlled organizations which will, hopefully, allow for us to promote industrialism within Turkey. This will, in turn, allow us to industrialize our nation at an unprecedented rate.
 TRT2_the_turkish_constitution: "Конституция Турции" # The Turkish Constitution
 TRT2_the_turkish_constitution_desc: "Чтобы обрести легитимность в международном сообществе и в глазах нашего народа, а также укрепить наше видение Турции, мы должны начать разработку и ратификацию истинно турецкой конституции." # In order to gain legitimacy within the international community and the eyes of our people, alongside solidifying our vision for Turkey, we must begin to draft and ratify a truly Turkish constitution.
 TRT2_guardians_of_the_constitution: "Хранители Конституции" # Guardians of the Constitution
 TRT2_guardians_of_the_constitution_desc: "Мы должны и дальше укреплять наши вооруженные силы, чтобы они могли успешно защищать идеалы, заложенные в конституции, и, в свою очередь, продвигать и обеспечивать стабильность в Турции." # We must further bolster our armed forces as to allow for them to successfully defend the ideals laid out in the constitution and, in turn, promote and enforce stability in Turkey.

 TRT2_a_moderate_empire: "Умеренная империя" # A Moderate Empire
 TRT2_a_moderate_empire_desc: "Мы не можем позволить радикальным силам прийти к власти внутри империи и подорвать нашу репутацию во всем мире. Посадив на трон султана Ахмеда Нихада, мы надеемся либерализовать нашу империю и добиться того, чего не смогли наши предшественники. То есть вестернизация нашей империи." # We cannot allow for radical forces to take power within the empire and erode our reputation worldwide. By placing Sultan Ahmed Nihad on the throne, we can hopefully liberalize our empire and accomplish what our predecessors could not. That is, the westernization of our empire.
 TRT2_assertion_of_royal_prerogatives: "Берем дело в свои руки" # Taking Matters into our Own Hands
 TRT2_assertion_of_royal_prerogatives_desc: "Мы больше не можем позволять внешним и даже внутренним силам диктовать нашу политику. Мы должны взять дело в свои руки и сформировать будущее Османской империи для будущих поколений!" # No longer can we allow external, and even internal, forces to dictate our policy. We must take matters into our own hands and shape the future of the Ottoman Empire for the generations to come!
 TRT2_rewrite_the_constitution: "Переписать Конституцию" # Rewrite the Constitution
 TRT2_rewrite_the_constitution_desc: "Действующая конституция во многих аспектах очень неясна или устарела. Переписав его, мы сможем добиться легитимности в глазах нашего народа и накопить больше власти, чтобы довести до конца любые будущие реформы." # The current constitution is very unclear or outdated in many aspects. By rewriting it, we can garner legitimacy in the eyes of our people and amass greater power to see through any future reforms.
 TRT2_dealing_with_the_bureaucracy: "Борьба с бюрократией" # Dealing with the Bureaucracy
 TRT2_dealing_with_the_bureaucracy_desc: "Очевидная истина – это упадок и неэффективность османской бюрократии. Укомплектовав нашу бюрократию квалифицированными и добросовестными государственными служащими, мы можем обеспечить большую эффективность внутри нашего государства." # An apparent truth is the decadence and inefficiency of the Ottoman bureaucracy. By staffing our bureaucracy with qualified and scrupulous civil servants, we can allow for greater efficiency within our state.
 TRT2_finish_the_tanzimat_reforms: "Завершить реформы Танзимата" # Finish the Tanzimat Reforms
 TRT2_finish_the_tanzimat_reforms_desc: "Хотя реформы Танзимата в некоторой степени либерализовали нашу империю, сами реформы не зашли достаточно далеко и произошли очень поздно. Мы должны избегать ошибок наших предшественников, если хотим пережить эти трудные времена." # While the Tanzimat reforms did liberalize our empire to an extent, the reforms themselves did not go far enough and came at a very late time. We must avoid the mistakes of our predecessors if we are to survive these trying times.
 TRT2_decentralized_rule: "Децентрализованное правило" # Decentralized Rule
 TRT2_decentralized_rule_desc: "Подчиняясь губернаторам различных провинций, а не управляя напрямую из Константинийе, мы можем обеспечить большее представительство нашего народа." # By deferring to the governors of the various provinces, rather than directly governing from Kostantiniyye, can we ensure the greater representation of our people.
 TRT2_reform_the_banking_system: "Реформировать банковскую систему" # Reform the Banking System
 TRT2_reform_the_banking_system_desc: "Продолжая реформирование и капитальный ремонт нашей банковской системы, а также расширяя возможности центрального банка, мы сможем обеспечить стабильность нашей валюты." # By continuing the reformation and overhaul of our banking system, and empowering the central bank, can we ensure the stability of our currency.
 TRT2_work_to_pay_off_our_debts: "Работайте, чтобы погасить наши долги" # Work to Pay Off our Debts
 TRT2_work_to_pay_off_our_debts_desc: "OPDA уже давно истощает нашу экономику и сковывает нас, лишая экономической независимости. Только расплатившись с долгами перед кредиторами, мы сможем проводить независимую экономическую политику." # The OPDA has long been a drain on our economy and has shackled us, disallowing economic independence. Only by paying off our debts to our creditors can we pursue an independent economic policy.
 TRT2_multi_party_system: "Многопартийная система" # Multi-Party System
 TRT2_multi_party_system_desc: "Продвигая многопартийную систему, которая сама по себе будет демократической, можем ли мы надеяться на полное представительство взглядов нашего народа, одновременно укрепляя идею о том, что наша страна является парламентской демократией." # By promoting a multi-party system, which in itself will be democratic, can we hope to allow for the full representation of the views of our people while also solidifying the idea that our nation is a parliamentary democracy.
 TRT2_transition_to_a_constitutional_monarchy: "Переход к конституционной монархии" # Constitutional Monarchy Transition
 TRT2_transition_to_a_constitutional_monarchy_desc: "Исторически султан обладал огромной властью и влиянием в Османской империи. Делегируя задачи ключевым членам правительства и взяв на себя роль конституционного монарха, мы можем надеяться на либерализацию нашей империи и обеспечение процветания демократии." # Historically, the Sultan has held great power and influence within the Ottoman Empire. By delegating tasks to key members of the government and taking on a role of a constitutional monarch can we hope to liberalize our empire and allow for democracy to flourish.
 TRT2_provide_education_to_the_people: "Обеспечивать образование людям" # Provide Education to the People
 TRT2_provide_education_to_the_people_desc: "Крайне важно, чтобы мы поощряли и способствовали развитию образованных граждан. Это, в свою очередь, позволит сделать население более граждански сознательным и сильным." # It is key that we promote and allow for the development of an educated citizenry. This, in turn, will allow for a more civically conscious and stronger population.
 TRT2_ensure_judicial_fairness: "Обеспечить судебную честность" # Ensure Judicial Honesty
 TRT2_ensure_judicial_fairness_desc: "Ключевым элементом любого демократического общества является наличие независимой судебной власти. Создавая высокие стандарты для нашей судебной системы, мы можем обеспечить отсутствие коррупции в империи." # A key staple of any democratic society is the presence of an independent judiciary. By creating high standards for our judiciary we can allow for a lack of corrpution in the empire.
 TRT2_ending_corruption: "Покончить с коррупцией" # Ending Corruption
 TRT2_ending_corruption_desc: "Коррупция посредством взяток, услуг и других методов уже давно разрешена внутри империи. Определив и внедрив строгий набор стандартов для наших политиков и государственных служащих, мы можем победить эту проблему, которая так долго мучила нашу великую империю." # Corruption, through bribes, favours, or other methods, has long been allowed within the empire. By defining and enforcing a strict set of standards for our politicians and civil servants, we can defeat this issue which has plagued our great empire for so long.
 TRT2_an_inclusive_empire: "Инклюзивная империя" # An Inclusive Empire
 TRT2_an_inclusive_empire_desc: "Мы никогда не должны допускать, чтобы демократические и инклюзивные идеалы империи были поставлены под угрозу. Порядок, установленный султаном Ахмедом IV, должен сохраниться для будущих поколений. Да здравствует султан и да здравствует османский народ!" # We must never allow for the democratic and inclusive ideals of the empire to be compromised. The order established by Sultan Ahmed IV must remain for generations to come. Long live the Sultan and long live the Ottoman people!
 TRT2_reform_the_political_system: "Реформировать политическую систему" # Reform the Political System
 TRT2_reform_the_political_system_desc: "Политическая система, которая, во многом благодаря британцам, в некоторой степени близка к системе западных стран. Очевидно, что мы должны положить конец этой системе, поскольку она представляет собой контроль Запада над нашей страной." # The political system, which, in large part due to the British, is somewhat close to that of the Western nations. It is clear that we must put an end to this system as it represents Western control over our nation.
 TRT2_establish_control_over_the_judiciary: "Установить контроль над судебной властью" # Establish Control over the Judiciary
 TRT2_establish_control_over_the_judiciary_desc: "Ключевым моментом является установление контроля над судебной властью. Мы не можем допустить, чтобы мошеннические элементы внутри правительства препятствовали прогрессу, достигнутому султаном." # Establishing control over the judiciary is key. We cannot allow for rogue elements within the government to hinder the progress made by the Sultan.
 TRT2_appoint_a_loyal_grand_vizier: "Назначьте верного великого визиря" # Appoint a Loyal Grand Vizier
 TRT2_appoint_a_loyal_grand_vizier_desc: "Чтобы укрепить нашу власть над правительством, мы должны назначить опытного, но лояльного Великого Визиря. Таким образом, мы можем свести к минимуму разногласия внутри правительства." # In order to solidify our power over the government, we must take to appointing an experienced, yet loyal, Grand Vizier. That way, we can minimize dissent within the government.
 TRT2_solidify_the_power_of_the_sultan: "Укрепить власть султана" # Solidify the Power of the Sultan
 TRT2_solidify_the_power_of_the_sultan_desc: "Мы должны напомнить ветвям власти, что султан, суверен османского народа, обладает наибольшей властью и формирует государство." # We must remind the branches of the government that the Sultan, the sovereign of the Ottoman people, holds the most power and shapes the state.
 TRT2_reeducate_the_masses: "Перевоспитать массы" # Re-educate the Masses
 TRT2_reeducate_the_masses_desc: "Программы перевоспитания играют ключевую роль, если мы хотим мобилизовать тех, кто моложе, и вдохновить их сражаться за империю." # Re-education programs are key if we are to mobilize those that are younger and inspire them to fight for the empire.
 TRT2_silence_all_opposition: "Заставить замолчать оппозицию" # Silence the Opposition
 TRT2_silence_all_opposition_desc: "Оппозиция, которая долгое время была занозой на нашем глазу, в настоящее время чрезвычайно активна. Мы должны заставить их замолчать ради общего блага империи." # Long having been a thorn in our side, the opposition has been extremely vocal during present times. We must take to silencing them for the greater good of the empire.
 TRT2_disband_parliament: "Распустить парламент" # Disband Parliament
 TRT2_disband_parliament_desc: "Парламенту было предоставлено слишком много власти и свободы правления, что мешает нашей империи и служит лишь сдерживанию власти султана. Мы должны немедленно упразднить этот устаревший и упадочный институт." # Parliament has been given too much power and free reign, hindering our empire and only serving to hold back to Sultan's power. We must abolish this outdated and decadent institution immediately.
 TRT2_the_phoenix: "Феникс" # The Phoenix
 TRT2_the_phoenix_desc: "Подобно фениксу, мы восстали из пепла и находимся на пути восстановления величия нашей империи. Да здравствует султан Осман IV!" # Like a phoenix, we have risen from the ashes and are on the path of restoring our empire to greatness. Long live Sultan Osman IV!
 TRT2_economic_mobilization: "Экономическая мобилизация" # Economic Mobilization
 TRT2_economic_mobilization_desc: "Мы должны быстро начать преобразование нашей экономики из экономики, которая в основном базируется на гражданских целях, в экономику, которая служит для укрепления и обеспечения армии всем необходимым." # We must quickly begin the conversion of our economy from that of one that is largely civilian based to one that serves to strengthen and provide the military with what it needs.
 TRT2_mandatory_conscription: "Обязательная воинская повинность" # Mandatory Conscription
 TRT2_mandatory_conscription_desc: "Для осуществления наших планов по восстановлению былого величия Османской империи нам требуются трудоспособные мужчины для службы под нашим командованием и укомплектования нашей армии." # In order to carry out our plans of restoring the former greatness of the Ottoman Empire, we require able-bodied men to serve under our command and staff our army.

 TRT2_foreign_policy: "Внешняя политика" # Foreign Policy
 TRT2_foreign_policy_desc: "Крайне важно, чтобы мы начали брать будущее нашей страны в свои руки и самостоятельно решать вопросы внешней политики, которые требуют нашего немедленного внимания." # It is paramount that we begin to take the future of our nation into our own hands and independently deal with the foreign policy issues that demand our immediate attention.
 TRT2_remil_istanbul: "Ремилитаризация Стамбула" # Remilitarize Istanbul
 TRT2_remil_istanbul_desc: "По окончании Великой войны Антанта вынудила нас демилитаризовать пролив Босфор в рамках договора, положившего конец войне. Пришло время взять дело в свои руки и официально положить конец этой политике." # Upon the conclusion of the Great War, we were forced by the Entente to demilitarize the Bosphorus Straits as part of the treaty that had ended the war. It is time we take matters into our own hands and officially end the policy.
 TRT2_join_stahlpakt: "Подайте заявку на вступление в Штальпакт" # Apply to Join the Stahlpakt
 TRT2_join_stahlpakt_desc: "Германия, которая когда-то была ярым союзником во время Великой войны, снова накопила власть и начинает вступать в новую эпоху превосходства. Если мы хотим обеспечить себе место в ближайшие годы, вполне естественно, что мы присоединимся к ним в союзе дружбы." # Germany, once an ardent ally during the Great War, has once again amassed power and is beginning to enter a new age of supremacy. If we are to ensure our place in the coming years, it is only natural that we join them in an alliance of friendship.
 TRT2_demand_trabzon: "Спрос Трабзон" # Demand Trabzon
 TRT2_demand_trabzon_desc: "Район Трабзон, ныне большей частью контролируемый Арменией, по праву принадлежит нашему народу. Таким образом, мы должны вернуть его любыми необходимыми средствами." # The region of Trabzon, now controlled, for the most part, by Armenia, rightfully belongs to our nation. As such, we must take it back by any means necessary.
 TRT2_crush_arm: "Раздавить Армению" # Crush Armenia
 TRT2_crush_arm_desc: "Мы больше не можем, чтобы Армения оставалась угрозой на наших границах. В нынешнем виде их владение нашими основными землями ослабляет нас. Мы должны немедленно решить эту проблему." # We can no longer Armenia to remain a threat on our borders. As it currently stands, their possession of our core lands weakens us. We must remedy this issue at once.
 TRT2_erz_pleb: "Жители Эрзурума" # Erzurum Plebiscite
 TRT2_erz_pleb_desc: "Учитывая, что большинство граждан Эрзурума составляют турки, вполне естественно, что мы просим провести плебисцит, который, скорее всего, закончится в нашу пользу." # Seeing as the majority of the citizens within Erzurum are Turkish, it is only natural that we ask for a plebiscite that will, most likely, end in our favour.
 TRT2_destroy_kurds: "Уничтожить курдов" # Destroy the Kurds
 TRT2_destroy_kurds_desc: "Курды владеют Ваном, что имеет геополитическое значение, когда дело доходит до наших отношений с Ираном. Мы должны вернуть себе этот кусок земли любой ценой." # The Kurds possess Van, which is geopolitically important when it comes to our dealings with Iran. We must retake this piece of land at all costs.
 TRT2_conquer_arabia: "Покори арабов" # Conquer the Arabs
 TRT2_conquer_arabia_desc: "Чтобы восстановить наше присутствие на Ближнем Востоке, мы должны вернуть себе наши земли на юге. Однако это будет непросто, и мы должны подготовиться к тяжелой войне." # In order to re-establish our presence within the Middle East, we must take to retaking our lands back in the south. This will not be easy, however, and we must prepare ourselves for an arduous war.
 TRT2_put_down_the_mashriqis: "Положите Машрики" # Put Down the Mashriqis
 TRT2_put_down_the_mashriqis_desc: "Британцы сочли целесообразным заявить права на наши владения, взяв с собой Левант и создав в этом районе государство Машрики. Мы должны исправить эту ошибку и немедленно вернуть себе нашу законную территорию!" # The Brits have seen fit to claim our domain for themselves, taking with them the Levant and creating a Mashriqi state in the area. We must correct this wrong, and re-claim our rightful territory at once!
 TRT2_demand_aydin: "Требуйте Айдын из Греции" # Demand Aydin from Greece
 TRT2_demand_aydin_desc: "Греции слишком долго разрешалось владеть Айдыном, основным государством нашей великой нации. Мы должны потребовать вернуть эту территорию или вернуть ее любыми другими необходимыми средствами." # Greece has, for far too long, been allowed to own Aydin, a core state of our great nation. We must demand the territory back, or take it back by any other means necessary.
 TRT2_reclaim_west: "Верните наши западные земли!" # Reclaim our Western Lands!
 TRT2_reclaim_west_desc: "Наши западные земли, особенно Измир и Тракия, являются ключом к установлению нашего присутствия в Европе и Эгейском море, а также к обеспечению нашего контроля над Босфором. Мы должны вернуть эти земли любой ценой." # Our western lands, especially Izmir and Trakya, are key to establishing our presence in the Europe and the Aegean Sea in addition to ensuring our control over the Bosphorus. We must take back these lands at all costs.
 TRT2_petition_italy: "Петиция Италия" # Petition Italy
 TRT2_petition_italy_desc: "Весь наш доступ к Средиземному морю перекрыт итальянцами, владеющими нашим южным побережьем. Важно, чтобы мы любой ценой вернули себе контроль над этой землей." # The entirety of our access to the Mediterranean is blocked off by the Italians, who are in possession of our southern coast. It is important that we regain control of this land at all costs.
 TRT2_maltaya_status: "Статус Мальтайи" # Status of Maltaya
 TRT2_maltaya_status_desc: "После Великой войны французам были переданы части южной Анатолии. Мы должны немедленно исправить этот вопрос и потребовать права собственности на нашу землю." # The French were given portions of southern Anatolia following the Great War. We must correct this issue at once and demand ownership of our land.

 TRT2_economic_affairs: "Экономические вопросы" # Economic Affairs
 TRT2_economic_affairs_desc: "После обвала лондонского рынка создается впечатление, что наша и без того находящаяся в упадке экономика только еще больше пострадала от последовавшей за этим паники. Похоже, настала необходимость переоценки нашей экономической политики." # Following the London Market Collapse, it seems as though our already declining economy has only been hurt even more by the ensuing panic. It seems the re-evaluation of our economic policies are in order.
 TRT2_resource_exploitation: "Эксплуатация ресурсов" # Resource Exploitation
 TRT2_resource_exploitation_desc: "Анатолия — богатый ресурсами регион, в котором добывается много хрома и стали. Мы должны воспользоваться изобилием этих ресурсов и начать добычу полезных ископаемых." # Anatolia is a resource rich region, with much chromium and steel existing within the region itself. We must take advantage of our abundance of these resources and begin mining operations.
 TRT2_industrial_development: "Промышленное развитие" # Industrial Development
 TRT2_industrial_development_desc: "Если мы хотим когда-либо догнать наших европейских коллег, нам крайне важно начать индустриализацию страны. Активно спонсируя строительство государственных заводов, мы можем начать способствовать постепенной индустриализации нашей страны." # If we are to ever catch up to our European counterparts, it is key that we begin the industrialization of the nation. By actively sponsoring the construction of state-owned factories, we can begin to allow for the gradual industrialization of our nation.
 TRT2_agricultural_methods: "Сельскохозяйственные методы" # Agricultural Methods
 TRT2_agricultural_methods_desc: "Совершенствуя методы ведения сельского хозяйства и инструменты, используемые нашими фермерами, мы можем обеспечить больший объем сельскохозяйственного производства более эффективными темпами." # By upgrading our agricultural methods and the tools used by our farmers, we can ensure greater agricultural output at a more efficient pace.
 TRT2_nationalization_of_railways: "Национализация железных дорог" # Nationalization of Railways
 TRT2_nationalization_of_railways_desc: "В нынешнем виде OPDA имеет очень большое влияние, когда дело касается владения железными дорогами в нашей стране. Хотя это может разозлить некоторые страны, крайне важно, чтобы мы вернули себе контроль над нашей экономикой и отстояли свою независимость на мировой арене." # As it stands, the OPDA is very much influential when it comes to the ownership of railways within our nation. While this may anger a few nations, it is paramount that we retake control of our economy and assert our independence on the world stage.
 TRT2_austerity_programs: "Программы жесткой экономии" # Austerity Programs
 TRT2_austerity_programs_desc: "Чтобы обеспечить восстановление нашей экономики, мы должны сократить расходы в отдельных областях. Хотя в краткосрочной перспективе это будет непопулярная мера, она будет чрезвычайно полезна, вытащив нас из экономической колеи, в которой мы оказались." # In order to allow for the recovery our economy, we must cut spending in select areas. While this will be an unpopular measure in the short term, it will be extremely beneficial in pulling us out of the economic rut we've found ourselves in.
 TRT2_subsidization_of_industry: "Субсидирование промышленности" # Subsidization of Industry
 TRT2_subsidization_of_industry_desc: "Субсидирование вновь созданных заводов, спонсируемых государством, позволит нам снять бремя с самих заводов, а также позволит повысить производительность." # Subsidizing the newly created state-sponsored factories will go a long way in allowing for us to take the burden off of the factories themselves while also allowing for greater productivity.
 TRT2_broaden_our_horizons: "Расширьте наш кругозор" # Broaden our Horizons
 TRT2_broaden_our_horizons_desc: "Важно, чтобы мы начали думать о том, чтобы обратить свой взор за границу и искать торговых партнеров, которые помогут нам справиться с экономическим кризисом, в котором мы оказались втянуты." # It is important that we begin to consider pivoting our gaze abroad and seeking out trade partners to help aid us with the economic crisis we have found ourselves embroiled in.
 TRT2_foundation_of_the_defence_industry: "Фонд оборонной промышленности" # Foundation of the Defence Industry
 TRT2_foundation_of_the_defence_industry_desc: "Ключевым моментом является то, что для увеличения производства пушек и других видов оружия мы начинаем разрешать создание заводов, которые могут помочь нам подготовить почву для создания полноценной оборонной промышленности." # It is key that, in order to boost our production of guns and other types of weapons, we begin allowing for the creation of factories that can aid us with setting the stage for the foundation of a proper defence industry.
 TRT2_establishment_of_radio_networks: "Создание радиосетей" # Establishment of Radio Networks
 TRT2_establishment_of_radio_networks_desc: "Создание условий для создания радиосетей позволит обеспечить экономическое развитие в области радиолокационных технологий, а также обеспечит более тесную связь между людьми и средствами массовой информации." # Paving the way for the creation of radio networks will allow for economic development in the field of RADAR technology while also ensuring greater communication between the people and the media.
 TRT2_koc_holding: "Коч Холдинг" # Koç Holding
 TRT2_koc_holding_desc: "Сотрудничество с Koç Holding, одной из крупнейших и наиболее известных фирм в нашей стране, было бы выгодно с точки зрения дальнейшей индустриализации нашей страны, а также оказания помощи в создании рабочих мест." # Working with Koç Holding, one of the biggest and most well-known firms in our nation, would be advantageous in terms of the further industrialization of our nation alongside assisting with job creation efforts.
 TRT2_anatolian_railway: "Анатолийская железная дорога" # Anatolian Railway
 TRT2_anatolian_railway_desc: "Стимулируя создание Анатолийской железной дороги, мы сможем лучше связать наши основные земли и обеспечить эффективную транспортировку товаров и войск." # By spurring the creation of an Anatolian Railway, we can better link our core lands and ensure for the efficient transportation of goods and troops.
 TRT2_the_central_bank: "Центральный банк" # The Central Bank
 TRT2_the_central_bank_desc: "Обеспечение стабильности центрального банка будет иметь большое значение для обеспечения стабильности нашей валюты и удовлетворенности потребителей." # Ensuring the stability of the central bank will go a long way in ensuring the stability of our currency and consumer satisfaction.
 TRT2_kirikkale_steel: "Кырыккале Сталь" # Kırıkkale Steel
 TRT2_kirikkale_steel_desc: "Было бы разумно начать добычу полезных ископаемых в Кырыккале, который богат запасами стали, чтобы еще больше увеличить нашу экономическую продукцию на мировых рынках." # It would be wise to begin resource extraction operations in Kırıkkale, which is bountiful in terms of the steel resources it possesses, in order to further boost our economic output to the world markets.
 TRT2_robert_college: "Роберт Колледж" # Robert College
 TRT2_robert_college_desc: "Основанный в 1863 году американским филантропом и американским миссионером, Роберт-Колледж превратился в ведущее высшее учебное заведение в стране. Обеспечив финансирование университета и укомплектовав его квалифицированными кадрами, мы сможем обеспечить более высокий образовательный уровень наших граждан." # Founded in 1863 by an American philanthropist and an American missionary, Robert College has grown to become the top institution of higher education within the nation. By ensuring the funding of the university alongside staffing it with qualified personnel, we can allow for the greater educational development of our citizenry.
 TRT2_redistribution_of_land: "Перераспределение земли" # Redistribution of Land
 TRT2_redistribution_of_land_desc: "Перераспределение земли среди фермеров, которые смогут лучше ее использовать, вместо того, чтобы позволять ей постепенно гнить в руках богатых, является ключевым моментом, если мы хотим достичь максимального экономического результата." # Redistributing land to the farmers who can make better use of it, rather than allowing it gradually rot in the hands of the rich, is key if we are to achieve maximum economic output.
 TRT2_economic_prosperity: "Экономическое процветание" # Economic Prosperity
 TRT2_economic_prosperity_desc: "Похоже, что годы экономических инвестиций в нужные области наряду с постепенной, но устойчивой индустриализацией страны позволили нам, наконец, заявить о себе как об экономически стабильной стране." # It seems as though years of economic investment in the proper fields alongside the gradual, yet steady, industrialization of the nation has allowed for us to finally declare ourselves as economically stable.

 TRT2_inspecting_the_military: "Инспектирование военных" # Inspecting the Military
 TRT2_inspecting_the_military_desc: "Важно, чтобы мы обратили свой взор на возможную профессионализацию и дальнейшее развитие нашей армии, чтобы не оказаться осажденными со всех сторон враждебными и иностранными державами, стремящимися разрушить наше великое государство." # It is important that we turn our gaze towards the eventual professionalization and further development of our military, lest we find ourselves besieged on all sides by hostile and foreign powers, eager to dismantle our great state.
 TRT2_military_colleges: "Военные колледжи" # Military Colleges
 TRT2_military_colleges_desc: "Инвестирование в военные колледжи — отличный способ обеспечить формирование надлежащего и квалифицированного офицерского корпуса, способного справиться с любыми проблемами, с которыми он может столкнуться." # Investing in military colleges is a great way to ensure the development a proper and skilled officer corps, able to defeat whatever challenges it may face.
 TRT2_professionalization_of_the_military: "Профессионализация военных" # Professionalization of the Military
 TRT2_professionalization_of_the_military_desc: "Мы должны обеспечить, чтобы все наши люди были в отличной форме в случае войны. Все наши люди должны иметь уверенность в том, что они будут должным образом обучены и снабжены." # We must ensure that all of our men are in top shape in the event of a war. All of our men must have the assurance that they will be properly trained and supplied.
 TRT2_field_exercises: "Полевые учения" # Field Exercises
 TRT2_field_exercises_desc: "Проведение полевых учений — лучший способ убедиться, что мы в курсе любых доктрин и способны бороться с этими новыми доктринами. Кроме того, полевые учения помогут дисциплинировать наши войска." # Conducting field exercises is the best way to ensure that we are up to date on any sort of doctrines and are able to combat those newer doctrines. In addition, field exercises will help discipline our troops.
 TRT2_equipment_modernization: "Модернизация оборудования" # Equipment Modernization
 TRT2_equipment_modernization_desc: "Модернизация нашего старого оборудования и оборудования имеет ключевое значение, если мы хотим получить преимущество над нашими врагами. Кроме того, улучшение наших производственных возможностей, безусловно, является приоритетом для любой хорошо снабжаемой армии." # Upgrading our old equipment and hardware is key if we are to gain an advantage over our enemies. In addition, improving our production capabilities is certainly a priority for any well-supplied military.
 TRT2_british_assistance: "Британская помощь" # British Assistance
 TRT2_british_assistance_desc: "Крайне важно обратиться к британцам, которые известны своими профессиональными вооруженными силами, и заручиться военной помощью." # It is vital that we turn to the British, who are renowned for their professional armed forces, and secure military aid.
 TRT2_german_assistance: "Немецкая помощь" # German Assistance
 TRT2_german_assistance_desc: "Крайне важно, чтобы мы обратились к немцам, которые известны своими хорошо дисциплинированными вооруженными силами, и заручились военной помощью." # It is vital that we turn to the Germans, who are renowned for their well disciplined armed forces, and secure military aid.
 TRT2_gendarmerie_general_command: "Главное командование жандармерии" # Gendarmerie General Command
 TRT2_gendarmerie_general_command_desc: "Чтобы более эффективно охранять нашу страну, мы должны начать направлять больше средств в пользу Главного командования жандармерии, что позволит нам нанимать больше и более квалифицированных сотрудников правоохранительных органов." # In order to more effectively police our nation, we must begin to divert greater funding towards the Gendarmerie General Command, allowing us to higher more, and higher quality, law enforcement officers.
 TRT2_field_artillery: "Полевая артиллерия" # Field Artillery
 TRT2_field_artillery_desc: "Артиллерия была ключевым компонентом войны со времен наполеоновских войн и сыграла решающую роль во время Вельткрига. Инвестиции в эту технологию были бы чрезвычайно полезны, поскольку артиллерия может вести огонь на расстояния, недоступные для пехоты." # Artillery has been a key component of war ever since the Napoleonic Wars and had played a crucial role during the Weltkrieg. Investing in this technology would be extremely helpful as artillery is able to be fired towards distances that infantry cannot reach.
 TRT2_general_staff: "Генеральный штаб" # General Staff
 TRT2_general_staff_desc: "Обеспечивая, чтобы только высшие офицеры могли служить в Генеральном штабе, мы можем гарантировать удовлетворение административных, логистических и оперативных потребностей наших вооруженных сил." # By ensuring that only top officers are allowed to serve as the General Staff, we can ensure that the administrative, logistical, and operational needs of our military are met.
 TRT2_contracts_with_royal_arsenal: "Контракты с Королевским Арсеналом" # Contracts with Royal Arsenal
 TRT2_contracts_with_royal_arsenal_desc: "Учитывая, что Великобритания более чем готова помочь нам в модернизации наших вооруженных сил, возможно, было бы лучше обратиться к Royal Arsenal, одной из их ведущих компаний, и заключить контракт на новое оборудование." # Seing as Britain has been more than willing to assist us in the modernization of our military, perhaps it would best to reach out to Royal Arsenal, one of their top companies, and secure a contract for new equipment.
 TRT2_contracts_with_mauser: "Контракты с Маузером" # Contracts with Mauser
 TRT2_contracts_with_mauser_desc: "Учитывая, что Германия более чем готова помочь нам в модернизации наших вооруженных сил, возможно, было бы лучше обратиться к Mauser, одной из их ведущих компаний, и заключить контракт на новое оборудование." # Seing as Germany has been more than willing to assist us in the modernization of our military, perhaps it would best to reach out to Mauser, one of their top companies, and secure a contract for new equipment.
 TRT2_support_equipment: "Вспомогательное оборудование" # Support Equipment
 TRT2_support_equipment_desc: "Логистика, полевые госпитали и инженеры — важнейшие элементы поддержки любого подразделения. Если мы хотим сражаться умнее, обеспечить сохранение наших людей и выйти победителями, мы должны добиться успехов в области вспомогательного оборудования." # Logistics, field hospitals, and engineers are all crucial support elements to any division. If we are to fight smarter, and allow for the preservation of our men and emerge victorious, we must make strides in the field of support equipment.
 TRT2_armoured_vehicles: "Бронированные автомобили" # Armoured Vehicles
 TRT2_armoured_vehicles_desc: "Моторизованная пехота имеет решающее значение, поскольку она обеспечивает защиту от огня противника и может помочь перебросить наши войска из одного места в другое на быстрой скорости." # Motorised infantry is crucial in that it provides protection from enemy fire and can help transfer our troops from one place to another at swift speeds.
 TRT2_tank_research: "Исследование танков" # Tank Research
 TRT2_tank_research_desc: "Танки, изобретенные британцами в 1916 году во время Вельткрига, способны прорывать линии противника и обладают невиданной ранее огневой мощью. Исследование брони будет иметь решающее значение для любых будущих военных усилий." # Invented by the British in 1916 during the Weltkrieg, tanks are able to breakthrough enemy lines and possess firepower never before seen. Researching armour will be crucial to any future war efforts.
 TRT2_special_forces_command: "Командование спецназа" # Special Forces Command
 TRT2_special_forces_command_desc: "Инвестирование средств в создание оперативной группы спецназа имеет решающее значение, если мы хотим проводить тайные операции эффективным и результативным образом." # Investing funds into the creation of a special forces task force is crucial if we are to conduct covert operations in an efficient and effective manner.
 TRT2_rearmament: "Перевооружение" # Rearmament
 TRT2_rearmament_desc: "Мы должны начать медленное, но неуклонное перевооружение наших войск, чтобы быть готовыми к любым угрозам, внутренним или внешним." # We must begin the slow, yet steady, rearmament of our troops in order to ready ourselves for any threats, internal or external.
 TRT2_maintaining_readiness: "Поддержание готовности" # Maintaining Readiness
 TRT2_maintaining_readiness_desc: "Поддержание боеготовности перед лицом противника и подготовка даже к самым злейшим противникам являются ключом к любой современной военной силе." # Maintaining readiness in the face of adversary and preparing for even the worst of opponents is key to any modern military force.
 TRT2_engineering_schools: "Инженерные школы" # Engineering Schools
 TRT2_engineering_schools_desc: "Модернизация нашего вспомогательного оборудования и возможность специализации в армии являются ключом к улучшению нашей тактики." # Upgrading our support equipment and allowing for specialization within the military is key to improving our tactics.

 TRT2_naval_considerations: "Военно-морские соображения" # Naval Considerations
 TRT2_naval_considerations_desc: "Крайне важно, чтобы мы обратили внимание на расширение и поддержание нашего военно-морского флота, особенно учитывая быстрые изменения, происходящие в военно-морской войне, и большое значение, придаваемое обладанию надлежащим военно-морским флотом." # It is paramount that we turn our gaze towards the expansion and maintainence of our navy, especially considering the rapid changes being made to naval warfare and the great importance being placed on the possessesion of a proper navy.
 TRT2_naval_infantry: "Морская пехота" # Naval Infantry
 TRT2_naval_infantry_desc: "Инвестируя в ресурсы, необходимые для создания и развития морской пехоты, мы можем надеяться вести войну непредвиденным и эффективным образом." # By investing in the resources to allow for the foundation and development of marines can we hope to conduct warfare in an unforseen and effective manner.
 TRT2_commission_naval_cruisers: "Комиссионные военно-морские крейсеры" # Commission Naval Cruisers
 TRT2_commission_naval_cruisers_desc: "Крайне важно начать ввод в строй современных военно-морских крейсеров, чтобы лучше защищаться от угрозы современных кораблей противника." # It is key that we begin commissioning modern naval cruisers so as to better defend from the threat of modern enemy ships.
 TRT2_sabotaging_enemy_supply_lines: "Саботаж линий снабжения противника" # Sabotaging Enemy Supply Lines
 TRT2_sabotaging_enemy_supply_lines_desc: "Чтобы обеспечить возможность эффективно уничтожать морские пути противника и наносить удары по неподготовленным кораблям противника, мы должны начать строительство подводных лодок." # In order to ensure that we can effectively destroy enemy shipping routes and strike at unprepared enemy ships, we must begin the construction of submarines.
 TRT2_pendik_naval_shipyard: "Военно-морская верфь Пендик" # Pendik Naval Shipyard
 TRT2_pendik_naval_shipyard_desc: "Чтобы увеличить наши возможности судостроения, мы должны обратиться к созданию военно-морской верфи в Пендике, районе на азиатской стороне Босфора." # In order to increase our shipbuilding capabilities, we must turn towards the establishment of a naval shipyard in Pendik, a district on the Asian side of the Bosphorus.
 TRT2_naval_doctrines: "Военно-морские доктрины" # Naval Doctrines
 TRT2_naval_doctrines_desc: "Предоставление нашим адмиралам возможности координировать и наносить на карту маршрут, по которому пройдет наш флот, а также обучение наших военно-морских офицеров адаптации к этим новым методам будет иметь решающее значение для модернизации и укрепления нашего военно-морского флота." # Allowing our admirals to co-ordinate and map our the route our navy will take alongside training our naval officers to adapt to these new techniques will be crucial in modernising and strengthening our navy.
 TRT2_building_destroyers: "Разрушители зданий" # Building Destroyers
 TRT2_building_destroyers_desc: "Эсминцы — прочные и маневренные корабли, используемые для защиты основных кораблей, конвоев и боевых групп. Нам следует рассмотреть возможность создания большего их количества." # Destroyers are both durable and manoeuvrable ships that are used to defend the main vessels, convoys, and battle groups. We should look into creating more of them.
 TRT2_naval_air_coordination: "Координация военно-морских сил" # Naval-Air Co-ordination
 TRT2_naval_air_coordination_desc: "Важно, чтобы мы позволили координировать действия военно-морского флота и военно-воздушных сил, чтобы использовать различные виды ведения войны невиданными ранее способами. Таким образом, мы сможем одновременно контролировать воздух и море." # It is important that we allow for co-ordination between the navy and the air force so as to utilize various types of warfare in never before seen ways. That way, we can simultaneously control the air and the sea.
 TRT2_reliance_on_battleships: "Опора на линкоры" # Reliance on Battleships
 TRT2_reliance_on_battleships_desc: "Линкоры, которые часто рекламируются как самые мощные корабли в истории военно-морских войн, будут иметь решающее значение, если мы хотим обеспечить свой контроль над морями." # Battleships, which have often been touted as the most powerful ships in the history of naval warfare, will be crucial if we are to ensure our control of the seas.
 TRT2_bartin_naval_base: "Военно-морская база Бартин" # Bartın Naval Base
 TRT2_bartin_naval_base_desc: "Чтобы разместить больше кораблей, мы должны обратиться к созданию современной военно-морской базы. Сильным кандидатом на создание этой новой военно-морской базы является Бартын, город в провинции Зонгулдак." # In order to house more ships, we must turn to the creation of a modern naval base. A strong candidate for this new naval base is Bartın, a city in the Zonguldak province.
 TRT2_directorate_of_naval_affairs: "Управление военно-морских дел" # Directorate of Naval Affairs
 TRT2_directorate_of_naval_affairs_desc: "Управление военно-морских дел позволит нам лучше организовать наши корабли, сделать логистические перевозки более эффективными и обеспечить разведку вражеских кораблей." # The Directorate of Naval Affairs will allow us to better organize our ships, make logistical transportation more effective, and secure intelligence on enemy ships.

 TRT2_examining_the_air_force: "Изучение ВВС" # Examining the Air Force
 TRT2_examining_the_air_force_desc: "Крайне важно, чтобы мы обратили внимание на расширение и поддержание наших военно-воздушных сил, особенно учитывая быстрые изменения, происходящие в воздушной войне, и большое значение, придаваемое обладанию надлежащими военно-воздушными силами." # It is paramount that we turn our gaze towards the expansion and maintainence of our air force, especially considering the rapid changes being made to aerial warfare and the great importance being placed on the possessesion of a proper air force.
 TRT2_invest_in_fighters: "Инвестируйте в бойцов" # Invest in Fighters
 TRT2_invest_in_fighters_desc: "Чтобы обеспечить превосходство в воздухе и уничтожение самолетов противника, мы должны начать инвестировать в истребители." # In order to ensure aerial superiority and the destruction of enemy planes, we must begin to invest in fighter planes.
 TRT2_bomber_research: "Исследования бомбардировщиков" # Bomber Research
 TRT2_bomber_research_desc: "Бомбардировщики имеют решающее значение для военных действий, поскольку они позволяют эффективно уничтожать линии снабжения противника, но из удаленного района, а это означает, что в конечном итоге мы нанесем больший ущерб, потеряв при этом меньше жизней." # Bomber planes are crucial to the war effort in that they allow for the destruction of enemy supply lines effectively, yet from a remote area meaning that, at the end of the day, we will cause more damage while losing fewer lives.
 TRT2_close_air_support: "Непосредственная авиационная поддержка" # Close Air Support
 TRT2_close_air_support_desc: "Защита наших людей со всех сторон, особенно с неба, имеет первостепенное значение для военных действий. Мы должны начать исследование технологии непосредственной авиационной поддержки." # The protection of our men from all angles, especially the sky, is paramount to the war effort. We must begin to research close air support technology.
 TRT2_konya_airbase: "Авиабаза Конья" # Konya Airbase
 TRT2_konya_airbase_desc: "Конья, занимающая центральное положение в нашей стране, имеет первостепенное значение для того, чтобы позволить нам установить превосходство в воздухе над Малой Азией." # Konya, which possesses a central location within our nation, is paramount with regards to allowing us to establish air superiority over Asia Minor.
 TRT2_naval_bombers: "Военно-морские бомбардировщики" # Naval Bombers
 TRT2_naval_bombers_desc: "Благодаря сотрудничеству военно-морского флота и военно-воздушных сил мы можем обеспечить превосходство в воздухе, где бы мы ни находились. Мы будем править землей и морями!" # By having the navy and the air force co-operate, we can ensure aerial superiority no matter where we are. We shall rule the land and the seas!
 TRT2_aerial_doctrines: "Воздушные доктрины" # Aerial Doctrines
 TRT2_aerial_doctrines_desc: "Мы должны научить наших пилотов новым методам управления самолетами. Таким образом, мы сможем перехитрить врага и значительно улучшить наше понимание воздушной войны." # We should teach our pilots new methods on how to fly planes. That way, we can outsmart the enemy and greatly increase our understanding of aerial warfare.
 TRT2_light_aircraft_focus: "Легкий самолет Фокус" # Light Aircraft Focus
 TRT2_light_aircraft_focus_desc: "Лучше всего наше время было бы потрачено на инвестиции в легкие самолеты, такие как бои и непосредственная поддержка с воздуха." # Our time would be best served in investing in light aircraft such as fights and close air support.
 TRT2_eskisehir_air_school: "Эскишехирская авиационная школа" # Eskişehir Air School
 TRT2_eskisehir_air_school_desc: "Создав авиационную школу в Эскишехире, мы сможем обеспечить обучение пилотов нового поколения, которые позволят лучше понять воздушную войну." # By establishing an aviation school in Eskişehir, we can allow for the education of a new generation of pilots which will allow for a greater understanding of aerial warfare.
 TRT2_heavy_aircraft_focus: "Тяжелый самолет в фокусе" # Heavy Aircraft Focus
 TRT2_heavy_aircraft_focus_desc: "Лучше всего наше время было бы потрачено на инвестиции в тяжелые самолеты, такие как бомбардировщики и военно-морские самолеты." # Our time would be best served in investing in heavy aircraft such as bombers and naval aircraft.

#### Ideas ####
 TRT_sick_man_of_europe: "Больной человек Европы" # Sick Man of Europe
 TRT_sick_man_of_europe_desc: "Из-за отсутствия у нас общей модернизации, довольно плачевного состояния наших вооруженных сил, отсутствия готовности к индустриализации, коррумпированной и недисциплинированной бюрократии, чрезмерно раздутой и неэффективной администрации, скудных возможностей образования и общей разобщенности среди народа Османской империи нас прозвали «больным человеком Европы». Если мы не сможем избавиться от этого прозвища и успешно реформировать наше государство, мы никогда не сможем надеяться догнать наших европейских коллег..." # Owing to our lack of general modernization, the rather sorry state of our armed forces, a lacking willingness to industrialize, a corrupt and undisciplined bureaucracy, an overextended and ineffective administration, sparse education opportunities, and a general disunity amongst the people of the Ottoman Empire, we have been labelled as the ‘Sick Man of Europe’. Unless we can remove this moniker, and successfully reform our state, we can never hope to catch up to our European counterparts...
