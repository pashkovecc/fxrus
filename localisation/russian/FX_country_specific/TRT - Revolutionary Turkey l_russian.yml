 TRT_opda_idea: "Управление государственного долга Османской империи" # Ottoman Public Debt Administration
 TRT_opda_idea_desc: "Османское управление государственного долга, состоящее в основном из европейских кредиторов, в частности из Франции, Великобритании и Италии, было создано в 1881 году для сбора платежей, причитающихся нам европейским державам. В нынешнем виде сам совет представляет собой, по сути, независимую бюрократическую структуру внутри нашей страны и до краев заполнен европейскими правительственными чиновниками. Компании и страны, участвующие в OPDA, обладают огромным влиянием и властью в Османской империи, причем многие из наших железных дорог и промышленных проектов финансируются самой организацией. Если мы хотим когда-либо достичь экономической независимости, мы должны сосредоточить внимание на погашении наших долгов." # Primarily composed of European creditors, particularly France, Britain, and Italy, the Ottoman Public Debt Administration was established in 1881 in order to collect the payments owed by us to the European powers. As it stands, the council itself is an essentially independent bureaucracy within our own, and is filled to the brim with European government officials. Companies and nations that participate within the OPDA hold a vast amount of influence and power within the Ottoman Empire, with many of our railways and industrial projects financing by the institution itself. If we are to ever achieve economic independence, we must turn our focus towards the repayment of our debts.
 TRT_opda_idea2: "Управление государственного долга Османской империи" # Ottoman Public Debt Administration
 TRT_opda_idea2_desc: "Османское управление государственного долга, состоящее в основном из европейских кредиторов, в частности из Франции, Великобритании и Италии, было создано в 1881 году для сбора платежей, причитающихся нам европейским державам. В нынешнем виде сам совет представляет собой, по сути, независимую бюрократическую структуру внутри нашей страны и до краев заполнен европейскими правительственными чиновниками. Компании и страны, участвующие в OPDA, обладают огромным влиянием и властью в Османской империи, причем многие из наших железных дорог и промышленных проектов финансируются самой организацией. Если мы хотим когда-либо достичь экономической независимости, мы должны сосредоточить внимание на погашении наших долгов." # Primarily composed of European creditors, particularly France, Britain, and Italy, the Ottoman Public Debt Administration was established in 1881 in order to collect the payments owed by us to the European powers. As it stands, the council itself is an essentially independent bureaucracy within our own, and is filled to the brim with European government officials. Companies and nations that participate within the OPDA hold a vast amount of influence and power within the Ottoman Empire, with many of our railways and industrial projects financing by the institution itself. If we are to ever achieve economic independence, we must turn our focus towards the repayment of our debts.
 TRT_political_turmoil: "Политическая нестабильность" # Political Turmoil
 TRT_political_turmoil_desc: "После недавнего убийства султана, наряду с уже существующей нестабильностью и растущей фракционностью внутри страны, мы оказались ввергнуты в политическую неразбериху, которая угрожает разрушить наше и без того хрупкое государство. Если мы не решим вопрос быстро и решительно, нам может грозить уничтожение нашей великой нации!" # With the recent assassination of the Sultan, alongside already existing turbulence and growing factionalism within the nation, we have now been plunged into political turmoil which threatens to destroy our already fragile state. If we do not resolve the issue quickly and decisively, we may be faced with the destruction of our great nation!
