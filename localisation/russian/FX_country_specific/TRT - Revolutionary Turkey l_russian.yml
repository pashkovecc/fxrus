 trt.49.d: "Только что от нашей делегации другим тюркским народам поступили тревожные новости: судя по всему, [From.GetNameDef] решил отклонить наше предложение о развитии и углублении связей, сославшись на то, что в нынешнем виде нет необходимости продвигать пантюркистские идеалы. Это огромный удар по легитимности нового правительства, поскольку в настоящее время мы не можем доказать людям [Root.GetAdjective], что мы можем успешно реализовывать свои собственные планы." # Worrying news has just been delivered from our delegation to the other Turkic nations: apparently, its seems as though [From.GetNameDef] has decided to reject our offer of fostering and deepening ties, citing that, as it stands, there is no need to further the pan-Turkic ideals. This is a huge blow to the legitimacy of the new government, as we have currently been unable to prove to the [Root.GetAdjective] people that we can successfully pursue our own agenda.
 trt.49.a: "Будь они прокляты!" # Damn them!

