#### Events ####
 trt.1.t: "Османская империя" # The Ottoman Empire
 trt.1.d: "Когда [Root.GetNameDef] вступил в Великую войну на стороне Центральных держав, они не ожидали тяжелой битвы и последовавшего за ней катастрофического поражения. Завершение Великой войны привело к тому, что [Root.GetNameDef] почти распался, а британцы раздували пламя арабского национализма в арабских вилайетах империи. Кроме того, когда [Root.GetNameDef] был вынужден сесть за стол переговоров, они были оккупированы и разделены державами Антанты, а именно Великобританией, Грецией, Францией и Италией.\n\nТо, что осталось от Османской империи, которая теперь ограничивалась Анатолией и Константинополем, было вынуждено принять правительство по выбору Антанты с султаном в качестве номинального главы. Таким образом, Партия Свободы и Согласия пришла к власти в стране под руководством Антанты.\n\nЗа этим последовало восстание Мустафы Кемаля-паши, бригадного генерала Османской армии, который стремился изгнать империалистов из Турции и модернизировать нацию. Совместные англо-греческие интервенционные силы положили конец этим мечтам, когда Мустафа Кемаль и его группа революционеров потерпели поражение в короткой, но кровопролитной битве.\n\nС момента вышеупомянутого события султан Абдулмеджид II сумел удержать власть при поддержке Антанты. Однако политическая ситуация очень неспокойная, фракционность широко распространена и может дать трещину в любой момент..." # When [Root.GetNameDef] had joined the Great War on the side of the Central Powers, they had not expected the tough battle and disastrous defeat that followed. The conclusion of the Great War had saw [Root.GetNameDef] nearly dissolve, with the British fanning the flames for Arabian nationalism in the empire’s Arabian vilayets. In addition, when [Root.GetNameDef] was forced to the negotiation table, they were occupied and carved up by the Entente powers – namely Britain, Greece, France, and Italy.\n\nWhat remained of the Ottoman Empire, which was now limited to Anatolia and Constantinople, was forced to accept a government of the Entente’s choosing, with the Sultan as a figurehead. Thus, the Freedom and Entente Party had taken power in the nation, under the guidance of the Entente.\n\nWhat followed after was a revolt by Mustafa Kemal Paşa, a brigadier general in the Ottoman Army, who had sought to kick out the imperialists from Turkey and modernize the nation. A joint Anglo-Greek intervention force ended these dreams, when Mustafa Kemal and his group of revolutionaries were all defeated in a short, but bloody, battle.\n\nEver since the aforementioned event, the Sultan, Abdülmecid II, has managed to hold onto power, with the backing of the Entente. However, the political situation is very turbulent, with factionalism very much prevalent, and may crack at any time...
 trt.1.a: "Боже мой!" # Aman Tanrım!

 trt.2.t: "Убийство султана!" # The Assassination of the Sultan!
 trt.2.d: "При неожиданном повороте событий кажется, что султан Абдулмеджид II недавно был убит революционером [Root.GetAdjective], который, как сообщается, был недоволен состоянием [Root.GetNameDef]. Это событие стало шоком не только для многих жителей нашей страны, но и для международных наблюдателей, которые пытаются смириться с ситуацией. Несмотря на то, что напряженность внутри [Root.GetNameDef] была высокой после нашего катастрофического поражения в Великой войне, никто не думал, что до этого дойдет.\n\nВ нынешнем виде Дом Османа пытается консолидировать свою власть в попытке избежать краха нации, и Генеральная Ассамблея назначила чрезвычайную сессию для обсуждения будущего [Root.GetNameDef]. Однако, что из этого выйдет, еще предстоит увидеть. Многие обеспокоены тем, что это может привести к окончательному падению империи..." # In a surprising turn of events, it seems as though the Sultan, Abdülmecid II was recently assassinated by an [Root.GetAdjective] revolutionary, who was reportedly unhappy with the state of [Root.GetNameDef]. This event has come as a shock to not only many within our nation, but also international observers, all of whom are attempting to come to terms with the situation. While tensions within [Root.GetNameDef] had been high following our disastrous defeat in the Great War, nobody had thought that it would come to this.\n\nAs it stands, the House of Osman is attempting to consolidate their power in an attempt to avoid the collapse of the nation, and an emergency session has been scheduled by the General Assembly to discuss the future of [Root.GetNameDef]. Whatever may come of this, however, is yet to be seen. Many are worried that this could lead the empire to finally fall...
 trt.2.a: "Это не сулит ничего хорошего..." # This does not bode well...

 trt.3.t: "Генеральная Ассамблея созывает" # The General Assembly Convenes
 trt.3.d: "Самые влиятельные и влиятельные из различных партий и фракций внутри [Root.GetNameDef] собрались сегодня вместе, чтобы попытаться определить судьбу [Root.GetNameDef]. В нынешнем виде состояние нашей империи очень неспокойное, в воздухе висят беспокойство и неуверенность, пока нация ожидает решения Генеральной Ассамблеи. Сами люди, которые чувствуют себя беспомощными и неспособными изменить сложившуюся ситуацию, обратили свое внимание на это экстренное собрание, которое определит стабильность и единство нашей империи – или их отсутствие.\n\nВ то время как большинство присутствующих, особенно представители Дома Османа и Партии свободы и Антанты, поддерживают быструю консолидацию власти под управлением Дома Османа. Однако постоянно растущее меньшинство, в основном состоящее из кемалистов и туранистов, ходатайствует о разрушении империи и возрождении новой турецкой нации, и сейчас начинается голосование.\n\nГолосование завершено и голоса подсчитаны, и участники затаили дыхание, ожидая увидеть, что покажут результаты голосования.\n\nПоскольку окончательные голоса уже подсчитаны, только что было объявлено, что..." # The most influential and powerful of the various parties and factions within [Root.GetNameDef] have assembled together today in an attempt to determine the fate of [Root.GetNameDef]. As it stands, the state of our empire is very turbulent, with unease and uncertainty both hanging in the air as the nation awaits the decision of the General Assembly. The people themselves, who feel as though they are helpless and unable to change the current situation, have turned their attention towards this emergency meeting which will determine the stability and unity of our empire – or the lack thereof.\n\nWhile a majority of the attendees, especially those from the House of Osman and the Freedom and Entente Party, support the swift consolidation of power under the House of Osman. However, an ever growing minority, mostly comprised of the Kemalists and Turanists, have been petitioning for the destruction of the empire and the rebirth of a new Turkish nation, with voting now beginning.\n\nWith voting now over, and the votes being tallied, the attendees are now holding their breath, waiting to see what the results of the vote show.\n\nAs the final votes have now been counted, it has just been announced that...
 trt.3.a: "Империи больше нет!" # The empire is no more!
 trt.3.b: "Империя сильна!" # The empire stands strong!

 trt.4.t: "Распад Империи!" # The Dissolution of the Empire!
 trt.4.d: "В ходе голосования, которое многие назвали очень закрытым, похоже, что, несмотря ни на что, кемалистская и туранистская платформы сумели добиться успеха: незначительное большинство делегатов проголосовало за отмену Османской империи. Само государство будет быстро распущено, а из пепла восстанет новое турецкое государство.\n\nКемалисты и туранисты выступают за создание государства, ориентированного исключительно на поддержку нужд и прихотей турецкого народа, а не всего мусульманского мира. Это, конечно, не вызовет симпатии к нам у других исламских стран, поскольку с распадом Османской империи происходит распад Халифата.\n\nОднако есть и другие вопросы, которые следует рассмотреть, один из которых - выборы между кемалистами и туранистами, которым придется убедить присутствующих делегатов проголосовать за них, чтобы они возглавили новое турецкое государство.\n\nПоскольку голосование начинается, кажется, что большинство людей в очередной раз выступают за кемалистов возглавив новое государство, однако туранисты, возможно, смогут выжить и одержать победу.\n\nС учетом того, что голоса теперь подсчитаны, кажется, что..." # In what many have called a very close vote, it seems as though that, against all odds, the Kemalist and Turanist platforms have managed to succeed, with a slim majority of delegates voting in favour of the abolition of the Ottoman Empire. The state itself will be dissolved promptly, with the creation of a new Turkish state rising from its ashes.\n\nThe Kemalists and Turanists have argued for a state that is focused exclusively on supporting the needs and whims of the Turkish people rather than the wider Muslim world. This, of course, will not endear us to other Islamic nations as with the dissolution of the Ottoman Empire comes the dissolution of the Caliphate.\n\nThere are, however, other matters to consider with one of them being the election between the Kemalists and the Turanists, who will have to convince the delegates in attendance to vote for them to lead the new Turkish state.\n\nAs the voting is beginning, yet again, it seems though most of the people are in favour of the Kemalists leading the new state, yet the Turanists may be able to scrape by with a victory.\n\nWith the votes now tallied it seems as though...
 trt.4.a: "Туранисты победили!" # The Turanists have won!
 trt.4.b: "Кемалисты победили!" # The Kemalists have won!

 trt.5.t: "Империя сильна!" # The Empire Stands Strong!
 trt.5.d: "Как и ожидалось, создается впечатление, что подавляющее большинство присутствовавших делегатов проголосовали за то, чтобы [Root.GetNameDef] остался, чтобы обеспечить сохранение не только государства, но и стабильности внутри государства, и предпочли бы видеть его реформированием изнутри, а не полным роспуском.\n\nХотя с политической точки зрения это не вызвало у нас симпатии к оппозиции, в основном кемалистам и туранистам, следует сказать, что многие внутри и вне [Root.GetNameDef] вздыхают с облегчением, когда их инвестиции и обязательства внутри империи остались в безопасности.\n\nОднако мы также должны обратить внимание на выбор нового наследника, который займет место покойного султана Абдул-Меджида II и приведет нашу империю к славе. На данный момент претендентов на трон два: Ахмед Нихад Эфенди, внук бывшего султана Мехмеда V, который гораздо более умерен и призывает к либерализации империи. Или Осман Фуад Эфенди, сын Шехзаде Мехмеда Селахаддина, который решил вернуть империи ее былую славу посредством завоеваний и милитаризации, одновременно укрепив пост султана. У обеих сторон появились поклонники и диссиденты, но только одна может надеяться на победу.\n\nКого нам выбрать во главе [Root.GetNameDef]?" # As expected, it seems as though an overwhelming majority of the delegates in attendance have voted for [Root.GetNameDef] to remain in order to ensure the preservation of not only the state, but also the stability within the state and would rather see it reformed from within than completely dissolved.\n\nWhile, politically speaking, this has not endeared us to the opposition, mainly the Kemalists and Turanists, it is to be said that many within and without [Root.GetNameDef] are breathing a sigh of relief as their investments and commitments within the empire have remained secure.\n\nHowever, we must also turn our attention towards the selection of a new heir to take the place of the late Sultan Abdülmecid II and lead our empire to glory. As it stands, there are two contenders for the throne: Ahmed Nihad Efendi, the grandson of the former Sultan Mehmed V, who is much more moderate and calls for the liberalization of the empire. Or Osman Fuad Efendi, son of Şehzade Mehmed Selahaddin, who opts to restore the empire to its former glory through conquest and militarization, while also empowering the post of the Sultan. Both sides have gained admirers and dissidents but only one can hope to win.\n\nWho shall we choose to lead [Root.GetNameDef]?
 trt.5.a: "Ахмед Нихад Эфенди!" # Ahmed Nihad Efendi!
 trt.5.b: "Осман Фуад Эфенди!" # Osman Fuad Efendi!

 trt.6.t: "Судьба дома Османа" # The Fate of the House of Osman
 trt.6.d: "После недавней победы [Root.GetLeader] на посту президента [Root.GetNameDef] и последующего распада Османской империи недавно мы обратили внимание на то, что с Домом Османа и его членами, которые все еще обладают значительным влиянием в [Root.GetNameDef] и исламском мире, необходимо разобраться и определить их статус в стране [Root.GetAdjective].\n\nВ нынешнем виде у нас есть два варианта: мы можем либо изгнать семью, отослать их и оставить их их судьба, или мы можем позволить им остаться в наших границах, но полностью лишить их политического влияния. Особо антимонархические и революционные элементы внутри [Root.GetNameDef] предложили нам просто казнить королевскую семью и ее членов, но это может нанести ущерб нашей репутации в более широком международном сообществе.\n\nОднако мы должны сделать выбор и действовать решительно. Что нам делать?" # Following the recent victory of [Root.GetLeader] as the president of [Root.GetNameDef] and the subsequent dissolution of the Ottoman Empire, it has recently come to our attention that the House of Osman and its members, who still possess significant clout within [Root.GetNameDef] and the Islamic world, must be dealt with and their status in the [Root.GetAdjective] nation determined\n\nAs it stands, we have a two options available to us: we can either exile the family, sending them off and leaving them to their fate or we can allow them to remain within our borders but remove their political influence entirely. Particularly anti-monarchist and revolutionary elements within [Root.GetNameDef] have suggested that we merely execute the royal family and its members, but this could harm our reputation within the wider international community.\n\nWe must, however, make a choice, and act decisively. What shall we do?
 trt.6.a: "Позвольте им остаться." # Allow them to remain.
 trt.6.b: "Изгоните их." # Exile them.
 trt.6.c: "Выполните их." # Execute them.

 trt.7.t: "Новая Эра" # A New Era
 trt.7.kemalist: "Теперь, когда Османская империя, находившееся в упадке образование, теперь официально распалась, мы можем, наконец, обратить наше внимание на создание и консолидацию новой нации [Root.GetAdjective] под руководством Народно-республиканской партии.\n\nПри этом, однако, путь, который мы выбрали, будет нелегким. В настоящее время в воздухе царит общее ощущение неуверенности, поскольку люди не уверены в том, было ли решение о роспуске империи правильным.\n\nОдна из самых больших проблем, с которыми сталкиваются наши новые режимы, — это обеспечение процветания и стабильности в новом [Root.GetName]. Однако, помня об этом, мы можем начать входить в мир заново и, надеюсь, исправить свои ошибки." # With the Ottoman Empire, a decadent entity, now officially dissolved, we can finally turn our attention towards the establishment and consolidation of a new [Root.GetAdjective] nation under the guidance of the Republican People’s Party.\n\nThat being said, however, the path that we have undertaken will not be an easy one to traverse. As it stands, the general feeling throughout the air has been one of uncertainty as the people are unsure of whether or not the decision to dissolve the empire was a correct one.\n\nOne of the biggest challenges our new regimes faces is brining about prosperity and ensuring stability within the new [Root.GetName]. With that in mind, however, we can begin to enter the world anew and hopefully right our wrongs.
 trt.7.turanist: "Поскольку Османская империя, упадочное образование, теперь официально распущено, мы можем, наконец, обратить наше внимание на создание и консолидацию новой нации [Root.GetAdjective] под руководством Туранистской партии.\n\nПри этом, однако, путь, который мы выбрали, будет нелегким. В настоящее время в воздухе царит общее ощущение неуверенности, поскольку люди не уверены в том, было ли решение о роспуске империи правильным.\n\nОдна из самых больших проблем, с которыми сталкиваются наши новые режимы, — это обеспечение процветания и стабильности в новом [Root.GetName]. Однако, помня об этом, мы можем начать входить в мир заново и, надеюсь, исправить свои ошибки." # With the Ottoman Empire, a decadent entity, now officially dissolved, we can finally turn our attention towards the establishment and consolidation of a new [Root.GetAdjective] nation under the guidance of the Turanist Party.\n\nThat being said, however, the path that we have undertaken will not be an easy one to traverse. As it stands, the general feeling throughout the air has been one of uncertainty as the people are unsure of whether or not the decision to dissolve the empire was a correct one.\n\nOne of the biggest challenges our new regimes faces is brining about prosperity and ensuring stability within the new [Root.GetName]. With that in mind, however, we can begin to enter the world anew and hopefully right our wrongs.
 trt.7.a: "Свет в конце туннеля..." # A light at the end of the tunnel...

 trt.8.t: "Постоянная фирма" # Standing Firm
 trt.8.moderate: "К счастью, нам удалось твердо противостоять любой оппозиции, которая могла попытаться распустить империю и потенциально дестабилизировать нашу великую нацию. Конечно, это не означает, что в [Root.GetNameDef] все в порядке, поскольку еще многое предстоит сделать. Тем не менее, мы надеемся, что будущее связано с восхождением на трон султана Ахмеда IV.\n\nКонечно, новая фигура интересная, новый султан пообещал провести новые реформы, чтобы медленно, но верно либерализовать империю и предоставить свободу всем народам, одновременно избавив [Root.GetNameDef] от прозвища «Больной человек Европы». Хотя это, несомненно, будет непростой задачей, султан чувствует, что он справится с этой задачей." # Thankfully, we have managed to stand firm against any sort of opposition that may have sought to dissolve the empire and potentially destabilize our great nation. This does not mean all is right within [Root.GetNameDef], of course, as much is yet to be accomplished. However, the future is hopefully with the ascension of Sultan Ahmed IV to the throne.\n\nCertainly an interesting figure, the new Sultan has promised the institution of new reforms in order to slowly, yet surely, liberalize the empire and allow for the freedom of all peoples alongside ridding [Root.GetNameDef] of the moniker, ‘The Sick Man of Europe’. While this will undoubtably be a tough challenge, the Sultan feels as though he is up to the task.
 trt.8.revanchist: "К счастью, нам удалось твердо противостоять любой оппозиции, которая могла попытаться распустить империю и потенциально дестабилизировать нашу великую нацию. Конечно, это не означает, что в [Root.GetNameDef] все в порядке, поскольку еще многое предстоит сделать. Тем не менее, мы надеемся, что будущее связано с восхождением на трон султана Османа IV.\n\nКонечно, новая фигура интересная, новый султан пообещал провести новые реформы, чтобы медленно, но верно укрепить империю и позволить прославить все народы, одновременно избавив [Root.GetNameDef] от прозвища «Больной человек Европы». Хотя это, несомненно, будет непростой задачей, султан чувствует, что он справится с этой задачей." # Thankfully, we have managed to stand firm against any sort of opposition that may have sought to dissolve the empire and potentially destabilize our great nation. This does not mean all is right within [Root.GetNameDef], of course, as much is yet to be accomplished. However, the future is hopefully with the ascension of Sultan Osman IV to the throne.\n\nCertainly an interesting figure, the new Sultan has promised the institution of new reforms in order to slowly, yet surely, strengthen the empire and allow for the glorification of all peoples alongside ridding [Root.GetNameDef] of the moniker, ‘The Sick Man of Europe’. While this will undoubtably be a tough challenge, the Sultan feels as though he is up to the task.
 trt.8.a: "Свет в конце туннеля..." # A light at the end of the tunnel...

 trt.9.t: "Новая Конституция" # A New Constitution
 trt.9.moderateconstitution: "Совершенно очевидно, что наша империя или то, что от нее осталось, представляет собой упадочную нацию, все еще несущую на себе тот багаж, который преследовал ее на протяжении веков. Если мы хотим положить конец нашим проблемам и действительно возвестить эру единства, стабильности и процветания [Root.GetNameDef], мы должны начать писать новую конституцию.\n\nСама конституция теперь передает большую часть власти парламенту, отнимая ее у султана и великого визиря, что позволяет создать более справедливую и представительную нацию. Кроме того, судебная власть теперь является независимой ветвью власти, что позволяет более справедливо судить людей. Надеюсь, это поможет нашей империи процветать." # It is clear that our empire, or what remains of it, is a decadent nation, still carrying the baggage that has plagued it for centuries on end. If we wish to bring an end to our problems and truly usher in the era of unity, stability, and prosperity for [Root.GetNameDef], we must begin to write a new constitution.\n\nThe constitution itself now vests a majority of the power in the parliament, taking it away from the Sultan and the Grand Vizier, allowing for a fairer, more representative nation. In addition, the judiciary is now an independent branch, allowing for more just trials of the people. Hopefully, this will help our empire flourish.
 trt.9.revanchistconstitution: "Совершенно очевидно, что наша империя или то, что от нее осталось, представляет собой упадочную нацию, все еще несущую на себе тот багаж, который преследовал ее на протяжении веков. Если мы хотим положить конец нашим проблемам и действительно возвестить эру единства, стабильности и процветания [Root.GetNameDef], мы должны начать писать новую конституцию.\n\nСама конституция теперь наделяет большую часть власти султаном и великим визирем, забирая ее у Генеральной Ассамблеи, позволяя нации иметь доброжелательную и направляющую руку. Султан также предпринял шаги, чтобы гарантировать, что остальная часть правительства будет подчиняться его воле, чтобы он мог лучше диктовать политику империи. Надеюсь, это поможет нашей империи процветать." # It is clear that our empire, or what remains of it, is a decadent nation, still carrying the baggage that has plagued it for centuries on end. If we wish to bring an end to our problems and truly usher in the era of unity, stability, and prosperity for [Root.GetNameDef], we must begin to write a new constitution.\n\nThe constitution itself now vests a majority of the power in the Sultan and the Grand Vizier, taking it away from The General Assembly, allowing for a nation with a benevolent and guiding hand. The Sultan has also taken steps to ensure that the rest of the government is under his will so that he can better help dictate the policies of the empire. Hopefully, this will help our empire flourish.
 trt.9.a: "Замечательный!" # Wonderful!

 trt.10.t: "Борьба с бюрократией" # Dealing With the Bureaucracy
 trt.10.d: "Одна из самых больших и нерешённых проблем в [Root.GetNameDef], бюрократическая система нашей империи, была занозой в глазу любого компетентного правителя, который стремился модернизировать и добиться перемен внутри нации.\n\nОднако, поскольку правление Султана теперь прочно укоренилось, а люди теперь привыкли к новым политическим реалиям, с которыми они столкнулись, пришло время, чтобы мы, наконец, начали решать монументальную задачу борьбы с вялой и неэффективной бюрократической системой, от которой страдают наша империя слишком долго существовала.\n\nПроведя серию реформ, направленных на то, чтобы сделать бюрократическую систему более простой в обращении и сделать ее более эффективной как для бюрократов, так и для простых граждан, а также наняв как компетентных, так и лояльных бюрократов, мы, наконец, сможем продвинуться к созданию [Root.GetNameDef] как государства, которое находится на одном уровне со своими европейскими собратьями." # One of the biggest and most outstanding problems within [Root.GetNameDef], the bureaucratic system of our empire has been a thorn in the side of any competent ruler who has sought to modernize and bring about change within the nation.\n\nHowever, with the rule of the Sultan now firmly entrenched, and the people now accustomed to the new political realities facing them, it is time that we finally begin to undertake the monumental task of dealing with the sluggish and inefficient bureaucratic system which has plagued our empire for far too long.\n\nBy instituting a series of reforms designed to make the bureaucratic system easier to deal with and more efficient, for both bureaucrats and common citizens, alongside hiring both competent and loyal bureaucrats, we can finally make headway towards establishing [Root.GetNameDef] as a state that is on par with its European brethren.
 trt.10.a: "Будем надеяться, что это сработает..." # Let's just hope this works...

 trt.11.t: "Наши усилия увенчались успехом!" # Our Efforts Have Been Successful!
 trt.11.d: "Прошли месяцы, и султан и правительство гарантировали, что реформы, направленные на модернизацию нашей бюрократии, будут выполнены с точностью до буквы Т. К счастью, похоже, что благодаря сочетанию контроля над бюрократами и реализации эффективных реформ, [Root.GetNameDef] стало более бюрократически эффективным государством. Это позволило не только более квалифицированным бюрократам занять позиции в правительстве, но и простым гражданам легче решать свои повседневные дела, связанные с правительством. Реформы, безусловно, показали и сделали [Root.GetNameDef] лучшей нацией.\n\nКроме того, это стало шоком для международных наблюдателей, которые поначалу скептически относились к нашим усилиям по реформированию. Они тоже начали видеть эффективность реформ, реализованных [Root.GetLeader]." # Months have gone by, with the Sultan and the government ensuring that the reforms, aimed at modernizing our bureaucracy, are followed to a T. Thankfully, it seems as though, through a combination of keeping on top of the bureaucrats while also implementing effective reforms, [Root.GetNameDef] has become a more bureaucratically efficient state. This has allowed for not only more qualified bureaucrats to step up and take positions within the government, but for common citizens to more easily handle their day to day affairs in relation to the government. The reforms certainly have shown and have made [Root.GetNameDef] a better nation.\n\nIn addition, this has come to a shock to international observers, who were, at first, skeptical of our reformation efforts. They too have begun to see the effectiveness of the reforms implemented by [Root.GetLeader].
 trt.11.a: "Это чудесно!" # This is wonderful!

 trt.12.t: "Реформирование банковской системы" # Reformation of the Banking System
 trt.12.d: "Работая над расширением прав и возможностей Османского центрального банка и Османской фондовой биржи, на которых в последние несколько лет не наблюдалось большой экономической активности, мы сможем лучше регулировать финансы внутри нашей страны, одновременно стимулируя экономическую активность и помогая обеспечить стабильность нашей валюты, а также обращая наше внимание на то, чтобы стать более финансово устойчивой нацией. Таким образом, мы можем быть уверены, что все наши граждане процветают вместе с самим государством." # By working towards empowering the Ottoman Central Bank and the Ottoman Stock Exchange, which have not seen much economic activity in the past few years, we can better regulate finance within our nation while also stimulating economic activity and helping ensure the stability of our currency while also turning our gaze on becoming a more financially sound nation. That way, we can make sure that all of our citizens prosper alongside the state itself.
 trt.12.a: "Это необходимая мера." # This is a necessary measure.

 trt.13.t: "Статус монархии" # The Status of the Monarchy
 trt.13.d: "Поскольку мы все более и более укреплялись в нашей позиции управления империей, а также медленно, но верно восстанавливали доверие людей к Султанату, теперь мы можем, наконец, сделать большой шаг веры вперед и по-настоящему начать либерализацию империи.\n\nСултан Ахмед IV объявил о своем решении ограничить власть Дома Османа, чтобы расширить возможности трех ветвей власти и обеспечить более свободное и лучшее управление Османской империей. Эта новость ни для кого не стала шоком, поскольку султан ясно дал понять, что он сделает Султанат более беспристрастным голосом в политике, наряду с расширением прав и возможностей простых людей и обеспечением представительства. Однако насколько хорошо эта система будет работать, пока неизвестно..." # As we have become more and more entrenched in our position of ruling the empire and have also slowly, yet surely, restored the confidence of the people in the Sultanate, we can now finally take the great leap of faith forward and truly begin to liberalize the empire.\n\nSultan Ahmed IV has announced his decision to limit the power of the House of Osman in order to empower the three branches of government and allow for a freer and better run Ottoman Empire. This news come as a shock to nobody, as the Sultan had made clear that he would make the Sultanate a more impartial voice in politics alongside empowering the common people and allowing for representation. How well this system will work, however, is yet to be seen...
 trt.13.a: "Это, безусловно, знаменательное событие." # This is, surely, a momentous occasion.

 trt.14.t: "Судебная справедливость" # Judicial Fairness
 trt.14.d: "Многим ясно, что реформ конца девятнадцатого века было недостаточно для полного обеспечения судебной справедливости. Мы должны убедиться, что реформы, которые были проведены ранее, такие как продолжение создания и использования Мецелле наряду с справедливыми / публичными судами для наших граждан, должным образом соблюдаются, чтобы дать каждому гражданину империи шанс высказаться и возможность для свободы. Кроме того, это поможет нам еще больше сократить разрыв между нами и остальными европейскими державами." # It is clear to many that the reforms during the late nineteenth century were not enough to fully ensure judicial fairness. We must make sure that the reforms which had been previously brought about, such as the continued creation and use of Mecelle alongside fair/public trials for our citizens, are properly enforced in order to give every citizen of the empire a chance to speak out and an opportunity for freedom. In addition, this will help us further close the gap between ourselves and the rest of the European powers.
 trt.14.a: "Это будет большим благом для наших усилий." # This shall be a great boon to our efforts.

 trt.15.t: "Покончить с коррупцией" # Ending Corruption
 trt.15.d: "Хотя нам удалось провести и провести в жизнь масштабные реформы, такие как реорганизация нашей некогда пришедшей в упадок бюрократии, создание полноценной многопартийной системы и недавнее реформирование судебной системы, нам еще предстоит справиться с безудержной коррупцией внутри империи. Необходимо предпринять усилия по пресечению этого вопиющего акта, который некоторые могут счесть изменой империи. Должны быть приняты законы и меры по борьбе с коррупцией, и мы будем работать с «Эмниет-и Умумие», чтобы обеспечить аресты должностных лиц, уличенных в нарушении закона." # While we have managed to institute and enforce sweeping reforms, such as the reorganization of our once decadent bureaucracy, a proper multi-party system, and the more recent reformation of the judicial system, we still have yet to deal with the rampant corruption within the empire. Efforts to curtail this blatant act of, what some may consider, treason against the empire must be made. Anti-corruption laws and measures shall be passed, and we shall work with the Emniyet-i Umumiye in order to make sure that arrests are made against officials who are caught breaching the law.
 trt.15.a: "Мы должны стоять твердо." # We must stand firm.

 trt.16.t: "Константинополь ремилитаризован" # Constantinople Remilitarized
 trt.16.d: "Поскольку радикалы успешно захватили власть в турецком государстве на нашем востоке, кажется, что мы должны начать действовать, поскольку они начали ремилитаризацию Константинополя. Это определенно будет представлять для нас угрозу, если мы не справимся с ситуацией в ближайшее время. Мы могли бы начать упреждающую атаку или, альтернативно, послать просьбу Британии о помощи. Опять же, возможно, еще слишком рано атаковать." # With radicals successfully seizing power in the Turkish state to our east, it seems as though we must begin to take action as they have begun the remilitarization of Constantinople. This will definitely pose a threat to us if we do not handle the situation soon. We could launch a pre-emptive attack or, alternatively, send a plea to Britain to help us. Then again, it may be too soon to attack.
 trt.16.a: "Мы должны подавить турецкую угрозу!" # We must put down the Turkish menace!
 trt.16.b: "Мы еще не готовы к войне..." # We are not yet ready for war...
 trt.16.c: "Позвоните британцам." # Call in the British.

 trt.17.t: "Ремилитаризация Стамбула"  # Remilitarzation of Istanbul
 trt.17.d: "Одним из первых пунктов в списке нашего великого лидера была ремилитаризация Стамбула, который был демилитаризован Антантой после завершения Великой войны и нашего унизительного поражения. Причиной самой демилитаризации была, как заявило правительство, попытка «исправить ошибки» Великой войны и вернуть нашей стране былую славу." # One of the first items on the list of our great leader was the remilitarization of Istanbul, which had been demilitarized by the Entente following the conclusion the Great War and our humiliating defeat. The reason behind the demilitarization itself was, as stated by the government, an attempt to ‘right the wrongs’ of the Great War and restore our nation to its former glory.
 trt.17.a: "В конце концов, это наша законная территория." # It is, after all, our rightful territory.
 
 trt.18.t: "Запрос из Греции" # Request from Greece
 trt.18.d: "В связи с недавней ремилитаризацией Константинополя Греция обеспокоилась растущей турецкой угрозой за пределами своих границ и обратилась к нам за помощью. Что нам делать?" # With the recent remilitarzation of Constantinople, Greece has been worried of the increased Turkish threat beyond their borders and have come to us for help. What shall we do?
 trt.18.a: "Помочь им, конечно." # Help them, of course.
 trt.18.b: "Мы не можем рисковать еще одной войной..." # We cannot risk yet another war...
 
 trt.19.t: "Великобритания отказывается" # Britain refuses
 trt.19.d: "Великобритания отклонила нашу просьбу о помощи против турецкой угрозы. Кажется, мы сами по себе." # Britain has refused our plea for help against the Turkish menace. It seems we are on our own.
 trt.19.a: "Черт возьми!" # Dammit!

 trt.20.t: "Перестройка политической системы" # Overhauling the Political System
 trt.20.d: "Ограничивая партии, которые находятся в прямой оппозиции, явно или неявно, нашим целям, мы можем гарантировать, что избираемые парламентские представители будут более благосклонны к тому, что мы считаем оптимальным. Это будет означать, что многие республиканские и левые партии потеряют представительство, и султану удастся медленно, но верно взять бразды правления в свои руки, манипулируя существующей системой." # By constricting the parties that are in direct opposition, whether explicitly or implicitly, to our goals, we can ensure that parliamentary representatives that are elected are more favourable towards what we consider to be optimal. This will mean that a lot of the republican and left leaning parties will lose representation and the Sultan will manage to, slowly but surely, take the reins through the manipulation of the existing system.
 trt.20.a: "Отличный." # Excellent.

 trt.21.t: "Судебный контроль" # Judicial Control
 trt.21.d: "Султан решил вмешаться и отменить многие реформы, проведенные в судебной системе в конце девятнадцатого века. Немусульмане больше не смогут пользоваться теми свободами, которые они когда-то имели, и испытания теперь будут в пользу людей, которых мы считаем истинными османами. Кроме того, султану будет предоставлено больше полномочий для свободного исполнения Кануна, и его слово будет считаться всеми окончательным. Мы не можем надеяться, что судебная система окажется в руках коррумпированных или неэффективных судей, если мы действительно хотим спасти империю." # The Sultan has decided to step in and reverse many of the reforms that had been made to the judicial system during the late nineteenth century. Non-Muslims shall no longer enjoy the freedoms they once had, and trials shall now favour the people we consider true Ottomans. In addition, the Sultan shall be given more power to freely enforce Kanuns and his word will be considered final by all. We cannot hope to leave the judicial system in the hands of corrupt or inefficient judges if we are to truly save the empire.
 trt.21.a: "Власть консолидировалась." # Power has been consolidated.

 trt.22.t: "Новый великий визирь" # A New Grand Vizier
 trt.22.d: "Мы должны стремиться к назначению лояльного Великого Визиря как к способу обеспечить большую легитимность нашего правления, в то же время создавая для масс впечатление, будто султан не обладает абсолютной властью, хотя на самом деле он ею обладает. Наблюдатели внутри страны и за рубежом считают это умным, но несколько рискованным шагом: султан Осман IV решил назначить Мустафу Февзи-пашу новым великим визирем. Будучи военным министром [Root.GetNameDef], опыт Мустафы Февзи-паши в вопросах войны, безусловно, поможет в наблюдении за развитием мобилизованного и активного Османского государства, готового принять меры против всех, кто причинил ему вред." # We must look towards appointing the a loyal Grand Vizier as a way to help provide more legitimacy to our rule whilst also making it appear to the masses as though the Sultan does not have absolute power when, in fact, he does. In what is considered as a smart, yet somewhat risky, move by observers at home and abroad, Sultan Osman IV has decided to appoint Mustafa Fevzi Paşa as the new Grand Vizier. Once the Minister of War for [Root.GetNameDef], Mustafa Fevzi Paşa’s expertise in matters of war will certainly help with overseeing the development of a mobilized and active Ottoman state, ready to take action against all who have wronged it.
 trt.22.a: "Надеюсь, мы сделали правильный выбор." # Hopefully we've made the correct choice.

 trt.23.t: "Роспуск парламента" # Disbanding Parliament
 trt.23.d: "Понятно, что парламент — это архаичный пережиток и не более чем обман, стоящий на пути не только желаний султана, но и желаний народа. Мы не можем допустить, чтобы такое учреждение, которое наносит ущерб не только нашему государству, но и нашему образу жизни, продолжало существовать, и должны стремиться к его немедленному устранению.\n\nКонечно, это не вызовет симпатии к нам у нашей политической оппозиции, которая теперь может попытаться сделать все возможное, чтобы остановить нашу инициативу. Кроме того, оппозиция внутри самой страны уже с трудом переваривает наши нынешние реформы, поэтому это может привести к невероятным поступкам. А пока мы должны следить..." # It is clear that parliament is an archaic relic and nothing more than a sham that stands in the way of not only the wishes of the Sultan, but the wishes of the people. We cannot allow such an institution, which hurts not only our state but our way of life, to continue and must look towards its immediate removal.\n\nOf course, this will not endear us to our political opposition, who may now look towards doing all that they can to stop our initiative. In addition, the opposition within the country itself is already having a hard time digesting our current reforms, so this could lead them to do unspeakable things. For now, we must keep watch...
 trt.23.a: "Вперед!" # Onwards!
 trt.23.b: "Раздавите оппозицию немедленно!" # Crush the opposition at once!

 trt.24.t: "Революция разразилась!" # Revolution Has Broken Out!
 trt.24.d: "Мы только что получили катастрофические новости! Видимо, наша политическая оппозиция взяла дело в свои руки, мобилизовав против нас все население! Туранисты, либералы и кемалисты сумели преодолеть свои разногласия и создали против нас коалицию, поклявшись уничтожить нас, объявив себя истинными наследниками империи. Мы не можем позволить им таким образом запятнать имя нашей великой империи и должны как можно скорее принять решительные меры." # We’ve just received disastrous news! Apparently, our political opposition has taken matters into their own hands, mobilizing the general population against us! The Turanists, Liberals, and Kemalists have managed to overcome their differences and have forged a coalition against us, vowing to take us out, declaring themselves the true heirs of the empire. We cannot allow them to tarnish the name of our great empire in such a manner and we must take decisive action as soon as possible.
 trt.24.a: "Боже, помоги нам." # God help us.

 trt.25.t: "Новый алфавит" # A New Alphabet
 trt.25.d: "Одной из реформ, предложенных кемалистами, было учреждение нового алфавита. Их план состоит в том, чтобы покончить со старой османской письменностью, которую они считают архаичной и иностранной, и принять латинскую письменность, тем самым вестернизируя алфавит. Кроме того, как можно скорее должна начаться «тюркификация» и удаление различных арабских и персидских заимствованных слов.\n\nВдобавок ко всему этому, кемалисты приняли Закон о фамилиях, который заставит всех граждан [Root.GetNameDef] принять фамилию и отменит титулы во времена Османской империи." # One of the proposed reforms of the Kemalists was the institution of a new alphabet. Their plan is to do away with the old Ottoman script, which they consider archaic and foreign, and adopt the Latin script, thereby westernizing the alphabet. In addition, the ‘Turkification’ and removal of various Arabian and Persian loan words shall commence as soon as possible.\n\nOn top of all this, however, the Kemalists have now passed the Surname Law, which will force all citizens of [Root.GetNameDef] to adopt a surname and abolishing the titles during the time of the Ottoman Empire.
 trt.25.a: "Ура!" # Hurrah!

 trt.26.t: "Запретить Фес?" # Banning the Fez?
 trt.26.d: "Горячей темой среди членов Генеральной национальной ассамблеи был запрет фески. Хотя все кемалисты выступают за запрет фески (и других связанных с религией головных уборов), они сталкиваются с сильным сопротивлением со стороны традиционалистов и священнослужителей внутри страны. Хотя запрет фески может помочь усилиям по модернизации, он рискует вызвать гнев значительной части населения." # A hot topic between the members of the General National Assembly was banning the fez. While the Kemalists are all in favour of banning the fez (and other religiously affiliated headgear), they face much opposition from traditionalists and clerics within the nation. While banning the fez could help modernization efforts, it risks angering a substantial portion of the population.
 trt.26.a: "Мы должны модернизироваться, несмотря ни на что." # We must modernize, no matter what.
 trt.26.b: "Если подумать, это не так важно..." # On second thought, this isn't that important...

 trt.27.t: "Статус нашего Юридического кодекса" # Status of our Legal Code
 trt.27.d: "Старый правовой кодекс Османской империи был чрезвычайно запутанным из-за включения в него светских и религиозных законов и зачастую отдавал предпочтение мусульманскому большинству внутри страны. Кемалисты хотят покончить с тем, что они считают старым и устаревшим правовым кодексом, и создать светскую правовую структуру, основанную на Гражданском кодексе Швейцарии. Это заручилось поддержкой многих людей, которые хотят видеть более справедливую систему, но рискуют разозлить традиционалистов и представителей духовенства." # The old Ottoman legal code was one that was extremely confusing, due to incorporating secular and religious law, and, oftentimes, favoured the Muslim majority within the nation. The Kemalists want to do away with what they consider to be an old and outdated legal code and institute a secular law structure based off of the Swiss Civil Code. This has garnered the support of many people, who wish to see a fairer system in place but risks angering traditionalists and members of the clergy.
 trt.27.a: "Мы должны создать более справедливую систему." # We must institute a fairer system.
 trt.27.b: "Нынешняя система в порядке." # The current system is fine.

 trt.28.t: "Григорианский календарь?" # The Gregorian Calendar?
 trt.28.d: "Кемалисты хотят покончить с календарем Руми, который начинается в 622 году нашей эры (год эмиграции Мухаммеда), и установить более широко используемый западный григорианский календарь. Это не очень нравится общественности, поскольку она считает саму реформу слишком незначительной, чтобы что-то изменить, в то время как традиционалисты не поддерживают принятие того, что они считают западным календарем. Что нам делать?" # The Kemalists wish to do away with the Rumi calendar, which begins on 622 AD (the year of Muhammad’s emigration), and institute the more widely used and western Gregorian calendar. This is not very popular with the public as they see the reform itself as too minute to make a difference, while the traditionalists are not in favour of the adoption of what they consider to be a western calendar. What should we do?
 trt.28.a: "Мы должны идти вперед." # We must go ahead.
 trt.28.b: "Возможно, это не такая уж хорошая идея..." # Maybe this isn't such a good idea...

 trt.29.t: "Вопрос о правах женщин" # The Question of Women's Rights
 trt.29.d: "Общество Османской империи было известно как очень традиционное, и женщины практически не имели политических прав. Продвигая идею прав женщин, мы можем обеспечить лучшее представительство в нашей стране (приняв законы о всеобщем избирательном праве и равенстве) и способствовать повышению производительности и равному участию в турецком обществе. Конечно, это не вызовет симпатии к нам многих более традиционных членов нашего общества. Что нам делать?" # Society within the Ottoman Empire was known to be very tradition and women had next to no political rights. By advancing the idea of women’s rights, we can allow for better representation within our country (by enacting universal suffrage and equality laws) and help further productivity and equal participation within Turkish society. Of course, this will not endear us to many of the more traditional members of our society. What shall we do?
 trt.29.a: "Они заслуживают равных прав." # They deserve equal rights.
 trt.29.b: "Это слишком рискованная затея." # This is too risky an undertaking.

 trt.30.t: "Вторая Великая Война" # The Second Great War
 trt.30.d: "В Европе вновь вспыхнуло пламя войны, охватившее континент жестоким адским пламенем, подобным тому, которое вспыхнуло менее 20 лет назад. Не так давно немецкий режим взял на себя задачу «исправить ошибки» Великой войны и создать Новую Германию, которая снова простирается от Мааса до Немана. Удивительно, но немцы кажутся очень грозным противником для Антанты, поскольку Франция и Италия испытывают трудности с их подавлением. Возможно, мы сможем стать тем весом, который склонит чашу весов в этой новой войне, и мы не сомневаемся, что Германия примет предложение о союзе, учитывая ее позицию." # Once again, the fires of war have burst out in Europe, enveloping the continent in a brutal hellfire similar to the one that broke out less than 20 years ago. Not long ago the German regime has taken it upon themselves to 'right the wrongs' of the Great War and create a New Germany that would strech from the Meuse to the Neman once more. Surprisingly, the Germans are looking to be a very formidible enemy for the Entente as France and Italy are having difficulty in putting them down. Perhaps we can be the weight that tips the scales in this new war, and we have no doubt that Germany would accept an offer for an alliance given their position.
 trt.30.a: "Спросите немцев, можем ли мы присоединиться к «Штальпакту»!" # Ask the Germans if we can join the Stahlpakt!
 trt.30.b: "Мы не заинтересованы в поддержке немцев." # We have no interest in siding with the Germans.

 trt.31.t: "Союзник на Востоке?" # An Ally in the East?
 trt.31.d: "Неожиданным шагом стало то, что бывший неизлечимо больной человек из Европы направил просьбу о вступлении в Штальпакт. После Великой войны Османская империя была разделена гораздо более жестоким образом, чем Германская империя. Италия захватила Панфилию, а Франция взяла части Сирии, Ливана и Хантаба, что привело к созданию Финикии. \n\n Османы расположены в стратегически ценном районе на Ближнем Востоке, и их союзники, безусловно, причинили бы существенные неудобства французам и итальянцам... Но опять же, они ни в коем случае не были жизнеспособным союзником в Великой войне." # In a surprising move, the former terminally ill man of Europe has sent a request to join the Stahlpakt. Following the Great War, the Ottoman Empire was partitioned in a much more brutal fashion than the German Empire. Italy took Panfilia coupled with France taking portions of Syria, Lebanon and Hantab which would lead to the creation of Phoenicia. \n\n The Ottomans sit in a strategically valuable area in the Middle-east, having them as an ally would certainly inconvenience the French and Italians substantially... But then again, they were by no means a viable ally in the Great War.
 trt.31.a: "Впустите их!" # Let them in!
 trt.31.b: "Нам турки не нужны." # We have no use for the Turks.

 trt.32.t: "[From.GetNameDef] Согласен" # [From.GetNameDef] Agrees
 trt.32.d: "Немцы мудро приняли нашу просьбу о членстве в «Штальпакте». Согласившись с тем, что наши страны сформировали братские узы в Великой войне, Адам Дресслер поклялся, что ВСЕМ жертвам Версаля будет восстановлено их былое величие. С формированием новой германо-турецкой оси реальная империя, управляемая турками, кажется сейчас ближе, чем в последние годы Великой войны. \n Были запланированы торговые пути, турецкие и немецкие военные штабы сейчас проводят встречи, а видные немецкие и турецкие политические лидеры совершают визиты друг к другу; наши связи с Германией кажутся крепче стали." # The Germans have wisely accepted our request for membership in the Stahlpakt. Agreeing as our nations have formed Brotherly-ties in the Great War, Adam Dressler has vowed to see ALL of the victims of versailles restored to their former greatness. With a new German-Turkish axis formed, a real empire ruled by Turks seems closer now than it did in the closing years of the Great War. \n Trade Routes have been planned, Turkish and German Military Staff are now undertaking meetings, and prominent German and Turkish political leaders are making visits to eachother; our bonds with Germany seem to be stronger than steel.
 trt.32.a: "Мы вернем нашу законную землю!" # We will reclaim our rightful land!

 trt.33.t: "[From.GetNameDef] Отказывается!" # [From.GetNameDef] Refuses!
 trt.33.d: "Немцы, кажется, отвергли наше любезное предложение! При таком ужасном суждении неудивительно, что им удалось проиграть нам Великую войну! Безмозглый диктатор, известный как «Адам Дресслер», заявил, что мы были минимально полезным союзником в Великой войне и, вероятно, были бы еще хуже, учитывая, насколько жестоко мы были разделены на Версальских конференциях. Нам удалось удержаться от упоминания о том, что сама Германия была невероятно унижена Версальским соглашением, но проблема остается. Мы были исключены из «Штальпакта», и наши земли по-прежнему находятся в руках французов и итальянцев. Что нам делать?" # The Germans seem to have rejected our gracious offer! With judgement awful as that it is no wonder they managed to lose us the Great War! The mindless dictator known as 'Adam Dressler' has cited that we were a minimally useful Ally in the Great War and were likely to be even worse considering how brutally partitioned we were in the Conferences of Versailles. We have managed to refrain from mentioning that Germany herself was incredibly humiliated in the Versailles Accord, but the problem stands. We have been locked out of the Stahlpakt and our lands still lie in the hands of the French and Italians. What shall we do?
 trt.33.a: "Тогда мы заберем нашу землю без их помощи!" # Then we will take our land without their help!
 trt.33.b: "Наша законная территория в конце концов станет нашей." # Our rightful territory will be ours, eventually.

 trt.34.t: "Итальянская капитуляция" # Italian Capitulation
 trt.34.d: "После Великой войны мы потеряли многие законно турецкие земли из-за собак Антанты. Похоже, в очередной раз разразилась война между немцами и Антантой. К несчастью для итальянцев, они проиграли войну, не успев вовремя перейти на другую сторону. Материковая часть итальянского полуострова прочно находится под контролем Германии, и у нас есть широкие возможности вернуть себе наши законные земли, в то время как итальянское правительство пытается собраться в Африке. Возможно, это лучшая возможность захватить Панфилию и вернуть ее под тюркское правление." # In the aftermath of the Great War, we lost many rightfully Turkish lands to the Entente Dogs. It seems that once again, a war broke out between the Germans and Entente. Unfortunately for the Italians, they have lost a war without being able to switch sides in time. The mainland Italian Peninsula is firmly in German Control, and we have ample opportunity to retake our rightful lands with the Italian government scrambling to assemble themselves in Africa. This is arguably the best opportunity we could have to seize Panfilia and restore them to Turkist rule.
 trt.34.a: "Захватите южное побережье!" # Seize the southern coast!

 trt.35.t: "[trt.GetName] захватил Панфилию!" # [trt.GetName] Has Seized Panfilia!
 trt.35.d: "Эти оппортунистические ублюдки из Малой Азии оккупировали Панфилию! После нашей капитуляции мы пытались собраться и перебазироваться в Африке. Большая часть нашего флота потеряна, а наша армия не имеет и доли прежней численности. К сожалению, мы мало что можем сделать против этих... стервятников!" # Those opportunistic bastards in asia minor have occupied Panfilia! Following our capitulation, we've been scrambling to reassemble and rebase ourselves in Africa. Most of our navy is lost, and our Army is not even a fraction of its former size. There is unfortunately little we can do against these... vultures!
 trt.35.a: "Будь они прокляты!" # Damn them!

 trt.36.t: "Французская капитуляция" # French Capitulation
 trt.36.d: "К большому шоку нашего военного штаба, французы проиграли во Второй мировой войне! После прорыва на материке их враги продвигались вперед, пока не смогли достичь Парижа. Как ни странно, материковая часть Франции больше не находится в руках французов. Французскому правительству едва удается эвакуироваться в свои колонии. Это дает нам исключительную возможность захватить юго-запад, французские военные не в состоянии противостоять нам на данном этапе." # Much to the shock of our Military staff, the French have lost in the Second Great War! Following a breakthrough on the mainland, their enemies advanced right until they were able to reach Paris. The French mainland is no longer in French hands comically enough. The French government is barely managing to evacuate to their colonies. The provides us with an exceptional opportunity to seize the southwest, the French military is in no position to resist us at this stage.
 trt.36.a: "Захватите юго-восток!" # Seize the south-east!

 trt.37.t: "[trt.GetName] Захватил Северную Сирию!" # [trt.GetName] Has Seized Northern Syria!
 trt.37.d: "Безбожные турки оккупировали куски северной Сирии! Учитывая наш статус изгнанной нации, они сделали ставку, полагая, что мы не будем сопротивляться оккупации колониальных территорий. Мало ли эти Стервятники знают, что мы вполне могли бы противостоять вторжению в северную Сирию, однако для этого нам потребуется делегировать военные ресурсы на не жизненно важный фронт. Возможно, в наших интересах оставить эту ситуацию без внимания и разобраться с турками, как только мы вернем себе родину." # The godless Turks have occupied chunks of northern Syria! Given our status as an exiled nation, they have gambled by assuming we would not resist an occupation of colonial territories. Little do those Vultures know, we could very well resist an invasion of northern syria, however doing so would require us to delegate military resources to a non-vital front. It might be in our best interests to let this slide and deal with the Turks once we retake the homeland.
 trt.37.a: "Будь они прокляты!" # Damn them!
 trt.37.b: "Мы защитим наши земли!" # We will defend our lands!

 trt.38.t: "Модернизация нашей бюрократии" # Modernizing our Bureaucracy
 trt.38.d: "И для граждан [Root.GetName], и для международных наблюдателей не секрет, что Османская империя была упадочным и разваливающимся государством с соответствующей бюрократией. Коррупция и бюрократическая неэффективность были широко распространены в бывшей империи и считались обычным явлением или с ними не боролись должным образом. К сожалению, это продолжилось и в [Root.GetNameDef]. Мы должны принять меры к тому, чтобы нанимаемые чиновники были не только эффективны в своей работе, но и готовы работать в интересах не себя, а государства. Кроме того, была основана турецкая государственная администрация, которая заменила старую османскую бюрократию. Надеемся, что новый старт поможет нашим усилиям." # It is no secret to both citizens of [Root.GetName] and international observers that the Ottoman Empire was a decadent and crumbling state with a bureaucracy to match. Corruption and bureaucratic inefficiency were widespread in the former empire and considered commonplace or were not properly dealt with. This has, unfortunately, carried on into [Root.GetNameDef]. We must take steps to ensure that officials hired are both effective at their job and willing to work for the interests of not themselves, but the state. In addition, the Turkish Public Administration has been founded to replace the old Ottoman bureaucracy. Hopefully, a fresh start is what will help our endeavours.
 trt.38.a: "Вперед!" # Onward!

 trt.39.t: "Бюрократическая модернизация удалась!" # Bureaucratic Modernization Successful!
 trt.39.d: "К счастью, похоже, что наши усилия по модернизации бюрократии по большей части окупились. Хотя нам еще предстоит пройти долгий путь, чтобы должным образом достичь того уровня успеха, который мы действительно хотим видеть, это хорошее начало, и турецкое правительство уже в своих повседневных функциях начало более эффективно выполнять различные задачи и лучше удовлетворять потребности людей." # Thankfully, it seems as though our efforts to modernize the bureaucracy have, for the most part, paid off. While we still have a long road ahead of us in order to properly reach the level of success that we truly want to see, it is a good start and, already, the Turkish government, in its daily functions, has begun to perform various tasks more efficiently and is better able to meet the needs of the people.
 trt.39.a: "Великолепная новость!" # Splendid news!

 trt.40.t: "Революция разразилась!" # Revolution Has Broken Out!
 trt.40.d: "Мы только что получили катастрофические новости! Видимо, наша политическая оппозиция взяла дело в свои руки, мобилизовав против нас все население! Либералы и традиционалисты сумели преодолеть свои разногласия и создали против нас коалицию, поклявшись уничтожить нас, объявив себя наследниками Османской империи. Мы не можем позволить им отменить наши попытки модернизации." # We’ve just received disastrous news! Apparently, our political opposition has taken matters into their own hands, mobilizing the general population against us! The Liberals and traditionalists have managed to overcome their differences and have forged a coalition against us, vowing to take us out, declaring themselves the heirs of the Ottoman Empire. We cannot allow them to overturn the attempts we’ve made at modernization.
 trt.40.a: "Боже, помоги нам." # God help us.

 trt.41.t: "Конституция [Root.GetAdjective]" # The [Root.GetAdjective] Constitution
 trt.41.fullreforms: "Когда мы, кемалисты, впервые вступили в должность после распада загнивающей Османской империи, мы не ожидали такого беспрецедентного успеха, которого достигли. Несмотря на то, что нашим попыткам модернизации было много противодействия, особенно со стороны традиционалистов и духовенства, мы можем с уверенностью сказать, что [Root.GetNameDef] — лучшая нация для проведения радикальных реформ. Женщины теперь имеют равное представительство, люди представлены лучше, нас считают прозападной нацией, и, прежде всего, нам удалось угодить людям, которые являются истинными властителями [Root.GetNameDef]." # When we, the Kemalists, had first taken office following the collapse of the decadent Ottoman Empire, we had not expected the unprecedented amount of success that we had experienced. While there was much opposition towards our attempts of modernization, especially by traditionalists and the clergy, we can safely say that [Root.GetNameDef] is a better nation for undergoing sweeping reforms. Women now have equal representation, people are better represented, we are viewed as a westernized nation, and, above all, we have managed to cater to the people who are the true sovereigns of [Root.GetNameDef].
 trt.41.slightreforms: "Хотя у нас было много амбиций после прихода к власти после распада загнивающей Османской империи, нам не удалось осуществить все реформы, которые мы намеревались провести. Хотя это ни в коем случае не хорошо, ясно, что у [Root.GetNameDef] и его людей есть надежда. Потому что, хотя традиционалистам и священнослужителям удалось победить нас в настоящее время, существовали определенные группы людей, которые были восприимчивы к нашим реформам и хотели видеть Республику светским, современным и прозападным государством..." # While we had had many ambitions upon taking power, following the collapse of the decadent Ottoman Empire, we had not managed to achieve all of the reforms that we’d set out to institute. While this is, by no means, a good thing, it is clear that there is hope for [Root.GetNameDef] and its people. Because while the traditionalists and clergymen have managed to defeat us at present, there were certain groups of people who were receptive towards our reforms and wish to see the Republic as a secular, modern, and westernized state...
 trt.41.a: "Да здравствует Республика!" # Long live the Republic!

 trt.42.t: "Децентрализованное правило" # Decentralized Rule
 trt.42.d: "Подчинившись местным органам власти и избавив административную систему от ее централизованного характера, мы можем помочь обеспечить лучшее представительство народа и, следовательно, обеспечить истинное демократическое государство. Это также помогает нам в наших усилиях по повышению эффективности самих административных и бюрократических систем, поскольку местным органам власти больше не придется следовать директивам национального правительства в Константинополе. Больше не будут игнорироваться требования людей, и наша администрация не будет ограничивать сами местные органы власти." # By deferring to the local governments and ridding the administrative system of its centralized nature, we can help ensure better representation for the people and, consequently, assure a true democratic state. This also assists us in our endeavour of making the administrative and bureaucratic systems themselves more efficient, as the local governments shall no longer have to follow directives from the national government in Constantinople. No longer shall the demands of the people be ignored nor shall our administration constrict the local governments themselves.
 trt.42.a: "Ура!" # Hurrah!

 trt.43.t: "[trt.GetName] торжествует!" # [trt.GetName] Stands Triumphant!
 trt.43.d: "Как и ожидалось, нам удалось подавить инакомыслящих и революционеров, которые пытались свергнуть наше правление и ввергнуть [trt.GetNameDef] в анархию. Это стало отличной новостью для многих членов правительства, которые чрезвычайно удовлетворены нашей прочной стабильностью и мощью наших вооруженных сил. Кажется, что с этого момента мы можем ожидать более мирных времен и обеспечить лучшую и более стабильную [trt.GetName]." # As expected, we have managed to put down the dissenters and revolutionaries who had attempted to topple our rule and plunge [trt.GetNameDef] into anarchy. This comes as great news to many within the government, who are extremely satisfied with our enduring stability and the strength of our armed forces. It seems as though, from now on, we can look forward toward more peaceful times and ensure a better, more stable [trt.GetName].
 trt.43.a: "За мир, стабильность и процветание!" # For peace, stability, and prosperity!

 trt.44.t: "[trt.GetNameDef] поддерживает связи" # [trt.GetNameDef] Pursues Ties
 trt.44.d: "Интересно, что новый лидер турецкого государства Хусейн Нихал-бей решил, в попытке дальнейшего продвижения пантюркских идеалов, наладить связи с [Root.GetName]. Делегация [trt.GetName] отметила нашу генетическую близость и выгодность укрепления и углубления связей между нашими народами, особенно с учетом постоянно растущей неспокойной ситуации в мире. Имея это в виду, что мы скажем?" # Interestingly enough, the newest leader of the Turkish State, Hüseyin Nihâl Bey, has decided, in an attempt to further promote pan-Turkic ideals, to foster ties with [Root.GetName]. The delegation from [trt.GetName] has cited our genetic closeness and the advantageousness of fostering and deepening ties between our nations, especially considering the ever increasing turbulent situation of the world. With that in mind, what say we?
 trt.44.a: "Что может пойти не так?" # What could go wrong?
 trt.44.b: "Нам не нужен пантюркизм." # We've no need for pan-Turkism.

 trt.45.t: "[From.GetNameDef] Принимает!" # [From.GetNameDef] Accepts!
 trt.45.d: "Многие в правительстве [Root.GetAdjective] только что вздохнули с облегчением. К счастью, похоже, что [From.GetNameDef] решил принять наше предложение об углублении связей между нашим новым правительством. Хотя многие международные наблюдатели могут счесть это не более чем символическим жестом, на самом деле это очень полезно, поскольку помогло обеспечить легитимность нашего правления и нашей программы, поскольку нам удалось доказать людям [Root.GetAdjective], что мы можем успешно преследовать нашу собственную повестку дня." # A collective sigh of relief has just been released by many within the [Root.GetAdjective] government. Thankfully, it seems as though [From.GetNameDef] has decided to accept our offer of deepening ties between our new government. While this may be seen as little more than a token gesture by many international observers, this is, in fact, very helpful as it has helped provide legitimacy to our rule and our program as we’ve managed to prove to the [Root.GetAdjective] people that we can successfully pursue our own agenda.
 trt.45.a: "Тост за наших друзей [From.GetAdjective]!" # A toast to our [From.GetAdjective] friends!

 trt.46.t: "[From.GetNameDef] Отклоняется!" # [From.GetNameDef] Declines!
 trt.46.d: "Только что от нашей делегации другим тюркским народам поступили тревожные новости: судя по всему, [From.GetNameDef] решил отклонить наше предложение о развитии и углублении связей, сославшись на то, что в нынешнем виде нет необходимости продвигать пантюркистские идеалы. Это огромный удар по легитимности нового правительства, поскольку в настоящее время мы не можем доказать людям [Root.GetAdjective], что мы можем успешно реализовывать свои собственные планы." # Worrying news has just been delivered from our delegation to the other Turkic nations: apparently, its seems as though [From.GetNameDef] has decided to reject our offer of fostering and deepening ties, citing that, as it stands, there is no need to further the pan-Turkic ideals. This is a huge blow to the legitimacy of the new government, as we have currently been unable to prove to the [Root.GetAdjective] people that we can successfully pursue our own agenda.
 trt.46.a: "Будь они прокляты!" # Damn them!

 trt.47.t: "[trt.GetNameDef] поддерживает связи" # [trt.GetNameDef] Pursues Ties
 trt.47.d: "Интересно, что новый лидер турецкого государства Хусейн Нихал-бей решил, в попытке дальнейшего продвижения пантюркских идеалов, наладить связи с [Root.GetName]. Делегация [trt.GetName] отметила нашу генетическую близость и выгодность укрепления и углубления связей между нашими народами, особенно с учетом постоянно растущей неспокойной ситуации в мире. Имея это в виду, что мы скажем?" # Interestingly enough, the newest leader of the Turkish State, Hüseyin Nihâl Bey, has decided, in an attempt to further promote pan-Turkic ideals, to foster ties with [Root.GetName]. The delegation from [trt.GetName] has cited our genetic closeness and the advantageousness of fostering and deepening ties between our nations, especially considering the ever increasing turbulent situation of the world. With that in mind, what say we?
