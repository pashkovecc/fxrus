 trt.48.d: "Многие в правительстве [Root.GetAdjective] только что вздохнули с облегчением. К счастью, похоже, что [From.GetNameDef] решил принять наше предложение об углублении связей между нашим новым правительством. Хотя многие международные наблюдатели могут счесть это не более чем символическим жестом, на самом деле это очень полезно, поскольку помогло обеспечить легитимность нашего правления и нашей программы, поскольку нам удалось доказать людям [Root.GetAdjective], что мы можем успешно преследовать нашу собственную повестку дня." # A collective sigh of relief has just been released by many within the [Root.GetAdjective] government. Thankfully, it seems as though [From.GetNameDef] has decided to accept our offer of deepening ties between our new government. While this may be seen as little more than a token gesture by many international observers, this is, in fact, very helpful as it has helped provide legitimacy to our rule and our program as we’ve managed to prove to the [Root.GetAdjective] people that we can successfully pursue our own agenda.
 trt.48.a: "Тост за наших друзей [From.GetAdjective]!" # A toast to our [From.GetAdjective] friends!

