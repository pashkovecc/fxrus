 trt.50.d: "Интересно, что новый лидер турецкого государства Хусейн Нихал-бей решил, в попытке дальнейшего продвижения пантюркских идеалов, наладить связи с [Root.GetName]. Делегация [trt.GetName] отметила нашу генетическую близость и выгодность укрепления и углубления связей между нашими народами, особенно с учетом постоянно растущей неспокойной ситуации в мире. Имея это в виду, что мы скажем?" # Interestingly enough, the newest leader of the Turkish State, Hüseyin Nihâl Bey, has decided, in an attempt to further promote pan-Turkic ideals, to foster ties with [Root.GetName]. The delegation from [trt.GetName] has cited our genetic closeness and the advantageousness of fostering and deepening ties between our nations, especially considering the ever increasing turbulent situation of the world. With that in mind, what say we?
