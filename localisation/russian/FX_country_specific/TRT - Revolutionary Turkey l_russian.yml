 trt.52.d: "Только что от нашей делегации другим тюркским народам поступили тревожные новости: судя по всему, [From.GetNameDef] решил отклонить наше предложение о развитии и углублении связей, сославшись на то, что в нынешнем виде нет необходимости продвигать пантюркистские идеалы. Это огромный удар по легитимности нового правительства, поскольку в настоящее время мы не можем доказать людям [Root.GetAdjective], что мы можем успешно реализовывать свои собственные планы." # Worrying news has just been delivered from our delegation to the other Turkic nations: apparently, its seems as though [From.GetNameDef] has decided to reject our offer of fostering and deepening ties, citing that, as it stands, there is no need to further the pan-Turkic ideals. This is a huge blow to the legitimacy of the new government, as we have currently been unable to prove to the [Root.GetAdjective] people that we can successfully pursue our own agenda.
 trt.52.a: "Будь они прокляты!" # Damn them!

 trt.53.t: "Кампания по набору персонала: низкая кампания" # Recruitment Campaign: Low Campaigning
 trt.53.d: "Очевидно, что для реализации нашей программы нам нужно будет начать кампании по вербовке людей. Конечно, будет сложно убедить население [Root.GetAdjective] массово вступить в армию. Чтобы обойти это, правительство должно начать тонкую кампанию по вербовке и становится все более агрессивной в вербовке, разжигая угли национализма." # It is clear that, in order to pursue our agenda, we will need to begin recruitment campaigns. Of course, it will be tough to convince the [Root.GetAdjective] population to join the army in droves. In order to circumvent this, the government shall begin a subtle recruitment campaign and increasingly become more aggressive with recruitment by stoking the embers of nationalism.
 trt.53.a: "На благо нации." # For the good of the nation.

 trt.54.t: "Кампания по набору персонала: регулярная кампания" # Recruitment Campaign: Regular Campaigning
 trt.54.d: "Прошло несколько месяцев, и стало ясно, что наши усилия принесли свои плоды. Поскольку мы начали наращивать интенсивность призывной кампании, все больше и больше трудоспособных мужчин [Root.GetAdjective] записываются в Сухопутные войска [Root.GetAdjective]." # After a few months have passed, it’s clear that our efforts have borne fruit. As we’ve begun to increase the intensity of the recruitment campaign, more and more able-bodied [Root.GetAdjective] men have been signing up to join the [Root.GetAdjective] Land Forces.
 trt.54.a: "Отличный." # Excellent.

 trt.55.t: "Кампания по набору персонала: высокая кампания" # Recruitment Campaign: High Campaigning
 trt.55.d: "Правительство теперь стало более откровенным в своей кампании, и это явно принесло свои плоды. То, что когда-то было незаметной кампанией по вербовке новых призывников, теперь превратилось в полноценную кампанию по вербовке, с плакатами на каждом углу. Этому способствовал тот факт, что записавшиеся мужчины полны сил и готовы служить Родине. В результате к нашим вооруженным силам присоединилось рекордное количество мужчин." # The government has now become more overt with its campaigning and it has clearly paid off. What was once a subtle campaign for the recruitment of new conscripts has now become a full on recruitment campaign, with posters on every street corner. This has been helped by the fact that the men who are signing up are invigorated and eager to serve the motherland. As a result, our armed forces have seen record numbers of men join.
 trt.55.a: "Замечательный!" # Wonderful!

 trt.56.t: "Расширение прав и возможностей военизированных группировок" # Empowering Paramilitary Groups
 trt.56.d: "Сам Хусейн Нихал-бей был сторонником сотрудничества с военизированными формированиями, поддерживающими его пантюркистскую политику. Это может гарантировать, что в случае широкого неодобрения и, если инакомыслие достигнет достаточно высокого уровня и бунта против наших предложений, у нас будет группа, вооруженная до зубов, чтобы поддержать нас." # Hüseyin Nihâl Bey himself has been a proponent of working with paramilitary groups that favour his pan-Turkic policy. This can ensure that, in the event of widespread disapproval and, if dissent goes high enough, rioting against our proposals, we will have a group armed to the teeth to back us up.
 trt.56.a: "Это необходимая мера." # This is a necessary measure.

 trt.57.t: "Реакция вооруженных сил" # The Armed Forces React
 trt.57.d: "Вооруженные силы, судя по всему, не одобряют нашу политику поддержки маргинальных военизированных группировок и вооружения их новейшим оружием. Они поставили под сомнение наши приоритеты в отношении военных расходов и прокомментировали абсурдность нашей поддержки пантюркистских военизированных группировок." # The armed forces have, apparently, not taken kindly to our policy of backing fringe paramilitary groups and arming them with the newest weapons. They have taken to questioning our priorities with regards to military spending and have commented on the absurdity of our support of pan-Turkic paramilitary groups.
 trt.57.a: "Кем они себя считают?!" # Who do they think they are?!

 trt.58.t: "Офицеры старой гвардии высказываются" # Old Guard Officers Speak Out
 trt.58.d: "Офицеры старой гвардии были еще более яростны в своей критике, заявляя, что поддержка Нихал-беем военизированных группировок по сравнению с самими вооруженными силами не имеет смысла, особенно если учесть, что [Root.GetNameDef] окружен со всех сторон врагами и ему понадобятся профессиональные силы, чтобы помочь защитить нацию в случае нападения или, если мы перейдем в наступление, атаковать наших врагов самостоятельно." # Old guard officers have even been more rampant in their criticism, claiming that Nihâl Bey’s support of paramilitary groups over the armed forces themselves makes no sense, especially considering that [Root.GetNameDef] is surrounded on all sides by enemies and will need professional forces to help defend the nation in the case of an attack or, on the off chance that we go on the offensive, attack our enemies themselves.
 trt.58.a: "Они не знают, о чем говорят..." # They don't know what they're talking about...

 trt.59.t: "Искоренение левых" # Rooting out Leftists
 trt.59.d: "Мы использовали находящиеся под нашим контролем военизированные группировки в своих интересах, заставляя их выявлять и уничтожать видных левых. Лидеры и другие руководители различных социалистических партий были задержаны или вынуждены скрываться. Хотя это и вывело социалистические партии из публичной сферы, это не означает, что у них нет подпольных движений, с которыми, похоже, придется бороться в будущем." # We’ve used the paramilitary groups under our thumb to our advantage by having them identify and assassinate prominent leftists. Leaders and other higher ups of the various socialist parties have been taken out or forced into hiding. While this has removed socialist parties from the public sphere, it does not mean that they haven’t got underground movements which, it seems, will have to be dealt with in the future.
 trt.59.a: "Это должно было быть сделано." # This had to have been done.

 trt.60.t: "Реструктуризация нации" # Restructuring the Nation
 trt.60.d: "Несмотря на то, что мы раз и навсегда избавились от Османской империи, мы все еще сохранили многие проблемы, которые преследовали империю. Например, наша бюрократия неэффективна и находится в руинах, по большей части неэффективна и неспособна должным образом выполнять свою работу. Коррупция процветает, а отсутствие возможности индустриализации нанесло ущерб нашей экономике. Мы должны приступить к реформированию самой основы государства и созданию сильного турецкого государства." # Despite having been rid of the Ottoman Empire once and for all, we still have retained much of the issues that had plagued the empire. For example, our bureaucracy inefficient and in shambles, largely ineffective and unable to do its job properly. Corruption is rampant and a lack of being unable to industrialize has hurt our economy. We must take to reforming the very core of the state and creating a robust Turkish state.
 trt.60.a: "Мы добьемся успеха!" # We shall be successful!

 trt.61.t: "Борьба с бюрократией" # Dealing With the Bureaucracy
 trt.61.d: "Как говорилось ранее, бюрократия, которую мы унаследовали, была неэффективной и способна должным образом выполнять даже самые простые задачи. Вот почему мы приступили к созданию турецкой государственной администрации, увольняя бюрократов старой гвардии и заменяя их способными людьми, способными эффективно и действенно выполнять свои задачи. Кроме того, были приняты меры по борьбе с коррупцией, чтобы предотвратить повторение подобного упадка в турецкой нации. Единственный вопрос: увенчаются ли наши усилия успехом?" # As stated before, the bureaucracy that we had inherited was one that was ineffective and able to even perform the simplest of tasks properly. That is why we have taken to creating the Turkish Public Administration, firing old guard bureaucrats, and replacing them with capable men who are able to efficiently and effectively complete their tasks. In addition anti-corruption measures have been implemented in order to prevent such decadence from ever occurring within the Turkish nation ever again. The only question is: will our efforts be successful?
 trt.61.a: "Будем надеяться, что они будут..." # Let's hope they will be...

 trt.62.t: "Бюрократические усилия увенчались успехом" # Bureaucratic Efforts Successful
 trt.62.d: "К счастью, похоже, что наши усилия по модернизации бюрократии по большей части окупились. Хотя нам еще предстоит пройти долгий путь, чтобы должным образом достичь того уровня успеха, который мы действительно хотим видеть, это хорошее начало, и турецкое правительство уже в своих повседневных функциях начало более эффективно выполнять различные задачи и лучше удовлетворять потребности людей." # Thankfully, it seems as though our efforts to modernize the bureaucracy have, for the most part, paid off. While we still have a long road ahead of us in order to properly reach the level of success that we truly want to see, it is a good start and, already, the Turkish government, in its daily functions, has begun to perform various tasks more efficiently and is better able to meet the needs of the people.
 trt.62.a: "Удивительный!" # Amazing!

 trt.63.t: "Судебный контроль" # Judicial Control
 trt.63.d: "Мы должны начать брать дело в свои руки; вместо того, чтобы допускать существование независимой судебной власти, мы должны обратиться к таким странам, как Соединенные Штаты, которые позволяют президенту, который является главой исполнительной власти, назначать судей по своему усмотрению. Однако сделаем и свою оговорку: президенту будет разрешено увольнять судей по своему усмотрению. Сама судебная система, конечно же, будет находиться под контролем президента." # We must begin to take matters into our own hands; rather than allowing an independent judiciary to exist, we must turn to nations such as the United States, which allow the president, who is the head of the executive branch, to appoint judges as he sees fit. However, we shall also put in our own caveat: the president will be allowed to fire judges as he sees fit. The judiciary itself shall be, of course, overseen by the president.
 trt.63.a: "Вперед!" # Onward!

 trt.64.t: "Закрытие парламента" # Shutting Down Parliament
 trt.64.d: "Мы больше не можем допускать существования этого фарса правительства. До нашего прихода к власти парламент был в значительной степени парализованным институтом, и в нем царила масса распрей, а это означало, что ничего не было сделано. Действительно, именно парламент сам принял решение о передаче турецкого государства в руки империалистических держав Антанты. Как можно позволить существовать учреждению, проявляющему такую ​​наглую трусость? Нет, мы должны принять свои меры и приостановить работу парламента на неопределенный срок..." # We can no longer allow this farce of a government to exist. Prior to our ascendance to power, the parliament was a largely paralyzed institution and had a ton of infighting, which meant nothing would ever get done. Indeed, it was the parliament themselves who had made the decision to surrender the Turkish state into the hands of the imperialist Entente powers. How can an institution that displays such brazen cowardice be allowed to exist? No, we must take our own measures and suspend parliament indefinitely...
 trt.64.a: "Это вынужденная мера..." # This is a necessary measure...

 trt.65.t: "Революция разразилась!" # Revolution Has Broken Out!
 trt.65.d: "Мы только что получили катастрофические новости! Видимо, наша политическая оппозиция взяла дело в свои руки, мобилизовав против нас все население! Либералы и кемалисты сумели преодолеть свои разногласия и создали против нас коалицию, поклявшись уничтожить нас, объявив себя истинными наследниками нации [Root.GetAdjective]. Мы не можем позволить им таким образом запятнать имя нашей великой империи и должны как можно скорее принять решительные меры." # We’ve just received disastrous news! Apparently, our political opposition has taken matters into their own hands, mobilizing the general population against us! The Liberals and Kemalists have managed to overcome their differences and have forged a coalition against us, vowing to take us out, declaring themselves the true heirs of the [Root.GetAdjective] nation. We cannot allow them to tarnish the name of our great empire in such a manner and we must take decisive action as soon as possible.
 trt.65.a: "Мы сокрушим этих наглых узурпаторов!" # We shall crush these insolent usurpers!

 trt.66.t: "Ввод в строй новых морских крейсеров" # Commissioning New Naval Cruisers
 trt.66.cruisernoempire: "Благодаря кропотливым и интенсивным усилиям военно-морских сил [Root.GetAdjective], после нескольких месяцев напряженной работы, нам удалось ввести в строй два новых крейсера в составе крейсерского флота: крейсер Военно-морских сил Зафер и Явуз.\n\nХотя приобретение деталей для фактической постройки этих крейсеров было непростой задачей, нам удалось это сделать и, как следствие, укрепить наш флот." # Following the laborious and intensive effort on the part of the [Root.GetAdjective] naval forces, we have, after months of hard work, managed to commission two new cruisers as part of the cruiser fleet: the naval cruiser Zafer and Yavuz.\n\nWhile acquiring the parts to actually build these cruisers was no easy feat, we have managed to accomplish doing so and have, as a result, strengthened our navy.
 trt.66.cruiserempire: "В результате кропотливых и интенсивных усилий военно-морских сил [Root.GetAdjective], после нескольких месяцев напряженной работы, нам удалось ввести в строй два новых крейсера в составе крейсерского флота: военный крейсер Берк-и Сатвет, названный в честь нашего старого торпедного крейсера, списанного после Великой войны, и Меджидие.\n\nХотя приобретение деталей для фактической постройки этих крейсеров было непростой задачей, нам удалось это сделать и в результате укрепили наш военно-морской флот." # Following the laborious and intensive effort on the part of the [Root.GetAdjective] naval forces, we have, after months of hard work, managed to commission two new cruisers as part of the cruiser fleet: the naval cruiser Berk-i Satvet, named after our old torpedo cruiser which had been scrapped after the Great War, and Mecidiye.\n\nWhile acquiring the parts to actually build these cruisers was no easy feat, we have managed to accomplish doing so and have, as a result, strengthened our navy.
 trt.66.a: "Великолепный!" # Splendid!

 trt.67.t: "Военная помощь [trt.GetNameDef]?" # Military Assistance to [trt.GetNameDef]?
 trt.67.d: "Интересно, что, похоже, [trt.GetNameDef] решил прийти к нам за помощью в военном отношении, конкретно попросив нас помочь им в профессионализации и совершенствовании их вооруженных сил. Хотя это может оказаться пустой тратой ресурсов, если мы воспользуемся этим шансом, мы, возможно, сможем расширить наши связи со страной [trt.GetAdjective]. Что мы скажем?" # Interestingly enough, it seems as though [trt.GetNameDef] has decided to come to us for help militarily, specifically asking us to help them with regards to the professionalization and improvement of their armed forces. While this may prove to be a waste of resources, if we do take this chance we could perhaps increase our ties with the [trt.GetAdjective] nation. What say we?
 trt.67.a: "Что может пойти не так?" # What could go wrong?
 trt.67.b: "Скорее нет." # Rather not.

 trt.68.t: "[From.GetNameDef] принял!" # [From.GetNameDef] has Accepted!
 trt.68.d: "К счастью, похоже, что [From.GetAdjective] решили принять нашу просьбу о военной помощи и начали оперативно присылать нам помощь. Это благо не только для наших вооруженных сил, но и для будущих связей [From.GetAdjective]-[Root.GetAdjective]." # Thankfully, it seems as though the [From.GetAdjective] have decided to accept our plea for military aid and have begun to promptly send us assistance. This is a boon to not only our armed forces, but to future [From.GetAdjective]-[Root.GetAdjective] ties as well.
 trt.68.a: "Чудесный!" # Marvellous!

 trt.69.t: "[From.GetNameDef] отказался!" # [From.GetNameDef] has Declined!
 trt.69.d: "К сожалению, похоже, что [From.GetAdjective] решили категорически отклонить нашу просьбу о военной помощи, заявив, что на данный момент у них нет лишних ресурсов. Это удар не только по нашим вооруженным силам, но и по будущим связям [From.GetAdjective]-[Root.GetAdjective]." # Unfortunately, it seems as though the [From.GetAdjective] have decided to flatly reject our plea for military aid, stating that, at the moment, they have no resources to spare. This is a setback to not only our armed forces, but to future [From.GetAdjective]-[Root.GetAdjective] ties as well.
 trt.69.a: "Неудача, конечно..." # A setback, to be sure...

 trt.70.t: "Военная помощь [trt.GetNameDef]?" # Military Assistance to [trt.GetNameDef]?
 trt.70.d: "Интересно, что, похоже, [trt.GetNameDef] решил прийти к нам за помощью в военном отношении, конкретно попросив нас помочь им в профессионализации и совершенствовании их вооруженных сил. Хотя это может оказаться пустой тратой ресурсов, если мы воспользуемся этим шансом, мы, возможно, сможем расширить наши связи со страной [trt.GetAdjective]. Что мы скажем?" # Interestingly enough, it seems as though [trt.GetNameDef] has decided to come to us for help militarily, specifically asking us to help them with regards to the professionalization and improvement of their armed forces. While this may prove to be a waste of resources, if we do take this chance we could perhaps increase our ties with the [trt.GetAdjective] nation. What say we?
 trt.70.a: "Что может пойти не так?" # What could go wrong?
 trt.70.b: "Скорее нет." # Rather not.

 trt.71.t: "[From.GetNameDef] принял!" # [From.GetNameDef] has Accepted!
 trt.71.d: "К счастью, похоже, что [From.GetAdjective] решили принять нашу просьбу о военной помощи и начали оперативно присылать нам помощь. Это благо не только для наших вооруженных сил, но и для будущих связей [From.GetAdjective]-[Root.GetAdjective]." # Thankfully, it seems as though the [From.GetAdjective]s have decided to accept our plea for military aid and have begun to promptly send us assistance. This is a boon to not only our armed forces, but to future [From.GetAdjective]-[Root.GetAdjective] ties as well.
 trt.71.a: "Чудесный!" # Marvellous!

 trt.72.t: "[From.GetNameDef] отказался!" # [From.GetNameDef] has Declined!
 trt.72.d: "К сожалению, похоже, что [From.GetAdjective] решили категорически отклонить нашу просьбу о военной помощи, заявив, что на данный момент у них нет лишних ресурсов. Это удар не только по нашим вооруженным силам, но и по будущим связям [From.GetAdjective]-[Root.GetAdjective]." # Unfortunately, it seems as though the [From.GetAdjective]s have decided to flatly reject our plea for military aid, stating that, at the moment, they have no resources to spare. This is a setback to not only our armed forces, but to future [From.GetAdjective]-[Root.GetAdjective] ties as well.
 trt.72.a: "Неудача, конечно..." # A setback, to be sure...

 trteco.1.t: "Экономический спад" # Economic Downturn
 trteco.1.d: "Ужасные новости только что дошли до нашего порога! Судя по всему, несколько дней назад Лондонская фондовая биржа рухнула, а уровень безработицы и оборотов в Соединенном Королевстве резко возрос.\n\n[Root.GetNameDef], к сожалению, не остался незатронутым, поскольку ударные волны обвала лондонского рынка негативно повлияли на нашу великую страну. Уже сейчас магазины начинают стремительно закрываться, а иностранные компании массово покидают [Root.GetNameDef]. Безработица и увольнения резко возросли, и среди населения в настоящее время назревает недовольство. Это не могло произойти в худшее время, и ясно, что нам придется предпринять шаги для борьбы с этим экономическим спадом, чтобы он не разорвал нашу нацию на части." # Horrible news has just reached our doorstep! Apparently, several days ago, the London Stock Exchange had plunged, with unemployment rates and turnover rates soaring in the United Kingdom.\n\n[Root.GetNameDef] has not been left unaffected, unfortunately, as the shockwaves of the London Market Collapse have negatively affected our great nation. Even now, shops are beginning to close rapidly, with foreign companies leaving [Root.GetNameDef] in droves. Unemployments and layoffs have skyrocketed, with discontent now brewing within the general populace. This could not have come at a worse time, and it is clear that we will have to take steps in order to combat this economic downturn, lest it tear our nation apart.
 trteco.1.a: "Блин!" # Kahretsin!

 trteco.2.t: "Популярность социалистов растет" # Socialists Rise in Popularity
 trteco.2.d: "Спустя несколько дней после экономического спада уже кажется, что социалисты внутри нашей страны начали пользоваться ситуацией. Действительно, такие лидеры, как Решад Фуад и Шефик Хюсню, активно проповедовали политическую идеологию социализма и расширяли возможности простых рабочих. Это, к сожалению, дало заметный эффект: Рабоче-Крестьянская Социалистическая партия и Коммунистическая партия приобрели сторонников среди недовольного населения." # Days after the economic downturn, it already seems as though the socialists within our nation have begun to take advantage of the situation. Indeed, leaders such as Reşad Fuad and Şefik Hüsnü have been active in terms of preaching the political ideology of socialism and empowering the common workers. This has, unfortunately, had a noticeable effect, with the Workers and Peasants Socialist Party and Communist Party gaining followers from the disgruntled populace.
 trteco.2.a: "Бесполезный жест." # A futile gesture.

 trteco.3.t: "[trt.GetNameDef] национализировал свои железные дороги!" # [trt.GetNameDef] Has Nationalized Their Railways!
 trteco.3.d: "При Османском управлении государственного долга многие наши иностранные компании и само правительство имели долю в наиболее известных и ценных промышленных холдингах [trt.GetNameDef], включая их железные дороги. К несчастью для нас, правительство [trt.GetAdjective] решило национализировать свои железные дороги, тем самым лишив нас и наши компании какой-либо прибыли. Учитывая это, нам необходимо принять меры. Встает вопрос: что нам делать?" # Under the Ottoman Public Debt Administration, many of our foreign companies and the government itself has had a stake in [trt.GetNameDef]s most prominent and prized industrial holdings, including their railways. Unfortunately for us, the [trt.GetAdjective] government has now decided to nationalize their railways, thereby robbing us and our companies of any sort of profit. With that being said, we need to take action. The question stands: what shall we do?
 trteco.3.a: "Ничего не делайте." # Do nothing.
 trteco.3.b: "Эмбарго им!" # Embargo them!
 trteco.3.c: "Объявляем войну!" # Declare war!

 trteco.4.t: "[trt.GetNameDef] национализировал свои железные дороги!" # [trt.GetNameDef] Has Nationalized Their Railways!
 trteco.4.d: "При Османском управлении государственного долга многие наши иностранные компании и само правительство имели долю в наиболее известных и ценных промышленных холдингах [trt.GetNameDef], включая их железные дороги. К несчастью для нас, правительство [trt.GetAdjective] решило национализировать свои железные дороги, тем самым лишив нас и наши компании какой-либо прибыли. Учитывая это, нам необходимо принять меры. Встает вопрос: что нам делать?" # Under the Ottoman Public Debt Administration, many of our foreign companies and the government itself has had a stake in [trt.GetNameDef]s most prominent and prized industrial holdings, including their railways. Unfortunately for us, the [trt.GetAdjective] government has now decided to nationalize their railways, thereby robbing us and our companies of any sort of profit. With that being said, we need to take action. The question stands: what shall we do?
 trteco.4.a: "Ничего не делайте." # Do nothing.
 trteco.4.b: "Эмбарго им!" # Embargo them!
 trteco.4.c: "Объявляем войну!" # Declare war!

 trteco.5.t: "[trt.GetNameDef] национализировал свои железные дороги!" # [trt.GetNameDef] Has Nationalized Their Railways!
 trteco.5.d: "При Османском управлении государственного долга многие наши иностранные компании и само правительство имели долю в наиболее известных и ценных промышленных холдингах [trt.GetNameDef], включая их железные дороги. К несчастью для нас, правительство [trt.GetAdjective] решило национализировать свои железные дороги, тем самым лишив нас и наши компании какой-либо прибыли. Учитывая это, нам необходимо принять меры. Встает вопрос: что нам делать?" # Under the Ottoman Public Debt Administration, many of our foreign companies and the government itself has had a stake in [trt.GetNameDef]s most prominent and prized industrial holdings, including their railways. Unfortunately for us, the [trt.GetAdjective] government has now decided to nationalize their railways, thereby robbing us and our companies of any sort of profit. With that being said, we need to take action. The question stands: what shall we do?
 trteco.5.a: "Ничего не делайте." # Do nothing.
 trteco.5.b: "Эмбарго им!" # Embargo them!
 trteco.5.c: "Объявляем войну!" # Declare war!

 trteco.6.t: "[From.GetName] накладывает на нас эмбарго!" # [From.GetName] Embargoes Us!
 trteco.6.d: "Кажется, что наше решение национализировать наши железные дороги не было бесспорным. Мы получили много негативной реакции от [From.GetNameDef], поскольку они решили временно ввести эмбарго на нашу страну, тем самым нанеся ущерб нашей торговле с ними." # It seems as though our decision to nationalize our railways has not been one without controversy. We’ve received much backlash from [From.GetNameDef] as they’ve decided to temporarily embargo our nation, thereby hurting our trade with them.
 trteco.6.a: "Черт возьми..." # Dammit...

 trteco.7.t: "[From.GetName] накладывает на нас эмбарго!" # [From.GetName] Embargoes Us!
 trteco.7.d: "Кажется, что наше решение национализировать наши железные дороги не было бесспорным. Мы получили много негативной реакции от [From.GetNameDef], поскольку они решили временно ввести эмбарго на нашу страну, тем самым нанеся ущерб нашей торговле с ними." # It seems as though our decision to nationalize our railways has not been one without controversy. We’ve received much backlash from [From.GetNameDef] as they’ve decided to temporarily embargo our nation, thereby hurting our trade with them.
 trteco.7.a: "Черт возьми..." # Dammit...

 trteco.8.t: "[From.GetName] накладывает на нас эмбарго!" # [From.GetName] Embargoes Us!
 trteco.8.d: "Кажется, что наше решение национализировать наши железные дороги не было бесспорным. Мы получили много негативной реакции от [From.GetNameDef], поскольку они решили временно ввести эмбарго на нашу страну, тем самым нанеся ущерб нашей торговле с ними." # It seems as though our decision to nationalize our railways has not been one without controversy. We’ve received much backlash from [From.GetNameDef] as they’ve decided to temporarily embargo our nation, thereby hurting our trade with them.
 trteco.8.a: "Черт возьми..." # Dammit...

 trteco.9.t: "Начальная стабилизация" # Initial Stabilization
 trteco.9.d: "Хотя наши меры жесткой экономии были в значительной степени непопулярны среди общественности, когда они были впервые приняты, похоже, что наша настойчивость в их соблюдении принесла свои плоды. Благодаря более высокой ставке налога и снижению государственных расходов нам удалось смягчить некоторые последствия краха лондонского рынка." # While our austerity measured had been largely unpopular with the public when they’d first been enacted, it seems as though our persistence in sticking with them has borne fruit. Due to a higher tax rate and lower government spending, we’ve managed to mitigate a few of the effects from the London  Market Collapse.
 trteco.9.a: "Замечательный!" # Wonderful!

 trteco.10.t: "Торговать с [trt.GetNameDef]?" # Trade with [trt.GetNameDef]?
 trteco.10.d: "Совершив несколько неожиданный шаг, [trt.GetNameDef] обратился к нам с целью расширения экономических связей между нашими странами. На этот раз они ясно дали понять, что хотели бы заключить с нами торговую сделку, пытаясь обеспечить более свободное перемещение товаров между нашими странами, и заявили, что это принесет взаимную выгоду обеим нашим экономикам. Каков наш ответ?" # In a somewhat surprising move, [trt.GetNameDef] has approached us in order to further economic ties between our countries. This time, they've made it clear that they would like to pursue a trade deal with us in an attempt to allow for the freer movement of goods between our nations and have argued that this will mutually benefit both of our economies. What is our response?
 trteco.10.a: "Конечно!" # Sure!
 trteco.10.b: "Абсолютно нет." # Absolutely not.

 trteco.11.t: "[From.GetNameDef] принял!" # [From.GetNameDef] has Accepted!
 trteco.11.d: "[From.GetName] решил принять наше предложение о торговой сделке, что позволит нам начать более свободное перемещение товаров между нашими двумя странами, а также поставит нас в дипломатически выгодную ситуацию. Это имеет далеко идущие последствия, и все они хорошие, для будущих совместных предприятий [Root.GetAdjective]-[From.GetAdjective]." # [From.GetName] has decided to accept our offer a trade deal, thereby allowing us to begin the freer movement of goods between our two nations while also putting us in a diplomatically favourable situation. This has far reaching implications, all of them good, for future [Root.GetAdjective]-[From.GetAdjective] joint ventures.
 trteco.11.a: "Тост за наших друзей [From.GetAdjective]!" # A toast to our [From.GetAdjective] friends!

 trteco.12.t: "[From.GetNameDef] отказался!" # [From.GetNameDef] has Declined!
 trteco.12.d: "Похоже, что [From.GetAdjective] сочли целесообразным отказать нам в торговой сделке, тем самым лишив нас всякой видимости экономического сотрудничества между нашими двумя странами и фактически лишив нас любой экономической выгоды, которой мы могли бы воспользоваться. Это имеет далеко идущие последствия для будущих совместных предприятий [Root.GetAdjective]-[From.GetAdjective]." # It seems as though the [From.GetAdjective]s have seen fit to deny us a trade deal, thereby disallowing us any semblence of economic co-operation between our two countries and effectively robbing us of any sort of economic gain that we may have enjoyed. This has far reaching implications for future [Root.GetAdjective]-[From.GetAdjective] joint ventures.
 trteco.12.a: "Черт возьми!" # Dammit!

 trteco.13.t: "Торговать с [trt.GetNameDef]?" # Trade with [trt.GetNameDef]?
 trteco.13.d: "Совершив несколько неожиданный шаг, [trt.GetNameDef] обратился к нам с целью расширения экономических связей между нашими странами. На этот раз они ясно дали понять, что хотели бы заключить с нами торговую сделку, пытаясь обеспечить более свободное перемещение товаров между нашими странами, и заявили, что это принесет взаимную выгоду обеим нашим экономикам. Каков наш ответ?" # In a somewhat surprising move, [trt.GetNameDef] has approached us in order to further economic ties between our countries. This time, they've made it clear that they would like to pursue a trade deal with us in an attempt to allow for the freer movement of goods between our nations and have argued that this will mutually benefit both of our economies. What is our response?
 trteco.13.a: "Конечно!" # Sure!
 trteco.13.b: "Абсолютно нет." # Absolutely not.

 trteco.14.t: "[From.GetNameDef] принял!" # [From.GetNameDef] has Accepted!
 trteco.14.d: "[From.GetName] решил принять наше предложение о торговой сделке, что позволит нам начать более свободное перемещение товаров между нашими двумя странами, а также поставит нас в дипломатически выгодную ситуацию. Это имеет далеко идущие последствия, и все они хорошие, для будущих совместных предприятий [Root.GetAdjective]-[From.GetAdjective]." # [From.GetName] has decided to accept our offer a trade deal, thereby allowing us to begin the freer movement of goods between our two nations while also putting us in a diplomatically favourable situation. This has far reaching implications, all of them good, for future [Root.GetAdjective]-[From.GetAdjective] joint ventures.
 trteco.14.a: "Тост за наших друзей [From.GetAdjective]!" # A toast to our [From.GetAdjective] friends!

 trteco.15.t: "[From.GetNameDef] отказался!" # [From.GetNameDef] has Declined!
 trteco.15.d: "Похоже, что [From.GetAdjective] сочли целесообразным отказать нам в торговой сделке, тем самым лишив нас всякой видимости экономического сотрудничества между нашими двумя странами и фактически лишив нас любой экономической выгоды, которой мы могли бы воспользоваться. Это имеет далеко идущие последствия для будущих совместных предприятий [Root.GetAdjective]-[From.GetAdjective]." # It seems as though the [From.GetAdjective]s have seen fit to deny us a trade deal, thereby disallowing us any semblence of economic co-operation between our two countries and effectively robbing us of any sort of economic gain that we may have enjoyed. This has far reaching implications for future [Root.GetAdjective]-[From.GetAdjective] joint ventures.
 trteco.15.a: "Черт возьми!" # Dammit!

 trteco.16.t: "Выплата Османского долга" # Ottoman Debt Payment
 trteco.16.d: "Поскольку мы являемся страной-кредитором в Османском управлении государственного долга и обладаем инвестициями в османскую экономику наряду с владением османским долгом, мы также постоянно получали платежи от Османской империи, чтобы выполнить свои финансовые обязательства и вернуть нам то, что они должны. Интересно, что, похоже, османы сочли целесообразным увеличить ставку, по которой они нам платят, в попытке добиться экономической независимости." # As we are a creditor nation in the Ottoman Public Debt Administration, and possess investments within the Ottoman economy alongside owning Ottoman debt, we have also received continual payments by the Ottoman Empire in order to meet their financial obligations and pay us back what they owe. Interestingly enough, it seems as though the Ottomans have seen fit to increase the rate at which they pay us in an attempt to achieve economic independence.
 trteco.16.a: "Пока мы получаем наши деньги..." # So long as we receive our money...

 trtfor.1.t: "[trt.GetName] требует Трапизона!" # [trt.GetName] Demands Trapizon!
 trtfor.1.d: "Турки сделали несколько неожиданный шаг, потребовав, чтобы мы передали им Трапизон, иначе нас ждут ужасные последствия. Хотя если бы мы просто отдали землю, это отразилось бы на нас довольно плохо, война с [trt.GetNameDef] также не идеальна. Что нам делать?" # In a somewhat surprising move, the Turks have demanded that we hand over Trapizon to them or face dire consequences. While it would reflect rather poorly on us if we were to simply give up the land, going to war with [trt.GetNameDef] is also not ideal. What shall we do?
 trtfor.1.a: "Мы не можем надеяться противостоять им..." # We cannot hope to stand against them...
 trtfor.1.b: "Мы будем сражаться, чтобы защитить нашу землю!" # We will fight to defend our land!

 trtfor.2.t: "[From.GetName] Седес Трабзон" # [From.GetName] Cedes Trabzon
 trtfor.2.d: "Похоже, что [From.GetNameDef] сдался и решил уступить нашим требованиям. Вскоре земля будет полностью под нашим контролем: вражеские войска [From.GetAdjective] эвакуируются, а войска [Root.GetAdjective] движутся в этот район." # It seems as though [From.GetNameDef] has folded and decided to cave into our demands. The land shall be fully under our control soon, with the enemy [From.GetAdjective] troops evacuating and [Root.GetAdjective] troops moving into the area.
 trtfor.2.a: "Отличный." # Excellent.

 trtfor.3.t: "[From.GetName] отказывается от наших требований!" # [From.GetName] Refuses our Demands!
 trtfor.3.d: "Кажется, что [From.GetNameDef] пошёл против нашего желания и не предоставил нам законную территорию." # It seems as though [From.GetNameDef] has gone against our wishes and has not given us our rightful territory.
 trtfor.3.a: "Тогда мы возьмем его силой!" # Then we will take it by force!

 trtfor.4.t: "[trt.GetName] требует плебисцита в Карин" # [trt.GetName] Demands a Plebiscite in Karin
 trtfor.4.d: "Похоже, что [trt.GetAdjective] сочли целесообразным потребовать проведения плебисцита на нашей оспариваемой территории Карин. Хотя мы могли бы просто отказаться от проведения плебисцита, поскольку Карин является законной территорией Армении, это не вызвало бы симпатии у людей, живущих в этом районе, и особенно у [trt.GetAdjective]s. Что нам делать?" # It seems as though the [trt.GetAdjective]s have seen fit to demand a plebiscite in our contested territory of Karin. While we could simply refuse to hold the plebiscite, as Karin is rightful Armenian territory, it would not endear us to the people living in the area and especially not to the [trt.GetAdjective]s. What shall we do?
 trtfor.4.a: "Мы не допустим больше посягательств на нашу территориальную целостность!" # We will not allow any more infringements on our territorial integrity!
 trtfor.4.b: "Всё ради мира..." # Anything for peace...

 trtfor.5.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 trtfor.5.d: "Кажется, что [From.GetNameDef] пошёл против нашего желания и не предоставил нам законную территорию." # It seems as though [From.GetNameDef] has gone against our wishes and has not given us our rightful territory.
 trtfor.5.a: "Уничтожьте их!" # Destroy them!

 trtfor.6.t: "Результаты плебисцита – большинство [trt.GetAdjective]" # Plebiscite Results - [trt.GetAdjective] Majority
 trtfor.6.d: "К сожалению, похоже, что нелояльные предатели Карин показали свое истинное лицо и отказались оставаться в стране [Root.GetAdjective]. Это, безусловно, удар по нашей гордости и международному престижу..." # Unfortunately, it seems as though the disloyal traitors in Karin have shown their true colours and have refused to remain in the [Root.GetAdjective] nation. This is certainly a blow to our pride and international prestige...
 trtfor.6.a: "Взрыв!" # Blast!

 trtfor.7.t: "Результаты плебисцита – большинство [ARM.GetAdjective]" # Plebiscite Results - [ARM.GetAdjective] Majority
 trtfor.7.d: "К счастью, похоже, что верные люди Карин осознали, чему они на самом деле принадлежат, и сделали выбор воссоединиться с нацией [Root.GetAdjective]. Сегодня поистине славный день для [Root.GetNameDef]!" # Thankfully, it seems as though the loyal people of Karin have realized where they truly belonged and have made the choice to rejoin the [Root.GetAdjective] nation. Today is truly a glorious day for [Root.GetNameDef]!
 trtfor.7.a: "Наши преданные граждане оказали нам свою поддержку!" # Our loyal citizens have shown us their support!

 trtfor.8.t: "Результаты плебисцита – большинство [trt.GetAdjective]" # Plebiscite Results - [trt.GetAdjective] Majority
 trtfor.8.d: "К счастью, похоже, что преданные жители Эрзурума осознали, чему они на самом деле принадлежат, и сделали выбор воссоединиться с нацией [Root.GetAdjective]. Сегодня поистине славный день для [Root.GetNameDef]!" # Thankfully, it seems as though the loyal people of Erzurum have realized where they truly belonged and have made the choice to rejoin the [Root.GetAdjective] nation. Today is truly a glorious day for [Root.GetNameDef]!
 trtfor.8.a: "Добро пожаловать домой!" # Welcome home!

 trtfor.9.t: "Результаты плебисцита – большинство [ARM.GetAdjective]" # Plebiscite Results - [ARM.GetAdjective] Majority
 trtfor.9.d: "К сожалению, похоже, что нелояльные предатели в Эрзуруме показали свое истинное лицо и отказались мирно воссоединиться с нацией [Root.GetAdjective]. Кажется, перед нами осталось всего несколько вариантов..." # Unfortunately, it seems as though the disloyal traitors in Erzurum have shown their true colours and have refused to peacefully rejoin the [Root.GetAdjective] nation. It seems as though we only have a few options left before us...
 trtfor.9.a: "Мы не признаем этих результатов, на войну!" # We will not recognize these results, to war!
 trtfor.9.b: "Мы должны уважать волю жителей Эрзерума." # We must respect the will of those in Erzerum.

 trtfor.10.t: "[trt.GetName] требует Траллеса!" # [trt.GetName] Demands Tralles!
 trtfor.10.d: "Турки сделали несколько неожиданный шаг, потребовав, чтобы мы передали им Траллес, иначе нас ждут ужасные последствия. Хотя если бы мы просто отдали землю, это отразилось бы на нас довольно плохо, война с [trt.GetNameDef] также не идеальна. Что нам делать?" # In a somewhat surprising move, the Turks have demanded that we hand over Tralles to them or face dire consequences. While it would reflect rather poorly on us if we were to simply give up the land, going to war with [trt.GetNameDef] is also not ideal. What shall we do?
 trtfor.10.a: "Мы не уступим ни пяди своей земли!" # We will not cede an inch of our land!
 trtfor.10.b: "В настоящее время мы не можем спровоцировать войну с [trt.GetName]." # We cannot provoke war with [trt.GetName] at this time.

 trtfor.11.t: "[From.GetName] Отказывается!" # [From.GetName] Refuses!
 trtfor.11.d: "Кажется, что [From.GetNameDef] пошёл против нашего желания и не предоставил нам законную территорию. Что нам делать?" # It seems as though [From.GetNameDef] has gone against our wishes and has not given us our rightful territory. What shall we do?
 trtfor.11.a: "Тогда мы силой отнимем нашу законную землю!" # Then we shall take our rightful land by force!
 trtfor.11.b: "Мы должны дождаться своего часа..." # We must bide our time...

 trtfor.12.t: "[From.GetName] принимает" # [From.GetName] Accepts
 trtfor.12.d: "Похоже, что [From.GetNameDef] сдался и решил уступить нашим требованиям. Вскоре земля будет полностью под нашим контролем: вражеские войска [From.GetAdjective] эвакуируются, а войска [Root.GetAdjective] движутся в этот район." # It seems as though [From.GetNameDef] has folded and decided to cave into our demands. The land shall be fully under our control soon, with the enemy [From.GetAdjective] troops evacuating and [Root.GetAdjective] troops moving into the area.
 trtfor.12.a: "Мы снова воссоединились с нашими братьями!" # Reunited with our brothers once more!

 trtfor.13.t: "[trt.GetName] требует Памфилию" # [trt.GetName] Demands Panfilia
 trtfor.13.d: "Турки сделали несколько неожиданный шаг, потребовав, чтобы мы передали им Панфилию, иначе нас ждут ужасные последствия. Хотя если бы мы просто отдали землю, это отразилось бы на нас довольно плохо, война с [trt.GetNameDef] также не идеальна. Что нам делать?" # In a somewhat surprising move, the Turks have demanded that we hand over Panfilia to them or face dire consequences. While it would reflect rather poorly on us if we were to simply give up the land, going to war with [trt.GetNameDef] is also not ideal. What shall we do?
 trtfor.13.a: "Эта земля по праву наша!" # This land is rightfully ours!
 trtfor.13.b: "Отдайте им бесполезную землю." # Give them the worthless land.

 trtfor.14.t: "[From.GetName] Отказывается!" # [From.GetName] Refuses!
 trtfor.14.d: "Кажется, что [From.GetNameDef] пошёл против нашего желания и не предоставил нам законную территорию. Что нам делать?" # It seems as though [From.GetNameDef] has gone against our wishes and has not given us our rightful territory. What shall we do?
 trtfor.14.a: "На войну!" # To war!
 trtfor.14.b: "Сначала мы должны подготовиться..." # We must first prepare...

 trtfor.15.t: "[From.GetName] принимает" # [From.GetName] Accepts
 trtfor.15.d: "Похоже, что [From.GetNameDef] сдался и решил уступить нашим требованиям. Вскоре земля будет полностью под нашим контролем: вражеские войска [From.GetAdjective] эвакуируются, а войска [Root.GetAdjective] движутся в этот район." # It seems as though [From.GetNameDef] has folded and decided to cave into our demands. The land shall be fully under our control soon, with the enemy [From.GetAdjective] troops evacuating and [Root.GetAdjective] troops moving into the area.
 trtfor.15.a: "Наша нация скоро снова станет единой." # Our nation will soon be whole again.

 trtfor.16.t: "[trt.GetName] Петиции за Мелитену" # [trt.GetName] Petitions for Melitene
 trtfor.16.d: "Похоже, что турки сочли нужным подать нам прошение о том, что они называют законной землей [trt.GetAdjective] в [Root.GetName]. Хотя выполнение требований [trt.GetNameDef], безусловно, будет ударом по гордости нашего народа и нашему международному престижу, риск войны с [trt.GetNameDef] также не идеален. Что нам делать?" # It seems as though the Turks have seen fit to petition us for, what they call, the rightful [trt.GetAdjective] land in [Root.GetName]. While giving into the demands of [trt.GetNameDef] would certainly be a blow to the pride of our people and our international prestige, risking war with [trt.GetNameDef] is also not ideal. What shall we do?
 trtfor.16.a: "Эта земля по праву наша!" # This land is rightfully ours!
 trtfor.16.b: "Отдайте им бесполезную землю." # Give them the worthless land.

 trtfor.17.t: "[From.GetName] Отказывается!" # [From.GetName] Refuses!
 trtfor.17.d: "Кажется, что [From.GetNameDef] пошёл против нашего желания и не предоставил нам законную территорию. Что нам делать?" # It seems as though [From.GetNameDef] has gone against our wishes and has not given us our rightful territory. What shall we do?
 trtfor.17.a: "Тогда мы вернем себе нашу землю посредством войны!" # Then we shall retake our land through war!
 trtfor.17.b: "Эта земля нам пока не нужна..." # We do not need that land for now...

 trtfor.18.t: "[From.GetName] принимает" # [From.GetName] Accepts
 trtfor.18.d: "Похоже, что [From.GetNameDef] сдался и решил уступить нашим требованиям. Вскоре земля будет полностью под нашим контролем: вражеские войска [From.GetAdjective] эвакуируются, а войска [Root.GetAdjective] движутся в этот район." # It seems as though [From.GetNameDef] has folded and decided to cave into our demands. The land shall be fully under our control soon, with the enemy [From.GetAdjective] troops evacuating and [Root.GetAdjective] troops moving into the area.
 trtfor.18.a: "Даже Франция не желает войны с нами!" # Even France balks at the prospect of war with us!



 turnews.3.b: "Это просто турки маршируют на свой задний двор..." # It is simply the Turks marching into their own backyard...
