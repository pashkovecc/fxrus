 ### Parties
 BHU_vanguardist_party: "Национальный комитет Демократической партии" # DNC
 BHU_vanguardist_party_long: "Национальный конгресс Друк (Максимисты)\n§gКлуб благородных изгнанников, социалистов и индийских агентов, Национальный конгресс Друк представляет собой собрание неудачников. Конгресс, основанный в Калькутте после подавления радикальных лидеров Гевог, с момента своего создания сделал очень мало. Однако возвышение Субхаса Чандры Боса привело к увеличению индийских инвестиций в Национальный комитет Демократической партии, намеревающихся использовать эту группу диссидентов для дестабилизации Бутана. Фракция максимистов глубоко предана Бозе и отдает приоритет уничтожению реакционных элементов в стране и лояльности Коммуне.§!" # Druk National Congress (Maximists)\n§gA club of noble exiles, socialists, and Indian agents, the Druk National Congress is a collection of misfits. Founded in Calcutta following a crackdown against radical Gewog leaders, the Congress has done very little since its creation. However, the rise of Subhas Chandra Bose has brought about increased Indian investment into the DNC, intending to use this collection of dissidents to destabilise Bhutan. The Maximist faction is intensely devoted to Bose and prioritizes destruction of reactionary elements in the country and loyalty to the Commune.§!
 BHU_collectivist_party: "Национальный комитет Демократической партии" # DNC
 BHU_collectivist_party_long: "Национальный Конгресс Друк (Интернационалисты)\n§gКлуб благородных изгнанников, социалистов и индийских агентов, Национальный Конгресс Друк представляет собой собрание неудачников. Конгресс, основанный в Калькутте после подавления радикальных лидеров Гевог, с момента своего создания сделал очень мало. Однако возвышение Субхаса Чандры Боса привело к увеличению индийских инвестиций в Национальный комитет Демократической партии, намеревающихся использовать эту группу диссидентов для дестабилизации Бутана. Фракция интернационалистов состоит из тех членов, которые ездили во Францию ​​и Великобританию с просьбой о помощи. Они больше всего заинтересованы в соединении Бутана с внешним миром.§!" # Druk National Congress (Internationalists)\n§gA club of noble exiles, socialists, and Indian agents, the Druk National Congress is a collection of misfits. Founded in Calcutta following a crackdown against radical Gewog leaders, the Congress has done very little since its creation. However, the rise of Subhas Chandra Bose has brought about increased Indian investment into the DNC, intending to use this collection of dissidents to destabilise Bhutan. The Internationalist faction is made up of those members who travelled to France and Britain to petition for aid. They are most interested in connecting Bhutan with the outside world.§!
 BHU_libertarian_socialist_party: "Национальный комитет Демократической партии" # DNC
 BHU_libertarian_socialist_party_long: "Национальный конгресс Друк (революционеры)\n§gКлуб благородных изгнанников, социалистов и индийских агентов, Национальный конгресс Друк представляет собой собрание неудачников. Конгресс, основанный в Калькутте после подавления радикальных лидеров Гевог, с момента своего создания сделал очень мало. Однако возвышение Субхаса Чандры Боса привело к увеличению индийских инвестиций в Национальный комитет Демократической партии, намеревающихся использовать эту группу диссидентов для дестабилизации Бутана. Революционная фракция является самой сильной внутри партии и выступает за отмену крепостного права и создание новой социалистической республики в Гималаях.§!" # Druk National Congress (Revolutionaries)\n§gA club of noble exiles, socialists, and Indian agents, the Druk National Congress is a collection of misfits. Founded in Calcutta following a crackdown against radical Gewog leaders, the Congress has done very little since its creation. However, the rise of Subhas Chandra Bose has brought about increased Indian investment into the DNC, intending to use this collection of dissidents to destabilise Bhutan. The Revolutionary faction is the strongest within the party, and advocates for the end of serfdom and the creation of a new socialist republic in the Himalayas.§!
 BHU_social_democrat_party: "БСК" # BSC
 BHU_social_democrat_party_long: "Конгресс штата Бутан (демократы)\n§gОснованный горсткой интеллектуалов Лхотшампа, Конгресс штата Бутан представляет собой движение, пытающееся вызвать политическое пробуждение Лхотшампа в южных регионах Бутана. Они не добились большого успеха в своих усилиях: угнетенное непальское меньшинство по-прежнему скептически относится к этим политическим идеалистам, а правящие власти быстро искореняют инакомыслие.§!" # Bhutan State Congress (Democrats)\n§gFounded by a handful of Lhotshampa intellectuals, the Bhutan State Congress is a movement attempting to create a Lhotshampa political awakening in the southern regions of Bhutan. They have not found much success in their endeavours, with the oppressed Nepalese minority remaining sceptical of these political idealists, and the ruling authorities quick to stamp out dissent.§!
 BHU_social_liberal_party: "Джай Горкха" # Jai Gorkha
 BHU_social_liberal_party_long: "Джай Горкха\n§gОснованное в индийских штатах, граничащих с южным Бутаном, Джай Горкха представляет собой подпольное политическое движение, целью которого является создание нового государства для непальцев под названием Горкхаленд. Эта группа нашла многих в непальской общине Лхотшампа в Бутане, заинтересованных в этом проекте государственного строительства, и стала ведущим голосом этого угнетенного меньшинства.§!" # Jai Gorkha\n§gFounded in the Indian states bordering southern Bhutan, Jai Gorkha is an underground political movement that aims to create a new state for the Nepalese, called Gorkhaland. This group has found many in Bhutan's Nepalese Lhotshampa community who are interested in this state-building project, and it has become the leading voice for this oppressed minority.§!
 BHU_market_liberal_party: "Радикалы" # Radicals
 BHU_market_liberal_party_long: "Друк Гьялпо (Радикалы)\n§gРадикалы — это небольшая группа судебных чиновников, которые стремятся провести более демократические реформы в Бутане. Хотя в суде они разделяют цели реформистской фракции, они считают, что реформы, предлагаемые указанной фракцией, слишком ограничены и часто раздражают доминирующее положение Сонама Топгье Дорджи в этой фракции. При небольшой поддержке со стороны какой-либо из правящих держав в Бутане маловероятно, что они смогут действовать как нечто большее, чем просто активная оппозиция.§!" # Druk Gyalpo (Radicals)\n§gThe Radicals are a small group of court officials who are committed to bringing more democratic reform to Bhutan. While they share goals with the Reformist faction in court, they believe that the reforms offered by said faction are too limited and often chafe against Sonam Topgye Dorji's dominant position in that faction. With little support among any of the reigning powers in Bhutan, there is little chance that they will be able to act as anything more than a vocal opposition.§!
 BHU_social_conservative_party: "БСК" # BSC
 BHU_social_conservative_party_long: "Конгресс штата Бутан (Крестьянин)\n§gОснованный горсткой интеллектуалов Лхотшампа, Конгресс штата Бутан представляет собой движение, пытающееся вызвать политическое пробуждение Лхотшампа в южных регионах Бутана. Они не добились большого успеха в своих усилиях: угнетенное непальское меньшинство по-прежнему скептически относится к этим политическим идеалистам, а правящие власти быстро искореняют инакомыслие.§!" # Bhutan State Congress (Peasant)\n§gFounded by a handful of Lhotshampa intellectuals, the Bhutan State Congress is a movement attempting to create a Lhotshampa political awakening in the southern regions of Bhutan. They have not found much success in their endeavours, with the oppressed Nepalese minority remaining sceptical of these political idealists, and the ruling authorities quick to stamp out dissent.§!
 BHU_authoritarian_democrat_party: "реформаторы" # Reformers
 BHU_authoritarian_democrat_party_long: "Друк Гьялпо (Реформаторы)\n§gРеформисты — это группа дворян и придворных чиновников, которые выступают за серию реформ, направленных на модернизацию Королевства Бутан. Яростно преданные власти короля, они надеются передать часть полномочий от аристократии деревенским старейшинам Гевог, сохранив при этом власть центральной монархии. Их основа власти сосредоточена вокруг королевского министра Гонгзима Сонама Топгье Дорджи. Благодаря его влиянию они стали второй по силе фракцией в стране, а король постепенно стал придерживаться этого более реформаторского подхода к управлению.§!" # Druk Gyalpo (Reformers)\n§gThe Reformists are a collection of nobles and court officials who advocate for a series of reforms meant to modernise the Kingdom of Bhutan. While fiercely loyal to the power of the king, they hope to devolve some powers from the aristocracy to the Gewog village elders, while retaining the power of the central monarchy. Their base of power is centred around the king's Gongzim minister, Sonam Topgye Dorji. Through his influence, they have become the second most powerful faction in the country, with the king slowly subscribing to this more reform-minded approach to ruling.§!
 BHU_paternal_autocrat_party: "Традиционалисты" # Traditionalists
 BHU_paternal_autocrat_party_long: "Друк Гьялпо (Традиционалисты)\n§gТрадиционалисты — это обширная группа Пенлопов, мелких дворян, чиновников и военачальников, верных королю и преданных поддержанию статус-кво. Они поддерживают правящего Друк Гьялпо, но стремятся в первую очередь расширить власть Пенлопов за счет центральных властей. Традиционалисты категорически против реформ, предложенных Сонамом Топгье Дорджи и его кликой придворных лоялистов, рассматривая их как прямое оскорбление феодализма в Бутане.§!" # Druk Gyalpo (Traditionalists)\n§gThe Traditionalists are a broad collection of Penlops, minor nobles, officials and military leaders loyal to the King and devoted to the maintenance of the status quo. They are supportive of the reigning Druk Gyalpo but seek primarily to expand the power of the Penlops at the expense of the central authorities. The Traditionalists are strictly opposed to the reforms proposed by Sonam Topgye Dorji and his clique of court loyalists, seeing them as a direct affront to feudalism in Bhutan.§!
 BHU_national_populist_party: "Чжунг Дратшанг" # Zhung Dratshang
 BHU_national_populist_party_long: "Шунг Дратшанг\n§gШунг Дратшанг — это совет монахов со всей страны, объединенных целью продвижения монашеских интересов. Их возглавляют пять ученых мастеров Лопенов, каждый из которых является экспертом в своей теологической области, и их лидер Дже Кхенпо. Управляя страной во времена, предшествовавшие созданию центральной монархии, и даже в последующие годы, этот орган долгое время служил для консультирования правителей Бутана, способствуя стабильности и традиционному буддизму.§!" # Zhung Dratshang\n§gThe Zhung Dratshang is a council of monks from across the country, united in the goal of furthering monastic interests. They are led by the five learned masters, the Lopens, each an expert in a different theological field, and their leader the Je Khenpo. Having ruled over the country in the days before the central monarchy, even in the years following the body has long served to advise the rulers of Bhutan, promoting stability and traditional Buddhism.§!
 BHU_Jigme_Wangchuck: "Джигме Вангчук" # Jigme Wangchuck
