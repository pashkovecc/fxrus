##### Ideas #####
 KMT_american_support: "Американская поддержка" # American Support
 KMT_american_support_desc: "Со времени нашей революции наша страна поддерживала хорошие связи с Соединенными Штатами; предоставляя нам столь необходимую помощь и советчиков." # Since our revolution, our country has maintained great ties with the United States; providing us with much needed aid and advisors.
 KMT_growing_economy: "Растущая экономика" # Growing Economy
 KMT_factionism: "Группа разрыва" # Fracturing Party
 KMT_factionism_desc: "Гоминьдан долгое время считался партией «большой палатки», члены которой придерживаются самых разных идеологий, от крайне правых до крайне левых, но, тем не менее, претендуют на интеллектуальное, философское и революционное наследие покойного доктора Сунь Ятсена. Межфракционная борьба между партией разорвала Гоминдан по швам, и единство должно быть создано как можно скорее, прежде чем партия развалится сама на себя." # The Kuomintang has long been regarded as a \"big tent\" party in which members of the Party subscribe to a wide berth of ideologies ranging from the far-right to the far-left but nonetheless claiming the intellectual, philosophical, and revolutionary heritage of the late Dr. Sun Yat-sen. The inter-factional struggle between the Party has torn the Kuomintang to its seams and unity must be created soon before the Party collapses on itself.
 KMT_general_staff_idea: "Генеральный штаб" # General Staff
 KMT_the_republican_army: "Республиканская армия" # The Republican Army
 KMT_dedicated_weapons_factories: "Специализированные оружейные заводы" # Dedicated Weapons Factories
 KMT_socialist_opposition1: "Социалистическая оппозиция" # Socialist Opposition
 KMT_socialist_opposition1_desc: "Страна была взволнована после недавних драматических событий. Претензии Гоминьдана на лидерство теперь снова под вопросом, поскольку общественное возмущение охватило улицы. Порядок необходимо восстановить быстро и поспешно, прежде чем протесты перерастут в беспорядки, а беспорядки — в восстание." # The country has been riled up since the nation's recent dramatic events. The Kuomintang's claim to leadership is now once more within question as public outrage consumes the streets. Order must be restored quickly and with haste, before the protests turn into riots and riots into rebellion.
 KMT_socialist_opposition2: "Социалистическая оппозиция" # Socialist Opposition
 KMT_socialist_opposition2_desc: "Страна была взволнована после недавних драматических событий. Претензии Гоминьдана на лидерство теперь снова под вопросом, поскольку общественное возмущение охватило улицы. Порядок необходимо восстановить быстро и поспешно, прежде чем протесты перерастут в беспорядки, а беспорядки — в восстание." # The country has been riled up since the nation's recent dramatic events. The Kuomintang's claim to leadership is now once more within question as public outrage consumes the streets. Order must be restored quickly and with haste, before the protests turn into riots and riots into rebellion.
 KMT_union_cooperation: "Союзное сотрудничество" # Union Cooperation
 KMT_bsb_cooperation: "Сотрудничество БСБ" # BSB Cooperation
 KMT_militarism: "Милитаристская демократия" # Militarist Democracy
 KMT_the_republic: "Китайская Республика" # A Chinese Republic
 KMT_food_sufficiency: "Достаточность продовольствия" # Food Sufficiency
 KMT_fiscal_reforms: "Фискальные реформы" # Fiscal Reforms
 KMT_working_women: "Работающие женщины" # Working Women
 KMT_whampoa_academy: "Академия Вампоа" # Whampoa Academy
 KMT_sun_legacy: "Наследие Отца" # The Father's Legacy
 KMT_three_principles: "Три принципа" # Three Principles

### Decisions
 KMT_unite_china: "Провозгласить объединение Китая" # Proclaim the Chinese Unification
 KMT_nanning_guilin_railway: "Построить железную дорогу Наньнин-Гуйлинь" # Build the Nanning-Guilin Railway
 KMT_nanning_guilin_railway_desc: "Гуанси, отчасти из-за пересеченной местности, отчасти из-за относительной изоляции, плохо связан с остальной частью страны. Чтобы лучше интегрировать родственную провинцию Гуандун и предотвратить возвращение бандитизма и коррупции, будет построена железная дорога, соединяющая Гуйлинь и Наньнин." # Guangxi, partly due to its rough terrain and partly due to its relative isolation, is poorly connected with the rest of the country. In order to better integrate Guangdong's sister province and prevent the return of banditry and corruption, a railway connecting Guilin and Nanning will be built.
 KMT_guilin_changsha_railway: "Построить железную дорогу Гуйлинь-Чанша" # Build the Guilin-Changsha Railway
 KMT_guilin_changsha_railway_desc: "Линия Гуйлинь-Чанша — важнейшая железная дорога на юге, соединяющая экономическую столицу юга с далеким Пекином. Расширение линии между Гуйлинем и Чаншей поможет улучшить связь с нашими друзьями в провинции Хунань и позволит нам двигаться на север и поддерживать важные связи снабжения с любыми операциями за пределами юга." # The Guilin-Changsha Line is the most important railway in the south, connecting the economic capital of the south with the distant Beijing. Expanding the line between Guilin and Changsha will help better connect with our friends in Hunan and allow us to move north and maintain important supply links with any operations outside of the south.
 KMT_nanchang_hangzhou_railway: "Построить железную дорогу Наньчан-Ханчжоу." # Build the Nanchang-Hangzhou Railway
 KMT_xiamen_nanchang_railway: "Построить железную дорогу Сямэнь-Наньчан" # Build the Xiamen-Nanchang Railway

##### Focus #####
 KMT_address_the_nation: "Обращение к нации" # Address the Nation
 KMT_address_the_nation_desc: "Запланировано специальное заседание гоминьдановского кабинета, и ожидается, что собравшиеся политики представят на стол множество реформ - реформ, которые, вероятно, призваны дать им больше власти и, возможно, даже открыть позиции в совете для тех, кто не принадлежит к аристократии. Это смелый план, хотя некоторые опасаются, согласится ли с ним Чанг." # A special session of the Kuomintang Cabinet has been planned, and it is expected that the gathered politicians will present a plethora of reforms to the table - reforms that are likely intended to put more power in their hands, and perhaps even open up positions on the council to those outside the aristocracy. It is a bold plan, though some are nervous as to whether the Chiang will agree.
 KMT_assume_complete_control: "Возьмите на себя полный контроль" # Assume Complete Control
 KMT_assume_complete_control_desc: "В самый мрачный час Национальной революции именно генералиссимус и его руководство партией сумели спасти партию и нацию от разрушения со стороны антиреволюционеров. Спасение для Китая сегодня может быть достигнуто только через самоотверженную организацию и подчинение Линсю, доверие политике Генералиссимуса и выполнение его приказов. Когда у нас один разум, мы становимся одним телом... другого пути нет." # In the National Revolution's darkest hour, it was the Generalissimo and his leadership of the Party that managed to save the party and the nation from destruction from anti-revolutionaries. Salvation for China today can be attained only through selflessly organising and obeying the lingxiu, trusting the policies of the Generalissimo, and implementing his orders. When we are of one mind, we become one body... there is no other way.
 KMT_imprison_the_opposition: "Заключить в тюрьму оппозицию" # Imprison the Opposition
 KMT_imprison_the_opposition_desc: "Как и ожидалось, многие представители политической элиты возмущаются нашей недавней политикой. Наши самые ярые оппоненты, даже те, чью работу мы когда-то обещали защитить, должны быть заключены в тюрьму." # As was expected, many among the political elite resent our recent policies. Our most vocal opponents, even those whose work we once promised to secure, should be imprisoned.
 KMT_restructure_the_government: "Реструктуризация правительства" # Restructure the Government
 KMT_restructure_the_government_desc: "Хотя покойный основатель нашей партии доктор Сунь предполагал, что наступит необходимая стадия партийного государства и опеки, мы должны предпринять усилия, чтобы узаконить наш контроль над бывшей Лигой. Пока страна не воссоединится, нам придется отложить разработку конституции. Тем не менее, вместо конституции должен быть принят органический закон, который положит начало возвращению формального исполнительного юаня." # While our party's late founder Dr. Sun envisioned that there would be a necessary stage of the party-state and tutelage, we must undertake efforts to legitimise our control of the former League. Until the country is reunified, we will have to hold off on drafting a constitution. Nonetheless, an organic law shall be passed to govern in a constitution's stead, ushering in the return of a formal Executive Yuan.
 KMT_purge_socialist_elements: "Чистка социалистических элементов" # Purge Socialist Elements
 KMT_purge_socialist_elements_desc: "Многие политики-социалисты старого порядка до сих пор свободно ходят по улицам Нанкина и выступают против нашего правления. С ними нельзя мириться, и их необходимо немедленно устранить." # Many of the socialist politicians of the old order still walk the streets of Nanjing free and oppose our rule. They cannot be tolerated and must be removed at once.
 KMT_control_the_unions: "Контролируйте профсоюзы" # Control the Unions
 KMT_control_the_unions_desc: "Чтобы помочь стабилизировать нацию, а также удовлетворить потребности экономики и государства, мы начнем устанавливать контроль над профсоюзами в Нанкине. Мы позаботимся о том, чтобы различные профсоюзные боссы и лидеры работали рука об руку с нашими потребностями. Эти дегенераты сослужат нам добрую службу." # In order to help stabilise the nation as well as suit the needs of the economy and state, we shall begin to assert control over the Unions in Nanjing. We shall make sure that the various union bosses and leaders work hand in hand with our needs. These degenerates shall serve us well.
 KMT_authorize_special_services: "Бюро «Спецслужбы»" # The \"Special Services\" Bureau
 KMT_authorize_special_services_desc: "Революции часто представляют собой танец между мечтами и кошмарами. За всеми благородными убеждениями, которых придерживается партия, часто скрывается потребность в «специальных службах» для «решения» проблем, возникающих в ходе трансформации Китая. Как бы это ни было мрачно, мы должны сделать то, что необходимо для победы – даже если для этого придется зажать нос и закрыть глаза. Некоторые сражения приходится вести в темноте." # Revolutions are often a dance between dreams and nightmares. Beneath all the high-minded convictions the party holds, there is often a need for \"special services\" to \"handle\" challenges that crop up over the course of China's transformation. Grim though it may be, we must do what is necessary to win - even if it means holding our nose and closing our eyes. Some battles must be fought in the dark.
 KMT_authorize_special_services_tt: "Будет создан правительственный орган §YZhongTeJu§! во главе с Дай Ли.\n" # The Government's §YZhongTeJu§! headed by Dai Li will be created.\n
 KMT_maintain_democratic_legitimacy: "Поддерживать демократическую легитимность" # Maintain Democratic Legitimacy
 KMT_maintain_democratic_legitimacy_desc: "Хотя парламентская демократия, безусловно, порочна и порождает фракционность (что, в свою очередь, приводит к непроизводительности и застою государства), мы должны искренне стремиться реализовать «Три принципа народа» доктора Суня и его призывы к жизни, свободе и равенству. Однако эти качества демократии не могут быть полностью достигнуты до тех пор, пока не будет разрешена нынешняя чрезвычайная ситуация. Приостановленному Законодательному Юаню будет разрешено вновь собраться, но под бдительным наблюдением, пока мы «совершенствуем» видение Суня." # While parliamentary democracy is certainly vile and creates factionalism (which in turn leads to unproductivity and a stagnant state), we should truly strive to realise Dr. Sun's Three Principles of the People and his calls for life, liberty, and equality. However, these qualities of democracy cannot be totally achieved until the on-going emergency is resolved. The suspended Legislative Yuan will be allowed to reconvene but under vigilant watch as we \"perfect\" Sun's vision.
 KMT_government_reforms: "Правительственные реформы" # Government Reforms
 KMT_government_reforms_desc: "Поскольку будущее нации защищено, завтрашний день светлее, чем когда-либо. Теперь мы должны начать планировать это..." # With the future of the nation safeguarded, tomorrow is brighter than ever. Now we must begin to plan for it...
 KMT_cooperate_with_the_socialists: "Сотрудничать с социалистами" # Cooperate with the Socialists
 KMT_cooperate_with_the_socialists_desc: "Хотя мы можем не разделять многие взгляды профсоюзов, мы не можем отрицать влияние, которое они оказывают на наше общество. Нам необходимо установить хорошие отношения с профсоюзами, чтобы сотрудничать с ними и, как следствие, способствовать осуществлению наших реформ." # While we may not share many of the trade unions' views, we cannot deny the influence they have on our society. We need to establish good relations with the trade unions in order to cooperate with them and, by extension, facilitate the implementation of our reforms.
 KMT_the_three_principles_of_the_people: "Три принципа народа" # The Three Principles of the People
 KMT_the_three_principles_of_the_people_desc: "Гоминьдан, как часть Национальной революции, отдает приоритет массовому движению, поскольку рассматривает массы как основной революционный авангард и что революцию для китайского народа должен возглавлять народ. Чтобы побудить массы бороться за революцию и реализовать «Три народных принципа» доктора Суня, давайте обратимся к массам и будем работать над краткосрочными проектами, такими как кампании по снижению арендной платы в регионах, которые мы завоевали." # The Kuomintang, as part of the National Revolution, prioritises the Mass Movement as it sees the masses as the fundamental revolutionary vanguard and that the revolution for the Chinese people must be led by the people. In order to encourage the masses to fight for the revolution and to realise Dr. Sun's Three Principles' of the People, let us reach out to the masses and work on short-term projects such as rent-reduction campaigns in regions that we have conquered
 KMT_sun_yat_sen_legacy: "Наследие Отца" # The Father's Legacy
 KMT_sun_yat_sen_legacy_desc: "Доктор Сунь Ятсен призывал к революции для всех людей, Цюаньминь Гэмин, и что Национальная революция была для всех людей в Китае, а не только для крестьян и рабочих. Наша партия уже давно разделена мелкой внутренней фракционностью, но с помощью руководства генерала Чанга мы стремимся не к реорганизации, а, скорее, к реконструкции партии. Вперед, мы идем к яркому новому Белому рассвету демократии и гражданских прав – давайте, наконец, реализуем мечту дорогого покойного лидера и постараемся вдохновить остальной Восток последовать нашему примеру." # Dr. Sun Yat-sen called for a revolution for all people, quanmin geming - and that the National Revolution was for all people in China not just the peasants and workers. Long has our party been separated by petty internal factionalism but with the help of General Chiang's leadership, it is not a Reorganisation but rather a Reconstruction of the Party that we seek. Forward, we march towards a bright new White dawn of democracy and civil rights - let us finally realise the dream of dear late leader, and seek to inspire the rest of the East to follow our example.
 KMT_militaristic_state: "Милитаристское государство" # Militaristic State
 KMT_militaristic_state_desc: ""
 KMT_loyal_to_the_republic: "Верный Республике" # Loyal to the Republic
 KMT_loyal_to_the_republic_desc: ""

### Industry
 KMT_loan_from_hsbc: "Кредит от HSBC" # A Loan from HSBC
 KMT_loan_from_hsbc_desc: "Гонконгская Шанхайская банковская корпорация является одним из крупнейших банков в Азии и крупным эмитентом валюты. Кредит от них поможет нам в развитии нашей промышленности, стимулируя экономику в долгосрочной перспективе." # The Hong-Kong Shanghai Banking Corporation is one of the largest banks in Asia and a major issuer of currency, a loan from them would help us in developing our industry, boosting the economy in the long run.
 KMT_agricultural_reforms: "Сельскохозяйственные реформы" # Agricultural Reforms
 KMT_agricultural_reforms_desc: "Сельские районы на сегодняшний день являются наиболее пренебрегаемыми правительством и могут легко послужить отправной точкой для радикального экономического улучшения. Наши методы ведения сельского хозяйства прискорбно устарели по сравнению с сельскохозяйственными революциями, происходящими в Азии, а наша инфраструктура катастрофически отстает." # The rural areas are by far the most neglected by the government to date, and could easily serve as a starting point for radical economic improvement. Our farming methods are woefully out of date compared to the agricultural revolutions taking place in Asia, and our infrastructure is woefully behind.
 KMT_farm_mechanization_programs: "Программы механизации ферм" # Farm Mechanization Programs
 KMT_farm_mechanization_programs_desc: "Нет сомнений в том, что сельское хозяйство является одним из крупнейших в нашей стране. Однако используемые в настоящее время сельскохозяйственные технологии оставляют желать лучшего. Приняв достижения в области механизации, наблюдаемые в Соединенных Штатах и ​​Европе, мы можем ускорить работу наших ферм. Фермы кормят людей и, следовательно, являются источником жизненной силы роста." # There's no doubt that the farming industry is one of the biggest in our nation. The current agricultural techniques used however leave a lot to be desired. Through adopting the sort of advances in mechanisation seen in the United States and in Europe, we can bring our farms up to speed. Farms feed the people, and therefore they are the lifeblood of growth.
 KMT_urbanize_guangzhou: "Урбанизация Гуанчжоу" # Urbanize Guangzhou
 KMT_urbanize_guangzhou_desc: "Еще, еще и еще. Наша провинция стонет от усталости наших крупных вооруженных сил, но для того, чтобы выполнить наше производство вооружений и выполнить квоты, мы должны заставить нашу промышленность расти еще больше. Мы должны активизировать усилия по строительству наших железных дорог, нашей гражданской и военной промышленности, если мы хотим полностью раскрыть потенциал Лянгуана." # More, more, and more. Our province groans under the weariness of our large military but in order to fulfil our arms production and quotas, we must challenge our industry to grow even more. We must ramp up construction efforts on our railways, on our civilian industries, and on our military industries if we are to develop Liangguang to her full potential.
 KMT_renovate_the_rural_areas: "Ремонт сельской местности" # Renovate the Rural Areas
 KMT_renovate_the_rural_areas_desc: "Сельские районы нуждаются в серьезном ремонте и обслуживании. В настоящее время нет государственного органа, которому было бы поручено проводить этот ремонт, в результате чего сельские общины вынуждены полагаться на заведомо ненадежный частный бизнес. Передача этого в руки правительства позволит поддерживать наши дороги в хорошем состоянии. Национальная бригада технического обслуживания также, несомненно, будет иметь преимущества, если страна окажется в состоянии войны." # The rural areas are in need of considerable renovations and maintenance. There is currently no public body tasked with doing these repairs, leaving rural communities to rely on notoriously unreliable private businesses. Putting this into government hands will keep our roads well maintained in good repair. A national maintenance team will also no doubt have benefits should the nation be at war.
 KMT_the_university_of_nanjing: "Университет Нанкина" # The University of Nanjing
 KMT_the_university_of_nanjing_desc: "Основанный в 1902 году Нанкинский университет является одним из старейших и престижнейших высших учебных заведений Китая." # Founded in 1902, Nanjing University is one of the oldest and most prestigious institutions of higher learning in China.
 KMT_new_construction_methods: "Новые методы строительства" # New Construction Methods
 KMT_new_construction_methods_desc: "Наши контакты в Гонконге обеспечили нам поставку современных деталей машин, которые мы можем использовать для обновления наших имеющихся запасов. Это будет стоить нам дорого, но поможет нам быстрее восстановить наши силы по сравнению с нашими соперниками." # Our contacts in Hong Kong have secured us a shipment of modern machine parts that we can use to upgrade our current stock. This will cost us, but would help us quickly rebuild our forces compared to our rivals.
 KMT_expand_the_railroads: "Расширить железные дороги" # Expand the Railroads
 KMT_expand_the_railroads_desc: "Китайские рабочие долгое время были вынуждены трудиться, потеть и истекать кровью ради темных и дымящихся шахт и железных дорог империалистических колонизаторов, которые эксплуатировали ресурсы и богатство Китая в своих целях. После успеха Национальной революции в Восточном Китае мы будем стремиться захватить все иностранные железнодорожные отрасли и пути, чтобы использовать их силу для китайской нации." # Long has the Chinese worker been forced to toil, sweat, and bleed for the dark and steaming mines and railways of the imperialist colonisers who have exploited China's resources and wealth for their own. With the success of the National Revolution in Eastern China, we shall seek to take over all foreign railway industries and tracks in order to utilise their strength for the Chinese nation.
 KMT_infrastructure_projects: "Инфраструктурные проекты" # Infrastructure Projects
 KMT_infrastructure_projects_desc: "Наша страна охватывает обширные территории открытой земли, и пересечение их является наиболее важной частью стимулирования экономического роста. Недавняя комиссия обещает, что финансируемая государством программа по обеспечению занятости каждого китайца в строительстве новой инфраструктуры может продлиться десятилетия, если не больше." # Our nation encompasses vast swaths of open land and crossing them is the most important part of encouraging economic growth. A recent commission promises that a state-funded programme to ensure every Chinese is employed in the construction of new infrastructure could last us for decades, if not more.
 KMT_new_highways: "Новые шоссе" # New Highways
 KMT_new_highways_desc: "Наша страна охватывает обширные территории открытой земли, и пересечение их является наиболее важной частью стимулирования экономического роста. Недавняя комиссия обещает, что финансируемая государством программа по обеспечению занятости каждого китайца в строительстве новой инфраструктуры может продлиться десятилетия, если не больше." # Our nation encompasses vast swaths of open land and crossing them is the most important part of encouraging economic growth. A recent commission promises that a state-funded programme to ensure every Chinese is employed in the construction of new infrastructure could last us for decades, if not more.
 KMT_expand_guangdong_arsenal: "Расширить Гуандунский арсенал" # Expand Guangdong Arsenal
 KMT_expand_guangdong_arsenal_desc: "Гуандунский арсенал — один из крупнейших китайских арсеналов. Теперь, когда он снова в наших руках, мы должны расширить его, чтобы увеличить нашу промышленную рабочую силу и, конечно же, наши возможности военного производства, чтобы дать нам дополнительное преимущество перед нашими врагами." # The Guangdong Arsenal is one of the major Chinese arsenals. Now that it is back in our hands, we should expand it in order to enlarge our industrial workforce and, of course, our military production capabilities to give us an extra edge versus our enemies.
 KMT_industrial_silk: "Промышленный шелк" # Industrial Silk
 KMT_industrial_silk_desc: "Индустриализация привела к значительному улучшению как качества, так и количества текстильной промышленности, однако плоды этих разработок еще не получили широкого распространения на наших фабриках и мастерских. Пришло время начать широкомасштабное внедрение технологий промышленного производства шелка." # Industrialisation has seen massive improvements both for the quality and quantity of the textile industry, yet the fruits of these developments have yet to see widespread adoption in our factories and workshops. It's high time that we started to adopt industrial silk production techniques on a large scale.
 KMT_subsidize_new_industries: "Субсидировать новые отрасли" # Subsidize New Industries
 KMT_subsidize_new_industries_desc: "В отличие от других крупных группировок Китая, регион Гуандун остается весьма прибыльным благодаря внешней торговле и близости к морю и Гонконгу. Однако богатые жители этой провинции не желают делиться с нами своим богатством и не желают сотрудничать с нашим режимом. Поэтому давайте приложим усилия, чтобы захватить их собственность и богатство, чтобы они могли служить нашим армиям." # Unlike the other major cliques in China, the region of Guangdong remains quite profitable as a result of foreign trade and its proximity to the sea and to Hong Kong. The rich of this province however are unwilling to share their wealth with us nor are they willing to cooperate with our regime. As such, let us take efforts to seize their property and wealth so that they may serve our armies.
 KMT_shanghai_docks: "Шанхайские доки" # Shanghai Docks
 KMT_shanghai_docks_desc: "Мы, наконец, в состоянии расширить наши возможности судостроения далеко за пределы того, что было раньше." # We are finally in a position to expand our shipbuilding capabilities far beyond where they once were.
 KMT_jiangxi_armament_factories: "Цзянсийские оружейные заводы" # Jiangxi Armament Factories
 KMT_jiangxi_armament_factories_desc: "Мы не можем полагаться исключительно на частную промышленность в снабжении наших армий – нам необходимо построить собственные заводы по производству вооружений, если Китай хочет стать настоящей военной державой." # We cannot rely solely on private industry to supply our armies - we need to build armament factories of our own if China is to become a true military power.
 KMT_guangzhou_ports: "Порты Гуанчжоу" # Guangzhou Ports
 KMT_guangzhou_ports_desc: "Мы, наконец, в состоянии расширить наши возможности судостроения далеко за пределы того, что было раньше." # We are finally in a position to expand our shipbuilding capabilities far beyond where they once were.
 KMT_renovate_the_second_arsenal: "Реконструировать Второй Арсенал" # Renovate the Second Arsenal
 KMT_renovate_the_second_arsenal_desc: "Артиллерийский завод Пайджанг, также известный как Второй арсенал Гуандуна, был построен в 1933 году при помощи некоторых контролирующих британских инвестиций. С помощью правительства его можно расширить и гарантировать, что он останется вне британских рук." # The Paijang Artillery Factory, also known as the Second Guangdong Arsenal, was built in 1933 with help from some oversees British investments. With government help, it can be expanded and ensure it remains out of British hands.
 KMT_modern_economic_planning: "Современное экономическое планирование" # Modern Economic Planning
 KMT_modern_economic_planning_desc: "Наше время ограничено, если мы хотим действительно объединить страну или сохранить наш суверенитет. Наши инженеры и инвесторы предложили радикальный трехлетний план по быстрой модернизации нашей экономики, если мы хотя бы осмелимся мечтать о национальном объединении под нашим флагом." # Our time is limited if we are to indeed unite the country or maintain our sovereignity Our engineers and investors have proposed a radical three year plan to quickly modernise our economy if we even dare dream of national unification under our flag.
 KMT_nanning_mining_industries: "Горнодобывающие работы в Наньнине" # Mining Operations in Nanning
 KMT_nanning_mining_industries_desc: "Экономический потенциал региона Наньнин долгое время оставался без внимания. Благодаря новым технологиям добычи полезных ископаемых и стабильному правительству, стремящемуся к инвестициям, мы можем исправить эту ситуацию и расширить операции по добыче железа." # The region of Nanning's economic potential has long been neglected. With new mining technologies and a stable government with a drive for investment, we can rectify this and expand iron mining operations.
 KMT_hire_foreign_advisors: "Нанимайте иностранных консультантов" # Hire Foreign Advisors
 KMT_hire_foreign_advisors_desc: "По мере того, как мы продвигаем наши промышленные и военные программы, недостаток ноу-хау начинает становиться проблемой, и мы отчаянно нуждаемся в иностранных мужчинах, чтобы помочь Китаю встать на ноги после таких разрушительных столетий." # As we advance our industrial and military programmes, the lack of know-how begins to become and issue, and we desperately require foreign men to help China back to its feet after such devastating centuries.
 KMT_tax_reforms: "Налоговые реформы" # Tax Reforms
 KMT_tax_reforms_desc: "В рамках модернизации экономики нашего королевства финансы провинций должны быть полностью пересмотрены. Экспертов из Гуандуна придется пригласить в страну, чтобы вернуть экономику на круги своя: от пресечения контрабанды опиума до диверсификации экономической деятельности." # As part of modernising the economy of our realm, the provincial finances must be completely overhauled. Experts from Guangdong will have to be brought it to bring the economy back to scratch, from suppressing opium smuggling to diversifying its economic activities.
 KMT_synthetic_fuel_project: "Проект синтетического топлива" # Synthetic Fuel Project
 KMT_synthetic_fuel_project_desc: "Хотя наш народ трудолюбив и наш остров созрел для индустриализации, нельзя объяснить досадную нехватку доступных нам природных ресурсов по сравнению с крупнейшими державами мира. Особенно проблематичны нефть и каучук, поэтому, если мы хотим использовать эти ресурсы в нашей промышленности, Китай должен разработать программу функциональной синтетики." # Although our people are industrious and our island ripe for industrialisation, there is no accounting for the unfortunate lack of natural resources available to us relative to the major powers of the world. Oil and rubber are particularly problematic, so if we would like to make use of these resources in our industries, China must develop a functional synthetics programme.
 KMT_women_in_the_workforce: "Женщины в рабочей силе" # Women in the Workforce
 KMT_women_in_the_workforce_desc: "В прошлом Китай был преимущественно консервативной страной. Однако китайский республиканизм и националистические движения начали влиять на общественное мнение, и растет требование эмансипации женщин из дома и предоставления им большей независимости, что создает больше трудоспособных рабочих и стимулирует нашу экономику." # China has in the past been a principally conservative nation. Chinese republicanism and nationalist movements have begun to influence opinions however, and there is a growing demand for women to be emancipated from the home and granted more independence, creating more employable workers and boosting our economy.
 KMT_the_growing_economy: "Растущая экономика" # The Growing Ecomony
 KMT_the_growing_economy_desc: "Китай больше не может продолжать зависеть от ужасной торговли опиумом. Это пристрастие не только многих китайцев, но и администрации провинции, стремящейся финансировать свою деятельность. Хотя модернизация экономики будет дорогостоящим предприятием, она необходима в долгосрочной перспективе, иначе люди останутся нищими и полными пороков." # China cannot continue to depend on the awful opium trade any longer. It is not only an addiction for many Chinese, but also for the provincial administration in order to fund its operations. While modernising the economy will be an expensive venture, it is a necessary one in the long-term or else the people will remain destitute and full of vice.
 KMT_utilize_local_talent: "Используйте местные таланты" # Utilize Local Talent
 KMT_utilize_local_talent_desc: "Каждое из наших государств обладает талантами и особенностями, уникальными для его географии, культуры и военной истории. Вместо того, чтобы пытаться искоренить эти преимущества, мы должны не просто сохранить их, но и воспользоваться ими и специализировать эти местные силы для достижения более высоких целей." # Each of our states has talents and specialities unique to their geography, culture and military history. Rather than try to stamp out these advantages, we should not just retain, but seize upon them and specialise those local forces for greater objectives.
# Chinese Air Force
 KMT_reforming_the_kuomintang_forces: "Реформирование сил Гоминьдана" # Reforming the Kuomintang Forces
 KMT_reforming_the_kuomintang_forces_desc: "После окончания Северной кампании вооруженные силы Гоминьдана впали в стагнацию и пострадали от сокращения численности, поскольку Япония и Фэнтянь казались менее угрожающими. Поскольку международная напряженность растет, необходимо активизировать вооруженные силы." # Since the end of the Northern Campaign, the Kuomintang military has fallen into stagnation, and suffered from downsizing as Japan and Fengtian appeared less threatening. As international tensions are growing, the military must be revitalised.
 KMT_the_chinese_air_force: "Суверенитет в голубом небе" # Sovereignity in the Blue Skies
 KMT_the_chinese_air_force_desc: "В то время как первоначальные воздушные операции начались с пекинского аэродрома Наньюань времен династии Цин, ВВС Китайской Республики Гоминьдана обязаны своим происхождением Бюро аэронавтики доктора Сунь Ятсена при военном правительстве Гуанчжоу. Поскольку наша промышленная и военная мощь сильнее, чем когда-либо прежде, перед нами теперь стоит задача продолжить усилия доктора Суня и создать по-настоящему мощные и современные военно-воздушные силы для китайского народа." # While initial air operations began with the Qing Dynasty's Beijing Nanyuan airfield - the Kuomintang's Republic of China Air Force owes its origins to Dr. Sun Yat-sen's Bureau of Aeronautics under the Guangzhou Military Government. With our industrial and military strength stronger than ever before, the task is now thrust upon us to continue Dr. Sun's efforts and to create a truly powerful and modern air force for the Chinese people.
 KMT_fighter_modernization: "Модернизация истребителя" # Fighter Modernization
 KMT_fighter_modernization_desc: "Создав собственную авиационную промышленность, давайте продолжим производство собственных отечественных истребителей типа Чу (АФАМФ) ХР-0. Этот моноплан сможет выполнять двойную функцию в качестве истребителя и пикирующего бомбардировщика в небе." # With the creation of our own native air industries, let us pursue the production of our own domestic fighters such as the Chu (AFAMF) XP-0. This monoplane will be able to serve dual purposes as both a fighter and a dive bomber in the skies.
 KMT_bomber_modernization: "Модернизация бомбардировщика" # Bomber Modernization
 KMT_bomber_modernization_desc: "Как показали нам конфликты по всему миру, современные войны также выигрываются за счет интенсивных бомбардировок промышленных комплексов и военной техники противника. Давайте призовем наших пилотов и авиаконструкторов изучить конструкции европейских бомбардировщиков, чтобы мы могли принять аналогичную воздушную доктрину, ориентированную на огневую мощь сверху." # As the conflicts around the world showed us, modern wars are also won by intense bombing campaigns to target enemy industrial complexes and military apparatuses. Let us encourage our pilots and air designers to study European bomber designs so that we can adopt a similar air doctrine focused on firepower from above.
 KMT_aerial_theories: "Воздушные теории" # Aerial Theories
 KMT_aerial_theories_desc: "Важнейшим фактором увеличения силы, который все больше совершенствуется в Европе, является развитие современных воздушных вооружений. Первоначально использовавшаяся в качестве средства разведки, за последние несколько десятилетий ее применение расширилось - даже полевые командиры покупали самолеты. Наши американские советники собрали иностранных пилотов-добровольцев, которые будут служить нам в обучении китайских наземных экипажей, но однажды мы заявим права на небо." # A critical force multiplier that has been increasingly refined in Europe is the development of modern air arms. Initially used as a means of reconnaissance, its applications have multiplied across the last few decades - even warlords have been buying planes. Our American advisors has gathered foreign volunteer pilots to serve us as we train Chinese ground crews, but one day we will claim the skies for our own.
 KMT_expand_airbases: "Расширить авиабазы" # Expand Airbases
 KMT_expand_airbases_desc: "Недостаточно обеспечить часть нашей страны авиабазами. Мы должны предпринять организованные усилия, чтобы ускорить строительство взлетно-посадочных полос, ангаров и всего остального, что необходимо для функционирования военно-воздушных сил!" # Having provided part of our country with airbases is not enough. We must make an organised effort to speed up the construction of more airstrips, hangars and everything else needed to a functioning air force!
 KMT_air_defenses: "ПВО" # Air Defenses
 KMT_air_defenses_desc: "Мы не единственные, кто наращивает военно-воздушные силы... на самом деле это далеко не так. Наши военно-воздушные силы, скорее всего, будут обороняться, если нам придется столкнуться с крупными империалистическими воздушными силами, поэтому мы должны помогать им с земли." # We aren't the only ones to build up an air force... far from it actually. Our air force will most likely be on the defence if we have to face the major imperialist air forces, so we should aid them from the ground.
 KMT_heavy_fighter_programme: "Программа тяжелых истребителей" # Heavy Fighter Programme
 KMT_heavy_fighter_programme_desc: "Поскольку наши исследования истребителей увенчались успехом, теперь нам следует заняться созданием тяжелых истребителей, эффективных на большей дальности, чем обычные истребители, и способных уничтожать вражеские бомбардировщики." # With our fighter research having been a success, we should now look into building heavy fighters, effective at a longer range than regular fighters and adept at destroying enemy bombers.
# Chinese Navy
 KMT_the_chinese_navy: "Берегите наши моря" # Guard Our Seas
 KMT_the_chinese_navy_desc: "Военно-морской флот в течение последних нескольких десятилетий находился в тяжелом состоянии и был вынужден играть подчиненную роль: второстепенный приоритет по сравнению с армией, вспомогательная сила для иностранных концессионистов и денежная яма для нашей казны. Больше не надо. Если Китай хочет стать по-настоящему свободным, он должен иметь флот, способный защитить свои берега и торговлю. Первым шагом является создание независимого командования, способного контролировать его возрождение." # The Navy has ailed over the last few decades, forced to play a subservient role: a secondary priority compared to the army, an auxiliary force for foreign concessionists, and a money pit for our treasury. No more. If China is to be truly free, it must have a navy capable of defending its shores and protecting its trade. The first step is to create an independent command capable of overseeing its revival.
 KMT_grand_fleet: "Гранд Флит" # Grand Fleet
 KMT_grand_fleet_desc: "Нам недостаточно довольствоваться мелкими канонерскими лодками и устаревшими крейсерами. Настоящему флоту нужны крупные корабли, способные уничтожать вражеские эскорты и бомбардировать вражеские укрепления. Если мы серьезно относимся к нашим военно-морским амбициям, мы должны быть готовы инвестировать в дорогие великие корабли, достойные великих держав. Мы живем на заре новой эры в Тихом океане, и пусть мы будем в ее центре." # It is not enough for us to be satisfied with petty gunboats and outdated cruisers. A real fleet requires capital ships, those capable of shredding apart enemy escorts and bombarding enemy fortifications. If we are serious about our naval ambitions, we must be willing to invest in the pricey grand vessels worth of great powers. We are living in the dawn of a new age in the Pacific, and may we be at the centre.
 KMT_better_battleships: "Лучшие линкоры" # Better Battleships
 KMT_better_battleships_desc: "Наша администрация нашла группу лиц, связанных с ВМС США, которые готовы отгрузить проекты, используемые для постройки их линкоров. Хотя шпионаж не является сильной стороной нынешней администрации, мы, вероятно, сможем организовать оплату проектов." # Our administration has found a group of persons affiliated within the USN that is willing to let ship the designs being used to build their battleships. Although espionage is not this administration's strong suit, we can probably organise the payment for the designs.
 KMT_wolfhounds_of_the_sea: "Волкодавы моря" # Wolfhounds of the Sea
 KMT_wolfhounds_of_the_sea_desc: "Под поверхностью, в самых темных глубинах, скрываются бесстрашные люди в смертоносных сосудах. В предыдущей войне подводная война находилась в зачаточном состоянии, но с тех пор стала уравновешивающим фактором между надменными флотами статус-кво и государствами, которые они угнетают. Мы будем в полной мере использовать эти технологии для рейдов на вражеские конвои снабжения, снабжающие их силы вторжения, а также уничтожать любые уязвимые крупные корабли." # Beneath the surface in the darkest depths, intrepid men in deadly vessels lurk. Submarine warfare was in its infancy in the previous war, but has since become an equaliser between the haughty fleets of the status quo and the states that they oppress. We shall make full use of these technologies to raid enemy supply convoys supplying their invasion forces, and also pick off any vulnerable capital ships.
 KMT_screen_research_project: "Проект исследования экрана" # Screen Research Project
 KMT_screen_research_project_desc: "В рамках наших усилий по реформированию военно-морского флота мы также должны стремиться модернизировать наши более крупные корабли, такие как легкие крейсеры. Учитывая огромный промышленный потенциал Китая, нет никаких сомнений в том, что со временем мы сможем разработать наши собственные амбициозные усилия по модернизации крейсеров и создать республиканский флот, который сможет соперничать с флотом наших крупнейших соперников." # As part of our naval reform efforts, we should also seek to modernise our larger ships such as light cruisers. With China's massive industrial potential, there is no doubt that with time - we will be able to develop our own ambitious cruiser modernisation efforts and create a Republican Navy that can rival that of our greatest rivals.
 KMT_doctrinal_innovations: "Доктринальные инновации" # Doctrinal Innovations
 KMT_doctrinal_innovations_desc: "Многие офицеры понятия не имеют, как правильно вырабатывать стратегию управления более чем одним кораблем, это ужасно! Мы это исправим и начнем заниматься воспитанием наших офицеров!" # Many officers have no idea how to properly strategise with more than one ship, appalling! We shall rectify this and start putting effort into our officers education!
 KMT_marine_divisions: "Подразделения морской пехоты" # Marine Divisions
 KMT_marine_divisions_desc: "Корпус морской пехоты Китайской Республики примерно так же стар, как и сама Республика. Построенный из пепла старого сторожевого корпуса ВМФ в 1914 году, различные командиры, в том числе Са Чжэньбин, надеялись создать силы, обученные высадке десанта, увидев мощь вторгшегося Альянса восьми держав. Флот Фуцзянь также спонсировал крупные отряды морской пехоты. Вместе они составят основу силы, способной действовать за рубежом." # The Marine Corps of the Republic of China are about as old as the Republic itself. Built from the ashes of the old Navy Sentry Corps in 1914, various commanders including Sa Zhenbing hoped to create a force trained in amphibious landings after seeing the potency of the invading Eight-power alliance. The Fujian fleet has also sponsored large detachments of naval infantry. Together, they shall be the basis of a force capable of projecting abroad.
 KMT_submarine_modernization: "Модернизация подводных лодок" # Submarine Modernization
 KMT_submarine_modernization_desc: "Если мы хотим отобрать контроль над Бохайским морем у наших соперников, мы должны перехитрить их превосходящую огневую мощь на море. Решением является секретная программа подводных лодок. Потенциальная прибыль, если мы сможем вытеснить это море, перевесит стоимость разработки." # If we are to wrest control of the Bohai Sea from our rivals, we must outwit their superior firepower at sea. The solution is a secretive submarine programme. The potential returns if we are able to dislodge this sea outweighs the cost of development.
# Chinese Army
 KMT_the_chinese_army: "Национально-революционная армия" # National Revolutionary Army
 KMT_the_chinese_army_desc: "Точно так же, как Гоминьдан приносит прогресс нации, Национально-революционная армия должна быть авангардом китайского военного развития. Многие офицеры за последнее десятилетие интенсивно учились в современных европейских военных академиях и готовы применить эти уроки для создания новой Национально-революционной армии с использованием новейших доктрин и технологий." # In the same way that the Kuomintang is bringing progress to the nation, the National Revolutionary Army must be a vanguard for Chinese military development. Many officers have studied extensively in modern European military academies across the last decade, and are ready to apply those lessons to build a new National Revolutionary Army with the latest in doctrine and technology.
 KMT_firepower_concentration: "Концентрация огневой мощи" # Firepower Concentration
 KMT_firepower_concentration_desc: "Если мы хотим избежать тупиковых ситуаций и тяжелых конфликтов, которые мы не можем себе позволить, мы должны черпать вдохновение из уроков, извлеченных в окопах последней крупной войны. После тщательной разведки и планирования слабые места в линиях противника должны быть атакованы одной мощной целенаправленной атакой с использованием современных общевойсковых средств. Расширяющаяся брешь позволит добиться прорыва, который принесет нам победу." # If we are to avoid stalemates and the grinding sort of conflict that we can ill afford, we must take inspiration from the lessons learned in the trenches of the last major war. After careful scouting and planning, weak points in enemy lines must be assailed in one great, focused attack using modern combined arms. The widening breach will allow for breakthroughs to win us the day.
 KMT_grand_battleplan: "Большой план битвы" # Grand Battleplan
 KMT_grand_battleplan_desc: "В конечном итоге мы остановились на доктрине великих планов сражения. Вместо того, чтобы тратить жизни людей, мы будем координировать весь военный фронт так, чтобы наши атаки происходили вовремя и сокрушали врага одновременными хорошо спланированными атаками." # We have ultimately settled on a doctrine of grand battleplans. Rather than waste lives, we will coordinate the entire war front so that our attacks arrive in perfect time and overwhelm the enemy with simultaneous well-planned assaults.
 KMT_modern_logistics: "Современная логистика" # Modern Logistics
 KMT_modern_logistics_desc: "«Армия марширует на животе»\nФакт, о котором нам сразу напоминают наши иностранные советники. Если мы хотим поддерживать операции на такой большой линии фронта, как Китай, мы не можем просто полагаться на разрозненные цепочки поставок или щедрость местных жителей. Вместо этого должна быть создана централизованная, регулярно контролируемая система снабжения, которая позволит нам вести бой на больших дистанциях." # \"An army marches on its stomach\"\nA fact that our foreign advisors are quick to remind us of. If we are to sustain operations along a frontline as large as China, we cannot simply rely on ad-hoc supply chains or the generosity of the locals. Instead, a centralised, regularly monitored system of provisions must be created that will allow us to fight across long distances.
 KMT_armor_research: "Исследование брони" # Armor Research
 KMT_armor_research_desc: "Танк оказался ключевым компонентом на современном поле боя. Мы не можем позволить себе отставать в этом развитии и должны изучать танковые разработки Германии, Франции и Японии для создания собственных бронетанковых предприятий." # The tank has proven to be a key component in the modern battlefield. We cannot afford to lag behind in this development and must study the tank designs of Germany, France and Japan to develop our own armoured companies.
 KMT_army_motorization: "Моторизация армии" # Army Motorization
 KMT_army_motorization_desc: "Наша армия может обладать снабжением, дисциплиной и боевым духом, которые отличают современные силы, но все это бесполезно, если эти запасы не могут достичь линии фронта или если наших храбрых людей расстреливают, потому что они практически неподвижны против наших более проворных врагов. Южные традиции войны, усиленные современными технологиями, сделают нас непобедимыми в кампании!" # Our army may possess the supplies, discipline, and fighting spirit that distinguishes a modern force - yet all this is useless if those supplies cannot reach the frontline, or if our brave men are gunned down because they are practically immobile against our more nimble enemies. The southern tradition of war, enhanced with modern technology, will make us unstoppable on campaign!
 KMT_signal_companies: "Сигнальные компании" # Signal Companies
 KMT_signal_companies_desc: "Главным нововведением, использованным во время Великой войны в Европе, было радио, которое значительно расширило военную связь, а также усилило командование и контроль на поле боя. Использование радиосвязи в Китае все еще находится в зачаточном состоянии, но приложив некоторые усилия, мы можем быстро пополнить наши силы этой новой технологией, которая имеет решающее значение для скоординированных, концентрированных ударов по уязвимым позициям противника." # A major innovation used during the Great War in Europe was the radio, which tremendously expanded military communication as well as enhanced command and control in the battlefield. The use of radios is still in its infancy in China, but with some effort we can quickly augment our forces with this new technology - critical for coordinated, concentrated strikes in vulnerable enemy positions.
 KMT_mechanized_experiments: "Механизированные эксперименты" # Mechanized Experiments
 KMT_mechanized_experiments_desc: "Необходимо пойти на некоторые прагматические компромиссы, даже когда мы начинаем радикальные изменения в нашей военной структуре. Ду Юймин долгое время был командующим WMARCA, но выразил готовность возглавить создание механизированных сил, что является доказательством того, что политика не должна мешать профессионализму. Мобильная ударная группа нашей революционной армии даст нам ключевое преимущество перед нашими соперниками-военачальниками." # Some pragmatic compromises have to be made, even as we begin sweeping changes to our military structure. Du Yuming is a long-time WMARCA commander but has expressed willingness to lead in the creation of a mechanised force - proof that politics does not have to get in the way of professionalism. A mobile strike force for our revolutionary army will give us a key advantage over our warlord rivals.
 KMT_expand_whampoa_academy: "Развернуть Академию Вампоа" # Expand Whampoa Academy
 KMT_expand_whampoa_academy_desc: "В 1924 году в соответствии с идеалами Сунь Ятсена была создана Военная академия Вампоа для размещения следующего поколения китайских офицеров и генералов, принявших участие в национальной революции. Генералиссимус и Центральный комитет единогласно согласились разрешить расширение военной академии в рамках подготовки к национальному объединению." # In 1924, in accordance with the ideals of Sun Yat-sen, the Whampoa Military Academy was created to house China's next generation of officers and generals to partake in the national revolution. The Generalissimo and the Central Committee has unanimously agreed to authorise the expansion of the military academy in preparation for national unification.
 KMT_the_general_staff: "Генеральный штаб" # The General Staff
 KMT_the_general_staff_desc: "В период повстанческого движения командование и управление находились в полном беспорядке, оставленном на усмотрение плохо скоординированной инициативы различных командиров ополчения. Это могло сработать для уклонения от патрулей Лиги, где компетентные генералы часто подвергались чистке, а элитные немецкие обученные подразделения удерживались в Нанкине, чтобы сохранить Сунь Чуаньфана у власти, но необходимо создать настоящую систему штабных офицеров, если мы сражаемся с решительными врагами." # In the insurgency period, command and control was an utter mess - left to the poorly coordinate initiative of various militia commanders. This might have worked in evading League patrols, where competent generals were often purged and the elite German trained units held in Nanjing to keep Sun Chuanfang in power, but a real staff officer system must be created if we are fight against determined foes.
 KMT_equipment_standardization: "Стандартизация оборудования" # Equipment Standardization
 KMT_equipment_standardization_desc: "Во времена полевых командиров на офицера тыла часто ложилось незавидное бремя, связанное с тем, что каждый местный военный отряд, губернаторское ополчение и отколовшиеся силы имели свои собственные винтовки, боеприпасы и униформу. Необходимо предпринять дополнительные шаги для оптимизации нашего оборудования, начиная с самых маленьких производственных цехов и заканчивая полем боя." # During the days of the warlords, any logistics officer would often have the unenviable burden of every local war band, governor militia and splinter force having their own rifles, ammunition and uniforms. More steps need to be taken to streamline our equipment, from the smallest manufacturing floors, all the way into the battlefield.
 KMT_reconnaissance_improvements: "Улучшения разведки" # Reconnaissance Improvements
 KMT_reconnaissance_improvements_desc: "Разведка и разведка всегда были основой компетентной армии. Современная война дала нам новые инструменты и задачи для выполнения этой необходимой задачи, которая гарантирует, что наши войска будут знать, что их ждет, и даст нашим офицерам возможность планировать и правильно реагировать на вызовы." # Recon and intelligence has always been a staple of a competent army. Modern war has given us new tools and challenges to accomplish this necessary task, which will ensure that our troops know what is in front of them and give our officers the ability to plan and react properly to challenges.
 KMT_specialized_equipment_production: "Производство специализированного оборудования" # Specialized Equipment Production
 KMT_specialized_equipment_production_desc: "Наши усилия, начавшиеся с восстановления после гражданской войны, увенчались успехом и помогли превратить бассейн нашей страны в небольшой, хотя и растущий, промышленный центр. Вскоре мы сможем гордиться тем, что у нас одни из лучших промышленных партнеров во всем Китае, и получать еще больше вознаграждений от нашего тяжелого и упорного труда." # Our efforts that began with the reconstruction after the civil war have blossomed and helped turn our country's basin into a small, if growing, industrial heartland. We can soon boast having some of the best industrial partners in all of China and reap even more rewards from our toil and hard work.
 KMT_army_engineers: "Армейские инженеры" # Army Engineers
 KMT_army_engineers_desc: "Некоторые из провинций Китая представляют собой суровые ландшафты с высокими горами и широкими реками, в которых приходится сражаться. Таким образом, необходимо максимально использовать специализированные инженерные отряды, чтобы позволить нашим войскам построить лучшую оборону и преодолеть самые мощные укрепления." # Some of China's provinces' is a harsh landscape to fight in with its tall mountains and wide rivers. As such, specialised detachments of engineers ought to be used as much as possible to allow our forces to build the best defences and surmount the mightiest of fortifications.
 KMT_modern_doctrines: "Современные доктрины" # Modern Doctrines
 KMT_modern_doctrines_desc: "Недостаток современного оборудования мы восполним гибкостью, быстротой и изобретательностью. Благодаря скорости и настойчивости мы перехитрим наших врагов, будь то благодаря хитрости и инициативе наших офицеров или несравненной способности наших солдат маршировать и сражаться на больших расстояниях." # What we lack in modern equipment we shall make up for by being adaptable, quick and resourceful. With speed and perseverance we will outmanoeuvre our enemies, be it through our officers cunning and initiative or our troops peerless ability to march and fight across great distances.
 KMT_artillery_modernization: "Модернизация артиллерии" # Artillery Modernization
 KMT_artillery_modernization_desc: "В настоящее время многие из наших артиллерийских подразделений используют те же орудия, которые они использовали в конфликтах последних десятилетий. Это не выдержит. Импорт иностранных артиллерийских орудий и ноу-хау во многом помог бы нам смягчить эту проблему." # As it stands, many of our artillery detachment use the same guns that they fielded in the conflicts of the past decades. This won't stand. Importing foreign artillery pieces and know-how would help us a great deal in mitigating this issue.
 KMT_anti_air_incorporation: "Противовоздушная корпорация" # Anti-Air Incorporation
 KMT_anti_air_incorporation_desc: "Хотя мощь авиации и бронетехники в Китае остается довольно ограниченной, их присутствие неуклонно растет, и мы должны принять контрмеры, чтобы эффективно с ними бороться. Артиллерийские орудия, предназначенные для борьбы с авиацией и бронетехникой, продолжают оставаться наиболее экономически эффективным решением." # While air and armoured power remains fairly limited in China, their presence is steadily growing and we must adopt countermeasures to deal with them effectively. Artillery pieces designed to counter aircraft and armoured vehicles are continuing to be the most cost-effective solution.
 KMT_a_reformed_army: "Реформированная армия" # A Reformed Army
 KMT_a_reformed_army_desc: "Эффективность современной военной командной структуры зависит не только от способностей ее отдельных членов, она также зависит от их сплоченности перед более широкой миссией. Офицеры и генералы Национально-революционной армии преданы Гоминьдану и общей вере в то, что они борются за спасение и свободу своей нации." # The effectiveness of a modern military command structure does not depend only on the capabilities of its individual members, it also depends on their cohesion to the greater mission ahead. The officers and generals of the National Revolutionary Army are dedicated men to the Kuomintang and to the shared belief that they fight for their nation's salvation and freedom.
# Unification
 KMT_unification_of_china: "Объединение Китая" # Unification of China
 KMT_unification_of_china_desc: "Это не будет легко. Враг ворвется в наши города, опустошит наше побережье и будет мучить нашу давно разделенную нацию. Временами нам придется отступать – возможно, даже вглубь страны – но мы никогда не отдадим нашу цивилизацию. Война будет долгой, но наша решимость победить продлится еще дольше — мы не примем ничего, кроме абсолютной победы." # It will not come easy. The enemy will push into our cities, ravage our coastline, and torment our long-divided nation. At times, we will be forced to fall back - perhaps even towards the interior of the country - but we will never surrender our civilisation away. The war will be long, but our determination to win shall last even longer - we will accept nothing less than absolute victory.
 KMT_subjugate_the_warlords: "Пошлите ультиматум военачальникам" # Send Ultimatum to the Warlords
 KMT_subjugate_the_warlords_desc: "Слишком долго Китай был разделен между амбициозными авторитарными лидерами и мятежными региональными фракциями. Из-за нашей слабости хищники всех мастей пришли эксплуатировать нашу землю и развращать наш народ. Следующим шагом на пути к завершению Века Унижений является окончание Эры Военачальников. Мы должны подчинить себе различных военачальников, возглавив тех, кто использовал распад Лиги в мятежных целях." # For far too long, China has been bitterly divided by ambitious strongmen and rebellious regional factions. In our weakness, predators of all stripes have come to exploit our land and corrupt our people. The next step in ending the Century of Humiliations is to end the Warlord Era. We must bring the various warlords to heel, reigning those who exploited the collapse of the League for seditious ends.
 KMT_attack_the_beijing_government: "Attack Zhili" # Attack Zhili
 KMT_attack_the_beijing_government_desc: "Прошло много лет после неудачи, которую мы пережили в 4-й Чжифэнской войне, но с тех пор угроза войны с северо-востока стала только более серьезной. Чжан Цзолинь продал и свою душу, и нашу страну, когда заключил сделку с Японией. Пятый Чжифэн — это то, что нам нужно, чтобы исправить эту великую ошибку. Чжили защитят северо-восток; это кульминация всей нашей работы и борьбы до этого момента, и такая возможность может больше не представиться!" # Many years have passed since the setback we experienced in the 4th Zhifeng War, and yet since then the threat of war from the northeast has grown only more dire. Zhang Zuolin sold both his soul and our country when he made his deal with Japan - a 5th Zhifeng is what we need to set this great wrong right. The Zhili will secure the northeast; this is the culmination of all our work and struggles up to this point, and the opportunity may not come again!
 KMT_attack_fengtian: "Атаковать Фэнтянь" # Attack Fengtian
 KMT_attack_fengtian_desc: "Дураки на севере утверждают, что они являются «последним бастионом» законного правительства Китая. На самом деле они не более чем японские болонки. Пока они рабски служат своим хозяевам, мы должны нанести удар и вернуть себе родину!" # The fools to the north claim to be the 'last bastion' of China's legitimate government. In reality they are little more than Japanese lapdogs. While they slavishly serve their masters we should strike and reclaim our homeland!
 KMT_claims_on_tibet: "Претензии к Тибету" # Claims on Tibet
 KMT_claims_on_tibet_desc: "Линия Мак-Магона была несправедливо проведена британцами, насильственно уступившими регион Таванг отколовшемуся государству Тибет. То, что это решение было принято без нашего одобрения, является национальным возмущением и унижением нашей способности вмешиваться в наши собственные национальные дела, поскольку дела Тибета являются делами Китая. Когда наша нация снова станет сильной, мы будем двигаться вперед и восстанавливать честь территориальной целостности Китая." # The MacMahon Line was drawn unfairly by the British, forcefully ceding the region of Tawang to the breakaway state of Tibet. It is a national outrage that this decision was made without our approval, a humiliation to our ability to intervene in our own national affairs, as Tibet's affairs are China's affairs. With our nation strong once more, we will push forward and restore honour to China's territorial integrity.
 KMT_hongkong_claim: "Гонконгская претензия" # Hong Kong Claim
 KMT_hongkong_claim_desc: "Как мы оплакивали унижение, когда продавали наших соотечественников империалистам. Мы не забываем наших гонконгских братьев и сестер, которые на протяжении многих лет возглавляли дух революции против реакционных держав. Однако мы возглавляем Новый Китай, Китай, который наконец сможет противостоять империалистическим державам. Мы освободим наших соотечественников, будь то миром или силой." # How we lamented the humiliation at selling out our fellow Chinese to the imperialists. We do not forget our Hong Kong brothers and sisters, who have for years led the spirit of revolution against the reactionary powers. We, however, lead a New China, a China that can finally stand up to the imperialist powers. We will liberate our countrymen, whether by peace or force.
 KMT_taiwan_claim: "Претензия Тайваня" # Taiwan Claim
 KMT_taiwan_claim_desc: "Наша страна не столкнулась с большей трагедией, чем продажа наших соотечественников японским империалистам, когда мы сдали остров Тайвань. Теперь, когда Китай снова силен, нашим национальным долгом как китайского народа является объединение с нашими тайваньскими соотечественниками. Наши тайваньские братья и сестры жаждут освобождения, и мы освободим их от цепей, снова объединив нашу страну." # Our country faced no greater tragedy than selling out our fellow Chinese to the Japanese imperialists when we surrendered the island of Taiwan. Now that China is strong once more, it is our national duty as a Chinese people to unite with our Taiwanese countrymen. Our Taiwanese brothers and sisters yearn for the liberation, and we will free them from their chains, uniting our country once more.
 KMT_macau_claim: "Претензия Макао" # Macau Claim
 KMT_macau_claim_desc: "Как мы оплакивали унижение, когда продавали наших соотечественников империалистам. Мы не забываем наших братьев и сестер из Макао, которые на протяжении многих лет возглавляли дух революции против реакционных держав. Однако мы возглавляем Новый Китай, Китай, который наконец сможет противостоять империалистическим державам. Мы освободим наших соотечественников, будь то миром или силой." # How we lamented the humiliation at selling out our fellow Chinese to the imperialists. We do not forget our Macau brothers and sisters, who have for years led the spirit of revolution against the reactionary powers. We, however, lead a New China, a China that can finally stand up to the imperialist powers. We will liberate our countrymen, whether by peace or force.

### Tooltips
 KMT_no_warlords: "@SCH §Y[SCH.GetName]§!, @SHX §Y[SHX.GetName]§!, @YUN §Y[YUN.GetName]§! и @XSM §Y[XSM.GetName]§! не существует." # The @SCH §Y[SCH.GetName]§!, @SHX §Y[SHX.GetName]§!, @YUN §Y[YUN.GetName]§! and @XSM §Y[XSM.GetName]§! does not exist
 KMT_no_rival_governments: "@FNG §Y[FNG.GetName]§! и @ZHI §Y[ZHI.GetName]§! не существует." # The @FNG §Y[FNG.GetName]§! and @ZHI §Y[ZHI.GetName]§! does not exist

#### Events
 china.0.t: "Белое солнце в голубом небе" # The White Sun in the Blue Sky
 china.0.d: "Гоминьдан родился в видении доктора Сунь-Ята Сена о свободной китайской республике, организовав революцию против коррумпированной династии Цин в 1911-1912 годах, известную как Синьхайская революция. Однако грозные силы династии Цин превосходили силы Гоминьдана; В отчаянии Сунь и его политические союзники обратились за помощью к Юань Шикаю, прося его предать правительство Цин в обмен на то, что он станет президентом новой Китайской Республики. Юань принял сделку доктора Суня, однако после победы над правительством Цин он предпринял отчаянную попытку создать новую китайскую династию, сделав себя первым императором. За несколько лет до этого Юань консолидировал власть внутри республики, перетасовывая губернаторов и убивая политических оппонентов, однако почти сразу после объявления себя императором Юань оказался полностью лишен союзников и целой нации, противостоящей ему.\n\nСунь и остальная часть Китайской Республики свергли Юаня незадолго до его естественной смерти в 1916 году, но ущерб Гоминьдану уже был нанесен, и губернаторы восставших провинций больше не принял слабую власть, которую Сунь пытался навязать Китаю. Этот период между окончанием Войны за национальную защиту и восстановлением Маньчжурии можно в значительной степени охарактеризовать как причину, по которой правительство Бэйяна приняло такой подход невмешательства в провинции и установило основу для отношений между национальными и субнациональными правительствами. \n\nГоды спустя Сунь вернется из изгнания и в 1921 году сформирует военное правительство в Гуандуне, вдали от Пекина и, как такового, влияния правительства Бэйяна, а в 1924 году, когда правительство Бэйяна пошатнулось от внезапного нападения Фэнтяня и прекратилась поддержка губернаторов провинций, Сунь объявил о начале Северной экспедиции в июле 1924 года. Однако Сунь умер в 1925 году, и его смерть привела бы к смертельному расколу в Гоминьдане между двумя его протеже, Чан Кайши и Ван Цзинвеем. Чан в конечном итоге выиграл борьбу за власть и продолжил Северную экспедицию, которая привела к первоначальным успехам сил Гоминьдана, но в конечном итоге привела к тупику между тремя крупнейшими группировками в Китае, претендующими на роль законного правительства." # The Kuomintang was born in Dr. Sun-Yat Sen's vision of a free Chinese republic, staging a revolution against the corrupt Qing Dynasty in 1911-1912 known as the Xinhai Revolution. However, the formidable forces of the Qing Dynasty outmanned the forces of the Kuomintang; desperate Sun and his political allies called the support of Yuan Shikai, asking him to betray the Qing Government in return for being made president of the new Chinese Republic. Yuan accepted Dr. Sun's deal, however after defeating the Qing Government, he made a desperate attempt to usher in a new Chinese dynasty with himself as first Emperor. In the years before this Yuan consolidated power within the Republic under himself by shuffling governors and assassinating political opponents, however almost immediately after declaring himself Emperor Yuan found himself completely devoid of allies and an entire nation opposed to him.\n\nSun and the rest of the Chinese Republic overthrew Yuan shortly before his natural death in 1916, but the damage to the Kuomintang had already been done, and the governors of the provinces that had revolted no longer accepted the weak authority that Sun had tried to impose upon China. This period between the end of the National Protection War and the Manchu Restoration can be largely described as the reasoning for the Beiyang Government taking such a hands-off approach to the provinces, and set the framework for the relationship between the national and sub-national governments. \n\nYears later Sun would return from exile and in 1921 form a military government in Guangdong, far from Beijing and as such the influence of the Beiyang Government, and in 1924 with the Beiyang Government reeling from a surprise attack from Fengtian and collapsing support of the provincial governors, Sun declared the beginning of the Northern Expedition in July 1924. However, Sun would die in 1925, and his death would lead to a deadly split in the Kuomintang between his two proteges, Chiang Kai-Shek and Wang Jingwei. Chiang ultimately won the power struggle, and proceeded to continue the Northern Expedition, which resulted initial successes for the Kuomitang forces but ultimately resulted in a stalemate between the three largest cliques in Chinese all claiming to be the legitimate government.
 china.0.a: "Вперед!" # Onwards!

 china.1.t: "Вы возьмете на себя самый общий контроль" # Generalissimo assumes control
 china.1.d: "Сегодняшний день знаменует собой новую эру для Китая, поскольку генералиссимусу Чангу удалось взять под полный контроль национальное правительство. Однако похоже, что различные группы выступают против этих изменений, поскольку некоторые утверждают, что национальное правительство успешно стало еще одним военачальником в Китае." # Today marks a new era for China, as Generalissimo Chiang have succeeded taking full control over the National Government. It seems however, that various groups are opposing these change, as some argued that the National Government have successfully became another warlord state in China.
 china.1.a: "Генералиссимус будет вести нас." # The Generalissimo will guide us.

 china.2.t: "[From.GetLeader] требует отправки" # [From.GetLeader] Demands Submission
 china.2.d: "Генералиссимус прислал послов, угрожая нам военными действиями, если мы не подчинимся желанию Шанхая. Многие советники согласились с предложением принять требования, поскольку у нас нет возможности бороться с более модернизированной частью Китая." # The Generalissimo have sent envoys threatening us for military action if we do not submit to the Shanghai's wishes. Many within the advisors have been agreeing with the proposal to accept the demands, as we do not have the capability to fight the more modernized part of China.
 china.2.a: "Примите это" # Accept it
 china.2.b: "Мы можем с ними бороться." # We can fight them.

 china.3.t: "[FROM.GetNameDefCap] отклонил наши требования" # [FROM.GetNameDefCap] rejected our demands
 china.3.d: "[FROM.GetNameDefCap] отклонили наши требования о сотрудничестве с нами, национальным правительством. Кажется, что военные действия сейчас — это только тот курс действий, который мы готовы предпринять." # The [FROM.GetNameDefCap] have rejected our demands of cooperate with us, the National Government. It seems that military action is now only the course of action that we are willing to take.
 china.3.a: "На войну!" # To War!

 china.4.t: "[From.GetLeader] требует возврата территорий" # [From.GetLeader] Demands Return of Territories
 china.4.d: "Правительство [KMT.GetAdjective] потребовало перевести наши удержания на материковую часть Китая. Кажется, к нашей границе прибыло много войск [KMT.GetAdjective], готовых к конфликту, если он разразится." # The [KMT.GetAdjective] Government have demanded to transfer our withholdings in the Chinese mainland. It seems that many [KMT.GetAdjective] troops have been arriving at our border and ready for a conflict if it breaks out.
 china.4.a: "Примите требования" # Accept the demands
 china.4.b: "Нет, если они хотят войны, тогда ладно." # No, if its a war they want, then fine

 china.5.t: "[FROM.GetAdjective] Правительство отклонило наши требования" # [FROM.GetAdjective] Government have rejected our demands
 china.5.d: "Похоже, что [FROM.GetAdjective] отказались от нашей мирной просьбы и отказались передать нам свою колонию на материке. Теперь мы можем попытаться захватить его силой или воздержаться от дальнейших действий." # It seems that the [FROM.GetAdjective] have refused our peaceful request and have refused to transfer their colony in the mainland to us. We can now choose to try forcibly seizing it - or refrain from further action
 china.5.a: "Хорошо, но мы вернемся!" # Fine - but we will be back!
 china.5.b: "Вперед!" # Onwards!

 china.6.t: "[KMT.GetName] вторгся на нашу территорию" # [KMT.GetName] marched onto our territory
 china.6.d: "Похоже, что упрямое правительство [KMT.GetAdjective] приказало своим войскам на границе захватить наши укрепления на материке. Оставшиеся у нас войска убиты, а некоторые из наших дипломатов заключены в тюрьму. Многие возмущены действиями Китая и требуют военных действий." # It seems that the stubborn [KMT.GetAdjective] Government have instructed their troops at the border to seize our withholding in the mainland. Our remaining troops have been killed and some of our diplomats have been imprisoned. Many are outraged on China's actions and have demanded a military action.
 china.6.a: "На войну!" # To War!

### Companies
 cfhi: "CFHI" # CFHI
 cfhi_desc: "CFHI или China First Heavy Industry Group Co. Ltd — крупный производитель оборудования в Китае. Управляется непосредственно националистическим правительством и в значительной степени поддерживает военную промышленность, металлургическое и горнодобывающее оборудование страны." # The CFHI or China First Heavy Industry Group Co. Ltd, is a large scale equipment manufacturer in China. Managed directly by the Nationalist Government and is largely behind the military industries, iron and steel machinery, and mining machinery of the country.
 national_railway_corporation: "НРК" # NRC
 national_railway_corporation_desc: "Национальная железнодорожная корпорация находится в ведении Министерства путей сообщения националистического правительства, а также Министерства связи. Она эффективно национализировала железные дороги, ранее принадлежавшие иностранцам, и занималась строительством новых транспортных сетей по всей стране." # The National Railway Corporation is operated by the Nationalist Government's Ministry of Railways as well as the Ministry of Communications and has been effective in nationalising formerly foreign-owned railways and fis dedicated to the construction of new transportation networks throughout the country.
 cetc: "CETC" # CETC
 cetc_desc: "CETC или China Electronics Technology Corporation — это корпорация, управляемая Министерством связи националистического правительства с целью обеспечения связи и гражданской электроники для целей Национальной революционной армии." # The CETC or China Electronics Technology Corporation is a corporation operated by the Nationalist Government's Ministry of Communications for the purposes of providing communications and civilian electronics for the purposes of the National Revolutionary Army.
 sinopec: "Синопек" # Sinopec
 sinopec_desc: "Sinopec или China Petroleum & Chemical Corporation — это корпорация, организованная Министерством внутренних дел и управляющая запасами нефти и нефтепродуктов страны, а также стимулирующая добычу нефти и химикатов по всей стране." # Sinopec or China Petroleum & Chemical Corporation is a corporation organised by the Ministry of the Interior and manages the country's oil and petroleum reserves, while also encouraging oil and chemical extraction throughout the country.
#Material Concerns
 norinco: "Норинко" # Norinco
 norinco_desc: "Norinco, что означает China North Industries Group Corporation Limited, является корпорацией, которая должна управлять бывшими отраслями северокитайских клик, такими как клика Фэнтянь и клика Чжили. Norinco, организованная Министерством торговли и внутренних дел, управляет преимущественно военной промышленностью для целей Национальной революционной армии." # Norinco, which stands for the China North Industries Group Corporation Limited, is a corporation that is to manage the former industries of the Northern Chinese cliques such as the Fengtian and Zhili Clique. Organised by the Ministry of Commerce and the Interior, Norinco manages primarily military industries for the purposes of the National Revolutionary Army.
 faw_motors: "Фав Моторс" # Faw Motors
 faw_motors_desc: "С помощью европейских автопроизводителей из Британского Союза и Французской Коммуны компания Faw Motors или First Automobile Works стала первым китайским государственным автомобильным заводом. Он занимается производством современных автомобилей как гражданского, так и военного назначения." # With the help of European car manufacturers from the Union of Britain and the Commune of France, Faw Motors or First Automobile Works has broken ground as the first native Chinese state-owned automobile factory. It is dedicated to the production of modern automobiles for both civilian and military use.
#Aircraft Designers
 china_aviation_corporation_CHI: "CNAC" # CNAC
 china_aviation_corporation_CHI_desc: "Китайская национальная авиационная корпорация была организована по приказу Исполнительного Юаня под руководством Министерства путей сообщения и Министерства связи. CNAC был создан при помощи как Британского Союза, так и Французской Коммуны, и на момент своего создания столкнулся с сопротивлением со стороны военных клик в Китае, которые имеют свои собственные военно-воздушные силы. Таким образом, CNAC создан для надзора и национализации всего воздушного движения и авиапочты." # The China National Aviation Corporation was organised by order of the Executive Yuan under the leadership of both the Ministry of Railways and the Ministry of Communications. The CNAC was set up with help from both the Union of Britain and the Commune of France and at its conception faced resistance from military cliques in China which have their own individual air forces. As such the CNAC is established in order to oversee and nationalise all air traffic and air mail.
 central_aircraft_manufacturing_company: "УДАЛИТЬ" # CANC
 central_aircraft_manufacturing_company_desc: "Центральная авиастроительная компания была создана Национальным министерством авиации как средство производства военных и гражданских самолетов как для ВВС Китайской Республики, так и для гражданских перевозок." # The Central Aircraft Manufacturing Company has been designed by the Nationalist Ministry of Air as a means to produce military and civilian grade aircraft for both the Republic of China Air Force and also for civilian transportation.
 central_air_transport: "КОТ" # CAT
 central_air_transport_desc: "Центральный воздушный транспорт был организован Министерством связи для облегчения воздушного сообщения и транспорта как для гражданского, так и для военного использования по всей стране." # The Central Air Transport has been organised by the Ministry of Communications in order to facilitate air communication and transportation for both civilian and military uses throughout the country.
#Naval Designer
 csic: "CSIC" # CSIC
 csic_desc: "Китайская судостроительная корпорация — это государственная судостроительная отрасль, организованная Министерством торговли и Министерством военно-морского флота с целью использования бывших северных военно-морских предприятий клики Фэнтянь и Чжили для строительства нового националистического военно-морского флота." # The China Shipbuilding Industry Corporation is a state-owned ship-building industry organised by both the Ministry of Commerce and the Ministry of Navy in order to use former northern naval industries of the Fengtian and Zhili Clique for the purposes of building the new Nationalist navy.
 china_state_shipbuilding_corporation: "CSSC" # CSSC
 china_state_shipbuilding_corporation_desc: "Китайская государственная судостроительная корпорация была создана по приказу военно-морского министерства с целью содействия строительству и производству военных кораблей, укомплектована европейскими конструкторами и консультантами, как способ модернизации растущей военно-морской промышленности Китая." # The China State Shipbuilding Corporation was created by orders of the Ministry of the Navy in order to facilitate the construction and production of warships, staffed with European designers and advisors as a way to modernise China's growing naval industry.
#Armor Concerns
 sinotruk: "Синотрук" #Yes it's apparently spelled truk # Sinotruk
 sinotruk_desc: "Sinotruk или China National Heavy Duty Truck Group Co., Ltd — государственный производитель грузовых автомобилей, созданный на базе бывшего автомобильного завода Цзинань. Компания известна тем, что производит собственные грузовики в Китае, а также импортирует конструкции иностранных производителей грузовиков как для военного, так и для гражданского использования." # Sinotruk or the China National Heavy Duty Truck Group Co., Ltd is state owned truck manufacturer designed from the basis of the former Jinan Automobile Works. It is known for producing China's own native trucks while also importing designs from foreign truck manufacturers for both military and civilian use.

 POLITICS_CHIANG_KAI_SHEK_DESC: "Чан родился в 1887 году в провинции Чжэцзян. Его ранняя жизнь была отмечена лишениями и борьбой. Однако его преданность делу единого и сильного Китая была непоколебимой. На него глубоко повлиял революционный пыл того времени, что в конечном итоге привело его к вступлению в Националистическую партию, или Гоминьдан (Гоминьдан), и к борьбе с деспотической династией Цин.\n\nВзлет Чанга к известности был стремительным. Он продемонстрировал замечательную военную хватку и лидерство во время Северной экспедиции, кампании по воссоединению Китая под властью Гоминьдана. Будучи главнокомандующим Национальной революционной армией, он умело ориентировался в сложном политическом ландшафте, заключал союзы и побеждал полевых командиров для достижения значительных территориальных завоеваний.\n\nТем не менее, его руководство не было бесспорным. Критики указали на его авторитарные тенденции и поставили под сомнение его приверженность демократическим идеалам. Тем не менее, непоколебимая преданность Чанга суверенитету Китая и его неустанные усилия по сопротивлению японскому экспансионизму снискали ему уважение как внутри страны, так и за рубежом.\n\nПока мир стоял на грани войны, Чан Кайши стал маяком надежды для Китая. Он считал, что сильный, единый и модернизированный Китай сможет не только противостоять вызовам эпохи, но и внести вклад в глобальный мир. Мало ли мы знали, что ближайшие годы проверят его решимость и судьбу Китая так, как никто не мог себе представить." # Born in 1887 in the province of Zhejiang, Chiang's early life was marked by hardship and struggle. However, his dedication to the cause of a united and strong China was unwavering. He was deeply influenced by the revolutionary fervor of the time, which ultimately led him to join the Nationalist Party, or Kuomintang (KMT), and the fight against the oppressive Qing Dynasty.\n\nChiang's rise to prominence was meteoric. He displayed remarkable military acumen and leadership during the Northern Expedition, a campaign to reunify China under KMT rule. As the commander-in-chief of the National Revolutionary Army, he skillfully navigated the complex political landscape, forging alliances and defeating warlords to achieve significant territorial gains.\n\nYet, his leadership was not without controversy. Critics pointed to his authoritarian tendencies and questioned his commitment to democratic ideals. Nevertheless, Chiang's unwavering dedication to China's sovereignty and his tireless efforts to resist Japanese expansionism earned him respect both domestically and internationally.\n\nAs the world stood on the brink of war, Chiang Kai-Shek stood as a beacon of hope for China. He believed that a strong, united, and modernized China could not only withstand the challenges of the era but also contribute to global peace. Little did we know that the coming years would test his resolve and the fate of China in ways none could have imagined.

