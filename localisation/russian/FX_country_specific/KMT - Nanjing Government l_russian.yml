 KMT_FUHRERREICH_DESC: "Синьхайская революция, возглавляемая доктором Сунь-Ят Сеном, была революционной деятельностью против династии Цин в 1911-1912 годах. Сунь вернулся из ссылки и объявил Северную экспедицию в 1924 году. Сунь неожиданно умер, что привело к расколу в Гоминьдане между Чан Кайши и Ван Цзинвэем. Чан выиграл борьбу за власть и продолжил Северную экспедицию, что привело к первоначальным успехам Гоминьдана, но в конечном итоге привело к тупику между тремя крупнейшими китайскими кликами.\nПо мере возникновения новой напряженности и ухудшения отношений между другими кликами и империалистической Японией, угрожающей существованию Республики." # The Xinhai Revolution, led by Dr. Sun-Yat Sen, was a revolutionary against the Qing Dynasty in 1911-1912. Sun returned from exile and declared the Northern Expedition in 1924, Sun died unexpectedly, leading to a split in the Kuomintang between Chiang Kai-Shek and Wang Jingwei. Chiang won the power struggle and continued the Northern Expedition, resulting in initial successes for the Kuomintang but ultimately leading to a stalemate between the three largest Chinese cliques.\nAs new tensions arose and souring of relations between the other cliques, and an imperialist Japan threatening the existence of the Republic.

