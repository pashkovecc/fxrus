 KMT_national_populist_party: "Гоминьдан - ЧжунТэДжу" # KMT - ZhongTeJu
 KMT_national_populist_party_long: "Гоминьдан\n§gКитайская националистическая партия§!\n§LНеофициально называемая Цзюньтун, небольшая подпольная разведывательная ячейка была создана ныне печально известным мастером шпионской деятельности Гоминьдана Дай Чуньфэном. Отойдя от своих баз мимо дружественных линий, они воображают себя «анонимными героями», которых история не запомнит, кроме окончательного триумфа их революции. Большая часть их высшего руководства происходит из клики выпускников Вампоа, известной как «Лига десяти», ультранационалистической группы, связанной с организованной преступностью. Тем не менее, было бы неразумно называть их простыми гангстерами - они, как известно, ищут соратников (желающих или нет) как высокопоставленных, так и низших, начиная от католических кардиналов и заканчивая оперными певцами и плейбоями из высшего общества. Хотя это не прямая угроза, к растущему охвату ЧжунТэцзюй не следует относиться легкомысленно.§!" # Kuomintang\n§gChinese Nationalist Party§!\n§LInformally referred to as the Juntong, a small underground intelligence cell has been established by the Kuomintang's now infamous spymaster Dai Chunfeng. Fanning out from their bases past friendly lines, they fancy themselves as \"anonymous heroes\" who will not be remembered by history except for their revolution's ultimate triumph. Most of their senior leadership stem from a clique of Whampoa graduates known as the \"League of Ten\", an ultranationalistic group with ties to organised crime. Still, it would be unwise to dismiss them as mere gangsters - they have been known to seek associates (willing and otherwise) high and low, ranging from Catholic Cardinals to opera singers to high society playboys. Although not a direct threat, the growing reach of the ZhongTeJu should not be taken lightly.§!
# 三民主義力行社
