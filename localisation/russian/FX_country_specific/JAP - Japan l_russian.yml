 #Redux Tree 
 JAP_alliance_triumphant: "Domei Triumphant" #NT!
 JAP_alliance_triumphant_desc: "The new Hokubu Domei is finally successfull with its honourable goal to cast down the wrong pretenders strangeling. Our proud nation won't beneath the boot of the military puppets within the false government. We will restore our true Japanese democracy under the wise guide of our benevolent leader, Tokugawa Iesato. He will lead our nation into a free and prosperous future." #NT!
 JAP_great_council_of_state: "Daijo-kan" #NT!
 JAP_great_council_of_state_desc: "The Daijo kan was the highest organ of the old Japanese Imperial Government.  We will restore the Institution to its former glory which will involve all aspects of its legal code and governing structure. This will secure the stability and effectiveness of our government in the future to come. " #NT!
 JAP_restore_ritsuryo: "Restore Ritsuryo Code" #NT!
 JAP_restore_ritsuryo_desc: "The old Ritsuryo Code was established as a law system based on Confucianism and Chinese Legalism in our great Empire. It was a rigorous adminsitrative system wich defined both the criminal code and the administrative code. Together with the restoration of the Daijo-kan, we should return to this old imperial legal system upon which the very foundation of our imperial legacy was built. It is necessary that we reform and restore this codex into a new modern institution that will guide oir nation forwards." #NT!
 JAP_empower_shogunal_authority: "Empower Shogunal Authority" #NT!
 JAP_empower_shogunal_authority_desc: "The Shogun has served as the protector of Japan for ages and our nation saw a almost unparalleled golden age under the last Shogunate. We need to amend the mistakes of the past and empower the Shogun to lead our nation again into a better future." #NT!
 JAP_kyujidai_doctrine: "Kyujidai Reform" #NT!
 JAP_kyujidai_doctrine_desc: "The Kyujidai Reform is our great plan to reform our government along the lines of the old japanese system during the feudal era. We will bring these ideas that served as a stable foundation of our state for centuries into our new future and modernize the concept for modern times. These great reforms will lead to a truely prosperous and truely japanese state free of western influences." #NT!
 JAP_shinjidai_doctrine: "Shinjidai Reform" #NT!
 JAP_shinjidai_doctrine_desc: "The Shinjidai Reform is our great plan to reform our government along the lines of the Westminster Parliamentary System in Great Britain. It intends to create a upper and lower house, with the lower beign elected by the people. This will mean begin our transition towards the goal of a new asian democracy." #NT!
 JAP_supreme_tribunal_of_nagasaki: "Supreme Tribunal of Nagasaki" #NT!
 JAP_supreme_tribunal_of_nagasaki_desc: "After the victory of Second Northern Alliance in the political turmoil, which plagued our nation, the Councilors in Daijo-kan, led by Tokugawa Kuniyuki, together with the Diet of Japan, are urging the Shogunate to open a provisional tribunal to get rid of the hardliners of the Nationalists and Royalists and decide the fate of Imperial Navy. We will make sure that justice is brought swiftly to these unruely elements of society to secure the new state of affairs." #NT!
 jap_nagasaki_court_tt: "§YOnce your decision is chosen, you will get the following bonus: \n§!" #NT!
 JAP_the_ultranationalists: "Case: The Ultranationalists" #NT!
 JAP_the_ultranationalists_desc: "The hardliners of the nationalist block were always a thorn in our side, they are opposed to most of our reform programs and undermine us whenever possible tho their power will surely fade on its own, we need to take action now. To avoid further internal strife and escalation we need to finaly and conclusively decide on how to deal with these unruly elements" #NT!
 jap_ultranat_effect_1_tt: "Political Power Gain: §R-4%§! \nStability: §G+5%§!" #NT!
 jap_ultranat_effect_2_tt: "Stability: §R-5%§! \nWar Support: §G+5%§!" #NT!
 JAP_admiralty_question: "Motion: The Admiralty" #NT!
 JAP_admiralty_question_desc: "The admiralty of IJN has been questioned recently, Tokugawa Kuniyuki wants to take command of the fleet himself, while many within the Daijo-kan want to subject the navy to the supreme command of the Shogun, like it was already done with the army. We need to settle this dispute now to avoid future conflicts in the chain of command or even worse, treachery. While many things speak for a unified command of the army and navy under the Shogun, Tokugawa Kuniyuki is no doubt a skilled officer and would be a powerfull ally of the state." #NT!
 jap_admiralty_effect_1_tt: "Daily Command Power Gain: §G10§! \nChief of Navy Cost: §R+5%§!" #NT!
 jap_admiralty_effect_2_tt: "Chief of Navy Cost: §G-5%§! \nNavy Experience Gain: §G2§!" #NT!
 JAP_the_ultraroyalists: "Case: The Ultraroyalists" #NT!
 JAP_the_ultraroyalists_desc: "The hardline supporters of the royalists still long for their old form of government and their hereditary rights. They certainly have no place in our new Japan and we need to quell this potential danger to our government as soon as possible to prevent future conspiracies or worse." #NT!
 jap_ultraroy_effect_1_tt: "Popularity Drift Defense: §R-5%§! \nConsumer Goods Factories: §G-3%§!" #NT!
 jap_ultraroy_effect_2_tt: "Popularity Drift Defense: §G+5%§! \nDivision Attack on core territory: §G+3%§!" #NT!
 JAP_tribunal_final_phase: "The Last Answer" #NT!
 JAP_tribunal_final_phase_desc: "After all major cases and problems were decided in the court, all waits for the Shogun to finalize the results of the Supreme Tribunal." #NT!
 JAP_restore_han_system: "Restore the Han System" #NT!
 JAP_restore_han_system_desc: "The Han system gave the local domains the landlords, better known as Daimyo, has the power over their respective people and land, which were in turn bound to support or at least be neutral towards their Shogun we will restore this system of decentralised organic government." #NT!
 JAP_restore_military_authority: "Restore Military Authority" #NT!
 JAP_restore_military_authority_desc: "The command of the army is a very important and powerful position which allowed the commanding officers to gain significant influence. We can not accept this status quo, before the fall of the old Shogunate, the Shogun was the head of the army and we will make sure he takes the power back from the officers and again assumes a leading military role." #NT!
 JAP_guilty_of_former_shogun: "Sin of Former Shogun" #NT!
 JAP_guilty_of_former_shogun_desc: "The last Shogun, Tokugawa Yoshinobu was not able to secure the legacy of the Tokugawa by letting the government fall to the insidious powers of the Sonno Joi movement. This lead Japan away from its right path and destroyed what generations had built before him. We will not forget his mistake while we work continously to right the wrongs of the past." #NT!
 JAP_reform_kazoku_law: "Reform Kazoku Law" #NT!
 JAP_reform_kazoku_law_desc: "The Kazoku Law was enacted during the Meiji Period and was part of its constitution. It allowed the Samurai Class to become a more westernized noble class which holds significant powers in the upper House of the japanese Diet. We will reform this old law to curb the influence of this class with the British example of the House of Lords serving as our inspiration." #NT!
 JAP_next_bastion_of_democracy: "Next Bastion of Asian Democracy" #NT!
 JAP_next_bastion_of_democracy_desc: "Japan will become a shining example of democracy in Asia, by embracing a traditional japanese way of rule under the government of our wise leadership. In the name of our people we will bring our nation towards a new golden age and be an example to those around us." #NT!
 JAP_new_legacy_of_iesato: "New Legacy of Iesato" #NT!
 JAP_new_legacy_of_iesato_desc: "The legacy of the Tokugawa Shogunate was destroyed by Tokugawa Yoshinobu, the last reigning Shogun and adoptive father of the new Shogun. He was weak and not able to stop the Sonno Joi Faction. Iseato however, a man of democracy and progress will make sure that the mistakes of the past will not be repeated, he will save the Shogunate from extremism and bring Japan on the right path towards a new glorious future." #NT!
 JAP_report_to_the_emperor: "Report the Emperor" #NT!
 JAP_report_to_the_emperor_desc: "The necessary works are done, the state is secured and order is restored, we achieved every goal we had as a transitional government. Now there is only one thing left, someone needs to acknowledge and formalize the new order, we will contact the Emperor and request his official support to our new state." #NT!
 JAP_long_live_the_shogunate: "Long Live the Shogunate" #NT!
 JAP_long_live_the_shogunate_desc: "The shakey transitional period is over, our state is secure and the economy is finally starting to recover. It seems like we weathered the storm and brought Japan back on the right path. We should celebrate this great rebirth of our Nation." #NT!
 JAP_iesato_government: "Iesato Government" #NT!
 JAP_iesato_government_desc: "The Shogun will declare the appointment of the Left Minister of State (Sa-daijin), the senior assistant of Chancellor of State or Daijo-Daijin, within our government to several minister and government positions. The new administration will work under the guidelines of the Left Minister of State. Only one question remains now, who will be the next leader of the government?" #NT!
 JAP_mikawahan_faction: "Mikawa-han Faction" #NT!
 JAP_mikawahan_faction_desc: "The Mikawa-han (Mikawa Faction) are the group of moderates and progressives working under the leadership and guideline of Shogun Iesato. They are named after the ancestral home of the predecessor of the Tokugawa Clan, the Matsudaira clan, which they were served as the Daimyo of domain of Mikawa in Nagoya." #NT!
 JAP_left_learning_doctrine: "Left-Learning Doctrine" #NT!
 JAP_left_learning_doctrine_desc: "To achieve our goal of a better Japan we need fundamentally change our nation in many aspects and while we can never forget the great Japanese spirit, it is true, that the common man has suffered long enough. We shall take inspiration from the many socialist movements around the world and take a more left-wing doctrine to bring our nation into the future. There is a lot of work to be done." #NT!
 JAP_rural_urbanization: "Rural Urbanization" #NT!
 JAP_rural_urbanization_desc: "Times are changing and with the ever increasing industrialisation of our nation, the rural areas are faling behind. We need to make sure that we modernize every corner of the home islands and encourage urbanisation and bring an end to these rural backwaters. We will invest into the development of local settlements and cities so people are enoucraged to move to the new urban centers." #NT!
 JAP_municipality_promotion_act: "Municipality Promotion Act" #NT!
 JAP_municipality_promotion_act_desc: "This system of local self governance will allow smaller towns and cities to manage taxation and other local issues themselves. This makes the regions flexible and reaction times towards pressing or local issues shorther and more efficient. The self governance will allow these settlements to use their resources for their specific needs and help the rejuvination of these smaller urban areas." #NT!
 JAP_local_election_act: "Local Election Act" #NT!
 JAP_local_election_act_desc: "The local election system will further improve our decentralised system of government, strengthen the democratic institutions and help voters to easily participate in the democratic state. Together with the Municipality Act, the local institutions will be significantly stronger which will also help us with our demonopolisation efforts and gain us much support from the people." #NT!
 JAP_prusso_americanism_abolishment: "The End of Prusso-Americanism System" #NT!
 JAP_prusso_americanism_abolishment_desc: "Prussian Constitutionalism and the Two-Party System inspired by the american system were the main reasons that Taisho democracy failed. We need to get rid of this model and replace it by a westminster style of government to secure democracy in Japan. To achieve this, vast and sweeping reforms will be needed." #NT!
 JAP_peoples_power_strengthen: "Strengthen the People's Power" #NT!
 JAP_peoples_power_strengthen_desc: "We need to support our greatest ally, the common people of Japan. Their collective voice shall be heared throughout the nation and we must make sure to properly support them to gain their allegiance to our government. Change will come through the collective will of the Japanese man and we will aid them wherever we can." #NT!
 JAP_deconfuciusization: "De-Confuciusization" #NT!
 JAP_deconfuciusization_desc: "Japanese education is filled with Confucianism ideas and philosophy which is not befitting of our Japanese nation anymore. Confucianism is made to uphold chinese social values and is anti-egalitarian, this is contrary to our new approach to social questions and therefore we must work to purge our nation from these archaic foreign influences" #NT!
 JAP_seigaku_education_reform: "Seigaku Education Reform" #NT!
 JAP_seigaku_education_reform_desc: "Seigaku, also known as Rangaku or \"Dutch Learning\" around first Tokugawa shogunate, describes western books and knowledge which was forbidden in the  early Tokugawa period. The ban was lifted in 1720 and lead to the studying of these new ideas which allowed Japan to enter a golden era of scientific and cultural advancements. Our new education should strife towards the ideals of these times instead of the old Confucianism ways of isolation and backwardness." #NT!
 JAP_electoral_reform: "Electoral Reform" #NT!
 JAP_electoral_reform_desc: "Our nation needs to reform the electorial process towards a fair, efficient and standardised procedure which will ensure the smooth running of our democratic state. We will need to implement a new institution to oversee the process and make the  process and impact of our elections fair and reasonable." #NT!
 JAP_universal_suffrage_act: "New Universal Suffrage Act" #NT!
 JAP_universal_suffrage_act_desc: "To enforce a true democracy for Japan, it is important that every person can cast their vote for our elections, we should no longer hold any predjudice based on class, wealth or sex. With this decree, every citizen in Japan who is of age will be able to cast his vote in the coming election and those to follow. This will certainly make sure to endear our government to the common people and untilize the full strengh of a democratic movement -the people." #NT!
 JAP_to_the_new_golden_age: "To the New Golden Age" #NT!
 JAP_to_the_new_golden_age_desc: "Tokugawa Iesato and the Mikawa-Han faction managed to heal our nation and better the lifes of the common man. The nation is healing from the troubles of the past and looking towards a bright and free future as a bastion of democracy and rule of law. Already the economy is beginning to boom and the people are beginning to taste the fruits of their labour. Japans future is looking bright." #NT!
 JAP_oniwahan_faction: "Oniwa-han Faction" #NT!
 JAP_oniwahan_faction_desc: "Oniwa is a reference to the park behind Edo castle and is the name of the Conservatives and Traditionalists faction within the Northern Alliance. They work under the guidelines of Tokugawa Kuniyuki, who is widely regarded as the Kingmaker, Daimyo of Mikawa and Junior Elder (Wakadoshiyori), and supporter of the government of Tokugawa Iesato." #NT!
 JAP_believe_the_kingsmaker: "Believe The Kingmaker..." #NT!
 JAP_believe_the_kingsmaker_desc: "We should trust the reasoning of the wise Kuniyuki who is responsible for our great success so far. His voice of reason and conservatives, sometimes even traditionalist, line of though has proven to be correct so far and under his guide we will lead Japan to greatness." #NT!
 JAP_reinstall_dismissals: "Reinstall the Dismissals" #NT!
 JAP_reinstall_dismissals_desc: "Many descendants of the former Daimyo families, who largely lost their old power and influence, are still living here in Japan. We should give back these noble ancient families their power that they held before to secure a loyal upper class for our government." #NT!
 JAP_military_disintegration: "Military Disintegration" #NT!
 JAP_military_disintegration_desc: "The Daimyos are a central part of our governing structure and form a new supportive upper class. we should decentralise the army away from the control of the officers towards these Daimyos who will serve as regional miitary commanders, who will have the control over the military of their specific prefecture. This will make our military more specialised on the specific tasks of the region and prevent one man from holding too much influence within the armed forces. The Daimyos will surely be greatfull for this ancient right to be given back to them and the Shogun will now be able to call upon a new warrior aristocracy." #NT!
 JAP_uphold_prefecturare_imperium: "Uphold Prefecturare Imperium" #NT!
 JAP_uphold_prefecturare_imperium_desc: "Prefecturare Imperium, or Military Provincial Command, is the latin term for regional military commander's power over their army. To show that the power of military that was before in the hand of corrupted general is now decentralized and evenly distributed to the specialised military officer and new Daimyo. This is the guarantee that the military plots against the nation will be wiped out and the loyalty is lying to the correct institute." #NT!
 JAP_and_constitution: "...and Constitution" #NT!
 JAP_and_constitution_desc: "The constitution is highest power of law in nation of Japan, the context give the power of rule with law in the islands and country. Now the power of the constitution and Ritsuryo will be preserved and protected under the Shogun and his loyal servants and officers" #NT!
 JAP_kuniyuki_blueprint: "Kuniyuki's Blueprint" #NT!
 JAP_kuniyuki_blueprint_desc: "Kuniyuki's Blueprint is the secret project by Lord Kuniyuki to prevent the infiltration from both hardliner and foreigner inside the Shogunate's administration and proving the loyalty of suspicious officers, by forming intelligence agency under administration of himself." #NT!
 JAP_bureaucrat_reform: "Bureaucrat Reform" #NT!
 JAP_bureaucrat_reform_desc: "The Japanese bureaucracy must follow the Shogunate rather than local influences or third parties." #NT!
 JAP_fudai_toza_restoration: "Fudai-Toza Restoration" #NT!
 JAP_fudai_toza_restoration_desc: "Fudai and Tozama daimyos were the system adopted by Tokugawa Shogunate to seperate the loyal domains (Fudai) and neutral or secretly opposed the Tokugawa government (Tozama). To secure the stability of Daijo-kan, we will get this system back on the line and select the most loyal officer to serve in the sacred Daijo-kan" #NT!
 JAP_progressive_advancement_backsliding: "Development Rate Recession" #NT!
 JAP_progressive_advancement_backsliding_desc: "The progressive advancement drops after Kunikuki became official Left Minister of State, the conservative figure of Oniwa-han in Northern Alliance. He will adopt more feudalism into the modern Japanese nation-state to restore one, true, absolute Tokugawa Shogunate" #NT!
 JAP_suffrage_of_chosen_one: "Suffrage of the Chosen One" #NT!
 JAP_suffrage_of_chosen_one_desc: "The suffrage right that was given to almost everybody in the nation is another reason of falling of Taisho democracy. The failures of the system, such as the illiterates, the degenerates, or the juniors, aren't worth for the right of choosing the representative, only men can do. We will adopt the abandoned Ezo Republic's suffrage right that allowing the men can elect the reliable person to represent them." #NT!
 JAP_to_our_nostalgic_period: "To our Nostalgic Period" #NT!
 JAP_to_our_nostalgic_period_desc: "The Kuniyuki's doctrine is the correct path for the future of Shogunate. The walking path that made by him is full of nostalgic feeling that was in only first Tokugawa Shogunate, but now we all can feel this feeling again in the contemporary world." #NT!
 JAP_imperial_power_question: "Imperial Power Question" #NT!
 JAP_imperial_power_question_desc: "There is the question amongs the lawmaker and councilors, that's about the borderline of Royal Prerogative and Shogunal Prerogative in Rules and Laws in Contitution and Ritsuryo. What is the answer of this situation?" #NT!
 JAP_learning_from_taisho_era: "Lesson from Taisho Democracy" #NT!
 JAP_learning_from_taisho_era_desc: "We all have learnt from the past when people couldn't protect the right of choosing people to rule and represent them. The politicians weren't always do as they promised and push the people on the void of dismay. What is the solution that we can learn from it?" #NT!
 JAP_kokutai_minshu_unity: "Kokutai-Minshu Unity" #NT!
 JAP_kokutai_minshu_unity_desc: "Kokutai or National Body is the old Confucianism term referring the main structure of national governance. We are surely accepted the emperor of our greatest Japan is Kokutai, as we must protect his majesty at all cost. Meanwhile the Minshu or people means the common men of Japan. The unity between Imperial House and People had been severed by heavenly mandate dictated by militarists, we need to choose how we can do for bring two institutes back together?" #NT!
 ## 
 JAP_sgrp_foreign_tree: "On the World Stage" #NT!
 JAP_sgrp_foreign_tree_desc: "The nation is now awaken from the ashen hell with the assistance of people and alls. On the next step to being the nation of the world, we need to do something. That's the foreign politics." #NT!
 JAP_expansionism: "Expansionism" #NT!
 JAP_expansionism_desc: "After we had stabilized the internal politics of our nation, we need to look outwards to the wider world. In the past we made mistake of shutting us off from the outside world, which left us weak and isolated. We can not repeat this error, no it is vital that we secure a true area of influence for ourself, a true empire. It is our right by strengh to act into the best interest of our nation and to preemptively strike our enemies. A new age of Expansionism will dawn upon Japan" #NT!
 JAP_socialist_weltpolitik: "Rote Weltpolitik" #NT!
 JAP_socialist_weltpolitik_desc: "The socialist revolution must not have been stopped only in the island, to make sure the imperialism and reactionary will be completely wiped out from Asia, the worldwide revolution is needed." #NT!
 JAP_approach_germany: "Approach Berlin" #NT!
 JAP_approach_germany_desc: "At the day of sick Eagle has been arisen from the turmoil of corrupted democracy, we saw an oppotunity to join them as the important ally. On the furthest side of the Eastern Hemisphere, the great Dragon will dance around the sky and join the pack of Eagle, to conquer over the world." #NT!
 JAP_join_our_own_ally: "In Respect the Anglo-Japanese Treaty" #NT!
 JAP_join_our_own_ally_desc: "When the Russian was full of aggressive and has threatened toward us, we are all alone in the sea of Pacific. Only ally we can struggle to have them on the side of us is the England. But the years passed, we are all like unknown to each other. But with the only fracture remains in the sea of forgotten memory, the Anglo-Japanese Alliance, we will be the best friend again." #NT!
 JAP_our_own_way: "Our Own Way" #NT!
 JAP_our_own_way_desc: "No one can trust or be trusted. There is no perpetual friend or enemy. Path of being alone will make us be stronger than before." #NT!
 JAP_asian_entente: "Asian Entente" #NT!
 JAP_asian_entente_desc: "The socialist revolution in Russia is not pure as it was anymore. Since the death of Lenin, no one can replace him as the greatest man and leader of socialist revolution. We will create the great bloc of socialism revolutionary vanguard to liberate every man from shadow slavery. With everything we have, the evil must be gone." #NT!
 JAP_approach_russia: "Approach Moscow" #NT!
 JAP_approach_russia_desc: "At the day when the reactionary died in the hand of people gun, the authority is no longer single entity anymore. This is the way of people we needed. We believe the Soviet Union is the only friend we need for the next step of worldwide revolution." #NT!
 JAP_east_west_liaison_office: "East-West Liaison Office" #NT!
 JAP_east_west_liaison_office_desc: "In the war time, the uncomfortable or unexpected situation can occur every time. To make sure we can surpass those situations, the harmony and unity is needed. The liaison office is the best choice of making the unity of alliance." #NT!
 JAP_overseas_affairs_office: "Overseas Affairs Office" #NT!
 JAP_overseas_affairs_office_desc: "The Overseas Affairs Office (OAC, Kaigai-mufu), is the semi-independent agency under the administration of Chancellor of State and U-daijin (Right Minister of State). Formed by the merging of ministry of colonial affairs and ministry of foreign affairs. To make sure the colonial administration will have fully contacted between government and colonial agencies." #NT!
 JAP_comintern_cooperative_office: "ComIntern Cooperative Office" #NT!
 JAP_comintern_cooperative_office_desc: "In the war time, the uncomfortable or unexpected situation can occur every time. To make sure we can surpass those situations, the harmony and unity is needed. The cooperative office is the best choice of making the unity of alliance." #NT!
 JAP_mobilize_kantogun: "Mobilize Kanto-gun" #NT!
 JAP_mobilize_kantogun_desc: "After the long battle in Manchuria and ended up with we lost all of colonies while the Hokubu's government has been installed. The remnants of Kanto-gun are now recognized us as the legitimate government and prepare for the next command. It's time to bring our right back to the right hand." #NT!
 JAP_dismantle_chinese_warlord: "On the Way to Central Plains" #NT!
 JAP_dismantle_chinese_warlord_desc: "The Chinese nation are fractured and weakened by itself. The Sino culture has been destroyed and preserved at the same time by the revolutionary and military. To restore the right government, the final battle of unification is now begun." #NT!
 JAP_toward_pacific: "Toward Pacific" #NT!
 JAP_toward_pacific_desc: "The Pacific is our next stage in great game and golden oppotunity, the United States and Britain have nothing to do with our rightful territory. The Pacific must have only protector, that is us." #NT!
 JAP_toward_north_america: "Operation Ikan Bridge Crossing" #NT!
 JAP_toward_north_america_desc: "The Americans are a threat to us since they forcefully ended our era of isolation. They see the Pacific as their lake and Japanese interests will always have stand in the shadow of American Imperialism. We need to begin final strike against the American beast and secure our interests in the Pacific." #NT!
 JAP_reclaim_our_colony: "Reclaim Our Colony" #NT!
 JAP_reclaim_our_colony_desc: "We need to reclaim or old glory and reconquer the lost colony of Korea. It is vital for our interests to secure the peninsula and many Japanese leaders have tried it before. The loss of this Colony is a great tragedy and regaining it will cement the legitimacy of our leadership." #NT!
 JAP_pressure_bangkok_authority: "Pressure Bangkok Authority" #NT!
 JAP_pressure_bangkok_authority_desc: "Bangkok needs to submit to our new emerging power block in Asia. We will send our final ultimatum to their authorities, so that they may choose their fate." #NT!
 JAP_toward_indochina: "Operation Nantei" #NT!
 JAP_toward_indochina_desc: "The French currently occupy much of Indochina, however the grip as weal and central Europe is becoming ever more unstable. We may have a chance of securing our interests in the south and liberate the Indochinese States from european occupation." #NT!
 JAP_toward_indian_subcontinent: "Demand Subjugation from India" #NT!
 JAP_toward_indian_subcontinent_desc: "India was the jewel of the European colonizers, but no longer anymore since we will liberate them from their opressors, false allies and misguided leaders. Their people will soon come to understand the great Pan-Asian dream we are building and India will play a key strategic rule within this new world we are forging. Our man are ready and our leadership is steadfast, today we demand from the Indians their total subjugation to freedom." #NT!
 JAP_take_over_primorye_commission: "Take Over the Primorye Commission" #NT!
 JAP_take_over_primorye_commission_desc: "The power struggle in Primorye Commission must end. We are not tolerate to the soft policy we've made to maintain the American influence anymore. The ultimatum is our final answer for the Commission." #NT!
 JAP_strike_vladivostok: "Strike the White Russia" #NT!
 JAP_strike_vladivostok_desc: "The old land, once ruled by Jurchen people has long held contact and good trading relations with Japan. The Russians took it and colonized it, it is only natural that we can not accept russian imperialism in our backyard, we defeated Russia numerous times already, so it will be easy to retake this land for ourselves." #NT!
 JAP_toward_mongolia: "Toward Mongolia" #NT!
 JAP_toward_mongolia_desc: "Mongolia, home of the largest empire the world has ever seen lies to our far west, today it is only the playground of greater powers in Asia, however for us, it will form a formidable bulwark against western expansion into our sphere. Mongolia will serve as a deterance and staging ground for actions against the Russians and bring us much needed breathing space." #NT!
 JAP_end_red_scare: "End the Red Scare" #NT!
 JAP_end_red_scare_desc: "The Soviet Union is the devil in disguise, they abused the power of people by confiscating the rations and supplies from their citizen and claiming this is for everyone. While they just took it all and gave to the elites. We are not tolerate for this kind of socialist joke anymore. We will correct this." #NT!
 JAP_claim_xinjiang_tibet_hegemony: "Claim Hegemony over Dzungar-Lhasa" #NT!
 JAP_claim_xinjiang_tibet_hegemony_desc: "The Dzungar Khanate was a large rival empire to the Quing which streched from Dzungaria to Lhasar. We shall claim hegemony over these lands in the name of our great Pan-Asian project. The Area will serve as a vital western bulwark for us and connect our holdings in Asia." #NT!
 ## 
 JAP_grand_triumvirate: "The Grand Triumvirate" #NT!
 JAP_grand_triumvirate_desc: "The Northern Alliance is in the chaotic circumstance after the death of Tokugawa Iesato, the 16th Tokugawa Shogun and Taikun of Japan. The fractured is on the surface, everyone chooses their own master or ally. Everyone seeks to be next master of the Shogunate. The main supporters of late Shogun, such as Tokugawa Kuniyuki, Daimyo of Mikawa and leader of conservative Oniwa-han, Nakano Seigo, the Kanjou Commissioner, and Inoue Nissho, the Nichiren priest and Edo Shugoshoku, bring their own allies to the Edo Castle to decide the future of Shogunate." #NT!
 JAP_meeting_of_three_officials: "Meeting of Three Officials" #NT!
 JAP_meeting_of_three_officials_desc: "The great officers of Daijo-kan are in the seat of power in Edo Castle, confronting each other with the ideal of creating their own favoured regime. The nationalists, the theocratic pan-Asianists, and the traditionalists, has argued about the next leader of Shogunate. With only way they can fight with free and fair, it is the election." #NT!
 JAP_the_kingmaker_assumed_shogunate: "The Kingmaker Assumes the Shogunate" #NT!
 ## 
 JAP_the_kingmaker_assumed_shogunate_desc: "The true heir dominates the Daijo-kan and Shogunate. No one could oppose him anymore, with the power of justice and sea. The Kingmaker shall make his own nation with the ideal of being the great shogunate, surpassing even Toyotomi Hideyoshi and Oda Nobunaga, the great unifier." #NT!
 JAP_integrate_ancient_laws: "Integrate Ancient Laws" #NT!
 JAP_integrate_ancient_laws_desc: "The Tokugawa Shogunate issued many wise decrees in the past. In our effort to restore Japan to its former glory, we will try to integrate these decrees into our modern Lawcode to guide our nation forward, as the Shoguns of old intended." #NT!
 JAP_extend_navy_budget: "Extend Navy Budget" #NT!
 JAP_extend_navy_budget_desc: "The power of navy is an importance factor of being the great shogunate. Our navy must be overpowered and large." #NT!
 JAP_embrace_neo_confucianism: "Embrace Neo-Confucianism" #NT!
 JAP_embrace_neo_confucianism_desc: "Neo-Confucianism has become the main ideology for Mito-gaku, or Mito School since time immemorial. Our shogun, Kuniyuki, as Lord of Mito-Tokugawa house and the final author of Dai Nihonshi, he believes the Neo-Confucianism is the absolute guidance for being the great and respected shogun. The rites is to show the morality and virtues can be materialized and visible to people, as we must follow this. The nation of Japan will be known as the good nation in the sense of Confucius for sure." #NT!
 JAP_shin_fukoku_kyohei: "Shin Fukoku Kyohei" #NT!
 JAP_shin_fukoku_kyohei_desc: "The Meiji era is ended and our army was weakened via lacking of supplies for nearly a decade. With everything we have, the people, the factory, the military, we must unite and create the next wave of Fukoku Kyohei." #NT!
 JAP_subordinate_democracy: "Subordinate Democracy" #NT!
 JAP_subordinate_democracy_desc: "The democracy is weak and full of loopholes. Making our nation fall from grace and strong. We will call up the Imperial Diet of Japan and reduce their legislative power. Because shogun known what is best for his state." #NT!
 JAP_rebuild_the_commissions: "Rebuild the Commissions" #NT!
 JAP_rebuild_the_commissions_desc: "Commissions or Bugyo was the government agencies of Shogunate functioned similar to modern ministry or department. To centralize the power of administration, the role of cabinet will be absorbed into the Commissions under Daijo-kan, and directed by Shogun as Chancellor of State" #NT!
 JAP_make_parliament_our_rubberstamp: "Turn the Diet To Rubberstamp" #NT!
 JAP_make_parliament_our_rubberstamp_desc: "The diet was called, everyone starts to listen. The national legislation from mass must be stopped, with only the professional from Daijo-kan is enough. The diet will turn to be our rubberstamp diet, and everybody must be appointed by us." #NT!
 JAP_samurai_code_of_law: "Samurai's Code of Law" #NT!
 JAP_samurai_code_of_law_desc: "Samurai has the political moral to guide them on the way of national governance. With the rule of law by Samurai-class, the justice of our nation will be secured" #NT!
 JAP_send_parliament_to_hell: "Send Parliament to Hell" #NT!
 JAP_send_parliament_to_hell_desc: "The diet was called, everyone starts to listen. The national legislation from mass will be ended today. From now the Daijo-kan will take charge for legislation for sake of our future." #NT!
 JAP_purge_the_old_politicians: "Purge Old Politicians" #NT!
 JAP_purge_the_old_politicians_desc: "The old men in the court couldn't do the great work anymore. They are weak and one step before grave. There is nothing they can do for us. Only place they can live from now is six-feet below the mortal's realm." #NT!
 JAP_taiheiyo_circuit_development: "Taiheiyo Circuit Development Project..." #NT!
 JAP_taiheiyo_circuit_development_desc: "Taiheiyo Belt is main megalopolis in Japan with the large amount of population and industry. The economy in our nation relies on this region's industry. Building and investing the factory in this region could make our nation to be more strong in economic aspect." #NT!
 JAP_under_supervision_of_government: "...Under the Supervision of Government" #NT!
 JAP_under_supervision_of_government_desc: "Taiheiyo Circuit Development Project must be supervised by us. It's for sake of our nation." #NT!
 JAP_nationalize_the_public_company: "...Or By Nationalize the Public Companies" #NT!
 JAP_nationalize_the_public_company_desc: "The Shogun, by advise of Kanjou Commission, will nationalize the infrastructure-related construction companies under previous government and cooperate with Zaibatsu to help in TCDP." #NT!
 JAP_samurai_zaibatsu_megacollab: "Samurai-Zaibatsu Megacollaboration" #NT!
 JAP_samurai_zaibatsu_megacollab_desc: "After the cooperation between Shogun and Zaibatsu is ending with better relationship, we will ensure the economy from now is going to be secured." #NT!
 JAP_shogunate_industry: "Shogunate Industry" #NT!
 JAP_shogunate_industry_desc: "Father knows what is the best for his state, also Shogun does too. With the industry made by political samurai, professional economist samurai, perhaps we can call it the Samurai Industry." #NT!
 JAP_increase_navy_size: "Increase Navy Size" #NT!
 JAP_increase_navy_size_desc: "On the way of being the overlord of Asia, only army isn't enough. The navy that we've built since Meiji era, we will improve them, we will increase more naval power." #NT!
 JAP_absolute_naval_power_state: "New Maritime Nation of Far East" #NT!
 JAP_absolute_naval_power_state_desc: "After the expansion of Shogunal-Imperial Navy, we now prepare to proclaim ourselves the New Maritime Nation." #NT!
 JAP_extend_military_technology_budget: "Extend Military Technology Budget" #NT!
 JAP_extend_military_technology_budget_desc: "The military technology is important for the national army, every steps for military technology advancement means the improvement of army quality." #NT!
 JAP_even_military_can_run_business: "Even Military Can Run Business" #NT!
 JAP_even_military_can_run_business_desc: "Everyone thought the muscle-head man did nothing only than using strength to solve everything. Who knows even military can run the business." #NT!
 JAP_long_live_true_justice: "Tenkoku Rakka, Seigi Keizoku" #NT!
 JAP_long_live_true_justice_desc: "Because the nation is full of lies and deceits, the justice must be rebuilt and preserved as one true guide of Shogunate. Let the justice be done, though the heaven falls. Tenkoku Rakka, Seigi Keizoku." #NT!
 ## 
 JAP_the_manager_assumed_shogunate: "The Manager Assumes the Shogunate" #NT!
 JAP_the_manager_assumed_shogunate_desc: "The Showaist Nationalists has victory over every factions in Daijo-kan. The Manager, Nakano Seigo, was prohibited by Tokugawa clan, as they claimed to be protector of Shogunal throne, to be the next Shogun and Taikun of Japan. Seigo has predicted was going to happen as becomes Chancellor-elect of Daijo-kan. Thus he had planned something to kick off the enemies before his throne will be taken forever." #NT!
 JAP_restoration_of_shikkenate: "Restoration of Shikkenate" #NT!
 JAP_restoration_of_shikkenate_desc: "The Shikkenate is the thing for somebody who wants to surpass his master, the Shogun. The Shikkenate was firstly appeared in the Kamakura Shogunate when the mistress from Hojo clan can gain enough legitimacy as mother of Shogun to transfer the ruling power of her Hojo clan. Giving then-leader of Hojo clan being de facto leader of Japan and probihit Shogun to do his work. Instead the power has tranferred to title of Shikken, the Shogun's regent, until fallen of Hojo clan. Now, in the era of Taisho, the shogunate has been restored and the good man has died, the political situation inside Daijo-kan is far more than we could tell it is complicated. The Tokugawa wants nobody rather than themselves to become Shogun. Meanwhile the Manager, Nakano Seigo, becomes the Chancellor-elect for Daijo-kan, the thing is gone worst because no one wants the synthetic nationalism theorist to rule the nation. But he has another trump card to bypass the complexity, that's the Shikken." #NT!
 JAP_land_reform_program: "Land Reform Program" #NT!
 JAP_land_reform_program_desc: "Land reform program is the first step of new Japanese industrial era. Since long times ago, the land serves almost no purpose rather than producing the agricultural products. When the time changed, the factory came along with destroying of the ancient purpose. Now we are seeking the mutual profit of both agriculture and industry, therefore the preservation is needed. The land reform program will be the main regulation for both farmers and capitalists to prevent the single-purpose-used land." #NT!
 JAP_deal_with_landowners: "Deal with Landowners" #NT!
 JAP_deal_with_landowners_desc: "In order to rebuild a fair Japanese economy, we need to deal with the large landowning class. The redistribution of lands needs to be fair and we will evaluate if the land is truely needed and used by its owner and compensate them if we decide to redistribute it. This deal should prevent large scale unrest and further help our growing economy." #NT!
 JAP_fund_local_factory: "Fund the Local Factories" #NT!
 JAP_fund_local_factory_desc: "Instead of relying on single large megacorporations, we should fund the local industry. This will not only secure jobs and develop the region, it will also help to break the monopoly of large corporations and diminish the influence of the ruthless capitalist class." #NT!
 JAP_agricultural_reserve_area: "Agricultural Reserve Area" #NT!
 JAP_agricultural_reserve_area_desc: "Agricultural Reserve Area serves as the solution for Agricultural-Industrial parallel economy. We will keep some of the unoccupied land or the land that recently has no new owner for farmer who wants to increase their productivity by renting these lands. This area must not serve as the land for industrialized." #NT!
 JAP_decrease_agricultural_area_tax: "Reduce Agriculture Zone Tax" #NT!
 JAP_decrease_agricultural_area_tax_desc: "Every single areas deserved the right of reducing the land tax if they are only for agricultural crops or goods. It's for balance the percentage of existence of industrialized factory and farmland." #NT!
 JAP_local_cooperative_center: "Local Cooperative Center" #NT!
 JAP_local_cooperative_center_desc: "Local Cooperative Center is land agency directed by Shikken of Japan to prevent the capitalist from owning a huge portion of land and manage the local taxation for the government. At the same time, those directors in LCC are the commissioner for Shikkenate to direct the policy and head the local police force to investigation of suspected treason" #NT!
 JAP_appoint_lcc_reg_overseer: "Appointment the LCC's Regional Overseer" #NT!
 JAP_appoint_lcc_reg_overseer_desc: "The choice of what department will take responsible on appointment the LCC's Regional Overseer, the official director of LCC, between the committee of Imperial Diet or Shikkenate Cooperative Directory, the secretariat of Shikken" #NT!
 JAP_farmer_bureaucracy: "Farmer Bureaucracy" #NT!
 JAP_farmer_bureaucracy_desc: "The bureaucracy built by Bourgeoisie is full of corruption and deceit, Shikken won't let this kind of system to be alone functioning to suppress the farmer, labor, worker or any lower class. The Farmer Bureaucracy (Noumin Ganryousei) must be established to be counter-measure of the middle-class bureaucracy" #NT!
 JAP_yamato_land_for_yamato_man: "Yamato Land for Yamato Man" #NT!
 JAP_yamato_land_for_yamato_man_desc: "It's indeed that our ancestral land has left is only for us, the Yamato children. They had left this land for the next generations and preserved continuity of sacred imperial bloodline. As we must do the same as we need to protect our homeland and our emperor. The sacrifice must be made. Nippon Teikoku Banzai!!!" #NT!
 JAP_open_new_arsenal: "Open New Arsenal" #NT!
 JAP_open_new_arsenal_desc: "We need a new arsenal for our army, and after long years of construction and planning, these facilities are almost ready and will soon begin producing the finest equipments for our armed forces." #NT!
 JAP_draft_new_labour_act: "Draft New Labour Act" #NT!
 JAP_draft_new_labour_act_desc: "The labour is the main factor of the continuity of economy, not only the capitalist or oppotunist behind the curtains. This law will ensure the prosperity, the privilages, the living standards, the safety, for all labours. But in the same time, the productivity must be increased synchronously with the new labour standards." #NT!
 JAP_increase_max_work_hour: "Increase Max Work Hours" #NT!
 JAP_increase_max_work_hour_desc: "We simply need more output, more productivity. The fires of Industry demand their toll. The 8 hour workday has proven to be insufficient and it is up to everybody to give the state what it needs. Therefore we need to lift these restrictions temporarily to achieve our goals of industrialisation." #NT!
 JAP_legalize_bonded_labour: "Legalize the Bonded Labour" #NT!
 JAP_legalize_bonded_labour_desc: "Our state needs to always work to the benefit of our people. Sadly some people are born with a terrible affliction of weak will and slothful lives. We will show them the joy of work and fruits of labour by government mandated work programs. They will therefore be able to repay their debt to society and have an opportunity to change for the better. These measures are sadly necessary in the most extrem cases of lazyness, degeneracy, crime and other afflictions of these people. Our state could never allow ordinary people to suffer from these leeches who need to be carried along by their fellow man." #NT!
 JAP_maximize_industrial_expansion: "Maximize Industrial Expansion" #NT!
 JAP_maximize_industrial_expansion_desc: "More! More! More! This summerizes our stance towards industrialisation well. We will do everything we can to maximize the industrial output of our nation to meet the ever growing demands. New facotires are beign built everywhere and small farming villages are transformed into beating hearts of Industry basically overnight. The future is here." #NT!
 JAP_deal_with_conglomerate: "Deal with Conglomerates" #NT!
 JAP_deal_with_conglomerate_desc: "The main rival for our economic revolution is indeed the Zaibatsu that secretly manipulating our economy. With a huge advantage for having money in their pocket, we need to deal with them to step back from business competition by either by law or by force. We need to choose wisely." #NT!
 JAP_regulated_market_policy: "Regulated Market Policy" #NT!
 JAP_regulated_market_policy_desc: "After a long time of abusing by the Zaibatsu, the government finally has the power and will to step in and end their stronglhold on our economy. The state needs to take reign over the market to secure a free, fair and competitive market. Therefore a large number of reforms will be implemented, beginning with a extensive anti-trust law, to break up monopolies and a large scale crackdown on corruption and government ties to these Megacorporations. Furthermore, strategic tarifs and subvention of smaller competitors will help us to regulate the economy. The goal will be for the state to create a regulated and fair market economy, that fosters healthy competition and serves the state and its people." #NT!
 JAP_rice_for_we_eat: "Rice for We Eat" #NT!
 JAP_rice_for_we_eat_desc: "Now that neutralized the monopoly of the Zaibatsu, we have a firm control of our internal economy. However we now need to make sure, that this blooming market is not destroyed again by cheap foreign labour which could now flood our economy. Therefore we will enact trade tarifs on imported goods and give incentive to use local production and resources. This protectionism will help our local ecnomy to grow and stop wealth from flowing out of the country" #NT!
 JAP_infiltrate_zaibatsu: "Infiltrate the Zaibatsu" #NT!
 JAP_infiltrate_zaibatsu_desc: "To really deal with the Zaibatsu we need to break their powerful ties and find a reason to move against them. It will be important to gather all information and possible clues to corruption and crime that we can. We will place our spies and informants within the Zaibatsu to help us in this endevour. Once we gathered enough dirt on these board members, we will be ready to make our move." #NT!
 JAP_squeeze_their_neck: "Squeeze Their Neck" #NT!
 JAP_squeeze_their_neck_desc: "With the information gathered, we finally have enough to force the Zaibatsu to agree to an ultimatum. The corporation will be broken up and integrated into the Japanese corporate economy. We will also buy a fair amount of their stock and place our loyal man within their boards to further control their endevours. From now one, they will serve the state and not the other way around." #NT!
 JAP_full_economic_manipulation: "Full Economic Manipulation" #NT!
 JAP_full_economic_manipulation_desc: "We have achieved complete control over our economy and finally achieved corporatist economic model. We managed to integrate the conglomerate Industry into a mighty tool of the state. Now everything will run smooth, efficient and most importantly, controlled." #NT!
 JAP_no_place_for_lazybones: "No Place for Lazybones" #NT!
 JAP_no_place_for_lazybones_desc: "Lazy and inactive people are a burder on our society. They only care for themselves and force others to carry their weight. We finally need to deal with these people and eradicate them from our nation. They will be forced to labour and will be segregated from society. We shall clear up the slums and streets within each city. This nation is for people who work to the best of their abilities, not drunk antisocial punks." #NT!
 JAP_reform_hierarchical_command: "Reform Hierarchical Command" #NT!
 JAP_reform_hierarchical_command_desc: "After we took control of the State and the Shikken of Japan, we will make sure to reform the hierarchy and chain of command accordingly. Nobody should be above the Shikken, the Shikken will be the only one at the top and his command will lead the nation." #NT!
 JAP_control_nation_from_shadow: "Control Nation from Shadow" #NT!
 JAP_control_nation_from_shadow_desc: "Of course, the Shogun is a prestigous title and we would always have a thorn in our side by those who would want to restore him to his old position. Because of that, we should use the influence of the Shogun to our advantage and install a puppet regime. This will allow us to stay out of the spotlight and rule through the familiar face and position and if ever anything bad happens, it will be easy to sacrife this puppet. We will simply stay in the shadows and control the nation from there." #NT!
 JAP_even_shogun_is_our_pet: "The Shogun is Nothing than being Puppet" #NT!
 JAP_even_shogun_is_our_pet_desc: "Not even the Shogun now stands in our way. We managed to get into power, reform the state and fully put the nation under our boots. Japan is ours and the Shogun is nothing more then a fancy pet now. " #NT!
 JAP_education_reform: "Education Reform" #NT!
 JAP_education_reform_desc: "The current form of education is unift for our rule and still teaches many aspects which are contrary to our idea of government. We will make sure to reform our education into something which is not only more efficient but also serves our purposes." #NT!
 JAP_teach_with_patriotism: "Teach with Patriotism" #NT!
 JAP_teach_with_patriotism_desc: "Japanese live will not be under a strict guideline of patriotism, from education, to youth organisation and the economy. Our education reform will be the central part of this new policy, but it wont be the only part of it." #NT!
 JAP_install_new_daijo_kan: "Install New Daijo-kan" #NT!
 JAP_install_new_daijo_kan_desc: "Of course, we can not carry over any politicians from the old regime. The present Daijo-kan was installed by the previous Shogun, its loyalty is therefore questionable at best. We will dissolve the Daijo-kan and install a new on, solely staffed by our fiercest loyalists." #NT!
 JAP_establish_shikkenate_supremacy: "Establish the Shikkenate Supremacy" #NT!
 JAP_establish_shikkenate_supremacy_desc: "The Shikken is the father of our nation, the great leader of Japan. It was the Shikken who prevented the downfall of our nation. His wise commands inspire every citizen each day and we will do our very best to honor his sacrifice to Japan. He truely is a larger then life figure." #NT!
 JAP_academic_monetary_fund_act: "Academic Monetary Fund Act" #NT!
 JAP_academic_monetary_fund_act_desc: "The academic institutions of our nation are very important to us. Therefore the government has decided to grant a large funding project which will allow us to modernize and fund a lot of new academic instiutions in Japan and further education all throughout the country." #NT!
 JAP_universal_research_institute: "Universal Research Institute" #NT!
 JAP_universal_research_institute_desc: "A Universal Research Institute will be created and funded. It will allow us to coordinate our research and bundle all of our resources in one place. Additionaly, the new research enviroment will allow us to make the best of our brightest minds in this nation. This will surely further the deveopment and research of new key technologies." #NT!
 JAP_philosophy_of_new_panasianism: "Philosophy of New Pan-Asianism" #NT!
 JAP_philosophy_of_new_panasianism_desc: "The Pan-Asianism was spreading around the Far East for decades. Since the founding father of Republic of China, Dr. Sun Yat-sen, once said the Asia must be united and protect the Asia from colonialism. But it was not enough for being the one single state of Asia. We need more strong ideology to guide our people of Asia. We need the single value, single faith, single society and must be built by only Asian people. For Asian, By Asian." #NT!
 JAP_ncop: "Form the National Congress of Professionals" #NT!
 JAP_ncop_desc: "A great council will be formed, which will represent the interests of the different professions within the nations. This Congress will vote on important matters and suggest policies. While decisions still need to be approved by the leader of the Nation, the Congress holds signifiactn power over the appointment of certain ministries and posts within our government structure and the national trade unions." #NT!
 JAP_now_we_are_big_guy: "This Is What Japan Should Be" #NT!
 JAP_now_we_are_big_guy_desc: "This is Japan, true to its spirit and history, the japanese culture and people stand triumphant over division and foreign imperialism. Despite all hardships we managed to built a great prosperous nation with a glorious future ahead." #NT!
 #Navy 
 jap_modernise_the_navy: "Imperial Navy" #NT!
 jap_modernise_the_navy_desc: "The Navy since the Washington Naval Treaty has been mostly neglected. Ships from the Great War are now getting surpassed from all other naval powers. We must proceed to modernise the navy at once." #NT!
 jap_modernisation_of_cruiser: "Modernisation of Cruisers" #NT!
 jap_modernisation_of_cruiser_desc: "Newer Cruiser designs surpass our old cruisers that were built during the Great War and the Interwar period. We must commission a new cruiser design and start building them immediately." #NT!
 jap_destroyer_modernisation: "Asashio Destroyer" #NT!
 jap_destroyer_modernisation_desc: "Our Destroyer designs have also been outdated and cannot properly compete against newer designs. Newer designs must be developed as soon as possible." #NT!
 jap_expand_the_snlf: "Expand the SNLF" #NT!
 jap_expand_the_snlf_desc: "The Special Naval Landing Force is a specisalised group of Marines, which could be the dominant invading force if we want to fight a war and land in the islands of the Pacific. Perhaps by investing in the marines, we could recieve a strong and powerful marine invasion force." #NT!
 jap_long_lance_torpedoes: "Long Lance Torpedoes" #NT!
 jap_long_lance_torpedoes_desc: "The Long Lance Torpedoes are currently a promising prototype. If we spend time and capital to invest in this prototype, we might develop one of the best torpedoes, ahead of the other navies." #NT!
 jap_torpedo_cruisers: "Torpedo Cruisers" #NT!
 jap_torpedo_cruisers_desc: "With the development of the Long Lance Torpedoes, by putting a lot of torpedo launchers on our cruisers, they could overpower many of the naval powers' cruisers, and possibly threaten the pride of the enemy's fleet." #NT!
 jap_superior_battlefleet: "Superior Battlefleet" #NT!
 jap_superior_battlefleet_desc: "The Eight-Eight Fleet concept developed by our tacticians after the Russo-Japanese War is a capable doctrine, and we should continue with this concept without any doubt." #NT!
 jap_improve_naval_artillery: "Improve Naval Artillery" #NT!
 jap_improve_naval_artillery_desc: "The naval batteries of our ships have always been relatively high quality, but with more investments in them to license other powers' design or to research a more improved version, we could likely design a battery of better quality." #NT!
 jap_expand_the_kure_dockyards: "Expand Kure Naval Arsenal" #NT!
 jap_expand_the_kure_dockyards_desc: "The Kure Naval Arsenal has been the dominant shipyard of the Imperial Japanese Navy since the Sasebo arsenal deactivated. It has recently proven incapable to serve a larger fleet and we must now expand it. " #NT!
 JAP_the_yamato: "The Yamato" #NT!
 JAP_the_yamato_desc: "The design of a super heavy battleship has been in design during the interwar period, but not actually built due to the Washington Naval Treaty. With imminent conflict coming, we should consider to reactivate the design division, so the class can be completed before the conflict spreads to us." #NT!
 jap_expand_the_sasebo_arsenal: "Reactivate the Sasebo Arsenal" #NT!
 jap_expand_the_sasebo_arsenal_desc: "The Sasebo Arsenal was deactivated during the Interwar period and mainly used as a wharf. As the dark clouds of war linger over Europe, we must reactivate this shipyard to increase our naval power that shields us. " #NT!
 jap_lessons_of_the_great_war: "Lessons of The Great War" #NT!
 jap_lessons_of_the_great_war_desc: "With many lessons learnt from the naval battles of the Great War, many things are learnt. But these lessons are not properly implemented, with some work, we can make sure our naval staff makes use of them." #NT!
 jap_imperial_bb_academy: "Imperial Battleship Academy" #NT!
 jap_imperial_bb_academy_desc: "With the implementation of the lessons of the Great War, a dedicated academy for the battleship crew will be extremely affecting in the imminent naval combat, as we can give our crews an edge over our enemies." #NT!
 jap_dominance_of_cv: "Dominance of Carriers" #NT!
 jap_dominance_of_cv_desc: "As the testing of aircraft carrier doctrines with Hosho and Ryujo has found out that aircrafts can destroy a warship with ease, we must push an agenda that focuses on carriers, instead of the battleship fleet our old doctrines suggest." #NT!
 jap_first_air_fleet: "First Air Fleet" #NT!
 jap_first_air_fleet_desc: "The First Air Fleet can be established, concentrating the naval aviation power of Kaga, Akagi, Soryu and Hiryu into a neat and powerful fleet, able to be attached or dettach at a moments notice from any other fleets of ours." #NT!
 jap_third_gen_cv: "Third Gen Carrier Program" #NT!
 jap_third_gen_cv_desc: "With the experiences of Soryu and Hiryu, we have much more quickly needed improvements that needs to be incoporated. With the new naval expansions, the development of the third generation of carriers must start." #NT!
 jap_fifth_fleet_expansion: "Fifth Fleet Expansion" #NT!
 jap_fifth_fleet_expansion_desc: "The Fifth fleet is a collection of a few escort and transport ships. Our planners have found that a few of these ships can be converted into potential military ships, such as the Nitta Maru-class cargo liners built by Mitsubishi." #NT!
 jap_inaa: "Imperial Naval Aviation Academy" #NT!
 jap_inaa_desc: "With the expansion of many newer fleets, fewer and fewer experienced pilots and crew are present for them. With the establishment of an academy, these pilots can become a strong force of these fleets." #NT!
 #Planes are cool 
 jap_plane_modernisation: "Plane Modernisation" #NT!
 jap_plane_modernisation_desc: "With our expansion for our militaries, the corresponding aerial support must be implemented as well. Spending some capital on modernising our planes can help increase our militaries' effectiveness." #NT!
 jap_mitsubishi_designs: "Mitsubishi Designs" #NT!
 jap_mitsubishi_designs_desc: "Mitsubishi is a company that focused on shipbuilding and transport. But recently they have stepped into the aviation industry. With the experiences the Navy had from the A5M naval fighter, the Navy thinks that they are a great aviation designer and their designs can be used." #NT!
 jap_the_zero: "The Zero" #NT!
 jap_the_zero_desc: "Mitsubishi has gained the trust of the Imperial Japanese Navy and the navy now needs a new and capable fighter. We should commission a new agile carrier-based naval fighter from them, with Jiro Horikoshi as the lead designer of the project." #NT!
 jap_unify_research_effort: "Unify Research Effort" #NT!
 jap_unify_research_effort_desc: "The seperate research efforts of our militaries' led to duplicate researchs taking place. By ordering the unification of the two branches' research department, we can concentrate our aerial research on what is needed." #NT!
 jap_combine_bomber_effort: "Combined Bomber Effort" #NT!
 jap_combine_bomber_effort_desc: "By giving a contract to both the navy's and army's respective plane contractors, we can get a bomber suitable for naval use and tactical bombing, the best of both worlds." #NT!
 jap_jet_effort: "Jet Effort" #NT!
 jap_jet_effort_desc: "A proposal by Japanese researchers have concluded that by propelling hot air can provide thrust for planes, but it will be a difficult item to research. Maybe we should spend some capital on the interesting proposal." #NT!
 jap_the_oka: "The Oka" #NT!
 jap_the_oka_desc: "The Oka, also nicknamed the cherry blossom, is a kamikaze attack aircraft that can eliminate any competting navy units. This weapon not only shows our dedication to the war, but also to [From.From.GetLeader] himself!" #NT!
 jap_aichi_design: "Aichi Desgins" #NT!
 jap_aichi_design_desc: "Aichi is a well renowned company in the army plane contractors for their quality bombers. By investing in them, we could get some more better bombers from them." #NT!
 jap_CAS_modernisation: "Dive Bomber Modernisation" #NT!
 jap_CAS_modernisation_desc: "The Imperial Japanese Army's dive bombers have been lacking when compared to other country's. We will issue an commission to plane companies for a new generation of dive bombers" #NT!
 #Army 
 jap_expand_the_army: "Imperial Army" #NT!
 jap_expand_the_army_desc: "The Army that protectss our expanding Empire lacks the amount of troops needed. The Army's expansion is needed just as much as the modernisation of the Navy." #NT!
 jap_air_land_coop: "Air Land Cooperation" #NT!
 jap_air_land_coop_desc: "Cooperation between ground forces and the supporting bombers has proved it's effectiveness in the Spanish Civil War. We can probably build up the IJAAF to support our ground forces." #NT!
 jap_improve_pilot_training: "Improve Pilot Training" #NT!
 jap_improve_pilot_training_desc: "Just like the IJN's fleet of group of improperly trained pilots, our bomber pilots are trained without incorporating the lessons of the Spanish Civil War. Implementing them will definitely prove beneficial." #NT!
 jap_specialised_cas: "Specialised Dive Bomber Pilots" #NT!
 jap_specialised_cas_desc: "Our bomber pilots currently learns to pilot both dive bombers and tactical bombers. By specialising their roles, we can get more effective and capable pilots who perform better." #NT!
 jap_strat_bomb_doctrine: "Strategic Bombing Doctrine" #NT!
 jap_strat_bomb_doctrine_desc: "The Doctrine of Strategically bombing the enemy's factoies, lowering their output will hamper the enemy's capability to fight a prolonged war with us. Perhaps we should further develop such doctrine." #NT!
 jap_improve_bomber_training: "Improve Bomber Pilot Training" #NT!
 jap_improve_bomber_training_desc: "Our bomber pilots still learns to perform with outdated tactics. We shall modernise their training for increased effectiveness in bombing." #NT!
 jap_fighter_escort: "Fighter Escort" #NT!
 jap_fighter_escort_desc: "Our bombers currently lack the escorts that can protect them through enemy fighter close to the frontlines. By building these new types, we will surely increase our bombing efficiency." #NT!
 jap_further_doctrinal_development: "Further Doctrinal Development" #NT!
 jap_further_doctrinal_development_desc: "The new doctrine our IJAAF has chosen requires further experimentations to give our pilots a more complete view of the doctrine. We shall do this by holding some more exercises." #NT!
 jap_imaaa: "Imperial Army Aviation Academy" #NT!
 jap_imaaa_desc: "If the Navy can have an academy for further development, why can't the Army also have one? We can set up one for the IJAAF so they can operate with more success." #NT!
 jap_strat_bomber_modernisation: "Strategic Bomber Modernisation" #NT!
 jap_strat_bomber_modernisation_desc: "The strategic bombers that we operate are old and outdated. We shall send out a contract for a new strategic bomber." #NT!
 jap_speed_emphasis: "Speed Emphasis" #NT!
 jap_speed_emphasis_desc: "An emphasis on speed, maneuverablity and breakthrough can provide a strong force that can end conflicts within weeks. We should look further into these tanks to fully realise their potential." #NT!
 jap_armored_warfare: "Armored Warfare" #NT!
 jap_armored_warfare_desc: "Our officiers have came to the conclusion that tanks are the way forward, with further developments coming. Focusing our staff on these experiments will hopefully yield even better results." #NT!
 jap_armor_training_program: "Armor Training Program" #NT!
 jap_armor_training_program_desc: "With our army still not embracing combined arms warfare, we shall hold programs to further incorporate these tank units into conventional warfare." #NT!
 jap_motorized_support: "Motorized Support" #NT!
 jap_motorized_support_desc: "With the constantly improving speed of tanks, motorized infantry has the most potential in following these units. We shall create more of these units, so they can provide sypport for our new and more mobile units." #NT!
 jap_mechanized_infantry: "Mechanized Infantry" #NT!
 jap_mechanized_infantry_desc: "Mechanized units designs are interesting in that they provide additional armor for our infantry without completely sacrificing mobility. Perhaps some designs should be considered." #NT!
 jap_training_war_game: "Training War Games" #NT!
 jap_training_war_game_desc: "Our troops have been weakened by the lack of constant exercise. We shall hold war games more often so they get used to warfare and be less worn down from pure garrisoning." #NT!
 jap_further_doctrinal_experiments: "Further Doctrinal Experiments" #NT!
 jap_further_doctrinal_experiments_desc: "Our lacking doctrines require extra experimentations to fully realise their potentials." #NT!
 jap_planning_emphasis: "Planning Emphasis" #NT!
 jap_planning_emphasis_desc: "If we cannot out-gun our opponents, we can out-plan them. Surely a well realised plan can ensure success, no matter how the situation has developed it self. " #NT!
 jap_arms_modernisation: "Arms Modernisation" #NT!
 jap_arms_modernisation_desc: "Guns are the backbone of infantry, and our Arisakas, while trusty, have been falling short when compared to the other newer weapons other militaries are fielding now. We must invest in the modernisation of arms to ensure that we are not left behind in the arms race." #NT!
 jap_teishin_shudan: "The Teishin Shudan" #NT!
 jap_teishin_shudan_desc: "We currently field a small battatlion, the Teshin Shudan. A group of elite troopers who go behind enemy lines. If we integrate the use of parachutes and planes, they could become an elite group of commandos, working behind the lines. " #NT!
 jap_improve_military_training: "Improve Military Training" #NT!
 jap_improve_military_training_desc: "We shall integrate the lessons of the great war and improve our training fully. If we do not, our troops may be at a disadvantage when fighting the other militaries." #NT!
 jap_improve_officer_training: "Improve Officer Training" #NT!
 jap_improve_officer_training_desc: "The lessons of the great war was fruitful, but we only improved the training of our troops. Now we shall move onto the improvements for officiers." #NT!
 jap_cohesion_between_companies: "Cohesion Between Companies" #NT!
 jap_cohesion_between_companies_desc: "Currently our troops still function less cohesively, acting as independent battalions more than actual divisions. By promoting cohesive action then, their combat capability may be increased." #NT!
 jap_warrior_spirit: "Warrior Spirit" #NT!
 jap_warrior_spirit_desc: "By promoting the Bushido in training, our troops will be encouraged to fight more aggressively, or atleast stay true to the principle of 'Death before surrender'." #NT!
  
 ##Diplomacy## 
  
 #GER DIPLOMACY 
 jap_friends_with_ger: "Draw Closer to Berlin" #NT!
 jap_friends_with_ger_desc: "The Valkists in Germany are revolutionaries, despite being in control of a battered nation, has been friendly to many nations all around them. With our government only recently becoming more authoritarian, we should make friends with countries who are similar with us." #NT!
 jap-ger_army_drills: "German-Japanese Army Exercises" #NT!
 jap-ger_army_drills_desc: "With Berlin gladly accepting our friendship focus, and the military breakthroughs the German has had in the expansion of their army, we should propose army exercises to exchange knowledge." #NT!
 jap_daimler-benz: "Daimler-Benz Investments" #NT!
 jap_daimler-benz_desc: "We could probably invite the well known Daimler-Benz to open factories in the Home islands and improve our economy even more." #NT!
 jap_ger_tanks: "German Tank Designs" #NT!
 jap_ger_tanks_desc: "The Germans' expansion of their army include the numerous revolutionary tank designs they have adopted. With our much closer relation now, we should ask for help on the designs for our own designs and adopt their innovations." #NT!
 jap_friends_with_hol: "Mission to Netherlands" #NT!
 jap_friends_with_hol_desc: "With the Netherlands also turning to the Valkist Germans, we should also look for the acceptance of them, to find more allies in Europe." #NT!
 jap_suggest_tripartite: "Suggest Tripartite Pact" #NT!
 jap_suggest_tripartite_desc: "By suggesting a Tripartite Pact with the Netherlands and Germans, this would allow for mutual protection and economic coperation." #NT!
 jap_joint_tripartite_research: "Joint Tripartite Research" #NT!
 jap_joint_tripartite_research_desc: "We shall establish the Joint Tripartite Research Institution that will facilitate research between the members of the Tripartite Pact." #NT!
 jap_operations: "Operation Drafts" #NT!
 jap_operations_desc: "We shall start drafting operations for planning attacks on America and Britain. These plans will fuel our war and become our guide in the upcoming war." #NT!
  
  
 #US DIPLOMACY 
 jap_end_of_sanfran_summit: "The End of the San Francisco Summit" #NT!
 jap_end_of_sanfran_summit_desc: "With the end of the San Francisco summit, we must work closer with the United States as soon as possible." #NT!
 jap_us_tanks: "American tank designs" #NT!
 jap_us_tanks_desc: "The American tank doctrine of infantry support and suppressing fire is very potent and can be followed. We shall ask the Americans for tanks for testing." #NT!
 jap_us_cv: "American-Japanese Joint Naval Exercise" #NT!
 jap_us_cv_desc: "With the closer cooperation between us and the Americans, we shall start preparing for naval exercises with them and work together on newer naval doctrines." #NT!
 jap_us_joint_exercise: "American-Japanese Joint Army Exercise" #NT!
 jap_us_joint_exercise_desc: "Our army has been less exercised regularly. The United States' army has been the same. We shall call together our armies and perform a joint exercise." #NT!
 jap_us_railway_invest: "American Railway Investment" #NT!
 jap_us_railway_invest_desc: "With the poor American infrastructure, we can definitely transfer some of our methods and work to them as a gesture of goodwill." #NT!
 jap_us_investors: "American Investors" #NT!
 jap_us_investors_desc: "American investors had pumped many capital into our country already. With some more persuasion, we will be able to get a lot more investors from the USA." #NT!
 jap_us_oil: "American Oil" #NT!
 jap_us_oil_desc: "American oil has been one of the major trade resources for us. We shall ask them for getting technology for synthetic oil, which they are doing plenty of research on." #NT!
  
 jap_combined_COSC: "The Combined Chief of Staff Committee" #NT!
 jap_combined_COSC_desc: "We shall establish the Combined Chief of Staff Committee to facilitate intelligence sharing and military unit deployment." #NT!
 jap_588_sulawesi_bombers: "The 588th Sulawesi Bombers" #NT!
 jap_588_sulawesi_bombers_desc: "There are some Sulawesi volunteers who are inclined to help us liberate their people in British East Asia. We shall establish the 588th Sulawesi Bomber squadron for Sulawesi volunteers." #NT!
 jap_SEA_bulwark: "South East Asian Bulwark" #NT!
 jap_SEA_bulwark_desc: "We shall promote ourselves as the Asian Bulwark of Democracy against the British Imperialists, who are occupying the rest of the Indonesian islands." #NT!
  
 #UK-CW DIPLOMACY 
 jap_alliance_eng: "Hirota-Eden Neutrality Pact" #NT!
 jap_alliance_eng_desc: "" #NT!
 jap_trade_agreement_empire: "Anglo-Japanese Trade Agreement" #NT!
 jap_trade_from_BEA: "British East Asian Trade" #NT!
 jap_trade_from_BEA_desc: "With the Anglo-Japanese Trade Agreement, we shall send some officials to look for trade potential in the British colony of East Asia." #NT!
 jap_raj_metal_imports: "Indian Metal Imports" #NT!
 jap_raj_metal_imports_desc: "The British raj is wealthy in their metal deposits and they can provide us with a stable source of metal. We shall look into reinforcing these ties with actual trade deals." #NT!
 jap_burmese_rubber_import: "Burmese Rubber Imports" #NT!
 jap_burmese_rubber_import_desc: "The Burma peninsular is rather rich in rubber, and we should look into settling a trade deal with them for providing us with rubber." #NT!
 jap_trade_from_isles: "British Mainland Trade" #NT!
 jap_trade_from_isles_desc: "With the Anglo-Japanese Trade Agreement, we shall send some officials to look for trade potential in the British isles." #NT!
 jap_nzl_oil: "New Zealand Oil Imports" #NT!
 jap_nzl_oil_desc: "The New Zealand colony has some oil readily available. We shall look into sealing a deal with them for oil to less depend on just American Oil." #NT!
 jap_australian_ore: "Australian Ore Purchases" #NT!
 jap_australian_ore_desc: "Australian ore has been steadily rising. We shall buy some for testing and perhaps strike a deal with them." #NT!
 jap_australian_railway: "Australian Railway Investments" #NT!
 jap_australian_railway_desc: "Australia, being so vast, has mainly depended on just few areas. We shall invest in some of their railway projects to help them expand and fully utilise their vast land." #NT!
 jap_trade_from_australasia: "Australian-New Zealand Trade" #NT!
 jap_trade_from_australasia_desc: "With the Anglo-Japanese Trade Agreement, we shall send some officials to look for trade potential in the British colonies of Australia and New Zealand." #NT!
 jap_eng_radar: "English Radar Technology" #NT!
 jap_eng_radar_desc: "English Radio detection technology has been ahead of the rest of the world. We should look into striking a deal for the transfer of technology which will help us in the upcoming conflict." #NT!
 jap_british_investment: "British Economic Investments" #NT!
 jap_british_investment_desc: "The British had pumped millions into our country during the 1920s. With more promotion, they would likely be willing to further invest in a friendly nation." #NT!
 jap_eng_company: "Attract English Companies" #NT!
 jap_eng_company_desc: "An effort to attract English Companies from the British homelands to the Japanese islands was somewhat fruitful during the interwar period. We shall try to invite more of them, namely the bigger ones." #NT!
 jap_indian_railroad: "Indian Railroad Initiative" #NT!
 jap_indian_railroad_desc: "With the Indian rebellion of 1935 crushed, the railways of them has been destroyed. We shall propose an initiative for them to improve and rebuild their railways once more." #NT!
  
 jap_JCOSC: "Joint Chief of Staff Committee" #NT!
 jap_JCOSC_desc: "We shall establish the Joint Chief of Staff Committee to facilitate intelligence sharing and military unit deployment." #NT!
 jap_panay_incident: "Panay Incident" #NT!
 jap_panay_incident_desc: "With the Panay incident passing, we have not decided on a solution to the incident. We shall start discussing this matter." #NT!
 jap_british_naval_tactics: "British Naval Tactics" #NT!
 jap_british_naval_tactics_desc: "The British has always been pioneers in naval doctrines. We shall examine their doctrines and adopt what is beneficial to us." #NT!
  
 #INTERNATIONAL 
 jap_internal_stabilization: "Righteous Army Incident" #NT!
 jap_internal_stabilization_desc: "The Righteous Army Incident is a military coup that took place four days after the London Stock Market Crash after a group of extremist military officers, nicknamed 'the Righteous Army', has risen up against democracy itself. The result of this event changed all of Japanese foreign policy..." #NT!
 jap_constitutional_crisis: "Constitutional Crisis" #NT!
 jap_constitutional_crisis_desc: "With the Righteous Army Incident happening, we can see that without the Emperor's consent on the Army, the democratic government holds very little power. This constitutional crisis must be resolved immediately, or more problems shall come." #NT!
 jap_the_admiral_plot: "The Admirals' Plot" #NT!
 jap_the_admiral_plot_desc: "The Admirals' Plot is a coup by the navy that sees them take hold of the parliament. This can be prevented, but how, is up for debate." #NT!
 jap_the_army_coup: "The Army's Coup" #NT!
 jap_the_army_coup_desc: "The Army's coup is performed by the army, after being emboldened by the Righteous Army incident, who weren't suppressed fully." #NT!
 jap_assert_asian_dominance: "Assert Asian Dominance" #NT!
 jap_assert_asian_dominance_desc: "With one of the military in control of the government, we shall start stabilising our country against the fallout of the London Stock Market Crash and for future expansion." #NT!
 jap_iraa: "Create the Taisei Yokusankai" #NT!
 jap_iraa_desc: "The Imperial House of Japan has been in power ever since 660 BCE, but as of lately it's power to unite the people under a monarchy has been deteriorated. The solution to this problem is the Imperial Rule Assistance Association, a number of advisors to help make the Emperor appeal more to the low and middle class of Japan." #NT!
 jap_ally_the_military: "Military Alliance" #NT!
 jap_ally_the_military_desc: "With one branch in control, the other will definitely be ignored. We shall promote the alliance between the two for the good of the country." #NT!
 jap_united_under_the_emperor: "Divine Right" #NT!
 jap_united_under_the_emperor_desc: "The Emperor as the descendant of the gods of Japan is very important. With the liberalisation of our country, the divine right of the Emperor has been diminishing. We shall reestablish the importance of our Emperor and reaffirm his divinity. Banzai!" #NT!
 jap_all_hail_hirohito: "All Hail Hirohito" #NT!
 jap_all_hail_hirohito_desc: "With the Emperor back as the head of state of Japan, we shall further promote loyalty towards his majesty, who shall hail him as the great monarch." #NT!
 jap_jap_militarism: "Fan Japanese Militarism" #NT!
 jap_jap_militarism_desc: "Bushido had been one of the major influencing factors of our military men. We shall further fan Bushido and the idea of the servicemen." #NT!
 jap_revitalization_by_force: "Force Revitalization" #NT!
 jap_revitalization_by_force_desc: "With the politics stabalized, it is time to force our revitalization. With our country now radicalised, we can fuel our revitalization much easier." #NT!
 jap_the_second_meiji: "The Second Meiji" #NT!
 jap_the_second_meiji_desc: "Emperor Meiji was one of the greatest Emperors we have. With Emperor Hirohito leading us out of the London Stock Market Crash and into the upcoming war, he shall be just as great as Meiji. Banzai!" #NT!
 jap_zaibatsu_problem: "Problems with the Zaibatsus" #NT!
 jap_allow_marshall_law: "Allow Martial Law" #NT!
 jap_allow_marshall_law_desc: "With the LSMC coming, we need to allow Martial Law immediately as to pacify the numerous strikes and minor rebellions of unpaid workers." #NT!
 jap_suppress_worker_rebellion: "Suppress Worker Rebellion" #NT!
 jap_suppress_worker_rebellion_desc: "These worker's rebellions are causing much more damage to our Gross Domestic Product than the LSMC. We shall force these workers to work again immediately." #NT!
 jap_combat_the_red_threat: "Combat The Red Threat" #NT!
 jap_combat_the_red_threat_desc: "Our police has identified the major leaders of the rebellions as Communist sympathisers. We shall arrest these leaders and ban their parties." #NT!
 jap_korean_problem: "The Korean Problem" #NT!
 jap_korean_problem_desc: "Korea was not fully integrated despite their early annexation in the early 1910s. We shall start their incorporation now." #NT!
 jap_great_pacific_jewel: "The Great Pacific Jewel" #NT!
 jap_great_pacific_jewel_desc: "With Democracy prevailing in our country, we can fully claim the title as the 'Great Pacific Jewel'." #NT!
 jap_seek_loyal_ministers: "Seek Loyal Ministers" #NT!
 jap_seek_loyal_ministers_desc: "With plenty of ministers against the democratic government, we shall replace them with more loyal ministers, across the party lines." #NT!
 jap_new_constitution: "A New Consitution" #NT!
 jap_new_constitution_desc: "With the Meiji constitution starting to show it's flaw, we shall immediately start drafting a new and improved one." #NT!
 jap_army_under_the_parliament: "Army under the Parliament" #NT!
 jap_army_under_the_parliament_desc: "The Army, for the sake of stability, shall forever be under the command of the Parliament, with Royal Consent from the Emperor." #NT!
 jap_economic_devaluation_act: "Numismatic Devaluation Act" #NT!
 jap_economic_devaluation_act_desc: "Our currency is very costly to maintain it's exchange rate. We shall devaluate it and free up more money for us." #NT!
 jap_military_contracts: "Imperial Army Contracts" #NT!
 jap_military_contracts_desc: "One of the ways to recover is to contract military equipment out. Let's start by contracting army equipments." #NT!
 jap_the_great_recovery: "The Great Recovery" #NT!
 jap_the_great_recovery_desc: "We have fully recovered from LSMC! We shall proclaim our revitalization fully!" #NT!
 jap_arrest_the_traitor: "Arrest the Traitorous" #NT!
 jap_arrest_the_traitor_desc: "With the ministers of the Army and Navy unable to be trusted, we shall arrest those who are related to the plots against the democratic government." #NT!
  
 #Menace Across The Sea 
 jap_menace_across_the_sea: "Menace Across The Sea" #NT!
 jap_menace_across_the_sea_desc: "The Americans are dammed in their position, being one of the major opponents against us. Their menacing position will be able to fuel our ship building programs with war support." #NT!
 jap_secure_our_place: "Secure Our Place" #NT!
 jap_secure_our_place_desc: "We shall finally formally join the Imperial Protection Alliance and secure our place in that alliance as a force and bulwark in East Asia." #NT!
 jap_join_the_ISC: "Join the ISC" #NT!
 jap_join_the_ISC_desc: "The Imperial Scientific Council is a council that can help us in technological advancement. If we are able to join it, we will be able to advance further." #NT!
 jap_for_the_empire: "For The Empires!" #NT!
 jap_for_the_empire_desc: "Our populace must now accept both our aims for war, and also support the British Empire in the upcoming war." #NT!
 jap_operation_eagle_hunter: "Operation Eagle Hunter" #NT!
 jap_operation_eagle_hunter_desc: "With war against the United States sure, we shall prepare for war by drafting operations against them." #NT!
 jap_manila_bay: "Suprise Attack on Manila" #NT!
 jap_manila_bay_desc: "An Attack on Manila Bay will be able to cripple the Filipino government and shock the Americans for long enough to reinforce our superiority in the Pacific." #NT!
 jap_phi_funding: "Demand Filipino Loyalty" #NT!
 jap_phi_funding_desc: "To make sure that a war between the United States and Japan won't erupt, a clever way of going around is by secretly funding terrorist organisations in the state of Philippines that would like to be independent from the United States." #NT!
 jap_secure_the_philippines: "Secure The Philippines" #NT!
 jap_secure_the_philippines_desc: "The Phillippine islands lie directly in intercept to our possessions in Sulawesi. We shall start planning a move to secure the islands to protect our possessions." #NT!
 jap_south_asia: "Japanese South Asia" #NT!
 jap_south_asia_desc: "Our empire does not need direct control of Indonesia. We shall set up a government to fully collaborate with us." #NT!
 jap_exploit_the_colonial_resources: "Exploit The Colonial Resources" #NT!
 jap_exploit_the_colonial_resources_desc: "The Indonesian islands are very rich in oil, rubber and certain metal. We shall start exploiting this richness in resources fully." #NT!
 jap_free_from_the_imperialists: "Free From The Imperialists" #NT!
 jap_free_from_the_imperialists_desc: "We shall spread the words that they are free from the imperialistic west in the liberated colonies of empires." #NT!
  
 #Great Pacific Treaty 
 jap_great_pacific_treaty: "The Great Pacific Treaty" #NT!
 jap_great_pacific_treaty_desc: "The Great Pacific Treaty is the treaty for aligning Japan with America and against Great Britain and her empire." #NT!
 jap_finalise_treaty: "Finalise The Treaty" #NT!
 jap_finalise_treaty_desc: "The Finalisation of the Great Pacific Treaty must come now, or never, before America changes their mind and disrupt our plans." #NT!
 jap_fuel_anti_british_sentiment: "Fuel Anti-British Sentiment" #NT!
 jap_fuel_anti_british_sentiment_desc: "With us aligning ourself with American, we shall start fueling Anti-British sentiment so we can soon go to war with the British." #NT!
 jap_coop_americans: "Cooperate with America" #NT!
 jap_coop_americans_desc: "We must cooperate with the Americans completely so we can increase our odds against the menacing British." #NT!
 jap_establish_CCS: "Establish The Combined Chief of Staffs" #NT!
 jap_establish_CCS_desc: "The establishment of the Combined Chief of Staffs will enhance our unit positioning, improve the intelligence sharing between us and further help us coordinate combat missions." #NT!
 jap_operation_kingslayer: "Operation Kingslayer" #NT!
 jap_operation_kingslayer_desc: "With War against the British Empire soon, we shall start planning grand operations against the British immediately." #NT!
 jap_strike_BEI: "Strike The British East Indies" #NT!
 jap_strike_BEI_desc: "We shall attack and secure the British East Indies as to secure the valuable resources there and to fuel our empire's hunger for resources." #NT!
 jap_fund_terrorism_in_singapore: "Demand East Indies Dominion" #NT!
 jap_fund_terrorism_in_singapore_desc: "Before we do anything rash, we should give a proper casus belli in starting the war for Asian liberation. We prove that Japan simply desires an empire on par with London through requesting the turnover of the British East Indies to us - of course to protect it from unsafe Dutch hands. Regardless of their response, we will be ready!" #NT!
 jap_cut_off_british_supply_lines: "Cut-off British Supply Lines" #NT!
 jap_cut_off_british_supply_lines_desc: "We must isolate the Pacific possessions of the British Empire so they can become controlled by us." #NT!
  
 #Institution of Subjugation 
 jap_begin_subjugation: "Institution of Subjugation" #NT!
 jap_begin_subjugation_desc: "With our country being stabilized, we shall start subjugating other countries close to us, as we shall collect their resources they own for our own compensation from the fallout of the London Stock Market Crash." #NT!
 jap_nanshinron: "Nanshinron" #NT!
 jap_nanshinron_desc: "The Nanshinron, or Southern Expansion Doctrine is favoured by the Navy to expand and subjugate the colonies of the West, from the American Philippines to the British Malaya and the French Indochina, we can strike these territories for their resources." #NT!
 jap_hokushinron: "Hokushinron" #NT!
 jap_hokushinron_desc: "The Hokushinron, or Northern Expansion Doctrine is favoured by the Army to expand and take the resources of the vast Siberian land and fight the Soviet red menace with the help of the White Russian Government." #NT!
 jap_research_for_allies: "Strengthen Pan-Asian Research" #NT!
 jap_research_for_allies_desc: "As Asia continues to be liberated further from Western oppression, we must work with these nascent countries to strengthen our collective research efforts." #NT!
 jap_demand_beiyang_submit: "Demand Beiyang Submit" #NT!
 jap_demand_beiyang_submit_desc: "With the Beiyang governancy emerging victorious in the Fifth Beiyang-Zhili war, they have provoked us multiple times. It is time for us to stand up to such acts of aggression and take control of Manchuria, rich in steel." #NT!
 jap_demand_zhili_submit: "Demand The Zhili Submit" #NT!
 jap_demand_zhili_submit_desc: "With Zhili emerging victorious in the Fifth Beiyang-Zhili war, they have provoked us multiple times, from the "accidental" bombardments of our military bases to the numerous border clashes in Manchuria. It is time to stand up to these acts of aggression!" #NT!
 jap_expand_kwantung: "Expand The Kwantung Army" #NT!
 jap_expand_kwantung_desc: "The Kwantung Army, in charge of the protection of the occupation of Manchuria has proved it's shortages of troops. We shall provide additional funds for them to securely protect our possesions." #NT!
 jap_operation_rivalry: "Operation Rivalry" #NT!
 jap_operation_rivalry_desc: "A more free to take location for us is the Indochinese area. We shall start drafting an operation to take the area." #NT!
 jap_strike_indochina: "Strike Indochina" #NT!
 jap_strike_indochina_desc: "With the operation ready, we shall start preparing to invade Indochina soon." #NT!
 jap_three_musketeers_i_mean_indochinese_bros: "The Three Indochinese Brothers" #NT!
 jap_three_musketeers_i_mean_indochinese_bros_desc: "The Indochinese peninsular is formerly governed by Laos, Vietnam and Cambodia. We shall let them collaborate with us to govern the peninsular." #NT!
 jap_pressure_siam: "Pressure the Siamese King" #NT!
 jap_pressure_siam_desc: "We shall pressure the Siamese king to bend to our will and assist us in the future attack on French Indochina." #NT!
 jap_shanghai_incident: "Shanghai Incident" #NT!
 jap_shanghai_incident_desc: "The growing Anti-Japanese sentiment in China has been increasing since the First Sino-Japanese War and culminated in the Shanghai incident. We still haven't responded to the incident. We shall use this time to discuss within ourselves." #NT!
 jap_defeat_cliques: "Defeat the Cliques" #NT!
 jap_defeat_cliques_desc: "With the Chinese Nationalists under our control, we shall unite the disjointed China, controlled by Cliques, under our collaboratist government's control." #NT!
 jap_korean_project: "Korean Project" #NT!
 jap_korean_project_desc: "With the incoporation of Korea, we shall start a project surrounding the Koreans, to show that we care about them." #NT!
 jap_chinese_project: "Chinese Project" #NT!
 jap_chinese_project_desc: "The Chinese Project is a plan to keep the Chinese collaboratist government reasonably under our control." #NT!
 jap_three_race_coprosperity: "Three Race Co-Prosperity" #NT!
 jap_three_race_coprosperity_desc: "With the Chinese and Korean collaborating with us, we must ensure that working with us will be prospering, or they might leave easily." #NT!
 jap_promote_koreans: "Promote Korean Servicemen" #NT!
 jap_promote_koreans_desc: "We shall promote the idea of Korean militarymen and stabalise the Korean so they do not outcast the Koreans who serve for us." #NT!
 jap_korean_army: "Korean National Army" #NT!
 jap_korean_army_desc: "With the remains of the Chosen Empire's army still here, we shall establish the Korean National Army, recruiting the remains." #NT!
 jap_chinese_air: "Chinese Republican Airforce" #NT!
 jap_chinese_air_desc: "The Chinese Airforce is backwards and old. They do not have anyone to support them in modernising it. We shall be the one who modernises it." #NT!
 jap_chinese_army: "Establish The Chinsai Army" #NT!
 jap_chinese_army_desc: "The Chinsai Army will be the force to garrison the Shanxi-Shandong peninsular and protect the possession." #NT!
 jap_standardize_army: "Standardize The Militias" #NT!
 jap_standardize_army_desc: "The militias owned by the Chinese are not standardized and cannot fully fight with the other units. We shall help these militia units to standardize themselves." #NT!
 jap_war_for_prosperity: "War For Prosperity" #NT!
 jap_war_for_prosperity_desc: "War must be properly support in a collaborative regime, and we shall spread propaganda to maintain the stability in our possessions." #NT!
 jap_ally_the_whites: "Alliance With The Whites" #NT!
 jap_ally_the_whites_desc: "We shall offer an alliance with the White Russian Government, who will be definitely be happy to ally with us to fight against the Soviet Red menace." #NT!
 jap_yakutsk_incident: "Yakutsk Incident" #NT!
 jap_yakutsk_incident_desc: "We shall start provoking the Soviets, first by provoking border conflicts by the border between the Whites and the Soviets." #NT!
 jap_assist_white: "Assisting The Whites" #NT!
 jap_assist_white_desc: "The white russians are the underdog in the fights against the Soviets. We shall assist the Whites in the fight by providing industrial support." #NT!
 jap_topple_commies: "Topple The Communist Threat" #NT!
 jap_topple_commies_desc: "The army has finally pledged their commitment against the reds. The time is now. We shall attack the Soviets with a full scale attack. Banzai!" #NT!
 jap_unite_against_red: "Unite Against The Reds" #NT!
 jap_unite_against_red_desc: "With the reds now at war with us, we must promote unity at home to fuel the long war." #NT!
 jap_dominant_white: "Dominance Of The Whites" #NT!
 jap_dominant_white_desc: "The dominance of the White russians must not be underrestimated, and we shall promote their dominance." #NT!
 jap_russo_japan_ally: "Russo-Japanese Co-Prosperity" #NT!
 jap_russo_japan_ally_desc: "With the alliance propped up, we shall promote the idea of Russo-Japanese alliance for prosperity and the fight against the Soviets." #NT!
  
