 #### Bookmark Description #### 
  
 JAP_FUHRERREICH_DESC: "Japan is rising. In less than a century it has pulled itself from an isolated, feudal society to Asia's most industrialised and modern state. Emperor Hirohito rules over an young empire that simultaneously holds dominion over Korean and Taiwan, yet upholds a democracy based on American ideals. Lacking natural resources, Japan must advance even further if it's to thrive in this uncertain world. Tennōheika Banzai!" #NT!
  
 #####Events##### 
  
 jap.0.t: "The Rising Sun" #NT!
 jap.0.d: "While other nations were immolated in the Great War, the early 20th century has been a blessing to Japan. Gaining dominion over many of Germany's former pacific territories, Japan has continously stepped into the spotlight on the world stage. \n\nHowever, the nation's dabbling in Democracy is still new, and many wish to corrupt it to suit their wishes. Many farmers struggle with the rapid pace of modernisation, and income inequality has exploded. The Zaibatsu, Japan's gargantuan conglomerates, have continued to stifle entrepreunership and innovation. It has been a golden age for Japan, but unless swift action is taken, stagnation may curse us. May the Emperor watch over us all." #NT!
 jap.0.a: "Tennōheika Banzai!" #NT!
  
 jap.1.d.0: "Ever since the First Sino-Japanese war, Korea has been firmly under our influence and in 1910, annexed into our Empire under direct rule. The situation has been met with variable responses, with recent events, the assimilation of Koreans have now been put onto our agenda. We now must decide on the speed of assimilation, or further rebellion will be more often and in much larger scale, perhaps, even a full scale independance war." #NT!
  
 jap.2.d.0: "As the Fifth Fengtien-Zhili war starts to rage in Northern China, our interests in China forces our hand in support for one of the two clique, Zhili or Fengtien. One of which shall become victorious in the war and we must help one of them in their ultimate conquest to protect our interests. Now do we support the Zhili clique, whose military has proved itself time and time again, but lacks the industrial power of her neighbours, or the Fengtien governacy, whose area are wealthy in metal and owns the majority of the Manchurian railway?" #NT!
  
 jap.3.d.0: "After the London Stock Market Crash, we now have a major trade deficiency as no one would buy our products. To combat the trade deficiency, our politicians have decided to cut the budget for many departments, including both branches of the military. The generals of both branches have been notified and promised an expanded budget whenever the economy has been restored." #NT!
  
 jap.9.d: "The most unsettling five days in the British Empire since the start of the Great War has came, as the Empire's stock markets has been varying radically due to the fear of inability to get resources and goods from all corners of the Empire. Due to this, many British investors have withdrawn their Japanese assets and caused a panic in our own stock markets as well. Not to mention the bankrupcy of quite a few Japanese trading partners, thus crippling our economy. Who knows what will happen due to this?" #NT!
  
 jap.11.d: "A military coup d'état by the Righteous Army has been set off on the 6th of September 1936, due to the result of military factionalism, constant rivalry against the government, and the recent London Stock Market Crash. This coup is is mostly comprised of young radical Imperial Japanese Army officers and their goal is to eliminate the ideological rivals, the social conservatives. Many in the opposition party say that any harsh military action against the small army would lead to open rebellion of the Army and may result in a civil war! We must act carefully to not hurt either side..." #NT!
  
 jap.12.d: "With regiments of the Imperial Guard directed towards putting down the rebellion, The Righteous Army has been destroyed! The last of the commanders of the Righteous Army have been executed. The Righteous Army only managed to assassinate off few political members, as well as occupying the government center of Tokyo for a short while. Many citizens thanked the army, which came in and dealt with these traitors with no mercy. This rather unsettling rebllion may have proved to the two branches that we will crush any rebellions, but much more needs to be done before more of this happens." #NT!
  
 jap.13.d: "Peace negotiations have been named, namely the unification of the military factionalism has been ended but for a cost of some political ministers of the ruling government. At the end, no Japanese life was lost at the end of the day and minimum damage has been made overall." #NT!
  
 jap.14.d: "Just now, our naval exercise just off Manila, the capital of the Phillipines have succeed in it's true purpose - a surprise attack on both Filipino and American military bases and we triumphed! The president of the Phillipines is mad and the the American President is shocked at our daring raid. We will win this war against the Imperialistic Foreigners!" #NT!
  
 jap.15.d: "Yesterday, Japanese planes have attacked Filipino military bases and the American embassy! There has been many casualties of both nationalities and both us and the Phillipines are mad. Both the American and Filipino public are mad and request for war soared! The Phillipines are already at war with the Japanese now, leaving only us, the United States of America not at war. Our response shall be swift and deadly, and wipe this dishonorable empire off the face of the world!" #NT!
  
 jap.16.d: "With the establishment of the Imperial Ruling Assistant Association, they have started the discuss the zaibatsu problem. These Zaibatsus are major conglomerates and each own an important part of our economy and industry. But as their influence expands, they start to affect our government's policy, perhaps a little too much. Now we must decide on whether to start dissolving these Zaibatsus, or to prevent them from entering the political sphere entirely. Either will help us complete our goal, but we must decide now, or never." #NT!
  
 jap.17.d: "A few days ago, the American Gunboat USS Panay fired at Japanese ships who were participating in the casual naval gunnery exercise. The captain of USS Panay said they thought that the ships were firing in anger and not exercising. While no casualties were caused, the incident proved that not just the American and Japanese government are distrustful of each other, even the militaries of both countries perform the same. Now we wait until the diet and parliament agree on a complaint to the American government." #NT!
  
 jap.18.d: "With anti-Japanese sentiment rising in China, citizens of Shanghai attacked many Japanese businessmen, destroyed and vandalised Japanese-owned property, including the burning of the Sanyou factory. An upsurge of anti-Imperialist sentiment was caused and protests to boycott Japanese goods and remove the concessions to Japan also broke out. While the Chinese Nationalist government claim that this was staged by Japanese agents, regardless of this, what we will do is not yet decided on. Now what do we do?" #NT!
  
 jap.19.d: "The Japanese diplomat has just sent us a number of demands, including the ability to position Japanese troops in our territories to stop these anti-Japanese sentiment and provide assistance to investigate the recent Shanghai incident. This demand will basically give up our national sovereignty and independence! But our [From.GetLeader] has not yet made any decision on the response. Perhaps he will give in to these demands or this will not. We can only wait..." #NT!
  
 jap.20.d: "As our supporters, the Japanese have earned some concessions in the Fifth Fengtien-Zhili war. But now their government has become much more imperialistic and started to expand. In their path of expansion, we lie. Now as the Japanese have sent us their ultimatum, do we refuse and wage a war we can ill fight against with Japan's technological might or do we submit to the imperialistic empire? The fate of Fengtien lies here and we do not know will we survive such a conflict." #NT!
  
 jap.201.d: "Despite the fact our nation's great might clearly exceeds their own, Fengtian has ignored our ultimatum." #NT!
  
 jap.202.d: "Realizing Japan's great might and diplomatic conviction, Fengtian has accepted our ultimatum." #NT!
  
 #Zhili ultimatum 
 jap.21.d: "Following multiple incidents in Qingdao, Dailian and the Manchurian peninsular, the Japanese has had enough and now sent us an ultimatum. To submit or to go to war with them. While we cannot afford to fight a war with their technological might, we cannot afford to submit either, as the entire population is doubtful of the future of Zhili under Japanese rule. All we know is that the fate and future of Zhili lies here, and we depend on it." #NT!
  
 jap.211.d: "Despite the fact our nation's great might clearly exceeds their own, The Zhili Clique has ignored our ultimatum." #NT!
  
 jap.212.d: "Realizing Japan's great might and diplomatic conviction, The Zhili Clique has accepted our ultimatum." #NT!
  
 #France peace proposal 
 jap.22.d: "After the Japanese invasion of our only Asian possessions, we no longer have any holdings in Asia, and we therefore cannot fuel a war. The Japanese, through the Swiss diplomat has sent us asking for an armistice, or even peace. If we do, we will be giving up our Pacific possessions. We must consider this carefully." #NT!
 #Russo-Japanese coalition 
 jap.23.d: "The Japanese, who have supported us many times in the Russian Civil War, have sent a proposal for an alliance against the reds, who currently own the vast Russian lands. If we do accept, we will gain a powerful ally who undoubtedly will support us in every possible moment and will facilitate us in conquering the vast Soviet menace." #NT!
  
 jap.24.d: "The Japanese has allied with the British, and they now cooperate with them militarily. This means another knife will be pointing at us, but this time in the Pacific. While it is unknown on how will the two countries will fight against us, it is sure that the two nations will band together against us." #NT!
  
 jap.25.d: "Improved relations with the United States has emboldened the Japanese to once again increase the size of their Navy which is making our most isolated colonies even more vulnerable. We must counter this hostile move from the Japanese by any means we have." #NT!
  
 jap.26.d: "" #NT!
  
 jap.27.d: "Diplomats from the great and powerful nation of Japan have sent us an offer to form an anti-French alliance with them. The annexation of Siamese controlled Laos by the French following Franco-Siamese War of 1893 is still a contentious issue between our two nations and many within our country wish to reverse this. While the Japanese clearly intend to pressure French interests in South East Asia some ministers are weary of becoming too dependent on the Japanese." #NT!
  
 jap.28.d: "Realizing our shared interests in French Indochina, The Siamese have agreed to our offer of an alliance." #NT!
  
 jap.29.d: "Despite our shared interests in French Indochina, The Siamese have refused our offer of an alliance." #NT!
  
 jap.30.d: "It's clear that we and Japan hold a shared interest in weakening Soviet influence in the Far East. Military personal from Japan have come to us with a plan to test Soviet defenses in the strategic region of Yakutsk. Our military with supplies from Japan will raid this region in a small scale buy highly coordinated attack. While the USSR outnumbers us greatly Tokyo believes that focused and decisive operations can quickly defeat Soviet divisions before they can be reinforced by reserves from Europe, an evolution of the strategy used by Japan to defeat Russia in 1905. While the Japanese envoy is highly confident in this plan, local Russian officers are understandably weary of provoking the USSR but we should also be weary of upsetting our Japanese ally." #NT!
  
 jap.31.d: "With the persuading of our military envoy, The Russian have agreed to out plan to raid the Soviet strategic position in Yakutsk." #NT!
  
 jap.32.d: "Despite the efforts of our military envoy to Chita, The Russians have rejected our plan to attack the Soviet defenses in Yakutsk. While many back in Tokyo wish to drop the issue for now the Japanese military have little patience for the Russians and are preparing plans to install a more \"amenable\" government in Chita." #NT!
  
 jap.33.d: "Reports from our Siberian garrisons have relayed that White forces have crossed our border into our Far Eastern territory of Yakutsk. The scale of this raid isn't fully known as of yet but in any case we must quickly reinforce this position and push the whites back!" #NT!
  
 jap.34.d: "The \"Yakutsk Incident\" as some have begun to call it has come to a quick end. The sudden break out of violence between these two states has shocked the international community, some of whom suspect Japan in sparking the incident. All that really matters though is our decisive victory." #NT!
  
 jap.35.d: "The \"Yakutsk Incident\" as some have begun to call it has come to a quick end. The sudden break out of violence between these two states has shocked the international community, some of whom suspect Japan in sparking the incident. Our surprise defeat has shocked many of our ministers and officers who are now demanding significant reforms to better prepare our army against future battles." #NT!
  
 jap.36.d: "Realizing our shared ambitions against the Soviet Union, Russia has agreed to form an alliance with us." #NT!
  
 jap.37.d: "Despite our historic and continued support for their little regime, Russia has refused to form an alliance with us." #NT!
  
 jap.38.d: "Our attempts to find a peaceful solution to the growing political power of the Japanese Army has failed. When they threatened Japan's democracy we offered them an inch which they saw as an opportunity to take a mile. Slowly but surely Japan's civil government fell to the interests of the military. Under growing internal pressure even the Emperor himself has given into the demands of the military. What ever kind of democracy may have existed in Japan is now just a foot note in history." #NT!
  
  
 jap.48.d: "Despite our efforts to improve relations with Britain and her people, the British Navy has refused to hand over the designs of the HMS Trafalgar. This modern ship is quite powerful and if we are to retain our place as thee dominate power in the Pacific we must create a ship that can match it's strength." #NT!
  
 jappol.11.d: "To help secure the very survival of Japan's democratic government we must reform how the military operates. Currently many of our top generals operate autonomously far from the supervision of Tokyo and as such they have very little interest in parliamentary politics. While this state of affairs has allowed for our military and nation to achieve many stunning victories against our enemies it has also turned Japan into a nation that effectively has two conflicting governments. If we are to secure the stability of our nation we must reign in Japan's most ambitious commanders and install loyalists in their place." #NT!
  
 jappol.16.d: "The Police have recently just took in a soldier of the Imperial Japanese Navy who is suspected to be participating in a conspiracy against the democratic government. He has not leaked any information, but what this means is that the Navy is not discouraged despite the September 6 incident, where the Righteous Army's uprising was stopped. Now that we know of such conspiracy, we must start thinking of a solution to this, in order to safeguard democracy." #NT!
  
 jappol.17.d: "As the Diet notified the Emperor about the conspiracy, the Emperor has told the Diet that he intends to speak to both branches of the Military to, quote, 'Speak about the recent events'. The Diet is split on this measure, fearing that the speech may lead to criticism of the Emperor by the general public. Now if the Prime Minister agree to the speech, it may lead to either the Military giving up their plans for coups or the Emperor will be criticised. What do we do?" #NT!
  
 jappol.18.d: "Isoroku Yamamoto, one of the Admirals notified by the Imperial Diet, handed over the results of his investigation on the potential coup. He pulled his strings within the Imperial Japanese Navy and discovered plenty of officers and marines who were planning to coup later this year. He compiled a list of the officers and marines and gave it to the Imperial Diet. Now what will we do with this list of officers?" #NT!
  
 jappol.19.d: "Yesterday, a group of naval officers and marines took hold of the Parliament and took hostage of the legislators. They demanded that the current Prime Minister resign and let a militarist become the new Prime Minister. The Imperial Japanese Army refused to intervene and the civilian government can only give into these demands, putting the Imperial Japanese Navy in command of the Empire. What lies in front of the path of the empire is unknown, yet conflict is sure to come soon quickly." #NT!
  
 jappol.20.d: "With Yamamoto's report on the naval officers and marines, the Prime Minister has ordered the mass arrests of these traitors. This has stopped the potential coup at the cost of the personnel of the Navy. We must start recovery from this purge and reinforce the superiority of the democratic government over the two branches." #NT!
  
 japhep.1.d: "As the Imperial Conference of 1937 drew to a close, the British called for a conference with us so negotiations and discussions for the continuation of the Anglo-Japanese Alliance and other issues with Japan will continue. Delagations from Britain has reached Osaka and met for the first time today. Both delegations and governments are hopeful of this conference and wishes that both side will get what they want from the conference." #NT!
  
 japhep.2.d: "With uncertainty of the ability to provide resources and economic stability after the London Stock Market Crash, many Japanese companies have resorted to trading with other countries and companies, such as American products and German iron. The British Empire suffered a rather great hit to their trade and is not satisfied by this. The British Foreign Minister Anthony Eden has therefore decided to discuss with the Japanese delegate about such trade, namely imports and exports of the Japanese Empire." #NT!
  
 japhep.3.d: "As the British start to recover from the Stock Market Crash, many countries have abandoned the Gold Standard. The British delegates have told the Japanese delegates that the British government hopes to abandon the Standard or at least devaluate the Pound. The Japanese economic minister also supports such action. If we do this, we may be able to recover from the Stock Market Crash quicker." #NT!
  
 japhep.4.d: "The British delegates now said that the two Empires must band together for protection against unnamed threats that are on the rise. The British delegate is certain that if Japan announces to modify the Anglo-Japanese alliance to join in and support the British Empire in any upcoming conflict, the unspecified threat will doubt any potential attack on both empires. The problem is that, do we, or do we not, fulfil such action?" #NT!
  
 japhep.5.d: "With the 1937 temporal renewal of the Anglo-Japanese Alliance soon coming to an end, we have called for a summit with the Japanese. While that is one thing off the agenda, we are not sure how will the Japanese respond to this summit, seeing our numerous acts of aggression in the interwar years. What we are doing now is nothing more than a gamble, and we can only hope for the best." #NT!
  
 japhep.6.d: "With the London Stock Market Crash, many has lost much of their confidence in our economic stability and trade, many Japanese investors included. With an agreement, we can make them inclined to trade with us again with terms for guranteeing their trade and them being not affected with our tariffs. Hopefully these terms will be able to make them trade more with us again." #NT!
  
 japhep.7.d: "The Gold standard is our former economic standard, while we have our plans on the standard, we do not want any of our trade partners being unable to trade with us continuously, or we will just undo the trade agreement signed previously. We shall encourage them to abandon the Gold Standard." #NT!
  
 japhep.8.d: "Despite some disagreement on some terms, our delegates have reported that it may be suitable for us to ask for Anglo-Japanese Alliance. Perhaps the Japanese will finally want to continue our alliance, both for protection, or for deterrance." #NT!
  
 japhep.9.d: "With much greatness, we and Great Britain has put aside our disagreements and finished the discussion of the Hirota-Eden Pact. This pact shall show the greatness of diplomacy and ensure the success of both the Empire of Japan and the Empire of Great Britain." #NT!
  
 japhep.10.d: "Our delegates in Kyoto has reported back to Downing Street that the Japanese has accepted the extension of the Anglo-Japanese Alliance. This means that most of our hopes for the summit is fulfilled, despite most political councillors' conservative hopes. This will be the most influential conference in history. We shall rejoice at such event!" #NT!
  
 japhep.100.d: "Our government, before the new elections take place, hopes to solve the problem of the not-yet-terminated Anglo-Japanese Alliance. Right now the cabinet is undergoing heavy debates at Downing Street to renew the alliance temporarily for three years. Many throughout the government are concerned if this alliance will stay for long, especially when our actions have alienated quite a lot of our former allies." #NT!
  
 japhep.101.d: "Britain has just told our minister for foreign affairs that they wish to renew the Anglo-Japanese Alliance for three more years and it is up to us to decide whether or not the alliance will continue. The Navy and Army are supportive of the renewal, but the diet is divided for such action, as many acts by the British have alienated their former allies and made many enemies." #NT!
  
 japhep.102.d: "The Japanese Diet has sent a letter to the Foreign Office, saying that they have decided to renew the Alliance, following our proposal of a 3 year temporal renewal, until a complete discussion later. However, the letter has stated that numerous actions by the British Empire has conflicted with Japan and her interests. It will take a lot of actions by the British Empire to undo such acts of aggression against them." #NT!
  
 japhep.103.d: "The Japanese Diet has sent a letter to the Foreign Office, saying that they have decided to terminate the Alliance, against our proposal for a 3 year temporal renewal. The letter stated that too many acts of aggression was done by the British Empire against the Japanese empire and has influenced them to terminate the alliance due to not hoping to associate themselves with constant aggressors." #NT!
  
 japhep.104.d: "The British diplomat to us has just left us a letter, saying that it is in their nation's interests to terminate the Alliance, due to the overwhelming uncertainty posed by our actions, drifting away from the British interests, aligning ourselves with other nations. The Diet has not made any official comment on the letter currently." #NT!
  
 japhep.105.d: "As we enter [GetYear], one of the problems arise as the temporaily renewed Anglo-Japanese alliance comes to an end. With the 3 years ending without much conflict between the both nations, many think that this means the two nation's interests are once again, closer to each other. Quite a number of people support aligning Japan with us fully through inviting them to the Imperial Protection Alliance, but this must be done with thorough discussion." #NT!
  
 japhep.106.d: "The British diplomat entered the halls of the Foreign Ministry today, concerned, speaking of holding a conference between the two countries. It is sure that this conference will concern the fate of the Anglo-Japanese Alliance as the temporal renewal ends. The Diet is more optimistic towards holding the conference to discuss the fate of the Alliance. Perhaps it will go miraculously and we will be happy after all, or it may go poorly and both parties will go with a sour face." #NT!
  
 japhep.107.d: "Japan has notified our diplomat over there that they will not discuss the Alliance, still citing the noticible times where the British have went against the interests of Japan. Therefore, they will also terminate the alliance. The Foreign Minister has already announced that Britain will not try to attempt to keep Japan as a part of the Alliance." #NT!
  
 japhep.108.d: "Japan has notified our diplomat at Japan stating that they will terminate the Alliance immediately, citing the aggression of the British actions. The Foreign Minister has stated that the British Empire will not try to continue the alliance, stating 'A unpleasant alliance is against both nation's interests'. However, a number of our political advisors has advised against just letting go." #NT!
  
 japhep.109.d: "Britain has notified our diplomat to terminate the Alliance immediately, citing numerous unpleasant times of cooperation between the two nations, and how it is 'better for no relation than a mutually despiscing one'. Numerous political commentators are very suprised by Britain's actions, but have remained neutral on the issue." #NT!
  
 japsanfran.1.d: "Our intelligence sharing with the Americans was just in time. With us inviting them to a summit, they accepted and proposed to hold it in San Francisco. We shall decide a solution to the HMS Trafalgar and numerous other minor items. Now we shall participate immediately, without any doubts, as time is not on our side." #NT!
  
 japsanfran.2.d: "The Japanese's invitation of us to a summit about the naval problems and the pressing issue to HMS Trafalgar led to a summit in San Francisco. Now we shall participate to solve these issues. Now we must hold this summit as soon as possible, or our ships will be defeated easily." #NT!
  
 japsanfran.3.d: "After 18 years of the Washington Naval Treaty which limited both ours and the United States of America's shipbuilding, the British has launched the Super Heavy Battleship HMS Trafalgar which endangers both the American and the Japanese navy. We, the Japanese shall call for a summit to declare the end of the treaty and restart the fleet construction programs of both countries to ensure the security of our seas. If the Americans does not align with our cause, we must stop following them." #NT!
  
 japsanfran.4.d: "The Japanese delegates, on the first day of the Summit, has said that 'With the HMS Trafalgar, we must stop limiting our navies immediately' and called for the immediate termination of the Washington Naval Treaty, and instead, band together for naval technology sharing to catch up for the missing interwar naval development." #NT!
  
 japsanfran.5.d: "Due to our reliance on importing resources, we have mentioned that we should stop importing British goods and import more American goods. But if we embargo Britain and America embargoes us, our entire economy may stop functioning properly. To prevent this, we must sign an agreement with the United States. If this is signed, we can ensure this does not happen and the USA will always support us economically and resource-wise." #NT!
  
 japsanfran.6.d: "With the reliance of Japan on our exports, if we embargo them, their economy will be heavily damaged. Because of this, they have requested a trade treaty with them. With this trade treaty, we can lower our reliance of British goods. While they don't have the amount of resources Britain has, the less ties we have we the British, the less problems we will have when we go to war with them." #NT!
  
 japsanfran.7.d: "With Texas being basically ran by Standard Oil, we have little way to stop such monopoly. With the Japanese companies such as Mitsubishi and Kawasaki, these companies can contest the trust in Texas. We shall notify the Japanese delegates on this." #NT!
  
 japsanfran.8.d: "The Americans have notified us on Standard Oil, one of the largest Oil Companies on Earth, and their monopoly over the Texan Oil industry. In order to help counter the trust that John D. Rockafeller has, the American negotiator has asked us to promote investments by the Zaibatsus, such as Nippon Oil, into the American market. This deal would help Japan secure a stable source of US oil for our growing needs while the Americans would gain a much needed source of foreign capital." #NT!
  
 japsanfran.9.d: "With the evaluation done by the Department of Defense on Pacific bases, they have concluded that we need more allies in the Pacific to supply an army against any possible interests. Now with the San Francisco Summit, it is best for us to ask, since the Pacific Bulwark will be able to fight off any aggression." #NT!
  
 japsanfran.10.d: "Due to the lack of an American fortress in East Asia besides the Phillipines, which cannot fully support a full fleet of America or Guam, which is too small to supply a sized American army. If the Americans are allowed basing rights, in return we will also gain basing rights on American bases. While this might not be as well as an military alliance, this is just as good a deal." #NT!
  
 japsanfran.11.d: "The Department of Defence has recommended the president to quickly propose an coalition with the Japanese. While the edges still need to be worked out, we must ensure that Japan will be with us, or if they aren't, we shall defeat them sooner or later." #NT!
  
 japsanfran.12.d: "The American President, in response to the great acceptance to their proposals, have proposed one last add-on. The American-Japanese Alliance. The forged alliance will protect both Japanese and American interest in the Pacific, combating the British imperialism. The details will be discussed only if the Japanese agreed to the Alliance first." #NT!
  
 japsanfran.13.d: "The Japanese have accepted the Great Pacific Treaty! With this known, many throughout the government rejoice! With this, it is sure that the Japanese will become a definite ally of us. This means that our grand pacific alliance will be able to protect the interests of our own, no matter what." #NT!
  
 japsanfran.14.d: "As negotiation talks break down, the Japanese has declared that they will not be limited by this treaty, in one way or another. Now this will mean that war will come, no body is sure, but what is sure is that the Washington Naval Treaty will no longer be valid." #NT!
  
 japele.1.d: "The Election of 1936 is here. As usual, only Rikken Minseitō and Rikken Seiyūkai are competeting to be elected. This year Minseitō promised for more rights for workers while Seiyūkai hopes to modernise the railway systems. The election seems to be neck and neck and no one seems to be able to win completely. Who will win this year?" #NT!
  
 japele.2.d: "As the new Parliament starts to draft a new budget for the upcoming two years, the both branches of the Military are asking for the priority. We only have enough money for one of the two branches, so who shall we provide it to? The staggering army needs extra funding for expansion to ensure the security of our overseas possessions and research? Or the aging navy of which many ships have aged and needs modernisation and improvements completed soon?" #NT!
  
 japele.3.d: "The Elections of 1938 is here. With the many crisis we have gone against, we shall choose a new and strong government. Minseitō has been calling for more rights for workers, while Seiyūkai wishes to in" #NT!
  
 japtraf.5.d: "Our spies have reported to our Naval Attache in Britain that a new battleship is on trial, named HMS Trafalgar. Not just any normal battleship. She is a super heavy battleship, armed with brand new, state-of-the-art 18 inch guns, unopposed armor and an unrivaled amount of Anti-Air armament. She is so powerful, that one of her can rival 3 or 4 battleships, freeing up capital ships for the British home waters and threaten our naval supremacy in the Asian seas. We shall notify our American allies and decide our action on it." #NT!
  
 jap.44.d: "As the sea trials of HMS Trafalgar continue, our Admirals panic at such a balance disrupting design so out of the blue. With some of the admirals pulling themselves together, they have written a request for a discussion within the diet. While this directly bypasses the parliament, the diet seems to not care in such time of importance. Now, with the diet finally assembled to discuss our response to such the act, we can truly decide our actions. Some in the admiralty suggest requesting the British foreign ministry for the design, while some suggest stealing it. What shall we do now?" #NT!
  
 jap.45.d: "Our Foreign Office has just received a letter from the Japanese Diet, requesting that us give the Japanese navy a duplicate for the design for our state-of-the-art flagship, HMS Trafalgar. The Admiralty is currently hosting a fierce debate for the confidentiality of our trials, while both houses of the government are hosting debates just as fierce for whether or not we should hand over the designs. If we do, we can be sure that Japan will be building a ship of roughly the same displacement and analyise the weaknesses of our design, but if we don't, we will be damaging our relationship heavily. Do we risk it or not?" #NT!
  
 jap.46.d: "A messenger from the Admiralty has just reached the Foreign Office, swearing as he bust into the halls of the office, informing the Foreign Secretary about the arrest of a \"sneaky bugger lurking inside the Admiralty, near the archives\". The lurker is believed by both the Scotland Yard and the Admiralty as an spy for the Japanese government, our supposed ally. Now we do not have a suitable respond just yet, but we shall accuse the Japanese for shady actions for some mere designs!" #NT!
  
 jap.47.d: "Our foreign ministry has just received a document from the British diplomat, saying that it is an 'early Christmas Present' and 'the Admiralty will love it'. After analyzing, it seems that the document is the design for HMS Trafalgar. The Admiralty is very glad for the design and has started assembling a Committee for the analysis for the design. We shall send the British our utmost gratitude." #NT!
  
 jap.49.d: "Bakayaro! Our spy who was sent to steal the designs of Trafalgar was caught, and the British are accusing us of provoking aggression and the British populace is up in arms! The most outrageous nationalistic claims of us say that we are harboring imperialistic hopes and warmonging beliefs, while the most reasonable are still biased towards the British. The Diet has already offered an official apology for the indecent act of the thief, while denying any possible connections to him. This has gone very badly despite the high expectations of the operation planners." #NT!
  
 jap.50.t: "Joining the Japanese Sphere" #NT!
 jap.50.d: "For months already, the Japanese have expressed their aggressive ambitions towards our colonial lands as part of their expansionist policies. Today, the Japanese ambassador has presented us an ultimatum: They demand that we become a protectorate of the Empire, or else we will face the full might of the Imperial Japanese Military..." #NT!
 jap.50.a: "Agree to their demands." #NT!
 jap.50.b: "Don't even bother answering." #NT!
  
 jap.51.d: "We just recently joined the ranks of the Imperial Protection Alliance, but many think we do not belong and are of inequal footing to them. For the sake of a lasting relationship, we must start securing our place in the alliance. But many in the government are debating on how should we secure our place. Our most obvious ways is to persue more economic cooperation inside the Imperial Protection Alliance, or to persue more military cooperation by trading military technology." #NT!
  
 jap.52.d: "The Japanese diplomat has just met with the Foreign Secretary and shown Japan's hopes for persuing further economic cooperation, by more mutual economic trade and investments. He claims this is due to the dissentient by other allies. They have already started drafting a proposal for economic investment, ranging from new steam locomotives and new civilian planes to brand new shipping route services. The Japanese are very keen for securing their place in the Alliance as an integral part, inseperable." #NT!
  
 jap.53.d: "The Japanese diplomat has just met with the Foreign Secretary to discuss Japan's hopes for persuing further military cooperation. He claims that this is due to dissentient by other allies. The two Foreign ministers have discussed how can the two cooperate further. Some concepts include some war games in different terrain to further train the troops in different terrain and exchanging advisors for doctrine development. The Japanese are very keen for securing their place in the Alliance as an integral part, inseperable." #NT!
 jap.54.t: "Japan Seizes Guam" #NT!
 jap.54.d: "With America in turmoil, Japan has moved onto the island of Guam and other pacific territory. There is very little that the US government can do to stop Japan at this point." #NT!
 jap.54.a: "We'll get them back" #NT!
  
 jap.55.t: "[FROM.GetNameDefCap] Surrenders!" #NT!
 jap.55.d: "Seeing the might of our forces, [FROM.GetNameDef] had no chance but to submit before the brave sons of the empire!" #NT!
 jap.55.a: "A wise choice..." #NT!
  
 jap.56.t: "[FROM.GetNameDefCap] Resist!" #NT!
 jap.56.d: "[FROM.GetNameDefCap] are resisting our demands, believing that the [USA.GetAdjective]s will come to their rescue. We should make them pay for this in blood." #NT!
 jap.56.a: "We will destroy them." #NT!
 jap.56.b: "Drop the matter." #NT!
  
 jap.57.t: "[FROM.GetNameDefCap] Begs for Help!" #NT!
 jap.57.d: "Japan is pounding at the door of [FROM.GetNameDef], and they have come to us begging for assistance. Should we respond?" #NT!
 jap.57.a: "Offer our protection" #NT!
 jap.57.b: "We cannot stretch ourselves so far." #NT!
  
 jap.58.t: "The Tokyo-Berlin Axis" #NT!
 jap.58.d: "In our quest to overturn the unjust Entente world order, it appeared that we would have to stand alone in such a grand and dangerous journey. Yet, it seems that the nations of the world are beginning to awake to the reality of the degenerate liberal world order. Recently, we have received a request from the rising Empire of Japan on the prospects of further collaboration and even of an alliance to once and for all smash western hegemony to pieces. Whilst this is a tempting offer, we must consider the great distance between our two nations and the fact that German hegemony must come first once all is said and done." #NT!
 jap.58.a: "The world shall tremble at our collective might!" #NT!
 jap.58.b: "This is far too risky..." #NT!
  
 jap.59.t: "[FROM.GetName] refuses!" #NT!
 jap.59.d: "Despite our sincere attempt to secure aid in the liberation of Asia, it seems the dastardly Germans have refused, citing nonsensical excuses such as inopportune global conditions and the great distance between our two countries. Nevertheless, this will serve as a lesson to never trust Europeans." #NT!
 jap.59.a: "Only Asians can liberate Asia." #NT!
  
 jap.60.t: "From an Axis to Allies" #NT!
 jap.60.d: "As war rages throughout the world, Germany seemingly stands alone. With inferior powers at our beckon and our foes growing ever stronger and numerous, it cannot be doubted just how necessary a worthy ally would be. It seems however that salvation has arrived from the East, with our mutual prosecution of the war against the same enemies, Tokyo has asked that we cooperate ever more closely for the final victory against the old order." #NT!
 jap.60.a: "The time has come..." #NT!
 jap.60.b: "...for Tokyo to see reality." #NT!
 jap.60.b.tt: "§RTokyo will be rebuffed from their laughable proposition§!" #NT!
  
 jap.61.t: "The Axis Alliance" #NT!
 jap.61.d: "In perhaps what should have been expected, but still surprising announcement from Berlin, we have learned that Germany has joined us in our mission to free Asia. Together, the old powers will quake in their boots as the enlightened, superior peoples of Germany and Japan smash their hordes into dust!" #NT!
 jap.61.a: "Together, the world shall be free of Western hegemony!" #NT!
  
 jap.62.t: "A Rude Awakening" #NT!
 jap.62.d: "It seems that despite our mutual attempts to pursue greater cooperation, the Germans have refused our offer! Such a refusal has put relations at a standstill and many are lamenting this failure to cooperate against undoubtedly greater foes." #NT!
 jap.62.a: "Damn them!" #NT!
  
 jap.63.t: "The End of the Axis" #NT!
 jap.63.d: "With the defeat of the old order in Asia, it seems that Japan has opted to leave the Germans behind. From now on, colonialism shall not subjugate nor rule Asia - with Japan leading the rest of us into this new future." #NT!
 jap.63.a: "Asia can now prosper." #NT!
 jap.63.b: "We shall go our own way." #NT!
  
 jap.64.t: "The Loss of the Far East" #NT!
 jap.64.d: "Despite all that we have done, our war effort in the Far East has become totally grim. With all of our allies in Asia having been defeated and our territories occupied, along with the diminishing prospect of any return to the Far East in a military sense and the realistic inability for the Japanese to strike us in Europe, many have decided that the time for peace has come." #NT!
 jap.64.a: "It is over..." #NT!
 jap.64.b: "Never!" #NT!
 jap.64.c: "We must consult our ally first!" #NT!
  
 jap.65.t: "Peace in the East?" #NT!
 jap.65.d: "With the war in the Far East appearing lost, [FROM.GetNameDef] has consulted us on whether or not the time for peace has come. Whilst a minority of diehards may suggest that all resources be thrown into continuing the struggle, most can agree that such an idea is at best, futile." #NT!
 jap.65.a: "So be it." #NT!
 jap.65.b: "Ridiculous!" #NT!
  
 jap.66.t: "A Telegram from [FROM.Capital.GetCapitalVictoryPointName]" #NT!
 jap.66.d: "We have just received news from [FROM.GetNameDef] that they are willing to surrender their Far East holdings to us, allowing us and their other foes in the Far East to divide up the spoils of their imperial system." #NT!
 jap.66.a: "Excellent!" #NT!
 jap.66.b: "We shan't rest until we march in [FROM.Capital.GetCapitalVictoryPointName]!" #NT!
  
 jap.67.t: "The War Continues" #NT!
 jap.67.d: "In spite of our evacuation of the Far East, [FROM.GetNameDef] has refused to give up, insisting on continuing the war until they see us humiliated in our own capital!" #NT!
 jap.67.a: "Unfortunate..." #NT!
  
 jap.68.t: "Defeat in the Pacific" #NT!
 jap.68.d: "In spite of our best efforts, there is little denying that we have lost the war in the Pacific. The Japanese, now holding a significant advantage both navally and strategically have proven able to hold out against our onslaught despite their numerical inferiority.\n\nWith the war turning ever worse for us, many in Congress are now calling for us to leave the war and let the Japanese have Asia. Whilst this will undoubtedly deal a crippling blow to our ability to project power in Asia and beyond, many fear what will come if the Japanese are encouraged to grow stronger and stronger in the face of our flailing attempts to strike back." #NT!
 jap.68.a: "Those bastards can have the Pacific." #NT!
 jap.68.b: "We will not let these mice terrify us into submission!" #NT!
 jap.68.c: "Let us consult our European allies first." #NT!
  
 jap.69.t: "America Laid Low" #NT!
 jap.69.d: "With the defeat of the old order in Asia, it seems that Japan has opted to leave the Germans behind. From now on, colonialism shall not subjugate nor rule Asia - with Japan leading the rest of us into this new future." #NT!
 jap.69.a: "Banzai!" #NT!
 jap.69.b: "We look forward to dictating peace in the White House." #NT!
  
 jap.70.t: "The Giant Falls" #NT!
 jap.70.d: "Whilst we still continue to hold out against the Japanese menace, it seems that the United States have opted to withdraw from the war in Asia. Having doubtlessly served as a crucial ally in the war against Japan, it seems that the Japanese pressure was too much for the Americans to handle and now we are left alone to deal with the Asian menace.\n\nWith America defeated, our remaining allies in Asia have lost hope. If the world's greatest economy cannot resist Japanese aggression, who can?" #NT!
 jap.70.a: "This is not good..." #NT!
  
 jap.71.t: "American Withdrawal?" #NT!
 jap.71.d: "With the Japanese having achieved victory after victory in Asia, it seems that the Americans have been brought to the brink. Recently, a telegram from Washington has requested that we allow them to withdraw seperately from the conflict - to cut losses in the unwinnable war against Japan so to speak. Whilst this will prove severely damaging to our war effort in Asia, perhaps they do have a point in leaving the Japanese be so that we can focus on continents closer to home." #NT!
 jap.71.a: "Fine." #NT!
 jap.71.b: "Tell them that they can count on our help." #NT!
  
 jap.72.t: "[FROM.GetNameDef] refuses!" #NT!
 jap.72.d: "Despite our hopes of their acceptance, it seems that our ally has under no circumstances accepted peace in the Far East. It seems that it now remains on us to appear traitorous and ask for peace anyways or to continue the war that is by all accounts seemingly at a impasse." #NT!
 jap.72.a: "Oh well." #NT!
 jap.72.b: "Forget that we asked." #NT!
  
 jap.73.t: "Demands From Tokyo" #NT!
 jap.73.d: "With the fall of the homeland, the vultures have begun to circle around the French empire. Most worryingly for us, the Japanese have come knocking - their demands essentially amount to their takeover of the colony. While we would remain de jure in-charge, Tokyo would become the main party sending us orders and demands. While resistance is possible, we will likely be cut off if we do so alone as the metropole is in no position to aid us - what shall we do?" #NT!
 jap.73.a: "We have little choice..." #NT!
 jap.73.b: "We will never disgrace ourselves!" #NT!
  
  
