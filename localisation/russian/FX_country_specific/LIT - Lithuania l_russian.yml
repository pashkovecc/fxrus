 LIT_paternal_autocrat_party_long: "Naujoji Tautos pažangos partija\n§gНовая партия национального прогресса§!\n§LПоскольку крайние члены Литовского националистического союза захватили контроль над партией, умеренные члены партии из более старого происхождения решили расколоться, восстановив то, что они называют более умеренными и аристократическими корнями партии - Партией национального прогресса. Хотя он по-прежнему является этническим литовским националистом, он придерживается более умеренных позиций.§!" # Naujoji Tautos pažangos partija\n§gNew Party of National Progress§!\n§LAs the extreme members of the Lithuanian Nationalist Union have seized control of the party, moderate members of the party from an older extraction have chosen to split, restoring what they describe as the more moderate and aristocratic roots of the party - the Party of National Progress. Though still ethnic Lithuanian nationalist, it holds more moderate stances.§!

