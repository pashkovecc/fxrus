###FOCUSES###
 ZHI_MAIN_far_east: "Далеко на Восток" # Far to the East
 ZHI_MAIN_far_east_desc: "За восточными воротами лежит некогда единое королевство, внушающее страх всем землям; Китай, Поднебесная. С тех пор, как первый президент Китайской Республики Юань Шикай провозгласил себя императором Китая Хунсянь, что привело к гражданской войне, которая преследует Китай вот уже несколько десятилетий, клика Чжили существует там. Мы не раз были близки к уничтожению, мы были созданы в самых суровых условиях и поэтому добьемся успеха." # Beyond the gates to the east, lies a once united kingdom feared by lands wide and far; China, the Middle Kingdom. Since the first president of the Republic of China, Yuan Shikai, declared himself the Hongxian Emperor of China leading to the civil war that has plagued China for decades now, the Zhili Clique has been there. Coming close to destruction more than once, we have been molded by the toughest environment possible and that is why we shall succeed.
 ZHI_MAIN_industry: "Наша разваливающаяся промышленность" # Our Crumbling Industry
 ZHI_MAIN_industry_desc: "Чтобы вернуться к былой мощи, прежде всего важно, чтобы наша отрасль была современной и работала с полной отдачей. Ни для кого не секрет, что в Китае в целом не только ужасные условия труда, но и отсутствие модернизации как в промышленности, так и в вооружениях. Мы постараемся исправить и то, и другое." # To return to our former might it is first and foremost important for our industry to be up to date and working at full efficiency. It is no secret that China as a whole has not only abysmal working environments but also lacks modernization in both industry and weaponry. We shall try to fix both.
 ZHI_MAIN_clear_forests: "Очистить леса" # Clear the Forests
 ZHI_MAIN_clear_forests_desc: "Чтобы освободить место для наших новых заводов и будущей промышленности, придется вырубить большие лесные массивы." # To make space for our new factories and future industry, large forested areas will have to be cleared.
 ZHI_MAIN_factories: "Основание новых заводов" # Establish New Factories
 ZHI_MAIN_factories_desc: "Для улучшения нашей промышленной ситуации крайне важно существенно увеличить размер нашей промышленности. Хотя сейчас это кажется далекой целью, вскоре мы можем оказаться у подножия промышленной революции в Восточной Азии." # To improve our industrial situation it is paramount that we increase the size of our industry substantially. While this seems like a distant goal now, we may soon find ourselves at the foot of an East Asian industrial revolution.
 ZHI_MAIN_subsidies: "Субсидии для новых компаний" # Subsidies for New Companies
 ZHI_MAIN_subsidies_desc: "У некоторых людей в нашей стране есть товары, которые они хотят производить и продавать как на местных, так и на международных рынках. Однако экономика в нашем штате настолько бедна, что у них нет средств для открытия таких компаний. Государственная программа субсидирования поможет решить эту проблему." # Several people within our nation have goods they want to produce and sell on local as well as international markets. However, the economy within our state is so poor that they don't have the funds to start said companies. A state-sponsored subsidy program will help fix this problem.
 ZHI_MAIN_jap_funds: "Попросите у японцев денег" # Ask the Japanese for Funds
 ZHI_MAIN_jap_funds_desc: "Поскольку японцы являются нашим союзником, возможно, было бы разумно использовать это в своих интересах. Строительство новых заводов будет дорогостоящим, и наличие средств для этого будет иметь решающее значение. Это, конечно, будет означать, что японцы будут иметь большее влияние на наши будущие действия и могут иметь серьезные последствия, если между нашими двумя странами возникнет напряженность." # With the Japanese being our ally, it may be prudent to use this to our advantage. Building new factories will be both expensive and having the funds to do so will be critical. This will, of course, mean that the Japanese have more influence over our future actions and may have grave consequences should tensions arise between our two nations.
 ZHI_MAIN_jap_corps: "Пригласите японские корпорации" # Invite Japanese Corporations
 ZHI_MAIN_jap_corps_desc: "Вместо финансирования компаний на местном уровне нам было бы полезно пригласить уже хорошо зарекомендовавшие себя корпорации и компании из Японии. Увеличение количества товаров общего назначения в обращении никогда не сможет нанести вред нашей экономике." # Instead of funding companies locally it would benefit us to invite already well-established corporations and companies from Japan. Increasing the amount of general goods in circulation could never possibly hurt our economy.
 ZHI_MAIN_jap_imports: "Увеличение импорта из Японии" # Increase Imports from Japan
 ZHI_MAIN_jap_imports_desc: "Опасения перед новым голодом, подобным голоду 1920-х годов, заставили многих поверить в то, что увеличение и без того весьма значительного импорта из Японии может быть разумной идеей. Шансы на то, что такой голод повторится снова, неопределенны." # Fears of another famine like the one in 1920s have led to many believing that increasing the, already quite substantial, imports from Japan may be a reasonable idea. The chances of such a famine occurring again are uncertain.
 ZHI_MAIN_military: "Наша могучая армия" # Our Mighty Military
 ZHI_MAIN_military_desc: "Как видно из нашей великой и славной армии, клику Чжили можно назвать кем угодно, только не антивоенной. Имея одну из крупнейших, наиболее опытных и хорошо управляемых армий в Китае, Чжили является гордым напоминанием о том, каким должен стремиться весь Китай. Но какой бы хорошей ни выглядела ситуация со стороны, армия находится в далеко не хорошем состоянии. Ополченцы, состоящие из бандитов, свободно бродят по стране, когда они не служат в армии. Оружие, используемое в армии, устарело, а в наших войсках наблюдается серьезная недисциплинированность и склонность к неповиновению прямым приказам. Последняя из этих проблем связана с тем фактом, что наши люди и армии состоят из слабо связанных между собой вооруженных людей. Эти вопросы НЕОБХОДИМО рассмотреть, если мы хотим победить в предстоящей войне." # As is clear by the sight of our great and glorious army, the Zhili Clique can be said to be almost anything but anti-military. With one of the largest, most experienced, and well-led armies in China, Zhili stands as a proud reminder of what all of China should strive to be. But, however good the situation may look from the outside, the army is in anything but a good state. Militias made up of bandits freely roam the country whenever they're not serving in the army, The weapons used in the army are outdated, and our troops have a severe lack of discipline and tendency to disobey direct orders. The latter of these issues stems from the fact that our men and armies are made up of loosely bonded men in arms. These issues NEED to be seen too if we are to win in the coming war.
 ZHI_MAIN_wu_reforms: "Реформы У Бэйфу" # Wu Peifu's Reforms
 ZHI_MAIN_wu_reforms_desc: "Чтобы повысить не только боеспособность нашей армии, но и административную эффективность, У Пейфу предложил ряд реформ, которые он хочет провести. Реформы в основном были направлены на реструктуризацию раздутой организации армий и расширение роли отдельных отрядов, чтобы придать им цель, выходящую за рамки простого подчинения приказам. Будет ли это иметь достаточный эффект, покажет только время." # To improve not only the combat effectiveness of our army, but the administrative effectiveness Wu Peifu has come up with a series of reforms that he wishes to push through. The reforms largely meant to restructure the bloated organization of the armies and to expand the role of the individual squads, as to give them purpose beyond just obeying orders. Whether this will have enough of an effect to matter only time will tell.
 ZHI_MAIN_jap_advisors: "Японские военные советники" # Japanese Military Advisors
 ZHI_MAIN_jap_advisors_desc: "Чтобы повысить эффективность наших армий в предстоящей войне, мы должны попросить советников Японской императорской армии лучше изучить новые способы ведения войны." # To improve the effectiveness of our armies for the coming war, we should request advisors from the Japanese Imperial Army to be more learned in the new ways of warfare.
 ZHI_MAIN_org_militia: "Организовать ополченцев" # Organise the Militias
 ZHI_MAIN_org_militia_desc: "Большая часть наших армий состоит из обычных головорезов и бандитов, которые вступают в армию, когда начинается война, потому что наша экономика просто не может оплатить всю нашу армию, поскольку она слишком велика, а наша нация слишком мала. Поэтому мы предложили несколько различных решений этой растущей проблемы." # A big portion of our armies derive from common thugs and bandits who enlist when a war breaks out because our economy simply can't pay our entire army as it is too large and our nation is too small. We have therefore proposed several different solutions to this growing problem.
 ZHI_MAIN_why_fight: "Напомните им, почему мы ссоримся" # Remind Them Why We Fight
 ZHI_MAIN_why_fight_desc: "Наши армии сражаются за нас, но не преследуют какой-либо единственной цели, кроме эгоизма. У Пейфу намерен ратифицировать это, произнеся речь, призванную дать цель как пехотинцу, так и офицеру." # Our armies fight for us, but fight for no singular goal except selfishness. Wu Peifu means to ratify this by holding a speech meant to give purpose to both infantryman and officer alike.
 ZHI_MAIN_mil_budget: "Увеличьте наш военный бюджет с помощью Японии" # Increase our Military Budget with Japanese Assistance
 ZHI_MAIN_mil_budget_desc: "Наш военный бюджет может быть большим, но он может быть и больше. Нам было бы хорошо, если бы японцы могли финансировать производство нового вооружения, униформы и различных других материалов, необходимых для нормального функционирования армии." # Our military budget may be big, but it can be bigger. It would serve us well if the Japanese could fund our production of new weaponry, uniforms, and the various other supplies needed for a proper army to function.
 ZHI_MAIN_jap_weapons: "Японское оружие" # Japanese Weapons
 ZHI_MAIN_jap_weapons_desc: "Оружие, используемое в наших армиях, устарело и неэффективно. Нам следует импортировать более новые японские модели, чтобы компенсировать этот огромный недостаток. Кто знает, может быть, мы чему-нибудь научимся." # The weapons used in our armies are outdated and ineffective. We should import newer, Japanese models, to compensate for this massive disadvantage. Who knows, maybe we'll learn a thing or two.
 ZHI_MAIN_jaden_jewel: "Джейденская жемчужина Китая" # The Jaden Jewel of China
 ZHI_MAIN_jaden_jewel_desc: "Мы улучшили наши провинции и клику в целом до такой степени, что многие начали называть клику Чжили «нефритовым драгоценным камнем» Китая в отношении нашего лидера. Гордость чувствуется не только в армиях, но и на улицах наших городов. Чжили вернул былую славу." # We have improved our provinces and clique as a whole, to such a degree that many have started to refer to the Zhili Clique as the "Jaden Jewel" of China, about our leader. The pride can be felt not only in the armies but also in the streets of our cities. Zhili has returned to its former glory.
 ZHI_MAIN_broken_jewel: "Сломанная жемчужина Китая" # The Broken Jewel of China
 ZHI_MAIN_broken_jewel_desc: "Если из-за какого-то ужасного инцидента мы никогда полностью не восстановим нашу великую нацию, это может привести к разрушительному и разрушительному упадку нашей некогда доминирующей клики. Однако этого не могло произойти. Верно?" # If by some horrible incident, we never fully restore our great nation it may lead to a crippling and destructive demise of our once dominant clique. This couldn't possibly happen, however. Right?
 ZHI_MIL_traitors: "Клика предателей" # A Clique of Traitors
 ZHI_MIL_traitors_desc: "Армия, готовая нанести удар в спину, — это вообще не армия. Надо немедленно начать модернизацию нашей армии... Но как?" # An army ready to backstab itself isn't an army at all. We should start the modernization of our army at once... But how?
 ZHI_MIL_suns_plan: "План Сунь Чуаньфана" # Sun Chuanfang's Plan
 ZHI_MIL_suns_plan_desc: "Сунь Чуаньфан предложил план, который предполагает оснащение наших войск лучшим доступным оборудованием и более широкое использование артиллерии. Это, несомненно, улучшит нашу военную ситуацию." # Sun Chuanfang has proposed a plan that involves equipping our troops with the best equipment available and utilizing artillery in greater numbers. This would surely improve our military situation.
 ZHI_MIL_sun_jap_help: "При поддержке Японии" # With Japanese Support
 ZHI_MIL_sun_jap_help_desc: "Мы должны двигаться вперед при поддержке Японии." # We should move forward with Japanese support.
 ZHI_MIL_rising_sun: "Ослепительный свет восходящего солнца" # Blinding Light of the Rising Sun
 ZHI_MIL_rising_sun_desc: "Опыт Китая в использовании новой и более современной военной техники ограничен. Таким образом, наем японских инструкторов для обучения наших людей использованию этого оружия окажется значительным преимуществом в будущем." # Chinese experience with newer and more modern military equipment is limited. As such, hiring Japanese instructors to train our men in using it will prove a significant advantage in the future.
 ZHI_MIL_quality_equip: "Качественное оборудование" # Quality Equipment
 ZHI_MIL_quality_equip_desc: "С помощью Японии мы наконец сможем начать производство лучшего оборудования в Китае." # With Japanese help, we can finally start producing the finest equipment in China.
 ZHI_MIL_sun_no_help: "Без поддержки Японии" # Without Japanese Support
 ZHI_MIL_sun_no_help_desc: "Мы должны двигаться вперед без поддержки Японии." # We should move forward without Japanese support.
 ZHI_MIL_thunder_rains: "Громовой дождь с неба" # Thunder Rains from the Sky
 ZHI_MIL_thunder_rains_desc: "Огонь прольется сверху, а наши враги бегут от летящих в них осколков гранат и снарядов. Нет и никогда не будет китайской армии, столь же хорошо оснащенной и боеспособной, как армия Чжили." # Fire shall rain from above as our enemies flee the howling shards of grenades and projectiles hurling towards them. There has and never will be a Chinese army as well-equipped and well-performing as the Zhili army.
 ZHI_MIL_well_equipped: "Хорошо оснащенная армия" # A Well-Equipped Army
 ZHI_MIL_well_equipped_desc: "Наши армии оснащены лучше всего во всем Китае. Возможно, у нас нет такой организации, как у других, но наши винтовки и артиллерия не имеют себе равных." # Our armies are the best-equipped in all of China. We may not have the organization of others, but our rifles and artillery are unmatched.
 ZHI_MIL_jade_marshall_plan: "План Нефритового маршала" # The Jade Marshal's plan
 ZHI_MIL_jade_marshall_plan_desc: "У Пейфу считает, что мы должны использовать превосходное планирование и дисциплину, чтобы выиграть предстоящие войны, все остальное второстепенно." # Wu Peifu believes we should make use of superior planning and discipline to win the wars ahead, anything else is secondary.
 ZHI_MIL_replace_artillery: "Заменить старую артиллерию" # Replace Old Artillery
 ZHI_MIL_replace_artillery_desc: "Наша артиллерия старая и устаревшая. Мы должны стремиться к их полной замене и производству более новой и совершенной техники." # Our artillery is old and outdated. We should seek to replace them completely and produce newer and more advanced equipment.
 ZHI_MIL_grand_with_jap: "При поддержке Японии" # With Japanese Support
 ZHI_MIL_grand_with_jap_desc: "Японцы знают дисциплину как никто другой. С их помощью мы должны двигаться вперед." # The Japanese know discipline like no others. We should move forward with their help.
 ZHI_MIL_jap_org: "Японская организация" # Japanese Organisation
 ZHI_MIL_jap_org_desc: "Чтобы модернизировать наши армии, мы должны черпать вдохновение из их организации. Структурирование дивизий и будущих подразделений имеет решающее значение для победы в любой войне." # To modernize our armies we should take inspiration from the organisation of theirs. Structuring of divisions and future units is crucial to winning any war.
 ZHI_MIL_jap_officers: "Японские офицеры в армии" # Japanese Officers in the Army
 ZHI_MIL_jap_officers_desc: "Чтобы еще больше дисциплинировать наши войска, мы наймем японских офицеров, которые возглавят несколько эскадрилий в армии... Язык — это вопрос, которым мы займемся позже." # To further discipline our troops, we shall hire Japanese officers to lead several squadrons within the army... Language is an issue we'll handle later.
 ZHI_MIL_grand_without_jap: "Без поддержки Японии" # Without Japanese Support
 ZHI_MIL_grand_without_jap_desc: "Японцы — пиявка нашей нации, без них мы прекрасно справимся." # The Japanese are a leech on our nation, we shall do just fine without them.
 ZHI_MIL_plan_scenarios: "Планируйте военные сценарии заранее" # Plan War Scenarios Ahead of Time
 ZHI_MIL_plan_scenarios_desc: "Каждый сценарий, каждый вариант и каждый выбор должны быть рассмотрены. Даже из 14 миллионов фьючерсов не может быть ни одного, где мы проиграем." # Every scenario, every option, and every choice must be considered. Even out of 14 million futures, there can not be a single one where we lose.
 ZHI_MIL_enforce_loyalty: "Обеспечение лояльности" # Enforce Loyalty
 ZHI_MIL_enforce_loyalty_desc: "Лояльность к начальству внутри нашей армии ослабла и ослабла. Мы ратифицируем это, введя в армии строгий кодекс закона. Нелояльность не остается безнаказанной." # Loyalty to superiors within our army has grown weak and loose. We shall ratify this by enforcing a strict code of law in the army. Disloyalty does not go unpunished.
 ZHI_MIL_well_led: "Хорошо управляемая армия" # A Well-Led Army
 ZHI_MIL_well_led_desc: "Ни одна армия в Китае, а возможно, и во всем мире не обладает таким хорошим руководством, как армия клики Чжили. Мы научим их тому, как много значит планирование." # No army in China, perhaps the entire world, is as well-led as the army of the Zhili Clique. We'll teach them just how much planning means.
 ZHI_modern_military: "Современная армия" # A Modern Military
 ZHI_modern_military_desc: "Приложив чрезвычайные усилия, наши вооруженные силы наконец-то достигли стандартов современной нации. Все преклоняются перед новыми хозяевами Китая; клика Чжили" # With extreme effort, our military is finally up to the standards of a modern nation. All bow before the new masters of China; the Zhili Clique
 ZHI_comittee_fails_to_make_a_decision: "Комитет не может принять решение" # The Committee Fails to Make a Decision
 ZHI_comittee_fails_to_make_a_decision_desc: "Каким-то образом комитет провалился... Как?" # Somehow the committee failed... How?
 ZHI_use_our_vast_manpower: "Используйте нашу огромную рабочую силу" # Use Our Vast Manpower
 ZHI_use_our_vast_manpower_desc: "У нас есть рабочая сила, давайте ее использовать!" # We have the manpower, let's use it!
 ZHI_new_weapons: "Приобретайте новое оружие" # Acquire New Weapons
 ZHI_new_weapons_desc: "Даже если наши армии велики, без оружия они ничто. Возможно, было бы полезно иметь более новые пушки?" # Even if our armies are large, they're nothing without a gun. Perhaps it would be useful to have newer guns?
 ZHI_depth_in_lines: "Глубина линий" # Depth in the Lines
 ZHI_depth_in_lines_desc: "Если один солдат падет, его место должны занять еще двое." # If one soldier falls, two more must take his place.
 ZHI_strategically_placed_operations: "Стратегически расположенные концентрации" # Strategically Placed Concentrations
 ZHI_strategically_placed_operations_desc: "Если мы стратегически сконцентрируем наши силы в определенных местах вдоль линии фронта, мы сможем выдерживать более продолжительные атаки и более эффективно контратаковать." # If we strategically concentrate our forces in specific places along the frontlines, we'll be able to suffer more sustained attacks and counterattack more efficiently.
 ZHI_not_modern_military: "Современная армия?" # A Modern Military?
 ZHI_not_modern_military_desc: "Наши вооруженные силы, возможно, не совсем соответствуют современным стандартам... Но действительно ли нам это нужно?" # Our military might not be quite up to modern standards... But really, do we need it to be?
 ZHI_jade_emperor_domain: "Владения Нефритового императора" # The Jade Emperor's Domain
 ZHI_jade_emperor_domain_desc: "Нефритовый император управляет небом, своим царством. Мы, наконец, воспользуемся властью клики Чжили и над небом!" # The Jade Emperor guides the skies, his realm. We shall finally invoke the Zhili Clique's land-dominance over the skies as well!
 ZHI_grand_scheme: "Великий план" # The Grand Scheme
 ZHI_grand_scheme_desc: "Уничтожая методы производства и инфраструктуру с неба, мы можем помешать врагам продолжать войны." # By destroying production methods and infrastructure from the skies, we can prevent the enemies from continuing any longer wars.
 ZHI_minor_support: "Незначительная поддержка" # Minor Support
 ZHI_minor_support_desc: "Поддержка наших войск в небе является наиболее важной. Потерять меньше людей — значит убить больше врагов." # Support for our troops in the skies is the most important. Losing less men means killing more enemies.
 ZHI_winds_of_destruction: "Ветры разрушения" # Winds of Destruction
 ZHI_winds_of_destruction_desc: "Были составлены планы по созданию элитных подразделений бомбардировщиков, которые будут летать в суровую погоду, чтобы застать врага врасплох, мы называем их «Ветры разрушения». Мы никогда не будем связаны законами природы!" # Plans have been made to create elite units of bomber squads who fly in harsh weather to catch the enemy by surprise, we call them - The 'Winds of Destruction'. We shall never be bound by the rules of nature!
 ZHI_dragon_of_the_east: "Дракон Востока" # Dragon of the East
 ZHI_dragon_of_the_east_desc: "Сон дракона подошел к концу. Построив больше авиабаз, мы сможем разместить больше самолетов." # The dragon's slumber has come to an end. By building more airbases we'll be able to field more planes.
 ZHI_legacy_of_the_monkey_king: "Наследие Короля обезьян" # Legacy of the Monkey King
 ZHI_legacy_of_the_monkey_king_desc: "Сунь Укун, Король Обезьян, использовал свой ум и ловкость, чтобы победить своих врагов. Мы сделаем то же самое." # Sun Wukong, the Monkey King, used his wit and agility to defeat his enemies. We shall do the same.
 ZHI_heaven_bow_before_us: "Небеса склоняются перед нами" # The Heavens Bow Before Us
 ZHI_heaven_bow_before_us_desc: "Сами небеса наконец-то в нашей власти! Любой враг, осмелившийся выступить против нас, встретит ожесточённое сопротивление в небе." # The heavens themselves are finally ours to command! Any enemy who dares oppose us will face fierce resistance in the skies.
 ZHI_dragon_of_eastern_sea: "Дракон Восточных морей" # Dragon of the Eastern Seas
 ZHI_dragon_of_eastern_sea_desc: "Хотя на данный момент мир лишен возможности править как на суше, так и на море, в будущем мир научится бояться гнева китайских военных флотов. Создание и установление присутствия в Желтом море и за его пределами должно быть одним из наших главных приоритетов." # Though kept from ruling both land and sea for now, in the future the world shall learn to fear the wrath of Chinese war fleets. To build and establish a presence in the Yellow Sea and beyond must be one of our top priorities.
 ZHI_serpent_of_the_deep: "Змеи глубин" # Serpents of the Deep
 ZHI_serpent_of_the_deep_desc: "Один путь над морем, другой под ним. Тихо скользя по глубинам океана незамеченными, змеи глубин будут преследовать конвои нашего врага, пока у них не закончатся ресурсы. Впереди новый тип морской войны, и мы — ее хозяева." # One path above the sea, one under it. Slithering in silence through the depths of the ocean unnoticed, the serpents of the deep will pursue our enemy's convoys until they're starved of resources. A new type of naval warfare lies ahead, and we are its masters
 ZHI_unshakable_pursuit: "Непоколебимое преследование" # Unshakable Pursuit
 ZHI_unshakable_pursuit_desc: "Заложив основы нашего военно-морского флота, мы должны теперь рассмотреть тактику, которая будет использоваться при преследовании вражеских кораблей. С применением более новых и совершенных моделей торпед, похоже, наши силы вскоре станут непоколебимыми." # With the foundations of our navy laid out, we must now consider the tactics to be used in the pursuit of enemy ships. With the application of newer and better models of torpedoes, it seems likely that our forces will soon be unshakable.
 ZHI_under_the_cover_midnight: "Под покровом полуночи" # Under the Cover of Midnight
 ZHI_under_the_cover_midnight_desc: "Нанесение ударов ночью гарантирует, что противник будет застигнут врасплох, что еще больше усилит воздействие наших подводных лодок." # Striking at night will ensure that the enemy is caught unaware, making the impact of our submarines even bigger.
 ZHI_undetected_unexpected: "Необнаруженный, Неожиданный" # Undetected, Unexpected
 ZHI_undetected_unexpected_desc: "Новые технологии, импортированные из европейских стран, позволяют нам «прятаться» от радаров вражеских кораблей. Это, несомненно, окажется неизмеримо полезным." # New technology imported from European nations allows us to "hide" from the radars of enemy ships. This will surely prove immeasurably useful.
 ZHI_dragon_seas_of_the_high_sea: "Драконы открытого моря" # Dragons of the High Seas
 ZHI_dragon_seas_of_the_high_sea_desc: "Один путь под водой, другой над ним. Хотя у нас не так много средств для производства кораблей более крупных классов, это путь вперед." # One path under the sea, one above it. Though we don't have much in the means of production of bigger classes of ships, this is the way forward.
 ZHI_unbreakble_scales: "Нерушимые весы" # Unbreakable Scales
 ZHI_unbreakble_scales_desc: "Наши корабли покажут свое превосходство над другими в устойчивости, а не в скорости. Новые крупные корабли нашего нового флота будут окружены несколькими слоями брони, чтобы компенсировать отсутствие большого флота." # Our ships will show their superiority to others in resilience instead of superior speed. Multiple layers of armored skin shall surround our new navy's new capital ships to accommodate for the lack of a large navy.
 ZHI_the_dragon_breath: "Дыхание Дракона" # The Dragon's Breath
 ZHI_the_dragon_breath_desc: "Когда вопросы с броней решены, пришло время увеличить количество и мощность наших нынешних орудий. На больших кораблях нам потребуются большие и мощные орудия, именно их предоставят заводы в Китае." # With matters of armor settled, it's time we increase the amount and power of our current guns. With large ships we will need big and powerful guns, the factories in China shall provide exactly that.
 ZHI_dragon_king_of_the_seas: "Дракон-король морей" # Dragon King of the Seas
 ZHI_dragon_king_of_the_seas_Desc: "Теперь, когда мы распланировали возможности нашего военно-морского флота, мы должны начать строительство великого флагмана, который будет находиться на переднем крае всех наших морских сражений." # Now that we've planned out the capabilities of our navy, we must start construction of a great flagship to be at the forefront of all our naval battles.
 ZHI_masters_yellow_sea: "Хозяева Желтого моря" # Masters of the Yellow Sea
 ZHI_masters_yellow_sea_desc: "Наконец-то у нас есть флот, достойный китайского государства! Пришло время миру устрашиться нашей мощи и ощутить на себе ярость тысяч грохота орудий или стремительного продвижения наших подводных лодок. Сегодня начинается новая эра в истории Китая, эпоха великой славы." # Finally, we possess a fleet worthy of a Chinese state! It is time for the world to fear our might and feel the wrath of a thousand thundering guns or the rapid advance of our submarines. Today starts a new era in Chinese history, one of great glory.
 ZHI_fifth_zhili_fengtian_war: "Пятая Чжили-Фэнтяньская война" # The Fifth Zhili-Fengtian War
 ZHI_fifth_zhili_fengtian_war_desc: "Нас ждет, возможно, величайшая война, с которой мы когда-либо сталкивались. Хотя это пятая война такого рода, последствия ее поражения катастрофичны. Итак, давайте не проиграем?" # Upon us is perhaps the greatest war we will ever face. Although this is the fifth war of its kind, the implications of losing the war are catastrophic. So, let's not lose shall we?
 ZHI_our_japanese_ally: "Наши японские «Друзья»" # Our Japanese "Friends
 ZHI_our_japanese_ally_desc: ""
 ZHI_japan_supports_us: "Япония поддерживает нас" # Japan Supports Us
 ZHI_japan_supports_us_desc: ""
 ZHI_japan_supports_fengtian: "Япония поддерживает Фэнтянь" #What a bunch of losers # Japan Supports Fengtian
 ZHI_japan_supports_fengtian_desc: ""
 ZHI_the_great_rivalry_is_won: "Великое соперничество выиграно" #Zhili Gang # The Great Rivalry is Won
 ZHI_the_great_rivalry_is_won_desc: "Празднуйте, ведь мы победили! Величайшее торжество пришло к клике Чжилы, по всей стране пройдут парады, небо озарят многочисленные фейерверки. Сегодня вечером и каждый вечер после нас нас будут называть истинными лидерами Китая!" # Celebrate, for we have won! The greatest triumph has come upon the Zhili Clique, parades shall be held throughout the country, and numerous fireworks shall light up the skies. Tonight, and every night after, we will be known as the true leaders of China!
 ZHI_what_now: "Что теперь?" # What now?
 ZHI_what_now_desc: "Назревает переворот..." # A coup is brewing...
 ZHI_a_new_dawn_for_zhili: "Новый рассвет для Чжили" # A New Dawn for Zhili
 ZHI_a_new_dawn_for_zhili_desc: "Нефритовый маршал исчез. Ополченцы нового военачальника бродят по улицам и сельской местности. Кто может сказать, что принесут эти изменения?" # The Jade Marshal is gone. The militias of a new Warlord roam the streets and countryside. Who can say what this change will bring?
 ZHI_jade_marshal_prevails: "Нефритовый маршал побеждает" # The Jade Marshal Prevails
 ZHI_jade_marshal_prevails_desc: "Клика Чжили оправдала свою предательскую натуру, но Нефритовый Маршал снова одержал победу. Впереди великие реформы и еще большие перемены для всего Китая." # The Zhili Clique has lived up to its traitorous nature, but once again the Jade Marshal was triumphant. Great reforms are ahead, and even greater changes for the whole of China.
 ZHI_some_things_never_change: "Некоторые вещи никогда не меняются" # Some Things Never Change
 ZHI_some_things_never_change_desc: "Лишенный власти, его люди казнены, и, не имея за собой армии, Сунь Чуаньфан теперь стоит один. Ему грозит казнь за предательство, более тяжкое, чем любое другое." # Stripped of his power, his men executed, and without an army behind him Sun Chuanfang now stands alone. He faces execution for a betrayal more grave than any other.
 ZHI_arrest_disloyal_officers: "Арестуйте нелояльных офицеров" # Arrest the Disloyal Officers
 ZHI_arrest_disloyal_officers_desc: "Принимая во внимание недавние события, Нефритовый маршал счел целесообразным отстранить от игры некоторых офицеров нашей армии. Хотя это может не понравиться в армии, это принесет стабильность в будущее." # With recent events taken into consideration, the Jade Marshal has seen fit to remove certain officers within our army from play. While this may not be liked within the army, it'll bring stability for the future.
 ZHI_our_greatest_glory: "Наша величайшая слава..." # Our Greatest Glory...
 ZHI_our_greatest_glory_desc: "Хаос, вот к чему все это привело. Некоторые полагают, что другой игрок тихо ждал в углу такой возможности. Нам просто нужно посмотреть." # Chaos, that is what it has come to. Some believe that another player has been quietly waiting in the corner for an opportunity like this. We'll just have to see.
 ZHI_is_not_in_ever_falling: "Не в Никогда Не Падает..." # Is Not in Never Falling...
 ZHI_is_not_in_ever_falling_desc: "За открытой и официальной политической сценой кто-то договаривается вернуть республику в лучшие времена, когда насилие не было единственным фактором власти. Будет ли этот план эффективно использоваться, пока неизвестно." # Behind the open and official political scenes, someone is making agreements to return the republic to a better time, when violence was not the only factor in one's power. Whether this plan will be put to effictive use is yet to be seen.
 ZHI_but_in_rising_every_time_we_fall: "Но в «Восстании каждый раз, когда мы падаем»" # But in Rising Every Time We Fall
 ZHI_but_in_rising_every_time_we_fall_desc: "Цао Кунь объявил новое президентское правительство! Правительство Бэйяна снова живо!" # Cao Kun has declared a new presidential government! The Beiyang Government lives yet again!
 ZHI_power_cement: "Укрепите власть маршала" # Cement the Marshal's Power
 ZHI_power_cement_desc: "Никто не может управлять Китаем так, как У Пейфу, это известно. Мы должны добиться того, чтобы он оставался лидером как можно дольше. Чтобы обеспечить нашу власть и дальше, мы провозгласим новое правительство Бэйяна. Это может сильно разозлить окружающие нас государства, но у них нет никакой возможности остановить нас." # No one can rule China like Wu Peifu, it is known. We must ensure that he stays the leader for as long as possible. To ensure our power further we shall proclaim a new Beiyang Government. This may greatly anger the states around us, but they have no way to possibly stop us.
 ZHI_no_turning: "Нет пути назад сейчас" # No Turning Back Now
 ZHI_no_turning_desc: "Поскольку антагонизация других китайских клик достигла точки кипения, пришло, наконец, время вернуть себе то, что по праву принадлежит нам; Китай. Мировая арена принадлежит нам, давайте сделаем это." # With the antagonisation of other Chinese Cliques reaching boiling point, it's finally time to retake what is rightfully ours; China. The world stage is ours to take, let us do so.
 ZHI_beiyang_centralise: "Централизация правительства Бэйян" # Centralisation of the Beiyang Government
 ZHI_beiyang_centralise_desc: "Пришло время нам создать могучие армии Чжили, которые теперь находятся под властью Бэйяна. Наши силы опытны и готовы к войне за возвращение земель, за которые мы так упорно сражались на протяжении многих лет." # The time has come for us to bring forth the mighty armies of Zhili, now under the Beiyang Government. Our forces are veteran and ready for a war to reclaim the land we've fought so hard for, for many years.
 ZHI_no_kyakhta: "Никаких больше Кяхтинских соглашений!" # No More Kyakhta Agreements!
 ZHI_no_kyakhta_desc: "Кяхтинское соглашение было ошибкой. Предоставление монголам автономии закончилось лишь тем, что они захватили в Китае даже больше земель, чем было первоначально согласовано. Пришло время предъявить им четкое требование подчинения." # The Kyakhta Agreement was a mistake. Giving the Mongols autonomy only ended in them taking even more land in China than what was originally agreed upon. It's time to give them a clear demand for subjugation.
 ZHI_white_deal: "Оборонительный пакт с белыми" # Defensive Pact with the Whites
 ZHI_white_deal_desc: "Белые противостоят советской угрозе на севере почти в одиночку. В будущем нам будет выгодно помочь белым победить Советы и, возможно, установить в России дружественное правительство. Прежде всего, мы попросим их помочь нам в обмен на нашу помощь." # The Whites stand against the Soviet menace in the north almost alone. In the future, it will be in our favor to help the Whites defeat the Soviets and possibly install a friendly government in Russia. First of all, we'll ask them to help us in exchange for our help.
 ZHI_admin_expansion: "Реорганизация административных провинций" # Reorganise the Administrative Provinces
 ZHI_admin_expansion_desc: "Провинции старой республики крайне неэффективны и совершенно не готовы к сельским и промышленным реформам, которые предстоят в Китае. Их модернизация принесла бы нам большую пользу." # The provinces of the old republic are woefully inefficient and are completely unprepared for the rural as well as industrial reforms ahead of China. To modernize these would greatly benefit us.
 ZHI_die_kmt: "Свергнуть южных претендентов" # Topple the Southern Pretenders
 ZHI_die_kmt_desc: "Клики и правительства на нашей южной границе — единственное, что стоит между нами и полным господством Китая. Пришло время изменить это." # The cliques and governments on our southern border are the only thing sitting between us and total domination of China, it's time to change this.
 ZHI_yunnan_offer: "Предложение для Лун Юня" # An Offer for Long Yun
 ZHI_yunnan_offer_desc: "Лун Юн однажды присягнул на верность правительству Бэйяна в Китае, однако сейчас он уже некоторое время остается один. Он может принять приглашение воссоединиться или присоединиться к нам, если мы позволим ему сохранить контроль над регионом Юньнань." # Long Yun once pledged his allegiance to the Beiyang Government of China, however, he has been on his own for a while now. He may accept an invitation to rejoin or cause if we allow him to keep control of the Yunnan region.
 ZHI_ma_attack: "Сними Ма" # Take Down the Ma
 ZHI_ma_attack_desc: "Клики Ма на западе слишком долго были занозой на глазу всего Китая, их необходимо уничтожить как можно скорее." # The Ma Cliques to the west have been a thorn in the side of all of China for far too long, they must be eliminated as soon as possible.
 ZHI_tibet_is_china: "Подчинить тибетцев" # Subjugate the Tibetans
 ZHI_tibet_is_china_desc: "Тибет был и всегда будет частью китайского государства. Мы напомним им об этом факте, чтобы они не забыли." # Tibet has and will always be a part of the Chinese state. We shall remind them of that fact, lest they forget.
 ZHI_Sichuan_offer: "Предложение для Дэн Сихоу" # An Offer for Deng Xihou
 ZHI_Sichuan_offer_desc: "Дэн Сихоу однажды присягнул на верность Бэйянскому правительству Китая, однако уже некоторое время он сам по себе. Он может принять приглашение воссоединиться или присоединиться к нам, если мы позволим ему сохранить контроль над регионом Сычуань." # Deng Xihou once pledged his allegiance to the Beiyang Government of China, however, he has been on his own for a while now. He may accept an invitation to rejoin or cause if we allow him to keep control of the Sichuan region.
 ZHI_no_imperialism: "Против иностранного империалиста!" # Against the Foreign Imperialist!
 ZHI_no_imperialism_desc: "В последние годы своего ужасного правления Цин отдавал все больше и больше земель. Мы ратифицируем это соглашение и потребуем, чтобы иностранные державы вернули то, что по праву принадлежит нам теперь, когда у нас есть сильное правительство." # The Qing gave away more and more land in the later years of their terrible reign. We shall ratify this and demand that the foreign powers give back what is rightfully ours now that we have a strong government.
 ZHI_shanxi_traitors: "Разгромить предателей Шаньси" # Crush the Shanxi Traitors
 ZHI_shanxi_traitors_desc: "Янь Сишань когда-то был одним из нас, членом правительства Бэйян. Он предал это дело и стал править Шаньси себе. Пришло время напомнить об эгоистичном ублюдке, который правит Китаем." # Yan Xishan was once one of us, part of the Beiyang Government. He betrayed that cause to rule Shanxi for himself. It's time to remind the selfish bastard who rules China.
 ZHI_cao_constitution: "Новая Конституция" # The New Constitution
 ZHI_cao_constitution_desc: "Если мы хотим двигаться к более открытой и демократической республике, нам понадобится новая конституция, чтобы сделать это... Объем демократии еще предстоит решить." # If we are to steer towards a more open and democratic republic we will need a new constitution to do it... The amount of democracy is yet to be decided
 ZHI_elected_officials: "Выборные должностные лица" # Elected Officials
 ZHI_elected_officials_desc: "Некоторые из новейших пополнений нашей славной администрации хотя и приветствуются, но не избираются. Многим людям в нашей стране это не нравится, и они считают, что нам следовало избрать региональных администраторов... Хорошая ли это идея?" # Some of the newest additions to our glorious administration though welcome, are not elected. Many people within our nation dislike this and believe we should have elected regional administrators... Is this a good idea?
 ZHI_election: "Выборы" # The Election
 ZHI_election_desc: "Наконец, выборы, за которые проголосовал народ, для народа. Прошли годы, и это станет одним из величайших событий в истории Китая со времени провозглашения новой республики Сунь Ятсеном." # Finally, an election voted for by the people, for the people. This has been years coming and will be one of the grandest events in Chinese history since the proclamation of the new republic by Sun Yat-sen.
 ZHI_lfp: "Наследие Лиги" # Legacy of the League
 ZHI_lfp_desc: "Во время Второй Чжилийско-Фэнтянской войны Сунь Чуаньфан создал Лигу пяти провинций на юге Китая, чтобы централизовать власть вокруг себя. В конце концов Лига пала, но ее великий лидер выжил. Память об этом государстве никогда не должна увядать, даже в наши последние годы, символ Лиги будет высоко висеть на нашем флаге." # During the Second Zhili-Fengtian war, Sun Chuanfang created the League of Five Provinces in the south of China to centralize power around himself. In the end, the League fell, but its great leader survived. The memory of this state must never wither, even in our final years, the symbol of the League shall hang high upon our flag.
 ZHI_no_imperialists: "Выбросить иностранных чиновников" # Throw Out Foreign Officials
 ZHI_no_imperialists_desc: "Иностранные паразиты заражают каждый город и административное здание, где только могут. Это западное влияние необходимо сокрушить, если мы хотим занять трон мира. Пока придется обойтись принудительной депортацией, более стойких иностранцев предстанут перед судом за измену государству." # The foreign parasites are infesting every city and administrative building they can. This Western influence needs to be crushed if we are to put ourselves on the throne of the world. Forced deportation will have to do for now, more resistant foreigners will be set before a trial for treason against the state.
 ZHI_nanking_warlord: "Нанкинский военачальник" # The Nanking Warlord
 ZHI_nanking_warlord_desc: "Будучи бывшим лидером Лиги пяти провинций, Чуаньфан был известен как «Нанкинский военачальник». Известный своими безжалостными атаками и хитрой тактикой, он помог остановить ход Северной экспедиции, когда ситуация в клике Чжили приближалась к самой низкой точке. Мы должны напомнить народу о том, кто его лидер и на что он способен." # Being the former leader of the League of Five Provinces, Chuanfang was known as the "Nanking Warlord". Known for his ruthless attacks and cunning tactics, he helped stem the tide of the Northern Expedition when the Zhili Clique's situation was heading toward its absolute lowest point. We must remind the people of who their leader is and what he is capable of.
 ZHI_closed_borders: "Закрыть нацию" # Close the Nation
 ZHI_closed_borders_desc: "Теперь, когда мы наконец избавились от крыс в наших стенах, пришло время убедиться, что они никогда не вернутся. Наша страна должна стать полностью самодостаточной к концу следующего десятилетия и превзойдет любую другую державу в течение следующих пятидесяти лет!" # Now that we've finally gotten rid of the rats within our walls, it's time to make sure they never return. Our country needs to be completely self-sufficient by the end of the next decade, and will have surpassed any other power within the next fifty years!
 ZHI_private_army: "Частная армия Солнца" # The Private Army of Sun
 ZHI_private_army_desc: "Со времен Лиги пяти провинций значительные силы чжилийских солдат собрались под знаменем Сунь Чуаньфана и лично присягнули ему на верность. Эта армия хорошо ему послужила, но теперь пришло время и им послужить своей стране." # Since the League of Five Provinces, a sizable force of Zhili soldiers have flocked to Sun Chuanfang's banner and sworn their allegiance to him personally. This army has served him well, but now it's time for them to serve their country as well.
 ZHI_eternal_warlord: "Вечный военачальник Китая" # Eternal Warlord of China
 ZHI_eternal_warlord_desc: "Убей или будь убитым – вот философия, по которой мы живем. Война за Китай только началась и не закончится, пока мы не добьемся полного господства над всеми более слабыми государствами. Дует ветер, идет дождь, и сильный охотится на слабого. Все так, как должно быть." # Kill or be killed, this is the philosophy we live by. The war for China has just begun, and won't end till we have achieved total dominance over all weaker states. The wind blows, rain falls, and the strong prey upon the weak. All is as it should be.
 ZHI_beiyang_state: "Централизация государства Бэйян" # Centralisation of the Beiyang State
 ZHI_beiyang_state_desc: "Сильное государство требует сильного лидера. У нас есть и то, и другое. Теперь пожнем то, что посеяли; Китай принадлежит нам." # A strong state requires a strong leader. We have both of these. Now to reap what we've sowed; China is ours for the taking.
 ZHI_shanxi_conquest: "Голова Янь Сишань" # Yan Xishan's Head
 ZHI_shanxi_conquest_desc: "Ян Сишань в последний раз предал свою страну. Он прячется за горами, думая, что в своем «блестящем» одиночестве будет в безопасности от надвигающейся бури. Он ошибается." # Yan Xishan has betrayed his country for the last time. He hides behind mountains thinking that in his "splendid" isolation he'll be safe from the coming storm. He is wrong.
 ZHI_south_weakness: "Используйте слабость юга" # Exploit Southern Weakness
 ZHI_south_weakness_desc: "Гоминьдан показал свою слабость. Парламентарий Чан Кайши слаб. Мы сокрушим южные государства-претенденты всего за несколько недель." # The KMT has shown its weakness. The parliamentarian of Chiang Kai-shek is weak. We shall crush the southern pretender states in mere weeks.
 ZHI_steppe_conquest: "Заставить степь встать на колени" # Force the Steppe to Kneel
 ZHI_steppe_conquest_desc: "Северная граница Китая всегда представляла проблему для государства, с момента образования Китая при династии Ся. Это закончится сейчас." # The northern border of China has always posed an issue to the state ever since the formation of China under the Xia dynasty. This ends now.
 ZHI_steppe_resist: "Разобраться с Сопротивлением" # Deal with the Resistance
 ZHI_steppe_resist_desc: "Степь оказывается более стойкой, чем предполагалось вначале, и сопротивляется нашей оккупации. Возможно, будет разумно потратить некоторое время на борьбу с этим жалким мятежником." # Proving to be more resistant than what was first anticipated, the steppe is resisting our occupation. Taking some time to deal with this pitiful insurgent may be wise.
 ZHI_hui_conquest: "Осквернить земли Хуэй" # Desecrate the Hui Lands
 ZHI_hui_conquest_desc: "Мусульмане нашего запада не знают ценностей своей родины. Мы должны научить их тому, что мы делаем с предателями нашей великой и славной нации." # The Muslims to our west do not know the values of their homeland. We must teach them what we do to traitors of our great and glorious nation.
 ZHI_enforce_values: "Обеспечение соблюдения ханьских ценностей" # Enforce Han Chinese Values
 ZHI_enforce_values_desc: "Китайцы Хуэй отклонились от праведного пути. Мы должны это исправить, отправив их в специальные лагеря перевоспитания, где их «научат» следовать китайским ценностям." # The Hui Chinese have strayed from the righteous path. We must correct this by sending them to special re-education camps where they will be "taught" to follow Chinese values.
 ZHI_yunnan_conquest: "Голова Лун Юня" # Long Yun's Head
 ZHI_yunnan_conquest_desc: "Лун Юн — предатель китайского государства и должен понести наказание за свои действия. Все его следы должны быть уничтожены!" # Long Yun is a traitor to the Chinese state and must be punished for his actions. Every trace of him must be destroyed!
 ZHI_sichuan_conquest: "Голова Дэн Сихоу" # Deng Xihou's Head
 ZHI_sichuan_conquest_desc: "Дэн Сихоу ничем не отличается от любого другого диссидента. Мы уничтожим его так называемую сычуаньскую клику и посадим его голову на кол!" # Deng Xihou is no different from any of the other dissidents. We will destroy his so-called Sichuan Clique and mount his head on a stake!
 ZHI_tibet_conquest: "Опустошить Тибетское нагорье" # Desolate the Tibetan Plateau
 ZHI_tibet_conquest_desc: "Независимость Тибета длилась достаточно долго! Время резать и жечь. Сломайте фундаменты их зданий и казните их лидеров. Это время Китая." # Tibetan independence has lasted for long enough! Time to slash and burn. Break down the foundations of their buildings and execute their leaders. This is China's time.
 ZHI_white_conquest: "Противодействовать белым" # Antagonise the Whites
 ZHI_white_conquest_desc: "Белые на севере контролируют Внешнюю Маньчжурию. Это не годится. Мы должны вернуть себе утраченные земли и изгнать этих империалистических свиней!" # The Whites to our north control Outer Manchuria. This will not do. We must retake our lost lands and expel these imperialist pigs!
 ZHI_imperial_conquest: "Уничтожить иностранных захватчиков" # Destroy the Foreign Invaders
 ZHI_imperial_conquest_desc: "Теперь, когда мы владеем наиболее важными частями Китая, пришло время вернуть себе земли, которые Цин так трусливо отдал. РАЗБИРАЙТЕ ИНОСТРАННОГО ИМПЕРИАЛИСТА!" # Now that we hold the most important parts of China, it is time to retake the lands that the Qing so cowardly gave away. CRUSH THE FOREIGN IMPERIALIST!
 ZHI_imperial_propaganda: "Антиимпериалистическая пропаганда" # Anti-Imperialist Propaganda
 ZHI_imperial_propaganda_desc: "Они пришли сюда, чтобы воспользоваться нами. Они никогда не были здесь, чтобы помочь. Они требовали портов и концессий, а наш народ голодал и погружался в экономическую разруху. Нет причин проявлять к ним милосердие." # They came here to take advantage of us. They were never here to help. They demanded ports and concessions, while our people starved and sank into economic ruin. There is no reason to show them mercy.
 ZHI_sovereignty: "Китайский суверенитет" # Chinese Sovereignty
 ZHI_sovereignty_desc: "Китай господствует над всем. Вскоре об этом станет известно во всем мире." # China reigns supreme above all. This shall before long be known throughout the world.
 ZHI_savarkar_support: "Предложение для Саваркара" # An Offer for Savarkar
 ZHI_savarkar_support_desc: "Саваркар, лидер Временного правительства Индии, преследует некоторые из тех же целей, что и наше правительство. Возможно, было бы полезно достичь соглашения?" # Savarkar, the leader of the Provisional Government of India, has some of the same goals as our government. Perhaps it could prove useful to reach an agreement?
 ZHI_world_stage: "Наше место на мировой арене" # Our Place on the World Stage
 ZHI_world_stage_desc: "Пришло время занять свое место среди великих держав мира." # It's time we take our place among the great powers of the world.
 ZHI_alliances: "Международные Альянсы" # International Alliances
 ZHI_alliances_desc: "Если мы хотим выжить как государство, нам понадобятся союзники за рубежом. Войдут ли они в уже существующий альянс или в тот, который еще не существует, зависит от нас." # If we're to survive as a state, we'll need allies abroad. Whether they be in an already existing alliance or one that is yet to exist is up to us.
 ZHI_support_whites: "Поддержите белых" # Support the Whites
 ZHI_support_whites_desc: "Поскольку наш пакт о взаимной обороне принят белыми, мы, наконец, можем расширить нашу поддержку, снабжая наших друзей в России оружием." # With our mutual defense pact being accepted by the Whites, we can finally expand our support by supplying our friends in Russia with guns.
 ZHI_anti_soviet: "Антисоветский Альянс" # Anti-Soviet Alliance
 ZHI_anti_soviet_desc: "Теперь, когда Китай находится у нас под ногами, наконец-то пришло время помочь белым раз и навсегда победить Советы. Наша северная граница будет в безопасности, и у белых не будет причин делать что-либо, кроме как помогать нам." # With China under our boot, it's finally time to help the Whites defeat the Soviets once and for all. Our northern border will be secure and the Whites will have no reason to do anything but help us.
 ZHI_further_improvement: "Дальнейшее улучшение" # Further Improvement
 ZHI_further_improvement_desc: "Пришло время решить различные экономические, технологические и образовательные проблемы в Китае. Благодаря этим реформам мы быстро догоним державы в Европе и других странах." # The time has come to fix the various economic, technological, and educational problems in China. With these reforms, we will quickly catch up to the powers in Europe and otherwise.
 ZHI_fund_a_new_project: "Фонд новых проектов" # Fund New Projects
 ZHI_fund_a_new_project_desc: "Чтобы открыть новые возможности для наших соотечественников, потребуется гораздо больше, чем просто усилия. Нам нужно будет вложить дополнительное финансирование в наши обычные программы, чтобы расширить их." # Opening up new opportunities for our countrymen is going to take a lot more than just effort. We'll need to put extra funding into our usual programs to expand upon them.
 ZHI_a_new_military_academy: "Новая Военная Академия" # A New Military Academy
 ZHI_a_new_military_academy_desc: "Пришло время заложить фундамент новой Военной академии в Цзинане. Центральное положение Цзинаня должно помочь привлечь больше людей к профессии солдата, и, будем надеяться, по мере роста престижа Академии мы сможем расширить ее, включив в нее не только военную теорию." # It is time to lay the foundations for a new Military Academy in Jinan. The central position of Jinan should help to move more people towards the profession of soldier and, hopefully, as the prestige of the Academy grows we can expand it to include more than just military theory.
 ZHI_better_schools: "Лучшие школы" # Better Schools
 ZHI_better_schools_desc: "Ужасную школьную систему, которую мы унаследовали от наших предшественников, необходимо реформировать, чтобы обеспечить правильное образование нашего населения и улучшить будущее Китая. Для этого мы начнем с введения классической литературы в классы китайского языка и пригласим поэтов и писателей со всей страны читать лекции." # The abysmal school system we have inherited from our predecessors needs to be reformed to properly educate our population and to better the future of China. To do this we will start by introducing classic literature in Chinese classes and invite poets and writers throughout the country to hold lectures.
 ZHI_better_schools2: "Расширить учебную программу" # Expand the Curriculum
 ZHI_better_schools2_desc: "Расширение учебной программы китайских школ и университетов будет иметь большое значение для расширения не только нашего резерва образованных специалистов, но и нашего понимания новых технологий." # Expanding the curriculum of Chinese schools and universities will go a long way in expanding not just our pool of educated specialists, but also our grasp on new technologies.
 ZHI_expand_shandong_university: "Расширить Университет Шаньдуна" # Expand the University of Shandong
 ZHI_expand_shandong_university_desc: "Шаньдунский университет – один из самых престижных во всем Китае. Мы должны гордиться этим и расширить университет, включив в него больше классов, чем когда-либо прежде, принимая студентов со всей страны для изучения искусств и наук Китая." # The Shandong University is one of the most prestigious in all of China. We should take pride in this and expand the university to include more classes than ever before, accepting students from all over the country to learn the arts and sciences of China.
 ZHI_education_army: "Образовательные стандарты в армии" # Educational Standards in the Army
 ZHI_education_army_desc: "Армия составляет огромную часть нашего общества, а это означает, что если мы хотим повысить уровень грамотности в армии, мы, по сути, повышаем его по всей стране. Все очень просто: уроки китайского языка отныне будут обязательными в армии для тех, кто не умеет читать и писать." # The army makes up a huge part of our society, this means that if we are to increase the literacy standards of the army, we are essentially increasing them nationwide. It's as simple as this, Chinese lessons will from now on be mandatory in the army for those who cannot read or write.
 ZHI_mil_funding: "Расширить военное финансирование" # Expand Military Funding
 ZHI_mil_funding_desc: "Научно-исследовательским отделам в армии катастрофически не хватает финансирования, это должно быть ратифицировано, чтобы мы могли приобретать больше оборудования на местах." # R&D departments in the army are sorely lacking funding, this should be ratified so we can acquire more equipment locally.
 ZHI_mil_industry: "Военная индустриализация" # Military Industrialisation
 ZHI_mil_industry_desc: "Увеличение производства оружия и транспортных средств всех видов является главным приоритетом правительства. Как только мы запустим больше заводов, мы сможем производить тонны продукции в день." # Increasing production of weapons, and vehicles of all kinds is a top priority for the government. Once we get more factories up and running we should be well on our way to producing tons a day.
 ZHI_industrial_rev: "Китайская промышленная революция" # A Chinese Industrial Revolution
 ZHI_industrial_rev_desc: "Пришло время индустриализировать остальную часть Китая. Хотя Маньчжурия относительно благополучна, остальная часть Китая, включая провинцию Аньхой и земли вокруг нее, крайне неиндустриализирована." # The time has come to industrialize the rest of China. For while Manchuria is relatively well-off, the rest of China, including the Anhui province and the lands around it, are woefully unindustrialised.
 ZHI_mass_production: "Методы массового производства" # Mass Production Methods
 ZHI_mass_production_desc: "Стандартизация методов, используемых для производства нашей продукции и расходных материалов, будет иметь решающее значение в наших попытках повысить эффективность производства на наших заводах, а также сократить время, необходимое для обновления используемого оборудования." # Standardising the methods used to produce our products and supplies will be critical in our attempt to increase the production efficiency in our factories, as well as the time it takes to update the machines used.
 ZHI_efficiency: "Стандарты эффективности" # Efficiency Standards
 ZHI_efficiency_desc: "На заводах всегда нужен качественный работник, чтобы наши производственные линии работали эффективно. Мы будем продвигать тех, кто отлично справляется со своей работой, и наказывать тех, кто этого не делает. Мы надеемся, что это должно побудить наших работников усердно работать и чувствовать, что они заслужили свою зарплату." # A quality worker is always needed in the factories for our production lines to work efficiently. We will promote those who do exceedingly well in their jobs, and punish those who do not. This should hopefully encourage our workers to work hard and feel that they've earned their pay.
 ZHI_south_industry: "Промышленные комплексы Юга" # Industrial Complexes in the South
 ZHI_south_industry_desc: "С захватом Южного Китая пришло время развивать промышленность и здесь." # With the takeover of Southern China, it's time to increase the industry here as well.
 ZHI_qinghai_industry: "Промышленность в Цинхае" # Industrial Effort in Qinghai
 ZHI_qinghai_industry_desc: "Одно из самых пустынных мест Китая, Цинхай, теперь нуждается в индустриализации, чтобы догнать Восточный Китай. Сосредоточение внимания на этом приведет нас к дальнейшему промышленному доминированию." # One of the more desolate places in China, Qinghai, now needs to be industrialized to catch up with Eastern China. Focusing on this will lead us further towards industrial domination.
 ZHI_industry_giant: "Промышленный гигант" # An Industrial Giant
 ZHI_industry_giant_desc: "Китай в течение следующих нескольких десятилетий станет мировой державой. Нам удалось зажечь фитиль, который резко поднимет китайскую промышленность и интересы. Теперь это лишь вопрос времени, когда мир почувствует влияние величайшей страны мира." # China will within the next few decades become a world power. We've managed to light the fuse that will skyrocket Chinese industry and interests. Now it's but a matter of time before the world feels the impact of the world's greatest nation.

###SPIRITS###
 ZHI_traitors: "Клика предателей" # A Clique of Traitors
 ZHI_traitors_desc: "Клика Чжили была создана в результате очень свободных отношений между ее членами, что привело к тому, что члены стали более склонны к предательству и лжи друг другу ради личной выгоды. Если наша клика хочет выжить, с этим придется как-то разобраться." # The Zhili Clique was created from very loose relations between its members, this has led to the members being more prone to betraying and lying to each other to gain personally. If our clique is to survive, this will have to be dealt with in some capacity.
 ZHI_traitors2: "Клика предателей" # A Clique of Traitors
 ZHI_traitors2_desc: "Клика Чжили была создана в результате очень свободных отношений между ее членами, что привело к тому, что члены стали более склонны к предательству и лжи друг другу ради личной выгоды. Если наша клика хочет выжить, с этим придется как-то разобраться." # The Zhili Clique was created from very loose relations between its members, this has led to the members being more prone to betraying and lying to each other to gain personally. If our clique is to survive, this will have to be dealt with in some capacity.
 ZHI_fallen_grace1: "Отпавший от благодати" # Fallen from Grace
 ZHI_fallen_grace1_desc: "Когда-то мы были в авангарде китайского доминирования, но это было очень давно. Несколько неудач и войн в пользу наших врагов поставили нас в крайне тяжелое положение. Если мы вступим в войну, нам придется добиться значительных улучшений в нашей стране, чтобы не быть раздавленными нашим Великим Соперником на севере." # We were once at the forefront of Chinese dominance, but that was long ago. Several setbacks and wars in favor of our enemies have caused us to be in a severely dire position. Should we go to war, we will have to make great improvements to our nation lest we be crushed by our Great Rival in the north.
 ZHI_fallen_grace2: "Вернемся на ноги" # Back on our feet
 ZHI_fallen_grace2_desc: "Мы в некоторой степени оправились от опасностей нашего прошлого." # We have somewhat recovered from the perils of our past.
 ZHI_jap_grace2: "Милость Журавля" # Grace of the Crane
 ZHI_jap_grace2_desc: "Лишь немногие могут сравниться с нашей мощью, еще меньше – с нашим остроумием и точностью." # Few can match our might, fewer yet can match our wit and precision.
 ZHI_jade_marshall: "Нефритовый маршал" # The Jade Marshal
 ZHI_jade_marshall_desc: "У Пэйфу, Нефритовый маршал, хозяин и лидер клики Чжили, возможно, величайший стратег в Китае, и никто, обладающий правильным умом, не осмелится противостоять его боевому мастерству. Если мы окажемся в состоянии войны, он наверняка приведет нас к победе." # Wu Peifu, the Jade Marshal, master and leader of the Zhili Clique is perhaps the greatest strategist in China and none with their minds in the right place would dare oppose his martial prowess. Should we find ourselves at war he would surely lead us to victory.
 ZHI_japanese_backing: "Японская поддержка" # Japanese Backing
 ZHI_japanese_backing_desc: "Благодаря экономической и промышленной поддержке японского правительства мы имеем явное преимущество перед другими группировками, живущими внутри страны. Хотя на данный момент это не наша предпочтительная позиция, мы должны выжидать и разорвать наши связи, когда придет время." # With economic and industrial backing from the Japanese government we have a clear edge over the other cliques longer inland. Although it's not our preferred position for now we must bide our time and cut our ties when the time is right.
 ZHI_japanese_backing2: "Японская поддержка" # Japanese Backing
 ZHI_japanese_backing2_desc: "Благодаря экономической и промышленной поддержке японского правительства мы имеем явное преимущество перед другими группировками, живущими внутри страны. Хотя на данный момент это не наша предпочтительная позиция, мы должны выжидать и разорвать наши связи, когда придет время." # With economic and industrial backing from the Japanese government we have a clear edge over the other cliques longer inland. Although it's not our preferred position for now we must bide our time and cut our ties when the time is right.
 ZHI_subsidies: "Субсидии для новых компаний" # Subsidies for New Companies
 ZHI_subsidies_desc: "Мы начали финансировать небольшие компании и поэтому имеем приличный приток новых владельцев фабрик, финансируемых государством и т. д." # We've started funding small companies and as such have a decent influx of new factory owners, state-sponsored and otherwise.
 ZHI_jap_funds: "Японские фонды" # Japanese Funds
 ZHI_jap_funds_desc: ""
 ZHI_jap_corps: "Японские корпорации" # Japanese Corporations
 ZHI_jap_corps_desc: ""
 ZHI_thunder_rains: "Артиллерийская подготовка" # Artillery Training
 ZHI_thunder_rains_desc: ""
 ZHI_jaden_jewel: "Джейден Жемчужина Китая" # Jaden Jewel of China
 ZHI_jaden_jewel_desc: "Мы улучшили наши провинции и клику в целом до такой степени, что многие начали называть клику Чжили «нефритовым драгоценным камнем» Китая в отношении нашего лидера." # We have improved our provinces and clique as a whole, to such a degree that many have started to refer to the Zhili Clique as the "Jaden Jewel" of China, about our leader.
 ZHI_well_equipped: "Хорошо оснащенная армия" # Well-Equipped Army
 ZHI_well_equipped_desc: "Хотя наша армия, возможно, не имеет наиболее компетентного руководства в каждом отдельном подразделении, используемое оборудование является исключительным и окажется очень полезным." # While our army may not have the most competent leadership on a unit-to-unit basis, the equipment used is exceptional and shall prove very useful.
 ZHI_well_led: "Хорошо управляемая армия" # Well-Led Army
 ZHI_well_led_desc: "Пока нашей техники не хватает на определенных участках, компетентность нашего руководства не может быть поставлена ​​под сомнение. В Восточной Азии нет армии более организованной, чем наша." # While our equipment is lacking in certain areas, the competency of our leadership cannot be put into question. There is no army in East Asia more organised than ours
 ZHI_japanese_training: "Обучение японскому языку" # Japanese Training
 ZHI_japanese_training_desc: ""
