### DESCRIPTION ###
 ZHI_FUHRERREICH_DESC: "Клика Чжили является одним из лучших военачальников Китая, и ее возглавляет, пожалуй, величайший стратег Китая того времени, У Пейфу. У Пейфу — китайский националист, который, хотя ему и не нравится союз с японцами, считает союз с Японией необходимостью для выживания своей клики. Он, как и многие другие государства Китая, участвовал во многих войнах и имеет ветеранские силы, состоящие из многих солдат и генералов, но ему не хватает хорошей промышленности.\n\nФэнтянь, соперник клики Чжили, лжет на севере, насмехаясь над ними на каждом шагу. Назревает война... И клика Чжили выйдет из нее победителем." # The Zhili Clique is one of China’s finest warlord states and is led by, perhaps the greatest strategist in China at this time, Wu Peifu. Wu Peifu is a Chinese nationalist who, although he doesn't like his alliance with the Japanese, sees the alliance with Japan as a necessity for the survival of his Clique. It has, like many other states in China, been in many wars and has a veteran force of many soldiers and generals, but lacks good industry.\n\nFengtian, rival of the Zhili Clique, lies to the north, taunting them at every step. A war is brewing... And the Zhili Clique will be its victor.

### EVENTS ###
 zhi.1.t: "Далеко на Восток, часть 1." # Far to the East part 1
 zhi.1.d: "Клика Чжили, когда-то мы были величайшим государством военачальников, которое когда-либо видел Китай, теперь превратилось в оставшееся государство, похоже, находящееся на последнем издыхании. Формирование клики Чжили было проявлением дискриминации офицеров бывшего правительства Бэйяна, что привело к тому, что наша клика, в частности, имея очень слабые связи среди своих членов, путь к величию начал под руководством Фэн Гочжана.\n\nВ 1917 году, когда реставраторские силы Чжан Сюня двинулись на Пекин, чтобы восстановить династию Цин на троне, Фэн Гочжан, который в это время был исполняющим обязанности вице-президента республика, был приведен к присяге в качестве исполняющего обязанности президента.\n После этого клика Аньхой (во главе с Дуань Цижуем) и клика Чжили стали доминирующими силами в Китае.\n\nСрок полномочий Фэна истек в конце 1918 года, и он умер в 1919 году. Новым лидером клики теперь стал Цао Кунь.\n\nТерпение Дуаня подходило к концу, и У Пэйфу и Цао Кунь начали создание военного союза для противостояния клике Аньхой, включая Чжан Цзолиня из клики Фэнтянь.\nЭто привело к тому, что Дуань уволил У Пэйфу и Цао Куня, хотя это было не в его власти. Теперь он мобилизовал свою армию, «Национальную армию умиротворения», и двинулся в атаку на клику Чжили. Это начало Чжилийско-Аньхойской войны.\n\nВ Чжилийско-Аньхойской войне наш великий лидер У Пейфу продемонстрировал свое военное мастерство и стало ясно, насколько плохо управлялась Аньхойская клика, поскольку она потерпела поражение за 12 дней, а все ее силы либо сдались, дезертировали, либо просто были убиты. Война привела к созданию непростой коалиции между кликами Чжили и Фэнтянь.\n\nВскоре после того, как нынешнего президента сменил Лян Шии без предварительной консультации с кликой Чжили, что привело к дальнейшему расколу между ними. Вскоре после этого они также произвели перестановки в кабинете министров, теперь в него вошли члены, более благосклонно настроенные по отношению к Чжан Цзолиню. Клика Чжили это не одобряет, но ее решение отменяется. Последней каплей, однако, стало то, что клике было отказано в ее военном бюджете в 3 миллиона долларов, о котором ранее было согласовано.\nУ Пейфу и другие члены клики вынудили Лян Шии уйти в отставку после этого.\n\nЭто заставило Чжан Цзолиня угрожать Чжили силой, что привело к Первой Чжилийско-Фэнтяньской войне. Еще одна великая победа Чжили: марш на север завершился только тогда, когда японцы решили вмешаться и заключить мир. Фэнтяне тщательно планируют свою месть на долгие годы." # The Zhili Clique,\nonce we were the greatest Warlord state China had yet seen, now but a rump state seemingly on its last legs. The formation of the Zhili clique was one of discrimination towards officers of the former Beiyang Government, which has led to our clique, in particular,  having very loose ties among its members journey towards greatness started with the leadership of Feng Guozhang.\n\nIn 1917, when the Zhang Xun’s Restorationist forces marched on Beijing to restore the Qing dynasty to the throne, Feng Guozhang, who at this time was Acting Vice-President of the republic, was sworn in as Acting President.\n Following this, the Anhui Clique (led by Duan Qirui) and the Zhili Clique emerged as the dominant forces in China.\n\nFeng’s term ran out in late 1918, and he would go on to die in 1919. The new leader of the Clique would now be Cao Kun.\n\nPatience with Duan was running out and Wu Peifu and Cao Kun started assembling a military alliance to oppose the Anhui Clique, including Zhang Zuolin of the Fengtian Clique.\nThis led to Duan dismissing both Wu Peifu and Cao Kun, even though this was not within his power. He now mobilized his army, the “National Pacification Army”, and moved to attack the Zhili Clique. This is the beginning of the Zhili-Anhui war.\n\nThe Zhili-Anhui war was where our great leader “Wu Peifu” showed his military prowess, and where it became clear how poorly led the Anhui Clique was, as it was defeated in 12 days with all of its forces either surrendering, deserting, or simply being killed. The war resulted in an uneasy coalition between the Zhili and Fengtian cliques.\n\nShortly after the current president was replaced with Liang Shiyi without prior consultation with the Zhili Clique, causing a further divide between the two. Not long after they also reshuffle the cabinet, now with members that are more favorable towards Zhang Zuolin. The Zhili Clique disapproves of this but is overruled. The final straw, however, is when the Clique is denied its 3 million dollar military budget which had previously been agreed to.\nWu Peifu and other members of the clique force Liang Shiyi to step down after this.\n\nThis caused Zhang Zuolin to threaten the Zhili with force, leading to the First Zhili-Fengtian War. Another great victory for the Zhili, with the march north only ending when the Japanese decided to step in and broker peace. The Fengtian plan their revenge intensively for the years to come.
 zhi.1.a: "Часть 2" # Part 2
 zhi.101.t: "Далеко на Восток, часть 2." # Far to the East part 2
 zhi.101.d: "Вторая Чжилийско-Фэнтянская война оставила нестабильный триумвират Фэн (Гоминьцзюнь), Дуань (Аньхой) и Чжан (Фэнтянь).\n\nКлик Фэнтянь в конце концов начал просить помощи у своего бывшего врага У Пейфу. Они объединились, поскольку У Пэйфу все еще был сильно возмущен предательством Гоминьцзюня Фэна.\n\nПосле того, как командир дивизии из клики Фэнтянь перешел на сторону Гоминьцзюня и осадил Мукден, начинается Антифэнтяньская война. Осада была снята японской Квантунской армией, а Го (командир дивизии) был убит. Гоминьцзюнь начал быстро и в больших количествах терять солдат как в результате дезертирства, так и в боях. Когда Гоминьдан вступил в войну, Гоминьцзюнь вторгся в клику Чжили с запада. Гоминьдан добился больших успехов, пока их внимание не было разделено из-за восстания в Гуандуне. На севере силы У Бэйфу входят в Пекин и обращаются против своих союзников из клики Фэнтянь, начиная Третью Чжилийско-Фэнтяньскую войну. Из-за войны Чжили с Гоминьданом Япония решила покинуть Фэнтянь, чтобы защитить себя и поддержать Чжили. Однако между двумя фракциями быстро объявляется о прекращении огня, поскольку Чжили окружены Гоминьцзюнем, Гоминьданом и военачальником Чжан Цзунчаном, а Фэнтянь опасается японской поддержки Чжили.\n\nЧжили, медленно продвигаемые на север, загоняют Гоминьдан в тупик. Чжан из клики Фэнтянь теперь объявляет себя Китайской Республикой со своим правлением в Пекине. Ни «Жили», ни Гоминьдан этому не рады, но ничего поделать не могут. Война между ними официально заканчивается тем, что Чжили стали тенью самого себя, а некоторые называют большим достижением то, что они смогли даже противостоять мощи Гоминьдана.\n\nЧжили восстановились в течение следующих нескольких лет и в конечном итоге объявили Четвертую Чжилийско-Фэнтянскую войну, быстро восстановив Шаньдун и создав оборонительные позиции. Эта война стала огромным успехом для Чжили, которые в конечном итоге победили при поддержке Японии.\n\nПосле успеха клики Чжили Япония начала развивать свои связи с ними, пытаясь добавить в регион больше пешек. Клика Чжили теперь считается выдающейся силой в Китае, потому что они противостояли мощи Фэнтяня и Аньхоя без иностранной поддержки.\n\nЦао Кунь становится президентом, подкупив собрание по 5000 серебряных долларов каждый. В конечном итоге это лишь нанесет ущерб и без того шатким основам республики. Одним из своих первых действий он пытается провести самые прогрессивные и демократические конституции. Это полностью игнорируется.\n\nКлика Фэнтянь, теперь объединившаяся с Гоминьданом и Чжилийским генералом «Фэн Юйсяном», после подкупа его, Чжан Цзолинь ведет свои войска к маньчжурской границе. Это было началом Второй Чжилийско-Фэнтяньской войны.\n\nАтаки Чжан Цзолиня на армию У Бэйфу несколько раз были отбиты из-за прочного и географически выгодного положения Чжили. Затем, 23 октября, Фэн сделал свой ход и начал пекинский переворот, который привел к домашнему аресту Цао Куня и, в конечном итоге, к тому, что У Пэйфу был вынужден бежать в Центральный Китай." # The 2nd Zhili-Fengtian war leaves an unstable triumvirate of Feng (Guominjun), Duan (Anhui), and Zhang (Fengtian).\n\nThe Fengtian clique eventually started to ask for help from their former enemy, Wu Peifu. They allied as Wu Peifu was still greatly angered by the betrayal of Feng’s Guominjun.\n\nAfter a division commander from the Fengtian Clique defects to the Guominjun and lays siege to Mukden the Anti-Fengtian war begins. The siege was lifted by the Japanese Kwantung army and Guo (the division commander) was killed. The Guominjun started to lose soldiers fast and in large numbers, to both deserting and battle. As the KMT entered the war, the Guominjun pushed into the Zhili Clique from the west. The KMT made great progress until their attention was split because of a rebellion in Guangdong. In the north Wu Peifu’s forces enter Beijing and turn on their allies of the Fengtian Clique, starting the Third Zhili-Fengtian War. Due to the Zhili’s war with the KMT, Japan decided to leave the Fengtian to defend themselves and support the Zhili. However, a cease-fire is quickly announced between the two factions as the Zhili are surrounded by the Guominjun, the KMT, and the warlord Zhang Zongchang with the Fengtian being wary of the Zhili’s Japanese support.\n\nThe Zhili, slowly being pushed north, drive the KMT to a standstill. Zhang of Fengtian Clique now declares himself the Chinese Republic with his rule of Beijing. Neither the Zhili nor the KMT are happy about this, but can’t do much about it. The war between the two officially ends with the Zhili being a shadow of its former self, with some citing it as a great achievement that they could even withstand the KMT’s might.\n\nThe Zhili recovered over the next few years and eventually declared a Fourth Zhili-Fengtian war, quickly recovering Shandong and setting up defensive positions. This war was a huge success for the Zhili who eventually won with Japanese backing.\n\nAfter the success of the Zhili Clique, Japan started to develop its ties with them trying to add more pawns to the region. The Zhili Clique are now considered an outstanding force in China because they had withstood the might of both the Fengtian and the Anhui without foreign backing.\n\nCao Kun acquires the Presidency by bribing the assembly with 5.000 silver dollars each. This only ends up damaging the already shaky foundations of the republic. As one of his first acts, he tries to pull through the most progressive and democratic constitutions yet. It is ignored completely.\n\nThe Fengtian Clique, now allied with the KMT and the Zhili general “Feng Yuxiang” after bribing him, Zhang Zuolin leads his troops to the Manchurian border. This was the beginning of the Second Zhili-Fengtian War.\n\nZhang Zuolin’s assaults on Wu Peifu’s army were beaten back several times because of Zhili’s entrenched and geographically advantageous position. Then, on the 23rd of October, Feng made his move and launched the Beijing Coup which led to Cao Kun’s house arrest and, eventually, Wu Peifu being forced to flee to Central China.
 zhi.101.a: "Ни пяди земли нашим врагам!" # Not one inch of land to our foes!
 zhi.2.t: "Военный комитет" # The Military Committee
 zhi.2.d: "Через несколько дней наш военный комитет примет решение о плане наших будущих наступлений. Результат может показать только время, но многие согласны с тем, что это будет катастрофой, если мы не сможем принять решение в такой решающий момент истории клики." # In a few days our military committee will be deciding on a plan for our future offensives. The outcome, only time can tell but many agree that it would be disastrous should we fail to decide at such a crucial point in the Clique's history.
 zhi.2.a: "Решение должно быть принято" # A decision must be taken
 zhi.3.t: "Комитет начинает" # The Committee begins
 zhi.3.d: "Все наши офицеры собрались в нашем военном штабе, чтобы окончательно определиться с доктриной ведения войны, которая будет использоваться в предстоящей войне против клики Фэнтянь.\nБыло предложено два плана: один Сунь Чуаньфаном, протеже У Пэйфу и доверенным генералом, и другой У Пэйфу.\n\nПлан Сунь Чуаньфана предполагает, что, если нам удастся получить превосходное оружие с более разрушительной способностью, чем у клики Фэнтянь, они не будет иметь шансов против нашей армии. У Пэйфу, однако, считает, что наше оружие второстепенно по сравнению с руководством нашими войсками, и считает, что нам следует сосредоточиться на обеспечении более строгой власти в нашей армии, особенно учитывая предательство Фэн Юйсяна, которое все еще помнит живые люди.\n\nКомитет, похоже, больше поддерживает план, который не предполагает раздачу большей части своей власти, и..." # All of our officers have gathered in our military headquarters to finally decide on a doctrine of warfare, that is to be used in the coming war against the Fengtian Clique.\nTwo plans have been proposed, one by Sun Chuanfang, Wu Peifu's protege and trusted general and one by Wu Peifu.\n\nSun Chuanfang's plan suggests that if we manage to get superior weapons with more destructive capability than that of the Fengtian Clique, they wouldn't stand a chance against our army. Wu Peifu, however, thinks our weapons are secondary to the leadership of our troops, and believes we should focus on enforcing a stricter authority within our army, especially with the betrayal of Feng Yuxiang still within living memory.\n\nThe Committee seems to be more in favor of the plan which doesn't involve giving away more of their power, and...
 zhi.3.a: "Выбери план Сунь Чуаньфана без вмешательства" # Choose Sun Chuanfang's plan with no interference
 zhi.3.b: "Выберите план Сунь Чуаньфана, но У Пейфу отклоняет его!" # Choose Sun Chuanfang's plan but are overruled by Wu Peifu!
 zhi.3.c: "Вступайте в драку друг с другом, не придя к решению..." # Get into a fight with each other without coming to a decision...
 zhi.4.t: "Организовать ополченцев" # Organise the Militias
 zhi.4.d: "По всей сельской местности, в нашем могучем государстве, существуют... банды ополченцев, не находящиеся под нашим прямым контролем, которые, хотя и стремятся к лучшему для клики Чжили, непредсказуемы и их нелегко контролировать. Если мы ожидаем, что у нас будет достаточно организованная и готовая армия к неизбежной войне с кликой Фэнтянь, мы должны разобраться с этим как можно скорее. Было предложено несколько вариантов решения данной проблемы." # Across the countryside, within our mighty state, there are... Bands of militias not strictly under our direct control who, although they seek the best for the Zhili clique, are unpredictable and not easily controlled. If we expect to have a sufficiently organized and ready army for when the inevitable war with the Fengtian Clique comes, we must deal with this soon. A few options have been suggested to deal with the problem at hand.
 zhi.4.a: "Интегрируйте солдат, казните офицеров" # Integrate the soldiers, execute the officers
 zhi.4.b: "Лидеров посадить и ополченцев разогнать, они нам ни к чему." # Imprison the leaders and disperse the militias, they are no use to us
 zhi.4.c: "Офицеры могли бы пригодиться, разогнать ополченцев" # The officers could prove useful, disperse the militias
 zhi.5.t: "Японские методы обучения" # Japanese Training Methods
 zhi.5.d: "Применив знания наших японских союзников, нам удалось значительно улучшить дисциплину в нашей армии. Это должно оказаться наиболее полезным в наших будущих войнах." # By putting the knowledge of our Japanese allies to use, we've managed to greatly improve discipline within our army. This should be most useful in our future wars.
 zhi.5.a: "Через дисциплину приходит свобода." # Through discipline comes freedom.
 zhi.6.t: "Напомните им, почему мы ссоримся" # Remind them why we fight
 zhi.6.d: "«Мы окружены врагами со всех сторон, иностранными империалистами, предателями правительства Бэйяна, бывшими братьями по оружию, которые теперь восстали против нас. Все, что у нас есть, мои соотечественники и люди государства Чжили, - это мы сами и товарищество между нами. Правительство Бэйяна должно было быть, но каким может быть народ Китая! Мы не группа неорганизованных негодяев, это далеко не так. Мы клика Чжили, мастера всех военных доктрин и инструментов битвы! Так что, если вам не за что сражаться, сражайтесь за своих братьев! Его люди сразу же приветствовали его, даже если слова были не самыми глубокими." # "We are surrounded by enemies on all sides, by foreign imperialists, traitors of the Beiyang Government, former brothers in arms now turned against us. All we have, my countrymen and people of the Zhili state, is ourselves and the comradery between us. Let that go and what are we left with? Happiness? No. Fear. Fear and despair. Without your brothers in arms, the fight for freedom would be without hope and all would be lost. The Zhili Clique exists, not as a reminder of what the Beiyang Government should have been, but as what the people of China can be! We are not a group of unorganized rascals, far from it. We're the Zhili Clique, masters of all doctrines of war and instruments of battle! So, if you have nothing to fight for. Fight for your brothers. FIGHT FOR CHINA!"\n\nSo went the speech of Wu Peifu this morning outside the Zhili headquarters in Hefei. His men were quick to cheer, even if the words were not of the most profound kind.
 zhi.6.a: "Мрачная горечь предстоящей войны стала, хотя и немного, ярче." # The grim bitterness of the coming war has been brightened, if only slightly.
 zhi.7.t: "Флагман Чжили" # A Zhili Flagship
 zhi.7.d: "Не секрет, что нынешний флот у нас плачевный. Нам нужен большой крупный корабль, чтобы возглавить наш флот и навести страх на наших врагов. Строительство завершится уже в следующем году." # It is no secret that our current fleet is a sorry one. We need a large capital ship to spearhead our fleet and bring fear to our enemies. Construction will be done as soon as next year.
 zhi.7.a: "Год!?" # A year!?
 zhi.8.t: "Первое плавание «Ю Хуана»" # The Maiden Voyage of the 'Yù Huáng'
 zhi.8.d: "После года подготовки наш новый Флагман наконец-то готов к использованию! «Ю Хуан», названный в честь Нефритового императора из китайских мифов, имеет длину 145 метров и несет на себе 8 меньших орудий 50-го калибра, а также более тяжелые 3-фунтовые пушки." # After a year of preparations our new Flagship is finally ready to be used! The 'Yù Huáng', named after the Jade Emperor of Chinese myth, is 145 meters long and carries 8 smaller 50 caliber guns along with its heavier 3-pounder cannons.
 zhi.8.a: "Несомненно, это вселит страх в наших врагов!" # Surely this will strike fear into our foes!
 zhi.9.t: "Пятая Чжили-Фэнтяньская война" # The Fifth Zhili-Fengtian War
 zhi.9.d: "Великое соперничество, существующее между кликой Чжили и кликой Фэнтянь на севере, наконец, достигло апогея. Поскольку движения Фэнтянь вдоль границы превращаются в полномасштабные нападения на наши передовые позиции, есть только один способ положить этому конец раз и навсегда.\n\nКонец клики Фэнтянь близок." # The Great Rivalry which exists between the Zhili Clique and the Fengtian Clique to the north has finally come to a head. With Fengtian movements along the border turning into full-blown assaults on our forward positions, there is only one way to end this once and for all.\n\nThe end of the Fengtian Clique is at hand.
 zhi.9.a: "Glory to the Zhili Clique!" # Glory to the Zhili Clique!
 zhi.9.b: "Н-но мы не готовы!" # B-but we're not ready!
 zhi.200.d: "Проклятая клика Чжили вынудила бывших бандитов нашего славного царства вернуться к прежним занятиям. Наши линии снабжения сильно пострадали, и пройдет некоторое время, прежде чем мы сможем их выследить." # The damned Zhili clique has coerced former bandits within our glorious realm to return to their former occupation. Our supply lines are suffering greatly and it will take some time before we can hunt them down.
 zhi.200.a: "Предатели! Каждый!" # Traitors! Every single one!
 zhi.201.t: "Клика Чжили просит помощи" # The Zhili Clique requests assistance
 zhi.201.d: "Благодаря соглашению, заключенному с кликой Чжили перед началом Пятой войны Чжили-Фэнтянь, они теперь ожидают, что мы отправим им помощь в виде поставок.\nЭто, несомненно, укрепит наше влияние в клике и приблизит их к нашей сфере, однако это также вызовет недовольство японцев. Мы должны спросить себя: хотим ли мы быть вовлеченными в еще одну войну в Китае?" # With the agreement made with Zhili Clique before the start of the Fifth Zhili-Fengtian war, they now expect us to send them help in the form of supplies.\nDoing so would surely bolster our influence in the Clique and draw them closer to our sphere, however, it would also antagonize the Japanese. We should ask ourselves, do we want to be involved in another war in China?
 zhi.201.a: "Мы должны выполнить наше соглашение, отправить им оружие!" # We must honor our agreement, send them guns!
 zhi.201.b: "Безусловно, мы должны увеличить наше влияние в Китае. Отправьте им оружие и добровольцев!" # Absolutely, we must increase our influence in China. Send them guns and volunteers!
 zhi.201.c: "Сделать японцев врагами — это последнее, чего мы хотим." # Making an enemy of the Japanese is the last thing we want.
 zhi.202.t: "Британцы прислали нам оружие!" # The British have sent us guns!
 zhi.202.d: "Британцы продемонстрировали свою поддержку, поставив нам столь необходимое оружие." # The British have shown their support by supplying us with some much-needed guns.
 zhi.202.a: "Сегодня мы стоим на стороне иностранных империалистов." # Today, we stand with the foreign Imperialists.
 zhi.203.t: "Англичане прислали нам и добровольцев, и оружие!" # The British have sent us both volunteers and guns!
 zhi.203.d: "Британцы продемонстрировали свою поддержку, предоставив нам столь необходимое оружие и рабочую силу." # The British have shown their support by supplying us with some much-needed guns and manpower.
 zhi.203.a: "Сегодня мы стоим на стороне иностранных империалистов." # Today, we stand with the foreign Imperialists.
 zhi.204.t: "Англичане отклонили нашу просьбу!" # The British have rejected our request!
 zhi.204.d: "Кажется, единственный настоящий союзник, на которого клика может положиться, — это она сама. Сегодня утром прибыл британский посланник и сообщил нам, что нам не будут присланы ни оружие, ни какие-либо припасы." # It seems the only true ally the Clique can rely on is itself. This morning, a British envoy arrived and informed us that we would not be sent guns or supplies of any measure.
 zhi.204.a: "Мы сами по себе... Как всегда" # We stand by ourselves... As always
 zhi.205.t: "Клика Чжили просит британских офицеров-добровольцев" # The Zhili Clique requests British volunteer officers
 zhi.205.d: "Мы получили сообщение от самого Нефритового Маршала о том, что клика Чжили требует, чтобы иностранные офицеры инструктировали новые войска, готовящиеся к передовой. Поможем ли мы нашему новому «другу»?" # We've received a message from the Jade Marshal himself, that the Zhili Clique requires foreign officers to instruct new troops being prepared for the frontline. Will we help our new "friend"?
 zhi.205.a: "Почему, конечно! Отправьте того, кто доступен." # Why, of course! Send whoever is available.
 zhi.205.b: "Это было бы только пустой тратой времени." # That would only be a waste of time.
 zhi.206.t: "Англичане снабдили нас запасными офицерами!" # The British have supplied us with spare officers!
 zhi.206.d: "Благодаря этому мы наконец сможем должным образом подготовить наши новые войска к действию." # With these, we can finally prepare our new troops for the field properly.
 zhi.206.a: "Возможно, у нас наконец-то появится настоящая армия..." # We might finally have a real army...
 zhi.207.t: "Англичане отклонили нашу просьбу!" # The British have turned away our request!
 zhi.207.d: "Наш запрос был отклонен всего лишь четырьмя словами в ответном сообщении: «Пустая трата нашего времени»." # Our request was rejected with only four words on the message that was sent back "Waste of our time".
 zhi.207.a: "Скоро мы научим их уважению." # We'll teach them respect soon enough.
 zhi.208.t: "Блокада Желтого моря?" # A blockade of the Yellow Sea?
 zhi.208.d: "Лидер и маршал клики Чжили У Пейфу предложил нам заблокировать Желтое море, чтобы остановить транспортировку всех жизненно важных грузов из внешних источников в Фэнтянь. Хотя на бумаге это звучит как отличная идея, у нас могут возникнуть проблемы с Фэнтянем, если они выиграют войну.\n\nДолжны ли мы продолжать?" # The Zhili Clique's leader and marshal, Wu Peifu, has proposed that we blockade the Yellow Sea to stop the transportation of all vital supplies from outside sources to Fengtian. While this sounds like a great idea on paper, we may have trouble with Fengtian should they win the war.\n\nShould we go ahead?
 zhi.208.a: "Подготовьте флот, мы верим в Нефритового маршала." # Prepare the fleet, we have faith in the Jade Marshal.
 zhi.208.b: "Сообщите им, что мы не можем этого сделать по этическим соображениям." # Inform them that we cannot do this for ethical reasons.
 zhi.10.t: "Великое соперничество закончилось" # The Great Rivalry is Over
 zhi.10.d: "После многих лет постоянных войн мы наконец победили клику Фэнтянь. Многие из нас погибли за наше дело, за дело Китая." # After many years of constant wars, we've finally bested the Fengtian Clique. Many of our own have died for our cause, the cause of China.
 zhi.10.a: "Наконец-то все закончилось" # It's Finally Over
 zhi.11.t: "Тревожная тишина наполняет воздух" # An Unnerving Silence Fills the Air
 zhi.11.d: "С тех пор, как мы победили нашего величайшего врага, во всей недавно возвращенной столице Пекине был установлен мир и регулярные военные парады. Однако в последние дни в стенах капитальных зданий Бэйянского правительства царит необычайно нервная атмосфера. Возможно, это всего лишь слухи, но некоторые сообщают о массовых собраниях в уединенных зданиях, странных ящиках, прибывающих из несуществующих провинций, и, что самое странное, о новом флаге, раскинувшемся по всему городу..." # Ever since we defeated our greatest foe, peace, and regular military parades have been held throughout the newly reclaimed capital of Beijing. However, in recent days there's been an unusually unnerving feeling within the walls of capital buildings of the Beiyang Government. Maybe it's just rumored, but some have reported sightings of mass gatherings within secluded buildings, strange crates arriving from non-existent provinces, and weirdest of all, a new flag spreading throughout the city...
 zhi.11.a: "Уверьте персонал, что это не более чем слухи." # Assure the staff that these are nothing but rumors
 zhi.11.b: "Подкупайте, убивайте и допрашивайте. Что-то очень не так." # Bribe, murder, and interrogate. Something is very wrong.
 zhi.12.t: "Переворот Сунь Чуаньфана" # Sun Chuanfang's Coup
 zhi.12.d: "Слухи подтвердились. Буквально сегодня утром Сунь Чуаньфан вывел свою частную армию наемников и ветеранов Лиги пяти провинций из укрытых убежищ, быстро захватив стратегические здания и склады оружия в городе. Вскоре вся столица оказалась в полной изоляции, а У Пэйфу был окружен войсками, лично возглавляемыми Сунь, и он предпочел сражаться с предателем, а не быть отброшенным в сторону." # The rumors have proven to be true. Just this morning, Sun Chuanfang moved his private army of mercenaries and veterans of the League of Five Provinces from hidden safehouses, quickly capturing strategic buildings and arms depots within the city. Before long the entire capital was on complete lockdown with Wu Peifu surrounded by troops personally led by Sun, he chose to fight the traitor rather than be cast aside.
 zhi.12.a: "У Пейфу погибает в следующем бою..." # :( # Wu Peifu dies in the following battle...
 zhi.12.b: "...Но он берет с собой Сунь Чуаньфана." #Yay? # ...But he takes Sun Chuanfang with him
 zhi.13.t: "Арест Сунь Чуаньфана" # Sun Chuanfang's Arrest
 zhi.13.d: "Применяя насильственную силу, мы, наконец, арестовали подавляющее большинство преступников в городе. Похоже, что все они были либо бывшими членами Лиги пяти провинций, либо наемниками, получавшими зарплату непосредственно из доходов Сунь Чуаньфана. Сегодня в 4 часа утра нашим войскам было приказано окружить дом Сунь Чуаньфана и арестовать его. Однако, похоже, он был заранее предупрежден о нашем приближении и сумел собрать свои силы для последней демонстрации сопротивления.\n\nПосле непродолжительной борьбы Сан арестован, а его люди казнены." # Through violent force, we've finally arrested the vast majority of the culprits within the city. It seems they were all either former members of the League of Five Provinces or mercenaries paid directly from Sun Chuanfang's earnings. At 4 AM this morning our troops were told to surround Sun Chuanfang's house and arrest him. However, it seems he was alerted of our approach beforehand and managed to gather his forces for a final show of resistance.\n\nAfter a brief struggle, Sun is arrested and his men are executed.
 zhi.13.a: "Из всех людей я никогда не ожидал, что ты предашь меня." #Heart = broken # Of all people, you, I would never have expected to betray me
 zhi.14.t: "Суд над Сунь Чуаньфаном" # The Trial of Sun Chuanfang
 zhi.14.d: "Прежде чем начнется заседание суда, звонок прозвенит трижды. Сунь Чуаньфан, бывший лидер Лиги пяти провинций и доверенный протеже У Пэйфу, был признан виновным в государственной измене. Вскоре после этого его отправляют на виселицу, чтобы повесить, хотя и не вместе с преступниками, как это обычно бывает, нет. Холмы были расчищены для этого ужасного события, как и просил У Пэйфу. Прошло пять долгих минут, и все закончилось. Он мертв. Какие потери это понесет для армии и нации в целом, еще предстоит увидеть, хотя его наверняка будет не хватать." # The bell rings three times before court is in session. Sun Chuanfang, the former leader of the League of Five Provinces and trusted protege of Wu Peifu has been found guilty of treason. Not long after he is taken to gallows to be hanged, though not along with lowlife criminals as is usually the case, no. The hills have been cleared for this horrid occasion as Wu Peifu had asked. Five long minutes pass and it's over. He's dead. The toll this will take on the army, and the nation as a whole, is yet to be seen, though he will surely be missed.
 zhi.14.a: "Он хорошо служил своей стране, и его навсегда запомнят как героя Китая." #Heart = double broken # He served his country well and will forever be remembered as a hero of China
 zhi.15.t: "Наша претензия к правительству Бэйяна" # Our Claim to the Beiyang Government
 zhi.15.d: "Не так уж много лет назад мы были бесспорными правителями Китая. Пришло время вернуть наш золотой век и ввести Китай в эпоху процветания и могущества. Правительство Бэйяна навсегда запомнят как истинных правителей китайской нации!" # Not too many years ago, we were the undisputed rulers of China. It's time to bring back our golden age and launch China into an age of prosperity and might. Forever the Beiyang Government shall be remembered as the true rulers of the Chinese nation!
 zhi.15.a: "Законный правитель Китая – Я!" # The rightful ruler of China is ME!
 zhi.16.t: "Наша претензия к правительству Бэйяна" # Our Claim to the Beiyang Government
 zhi.16.d: "Не так уж много лет назад мы были бесспорными правителями Китая. Пришло время вернуть наш золотой век и ввести Китай в эпоху процветания и могущества. Правительство Бэйяна навсегда запомнят как истинных правителей китайской нации!" # Not too many years ago, we were the undisputed rulers of China. It's time to bring back our golden age and launch China into an age of prosperity and might. Forever the Beiyang Government shall be remembered as the true rulers of the Chinese nation!
 zhi.16.a: "Законные правители Китая вернулись" # The rightful rulers of China have returned
 zhi.17.t: "Наша претензия к правительству Бэйяна" # Our Claim to the Beiyang Government
 zhi.17.d: "Не так уж много лет назад мы были бесспорными правителями Китая. Пришло время вернуть наш золотой век и ввести Китай в эпоху процветания и могущества. Правительство Бэйяна навсегда запомнят как истинных правителей китайской нации!" # Not too many years ago, we were the undisputed rulers of China. It's time to bring back our golden age and launch China into an age of prosperity and might. Forever the Beiyang Government shall be remembered as the true rulers of the Chinese nation!
 zhi.17.a: "Законные правители Китая вернулись" # The rightful rulers of China have returned
 zhi.18.t: "Выборы" # The Election
 zhi.18.d: "Голосование было быстрым: вокруг специально отведенных для этого залов для голосования собрались большие толпы, которые точно знали, за кого голосовать. У оппозиции Цао Куна не было шансов, в конце концов, именно он инициировал выборы. Только будущее знает, что демократия принесет Китаю в будущем." # The voting was swift, with large crowds forming around the designated voting halls knowing exactly who to vote for. The opposition of Cao Kun stood no chance, he was, after all, the person who instituted the elections in the first place. The future only knows what democracy will bring to China in the future.
 zhi.18.a: "Ха, победить на выборах легко... С небольшой помощью" # Huh, winning elections is easy... With a little help
 zhi.19.t: "Движение за выборную региональную администрацию" # Movement for an Elected Regional Administration
 zhi.19.d: "Некоторые из новейших пополнений нашей славной администрации хотя и приветствуются, но не избираются. Многим людям в нашей стране это не нравится, и они считают, что нам следовало избрать региональных администраторов... Хорошая ли это идея?" # Some of the newest additions to our glorious administration though welcome, are not elected. Many people within our nation dislike this and believe we should have elected regional administrators... Is this a good idea?
 zhi.19.a: "Закон принят, и выборы начнутся немедленно." # The law is passed and the elections will proceed right away
 zhi.19.b: "Это может вызвать проблемы с администраторами..." # This might cause trouble with the administrators in question...
 zhi.20.t: "Новая Конституция" # The New Constitution
 zhi.20.d: "Теперь, когда мы имеем полный контроль над администрацией республики, нам нужно принять решение по конституции. Люди, конечно, взывают о демократии, как они делали это уже много лет. Должны ли мы поддаться этим крикам о так называемой свободе?" # Now that we have utter control of the republic's administration we need to decide on the constitution. The people are, of course, crying for democracy as they have done for so many years. Should we give in to these cries for so-called freedom?
 zhi.20.a: "Дайте людям то, что они хотят!" # Give the people what they want!
 zhi.20.b: "Дайте людям то, что они хотят, но с небольшими гарантиями" # Give the people what they want, but with slight ensurances
 zhi.20.c: "Президентская диктатура будет в порядке" # A Presidential Dictatorship will be fine
 zhi.21.t: "Возвращение к былой славе" # A Return to Our Former Glory
 zhi.21.d: "Китай расколот. Разрываюсь между военными группировками во всех направлениях. С некоторыми можно договориться, с другими – нет. Только время покажет, кто присоединится к нашей славной нации как единая нация, а кого нам придется сбросить со счетов. Прогресс ни для кого не останавливается." # China is splintered. Torn between military cliques in every direction. Some may be able to be negotiated with, others not so much. Only time will tell who will join our glorious nation as a united nation and who we will have to throw off along the wayside. Progress stops for no one.
 zhi.21.a: "Мы снова сделаем Китай великой нацией" # We shall make China a great nation once again
 zhi.22.t: "Китайцы требуют нашего подчинения" # The Chinese Demand our Subjugation
 zhi.22.d: "Новое китайское правительство в Пекине требует, чтобы мы сложили оружие и присоединились к ним, заключив, похоже, очень жестокий и односторонний договор, совсем не похожий на тот, который нам дали в предыдущие годы. Если мы примем это, мы уступим не только одну из немногих частей Внутренней Монголии, которую нам удалось оккупировать во время разногласий нашей революции, но и саму свободу нашего народа. Однако это убережет нашу страну от еще одной ужасной войны с Китаем." # The new Chinese government in Beijing is demanding that we lay down our arms and join them in what looks to be a very cruel and one-sided treaty very unlike the one we were given in previous years. Should we accept this we would not only be ceding one of the only parts of Inner Mongolia we managed to occupy during the discord of our revolution, but the very freedom of our people. It would, however, spare our nation from another terrible war with China.
 zhi.22.a: "Если это пощадит наших граждан..." # If this will spare our citizens...
 zhi.22.b: "Мы никогда не сдадимся иностранным захватчикам!" # We will never surrender to foreign invaders!
 zhi.23.t: "Монголы ответили, что «скорее умрут, чем сдадутся»." # The Mongols have replied that they'd "rather die than surrender"
 zhi.23.d: "В довольно прямом письме монголы жестко ответили, что соглашение, которое мы им дали, возмутительно, и мобилизовались против нас. Они готовы к войне." # In a rather direct letter the Mongols have replied sternly that the agreement we gave them is outrageous and have mobilized against us. They ready for war.
 zhi.23.a: "И мы дадим им это" # And we shall give it to them
 zhi.24.t: "Монголы преклоняют колени" # The Mongols Kneel
 zhi.24.d: "Руководство Монголии решило, что ради спасения граждан своей страны они согласятся на наш договор." # The Mongol leadership has decided that to spare the citizens of their nation they will agree to our treaty.
 zhi.24.a: "Они знают, что для них лучше" # They know what is best for them
 zhi.25.t: "Предложение правительства Бэйяна" # An Offer from the Beiyang Government
 zhi.25.d: "Правительство Бэйяна направило нам предложение, предполагающее заключение пакта о взаимном ненападении. Это освободило бы фронт и дало бы нам больше времени, чтобы сосредоточиться на более серьезной угрозе; Советскому Союзу и, возможно, даже открыться для будущей поддержки со стороны Китая." # The Beiyang Government has sent us a proposal which suggests a pact of mutual non-aggression. This would free up a front and give us more time to focus on the larger threat; the Soviets, and might even open up for future Chinese support.
 zhi.25.a: "Замечательная идея!" # A wonderful idea!
 zhi.25.b: "У нас достаточно поддержки" # We have enough support
 zhi.26.t: "Россияне согласились" # The Russians have Agreed
 zhi.26.d: "Россияне ответили, что с радостью согласятся на такое предложение." # The Russians have responded that they would gladly agree to such a suggestion.
 zhi.26.a: "Еще один фронт освобожден" # Another front freed up
 zhi.27.t: "Россияне отказались." # The Russians have declined
 zhi.27.d: "Русские считают, что у них достаточная поддержка, и поэтому отклонили наше предложение." # The Russians believe that they have enough support and have as such declined our offer.
 zhi.27.a: "Тогда нам придется внимательно за ними следить" # We'll have to watch them closely then
 zhi.28.t: "Правительство Бэйяна предлагает интеграцию" # The Beiyang Government Offers Integration
 zhi.28.d: "Правительство Бэйяна сделало нам весьма интригующее предложение. Они предлагают нам присоединиться к их стране как части большего целого и, в свою очередь, сохранить контроль над регионом Юньнань в качестве регионального администратора." # The Beiyang Government has offered us a rather intriguing offer. They suggest that we join their nation as part of a greater whole, and in turn, retain control over the Yunnan region as a regional administrator.
 zhi.28.a: "Тогда я останусь у власти?" # I'll stay in power then?
 zhi.28.b: "Если они так сильно хотят Юньнань, они могут прийти и забрать его!" # If they want Yunnan so bad, they can come and take it!
 zhi.29.t: "Лун Юн согласился" # Long Yun has Agreed
 zhi.29.d: "Лун Юнь решил, что номинальная позиция в законном правительстве Китая предпочтительнее войны." # Long Yun has decided that a nominal position within the rightful government of China would be preferable to war.
 zhi.29.a: "Отличный!" # Excellent!
 zhi.30.t: "Лун Юн сопротивляется" # Long Yun Resists
 zhi.30.d: "Клика Юньнани сопротивляется нашим требованиям и готовится к войне." # The Yunnan Clique resists our demands and prepares for war.
 zhi.30.a: "Ненадолго" # Not for long
 zhi.31.t: "Правительство Бэйяна предлагает интеграцию" # The Beiyang Government Offers Integration
 zhi.31.d: "Правительство Бэйяна сделало нам весьма интригующее предложение. Они предлагают нам присоединиться к их стране как части большего целого и, в свою очередь, сохранить контроль над регионом Сычуань в качестве регионального администратора." # The Beiyang Government has offered us a rather intriguing offer. They suggest that we join their nation as part of a greater whole, and in turn, retain control over the Sichuan region as a regional administrator.
 zhi.31.a: "Пока я сохраняю контроль над Сычуанью" # As long as I retain control of Sichuan
 zhi.31.b: "Ха! Как будто я когда-нибудь откажусь от контроля" # Ha! As if I'd ever give up control
 zhi.32.t: "Дэн Сихоу согласился" # Deng Xihou has Agreed
 zhi.32.d: "Дэн Сихоу решил, что номинальная позиция в законном правительстве Китая предпочтительнее войны." # Deng Xihou has decided that a nominal position within the rightful government of China would be preferable to war.
 zhi.32.a: "Хороший выбор" # Good choice
 zhi.33.t: "Дэн Сихоу сопротивляется" # Deng Xihou Resists
 zhi.33.d: "Сычуаньская клика сопротивляется нашим требованиям и готовится к войне." # The Sichuan Clique resists our demands and prepares for war.
 zhi.33.a: "Он очень быстро пожалеет об этом решении." # He'll come to regret that decision very quickly
 zhi.34.t: "Правительство Бэйяна предоставило оружие!" # The Beiyang Government has provided guns!
 zhi.34.d: "Правительство Бэйяна, в рамках нашего предыдущего соглашения, прислало нам оружие, чтобы помочь нашим военным усилиям против Советов!" # The Beiyang Government, has, as part of our previous agreement, sent us guns to help our war effort against the Soviets!
 zhi.34.a: "Наши друзья на юге становятся все более полезными" # Our friends to the south are becoming increasingly helpful
 zhi.35.t: "Правительство Бэйяна предлагает антисоветский союз" # The Beiyang Government Proposes an Anti-Soviet Alliance
 zhi.35.d: "Правительство Бэйяна предполагает, что мы могли бы лучше защитить себя и занять правильное место в Москве, если бы нам помогла китайская нация. Это, несомненно, дало бы нам огромное преимущество перед нашими врагами и, возможно, будущую связь, которая могла бы запустить как российскую, так и китайскую нации в золотой век сотрудничества." # The Beiyang Government suggests that we might be able to better defend ourselves and take our right place in Moscow if we had the help of the Chinese nation. This would undoubtedly give us a huge advantage against our enemies and possibly a future bond that could launch both the Russian and Chinese nations into a golden age of cooperation.
 zhi.35.a: "Поскольку весь Китай на нашей стороне, мы не можем проиграть!" # With all of China at our side, we can't possibly lose!
 zhi.35.b: "Мы не смеем угрожать нашим нынешним сторонникам таким соглашением." # We dare not threaten our current backers with such an agreement
 zhi.36.t: "Русские согласились!" # The Russians have Agreed!
 zhi.36.d: "Появится новая власть в форме временно называемого «Антисоветский альянс», который, возможно, придется переименовать, как только советская угроза будет уничтожена. На данный момент это знаменательное событие, которое должно вселить страх в наших врагов." # A new power will rise in the form of the temporarily named "Anti-Soviet Alliance", which will perhaps have to be renamed once the Soviet menace is destroyed. For now, this is a momentous occasion and one that should strike fear into our enemies.
 zhi.36.a: "Пришло время уничтожить социалистическую угрозу!" # The time has come to destroy the Socialist menace!
 zhi.37.t: "Россияне отказались" # The Russians have Declined
 zhi.37.d: "Сегодня мы получили печальные новости о том, что русские не разделяют нашего видения союза, объединенного против Советов." # We've today received the sad news that the Russians do not share our vision of an alliance united against the Soviets.
 zhi.37.a: "Разочаровывающий" # Disappointing
 zhi.38.t: "Мир снова будет бояться нашей силы!" # The World Will Fear Our Strength Once More!
 zhi.38.d: "Давным-давно название «Китай» вселяло страх в сердца королей и императоров повсюду, теперь это лишь малая часть того, чем оно было когда-то. Это не годится. Мы восстановим мощь Китая под властью Сунь Чуаньфана, великого военачальника и лидера новой китайской нации! Слава Нанкинскому военачальнику! Приветствую Солнце!" # Long ago the name "China" once struck fear into the hearts of Kings and Emperors far and wide, now it is but a fraction of what it once was. This will not do. We shall remake the might of China under the rule of Sun Chuanfang, the great Warlord and leader of the new Chinese nation! Hail the Nanking Warlord! Hail Sun!
 zhi.38.a: "Дракон ревет!" # The Dragon roars!
 zhi.39.t: "Монгольское сопротивление" # The Mongolian Resistance
 zhi.39.d: "Наша оккупация Монголии прошла не совсем так, как ожидалось: военный генерал Хатанбаатар вырвался из нашей хватки и набрал небольшую армию, совершая набеги на линии снабжения, идущие в Монголию и из Монголии, постоянно истощая наши силы, кто может сказать, как долго мы сможем продержаться?\nЭти кочевые варвары уже дважды избавились от китайской оккупации, и если мы не будем действовать быстро, мы СТАНЕМ третьими." # Our occupation of Mongolia has not gone "quite" as expected, with the military general Khatanbaatar escaping our grasp and recruiting what amounts to a small army, raiding supply lines going to and from Mongolia, steadily wearing our forces down, who can say how long we'll be able to hold out?\nThese nomadic barbarians have already thrown off Chinese occupation twice, if we don't act fast we WILL be the third.
 zhi.39.a: "Сколько? 2 ТЫСЯЧИ?! КАК!?" # How many? 2 THOUSAND?! HOW!?
 zhi.40.t: "Предложение от Великого Маршала" # An offer from the Grand Marshal
 zhi.40.d: "Интеллигентмуар очень умный Муар Гяхахахахалкалмуар... Кальмуар очень хороший, большие БЕДРА. Хамфрис. (Если вы это видите, мне очень жаль) Отладчик здесь, какого черта я читаю, отладчик2 понятия не имею" # Intelligentmoire is very smartmoire Gyahahhahalkalmoire... Kalmoire is very good, large THIGHS. Humphries. (If you see this, I'm so very sorry) Debugger here, wtf am I reading, debugger2 I have no idea
 zhi.40.a: "уги" # Ughsies
 zhi.41.d: "Вот уже много лет правительство Фэнтянь, наш главный соперник, сидит прямо на нашей границе, насмехаясь над нами каждый день. Теперь мы готовы. Мы дадим им войну, не похожую ни на одну другую. Огонь и сера, артиллерийские снаряды сыпались с небес, словно гром. Ситуация меняется... И клика Чжили пожнёт свою награду." # For years now, the Fengtian Government, our greatest rival, has been sitting right on our border taunting us with every passing day. Now, we are ready. We will give them a war unlike any other. Fire and brimstone, artillery shells hailing from the skies like thunder. The tide is turning... And the Zhili Clique will reap its bounty.
 zhi.41.a: "Пришло время вернуть себе место в Китае" # It is time to retake our place in China
 zhi.209.d: "Чжилийцам нужно оружие в войне за китайское превосходство, и, поскольку мы заявили о своей поддержке, они сочли целесообразным запросить материальную поддержку." # The Zhili need weapons in the war for Chinese supremacy, and seeing as we've declared our support for them, they've seen fit to request material support.
 zhi.209.a: "Припасы понадобятся в их войне" # Supplies will be needed in their war
 zhi.209.b: "Это не так уж и много" # This doesn't sound like a great deal
 zhi.210.d: "В Желтом море размещен большой флот кораблей, который останавливает большую часть, если не все, наши конвои." # A large fleet of ships has been positioned in the Yellow Sea, stopping most, if not all, of our convoys.
 zhi.210.a: "Проклятые японцы!" # Damn the Japanese!
 zhi.211.d: "Наша просьба была удовлетворена. При поддержке Японии у Фэнтяня нет шансов." # Our request was granted. With Japanese support, Fengtian stands no chance.
 zhi.211.a: "Надежно как всегда" # Reliable as always
 zhi.212.d: "Наш запрос был отклонен." # The request we made was denied.
 zhi.212.a: "Разочаровывающе, но не неожиданно" # Disappointing, but not unexpected
 zhi.213.d: "Полная партия оружия прибыла сегодня в гавань Циндао и быстро доставлена ​​на передовую." # A full shipment of guns has arrived today in Qingdao harbor, quickly being transported to the frontlines.
 zhi.213.a: "Отличный" # Excellent
 zhi.214.d: "Наш запрос на оружие из Японии был отклонен." # Our request for guns from Japan has been denied.
 zhi.214.a: "Обидно, но не совсем неожиданно" # A shame, but not completely unexpected
 zhi.250.t: "Китайцы потребовали, чтобы мы покинули Китай!" # The Chinese Have Demanded We Leave China!
 zhi.250.d: "Новое китайское правительство, бывшая клика Чжили, потребовало, чтобы мы немедленно покинули наши колонии в Китае и передали их «законному» правительству." # The new Chinese government, The former Zhili clique, has demanded that we immediately leave our colonies in China and turn hand it over to their "rightful" government.
 zhi.250.a: "Если они так сильно хотят их, они могут прийти и забрать их!" # If they want them so badly, they can come and take them!
 zhi.250.b: "Китайцы сильнее, чем когда-либо, встреча с ними была бы фактически самоубийством." # The Chinese are stronger than ever, to face them would be virtual suicide
 zhi.251.t: "Британцы сопротивляются!" # The British are resistant!
 zhi.251.d: "Британцы решили остаться на своих местах и, похоже, не собираются отказываться от своих территорий в ближайшее время. Если так будет продолжаться, мы можем даже не увидеть возвращения наших колоний после окончания предполагаемой «аренды»." # The British have chosen to stay their ground and don't seem to be giving up their territories anytime soon. If this goes on, we might not even see our colonies' return after the supposed "lease" ends.
 zhi.251.a: "Тогда нам не останется другого выбора, кроме как силой захватить колонии." # Then we have no choice but to seize the colonies by force
 zhi.251.b: "Мы не готовы к войне с англичанами" # We're not ready for a war with the British
 zhi.252.d: "Британцы после долгих дебатов уступили нашим требованиям." # The British have, after much debate, given in to our demands.
 zhi.252.a: "Отличные новости" # Excellent news
 zhi.253.d: "Столкнувшись с сопротивлением британской нации, китайцы предпочли бежать, а не сражаться. Возможно, этот «новый Китай» все-таки мало чем отличается от старого." # When faced with the opposition of the British nation, the Chinese chose to flee instead of fight. Maybe this "new China" isn't much different from the old one after all.
 zhi.253.a: "Жалкий" # Pathetic
 zhi.254.d: "Пекин, столица бывшей Китайской Республики, теперь находится в руках своих законных хозяев. Наконец-то у нас снова есть столица, достойная нашего великолепия." # Beijing, the capital of the former Chinese Republic, is now in the hands of its rightful masters. Finally, we have a capital worthy of our splendor once again.
 zhi.254.a: "Мастера Китая вернулись на свое законное место" # The masters of China have returned to their rightful place
 zhi.255.d: "Новое китайское правительство, бывшая клика Чжили, потребовало, чтобы мы немедленно покинули наши колонии в Китае и передали их «законному» правительству." # The new Chinese government, The former Zhili clique, has demanded that we immediately leave our colonies in China and turn hand it over to their "rightful" government.
 zhi.255.a: "Этот вопрос должен решаться во Франции!" # This matter should be decided in France!
 zhi.255.b: "Франции не стоит беспокоиться по этому поводу." # France needn't worry about this matter
 zhi.256.d: "Были выдвинуты требования, чтобы мы передали наши китайские владения новому правительству Бэйяна. Если нам не удастся выиграть возможную войну с этой фракцией, это может означать конец французского правления в Восточной Азии. Стоит ли оно того?" # Demands have been made that we should turn over our Chinese possessions to the new Beiyang Government. Should we fail to win a possible war with this faction it could mean the end of French rule in East Asia. Is it worth it?
 zhi.256.a: "Мы будем сражаться до последнего человека за нашу славную империю!" # We will fight to the last man for our glorious empire!
 zhi.256.b: "Мы не можем рисковать потерей еще большей части наших восточноазиатских владений." # We can't risk losing more of our East-Asian possessions
 zhi.257.d: "Французы сопротивляются нашим требованиям. Французскую колониальную империю нельзя воспринимать легкомысленно, однако, поскольку их внимание сосредоточено на немецкой угрозе, мы можем выиграть эту войну." # The French are resisting our demands. The French colonial empire is not something to be taken lightly, however, with their attention tightly locked on the German threat it may be a war we could win.
 zhi.257.a: "Если война — это то, чего они хотят, то войну они получат." # If war is what they want, then war they shall get
 zhi.257.b: "Это может быть больше, чем мы можем выдержать" # This may be more than we can handle
 zhi.258.d: "Французы уступили нашим требованиям и поэтому уступают всю территорию Китая нашему праведному правительству." # The French have given in to our demands and are as such ceding all territory in China to our righteous government.
 zhi.258.a: "Империалисты падают один за другим" # The imperialists fall one by one
 zhi.259.d: "Китайское правительство отступило. Нам не следует ожидать от них больше хлопот." # The Chinese government has backed down. We should expect no more hassle from them.
 zhi.259.a: "Пушоверы" # Pushovers
 zhi.260.d: "Новое китайское правительство, бывшая клика Чжили, потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их «законному» правительству." # The new Chinese government, The former Zhili clique, has demanded that we immediately leave our colonies in China and in turn hand it over to their "rightful" government.
 zhi.260.a: "У нас нет особого выбора..." # We don't have much of a choice...
 zhi.260.b: "По крайней мере, мы можем дать им бой!" # We can at least give them a fight!
 zhi.261.d: "Португальцы уступили нашим требованиям и сдали портовый город Макао." # The Portuguese have given in to our demands and handed over the port city of Macau.
 zhi.261.a: "Отличные новости!" # Great news!
 zhi.262.d: "Португальцы отказались отказаться от своей колонии в Китае." # The Portuguese have refused to give up their colony in China.
 zhi.262.a: "Они просили об этом" # They asked for this
 zhi.262.b: "Может быть, мы все-таки не готовы..." # Maybe we're not ready after all...
 zhi.263.d: "Новое китайское правительство, бывшая клика Чжили, потребовало, чтобы мы немедленно покинули наши колонии в Китае и, в свою очередь, передали их «законному» правительству." # The new Chinese government, The former Zhili clique, has demanded that we immediately leave our colonies in China and in turn hand it over to their "rightful" government.
 zhi.263.a: "Никакой сдачи!" # No surrender!
 zhi.263.b: "Немедленно пошлите за британским посольством!" # Send for the British embassy immediately!
 zhi.263.c: "Мы передадим его..." # We'll hand it over...
 zhi.275.d: "Война клики Фэнтянь кажется почти проигранной, они отброшены назад без возможности восстановления. Возможно, пришло время вмешаться и предложить мир, выгодный как нам, так и клике Чжили." # The Fengtian Clique's war seems all but lost, they've been pushed back beyond recovery. Perhaps it's time we intervene and suggest a peace favorable to both us and the Zhili Clique.
 zhi.275.a: "Маньчжурия проиграла, им ничего не остается, как подчиниться" # Manchuria has lost, they have no choice but to submit
 zhi.276.d: "Японцы направили нам просьбу заключить мир с кликой Чжили и отдать оставшиеся у нас земли в Маньчжурии, чтобы избавить китайский народ от дальнейшего кровопролития... Мы, конечно, знаем, что это всего лишь уловка с целью отдать им нашу землю. Но есть ли у нас выбор?" # The Japanese have sent us a request that we make peace with the Zhili Clique and give up our remaining land in Manchuria to spare the Chinese people from further bloodshed... We, of course, know that this is just a ploy to give them our land. But do we have any choice?
 zhi.276.a: "Наши силы слишком искалечены, чтобы продолжать" # Our forced are too crippled to continue
 zhi.276.b: "Мы продолжаем сражаться... Даже если это кажется обреченным на провал." # We fight on... Even if it seems like a doomed effort
 zhi.277.d: "Японцы заключили мир, который, кажется, выгоден и нам, и им. Они считают, что на этом их труды в Китае, связанные с нами, заканчиваются. Мы знаем, что они глубоко ошибаются." # The Japanese have brokered a peace that seems to be both in favor of us and them. They believe this to be the end of their toils in China related to us. We know they are sorely mistaken.
 zhi.277.a: "Не демобилизуйте ни одного солдата... Они нам понадобятся." # Don't demobilize a single soldier... We'll need them
 zhi.278.d: "Правительство Фэнтянь согласилось на наше мирное предложение, и мы взяли на себя управление согласованными частями региона Маньчжурии." # The Fengtian Government has agreed to our peace offer and we have taken over the rule of the agreed parts of the Manchuria region.
 zhi.278.a: "Как и ожидалось" # As expected
 zhi.279.d: "Недавно мы получили известие, что запросы японцев, направленные правительству Фэнтянь, были отклонены. Как это повлияет на будущие события, еще предстоит выяснить." # We've recently received word that the requests from the Japanese, for the Fengtian Government to submit, have been rejected. How this will affect future events is yet to be discovered.
 zhi.279.a: "Мы боремся дальше!" # We fight on!
 zhi.280.d: "Правительство Фэнтянь отклонило наше предложение и решило продолжить свою безнадежную борьбу в Китае." # The Fengtian Government has declined our offer and has chosen to continue their hopeless fight in China.
 zhi.280.a: "Со временем они увидят ошибку в своем пути" # They will see the error in their ways in time
 zhi.281.d: "Поскольку британцы теперь полностью оправились от экономического кризиса, возможно, в наших интересах обратиться к ним за помощью. У них есть значительный опыт ведения современной войны и множество новых идей, возникающих в это время." # With the British now fully recovered from the economic crisis, it may be in our interest to seek their help. They have significant experience with modern warfare and the many new ideas emerging at this time.
 zhi.281.a: "Почему Япония должна быть нашей единственной помощью в грядущей войне?" # Why should Japan be our only help in the coming war?
 zhi.281.b: "Вступать в союз с большим количеством империалистов было бы крайне неразумно." # Allying ourselves with more imperialists would be most unwise
 zhi.282.d: "Поскольку ситуация в Чжили-Фэнтяне быстро приближается к будущей войне, клика Чжили обратилась к нам за заверениями, что мы окажем им поддержку в случае будущей войны. Потенциально это могло бы дать нам сильного союзника в Восточной Азии, который был бы неоценим, если бы Япония стала проблемой." # With the Zhili-Fengtian situation quickly racing towards a future war, the Zhili Clique has reached out to us for assurances that we will give them support in the event of a future war. This could potentially give us a strong ally in East Asia that would be invaluable should Japan become a problem.
 zhi.282.a: "Интересы Китая должны находиться под тщательной защитой. Прекрасная идея!" # Interests in China must be kept under close protection. A fine idea!
 zhi.282.b: "Зачем ты меня беспокоишь такой ерундой?!" # Why do you bother me with such nonsense?!
 zhi.283.d: "Британцы сообщили, что пришлют поддержку в случае войны с Фэнтянем." # The British have sent word that they will send support in the event of a war with Fengtian.
 zhi.283.a: "Немедленно пригласите их послов на ужин!" # Invite their envoys to dinner immediately!
 zhi.284.d: "Британцы ответили, что они не заинтересованы в нашей поддержке." # The British have responded that they have no interest in supporting us.
 zhi.284.a: "Обидно, но мы все равно готовимся к войне" # A shame, but we ready ourselves for war all the same
 zhi.285.d: "Буквально сегодня утром мы получили сообщение о том, что на границе Чжили недалеко от Маньчжурии произошел инцидент. 547 погибших и лишь жалкий повод для этого. У Пейфу утверждает, что мужчины действовали по собственному желанию, но наши люди утверждают другое. В наших отчетах говорится, что эти люди действовали в условиях тесной координации, а не без порядка и дисциплины, как нас заставили поверить." # Just this morning we received word that an incident on the Zhili border near Manchuria occurred. 547 dead and only a measly excuse to show for it. Wu Peifu claims the men were acting on their own accord, but our men report differently. Our reports say that these men were acting under tight coordination and not without order or discipline as we've been led to believe.
 zhi.285.a: "Что бы мы ни делали, мы должны действовать осторожно" # Whatever we do, we should tread carefully
 zhi.285.b: "Это достаточная причина. НА ВОЙНУ!" # This is reason enough. TO WAR!
 zhi.286.d: "Чжилийские солдаты снова обстреляли японские эскадрильи. На этот раз патрули возле Циндао подверглись артиллерийским обстрелам издалека, и в подразделениях, о которых мы слышали до сих пор, практически не осталось выживших." # Once more, Zhili soldiers have fired upon Japanese squadrons. This time patrols near Qingdao were bombarded with artillery shells from afar, with little to no survivors in units we've heard from so far.
 zhi.286.a: "Дикие бандиты. Они заплатят вовремя" # Savage bandits. They'll pay in time
 zhi.286.b: "Хватит!" # Enough is enough!
 zhi.287.d: "Буквально сегодня днем ​​одна или две дивизии армии Чжили снова пересекли границу между ними и Циндао, сначала совершив набег на военную базу, а затем нанеся удары по войскам реагирования, которые пришли, чтобы остановить их. Они ничего не могли сделать, точность и расчет времени войск Чжили не могли быть лучше. Наш народ требует войны... И мы с радостью согласимся" # Just this afternoon, a division or two from the Zhili army crossed over the borders between them and Qingdao again, raiding a military base first and next striking down the response troops who came to stop them. There was nothing they could've done, the precision and timing of the Zhili troops could not have been better. Our people demand war... And we shall happily oblige
 zhi.287.a: "Это слишком, готовьтесь к войне, не похожей ни на одну другую!" # This is too much, prepare for a war unlike any other!
 zhi.288.d: "Японцам понравилось находиться на китайской земле. Это не годится. Был разработан план проведения серии приграничных рейдов на японские силы и военные позиции таким образом, чтобы ни одно китайское гражданское население не пострадало. Мы надеемся, что в конечном итоге это достаточно спровоцирует японцев начать войну, возможно, даже в ослабленном состоянии." # The Japanese have taken a liking to being on Chinese soil. This will not do. A plan has been hatched to conduct a series of border raids on Japanese forces and military positions in such a way that no Chinese civilian should be harmed. We hope this will eventually provoke the Japanese enough to go to war, maybe even in a weakened state.
 zhi.288.a: "Давайте покажем им, кому принадлежит Китай." # Let's show them who owns China
 zhi.289.d: "Буквально вчера после жестоких испытаний на маньчжурской границе японцы потребовали от нас извинений за действия наших людей." # After a savage ordeal on the Manchurian border just yesterday, the Japanese have demanded that we give them an apology for what our men did.
 zhi.289.a: "Упс?" # Oops?
 zhi.290.d: "Японцы предупреждают нас, что если мы пойдем дальше, они будут вынуждены ответить силой." # The Japanese warn us that should we take this any further they will be forced to respond with force.
 zhi.290.a: "Какой слабый ответ" # What a weak response
 zhi.291.d: "Большая часть японских владений в материковом Китае была вырвана из их рук, и, имея сухопутную армию, достаточно сильную, чтобы трижды победить японцев, мы можем положить этому конец сейчас." # The majority of the Japanese possessions in mainland China have been forced from their hand, and with a land army strong enough to defeat the Japanese three times over we can end this now.
 zhi.291.a: "Отправить требования" # Send the demands
 zhi.291.b: "Нет! Мы должны одержать полную победу!" # No! We must have total victory!
 zhi.292.d: "Чжилийский маршал У Пэйфу приказал нам сложить оружие и отказаться от наших территорий в материковом Китае, поскольку у нас нет сил, чтобы вернуть их." # The Zhili marshal, Wu Peifu, has ordered that we lay down arms and give up our territories in mainland China as we have no strength to retake them.
 zhi.292.a: "У нас нет другого выбора, кроме как сдаться" # We have no choice but to surrender
 zhi.293.d: "Артиллерийские снаряды гремят по линии фронта, трупы заполняют окопы, пули и запах пороха наполняют воздух. Воистину, ужасы войны обрушились на нас. Сообщения о мертвых глазах людей, вынужденных идти вперед во имя победы, становятся все более частыми по мере продолжения боевых действий. Однако у нас нет другого выбора, кроме как продолжать." # Artillery shells boom across the frontlines, dead men fill the trenches, bullets and the smell of gunpowder fill the air. Truly, the horrors of war are upon us. Reports of the dead eyes of the men who are forced ever onward in the name of victory are becoming evermore frequent as the fighting continues. Yet, we have no choice but to continue.
 zhi.293.a: "О, ужас!" # Oh, the horror!
 zhi.294.d: "Лао Шэ, известный писатель из Пекина, только что выпустил свою новую книгу «Мальчик-рикша». В книге рассказывается история мальчика по имени «Сянцзы», который зарабатывает на жизнь катанием рикши, и история во многом вращается вокруг этого факта. Книга получила очень положительные отзывы и, что удивительно, не была запрещена за изображение армий военачальников." # Lao She, a renowned writer from Beijing, has just released his newest book "Rickshaw Boy". The book tells the story of a boy named "Xiangzi" who makes a living pulling a rickshaw and the story largely revolves around this fact. The book has received very favorable reviews and surprisingly hasn't been banned for its portrayal of the Warlord armies.
 zhi.294.a: "Совершенно потрясающая работа" # Absolutely stunning work
 zhi.295.d: "Движение пустило корни в Китае. Тот, который стремится восстановить сами основы китайского общества. Так называемое Движение за реконструкцию сельской местности направлено не только на восстановление приходящей в упадок экономики на макроуровне, но и на улучшение жизни и производительности сельских рабочих. Он подчеркивает важность модернизации не только заводов в Китае, но и административных подразделений, используемых, например, для сбора налогов." # A movement has taken root in China. One that seeks to rebuild the very foundations of the Chinese society. The so-called Rural Reconstruction Movement aims to not only rebuild the declining economy at macro levels but also improve the lives and productivity of the rural workers. It emphasizes the importance of modernization of not only the factories in China but also the administrative divisions used to, for example, collect taxes.
 zhi.295.a: "Похвальная цель" # A commendable goal
 zhi.296.d: "Вчера нашу гордую страну посетил император Японской империи Хирохито. Поводом стал ужин с У Пейфу и обсуждение возможного решения проблемы Фэнтянь. Кажется, они не пришли к какому-то окончательному решению по этому поводу, но, тем не менее, это был приятный вечер." # The Emperor of the Japanese Empire, Hirohito, visited our proud nation yesterday. The occasion was dinner with Wu Peifu and the discussion of a possible resolution to the Fengtian problem. It seems that they did not come to any conclusive solution in regards to this, but it was a nice evening nonetheless.
 zhi.296.a: "Японцы останутся нашими друзьями... Пока" # The Japanese will stay our friends... For now
 zhi.301.d: "Недавно созданное Бэйянское правительство Китая обратилось с просьбой официально присоединиться к IPA. Они считают, что это укрепит наши связи на Дальнем Востоке и что, возможно, в будущем, когда они заявят о себе как о истинном правительстве Китая, мы будем готовы передать Гонконг." # The newly-declared Beiyang Government of China has requested that they officially join the IPA. They believe that this will strengthen our ties in the Far East and that perhaps in the future, once they've asserted themselves as the true government in China, we'll be ready to transfer Hong Kong.
 zhi.301.a: "Отличное пополнение нашего альянса!" # A great addition to our alliance!
 zhi.301.b: "Они не подходят для Имперского Альянса." # They're not fit for the Imperial Alliance
 zhi.302.d: "Британцы приняли наше предложение и будут стоять на нашей стороне в любых будущих войнах." # The British have accepted our proposal, and will stand by our side in any future wars.
 zhi.302.a: "Отличные новости!" # Great news!
 zhi.303.d: "Британцы отклонили нашу просьбу. Они не верят, что мы подходим для их альянса." # The British have turned away our request. They do not believe we're fit for their alliance.
 zhi.303.a: "Напыщенные империалисты" # Pompous Imperialists
 zhi.304.d: "Правительство Бэйяна пригласило нас присоединиться к их военной фракции. Они считают, что необходимо более широкое объединение азиатских стран для противодействия агрессии японцев. Это действительно кажется благородной задачей. Стоит ли ее принять?" # The Beiyang Government has invited us to join their military faction. They believe that a greater association of Asian nations is needed to counter the aggression of the Japanese. This seems like a noble task indeed, Should be accepted?
 zhi.304.a: "Великолепная идея!" # A splendid idea!
 zhi.304.b: "Нам лучше быть одному" # We're better off alone
 zhi.305.d: "Наше приглашение принято! Восточная Азия вскоре освободится от оков угнетения иностранных держав." # Our invitation has been accepted! East Asia will soon be free from the shackles of oppression of foreign powers.
 zhi.305.a: "Отличный" # Excellent
 zhi.306.d: "Наше приглашение было отклонено." # Our invitation has been declined.
 zhi.306.a: "Им не хватает перспективы" # They lack perspective
 zhi.307.d: "Французы потеряли все свои владения как в Китае, так и в Индокитае. Должны ли мы отправить им условия капитуляции?" # The French have lost all their holdings in both China and Indochina. Should we send them the terms of surrender?
 zhi.307.a: "Они должны принять" # They have to accept
 zhi.307.b: "Нет, мы нажимаем" # No, we press on
 zhi.308.d: "Китайцы полностью вытеснили нас из Азии и требуют, чтобы мы сдались немедленно или пострадаем от последствий." # The Chinese have completely pushed us out of Asia and are demanding that we surrender now or suffer the consequences.
 zhi.308.a: "У нас нет выбора" # We have no choice
 zhi.308.b: "Нет! Мы боремся до последнего вздоха!" # No! We fight till our dying breath!
 zhi.309.d: "Наша война против империализма наконец закончилась победой." # Our war against imperialism has finally ended in victory.
 zhi.309.a: "У них никогда не было шанса" # They never stood a chance
 zhi.310.d: "Наши требования о капитуляции были встречены сопротивлением. Кажется, наш враг не сдастся даже в такой ужасной ситуации." # Our demands for surrender have been met with resistance. It seems our enemy will not surrender even in this dire situation.
 zhi.310.a: "Если они хотят сделать это трудным путем" # If they want to do it the hard way
 zhi.311.d: "Мы уже несколько месяцев удерживаем Гонконг и Вэйхайвэй, и иностранные вторжения в Китай не набирают силу. Большинство наших генералов согласны с тем, что сейчас подходящий момент, чтобы послать британцам условия капитуляции, предполагающие уступку всех их портов в Китае непосредственно нам." # We've now held both Hong Kong and Weihaiwei for several months without foreign invasions gaining ground in China. Most of our generals agree that this would be an opportune moment to send the British the terms of surrender, that being to cede all their ports in China directly to us.
 zhi.311.a: "Мы ждали достаточно долго" # We've waited long enough
 zhi.311.b: "Нет, нам нужна полная победа" # No, we need total victory
 zhi.312.d: "Китайцы считают, что после нескольких месяцев безуспешных морских вторжений и еще менее успешной защиты наших портовых владений пришло время сдаться. Хотя это может быть пятном на нашей чести, это, безусловно, лучше, чем дальнейшее унижение." # The Chinese believe that after months of unsuccessful naval invasions, and even less successful defense of our port holdings, it's time we surrender. Though this may be a stain on our honor, it is surely better than being humiliated further.
 zhi.312.a: "Нашу рабочую силу лучше потратить в другом месте" # Our manpower is best spent elsewhere
 zhi.312.b: "Нет! Мы боремся до последнего вздоха!" # No! We fight till our last dying breath!
 zhi.313.d: "Португальцы проиграли эту войну и, скорее всего, согласятся на условную капитуляцию. Стоит ли отправлять такое требование?" # The Portuguese have lost this war and would likely accept a conditional surrender. Should send such a demand?
 zhi.313.a: "Они должны принять" # They have to accept
 zhi.313.b: "Нет, мы нажимаем" # No, we press on
 zhi.314.d: "Китайцы уже несколько месяцев удерживают Макао без успешного вмешательства, и похоже, что эта тенденция продолжится. Поэтому они сочли целесообразным отправить нам требование о капитуляции. Должны ли мы принять?" # The Chinese have now held Macau for several months without successful intervention and it seems like this trend will continue. As such, they've seen fit to send us a demand for surrender. Should we accept?
 zhi.314.a: "Если это означает прекращение кровопролития..." # If it means an end to the bloodshed...
 zhi.314.b: "Нет. Мы продолжаем сражаться, Слава Португалии!" # No. We fight on, Glória à Portugal!
 zhi.315.d: "Португальцы проиграли эту войну и, скорее всего, согласятся на условную капитуляцию. Стоит ли отправлять такое требование?" # The Portuguese have lost this war and would likely accept a conditional surrender. Should send such a demand?
 zhi.315.a: "Они должны принять" # They have to accept
 zhi.315.b: "Нет, мы нажимаем" # No, we press on
 zhi.323.d: "Лидер Фэнтяня, [From.GetLeader], приказал нам сложить оружие и отказаться от наших территорий в материковом Китае, поскольку у нас нет сил, чтобы вернуть их." # The Fengtian leader, [From.GetLeader], has ordered that we lay down arms and give up our territories in mainland China as we have no strength to retake them.

### FLAGS ###
 ZHI_sup_firepower: "Комитет выбрал план Сунь Чуаньфана." # The Committee has chosen Sun Chuanfang's plan
 ZHI_grand_battleplan: "У Пэйфу отменил решение комитета" # Wu Peifu has overruled the Committee
 ZHI_mass_assault: "Комитет не смог принять решение" # The Committee has failed to make a decision
 ZHI_failed_revital: "Нам не удалось возродить нашу нацию" # We have failed to revitalize our nation
 five_zhili_feng_war: "Началась 5-я Чжили-Фэнтяньская война" # 5th Zhili-Fengtian War has Started
 zhi_centralise: "Готов к централизации" # Ready to Centralise
 ZHI_unnerving_silence: "Тревожная тишина наполнила воздух..." # An unnerving silence has filled the air...
 zhi_almost_democracy: "Наше правительство почти демократическое." # Our government is almost democratic
 zhi_democracy: "Наше правительство технически демократично." # Our government is technically democratic
 ZHI_RUS_support: "Россияне приняли наше предложение" # The Russians have accepted our offer
 ZHI_further_improvements: "Готовы к дальнейшим улучшениям" # Ready to make further improvements
