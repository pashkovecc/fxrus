 ZHI_jap_org: "Организация японской армии" # Japanese Army Organisation
 ZHI_jap_org_desc: "Имея организацию армии, имитирующую японскую, мы можем более эффективно руководить нашими войсками." # By having the organization of the army mimics that of the Japanese, we can more effectively lead our troops.
