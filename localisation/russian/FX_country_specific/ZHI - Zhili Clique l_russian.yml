 ZHI_not_so_modern_military: "Современная армия?" # A Modern Military?
 ZHI_not_so_modern_military_desc: "Мобилизуйте всех! Каждый солдат, каждый ребенок, каждый взрослый мужчина способен сражаться! ОНИ ИДЕТ В МЯСОРУБКУ!" # Mobilise everyone! Every soldier, every child, every grown man able to fight! INTO THE MEATGRINDER THEY GO!
