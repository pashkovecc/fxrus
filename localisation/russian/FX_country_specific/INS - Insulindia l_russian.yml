 INS_authoritarian_democrat_party_long: "Partai Nasional Indonesia\n§gИндонезийская национальная партия§!\n§LИндонезийская национальная партия была основана еще в 1927 году молодым инженером Сукарно. Поначалу организация встретила противодействие со стороны властей, что привело к аресту Сукарно и других ведущих деятелей партии. Сукарно продолжал бороться за независимость, и когда его выпустили из тюрьмы, ПНИ быстро стала ведущей силой индонезийского национализма и независимости.§!" # Partai Nasional Indonesia\n§gIndonesian National Party§!\n§LThe Indonesian National Party was formed back in 1927, by the young engineer, at the time, Sukarno. The organization at first met opposition from the authorities, leading to Sukarno and other leading figures in the party being arrested. Sukarno continued to fight for independence, and when he was let out of prison, the PNI quickly became a leading force for Indonesian nationalism and independence.§!
