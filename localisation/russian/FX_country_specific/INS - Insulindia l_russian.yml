 INS_east_asian_revolutionary_funding: "Финансирование революции в Восточной Азии" # East Asian Revolutionary Funding
 INS_east_asian_revolutionary_funding_desc: ""
 INS_join_soviet_alliance: "Вступайте в Советский Альянс" # Join the Soviet Alliance
 INS_join_soviet_alliance_desc: ""
 INS_strive_for_united_insulindia: "Стремитесь к свободной Индонезии" # Strive for a Free Indonesia
 INS_strive_for_united_insulindia_desc: ""
 INS_sieze_timor: "Размер Тимор" # Sieze Timor
 INS_sieze_timor_desc: "Португальские империалисты слишком долго удерживали Тимор под своим империалистическим правлением. Мы должны вторгнуться в это пятно на карте и освободить индонезийское население от португальской тирании." # The Portuguese imperialists have held Timor under their imperialist rule for far too long. We should invade this stain on the map and liberate the Indonesian populace from their Portuguese tyranny.
 INS_kick_out_japanese: "Выгнать японцев" # Kick Out the Japanese
 INS_kick_out_japanese_desc: "Крошечный остров Сулавеси все еще находится под сапогом японцев. Мы должны быть достаточно любезны, чтобы вмешаться и включить их в состав нашей страны, поскольку местное малайское население наверняка считает нас освободителями, не так ли?" # The tiny island of Sulawesi is still under the boot of the Japanese. We should be gracious enough to intervene and incorporate them in our nation, with the local Malay population surely seeing us as liberators, right?
 INS_continue_war_against_british: "Продолжить войну против британцев" # Continue the War Against the British
 INS_continue_war_against_british_desc: ""
 INS_strengthen_indian_relations: "Укрепить индийские отношения" # Strengthen Indian Relations
 INS_strengthen_indian_relations_desc: ""
 INS_fund_anti_colonialist_groups: "Фонд антиколониалистических групп" # Fund Anti-Colonialist Groups
 INS_fund_anti_colonialist_groups_desc: ""
 INS_anti_colonialist_alliance: "Антиколониалистический альянс" # An Anti-Colonialist Alliance
 INS_anti_colonialist_alliance_desc: ""
 INS_east_asian_relations: "Восточноазиатские отношения" # East Asian Relations
 INS_east_asian_relations_desc: ""
 INS_mission_to_japan: "Миссия в Японию" # Mission to Japan
 INS_mission_to_japan_desc: "Япония приносит вдохновение: они были восходящим солнцем Азии, сумевшим стать на один уровень с жителями Запада; они были одной из немногих наций, которым удалось избежать колониального натиска, и теперь они стремятся распространить свое влияние по всей Азии. Мы должны присоединиться к этому проекту против вторжения Запада в восточную сферу!" # Japan brings inspiration: they were Asia's rising sun who managed to become on par with the westerners; they were one of the few nations that managed to avoid the colonial onslaught, and now they seek to spread their influence throughout Asia. We should join this project against western incursion in the eastern sphere!
 INS_try_buying_sulawesi: "Попробуйте купить Сулавеси." # Try to Purchase Sulawesi
 INS_try_buying_sulawesi_desc: ""
 INS_join_japanese_alliance: "Вступайте в Японский Альянс" # Join the Japanese Alliance
 INS_join_japanese_alliance_desc: ""

 INS_open_political_sphere: "Откройте политическую сферу" # Open the Political Sphere
 INS_open_political_sphere_desc: "Мы стоим на политическом распутье, поскольку различные группы, боровшиеся с голландцами и имеющие разные взгляды на то, как следует управлять страной, начинают ссориться друг с другом." # We stand on a political crossroad as the different groups that fought the Dutch with differing views on how the country should be ruled start to quarrel amongst each other.

