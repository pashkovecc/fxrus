 POLTICS_SUKARNO_DESC: "Сын яванских аристократов, молодой Сукарно появился на свет в 1901 году. Сукарно впервые заинтересовался политикой, когда он познакомился с уникальной философией фермера по имени Мархаен, чья личная политическая философия вдохновила Сукарно на создание PNI в 1926 году. Другим большим влиянием на основу выборного правления Сукарно стал Студиклуб Альгемине, который изучал голландские переводы немецкой конституции. Теперь, когда независимость уже здесь, Сукарно обязан многим религиям и отчаянным идеологиям Индонезии объединить всех людей на архипелаге." # The son of Javanese aristocrats, the young Sukarno came into the world in 1901. Sukarno first became interested in politics when he was introduced to the unique philosophy of a farmer named Marhaen, whose personal political philosophy inspired Sukarno to found the PNI in 1926. The other great influence for Sukarno's basis of elected rule was the Algemeene Studieclub, which studied Dutch translations of the German constitution. Now that independence is here, Sukarno is beholden to the many faiths and desperate ideologies of Indonesia to unify all people in the archipelago.

