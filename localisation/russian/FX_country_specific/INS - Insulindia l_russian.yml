#### Ideas ####
 INS_war_for_insulindian_independence_idea: "Война за независимость Индонезии" # War For Indonesian Independence
 INS_war_for_insulindian_independence_idea_desc: "Да здравствует свобода! Да здравствует независимость!" # Long Live Freedom! Long Live Independence!
 INS_non_existing_economy_idea: "Несуществующая экономика" # Non-Existent Economy
 INS_non_existing_economy_idea_desc: "На данном этапе у нас почти нет функционирующей экономики. Война за независимость оставила свой след в стране, а большая часть наших экономических активов была украдена колонизаторами, когда мы восстали." # We have nearly no functioning economy at this stage. With the independence war leaving its mark on the country, and most of our economic assets being stolen by the colonialists when we rose up.
 INS_political_instability_idea: "Политическая нестабильность" # Political Instability
 INS_political_instability_idea_desc: "Хотя все наши лидеры выступают за независимость Индонезии, существуют разные взгляды на то, как должна выглядеть Индонезия после обретения независимости. Кто-то хочет социализма, кто-то хочет исламского государства." # While our leaders are all for the independence of Indonesia, there are different views on how a post-independent Indonesia shall look like. Some wants socialism, others wants an islamic state.
 INS_political_instability2_idea: "Политическая нестабильность" # Political Instability
 INS_political_instability2_idea_desc: "Хотя все наши лидеры выступают за независимость Индонезии, существуют разные взгляды на то, как должна выглядеть Индонезия после обретения независимости. Кто-то хочет социализма, кто-то хочет исламского государства." # While our leaders are all for the independence of Indonesia, there are different views on how a post-independent Indonesia shall look like. Some wants socialism, others wants an islamic state.

