 INS_pni_government: "Правительство ПНИ" # PNI Government
 INS_pni_government_desc: "Индонезийцы решительно отдали свой голос за единственную правую партию, которая будет управлять индонезийским архипелагом, за тех, кто принес ему независимость: ПНИ. Индонезия стоит на заре новой эры!" # Indonesians have decisively cast their vote for the only right party to rule the Indonesian archipelago, those who brought it independence: the PNI. Indonesia stands at the dawn of a new era!
 INS_promote_mahaenism: "Продвигать марханизм" # Promote Marhaenism
 INS_promote_mahaenism_desc: "Марэнизм является основой нашей идеологии: прагматическая форма социализма, подчеркивающая национальное единство, культуру и антиимпериализм. Давайте вместе встанем во имя бедного фермера Мархаена и всех других мархаэнов Индонезии." # Marhaenism is the basis of our ideology: a pragmatic form of socialism emphasising national unity, culture and anti-imperialism. Let us stand together in the name of the poor farmer Marhaen and all the other Marhaens in Indonesia.
 INS_centralization_of_power: "Централизация власти" # The Centralization of Power
 INS_centralization_of_power_desc: ""
 INS_empower_presidency: "Расширение возможностей президента" # Empower the Presidency
 INS_empower_presidency_desc: ""
 INS_introduce_pancasila: "Знакомство с Панчасилой" # Introduce Pancasila
 INS_introduce_pancasila_desc: ""
 INS_guided_democracy: "Управляемая демократия" # Guided Democracy
 INS_guided_democracy_desc: "Нынешняя неуправляемая демократия является основной причиной нестабильности и, в свою очередь, связана с атакой на Сукарно. Мы должны направить демократию по правильному пути PNI, чтобы обеспечить стабильность для всех!" # The current unguided democracy is the root cause of instability, and in turn connected to the attack on Sukarno. We should guide democracy into the right PNI way, to secure stability for all!
