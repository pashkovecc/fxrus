#### Events ####
 insulindia.0.t: "Провозглашение независимости Индонезии!" # The Proclaimation of Indonesian Independence!
 insulindia.0.d: "Сегодня лидер борьбы Индонезии за независимость Сукарно произносит слова о том, что Индонезия больше не будет управляться колониальными державами, своим последователям и по радио в стране. Силы Индонезии действительно противостоят Британской империи, возможно, крупнейшей в мире. Но этот факт, похоже, не подрывает моральный дух индонезийцев." # Today, the leader of the Indonesian fight for independence, Sukarno, does now utter the words, that Indonesia no longer will be ruled by colonial powers, to his followers and over radio in the country. The forces of Indonesia does stand up before the British Empire, maybe the largest in the world. But this fact does not seem to tear down the morale of the Indonesians.
 insulindia.0.a: "Однажды независимая остается независимой! Свобода или смерть!" # Sekali Merdeka tetap Merdeka! Merdeka atau Mati!

 insulindia.1.t: "Иностранные волонтеры прибыли в Индонезию!" # Foreign Volunteers Arrives Indonesia!
 insulindia.1.d: "Иностранные добровольцы с припасами и оружием прибыли в нашу штаб-квартиру и предложили свои услуги в нашей борьбе за деколонизацию Ост-Индии. Добровольцы, судя по всему, в основном из Франции, Советского Союза, Соединенных Штатов Америки и Юго-Восточной Азии. Наши руководители тепло приветствовали этих добровольцев и уже начинают использовать их на службе." # Foreign volunteers, with supplies and weapons, has arrived our HQ and offered their service in our fight to decolonialize the East Indies. The volunteers seems to mainly be from France, the Soviet Union, the United States of America and South-East Asia. Our leaders have warmly welcomed these volunteers and are already beginning to set them into service.
 insulindia.1.a: "Вместе мы победим колонизаторов!" # Together, We Will Defeat the Colonialists!

 insulindia.2.t: "Победа пришла к нам!" # Victory has Been Bringed Upon Us!
 insulindia.2.d: "Британские империалисты пришли к нам и предложили нам мир. Мы завоевали контроль над Явой и Суматрой, а теперь получим контроль и над Индонезией. Нам просто нужно помириться. Дальнейшее расширение Британской империи может быть осуществлено позже." # The British Imperialists have came to us and offered us a peace. We have won control over Java and Sumatra, and now will also win control over Indonesia. We just have to make peace. Further expantion onto the British Empire can be done later.
 insulindia.2.a: "Да здравствует Индонезия!" # Long Live Indonesia!

 insulindia.3.t: "Индонезийцы нас вытеснили!" # The Indonesians Has Pushed Us Out!
 insulindia.3.d: "Индонезийцы после долгих боев вытеснили нас из Ост-Индии. Мы можем либо признать их победу, либо продолжить эту борьбу." # The Indonesians have pushed us out of the East Indies after long fights. We can either accept their victory, or continue this fight.
 insulindia.3.a: "Давайте заключим официальный мир" # Let's Make an Official Peace
 insulindia.3.b: "Никакого мира с повстанцами!" # No Peace With Rebels!

 insulindia.4.t: "Подход к нашей политике" # Approaching Our Politics
 insulindia.4.d: "Пришло время приблизиться к нашему политическому ландшафту. Хотя большинство индонезийцев хотят, чтобы наша страна была независимой, существуют разные взгляды на то, как должна выглядеть эта независимость. Самыми популярными движениями в Индонезии в настоящее время являются социалисты, в основном состоящие из рабочих и фермеров, националисты, в основном состоящие из военачальников и простолюдинов, и исламисты, в основном состоящие из среднего класса и мусульманской общины. Нам необходимо указать путь, по которому нам следует идти на этом фронте." # It is time to approach our political landscape. While most Indonesians wants our coutry to be independent, there are different views on how this independence shall look like. The most popular movements in Indonesia is currently the Socialists, mostly made up of the workers and farmers, the Nationalists, mostly made up of military leaders and the commoners, and the Islamists, mostly made up of the middle class and the muslim community. We need to set for us a path to follow on this front.
 insulindia.4.a: "Почему мы не можем все присоединиться к PNI? Нет?!" # Why Can't we all Adhere to the PNI? No?!

 insulindia.5.t: "Социалистические требования набирают обороты" # Socialist Demands Gain Volume
 insulindia.5.d: "Социалистические требования начали набирать обороты в нашей стране, и их удалось передать президенту Сукарно через социалистов в провинциальном правительстве. Эти требования включают захват иностранных предприятий, национализацию предприятий и распределение богатства. Сколько мы будем им обещать, зависит от нашего лидера." # Socialist demands have begun to gain volume in our country, helped to be delievered to president Sukarno, through socialists in the provinsial government. These demands includes the siezing of foreign industries, nationalization of buisnesses and distribution of wealth. It is up to our leader how much we shall promice them.
 insulindia.5.a: "Примите их требования" # Accept Their Demands
 insulindia.5.b: "Примите некоторые из их требований" # Accpet Some of Their Demands
 insulindia.5.c: "Отклонить их требования" # Reject Their Demands

 insulindia.6.t: "Исламистские требования набирают силу" # Islamist Demands Gain Volume
 insulindia.6.d: "Исламистские требования начали набирать обороты в нашей стране, и их удалось передать президенту Сукарно через исламистов в правительстве провинции. Эти требования включают прекращение секуляризации Индонезии, запрет христианских партий и религиозного образования. Сколько мы будем им обещать, зависит от нашего лидера." # Islamist demands have begun to gain volume in our country, helped to be delievered to president Sukarno, through islamists in the provinsial government. These demands includes a stop to secularization of Indonesia, banning of Christian parties and religious education. It is up to our leader how much we shall promice them.
 insulindia.6.a: "Примите их требования" # Accept Their Demands
 insulindia.6.b: "Примите некоторые из их требований" # Accept Some of Their Demands
 insulindia.6.c: "Отклонить их требования" # Reject Their Demands

 insulindia.7.t: "Националистические требования набирают обороты" # Nationalist Demands Gain Volume
 insulindia.7.d: "Националистические требования начали набирать силу в нашей стране, и их удалось передать президенту Сукарно через националистов в провинциальном правительстве. Эти требования включают в себя захват иностранных предприятий, усиление военного контроля и запрет радикальных партий. Сколько мы будем им обещать, зависит от нашего лидера." # Nationalist demands have begun to gain volume in our country, helped to be delievered to president Sukarno, through nationalists in the provinsial government. These demands includes the siezing of foreign industries, stronger military control and the banning of radical parties. It is up to our leader how much we shall promice them.
 insulindia.7.a: "Примите их требования" # Accept Their Demands
 insulindia.7.b: "Примите некоторые из их требований" # Accept Some of Their Demands
 insulindia.7.c: "Отклонить их требования" # Reject Their Demands

 insulindia.8.t: "Митинг против ПНИ!" # Anti-PNI Rally!
 insulindia.8.d: "Социалисты и исламисты объединились, чтобы сплотиться против нашего режима. Они говорят, что независимость Индонезии означала независимость только для ПНИ и ее членов, и что другие движения не проходят через свои реформы. Хотя большого насилия не было, полиция задержала людей, которые считались угрозой." # Socialists and Islamists has come together to rally against our regime. They says that the independence of Indonesia only meant independence for the PNI and their members, and that other movements are not getting through their reforms. While there has not been much violence, police has removed people that have been seen as a threat.
 insulindia.8.a: "Ах! Давай!" # Ah! Come an!

 insulindia.9.t: "Покушение на президента Сукарно!" # Assassination Attempt on President Sukarno!
 insulindia.9.d: "Наш президент Сукарно сегодня находился с визитом в некоторых городах на севере Суматры, когда кто-то из толпы граждан, наблюдавших за ним во время его визита, прыгнул перед Сукарно и застрелил его. Убийца был быстро убит, но положение Сукарно сейчас неизвестно. Остаётся вопрос, насколько серьёзны его травмы." # Our president Sukarno was on visit to some towns in norhern Sumatra today when someone, from the crowd of citizens watching him on his visit, jumped in front of Sukarno and shot him. The assassin was quickly slain, but the situation of Sukarno is now unknown. There is still a question how severe his injuries are.
 insulindia.9.a: "Сукарно выжил после небольших травм!" # Sukarno Survives Minor Injuries!
 insulindia.9.b: "Сукарно Сукарно получил серьезную травму!" # Sukarno Sucomes to Major Injuries!

 insulindia.10.t: "Исламистские беспорядки!" # Islamist Riots!
 insulindia.10.d: "Исламисты в нашей стране восстают против того, что они считают несправедливым обращением со стороны временного правительства." # Islamists in our country riots against what they see as unjust treatment by the provisional government.
 insulindia.10.a: "Ах! Давай!" # Ah! Come an!

 insulindia.11.t: "Социалистические бунты!" # Socialist Riots!
 insulindia.11.d: "Социалисты в нашей стране восстают против того, что они считают несправедливым обращением со стороны временного правительства." # Socialists in our country riots against what they see as unjust treatment by the provisional government.
 insulindia.11.a: "Ах! Давай!" # Ah! Come an!

 insulindia.12.t: "Националистические беспорядки!" # Nationalist Riots!
 insulindia.12.d: "Националисты в нашей стране восстают против того, что они считают несправедливым обращением со стороны временного правительства." # Nationalists in our country riots against what they see as unjust treatment by the provisional government.
 insulindia.12.a: "Ах! Давай!" # Ah! Come an!

 insulindia.13.t: "Нас вытеснили с Борнео!" # We Have Been Pushed Out from Borneo!
 insulindia.13.d: "НЗП" # WIP
 insulindia.13.a: "На этом этапе нам необходимо подписать мир!" # At This Stage, We Need to Sign a Peace!

 insulindia.14.t: "Индонезийская демократия выживает!" # Indonesian Democracy Survives!
 insulindia.14.d: "Демократия и стабильность пережили этот период политической нестабильности. Скоро выборы, и наша страна минует эпоху временного правительства." # Democracy and Stability has survived this period of political instability. With elections soon up, our country will move past this era  of the provisional government.
 insulindia.14.a: "Настало время выборов!" # It is Time For Election!

 insulindia.15.t: "Первые выборы в Индонезии" # First Indonesian Election
 insulindia.15.d: "В Индонезии проходят первые демократические выборы. При подсчете голосов, который сейчас происходит, кажется, что три партии выходят на первое место, стремясь получить большинство." # The first ever democratic election is being held in Indonesia. In the counting of the votes that now happens, there seems that three parties comes out at the top, reaching to gain a plurality.
 insulindia.15.a: "PKI гарантирует множественность!" # The PKI Assures a Plurality!
 insulindia.15.b: "PNI сохраняет свою множественность!" # The PNI Retains Their Plurality!
 insulindia.15.c: "НУ гарантирует плюрализм!" # The NU Assures a Plurality!

 insulindia.16.t: "Дарул Ислам мобилизуется на войну!" # Darul Islam Mobilizes to War!
 insulindia.16.d: "Радикальные исламисты из «Дарул Ислам» мобилизовались против того, что они считают слабым и неэффективным временным правительством. Это может стать концом демократической мечты Индонезии." # Radical Islamists in Darul Islam has mobilized against what they sees as a weak and inefficient provisional government. This might be the end of the democratic dream on Indonesia.
 insulindia.16.a: "Мы должны стабилизировать ситуацию! Быстрый!" # We Must Stabalize! Quick!

 insulindia.17.t: "Дарул Исламский переворот!" # The Darul Islam Coup!
 insulindia.17.d: "Сотни членов Дарул Ислама уже прошли маршем по столице Батавии. Они начали сражаться с войсками, лояльными нашему правительству, и очень скоро смогут взять под контроль город и остальную часть страны. В то же время члены королевской семьи Индонезии приняли решение противостоять этому перевороту собственными силами. Еще неизвестно, какая фракция победит в конце." # Hundreds of members from Darul Islam have now marched upon the capital city of Batavia. They have begun to pick fight with troops loyal to our government, and can very soon be able to take control over the city and the rest of the country. At the same time have the royalty of Indonesia taken the choice to counter this coup with their own. It is still to see what faction will win out at the end.
 insulindia.17.a: "Дарул Ислам Успеха!" # Darul Islam Sucseeds!
 insulindia.17.b: "Члены королевской семьи Индонезии противостоят исламистам!" # Indonesian Royals Counter-Coup the Islamists!
 insulindia.17.c: "PNI возвращает контроль!" # The PNI Retakes Control!

 insulindia.18.t: "Поддержка Dvindles Away" # Support Dvindles Away
 insulindia.18.d: "Поскольку мы отвергли требования, которые наши союзники выдвинули нам во время нашего правления, многие националисты, социалисты и исламисты тайно объединились, чтобы организовать забастовки и беспорядки по всей стране. Поступали сообщения о насилии, а некоторые даже были убиты в результате террористических атак." # As we have rejected the demands our allies has given us in our time of governing, many Nationalists, Socialists and Islamists has come together in secret in order to organize strikes and riots through the country. There have been reports of violence, and some has even been killed in terror attacks.
 insulindia.18.a: "Кровь пролилась на Архипелаг!" # Blood Spills Upon the Archipelago!

 insulindia.19.t: "Наша неспособность угодить им всем" # Our Inability to Please Them All
 insulindia.19.d: "Приняв требования как социалистов, националистов, так и исламистов, мы обнаружили, что у нас нет большой возможности угодить им всем. Мы проводим так много реформ, которые обещали, не нарушая своих обещаний, но наши партнеры разочарованы." # As we have accepted the demands of both socialists, nationalists and islamists, we have found out that there is not a great possibility to please them all. We are doing so many of the reforms we have promiced without breaking our promices, but our partners are disappointed.
 insulindia.19.a: "Мы не должны пытаться угодить всем людям" # We Should Not Try to Please All People

 insulindia.20.t: "Сотрудничество возможно" # Cooperation is Possible
 insulindia.20.d: "Хотя многие наши граждане придерживаются противоположных взглядов, нам пока удалось осчастливить социалистов, националистов и исламистов в нашей стране. Похоже, мы нашли золотую середину между национализмом, социализмом и исламом – то, что мы назовем NASAGSOS." # While many of our citizens have opposing views, we have managed to make the socialists, nationalists and islamists in our country happy for now. It seems like we have gotten that sweat middle road between Nationalism, Socialism and Islam - What we will call NASAGSOS.
 insulindia.20.a: "Индонезийская демократия будет сильной!" # Indonesian Democracy Will Be Strong!

 insulindia.100.t: "Индонезия желает присоединиться к Антанте" # Indonesia Wish to Join the Entante
 insulindia.100.d: "Индонезия обратилась к нам с намерением присоединиться к Антанте. Если мы примем их, мы получим союзника в этом районе, но, поскольку это бывшая британская колония, не лучше ли отказаться, чтобы не злить британцев?!" # Indonesia has approached us in the intrest of joining the Entante. If we accept them, we will gain an ally in the area, but since it is a formerly British colony, would it be best to reject in order to not anger the brits?!
 insulindia.100.a: "Они будут приветствоваться!" # They Will be Welcomed!
 insulindia.100.b: "Нам не нужны новые участники!" # We Do Not Need New Members!

 insulindia.101.t: "Франция принять наш запрос" # France Accept our Request
 insulindia.101.d: "Французы приняли нашу просьбу о вступлении в Антанте. Мы обязательно докажем, что являемся союзником, на которого можно положиться." # The French have accepted our request to join the Entante. We will surely prove that we are an ally they can trust on.
 insulindia.101.a: "Наш Альянс будет процветать!" # Our Alliance Shall Thrive!

 insulindia.102.t: "Франция отклонить наш запрос" # France Reject our Request
 insulindia.102.d: "Французы отклонили нашу просьбу о вступлении в Антанту. Хотя это и вызывает беспокойство, мы заверили себя, что именно они проиграют из-за своего решения." # The French have rejected our request to join the Entante. While it is a disturbance, we have assured ourselves that it will be them that are going to lose on their decision.
 insulindia.102.a: "Это они упускают шанс!" # It is They Who Miss Out!

 insulindia.103.t: "Индонезия желает присоединиться к 3-му Интернационалу" # Indonesia Wish to Join the 3rd International
 insulindia.103.d: "Индонезия обратилась к нам с намерением присоединиться к Третьему Интернационалу. Если мы примем их, мы получим союзника в этом регионе, который может помочь распространить советское влияние в Азии. Некоторые были обеспокоены тем, чтобы впустить в наш альянс бывшую британскую колонию, но мы должны помнить, что Интернационал предназначен для всех людей." # Indonesia has approached us in the intrest of joining the Third International. If we accept them, we will gain an ally in the area, one that may help spread soviet influence in Asia. Some have been conserned of letting a former British colony into our alliance, but we should remember that the International is for all people.
 insulindia.103.a: "Они будут приветствоваться!" # They Will be Welcomed!
 insulindia.103.b: "Нам не нужны новые участники!" # We Do Not Need New Members!

 insulindia.104.t: "Советы принимают нашу просьбу" # The Soviets Accept our Request
 insulindia.104.d: "Советы приняли нашу просьбу о вступлении в Третий Интернационал. Мы обязательно докажем, что являемся союзником, на которого можно положиться." # The Soviets have accepted our request to join the Third International. We will surely prove that we are an ally they can trust on.
 insulindia.104.a: "Наш Альянс будет процветать!" # Our Alliance Shall Thrive!

 insulindia.105.t: "Советы отклоняют нашу просьбу" # The Soviets Reject our Request
 insulindia.105.d: "Советы отклонили нашу просьбу о вступлении в Третий Интернационал. Хотя это и вызывает беспокойство, мы заверили себя, что именно они проиграют из-за своего решения." # The Soviets have rejected our request to join the Third International. While it is a disturbance, we have assured ourselves that it will be them that are going to lose on their decision.
 insulindia.105.a: "Это они упускают шанс!" # It is They Who Miss Out!

 insulindia.106.t: "Индонезия хочет купить Сулавеси" # Indonesia Wants to Buy Sulawesi
 insulindia.106.d: "После того как бывшая Голландская Ост-Индия была разделена между нами, Великобританией и другими странами, Сулавеси оказался под контролем Японии. Теперь, когда британская часть Ост-Индии стала независимой, новое индонезийское государство сделало нам предложение. Они хотят купить у нас Сулавеси и готовы заплатить приличную сумму денег и ресурсов. Хотя это предложение интригует, эта продажа также ослабит наш контроль в этом районе." # After the former Dutch East Indies was divided up between us, Britain and other countries, Sulawesi have been under Japanese control. Now with the British part of the East Indies becoming independent, the new Indonesian state has given us an offer. They want to buy Sulawesi from us and are willing to pay a fair sum of money and recourses. While the proposal is intriging, this sale will also weaken our control in the area.
 insulindia.106.a: "Если цена приемлемая, то" # If the Price is Acceptable Then
 insulindia.106.b: "Сулавеси станет японской колонией" # Sulawesi Will be a Japanese Colony

 insulindia.107.t: "Япония принимает нашу покупку" # Japan Accept our Purchase
 insulindia.107.d: "В Токио откликнулись на наше предложение о покупке Сулавеси, приняли наше щедрое предложение и приступили к согласованию с нами деталей." # Tokyo have responded to our offer of purchasing Sulawesi, they accepted our generous offer and have proceeded to coordinate with us with the details.
 insulindia.107.a: "Добро пожаловать, Сулавеси Домой" # Welcome Sulawesi Home

 insulindia.108.t: "Япония отвергает нашу покупку" # Japan Reject our Purchase
 insulindia.108.d: "Токио ответил на наше предложение о покупке Сулавеси, они отклонили наше предложение и выстроили оборону вокруг острова на случай, если мы попытаемся захватить его себе." # Tokyo have responded to our offer of purchasing Sulawesi, they have refused our offer and have build up defenses around the island incase we try to seize it for ourselves.
 insulindia.108.a: "Ублюдки!" # Bastards!

 insulindia.109.t: "Индонезия желает присоединиться к сфере совместного процветания" # Indonesia Wish to Join the Co-Prosperity Sphere
 insulindia.109.d: "Правительство Индонезии обратилось к нам с просьбой присоединиться к нашему военному альянсу. Хотя земли Индонезии изобилуют необходимыми нам сырьевыми ресурсами, они только что пережили восстание и еще не полностью восстановились и не были индустриализированы. Должны ли мы принять?" # The Indonesian Government have approached us asking to join our military alliance. Though the lands of Indonesia is ripe of raw resources that we needed, they are fresh from their rebellion and haven't fully recovered and industrialized yet. Should we accept?
 insulindia.109.a: "Они будут приветствоваться!" # They Will be Welcomed!
 insulindia.109.b: "Нам не нужны новые участники!" # We Do Not Need New Members!

 insulindia.110.t: "Япония принимает наш запрос" # Japan Accept our Request
 insulindia.110.d: "НЗП" # WIP
 insulindia.110.a: "Наш Альянс будет процветать!" # Our Alliance Shall Thrive!

 insulindia.111.t: "Япония отклонила наш запрос" # Japan Reject our Request
 insulindia.111.d: "НЗП" # WIP
 insulindia.111.a: "Это они упускают шанс!" # It is They Who Miss Out!

 insulindia.112.t: "Индонезия желает присоединиться к сфере совместного процветания" # Indonesia Wish to Join the Co-Prosperity Sphere
 insulindia.112.d: "К нам обратились делегаты недавно сформированной организации [INS.GetNameDef]. Они заявили, что заинтересованы в присоединении к нашей фракции. Должны ли мы принять?" # We have been approached by the delegates from the newly formed [INS.GetNameDef]. They have expressed that they are interested in join our faction. Should we accept?
 insulindia.112.a: "Они будут приветствоваться!" # They Will be Welcomed!
 insulindia.112.b: "Нам не нужны новые участники!" # We Do Not Need New Members!

 insulindia.113.t: "[From.GetName] принимает" # [From.GetName] Accepts
 insulindia.113.d: "Наши друзья из [From.GetName] приняли наше предложение присоединиться к их фракции." # Our friends in the [From.GetName] have accepted our proposal in joining their faction.
 insulindia.113.a: "Наш Альянс будет процветать!" # Our Alliance Shall Thrive!

 insulindia.114.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 insulindia.114.d: "Правительство [From.GetName] отклонило наше предложение о вступлении в нашу фракцию." # The government of [From.GetName] have refused our proposal in joining our faction.
 insulindia.114.a: "Это они упускают шанс!" # It is They Who Miss Out!

#### Focus Tree ####
 INS_organize_armed_forces: "Организовать Вооруженные Силы" # Organize the Armed Forces
 INS_organize_armed_forces_desc: ""

 INS_establish_an_air_force: "Создать ВВС" # Establish an Air Force
 INS_establish_an_air_force_desc: "Раньше у KNIL были военно-воздушные силы, и хотя только один индонезийский пилот прошел официальную подготовку, Adusicipto обучала новых индонезийских пилотов. Давайте сделаем заметки и создадим индонезийские ВВС для ведения войны в воздухе." # The KNIL used to have an air force, and while only one Indonesian pilot had official training, Adusicipto has been training new Indonesian pilots. Let us take notes and establish the Indonesian Air Force to handle the war in the air.
 INS_our_own_air_bases: "Наши собственные авиабазы" # Our Own Air Bases
 INS_our_own_air_bases_desc: "У нас явная нехватка авиабаз, поскольку архипелаг, строящий больше авиабаз, укрепит нашу противовоздушную оборону в пределах наших собственных границ." # We have a defenitive lack of airbases as an archipelago constructing more airbases will bolster our aerial defense within our own borers.
 INS_purchase_new_air_crafts: "Покупайте новые самолеты" # Purchase New Air Crafts
 INS_purchase_new_air_crafts_desc: "Создание ВВС с нуля требует времени. Нам следует попытаться закупить у японцев старые самолеты во имя азиатского сотрудничества." # Building an air force from the ground up takes time. We should try to purchase old planes from the Japanese in the name of Asian cooperation.
 INS_study_air_doctrines: "Изучите доктрины авиации" # Study Air Doctrines
 INS_study_air_doctrines_desc: "Если мы хотим построить военно-воздушные силы, которые будут серьезно восприниматься в мире, нам следует изучить доктринальные достижения в этом секторе." # If we are to build an air force that is taken seriously in the world, we should study doctrinal advances in this sector.
 INS_focus_on_fighters: "Сосредоточьтесь на бойцах" # Focus on Fighters
 INS_focus_on_fighters_desc: "Без истребителей наше воздушное пространство беззащитно. Нам следует инвестировать в истребители, чтобы гарантировать сохранение суверенитета над нашим воздухом." # Without fighters, our airspace is defenceless. We should invest in fighter planes to make sure we can retain sovereignty over our air.
 INS_focus_on_bombers: "Сосредоточьтесь на бомбардировщиках" # Focus on Bombers
 INS_focus_on_bombers_desc: "Бомбардировщики идеально подходят для нанесения ущерба промышленности и инфраструктуре противника. Они должны составлять основную часть ВВС нашей страны, имея лишь небольшую эскадрилью истребителей, которая будет защищать их во время выполнения задач." # Bombers are ideal to cripple the enemy industry and infrastructure. They should make up the bulk of our nation's air force with only a small squadron of fighters to defend them on their missions.

 INS_build_an_army: "Постройте армию" # Build an Army
 INS_build_an_army_desc: "Если мы хотим обеспечить нашу независимость, нам нужна армия. У нас достаточно рабочей силы, но найти необходимое оружие определенно будет непросто." # If we are to secure our independence, we need an army. We have enough manpower but finding the needed guns will definitely be a challenge.
 INS_our_own_tactics: "Наша собственная тактика" # Our Own Tactics
 INS_our_own_tactics_desc: "Мы должны инвестировать в исследование доктрин, которые помогут нашей армии победить наших врагов, которые, несомненно, тоже вкладывают средства в доктринальные достижения." # We should invest in researching doctrines as a guiding hand to our army in defeating our enemies, who undoubtedly invest in doctrinal advances too.
 INS_guerilla_fights: "Партизанские бои" # Guerilla Fights
 INS_guerilla_fights_desc: "Мы не можем победить наших врагов в лобовом бою, по крайней мере, пока. Серия наступательных атак из джунглей (партизанская тактика) будет необходима, чтобы измотать врага, чтобы мы, в свою очередь, могли захватить стратегические точки." # We can't beat our enemies in head-on battle, at least not yet. A series of hit-and-run attacks from the jungle - guerrilla tactics - will be necessary to wear the enemy out so we can in turn take strategic points
 INS_army_of_people: "Армия людей" # An Army of People
 INS_army_of_people_desc: "Благодаря этим техническим достижениям мы можем сказать, что наши вооруженные силы находятся в значительно лучшем состоянии, чем несколько лет назад. С такой боеспособной армией армия Индонезии выглядит ярко!" # With these technical advances, we can say that our military is in a significantly better state than a few years ago. With such a capable military, Indonesia's military looks bright!
 INS_adopt_foreign_tactics: "Принять иностранную тактику" # Adopt Foreign Tactics
 INS_adopt_foreign_tactics_desc: ""
 INS_update_gun_designes: "Обновите дизайн оружия" # Update the Gun Designes
 INS_update_gun_designes_desc: "Если мы хотим стать нацией, известной своей армией, мы должны помнить и о наших пехотных силах. Наши орудия сильно устарели, иногда они появились еще во времена Вельткрига или даже раньше. Время это изменить!" # If we are to become a nation famed for its army, we should keep our infantry forces in mind too. Our guns are severely outdated, sometimes dating back to the Weltkrieg or even earlier. Time to change that!
 INS_mechanized_research: "Механизированные исследования" # Mechanized Research
 INS_mechanized_research_desc: ""
 INS_artillary_support: "Артиллерийская поддержка" # Artillary Support
 INS_artillary_support_desc: "Мы должны поддержать наши армии артиллерией, части которой можно стратегически разместить в горах, чтобы остановить наших врагов, когда они подвергаются обстрелам в джунглях." # We should back our armies up with artillery, pieces of which can be strategically placed on mountains to stop our enemies in their tracks as they get barraged in the jungle.
 INS_jungle_warfare: "Война в джунглях" # Jungle Warfare
 INS_jungle_warfare_desc: ""
 INS_meet_them_with_force: "Встретьте их силой" # Meet Them With Force
 INS_meet_them_with_force_desc: ""
 INS_army_of_experience: "Армия опыта" # An Army of Experience
 INS_army_of_experience_desc: "Нам следует черпать вдохновение из KNIL. Хотя их цели – поддержание голландской и британской тирании над индонезийцами – презренны, мы определенно должны отметить их великолепную организацию и дисциплину." # We should take inspiration from the KNIL. While their goals - maintaining Dutch and British tyranny over Indonesians - are despicable, we should definitely take note of their splendid organisation and discipline.
 INS_mountainer_research: "Альпинистские исследования" # Mountainer Research
 INS_mountainer_research_desc: "Индонезия является домом для множества гор и даже вулканов. Нам следует инвестировать в специальные силы, специально обученные для ведения боевых действий в альпийских условиях, чтобы улучшить как нашу защиту, так и нападение." # Indonesia is home to many mountains, volcanoes even. We should invest in special forces specifically trained to fight in alpine conditions to improve both our defence and offence.

 INS_establish_an_navy: "Создать военно-морской флот" # Establish an Navy
 INS_establish_an_navy_desc: "Индонезия — островное государство, и пока у нас нет военно-морского флота, мы вряд ли сможем помешать врагу отрезать Яву и Суматру от остального архипелага. Давайте построим флот, чтобы сохранить нацию вместе!" # Indonesia is a nation of islands, so long as we don't have a navy, we can hardly prevent the enemy from cutting Java and Sumatra off from the rest of the archipelago. Let us build a navy to keep the nation together!
 INS_purchase_new_ships: "Покупайте новые корабли" # Purchase New Ships
 INS_purchase_new_ships_desc: "Создание военно-морского флота с нуля будет серьезной проблемой. Вместо этого нам следует попытаться убедить иностранные державы помочь нам построить флот, которого мы так желаем." # Building a navy from scratch will be a severe challenge. We should instead try to entice foreign powers to help us build the navy we so desire.
 INS_expand_naval_ports: "Расширить военно-морские порты" # Expand the Naval Ports
 INS_expand_naval_ports_desc: "Мы должны позаботиться о том, чтобы практически каждый остров имел хотя бы какую-то военно-морскую охрану. Нас вряд ли можно воспринимать всерьез, учитывая ограниченный в численности флот." # We should make sure that virtually every island has at least some kind of naval guardianship. We can hardly be taken seriously with a numerically limited navy.
 INS_destroyer_research: "Исследование эсминца" # Destroyer Research
 INS_destroyer_research_desc: ""
 INS_focus_on_cruisers: "Сосредоточьтесь на круизерах" # Focus on Cruisers
 INS_focus_on_cruisers_desc: ""
 INS_focus_on_submarines: "Сосредоточьтесь на подводных лодках" # Focus on Submarines
 INS_focus_on_submarines_desc: "Давайте построим наш флот из подводных судов, таких как подводные лодки. В Вельткриге они, возможно, выиграли войну с Германией, и наш бывший колониальный хозяин тоже специализировался на них. Давайте будем преследовать их корабли, чтобы нападение на нас было слишком дорогим." # Let us build our navy of subsurface vessels such as submarines. In the Weltkrieg they arguably won Germany the war and our former colonial master was specialised in them as well. Let us harass their shipping to make it too expensive to attack us.
 INS_study_naval_doctrines: "Изучите военно-морские доктрины" # Study Naval Doctrines
 INS_study_naval_doctrines_desc: ""
