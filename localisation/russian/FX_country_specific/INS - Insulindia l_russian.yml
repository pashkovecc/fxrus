 INS_proclaim_independence: "Провозгласить независимость" # Proclaim Independence
 INS_proclaim_independence_desc: "Мы наконец-то добились своей свободы. Несчастная Беланда изгнана, и независимость Индонезии обеспечена! Этот день не скоро забудется!" # We have secured our freedom at last. The wretched Belanda have been pushed out and Indonesia's independence has been secured! This day will not soon be forgotten!

 INS_insulindian_diplomacy: "Индонезийская дипломатия" # Indonesian Diplomacy
 INS_insulindian_diplomacy_desc: "Теперь, когда мы обеспечили наше независимое будущее, необходимо открыть внешнеполитическое ведомство для установления контактов с внешним миром для достижения наших целей!" # Now that we secured our independent future, a foreign office should be opened to establish contacts with the outside world as we venture to further our goals!
 INS_find_democratic_friends: "Найдите друзей-демократов" # Find Democratic Friends
 INS_find_democratic_friends_desc: ""
