l_russian:
 EST_FUHRERREICH_DESC: "Эстония на протяжении многих веков находилась под контролем иностранных держав. Наконец, в 1918 году, на заключительном этапе Великой войны, Эстония увидела шанс получить независимость и сумела его добиться.\n\nС тех пор Эстония пережила большую политическую нестабильность и турбулентность, что привело к объявлению военного положения и нынешнему режиму Патриотической лиги Константина Пятса. Однако его власть не совсем надежна." # Estonia have in many centuries been under the control of foreign powers. Finally, in 1918, at the closing stages of the Great War, Estonia saw a chance to gain independence and managed to achieve it.\n\nSince then, Estonia have seen much of political instability and turbulence, leading to a declaration of Martial Laws and the current regime under Konstantin Päts' Patriotic League. His power, however, is not all secure..

