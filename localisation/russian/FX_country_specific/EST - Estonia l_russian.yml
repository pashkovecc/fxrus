### Events ###

 estonia.1.t: "Статус Эстонии" # The Status of Estonia
 estonia.1.d: "Эстония впервые обрела независимость в последние дни Великой войны, в 1918 году, после того как на протяжении всей своей истории она находилась под властью ливонцев, шведов и русских. Но независимость не будет свободной: и Германская империя, и недавно образованный Советский Союз попытаются взять Эстонию под свой контроль. Однако в начале 1920 года Эстонии удалось сохранить свою независимость и свою землю.\n\nДва десятилетия после обретения Эстонией независимости будут наполнены политической нестабильностью, за которой на протяжении многих лет последует множество слабых и недолговечных коалиционных правительств. Политическая нестабильность дала возможность восстанию, поддержанному Советским Союзом, в 1924 году, которое, однако, рухнуло так же быстро, как и возникло. Было ясно, что Эстония не сможет продолжать так долго.\n\nВ начале 1930-х годов нестабильность и рост правого движения вапсов привели к тому, что правительство во главе с Константином Пятсом ввело военное положение. Это привело бы к созданию Пятсом и его сторонниками Патриотической лиги, усилению цензуры и запрету всех других политических партий. Даже несмотря на эти меры, популярность движения вапсов в Эстонии продолжает расти, угрожая власти президента и Патриотической лиги." # Estonia first saw independence in the closing days of the Great War, in 1918, after having been ruled over by Livonians, Swedes and Russians through it's history. But independence would not be free, with both the German Empire and the newly formed Soviet Union trying to lay Estonia under their control. In early 1920, Estonia would, however, manage to hold on to their independence and their land.\n\nThe two decades following the independence of Estonia would be filled by political instability, with many weak and short lived coalition governments following over the years. The political instability gave room for a Soviet-supported uprising in 1924, that would, however, collapse as quickly as it rose up. It was clear that Estonia could not continue like this for much longer.\n\nIn the early 1930s, the instability and the growth of the right-wing Vaps Movement would lead to the government, led by Konstantin Päts, to initiate Martial Law. This would lead to the establishment of the Patriotic League by Päts and his supporters, increased censorship and the banning of all other political parties. Even with these measures, the Vaps Movement has continued to grow in popularity in Estonia, threatening the power of the President and the Patriotic League.
 estonia.1.a: "Давайте посмотрим, куда дует ветер" # Let Us See Where The Wind Blows

 estonia.2.t: "Слухи о перевороте" # Rumors of a Coup
 estonia.2.d: "С момента введения военного положения в 1934 году всегда существовали опасения, что представители оппозиции могут начать переворот против нашего правительства. Теперь кажется, что эти опасения могут быть вполне обоснованными, поскольку появляются слухи о заговоре с целью свержения эстонского правительства.\n\nХотя Эстонии удалось распустить большинство политических партий, нет уверенности в том, что эти бывшие партии не действуют так, как если бы они все еще работали. Тем более, что движение вапсов все еще существует, даже несмотря на то, что оно официально распущено, а его лидер Андрес Ларка находится в тюрьме. Вапсы могут даже стоять за этим заговором, если он окажется правдой." # Since the start of the Martial Law back in 1934, there have always been some scares that opposition figures would initiate a coup against our government. Now, it seems like these scares might be well founded, as rumors of a plot to overthrow the Estonian government surfaces.\n\nWhile Estonia has managed to disband most political parties, there are no certainty that these former parties are not operating as if they were still in operation. Ecpesially the Vaps Movement is still around, even if they officially are disbanded and their leader, Andres Larka, is imprisoned. The Vaps might even be those behind this plot, if it is found out to be true.
 estonia.2.a: "Посмотрите дальше.." # Look Further Into It..

 estonia.3.t: "Заговор с целью свержения правительства" # A Plot to Overthrow the Government
 estonia.3.d: "Наше расследование привело к убедительным доказательствам того, что существует заговор с целью свержения правительства Эстонии. Хотя наши источники указывают на то, что за этим заговором стоят члены Движения вапсов, нет уверенности в том, что их лидеры имеют к этому какое-то отношение. Не менее вероятно, что это очередной коммунистический заговор. Даже в этом случае, похоже, что только вапы обладают популярностью и влиянием в Эстонии, чтобы бросить нам вызов. Хотя мы арестовали Андреса Ларку, лидера группы, Артур Сирк, еще одна ведущая фигура движения, все еще находится на свободе и в настоящее время находится в изгнании в Финляндии. Однако он все еще способен представлять угрозу нашему правительству." # Our investigation have lead to damning evidence that a plot to overthrow the Estonian government are out there. While our sources points to members of the Vaps Movement being behind this plot, there are no certainty that their leaders have anything with it. It is even as likely that it is another communist plot. Even then, it seems to only be the Vaps who has the popularity and influence in Estonia available to challenge us. While we have arrested Andres Larka, leader of the group, Artur Sirk, another leading figure in the movement, are still at large, currently in exile in Finland. He is still able, however, to pose a threat to our government.
 estonia.3.a: "Должно быть, это Сирк!" # It Must Be Sirk!
 estonia.3.b: "Давайте воздержимся от необоснованных обвинений" # Let's Refrain From Baseless Accusations

 estonia.4.t: "Что делать с Сирком?" # What to do With Sirk?
 estonia.4.d: "Поскольку Артур Сирк, заместитель лидера движения вапсов, все еще находится в изгнании в Финляндии, нам трудно попытаться арестовать его, не посоветовавшись с финским правительством. Однако вполне вероятно, что финны воспримут наше обвинение в его причастности к заговору как факт, что приведет к потенциальной экстрадиции.\n\nЕсть и те, кто утверждает, что вместо этого нам следует нанять убийцу, чтобы убить Сирка, устранив его раз и навсегда. Это был бы спорный вариант, и люди считали бы нас довольно варварскими и тираническими." # With Artur Sirk, the deputy leader of the Vaps Movement still in exile in Finland, it is difficult for us to try to arrest him without consulting the Finnish government. However, it is likely that the Finns will take our accusation of his involvement in the plot as fact, leading to a potential extradition.\n\nThere are also those that argues we should instead hire an assassin to kill Sirk, eliminating him once and for all. This would be a controversial option, and would make people see us as rather barbaric and tyrannical.
 estonia.4.a: "Давайте попробуем арестовать его" # Let Us Try to Arrest Him
 estonia.4.b: "Положите что-нибудь в его напиток" # Put Something in His Drink

 estonia.5.t: "Эстония просит экстрадиции Артура Сирка" # Estonia Ask For the Extradition of Artur Sirk
 estonia.5.d: "Наш братский сосед на юге, Эстония, обратился к нам с просьбой экстрадировать к ним Артура Сирка, ведущего деятеля эстонского движения вапсов. Они предоставили нам веские доказательства для экстрадиции господина Сирка, поскольку он несет ответственность за заговор с целью свержения правительства Эстонии. Хотя есть небольшая вероятность, что эти преступления могут быть сфабрикованы, чтобы заставить нас его экстрадировать, было бы слишком ужасно, чтобы в них не верить. Но даже в этом случае Эстония еще не подвела нашего доверия, так что это кажется безопасным выбором." # Our brotherly neighbor in the south, Estonia, has requested us to extradite Artur Sirk, a leading figure in the Estonian Vaps Movement, to them. They have given us good evidence to extradite Mr. Sirk, with him being responsible for a plot to overthrow the Estonian government. While there are a small chance these crimes can be made up to make us extradite him, they would be too damning not to believe in. Even then, Estonia has not broken our trust before, so it seems like a safe choice.
 estonia.5.a: "Вот твой преступник" # Here is Your Criminal

 estonia.6.t: "Артур Сирк под арестом" # Artur Sirk Under Arrest
 estonia.6.d: "Сегодня в аэропорту Талина приземлился финский военный самолет, на борту которого находился Артур Сирк. Поскольку экстрадиция прошла без проблем, мы наконец можем посадить его, как и многих других членов Vaps, под решетку. Этот призрак больше не будет преследовать эстонский народ." # Today, a Finnish military plane landed on the air port in Talinn, bringing with them Artur Sirk. With the extradition playing out without any problems, we can finally put him, along with many other Vaps members under bars. No more will this spectre haunt the Estonian nation any longer.
 estonia.6.a: "Ларка, у тебя есть компания!" # Larka, You Got Company!

 estonia.7.t: "Смерть Сирка" # The Death of Sirk
 estonia.7.d: "Наш убийца сообщил нам, что заговор с целью убийства Артура Сирка увенчался успехом. Поздним вечером, выпивая, нашему убийце удалось подсыпать что-то в свой напиток, пока никто этого не заметил. Но после его смерти многие теперь знают, что его смерть была чем-то большим, чем просто случайное пищевое отравление. Негативная реакция на это может нанести ущерб нашей репутации и популярности, но принятые меры могут оказаться необходимыми." # Our assassin have relieved news to us that the plot to assassinate Artur Sirk has been succsessful. On an late evening, while out drinking, our assassin managed to slip something into his drink while nobody saw it. But with his death, many now know that his death was more than just accidental food poisioning. The backlash from this could hurt our reputation and popularity, but the action taken might be necessary.
 estonia.7.a: "Наше правление надежно защищено" # Our Rule is Surely Secured

 estonia.8.t: "Беспорядки потрясают нацию" # Riots Strikes the Nation
 estonia.8.d: "Новость об убийстве Артура Сирка не была хорошо воспринята его сторонниками в Эстонии. Начавшись с демонстрации соболезнований друзьям и семье Сирка, они быстро переросли в несколько беспорядков по всей стране. Это также подогревается правительством Финляндии, которое злится на нас за убийство человека, проживающего в их стране." # The news about the assassination of Artur Sirk has not been well received among his supporters in Estonia. Beginning as demonstrations of showing condolences to Sirk's friends and family, it quickly developed into several riots across the nation. These have also been fueled by the Finnish government, who is pissed at us for assassinating someone residing in their country.
 estonia.8.a: "Оно сгорит.." # It Will Burn Out..

 estonia.9.t: "Восстание [GetYear]" # The [GetYear] Uprising
 estonia.9.d: "Беспорядки и протесты переросли в восстание против правительства Эстонии. Хотя в этом восстании участвуют многие члены вапсов и другие антиправительственные группы, среди этих протестующих, похоже, мало организованности. Нам повезло, что на нашей стороне сила эстонской армии во главе с Йоханом Лайдонером. Возможно, пришло их время еще раз показать, что они являются защитниками Эстонии." # The riots and protests have devolved into an uprising against the Estonian government. While it is an uprising made up of many Vaps members and other anti-governmental groups, there seems to be little organization among these protesters. We are lucky to have the power of the Estonian army, headed by Johan Laidoner, on our side. It may be their time to show, yet again, that they are the protectors of Estonia.
 estonia.9.a: "Призовите Лайдонера и армию" # Call Upon Laidoner and the Army

 estonia.10.t: "Восстание подавлено" # The Uprising Crushed
 estonia.10.d: "Добрая весть! Недавно армии удалось подавить это восстание, обеспечив контроль правительства и армии в Эстонии. Хотя восстание и его прекращение привели к гибели и ранениям многих людей, оно является приемлемой жертвой свободе и суверенитету Эстонии. Даже тогда именно главнокомандующий Йохан Лайдонер, а не Константин Пятс, прославляется как спаситель нации. Даже тогда было бы нелепо думать, что он воспользуется своей силой против нас." # Good news! The army has now recently managed to crush this uprising, securing the government's and army's control in Estonia. While the uprising and its end has led to many dead or injured, it is an acceptable sacrifice to the freedom and sovereignty of Estonia. Even then, it is commander in chief Johan Laidoner, not Konstantin Päts that is celebrated as the savior of the nation. Even then, it would be ludicrous to think he would use his power against us.
 estonia.10.a: "Возможно, он заслуживает медали.. Просто возможно!" # Maybe He Deserves a Medal.. Just Maybe!

 estonia.11.t: "Армейские перевороты объявляют военное положение" # The Army Coups Declares Martial Law
 estonia.11.d: "Теперь, когда с восстанием покончено, Йохан Лайдонер обратил свой взор на правительственные залы. Используя беспорядки и восстание в своих интересах, Лайдонер теперь использовал армию для государственного переворота Константина Пятса и его правительства под прикрытием военного положения. На этом эпоха правления Патриотической лиги в Эстонии подошла к концу. Сегодня в Эстонии начинается эпоха военного правления." # With the uprising now dealt with, Johan Laidoner has now set his sight at the halls of government. Using the unrest and the uprising to his advantage, Laidoner have now used the army to coup Konstantin Päts and his government under the disguise of Martial Law. With this, the era of the Patriotic League's rule over Estonia has come to an end. Today, the era of military rule begins in Estonia.
 estonia.11.a: "За сильную и самостоятельную Эстонию" # For A Strong and Self-Dependent Estonia

 estonia.12.t: "Роспуск Патриотической лиги" # The Dissolution of the Patriotic League
 estonia.12.d: "После свержения правительства Константина Пятса пришло время положить конец его Патриотической лиге. Хотя это и принесло пользу нации, этого явно было недостаточно для обеспечения стабильности и мира в Эстонии. Наконец, Эстония может увидеть эпоху стабильности не под каким-либо политиком, а под правлением Главнокомандующего!" # With the government of Konstantin Päts overthrown, it is also time to end his Patriotic League. While it did some good for the nation, it was surely not enought to secure stability and peace in Estonia. Finally, Estonia can see an era of stability, not under any politician, but under the rule of the Commander-in-Chief!
 estonia.12.a: "Конец эпохи.." # An End of an Era..

 estonia.13.t: "Артур Сирк вернулся в Эстонию" # Artur Sirk Reported Back in Estonia
 estonia.13.d: "Похоже, в наших репортажах говорится, что Артур Сирк, ведущий деятель движения вапсов, прибыл сегодня утром в Эстонию на рыболовном судне через Финский залив. Его попытки скрыть свою личность оказались безуспешными, поскольку мы быстро нарушили его маскировку. Теперь вопрос в том, попытаемся ли мы арестовать его за предыдущие преступления или отпустим на свободу." # It looks like our reports tells us that Artur Sirk, a leading figure in the Vaps Movement, have arrived this morning in Estonia, traveling by a fishing vessel over the Bay of Finland. His attempts to hide his identity have proved unsuccessful, as we quickly fouled his disguises. Now, the question is, shall we attempt to arrest him for his previous crimes, or let him go free.
 estonia.13.a: "Идти! арестовать его" # Go! Arrest Him
 estonia.13.b: "Давайте Подождем.." # Let Us Wait..

 estonia.14.t: "Арест Артура Сирка" # The Arrestation of Artur Sirk
 estonia.14.d: "Сегодня к дому Артура Сирка прибыли полицейские с задачей его арестовать. Хотя мы верили, что все пройдет без проблем, очевидно, что г-н Сирк не желает сдаваться без боя. Запирая дверь и отказываясь подчиняться приказам, его сопротивление аресту становится небольшой проблемой. Надеюсь, мы сможем достичь его в конце дня." # Today, police forces arrived at the residence of Artur Sirk, tasked with arresting him. While we believed this would go without problems, it is apparent that Mr. Sirk is not willing to go without a fight. By barring the door and refusing to comply with orders, his resistance to arrest is a little problem. Hopefully, we can attain him at the end of the day.
 estonia.14.a: "Хватит дурачиться!" # Stop Fooling Around!

 estonia.15.t: "Артур Сирк исчезает" # Artur Sirk Disappears
 estonia.15.d: "Артур Сирк загадочным образом исчез. Тем или иным способом ему удалось проскользнуть через нашу полицию. Так, по крайней мере, нам говорят. Ходят слухи, что его убили полицейские и пытаются скрыть улики. По крайней мере, такая теория набирает обороты среди его последователей, доказывая, что он не перегруппировался с ними. Независимо от того, где он находится, мы надеемся, что он не причинит еще больше ущерба Эстонии." # Mysteriously, Artur Sirk has disappeared. By one way or another, he managed to slip through our police forces. That is, at least, what we are told. There are some rumors that the police officers killed him and are trying to hide away the evidence. That is, at least, a theory gaining steam among his followers, proving that he has not regrouped with them. Regardless where he is, we hope he don't cause more damage in Estonia.
 estonia.15.a: "Действительно загадочно.." # Mysterious Indeed..

 estonia.16.t: "Сообщения о дезертирстве" # Reports of Desertions
 estonia.16.d: "Загадочным образом стали поступать сообщения о том, что солдаты и полицейские уклоняются от своих обязанностей. Эта новость звучит тревожно, тем более что мы знаем, что члены движения вапс все еще находятся на свободе. Наши расследования пока не собрали никакой полезной информации." # Mysteriously, there have come in reports of soldiers and police officers deserting from their duties. This news sounds worrying, especially since we know that members of the Vaps Movement are still at large. Our investigations have not gathered any useful information yet.
 estonia.16.a: "Странный" # Strange

 estonia.17.t: "Сирк сбежал из-под ареста" # Sirk Escapes Arrest
 estonia.17.d: "Артуру Сирку, ведущему участнику движения вапсов, удалось скрыться от нашей полиции. Зная, что мы преследуем его, он начал заручаться поддержкой своих сторонников. Уже начали поступать новости о дезертирах, а также о начале того, что выглядит как восстание. Нам нужно быть готовыми к худшему." # Artur Sirk, the leading member of the Vaps Movement, have managed to escape our police forces. With he knowing that we are after him, he has begun to rally support from his supporters. Already, news of deserters have begun to arrive, among with a start of what looks like an uprising. We need to be prepared for the worst.
 estonia.17.a: "Соберите войска!" # Rally the Troops!

 estonia.18.t: "Восстание движения вапов" # The Vaps Movement Uprising
 estonia.18.d: "Сегодня утром отряды, лояльные движению вапсов, штурмовали столицу Талинна. Вооруженные боевым оружием, им удалось захватить большую часть города и уже переманить на свою сторону множество полицейских и солдат. Многие дезертиры из полиции и армии также вновь появились в рядах Движения вапов. Не имея другого выбора, Константин Пятс бежал из страны." # This very morning, units loyal to the Vaps Movement stormed the capital of Talinn. Armed with military-grade weapons, they managed to seize most of the city, and have already rallied many police officers and soldiers on their side. Many deserters from the police and army has also reappeared on the lines of the Vaps Movement. With no other choice, Konstantin Päts have fleed the country.
 estonia.18.a: "Эстония Пятса скользит" # Päts' Estonia is Slipping

 estonia.19.t: "Артур Сирк объявляет о новом правительстве" # Artur Sirk Declares A New Government
 estonia.19.d: "Тираническому правлению Константина Пятса пришел конец. Сегодня мы видим новое утро в Эстонии. Тот, где движение вапсов может сделать страну лучше. Бывшие сторонники Пятса уже либо ушли в отставку, либо перешли в наши ряды, и даже Йохан Лайдонер, главнокомандующий, неохотно отвернулся от бывшего правительства. Сегодня Эстония может смотреть вперед!" # The tyrannical rule of Konstantin Päts have come to an end. Today, we see a new morining in Estonia. One where the Vaps Movement can form the country to the better. Already, former loyalists to Päts have either retired or deserted to our ranks, with even Johan Laidoner, the commander in chief reluctantly turning his back on the former government. Today, Estonia can look forward!
 estonia.19.a: "Новая Эстония ждет" # A New Estonia Awaits

 estonia.20.t: "Лондонская катастрофа достигла Эстонии" # The London Crash Reaches Estonia
 estonia.20.d: "Недавно Лондонский фондовый рынок пережил экономический крах, обрушивший британскую экономику. В свою очередь, это распространилось по всему миру, и наше время пришло сейчас. По мере того, как экспорт сельскохозяйственной продукции сокращается и происходит массовое изъятие средств из наших собственных банков, Эстония, похоже, тоже впадает в экономическую депрессию." # Recently, the London Stock Market have experienced an economic crash, bringing down the British economy. This has, in return, spread across the world, with our time coming now. As agricultural exports decreases and runs upon our own banks are happening, Estonia seems to slip into this economic depression as well.
 estonia.20.a: "Это неудачно.." # That's Unfortunate..

 estonia.21.t: "Восстановление на горизонте" # Recovery on the Horizon
 estonia.21.d: "Наше правительство предприняло шаги по смягчению последствий краха лондонской фондовой биржи. Сейчас мы начинаем видеть возвращение к более нормализованной ситуации. Хотя последствия еще будут преследовать нас еще немного, по крайней мере, мы находимся на пути к полному выздоровлению." # Steps have now been made by our government to mediate for the effects of the London Stock Market Crash. We are now beginning to see a return to a more normalized situation. While the effects will still haunt us a bit longer, at least we are on the way to a full recovery.
 estonia.21.a: "Эстония победит!" # Estonia Will Prevail!

 estonia.22.t: "Парламентские выборы [GetYear]" # The [GetYear] Parliamentary Election
 estonia.22.d: "С введением новой конституции для нас естественно провести новые выборы. Хотя оппозиционным партиям по-прежнему не разрешено создаваться, независимым партиям разрешено конкурировать без особого сопротивления со стороны правительства. В то время как независимые кандидаты смогли набрать около 40% голосов, правящий Национальный фронт за выполнение конституции получил большинство в 3/4 в парламенте. Благодаря этому результату Константин Пятс близок к тому, чтобы утвердить свою власть." # With the introduction of the new constitution, it is natural for us to hold a new election. While opposition parties are still not allowed to be formed, independents have been allowed to compete without much opposition from the government. While the independents have been able to win about 40% of the vote, the ruling National Front for the Implementation of the Constitution have won a 3/4 majority in the parliament. With this result, Konstantin Päts is close to be assured his power.
 estonia.22.a: "Я люблю демократию.." # I Love Democracy..

 estonia.100.t: "Йохан Лайдонер и его люди" # Johan Laidoner and His Men
 estonia.100.d: "Ни один человек не может править в одиночку, и это факт, который знает генерал Йохан Лайдонер. Если он сможет удержать власть, он должен, по крайней мере, владеть искусством дипломатии. Сегодня генерал, а теперь и лидер Эстонии встретился с генералами эстонской армии. Поскольку некоторые из них все еще оставались верными режиму Константина Пятса, необходимо было привлечь их на нашу сторону. К счастью, Лайдонера встречают разумные люди, большинство из которых видят, как дует ветер." # No single person can rule alone, and this is a fact general Johan Laidoner knows. If he shall be able to hold onto power, he must be at least known with the art of diplomacy. Today, the general and now leader of Estonia met with generals of the Estonian army. With some of them still loyal to the regime of Konstantin Päts, it was necessary to get them to our side. Luckily, Laidoner is met by reasonable men, with most of them seeing how the wind is blowing.
 estonia.100.a: "В то же время на следующей неделе?" # Same Time Next Week?

 estonia.101.t: "Суд над Константином Пятсом" # The Trial of Konstantin Päts
 estonia.101.d: "Бывшего государственного старейшину Константина Пятса сегодня судили за подрыв безопасности Эстонии. Хотя многие все еще защищают его, называя эти обвинения бессмысленными, а судья теперь выносит ему приговор за эти преступления, мы надеемся, что люди теперь видят причину. Конечно, лояльность самого судьи нам удалось купить, но это лишь мелочь." # Former State Elder Konstantin Päts was today trialed for undermining the security of Estonia. While many still defend him, calling these mare accusations, with the judge now sentencing him for these crimes, we hope people are now seeing reason. Of course, the judge himself is one that we have managed to buy the loyalty of, but that is just a minor detail.
 estonia.101.a: "Справедливость восторжествовала" # Justice is Served

 estonia.102.t: "Возрождение текстильной промышленности" # Revival of the Textile Industry
 estonia.102.d: "После Великой войны и лондонского краха текстильная промышленность Эстонии оказалась на грани гибели. Из-за небольшого экспорта и заморозки потребительского рынка, продажи текстильной продукции в Эстонии и за ее пределами были незначительными. Теперь, с введением частных интенсивных программ и программ финансовой помощи, правительство Эстонии желает увидеть возрождение определенных отраслей, даже с изменением их направленности. Надеюсь, мы увидим улучшения в этой области." # After both the Great War and the London Crash, the Estonian textile industry have been close to dead. With little exports and the consumer market in freeze, there have been little sale of textile products in and from Estonia. Now, with the introduction of private intensives and bailouts, the Estonian government is willing to see the revival of certain industries, even with a redirection of their focus. Hopefully, we will see improvement on this area.
 estonia.102.a: "Промышленность полезна для экономики" # Industry is Good for Economy

 estonia.103.t: "За исполнение Конституции" # For the Implementation of the Constitution
 estonia.103.d: "Поскольку Третья конституция Эстонии сейчас находится на начальном этапе, было бы целесообразно реорганизовать Патриотическую лигу в расширенный блок - Национальный фронт за выполнение конституции. Поскольку Патриотическая лига часто связана с наиболее авторитарными элементами «Эры молчания», это может заставить людей увидеть, что мы находимся на пути к лучшему будущему." # With the Third Constitution of Estonia now in its starting phase, it will be fit to reorganize the Patriotic League into an enlarged bloc, the National Front for the Implementation of the Constitution. With the Patriotic League often being affiliated with the most authoritarian bits of the Era of Silence, this might make people see that we are on the road to a better future.
 estonia.103.a: "Давайте объединимся под новой Конституцией" # Let Us Unite Under the New Constitution

 estonia.104.t: "Вапсы умиротворены" # The Vaps Pacified
 estonia.104.d: "Наконец, нам удалось усмирить Движение вапсов, движение, которое бросило вызов власти нашего правительства. Возможно, когда они, наконец, начнут уважать нашу власть, мы сможем работать вместе позже." # Finally, we have been able to pacify the Vaps Movement, the movement that have stood as a challenge towards the power of our government. Perhaps, with them finally respecting our authority, we might be able to work together later.
 estonia.104.a: "Эстония становится безопаснее" # Estonia is Growing Safer

 estonia.105.t: "Президент и Премьер-министр" # The President and the Prime Minister
 estonia.105.d: "Теперь, когда новая конституция вступает в силу, настало время старейшине штата назначить премьер-министра, чтобы окончательно разделить должности президента и премьер-министра. Хотя Константин Пятс остается президентом, он обратился к бывшему государственному старейшине и политику Каарелу Ээнпалу с просьбой занять пост премьер-министра. Благодаря этому назначению, возможно, так называемая Эра молчания станет немного менее молчаливой." # With the new constitution now going into effect, it is time for the State Elder to appoint a Prime Minister, to finally separate the office of the President and the Prime Minister. While Konstantin Päts continues as President, he have approached former State Elder and politician Kaarel Eenpalu for the task of Prime Minister. With this appointment, perhaps the so-called Era of Silence can become a bit less silent.
 estonia.105.a: "Новое будущее впереди!" # A New Future Ahead!

 estonia.106.t: "А как насчет военного правительства?" # What About the Military Government?
 estonia.106.d: "Теперь, когда военные контролируют страну, мы теперь можем управлять страной так, как пожелаем. Эти шаги, хотя и были автократическими, были необходимы для обеспечения независимости и безопасности Эстонии. С Красным Медведем Советского Союза на Востоке. С орлом Валкистской Германии на Западе. Для победы Эстонии необходимо твердое и стабильное управление." # With the military now in control over the country, we are now able to steer the nation as we wishes. These steps, while autocratic, has been necessary to secure the independence and safety of Estonia. With the Red Bear of the Soviet Union in the East. With the Eagle of Valkist Germany in the West. Estonia needs firm and stable governance to prevail.
 estonia.106.a: "Да здравствует Эстония!" # Long Live Estonia!

 estonia.107.t: "Демократия, облаченная в движение" # Democracy Clothed by the Movement
 estonia.107.d: ""
 estonia.107.a: "Наше движение построит Эстонию" # Our Movement Will Build Estonia
 
