 EST_trial_pats_loyalists: "Лоялисты Trial Päts" # Trial Päts Loyalists
 EST_trial_pats_loyalists_desc: "Многие сторонники Константина Пятса по-прежнему выступают против нового военного правления в Эстонии. Они сплачивают народ против нас и вызывают всеобщие волнения в стране. Мы надеемся, что предание этих лоялистов судье и осуждение их за предательское поведение успокоит ситуацию." # Many loyalists of Konstantin Päts still oppose the new military rule over Estonia. They rally the people against us and causes general unrest in the nation. Taking these loyalist in front of a judge, and sentencing them for their treasonous behaviors, will hopefully calm the situation down.
