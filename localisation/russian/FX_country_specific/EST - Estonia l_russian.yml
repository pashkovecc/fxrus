### Focus Tree ###

 EST_military_rule: "Военное правление" # Military Rule
 EST_military_rule_desc: "Военным под командованием Йохана Лайдонера удалось захватить власть в Эстонии. Поскольку придется иметь дело как со сторонниками Константина Пятса, так и с Движением вапсов, задача будет непростой." # The military, under the command of Johan Laidoner, have managed to seize power in Estonia. With both supporters of Konstantin Päts and the Vaps Movement to deal with, the task at hand will not be easy.
 EST_state_elders_power: "Власть государственного старейшины" # The State Elder's Power
 EST_state_elders_power_desc: "Константин Пятс, государственный старейшина, и его Патриотическая лига сумели удержать власть в эти трудные времена. Вскоре попытка государственного переворота 1936 года станет лишь страницей в истории нашей великой нации." # Konstantin Päts, the state elder, and his Patriotic League have managed to hold onto power in these rigorous times. Soon, the attempted coup of 1936 will only be a page in the history of our great nation.
 EST_vaps_movement_siezes_power: "Движение вапов захватывает власть" # The Vaps Movement Seizes Power
 EST_vaps_movement_siezes_power_desc: "Тираническому правлению Константина Пятса и его Патриотической лиги пришел конец. С народным движением во главе этой страны мы наконец увидим справедливую и справедливую Эстонию для нашего народа и наших ветеранов." # The tyrannical rule of Konstantin Päts and his Patriotic League is now over. With a popular movement at the head of this country, we will finally see a just and fair Estonia for our people and our veterans.
