 EST_one_party_democracy_desc: "Эстония, наконец, может снова стать демократической страной. Хотя бы один под надзором Движения. Разобравшись с внутренними врагами Эстонии, мы, наконец, можем позволить народу решать судьбу своей великой нации. Да здравствует Эстония!" # Estonia can finally return to be a democratic nation. At least one under the supervision of the Movement. With the domestic enemies of Estonia taken hand of, we can finally let the people decide the fate of their great nation. Long Live Estonia!

