### National Spirits ###

 EST_ineffective_government_and_unrest_idea: "Неэффективное правительство и беспорядки" # Ineffective Government and Unrest
 EST_ineffective_government_and_unrest_idea_desc: "Несмотря на все усилия Пятса по искоренению движения вапсов с 1934 года (включая арест лидера Андреса Ларки), партией по-прежнему руководят высокопоставленные члены как внутри Эстонии, так и за рубежом, в том числе заместитель лидера Артур Сирк, который находится в изгнании в Финляндии. Это вызвало серьезные волнения среди сторонников конституционной реформы, которые составляют значительную часть населения. Следовательно, возвращение Сирка будет лишь вопросом времени…" # Despite Päts’ best efforts to eradicate the Vaps Movement since 1934 (including arresting the leader Andres Larka), there are still high-profile members operating the party from within Estonia and abroad, including deputy leader Artur Sirk who is exiled in Finland. This has caused major unrest among supporters who strongly advocate constitutional reform, of which is a large proportion of the population. Hence, it will only be a matter of time before Sirk returns…
 EST_ineffective_government_and_unrest1_idea: "Неэффективное правительство и беспорядки" # Ineffective Government and Unrest

 EST_university_of_tartu_idea: "Тартуский университет" # University of Tartu
 EST_university_of_tartu_idea_desc: "Тартуский университет, открытый в 1632 году шведским королем Карлом Густавом II, является национальным университетом Эстонии. Будучи особенно передовым по сравнению с другими университетами соседних стран, он внес большой вклад в развитие национальной науки Эстонии." # Opened in 1632 by Swedish King Carl Gustav II, the University of Tartu is the national university of Estonia. Being particularly advanced compared to other universities in nearby countries, it has contributed greatly to the national sciences of Estonia.

 EST_memories_communist_uprising_idea: "Воспоминания о коммунистическом восстании" # Memories of the Communist Uprising
 EST_memories_communist_uprising_idea_desc: "Коммунистическое восстание 1924 года все еще свежо в памяти молодых и старых. Переворот, поддержанный Советским Союзом, имел катастрофические последствия для революционеров: дезорганизация и меньшее, чем хотелось бы, вооружение способствовали полному уничтожению всей социалистической и коммунистической мысли в Эстонии. Хотя либертарианские идеи широко распространены, они практически не имеют влияния в Рийкикогу." # The Communist Uprising of 1924 is still fresh in the memories of the young and old. The Soviet-backed coup was disastrous for the revolutionaries - disorganisation and fewer than desired arms contributed to a complete annihilation of all Socialist and Communist thought in Estonia. Although Libertarian ideas are thrown about, it bears little to no influence in the Riikikogu.
 EST_defence_against_reds_idea: "Воспоминания о коммунистическом восстании" # Memories of the Communist Uprising
 EST_defence_against_reds_idea_desc: "Коммунистическое восстание 1924 года все еще свежо в памяти молодых и старых. Переворот, поддержанный Советским Союзом, имел катастрофические последствия для революционеров: дезорганизация и меньшее, чем хотелось бы, вооружение способствовали полному уничтожению всей социалистической и коммунистической мысли в Эстонии. Хотя либертарианские идеи широко распространены, они практически не имеют влияния в Рийкикогу." # The Communist Uprising of 1924 is still fresh in the memories of the young and old. The Soviet-backed coup was disastrous for the revolutionaries - disorganisation and fewer than desired arms contributed to a complete annihilation of all Socialist and Communist thought in Estonia. Although Libertarian ideas are thrown about, it bears little to no influence in the Riikikogu.

