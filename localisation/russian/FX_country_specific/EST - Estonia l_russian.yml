 EST_third_constitution_desc: "В эти времена молчания над нашей страной новая конституция станет дыханием, которое нарушит тишину и, наконец, направит нашу страну на путь новой стабильности. Эта конституция станет первым шагом на пути к новой демократии." # With these times of silence over our nation, a new constitution will be the breath that breaks the silence, finally seeing our nation towards the path of renewed stability. This constitution will be the first steps towards a new democracy.
