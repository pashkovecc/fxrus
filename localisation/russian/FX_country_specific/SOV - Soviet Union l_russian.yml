 SOV_power_struggle: "Советская тройка" # Soviet Troika
 SOV_power_struggle_desc: "Смерть Ленина создала вакуум власти, который грозит расколоть Союз. Трое мужчин выступили, чтобы возглавить нашу страну в эти трудные времена: Вячеслав Молотов, Николай Бухарин и Григорий Зиновьев. Хотя наше правительство на данный момент стабильно, фундаментальные разногласия и амбиции между этими тремя мужчинами начинают подрывать их способность координировать действия и руководить Союзом. Ослабят ли предательство и амбиции этих людей нашу Революцию или принесут четвертой новую эру могущественного лидерства?\n\n§YПоддержка Съезда:§! §R[?SOV.soviet_congress]%§!\n\n§YВоенное влияние:§! §R[?SOV.soviet_military]%§!\n\n§YКоррупция:§! §R[?SOV.soviet_corruption]% §!" # The death of Lenin has opened a power vacuum that threatens to tear the Union apart. Three men have stepped up to lead our nation through these trying times, Vyacheslav Molotov, Nikolai Bukharin and Grigory Zinoviev. Though our government is stable for now, fundamental disagreements and ambitions between these 3 men are beginning to undermine their ability to coordinate and lead the Union. Will these men's backstabbing and ambition weaken our Revolution or bring fourth a new era of powerful leadership?\n\n§YCongressional support:§! §R[?SOV.soviet_congress]%§!\n\n§YMilitary Influence:§! §R[?SOV.soviet_military]%§!\n\n§YCorruption:§! §R[?SOV.soviet_corruption]%   §!
 SOV_recruit_army: "Заручиться военной поддержкой" # Lobby for military support
 SOV_recruit_army_desc: "Чтобы закрепить свое положение в качестве председателя Советского Союза, мы должны заручиться поддержкой советских вооруженных сил. Мы должны пропагандировать себя как сторонников вооруженных сил, готовых сделать все возможное, чтобы защитить Революцию от западных империалистов." # To secure our position as chairmen of the Soviet Union we must have the support of the Soviet military. We must promote ourselves as a supporter of the armed forces willing to do whatever it takes to protect the Revolution from western imperialists.
 SOV_bribe_politicians: "Подкупить политиков" # Bribe Politicians
 SOV_bribe_politicians_desc: "Наши амбиции требуют поддержки съезда, если мы хотим когда-либо достичь наших целей. Мы должны склонить возможных союзников в наш лагерь политическими обещаниями и экономическими стимулами, прежде чем наши враги сделают то же самое. §RЧтобы принять это решение, вам нужно 20% коррупции§!" # Our ambitions require the support of congress if we are to ever achieve our goals. We must sway possible allies to our camp with political promises and economic incentives before our enemies do the same. §RYou need 20% Corruption to take this decision§!
 SOV_public_speech: "Публичное выступление на съезде" # Public Speech in Congress
 SOV_public_speech_desc: "Мы должны продемонстрировать Съезду Советов, что мы можем встать и признать потребности как народа, так и правительства. Выступление, иллюстрирующее нашу платформу, поможет нам в достижении этой цели. §RЧтобы принять это решение, вам нужно 20% поддержки съезда и менее 40% коррупции§!" # We must demonstrate to the Soviet Congress that we can stand up and recognize the needs of both the people and the government. Giving a speech illustrating our platform will help us towards this goal. §RYou need 20% Congressional support and less than 40% Corruption to take this decision§!
 SOV_campaign_union: "Политическая кампания" # Political Campaign
 SOV_campaign_union_desc: "Наша победа над нашими противниками из Тройки потребует поддержки рабочих и местных политиков Советского Союза. Политическая кампания через наш великий Союз поможет нам заручиться поддержкой пролетариата." # Our victory against our opponents in the Troika will require the support of the workers and local politicians of the Soviet Union. A political campaign though our great Union will help us gain the support of the proletariat.
 SOV_promote_loyal_officers: "Назначить лояльных офицеров" # Appoint Loyal Officers
 SOV_promote_loyal_officers_desc: "Теперь, когда наше влияние в армии возросло, для нас настало время продвигать политических союзников на высшие чины, чтобы еще больше обеспечить лояльность армии. §RЧтобы принять это решение, вам необходимо 20% военного влияния§!" # Now that our influence has grown within the military, it is time for us to promote political allies to the higher ranks to further secure the loyalty of the army. §RYou need 20% Military Influence to take this decision§!
 SOV_expel_dissedents: "Изгнать оппозицию из Съезда" # Expel Dissidents from the Congress
 SOV_expel_dissedents_desc: "Наш приход к власти в Советском Союзе не остался незамеченным на Съезде Советов. Хотя наших сторонников много, некоторые по-прежнему видят в нас угрозу нашей великой нации. Эти люди служат лишь подрыву нашего правительства, и их следует исключить из съезда, прежде чем они сбьют с пути кого-либо еще. §RДля принятия этого решения вам потребуется 40% поддержки съезда§!." # Our rise to power within the Soviet Union has not gone unnoticed in the Soviet Congress. While our supporters are many, some still see us as a threat to our great nation. These men only serve to undermine our government and must be expelled from the congress before they lead anyone else astray. §RYou need 40% Congressional support to take this decision§!
 SOV_no_corruption: "Борьба с коррупцией" # Campaign against government corruption
 SOV_no_corruption_desc: "Несмотря на все наши усилия, многие начали замечать коррупцию внутри нашей политической фракции. Мы должны продемонстрировать нашу приверженность открытому правительству и бороться с этой коррупцией." # Despite our best efforts many have began to notice corruption within our political faction. We must show our dedication to an open government and fight this corruption.
 SOV_political_support: "Добиться поддержки съезда" # Pressure Congress for political support
 SOV_political_support_desc: "Многие из наших политических целей требуют поддержки со стороны съезда Советов, чтобы добиться какого-либо реального прогресса. Мы должны оказать давление на нашу базу, чтобы она предоставила нам поддержку и поддержку, необходимые для достижения наших амбиций. §RДля принятия этого решения вам нужна 20% поддержка съезда§!" # Many of our political goals require support from the Congress of Soviets to make any real progress. We must pressure our base to give us the support and backing needed to achieve our ambitions. §RYou need 20% Congressional support to take this decision§!
 SOV_molotov_chairmen: "Молотов становится у власти" # Molotov secures Power
 #SOV_molotov_chairmen_desc: "Теперь, когда Молотов и его фракция получили подавляющую поддержку Советского Конгресса, пришло время официально провозгласить его Председателем Советского Союза, высшей властью в нашей стране. §RЧтобы принять это решение, вам необходимо 80% поддержки Конгресса, 50% военного влияния и менее 75% коррупции§!" # Now that Molotov and his faction have gained the overwhelming support of the Soviet Congress it is time to officially proclaim him Chairman of the Soviet Union, the highest authority in our nation. §RYou need 80% Congressional support, 50% Military Influence and less than 75% Corruption to take this decision§!
 SOV_bukharin_chairmen: "Бухарин становится у власти" # Bukharin secures Power
 #SOV_bukharin_chairmen_desc: "Теперь, когда Бухарин и его фракция получили подавляющую поддержку Съезда Советов, пришло время официально провозгласить его Председателем Советского Союза, высшей властью в нашей стране. §RЧтобы принять это решение, вам необходимо 80% поддержки Конгресса, 50% военного влияния и менее 75% коррупции§!" # Now that Bukharin and his faction have gained the overwhelming support of the Soviet Congress it is time to officially proclaim him Chairman of the Soviet Union, the highest authority in our nation. §RYou need 80% Congressional support, 50% Military Influence and less than 75% Corruption to take this decision§!
 SOV_zinoviev_chairmen: "Троцкий становится у власти" # Trotsky secures Power
 #SOV_zinoviev_chairmen_desc: "Теперь, когда Троцкий и его фракция получили подавляющую поддержку Советского Конгресса, пришло время официально провозгласить его Председателем Советского Союза, высшей властью в нашей стране. §RЧтобы принять это решение, вам необходимо 80% поддержки Конгресса, 50% военного влияния и менее 75% коррупции§!" # Now that Trotsky and his faction have gained the overwhelming support of the Soviet Congress it is time to officially proclaim him Chairman of the Soviet Union, the highest authority in our nation. §RYou need 80% Congressional support, 50% Military Influence and less than 75% Corruption to take this decision§!
 SOV_expel_molotov: "Исключить Молотова со Съезда" # Expel Vyacheslav Molotov form Congress
 SOV_expel_molotov_desc: "Наш оппонент Молотов служит подрыву не только нас, но и Советского Союза в целом. Мы должны использовать наши полномочия, как предписал Съезд, чтобы изгнать этого диссидента из нашего славного Союза. §RЧтобы принять это решение, вам необходимо 70% военного влияния§!" # Our opponent Molotov serves to undermine not only us but the Soviet Union as a whole. We must use our powers, as ordained by Congress, to expel this dissident from our glorious Union. §RYou need 70% Military Influence to take this decision§!
 SOV_expel_bukharin: "Исключить Бухарина со Съезда" # Expel Nikolai Bukharin form Congress
 SOV_expel_bukharin_desc: "Наш оппонент Бухарин служит подрыву не только нас, но и Советского Союза в целом. Мы должны использовать наши полномочия, как предписал Съезд, чтобы изгнать этого диссидента из нашего славного Союза. §RЧтобы принять это решение, вам необходимо 70% военного влияния§!" # Our opponent Bukharin serves to undermine not only us but the Soviet Union as a whole. We must use our powers, as ordained by Congress, to expel this dissident from our glorious Union. §RYou need 70% Military Influence to take this decision§!
 SOV_expel_zinoviev: "Изгнать Троцкого со Съезда" # Expel Leon Trotsky form Congress
 SOV_expel_zinoviev_desc: "Наш оппонент Лев Троцкий служит подрыву не только нас, но и Советского Союза в целом. Мы должны использовать наши полномочия, как предписал Съезд, чтобы изгнать этого диссидента из нашего славного Союза. §RЧтобы принять это решение, вам необходимо 70% военного влияния§!" # Our opponent Leon Trotsky serves to undermine not only us but the Soviet Union as a whole. We must use our powers, as ordained by Congress, to expel this dissident from our glorious Union. §RYou need 70% Military Influence to take this decision§!
  
 SOV_kirov_vs_libsoc: "Борьба за власть" # Power Struggle
 SOV_kirov_vs_libsoc_desc: "Между большевиками во главе с §HКировым§! и рабочей оппозицией во главе с §HШляпниковым§! разгорелась §Hборьба за власть§!. Киров выступает за сохранение текущего курса, преследуя лишь одну цель — воплощение идей Ленина. Шляпников, напротив, выступает за дебюрократизацию экономики, развитие демократии в СССР и продвижение концепций, смежных с синдикализмом. Рабочая оппозиция рассчитывает взять верх на XXVI съезде, однако исход этой борьбы остается неопределенным...\n\n §MКиров§! Поддержка : §Y[?SOV.sov_kirov_factor]§!\n§RШляпников§! Поддержка : §Y[?SOV.sov_shliapnikov_factor]§!" # A §Hpower struggle§! has broken out between the Bolshevists led by §HKirov§! and the Worker's Opposition led by §HShliapnikov§!. Kirov is the status quo candidate whose only ambition is to fullfil Lenin's goals, Shliapnikov on the other hand wants to debureaucratize the economy, increase democracy in the Soviet Union and implement other ideas that are very close to syndicalism. The Worker's Opposition hopes to win the 26th Congress, if they will be succesful is uncertain...\n\n §MKirov's§! Support : §Y[?SOV.sov_kirov_factor]§!\n§RShliapnikov's§! Support : §Y[?SOV.sov_shliapnikov_factor]§!
