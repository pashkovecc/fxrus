 ### History 
 SOV_FUHRERREICH_DESC: "После поражения в Великой войне Российская империя погрузилась в гражданскую войну, и коммунистическая большевистская партия вскоре оказалась правителем России. Эта власть в конечном итоге была оспорена матросами-анархистами в Кронштадте, которые поднялись на борьбу с авторитаризмом в стране. Восстание увенчалось успехом, и большинство старых большевиков ушли в отставку, поскольку была реализована более демократическая форма социализма - либертарианский социализм, где рабочие действительно контролируют ситуацию. Светофор социализма во всем мире устремляется вперед в неизвестное будущее, которому угрожают польские амбиции и даже мстительные старые большевики..." # After their loss in the Great War, the Russian Empire fell into civil war and the communist Bolshevik party soon found itself as the ruler of Russia. That power was eventually disputed by anarchist sailors in Kronstadt, who rose up to fight authoritarianism in the nation. The uprising was a success and a majority of the old Bolsheviks resigned as a more democratic form of socialism was implemented- Libertarian Socialism, where the workers are truly in control. The beacon of socialism worldwide charges headfirst into an unknown future, threatened by Polish ambitions and even by revengeful old Bolsheviks...
  
 ### Country Names 
 SOV: "Советский Союз" # Soviet Union
 SOV_ADJ: "Советск" # Soviet
 SOV_DEF: "Союз Советских Социалистических Республик" # the Union of Soviet Socialist Republics
  
 unbalanced_economy: "Несбалансированная экономика" # Unbalanced Economy
 unbalanced_economy_desc: "Наша экономика крайне несбалансирована в пользу военной промышленности." # Our economy is extremely unbalanced in favour of the armament industry.
 unpopular_conscription: "Непопулярный призыв" # Unpopular Conscription
 unpopular_conscription_desc: "Хотя мы выполнили свои обещания о хлебе и земле, мы не дали им мира. Их надежда на прекращение призыва на военную службу и более мирную жизнь была полностью проигнорирована высшим руководством, поскольку они так и не отменили призыв на военную службу, что привело к тому, что эта политика стала очень непопулярной." # While we achieved our promises of bread and land we didn't give them peace. Their hope of the end of conscription and a more peaceful life has been completely ignored by the higher-ups when they never abolished conscription, this resulted in the policy being very unpopular.
 has_modern_economy: "Мы модернизировали нашу экономику" # We have modernized our Economy
  
