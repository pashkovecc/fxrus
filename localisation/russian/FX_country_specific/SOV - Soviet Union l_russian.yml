 SOV_promote_socialism: "Продвижение социализма" # Promoting Socialism
 SOV_support_AUW: "Поддержка ВСП" # Supporting the AUW
 SOV_support_AUW_desc: "Премьер [Root.GetLeader] согласен с Всероссийским союзом писателей, что политике не место в творчестве." # Premier [Root.GetLeader] agrees with the All-Russian Union of Writers that politics should not be in fiction.
  
 SOV_ending_conscription: "Прекращение призыва" # Ending Conscription
 SOV_construction_palace_soviets: "Строительство Дворца Советов" # Construction of the Palace of the Soviets
 SOV_aborting_construction: "Прекращение строительства Дворца Советов" # Aborting Construction of the Palace of the Soviets
 SOV_moscow_pool: "Строительство Московского бассейна" # Constructing the Moscow Pool
  
 SOV_defense_of_the_revolution: "Защита революции" # The Defense of the Revolution
 SOV_construction_of_the_stavka: "Строительство Ставки" # Construction of the Stavka
 SOV_train_new_generals: "Обучение новых генералов" # Training New Generals
 SOV_the_motherland_needs_you: "Ты нужен Родине!" # The Motherland needs you!
  
 SOV_collectivization_decision: "Коллективизация" # Collectivization
 SOV_collectivization_decision_desc: "Мы начали амбициозную кампанию по коллективизации сельского хозяйства. Он направлен на социализацию земли, скота и оборудования." # We have started an ambitious campaign to collectivize the agriculture. It aims for the socialization of land, livestock and equipment.
 SOV_peasants_emigration_cities: "Крестьяне бегут из колхозов" # Peasants Fleeing the Collective Farms
 SOV_peasants_emigration_cities_desc: "Крестьяне бегут из колхозов из-за зверских условий в колхозах и из-за советской пропаганды, прославившей города." # Peasants are fleeing the collective farms, because of the atrocious conditions on the farms, and because of the Soviet propopaganda which have glorified the cities.
 SOV_create_internal_passport: "Создание внутреннего паспорта" # Creating the Internal Passport
 SOV_create_internal_passport_desc: "Советский Союз сделал обязательным получение паспорта для крестьян, желающих покинуть колхоз и переехать в город. Это предотвратило бы большую эмиграцию крестьян из сельхозугодий в города." # The Soviet Union has made it mandatory for peasants that want to leave the collective farm and move to the cities to get a passport. This would prevent a big emigration of peasants from the farmland to the cities.
 SOV_retreat_from_collectivization: "Отступить от коллективизации" # Retreat from Collectivization
 SOV_retreat_from_collectivization_desc: "Мы остановим коллективизацию после того, как у нас «закружилась голова от успехов»." # We will halt collectivization after we have became 'dizzy with success'.
 SOV_siberian_ural_method: "Урало-Сибирский метод" # The Ural-Siberian Method
 SOV_siberian_ural_method_desc: "Мы попробуем выкачать зерно из деревни, исходя из попыток разжечь классовую войну в деревне." # We will try and pump grain out of the countryside based on attempts to kindle class war in the village.
 SOV_intensifaction_of_repressive_measures: "Усиление репрессий" # Intensification of Repressive Measures
 SOV_intensifaction_of_repressive_measures_desc: "Если мы хотим продолжения коллективизации, нам придется усилить репрессии." # If we want collectivization to proceed then we will need to intensify the repression.
 SOV_creating_the_25_thousand: "Создание двадцатипятитысячников" # Creating the Twenty-Five-Thousanders
 SOV_creating_the_25_thousand_desc: "«Постоянная борьба, борьба и еще раз борьба!» Мы научились думать так: без борьбы ничего не добьешься. Борьба была важной частью нашей общественной жизни» — «Двадцатипятитысячники»." # 'Constant struggle, struggle and more struggle! We've learned to think like that: without struggle, you can't achieve anything. Struggle was a major part of our social life'-Twenty-Five-Thousanders
 SOV_Force_middle_peasants_into_collective_farms: "Принуждение середняков к вступлению в колхозы" # Forcing Middle Peasants to join Collective Farms
 SOV_Force_middle_peasants_into_collective_farms_desc: "Если мы хотим, чтобы коллективизация прошла успешно, то нам понадобится вступление середняков в колхозы." # If we want the collectivization to be a success, then we will need middle peasants to join the collective farms.
 SOV_creating_secrete_reserves: "Создать секретный резерв для помощи коллективизации" # Creating Secret Reserve to Help with the Collectivization
 SOV_creating_secrete_reserves_desc: "Для помощи в раскулачивании мы создадим секретные резервы из рабочих, комсомольцев и коммунистов, которые будут использоваться в дополнение к резервным войскам ОГПУ, поступающим из Москвы и Ленинграда, для укрепления войск на Севере и на Урале." # We will create secret reserves of of workers, komsomols, and communists for help in dekulakization and to be used in addition to OGPU reserve troops coming from Moscow and Leningrad tostrengthen forces in the North and in the Urals.
 SOV_seizing_kulak_savings: "Изъять сбережения кулацких семей" # Seizing Savings of Kulak Families
 SOV_seizing_kulak_savings_desc: "Мы будем конфисковывать сбережения кулацких семей свыше 500 рублей. Эти сбережения будут переданы в Наркомат финансов." # We will seize the savings of kulak families above 500 rubles. These savings will be transferred to the Commissariat of Finance.
 SOV_exiling_kulaks: "Изгнание семей" # Exiling Families
 SOV_exiling_kulaks_desc: "Мы выгоним кулаков, причисленных ко второму классу кулаков." # We will exile the kulaks deemed to be part of the second class of kulaks.
 SOV_strengthening_border_guards: "Укрепление пограничной службы" # Strengthening Border Guards
 SOV_strengthening_border_guards_desc: "Мы усилим пограничную охрану в целях предотвращения нелегальной иммиграции." # We will strengthen border guards in order to prevent illegal immigration.
 SOV_finding_kulaks: "Охота на кулаков" # Finding Kulaks
 SOV_finding_kulaks_desc: "Мы усилили наблюдение за ночлегами, общежитиями сезонных рабочих, чайными, железнодорожными станциями и особенно крестьянскими домами." # We increased surveillance of night lodging, seasonal workers’ dorms, tea houses,railroad stations, and especially Peasant Houses.
 SOV_Liquidating_unsuccessful_collective_farms: "Ликвидация неуспешных колхозов" # Liquidating Unsuccessful Collective Farms
 SOV_Liquidating_unsuccessful_collective_farms_desc: "Нам необходимо ликвидировать «лжеколхозы», так как они не смогли добиться достаточного успеха." # We need to liquidate the 'false collective farms', since they weren't able to be successfull enough.
  
 SOV_great_patriotic_war_decision: "Великая Отечественная война" # Great Patriotic War
 SOV_great_patriotic_war_decision_desc: "Империалисты, наконец, начали наступление на Советский Союз, чтобы потушить пламя революции, но мы защитим его любой ценой!" # The imperialists finally started their attack on the Soviet Union to extinguish the flames of the revolution, but we will protect it at all costs!
 SOV_unite_the_left: "Единый фронт" # A United Front
 SOV_unite_the_left_desc: "Нет времени для сектантства! Нам всем нужно держаться вместе, иначе революция будет уничтожена." # There is no time for sectarianism! We all need to hold together else the revolution will be destroyed.
 SOV_lessing_production_standards: "Снизить стандарты производства" # Reduce Production Standards
 SOV_lessing_production_standards_desc: "Важно количество, а не качество!" # The amount not the quality is important!
 SOV_mobilization: "Подготовка к массовой мобилизации" # Prepare for Mass Mobilization
 SOV_mobilization_desc: "Нам нужно мобилизовать экономику, чтобы иметь шанс против империалистов!" # We need to mobilize the economy in order to have a chance against the imperialists!
 SOV_relocate_industry_from_moscow: "Перенос промышленности из Москвы" # Relocating Industry from Moscow
 SOV_relocate_industry_from_leningrad: "Перенос промышленности из Москвы" # Relocating Industry from Moscow
 SOV_fortifying_moscow: "Укрепление Москвы" # Fortifying Moscow
 SOV_fortifying_moscow_desc: "Мы не отдадим им Москву!" # We will not let them have Moscow!
 SOV_no_time_for_luxus: "Нет времени на роскошь!" # No Time for Luxuries!
 SOV_no_time_for_luxus_desc: "Нам нужно сосредоточиться на военном производстве!" # We need to focus on the military production!
  
 SOV_industry_decision: "Экономика" # Economy
 SOV_industry_decision_desc: "Наша страна все еще не полностью индустриализирована, и лишь несколько крупных городов могут сравниться с западными городами. Если мы хотим затмить империалистов, нам необходимо индустриализировать и модернизировать нашу страну!" # Our nation still is not fully industrialized with only a few big cities being on par with the ones in the west. If we want to eclipse the imperialists we will need to industiralize and modernize our nation!
 SOV_breakneck_industrialization: "Форсированная индустриализация" # Breakneck Industrialization
 SOV_Five_Year_mission: "Пятилетний план" # Five-Year Plan
 SOV_Five_Year_mission_desc: "Нет такой крепости, которую большевики не смогли бы взять штурмом!" # There is no fortress which the Bolsheviks cannot storm!
 SOV_further_industrialization: "Углубление индустриализации" # Furthering Industrialization
 SOV_building_moscow_metro: "Строительство Московского метро" # Building the Moscow Metro
 SOV_helping_collectivized_farms: "Помощь коллективизированным хозяйствам" # Helping Collectivized Farms
 SOV_creating_the_MTS: "Создание МТС" # Creating the MTS
 SOV_support_consumer_good_industry: "Поддержка индустрии потребительских товаров" # Supporting Consumer Good Industry
  
 SOV_foreign_decision: "Внешняя политика" # Foreign Policy
 SOV_foreign_decision_desc: "По мере роста угрозы капитализма стало очевидно, что судьба нашей нации и социализма в целом находится под угрозой. Очевидно, что для обеспечения нашей безопасности в эти опасные времена нам необходимо расширить наше влияние на соседние страны с целью получения ресурсов, создания буферных государств и расширения Революции." # As the threat of capitalism grows it has become apparent that the fate of our nation and socialism as a whole is at risk. To secure our safety in these dangerous times it is clear we need to expand our influence into neighboring countries for the purpose of gaining resources, creating buffer states and expanding the Revolution.
 SOV_supporting_spain: "Поддержка социалистов в Испании" # Supporting Socialists in Spain
 SOV_Germany: "Война с гуннами" # Fighting the Huns
 SOV_Germany_desc: "Эти проклятые немецкие валькисты увидят, как настоящий Совет обращается с варварами." # Those damned German Valkists will see how a true Soviet deals with barbarians.
 SOV_invade_afghanistan: "Покорить Афганистан" # Conquer Afghanistan
 SOV_invade_persia: "Распространенить социализм в Иране" # Spread Socialism to Iran
 SOV_invade_iraq: "Освободить Ирак" # Liberate Iraq
 SOV_invade_poland: "Открыть окно в Европу" # Opening the Gates to Europe
 #SOV_invade_finland: "Спрос на приграничные регионы Финляндии" # Demand Finnish Border Regions
 #SOV_invade_finland_desc: "Во время Гражданской войны в России белофинские войска оккупировали регион Приладожья Карелии и Карельский перешеек. Эти районы находятся всего в нескольких милях от нашей балтийской метрополии Ленинграда, нашего основного выхода к Мировому океану. Чтобы обеспечить доступ военно-морского флота к Балтике, мы должны создать более прочный буфер между нами и Финляндией." # During the Russian Civil War, White Finnish forces had occupied the region of Ladoga Karelia and the Karelian Isthmus. These areas are only a few miles away from our Baltic Metropolis of Leningrad, our main access to the world's oceans. To secure our naval access to the Baltic we must create a stronger buffer between us and Finland.
 SOV_invade_ukraine: "Социализм на Украине" # Socialism in the Ukraine
 SOV_invade_ukraine_desc: "Во время Гражданской войны в России Украинская Народная Республика при поддержке Антанты смогла добиться своего суверенитета и сокрушить свои социалистические фракции, но волю рабочих невозможно сломить. Социализм на Украине!" # During the Russian Civil War, the Ukrainian People's Republic with the support of the Entente was able to attain its sovereignty and crush its socialist factions but the will of the workers can never be vanquished. Socialism in the Ukraine!
 SOV_unfication_of_the_eastern_slavic_proletariat: "Объединение восточнославянского пролетариата" # Unification of the Eastern Slavic Proletariat
 SOV_unfication_of_the_eastern_slavic_proletariat_tt: "§CСделает все восточнославянские регионы национальными§!" # §CGains a core on every Eastern Slavic state§!
  
 SOV_invade_belarus: "Вторгнуться в Беларусь" # Invade Belarus
 SOV_spread_the_revolution_to_latvia: "Защитить латвийских социалистов" # Safeguard Latvian Socialists
 SOV_spread_the_revolution_to_latvia_desc: "Балтийский регион когда-то был неотъемлемой частью старой Российской империи. Как наследники этой империи, мы можем претендовать на различные государства, которые были поддержаны западными державами, и реинтегрировать их в наш союз, которому они действительно принадлежат." # The Baltic region was once an integral part of the old Russian Empire. As the heirs to this empire, we can lay claim to the various states which have been propped up by the Western powers and re-integrate them into our union where they truly belong.
 SOV_spread_the_revolution_to_estonia: "Защитить эстонских социалистов" # Safeguard Estonian Socialists
 SOV_spread_the_revolution_to_estonia_desc: "Балтийский регион когда-то был неотъемлемой частью старой Российской империи. Как наследники этой империи, мы можем претендовать на различные государства, которые были поддержаны западными державами, и реинтегрировать их в наш союз, которому они действительно принадлежат." # The Baltic region was once an integral part of the old Russian Empire. As the heirs to this empire, we can lay claim to the various states which have been propped up by the Western powers and re-integrate them into our union where they truly belong.
 SOV_dissolve_the_forest_brothers: "Распустить Лесных Братьев" # Dissolve the Forest Brothers
 SOV_dissolve_the_forest_brothers_tt: "§CСделает все прибалтийские регионы национальными§!" # §CGains a core on every Baltic state§!
 SOV_the_central_asian_war: "§CЦентральноазиатская§! война" # The §CCentral Asian§! War
 SOV_the_central_asian_war_desc: "С тех пор, как два десятилетия назад закончилась Гражданская война, в Центральной Азии правили авторитарные и отсталые режимы. Люди живут в абсолютной собственности, подчиняясь абсолютному правлению своего диктатора. Пришло время показать этому сельскому региону плоды социализма." # Ever since the Civil War ended 2 decades ago Central Asia has been ruled by authoritarian and backwards regimes. People live in absolute property while subjected to the absolute rule of their dictator. It is time we show this rural region the fruits of Socialism.
 SOV_invade_the_whites: "Уничтожить русских реакционеров" # Conquer The Russian Reactionaries
 SOV_invade_the_whites_desc: "После окончания Гражданской войны в России многие побежденные белые бежали в «русскую» республику в Чите. Это государство является лишь свидетельством реакционного стремления поработить рабочий класс. Чтобы окончательно укрепить наш суверенитет и обеспечить себе доступ к Тихому океану, мы должны уничтожить остатки белых." # Upon the Conclusion of the Russian Civil War many of the defeated Whites fled to the 'Russian' republic in Chita. This state only stands as a testament to the reactionary commitment to subjugate the working class. To finally cement our sovereignty and secure our access to the Pacific we must destroy the remnants of the Whites.
 SOV_invade_mongolia: "Революция в Монголии" # Revolution in Mongolia
 SOV_invade_mongolia_desc: "Монголия изолирована от мира. Не было бы никакой борьбы принести свет Революции в их страну. Это также расширило бы наше влияние на Китай." # Mongolia is isolated from the world. It would be no struggle to bring the light of the Revolution to their country. This would also expand our influence into China.
 SOV_crush_the_mountain_republic: "Присоединить Горскую Республику" # Absorb The Mountain Republic
 SOV_crush_the_mountain_republic_desc: "Чтобы начать нашу кампанию на Кавказе, крайне важно установить свое присутствие и влияние в Горской республике Северного Кавказа." # To begin our campaign in the Caucasus it is paramount that we establish our presence and influence in the Mountain Republic of the Northern Caucasus.
 SOV_pacify_the_caucasus: "Умиротворить Кавказ" # Pacify the Caucasus
 SOV_pacify_the_caucasus_tt: "§CСделает все кавказские регионы национальными§!" # §CGains a core on every owned Caucasian state§!
 SOV_invade_georgia: "Плацдарм в Грузии" # A Foothold in Georgia
 SOV_invade_georgia_desc: "Грузия, сердце Кавказа, является ключевым местом реализации наших амбиций на Ближнем Востоке. Мы должны сделать эту маленькую страну стратегическим трамплином." # Georgia, the heart of the Caucasus, is a key location for our ambitions in the middle east. We must secure this small nation as a strategic stepping stone.
 #SOV_invade_azerbaijan: "Безопасность азербайджанской нефти" # Securing Azerbaijani Oil
 #SOV_invade_azerbaijan_desc: "Нефть является ключевым источником топлива любого современного государства. На нем работают все современные военные машины, и по мере роста напряженности в Европе мы будем еще более отчаянно нуждаться в этом ресурсе. Чтобы обеспечить наше будущее, мы должны получить контроль над Бакинскими нефтяными месторождениями." # Oil is the key fuel source of any modern state. All modern machines of war run on it and as tensions grow in Europe we will be in even more desperate need of this resource. To secure our future we must gain control of the Baku Oil fields
 SOV_invade_armenia: "Подчинение Армении" # Subjugating Armenia
 SOV_invade_armenia_desc: "Когда-то Армения была самой южной точкой бывшей Российской империи. Теперь эта нация является препятствием на пути наших ближневосточных амбиций." # At one point Armenia was the southern most point of the former Russian Empire. Now the nation is a roadblock in the way of our Middle Eastern ambitions.
 SOV_invade_romania: "Восстановить порядок в Бессарабии" # Restore Order Bessarabia
 SOV_invade_manchuria: "Установить социализм в Маньчжурии" # Ensure a Socialist Government in Manchuria
 SOV_invade_japan: "Покорить восходящее солнце" # Conquer the Rising Sun
  
