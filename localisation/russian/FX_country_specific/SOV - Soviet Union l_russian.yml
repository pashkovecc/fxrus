 SOV_the_international: "Лидер Интернационала" # Leading the International
 SOV_the_international_desc: "Интернационал является основой мировой революции и высшим социалистическим проектом для всего мира. Как ведущая нация в деле социализма, наш долг — больше, чем возглавить социалистический фронт против империализма и капитализма. В этом мире не может быть мира, если рабочие не будут свободны." # The International is the backbone of the world revolution and the ultimate socialist project for the world. As the leading nation of the socialist cause, it is more than our duty to lead the socialist front against imperialism and capitalism. In this world, there is no peace unless the workers are free.
  
 SOV_exercise_of_soviet_strength: "Демонстрация советской силы" # Exercise of Soviet Strength
 SOV_exercise_of_soviet_strength_desc: "Наш народ почувствовал боль империалистической войны во время Великой войны, но теперь мы освобождены от цепей, и рабочие создали новое правительство на пепелище царизма. Теперь мы сильнее и должны продемонстрировать миру силу Советского Союза, показав, что ни одна нация не может бросить нам вызов." # Our nation felt the pain of an imperialist war during the Great War, but now we are unchained, and the workers created a new government on the ashes of the Tsardom. Now we are stronger and must demonstrate to the world the strength of the Soviet Union, showing that no nation can challenge us.
  
 SOV_break_revolution_from_isolation: "Прорвать изоляцию революции" # Break Revolution from Isolation
 SOV_break_revolution_from_isolation_desc: "Революция долгое время стояла только на советских границах, но нынешняя ситуация в мире показывает, что рабочие иностранных государств готовы восстать, и от нас, как от ведущей нации, ожидают помощи им. Революция распространится с севера на юг, с востока на запад, и путеводной звездой ее будем мы." # The revolution, for a long time, stood on Soviet borders only, but the current situation of the world shows that the workers of foreign nations are ready to rise up, and as the leading nation, it is expected of us to help them. The revolution shall spread from north to south, from east to west, and the guiding light of it shall be us.
  
 SOV_escalate_intervention_in_spain: "Эскалация интервенции в Испании" # Escalate Intervention in Spain
 SOV_escalate_intervention_in_spain_desc: "Испания в настоящее время сталкивается с кровавой гражданской войной, когда-то братьями, а теперь врагами. Однако борются и рабочие Испании. Они продемонстрировали самый смелый акт сопротивления — восстали против угнетателей рабочих в одиночку. Этот акт героизма не будет напрасным; мы вмешаемся, и они смогут не только победить, но и очистить тех, кто их эксплуатирует." # Spain is currently facing a bloody civil war, once brothers and now enemies. However, the workers of Spain are also fighting. They demonstrated the bravest act of resistance - they rose against the workers' oppressors alone. This act of heroism will not be in vain; we shall intervene, and they can not only win but also purge those who exploit them.
  
 SOV_a_great_campaign_westwards: "Великая кампания на запад" # A Great Campaign Westwards
 SOV_a_great_campaign_westwards_desc: "К западу от Москвы, к западу от нашей страны... там лежит внешний враг, который стремится нас уничтожить. Но мы отказались сдаться и теперь готовы идти на запад, чтобы сокрушить тех, кто когда-то пытался нас уничтожить." # To the west of Moscow, to the west of our nation... there it lies the foreign enemy that seeks to destroys us. But we refused to crumble, and now we are ready to march westwards, to crush those who once tried to destroy us.
  
 SOV_oppose_imperialist_aggression_of_japan: "Выступить против японского империализма" # Oppose Japanese Imperialism
 SOV_oppose_imperialist_aggression_of_japan_desc: "На Дальнем Востоке японцы продолжают терроризировать Восточную Азию своими жестокими и эксплуататорскими методами, одновременно поддерживая реакционное белое правительство во Владивостоке. Их империалистическим планам необходимо противостоять, и только мы можем добиться освобождения Восточной Азии!" # In the Far East, the Japanese continue to terrorize East Asia with their brutish and exploitative ways while simultaenously supporting the reactionary White government in Vladivostok. Their imperialist plans must be opposed, and only we are able to bring about the liberation of East Asia!
  
 SOV_pacification_of_frontiers: "Умиротворение границ" # Pacification of Frontiers
 SOV_pacification_of_frontiers_desc: "Безопасность в Центральной Азии обеспечена, и феодальным порядкам, когда-то царившим в регионе, пришёл конец. Однако здесь всё ещё остаётся немало оплотов реакционных полевых командиров, которые стремятся к контрреволюции и лицемерно заявляют об «освобождении» народов Центральной Азии. Новые усилия по умиротворению этого региона позволят прибрать богатства Центральной Азии к нашим рукам и поспособствуют распространению социализма." 
  
 SOV_pressure_on_the_caucasus: "Давление на Кавказ" # Pressure on the Caucasus
 SOV_pressure_on_the_caucasus_desc: "Кавказ является чрезвычайно ценным регионом благодаря своему стратегическому положению и обильным нефтяным богатствам, особенно в Азербайджане. Чтобы Советское государство было безопасным и чтобы социализм развивался, наш долг - обеспечить, чтобы правительства Кавказа были вынуждены отказаться от своих реакционных путей и увидеть социалистический свет - чтобы они не были уничтожены." # The Caucasus are an immensely valuable region for their strategic position and their bountiful oil wealth, particularly in Azerbaijan. For the Soviet state to be secure and for socialism to advance, it is our duty to ensure that the governments of the Caucasus are forced to renounce their reactionary ways and see the socialist light - lest they be destroyed.
  
 SOV_export_revolutionary_ideas_south: "Пропаганда революции на юге" # Export Revolutionary Ideas South
 SOV_export_revolutionary_ideas_south_desc: "Ближний Восток остается полностью отсталым и феодальным регионом, в котором доминируют мелкие вожди и военачальники, которые сокрушают всех, кто им противостоит, и оставляют пролетариат на нашем юге в позорном и варварском состоянии. Наш моральный долг — освободить их, а также защитить огромные нефтяные богатства региона от западных империалистов." # The Middle East remains a totally backwards and feudal region, dominated by petty chieftans and warlords that crush all who oppose them and leave the proletariat to our south in a disgraceful and barbaric condition. It is our moral duty to liberate them, as well as to secure the immense oil wealth of the area from the Western imperialists.
  
 SOV_strive_for_strategic_security: "Курс на стратегическую безопасность" # Strive for Strategic Security
 SOV_strive_for_strategic_security_desc: "Многие могут назвать это нечестивым союзом, но у нас с немцами гораздо больше общих интересов, чем у морализирующей и двуличной Антанты. Взаимное признание и открытие отношений между нашими правительствами будут в наших интересах и помогут обезопасить нас от западной агрессии до тех пор, пока мы не будем к этому готовы." # Many may call it an unholy alliance, but we and the Germans share far more interests in common than the moralizing and duplicitous Entente. Mutual recognition and the opening of relations between our governments will be to our advantage, and will help to secure us from Western aggression until we are ready.
  
 SOV_pursue_western_recognition: "Добиться признания Запада" # Pursue Western Recognition
 SOV_pursue_western_recognition_desc: "Запад может быть презренным и двуликим, но он гораздо меньшее зло по сравнению с варварскими немцами. Наша взаимная заинтересованность в сдерживании тевтонского зверя, прежде чем он сможет распространить свой реакционный террор по всей Европе, имеет огромное значение, и поэтому мы должны попытаться апеллировать к их признанию." # The West may be despicable and two-faced, but they are by far the lesser evil as compared to the barbaric Germans. Our mutual interest in keeping the Teuton beast down before it can spread its reactionary terror throughout Europe is of integral importance, and thus we should endeavour to appeal for their recognition.
  
 SOV_notes_on_modern_warfare: "Заметки о современной войне" # Notes on Modern Warfare
 SOV_notes_on_modern_warfare_desc: "Мы участвовали в гражданской войне в Испании и извлекли из нее ценные уроки. Столкнувшись с валькистами и их реакционными головорезами, наши военные должны помнить об уроках этой войны, чтобы мы могли подготовиться к следующей войне и быть готовыми к ней." # We have fought in the Spanish Civil War, and in it we have learnt valuable lessons. Facing off against the Valkists and their reactionary thugs, our military ought to keep the lessons of this war in mind so that we may prepare for the next war and be ready for it.
  
 SOV_support_iberian_socialist_project: "Поддержать Иберийский Социалистический проект" # Support the Iberian Socialist Project
 SOV_support_iberian_socialist_project_desc: "Наш долг перед международным пролетариатом — поддерживать все стремящиеся к социализму государства, что становится еще более актуальным в наши дни, когда валькизм и другие реакционные тенденции начинают расти. Мы должны поддержать социалистов Иберии в борьбе с реакцией!" # It is our duty to the international proletariat to support all aspiring socialist states, which is even more pressing in the modern day where Valkism and other reactionary tendencies are beginning to surge. We must support the socialists of Iberia in the fight against reaction!
  
 SOV_evacuate_spanish_gold_reserves: "Эвакуация золотых резервов Испании" # Evacuate Spanish Gold Reserves
 SOV_evacuate_spanish_gold_reserves_desc: "Дело испанцев выглядит мрачным, и мало что можно сделать, чтобы их спасти. Поэтому нам следует сделать неудачный, но необходимый шаг, чтобы заполучить золото, за которое отважные мученики Испании отдали свои жизни, для мировой революции и освобождения человечества в целом." # The Spanish cause is looking grim, and little more can be done to rescue them. We should thus take the unfortunate but necessary step to secure the gold that Spain's brave martyrs have given their lives to secure for the world revolution and for the liberation of mankind as a whole.
  
 SOV_secure_finland: "Захватить Финляндию" # Захватить Финляндию
 SOV_secure_finland_desc: "Финляндия расположена в опасной близости от Ленинграда, колыбели революции и ключевого промышленного и стратегического региона. Чтобы защитить его от потенциально реакционных элементов, белое правительство, заседающее в Хельсинки, должно быть свергнуто или, по крайней мере, поставлено на колени." # Finland sits dangerously close to Leningrad, cradle of the revolution and a key industrial and strategic area. To secure it from potentially reactionary elements, the White government that sits in Helsinki must be overthrown, or at least made to kneel.
  
 SOV_infiltrate_nordic_social_democracies: "Инфильтрация северных демократий" # Infiltrate Nordic Democracies
 SOV_infiltrate_nordic_social_democracies_desc: "В странах Северной Европы существует действующая, хотя и несколько буржуазная система либеральной демократии. Эта система потенциально является благодатной почвой для укоренения революционного социализма, в отличие от реформистской буржуазной тенденции социал-демократии. Давайте сделаем все возможное, чтобы эти правительства работали в наших интересах!" # The Nordic states have a functioning, if somewhat bourgeois system of liberal democracy. This system is potentially fertile ground for revolutionary socialism to take root, as opposed to the reformist bourgeois tendency of social democracy. Let us do everything we can to ensure that these governments work in our interest!
  
 SOV_coopt_ukrainian_socialism: "Подчинить украинский социализм" # Co-opt Ukrainian Socialism
 SOV_coopt_ukrainian_socialism_desc: "Красная Украина — это не только наш долг перед ранее угнетенным украинским народом, но и практическая необходимость, если мы хотим построить социалистическую мощь. Многие социалисты в Украине остаются подавленными, и включение их движения в общий коммунистический мировой порядок – это путь вперед!" # A red Ukraine is not only a duty that we owe to the formerly oppressed Ukrainian people, but is a practical necessity if we are to build socialist might. Many socialists in Ukraine remain suppressed, and bringing their movement into the overall communist world order is the way forward!
  
 SOV_bolster_belarussian_underground: "Укрепить белорусское подполье" # Bolster Belarusian Underground
 SOV_bolster_belarussian_underground_desc: "Беларусь по-прежнему раздавлена ​​реакционным террористическим режимом, поддерживаемым Берлином, и наши белорусские братья ждут своего освобождения. А пока давайте позаботимся о том, чтобы капиталистическая клика в Минске была разрушена и чтобы храбрые борцы, сопротивляющиеся ей, получили всю необходимую поддержку." # Belarus remains crushed under a reactionary terror regime backed by Berlin, and our Belarusian brothers await their liberation. In the mean time, let us ensure that the capitalist clique in Minsk is disrupted and that the brave fighters resisting them are given all the support they need.
  
 SOV_claims_on_the_baltics: "Претензии на Прибалтику" # Claims on the Baltics
 SOV_claims_on_the_baltics_desc: "Прибалтика является жизненно важной частью старой Российской империи, которую мы, как их наследники в государственной форме, обязаны обеспечить себе. В любом случае, многие рабочие в странах Балтии по-прежнему раздавлены реакционными режимами, поддерживаемыми Западом; режимы, которые мы больше не будем терпеть и, наконец, свергнем!" # The Baltics are a vital part of the old Russian Empire, which we as their heir in state form have a duty to secure for ourselves. In any event, the many workers in the Baltics remain crushed underfoot by the reactionary regimes propped up by the West; regimes we shall tolerate no longer and finally put down!
  
 SOV_improve_siberian_front_logistics: "Улучшить логистику Сибирского фронта" # Improve Siberian Front Logistics
 SOV_improve_siberian_front_logistics_desc: "Сибирь — холодное и холодное место, и, к сожалению, здесь расположено множество аванпостов Белых. Чтобы сокрушить белый режим, продолжающий борьбу за угнетение русского народа и за победу капитала, мы должны сделать Сибирь гостеприимной для наших войск для окончательного прекращения гражданской войны." # Siberia is a cold and frigid place, and one that is unfortunately home to many White outposts. To crush the White regime that continues to fight for the oppression of the Russian people and for the victory of capital, we must make Siberia hospitable for our troops for the final end to the civil war.
  
 SOV_eastern_section_of_the_international: "Восточная секция Интернационала" # Eastern Section of the International
 SOV_eastern_section_of_the_international_desc: "Восточная Азия является в настоящее время одной из наиболее плодородных почв для социалистической революции. Однако построить здесь социалистическое государство без иностранной помощи — значит вызвать реакционную контрреволюцию, и поэтому наша обязанность — организовать народы Азии в Интернационал для продвижения социалистического будущего." # East Asia is as of now one of the more fertile grounds for socialist revolution. To build a socialist state here without foreign aid however is to court a reactionary counter-revolution, and thus it is our responsibility to organize the peoples of Asia in the International to forward the socialist future.
  
 SOV_project_power_over_mongolia: "Проект «Власть над Монголией»" # Project Power over Mongolia
 SOV_project_power_over_mongolia_desc: "Монголия занимает жизненно важное место, которое находится тревожно близко к Транссибирской магистрали, нашему жизненному пути в Азию. Позволить им оставаться вне нашей сферы влияния — это не только оставить забитых монголов на произвол судьбы, но и привлечь к себе потенциального врага, который нарушит нашу линию снабжения в Азию." # Mongolia holds a vital spot that is disturbingly close to the Trans-Siberian railway, our lifeline into Asia. To let them remain outside our sphere of influence is not only to leave the downtrodden Mongolians to their fate, but to invite a potential enemy breaking our supply line into Asia.
  
 SOV_demand_to_cede_azeri_sovereignty: "Потребовать вхождения Азербайджана" # Demand to Cede Azeri Sovereignty
 SOV_demand_to_cede_azeri_sovereignty_desc: "Азербайджанцы долгое время стояли на пути развития социализма, и сегодня наглость азербайджанского правительства стала более нетерпимой, чем когда-либо. Давайте позаботимся о том, чтобы реакционные остатки немецкого империализма Великой войны были искоренены раз и навсегда и чтобы союз укрепился." # The Azeris have long stood in the way of the advance of socialism, and today the insolence of the Azeri government has become more intolerable than ever. Let us see to it that the reactionary vestige of German imperialism from the Great War be cut once and for all and for the union to be strengthened.
  
 SOV_instigate_revolution_in_georgia: "Спровоцировать революцию в Грузии" # Instigate Revolution in Georgia
 SOV_instigate_revolution_in_georgia_desc: "Грузия продолжает стоять на пути нашего продвижения на юг и, в частности, прикрывает реакционный буржуазный армянский режим. Сокрушив их, дорога на юг откроется, и красное знамя принесет освобождение другим людям." # Georgia continues to stand in the way of our advance southwards, and particularly they shield the reactionary bourgeois Armenian regime. By crushing them, the road southwards is open and the red banner shall bring liberation to further people.
  
 SOV_support_progressives_in_afghanistan: "Поддержка афганских прогрессистов" # Support Progressives in Afghanistan
 SOV_support_progressives_in_afghanistan_desc: "Афганистан – отсталое и феодальное государство, но это не обязательно должно оставаться в силе. Хотя ортодоксальный ленинизм, возможно, не очень жизнеспособен там, прогрессивные элементы, которые стремятся продвигать интересы как пролетариата, так и буржуазии в борьбе с варварством, оказались восприимчивыми к нашим интересам." # Afghanistan is a backwards and feudal state, but this need not stand. While orthodox Leninism may not be terribly viable there, progressive elements that seek to advance the interests of the proletariat and the bourgeois alike against barbarism have proven amenable to our interests.
  
 SOV_one_struggle_against_imperialism: "Единая борьба с империализмом" # One Struggle Against Imperialism
 SOV_one_struggle_against_imperialism_desc: "Империалисты, которые продолжают населять мир, являются проклятием человечества, с этим могут согласиться и жители Ленинграда, и Багдада. Сделав один великий революционный шаг, давайте объявим миру, что продолжение империализма больше неприемлемо!" # The imperialists that continue to inhabit the world are the bane of humanity, this is something people from Leningrad and Baghdad alike can agree on. In one great revolutionary move, let us announce to the world that the continuation of imperialism is acceptable no longer!
  
 SOV_a_friendship_treaty_with_the_reich: "Договор о дружбе с Рейхом" # A Friendship Treaty with the Reich
 SOV_a_friendship_treaty_with_the_reich_desc: "Кто сказал, что берлинский режим не может быть податливым? Мы и немцы можем сильно расходиться в идеологическом плане, но у нас практически одни и те же интересы. Договор о дружбе с немцами поможет обезопасить себя от будущей межкапиталистической войны и даст нам время и опыт, которые позволят нам процветать!" # Who says that the Berlin regime cannot be amenable? We and the Germans may disagree in ideological terms in the strongest of terms, but we share practically the same interests. A friendship treaty with the Germans will help to secure ourselves from the inter-capitalist war to come, and give us time and expertise that will allow us to thrive!
  
 SOV_seek_an_agreement_with_the_entente: "Стремиться к договору с Антантой" # Seek an Agreement with the Entente
 SOV_seek_an_agreement_with_the_entente_desc: "Антанта, империалистический, капиталистический блок, так долго стремившийся нас раздавить; их презрение было более чем очевидным. Однако нынешняя ситуация требует неудачного соглашения между рабочими и их угнетателями." # The Entente, an imperialistic, capitalistic bloc that for so long sought to crush us; their contempt was more than evident. However, the current situation demands an unfortunate agreement between the workers and their oppressors.
  
 #SOV_invite_nordic_social_democracies: "Пригласите социал-демократии Северных стран" # Invite Nordic Social Democracies
 #SOV_invite_nordic_social_democracies_desc: ""
  
 SOV_absorb_belarus_into_the_union: "Поглотить Беларусь" # Absorb Belarus into the Union
 SOV_absorb_belarus_into_the_union_desc: "Пролетариат Белоруссии призывает нас, своих славянских братьев, освободить их от ига реакционной берлинской клики. Что бы ни говорили гунны, мы не отступим от этой цели: освобождение Беларуси и открытие Европы для социалистической революции имеют первостепенное значение!" # The proletariat of Belarus are calling for us, their Slavic brothers, to liberate them from the yoke of the reactionary Berlin-backed clique. No matter what the Huns have to say, we will not falter from this objective, the liberation of Belarus and the opening of Europe to the socialist revolution is paramount!
  
 SOV_death_or_dishonor: "Смерть или бесчестие" # Death or Dishonor
 SOV_death_or_dishonor_desc: "Лучше умереть, чем сдаться. Жить в стыде. Те, кто дрожит на поле боя, не заслужат ничего, кроме презрения со стороны своих товарищей. Мы боремся за нечто большее, чем просто империалистическую войну, мы боремся за освобождение рабочих, и мы не отступим – даже если это означает, что мы лишим жизни миллионов людей." # It is better to die than to surrender. To live in shame. Those who shake in the battlefield shall earn nothing but comtempt from their comrades. We are fighting for more than a simple imperialistic war, we are fighting for the liberation of the workers, and we shall not back down - even if it means that we cease the lives of millions.
  
 SOV_invest_in_far_eastern_industries: "Инвестиции в Дальний Восток" # Invest in Far Eastern Industries
 SOV_invest_in_far_eastern_industries_desc: "Дальний Восток остается слаборазвитым регионом, хотя на самом деле он имеет большой потенциал стать жизненно важной и надежной частью революционного арсенала и строительства социализма. Давайте приложим большие усилия для развития этого региона, что, в свою очередь, проложит путь к нашему повороту в сторону Азии." # The Far East remains a poorly developed region, when in reality it has great potential to be a vital and secure part of the revolution's arsenal and for the construction of socialism. Let us invest great effort into building this region up, in turn paving the way for our pivot towards Asia.
  
 SOV_finnish_off_the_white_army: "Добить Белую Армию" # Finish off the White Army
 SOV_finnish_off_the_white_army_desc: "Время пришло: белые реакционеры, продолжающие строить заговоры во Владивостоке, слишком долго находились в безопасности. Один быстрый и разрушительный удар будет всем, что нужно, чтобы раз и навсегда разгромить последние реакционные клики 1919 и 1920 годов в России и привести Россию в новую эпоху." # The time has come, the White reactionaries that continue to plot in Vladivostok have been safe for far too long. One swift and devestating strike will be all that is needed to once and for all smite the final reactionary cliques of 1919 and 1920 from Russia and to bring Russia into a new age.
  
 SOV_a_soviet_regime_in_manchuria: "Советский режим в Маньчжурии" # A Soviet Regime in Manchuria
 SOV_a_soviet_regime_in_manchuria_desc: "Вперёд в Маньчжурию! Нынешний националистический режим на Юге оказался слишком коррумпированным и неэффективным, чтобы его можно было спасти, и поэтому теперь наша задача — позаботиться о том, чтобы в Китае было установлено надлежащее социалистическое правительство для освобождения китайского народа." # Onwards to Manchuria! The current Nationalist regime in the South have proven to be too corrupt and ineffective to be saved and thus it is now up to us to see to it that a proper socialist government is established in China for the liberation of the Chinese people.
 SOV_manchu_policy: "§YМы поддерживаем создание §!§rМаньчжурской Советской Республики§!" # §YWe are suppoting the Establishment of an §rManchurian Soviet Republic§!§!
  
 SOV_support_left_kumointang: "Поддержка левого Гоминьдана" # Support Left Kuomintang
 SOV_support_left_kumointang_desc: "Полевые командиры Китая являются главными виновниками нынешнего плачевного состояния Китая, и они должны уйти! Никакая социалистическая революция невозможна без поддержки прогрессивных сил в Китае в их борьбе с бандитизмом и японским империализмом, и только националисты ведут хорошую борьбу; им надо помочь!" # The warlords of China are the main culprits responsible for the current sorry state of China, and they must go! No socialist revolution is possible unless progressive forces in China are supported in their fight against banditry and Japanese imperialism, and only the Nationalists are the ones fighting the good fight; they must be helped!
 SOV_kmt_policy: "§YМы поддерживаем §!§CГоминьдан§! §Yв Южном Китае§!" # §YWe are supporting the §CKuomintang§! in Southern China§!
 SOV_support_left_kumointang_tt: "§SЕсли смогут, то Гоминьдан точно выполнит фокус §Y$KMT_cooperate_with_the_socialists$§!.§!" # §SIf they are able to, the Kuomintang will be guaranteed to take the focus §Y$KMT_cooperate_with_the_socialists$§!.§!
  
 SOV_propose_partition_of_armenia: "Предложить раздел Армении" # Propose Partition of Armenia
 SOV_propose_partition_of_armenia_desc: "Турки оказались в числе крупнейших проигравших в Великой войне, и это плачевное государство сделало их уязвимыми для империализма и буржуазной эксплуатации. Давайте вместе с ними предложим раздел Армении, чтобы уничтожить это упадочное и искусственное создание Версальского капиталистического порядка и открыть путь на Ближний Восток." # The Turks were among the biggest losers of the Great War, and this sorry state has left them vulnerable to imperialism and bourgeois exploitation. Let us propose a partition of Armenia with them, both to wipe out this decadent and artificial creation of the Versailles capitalist order and to open the way to the Middle East.
  
 SOV_acquire_german_technologies: "Приобрести немецкие технологии" # Acquire German Technologies
 SOV_acquire_german_technologies_desc: "Немецкая технология имеет веские основания для широкой похвалы, поскольку она занимает первое место среди аналогичных технологий во всем мире. Благодаря нашим новым отношениям с ними, давайте воспользуемся этим соглашением, чтобы продвинуть строительство социализма и защитить профсоюз от технологического отставания." # German technology has good reason to be widely praised, for it stands as first rate among peer technologies across the world. With our new relationship with them, let us benefit from this arrangement so as to advance the construction of socialism and to secure the union from being outpaced technologically.
  
 SOV_negotiate_spheres_of_influence_in_the_east: "Сделка с дьяволом" # A Deal with the Devil
 SOV_negotiate_spheres_of_influence_in_the_east_desc: "Кто-то скажет, что наше сотрудничество с гуннами зашло уже слишком далеко, но стратегические реалии вынудили нас сделать это. Учитывая, что немцы, по-видимому, готовы сотрудничать с нами и дальше, а также угрозу формирования блока Антанты в Восточной Европе, давайте работать с Берлином, чтобы четко разделить, где лежат наши интересы и где мы хотели бы нейтралитета других сторон." # Some would say that our cooperation with the Hun as already gone too far, but strategic realities have forced our hand. With the Germans seemingly willing to cooperate with us further and the threat of an Entente bloc forming in Eastern Europe, let us work with Berlin to clearly divide where our interests lie and where we would desire the neutrality of other parties.
 SOV_negotiate_spheres_of_influence_in_the_east_tt: "§CМы обсудим сферы влияния с государством§! §Y[GER.GetNameDef]§!" # §CWe will negotiate spheres of influence with §Y[GER.GetNameDef]§!§!
  
 SOV_invite_western_expertise: "Привлечение западных специалистов" # Invite Western Expertise
 SOV_invite_western_expertise_desc: "Запад входит в число самых развитых и богатых стран мира, так почему же мы должны лишать себя их опыта? Мы сделаем все возможное, чтобы извлечь выгоду из нашего предварительного сотрудничества, и это также будет относиться к получению и использованию опыта британских и французских промышленных и военных советников." # The West are among the most developed and wealthy nations in the world, so why should we cut ourselves off from their expertise? We shall do everything we can to benefit from our tentative cooperation, and this too will apply to gaining and utilizing the expertise of British and French industrial and military advisors.
  
 SOV_war_against_reactionary_tyrannies: "Война против реакционной тирании" # War Against Reactionary Tyrannies
 SOV_war_against_reactionary_tyrannies_desc: "Долой варварство! Новая Германия гораздо более зловещая и одиозная, чем любая другая реакционная клика, которая может попытаться сформироваться сегодня в мире. Провозглашая рабочим ложные пророчества и пытаясь усыпить их чувством подчинения, им и их злому союзу реакционных государств необходимо противостоять! Пусть все коммунистические партии поймут: враг — валькизм!" # Down with barbarism! The new Germany is far more sinister and odious than any other reactionary clique that may seek to form in the world today. Proclaiming false prophecies to the workers and attempting to lull them into a sense of submission, they and their wicked alliance of reactionary states must be opposed! Let all communist parties understand: the enemy is Valkism!
  
 #SOV_a_change_in_course: "Изменение курса" # A Change in Course
 #SOV_a_change_in_course_desc: ""
  
 SOV_bring_ukraine_back_to_the_fold: "Вернуть Украину в свои ряды" # Bring Ukraine Back to the Fold
 SOV_bring_ukraine_back_to_the_fold_desc: "Украина призывает к освобождению, и мы постараемся это сделать. Обладая богатыми полями и обильными природными ресурсами, Украина является ценной землей для социалистической революции, и поэтому мы вынуждены делать все возможное, чтобы принести революцию в Украину. Советский Союз, Премьер, Победа! Гойда!" # Ukraine is calling for liberation, and this we shall endeavour to do. With rich fields and plentiful natural resources, the Ukraine is a valuable land for the socialist revolution to take and thus we are further compelled to do everything we can to bring the revolution to Ukraine.
  
 SOV_overthrow_retrograde_order_in_japan: "Свергнуть ретроградный порядок в Японии" # Overthrow Retrograde Order in Japan
 SOV_overthrow_retrograde_order_in_japan_desc: "Пришло время свергнуть маленькое и деспотичное японское государство. Народы Азии не могут полагаться на поверхностные заявления Запада и некомпетентных бандитов, чтобы противостоять Японии, это может сделать только народная мощь! Пусть революция охватит Азию, и ее первым убитым врагом станет дряхлая японская военная клика!" # The time has come, for the puny and despotic Japanese state to be overthrown. The peoples of Asia cannot rely on perfunctory Western statements and incompetent bandits to resist Japan, only the people's might can! Let revolution sweep Asia and its first slain foe be the decrepit Japanese military-clique!
  
 SOV_intervention_in_chinese_civil_war: "Вмешаться в гражданскую войну в Китае" # Intervention in Chinese Civil War
 SOV_intervention_in_chinese_civil_war_desc: "Китайцы слишком долго страдают, а у нашего бенефициара в Китае дела идут довольно плохо. Чтобы продвигать дело социализма и освобождения международного пролетариата, давайте выйдем на китайскую арену, чтобы защитить наши интересы и интересы китайского пролетариата." # The Chinese have suffered for far too long, and our beneficiary in China is doing rather poorly. To advance the cause of socialism and of the liberation of the international proletariat, let us enter the Chinese arena to protect our interests and those of the Chinese proletariat.
  
 SOV_southern_thrust: "Южный рывок" # Южный рывок
 SOV_southern_thrust_desc: "Хватит ждать! Народы Ближнего Востока отчаянно ждут нашего освобождения, в то время как над ними правят безумные тираны и эксплуатируют их до последней капли и гроша. Мы также должны вызволить многочисленные ресурсы, захваченные этими западными лакеями, из империалистических лап капитализма и довести революцию до самого Персидского залива!" # Enough waiting around! The peoples of the Middle East desperately await our liberation, all while mad tyrants reign over them and exploit them to the last drop and penny. We must also secure the plentiful resources seized by these Western lackeys from the imperialist clutches of capitalism, and bring the revolution all the way to the Persian Gulf!
  
 SOV_liberation_of_the_european_proletariat: "Освобождение европейского пролетариата" # Освобождение европейского пролетариата
 SOV_liberation_of_the_european_proletariat_desc: "Глобальная война за социалистическое освобождение скоро надвигается, но сначала мы должны обезопасить Европу. Будучи самым промышленно развитым континентом, он наиболее благоприятен для утверждения социализма и готов выступать в качестве реакционной базы для антисоветских усилий. Даже если народы всего мира ненавидят наше движение вперед, революция неизбежна, поскольку никто не может остановить ход истории. Рабочие всего мира, объединяйтесь!" # The global war of socialist liberation is soon impending, but first we must secure Europe. As the most industrialized continent, it is the most fertile for socialism to take hold and it is the one poised to act as a reactionary base for the anti-Soviet effort. Even if nations the world over detest our march forward, the revolution is inevitable for one cannot stop the march of history. Workers of the world, unite!
 SOV_liberation_of_the_european_proletariat_tt: "§rДаст §Yцели войны§! против каждой крупной страны §CЕвропы§!§!" # §rGains a §YWargoal§! on every Major country in §CEurope§!§!
  
 SOV_demand_romanian_submission: "Требовать подчинения Румынии" # Demand Romanian Submission
 SOV_demand_romanian_submission_desc: "В Румынии сидит реакционное и совершенно отсталое правительство, которое, в свою очередь, получает поддержку от продолжающегося запугивания и угнетения пролетариата. Имея огромные нефтяные ресурсы, которые наши соперники, возможно, захотят заполучить, мы должны заставить правительство подчиниться новому, более справедливому порядку и обеспечить безопасность нефти от рук контрреволюционных государств." # In Romania sits a reactionary and totally backwards government, which in turn gains support from continued bullying and oppression of the proletariat. With vast oil resources that our rivals may want to secure, we should force the government to submit to a new, more just order and to ensure the oil remains secure from the hands of the counter-revolutionary states.
  
 SOV_second_attempt_to_break_into_europe: "Вторая попытка прорыва в Европу" # Second Attempt to Break into Europe
 SOV_second_attempt_to_break_into_europe_desc: "Все, что остается между нами и европейским народом, — это Польша, фальшивое и нефункциональное творение Версальского порядка. Хотя в 1920 году нам, возможно, и не удалось сокрушить их, на этот раз мы не потерпим неудачу. Скоро красная волна достигнет Берлина, Будапешта и Парижа!" # All that remains between us and the European people is Poland, a fake and dysfunctional creation of the Versailles order. While we may have failed in 1920 to crush them, we will not fail this time. Soon, the red tide shall reach Berlin, Budapest and Paris!
  
