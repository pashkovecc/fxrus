 SOV_strike_back_at_GER_desc: "Пришло время нашей мести. Родина продолжает истекать кровью под жестоким и варварским правлением немецких тиранов, которые теперь готовятся броситься еще дальше в безумном стремлении к завоеваниям. Настал величайший час русской нации – За Родину!" # The time has come for our revenge. The Motherland continues to bleed under the cruel and barbaric rule of the German tyrants, who now prepare to hurl themselves further beyond in a mad desire for conquest. The Russian nation's greatest hour now comes - Za Rodinu!
  
