 SOV_high_corruption_desc: ""
 SOV_infrastuctre: "Расширение инфраструктуры" # Infrastructre Expansion
 SOV_infrastuctre_desc: "Если мы хотим решить продовольственную ситуацию и, наконец, модернизировать нашу страну, нам необходимо радикально расширить нашу инфраструктуру. Возможно, это займет некоторое время, но результат, несомненно, того стоит." # If we want to solve the food situation and finally modernize our nation we will need to drastically expand our infrastructre. This may be prove to be taking some time but the results will be worth it surely.
 SOV_modernized_cities: "Современные города" # Modern Cities
 SOV_modernized_cities_desc: "Наконец, наиболее важные города сопоставимы с нашими западными коллегами, что резко расширяет наше промышленное производство." # Finally the most important cities are comparable to our western counterparts, drastically expanding our industrial output.
 SOV_helping_people: "Помощь людям" # Helping the People
 SOV_helping_people_desc: "Мы создали Народный кредит, чтобы помочь безработным встать на ноги, чтобы они могли трудоустроиться, когда индустриализация завершится." # We have created a People's Credit to help the unemployed get back on their feet, so they can hopefully get employed when the industrialization is finished
 SOV_modernized_equipment: "Модернизированное оборудование" # Modernized Equipment
 SOV_modernized_equipment_desc: "С началом индустриализации мы нашли работу для многих безработных, но для достижения наших целей нам требовалось современное оборудование. Поэтому мы решили инвестировать в новое современное оборудование, которое поможет нам повысить эффективность отрасли." # With our industrialization starting we have found a job for many of the unemployed but we needed the modern gear to fullfil our goals. So we decided to invest in new modern gear which will help us improve the performance of the industry.
 SOV_modern_economy: "Современная экономика" # Modern Economy
