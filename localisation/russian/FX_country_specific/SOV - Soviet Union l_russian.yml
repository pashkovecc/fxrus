 SOV_congress_over_tooltip: "§gЗавершив съезд, мы, наконец, смягчили сильный раскол между фракциями РКП.\nЭто достижение может быть разрушено, если премьер Ленин, предположим, умрёт, а этого же не может быть, да?§!" # §gWith the congress finished we finally have mitigated the extreme divide between the factions of the RKP.\nThis achievment could only be destroyed if Premier Lenin would die unexpectedly...§!
 SOV_congress_preperation: "§gМы начнем подготовку к новому съезду, чтобы положить конец расколу между фракциями РКП." # §gWe will start preperaring for a new Congress so that we can hopefully end the divide between the different factions of the RKP
 SOV_congress_start: "§gСъезд начался. Нам нужно будет сделать выбор между предложениями в разные области разных фракций.§!" # §gThe Congress has started. We will need to decide between proposals to different areas of the different factions.§!
