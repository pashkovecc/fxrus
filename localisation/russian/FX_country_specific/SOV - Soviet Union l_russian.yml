 SOV_military_coup_decisions: "Военный переворот" # Military Coup
 SOV_military_coup_decisions_desc: "Военные совершили переворот в правительстве, чтобы защитить народ и обеспечить стабильное правительство после смерти премьера Ленина. Но переворот вызвал прямо противоположное, поэтому теперь перед нашим премьером стоит задача положить конец анархии.\nДля этого правительство должно быть стабильным, что может оказаться трудным.\n§gСтабильность правительства§! : £stability_texticon §Y[?SOV.sov_stability_factor]§!" # The military has couped the government in order to protect the people and ensure a stable government after the death of Premier Lenin. But the coup has caused quite the opposite so now [Root.GetLeader] will have the task of ending the anarchy.\nIn order do this the government needs to be stable, which may prove difficult.\n§gGovernment Stability§! : £stability_texticon §Y[?SOV.sov_stability_factor]§!
