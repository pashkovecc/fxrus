 SOV_great_patriotic_war: "Великая Отечественная война" # Великая Отечественная война
 SOV_great_patriotic_war_desc: "Война пришла к нам! Империалисты стремятся раз и навсегда уничтожить революцию. Мало ли они знают, что Родина, будучи сердцем революции, сильна, и наши братья и сестры будут сопротивляться и побеждать зло капитализма любой ценой." # War is now upon us! The imperialists seek to destroy the revolution once and for all. Little do they know that the motherland, being the heart of the revolution, is strong and our brothers and sisters will resist and prevail against the evils of capitalims whatever the cost.
 SOV_great_patriotic_war_spamming_equipment: "Великая Отечественная война" # Great Patriotic War
 SOV_great_patriotic_war_spamming_equipment_desc: "Война пришла к нам! Империалисты стремятся раз и навсегда уничтожить революцию. Мало ли они знают, что Родина, будучи сердцем революции, сильна, и наши братья и сестры будут сопротивляться и побеждать зло капитализма любой ценой." # War is now upon us! The imperialists seek to destroy the revolution once and for all. Little do they know that the motherland, being the heart of the revolution, is strong and our brothers and sisters will resist and prevail against the evils of capitalims whatever the cost.
 SOV_food_problems: "Проблема с продовольствием" # Food Supply Issue
 SOV_food_problems_desc: "Отсутствие современного оборудования и инфраструктуры на советской родине делает наше распределение и снабжение продовольствием очень нестабильным.\n§RЕсли мы пойдём на войну с другой страной, очень вероятно, что наступит общенациональный голод.§!" # The lack of modern equipment and infrastructre in the Soviet motherland makes our food distribution and supplies very unstable.\n§RShould we go to war with another nation, a nation-wide famine will very likely materialize itself.§!
 SOV_food_problems2: "Проблема с продовольствием" # Food Supply Issue
 SOV_food_problems2_desc: "Несмотря на наши успехи в решении проблем, связанных с нехваткой современного оборудования и инфраструктуры, возможность нехватки продовольствия по-прежнему представляет собой реальную угрозу, если наш Союз окажется в сложной ситуации.\n§RЕсли мы пойдём на войну с другой страной, очень вероятно, что наступит голод в слаборазвитых регионах.§!" # Despite our advances in solving the issues concerning our lack of modern equipment and infrastructre, the possibility of a food shortage is still a real threat if our Union is put in a tough situation.\n§RShould we go to war with another nation, we should expect a famine to materialize in underdeveloped regions.§!
 SOV_food_problems3: "Проблема с продовольствием" # Food Supply Issue
 SOV_food_problems3_desc: "Мы добились большого прогресса в решении проблем, связанных с нехваткой современного оборудования и инфраструктуры. Однако наше распределение и запасы продовольствия все еще не полностью стабилизированы.\n§RЕсли мы пойдём на войну с другой страной, очень вероятно, что по всей стране возникнет небольшая нехватка продовольствия.§!" # We have made great progress in solving the issues concerning our lack of modern equipment and infrastructre. However, our distribution and supplies of food are still not entirely stabilized.\n§RShould we go to war with another nation, we should expect some food shortages to show up around the country.§!
 SOV_collectivization: "Коллективизация" # Collectivization
 SOV_collectivization_desc: "Премьер [Root.GetLeader] начал кампанию коллективизации с целью коллективизации около 80% всех наших сельскохозяйственных угодий. Большая часть крестьянства категорически против этой кампании и может отреагировать агрессивно.\nВ настоящее время §Y[?collectivization]%§! нашей земли £national_unity_texticon коллективизировано.\n§WЭто дает нам следующие эффекты:§!\n§WСтабильность:§! §R-[?SOV_collectivization1]%§!\n§WФактор фабрик, производящих товары народного потребления:§! §H-[?SOV_collectivization2]%§!" # Premier [Root.GetLeader] has started a campaign of collectivization, with the aim of collectivizing around 80% of all of our farmland. A great portion of the peasantry is highly opposed to this campaign and may react violently.\nCurrently §Y[?collectivization]%§! of our land is £national_unity_texticon collectivized.\n§WThis gives us the following effects:§!\n§WStability:§! §R-[?SOV_collectivization1]§!\n§WConsumer Goods Factories:§! §H-[?SOV_collectivization2]%§!
 SOV_political_divide: "Политический раскол" # Political Divide
 SOV_political_divide_desc: "Политический раскол между многими фракциями коммунистической партии преследует страну уже много лет, поскольку он препятствует управлению из-за постоянного политического конфликта между фракциями." # A political divide between the many factions of the communist party has been plaguing the country for many years, since it prevents governance because of the constant political conflict between the factions.
 SOV_political_chaos: "Политический хаос" # Political Chaos
 SOV_political_chaos_desc: "Смерть премьера Ленина повергла Советский Союз в полнейший хаос. Пока различные фракции коммунистической партии плетут интриги и строят козни друг против друга, крестьянское восстание против Советского Союза и оппозиция многих рабочих против Союза оказались парализованы." # The death of Premier Lenin has caused the Soviet Union to slid into complete and utter chaos. With the different factions of the communist party backstabbing and scheming against each other the country, the revolt of the peasants against Soviet Union and the opposition of many workers against the Union has became paralyzed
 SOV_crippled_industry: "Поврежденная промышленность" # Crippled Industry
 SOV_crippled_industry_desc: "Политический хаос привел к тому, что отрасль не может нормально функционировать, а большинство рабочих отказываются работать." # The political chaos has caused the industry to not be able to function normally, with most workers refusing to work.
 SOV_economic_breakdown: "Экономический кризис" # Economic Breakdown
 SOV_economic_breakdown_desc: "Политический хаос привел к тому, что большинство заводов опустели, поскольку рабочие вместо этого протестуют против государства. Это в сочетании с ожесточенными столкновениями между различными группами привело к полному экономическому краху." # The political chaos has caused most factories to be empty, as workers instead protest against the state. This coupled with the violent clashes between the different groups has caused a complete economic breakdown.
 SOV_mobilized_economy: "Мобилизованная экономика" # Mobilized Economy
 SOV_mobilized_economy_desc: "Сосредоточив внимание на промышленном расширении, мы наконец сбалансировали нашу экономику. Однако это не означало, что наша экономика нестабильна. Фактически, она все еще сильно милитаризована, что помогает нам подготовиться к неизбежной борьбе с империалистами." # With our focus on industrial expansion we have finally balanced our economy. However, this has not meant that our economy is unstable. In fact, it still is heavily militarized, which helps us prepare for the inevitable fight with the imperialists.
 SOV_engine_war: "Мобилизованная экономика" # Mobilized Economy
 SOV_engine_war_desc: "Мы готовы защитить наш бастион от любых сил, которые ему угрожают, какими бы сильными они ни были. Наша экономика производит все больше и больше оборудования, которое поможет нашей армии защитить людей и экспортировать революцию." # We are ready to defend our bastion against any force that threatens it, no matter how strong they are. Our economy is producing more and more equipment to help our army to protect the people and export the revolution.
 SOV_engine_war2: "Мобилизованная экономика" # Mobilized Economy
 SOV_engine_war2_desc: "Мы готовы защитить наш бастион от любых сил, которые ему угрожают, какими бы сильными они ни были. Наша экономика производит все больше и больше оборудования, которое поможет нашей армии защитить людей и экспортировать революцию." # We are ready to defend our bastion against any force that threatens it, no matter how strong they are. Our economy is producing more and more equipment to help our army to protect the people and export the revolution.
 SOV_lacking_industrialization: "Отсутствие индустриализации" # Lacking Industrialization
 SOV_lacking_industrialization_desc: "Сосредоточившись на вооружении, мы почти полностью проигнорировали необходимость индустриализации нашей страны, в результате чего страна на годы отстает в технологическом и экономическом отношении от наших соперников.\n§YЧтобы расширяться, нам сначала нужно индустриализировать нашу страну.§!" # With our focus on armament we have nearly completely ignored the need to industrialize our nation, resulting in the nation being years behind technological and economically compared to our rivals.\n§YIn order to expand we first need to industrialize our nation.§!
 SOV_lacking_industrialization1: "Отсутствие индустриализации" # Lacking Industrialization
 SOV_lacking_industrialization1_desc: "Сосредоточившись на вооружении, мы почти полностью проигнорировали необходимость индустриализации нашей страны, в результате чего страна на годы отстает в технологическом и экономическом отношении от наших соперников.\n§YЧтобы расширяться, нам сначала нужно индустриализировать нашу страну.§!" # With our focus on armament we have nearly completely ignored the need to industrialize our nation, resulting in the nation being years behind technological and economically compared to our rivals.\n§YIn order to expand we first need to industrialize our nation.§!
