 soviet.1.t: "Советская история" # Soviet History
 soviet.1.d: "Земля русских когда-то была третьей по величине империей в мире, охватывающей три континента. Несмотря на то, что Российская империя была военной державой, в основном сельская и деиндустриализированная Российская империя сильно отставала от своих европейских соседей. В 1914 году, после того как эрцгерцог Австрийский был застрелен сербом в Сараево, Россия мобилизовалась для защиты своего сербского союзника от вторгшейся австрийской армии. Так началась Великая война между русскими, британцами и французами против немцев, австрийцев и османов.\nВеликая война была войной, непохожей ни на одну другую. По мере того как силы Центральных держав продвигались на восток, моральный дух падал, а волнения росли до тех пор, пока не достигла точки плавления, когда большая часть России ополчилась против монархии в 1917 году, положив начало Февральской революции. В конце концов царь отрекся от своей власти в пользу революционеров, которые представляли собой нестабильный пакт между Петроградским Советом, возглавляемым большевиками-коммунистами, и Временным правительством, возглавляемым республиканцами. Уличные бои и наступление немецкой армии привели к нарушению пакта и разразилась Гражданская война, решившая судьбу России: коммунистические большевики во главе с революционером Владимиром Лениным или большое антибольшевистское Белое движение.\n\nК марту 1918 года большевики контролировали большую часть российского населения и оттеснили белых обратно в Сибирь. Однако теперь большевики сражались с наступающей немецкой армией. Ленин подпишет Брест-Литовский договор с центральными державами, выводя Россию из войны в обмен на уступку Восточной Польши, Белоруссии, Украины и Польши центральным державам. В конце 1918 года Ленин едва не пропустил покушение, совершенное левым эсером. Это заставило его запаниковать и заключить мирные соглашения с Украиной, Белоруссией, Грузией и другими государствами Прибалтики и Кавказа, а также заключить де-факто мир с белыми на Дальнем Востоке. Из-за страха Ленина перед нападением Запада он начал расширять военную промышленность, игнорируя проблему отсутствия индустриализации и технологической отсталости страны.\n\nС тех пор большевики начали распадаться. Правая рука Ленина, Лев Троцкий, начал формулировать свою собственную ревизию ленинизма, который боролся за пролетарский интернационализм, массовую демократию и, что самое важное, за перманентную революцию. Эта теория получила название «Интернационализм». Тем временем высокопоставленный большевик по имени Вячеслав Молотов разработал радикально иную идеологию, известную как национал-коммунизм, полагая, что Советский Союз необходимо укрепить внутри страны и всех предателей необходимо очистить. Бывший товарищ Ленина, Николай Бухарин, лишился избирательных прав в политике Ленина и начал выступать за идеологию, которая позволяет рабочим контролировать свои рабочие места, а также либерализацию советского правительства. Небольшое количество социалистов остаются верными ленинизму, например Сергей Киров, и ходят даже слухи о военном перевороте... Но у Ленина большие планы на будущее, но его здоровье ухудшается." # The land of the Russians was at one point the world’s third largest empire, spanning three continents. Although a military powerhouse, the largely rural and deindustrialized Russian Empire lagged heavily behind its European neighbors. In 1914, after the Archduke of Austria was shot by a Serbian in Sarajevo, Russia mobilized to defend it’s Serbian ally against the invading Austrian army. Thus begun the Great War between the Russians, the British, and the French against the Germans, the Austrians, and the Ottomans.\nThe Great War was a war unlike any other. As Central Powers forces pushed east, morale lowered and unrest grew until the melting point where most of Russia was in arms against the monarchy in the 1917, beginning the February Revolution. The Tsar eventually abdicated his power to the revolutionaries, who were an unstable pact between the Petrograd Soviet lead by the communist Bolsheviks and the Provisional Government led by republicans. Street fighting and an advancing German Army led to the pact being broken and Civil War broke out to decide the fate of Russia– the communist Bolsheviks, led by revolutionary Vladimir Lenin, or the big tent anti-Bolshevik White Movement.\n\nBy March 1918, the Bolsheviks controlled most of the Russian population and had pushed the Whites back to Siberia. However, the Bolsheviks were now fighting the advancing German army. Lenin would sign the treaty of Brest-Litovsk with the Central Powers, removing Russia from the war in exchange of ceding Eastern Poland, Belarus, Ukraine, and Poland to the Central Powers. In late 1918, Lenin barely missed an assassination attempt by a Left SR member. This caused him to panic and make peace deals with Ukraine, Belarus, Georgia and the other states in the Baltic and Caucasus region, as well as making de facto peace with the Whites in the Far East. Because of Lenin’s fear behind a western attack he started expanding the armament industry ignoring the issue of the lacking industrialization and the technological backwardness of the nation.\n\nSince then, the Bolsheviks have begun fracturing. Lenin’s right hand man, Leon Trotsky, has begun formulating his own revision of Leninism that fought for proletarian internationalism, mass democracy, and most important of all, permanent revolution. This theory was called “Internationalism”. Meanwhile, a high ranking Bolshevik named Vyacheslav Molotov would develop a radically different ideology known as National Communism, believing that the Soviet Union must be strengthened internally and all traitors must be purged. A past comrade of Lenin, Nikolai Bukharin, has become disenfranchised with Lenin’s policies and has started to advocate for an ideology that allows workers control of their workplaces as well as the liberalization of the Soviet government. A small amount of socialists remain loyal to Leninism such as Sergey Kirov and there are even whispers of a military coup… But Lenin has great plans for the future, but his health is degrading..
 soviet.1.a: "Выходите, революционеры!" # Come forth, Revolutionaries!
 soviet.2.d: "Владимир Ленин ушел из жизни! Это катастрофа, поскольку без Ленина многие внутренние фракции коммунистической партии теперь будут бороться за власть. Хуже того, многие группы, выступающие против Ленина, демонстрируют свое желание начать протест, а некоторые, похоже, даже планируют свергнуть правительство. Хотя все это происходит, многие люди оплакивают Ленина и надеются, что они благополучно переживут бурю, которая последует за его смертью. Народ надеется, что, хотя Ленин умер, его дело живет!" # Vladimir Lenin has passed away! This is a disaster as without Lenin the many internal factions of the communist party will now scramble for power. Even worse, many groups opposing Lenin are showing their desire to start a protest and some seem to even have the ambition of overthrowing the government. While all this is happening though, many people are mourning for Lenin and hoping that they will weather the storm safely that will follow his death. The people hope that while Lenin has died, his cause lives on!
 soviet.3.d: "После смерти Ленина у Советского Союза не было реального лидера, и это привело к резкому обострению ситуации. Из-за этого ходили слухи об инакомыслии и переворотах, а встречи важных генералов заставляли людей беспокоиться о том, что они планируют военный переворот. Сергей Киров также имеет шанс стать новым премьером, но рабочие могут выступить против него, поскольку он твердо придерживается идеи Ленина, против которой выступает большинство рабочих. Затем есть Бухарин, Молотов и Зиновьев, которые образовали союз, связанный своей оппозицией Троцкому." # The Soviet Union has had no real leader since Lenin's death and this has caused the situation to escalate dramatically. Because of this there have been whispers of dissent and coups, with meeting between important generals making the people worry that they are planning a military coup. Sergey Kirov also has got the chance of becoming the new premier, but the workers might oppose him, because of his strong following of Lenin's idea which most workers oppose. Then there are Bukharin, Molotov and Zinoviev who have formed an alliance binded together by their opposition to Trotsky.
 soviet.4.d: "Чтобы не допустить попадания СССР в руки заговорщиков, ревизионистов или военных, Молотов, Бухарин и Зиновьев сформировали чрезвычайную Тройку и взяли на себя управление. Мы надеемся, что это должно принести атмосферу стабильности в этот дестабилизированный Союз." # In order to prevent the USSR from falling into the hands of conspirators, revisionists or the military, Molotov, Bukharin and Zinoviev have formed an emergency troika and taken over. This should hopefully bring an air of stability into this destabilized Union.
 soviet.5.d: "С очевидной срочностью Молотов решил издать односторонние приказы о немедленной ссылке ряда «антисоветских» реакционеров, ревизионистов и радикалов, выступавших против него. Эта акция является лишь симптомом недавних радикальных действий Молотова, которые кажутся попыткой консолидации его власти. Сообщается, что и Бухарин, и Зиновьев начали с опаской относиться к идеалам Молотова и теперь готовятся к худшему." # With an apparent urgency, Molotov has decided to issue unilateral orders for the immediate exile of a number of 'anti-Soviet' reactionaries, revisionists and radicals who opposed him. The action is only a symptom of the recent radical actions committed by Molotov in what appears to be an attempt at the consolidation of his authority. Both Bukharin and Zinoviev have reportedly began to become wary of Molotov's ideals and now prepare for the worse.
 soviet.6.d: "Похоже, что, поскольку Молотов действовал все более независимо, Бухарин отправился в Осло на встречу левых коммунистов-единомышленников. На этом своеобразном собрании был издан манифест о сокращении советской бюрократии и укреплении демократии, направленный, таким образом, на либертарианскую перестройку в стране. Хотя само имя Бухарина в манифесте не указано, его присутствие на заседании вызвало в СССР некоторые сомнения относительно единства тройки." # It seems that with Molotov acting ever more independently, Bukharin has travelled to Oslo to a reunion of like-minded left communists. In this peculiar meeting, a manifesto was issued for the reduction of the Soviet bureaucracy and the strengthening of democracy, aiming thus at a libertarianist overhaul in the country. While Bukharin's name itself is not listed in the manifesto, his presence in the meeting has raised some doubts in the USSR regarding the unity of the troika.
 soviet.7.d: "На закрытом заседании тройки Молотов предложил Союзу принять его идеологические формулировки, так называемые идеалы национального коммунизма, в качестве государственной политики. Такая интерпретация марксизма окружает идею социализма в государстве, и многие считают, что она противоречит некоторым собственным убеждениям Ленина. Действительно, Зиновьев и Бухарин решительно выступали против любых попыток его реализации и называли их бессмысленными." # During a private meeting of the troika, Molotov has proposed for the Union to adopt his ideological formulations, the so-called ideals of National Communism, as state policy. This interpretation of Marxism surrounds the idea of socialism in a state and many see it as contrary to some of Lenin's own beliefs. Indeed, Zinoviev and Bukharin strongly opposed any attempts at implementing it and called it nonsensical.
 soviet.8.d: "На закрытом заседании Троцкий вновь выступил со своей концепцией «интернационализма». Идея создания и функционирования Советского Союза вокруг постоянной мировой революции с бесконечным экспортом социализма за рубеж считается опасной иллюзией и уже подверглась жесткой критике со стороны Ленина. Тем не менее, учитывая успех «интернационализма» на съезде Советов, некоторые видят в Троцком перспективный политический инструмент для укрепления собственного влияния."
 soviet.9.d: "После встреч за границей и в Союзе Бухарин сформировал собственную фракцию либертарианцев. Они переиздали свой первоначальный манифест, включая ссылку на свои цели, связанные с желанием демократизировать Советский Союз и положить конец бюрократизации экономики, но только на этот раз с именем Бухарина. Многие считают, что у группы Бухарина есть идеи, вредные для Союза, и Зиновьев, и Молотов начали очень четко выражать подобную озабоченность по поводу сильных выступлений Бухарина." # After meetings abroad and in the Union, Bukharin has formed his own faction of libertarianists. They have republished their original manifesto, including the citation of their aims surrounding the desire to democratize the Soviet Union and end the bureaucratization of the economy, but only this time with Bukharin's name in it. Many feel like Bukharin's group has ideas which are harmful to the Union and both Zinoviev and Molotov have started voicing such concerns at Bukharin's strong manifestations very clearly.
 soviet.10.d: "Поскольку и Бухарин, и Молотов создали базу поддержки и консолидировали популярность, в результате внезапного и противоречивого поворота событий Зиновьев и Троцкий объединились и сформировали единый фронт. И Бухарин, и Молотов призывали к этому Зиновьева, и большая часть сторонников Зиновьева, по-видимому, не решается продолжать оставаться на его стороне, но что сделано, то сделано. Этот новый пакт позволил Троцкому выйти из своей политической изоляции, и теперь он выходит на передний план властных отношений в Союзе, приводя с собой большую группу членов партии." # With both Bukharin and Molotov creating bases of support and consolidating popularity, in a sudden and controversial turn of events, Zinoviev and Trotsky have joined hands and formed a united front. Both Bukharin and Molotov have called out Zinoviev for this and a great part of Zinoviev's supporters appear to be hesitant to continue siding with him, but what is done is done. This new pact has allowed Trotsky to leave his political isolation and he now enters the forefront of the power relations in the Union, bringing with him a large group of party members.
 soviet.15.d: "Выходит, что по мере того, как Зиновьев и Троцкий углубляют свой союз, Зиновьев все глубже попадает в руки Троцкого и становится все более зависимым от него. Если эта ситуация не будет исправлена, довольно скоро Зиновьев может оказаться во власти Троцкого и не сможет отобрать у него власть." # It appears that as Zinoviev and Trotsky deepen their alliance, Zinoviev falls ever deeper into Trotsky's hands and becomes ever more dependent on him. Should this situation not be fixed, soon enough Zinoviev might find himself at the mercy of Trotsky and unable to wrestle power away from him.
 soviet.23.d: "После роста напряженности и споров, а также формирования отдельных коалиций, в тройке разразилась борьба за власть, и Молотов, Бухарин и Зиновьев теперь вцепились друг другу в глотку. Хотя официально они по-прежнему остаются союзниками, большая и горячая дискуссия о будущем Советского Союза и их различных взглядах на социализм, по-видимому, фактически сделала любое сотрудничество практически мертвым. Теперь Молотов и его национал-коммунисты, Бухарин и его либертарианцы и фронт Зиновьева-Троцкого - все настраивают свои дискурсы и риторику на подготовку к полномасштабной политической битве." # After increasing tensions and disputes and the formation of distinct coalitions, a power struggle has broken out in the troika and Molotov, Bukharin and Zinoviev are now at each other's throats. While officially they still remain allies, a large and heated discussion regarding the future of the Soviet Union and their different visions of socialism have apparently rendered any collaboration essentially dead. Now, Molotov and his National Communists, Bukharin and his Libertarians and the Zinoviev-Trotsky front all gear their discourse and rhetoric to prepare for an all-out political battle.
 soviet.24.d: "Наши антикоррупционные программы до сих пор были успешными. Нам удалось искоренить коррупцию в съезде Советов и во всех других ведомствах власти. Надеюсь, это предотвратит новый рост коррупции." # Our anti-corruption programms have thus far been a success. We have been able to eradicate corruption in the Congress of Soviets and all other departments of government. Hopefully this will prevent corruption rising again.
 soviet.25.d: "Коррупция растет. Мы не смогли подавить его рост. Мы должны начать антикоррупционную кампанию, чтобы искоренить эту проблему." # Corruption has been rising. We have been unable to suppress the rise of it. We should start an anti-corruption campaign in order to eradicate this problem.
 soviet.26.d: "Коррупция стала обычным явлением в правительстве. Это очень вредит нашему имиджу." # Corruption has become a normal occurance in the government. This is hurting our image tremendously.
 soviet.27.d: "Коррупция стала повсеместной. Нам следует действовать быстро, если мы хотим сохранить имидж нашего режима." # Corruption has become omnipresent. We should act fast if we want to save the image of our regime.
 soviet.28.d: "Коррупция была проблемой некоторое время, но, похоже, в последнее время она несколько уменьшилась. Коррумпированные чиновники были арестованы и приведены примеры. Мы далеки от правительства, свободного от коррупции, но мы улучшаем ситуацию." # Corruption has been an issue a while, but seems to have somewhat diminished recently. Corrupt officials have been arrested and examples have been made. We are a long way from a corruption-free government, but we are improving things.
 soviet.29.d: "Благодаря нашим возобновленным усилиям коррупция с каждым днем ​​становится все более редкой практикой. Мы даже слышали об отказе во взятках! Может быть, чиновники учатся морали или учатся бояться. В любом случае, коррупция неуклонно снижается." # Thanks to our renewed efforts, Corruption is becoming a rarer practice by every passing day. We have even heard of bribes being refused! Maybe are officials are learning morals, or are learning to fear. Either way, corruption is steadily declining.
 soviet.30.d: "Коррупция ушла в прошлое. От взяток не только отказываются, их даже не предлагают. Это не только помогает нашей промышленности и бюрократии работать более гладко, но также улучшает нашу репутацию на мировой арене." # Corruption has become an issue of the past. Not only are bribes being refused, they are not even being proposed. This is not only helping our industry and bureaucracy run smoother, but is also improving our reputation on the world stage.
 soviet.31.t: "Пришло [From.GetAdjective]ое вооружение" # [From.GetAdjective] Equipment Arrives
 soviet.31.d: "Наши [From.GetAdjective]ие друзья прислали нам партию пехотного снаряжения, чтобы помочь в нашей борьбе." # Our friends in [From.GetNameDef] have sent us a shipment of infantry equipment to aid in our struggle.
 soviet.31.a: "Ура!" # Much needed!
 troika.1.d: "Молотов уже довольно давно критикует наш приход к власти. Пока мы готовим нашу политическую кампанию в Советском Союзе, Молотов координировал свои действия со своими политическими союзниками, чтобы заблокировать наши визиты в многочисленные советские советы по всему Союзу, препятствуя нашим усилиям по поиску местной поддержки. Он явно заинтересован только в том, чтобы сдержать не только советское правительство, но и советских граждан." # Molotov has been critical of our rise to power for quite a while now. As we prepare our political campaign through the Soviet Union, Molotov has coordinated with his political allies to block our visits to multiple Soviet councils across the union, hampering our efforts to find local support. He is clearly only interested in holding not just the Soviet government back but the Soviet citizens as well.
 troika.2.d: "Речь Троцкого на Съезде Советов, казалось бы, прошла хорошо, но прежде чем делегаты успели ответить, наши предполагаемые союзники по Тройке, Молотов и Бухарин представили свою собственную речь, в которой они оба обвинили Троцкого в том, что он коррумпированный реакционер, который использует свое собственное политическое положение для личной выгоды. После окончания тирады конгресс замолчал, депутаты были потрясены тяжестью обвинений." # Trotsky's speech to the Soviet congress had seemingly gone well but before delegates could even respond, our supposed allies in the Troika, Molotov and Bukharin presented their own speech in which they both accused Trotsky of being a corrupt reactionary, who uses his own political position for personal gains. After the tirade was over the congress fell silent, deputies shocked at the weight of the accusations.
 troika.3.d: "Речь Бухарина на Съезде Советов, казалось бы, прошла хорошо, но прежде чем делегаты смогли ответить, наши предполагаемые союзники по Тройке, Молотов и Зиновьев представили свою собственную речь, в которой они оба обвинили Бухарина в том, что он коррумпированный реакционер, который использует свое собственное политическое положение для личной выгоды. После окончания тирады конгресс замолчал, депутаты были потрясены тяжестью обвинений." # Bukharin's speech to the Soviet congress had seemingly gone well but before delegates could even respond, our supposed allies in the Troika, Molotov and Zinoviev presented their own speech in which they both accused Bukharin of being a corrupt reactionary, who uses his own political position for personal gains. After the tirade was over the congress fell silent, deputies shocked at the weight of the accusations.
 troika.4.d: "Речь Молотова на Съезде Советов, казалось бы, прошла хорошо, но прежде чем делегаты успели ответить, наши предполагаемые союзники по Тройке, Бухарин и Зиновьев представили свою собственную речь, в которой они оба обвинили Молотова в том, что он коррумпированный реакционер, который использует свое собственное политическое положение для личной выгоды. После окончания тирады конгресс замолчал, депутаты были потрясены тяжестью обвинений." # Molotov's speech to the Soviet congress had seemingly gone well but before delegates could even respond, our supposed allies in the Troika, Bukharin and Zinoviev presented their own speech in which they both accused Molotov of being a corrupt reactionary, who uses his own political position for personal gains. After the tirade was over the congress fell silent, deputies shocked at the weight of the accusations.
 troika.5.d: "Недавно мы назначили нескольких ключевых союзников на должности офицеров Советских Вооружённых Сил. Хотя мы полностью имели законное право назначать того, кого считаем нужным, Зиновьев и Троцкий использовали свои связи с высшим военным руководством, чтобы отменить наше решение." # Recently we have appointed several key allies to the position of officer within the Soviet Armed Forces. While this was completely in our legal right to appoint whoever we see fit, Zinoviev and Trotsky have used their ties to higher ups within the military to overrule our decision.
 troika.6.d: "Недавно мы обвинили нескольких членов Съезда Советов в том, что они являются реакционными диссидентами, стремящимися лишь подорвать Революцию. Хотя этот шаг понравился большинству членов Конгресса, наш бывший союзник Бухарин отменил наше исполнительное решение, сославшись на отсутствие доказательств. Хотя мы могли бы отказаться от этого вопроса, наши сторонники предложили нам начать расследование, чтобы определить обоснованность наших претензий." # Recently we have accused several members of the Soviet Congress of being reactionary dissidents who only seek to undermine the Revolution. While this move was popular with most in the congress, our former ally Bukharin has overruled our executive decision citing lack of evidence. While we could drop the issue, our supporters have suggested we open an investigation to determine the validity of our claims.
 troika.7.d: "Недавно мы обвинили нескольких членов Съезда Советов в том, что они являются реакционными диссидентами, стремящимися лишь подорвать Революцию. Хотя этот шаг понравился большинству членов Конгресса, наш бывший союзник Зиновьев отменил наше решение исполнительной власти, сославшись на отсутствие доказательств. Хотя мы могли бы отказаться от этого вопроса, наши сторонники предложили нам начать расследование, чтобы определить обоснованность наших претензий." # Recently we have accused several members of the Soviet Congress of being reactionary dissidents who only seek to undermine the Revolution. While this move was popular with most in the congress, our former ally Zinoviev has overruled our executive decision citing lack of evidence. While we could drop the issue, our supporters have suggested we open an investigation to determine the validity of our claims.
 troika.8.d: "Наше расследование в отношении нескольких делегатов Съезда Советов установило их невиновность в какой-либо тайной деятельности против нашей страны. Это разоблачение только подорвало нашу легитимность на съезде и поддержало наших оппонентов." # Our investigation of several delegates of the Soviet Congress has found them innocent of any covert activities against our nation. This revelation has only served to undermine our legitimacy to the congress and bolster our opponents.
 troika.9.d: "Наше расследование в отношении нескольких делегатов Съезда Советов признало их виновными в совершении тайной деятельности против нашего народа и правительства. Эти люди должны быть немедленно исключены со съезда и арестованы для вынесения окончательного приговора. Это расследование показало нашу приверженность безопасности и справедливости Советского Союза." # Our investigation of several delegates of the Soviet Congress has found them guilty of committing covert activities against our nation and government. These men are to be expelled from congress immediately and arrested to face a final sentencing. This investigation has shown our dedication to the security and justice of the Soviet Union.
 troika.10.d: "Слухи о взяточничестве уже давно ходят по Съезду Советов, но теперь кажется, что съезд осмелился прямо обвинить нас в таких неэтичных действиях. Несмотря на отрицание всех обвинений, съезд по-прежнему обвиняет нас. Наши союзники по Тройке отказываются отрицать обвинения, но никак не комментируют спор." # Rumors of bribery have been floating around the Soviet Congress for a while now but now it seems now that the Congress is bold enough to directly accuse us of of such unethical actions. Despite denying all charges, the Congress still hold us accused. Our allies in the Troika refuse to deny the charges but have otherwise not commented on the controversy.
 troika.11.d: "Коррупция в советском правительстве перестала быть секретом. Многие политики используют государственные ресурсы в личных целях. Пытаясь сохранить лицо, наши бывшие союзники Молотов и Бухарин возложили большую часть вины за рост коррупции исключительно на Григория Зиновьева. Они сравнивают его с диктатором и объявляют предателем рабочего класса." # Corruption within the Soviet government has become an open secret. Many politicians use state resources for their own personal gain. In an attempt to save face, our former allies Molotov and Bukharin have put most of the blame for rising corruption on solely Grigory Zinoviev. They compare him to a dictator and denounce him as a traitor of the working class.
 troika.12.d: "Коррупция в советском правительстве перестала быть секретом. Многие политики используют государственные ресурсы в личных целях. Пытаясь сохранить лицо, наши бывшие союзники Молотов и Зиновьев возложили большую часть вины за рост коррупции исключительно на Николая Бухарина. Они сравнивают его с диктатором и объявляют предателем рабочего класса." # Corruption within the Soviet government has become an open secret. Many politicians use state resources for their own personal gain. In an attempt to save face, our former allies Molotov and Zinoviev have put most of the blame for rising corruption on solely Nikolai Bukharin. They compare him to a dictator and denounce him as a traitor of the working class.
 troika.13.d: "Коррупция в советском правительстве перестала быть секретом. Многие политики используют государственные ресурсы в личных целях. Пытаясь сохранить лицо, наши бывшие союзники Бухарин и Зиновьев возложили большую часть вины за рост коррупции исключительно на Вячеслава Молотова. Они сравнивают его с диктатором и объявляют предателем рабочего класса." # Corruption within the Soviet government has become an open secret. Many politicians use state resources for their own personal gain. In an attempt to save face, our former allies Bukharin and Zinoviev have put most of the blame for rising corruption on solely Vyacheslav Molotov. They compare him to a dictator and denounce him as a traitor of the working class.
 troika.15.d: "Пока мы служим Советскому Союзу, наши союзники по Тройке, Молотов и Бухарин, по слухам, ведут секретные переговоры с высшим руководством советской армии. Они заявляют, что это исключительно официальное дело, касающееся национальной безопасности, но по мере того, как напряженность внутри Тройки растет, а амбициозные люди начинают ругаться, растут опасения по поводу возможного военного переворота. Мы должны работать над увеличением нашего влияния в армии и подорвать позиции наших противников." # While we have been serving the Soviet Union, our Troika allies Molotov and Bukharin are rumored to be in secret talks with higher ups in the Soviet military. They claim this is solely official business concerning national security but as tensions within the Troika mount and ambitious men buttheads, fears of a possible military coup are mounting. We must work to increase our influence in the military and undermine our opponents
 troika.16.d: "Пока мы служим Советскому Союзу, наши союзники по Тройке, Молотов и Троцкий, по слухам, ведут секретные переговоры с высшим руководством советской армии. Они заявляют, что это исключительно официальное дело, касающееся национальной безопасности, но по мере того, как напряженность внутри Тройки растет, а амбициозные люди начинают ругаться, растут опасения по поводу возможного военного переворота. Мы должны работать над увеличением нашего влияния в армии и подорвать позиции наших противников." # While we have been serving the Soviet Union, our Troika allies Molotov and Trotsky are rumored to be in secret talks with higher ups in the Soviet military. They claim this is solely official business concerning national security but as tensions within the Troika mount and ambitious men buttheads, fears of a possible military coup are mounting. We must work to increase our influence in the military and undermine our opponents
 troika.17.d: "Пока мы служим Советскому Союзу, наши союзники по Тройке Бухарин и Троцкий, по слухам, ведут секретные переговоры с высшим руководством советской армии. Они заявляют, что это исключительно официальное дело, касающееся национальной безопасности, но по мере того, как напряженность внутри Тройки растет, а амбициозные люди начинают ругаться, растут опасения по поводу возможного военного переворота. Мы должны работать над увеличением нашего влияния в армии и подорвать позиции наших противников." # While we have been serving the Soviet Union, our Troika allies Bukharin and Trotsky are rumored to be in secret talks with higher ups in the Soviet military. They claim this is solely official business concerning national security but as tensions within the Troika mount and ambitious men buttheads, fears of a possible military coup are mounting. We must work to increase our influence in the military and undermine our opponents
 troika.19.d: "После долгих дебатов на съезде большинство делегатов проголосовали за инаугурацию Вячеслава Молотова в качестве единоличного председателя Советского Союза и, по сути, за роспуск Тройки, действовавшей в течение нескольких месяцев. Бухарин и Троцкий публично поздравляли Молотова, но, по слухам, голосовали против его повышения." # After much debate within the Congress, a majority of delegates voted to inaugurate Vyacheslav Molotov as sole Chairmen of the Soviet Union and in effect terminating the Troika that has been in effect for several months. Bukharin and Trotsky were publicly seen congratulating Molotov but are rumored to have voted against his promotion.
 troika.20.d: "После долгих дебатов на съезде большинство делегатов проголосовали за инаугурацию Николая Бухарина в качестве единоличного председателя Советского Союза и, по сути, за роспуск Тройки, действовавшей в течение нескольких месяцев. Молотов и Троцкий публично поздравляли Бухарина, но, по слухам, голосовали против его повышения." # After much debate within the Congress, a majority of delegates voted to inaugurate Nikolai Bukharin as sole Chairmen of the Soviet Union and in effect terminating the Troika that has been in effect for several months. Molotov and Trotsky were publicly seen congratulating Bukharin but are rumored to have voted against his promotion.
 troika.21.d: "Коврик выдернут! Похоже, что, хотя Григорий Зиновьев пытался справиться с борьбой за власть против Бухарина и Молотова, он слишком сильно полагался на Троцкого и его опору, и, несмотря на успехи Зиновьева, больше всего от всего этого выиграл Троцкий! Таким образом, ни для кого, кроме Зиновьева, вряд ли стало сюрпризом, когда делегаты проголосовали за инаугурацию Льва Троцкого в качестве единоличного председателя Советского Союза, фактически упразднив Тройку, действовавшую в течение нескольких месяцев. Избрание Троцкого привело к тому, что Зиновьев был слишком шокирован и запутался в паутине Троцкого, чтобы сделать что-либо, кроме как поздравить его. Между тем и Бухарин, и Молотов хранят молчание по этому вопросу." # The rug has been pulled! It appears that while Grigory Zinoviev attempted to deal with the power struggle against Bukharin and Molotov, he relied too heavily on Trotsky and his platform, and despite Zinoviev's successes, the one who most profited out of all of it was Trotsky! Thus, it was hardly a surprise to anyone but Zinoviev when delegates voted to inaugurate Leon Trotsky as sole Chairmen of the Soviet Union, effectively terminating the Troika that has been in effect for several months. Trotsky's election saw Zinoviev too shocked and tied up in Trotsky's web to do anything but congratulate him. Meanwhile, both Bukharin and Molotov have remained silent on the issue.
 troika.22.d: "Наши попытки заручиться поддержкой советских вооруженных сил натолкнулись на серьезное препятствие. Несмотря на наши аргументы о том, что вооруженные силы отчаянно нуждаются в большем финансировании, съезд по-прежнему наложил вето на любую резолюцию об увеличении финансирования, ссылаясь на бюджетные проблемы." # Our effort to gain the support of the Soviet military has hit a major roadblock. Despite our arguments that the military desperately needs more funding, Congress has still vetoed any resolution to increase funding citing budgetary issues.
 troika.23.d: "Приняв во внимание наши предупреждения о том, что советские вооруженные силы недостаточно финансировались для защиты нашей страны, съезд согласился увеличить военное финансирование. Это, несомненно, покажет советским офицерам, что мы стремимся поддержать их позицию." # Heeding our warnings that the Soviet military were inadequately funded to protect our nation, Congress has agreed to increase military funding. This will surely show to Soviet officers that we are dedicated in supporting their position.
 troika.24.d: "После нашего выступления Съезд Советов взорвался аплодисментами. На протяжении всей палаты делегаты высоко оценивали наши обещания дальнейшего развития и роста советской экономики, а также нашу приверженность поддержке социалистических движений по всему миру." # After our speech the Soviet Congress exploded into applause. Throughout the chamber delegates commended our promises to the further development and growth of the Soviet economy, as well as our dedication to support Socialist movements across the globe.
 troika.25.d: "Выслушав сегодня многочисленные показания, Съезд Советов проголосовал за отстранение Молотова от всех государственных обязанностей. Хотя некоторые опасались, что Молотов может использовать своих сторонников в вооруженных силах для оказания давления на Конгресс против этого решения, военные остались верны Конгрессу." # After hearing multiple testimonies today the Congress of the Soviet Union has voted to expel Molotov from all government duties. While some feared the possibility of Molotov leveraging his supporters in the military to pressure congress against this ruling the military has stayed loyal to the Congress.
 troika.26.d: "Выслушав сегодня многочисленные показания, Съезд Советов проголосовал за отстранение Бухарина от всех государственных обязанностей. Хотя некоторые опасались, что Бухарин может использовать своих сторонников в вооруженных силах для оказания давления на Конгресс против этого решения, военные остались верны Конгрессу." # After hearing multiple testimonies today the Congress of the Soviet Union has voted to expel Bukharin from all government duties. While some feared the possibility of Bukharin leveraging his supporters in the military to pressure congress against this ruling the military has stayed loyal to the Congress.
 troika.27.d: "Выслушав сегодня многочисленные показания, Съезд Советов проголосовал за отстранение Зиновьева и Троцкого от всех государственных обязанностей. Хотя некоторые опасались, что Троцкий может использовать своих сторонников в вооруженных силах для оказания давления на Конгресс против этого решения, военные остались верны Конгрессу." # After hearing multiple testimonies today the Congress of the Soviet Union has voted to expel Zinoviev and Trotsky from all government duties. While some feared the possibility of Trotsky leveraging his supporters in the military to pressure congress against this ruling the military has stayed loyal to the Congress.
 troika.37.d: "Противоречивые цели членов Тройки привели к стагнации Советского Союза. Подозрения в коррупции и сговоре с военными привели к тому, что российский Сенат вынес вотум недоверия Тройке. Тем временем амбициозный генерал использовал свое влияние, чтобы сформировать чрезвычайное правительство. Командующий Михаил Тухачевский, несмотря на то, что он был противоречивой фигурой и враждебным критиком Тройки, пообещал принести стабильность и процветание Советскому Союзу и вести рабочий класс к полному и полному экономическому освобождению от капитализма и буржуазного либерализма." # Conflicting goals between Troika members has resulted in the stagnation of the Soviet Union. Suspicions of corruption and collusion with the military have lead the Russian Senate to a vote of no confidence against the Troika. In this interim an ambitious general has used his influence to form an emergency government. Commander Mikhail Tukhachevsky despite being a controversial figure and a hostile critic of the Troika has promised to bring stability and prosperity to the Soviet Union and lead the working class towards total and complete economic liberation from capitalism and bourgeois liberalism.
  
 sovietpol.0.d: "Империалисты объявили нам войну! Женщины и мужчины! Берите ружья, мотыги и гаечные ключи и начинайте работать во славу Родины и триумфальную победу революции!" # The imperialists have declared war on us! Women and men! Grab your guns, your hoes and your wrenches and start working for the glory of the motherland and the triumphant victory of the revolution!
 sovietpol.1.d: "Наши усилия по созданию легкой и тяжелой промышленности пока увенчались успехом. Каждую неделю новое предприятие увеличивает выпуск продукции. Хотя мы еще далеки от наших целей, мы уже заложили очень важную основу для их окончательного завершения." # Our efforts of building up light and heavy industry have thus far been successful. Every week, a new enterprise increases its output. While we still are far away from our goals, we have so far laid very important groundwork for their eventual completion.
 sovietpol.2.d: "Наша промышленность растет неудержимыми темпами, и мы испытываем острую нехватку рабочих рук. В связи с этим возникло предложение массово привлекать крестьянство в города для работы на заводах. Однако такой шаг грозит еще сильнее подорвать и без того хрупкое продовольственное снабжение." # With our industry expanding rentlessly we are in desperate need of every worker we can find. Therefore, a proposal has arisen to bring the Muzhik (peasants) to the cities so they can help us expand our industry. However, this would also destabilize the already fragile food supply even more.
 sovietpol.3.d: "Наше решение использовать сельскохозяйственных рабочих, возможно, и дало нам необходимую рабочую силу для достижения наших целей, но оно вызвало нехватку продовольствия, которая ухудшила наши отношения с местным крестьянством." # Our decision to use workers from the land may have given us the needed manpower to fulfill our goals but it did cause a food shortage that has hurt our relations with local peasantry.
 sovietpol.4.d: "Наше решение не использовать рабочую силу мужика привело к тому, что мы не достигли поставленных целей. В то же время мы избежали возможного дефицита продовольствия, который мог бы возникнуть из-за зависимости от мужика, так что не всё так плохо." # Our decision to not use the workforce of the Muzhik resulted us in failing to reach our goals. At the same time, we also avoided a possible food shortage that might have been caused by relying on the muzhik, so not all his terrible.
 sovietpol.5.d: "Поскольку Союз технологически отстает от большинства западных стран и испытывает нехватку квалифицированной рабочей силы, мы начали инвестировать в подготовку новых инженеров, специалистов и ученых. Мы надеемся, что это должно значительно продвинуть нашу страну вперед." # Since the Union is behind most western nation technologically, as there is a lack of skilled labour, we have begun investing into the eduction of new engineers, specialists and scientist. This should hopefully greatly propel our nation forward.
 sovietpol.6.d: "Началась новая правительственная политика, согласно которой образцовым промышленным рабочим будет присвоено особое почетное звание «Ударник социалистического труда». Оно предусматривает вручение нагрудного знака, грамоты и денежного поощрения, что должно способствовать укреплению трудовой дисциплины и повышению морального духа." # A new governmental policy has begun where exemplary industrial workers will be awarded a special rank of honour called the \
 sovietpol.7.d: "Недавно завершилось строительство Беломорско-Балтийского канала. Он соединяет Белое и Балтийское моря, используя реки Нева и Свирь, и, как мы надеемся, должен улучшить нашу военно-морскую торговлю и помочь Беломорску стать крупным городом в регионе." # The White Sea-Baltic Canal has recently finished construction. It connects the White Sea to the Baltic Sea, utilizing both the Neva and Svir River and should hopefully improve our naval commerce and help Belomorsk becoming a major city in the region.
 sovietpol.8.d: "Недавний подъем национального промышленного производства и увеличение производства машин, станков, турбин и тракторов очень впечатляют. Хотя большая часть этой промышленности расположена в основном на Урале, в Кузбассе, Ленинграде и Москве, она также начала экспансию в Казахстан и другие слаборазвитые регионы нашего Союза, во многом помогая им в их экономическом развитии." # The recent rise in our national industrial output and the increase in the manufacturing of machinery, machine tools, turbines and tractors is very impressive. ALthough most of this industry is mostly located in the Urals, Kuzbass, Leningrad and Moscow, it also has begun expanding into Kazakhstan and other underdeveloped regions in our Union, greatly helping them in their economical development.
 sovietpol.9.d: "В стране создаются первые современные заводы, по производительности, эффективности и качеству сравнимые с частными западными. Хотя их пока немного, это закладывает основу для создания современной промышленности. Воистину показатель успеха социализма!" # The first modern factories are being created in the country that have output, efficiency and quality comparable to private Western ones. While there are not many of them yet it lays the groundwork for the creation of a modern industry. Truly a hallmark in showing the success of socialism!
  
 sovietpol.20.d: "В последнее время в Союзе начал массово использоваться сельскохозяйственный трактор ПГОТЗ, выпускаемый на танковых заводах Перми и Горького. Хотя он лишь в общих чертах основан на конструкции американского International 15/30 и мы никогда не получали лицензии на его производство, воровство не является воровством, если оно направлено против капиталистов, которые сами обкрадывают своих рабочих. Иногда такого рода действия необходимы для обеспечения будущего социализма." # Recently, the PGOTZ, a farm tractor produced in the tank factories of Perm and Gorki, has begun being used in mass scale in the Union. Although, it is loosely based on the American International 15/30 build and we never got the license to build it, theft is not theft if it infringed on the capitalists who they themselves steal from their workers. Sometimes these kinds of actions are necessary to ensure the future of socialism.
 sovietpol.25.d: "Необходимость укрепления государства означает, что мы должны также уделить внимание реформе школьного образования и правил. В связи с этим мы начинаем введение платы за обучение в трех старших классах средней школы, а также вводим обязательную школьную форму, включая, разумеется, и обязательные косички для девочек." # The need to strengthen the state means that we must also take care in reforming the teaching and rules of school and education. Thus, we shall now begin the implementation of a tution system for the final three forms of secondary education and we will also implement a mandatory school uniform, including, of course, mandatory pigtails for girls.
 sovietpol.26.d: "Наш любимый лидер неуклонно начал формировать вокруг себя успешный культ личности, и его (справедливо) призывали во всех формах национальной пропаганды за его смелую и мудрую личность и его популярность среди народа. Его фотографии теперь повсюду по всей стране, и многие люди считают его своим великим защитником." # Our beloved leader has steadily begun forming a successful cult of personality around himself, being (rightly) called out in all forms of national propaganda for his bold and wise personality and his popularity amongst the people. His pictures are now omnipresent across the nation and he is seen by many people as their grand protector.
  
 sovietpol.100.d: "Наше решение начать войну, несмотря на серьезные проблемы с логистикой и поставками продовольствия, привело к большому голоду. Это нанесло серьезный ущерб стабильности нашей страны и серьезно подорвало нашу репутацию среди советского крестьянства." # Our decision to go to war while having large issues with our food logistics and supply has caused a major famine. This has extensively hurt our country's stability and severely damaged our reputation with the Soviet peasantry.
 sovietpol.101.d: "Наше решение начать войну, несмотря на серьезные проблемы с логистикой и поставками продовольствия, привело к небольшому голоду. Это нанесло ущерб стабильности нашей страны и нанесло ущерб нашей репутации среди местного крестьянства." # Our decision to go to war while having large issues with our food logistics and supply has caused a small famine. This has hurt our country's stability and damaged our reputation with the local peasantry.
 sovietpol.102.d: "Наше решение начать войну, несмотря на серьезные проблемы с логистикой и поставками продовольствия, привело к незначительной нехватке продовольствия по всей стране. Это несколько подорвало стабильность нашей страны." # Our decision to go to war while having large issues with our food logistics and supply has caused a minor food shortage across the country. This has slightly hurt our country's stability.
  
 sovietpol.1000.d: "Сегодня двадцать два члена РКП, выходцы из рабочего класса, обратились к Кирову в письменной форме с просьбой помочь залечить раскол, который, по их мнению, возник между рабочими и партийными лидерами в России. Среди своих жалоб они указывали на то, что в партию хлынули буржуазные элементы, ослабляющие влияние пролетарских инициатив и усиливающие инакомыслие среди социалистов. Они протестовали против подавления демократии участия в профсоюзах и тенденции к одностороннему принятию решений партийной и профсоюзной бюрократией. Тот факт, что все они являются бывшими металлистами, связанными со Всероссийским союзом металлургов, и имеют долгую историю отстаивания рабочего активизма в большевистской партии, сделал это обращение весьма популярным среди других политических и общественных деятелей." # Today twenty-two RKP members of working class origins appealed in writing to Kirov to help heal the rift they thought had emerged between workers and party leaders in Russia. Among their complaints, they cited that bourgeois elements had flooded into the party, diluting the influence of proletarian initiatives and increasing dissidence among socialists. They protested the suppression of participatory democracy within trade unions and the trend toward unilateral decision-making by the party and trade union bureaucracy. All of them being former metalworkers associated with the All-Russian Union of Metalworkers, and having a long history of advocating worker activism within the Bolshevik party have made this appeal quite popular amongst other political and social figures.
 sovietpol.1001.d: "Поскольку Киров отклонил апелляцию двадцати двух партий, оппозиция оказалась вынуждена сформировать собственную фракцию для борьбы с Кировым и его союзниками. Теперь они призывают к дебюрократизации экономики и поддерживают усиление демократии и другие синдикалистские политики. Будут ли они успешными, неизвестно..." # With Kirov denying the appeal of the twenty-two, the opposition have seen themselves forced to form their own faction in order to combat Kirov and his allies. They now call for the debureaucratization of the economy and support the increasement of democracy and other Syndicalist policies. If they will be successful is uncertain...
 sovietpol.1003.d: "Всероссийский союз писателей во главе с Евгением Замятиным официально заявил о своей поддержке Шляпникова. В числе основных причин, по их словам, было желание исключить политику из художественной литературы. Это резко контрастирует с позицией Всероссийского объединения пролетарских писателей, которое пропагандировало гегемонию рабочих ценностей в литературе и поддерживало Кирова как преемника Ленина." # The All-Russian Union of Writers led by Evgeny Zamyatin have officially declared their support for Shliapnikov. Among their key reasons to do so, was allegedly their desire to keep politics out of fiction. This is in sharp contrast to the All-Russian Association of Proletarian Writers which propagated the hegemony of working-class values in fiction and also support Kirov as successor to Lenin.
 sovietpol.1004.d: "Почти все профсоюзы поддержали Шляпникова в его стремлении стать премьером Советского Союза. Это было вполне предсказуемо, учитывая поддержку Шляпникова со стороны рабочих-социалистов и его обещание передать контроль над экономикой профсоюзам, но, тем не менее, оно по-прежнему вредит стремлению Кирова к власти." # Nearly all trade unions have supported Shliapnikov in his bid to become premier of the Soviet Union. This was quite predictable considering Shliapnikov's support from the worker-socialists and his promise of turning control of the economy over to the trade unions but regardless still serves to hurt Kirov's bid for power.
 sovietpol.1005.d: "Рабочая оппозиция решила начать турне по Советскому Союзу, посещая встречи делегатов и рабочих по всей стране. Они надеются таким образом увеличить свою поддержку среди населения и убедить некоторых делегатов проголосовать за них." # The Worker's Opposition decided to start a tour through the Soviet Union meeting with delegates and workers across the nation. They hope this way they can increase their support in the population and persuade some delegates to vote for them.
 sovietpol.1006.d: "Шляпников начал свое турне с посещения многих заводов, чтобы убедиться, что рабочие поддержат его в его стремлении стать премьером, и оказать давление на делегатов, чтобы они проголосовали за него. Его следующая судьба – поговорить с делегатами, чтобы надеяться на их поддержку." # Shliapnikov started his tour by visiting many factories to ensure that the workers will support him in his bid to become premier and put pressure on the delegates to vote for him. His next destiny is speaking to the delegates to hopefully get their support.
 sovietpol.1007.d: "Шляпников выступает перед многими делегатами, пытаясь убедить их в том, что он поддерживает не синдикализм, а альтернативную коммунистическую интерпретацию. Он уже получил поддержку значительного меньшинства делегатов, но если Киров не примет меры в ближайшее время, он может потерять поддержку еще большего числа делегатов." # Shliapnikov is holding speeches before many delegates trying to convince them that what he supports is not syndicalism but an alternative communist interpretation. He already has got the backing of a large minority of delegates but if Kirov does not do act soon, he may lose the support of even more delegates.
 sovietpol.1008.d: "Гастроли Шляпникова завершились. Это был большой успех: он увеличил свою поддержку среди населения и привлек на свою сторону множество делегатов." # Shliapnikov's tour has ended. It has been a major success with him increasing his support in the population and drawing a lot of delegates on his side.
 sovietpol.1049.d: "Коллонтай сегодня попыталась выступить перед местными лидерами, но мы исключили ее из списка ораторов. Мы надеемся, что это поможет нам в борьбе с Рабочей оппозицией." # Kollontai today attempted to hold a speech before local leaders but we took her off the list of orators. This should hopefully help us in the fight against the Worker's Opposition.
 sovietpol.1050.d: "Более 2000 делегатов прибыли на съезд, чтобы проголосовать за кандидата на пост премьера Советского Союза и по другим ключевым вопросам. Все с нетерпением ждут результатов голосования по вопросу о том, кто станет премьером, поскольку Шляпников уже пользуется поддержкой значительного меньшинства и является сильным претендентом на пост премьера, который ранее занимал Киров." # Over 2000 delegates have arrived to the congress to vote on who becomes premier of the Soviet Union and other key issues. Everyone is anticipating the result of the vote on who becomes premier, with Shliapnikov already having support from a large minority he is a strong contender to Kirov.
 sovietpol.1051.d: "После сложного и, казалось бы, бесконечного избирательного процесса делегаты проголосовали, и результаты были объявлены. Ни для кого не стало неожиданностью, что Шляпников одержал победу на выборах и, таким образом, стал новым премьером Советского Союза. В своей первой речи в качестве нового премьера он пообещал новую эпоху ленинизма, но уже с контролем профсоюзов, демократическим управлением и прозрачной бюрократией. Несмотря на все его попытки, некоторые до сих пор отвергают его премьерство и называют его ревизионистским синдикалистом." # After a rough and seemingly unending electoral process, the delegates have voted and the results have been drawn in. To nobody's surprise, Shliapnikov has risen as the winner of the vote and thus has been made the new premier of the Soviet Union. In his first speech as the new premier, he promised a new age of Leninism, only one featuring trade union control, democratic governance and a transparent bureaucracy. Despite his best attempts, some still reject his premiership and have called him a revisionist syndicalist.
 sovietpol.1052.d: "После сложного и, казалось бы, бесконечного избирательного процесса делегаты проголосовали, и результаты были объявлены. Ни для кого не стало неожиданностью, что Киров одержал победу на выборах и, таким образом, стал новым премьером Советского Союза. Это важный момент в истории Советского Союза. В своей первой речи в качестве нового премьера Киров заявил о своем намерении продолжить политику Ленина и заверить, что СССР не попадет в руки лжесиндикалистов вроде Шляпникова." # After a rough and seemingly unending electoral process, the delegates have voted and the results have been drawn in. To nobody's surprise, Kirov has risen as the winner of the vote and thus has been made the new premier of the Soviet Union. This is an important moment in the history of the Soviet Union. In his first speech as the new premier, Kirov has asserted his intentions to continue Lenin's policies and to assert that the USSR does not fall to the hands of faux syndicalists like Shliapnikov.
  
 sovietpol.1100.d: "На сегодняшний день председатель Калинин помещен под временный домашний арест, а временным председателем объявлен Михаил Фрунзе. Этот шаг вызвал большое возмущение: многие осуждают военный переворот как нелегитимный, но сам Тухачевский отказывается уйти в отставку и утверждает, что его долг — защитить свою родину от троцкизма." # As of today, Chairman Kalinin has been put under temporary house arrest and Mikhail Frunze declared the temporary Chairman. This move has caused great outrage with many denouncing the military coup as illegitimate, but Tukhachevsky himself refuses to step down and asserts that it is his duty to protect his motherland from Trotskyism.
 sovietpol.1101.d: "Почти все дивизии перешли на сторону оппозиции. Однако отсутствие координации и недоверие между большинством тех, кто еще не принял Тухачевского, означает, что кроме формального сопротивления ему достигнут небольшой прогресс. Только время покажет, сможет ли Тухачевский справиться с этими диссидентами достаточно быстро, чтобы избежать свержения." # Nearly all divions have deserted in favour of the opposition. However, the lack of coordination and distrust between most of those that have not yet accepted Tukhachevksy means that little progress has been made outside of a formal resistance towards him. Only time will tell if Tukhachevksy will be able to deal with these dissidents quickly enough to avoid being deposed.
 sovietpol.1102.d: "Председатель Фрунзе сегодня выступил со своей первой речью. Перед сотнями собравшихся он осудил дезертировавших солдат и политиков как предателей родины и призвал к единству в борьбе против троцкизма и капитализма. Речь прошла успешно, и Фрунзе был встречен бурными аплодисментами со стороны в основном сочувствующей публики." # Chairman Frunze held his first speech today. Before a crowd of hundreds, he denounced the deserting soldiers and politicians as traitors to the motherland and calls for unity against Trotskyism and capitalism. The speech was a success and Frunze was widely applauded by the largely sympathetic crowd.
 sovietpol.1103.d: "Вспыхнула масштабная акция протеста против переворота Кирова! Требуя немедленной отставки Фрунзе и Тухачевского, протестующие вышли на улицы Москвы и других городов России. Если мы ничего не предпримем, это может серьезно дестабилизировать советское правительство и подорвать позиции Тухачевского на посту премьера." # A large protest has erupted against Kirov's coup! Demanding the immediate resignation of Frunze and Tukhachevsky, protesters have swarmed across Moscow and other cities in Russia. If we do not do anything, this could greatly destabilize the Soviet government and cause Tukhachevksy's premiership to lose momentum.
 sovietpol.1104.d: "Тухачевский направил свои войска для подавления беспорядков, охвативших Москву и ее окрестности. Приказ не отступать, несмотря на оказываемое сопротивление, привел к гибели 13 человек и ранению 565. Это серьезно подорвало легитимность нашего режима." # Tukhachevsky has sent his troops to suppress riots that have spread across Moscow and its surroundings. Orders to not back down regardless of the opposition presented have thus far resulted in 13 deaths and 565 injuries. This has greatly hurt our regime's legitimacy.
 sovietpol.1105.d: "Похоже, обязанности, возложенные на председателя Фрунзе, вызвали у него стресс, усталость, и человек выглядит все более слабым. Для многих позиция Фрунзе как жесткого лениниста и человека с небольшими личными амбициями делает его единственной возможной легитимирующей чертой правления Тухачевского. Если болезнь Фрунзе возобладает, Тухачевскому будет трудно найти такого же хорошего председателя, как он." # It seems that the responsibilities invested in Chairman Frunze have caused him stress, fatigue and the man appears ever more weakly. For many, Frunze's stance as a hardline Leninist and a man of litte personal ambition make him the only possible legitimizing feature of Tukhachevsky's rule. Should Frunze's illness prevail, Tukhachevsky will struggle to find as good of a chairman as him.
 sovietpol.1106.d: "После нескольких дней усталости и головных болей Фрунзе скончался сегодня от инсульта. Его смерть стала большим ударом для Тухачевского, которому вряд ли удастся найти столь же преданного ленинца и честного человека на пост председателя этой антитроцкистской хунты." # After days of fatigue and headaches, Frunze has passed away today to a stroke. His death marks a great setback for Tukhachevsky, who will be unlikely to find such a committed Leninist and honest man to serve as Chairman for this anti-Trotskyite junta.
 sovietpol.1107.d: "Тухачевскому теперь предстоит принять непростое решение - выбрать председателя. Среди возможных кандидатов - Николай Ежов из ОГПУ (советской тайной полиции) или Климент Ворошилов, высокопоставленный генерал Красной Армии. Однако эти двое очень амбициозны и могут легко нанести удар в спину Тухачевскому, поэтому более безопасным, хотя и более непопулярным, решением было бы просто назначить себя и председателем, и премьером." # Tukhachevsky now faces a hard decision- that of choosing chairman. Amongst the possible candidates are Nikolai Yezhov of the OGPU, the Soviet secret police, or Kliment Voroshilov, a high ranking general in the Red Army. However, these two men are very ambitious and could easily backstab Tukhachevksy, so a safer, albeit more unpopular, solution would be Tukhachevksy to simply install himself as both Chairman and Premier.
 sovietpol.1108.d: "Ворошилов недавно резко раскритиковал выбор Тухачевского в качестве председателя Ежова. Ворошилов твердо убежден, что этот хитрый агент тайной полиции просто предаст Тухачевского и навяжет ему его искаженное видение ленинизма, построенного на терроре. Положение Ворошилова как высокопоставленного генерала, до сих пор поддерживавшего Тухачевского, делает его высказывания весьма значимыми для нынешней администрации." # Voroshilov has recently directed harsh words against Tukhachevsky's choice to make Yezhov Chairman. Voroshilov is of the strong opinion that the sly secret police agent will simply backstab Tukhachevsky and install his own distorted vision of Leninism built on terror. Voroshilov's position as a high-ranking general that has been thus far supportive of Tukhachevksy, makes this very impactful on the current administration.
 sovietpol.1109.d: "Возведение Ежова на пост председателя Советского Союза также ознаменовало начало значительного расширения ОГПУ с гораздо большим бюджетом и гораздо большими полномочиями, и все это ради борьбы с антигосударственным терроризмом. Это дало Ежову еще больший контроль над государством, чем обычному председателю, и поставило Тухачевского в опасное положение." # Yezhov's ascension to Chairman of the Soviet Union has also marked the beginning of a greatly expanded OGPU with a much larger budget and much larger powers, all for the sake of combatting anti-state terrorism. This have given Yezhov even larger control over the state than a normal chairman and has put Tukhachevksy in a dangerous situation.
 sovietpol.1110.d: "Ранее этим вечером премьер Тухачевский был совершенно хладнокровно убит неизвестным убийцей. Когда он готовился выступить с речью в Москве, в него выстрелил одинокий боевик, и возникшая паника в большой толпе позволила этому человеку быстро скрыться. Хотя многие верят в причастность ОГПУ, не обнаружено никаких доказательств, кроме того, что Ежов извлек выгоду из этого отсутствия полномочий." # Earlier this evening, Premier Tukhachevsky was assasinated by an unknown assasin in total cold-blood. While he prepared to make a speech in Moscow, a lone gunman shot him and the ensuing panic in the large crowd allowed this individual to quickly escape. Although many believe in the OGPU's involvement, no evidence has been found other than Yezhov greatly gaining from this absence of authority.
 sovietpol.1111.d: "После непродолжительного траура по Тухачевскому Ежов полностью взял на себя роль премьера, используя ОГПУ для запугивания, подкупа и заключения в тюрьму своих оппонентов и участников сопротивления. С железной рукой и тираническими амбициями, вероятно, впредь будет установлен режим, построенный на терроре." # After a brief period of mourning for Tukhachevsky, Yezhov has completely taken over the role of Premier by using the OGPU to intimidate, bribe and jail his opponents and resistance. With an iron hand and tyrannical ambitions, a regime built on terror is likely to hereforth commence.
 sovietpol.1112.d: "Ежов недавно резко высказался против выбора Тухачевского на пост председателя Ворошилова. Он утверждает, что консолидация власти в СССР исключительно вокруг армии подорвет социализм и что Ворошилов не тот человек, которому можно по-настоящему доверить какую-либо власть. Действительно, хотя позиция Ежова как лидера ОГПУ опирается на сомнительные аргументы, она наносит серьезный ущерб стабильности нашего режима." # Yezhov has recently directed harsh words against Tukhachevsky's choice to make Voroshilov Chairman. He argues that the consolidation of authority in the USSR solely around the army will undermine socialism and that Voroshilov is not a man that can be truly trusted with any power. Indeed, while backed on doubtful arguments, Yezhov's position as leader of the OGPU greatly hurts the stability of our regime.
 sovietpol.1113.d: "Похоже, что пока Тухачевский отсутствует, решая правительственные вопросы и проводя время с бюрократами и политиками, Ворошилов использует свое положение как генерала, так и председателя, чтобы очень активно расширять свое влияние и влияние в Красной Армии. Если восхождение к власти Ворошилова выйдет из-под контроля, вполне возможно, что он сможет перевернуть самого Тухачевского и подняться на пост премьера ценой крови и пуль." # It seems that while Tukhachevksy is away solving governmental issues and spending time with bureaucrats and politicians, Voroshilov has been wielding his position as both General and Chairman to very excitedly expand his influence and reach in the Red Army. Should this rise in power of Voroshilov grow out of hand, it is possible he may be able to coup Tukhachevsky himself and climb to the premiership through blood and bullet.
 sovietpol.1114.d: "Похоже, военные заговоры Ворошилова наконец-то увенчались успехом. Осудив и раскритиковав чрезмерную зависимость Тухачевского от гражданской администрации и его симпатии к профсоюзам вместе с другими офицерами и некоторыми высокопоставленными членами РКП, Ворошилов ночью ворвался в неохраняемую резиденцию Тухачевского и арестовал его. На следующее утро Ворошилов незамедлительно заявил, что заключение Тухачевского в тюрьму связано с его участием в антисоветском соглашении с профсоюзами и валькистами. Затем он провозгласил необходимость немедленного наращивания военной мощи и реорганизации СССР, чтобы предотвратить дальнейшее подрывное воздействие на общество изнутри и извне, и публично провозгласил себя премьером исключительно с этой целью." # It seems that the military conspirations of Voroshilov have finally given birth. After condemning and criticizing the overreliance of Tukhachevsky on the civilian administration and his sympathies to trade unions with fellow military officers and some high-ranking RKP members, Voroshilov marched into Tukhachevksy's unguarded residence at night and arrested him. On the following morning, Voroshilov promptly declared Tukhachevksy's imprisonment due to involvement in an anti-Soviet agreement with the trade unions and Valkists. He then pronounced the need for an immediate military buildup and reorganization of the USSR, in order to prevent further societal undermining from within and abroad, and publicaly made himself Premier for the sole purpose of accomplishing this goal.
 sovietpol.1115.d: "Решение Тухачевского вызвало критику по всему СССР, который назвал его авторитарной мерой, и даже Ворошилов и Ежов выразили неодобрение подобному решению. Тем не менее, им остается лишь жаловаться, поскольку Тухачевский полностью контролирует как правительство, так и Красную Армию." # Tukhachevsky's decision has been met with many critics throughout the USSR, who call it an authoritarian measure, and even Voroshilov and Yezhov have been found frowning at such a decision. Regardless, they can do little other than complain, now that Tukhachevksy completely controls both the government and the Red Army.
 sovietpol.1116.d: "Киров организовал большой оппозиционный фронт против переворота, который устроил [Root.GetLeader], и он и его группа начали не только вооружать и укреплять свою власть и положение, но и вести массовую пропаганду и распространять ее среди населения, призывая к восстановлению диктатуры пролетариата к власти, а не к сохранению этого завуалированного военного самодержавия. Будут ли они успешными или нет, еще неизвестно, хотя многие позитивно оценивают шансы на их успех." # Kirov has organized a large opposition front against [Root.GetLeader]'s takeover, and him and his group have begun not only arming and fortifying their own authority and position, but mass-producing propaganda and spreading it to the population, calling for the restoration of the dictatorship of the proletariat to power, rather than the maintenance of this veiled military autocracy. If they will be successful or not remains to be seen, though many look positively to the chances of their success..
 sovietpol.1117.d: "Многие члены РКП начали выражать полную поддержку Кирову. После этого большое количество Советов заявило о поддержке цели Кирова. Это довольно серьезный удар, поскольку большая часть экономики организована через автономные советы. Тухачевский, очевидно, был в значительной степени возмущен таким решением Советов и теперь отчаянно ищет новых союзников, где бы они ни находились." # Many RKP members have begun expressing their full support of Kirov. Followed by that, a large quantity of soviets declared the support for Kirov's goal. This is quite a massive hit as most of the economy is organized through autonomous soviets. Tukhachevksy apparently was largely outraged at this decision from the soviets, and now looks desperately for new allies, wherever they may be found.
  
 sovietpol.1201.d: "Урало-Сибирский метод — это попытка заручиться поддержкой политики режима по хлебозаготовкам среди крестьян низшего и среднего класса, одновременно изолируя кулаков.\n\nПолитика до сих пор была встречена хорошо, и многие собрания сельских жителей одобрили план хлебозаготовок, навязанный их деревне. Специальные комиссии, состоявшие из бедняков и середняков, распределяли затем нормы хлебозаготовок в хозяйствах села по классовому подходу. Это означало, по крайней мере теоретически, что деревня заставит кулаков сдать его «излишки» зерна, тем самым удовлетворив львиную долю деревенского задания и, возможно, даже оставив некоторую часть зерна, которую можно будет разделить с беднотой. один год принудительных работ в соответствии со статьей 61 Уголовного кодекса. В случаях, когда группы домохозяйств оказывали сопротивление выполнению поручений, наказывалось «лишение свободы на срок до двух лет с конфискацией имущества и изгнанием из населенного пункта»." # The Ural-Siberian method is an attempt to garner support for the regime’s grain procurement policies among lower and middle class peasants, whilst isolating the kulaks at the same time.\n\nThe policy thus far has been received well, and many assemblies of villagers have endorsed the grain requisition plan that was imposed upon their village. Special commissions composed of poor and middle peasants then assigned grain requisition quotas to the village’s households according to a class approach. What this meant, at least in theory, was that the village would force the kulaks to turn over his “surplus” grain, thereby satisfying the lion’s share of the village’s assignment and perhaps even leaving some portion of grain over that could be shared with the poor.\n\nKulak households that failed to fulfill their assignments could be assessed a fine of five times the value of grain owed-the infamous piatikratka—and failing to deliver this assessment, they could face up to one year of forced labor under the provisions of article 61 of the penalcode. In cases when groups of households resisted their assignments, the penalty was “confinement for up to two years, accompanied by confiscation of property and their exile from the locality.
 sovietpol.1202.d: "Мы предприняли усиление репрессивных мер в хлебозаготовках. Мы приказали ОГПУ усилить кампанию против городских спекулянтов и торговцев зерном, связанных с городом. Мы также устраняем руководителей колхозов, виновных в удержании излишков зерна или в их продаже на стороне, мы также поручаем ОГПУ принять срочные меры против кулаков, организующих террористические акты. Наказание вплоть до казни." # We have undetaken an intensification of repressive measures in grain procurements. We have ordered the OGPU to increase its campaign against urban speculators and grain traders with ties to the town. We also are removing collective farm leaders guilty of retaining grain surpluses or of selling them on the side, we also have ordered the OGPU to take swift measures against kulaks who organize terrorist acts. The punishment is up to and including execution.
 sovietpol.1203.d: "Сегодня [Root.GetLeader] выступил с речью, в которой констатировал успех коллективизации. «Истекший год был годом великих прорывов на всех фронтах социалистического строительства. Ключевой нотой этого прорыва было и остается решительное наступление социализма на капиталистические элементы в городе и деревне. Характерной чертой этого наступления является то, что оно уже принесло нам ряд решительных успехов в основных областях социалистического восстановления нашего народного хозяйства. Таким образом, мы можем заключить, что нашей партии удалось организовать перемены и начать успешное наступление на капиталистические элементы.\nНаконец, о третьем достижении партии за последний год. Я имею в виду коренной перелом в развитии нашего сельского хозяйства от мелкого, отсталого, индивидуального хозяйства к крупному, передовому, коллективному сельскому хозяйству, к совместной обработке земли, к машинно-тракторным станциям, к артелям, к колхозам, основанным на современной технике, и, наконец, к гигантским совхозам, оснащенным сотнями тракторов. Заслуга партии здесь состоит в том, что нам удалось в целом ряде областей повернуть основную массу крестьянства со старого, капиталистического пути развития, - который выгоден лишь небольшой группе богатых, а подавляющее большинство крестьян обречено на разорение и полную нищету, - на новый, социалистический путь развития, выталкивающий богатых и перевооружающий середняков и бедняков по новым направлениям, оснащая их современными орудиями, тракторами и сельскохозяйственными машинами, т.е. чтобы дать им возможность выбраться из бедности. Заслуга партии состоит в том, что нам удалось организовать этот коренной перелом в глубине самого крестьянства и обеспечить последующее движение широких масс бедноты и среднего крестьянства, несмотря на невероятные трудности, несмотря на отчаянное сопротивление темных сил всех мастей, от кулаков до попов и обывателей.\n\nВсе это рухнуло и рассыпалось в прах, как старый буржуазно-либеральный хлам. Теперь даже слепой видит, что если и есть серьезное недовольство среди основной массы крестьянства, то не из-за колхозной политики Советской власти, а потому, что Советская власть не успевает за ростом колхозного движения в деле снабжения крестьян машинами и тракторами. Очевидно, что, пока не было массового колхозного движения, «большим шоссе» были низшие формы кооперативного движения — снабженческая и сбытовая кооперация; но когда появилась высшая форма кооперативного движения — колхоз, последний стал «магистральной дорогой» развития. В-третьих, теперь даже слепой видит, что без наступления на капиталистические элементы в деревне и без развития колхозного и совхозного движения мы не добились бы решающих успехов этого года в деле хлебозаготовок, а государство не смогло бы накопить, как оно уже это сделало, аварийного запаса зерна в размере десятков миллионов пудов. Более того, теперь можно доверительно утверждать, что благодаря росту колхозного и совхозного движения мы окончательно выходим или уже вышли из хлебного кризиса. А если ускорить развитие колхозов и совхозов, то нет никаких оснований сомневаться, что года через три наша страна станет одним из крупнейших в мире производителей зерна, если не крупнейшим»." # Today [Root.GetLeader] held a speech ascertaining the success of collectivization. 'The past year was a year of great breakthroughs on all the fronts of socialist construction. The keynote of this breakthrough has been, and continues to be, a determined offensive of socialism against the capitalist elements in town and countryside. The characteristic feature of this offensive is that it has already brought us a number of decisive successes in the principal spheres of the socialist reconstruction of our national economy. We may, therefore, conclude that our party succeeded to organize the change and to launch a successful offensive against capitalist elements.\nFinally, about the party’s third achievement during the past year. I am referring to the radical change in the development of our agriculture from small, backward, individual farming to large-scale, advanced, collective agriculture, to joint cultivation of the land, to machine and tractor stations, to artels, to collective farms based on modern technique, and, finally, to giant state farms, equipped with hundreds of tractors. The party’s achievement here consists in the fact that in a whole number of areas we have succeeded in turning the main mass of the peasantry away from the old, capitalist path of development—which benefits only a small group of the rich, while the vast majority of the peasants are doomed to ruin and utter poverty—to the new, socialist path of development, which pushes out the rich, and reequips the middle and poor peasants along new lines, equipping them with modern implements, with tractors and agricultural machinery, so as to enable them to climb out of poverty. The achievement of the party consists in the fact that we have succeeded in organizing this radical change deep down in the peasantry itself, and insecuring the following of the broad masses of the poor and middle peasants in spite of incredible difficulties, in spite of the desperate resistance of dark forces of every kind, from kulaks to priests and philistines.\n\nAll that has collapsed and crumbled to dust as old bourgeois-liberal rubbish. Now even the blind can see that if there is any serious dissatisfaction among the main mass of the peasantry it is not because of the collective-farm policy of the Soviet government but because the Soviet government is unable to keep pace with the growth of the collective-farm movement in regard to supplying the peasants with machines and tractors. It is obvious that, as long as there was no mass collective-farm movement, the “highroad” was the lower forms of the cooperative movement—supply and marketing cooperatives; but when the higher form of the cooperative movement—the collective farm—appeared, the latter became the “highroad” of development. Third, now even the blind can see that without the offensive against the capitalist elements in the countryside, and without the development of the collective-farm and state-farm movement, we would not have achieved the decisive successes of this year in the matter of grain procurement, nor could the state have accumulated, as it has already done, an emergency reserve of grain totaling tens of millions of poods. Moreover, it can now be confidentially asserted that, thanks to the growth of the collective-farm and state-farm movement, we are definitely emerging, or have already emerged, from the grain crisis. And if the development of the collective farms and state farms is accelerated, there is noreason to doubt that in about three years’ time our country will be one of the world’s largest grain producers, if not the largest.'
 sovietpol.1204.d: "Нам наконец-то удалось обеспечить себе аварийный запас зерна. Это даст нам пространство для маневра в случае внешней или внутренней войны. Это было воспринято как большой успех, и пропагандисты уже подхватили эту идею, чтобы создать романтизированные образы гордых советских крестьян и их тяжелого труда." # We finally managed to secure an emergency grain reserve. This will give us room to maneuver in the event of foreign or domestic war. This has been hailed as a great success and propaganda makers have already caught the sniff of it to produce romanticizations of the proud Soviet peasants and their hard work.
 sovietpol.1205.d: "После провала института репрессивных мер против буйных крестьян по всему Союзу, как прыщи, начали появляться масштабные аграрные восстания. Даже те, кто не был поставлен под эти строгие условия, стали беспокойными из-за страха, что вскоре они могут подвергнуться подобной политике. Это значительно усложнит соблюдение мер, поскольку любое увеличение интенсивности только усилит сопротивление крестьян коллективизации и самому режиму." # After the failure of the institution of suppressive measures against rowdy peasants, large-scale agrarian revolts have begun popping, like pimples, across the Union. Even those that were not put under these strict conditions, have become restless due to the fear that they may be soon subjected to similar policies. This will make enforcing the measures a lot harder, as any increase in intensity will just increase the opposition of peasants to the collectivization and the regime itself.
 sovietpol.1206.d: "Недавно созданные двадцатипятитысячники сеют хаос по всей сельской местности. Официально им разрешено применять силу только против кулаков, но крестьяне среднего и низшего класса вскоре были втянуты в водоворот конфликта. Несмотря на это, они сообщают, что кулаков до сих пор изгоняют из их владений, а их инвентарь и инвентарь передаются в колхозы, что всегда является большим достижением." # The newly created twenty-five-thousanders are causing havoc across the countryside. They officially only are allowed to use force against kulaks, but middle and lower class peasants were soon sucked into the maelstrom of conflict. Regardless, they report that kulaks have still been expelled from their holdings and their stock and implements handed over to the collective farms, which is always a great achievement.
 sovietpol.1207.d: "Центральный Комитет прогнозировал коллективизацию 9,6% крестьянского населения после одного года коллективизации. Но мы смогли превзойти это и смогли коллективизировать [?collectivization] процентов сельскохозяйственных угодий. Это большой успех и большое благо для нашей кампании по коллективизации сельскохозяйственных угодий, поскольку это показывает, насколько успешна наша кампания." # The Central Commitee had projected the collectivization of 9.6 percent of the peasant population after one year of collectivization. But we were able to surpass this and were able to collectivize [?collectivization] percent of the farmland. This is a great success and a great boon for our campaign of the collectivization of the farmland, as it shows how successfull our campaign is.
 sovietpol.1208.d: "Сегодня опубликовано исследование Рабоче-Крестьянской инспекции о перспективах коллективизированного сельского хозяйства. Сообщается, что в колхозном строительстве наблюдается полная неплановость. Вследствие этого, утверждают они, колхозы растут стихийно, за счет использования агитационных методов в определенных регионах, где местные партийные организации взяли на себя бразды правления. Их лидеры плохо информированы и неквалифицированны; они почти не получают помощи от местных земельных и кооперативных агентств; и они получают небольшую экономическую помощь от государства." # Today a study by the Workers' and Peasants' Inspectorate on the perspective of the collectivized agriculture has been released. It reports that there is a complete lack of planning in collective farm construction. As a consequence, they state, is that the collective farms are growing spontaneously through the use of campaign methods in certain regions where local party organizations had assumed the reins. Their leaders are poorly informed and unqualified; they receive almost no assistance from local land and cooperative agencies; and they receive little economic aid from the state.
 sovietpol.1209.d: "Большинство крестьян возмущалось нашей политикой массовой коллективизации. Хорошее образование они воспринимают как способ уйти из колхозов и переехать в город. Если они начнут массово переезжать в города, это нарушит коллективизацию, поэтому мы должны попытаться предотвратить это." # Most peasants have been resenting our policy of mass collectivization. They perceive a good education as a way to leave the collective farms and move to the cities. If they start moving en masse to the cities then this will disrupt the collectivization, so we should look into preventing this from happening.
 sovietpol.1210.d: "Крестьяне массово бегут с сельскохозяйственных угодий, поскольку они надеются на лучшую жизнь в городах, в отличие от ужасной жизни на сельскохозяйственных угодьях. Если мы не будем действовать быстро, это сорвет нашу программу массовой коллективизации." # Peasants are fleeing the farmland en masse, since they hope for a better live in the cities unlike the atrocious live on the farmlands. If we don't act fast this will disrupt our programm of mass collectivization.
 sovietpol.1211.d: "Крестьяне очень обижаются на правительство. Поскольку у государства на уме есть обязательства по обеспечению их благосостояния. Они также винят премьера [Root.GetLeader] во всех своих проблемах с момента вступления в колхоз." # Peasants are becoming very resentful against the government. Since the state has welfare obligations for them in their mind. They also blame Premier [Root.GetLeader] for all their problems since joining a collective farm.
 sovietpol.1212.d: "Крестьяне начинают направлять свой гнев против правительства за коллективизацию против членов своего деревенского общества. Распри и семейные склоки, обиды на новое неравенство в деревне разрушают любые мечты о крестьянской солидарности." # Peasants are starting to direct their anger against the government for collectivization towards the members of their own village society. Feuds and family squabbles, resentments toward the new inequalities in the village are tearing down any dreams of peasant solidarity.
 sovietpol.1214.d: "Партийные чиновники, которым было поручено провести коллективизацию, начали конкурировать друг с другом за лучший и лучший прогресс в своих регионах, стремясь таким образом использовать эти успехи для продвижения своих позиций в партии. Как и следовало ожидать, эта чрезмерная конкуренция не гарантировала лучших результатов и только усложнила жизнь крестьян." # Party officials tasked with collectivization have begun competiting with each other for better and better progress in their respective regions, seeking thus to use these successes to propel their position in the party. As one might expect, this excessive competition has not warranted the best outcomes and has only made the lives of peasants harder.
 sovietpol.1215.d: "Хаос, который вызвала коллективизация во многих сельских районах, облегчил грабежи населения бандитам и преступникам. Это сильно вредит нашей репутации среди крестьянства, так как они не видят в нас возможности защитить их от бандитов и преступников." # The chaos that collectivization caused in many rural areas has made it easy for bandits and criminals to rob the population. This is greatly hurting our reputation in the peasantry, as they don't see us as able to protect them from the bandits and criminals.
 sovietpol.1216.d: "Крестьяне преждевременно убивают свой скот, чтобы не допустить его коллективизации. Убой крупного рогатого скота и овец привел к массовому сокращению производства кожи и шерсти для потребительских товаров." # Peasants are prematurely killing off their livestock in order to prevent them from being collectivized. The slaughtering of the cattle and sheep has resulted in a massive reduction of leather and wool for consumer goods.
 sovietpol.1230.d: "По представлению Бориса Петровича Шеболдаева Политбюро была создана комиссия, председателем которой стал Яков Аркадьевич Яковлев. Комиссия должна подготовить декрет о коллективизации за две недели и будет состоять из восьми подкомиссий. Члены комиссий набирались в основном из профильных центральных органов и из числа секретарей губернских партийных комитетов зерновых районов." # A commission was created by the Politburo, at the recommendation of Boris Petrovich Sheboldaev, with Yakov Arkadyevich Yakovlev as chairman of the commission. The commission is supposed to create a collectivization decree in two weeks and would consist of eight subcommittees. Commission members were drawn largely from relevant central agencies and from among the secretaries of the provincial party committees of grain-producing regions.
 sovietpol.1231.d: "Комиссия завершила проект декрета о коллективизации и внесла его в Пулитбюро. Хотя в проекте нет точного графика коллективизации, в нем предполагается, что она, скорее всего, будет завершена в течение пяти лет, а в основных зернопроизводящих районах - в течение двух-трех лет, с акцентом на то, что в некоторых районах это может произойти даже раньше.\n\n Однако основное внимание в проекте уделяется организационным, производственным и управленческим вопросам. Авторы проекта указа предупреждают, что одни только цифры не являются основой для оценки успеха движения, что является явной отсылкой к скачку процентов коллективизации в предыдущие месяцы в продолжающейся «гонке за процентами» среди провинциальных чиновников. Из проекта также было ясно, что так называемая материально-техническая база для крупного коллективизированного сельского хозяйства отсутствует и что деревня в обозримом будущем будет продолжать полагаться на тягловую силу животных и простые орудия, ожидая массового производства тракторов и других сельскохозяйственных машин.\n\nВ проекте подчеркивается центральное место артели как основной формы колхоза на современном этапе, отмечая, что каждый дальнейший шаг к социализации на пути к коммуне должен основываться на на собственном опыте колхозных крестьян и на их растущей убежденности в долговечности, пользе и преимуществе коллективных форм ведения хозяйства.\n\nВ проекте также утверждается, что «особую осторожность необходимо проявлять в области бытовой жизни, где предрассудки рядового крестьянина наиболее глубоки». Наконец, проект декрета содержит ряд резких предостережений против применения «административного энтузиазма» (эвфемизма, обозначающего силу) при коллективизации." # The commission has completed a draft of the collectivization decree and has submitted it to the Pulitburo. While the draft doesn't have an exact schedule for the collectivization, it suggests that it would likely be completed within five years and in the main grain-producing areas, within two to three years, with a highlight that this can come possibly even sooner in some districts.\n\n The main focus of the draft however is on organizational, production, and managerial issues. The draft decree’s authors warns that numbers alone are no basis for evaluating the success of the movement, a clear reference to the previous months’ leap in collectivization percentages in the ongoing 'race for percentages' among provincial officials. It was also clear from the draft that the so-called material-technical base for large-scale collectivized agriculture was not in place and that the countryside would continue to rely on animal draft power and simple implements for the foreseeable future while awaiting the mass production of tractors and other agricultural machinery.\n\nThe draft stresses the centrality of the artel as the basic form of collective farm at the current stage, noting that each further step toward socialization along the path to the commune must be based on the firsthand experience of collective-farm peasants and on their growing conviction regarding the durability, benefit, and advantage of collective forms of farm management.\n\nThe draft also maintains that “special caution must be displayed in the realm of domestic life, where the ordinary peasant’s prejudices are deepest,”. Finally, the draft decree carries a series of strong warnings against the application of “administrative enthusiasms” (a euphemism for force) in collectivization.
 sovietpol.1232.d: "Однако Яковлеву бросают вызов Борис Петрович Шеболдаев и Андрей Андреевич Андреев, первые секретари соответственно Нижневолжской и Северо-Кавказской партийных организаций, чьи регионы в настоящее время лидируют в стране по коллективизации и которые были стойкими сторонниками того, что Мендель Хатаевич называет «быстрым темпом», и того, что они, как [Root.GetLeader], называли «бурным движением снизу».\n\nХотя Хатаевич рассказал свою провинциальную партийную организацию, что он «в основном согласен» с Яковлевым, он подстраховывается, утверждая, что «мы не должны допускать, чтобы разговоры об «отсутствии организационных возможностей» прикрывали наше отставание от реальной жизни», и обвиняя один из своих уездных партийных комитетов в «нелояльности» по отношению к региону за предложение снизить темпы коллективизации. Хатаевич был более осторожен в вопросе социализации. Он критиковал элементы внутри своей партийной организации, которые выступали за то, что он называл «евангельским социализмом, при котором социализируется все до последней курицы»." # Yakovlev, however, is chalenged by Boris Petrovich Sheboldaev and Andrey Andreyevich Andreyev, first secretaries, respectively, of the Lower Volga and Northern Caucasus party organizations, whose regions are leading the country in collectivization at this time and who were stead fast proponents of what Mendel Khatayevich calls the “fast pace” and of what they, like [Root.GetLeader], labeled a “tumultuous movement from below.”\n\nAlthough Khatayevich told his provincial party organization that he “basically agreed” with Yakovlev, he hedges by arguing that “we must not allow talk of ‘a lack of organizational capabilities’ to cover up our lag behind real life” and by accusing one of his own county party committees of “disloyalty” to the region for suggesting a lower collectivization pace. Khataevich was more cautious in regard to the issue of socialization. He criticized elements within his own party organization who pushed for what he called “evangelical socialism, under which everything down to the last hen is socialized. ”He presciently wstmd that peasant women—the “weak spot” in collective-farm  construction—would  resist  excessive  socialization  and notes his general agreement with Yakovlev’s relatively more moderate approach while differing with him on the matter of the socialization of commercial livestock.
 sovietpol.1233.d: "Яковлев и [Root.GetLeader] провели встречу и Яковлев еще раз рассмотрел указ, чтобы доработать его. Как предложил [Root.GetLeader], был установлен и увеличен темп массовой коллективизации, большинство технических вопросов, касающихся организации и производства, были сняты, а любые опасения по поводу крестьянского «опыта» или «предрассудков» были устранены. Предупреждения против коллективизации «декретно» остались, но отошли на второе место после предупреждений «бороться со всякими попытками сдержать развитие колхозного движения»." # Yakovlev has sat down with [Root.GetLeader] and revisited the decree to finalize it. With [Root.GetLeader]’s prodding, the pace of wholesale collectivization was set and increased, most technical issues regarding organization and production were cut, and any concerns about peasant “experience” or “prejudice” were eliminated. Warnings against collectivization “by decree” remained but fell into second place behind warnings to “struggle against any attempts to hold back the development of the collective-farm movement”
 sovietpol.1234.d: "Указ был опубликован в общенациональной прессе после его одобрения. Это веха в отношениях между режимом и крестьянством, позволяющая начать кампанию коллективизации в масштабах и темпах, непредвиденных заявлениями ноябрьского пленума и даже [Root.GetLeader] и его наиболее радикальными сторонниками.\n\nУказ развязал кампанию как на центральном, так и на провинциальном уровне, имея лишь самые расплывчатые ориентиры и довольно неограниченный мандат на продвижение вперед. Сам указ основан на ряде опасно ложных предположений, а также на национал-коммунистическом мышлении, которое на тот момент не хотело «организовать все заранее», чтобы не было подавлено то, что [Root.GetLeader] назвал «бурным массовым движением».\n\nВ указе утверждается, что «у нас есть материальная база для замены крупного кулацкого производства крупным колхозным производством» как способа рационализации как кампаний по коллективизации, так и по раскулачиванию. В действительности, как показали ранние работы В. П. Данилова, технический уровень советского сельского хозяйства удручающе низок, «тракторизация» деревни была в перспективе, а село было далеко не подготовлено технически к коллективизации. Декрет также переоценивает готовность и способность крестьянства к коллективизации, устанавливая абсурдно высокие цели для кампании по коллективизации, предпочитая игнорировать тот факт - косвенно поддерживая его - что высокие темпы коллективизации были достигнуты в основном в результате провинциальных кампаний, основанных на принуждении и социалистическом соревновании между районами и уездами. Еще более зловеще то, что в указе говорится, что артель была «переходной к коммуне», тем самым легитимизируя предложение о безудержном натиске всеобщего обобществления имущества вплоть до домашней птицы и образования коммун на основе полного обобществления собственности и быта." # The decree was published nationally in the press following its approval. It is a landmark in regime-peasant relations, serving to launch the collectivization campaign on a scale and at a pace unanticipated by the pronouncements of the November plenum and even by [Root.GetLeader] and his most radical supporters.\n\nThe decree unleashed a campaign, on both central and provincial levels, with only the vaguest of guidelines and a fairly open-ended mandate to forge ahead. The decree itself is based on a series of dangerously false assumptions as well as on a national communist mind-set that was loath at this point “to organize everything in advance” lest what [Root.GetLeader] called the “tumultuous, mass movement” be stifled.\n\nThe decree maintains that “we have the material base to replace large-scale kulak production with large-scale production by collective farms” as a way to rationalize both the collectivization and dekulakization campaigns. In fact, as V. P. Danilov’s early work demonstrated,the technical level of Soviet agriculture is woefully low, the “tractorization” of the countryside lay in the future, and the village was nowhere near being technically prepared for collectivization. The decree also overestimates the peasantry’s willingness and capacity to collectivize by positing absurdly high targets for the collectivization campaign, choosing to ignore the fact—implicitly to endorse it—that high rates of collectivization have been achieved largely as a result of provincial campaigns based on coercion and socialist competition between districts and counties. Even more ominously, the decree states that the artel was “transitional to the commune,” thus legitimizing the proposal of unbridled push for all-out socialization of properties down to the household poultry and the formation of communes based on the complete socialization of property and everyday life.
 sovietpol.1235.d: "Появилась новая дворовая игра под названием «Кулаки-разбойники»: в ней одна группа играет роль продотряда, а другая — «кулаков», прячущих зерно." # A new courtyard game has been spawning, named Search and Requisition, in this game one group plays the role of a requisitioning brigade and another act as ‘kulaks’ hiding grain.
 sovietpol.1236.d: "Кулаки делились на три класса. В первую входят около 63 000 «контрреволюционных» семей, которые будут казнены или сосланы, а их имущество конфисковано. Вторая группа состоит из 150 000 домохозяйств, которых называют «эксплуататорами» или «активными противниками» коллективизации. Они будут депортированы в отдаленные районы востока и севера, но им будет разрешено сохранить некоторое имущество. Другая группа состоит из от 396 000 до 852 000 дворов, которым должно было быть разрешено остаться в своем родном районе, но на землях вне коллективов, земля, которую получают эти кулаки, не пахнет." # Kulaks have been divided into three classes. The first consists of about 63,000 ‘counter-revolutionary’ families who will be executed or exiled and have their property confiscated. Group two is made up of 150,000 households labelled ‘exploiters’ or ‘active  opponents’ of collectivisation. These will be deported to the remote regions of the east and north, but permitted to retain some possessions. Another group is composed of between 396,000 and 852,000 households who were to be allowed to remain in their home region but on land outside the collectives, the land that those kulaks receive are not arable.
 sovietpol.1237.d: "[Root.GetLeader] приказал ОГПУ начать чистку деревни от кулацких элементов с целью уничтожения кулачества как класса. Согласно первоначальному приказу, ПП ОГПУ (сокращение от региональных полпредов) на севере, Урале, Сибири и Дальнем Востоке докладывают о местах переселения и количестве кулаков, которые могут быть расселены в регионе. Тогда Секретно-оперативному отделу ОГПУ было поручено определить районы, где в первую очередь должны произойти аресты и ссылки, и доложить о количестве арестов за последние шесть месяцев, количестве ликвидируемых «контрреволюционных» организаций, количестве кулаков, отправляемых в концлагеря, где необходимо будет открыть новые лагеря, а также о возможности организации кулацких деревень без охраны." # The OGPU has been ordered by [Root.GetLeader] to start a cleansing of kulak elements from the countryside, with the aim of the destroying kulaks as a class. As first ordered that OGPU PPs, short for regional plenipotentiary representatives, in the north, the Urals, Siberia and the Far East report on locations for resettlement and the numbers of kulaks that could be settled in the region. Then OGPU’s Secret Operations Department was ordered to determine the regions where arrests and exiles must occur first and, to report on the numbers of arrests in the last six months, the numbers of “counter-revolutionary” organizations to be liquidated, the numbers of kulaks to go to concentration camps, where it would be necessary to open new camps, and whether it would be possible to organize kulak villages without guards.
 sovietpol.1238.d: "[Root.GetLeader] направил телеграмму о раскулачивании полномочным представителям на Северном Кавказе, в Центрально-Черноземном регионе, на Нижнем Поволжье, Среднем Поволжье, Урале и Сибири, в которой говорилось, что сведения из ряда мест говорят о начале «стихийной» ссылки и экспроприации кулаков, то есть о раскулачивании губернских или местных чиновников, а не о раскулачивании, инициированном крестьянами. В телеграмме полномочным представителям предписано обеспечить принятие мер по поднятию вопроса в партийных организациях для проведения предвыборной кампании организованно согласно директивам ОГПУ. Они также предупредили полномочных представителей следить за тем, чтобы среди ссыльных не было семей красноармейцев, и ускорить передачу планов ссылки со всеми расчетами и картами в ОГПУ." # [Root.GetLeader] has issued a telegram on dekulakization to plenipotentiary representatives in the Northern Caucasus, the Central Black Earth Region,mLower Volga, Middle Volga, the Urals, and Siberia stating that information from a series of places told of the beginnings of a “spontaneous” exile and expropriation of kulaks, meaning dekulakization by provincial or local officials—decidedly not peasant-initiated dekulakization. The telegram tells plenipotentiary representatives to ensure that measures are taken to raise the issue in party organizations to carry out the campaign in an organized way according to OGPU directives. They further warned plenipotentiary representatives to ensure that Red Army families were not among the exiles and to hasten the submission of exile plans with all calculations and maps to the OGPU.
 sovietpol.1239.d: "1. Отменить действие законов об аренде земли и использовании наемного труда в сельском хозяйстве (разделы VII и VIII Общих принципов землепользования и реорганизации земель) на индивидуальные крестьянские хозяйства в районах массовой коллективизации. Исключения из этого правила в отношении среднекрестьянских хозяйств должны регулироваться райисполкомами под руководством и контролем окружного исполнительного комитета\n\n2. Конфисковать у кулаков в этих районах средства производства, скот, хозяйственные и жилые постройки, перерабатывающие предприятия, запасы кормов и семян.\n\n3. В то же время, чтобы решительно подорвать влияние кулачества на отдельные слои бедноты и среднего крестьянства и полностью пресечь любые попытки контрреволюционного сопротивления кулачества мерам, проводимым Советской властью и колхозами, принять против кулачества следующие меры: 1-я категория — немедленная ликвидация элементов контрреволюционного кулацкого актива путем заключения их в концентрационные лагеря, не останавливаясь перед смертной казнью для организаторов террористических актов, контрреволюционных волнений и повстанческих организаций;\nb. Ко второй категории следует отнести оставшиеся элементы кулацкого актива, особенно наиболее богатых кулаков и квазипомещиков, подлежащих высылке в отдаленные места СССР, а в пределах данной области - в отдаленные районы области;\nc. 3-я категория — кулаки, оставленные в пределах района; их переселить на выделенные им новые земельные участки за пределами колхозов.\n\n4. Число ликвидируемых кулацких хозяйств в каждой из трех категорий должно быть строго дифференцировано по районам в зависимости от фактической численности кулацких хозяйств в районе так, чтобы общее число ликвидируемых хозяйств во всех основных районах составляло в среднем около 3—5 процентов. Эта директива (3—5%) рассчитана на то, чтобы сосредоточить забастовку в собственно кулацких хозяйствах и не допустить ни при каких обстоятельствах распространения этих мер на какую-либо часть среднекрестьянских хозяйств. Семьи красноармейцев и командиров РККА ссылке и конфискации не подлежат. Что касается кулаков, члены семей которых длительное время работают на фабриках и заводах, то здесь необходимо проявлять особенно тщательный подход и выяснять положение соответствующих лиц не только в деревне, но и в соответствующих заводских организациях." # 1. Repeal the applicability of laws on the leasing of land and the use of hired labor in agriculture (sections VII and VIII of the General Principle sof Land Use and Land Reorganization) to individual peasant farms in raions of wholesale collectivization. Exceptions to this rule with respect to middle-peasant farms must be regulated by raion executive committees under the leadership and supervision of the okrug executive committee\n\n2. Confiscate from kulaks in these raions their means of production, livestock, farm and residential structures, processing enterprises, and fodder and seed reserves.\n\n3. At the same time, in order to resolutely undermine the kulaks’ influence on certain segments of the poor and middle peasantry and completely suppress any attempts at counterrevolutionary resistance by the kulaks to the measures being implemented by Soviet power and collective farms, take the following measures against the kulaks:\na. Category 1—immediately liquidate the counterrevolutionary kulak aktiv elements by incarcerating them in concentration camps, not stopping at the death penalty for organizers of terrorist acts, counterrevolutionary disturbances, and insurrectionist organizations;\nb. Category 2 should be comprised of the remaining elements of the kulak aktiv, especially the richest kulaks and quasi-landowners, who are to be exiled to remote localities of the USSR and, within the borders of a given region, to remote areas of the region;\nc. Category 3 consists of kulaks who are left within the borders of the raion; they are to be resettled on new land plots allotted to them outside collective farms.\n\n4. The number of kulak farms liquidated in each of the three categories must be strictly differentiated by raion, depending on the actual number of kulak farms in the raion, so that the total number of liquidated farms in all of the principal raions amounts to an average of about 3–5 percent. This guideline (3–5 percent) is designed to concentrate the strike on genuinely kulak farms and to prevent these measures under any circumstances from being extended to any segment of middle-peasant farms. The families of Red Army men and commanders of the RKKA [Workers’ and Peasants’ Red Army] are not subject to exile or confiscation. As for kulaks whose family members have been working at factories and plants for a long time, an especially careful approach must be employed, and the position of the relevant persons not only in the countryside but also in the relevant factory organizations should be ascertained.
 sovietpol.1240.d: "Политбюро издало постановление, предписывающее Организационному бюро ЦК издать директиву о закрытии церквей, а также издать приказы об очистке промышленных предприятий от «отдельных кулацких элементов» и «принять решительные меры в высших учебных и технических учебных заведениях по борьбе с контрреволюционными молодежными группами, связанными с кулацкими элементами»." # The Politburo has issued a decree instructing the Central Committee’s Organizational Bureau to issue a directive on the closing of churches as well as issuing orders to purge industrial enterprises of “individual kulak elements” and “to take decisive measures in higher educational and higher technical educational institutions to combat counterrevolutionary youth groups linked to kulak elements.”
  
 sovietpol.1300.d: "«Интурист», государственное туристическое агентство Советской России, было основано в 1929 году для организации внутреннего и внешнего туризма. Будучи государственной компанией, организация обладает фактической монополией на туризм в стране и владеет сотнями ресторанов, отелей, пунктов обмена валюты, автобусных компаний и судов. Ежегодно она обеспечивает поездки сотен тысяч людей. Наиболее популярными направлениями являются Москва, Ленинград и Кавказ, «Советская ривьера». Она также предлагает работникам, хорошо выполнившим свою норму, очень дешевые отпуска в одном из многочисленных санаториев и отелей, расположенных на побережье Черного моря. Однако «Интурист» важен не только для туризма: он играет важную роль в представлении Советского Союза как рабочего рая и демонстрирует иностранным туристам превосходство социалистической системы, а также обеспечивает государство столь необходимой твердой (западной) валютой." # Intourist, the state tourist agency of Soviet Russia, was founded in 1929 to accommodate internal and foreign travelling. Being a state company, the organisation has a practical monopoly on tourism in the country, and possesses hundreds of restaurants, hotels, currency exchanges, bus companies and boats. Every year, hundreds of thousands of people’s travels are taken care of. The most popular destinations are Moscow, Leningrad and the Caucaus, the ‘soviet riviera’. It also offers workers who have performed very well in taking their quota some very cheap vacations in one of the many sanatoria and hotels lying next to the Black Sea coast. Intourist is not only important for travelling though: it fulfils a major role in portraying the Soviet Union as a workers’ paradise and showing foreign visitors the superiority of the socialist system, and it provides the state with some much needed hard (western) currencies.
 sovietpol.1301.d: "Наши действия по прекращению цензуры прессы привели к тому, что пресса теперь регулярно критикует нас, если мы терпим неудачу в кампании или политике. Сейчас нам следует быть более осторожными в наших действиях, поскольку пресса будет сообщать о любых неудачах, о которых она сможет сообщить. Но возможность критиковать нас может заставить многих членов партии и правительственных чиновников прекратить коррупцию и больше взаимодействовать с людьми, иначе они потеряют лицо в глазах общественности." # Our action of ending press censorship has resulted in the press now regularly criticizing us if we fail with a campaign or a policy. We should be more cautious now with our actions as the press will report any failure they can report. But them being able to criticize us might force a lot of party members and government officials to end their corruption and engage themself more with the people, else they will lose face in the public.
 sovietpol.1302.d: "Сегодня состоялась премьера нового шедевра Василия Журавлова «Космическое путешествие», и в первый день фильм собрались посмотреть тысячи людей. Действие научно-фантастического фильма происходит в 1946 году, когда в советской космической программе возникли некоторые проблемы. Профессор Карин обвиняет своего коллегу, профессора Седиха, в том, что он слишком стар и психически неуравновешен. Однако профессор Седых и его помощница Марина игнорируют критику профессора Карин и совершают успешную высадку на Луну, где, к сожалению, возникают некоторые проблемы, ставящие под угрозу жизнь первых двух людей на Луне. К счастью, им удалось выжить и космонавты смогли вернуться в Москву. Это один из первых фильмов в истории, реалистично изображающий космический полет и связанную с ним невесомость, уже получивший положительные отзывы ряда ученых и любителей кино." # Vasili Zhuravlov’s new masterpiece, Cosmic Voyage, had its premiere today, with thousands of people going to watch the movie on the first day. The science-fiction movie is set in the year 1946, in which the soviet space program is having some problems. Professor Karin denounces his concurrent, professor Sedikh, for being too old and mentally unstable. However, professor Sedikh and his assistant Marina disregard professor Karin's critiques and make a successful landing on the moon, where, unfortunately, some problems occur, threatening the lives of the first two people of the moon. Luckily, they manage to survive and the cosmonauts were able to return to Moscow. It is one of the first films in history to realistically depict a spaceflight and the thereby belonging weightlessness, already receiving positive reviews of several scientists and movie lovers.
 sovietpol.1303.d: "Здоровье Владимира Ленина уже давно ухудшается и ухудшается, но никто не ожидал, что это произойдет так скоро. Это катастрофа, поскольку Владимир Ленин был единственным, кто удерживал различные политические фракции от предательств и борьбы друг с другом, поскольку его любили большинство членов коммунистической партии, независимо от того, к какой фракции они принадлежали. Мы можем только надеяться, что он выздоровеет и предотвратит полный крах Советского Союза, а также положит конец политическому расколу между фракциями." # Vladimir Lenin's health has been decreasing and decreasing for a long time, but no one expected this to happen this soon. This is a disaster since Vladimir Lenin was the only thing keeping the different political factions from backstabbing and fighting each other, as he was beloved by most members in the communist party, regardless of which faction they belong. We can only hope that he recovers and prevents an utter collapse of the Soviet Union and hopefully ends the political divide between the factions.
 sovietpol.1304.d: "Советское правительство всегда относилось к крестьянству с пренебрежением из-за его «мелкобуржуазной природы». Однако стабильность советской власти долгое время удерживала крестьян от открытых протестов. Теперь же, со смертью Ленина и последовавшим за ней хаосом, они наконец подняли восстание против правительства, требуя равных прав для крестьян и рабочих."
 sovietpol.1305.d: "ВЦСПС готовит всеобщую забастовку после восстания крестьян. Причина, по которой они планируют объявить всеобщую забастовку, заключается в том, что советское правительство пренебрегает легкой и тяжелой промышленностью и почти исключительно сосредотачивается на промышленности вооружений. Они также критикуют отсутствие социального обеспечения, предоставляемого государством." # The All-Union Central Council of Trade Unions has been preparing a general strike, after the revolt of the peasants. The reasons for them planning to do a general strike is the Soviet government neglecting the light and heavy industry and nearly exclusively focusing on the armament industry. They also are criticizing the lack of welfare provied by the state.
 sovietpol.1306.d: "Рабочие, объединившиеся вокруг ВЦСПС, теперь прекратили свою работу, вышли на улицу и начали протестовать против политики правительства в отношении приоритета военной промышленности над тяжелой и легкой промышленностью. Хотя они недостаточно сильны, чтобы свергнуть наше правительство, они способны резко дестабилизировать советскую экономику, поскольку наша легкая и тяжелая промышленность довольно скудна, поэтому любое препятствие работе этих секторов может привести к полному экономическому краху." # The workers unified behind the All-Union Central Council of Trade Unions now have stopped doing their work and have gone to the street and started protesting the government's policies in regards of the prioritization of the armament industry over the heavy and light industry. While they aren't powerful enough to depose our government, they are able to drastically destabilize the Soviet economy, as our light and heavy industry is rather sparse so any obstruction of those sectors might cause a total economic breakdown.
 sovietpol.1307.d: "Железнодорожники присоединились к всеобщей забастовке. Это еще больше ухудшило ситуацию для правительства, поскольку теперь связь между разными государствами постепенно разрушается. Что еще хуже, некоторые железнодорожники даже начали разрушать части железных дорог, это будет очень дорого и усугубит политическую бурю, которую мы переживаем в данный момент." # Railway workers have joined the general strike. This has turned the situation even worse for the government as now communication between the different state is slowly breaking together. To make this situation worse some railway workers even started to destroy parts of the railways, this will be very costly and worse the political storm we are experiencing at the moment.
 sovietpol.1308.d: "Глубокий политический кризис, последовавший за смертью Ленина, наконец, сказался на экономике, вызвав полный экономический крах. Поскольку рабочие и крестьяне восстают, большинство заводов остаются пустыми, внутри нет никого, кто мог бы работать, а большая часть сельскохозяйственных угодий теперь заброшена.\n\nМы можем только надеяться, что мы сможем выдержать шторм и омолодить нашу экономику и, наконец, начать грандиозную кампанию по индустриализации." # The deep political crisis following Lenin's death has finally took its toll on the economy, causing an utter economic breakdown. As workers and peasants are revolting, most factories are left empty with no one inside to work and most farmland is now fallow.\n\nWe can only hope that we will be able to weather the storm and rejuvenate our economy, and finally start a grand industrialization campaign.
 sovietpol.1309.d: "В условиях столь глубокого политического и экономического кризиса в Советском Союзе у большинства людей нет денег на покупку нашей государственной газеты «Правда», другие же не покупают её из протеста. Из-за этого мы лишаемся важных средств, необходимых для оживления экономики." # With the Soviet Union in such a political and economic crisis most people don't have the money the money to buy our state newspaper, the Pravda, other however simply don't but our state newspaper out of protest. This has left us missing important funds to reinvigorate the economy.
 sovietpol.1310.d: "Студенты поднимают восстания, так как большинство из них выступает против авторитарной политики Ленина. Правительство посылает милицию для их подавления. Это привело к ожесточённым столкновениям между студентами и милицией, и хотя милиция побеждает в большинстве этих стычек, это сильно ударило по нашей популярности." # Students have been rising up, as most students oppose Lenin's authoritarian policies. The government has been sending in the police to suppress them. This has resulted in violent clashes between students and police, while the police is winning most of those fights it has cost us much popularity.
 sovietpol.1311.d: "После начала всеобщей забастовки под руководством ВЦСПС многие люди выступили против всеобщей забастовки, считая ее ненужной причиной усиления нестабильности в эти трудные времена." # After the start of the general strike lead by the All-Union Central Council of Trade Unions, a lot of people came out in opposition to the general strike seeing it unnecessary cause of more instability in these trying times.
 sovietpol.1312.d: "Сегодня Киров выступил с речью, в которой призвал к единству народа вокруг государства, чтобы положить конец анархии и хаосу и вернуть стабильность в страну. Благодаря своей харизме речь Кирова имела большой успех. В результате успеха выступления его политический авторитет значительно укрепился, что сделало его серьезным претендентом на пост премьер-министра." # Today Kirov has held a speech, in this speech he calls for the unity of the people behind the state in order to end the anarchy and chaos and bring back stability to the state. Since Kirov is very charismatic  his speech was a big success. Because of the success of the speech his standing politcally has improved by quite a bit making him a serious contender for the office of Premier.
 sovietpol.1313.d: "Появляются слухи о запланированном перевороте во главе с Львом Троцким. Это вызвало беспокойство у многих политиков, поскольку Лев Троцкий чрезвычайно силен, а оппозиция большинства других политиков является его самым большим препятствием на пути к власти." # Rumous of a planned takeover led by Leon Trotsky have been surfacing. This has caused many politcians to be anxious as Leon Trotsky is extremely powerful, with the opposition of most other politicians being his biggest hinderance of gaining power.
 sovietpol.1314.d: "Созвана встреча между видными генералами, такими как маршал Ворошилов, маршал Фрунзе и маршал Тухачевский, и Ежовым, руководителем ОГПУ. Поскольку на встрече присутствовало много важных политиков и генералов, по этому поводу ходит множество слухов и ведутся дискуссии, но никакой информации о встрече до сих пор не просочилось и не было опубликовано." # A meeting has been called between important generals, like Marshal Voroshilov, Marshal Frunze and Marshal Tukhachevsky and Yezhov, leader of the OGPU. Since many important politicans and generals attended the meeting there has been a lot of rumours and discussions regarding the topic, but no information about the meeting has been leaked or released.
 sovietpol.1315.d: "Сегодня Молотов, Бухарин и Зиновьев объявили о своем намерении сотрудничать, чтобы предотвратить захват власти Троцким и вернуть стабильность в Советский Союз. Хотя все они чрезвычайно различаются политически, они едины в своей оппозиции Троцкому." # Today Molotov, Bukharin and Zinoviev have annnounced their intention of cooperating in order to prevent a takeover from Trotsky and bring back Stability to the Soviet Union. Even though all of them vary extremely politically, they are united in their opposition to Trotsky.
 sovietpol.1316.d: "ВЦСПС заявил, что прекратил всеобщую забастовку, так как не смог поддержать забастовку. Хотя они все еще выступают против нашего правительства, прекращение всеобщей забастовки станет большим подспорьем в прекращении хаоса." # The All-Union Central Council of Trade Unions has announced that it has ended the general strike, because they were not able to uphold the strike. While they still are opposing our government, the end of the general strike is a great help in ending the chaos.
 sovietpol.1317.d: "Экономика наконец оправилась от экономического кризиса. Хотя нам все еще необходимо стабилизировать страну, окончание экономического хаоса дало нам возможность наконец положить конец хаосу." # The economy has finally recovered from the economic breakdown. While we still need to stabilize the nation, the end of the economic chaos has given us the power to finally end the chaos.
 sovietpol.1318.d: "Советы одобрили Сергея Кирова в качестве предпочтительного премьера Советского Союза. Причиной одобрения было решительное следование Кировым идей Ленина, от которых Советы получают большую прибыль, поскольку либертарианцы хотят передать контроль рабочим, а национал-коммунисты хотят внедрить плановую экономику." # The Soviets have endorsed Sergey Kirov as their preferred Premier of the Soviet Union. The reason for the endorsement were Kirov's strong following of Lenin's ideas from which the Soviets are highly profiting from, as the Libertarians wants to give control to the workers and the National Communists want to implement a planned economy.
 sovietpol.1319.d: "Наш политический кризис наконец закончился после прихода к власти нового правительства. Но между различными фракциями по-прежнему существует гигантский политический раскол, который мешает нашему правительству эффективно функционировать." # Our political crisis has finally ended after the new government took over. But there still is a giant political divide between the different factions, which hinders our government from functioning effectively.
 sovietpol.1320.d: "Сергей Киров стал новым временным премьер-министром после того, как жена Ленина обнародовала письмо Ленина, в котором говорилось, что Сергей Киров является его предпочтительным преемником. Хотя он не станет новым премьер-министром до 26-го съезда, который состоится в следующем году, это поможет Советскому Союзу восстановить некоторую стабильность, поскольку он наконец-то снова обрёл лидера." # Sergey Kirov has became the new temporary Premier, after Lenin's wife revealed a letter from Lenin which stated that Sergey Kirov was his preferred heir. While he won't be the new Premier until the 26th Congress, which will take place next year, has taken place. But it will help the Soviet Union to regain some sense of stability as it now finally got a leader again.
 sovietpol.1321.d: "Михаил Тухачевский штурмовал нашу столицу Москву и объявил чрезвычайное положение. Его сопровождали несколько его самых преданных солдат и несколько высокопоставленных генералов, в том числе маршал Ворошилов и маршал Фрунзе, а также лидер ОГПУ Ежов. Это событие шокировало многих, хотя какие-то намеки и были, но самым большим из них была встреча важных генералов с Ежовым." # Mikhail Tukhachevsky has stormed Moscow, our capital, and declared a state of emergency. He was accompanied by a few of his most loyal troops and some high ranking generals, some of them were Marshal Voroshilov and Marshal Frunze, and Yezhov the leader of the OGPU. This event has shocked many, even if there were some hintings, the biggest one was the meeting between important generals and Yezhov.
  
 sovietpol.1322.d: "В 1919–1926 годах геолог Урванцев предпринял экспедицию к восточным предгорьям плато Путорана для поиска крупных месторождений угля и полиметаллических руд. В 1921 году Урванцев построил небольшой деревянный домик и дополнительно исследовал там геологический состав и строение подземелий. Из-за больших запасов природных ресурсов в регионе правительство решило инициировать строительство «Норильского комбината». Этот большой строительный проект включает в себя строительство нескольких сталелитейных заводов, жилых домов, улиц, электростанции и других объектов. Строительство этого нового города обеспечит перевоспитательную работу для людей, представляющих угрозу нашей политической системе: тяжелый труд будет для них целительным и подавит их коварные мысли. Самое главное, их ценный труд ускорит строительство социалистического государства, дешево предоставив ресурсы, в которых нуждается наша растущая экономика." # Between 1919 and 1926, the geologist Urvantsev undertook an expedition to the eastern foothills of the Putorana Plateau to search for large deposits of coal and polymetallic ores. In 1921, Urvantsev built a small wooden house and further researched the geological composition and structures of the underground there. Because of the large deposits of natural resources in the region, the government has decided to initiate the construction of the ‘Norilsk Combinate’. This big construction project includes the building of several steel mills, residential blocks, streets, a power plant and other provisions. The building of this new city provides re-educational work for people who have posed a threat to our political system: the hard work will be healing for them and will suppress their perfidious thoughts. Most importantly, their valuable labour will accelerate the building of the socialist state by cheaply providing the resources our expanding economy needs.
 sovietpol.1323.d: "Недавно советская студия «Союзмультфильм» выпустила новый анимационный фильм под названием «Откровение». Действие картины разворачивается в 1957 году, в мире, захваченном тираническим валькистским режимом. Город-крепость Москва остается последним оплотом свободы и социализма на всей планете. Главный герой фильма — патриотичный советский юноша по имени Дмитрий, который добровольно вступает в элитный детский отряд, пилотирующий 70-футовые бронемашины типа «Откровение». Дмитрий и двое других «капитанов» этих машин противостоят гигантским чудовищам — «Шуцам», осаждающим Москву. Валькистский режим создал этих монстров с целью захватить последний бастион свободного человечества и уничтожить мир с помощью древних германских эзотерических артефактов. Фильм раскрывает взаимоотношения между капитанами и описывает их битвы с «Шуцами». В финале картины разворачивается грандиозное сражение между «Откровениями», лидером валькистов и создателями «Шуцев». Пилоты одерживают победу, что зажигает пламя мировой революции против Валькистской империи, а человечество обретает свободу под эгидой глобального социализма.\n\nСоветские критики уже окрестили фильм «величайшей сказкой XX века», особо отметив тонко раскрытые психологические темы. Картина даже пробилась в узкие зарубежные киноклубы любителей иностранной анимации на Западе, где фанаты стали крутить «Откровение» в небольших кинотеатрах с субтитрами. Премьера фильма даже дала толчок формированию локальных контркультурных кружков, увлеченных советским и пролетарским кинематографом, мультипликацией, литературой и культурой. Участники этих сообществ начали называть себя «подражателями», многие из них активно изучают русский язык и подают документы на визу для поездки в СССР. Впрочем, эти группы остаются практически неизвестными широкой публике и встречаются лишь в нескольких крупнейших городах Запада." # A film by Soviet animation studios Soyuzmultfilm has recently been released– a new animated film known as 'Otkroveniye'. This animated film takes place in 1957, in a world ruled by a tyrannical Valkist regime. The fortified city of Moscow remains as the last bastion of freedom and socialism worldwide. The protagonist of this film is a young boy named Dmitry, a patriotic Soviet youth, who volunteers to join an elite squadron of children that command seventy feet tall armored vehicles known as the \
 sovietpol.1324.d: "Нехватка жилья развивается в большинстве городов с тех пор, как мы начали резко расширять урбанизацию нашей страны, это привело к большому недовольству в городах со стороны людей, живущих на улице или в очень маленьких квартирах." # A housing shortage has been developing in most cities since we have started to dramatically expand the urbanization of our country, this has resulted in a lot of dissatisfaction in the cities by the people who have live on the street or in very small appartments.
 sovietpol.1325.d: "Для смягчения дефицита жилья мы организовали коммунальные квартиры, или коммуны, в которых, как правило, проживает семья в комнате с одной общей кухней и туалетом. Мы считаем, что, живя в общине, люди могут стать более коллективными по своей природе: частное пространство и собственность исчезнут; семейная жизнь будет заменена коммунистическим братством и организацией; а индивид будет подвергаться взаимному наблюдению и контролю со стороны общины.\n\nНекоторые дома были спроектированы для этой цели архитекторами-конструктивистами и названы «коммунальными домами». В этих домах вся собственность, включая даже одежду, будет общей для жильцов, домашние обязанности, такие как приготовление пищи и уход за детьми, будут распределяться между командами по очереди, и все будут спать в одном большом общежитии, разделенном по половому признаку, с отдельными комнатами для секса." # In order to midigate the housing shortage we have organized communal apartments, or kommunalki, accommodating typically a family per room with one shared kitchen and toilet. By getting people to live communally, we believe they could become more collective in nature: private space and property will disappear; family life will be replaced by Communist fraternity and organization; and the individual will be subjected to themutual surveillance and control of the community.\n\nSome houses were designed for this by Constructivist architects, named 'commune houses'. In those houses all the property, including even clothes, will be shared by the inhabitants, domestic tasks like cooking and child care would be assigned to teams on a rotating basis, and everybody would sleep in one big dormitory, divided by gender, with private rooms for sex.
 sovietpol.1326.d: "Советский Союз находился в процессе латинизации с 1929 года. Этот процесс поддерживался большей частью партии, чтобы значительно облегчить ассимилацию людей в Советском Союзе, который охватит весь мир. Одним из важнейших людей, поддержавших это, является нарком просвещения Анатолий Луначарский. Теперь, когда латинизация Советского Союза завершилась, достигнуто великое достижение, которое покажет людям современность советского правительства." # The Soviet Union has been in the process of the latinising since 1929. This process has been supported by most of the party in order to make it a lot easier to assimalate people in the Soviet Union that will encompass all of the world. One of the most important person who was in support of this is Anatoly Lunacharsky, the Commissar of Enlightenment. Now with the latinisation of the Soviet Union complete, a great achievement has been made which will show the people the modernity of the Soviet government.
 sovietpol.1327.d: "Советское правительство по приказу премьера [Root.GetLeader] прекратило процесс латинизации, начатый в 1929 году. Латинизация была популярна среди большинства советских политиков, поскольку помогала им ассимилировать других людей, когда они начали экспортировать революцию, но [Root.GetLeader] придерживается гораздо более изоляционистского подхода, сосредотачиваясь теперь больше на развитии Советского Союза, а не на экспорте революции." # The Soviet government under the order from [Root.GetLeader] has ended the process of latinisation which has been started in 1929. The latinisation was popular around most Soviet politicians as it would help them assimalate other people when they would start exporting the revolution, but [Root.GetLeader] has a way more isolationist approach, focusing now more on the development of the Soviet Union instead of export the revolution.
 sovietpol.1328.d: "Серебряный век русской поэзии — период, начавшийся в 1890-е годы, период исключительно творческой поэзии. Новый репрессивный режим премьера [Root.GetLeader] вынудил многих поэтов либо бежать, добровольно покинуть движение, либо быть казненными правительством. Это привело к завершению этого периода." # The Silver Age of Russian poetry was a period that started in the 1890s and was a period of exceptionally creative poetry. The new repressive regime under [Root.GetLeader] has forced many poets to either fleeing, voluntarily leaving the movement or being executed by the government. This has resulted in the end of this period.
 sovietpol.1329.d: "Большинство ортодоксальных социалистов выступают против использования сборочных конвейеров, вместо этого отдавая предпочтение ремесленным мастерским в качестве места для рабочих, поскольку даже Карл Маркс выступал против них, потому что рабочие должны видеть, что продукты должны быть «зеркалами, в которых рабочие видят свою отраженную сущность». Но [Root.GetLeader] выступает против этого утверждения и начал устанавливать сборочные линии на большинстве заводов." # Most orthodox socialists oppose the use of assembly lines, instead opting for craft shops as a place for the workers, as even Karl Marx opposed them because the workers should see thee products should be 'mirrors in which workers see their reflected essential nature'. But [Root.GetLeader] opposes this assertation and has started establishing assembly lines in most factories.
 sovietpol.1330.d: "Мы начали расширять и модернизировать ремесленные мастерские. Именно таким Маркс хотел, чтобы производство продуктов было вместо сборочных конвейеров, потому что они не являются зеркалами рабочих, в которых они могут видеть их отраженную сущностную природу." # We have started to expand and modernize craft shops. As this is the way Marx wanted to the production of products to be, instead of assembly lines, because they aren not mirrors of workers in which they can see their reflected essential nature.
 sovietpol.1331.d: "Имажинизм — поэтическое движение, пропагандирующее поэзию, основанную на серии захватывающих и необычных образов. Крупнейшие поэты движения — Вадим Шершеневич, Рюрик Ивнев, Сергей Есенин и Анатолий Мариенгоф. Поэты-имажинисты известны тем, что читают в кафе и на сценах, и привлекали внимание общественности атмосферой литературного скандала, которую они создавали, а также своим выдающимся поэтическим талантом." # Imaginism is a poetic movement which advocates for poetry based on a series of arresting and unusual images. The biggest poets of the movement are Vadim Shershenevich, Ryurik Ivnev, Sergey Yesenin and Anatoly Mariengof. Imaginist poets are known for reading at cafés and on stages and drew public attention for the atmosphere of literary scandal they created as well as for their outstanding poetic talent.
 sovietpol.1332.d: "Николай Бухарин известен своей поддержкой антирелигиозной газеты «Безбожник» или «Безбожник» с тех пор, как он посетил их конференцию по культурному атеизму в 1925 году. Теперь он публично поддержал газету, что значительно увеличило ее популярность. Газета известна своим радикальным антирелигиозным содержанием, главными объектами которой являются иудаизм и христианство. В одном журнале они обвиняли раввинов и священников в сотрудничестве с буржуазией и другими контрреволюционерами. В другом говорилось, что крестьяне — паразиты, живущие за счет крестьянского труда." # Nikolai Bukharin has been known for being in support of the Bezbozhnik, or The Godless, an anti-religious newspaper since he attended their conference on cultural atheism in 1925. Now he publically endorsed the newspaper, this has increased the popularity of the newspaper tremendously. The newspaper has been known for its radical anti-religious contents, the biggest targets of them are Judaism and Christianity. In one magazine they accused rabbis and priests of collaborating with the bourgeoisie and other counter-revolutionaries. In another one they said peasants were parasites, who lived of the work of peasants.
 sovietpol.1333.d: "Хотя движение под названием «Новый советский человек» существует с момента образования Советского Союза, новое правительство под руководством премьера [Root.GetLeader] официально поддержало это движение. Одной из главных причин поддержки движения было предотвращение роста троцкизма. Движение хочет создать нового человека, который был бы самоотверженным, образованным, здоровым, мускулистым и с энтузиазмом распространял социализм; этот человек также не имел бы националистических настроений." # While the movement named new Soviet man has been existing since the Soviet Union was established, the new government under [Root.GetLeader] has officially supported this movement. One of the biggest reasons for the support of the movement was to prevent the grow of Trotskyism. The movement wants to create a new person which is selfless, learned, healthy, muscular, and enthusiastic in spreading Socialism, the person also has no nationalist sentiment.
 sovietpol.1334.d: "[Root.GetLeader] начал борьбу с «буржуазной семьей», поскольку считает ее социально вредной — оплотом религии, патриархального угнетения и «эгоистической любви». Мы начали ослаблять семейные узы, значительно упростив разводы, что привело к самому высокому уровню разводов в мире." # [Root.GetLeader] has started to fight the 'bourgeoisie family', since they see it as socially harmful - a stronghold of religion, patriarchaloppression and ‘egotistic love’. We have started to weaken famility ties, by making divorces a lot easier, this has resulted in the highest divorce rate in the world.
 sovietpol.1335.d: "Хор Красной Армии, официальное название — Краснознамённый ансамбль песни и пляски Красной Армии СССР, — наш самый известный армейский хор. Инициатором создания хора выступил театральный режиссер Феликс Николаевич Данилович. Первый руководитель ансамбля был выбран из трех московских дирижеров: Данилина, Чеснокова и Александрова.\n\nВ 1929 году хор посетил Дальний Восток России, развлекая войска, работавшие на Дальневосточной железной дороге. В 1935 году хор был награжден орденом Красного Знамени и переименован в Краснознаменный ансамбль песни и пляски Красной Армии СССР." # The Red Army Choir, officially the Red-bannered Red Army Song and Dance Ensemble of the USSR, is our most well known choir for the army. The initiator for the creation of the choir was Felix Nikolaevich Danilovich, a theatre director. The first director of the ensemble was chosen from three of Moscow's conductors: Danilin, Chesnokov and Alexandrov.\n\nIn 1929, the choir visited the Russian Far East, entertaining the troops working on the Far Eastern Railway. In 1935, the choir was bestowed the Order of the Red Banner and was renamed the Red-bannered Red Army Song and Dance Ensemble of the USSR.
 sovietpol.1336.d: "Одной из самых популярных дворовых игр с 1920-х годов была «Красные и белые» — советские ковбои и индейцы, в которой дети разыгрывают события Гражданской войны в России, часто используя пневматическое оружие, продаваемое специально для этой игры." # One of the most popular courtyard game since the 1920s has been 'Reds and Whites', a Soviet Cowboys and Indians in which the events of the Russian Civil War are being played out by the children, often using air-guns marketed especially for the game.
 sovietpol.1337.d: "«Специальная травля» стала популярным видом спорта под [Root.GetLeader]. Суть этого вида спорта заключается в том, чтобы заставить промышленных экспертов признаться в вредительстве и других отвратительных преступлениях. Из-за этого появились тысячи «буржуазных» или беспартийных инженеров. Если машина сломалась под присмотром инженера, то инженеру будет предъявлено обвинение во вредителе." # 'Specialist Baiting' has become a popular sport under [Root.GetLeader]. The sport comprises of forcing industrial experts to confess to wrecking and other heinous crimes. Because of this thousands of 'bourgeois' or non-party engineers. If a machine broke down under the supervision of an engineer, then the engineer would be charged with wrecking.
 sovietpol.1338.d: "[Root.GetLeader] издал указ, который обязывает каждого еврея в России отказаться от своей религии и принять русское имя, иначе ему грозит депортация и конфискация земли. Синагоги по всей стране также закрываются, поскольку в глазах товарища [Root.GetLeader] они укрывают предателей-антисоветчиков." # [Root.GetLeader] has issued a decree which forces every Jew in Russia to renounce their religion and adopt a Russian name, or face the threat of deportion and confiscation of their land. Synagogues across the nation are being closed aswell, since they harbor anti-Soviet traitors in the eyes of [Root.GetLeader].
  
 sovietscorched.1.t: "Украина начинает восстанавливаться" # Ukraine begins to recover
 sovietscorched.1.d: "Наша тактика выжженной земли дорого обошлась Украине и ее народу. Кажется, сейчас регион начинает восстанавливаться, и местные жители начинают возвращаться к своему обычному распорядку дня. Хотя выжжение этого региона остается спорным, эта тактика имела решающее значение для защиты нашей нации и Революции. \n\nПоскольку память о войне постепенно уходит в прошлое, мы можем воспользоваться этой возможностью и начать восстанавливать Украину былой славы." # Our Scorched Earth Tactics have had a heavy cost on Ukraine on her people. It seems now though the region is beginning to recover and local citizens are starting to return to their normal daily routines. While the scorching of this region remains controversial the tactic has been crucial for the defense of our nation and the Revolution. \n\nAs the memory of war slowly fades into the past we can now take the opportunity and begin rebuilding Ukraine to it's former glory.
 sovietscorched.1.a: "Имя твое неизвестно, подвиг твой бессмертен." # Your names may be unknown but your deeds are immortal.
 # 
 sovietscorched.2.t: "Беларусь начинает восстанавливаться" # Belarus begins to recover
 sovietscorched.2.d: "Наша тактика выжженной земли дорого обошлась Беларуси и ее народу. Кажется, сейчас регион начинает восстанавливаться, и местные жители начинают возвращаться к своему обычному распорядку дня. Хотя выжжение этого региона остается спорным, эта тактика имела решающее значение для защиты нашей нации и Революции. \n\nПоскольку память о войне постепенно уходит в прошлое, мы можем воспользоваться этой возможностью и начать восстанавливать Беларусь до ее былой славы." # Our Scorched Earth Tactics have had a heavy cost on Belarus on her people. It seems now though the region is beginning to recover and local citizens are starting to return to their normal daily routines. While the scorching of this region remains controversial the tactic has been crucial for the defense of our nation and the Revolution. \n\nAs the memory of war slowly fades into the past we can now take the opportunity and begin rebuilding Belarus to it's former glory.
 sovietscorched.2.a: "Имя твое неизвестно, подвиг твой бессмертен." # Your names may be unknown but your deeds are immortal.
 # 
 sovietscorched.3.t: "Восточная Польша начинает восстанавливаться" # Eastern Poland begins to recover
 sovietscorched.3.d: "Наша тактика выжженной земли дорого обошлась восточной Польше ее народу. Кажется, сейчас регион начинает восстанавливаться, и местные жители начинают возвращаться к своему обычному распорядку дня. Хотя выжжение этого региона остается спорным, эта тактика имела решающее значение для защиты нашей нации и Революции. \n\nПоскольку воспоминания о войне постепенно уходят в прошлое, мы можем воспользоваться этой возможностью и начать восстанавливать Восточную Польшу до ее былой славы." # Our Scorched Earth Tactics have had a heavy cost on Eastern Poland on her people. It seems now though the region is beginning to recover and local citizens are starting to return to their normal daily routines. While the scorching of this region remains controversial the tactic has been crucial for the defense of our nation and the Revolution. \n\nAs the memory of war slowly fades into the past we can now take the opportunity and begin rebuilding Eastern Poland to it's former glory.
