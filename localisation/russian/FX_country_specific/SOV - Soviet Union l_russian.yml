 #Lenin 
 SOV_Premier_Lenin: "Премьер Ленин" # Premier Lenin
 SOV_Premier_Lenin_desc: "Ленин в настоящее время является самым влиятельным человеком в Советском Союзе. Он был лидером Октябрьской революции 1917 года, навсегда изменившей Россию. Планы Ленина, сосредоточенные на крупномасштабном развитии гражданской и военной промышленности, были внезапно приостановлены после покушения на него в конце 1918 года, которое заставило его массово перенаправить средства на военную промышленность. Эта политика непопулярна среди партии и населения. Каков будет ответ Ленина на этот животрепещущий вопрос?" # Lenin is currently the most powerful man in the Soviet Union. He was the leader of the October Revolution in 1917, which changed Russia forever. Lenin's plans, focused around large-scale civilian and military industry development was abruptly halted after an assassination attempt in late 1918, which caused him to massively redirect funds to the armament industry. This policy is unpopular in the party and the population. What will Lenin's answer be to this pressing question?
 SOV_help_agriculture: "Помощь сельскому хозяйству" # Help the Agriculture
 SOV_help_agriculture_desc: "Советский Союз, несмотря на огромные усилия государства, все еще в значительной степени неиндустриален, сохраняя фермерские традиции сельской России. Очевидно, что этот недостаток индустриализации и урбанизации не соответствует требованиям других стран мира и отстает в вопросе механизации. Премьер Ленин подчеркивает важность улучшения сельского хозяйства не только для обеспечения продовольствия в мирное время, но и для обеспечения сытости Красной Армии в случае войны." # The Soviet Union, despite massive state efforts, is still largely unindustrialised, conserving the farming traditions of rural Russia. Obviously, this lack of industrialization and urbanization is not up to date with other countries in the world, and is lagging behind in the issue of mechanisation. Premier Lenin stresses the importance of improving the agriculture, not only for ensuring the peacetime food supply, but to ensure the Red Army is well-fed in case of war.
 SOV_continue_industrilization: "Продолжить индустриализацию" # Continue Industrialization
 SOV_continue_industrilization_desc: "Советское государство уже многое сделало в деле повышения промышленного потенциала страны, но этого еще недостаточно. Правительству придется продолжать инвестиции в производственный сектор, особенно в сектор вооружений, который жизненно важен для выживания нашей страны." # The Soviet State has already accomplished much in the question of improving the industrial capacity of the country, but it's still not enough. The government will have to do further investments in the manufacturing sector, especially the armament sector, which is vital to the survival of our country.
 SOV_workplace_democracy: "Поддержка производственной демократии" # Support Workplace Democracy
 SOV_workplace_democracy_desc: "Почти на всех заводах нашей страны имеются советы рабочего представительства, более известные как советы. Советы жизненно важны для функционирования политической и экономической системы Советского Союза: они договариваются о повышении заработной платы, вместе обсуждают, как улучшить рабочую ситуацию, и являются важным фактором вовлечения нормальных трудящихся в социалистическую политику. Эта важность побудила Ленина продолжать поддерживать, финансировать и расширять их полномочия." # Almost all factories in our country have a council of workers' representation, better known as soviets. The soviets are vital to the working of the political and economical system of the Soviet Union: they negotiate better wages, discuss together how to improve the working situation, and are a big factor in involving normal working people with socialist politics. This importance encouraged Lenin to further support, fund and expand their authorizations.
 SOV_new_land_reform: "Новая земельная реформа" # New Land Reform
 SOV_new_land_reform_desc: "Сердце России по-прежнему находится в сельском хозяйстве. Большая часть нашего населения все еще работает на многих полях нашей страны, и Октябрьская революция фактически почти не изменила это положение: во многих местах все еще сохраняется старый сельский порядок кулаков, богатых и бедных фермеров. Мы должны расширить возможности бедных фермеров по расширению своих владений, тем самым повышая урожайность и гарантируя, что в ближайшие годы будет достаточно продовольствия." # The heart of Russia still lies in its agriculture. A large part of our populace still works on the many fields of our country, and the October Revolution has actually barely changed this, with the old rural order of kulaks, rich and poor farmers still standing in many places. We have to expand opportunities for poor farmers to enlarge their properties, thus improving harvests and further securing that enough food will be available for the next years.
 SOV_supress_reactionaries: "Подавить реакцию" # Suppress Reactionaries
 SOV_supress_reactionaries_desc: "Реакционные элементы, нелояльные революции, все еще живы и саботируют великий социалистический проект Советского Союза как внутри, так и вне нашей партии. Для лучшего будущего и стабильности нашей страны нам необходимо искоренить эти опасные элементы и, наконец, помешать им препятствовать экономическому прогрессу." # Reactionary elements, disloyal to the revolution, are still very well alive and sabotaging the great socialist project of the Soviet Union, both inside and outside of our party. For a better future and the stability of our country, we need to root out those dangerous elements and finally stop them from preventing economical advances.
 SOV_prepare_congress: "Подготовка XXVI съезда" # Prepare the XXVI Congress
 SOV_prepare_congress_desc: "XXVI съезд КПСС будет организован через несколько месяцев. Нам нужно подготовить залы, спальные места и помещения, разослать тысячи приглашений самым преданным нашим однопартийцам по всей стране, от донских степей до бесплодной пустоши Сибири." # The XXVI Congress of the CPSU will be organised in a few months. We need to prepare the halls, sleep places and accommodations, and send the thousands of invites to our most loyal party members all over the country, from the steppes of the Don to the barren wasteland of Siberia.
 SOV_start_congress: "Начать XXVI съезд" # Start the XXVI Congress
 SOV_start_congress_desc: "XXVI съезд КПСС наконец откроется вступительной речью премьера Ленина. После этого начнутся недели жарких дискуссий, оценок, деклараций и речей, которые станут идеальным моментом для определения экономического и политического курса Советского Союза на следующий год. Ожидается, что в ближайшие дни прибудут тысячи делегатов, представляющих как самые маленькие сельские деревни, так и крупнейшие мегаполисы СССР." # The XXVI Congress of the CPSU will finally be opened, starting with an opening speech of Premier Lenin. After that, weeks of heated discussions, evaluations, declarations and speeches will begin, making it the ideal moment of deciding the economical and political course of the Soviet Union for the next year. Thousands of delegates are expected to arrive the next days, representing both the smallest rural villages and the biggest metropolises of the USSR.
 SOV_kulak_question: "Интеграция кулаков" # Absorb the Kulaks
 SOV_kulak_question_desc: "Члены съезда поставили критический и важный вопрос о положении кулачества. Многие члены съезда рассматривают их как буржуазные элементы в социалистической стране, угрожающие разумному улучшению сельского хозяйства. Другие, однако, рассматривают это как разжигание страха и заявляют, что кулаки слишком важны для производства продуктов питания, утверждая, таким образом, что они производят слишком много, чтобы их можно было наказать. Еще неизвестно, какое решение примет съезд по этому вопросу." # The congress members have raised a critical and important question involving the position of the kulaks. Many members of the congress view them as bourgeois elements in the socialist country, threatening reasonable agricultural improvement. Others, however, see this as fearmongering and state that the kulaks are too vital for the food production, thus saying that they produce to much to be punished. It remains to be seen what the congress will decide on this issue.
 SOV_army_doctrine_question: "Реформа армию" # Reform the Army
 SOV_army_doctrine_question_desc: "На съезде был поднят большой вопрос, связанный с армией: многие члены съезда считают, что политическое влияние КПСС слишком велико для того, чтобы армия могла функционировать эффективно и независимо, особенно в случае войны. Вот почему некоторые члены считают, что генералам Красной Армии необходимо предоставить большую автономию, в то время как другие говорят, что политический контроль над армией жизненно важен для сохранения лояльности армии революции. Каким будет окончательное решение?" # A big issue involving the army was brought attention to during the congress: many congress members think the political influence of the CPSU is way to big for the army to function efficiently and independently, especially in the case of war. That's why some members think greater autonomy has to be given to the generals of the Red Army, while others say the political supervision over the army is vital to keep the army loyal to the revolution. What will the final decision be?
 SOV_foreign_policy: "Изменение внешней политики" # A Change in Foreign Policy
 SOV_foreign_policy_desc: "Внешняя политика Советского Союза с самого начала была сосредоточена на экспорте революции за границу, и Ленин надеялся, что красная волна захлестнет всю Европу. К сожалению, этого не произошло, и многие члены партии считают, что деньги, потраченные на зарубежные операции, можно более эффективно использовать для улучшения национальной экономики. По мнению многих членов партии, это докажет западным народам, что наша модель превосходит их, и они сами начнут революцию." # The Soviet Union's foreign policy was focussed from the beginning on exporting the revolution abroad, with Lenin hoping that the red wave would flood all of Europe. Unfortunately, that didn't happen, and many party members think that the money spent on foreign operations can be used more efficiently to improve the national economy. This will prove to the western peoples that our model is superior, and they will start the revolution themselves, according to many party members.
 SOV_minorities: "Вопрос меньшинств" # The Minority Question
 SOV_minorities_desc: "Советский Союз — многообразная страна, в которой проживают сотни уникальных этнических групп, каждая из которых имеет свои традиции и культуру. При премьере Ленине меньшинства, жестоко угнетавшиеся во время царского режима, получили некоторые очень важные права. Будет ли дальнейшее расширение этих прав полезным для страны, или нынешняя система является удовлетворительной? Большинство делегатов меньшинства говорят первое, тогда как многие члены российской партии думают второе." # The Soviet Union is a diverse country, containing hundreds of unique ethnic groups, each with their own tradition and culture. Under Premier Lenin, the minorities, violently oppressed during the czarist regime, got some very important rights. Is it for the good of the country to further expand these rights, or is the current system satisfactory? Most minority delegates say the former, while many Russian party members think the latter.
 SOV_secret_service: "Упразднение ОГПУ" # Abolish the OGPU
 SOV_secret_service_desc: "Секретной службе СССР - ОГПУ предстоит большая работа: искоренить реакционные элементы в стране и обеспечить интересы революции, давшей им много полномочий. Многие члены партии хотят сократить полномочия ОГПУ, утверждая, что самые большие угрозы уже устранены, а чрезмерные действия секретной службы подрывают доверие к социалистической системе. Однако многие с этим не согласны и все еще видят много угроз..." # The secret service of the USSR, the OGPU, has a lot of work to do: eradicate reactionary elements in the country and securing the interests of the revolution, which gave them many authorities. Many party members want to reduce the powers of the OGPU, arguing that the biggest threats are already eradicated, and that the excessive actions of the secret service undermine the credibility of the socialist system. Many disagree however, and still see many threats...
 SOV_resignation: "Отставка?" # Resignation?
 SOV_resignation_desc: "С началом XXVI съезда КПСС возникли слухи об общем состоянии премьера Ленина, здоровье которого явно ухудшилось со времени прошлого съезда, а его проблемы стали ясны во время вступительной речи, когда он несколько раз кашлял и проявлял признаки проблем с дыханием. Поэтому для многих возникает вопрос: уйдет ли премьер Ленин после 19 лет правления?" # Since the beginning of the XXVI Congress of the CPSU, rumours arose about the general state of Premier Lenin, with his health clearly deteriorated since last congress, and his problems becoming clear during the opening speech, when he coughed multiple times and showed signs of breathing problems. So the question for many is: will premier Lenin step back after 19 years of rule?
 SOV_congress_over: "Съезд завершает работу" # The Congress Concludes
 SOV_congress_over_desc: "Последние залы съезда закрылись, сегодня ушли последние поезда с делегатами съезда. XXVI съезд окончен, многое обсуждено, многое проголосовано, и курс советского государства определен — пока..." # The last congress halls closed their doors, the last trains with congress delegates left today. The XXVI Congress is concluded, many things have been discussed, many things have been voted on, and the course of the soviet state is set - for now...
 #Kirov 
 SOV_Premier_Kirov: "Премьер Киров" # Premier Kirov
 SOV_Premier_Kirov_desc: "В результате опубликования Завещания Ленина и последующих партийных выборов новым лидером Советского Союза стал Сергей Киров. Он стремится продолжить политику Ленина и улучшить образование рабочих, поддержать добровольную коллективизацию и укрепить производственную демократию." # As a consequence of the release of Lenin's testament and the subsequent party elections, Sergey Kirov has become the new leader of the Soviet Union. He aims to continue Lenin's policies and improve the education of workers, support voluntary collectivization and strengthen workplace democracy.
 SOV_support_from_the_poor: "Вернуть поддержку рабочих" # Regain Support from the Workers
 SOV_support_from_the_poor_desc: "Из-за иррационального внимания Ленина к военной промышленности он в значительной степени пренебрегал гражданской промышленностью. Это привело к разочарованию большого числа рабочих в КПСС и дистанцированию от ленинизма. Премьер Киров попытается изменить это, перекалибровав отрасль и уделив больше внимания потребностям рабочих." # Because of Lenin's irrational focus on the armaments industry, he largely neglected the civilian industry. This caused a great number of workers to be dissapointed in the CPSU and to distance themselves from Leninism. Premier Kirov will try to change this by recalibrating the industry and by focussing more on the needs of the workers.
 SOV_gain_support_vanguardist: "Заручиться поддержкой национал-коммунистов" # Gain Support from the National Communists
 SOV_gain_support_vanguardist_desc: "Единственный способ прийти к власти премьеру Кирову – это искусство компромисса. Чтобы в дальнейшем обеспечить внутрипартийную поддержку, ему нужно будет убедить фракцию национал-коммунистов поддержать его..." # The only way Premier Kirov was able to come to power, was by the art of compromising. To further ensure inner-party support, he will need to convince the National Communist faction to support him...
 SOV_support_from_the_libertarians: "Заручиться поддержкой либертарианцев" # Gain Support from the Libertarians
 SOV_support_from_the_libertarians_desc: "Премьеру Кирову необходимо пойти на компромисс с либертарианской фракцией партии, чтобы обеспечить поддержку своей политики. Переговоры с ними скоро начнутся!" # Premier Kirov needs to compromise with the Libertarian faction of the party to ensure support for his policies. Negotiations with them will start soon!
 SOV_support_peasents: "Заручиться поддержкой крестьян" # Gain Support from the Peasants
 SOV_support_peasents_desc: "Поддержка класса крестьян, составляющего значительную часть нашего населения, необходима для обеспечения нашей власти и влияния на деревню. Уделяя больше внимания потребностям фермеров и прислушиваясь к их проблемам, мы сможем получить от них больше поддержки." # Support of the peasant class, which forms a large part of our population is essential in order to secure our power and influence on the countryside. By paying more attention to the needs of the farmers and by listening to their concerns, we may be able to garner more support from them.
 SOV_gain_support_soldiers: "Заручиться поддержкой солдат" # Gain the Support of Soldiers
 SOV_gain_support_soldiers_desc: "Красная Армия — одна из крупнейших в мире и сыграла важную роль в обеспечении интересов Октябрьской революции. Без них ничего из этого было бы невозможно. После беспорядков, последовавших за смертью Ленина, очень важно заручиться военной поддержкой." # The Red Army is one of the biggest in the world and played a major role in securing the interests of the October Revolution. Without them, none of this would have been possible. After the turmoil following Lenin's death, it's very important to secure military support.
 SOV_status_quo_upheld: "Статус-кво сохранен" # Status Quo Upheld
 SOV_status_quo_upheld_desc: "Премьер Киров является воплощением ленинского статус-кво, символом стабильности и спокойствия. Это утешает многих граждан нашей страны в эти очень странные и напряженные времена, поэтому мы можем использовать этот образ в позитивном изображении нашей партии." # Premier Kirov is the embodiement of the Leninist status quo, a symbol of stability and serenity. This is comforting for many citizens of our country in these very strange and busy times, thus we can use this image in the positive portrayal of our party.
 SOV_enlighten_workers: "Просветить рабочих" # Enlighten the Workers
 SOV_enlighten_workers_desc: "Как и Ленин, премьер Киров желает расширить общие знания рабочих, продвигая газеты, дешевые (информационные) книги и возможности образования для взрослых. Каждому мужчине и женщине нужна возможность раскрыть себя. Это основа нашего социалистического государства." # Just like Lenin, Premier Kirov desires to expand the general knowledge of the workers by promoting newspapers, cheap (informative) books and adult education opportunities. Every man and woman needs to have the possibility to unfold him or herself. It is the foundation of our socialist state.
 SOV_strengthen_workplace_democracy: "Укрепить производственную демократию" # Strengthen Workplace Democracy
 SOV_strengthen_workplace_democracy_desc: "Премьер Киров хочет продолжить ленинскую политику расширения рабочей демократии путем расширения прав советов, их дальнейшего продвижения и финансирования. Это повысит политическое участие населения в целом, что пойдет только на пользу нашей стране." # Premier Kirov wants to continue Lenin's policy of expanded workers' democracy by expanding the rights of the soviets, further promoting and funding them. This will increase the political involvement of the general populace, which will be only for the better of our country.
 SOV_ban_factions: "Запретить фракции" # Ban Factions
 SOV_ban_factions_desc: "Премьер Киров, будучи великим соглашателем, сумел убедить национал-коммунистическую и либертарианскую фракции партии наконец поддержать одного человека - самого себя. По сути, это означает, что фракционность больше не нужна, и что каждый может самостоятельно рассуждать, какая политика лучше, а какая худшая." # Premier Kirov, being the great compromiser he is, managed to convince the National Communist and Libertarian factions of the party to finally stand behind one person, himself. This basically means factionalism is no longer needed, and that everyone can reason on their own which policy is best and worst.
 SOV_land_reform: "Начать земельную реформу" # Begin Land Reform
 SOV_land_reform_desc: "Значительная часть земель у нас еще почти не обрабатывается вследствие конфискации помещичьего имущества и общей немеханизации сельского хозяйства. Очень важно обеспечить более механизированное сельское хозяйство и возделывать больше земель!" # A large portion of land is still barely cultivated in our country, following the confiscation of landlords' property and a general lack of mechanisation in agriculture. It's very important to ensure agriculture will be more mechanised and that more land will be cultivated!
 SOV_voluntary_collectivization: "Поддержать добровольную коллективизацию" # Support Voluntary Collectivization
 SOV_voluntary_collectivization_desc: "В Советском Союзе коллективизировано около 1% обрабатываемых земель. Это немного, но мы можем улучшить ситуацию, стимулируя больше людей - как материально, так и финансово - вступать в колхозы или создавать новые." # In the Soviet Union, approximately 1% of the cultivated land is collectivized. This is not a lot, but we can improve this by encouraging more people - both materially and financially - to enter collective farms or to found new ones.
 SOV_strengthen_OGPU: "Усиление ОГПУ" # Strengthening the OGPU
 SOV_strengthen_OGPU_desc: "ОГПУ, наша секретная служба, — это щит и меч революции, ее величайший защитник. Крайне важно обеспечить правильную работу этой организации и не ущемлять их права. У них много обязанностей и работы, и нам нужно поддержать их в этой задаче." # The OGPU, our secret service, is the shield and sword of the revolution, its greatest protector. It's of the highest significance to ensure the proper working of this organization and to not infringe their rights. They have a lot of responisibilities and work, and we need to support them in this task.
 SOV_self_management: "Самоуправление" # Self-Management
 SOV_self_management_desc: "Люди должны иметь возможность работать независимо, а не полностью зависеть от каких-то людей или организаций. Нам необходимо поощрять личное развитие наших людей, чтобы стимулировать интеллектуальное творчество и совершенствование." # People need to be able to work independently, not completely depending on some people or organizations. We need to encourage personal development of our people to boost intellectual creativity and improvement.
 #Molotov 
 SOV_Premier_Molotov: "Премьер Молотов" # Premier Molotov
 SOV_Premier_Molotov_desc: "Вячеслав Молотов взял на себя управление Советским Союзом. Твердо веря в сильное государство, возглавляющее революцию, этот человек клянется продолжить дело Ленина, реализуя такую ​​политику, как научный менеджмент, реструктуризацию образования, установление культа личности и начало коллективизации. Да здравствует премьер Молотов!" # Vyacheslav Molotov has assumed control of the Soviet Union. Firmly believing in a strong state leading the revolution, this man vows to continue the work of Lenin by implementing policies like scientific management, a restructering of education, an etablishment of a personality cult and starting collectivization. Long live Premier Molotov!
 SOV_etablish_VSNKh: "Создать ВСНХ" # Establish the VSNKh
 SOV_etablish_VSNKh_desc: "Премьер Молотов объявил о создании ВСНХ (Верховного Совета Народного Хозяйства). Это будет высшее государственное учреждение по управлению экономикой Советского Союза с правом конфискации и экспроприации." # Premier Molotov has declared the establishment of the VSNKh (the Supreme Soviet of the National Economy, Superior Soviet of the People's Economy). This will serve as the superior state institution for management of the economy of the Soviet Union, with rights of confiscation and expropriation.
 SOV_control_workers: "Контроль труда" # Control Labour
 SOV_control_workers_desc: "Ленинская политика рабочего управления, конечно, имела благие намерения, но обернулась не слишком хорошо. Рабочие советы почти не контролировались, поэтому многие из них стали очагами реакционеризма и опасных идей и никак не способствовали повышению эффективности производства на предприятиях, которые они представляли. Нам нужно больше контролировать советы, чтобы иметь возможность направить их в правильное политическое русло." # Lenin's policy of workers' management certainly had good intentions, but didn't turn out too well. The workers' councils were barely supervised, so many of them became hotspots of reactionarism and dangerous ideas, and helped nothing in improving the production efficiency of the factories they represented. We need to supervise the soviets more, so that we will be able to steer them in the right political direction.
 SOV_five_year_plan_molotov: "Пятилетние планы" # Five-Year Plans
 SOV_five_year_plan_molotov_desc: "ВСНХ, по словам премьера Молотова, приступила к организации подготовки к осуществлению «пятилетнего плана» в самом ближайшем будущем. В течение следующих пяти лет в этом плане будут поставлены очень амбициозные цели по росту промышленного и сельскохозяйственного производства, а также производства электроэнергии. По прошествии этих пяти лет эти квоты должны были быть достигнуты." # The VSNKh, in accordance with Premier Molotov, has begun organizing for the initiation of a 'Five-Year Plan' in the very near future. During the next five years, this plan will set about very ambitious goals for the growth of industrial and agricultural production, as well as the generation of electricity. After those five years, those quotas should have been achieved.
 SOV_scientific_management: "Управление наукой" # Scientific Management
 SOV_scientific_management_desc: "Важно улучшить научный потенциал нашей страны, вкладывая больше средств в исследования и разработки с целью создания более эффективного и надежного технологического отдела." # It's important to improve the scientific potential of our country by putting more funds into research and development, with the goal of a more efficient and sound technological department.
 SOV_collectivization_focus: "Вторая Революция" # The Second Revolution
 SOV_collectivization_focus_desc: "Всеобщая коллективизация, которую продвигает Молотов, получила у большевиков название «Вторая Революция». Её цель — полная социализация земли, оборудования и скота." # The all-out collectivization advocated by Molotov, has gained the name
 SOV_purge_kulaks: "Чистка кулаков" # Purging Kulaks
 SOV_purge_kulaks_desc: "Кулачество своим буржуазным образом жизни и взглядами в огромной степени подорвало нашу политическую власть над деревней и саботирует урожаи по всей стране после революции. Вечеринки хватило! Пришло время конфисковать их земли, присоединить их к существующим коллективам, а кулаков отправить в лагеря перевоспитания, где они смогут научиться становиться настоящими советскими гражданами." # With their bourgeois lifestyle and thoughts, the kulaks have massively undermined our political power over the countryside and are sabotaging harvests all over the country since the Revolution. The party has had enough! It's time to confiscate their lands, add them to the existing collectives, and send the kulaks to re-education camps, where they can learn to become a real soviet citizen.
 SOV_purge_opposition: "Убить оппозицию" # Kill the Opposition
 SOV_purge_opposition_desc: "Противодействие нашей политике ведет в никуда, и сопротивление бесполезно. Сопротивление лишь замедляет поезд советского продвижения: давайте уничтожим наших политических врагов внутри и вне партии!" # Opposition to our policies leads to nowhere, and resistance is futile. Resistance only slows down the train that is soviet advancement: let's destroy our political enemies, inside and outside of the party!
 SOV_personality_cult: "Создать культ личности" # Etablish Personality Cult
 SOV_personality_cult_desc: "История доказала, что русскому народу нужен великий лидер, управляющий им как заботливый отец. Премьер Молотов – именно такой человек, и его нужно изображать именно таким. Для прессы и членов партии будут изданы новые инструкции о том, как описывать любимого лидера и вести себя по отношению к нему." # History has proven that the Russian people need a great leader, ruling over them like a caring father. Premier Molotov is exactly that person, and needs to be portrayed as such. New guidelines will be issued for the press and party members on how to describe and behave towards their beloved leader.
 SOV_conservative_family: "Традиционные ценности" # Strengthening the Traditional Family
 SOV_conservative_family_desc: "К сожалению, революция оказала негативное влияние на традиционную семью: ее авторитет был поставлен под сомнение правительством, различными общественными организациями и молодежными движениями, такими как комсомол. Мы должны научить и детей, и взрослых Советского Союза вновь уважать традиционную семью." # The revolution has unfortunately caused a negative influence on the traditional family, with its authority being questioned by the government, a variety of social organisations and youth movements like the Komsomol. We must teach both the children and adults of the Soviet Union to respect the traditional family once again.
 SOV_restructering_education: "Реструктуризация образования" # Restructering Education
 SOV_restructering_education_desc: "Образование – ключ к светлому будущему. Вот почему нам необходимо адаптировать нашу систему образования к потребностям этого десятилетия, уделяя больше внимания наукам и теориям Ленина и Молотова." # Education is the key to a bright future. That's why we need to adjust our education system to the needs of this decade with a greater focus on the sciences and the theories of Lenin and Molotov.
 SOV_cult_machine: "Культ машины" # Cult of the Machine
 SOV_cult_machine_desc: "Без своей машины рабочий был бы никем. Без рабочих наша страна была бы ничем. Важность промышленных и сельскохозяйственных машин для нашей страны нельзя недооценивать, каждому важно осознавать, что они необходимы для нашего экономического роста." # Without his machine, a worker would be nothing. Without the workers, our country would be nothing. The importance of industrial and agricultural machines for our country is not to be underestimated, it's important for everyone to realize that they are indispensable for our economic growth.
 #Yehzov 
 SOV_Premier_Yezhov: "Премьер Ежов" # Premier Yezhov
 SOV_Premier_Yezhov_desc: "Николай Ежов вышел победителем из недавней борьбы за власть в Советском Союзе. Он будет контролировать образование детей, вводить «внутренний паспорт», запрещающий людям без него покидать свой город, бороться с религией и работать над установлением культа личности." # Nikolaï Yezhov has emerged victorious from the recent power struggles in the Soviet Union. He will control the education of children, implement an “internal passport” which prohibits people without it from leaving their city or town, fight religion and work to establish a personality cult.
 SOV_grand_cleanse: "Великое очищение" # Grand Cleansing
 SOV_grand_cleanse_desc: "Недавняя борьба за власть в партии еще раз доказала, что сама партия полна пагубных влияний, разрушающих единство нашей страны. Они представляют собой очень большую угрозу, с которой необходимо быстро справиться." # The recent power struggles in the party have proven once again that the party itself is full of pestilent influences who ruin the unity of our country. They are a very big threat that needs to be dealt with, quickly.
 SOV_public_executions: "Публичные казни" # Public Executions
 SOV_public_executions_desc: "Предатели нашей страны должны понести максимально возможное наказание: смерть. Принятие этого наказания перед массами не только фактически искоренит предателей, но и даст понять всем классовым предателям и реакционерам, что смерть — это единственная судьба, ожидающая их, если они не примут революцию. Смерть тем, кто выступает против Родины и товарища Ежова!" # The traitors of our country need to be given the greatest possible punishment: death. Enacting this punishment before the masses will not only actually root the traitors out, but will make it clear to all class traitors and reactionaries that death is the only fate awaiting them should they not embrace the revolution. Death to those who stand against the motherland and Comrade Yezhov!
 SOV_wither_away_education: "Отмирание школы" # Withering the School Away
 SOV_wither_away_education_desc: "Классическая система образования — это коварный буржуазный институт, отрицательно влияющий на наших детей. Это неприемлемо в настоящем социалистическом государстве, поскольку следующее поколение должно быть таким же решительным сторонником социалистических идеалов, как и предыдущее. Дебуржуазизировать нашу систему образования — значит способствовать будущему революции!" # The classic educational system is a perfidious bourgeois institution that negatively influences our children. This is unacceptable in a proper socialist state, seeing as the next generation should be as strong upholders of socialist ideals as the previous one. To de-bourgeoisify our education system is to promote the future of the revolution!
 SOV_end_freedom_movement: "Положить конец свободе передвижения" # End Freedom of Movement
 SOV_end_freedom_movement_desc: "Предоставление нашим гражданам свободы передвижения — это нелепая практика, которая сильно вредит Союзу. Что, если они планируют вывести из строя промышленное оборудование? Что, если они планируют украсть урожай фермы? Что, если они иностранные шпионы? Мы не можем этого допустить! Таким образом, мы должны создать внутреннюю систему поездок, которая будет контролировать и ограничивать передвижение между городами, что облегчит сдерживание врагов государства." # Allowing our citizens freedom of movement is a ridiculous practice, which greatly hurts the Union. What if they plan to sabotage industrial equipment? What if they plan to steal the harvest of a farm? What if they are foreign spies? We can't allow this! Thus, we should set up an internal travel system which controls and restricts movement between cities, making it easier to contain enemies of the state.
 SOV_control_children: "Контролировать образование детей" # Control the Education of Children
 SOV_control_children_desc: "Чтобы убедиться, что следующее поколение студентов будет лояльно к идеям нашего великого лидера, нам нужно убедиться, что они научатся ценить нашу политическую систему и премьера Ежова. Таким образом, мы будем проводить политику, согласно которой с раннего возраста детям будет разрешено только читать книги о Ежове и партии, петь песни о Ежове и партии и писать о Ежове и партии! Любовь ребенка к Ежову должна быть больше всякой другой любви!" # To make sure the next generation of students is loyal to the ideas of our great leader, we need to make sure they learn to appreciate our political system and Premier Yezhov. As such, we will enact policies that make it so from a young age, children are only allowed to read books about Yezhov and the party, sing songs about Yezhov and the party and write about Yezhov and the party! A child's love for Yezhov should be greater than any other love!
 SOV_state_atheism: "Государственный атеизм" # State Atheism
 SOV_state_atheism_desc: "Бог мёртв. Он бессмыслен и чужд социализму. Религия — это опиум для народа, оказывающий пагубное влияние на массы по всей стране. Нам следует исправить чрезмерную мягкость ленинского периода и принять самые решительные меры. Мы должны закрывать церкви, мечети и синагоги, преследовать духовенство и навсегда покончить с любым религиозным обучением."
 SOV_hang_up_portraits: "Премьер всегда рядом" # Hang Up Portraits
 SOV_hang_up_portraits_desc: "Мы разместим портреты нашего любимого лидера на каждой ферме, в каждом доме, в каждом классе, на каждой лодке и в каждом заводском цеху. Наверняка людям это понравится, как они любят своего лидера." # We will place portraits of our beloved leader in every farm, every house, every classroom, every boat and every factory hall. Surely the people will love this, just like they love their leader.
 SOV_yezhov_constitution: "Ежовская Конституция" # Yezhov Constitution
 SOV_yezhov_constitution_desc: "Конституция, написанная при Ленине, сильно устарела и требует как можно скорее замены. Премьер Ежов назначил комитет, который напишет эту новую конституцию, разумеется, под наблюдением и окончательным контролем самого премьера Ежова." # The constitution written under Lenin is severely outdated and needs to be replaced as soon as possible. Premier Yezhov has appointed a committee who will write this new constitution, under supervision and final control of Premier Yezhov himself, of course.
 SOV_carrot_and_stick_reforms: "Реформа «кнута и пряника»" # Carrot and Stick Reforms
 SOV_carrot_and_stick_reforms_desc: "Обещая рабочим лучшую жизнь и больше потребительских товаров, если они будут работать усерднее, мы можем продолжать требовать от них работать еще усерднее. Награды, конечно, будут позже." # By promising the workers a better life and more consumer goods if they work harder, we can keep asking them to work harder and harder. The rewards will come later, surely.
 #Voroshilov 
 SOV_Premier_Voroshilov: "Премьер Ворошилов" # Premier Voroshilov
 SOV_Premier_Voroshilov_desc: "Премьер Ворошилов взял на себя задачу избавиться от дурного влияния на Родину и тем расширил свой авторитет как премьер. Его премьерство ознаменует новую эру социализма с военными характеристиками, в которой Родина, наконец, станет достаточно сильной, чтобы поддержать себя в военном отношении против зла реакционеризма и измены." # Premier Voroshilov has taken upon himself to get rid of bad influences on the motherland and has thus expanded his authority as Premier. His premiership will herald a new era of socialism with military characteristics, wherein the motherland will finally be strong enough to support itself militarily against the evils of reactionarism and treason.
 SOV_militarize_education: "Милитаризация образования" # Militarization of the Education
 SOV_militarize_education_desc: "В нашей нынешней системе образования не хватает одного: научить детей быть полноценными гражданами, вносящими вклад в Советское государство! И, конечно же, нет лучшего способа научить детей служить своей стране, чем буквально научить их служить своей стране. Таким образом, каждая школа будет построена по образцу военных академий, чтобы все советские дети выросли гордыми, сильными и преданными!" # Our current educational system lacks one thing: teaching children how to be proper citizens that contribute to the Soviet state! And, of course, there is no better way to teach children how to serve their country other than literally teaching them how to serve their country. Thus, every school will be shaped in the style of military academies so that all Soviet children are raised proud, strong and loyal!
 SOV_all_hail_the_army: "Военизированное общество" # Militarized Society
 SOV_all_hail_the_army_desc: "Настоящий авангард революции – не партия! Настоящий авангард революции — Красная Армия! Если товарищ Ленин был мозгом революции, то вооруженные силы — ее руки и ноги! Без Красной Армии Красное Государство было бы ничем! Это неоспоримые истины, которые должен знать каждый истинный большевик. Члены партии, народ и нация должны быть всегда благодарны своим военным товарищам, рискующим своей жизнью, сражаясь за социализм на передовой линии войны." # The true vanguard of the revolution isn't the party! The true vanguard of the revolution is the Red Army! If Comrade Lenin was the brain of the revolution, then the armed forces are its hands and feet! Without the Red Army, the Red State would be nothing! These are the undeniable truths that every true Bolshevik should know. The party members, the people and the nation must be always grateful for their military comrades that risk their lives fighting for socialism in the frontlines of war.
 SOV_every_man_a_soldier: "Призыв для всех" # Conscription For All
 SOV_every_man_a_soldier_desc: "От Сибири до Кавказа и Москвы каждый взрослый человек будет призван на военную службу. Независимо от национальности, профессии, пола или происхождения, если мужчина или женщина являются советскими гражданами, их обязанность – отслужить или понести наказание, достойное тех предателей, которыми они являются." # From Siberia to the Caucasus to Moscow, every adult will be up for conscription. Regardless of their ethnicity, profession, gender or background, if a man or woman is a Soviet citizen, it is in their duty to serve or face punishment worthy of the traitors they are.
 SOV_an_economy_for_the_army: "Расширить финансирование армии" # Expand Funding of the Army 
 SOV_an_economy_for_the_army_desc: "Чтобы провозгласить новую эпоху военного социализма, мы должны увеличить финансирование Красной Армии." # To herald the new age of military socialism, we should increase funding of the Red Army.
 SOV_food_for_the_army: "Еда для армии" # Food for the Army
 SOV_food_for_the_army_desc: "Армия без еды подобна армии без оружия. Наши солдаты должны быть здоровыми и сильными, если мы хотим победы СССР. Таким образом, мы должны начать реализацию большой мобилизационной политики в сельском хозяйстве, которая значительно увеличит наше сельскохозяйственное производство." # An army without food is like an army without weapons. Our soldiers must be healthy and strong if we wish for the USSR to triumph. Thus, we should begin the implementation of a large agricultural mobilization policy that will thoroughly increase our agricultural output.
 SOV_expand_funding_of_the_army: "Великое логистическое расширение" # Great Logistical Expansion
 SOV_expand_funding_of_the_army_desc: "Для поддержания расширенной и укрупненной Красной Армии, которую мы планируем построить, потребуется более надежная инфраструктура и система материально-технического снабжения. Таким образом, начнется масштабная перестройка нашей экономики во всех отраслях, которые связаны с содержанием Красной Армии, а также ее солдат и групп поддержки." # To sustain the expanded and enlarged Red Army that we plan to build, a more robust infrastructure and logistical system will be needed. Thus, a massive overhaul of our economy will begin in all sectors that are tied to the upkeep of the Red Army, as well as its soldiers and support groups.
 SOV_red_army_is_the_strongest: "Красная Армия – самая сильная" # The Red Army is the Strongest
 SOV_red_army_is_the_strongest_desc: "Красная Армия – сильнейшая! Красная Армия – сильнейшая! Красная Армия – сильнейшая! Кричите вместе с нами, товарищи, чтобы наши враги, услышав наших гордых солдат со всего поля боя, обмочили штаны и разбежались к своим маленьким буржуазным мамочкам, как мелкие трусы!" # The Red Army is the Strongest! The Red Army is the Strongest! The Red Army is the Strongest! Shout with us comrades, so that our enemies, hearing our proud soldiers from across the battlefield, will wet their pants and run away to their little bourgeois mommies like the petty cowards they are!
 SOV_an_army_with_a_state: "Армия с государством" # An Army with a State
 SOV_an_army_with_a_state_desc: "Чтобы обеспечить истинный успех революции, застойная гражданская бюрократия и администрация СССР должны быть искоренены и заменены военной администрацией, которая вращается вокруг продвижения военных ценностей и содержания вооруженных сил. Только сделав это, мы сможем создать Советский Союз, который сможет противостоять объединенным силам капитализма." # To ensure the true success of the revolution, the stagnant civil bureaucracy and administration of the USSR should be withered away and replaced with a military administration that revolves around the promotion of military values and the upkeep of the military. Only by doing this may we create a Soviet Union that can stand against the unified forces of capitalism.
 #Tukhachevksy 
 SOV_Premier_Tukhachevsky: "Премьер Тухачевский" # Premier Tukhachevksy
 SOV_Premier_Tukhachevsky_desc: "Премьер Тухачевский назначил себя премьером и теперь работает над защитой государства от внешней и внутренней оппозиции. В своей новой администрации он обещает обеспечить более централизованный контроль над экономикой, наблюдая за передачей власти от советов государству, и в то же время продвигая больше прав и ролей для профсоюзов, которые являются одними из его крупнейших сторонников." # Premier Tukhachevsky has assigned himself as Premier and now works to secure the state against foreign and domestic opposition. In his new administration, he promises to bring forth a more centralized control over the economy, overseeing as such the removal of power from the soviets to the state, while at the same time promoting more rights and roles for the trade unions, who are amongst his greatest supporters.
 SOV_install_pro_tukhachevsky: "Бюрократическая реорганизация" # Bureaucratic Reorganization
 SOV_install_pro_tukhachevsky_desc: "Первым шагом, который предпримет Тухачевский, будет реорганизация и переуправление бюрократии, направленная таким образом на то, чтобы поставить друзей на высокие посты и лишить всякого подобия власти тех, кто противостоял ему. Делая это, он также будет работать над решением проблем, которые преследуют административную структуру Советского Союза со времен Ленина." # The first step Tukhachevsky will take will be to reorganize and remanage the bureaucracy, working thus to place friends in high places and stripping all semblance of power from those that opposed him. While he does this, he will also work to solve issues that have been plaguing the Soviet Union's administrative structure since Lenin's time.
 SOV_repression: "Подавление оппозиции" # Suppressing the Opposition
 SOV_repression_desc: "Товарищ Тухачевский не тиран, но есть пределы свободы критики в его адрес, чтобы она не нанесла ущерба целостности и единству самого Советского Союза. Таким образом, это всего лишь здравый смысл, что свободы следует ограничивать, а оппозицию уменьшать ради общего блага нашего государства." # Comrade Tukhachevsky is no tyrant but there are limits to the freedom that criticism may be directed onto him, lest they harm the integrity and unity of the Soviet Union itself. Thus, it is only common sense that freedoms should be curtailed and opposition reduced for the common good of our state.
 SOV_give_economy_to_trade_unions: "Соблюдение соглашения с профсоюзами" # Honour our Deal with the Trade Unions
 SOV_give_economy_to_trade_unions_desc: "Как обещал Тухачевский, в Советском Союзе будет проведена социальная и политическая реформа, которая предоставит больше полномочий и прав профсоюзам, которые так мощно поддерживали его премьерство. Это должно не только укрепить администрацию премьера Тухачевского, но и укрепить ленинские идеалы." # As promised by Tukhachevsky, the Soviet Union will be undergo a societal and political reform that gives greater powers and rights to the trade unions that so powerfully supported his premiership. This should not only strengthen Premier Tukhachevsky's administration but also strengthen Leninist ideals.
 SOV_Social_Pact: "Социальный пакт" # The Social Pact
 SOV_Social_Pact_desc: "«Социальный пакт» — это крупная инициатива, которую теперь выдвинет Тухачевский и которая будет направлена ​​на содействие значительному расширению сотрудничества между профсоюзами, советами и правительством. Это должно позволить создать более четкую политическую организацию и более эффективное экономическое и административное управление." # The Social Pact is a large initiative which Tukhachevsky will now bring forth, that will aim at promoting a significant increase in the cooperation between the trade unions, soviets and the government. This should allow for a more clearer political organization and more effective economical and administrative management.
 SOV_price_controls: "Контроль цен" # Price Controls
 SOV_price_controls_desc: "До сих пор Советы имели большое влияние на контроль над экономикой, и это очень сильно затрудняло нашу гражданскую промышленность. В попытке еще больше укрепить власть премьера над экономическим здоровьем Союза, впредь будет введен контроль над ценами, который должен позволить улучшить гражданскую экономику, удовлетворяющую потребности советских граждан." # The soviets have had to much of a say thus far in the control of the economy and this has very much hampered our civilian industry. In an attempt to further consolidate the Premier's power over the economical health of the Union, price controls will be hereforth introduced that should allow for a better civilian economy that satisfies the needs of Soviet citizens.
 SOV_agriculture: "Помощь сельскому хозяйству" # Help the Agriculture
 SOV_agriculture_desc: "Инвестиции в сельское хозяйство являются главной проблемой, которую необходимо решить, чтобы народы СССР могли жить здоровой жизнью, правильно питаться и работать здоровой жизнью. Это, в свою очередь, должно также укрепить наши возможности по расширению нашей промышленности и армии." # Agricultural investment is a chief concern that must be addressed so that the peoples of the USSR may be allowed to live healthy, eat healthy and work healthy. This should in return also bolster our capacity to expand our industry and army.
 SOV_four_year_plan: "Четырехлетний план" # A Four-Year-Plan
 SOV_four_year_plan_desc: "Поскольку Советы теряют контроль над экономикой в ​​пользу Советского правительства, теперь можно должным образом внедрить долгосрочный экономический план. Четырехлетний план представляет собой большую и тщательную волну инвестиций в области добычи ресурсов, производства электроэнергии и промышленного производства в СССР, и через четыре года эти области инвестиций должны были достичь заранее определенных квот." # With the soviets losing a grasp on the economy to the Soviet government, a long-term economical plan can now be properly introduced. The Four-Year-Plan is a large and thorough wave of investment in the areas of resource extraction, electricity generation and industrial output in the USSR, and four years from now should have caused these areas of investment to reach predetermined quotas.
 SOV_increasing_wages: "Закон о трудовом договоре" # Work Contract Law
 SOV_increasing_wages_desc: "Закон о трудовом договоре улучшит работу и образ жизни обычного советского гражданина, позволяя ему жить лучше и в то же время лучше работать. Это стало возможным только благодаря экономической централизации страны под руководством премьера Тухачевского." # The Work Contract Law will see an improvement in the work and lifestyle of the common Soviet citizen, allowing him to live better while also working better. This has only been possible due to the economical centralization of the nation under Premier Tukhachevsky's watch.
 SOV_trade_union_law: "Закон о профсоюзах" # Trade Union Law
 SOV_trade_union_law_desc: "Профсоюзные реформы Тухачевского могут, наконец, завершиться принятием Закона о профсоюзах, который будет четко определять роль и права профсоюзов критиковать и требовать перемен в СССР, одновременно следя за тем, чтобы они не выходили за свои границы и выполняли свои обязательства." # Tukhachevsky's trade union reforms can finally come to a close with the Trade Union Law, which will set about clear roles and rights of trade unions to criticize and request change in the USSR, while also seeing that they do not overstep their boundaries and fulfill their obligations.
 #Shliapnikov 
 SOV_Premier_Shliapnikov: "Премьер Шляпников" # Premier Shliapnikov
 SOV_Premier_Shliapnikov_desc: "После борьбы за власть премьеру Шляпникову удалось вытеснить врагов рабочей оппозиции и занять пост премьера. Он будет работать над дебюрократизацией СССР, усилением рабочего контроля над экономикой и предоставлением профсоюзам новых прав." # After a struggle of power, Premier Shliapnikov has managed to oust the enemies of the Workers' Opposition and has taken over the Premiership. He will work to debureaucratize the USSR, bring forth greater worker control over the economy and bring new rights to the trade unions.
 SOV_equal_rights_female: "Равенство полов" # Gender Equality
 SOV_equal_rights_female_desc: "И женщины, и мужчины могут быть членами пролетариата, и, таким образом, женщинам также должно быть предоставлено представительство и политические права в условиях настоящей диктатуры пролетариата, аналогичной диктатуре мужчин. Во многом согласно этой точке зрения, СССР должен работать над увеличением участия женщин и положить конец неравенству в статусе и власти между мужчинами и женщинами." # Both women and men can be members of the proletariat, and thus women should be also given representation and political rights in a proper dictatorship of the proletariat similar to that of men. Much according to this view, the USSR should therefore work to increase female participation and end the inequality in status and power between men and women.
 SOV_empower_workers: "Расширение прав рабочих" # Empower the Workers
 SOV_empower_workers_desc: "Премьер Шляпников будет тщательно работать над тем, чтобы в СССР рабочие стали настоящей опорой революции и правительства, предоставляя больше самоуправления и политических возможностей для самопредставления всем промышленным рабочим, лишая власти укоренившихся и отчужденных бюрократических элит." # Premier Shliapnikov wil work thoroughly to assure that in the USSR, workers should be the real backbone of the revolution and the government by giving greater self-management and political opportunities for self-representation to all industrial workers, stripping away power from the entrenched and alienated bureaucratic elites.
 SOV_trade_union_economy: "Экономика ВЦСПС" # The Economy to the VTsSPS
 SOV_trade_union_economy_desc: "Всесоюзный Центральный Совет Профессиональных Союзов — коллективная организация, через которую профсоюзы выражают свое мнение. Видя, что социализм может функционировать только в государстве, возглавляемом рабочими, ВЦСПС должен не только восстановить свою независимость, но и получить гораздо больший контроль над экономикой, поскольку только тогда экономика может формироваться в соответствии с желаниями и намерениями рабочих! Диктату следует положить конец и начать совместное управление." # The All-Union Central Council of Trade Unions is the collective organization through which trade unions express themselves. Seeing how socialism can only function in a state led by workers, not only should the VTsSPS regain its independence, it should also be given much greater control over the economy, as only then can the economy be shaped according to the desires and intentions of the workers! The diktats should end and participatory management should begin.
 SOV_heavy_industry_investments: "Инвестиции в тяжелую промышленность" # Heavy Industry Investments
 SOV_heavy_industry_investments_desc: "Новые инвестиции в тяжелую промышленность начнутся благодаря совместным усилиям профсоюзов и государства, а не просто усилиям советов и государства. Ожидается, что это должно привести к значительному увеличению промышленного и экономического производства." # New heavy industry investments will begin under a cooperative effort of trade unions and the state rather than simply an effort of the soviets and the state. Expectations are that this should result in much greater industrial and economical output.
 SOV_workerization_party: "Пролетаризация партии" # Workerization of the Party
 SOV_workerization_party_desc: "Совершенно очевидно, что РКП закрепилась во власти, оторвавшись от пролетариата и проявив к нему полное равнодушие. Мы должны незамедлительно сделать партию прозрачной и начать масштабную чистку от лиц, неспособных выражать волю трудящихся и продвигающих идеи, чуждые интересам рабочего класса." # It is an undeniable fact that the RKP has entrenched itself in the government and has become distant and cold towards the workers. Thus, we shall immediately work to make the party more transparent and begin a large purge of those that are unfit to properly represent the desire of workers and have views that go against the interests of workers.
 SOV_freedom_of_speech_in_the_party: "Свобода слова" # Freedom of Speech
 SOV_freedom_of_speech_in_the_party_desc: "Двери партии должны быть открыты для новых членов, и должны быть услышаны новые голоса, продвигающие возможные альтернативные интерпретации ленинского социализма, независимо от того, противоречат ли они заранее устоявшимся идеям. В конце концов, этот уровень свободы слова не противоречит демократическому централизму или чему-то в этом роде, и мы с уверенностью можем заверить, что ленинизм все еще каким-то образом поддерживается новыми диссидентскими мнениями в РКП." # The doors of the party should be opened to new members and new voices should be heard that promote possibly alternative interpretations of Leninist socialism, regardless if those contradict pre-established ideas. After all, it's not like this level of freedom of speech contradicts democratic centralism or anything like that and we surely can assure that Leninism is still upheld somehow with new dissidenting opinions in the RKP.
 SOV_exclude_peasent_from_power: "Никакой власти крестьянам" # No Power for Peasants
 SOV_exclude_peasent_from_power_desc: "Крестьянство не является полноценной частью пролетарского класса, а потому ему не место в управлении истинно пролетарским государством. Руководить СССР должны города и промышленность, а не массы крестьян, не способные осознать подлинные марксистские идеалы." # The peasantry are not a proper member of the proletarian class and thus have no place in the administration of a true proletarian government. The USSR should be ruled by the cities and industries, not some scores of peasants who do not understand proper Marxist ideals.
 SOV_Syndicalist_State: "Синдикалистское государство" # A Syndicalist State
 SOV_Syndicalist_State_desc: "Шляпников однажды представил себя ленинистом, хотя и сторонником большего представительства рабочих. Теперь, когда его реформы подходят к концу и профсоюзы наконец подтвердили контроль над СССР, занавес на его фасаде закрывается, и становится все более очевидным, что эта его администрация, по сути, деконструировала ленинизм и создала синдикалистское государство, управляемое синдикатами. Мертва авторитарная диктатура пролетариата, да здравствует синдикализм!" # Shliapnikov once portrayed himself as a Leninist, albeit one that supported greater worker representation. Now, as his reforms draw to a close and the trade unions have finally affirmed control over the USSR, the curtain draws to a close on his façade and it becomes ever more clear that this administration of his has essentially deconstructed Leninism and established a syndicalist state, run by syndicates. Dead is the authoritarian dictatorship of the proletariat, long live syndicalism!
 #Trotsky 
 SOV_Premier_Trotksy: "Премьер Троцкий" # Premier Trotsky
 SOV_Premier_Trotksy_desc: "Лев Троцкий вышел победителем из недавней борьбы за власть после смерти Ленина. Троцкий обещает сохранить наследие Ленина, сосредоточив дальнейшее внимание на экспорте революции за границу и сокращении бюрократической волокиты. Удачи, товарищ Троцкий!" # Lev Trotsky has emerged victorious from the recent power stuggle after Lenin's death. Trotsky promises to preserve Lenin's legacy by further focussing on foreign exportation of the revolution, and a reduction of bureaucratic red tape. Good luck, comrade Trotsky!
 SOV_control_economy: "Милитаризация труда" # Militarization of Labour
 SOV_control_economy_desc: "Рабочие важны не только для военной промышленности, но и для армии в целом. Нам необходимо использовать солдат, зачисленных в армию, в промышленность в мирное время. Это гарантирует, что наша страна достаточно подготовлена ​​к следующей неизбежной войне между коммунизмом и капитализмом." # Workers are not only important for the armaments industry, but also for the military in general. We need to use soldiers who are enlisted in the army in the industry in peace time. This makes sure that our country is sufficiently prepared for the next inevitable war between communism and capitalism
 SOV_five_year_plans_trot: "Пятилетние планы" # Five-Year-Plans
 SOV_five_year_plans_trot_desc: "Мы не можем полагаться на полукапиталистическую экономическую систему для подготовки к войне. Мы поставим ряд амбициозных целей перед промышленностью и сельским хозяйством, чтобы укрепить нашу экономику." # We cannot rely on a half-capitalist economic system to prepare ourselves for war. We will set a series of ambitious goals for industry and agriculture, to strengthen our economy.
 SOV_further_modernization: "Дальнейшая модернизация" # Further Modernization
 SOV_further_modernization_desc: "Несмотря на то что мудрое руководство Ленина принесло много пользы, наша промышленность во многих отраслях всё ещё остается устаревшей. Крайне важно исправить это положение, укрепив нашу экономику и сделав производственный процесс более эффективным." # Despite the fact that a lot was improved under Lenin's wise rule, our industry is still outdated in many cases. It is vital that we improve this, and thus strengthen our economy and make the production process more efficient.
 SOV_dekulikasation: "Раскулачивание" # Dekulakisation
 SOV_dekulikasation_desc: "Кулачество уже десятилетия осуществляет свое буржуазное влияние на деревню. Нам абсолютно необходимо решить эту проблему, перевоспитывая кулаков и интегрируя их в нормальный рабочий класс, а также перераспределяя землю в пользу более бедных фермеров." # The kulaks are exercising their bourgeois influence over the countryside for decades now. We absolutely need to tackle this problem by re-educating the kulaks and integrating them in the normal working class, and by redistributing land to poorer farmers.
 SOV_fight_against_bureaucracy: "Борьба с бюрократизмом" # Fight against Bureaucracy
 SOV_fight_against_bureaucracy_desc: "Из-за разрастания ВКП(б) и огромных полномочий партии бюрократическая волокита за последние десятилетия значительно усилилась. Это подрывает авторитет партии и отрывает её от рядовых трудящихся. Мы должны оптимизировать наш аппарат!" # Because of the size of the CPSU and the great number of authorities the party has, bureaucratic red tape has increased a lot the last decades. This has a bad influence on the credibility of the party and deconnects the party from the normal working citizen. We need to streamline our bureaucracy!
 SOV_purge_dissent: "Устранение инакомыслия" # Purge Dissent
 SOV_purge_dissent_desc: "Инакомыслие и реакционеризм по-прежнему повсюду в нашей стране и наносят ущерб общей стабильности и имиджу партии. Необходимо стабилизировать Советский Союз, наказав инакомыслящих." # Dissent and reactionarism are still everywhere in our country, and are detrimental to the general stability and image of the party. It's necessary to stabilize the Soviet Union by punishing the dissentors.
 SOV_peasants_alliance: "Союз с крестьянами" # Alliance with the Peasants
 SOV_peasants_alliance_desc: "Многие крестьяне нашей страны — не враги нам, они наши союзники, наши товарищи. С их поддержкой (и с нашей поддержкой для них) мы создаём нерушимый союз между деревней и городом, между крестьянином и рабочим." # The many peasants of this country are not our enemies, they are our allies, our comrades. With their support (and our support for them), we are creating an extremely strong alliance between countryside and city, between farmer and worker.
 SOV_use_mass_media: "Использовать СМИ" # Using Mass Media
 SOV_use_mass_media_desc: "Газеты, радио и книги — все это средства массовой информации, которые можно использовать для повышения популярности наших политических идей и поощрения поддержки политики премьера Троцкого. Если мы повлияем на эти СМИ, мы определенно сможем это сделать." # Newspapers, radio and books are all media that can be used to boost the popularity of our political ideas and to encourage support for the policies of Premier Trotsky. If we influence those media, we can definetely do this.
 #Bukharin 
 SOV_Premier_Bukharin: "Премьер Бухарин" # Premier Bukharin
 SOV_Premier_Bukharin_desc: "Николай Бухарин взял на себя управление Советским Союзом. Его приоритетами являются расширение советской внутрипартийной демократии, расширение творческих свобод и продолжение ленинской экономической политики рабочего представительства. Удачи, товарищ Бухарин!" # Nikolaï Bukharin has assumed control over the Soviet Union. His priorities are expanding soviet inner party democracy, expanding artistic freedoms, and continue Lenin's economic policies of workers' representation. Good luck, comrade Bukharin!
 SOV_inner_party_democracy: "Укрепление внутрипартийной демократии" # Strengthen Inner-Party Democracy
 SOV_inner_party_democracy_desc: "Наша внутрипартийная демократия гарантирует, что каждая группа, представленная в партии, имеет равный голос на съездах. Это жизненно важно для поощрения и сохранения общего участия людей, зная, что люди в их положении и в их классе являются членами партии и могут определять политику." # Our inner-party democracy ensures that every group represented in the party, has an equal voice during congresses. This is vital in order to encourage and conserve general participation of the people, knowing that people in their situation and of their class are members of the party and can determine policy.
 SOV_decrease_bureaucracy: "Снижение бюрократии" # Decrease Bureaucracy
 SOV_decrease_bureaucracy_desc: "Бюрократическая волокита – это большая и острая проблема в этой стране, и нам необходимо ее решить. Нам следует сократить размер бюрократической системы и рационализировать ее, чтобы обеспечить ее эффективность." # Bureaucratic red tape is a big and pressing issue in this country, something we need to adress. We should reduce the size of the bureaucratic system and streamline it, in order to secure its efficiency.
 SOV_agreements_trade_unions: "Соглашения с профсоюзами" # Agreements with the Trade Unions
 SOV_agreements_trade_unions_desc: "Our relations with the Trade Unions are very important in order to secure support of the working class of our country. If we make an effort to appear benevolent to those trade unions, we will be able to boost our popularity." # Our relations with the Trade Unions are very important in order to secure support of the working class of our country. If we make an effort to appear benevolent to those trade unions, we will be able to boost our popularity.
 SOV_fight_reactionaries: "Борьба с реакционерами" # Fighting the Reactionaries
 SOV_fight_reactionaries_desc: "К сожалению, спустя более чем два десятилетия после Октябрьской революции внутри нашей страны все еще можно найти много реакционеров, которые негативно влияют на наше экономическое развитие и популярность. Нам необходимо решить эту проблему как можно скорее, пока она не стала слишком большой." # Sadly, more than two decades after the October Revolution, there are still a lot of reactionaries to be found inside our country, negatively influencing our economical development and popularity. We need to tackle this problem as soon as possible, before it becomes too big.
 SOV_support_marxist_pluralism: "Свобода прессы!" # Free the Press!
 SOV_support_marxist_pluralism_desc: "Свобода прессы была ограничена при Ленине, когда капиталистическое влияние внутри и за пределами страны поставило под угрозу само существование молодого советского государства. Однако внутренняя и внешняя ситуация по сравнению с тем временем гораздо более стабильна, поэтому мы можем позволить себе дать прессе больше свободы." # Press freedom was reduced under Lenin, when capitalist influence from inside and outside the country threatened the very existance of the young soviet state. However, the internal and external situation is much more stable compared to then, so we can afford to give the press some more freedoms.
 SOV_improve_conditions_of_workers: "Улучшить условия рабочих" # Improve Conditions of Workers
 SOV_improve_conditions_of_workers_desc: "Улучшение условий труда рабочих было одним из главных обещаний КПСС после Октябрьской революции, хотя оно и не было в достаточной мере выполнено. Нам необходимо улучшить эти условия, чтобы выполнить это обещание и заручиться большей поддержкой для нашей партии." # The improvement of workers' conditions was one of the biggest promises of the CPSU after the October Revolution, though this was unsufficiently realised. We need to improve those conditions to fulfill this promise and to garner more support for our party.
 SOV_accilerate_industrialization: "Ускорить индустриализацию" # Accelerate Industrialization
 SOV_accilerate_industrialization_desc: "На расширение промышленности после революции были вложены огромные деньги, хотя, по мнению премьера Бухарина, недостаточные. Бухарин говорит, что хочет инвестировать все больше и больше не только в военную промышленность, но и в гражданскую промышленность." # An enormous amount of money was put into the expansion of industry after the revolution, though in the opinion of Premier Bukharin, not enough. Bukharin says he wants to invest more and more, not only in the armaments industry, but also in civilian industry.
 SOV_education: "Улучшить образование" # Improve Education
 SOV_education_desc: "Образование в нашей стране уже значительно улучшилось после революции, но мы еще не в идеальной ситуации. Необходимо много инвестировать в качество образования, его масштабы и расширение высшего образования: больше людей должно иметь возможность начать обучение в университетах." # Education in our country has already improved a lot since the revolution, but we're not still at an ideal situation. There is a lot to be invested in the quality of education, the extent of it, and the expansion of higher education: more people should be able to start studying on universities.
 #Military Coup 
 SOV_military_coup: "Мартовский переворот" # March Coup
 SOV_military_coup_desc: "Мартовский переворот обезопасит СССР!" # The March Coup will secure the USSR!
 SOV_control_police: "Контроль над милицией" # Control the Militsiya
 SOV_control_police_desc: "Милиция — это полиция в Советском Союзе, и контроль над ней имеет первостепенное значение для успеха нашего захвата власти." # The Militsiya is the police in the Soviet Union and controlling them is primary for the success of our takeover.
 SOV_stabilize_government: "Стабилизировать правительство" # Stabilize the Government
 SOV_stabilize_government_desc: "Ни в каких ветвях и ведомствах правительства не должно быть разногласий против прихода Тухачевского к власти." # There should be no dissidence within any branches or departments of the government against Tukhachevsky's takeover.
 SOV_purge_local_opposition: "Чистка оппозиции" # Purge the Opposition
 SOV_purge_local_opposition_desc: "Внесудебное заключение, шантаж, отстранение от власти. Мы сделаем все необходимое, чтобы гарантировать, что Союз не распадется под натиском реакционизма или фракционности." # Extrajudicial imprisonment, blackmailing, removal from power. We shall do whatever deemed necessary to ensure that the Union does not fall apart to reactionarism or factionalism.
 SOV_lockdown_congress: "Разгон Съезда Советов" # Lockdown the Congress of Soviets
 SOV_lockdown_congress_desc: "Съезд начал вести себя нахально, и поэтому вполне логично, что они тоже почувствовали вкус власти." # The Congress has started to act uppity, and thus it is only logical they get a taste of authority as well.
 SOV_regain_control_unloyal_divisions: "Подчинить нелояльные дивизии" # Regain Control of Unloyal Divisions
 SOV_regain_control_unloyal_divisions_desc: "Военные должны быть едины!" # The military should be united as one!
 SOV_supress_protests: "Подавление протестов" # Suppressing Protests
 SOV_supress_protests_desc: "Протест? Только не под бдительным надзором товарища Тухачевского." # Protesting? Not under the watchful eye of Comrade Tukhachevksy.
 SOV_moscow_secured: "Москва в безопасности" # Moscow Is Secured
 SOV_moscow_secured_desc: "Похоже, что после долгой борьбы и конфликтов Москва наконец-то прочно оказалась в наших руках. Теперь нам следует двинуться за пределы страны, чтобы защитить Союз от троцкистской угрозы." # It appears that after much struggle and conflicts, Moscow is finally firmly within our grasp. We should now move outwards into the country to protect the Union from the Trotskyite menace.
 SOV_move_westwards: "Продвижение на запад" # Moving Westwards
 SOV_move_westwards_desc: "Восстановить власть на западе, на подступах к Белоруссии и Украине." # Restore authority westwards, into the proximities of Belarus and Ukraine.
 SOV_Kaluka_is_ours: "Освободить Калугу" # Free Kaluga
 SOV_Kaluka_is_ours_desc: ""
 SOV_bryansk_march_onwards: "Марш на Брянск" # March Onwards onto Bryansk
 SOV_bryansk_march_onwards_desc: ""
 SOV_Tula: "Вернуть Тулу" # Retake Tula
 SOV_Tula_desc: ""
 SOV_Orel: "Вернуть стабильность в Орёл" # Return of Stability to Orel
 SOV_Orel_desc: ""
 SOV_Kursk: "Освободить Курск" # Liberate Kursk
 SOV_Kursk_desc: ""
 SOV_move_northwards: "Продвижение на север" # Move Northwards
 SOV_move_northwards_desc: "Восстановить власть на севере, в направлении Ленинграда и границ Финляндии." # Restore authority northwards, towards Leningrad and the proximities of Finland
 SOV_take_rezhev: "Взять Ржев" # Take Rezhev
 SOV_take_rezhev_desc: ""
 SOV_move_into_smolensk: "Занять Смоленск" # Move into Smolensk
 SOV_move_into_smolensk_desc: ""
 SOV_liberate_kalinin: "Освободить Калинин" # Liberate Kalinin
 SOV_liberate_kalinin_desc: ""
 SOV_bordering_dnieper: "Занять провинции у Днепра" # Take the Provinces at the Dnieper
 SOV_bordering_dnieper_desc: ""
 SOV_Lava: "К реке Лаве!" # To the Lava River!
 SOV_Lava_desc: ""
 SOV_restoring_order_leningrad: "Восстановление порядка в Ленинграде" # Restoring Order in Leningrad
 SOV_restoring_order_leningrad_desc: ""
 SOV_move_southwards: "Продвижение на юг" # Move Southwards
 SOV_move_southwards_desc: "Восстановить власть на юге, в направлении Кавказа." # Restore authority southwards, towards the Caucasus.
 SOV_pacifying_ryazan: "Умиротворение Рязани" # Pacifying Ryazan
 SOV_pacifying_ryazan_desc: ""
 SOV_march_continues: "Марш продолжается" # The March Continues
 SOV_march_continues_desc: ""
 SOV_don_volga: "За Волгу и Дон" # After the Volga and the Don
 SOV_don_volga_desc: ""
 SOV_partially_order_restored: "Порядок частично восстановлен" # Order Partially Restored
 SOV_partially_order_restored_desc: "Тухачевскому удалось взять под контроль большую часть страны, но очаги сопротивления всё ещё остаются." # Tukhachevksy has succeeded in taking over most of the country, but pockets of resistance still remain.
 SOV_free_karelia: "Покончить с анархией в Карелии" # End the Anarchy in Karelia
 SOV_free_karelia_desc: ""
 SOV_move_eastwards: "Продвижение на восток" # Moving Eastwards
 SOV_move_eastwards_desc: "Остаётся только Восток. Восстановить власть на востоке, в направлении Сибири и оплотов белогвардейской реакции." # All that remains is the East. Restore authority eastwards, towards Siberia and the proximities of the White Russian reactionaries.
 SOV_march_to_the_urals: "Марш на Урал" # March to the Urals
 SOV_march_to_the_urals_desc: ""
 SOV_finish_the_traitors: "Покончить с предателями" # Finish the Traitors
 SOV_finish_the_traitors_desc: "Последние остатки сопротивления, а также заговоры троцкистов и антисоветчиков окончательно ликвидируются." # The last remnants of resistance and the plotting of the Trotskyites and anti-Soviets are finally being purged and dealt with.
 SOV_Restore_Order_Ciscaucasia: "Порядок на Дальнем Юге" # Order in the Far South
 SOV_Restore_Order_Ciscaucasia_desc: ""
 SOV_nation_reunited: "Нация воссоединилась" # The Nation Reunited
 SOV_nation_reunited_desc: "Наконец троцкисты, антисоветчики и заговорщики устранены и фракционирование Союза закреплено. Родина крепка!" # At last, the Trotskyites, anti-Soviets and conspirators have been eliminated and the fractioning of the Union has been fixed. The motherland stands strong!
 #Army 
 SOV_red_army: "«На земле," # 'On the Land,
 SOV_red_army_desc: "РККА, известная просто как Красная Армия, — легендарная и незапамятная армия СССР. Созданная после Октябрьской революции 1917 года, она с тех пор продолжала хорошо и эффективно служить Союзу и отвечала за отпор реакционерам и капиталистам на Востоке и Западе. Однако армия остро нуждается в реформировании и модернизации, и, несмотря на все усилия Ленина по ее модернизации, ее вооружение и техника в значительной степени устарели и неисправны по сравнению с сегодняшними стандартами." # The RKKA, known simply as the Red Army, is the legendary and immemorial army of the USSR. Created after the 1917 October Revolution, it has continued to serve the Union well and effectively since then and has been responsible for warding off the reactionaries and capitalists in the East and West. However, the Army is in drastic need of reform and modernization, and despite Lenin's best efforts in modernizing it, its armaments and vehicles are largely outdated and faulty compared to today's standards.
 SOV_guns: "Модернизация вооружения" # Modernization of Armaments
 SOV_guns_desc: "Красная Армия отстает от мира по качеству и надежности своих орудий. Поэтому уместно немедленно обновить и пересмотреть их." # The Red Army lags behind the world in terms of the quality and reliability of its guns. Thus, it is pertinent that we immediately update and overhaul them.
 SOV_artillery_expansions: "М-10" # M-10
 SOV_artillery_expansions_desc: "М-10 — творение коллектива Мотовилихинского механического завода под руководством конструктора Ф. Ф. Петрова. Эта конструкция гаубицы является ярким примером советского военного качества и социалистического прогресса в области науки и войны." # The M-10 is a creation of the Motovilikha Mechanical Plant team under the guidance of designer F. F. Petrov. This howitzer design is the highlight of Soviet military quality and socialist progress in the areas of science and warfare.
 SOV_new_tanks: "Адаптировать импортные танки" # Adapt Foreign Armour
 SOV_new_tanks_desc: "В Красной Армии мало танков, и даже те, что есть, либо устарели, либо неисправны. Решением этой проблемы является изучение опыта зарубежных стран, обладающих более развитыми танковыми технологическими институтами, чем у нас, и последующее усовершенствование их разработок." # The tanks in the Red Army are few and even those that are around are either outdated or faulty. A solution to that problem is to learn from foreign countries which have better tank technological institutions than we do and then improve on their designs.
 SOV_anti_tank: "Подготовить орудия ПТО" # Anti-Tank Preparations
 SOV_anti_tank_desc: "Валькистские и британские империалисты на Западе жадно смотрят на наши территории и наше государство. Создание и совершенствование наших противотанковых вооружений является необходимостью, чтобы мы могли противостоять любым их идеям." # The Valkist and British imperialists in the West look hungrily at our territories and our state. Constructing and improving on our anti-tank armaments is a necessity so we can oppose any ideas they might have.
 SOV_expand_military_factories: "Военная машина" # The Military Machine
 SOV_expand_military_factories_desc: "От Брянска до Урала советские военные комплексы усеивают ландшафт и производят самую впечатляющую военную технику. Действительно, ленинские идеи военизированной экономики во многом способствовали успеху красных орудий и красных транспортных средств. Однако это не означает, что наша военная промышленность не может использовать большие инвестиции и капитальный ремонт, чтобы массовое производство Красной машины никогда не прекращало снабжать революцию оружием." # From Bryansk to the Urals, Soviet military complexes dot the landscape and produce the most aweing of military equipment. Indeed, Lenin's ideas of a militarized economy greatly contributed to the success of Red guns and Red vehicles. However, that does not mean that our military industries could not use a greater investment and overhaul so that the mass-producing Red Machine may never stop supplying the revolution with weaponry.
 SOV_mobile_warfare: "Мобильная война" # Mobile Warfare
 SOV_mobile_warfare_desc: "В наших рядах появилось предложение о новой военной политике, которая фокусируется на инвестициях в бронетанковую и механизированную технику и сочетает их с доктринами быстрой молнии, чтобы получить преимущество в конфликтах и ​​добиться успеха в военном отношении. Мы могли бы принять эти идеи и сосредоточиться на быстро развивающихся войнах или поиске другого решения." # A proposal has been raised in our ranks for a new military policy that focuses on investing in armoured and mechanized vehicles and combine those with fast lightning doctrines to gain an edge in conflicts and be militarily successful. We could adopt this ideas and focus on fast-paced wars or search for another solution.
 SOV_planning: "Советская глубокая операция" # Soviet Deep Battle
 SOV_planning_desc: "Теория глубокой операции, выдвинутая Михаилом Тухачевским, делает упор на дезорганизацию и уничтожение противника не на линии фронта, а в оперативной глубине. На данный момент эта доктрина пользуется наибольшим влиянием в Ставке, однако мы всегда можем рассмотреть и другие варианты." # The Soviet Deep Battle is a theory postulated by Mikhail Tukhachevsky that emphasizes on disorganizing and annihilating enemies not during contact but in the depth of the battlefield. Currently, this is the military doctrine most influential and popular in the Stavka, but we could always look for another solution.
 SOV_cult_offensive: "Культ наступления" # Cult of Offense
 SOV_cult_offensive_desc: "Атака, атака, атака и ни шагу назад! Если революция хочет по-настоящему распространиться, наши солдаты должны идти смело и слепо против линий врага, без страха и сомнений, но просто зная, что их жертва гарантирует, что революция и Родина никогда не будут повреждены иностранными врагами." # Attack, attack, attack and not one step back! If the revolution is to truly spread than our soldiers must go bravingly and blindly against the enemy lines, without fear or second thoughts in their mind, but simply knowing that their sacrifice will assure that the revolution and motherland will never be damaged by foreign enemies.
 SOV_school_movement: "Школа манёвров" # School of Movement
 SOV_school_movement_desc: "Большие инвестиции должны быть направлены в Красную Армию для содействия распространению идей быстрого и мобильного боя." # Large investment should be directe to the Red Army in the promotion of the expansion of ideas regarding quick and mobile combat.
 SOV_planning_schools: "Доктринальные инновации" # Doctrinal Innovation
 SOV_planning_schools_desc: "Искусство, наука и многие области обучения могут подвергаться цензуре и ограничениям при ответственной диктатуре пролетариата, но важно, чтобы военные инновации и образование оставались нетронутыми и беспрепятственными на пути к обеспечению победы Союза." # Arts and science and many fields of study may be censored and restricted in a responsible dictatorship of the proletariat, but it is important that military innovation and education remain untouched and unhampered in their path to assuring victory for the Union.
 SOV_engineers: "Инженерные школы" # Engineering Schools
 SOV_engineers_desc: "Во многих ситуациях можно обнаружить, что военный инженер так же важен, как генерал или маршал, в обеспечении успеха распространения революции." # In many situations, one will find that the military engineer is as important as the general or marshal in assuring the success of spreading the revolution.
 SOV_military_science: "Военная наука" # Military Science
 SOV_military_science_desc: "Быстрое и внезапное технологическое развитие, произошедшее в результате Первой мировой войны, ясно показало, что инвестировать в военные исследования — значит инвестировать в общие исследования, и поэтому мы должны постоянно поддерживать прочный военный научный отдел." # The fast-paced and sudden technological developments that came as a result of the First World War made it very clear that to invest into military research is to invest into general research, and thus we must constantly maintain a firm military scientific department.
 SOV_airforce: "в небесах," # In the Skies,
 SOV_airforce_desc: "Наш доблестный сокол не знает преград при выполнении задания. Награды страны – Орден – говорят о смелости нашей отваги. Готов выполнить любой приказ Родины, готов выполнить любой приказ Родины. Дал свою партию, нам крылья и в небо взился наш флот! Держите подальше врагов нашей Родины. Не жалея жизни, мы все будем летать выше и дальше, самоотверженно служа Родине." # Our gallant falcon knows no barriers, when you perform a task. Awards of the country - the Order - is said about the daring of our daring. Ready to run any order that the Homeland gives, ready to execute any order that the Homeland gives. Gave my own party, we the wings and the sky vzilsya our fleet! Keep away the enemies of our Motherland. Sparing no life, we will all fly higher and farther, serving selflessly the Motherland.
 SOV_strategic_destruction: "Красный дождь" # The Red Rain
 SOV_strategic_destruction_desc: "Должны быть созданы эффективные военно-воздушные силы, ориентированные на стратегические бомбардировки и уничтожение ульев промышленников и тех, кто наживается на войне в капиталистических государствах, а также на обрушивание разрушений и террора на правительства буржуазии, которые угнетают и репрессируют рабочих во всем мире." # An effective airforce should be constructed focused on strategically bombarding and destroying the hives of the industrialists and those that profit from war in capitalist states, together with raining destruction and terror upon the bourgeoisie governments that oppress and reppress workers worldwide. 
 SOV_paratroopers: "Создание ВДВ" # Create the Soviet Airborne Troops
 SOV_paratroopers_desc: "В СССР в настоящее время нет отдела десантно-десантных и воздушно-десантных дивизий. Это оставляет нас позади многих стран, которые уже разработали функциональные авиационные службы, или тех стран, у которых есть сильные военно-морские силы, к которым невозможно получить доступ по морю." # The USSR currently does not have a department for parachuting troopers or airborne infantry divisions. This leaves us behind many countries that already have developed functional airbone services or those countries with strong navies that cannot be accessed through sea.
 SOV_expand_air_bases: "Инвестировать в авиабазы" # Invest in Air Bases
 SOV_expand_air_bases_desc: "СССР — огромный союз. Было бы идеально, если бы мы построили авиабазы ​​по всей территории страны и ее границ, чтобы гарантировать, что мы сможем быть готовыми независимо от того, где нас вторгнутся." # The USSR is a vast union. It is ideal that we build air bases all across it and its borders to assure that we may be prepared regardless from where we are invaded.
 SOV_anti_air: "Зенитная стена" # Anti-Aircraft Wall
 SOV_anti_air_desc: "Зенитный огонь гарантирует, что бомбардировщики никогда не смогут свободно пересекать нашу территорию и терроризировать наш народ." # An anti-aircraft barrage will assure that bombers may never cross our territory freely and terrorize our people.
 SOV_expand_production_bombers: "Народные бомбардировщики" # The Peoples' Bombers
 SOV_expand_production_bombers_desc: "К сожалению, бомбардировки уносят жизни ни в чем не повинных рабочих. Однако ради революции народные бомбардировщики должны продолжать строиться и обучаться их пилотам. Таким образом, нам следует начать большую программу строительства бомбардировщиков." # It is an unfortunate part of warfare that bombardment takes the life of innocent workers. However, for the sake of the revolution, the peoples' bombers must continue being built and its pilots trained. Thus, we should begin a large programme of bomber construction.
 SOV_protectors_sky: "Соколы-защитники" # The Sokoly Protectors
 SOV_protectors_sky_desc: "За мужество и мастерство наших советских летчиков называют соколами, а пропаганда изображает их великими защитниками Советской Родины. Действительно, нам следует продолжать продвигать такой имидж и использовать его в качестве пропаганды для набора большего количества пилотов и инвестирования большего количества ресурсов в военно-воздушные силы." # Due to their courage and skill, our Soviet pilots are being called the sokoly (falcons) and propaganda picture them as the great protectors of the Soviet motherland. Indeed, we should continue to promote such an image and use it as propaganda for the recruitment of more pilots and the investment of more resources into the airforce.
 SOV_ground_support: "Наземная поддержка" # Наземная поддержка
 SOV_ground_support_desc: "Наземная поддержка жизненно важна для успеха Красной Армии, и поэтому, чем больше внимания ей будет уделяться, тем успешнее будут наши конфликты." # Ground support is vital to the success of the Red Army and thus the greater attention is given to it, the more successful our conflicts will be.
 SOV_doctrine_advances: "Развитие доктрины" # Doctrinal Advances
 SOV_doctrine_advances_desc: "Обучая наших пилотов новым разработкам в наших доктринах, мы должны добиться более эффективного и успешного воздушного боя." # By teaching our pilots new developments in our doctrines, we should manage for more effective and successful air combat.
 SOV_red_fleet: "на море»" # On the Ocean'
 SOV_red_fleet_desc: "РККФ, известный просто как Красный Флот, является военно-морским родом войск Советских Вооружённых Сил со времен Октябрьской революции. С тех пор, хотя предложенная товарищем Лениным военизированная экономика значительно способствовала развитию военно-морского флота, он все еще отстает по размерам и боевым масштабам от многих западных стран. Если мы намерены по-настоящему расширить Союз и социализм, мы должны работать над устранением этого разрыва." # The RKKF, known simply as the Red Navy, is the naval branch of the Soviet Armed Forces since the October Revolution. Since then, while the militarized economy proposed by Comrade Lenin greatly aided the development of the navy, it still lags behind in size and operational scale than many Western countries. If we intend to truly expand the Union and socialism, we should work to close this gap.
 SOV_marines: "Силы береговой обороны" # Coastal Defense Force
 SOV_marines_desc: "Силы береговой обороны Союза — это наша морская пехота и морская пехота, которые не только хорошо обучены, но и подготовлены и способны сражаться там, где это необходимо, на любой местности." # The Coastal Defense Force of the Union are our marines and naval infantry, which not only are highly trained but prepared and capable to fight wherever necessary in whatever terrain.
 SOV_naval_bomers: "Морские бомбардировщики" # Naval Bombers
 SOV_naval_bomers_desc: "Чтобы отразить потенциальное военное вторжение на наши береговые линии или подорвать любую блокаду, мы должны построить массу бомбардировщиков, специализирующихся на уничтожении кораблей и верфей." # To ward off potential naval invasions on our coastlines, or to undermine any blockades, we should build a mass of bombers specialized in destroying ships and shipyards.
 SOV_battlecruisers: "Программа судостроения" # Naval Shipbuilding Program
 SOV_battlecruisers_desc: "В эту новую эпоху тотальной войны крайне важно построить военно-морской флот, который сможет нарушить линии снабжения и защитить социализм, независимо от того, где он возникнет в мире. Таким образом, должна начаться крупная общенациональная программа военно-морского кораблестроения, направленная на строительство самых высоких и мощных кораблей." # In this new age of total war, it is primary that we construct a navy that can disrupt supply lines and that can safeguard socialism regardless of where it arises in the world. Thus, a large nation-wide Naval Shipbuilding Program must begin, aiming at building the tallest and most powerful of ships.
 SOV_cruisers: "Программа крейсеров" # Cruiser Program
 SOV_cruisers_desc: "Программа крейсеров позволит нам на этот раз расширить нашу программу военно-морского кораблестроения за счет строительства крейсеров." # A cruiser program will allow us to expand upon our Naval Shipbuilding Program with the construction of cruisers this time.
 SOV_destroyers: "Советский линкор" # Soviet Battleship
 SOV_destroyers_desc: "Советский линкор не похож ни на один другой. Это кульминация советских инженерных и механических достижений, несущая в себе надежды и мечты миллионов гордых судостроителей." # The Soviet Battleship is unlike any other. It is the highlight of Soviet engineering and mechanical advancements, and carries with it, the hopes and dreams of millions of proud shipbuilding workers.
 SOV_carriers: "Сила авианосцев" # A Carrier Force
 SOV_carriers_desc: "Авианосцы должны позволить нам расширить наше влияние и мощь в Балтийском море и на Востоке." # Carriers should allow us to expand our influence and might in the Baltic Sea and in the East.
 SOV_dockyards: "Модернизация верфей" # Dockyard Overhaul
 SOV_dockyards_desc: "Продолжая нашу программу военно-морского судостроения, мы пришли к осознанию того, что необходимо будет строить больше и более совершенных верфей, поскольку многие из наших верфей устарели или имеют малые размеры." # As we continue our Naval Shipbuilding Program, a realization has been reached that building more and better dockyards will also be necessary, as many of ours are outdated or small in size.
 SOV_army_air_cooperation: "Сотрудничество РККА и РККВФ" # RKKA-RKKVF Cooperation
 SOV_army_air_cooperation_desc: "РККА и РККВФ не новички в сотрудничестве и совместных операциях, учитывая, что оба когда-то принадлежали к одному и тому же роду войск. Таким образом, официально оформив такое сотрудничество и пройдя минимальную подготовку в этом отношении, мы сможем значительно увеличить наши успехи на поле боя." # The RKKA and the RKKVF are no strangers in collaboration and joint operations, considering both once belonged to the same military branch. Thus, by officializing such cooperation and with very minimal training in those regards, we should be able to greatly increase our successes in the battlefield.
 #Economy 
 SOV_kickstart_industrialization: "Великая индустриализация" # The Great Industrialization Drive
 SOV_kickstart_industrialization_desc: "Все члены партии согласны с тем, что нация нуждается в индустриализации. Таким образом, посредством Великой индустриализации мы осуществим масштабную перестройку советской промышленной сферы и построим крупные предприятия, ориентированные на гражданские товары и нужды." # All the members of the party agree- the nation is in need of industrialization. Thus, through the Great Industrialization Drive, we shall put in place the massive overhaul of the Soviet industrial sphere and the construction of large industries focused around civilian goods and needs.
 SOV_electrification: "План ГОЭЛРО" # GOELRO Plan
 SOV_electrification_desc: "План ГОЭЛРО, впервые спланированный и начатый при товарище Ленине, был планом, направленным на массовую электрификацию Союза путем установки 30 электростанций и многочисленных промышленных предприятий. Поставив конечную цель по достижению производства в 8,8 миллиардов киловатт-час за счет последних крупных инвестиций, мы можем теперь довести план до возможного завершения и достичь необходимого производства." # First planned and begun under Comrade Lenin, the GOELRO Plan was a plan aiming at the massive electrification of the Union, through the installation of 30 power power plants, and numerous industrial enterprises. With an end goal of reaching the production of 8.8 billion kWh, through one last massive investment, we may now bring the plan into a possible closure and achieve that necessary production.
 SOV_peoples_credit: "Народный кредит" # People's Credit
 SOV_peoples_credit_desc: ""
 SOV_railway_expansion: "Расширение железных дорог" # Railway Expansion
 SOV_railway_expansion_desc: "Многие фермы и города по всей стране до сих пор труднодоступны для нашей промышленности. Поэтому необходимо начать масштабное расширение железнодорожного строительства, которое соединит железными дорогами все народы Союза." # Many farms and cities around our nation are still not easily and quickly accessible to our industries. Thus, it is in order that we begin a large-scale expansion of railway construction that shall see railways interconnecting all the peoples of the Union with each other.
 SOV_mechanization: "Механизация" # Mechanization
 SOV_mechanization_desc: "Наша промышленность во многом еще устарела, ей не хватает определенной автоматизации и механизации. Таким образом, мы должны развивать новые, более совершенные механические технологии и стремиться к полной механизации нашей страны." # Our industry is in many ways still outdated and lacks a certain automation and mechanization. Thus, we should develop new and better mechanical technology and aim at implementing the total mechanization of our country.
 SOV_modern_cities: "Урбанизация" # Urbanisation
 SOV_modern_cities_desc: "Огромная часть населения Советского Союза слишком долго оставалась сельской и состояла из крестьян. Чтобы обеспечить более масштабное городское развитие, которое, в свою очередь, в целом приведет к увеличению промышленного производства и научному прогрессу, мы должны создать новую волну урбанизации посредством социальных и экономических стимулов." # A vast part of the Soviet Union's population has remained rural and consisting of peasants for too long. In order to assure greater urban developments that in turn will generally bring greater industrial output and greater scientific progress, we should manufacture a new wave of urbanization through societal and economical incentives.
 SOV_new_gear: "Модернизация промышленного оборудования" # Modern Gear for the Industry
 SOV_new_gear_desc: "С нашей столь необходимой механизацией связана потребность в новых шестернях и зубчатых колесах, а также во всех формах подобных составных частей машин. Улучшение нашей отрасли будет вращаться вокруг улучшения наших механизмов." # Tied into our much needed mechanization, is the need for new gears and cogs and all forms of similar constituent parts of machinery. Improving our industry will revolve around the improvement of our gears.
 SOV_independent_vehicle_industry: "Независимый автопром" # Independent Vehicle Industry
 SOV_independent_vehicle_industry_desc: "Мы должны быть в состоянии производить автомобили и другие транспортные средства без какой-либо иностранной помощи. Это докажет успех Родины и социализма и позволит нам быть независимыми от зарубежных империалистов." # We must be able to produce cars and other vehicles without any foreign assistance. That will prove the success of the motherland and of socialism, and allow us to be independent from the imperialists abroad.
 SOV_modern_war_engine: "Современная военная машина" # A Modern War Machine
 SOV_modern_war_engine_desc: "Союз уже был очень развитой военной машиной. Теперь мы должны сделать его современным, заменив старое, привнеся новое с точки зрения инноваций и технологического развития." # The Union was already a very developed war machine. Now, we must make it a modern one by replacing what is old, bringing in new in terms of innovation and technological development.
 SOV_if_tomorrow_brings_war: "Разбудить русского медведя" # Awaken the Russian Bear
 SOV_if_tomorrow_brings_war_desc: "Русского медведя когда-то боялись на европейском континенте. То, что это проявление нашей страны, означает, что мы должны снова сделать ее опасной и опасной силой, любой ценой." # The Russian Bear was once feared across the European continent. It being the manifestation of our country means that we must make it a perilous and dangerous force once again, no matter the cost.
 SOV_the_whole_people_as_one_will_rise_up: "Расширить военное производство" # Expand the Armament Industry
 SOV_the_whole_people_as_one_will_rise_up_desc: "Наша отечественная военная промышленность должна будет производить больше и лучше, если мы хотим оставаться на переднем крае войны." # Our domestic armament industry will need to produce more and better if we are to remain sharp and on the forefront of warring.
 SOV_industrial_autarky: "Промышленная автаркия" # Industrial Autarky
 SOV_industrial_autarky_desc: "Родина не может полагаться на внешнее! Такова природа Союза и социализма, которую мы должны отстаивать. Таким образом, все промышленное строительство, производство и исследования должны будут перейти в руки наших советских граждан. Слава Родине! Слава Революции!" # The Motherland cannot rely on the outside! That is the nature of the Union and of socialism which we must stand by. Thus, all industrial construction, production and research will have to come through the hands of our Soviet citizens. Glory to the motherland! Glory to the revolution!
 SOV_women_workforce: "Женщин — на завод!" # Include Women into the Workforce
 SOV_women_workforce_desc: "Советские женщины — это не те маленькие и угнетенные девушки, живущие при буржуазных режимах. Если поставить за винтики, то Совет будет работать на благо Союза, независимо от пола." # Soviet women are not the puny and oppressed girls that live under bourgeoisie regimes. When put behind some cogs, the Soviet will work for the sake of the Union, regardless of gender.
 SOV_economic_stimulation: "Стимулирование экономики" # Economic Stimulation
 SOV_economic_stimulation_desc: "Некоторое экономическое стимулирование необходимо для поддержания нашей постоянно растущей и постоянно расширяющейся промышленности и экономики." # Some economic stimulation is necessary to uphold our ever-growing and ever-expanding industry and economy.
 SOV_full_employment: "Полная занятость" # Full Employment
 SOV_full_employment_desc: "Все мужчины и женщины будут работать! У каждого взрослого найдется работа! Такова природа Союза и природа революции. Получив работу, люди останутся счастливыми и останутся трудолюбивыми." # All men and women will work! Every adult will have a job! This is the nature of the Union, and the nature of the revolution. When employed, the people will remain happy and will remain hardworking.
