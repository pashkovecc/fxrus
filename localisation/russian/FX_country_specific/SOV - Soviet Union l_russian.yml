 SOV_KIROV_TAKEOVER: "§HЖена Ленина, Надежда Крупская, представляет съезду письмо Ленина, в котором указывается, что Сергей Киров является его предпочтительным наследником. Чтобы защитить Советский Союз от захвата власти троцикитами, съезд поддерживает Сергея Кирова в качестве нового премьера§!." # §HLenin's wife, Nadezhda Krupskaya, presents a letter from Lenin to the Congress that reveals Sergey Kirov as his preferred heir. To prortect the Soviet Union from a Trotsykite takeover, the Congress rallies behind Sergey Kirov as the new Premier§!
  
