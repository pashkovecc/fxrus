 SOV_scorched_earth_decisions: "Тактика выжженной земли" # Implementing Scorched Earth Policies
 SOV_scorched_earth_decisions_desc: "Столкнувшись в 1812 году с превосходящими силами армии Наполеона, российское правительство ответило уничтожением всего, что могло быть использовано захватчиками. Сельскохозяйственные угодья были сожжены дотла, а целые города были заброшены. К тому времени, когда Наполеон двинулся на Москву, его армия голодала и замерзала. По мере того, как наши враги продвигаются глубже вглубь СССР, мы должны еще раз рассмотреть возможность применения этой тактики, чтобы замедлить продвижение врага." # When faced by the overwhelming force of Napoleon's armies in 1812 the Russian government responded by destroying everything that could be used by the invaders. Farmland was burnt to the ground and entire cities were abandoned. By the time Napoleon marched on Moscow his army was starving and freezing to death. As our enemies march deeper into the USSR we must once again consider adopting these tactics to slow down the enemy advance.
 # 
