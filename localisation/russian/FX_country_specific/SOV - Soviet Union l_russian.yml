 sovietscorched.21.t: "«Выжженная земля» ведет к голоду" # Food shortages develop as we push Scorched Earth policies
 sovietscorched.21.d: "По мере того как наши враги все глубже проникают в СССР, наши попытки отказать им в продовольствии и других товарах имеют некоторые неприятные побочные эффекты для наших собственных граждан. Многие гражданские лица испытывают трудности с удовлетворением своих ежедневных потребностей в питании, а местные организации, созданные для распределения продовольствия, перегружены количеством беженцев. Возможно, настало время для Советского Конгресса напрямую возглавить эти программы по оказанию помощи голодающим, особенно с наступлением самых суровых зим." # As our enemies push deeper into the USSR our attempts to deny them food and other supplies are having some unfortunate side effects on our own citizens. Many civilians are having trouble attaining their daily nutritional needs and local organizations set up to handle food distribution are being overwhelmed by the number of refuges. It may be time for the Soviet Congress to directly lead these hunger relief programs especially as the worst of winter begins to set in.
 sovietscorched.21.a: "Главное сейчас — выжить в этой войне." # We must focus on surviving this war.
 sovietscorched.21.b: "Нужно сделать всё возможное, чтобы сдержать надвигающийся голод." # We must do what it takes to lessen this growing famine.
 # 
 sovietscorched.22.t: "Потери снаряжения из-за «выжженной земли»" # Equipment is being lost as we implement Scorched Earth policies
 sovietscorched.22.d: "Поскольку мы эвакуируем военные материалы и оружие из рук наших врагов, некоторым из них суждено потеряться в хаосе, но недавно серия плохо организованных эвакуаций привела к ненужной потере значительного количества припасов. Возможно, мы захотим рассмотреть возможность дополнительной подготовки подразделений, которым поручена эвакуация военных материалов, если мы хотим избежать подобной ситуации в будущем." # As we evacuate war materials and weapons out of the hands of our enemies some is destined to be lost in the chaos but recently a series of poorly handled evacuations has lead to a significant amount of supplies being needlessly lost. We may want to consider giving more training to units tasked with evacuating war materials if we wish to avoid this situation in the future.
 sovietscorched.22.a: "Эти потери допустимы." # Such losses are acceptable.
 sovietscorched.22.b: "Нужно убедиться, что последующая эвакуация пройдёт по плану." # We must make sure future evacuations go as planned.
 # 
 sovietscorched.23.t: "Массовые протесты против «выжженной земли»" # Mass protests form against Scorched Earth policies
 sovietscorched.23.d: "Такой радикальной политике, как «Выжженная земля», суждено было встретить некоторую оппозицию, но, похоже, это несмотря на тот факт, что наша нация столкнулась с угрозой, с которой мы никогда не сталкивались, прежде чем многие граждане организовали протесты в нескольких городах в знак протеста против этой политики. Даже некоторые солдаты присоединились к этим протестам, чтобы выразить свое несогласие. Некоторые генералы полагают, что мы должны дисциплинировать этих непослушных солдат и подавить эти протесты во имя национальной безопасности." # A policy as drastic Scorched Earth was destined to face some opposition but it seems despite the fact that our nation is facing a threat the likes of which we have never tackled before many citizens have organized protests in several cities in opposition to the policy. Even some soldiers have joined these protests to voice their opposition. Some generals have suggested that we must discipline these disobedient soldiers and break up these protest in the name of national security.
 sovietscorched.23.a: "Народ имеет право выразить своё недовольство." # The public has the right to voice their grievances.
 sovietscorched.23.b: "Мы должны жёстко пресечь это неповиновение." # We must crack down on this disobedience.
  
 sovexpansion.1.t: "Генерал Дурутти прибыл из Испании" # General Durutti arrives from Spain
 sovexpansion.1.d: "Падение правительства Барселоны в Испании побудило генерала Буэнавентура Дуррути бежать в Москву через Францию. Его наняли в армию в качестве инспектора. Надеясь, что однажды он сможет вернуться в Мадрид, он с нетерпением работает над реформированием Красной Армии. Хотя партия критиковала его за анархистские и синдикалистские взгляды, армия высоко оценила его усилия и указала на его военный опыт, полученный им в гражданской войне." # The fall of the Barcelona government in Spain has prompted General Buenaventura Durruti to escape to Moscow via France. He has been hired by the army as an inspector. Hoping that he will one day be able to return to Madrid he is eagerly working on reforming the Red Army. Although the Party has criticized him for his anarchist and syndicalist views, the army has commended his efforts and pointed towards his military experience he earned in the civil war.
 sovexpansion.1.a: "Добро пожаловать, товарищ!" # Welcome Comrade!
  
 sovexpansion.2.t: "Пробуждение гиганта" # The Giant Wakes
 sovexpansion.2.d: "С момента кровавой гражданской войны наша страна проводит политику изоляционизма. Но теперь, когда капиталисты готовы окунуться прямо в очередную кровавую войну, нам необходимо переоценить свое место в мире. Антанта дает возможность позиционировать себя против реакционных и авторитарных режимов, а приближение к Стальному пакту обеспечивает большую стабильность. Эти решения требуют тщательного рассмотрения, но это лишь краткосрочные меры, которые не смогут остановить освобождение рабочих." # Ever since the bloody civil war, our country has pursued a policy of isolationism . But now that the capitalists are ready to plunge straight into another bloody war, we need to reassess our place in the world. The Entente presents an opportunity to position ourselves against reactionary and authoritarian regimes, while approaching the Stahlpakt ensures greater stability. These decisions require careful consideration, but they are only short-term measures that will not be able to halt the liberation of the workers.
 sovexpansion.2.a: "Антанта — более разумный союзник" # The Entente is the more reasonable ally
 sovexpansion.2.b: "Безопасность важнее всего в наше время" # Security matters most in these times
  
 sovexpansion.3.t: "Расширение Интернационала" # Expanding the International
 sovexpansion.3.d: "Правительство премьера [SOV.GetLeader] подало просьбу нашей выздоравливающей стране присоединиться к Третьему Интернационалу. Хотя пролетариат и выиграл эту битву, он, возможно, не сможет выиграть будущие войны против своих реакционных соседей. Таким образом, союз с Советами вполне логичен, даже если он может втянуть нас в будущий конфликт, к которому мы, возможно, не готовы." # [SOV.GetLeader]s government has submitted a request for our recovering nation to join the Third International. Although the proletariat has won this battle, it may not be able to win the future wars against its reactionary neighbors. An alliance with the Soviets is thus only logical, even if it may drag us into future conflict which we may not be prepared for.
 sovexpansion.3.a: "Пролетарии всех стран, соединяйтесь!" # Workers of the world, unite!
 sovexpansion.3.b: "Если подумать..." # On second thought...
  
 sovexpansion.4.t: "Испания присоединяется к Интернационалу" # Spain joins the International
 sovexpansion.4.d: "Теперь, когда началось освобождение испанских рабочих, вполне разумно защитить этого нашего естественного союзника. Правительство товарища [SPA.GetLeader] проявило готовность к союзу с нами, тем самым предоставив возможность дальнейшего сотрудничества. Война не за горами, хотим мы этого или нет, и чтобы выжить, нам нужны союзники." # Now that the liberation of the Spanish worker has commenced it is only reasonable to protect this natural ally of ours. The government of [SPA.GetLeader] has shown itself open to ally with us, thus presenting the possibility for further cooperation. War is on the horizon, whether we like it or not, and in order to survive, we need allies.
 sovexpansion.4.a: "Отличные новости!" # Great news!
  
 sovexpansion.5.t: "Испанцы отказываются!" # The Spanish refuse!
 sovexpansion.5.d: "К сожалению, вновь созданное правительство [SPA.GetLeader] отказалось присоединиться к Третьему Интернационалу. Он утверждал, что восстановление после гражданской войны займет много времени и что в Испании еще не создано социалистическое общество. Тем не менее, он, безусловно, сыграет свою роль в регионе и послужит потенциальным будущим союзником." # Unfortunately, the newly established government of [SPA.GetLeader] has refused to join the Third International. It argued that it would take a long time to recover from the civil war and that a socialist society had not yet been realised in Spain. Nevertheless, it will certainly play a role in the region and serve as a potential future ally.
 sovexpansion.5.a: "Мы все равно их не хотели..." # We didn't want them anyway...
  
 sovexpansion.6.t: "Советы просят признания" # The Soviets ask for recognition
 sovexpansion.6.d: "СССР внес в Совет Антанты предложение о признании их в обмен на союз. Некоторые страны уже выразили свою поддержку этой идее, но ее придется поставить на голосование в Совете. Признание режима премьера [SOV.GetLeader] могло бы быть полезным для отражения растущей немецкой угрозы в Центральной Европе." # TThe USSR has submitted a proposal to the Entente Council that we should recognise them in exchange for an alliance. Some nations have already expressed their support for this idea, but it would have to be put to a vote in the Council. Recognising the regime of [SOV.GetLeader] could be advantageous in warding off the growing German threat in Central Europe.
 sovexpansion.6.a: "У них есть что-то, давайте проголосуем" # They do have a point, let's vote
  
 sovexpansion.7.t: "Советы предлагают пакт о взаимной обороне" # The Soviets propose a Mutual Defense Pact
 sovexpansion.7.d: "Продолжая политику сотрудничества с Западом, проводимую [SOV.GetLeader], СССР предложил нам договор о взаимной обороне, мотивируя его немецкой угрозой. Сотрудничество с врагом нашего врага может иметь решающее значение, даже если критики описывают это как одностороннее соглашение, которое будет угрожать нашей внешней безопасности." # Continuing the policy of cooperation with the West pursued by [SOV.GetLeader], the USSR proposed a mutual defence agreement to us, citing the German threat as its incentive. Cooperation with the enemy of our enemy could be crucial, even if critics describe this as a one-sided agreement that would threaten our external security.
 sovexpansion.7.a: "Это стоит того" # It's worth a shot
 sovexpansion.7.b: "Им нужны только наши военные знания" # They only want our military knowledge
  
 sovexpansion.8.t: "Французы согласны!" # The French agree!
 sovexpansion.8.d: "Совершив несколько неожиданный акт международного сотрудничества, французы согласились на наше предложение разрешить французским офицерам обучать нашу слаборазвитую армию. Это поможет предотвратить будущие угрозы существованию Союза. Красная Армия настроена скептически, но даже самые резкие критики признают пользу этого соглашения." # In a somewhat surprising act of international cooperation, the French have agreed to our proposal that French officers be allowed to train our underdeveloped military. This will help ward off future threats to the Union's existence. The Red Army is sceptical, but even the harshest critics recognise the benefits of this agreement.
 sovexpansion.8.a: "Тост за нашего нового «союзничка»" # A toast to our new \
  
 sovexpansion.9.t: "Французы отказываются!" # The French refuse!
 sovexpansion.9.d: "Неудивительно, что французы отвергли наше предложение о подготовке офицеров Красной Армии. Это лишь демонстрирует невежество и эгоизм, проповедуемые капитализмом, и подтверждает ленинскую теорию о несотрудничестве с ними вообще. Несмотря на эту неудачу, [SOV.GetLeader] уже принял необходимые меры для дальнейшего развития Красной Армии." # It is not surprising that the French rejected our proposal to train Red Army officers. This only demonstrates the ignorance and selfishness preached by capitalism and confirms Lenin's theory of not cooperating with them at all. Despite this setback, [SOV.GetLeader] has already taken the necessary measures to further develop the Red Army.
 sovexpansion.9.a: "Ну, попытка не пытка" # It was worth a try
  
 sovexpansion.10.t: "Советы предлагают пакт о взаимной обороне" # The Soviets propose a Mutual Defense Pact
 sovexpansion.10.d: "Продолжая политику сотрудничества с Западом, проводимую [SOV.GetLeader], СССР предложил нам соглашение о взаимной обороне, мотивируя его капиталистической угрозой. Сотрудничество с врагом нашего врага может иметь решающее значение, даже если критики описывают это как одностороннее соглашение, которое будет угрожать нашей внешней безопасности." # Continuing the policy of cooperation with the West pursued by [SOV.GetLeader], the USSR proposed a mutual defence agreement to us, citing the Capitalist threat as its incentive. Cooperation with the enemy of our enemy could be crucial, even if critics describe this as a one-sided agreement that would threaten our external security.
 sovexpansion.10.a: "Оно того стоит" # It's worth a shot
 sovexpansion.10.b: "Им нужны только наши военные знания" # They only want our military knowledge
  
 sovexpansion.11.t: "Немцы согласны!" # The Germans agree!
 sovexpansion.11.d: "Совершив несколько удивительный акт международного сотрудничества, немцы согласились на наше предложение разрешить немецким офицерам обучать нашу слаборазвитую армию. Это поможет предотвратить будущие угрозы существованию Союза. Красная Армия настроена скептически, но даже самые резкие критики признают пользу этого соглашения." # In a somewhat surprising act of international cooperation, the Germans have agreed to our proposal that German officers be allowed to train our underdeveloped military. This will help ward off future threats to the Union's existence. The Red Army is sceptical, but even the harshest critics recognise the benefits of this agreement.
 sovexpansion.11.a: "Тост за нашего нового «союзничка»" # A toast to our new \
  
 sovexpansion.12.t: "Немцы отказываются!" # The Germans refuse!
 sovexpansion.12.d: "Неудивительно, что немцы отвергли наше предложение обучать офицеров Красной Армии. Это лишь демонстрирует невежество и эгоизм, проповедуемые националистическими демагогами, и подтверждает ленинскую теорию о полном отказе от сотрудничества с ними. Несмотря на эту неудачу, [SOV.GetLeader] уже принял необходимые меры для дальнейшего развития Красной Армии." # It is not surprising that the Germans rejected our proposal to train Red Army officers. This only demonstrates the ignorance and selfishness preached by nationalist demagogues and confirms Lenin's theory of not cooperating with them at all. Despite this setback, [SOV.GetLeader] has already taken the necessary measures to further develop the Red Army.
 sovexpansion.12.a: "Ну, попытка не пытка" # It was worth a try
  
 sovexpansion.13.t: "Советы требуют нашей нефти!" # Soviets demand our Oil!
 sovexpansion.13.a: "У нас нет выбора..." # We have no choice...
 sovexpansion.13.b: "Пусть придут и заберут!" # Let them come!
  
 sovexpansion.14.t: "Азербайджанцы согласны!" # The Azeris agree!
 sovexpansion.14.d: "Видя неизбежность ситуации, азербайджанцы под сильным давлением сдались и передали нам контроль над своими нефтяными месторождениями. Это будет полезно для дальнейших вторжений на Ближний Восток." # Seeing the inevitability of the situation, the Azeris gave in under great pressure and gave us control over their oil fields. This will be beneficial for further invasions in the Middle East.
 sovexpansion.14.a: "Великая Победа" # A great Victory
  
 sovexpansion.15.t: "Азербайджанцы отказываются!" # The Azeris refuse!
 sovexpansion.15.d: "Азербайджанцы не поддались сильному давлению и отказались покинуть свои нефтяные месторождения. Поскольку мирное решение не представляется возможным, [SOV.GetLeader] отдал приказ атаковать." # The Azeris did not give in under heavy pressure and refused to vacate their oil fields. Since a peaceful solution does not seem possible, [SOV.GetLeader] has given the order to attack.
 sovexpansion.15.a: "Какая тщетная попытка" # What a futile attempt
  
 sovexpansion.16.t: "Советы требуют Карелию" # The Soviets demand Karelia
 sovexpansion.16.d: "Ссылаясь на необходимость создания буфера безопасности для [195.GetName], официальные лица СССР потребовали пересмотра наших границ. Они хотят, чтобы мы уступили им Карелию, и, судя по наращиванию советских войск вдоль нашей границы, они не примут ответа «нет». Как нам следует реагировать?" # Citing the need to create a security buffer for [195.GetName], officials from the USSR have asked for a revision of our borders. They want us to cede Karelia to them, and judging by the build-up of Soviet forces along our border, they will not take no for an answer. How should we respond?
 sovexpansion.16.a: "У нас нет другого выбора." # We have no choice but to accept their demands.
 sovexpansion.16.b: "Пусть они придут, если осмелятся!" # Let them come if they dare!
  
 sovexpansion.17.t: "Финны отказываются!" # The Finns refuse!
 sovexpansion.17.d: "Правительство Финляндии отклонило наши требования, хотя такой вызывающей реакции можно было ожидать. Чтобы обезопасить Карелию, мы должны взять ее силой. Красная Армия готова войти на свою незаконно оккупированную территорию, а ВМФ и ВВС находятся в состоянии повышенной боеготовности." # The Finnish government has rejected our demands, although this defiant reaction was to be expected. To secure Karelia, we must take it by force. The Red Army is ready to march into their illegally occupied territory, and the navy and air force are on high alert.
 sovexpansion.17.a: "Вперед!" # Onwards!
  
 sovexpansion.18.t: "Увертюры из Пекина" # Overtures from Beijing
 sovexpansion.18.d: "После Уханьской революции и смерти императора Юань Шикая Китай разделился на множество клик. Поскольку они граничат с нами, вполне естественно, что у нас есть интерес к этому региону. С одной стороны, у нас есть маньчжурская клика Фэнтянь, которая станет нашей первой точкой вторжения. На юге у нас есть революционный Гоминдан, который очень хотел бы сотрудничать с нами. Каким будет наш ответ?" # Since the Wuhan Revolution and the death of Emperor Yuan Shikai, China has been divided into many cliques. As they border us, it is only natural that we have an interest in this region. On one side, we have the Manchurian Fengtian clique, which would be our first point for an invasion. In the south, we have the revolutionary Kuomintang, which would be very willing to cooperate with us. What will our response be?
 sovexpansion.18.a: "Сосредоточиться на вторжении в Маньчжурию" # Focus on invading Manchuria
 sovexpansion.18.b: "Сосредоточиться на поддержке Гоминьдана" # Focus on supporting the Kuomintang
  
 sovexpansion.19.t: "Просьба из СССР" # A request from the USSR
 sovexpansion.19.d: "Наш могущественный сосед на севере, СССР, предложил военный союз между нашими двумя странами, ссылаясь на антиимпериализм и безопасность границ. Это оба вопроса, по которым мы готовы сотрудничать. Однако это, несомненно, усилило бы левый Гоминьдан, поэтому отказ также был бы логичным решением." # Our powerful neighbour to the north, the USSR, has proposed a military alliance between our two nations, citing anti-imperialism and border security. These are both issues on which we are willing to cooperate. However, this would undoubtedly strengthen the left-wing Kuomintang, which is why rejection would also be a logical decision.
 sovexpansion.19.a: "Это отличная сделка" # It's a great deal
 sovexpansion.19.b: "Почему мы должны мириться с этим фарсом?" # Why should we accept this farce?
  
 sovexpansion.20.t: "Гоминьдан принимает!" # The Kuomintang accept!
 sovexpansion.20.d: "Гоминьдан под руководством [KMT.GetLeader] одобрил наше заявление о вступлении в Третий Интернационал, что, безусловно, поможет нам в нашем стремлении к освобождению и безопасности в Восточной Азии. Японская империя осудила это решение, но это лишь подчеркивает ее намерения в регионе. Однако Восточная Азия не станет снова жертвой империализма, а освободится от его оков." # The Kuomintang under [KMT.GetLeader] has approved our application to join the Third International, which will certainly help us in our quest for liberation and security in East Asia. The Japanese Empire has condemned this decision, but this only underscores its intentions in the region. East Asia will not fall victim to imperialism again, however, but will free itself from its shackles.
 sovexpansion.20.a: "Великий день международной солидарности" # A great day for international solidarity
  
 sovexpansion.21.t: "Гоминьдан отказывается!" # The Kuomintang refuse!
 sovexpansion.21.d: "Гоминьдан под руководством [KMT.GetLeader] отклонил наше заявление о вступлении в Третий Интернационал, сославшись на опасения по поводу суверенитета и идеологических разногласий. Хотя это решение является крахом наших надежд на скоординированное сопротивление и безопасность, мы все еще имеем себя. Японцы приветствовали отказ, и эта реакция лишь показывает их истинные амбиции в Восточной Азии. Даже если международная солидарность пока останется закрытой, мы не оставим борьбу Восточной Азии за свободу." # The Kuomintang under [KMT.GetLeader] has rejected our application to join the Third International, citing concerns about sovereignty and ideological differences. While this decision is a setback to our hopes for coordinated resistance and security, we still have ourselves. The Japanese have welcomed the rejection, a reaction that only shows their true ambitions in East Asia. Even if international solidarity remains closed for now, East Asia's struggle for freedom will be not abondened by us
 sovexpansion.21.a: "Хорошо, давай сделаем это сами" # Fine, let's do it ourselves
  
 sovexpansion.22.t: "Сближение с немцами" # Approaching the Germans
 sovexpansion.22.d: "Поскольку нам угрожают со всех сторон, мы решили снова обратиться к немцам. Это, безусловно, ослабит нашу международную репутацию, но на карту поставлено нечто большее. Мы предложим правительству [GER.GetLeader] в Берлине пакт о ненападении в обмен на то, что оно сможет правильно определить свою сферу влияния. На данный момент это кажется наиболее реалистичным решением, поэтому мы попробуем." # As we are threatened on all sides, we have decided to approach the Germans once again. This will certainly weaken our international reputation, but there is more at stake. We will offer the government of [GER.GetLeader] in Berlin a non-aggression pact in return for them being able to properly define their own sphere of influence. This seems to be the most realistic solution at present, so we will give it a try.
 sovexpansion.22.a: "Будем надеяться, что это нам поможет" # Let's hope this helps us
  
 sovexpansion.23.t: "СССР приглашает нас на Московскую конференцию" # The USSR invites us to the Moscow Conference
 sovexpansion.23.d: "Казалось бы, из ниоткуда большевики пригласили нас на конференцию в Москву. Формулировка приглашения расплывчата, но его цель ясна. Они хотят установить сферы влияния в Восточной Европе и хотят, чтобы мы подписали пакт о ненападении. Хотя это помогло бы нам в наших предстоящих военных действиях, это также могло бы помешать нашей дальнейшей экспансии на восток, чему мы, конечно, не рады. Тем не менее, это дает огромную возможность обезопасить наш восточный фронт и предотвратить новую войну на два фронта." # Seemingly out of nowhere, the Bolsheviks have invited us to a conference in Moscow. The wording of the invitation is vague, but its aim is clear. They want to establish spheres of influence in Eastern Europe and want us to sign a non-aggression pact. Although this would help us in our upcoming war effort, it could also hinder our further expansion to the east, which we are certainly not happy about. Nevertheless, this offers an enormous opportunity to secure our eastern front and prevent another war on two fronts.
 sovexpansion.23.a: "Мы согласны!" # We agree!
 sovexpansion.23.b: "Никаких сделок с коммунистами" # No deal with the Communists
  
 sovexpansion.24.t: "Конференция увенчалась успехом" # The Conference Succeeds
 sovexpansion.24.d: "Вопреки всем ожиданиям, нам удалось без особых проблем поделить Восток между собой. Неагрессия" # Against all expactations, we have managed to divide up the east between ourselves without any big issues. The non agression
 sovexpansion.24.a: "Это конечно было что-то" # This was certainly something
  
 sovexpansion.25.t: "Конференция увенчалась успехом" # The Conference Succeeds
 sovexpansion.25.d: ""
 sovexpansion.25.a: "Это конечно было что-то" # This was certainly something
  
 #sovexpansion.113.tt: "§g§YПольша§! попадет в сферу влияния §CНемецкого§!§!" # §g§YPoland§! will fall in the §CGerman§! sphere of influence§!
  
 # EXPANSION EVENTS 
 sovexp.1.t: "[FROM.GetName] требует отдать Карелию" # [FROM.GetName] demands we cede Karelia
 sovexp.1.d: ""
 sovexp.1.a: "Принять" # Accept
 sovexp.1.a_effect_tt: "Мы сможем атаковать Финляндию через 185 дней." # We will be able to attack [FIN.GetName] after 185 days.
 sovexp.1.b: "Отказаться" # Refuse
  
 sovexp.2.t: "Москва на охоте" # Moscow on the Prowl
 sovexp.2.d: "Похоже, [SOV.GetAdjective]ие русские, совсем как и царская Россия давным-давно, снова с вожделением заглядываются на нашу страну. [SOV.GetAdjective]ие дипломаты начали передавать ультимативные требования передать под [SOV.GetAdjective]ий контроль нашу внутреннюю и внешнюю политику — требования, равносильные согласию на аннексию. Поскольку мы очевидно не можем допустить столь грубого попрания нашего суверенитета, мы были вынуждены отклонить эти претензии, однако уже сейчас понятно, что советы на этом не остановятся. И нам, и всем нашим соседям стало ясно: война с СССР не за горам.\n\nНаш министр иностранных дел предложил провести встречу с представителями государств [BUK.GetNameDef], [KHI.GetNameDef] и [TCG.GetNameDef], чтобы предложить им пакт о взаимной обороне и вместе дать отпор [SOV.GetAdjective]им амбициям." # It seems that the [SOV.GetAdjective] Russians are, just as the Imperial Russians did long ago, eyeing our country covetously once more. [SOV.GetAdjective] diplomats have begun to relay unanswerable demands that we submit to [SOV.GetAdjective] control over our domestic and foreign affairs, demands which would be tantamount to accepting annexation. As we obviously cannot accept such abrogations of our soveriegnty, we have been forced to refuse these demands, but it is already clear that the Soviets will not stop there. It has become clear to us and to all of our neighbors that war with the USSR is on the horizon.\n\nOur foreign minister has suggested that we meet with [BUK.GetNameDef], [KHI.GetNameDef], and [TCG.GetNameDef] in order to propose a mutual treaty of defense, that we might resist [SOV.GetAdjective] ambitions.
 sovexp.2.a: "Мы не сможем выиграть эту войну в одиночку." # We will not be able to win this war alone.
  
 sovexp.3.t: "Москва на охоте" # Moscow on the Prowl
 sovexp.3.d: "Похоже, [SOV.GetAdjective]ие русские, совсем как и царская Россия давным-давно, снова с вожделением заглядываются на нашу страну. [SOV.GetAdjective]ие дипломаты начали передавать ультимативные требования передать под [SOV.GetAdjective]ий контроль нашу внутреннюю и внешнюю политику — требования, равносильные согласию на аннексию. Поскольку мы очевидно не можем допустить столь грубого попрания нашего суверенитета, мы были вынуждены отклонить эти претензии, однако уже сейчас понятно, что советы на этом не остановятся. И нам, и всем нашим соседям стало ясно: война с СССР не за горам.\n\nСегодня на конференции в Ташкенте [TRK.GetAdjective]ий министр иностранных дел провёл переговоры о предложении объединить усилия в знак солидарности против [SOV.GetAdjective]ой агрессии, а также для координации совместной обороны от коммунистического нападения." # It seems that the [SOV.GetAdjective] Russians are, just as the Imperial Russians did long ago, eyeing our country covetously once more. [SOV.GetAdjective] diplomats have begun to relay unanswerable demands that we submit to [SOV.GetAdjective] control over our domestic and foreign affairs, demands which would be tantamount to accepting annexation. As we obviously cannot accept such abrogations of our soveriegnty, we have been forced to refuse these demands, but it is already clear that the Soviets will not stop there. It has become clear to us and to all of our neighbors that war with the USSR is on the horizon.\n\nToday, in a conference held in Toshkent, the [TRK.GetAdjective] foreign minister hosted talks discussing a proposal to band together in a show of solidarity against [SOV.GetAdjective] aggression, and in order to coordinate our mutual defense against Communist attack.
 sovexp.3.a: "Мы должны присоединиться или умереть." # We must join, or die.
 sovexp.3.b: "Глупая идея!" # A foolish notion!
  
 sovexp.4.t: "[FROM.GetNameDefCap] принимает" # [FROM.GetNameDefCap] has Accepted
 sovexp.4.d: "[FROM.GetNameDefCap] принимает наше предложение, и мы уже работаем над координацией нашей совместной защиты от [SOV.GetAdjective]их агрессоров. Совместные усилия по защите наших центральноазиатских домов будут преобладать, по крайней мере, до тех пор, пока не будут локализованы все следы [SOV.GetAdjective]ой подрывной деятельности." # [FROM.GetNameDefCap] has accepted our proposal, and already we are working toward coordinating our joint defense against the [SOV.GetAdjective] aggressors. A united effort toward defending our respective Central Asian homes will prevail, at least until all traces of [SOV.GetAdjective] subversion are contained.
 sovexp.4.a: "Вместе мы дадим отпор коммунистическому злодейству!" # Together we will resist Communist villainy!
  
 sovexp.5.t: "[FROM.GetNameDefCap] отказывается" # [FROM.GetNameDefCap] has Refused
 sovexp.5.d: "[FROM.GetNameDefCap] отклоняет наше предложение, сославшись на заинтересованность в сохранении независимых усилий по управлению своими иностранными делами." # [FROM.GetNameDefCap] has refused our proposal, citing interests in maintaining an independent effort toward managing their foreign affairs.
 sovexp.5.a: "Они пожалеют об этом!" # They will regret this!
  
