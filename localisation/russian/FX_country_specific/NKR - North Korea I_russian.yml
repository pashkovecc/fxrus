### DESCRIPTION ###
 NKR_FUHRERREICH_DESC: "Независимого корейского государства не существовало с тех пор, как в 1905 году был установлен японский протекторат. В 1936 году Корея все еще находится под контролем Японии, но растущие чувства национализма и антияпонских настроений грозят нарушить хрупкий баланс в регионе. Освободят ли корейцы себя или просто передадут господство от одной державы к другой, еще неизвестно, но Корейский полуостров наверняка увидит опустошение в ближайшие годы, несмотря ни на что." # An independent Korean state hasn't existed since the Japanese protectorate was established in 1905. In 1936 Korea still looms under the Japanese thumb, but increasing feelings of nationalism and anti-Japanese sentiment threatens to upset the delicate balance in the region. Whether the Koreans will liberate themselves or simply have overlordship transfered from one power to another remains to be seen, but the Korean peninsula is sure to see devestation in the years to come no matter what.

