### EVENTS ###

 nkr.1.t: "Правительство Южной Кореи провоцирует пограничный спор!" # South Korean government provokes border dispute!
 nkr.1.d: "Войска южнокорейского правительства недавно вторглись на нашу территорию вблизи западной прибрежной границы, явно с намерением проверить ситуацию, чтобы увидеть, сколько мы готовы терпеть. Советники из Советского Союза говорят, что мы должны стоять на своем и защищать прибрежные острова любой ценой, но наши военные считают, что мы еще не готовы к войне с нашими южными соседями." # Forces from the South Korean government have recently encorached upon our territory near the Western Coastal border, clearly with the intent of testing the waters to see how much we are willing to tollerate. Advisors from the Soviet Union say that we should stand our ground and defend the coastal islands at all costs, but our military staff believe that we are not yet ready for war with our Southern neighbors.
 nkr.1.a: "Корея неделима!" # Korea is indivisible!
 nkr.1.b: "Несколько прибрежных островов — это не то, из-за чего можно развязать глобальную ядерную войну." # A few coastal islands are nothing to start a global nuclear war over.

