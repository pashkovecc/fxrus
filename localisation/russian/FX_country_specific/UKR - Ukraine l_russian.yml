 # ukraine.58.a: "...give Transcarpathia to [UKR.GetName]" #NT!
 # ukraine.58.b: "...do nothing, and call [UKR.GetLeader] a bastard" #NT!
 # ukraine.58.c: "...how dare they demand land? Declare war to show them the [SLO.GetAdjective] power!" #NT!
 ukraine.58.t: "[UKR.GetNameDef] Demands the region of Galicia!" #NT!
 ukraine.58.d: "Today the [UKR.GetAdjective] embassy informed us that the [UKR.GetAdjective] government demanded that we transfer the region of Galicia to them. The Governement is split, on what we should do. In the end, [POL.GetLeader] decided to..." #NT!
 ukraine.58.a: "...Give in to their demands" #NT!
 ukraine.58.b: "...nah, they can't do shit" #NT!
 ukraine.59.t: "[POL.GetName] rejects the demands!" #NT!
 ukraine.59.d: "[POL.GetName] decided to not give in to our demands. They called [UKR.GetLeader] a bastard, and a son of a whore. They said that if Ukraine wants to take Galicia, they must go to war. What should we do?" #NT!
 ukraine.59.a: "Very well, we should very well go to war over this!" #NT!
 ukraine.59.b: "We don't want a war right now, we are a peaceful country, let's just claim" #NT!
 ukraine.60.t: "[POL.GetName] transfered us Galicia!" #NT!
 ukraine.60.d: "[POL.GetName] was scared of our Great and Incumbent leader [UKR.GetLeader], so much, that they didn't even consider another option except giving it. They said \"Anything for our Great Friends at the Euksineus Pontus. We want to remain friendly, please don't attack us!\" " #NT!
 ukraine.60.a: "Today, its a day of happiness!" #NT!
  
 ukraine.61.t: "Zaporozhets Production" #NT!
 ukraine.61.d: "Every great industrial country has its own car model. Which is an important symbol of a closed production circle and might of industrial complex. We have to support our domestic car industry to claim our places among european economies as great powerhouse" #NT!
 ukraine.61.a: "[UKR.GetName] will be a powerhouse, eventually" #NT!
  
