 UKR_eagle_falcon: "The Eagle and the Falcon" #NT!
 UUKR_eagle_falcon_desc: "Germany remains our main ally, supporter and market in Europe. There are a number of spheres where German experience can be a significant benefit to us, especially in our industrial sector." #NT!
