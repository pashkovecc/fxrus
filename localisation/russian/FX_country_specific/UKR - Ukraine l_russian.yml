 # Foreign 
 UKR_rising_tensions: "Rising Tensions" #NT!
 UKR_rising_tensions_desc: "The world is becoming more and more dangerous. New wars, uprisings and coups - you need to be blind to not notice them. At a time like this, when the sky is getting darker and the future is uncertain, we must take the initiative on the world stage." #NT!
 UKR_western_claims: "Western Claims" #NT!
 UKR_western_claims_desc: "Our independence born burning bloody war, unfortunately we had not enough strength to keep all our lands. The desire of reclamation of lost lands is simple and equitable - ukrainian people have the right of self-determination and their choice is to live in Ukraine." #NT!
 UKR_approach_warsaw_for_galicia: "Approach Warsaw for Galicia" #NT!
 UKR_approach_warsaw_for_galicia_desc: "Galicia is the last part of the Kievan Rus which was under control of the Poles and Germans for more than 600 years. However, we are now strong enough to liberate the Ukrainians here from this terrible oppression." #NT!
 UKR_protection_for_bucovina_and_bessarabia: "Protection for Bucovina and Bessarabia" #NT!
 UKR_protection_for_bucovina_and_bessarabia_desc: "The Russian Empire lost our province of Bessarabia in 1918. Today many Ukrainians and other national minorities live here under the oppression of the corrupt regime in Bucharest, but now is the perfect time for freedom and self-determination to prevail in Bessarabia. We will help liberate the people in this region." #NT!
 UKR_demand_transcarpathia: "Demand Transcarpathia" #NT!
 UKR_demand_transcarpathia_desc: "Ukraine demonstrates a commitment to regional unity by addressing the status of Transcarpathia. Recognizing the historical ties and shared aspirations, we strive to integrate Transcarpathia into our nation. We aim to build a stronger and more cohesive Ukraine. We shall work towards a future where Transcarpathia's interests "align" with the collective progress and prosperity of our nation." #NT!
 UKR_ties_with_the_germans: "Ties with the Germans" #NT!
 UKR_ties_with_the_germans_desc: "The Germans created the strongest army in Europe. We shouldn't miss our chance to take lessons from Berlin and increase the defence capability of our country by bringing German military advisers out from their garrisons into our barracks." #NT!
 UKR_ties_with_the_germans_tt: "£decision_icon_small  §YDecision§! regarding requesting our entry to the §c[GER.GetFactionName]§! will be §Yunlocked§!" #NT!
 UKR_meet_with_the_entente: "Meet with the Entente" #NT!
 UKR_meet_with_the_entente_desc: "A resurgent Germany is rising, with the threats from the red bear in the east, we must not sit ourselves idly. The French, whom its people embodies the essence of liberty, freedom and democracy, stands as a rival to the threats against our independence. We will formally meet with their representatives, and discuss a possible entry of Ukraine to the Entente." #NT!
 UKR_meet_with_the_entente_tt: "£decision_icon_small  §YDecision§! regarding requesting our entry to the §c[FRA.GetFactionName]§! will be §Yunlocked§!" #NT!
 UKR_cooperate_with_warsaw: "Cooperate with Warsaw" #NT!
 UKR_cooperate_with_warsaw_desc: "Though we have many quarrels with the Polish state, reproachment would prove beneficial. an alliance would enable us to focus on the Soviet threat to the east, and perhaps gain concessions from the poles..." #NT!
 UKR_expand_the_foreign_ministry: "Expand the Foreign Ministry" #NT!
 UKR_expand_the_foreign_ministry_desc: "Ukraine is dedicated to expanding its diplomatic reach and exerting a greater influence on the global stage. This strategic initiative focuses on enhancing international partnerships and promoting national interests. Through diplomatic outreach, we aim to secure Ukraine's position in international affairs. Join us as we shape a prosperous future for our nation through a robust diplomatic approach!" #NT!
 UKR_request_entente_armaments: "Request Entente Armaments" #NT!
 UKR_request_entente_armaments_desc: "We still lack reasonable military-industrial facilities, leaving us reliant on our allies for supplies. Until we have the opportunity to establish a domestic supply we should request additional rifles from the homeland." #NT!
 UKR_request_entente_armaments_tt: "£decision_icon_small  §YDecisions§! regarding requesting §carmaments§! from our allies will be §Yunlocked§!" #NT!
 UKR_entente_advisors: "Entente Advisors" #NT!
 UKR_entente_advisors_desc: "While we have many patriotic veterans wishing to help train up future generations of soldiers at our disposal, it wouldn't hurt to keep abreast of current warfare developments by working with our Entente allies." #NT!
 UKR_war_games_in_crimea: "War Games in Crimea" #NT!
 UKR_war_games_in_crimea_desc: "In order to show the might of our allies and our combined military might, we will be conducting a special war games exercises in Crimea, to display to the the Soviets what we are capable of." #NT!
 UKR_approach_the_baltic: "Approach the Baltic" #NT!
 UKR_approach_the_baltic_desc: "Ukraine is dedicated to fostering stronger ties with the Baltic nations. Through diplomatic efforts, economic and military collaborations, we aim to deepen regional bonds and enhance collective security. Together, we can create a stable and prosperous Baltic region!" #NT!
 UKR_approach_the_baltic_tt: "£decision_icon_small  §YDecisions§! regarding inviting §c[LAT.GetName]§! and §c[EST.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_membership_for_finland: "Membership for Finland" #NT!
 UKR_membership_for_finland_desc: "Ukraine seeks to establish a robust strategic and economic partnership with Finland. By fostering cooperation in trade, defense, and intelligence sharing, we can strengthen regional stability, advance common interests, and ensure mutual prosperity. Let's forge a strong alliance between our nations!" #NT!
 UKR_membership_for_finland_tt: "£decision_icon_small  §YDecisions§! regarding inviting §c[FIN.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_protection_for_caucasia: "Safeguard the Caucasus" #NT!
 UKR_protection_for_caucasia_desc: "Ukraine is committed to upholding stability and security in the Caucasus region. Through strategic initiatives, we strengthen alliances, enhance border security, and foster cooperation among our fellow Caucasian friends. Our goal is to protect regional sovereignty and promote prosperity. Join us in building a secure and prosperous future for the Caucasus!" #NT!
 UKR_protection_for_caucasia_tt: "£decision_icon_small  §YDecisions§! regarding inviting §c[GEO.GetName]§!, §c[ARM.GetName]§! and §c[AZR.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_membership_for_czechia: "Membership for Czechia" #NT!
 UKR_membership_for_czechia_desc: "Ukraine aims to cultivate strong bilateral relations with Czechia. Through military/economic cooperation, and political ties, we can strengthen our partnership and promote shared values, stability, and prosperity. Join us on this journey of bilateral cooperation and friendship!" #NT!
 UKR_membership_for_czechia_tt: "£decision_icon_small  §YDecisions§! regarding inviting §c[CZE.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_visit_belgrade: "Visit Belgrade" #NT!
 UKR_visit_belgrade_desc: "Ukraine embarks on a diplomatic visit to Belgrade, emphasizing the importance of building strong bonds with our Serbian counterparts. Through high-level discussions, cultural exchanges, and collaborative initiatives, we aim to deepen our bilateral relations, foster mutual understanding, and promote shared interests. This visit will represent our commitment to regional cooperation and a prosperous future together!" #NT!
 UKR_visit_belgrade_tt: "£decision_icon_small  §YDecisions§! regarding inviting §c[SER.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_support_greece: "Support Greece" #NT!
 UKR_support_greece_desc: "Ukraine stands firmly in solidarity with Greece, offering unwavering support. Through diplomatic assistance, humanitarian aid, and collaborative security efforts, we aim to bolster our alliance and promote regional stability. Together, let us foster peace and prosperity in the region!" #NT!
 UKR_support_greece_tt: "\n£decision_icon_small  §YDecisions§! regarding inviting §c[GRE.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_support_turkey: "Support Turkey" #NT!
 UKR_support_turkey_desc: "Ukraine is committed to fostering cooperation and building "bridges" with Turkey. By strengthening diplomatic ties, promoting economic collaboration, and encouraging cultural exchanges, we aim to advance shared interests and strengthen our relationship. Together, we can contribute to regional stability and prosperity!" #NT!
 UKR_support_turkey_tt: "\n£decision_icon_small  §YDecisions§! regarding inviting §c[TUR.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_sponsor_belarussian_entry: "Sponsor Belarussian Entry" #NT!
 UKR_sponsor_belarussian_entry_desc: "After the fall of the BNSP regime in Belarus and the successful transition to democracy, it became clear that the new Belarus requires a new policy towards it. It is in our interest to give protection to the young democracy and we believe that this can bring common good to both nations." #NT!
 UKR_sponsor_belarussian_entry_tt: "£decision_icon_small  §YDecisions§! regarding inviting §c[BLR.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_topple_the_belarussian_threat: "Topple the Belarussian Threat" #NT!
 UKR_topple_the_belarussian_threat_desc: "The Belarusian government is unstable and therefore poses a threat. The fall of Belarus into the hands of either the germans or the russians is unacceptable. And while germany is far away, the russian menace is already standing next-to our eastern border, we cannot allow it to threaten us from the north too. The fate of Belarus is in our hands." #NT!
 UKR_crush_germany: "Crush Germany" #NT!
 UKR_crush_germany_desc: "With Ukrainian nationalists dominating the government, the time has come to put the Ukrainian people first - by taking a serious gamble. For too long our nation's economy and agricultural sector has been geared towards serving the Germany people at our own expense. This will end. Protectionism is the only way we can assert ourselves." #NT!
 UKR_the_hungarian_situation: "The Hungarian Situation" #NT!
 UKR_the_hungarian_situation_desc: "The current state of affairs in Central Europe is alarming. Power in Hungary has been seized by radical revanchists who not only question the sovereignty of all neighboring countries over their lands, but also install terror against their own people. It is better to strike now than give them even more time to prepare for the war." #NT!
 UKR_the_hungarian_situation_tt: "£decision_icon_small  §YDecisions§! regarding inviting §c[HUN.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_state_visit_to_bulgaria: "State Visit to Bulgaria" #NT!
 UKR_state_visit_to_bulgaria_desc: "Ukraine embarks on a state visit to Bulgaria, underscoring the importance of strong relations with our fellow Slavs. This seeks to enhance diplomatic ties between us and [BUL.GetNameDef] through dialogue and collaboration. Let's embark on a journey of friendship and cooperation, strengthening the bonds between Ukraine and Bulgaria." #NT!
 UKR_state_visit_to_bulgaria_tt: "£decision_icon_small  §YDecisions§! regarding inviting §c[BUL.GetName]§! to our alliance will be §Yunlocked§!" #NT!
 UKR_tame_bulgaria: "Tame Bulgaria" #NT!
 UKR_tame_bulgaria_desc: "The government of Bulgaria is nothing but a rogue state that uses its corruption to enslave the people. There have been many discussions in our state about finally taking action against this. If the Bulgarian people will not save themselves, we shall." #NT!
