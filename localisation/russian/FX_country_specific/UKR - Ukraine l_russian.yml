 ### Ideas 
 UKR_mutilated_victory: "Mutilated Victory" #NT!
 UKR_mutilated_victory_desc: "The former leaders of Ukraine betrayed us and our brothers in Galicia, Transcarpathia, Bukovyna, Bessarabia, Kuban and eastern Slobozhanshchyna - this opinion is popular among the people, and calls to return our lands are becoming louder and louder in our time. We have no right to forget - freedom knows no compromises, it is our destiny to put an end to injustice and oppression." #NT!
 UKR_mutilated_victory1: "Mutilated Victory" #NT!
 UKR_mutilated_victory1_desc: "The former leaders of Ukraine betrayed us and our brothers in Galicia, Transcarpathia, Bukovyna, Bessarabia, Kuban and eastern Slobozhanshchyna - this opinion is popular among the people, and calls to return our lands are becoming louder and louder in our time. We have no right to forget - freedom knows no compromises, it is our destiny to put an end to injustice and oppression." #NT!
 UKR_obsolete_agriculture: "Archaic Agriculture" #NT!
 UKR_obsolete_agriculture_desc: "Ukraine has fertile agricultural lands that are very suitable for food production, however, our methods in agriculture still originates from the now defunct Tsarist Era. We need to modernize to become the Breadbasket of Europe." #NT!
 UKR_insufficient_industrialization: "Insufficient Industrialization" #NT!
 UKR_insufficient_industrialization_desc: "The economy of Ukraine is currently dependent of its exports of wheat and other food products. While there have been programs of modernization in the past few decades, the majority of it is still lacking." #NT!
 UKR_russian_issue: "Russian Language Issue" #NT!
 UKR_russian_issue_desc: "The centuries-long Russian dominance of Ukraine and suppression of the Ukrainian language has produced a sizeable Russian-speaking minority, or perhaps even majority, in Ukraine. With independence, the Ukrainian language has been reinvigorated, much to the chagrin of numerous Russo-Ukrainians, many of whom resist the Ukrainian government or even desire a return to Russian rule." #NT!
 UKR_underfunded_army: "Underfunded Army" #NT!
 UKR_underfunded_army_desc: "After the signing of the peace of Riga, the government didn't pay enough attention to the army. Because of this, the development of doctrine and equipment lagged behind. It is necessary to quickly improve the armed forces, so that in the new war we will adequately defend our country." #NT!
