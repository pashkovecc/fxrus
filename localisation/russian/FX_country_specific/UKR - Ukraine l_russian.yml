 UKR_zaporozhets_production_desc: "" #NT!
 UKR_modern_farm_equipment: "Modern Farm Equipment" #NT!
 UKR_modern_farm_equipment_desc: "Outdated farming techniques causes us a significant amount of wasted output across our agricultural sector. Modernising how we process our crops will greatly improve both the yields and the quality of what our farms produce annually, which should go a long way in preventing any future shortages." #NT!
 UKR_new_processing_plants: "New Processing Plants" #NT!
 UKR_new_processing_plants_desc: "To better control the entire industrial process we will complete our basic industry with an expanded processing industry allowing for bigger and better outputs." #NT!
 UKR_roads_to_the_farmlands: "Roads to the Farmlands" #NT!
 UKR_roads_to_the_farmlands_desc: "Many within Ukraine's rural areas and provinces needs to improve its infrastructure and roads to better modernise. More roads should be built in a network connecting important parts of the province together." #NT!
 UKR_electrification_programs: "Electrification Programs" #NT!
 UKR_electrification_programs_desc: "The multitude of benefits from electrification are a matter debated by none. This technology has existed in our cities since the decade. While the sector has enjoyed steady growth since then, there are still many in our nation who do not enjoy the benefits of electricity. As part of the modernisation of the economy, many are calling for a focused expansion of electricity across our nation, so that no town will be left in the darkness." #NT!
 UKR_subsidize_azovstal: "Subsidize Azovstal" #NT!
 UKR_subsidize_azovstal_desc: "While it may sound redundantly obvious, it will be impossible to build an industrial region without the construction services to do so, as we are already finding companies struggling to meet the specifications of modern factories. Funding will be allocated for the expansion and modernisation of construction companies and their equipment. This effort should hopefully allow us to speed up the growth of our industrial capabilities." #NT!
 UKR_national_defence_arsenal: "National Defence Arsenal" #NT!
 UKR_national_defence_arsenal_desc: "Until now domestic weapons manufacturing in our nation has been practically non existent apart from artisanal hunting rifles. As tensions continue to rise however and the availability of weapons becomes scarcer by the day, the Defence ministry has requested that we assign them a grant to prospect for a potential site for our own production facilities." #NT!
 UKR_farming_subsidies: "Agricultural Subsidies" #NT!
 UKR_farming_subsidies_desc: "It is necessary to subsidise farms for crops we are in need of, and paying farmers to terminate their fields of lost assets for products like tobacco we don't need right now, but want the skilled labour to still be available." #NT!
 UKR_urbanization_programs: "Urbanization Programs" #NT!
 UKR_urbanization_programs_desc: "Many of our cities are old, and their infrastructure reflects this. A combination of age and underfunding has made our cities seem archaic, with many public services and housing either at their limits or crumbling. A series of ambitious plans have been drafted to completely revitalise Ukraine's urban areas and their services." #NT!
 UKR_expand_trading_ports: "Expand Trading Ports" #NT!
 UKR_expand_trading_ports_desc: "" #NT!
 UKR_railway_improvements: "Railway Improvements" #NT!
 UKR_railway_improvements_desc: "As part of our policy on state modernisation, we must expand the rail network in our predominantly agrarian nation. We will expand the Railway Service to include operating and managing state railways, auditing and supervision of private branch roads, and the design and construction of new railways." #NT!
 UKR_increase_food_exports: "Increase Food Exports" #NT!
 UKR_increase_food_exports_desc: "Owing to our support for the cultivation of efficient food stuffs, state storehouses overflow with surplus. In order to facilitate greater cooperation with our neighbords, we should offer to sell them this surplus at a low price." #NT!
 UKR_technocratic_education: "Technocratic Education" #NT!
 UKR_technocratic_education_desc: "Much of our rural population was never able to receive any form of education, and this has gone a long way to entrenching the economic divides and advancement problems in our nation. In a bid to remove the barriers many rural individuals experience due to their lack of education, we will intensify efforts to eliminate rural illiteracy across our nation. While it may prove costly, it is hoped that it will pay off in the long run." #NT!
 UKR_ukrainian_school_engineering: "Ukrainian School of Engineering" #NT!
 UKR_ukrainian_school_engineering_desc: "" #NT!
 UKR_new_industrial_areas: "New Industrial Areas" #NT!
 UKR_new_industrial_areas_desc: "The most straightforward way to combat unemployment is to kickstart large public works projects the unemployed can participate in. They can then use the money they earn with this to take care of their families. As an added bonus, the money they spend will enter the economy and help it recover." #NT!
 UKR_fund_housing_programs: "Fund Housing Programs" #NT!
 UKR_fund_housing_programs_desc: "" #NT!
 UKR_poltavian_oil_fields: "Poltavian Oil Fields" #NT!
 UKR_poltavian_oil_fields_desc: "Our nation's natural wealth remains mostly unsurveyed and unexploited. A state mining company should be established to finally survey what lies beneath our nation and put our natural resources fully to work." #NT!
 UKR_develop_industrial_heartland: "Develop Industrial Heartland" #NT!
 UKR_develop_industrial_heartland_desc: "" #NT!
 UKR_eastern_cluster: "Eastern Cluster" #NT!
 UKR_eastern_cluster_desc: "" #NT!
 UKR_dnipro_hes: "Dnipro HES" #NT!
 UKR_dnipro_hes_desc: "" #NT!
 UKR_kryvyi_rih_basin: "Kryvyi Rih Basin" #NT!
 UKR_kryvyi_rih_basin_desc: "" #NT!
 UKR_greater_buildup: "Greater Buildup" #NT!
 UKR_greater_buildup_desc: "" #NT!
 UKR_economic_recovery: "Towards Economic Recovery" #NT!
 UKR_economic_recovery_desc: "Social problems always provoke political instability. Lots of peasants join Socialist, nationalist or Russian separatist movements because of awful living conditions. If we want to save Ukraine from collapse, we should start a recovery programme and help the poorest grain-growers in Central Ukraine, providing our population with the cheap electricity they require. For this, we need cash." #NT!
  
 UKR_economic_recovery_tt: "§GThis focus will be automatically be bypassed once the London Stock Market Crash has reached Ukraine.§!" #NT!
 UKR_fiscal_reforms: "Fiscal Reforms" #NT!
 UKR_fiscal_reforms_desc: "Intense and extensive fiscal reforms have greatly improved the budgetary situation of both the government and federal units such states." #NT!
 UKR_privatization_spree: "Privatization Spree" #NT!
 UKR_privatization_spree_desc: "Almost all of the publicly-owned companies are doing poorly, suffering from mismanagement and even corruption. Rather than revise their practices, perhaps it's best to put them back in the hands of the private sector where they can be run by proper businessmen rather than bureaucrats." #NT!
 UKR_trade_tariffs: "Trade Tariffs" #NT!
 UKR_trade_tariffs_desc: "We can try protecting our own economy by implementing tariffs against the cheap goods that enter Ukraine while bringing in some money as well." #NT!
 UKR_lift_interest_caps: "Lift Interest Caps" #NT!
 UKR_lift_interest_caps_desc: "Banks in Ukraine take loans from the Central Bank of Ukraine. By increasing the interest over these loans, we can influence the money supply and lower our inflation once." #NT!
 UKR_public_works: "Public Works" #NT!
 UKR_public_works_desc: "" #NT!
 ### Politics 
 UKR_general_elections: "General Elections" #NT!
 UKR_general_elections_desc: "As the political landscape of Ukraine evolves, it's time to pave the way for democracy through general elections. May the new leaders guide Ukraine towards a brighter future by embracing democratic principles and empowering their people." #NT!
 UKR_general_elections_tt: "§GThis focus will be automatically be bypassed once the 1936 General Elections have been concluded.§!" #NT!
 UKR_social_democratic_party: "Social-Democratic Party Victory" #NT!
 UKR_social_democratic_party_desc: "The baton passes to the Social Democratic Party and its coalition of the left to form a government and manage Ukraine for the next four years." #NT!
 UKR_social_democratic_party_tt: "§GThis focus will automatically be bypassed once the Social-Democratic Party of Ukraine has won the 1936 General Elections.§!" #NT!
 UKR_peoples_labour_party: "People's Labour Party" #NT!
 UKR_peoples_labour_party_desc: "The baton passes to the renewed People's Labour Party to form a government and manage Ukraine for the next four years." #NT!
 UKR_peoples_labour_party_tt: "§GThis focus will automatically be bypassed once the People's Labour Party of Ukraine has won the 1936 General Elections.§!" #NT!
 UKR_hetmanists_statemen_union: "Hetmanists-Statemen Union" #NT!
 UKR_hetmanists_statemen_union_desc: "The baton passes to the renewed Hetman-Statemen Union to form a government and manage Ukraine for the next four years." #NT!
 UKR_hetmanists_statemen_union_tt: "§GThis focus will automatically be bypassed once the Hetmanists-Statemen Union has won the 1936 General Elections.§!" #NT!
 UKR_coalition_with_the_cpu: "Coalition with the CPU" #NT!
 UKR_coalition_with_the_cpu_desc: "Lapchysky believes that creating a coalition between our government and the Communist Party of Ukraine will result in a better living and working conditions for the average Ukrainian." #NT!
 UKR_coalition_with_the_cpu_tt: "Both the §oPro-Soviet§! and §rNational§! factions of the §RUkrainian Communist Party§! will join our government\n\n" #NT!
 UKR_nationalise_foreign_assets: "Nationalise Foreign Assets" #NT!
 UKR_nationalise_foreign_assets_desc: "Our economy is in a chaotic state, which is just the right time to undergo a large scale nationalisation programme. While we will permanently alienate our corporate allies, it will strongly strengthen the government." #NT!
 UKR_benefits_for_the_unemployed: "Benefits for the Unemployed" #NT!
 UKR_benefits_for_the_unemployed_desc: "All our citizens deserve a basic safety net. Let us institute a system of social security for all our sick, old, and unemployed" #NT!
 UKR_encourage_unionization: "Encourage Unionization" #NT!
 UKR_encourage_unionization_desc: "Labour unions must rise to become the dominant force within our economy, unions now empower every extent of the Commonwealth government." #NT!
 UKR_socialist_economy: "Socialist Economy" #NT!
 UKR_socialist_economy_desc: "The economy of the Ukrainian state has been reformed according to the principles of social democracy, and the people rejoice" #NT!
 UKR_breadbasket_of_europe: "Breadbasket of Europe" #NT!
 UKR_breadbasket_of_europe_desc: "With new infrastructure and technological advancement, Ukraine's agricultural output, already substantial, has grown to become one of the largest in Europe. Ukrainian produce permeates throughout Europe, and perhaps no meal is eaten that hadn't at least partially originated in Ukraine; Ukraine has now truly become the breadbasket of Europe." #NT!
 UKR_free_higher_education: "Free Higher Education" #NT!
 UKR_free_higher_education_desc: "A state in the twentieth century must employ education programmes befitting of its century - old, antiquated education practices must be abolished and a new system built on incentivising merit and achievement, not aristocratic birth." #NT!
 UKR_radical_land_reform: "Radical Land Reform" #NT!
 UKR_radical_land_reform_desc: "We shall now start a programme of limited land reform that will ensure the peasants will have lands to work, confiscated from the rich and sold to foreign powers. The rich landowners will take the brunt of it, naturally." #NT!
 UKR_finance_small_businesses: "Finance Small Businesses" #NT!
 UKR_finance_small_businesses_desc: ""While large plantations are important for our industry, small businesses in Kyiv, other urban areas, and other towns also need our support to survive the economic chaos independence brought." #NT!
 UKR_status_of_the_bund: "Status of the Bund" #NT!
 UKR_status_of_the_bund_desc: "The Bund is an association of trade unions formed by the Jewish minority in our country. While the Bund is allied to the Social-Democratic Party, the more radical elements within the party criticise them for their strong attachment to their religion and ethnicity, wanting to form a national trade union congress in order to erode the power of the Bund." #NT!
 UKR_ministry_of_culture_and_arts: "Ministry of Culture and Arts" #NT!
 UKR_ministry_of_culture_and_arts_desc: "Ukraine establishes the Ministry of Culture to nurture our diverse artistic heritage. This initiative supports creativity, preserves traditions, and provides a platform for artists to flourish. By removing barriers and embracing inclusivity, we celebrate the richness of our cultural tapestry. Together, let's build a future where culture thrives and unifies our nation." #NT!
 UKR_review_the_military_budget: "Review the Military Budget" #NT!
 UKR_review_the_military_budget_desc: "In order to defend our sovereignity and independence from foreign threats that wish to eliminate Ukrainian independence, we should bolster our military spending in order to combat external threats and conflicts that may come from the horizon." #NT!
 UKR_ban_the_nationalists: "Ban the Nationalists" #NT!
 UKR_ban_the_nationalists_desc: "What is the point of fighting off these nationalist agitators if we do not dare to strike at the root of the disease? The nationalists and reactionaries is obviously a cover for nationalists to hide behind, and a democratic Ukraine does not need them." #NT!
 UKR_increase_social_spending: "Increase Social Spending" #NT!
 UKR_increase_social_spending_desc: "The LSDP wishes to drastically expand the Ukrainian welfare state and invest more into the trade unions and social programmes in order to ease the after-effects of the Black Wednesday event. However, this has led to a heated discussion with the coalition partners who claim that anything beyond a minimum wage, pensions and work safety regulations is too close to bolshevism." #NT!
 UKR_irrigation_projects: "Irrigation Projects" #NT!
 UKR_irrigation_projects_desc: "Due to the arid state of much of our nation we should look into expanding irrigation programmes to better support our agricultural industry." #NT!
 UKR_irrigation_projects_tt: "£decision_icon_small Unlocks decision: §YBuild Irrigation Systems in [93.GetName]§!\n£decision_icon_small Unlocks decision: §YBuild Irrigation Systems in [197.GetName]§!\n£decision_icon_small Unlocks decision: §YBuild Irrigation Systems in [198.GetName]§!\n£decision_icon_small Unlocks decision: §YBuild Irrigation Systems in [201.GetName]§!\n£decision_icon_small Unlocks decision: §YBuild Irrigation Systems in [202.GetName]§!\n£decision_icon_small Unlocks decision: §YBuild Irrigation Systems in [203.GetName]§!\n£decision_icon_small Unlocks decision: §YBuild Irrigation Systems in [226.GetName]§!\n" #NT!
 UKR_rising_socialist_democracy: "Rising Socialist Democracy" #NT!
 UKR_rising_socialist_democracy_desc: "The time has come when we have consolidated our power enough. We will start direct democracy in the country, and the people will choose their new leader." #NT!
 UKR_introduce_minimum_wage: "Introduce Minimum Wage" #NT!
 UKR_introduce_minimum_wage_desc: "Many people are currently working for less than they need for survival. Let us implement a general minimum wage that provides a safety net to those most in need..." #NT!
 UKR_develop_the_rural_regions: "Develop the Rural Regions" #NT!
 UKR_develop_the_rural_regions_desc: "While there are urban cities around Ukraine, it numbers doesn't compare much to our neighbord in Western Europe. Developing rural regions can be quite expensive, but the long term return of investment will sure be beneficial." #NT!
 UKR_state_taxation_reforms: "State Taxation Reforms" #NT!
 UKR_state_taxation_reforms_desc: "Too many taxes are kept at a federal level, a clear betrayal of the federal arrangement dating years now. We will ensure that each federal unity has enough income to properly sustain itself." #NT!
 UKR_safeguard_press_freedoms: "Safeguard Press Freedoms" #NT!
 UKR_safeguard_press_freedoms_desc: "By guaranteeing the freedom of the press we can send a message to all Ukrainians, that they are truly free and that we are unafraid to face criticism." #NT!
 UKR_soften_regulations: "Soften Regulations" #NT!
 UKR_soften_regulations_desc: "Overly strict regulations over banks and other institutions, coupled with excessive taxation, are causing issues in these times of uncertainty. We must ensure our economy works smoothly." #NT!
 UKR_financial_institutions: "Financial Institutions" #NT!
 UKR_financial_institutions_desc: "Our government lacks many hallmarks of a proper modern economy, from macro-economic planning to basic currency control. If we are to improve our capacity to intervene when needed, we must ensure our tools to do so are properly sharpened." #NT!
 UKR_free_economy: "Free Economy" #NT!
 UKR_free_economy_desc: "The Ukrainian economy has been put under light state management, granting freedom to corporate unions and citizens in the economy." #NT!
 UKR_bastion_of_eastern_european_democracy: "Bastion of Eastern European Democracy" #NT!
 UKR_bastion_of_eastern_european_democracy_desc: "" #NT!
 UKR_heavy_handed_development: "Heavy Handed Development" #NT!
 UKR_heavy_handed_development_desc: "Sometimes, the invisible hand needs a light nudge in the right direction. This isn't one of those times, for the state must take greater reign over the economy!" #NT!
 UKR_farming_grants: "Farming Grants" #NT!
 UKR_farming_grants_desc: "The fertile plains of Ukraine are covered in fields and farms, growing food to feed our nations. But these regions, particularly in rural Ukraine, suffer from less industrial investment and mechanisation. Starting a large scale effort to improve the farming techniques will cost us, but we will be rewarded with young, fit men ready for service." #NT!
 UKR_garner_private_capital: "Garner Private Capital" #NT!
 UKR_garner_private_capital_desc: "By establishing joint ventures with our private sector, we can improve our nation's recovering economic situation" #NT!
 UKR_bank_of_ukraine: "End the Bank Reform" #NT!
 UKR_bank_of_ukraine_desc: "Up until recently much of Ukraine's economy has been splintered into various local financial ecosystems under local mayors and other local government officials. By finally creating a centralised banking system with its beating heart centred in Kiev we will be able to break this trend and drive our economy in one unified direction." #NT!
 UKR_flexibilise_work_laws: "Flexibilise Work Laws" #NT!
 UKR_flexibilise_work_laws_desc: "The fixed laws set by previous administrations are too strict and encourage informal employment. We should modernise and flexibilise contracts with a modern, forward looking mindset." #NT!
 UKR_guarantee_religious_freedoms: "Guarantee Religious Freedoms" #NT!
 UKR_guarantee_religious_freedoms_desc: "Ukraine itself follows a very different sect of Christianity compared to the rest of Western Europe, and it would be difficult to convert everyone to our point of view. Ensuring they can practise their religions in peace should work as an alternate solution." #NT!
 UKR_support_the_unions: "Support the Unions" #NT!
 UKR_support_the_unions_desc: "We shall create a special place in the Assemblea Popular for Trade and Agricultural Unions. These unions will represent each craft essential in the functioning of Ukraine." #NT!
 UKR_new_universities: "New Universities" #NT!
 UKR_new_universities_desc: "It is not enough simply to rely on foreign experts to run our businesses. The creation of several new Western European-style institutes of technology and research universities that will teach not just the liberal arts but physics, chemical engineering and nuclear science will greatly expand the knowledge base of our nation and provide skilled workers for modern industries." #NT!
 UKR_reignite_ukrainian_nationalism: "Reignite Ukrainian Nationalism" #NT!
 UKR_reignite_ukrainian_nationalism_desc: "Our people can and should be proud to be born Ukrainian. They share a rich history, a beautiful language and a common national identity. It is our duty to emphasise the importance and greatness of Ukrainian culture. After all, it is what sets us apart from the other nations and what defines both our country and our future." #NT!
 UKR_promote_the_ukrainian_language: "Promote the Ukrainian Language" #NT!
 UKR_promote_the_ukrainian_language_desc: "In order to safeguard both of our country's independence and identity we need to promote our own culture, one way of doing that is to encourage the use of Ukrainian in all of formal and informal methods of communication such as in government, academic and business settings." #NT!
 UKR_protection_for_minorities: "Protection for Minorities" #NT!
 UKR_protection_for_minorities_desc: "Despite our best efforts to bring about an equal society, the reality has been less than ideal, as even with constitutional guarantees, there remains tension between that nation's ethnic groups. We must not only have codified guarantees, but our actions must match the formalities and renew our dedication to the Personal Principle."" #NT!
 UKR_judicial_reforms: "Judicial Reforms" #NT!
 UKR_judicial_reforms_desc: "The backwards Tsarist-Russian dominated court system must be brought into the modern era. They will learn to operate with our new government." #NT!
 UKR_ukraine_liberal_and_free: "Ukraine, Liberal and Free" #NT!
 UKR_ukraine_liberal_and_free_desc: "The Rada has passed an amendment to the Ukrainian Constitution, enshrining basic freedoms such as freedom of speech, freedom of assembly, freedom of the press, and perhaps most significantly, freedom to organize into a trade union. The protections of unionization and a free press may not go over well with the Germans, but King Vasyl has publicly announced that such freedoms are necessary to prevent a socialist uprising." #NT!
 UKR_strengthen_our_grip: "Stengthen Our Grip" #NT!
 UKR_strengthen_our_grip_desc: "It is clear that we must begin to turn our attention to cementing the power of our party, and ensure that the Ukrainian people begin to acknowledge our control and influence so we can do the other radical policies we have planned." #NT!
 UKR_discredit_the_socialist_opposition: "Discredit the Socalist Opposition" #NT!
 UKR_discredit_the_socialist_opposition_desc: "Many within the socialists who call themselves moderates are nothing more than bolsheviks in the wolf's clothing, we will make sure that the Social-Democratic Party of Ukraine will be tainted in the hearts of the people, to avoid them from being in power again." #NT!
 UKR_the_monarchy_referendum: "The Monarchy Referendum" #NT!
 UKR_the_monarchy_referendum_desc: "The legacy of the Ukrainian monarchy still hangs over the republican government. Calls for a public referendum to determine if a monarchy should be restored for the stability of the nation, or if the republic should instead persist." #NT!
 UKR_statist_economic_management: "Statist Economic Management" #NT!
 UKR_statist_economic_management_desc: "No longer shall decisions be made by those who do not have Ukraine first on their thoughts and hearts. We shall increase state management of the economy and establish controls over the industrial sector." #NT!
 UKR_corporate_economy: "Corporate Economy" #NT!
 UKR_corporate_economy_desc: "The economy of the Ukrainian state has been reformed according to the principles of statist corporatism, and the people rejoice." #NT!
 UKR_slava_ukraini: "Slava Ukraini!" #NT!
 UKR_slava_ukraini_desc: "'Slava Ukraini!'- Glory to Ukraine - is the national salute of Ukraine. First heard in the brief revolution of 1917, it has since been repurposed by right and left alike as a symbol of Ukrainian unity. It is now being heard along the streets of Kyiv, oftentimes accompanied with praises to the Hetman, and the threat of Syndicalism has been more or less expunged." #NT!
 UKR_church_backing: "Church Backing" #NT!
 UKR_church_backing_desc: "Faith is a key pillar of Ukrainian society and our ties with the church are vital to staying in power. Encouraging their development projects and allowing them near unlimited freedom will surely prove to be a wise decision." #NT!
 UKR_censor_the_press: "Censor the Press" #NT!
 UKR_censor_the_press_desc: "The Rada have begun to draft up new censorship laws, which they state will keep the Ukrainian way of life from being tainted by those who wish to see it fall." #NT!
 UKR_education_programmes: "Education Programmes" #NT!
 UKR_education_programmes_desc: "As part of the King's new reforms to educate the 'Model Ukrainian', many education reforms have been put into place. The government will increase funding to schools and institutes to encourage research and intellectualism to develop in Ukraine. These reforms will enable the use of Ukrainian in schools and focus on expanding the research wings of Ukrainian schools such as the Kiev State University to allow Ukraine to catch up with the rest of Europe." #NT!
 UKR_administrative_language_reforms: "Administrative Language Reforms" #NT!
 UKR_administrative_language_reforms_desc: "New administration language reforms are planning to be put in force to firstly make Ukraine the language of the land. These reforms are seen as extreme, to say the least, removing autonomy for the minorities of the Kingdom." #NT!
 UKR_nationalist_fervour: "Nationalist Fervour" #NT!
 UKR_nationalist_fervour_desc: "For years, our nation has been outcast and regretted their past deeds, but from here on out, it is time for us to rise!" #NT!
 UKR_three_year_plan: "Three Year Plan" #NT!
 UKR_three_year_plan_desc: "Our nation still lies predominantly agricultural and backward compared to our neighbours. Thus let us begin a rigorous period of industrialisation as we will start government projects to construct infrastructure and industry. We will power our nation with oil shale as a means of fuel and increase the productivity and output of Ukraine. Not only will these projects provide employment, but they will show that Ukraine will genuinely be a Eastern European success story!" #NT!
 UKR_three_year_plan_tt: "£decision_icon_small Unlocks decision: §YDevelop [93.GetName]§!\n£decision_icon_small Unlocks decision: §YDevelop [197.GetName]§!\n£decision_icon_small Unlocks decision: §YDevelop [198.GetName]§!\n£decision_icon_small Unlocks decision: §YDevelop [201.GetName]§!\n£decision_icon_small Unlocks decision: §YDevelop [202.GetName]§!\n£decision_icon_small Unlocks decision: §YDevelop [203.GetName]§!\n£decision_icon_small Unlocks decision: §YDevelop [226.GetName]§!\n" #NT!
 UKR_reform_the_conscription_system: "Reform the Conscription System" #NT!
 UKR_reform_the_conscription_system_desc: "As part of the three-year plan continues, we need to extract more and more recruits from the other rural areas - let us reform the conscription system with this goal in mind. Every region shall have its conscription offices and be tasked with the collection of imposed quotas." #NT!
 UKR_state_owned_arms_industries: "State-Owned Arms Industries" #NT!
 UKR_state_owned_arms_industries_desc: "We should put the process of arms production and distribution in the hands of the government, rather than private contractors, and establish new arms industries." #NT!
 UKR_agricultural_cooperatives: "Agricultural Cooperatives" #NT!
 UKR_agricultural_cooperatives_desc: "Ukraine's heart and soul lie in agriculture - we must support it with the creation of a system of agricultural cooperatives, which would foster camaraderie between the peasantry and improve their productive output." #NT!
 UKR_legacy_of_kievan_rus: "Legacy of Kyivan Rus" #NT!
 UKR_legacy_of_kievan_rus_desc: "The Kievan Rus holds a significant place in the history of Eastern Europe. Emerging in the late 9th century, it was a medieval federation of East Slavic tribes centered around the city of Kiyv. It was ruled by a single dynasty --created by the Viking Rurik-- for 358 years. By promoting research  and educational/informational programs, we ensure that the legacy of the Kievan Rus lives on, forever." #NT!
 # OUN 
 UKR_victory_for_the_oun: "Victory for the OUN" #NT!
 UKR_victory_for_the_oun_desc: "When the votes were counted, national radio and newspapers announced the victory of Yevhen Konovalets and the organization of ukrainian nationalists. Expert opinion explains this by saying that people are tired of the left, they want to see a new, strong government that can unite the people in the face of the looming threat" #NT!
 UKR_victory_for_the_oun_tt: "§GThis focus will automatically be bypassed once the Organization of Ukrainian Nationalists has won the 1936 General Elections.§!" #NT!
 UKR_yaryi_government: "Yaryi Government" #NT!
 UKR_yaryi_government_desc: "" #NT!
 UKR_empower_the_state_apparatus: "Empower the State Apparatus" #NT!
 UKR_empower_the_state_apparatus_desc: "The executive powers have always been a bit too weak and this allowed the left-leaning Rada to dominate state affairs. But with the new government in place it is time to extend them so as to create a greater and stronger Ukrainian state." #NT!
 UKR_ilnystky_plan: "Ilnystky's Plan" #NT!
 UKR_ilnystky_plan_desc: "" #NT!
 UKR_ilnystky_plan_tt: "£decision_icon_small  §YDecisions§! regarding building up our §cindustrial base§! in different states will be §Yunlocked§!" #NT!
 UKR_establish_svnp: "Establish SVNP" #NT!
 UKR_establish_svnp_desc: "With the last few years being tumultous at best it has been decided that a new kind of police force must be established. One that will strike from the shadows and monitor those extremists in the syndicalists who would see our state crumble." #NT!
 UKR_menlyk_government: "Menlyk Government" #NT!
 UKR_menlyk_government_desc: "Yevhen Konovalets has appointed his longtime friend and comrade-in-arms, Andriy Melnyk, as head of the government. He is considered to be a representative of the old guard among the party members and the head of the "pragmatic faction". Melnyk promises to create a powerful national government in the near future, we'll see where he will lead Ukraine..." #NT!
 UKR_reinstall_order: "Reinstall Order" #NT!
 UKR_reinstall_order_desc: "" #NT!
