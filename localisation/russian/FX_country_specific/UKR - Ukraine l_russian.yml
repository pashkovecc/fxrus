 UKR_natiocracy: "Natiocracy" #NT!
 UKR_natiocracy_desc: "We shall embrace the concept of Natiocracy, a vision that emphasizes the empowerment of our national identity. Through this, we strive to promote our unique heritage, and foster a sense of unity among our people. By investing in education and cultural preservation, we pave the way for a vibrant and resilient society. We shall uphold the principles of Natiocracy, celebrating our diversity while nurturing a strong collective national identity that transcends boundaries and unites us as a nation! " #NT!
 UKR_revaunchism: "Revaunchism" #NT!
 UKR_revaunchism_desc: "" #NT!
 UKR_expand_the_sunm: "Expand the SUNM" #NT!
 UKR_expand_the_sunm_desc: "" #NT!
 UKR_organize_state_controlled_unions: "Organize State Controlled Unions" #NT!
 UKR_organize_state_controlled_unions_desc: "" #NT!
 UKR_preemptive_mobilization: "Preemptive Mobilization" #NT!
 UKR_preemptive_mobilization_desc: "We will adopt the strategy of Preemptive Mobilization to ensure our preparedness in the face of potential "challenges". This will strengthen our military capabilities, and give proactiveness at our defense measures. We will prioritize strategic planning, resource allocation, and of course training. We strive to safeguard our national security and protect our national interests. We shall stand ready and resolute, ensuring a secure and stable future for Ukraine." #NT!
 UKR_proclaim_greater_ukraine: "Proclaim Greater Ukraine" #NT!
 UKR_proclaim_greater_ukraine_desc: "We embark on a path of unity with our final goal of Proclaiming a greater Ukrainian state. This signifies our commitment to bringing together all regions of our nation, fostering inclusivity, and strengthening our national identity. We aim to "build" a stronger Ukraine that embraces diversity while forging a common destiny. A new Ukrainian state shall be once again reborn!" #NT!
 UKR_proclaim_greater_ukraine_tt: "\nThis focus will unlock access to the §YOur Place in the World§! focus branch" #NT!
 # NIPU 
 UKR_victory_for_the_national_integralists: "Victory for the National Integralists" #NT!
 UKR_victory_for_the_national_integralists_desc: "Slava, ura! The National integralist Party of Ukraine has won the elections. The party has set its sights on preparing Ukraine for the retaking of its rightful Ukrainian territories such as Galicia in the west and the Donbas to the East, however if it is to do any of that it must first secure its grip." #NT!
 UKR_victory_for_the_national_integralists_tt: "§GThis focus will automatically be bypassed once the National Integralist Party of Ukraine has won the 1936 General Elections.§!" #NT!
 UKR_abolish_socialist_organizations: "Abolish Socialist Organizations" #NT!
 UKR_abolish_socialist_organizations_desc: "We have reached an understanding with the pro-Russian circles, pacified the various Ukrainian movements and helped make the peasantry loyal to us. Now we have to deal with the Socialists. Our mass media will start a massive propaganda campaign, showing the socialists as a malignant tumour on Slavdom. Our efforts will eventually enable us to ban many notorious left parties." #NT!
 UKR_cement_our_control: "Cement our Control" #NT!
 UKR_cement_our_control_desc: "The executive powers have always been a bit too weak and this allowed the left-leaning Rada to dominate state affairs. But with the new government in place it is time to extend them so as to create a greater and stronger Ukrainian state." #NT!
 UKR_align_the_courts: "Align the Courts" #NT!
 UKR_align_the_courts_desc: "Some Ukrainian courts are known to have Nationalist biases, if the NIPU can align these courts and present themselves on the side of law. The judges will be happy to rule in their favour." #NT!
 UKR_eliminate_the_liberal_opposition: "Eliminate the Liberal Opposition" #NT!
 UKR_eliminate_the_liberal_opposition_desc: "For many years the moderate republicans of Ukraine have attacked and criticised our rule for various reasons and harken back to the short-lived people's republic. Their influence must be curbed and the legacy of the UNR slandered in the minds of all Ukrainians." #NT!
 UKR_integrate_sich_to_the_police_service: "Integrate Sich to the Police Service" #NT!
 UKR_integrate_sich_to_the_police_service_desc: "The Sich have served the party well and should be integrated into the wider police force to help maintain law and order, they will be a great help hunting down the traitors and subversive elements that seek to pose a threat to the Regime." #NT!
 UKR_death_of_the_republic: "Death of the Republic" #NT!
 UKR_death_of_the_republic_desc: "With the opposition eliminated and our Control cemented, it's about time we put the old sick dog republic to rest, and now welcome the new glorious Ukrainian National State. A government that can truly stand up to the foreign enemies that surround Ukraine. Slava Ukraini! Heroiam slava!" #NT!
 UKR_derzhava_was_born: "Derzhava is Born" #NT!
 UKR_derzhava_was_born_desc: "" #NT!
 UKR_found_sokil_youth: "Found Sokil Youth" #NT!
 UKR_found_sokil_youth_desc: "" #NT!
 UKR_cult_of_the_vozhd: "Cult of the Vozhd" #NT!
 UKR_cult_of_the_vozhd_desc: "" #NT!
 UKR_form_derzhavna_varta: "Form Derzhavna Hvardiia" #NT!
 UKR_form_derzhavna_varta_desc: "With the last few years being tumultous at best it has been decided that a new kind of police force must be established. One that will strike from the shadows and monitor those extremists in the socialists who would see our state crumble." #NT!
 UKR_state_labour_union: "State Labour Union" #NT!
 UKR_state_labour_union_desc: "" #NT!
