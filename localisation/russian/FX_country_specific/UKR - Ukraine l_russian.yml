 ### Focus 
 # Army 
 UKR_review_the_ukrainian_armed_forces: "Review the Ukrainian Armed Forces" #NT!
 UKR_review_the_ukrainian_armed_forces_desc: "As 1936 rolls around, the Government has set out to conduct the yearly review of the Army's Internal Structure. As an important part of the country's survival, the government will dedicate much of time and resources to grooming the developing Military Apparatus." #NT!
 UKR_reorganize_the_army: "Reorganize the Army" #NT!
 UKR_reorganize_the_army_desc: "Our ground forces must be a new priority, promoting those generals who can bring the greatest benefit and reforming their methods for the sake of the nation." #NT!
 UKR_armour_and_speed: "Armour and Speed" #NT!
 UKR_armour_and_speed_desc: "High Armoured Mobility is key in modern warfare. Which is why we should make sure we have an ample supply of armoured mechanical vehicles that we know how to properly utilise." #NT!
 UKR_shock_and_awe: "Shock and Awe" #NT!
 UKR_shock_and_awe_desc: "Sometimes, using artillery fire is necessary not so much for defeating the enemy, as much as disorganising and discombobulating it. Effective campaign of such allows the enemy to show its weakness, which is why we should invest in artillery most effective in this department." #NT!
 UKR_logistics_improvements: "Logistics Improvements" #NT!
 UKR_logistics_improvements_desc: "Although our largely flat terrain is usually seen as a disadvantage, there is one key upside to it. That is, the ease of logistical supply. Taking steps to ensure we can keep continuously supplying our troops is our current chief directive." #NT!
 UKR_reverse_engineering: "Reverse Engineering" #NT!
 UKR_reverse_engineering_desc: "Experimentation in the Tanking Department (centralized around the Kharkiv Locomotive Factory) is something that we've been engaging in for almost a decade now and it seems like our efforts have started to bear fruit, spearheaded by Junior Officer Ivan Cherniakhovskyi. We should take steps to deploy our prototypes on the field." #NT!
 UKR_utilize_motor_factories: "Utilize Motor Factories" #NT!
 UKR_utilize_motor_factories_desc: "The Kharkiv Locomotive Factory is responsible for manufacturing various motorized vehicles for civilian and farm use. We can utilize their expertise and contract them to build us motorized vehicles for the military use." #NT!
 UKR_expand_the_armoured_corps: "Expand the Armoured Corps" #NT!
 UKR_expand_the_armoured_corps_desc: "The future of warfare depends on the speed and agility of the troops. As we further lean on the mobility doctrines, we must also expand our armored divisions." #NT!
 UKR_expand_the_armoured_corps_tt: "§7Receive §Y[UKR.GetAdjective] Armor Division§! template with the following composition:\n - 2 £GFX_unit_light_armor_icon_small battalions;\n - 2 £GFX_unit_motorized_icon_small battalions.\n\nSpawn §Y2§! division with newly gained template§!\n" #NT!
 UKR_armoured_infantry: "Armoured Infantry" #NT!
 UKR_armoured_infantry_desc: "A key aspect of the doctrine we will adopt will be the fast moving forces that will ensure our victory. And no, we can't use horses, so we'll need a fully mechanised, combat ready infantry force." #NT!
 UKR_modernize_artillery: "Modernize Artillery" #NT!
 UKR_modernize_artillery_desc: "There's little more effective in warring than a punishing barrage of firepower on any given target. Effectiveness of such strategies increases even further in the event of utilising specialized artillery in divisions. Which we shall do." #NT!
 UKR_production_quotas: "Production Quotas" #NT!
 UKR_production_quotas_desc: "Many of the military setbacks of the former Russian Empire in the Great War were the result of shortages and shortcomings due to the outdated military industry. Proposed by our lawmakers, these policies seeks to impose new standards and regulations on our military industry to bolster production quotas. While meeting these standards will be costly in the short term, it'll allow us to improve our production in the long term." #NT!
 UKR_weapons_production_lines: "Weapons Production Lines" #NT!
 UKR_weapons_production_lines_desc: "More, more, and more - we will need more to build up our nation. We must increase our manufacturing processes while also streamlining our weapons production to new heights. One way or another, we will show the world the prowess of our nation!" #NT!
 UKR_engineering_corps: "Engineering Corps" #NT!
 UKR_engineering_corps_desc: "It is true that our nation's borders are not particularly defendable. Which is all the more reason why we should focus on proper entrenchment and fortification courses. For one we should be able to defend our borders, no matter where the threat comes from." #NT!
 UKR_anti_air_and_anti_tank: "Anti-Air and Anti-Tank" #NT!
 UKR_anti_air_and_anti_tank_desc: "Artillery has become more and more useful in warfare, so much so that many frontline battalions nowadays are exclusively based on punishing artillery fire. We should take note and go forth, examining the models utilised by our faithful allies in the North. Whatever we find out, we'll be able to combine with our own designs and models." #NT!
 UKR_roll_out_new_rifles: "Roll-out New Rifles" #NT!
 UKR_roll_out_new_rifles_desc: "Production of a new battle rifle, based on a design by our own Weapons and Research Bureau, should be sped along in order to ensure we have top-class weaponry. Our best workers have already started a discussion on improving the production lines for the new rifle." #NT!
 UKR_mountaineer_units: "Mountaineer Units" #NT!
 UKR_mountaineer_units_desc: "The Mountains that surround us are an integral part of any national defence plan in case of invasion. Passes, peaks and hillsides must not be garrisoned with fresh recruits, but with elite specially trained regiments who are ready for the harsh reality of mountain life." #NT!
 UKR_behind_enemy_lines: "Behind Enemy Lines" #NT!
 UKR_behind_enemy_lines_desc: "To make sure we stay vigilant, it is in our interest to enact War Games on a regular basis. Expensive? Perhaps, but it certainly is a worthwhile endeavour, allowing us to properly stay alert." #NT!
 UKR_expanding_the_special_forces: "Expanding the Special Forces" #NT!
 UKR_expanding_the_special_forces_desc: "Currently, our reserve forces are spread out across various departments as a consequence of the bureaucratic disease. We should take steps to rectify this misdirection and unify the reservists across a streamlined number of detachments." #NT!
 UKR_the_war_ministry: "The War Ministry" #NT!
 UKR_the_war_ministry_desc: "The War Ministry will be responsible on the joint operations of the military, such as the Army, Navy and Air Force. This new ministry will be composed of various officers from the branches of military will responsible for the defensive and offensive operations of our military." #NT!
 UKR_expand_kiev_officer_school: "Expand the Kyiv Officer School" #NT!
 UKR_expand_kiev_officer_school_desc: "The Kyiv Officer Instruction School was established in 1918, during the first year of Hetman Skoropadskyi's rule and since then has been a consistent source of newfangled officer graduates. We should take steps to expand it." #NT!
 UKR_a_call_to_the_people: "A Call to the People" #NT!
 UKR_a_call_to_the_people_desc: "As the new storm looming across Europe, with the threat of Bolshevism in the East and Paganism in Germany, we must ensure that our nation survival is not at stake." #NT!
 UKR_basic_defense_scheme_for_civilians: "Basic Defense Scheme for Civilians" #NT!
 UKR_basic_defense_scheme_for_civilians_desc: "Training our population to hold and shoot a gun, and defend themselves against the future enemies of our nation will help us defending the motherland." #NT!
 UKR_redouble_production: "Redouble Production" #NT!
 UKR_redouble_production_desc: "Centralising our military production could prove to be detrimental to our nation in times of war since the loss of our industrial centres would mean the end of Argentina. Therefore, the planning committee has decided to spread out the manufactories and secure supply lines even in the worst situations." #NT!
 UKR_science_of_war: "The Science of War" #NT!
 UKR_science_of_war_desc: "As we march into the future, it becomes plainly obvious that new wars will rather be won using superior technology than any long-form trench warfare or “flood-wave” tactics. As such, we should establish an Army department tasked with staying on top of any new developments in Doctrinal or Technological enhancements." #NT!
 # Navy 
 UKR_reinforce_crimea: "Reinforce Crimea" #NT!
 UKR_reinforce_crimea_desc: "Crimea was always an important trade port for Ukraine, that's why we must be ready to defend this city with our Black Sea fleet. We should expand the harbour in Crimea." #NT!
 UKR_start_naval_expansion: "Start Naval Expansion" #NT!
 UKR_start_naval_expansion_desc: "A strong fleet is vital if we are to look beyond simply our own borders. Protecting our trade and coastlines shall require a strong naval force." #NT!
 UKR_repurpose_old_ships: "Repurpose Old Ships" #NT!
 UKR_repurpose_old_ships_desc: "Our country may be able to support its people in manners of food, but other essential resources must be shipped in from the rest of the world. Destroyers will ensure that this supply is protected." #NT!
 UKR_submarines: "Submarines" #NT!
 UKR_submarines_desc: "The submarine is vital to winning any war against a foe reliant upon trade. If their convoys are sunk, their men go without supplies - this will lead to an easy victory. We must ensure that the Black Sea acts for our enemies as little more than a dark watery grave." #NT!
 UKR_black_sea_maneuvers: "Black Sea Maneuvers" #NT!
 UKR_black_sea_maneuvers_desc: "Only a large fleet will suit Ukraine, as without one we won't be able to control the long coastlines of the Black and Azov Seas" #NT!
 UKR_marine_training: "Marine Training" #NT!
 UKR_marine_training_desc: "In order to stay on top in whatever war we may find ourselves in, we will need the navy to possess a significant number of standing divisions capable of amphibious landings. While this may be giving the navy too much power, it's bound to help both branches to be more effective in the battlefield." #NT!
 UKR_carrier_prototypes: "Carrier Prototypes" #NT!
 UKR_carrier_prototypes_desc: "Native dockyards in Odessa and Nikolayev are more than capable of producing large ships, such as carriers and battleships. These will prove priceless in nearly every naval engagement." #NT!
 # Air Force 
 UKR_establish_the_aviation_board: "Establish the Aviation Board" #NT!
 UKR_establish_the_aviation_board_desc: "The Ukrainian Aviation Department has been part of the Army Branch since the onset of its creation. It is time we established a separate overseeing board to make use of more effective planning and strategic outcomes in regards to our Air Force." #NT!
 UKR_gomel_air_base: "Gomel Air Base" #NT!
 UKR_gomel_air_base_desc: "Modern aircraft, pilots and mechanics are all nice, but are useless without the infrastructure needed to even operate the air force. Ukraine is large and will require many new air bases to allow the air force to operate properly and support land and naval operations." #NT!
 UKR_purchase_german_naval_bombers: "Purchase German Naval Bombers" #NT!
 UKR_purchase_german_naval_bombers_desc: "The air can well pair with the sea. Planes carrying torpedoes allow us to instantly kill even the biggest of ships with great accuracy, the torpedoes preventing us from having to hit dead centre on a ship's deck with a bomb. We must invest in naval bombers to gain an edge on big, bulky navies." #NT!
 UKR_deploy_the_new_fighter_prototypes: "Deploy the New Fighter Prototypes" #NT!
 UKR_deploy_the_new_fighter_prototypes_desc: "In recent years we've taken to developing our own Fighter designs, with some joint effort from our other allies. Our efforts have paid off, it seems. Testing has shown a very positive result. As such, we should deploy our newly developed aviation for mass production." #NT!
 UKR_a_domestic_bomber_model: "A Domestic Bomber Model" #NT!
 UKR_a_domestic_bomber_model_desc: "Bombers have been shown to be very effective in disabling various elements of the war machine of any given warring nation. Whenever the next major European war comes, and it will, we must be ready. Depending on the designs utilised by our suppliers (primarily Germany) is all well and good, but it isn't completely viable. As such, we must begin working on own designs." #NT!
 UKR_strategic_bomber_prototype: "Strategic Bomber Prototype" #NT!
 UKR_strategic_bomber_prototype_desc: "Bombing enemy production facilities and supply lines is a great way to stack the odds in our favour against better equipped and more numerous opponents. However, in order to do so, we must ensure that we have aircraft able to properly perform the tasks set aside for it." #NT!
 UKR_enhance_our_aviation_doctrine: "Enhance Our Aviation Doctrine" #NT!
 UKR_enhance_our_aviation_doctrine_desc: "Ever since the creation of our Air Force, it has greatly developed. In order to render it an equal military force to the army and navy, we must develop new aerial doctrines." #NT!
 # Economy 
 UKR_matters_of_the_economy: "Matters of the Economy" #NT!
 UKR_matters_of_the_economy_desc: "While Ukraine's economy is not the weakest in the Eastern European region, it is also not the strongest. With our country with much potential we must learn to utilize it. Improving our economic powress can be long and tendious but in the end it will be worth the sacrifices." #NT!
