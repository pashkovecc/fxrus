 # NIPU Foreign Policy 
 UKR_kolodzinskys_doctrine: "Kolodzinsky's Doctrine" #NT!
 UKR_kolodzinskys_doctrine_desc: "A man from the new generation of ukrainian nationalists,, Mykhailo Kolodzinskyi, after extensive research of history and geography, concluded that Ukraine is doomed to conquer neighboring lands. Our location in the center of the Eastern European plain puts us at risk of constant and destructive invasions from outside, as we have seen many times in the past. Therefore, conquest is the only solution to the security problem, we must reach out to natural barriers such as mountain ranges and seas to ensure the peace and prosperity of our fatherland!" #NT!
 UKR_the_greater_enemy: "The Greater Enemy" #NT!
 UKR_the_greater_enemy_desc: "Whoever is against us, our mortal enemy has been standing on our borders for ages. Muscovy. As countless times before, they are once again arming themselves for a new march westward. The devastation of our country is inevitable if the war is fought on our soil, so we must strike first. The destruction of Muscovy is our duty to the dead, the living, and the unborn. Either we will defeat them once and for all, or we will die trying!" #NT!
 UKR_zhyttieprostir_secured: "Zhyttieprostir Secured" #NT!
 UKR_zhyttieprostir_secured_desc: "The great struggle is over. It is over with our victory. Finally, we have not only liberated our brothers in the Kuban, Donshchyna and eastern Slobozhanshchyna from russian oppression, but also secured lands up to the shores of the Caspian Sea. We will always remember the sacrifice and heroism of the brave sons of Ukraine. They fell so that we could live, live in our new lands." #NT!
 UKR_zhyttieprostir_secured_tt: "£decision_icon_small  §YDecisions§! regarding integrating former §c[SOV.GetAdjective] territories§! will be §Yunlocked§!" #NT!
 UKR_colonization_policy: "Colonisation Policy" #NT!
 UKR_colonization_policy_desc: "" #NT!
 UKR_fate_of_the_russians: "Fate of the Russians" #NT!
 UKR_fate_of_the_russians_desc: "There is a terrible plague inhabiting our sacred lands: Bastard sons and godless whores of the eternal Muscovite spirit. The ones who don't build, but destroy, don't create, but plunder and steal. Uncultured animals from Asia, kleptomaniac conquerors, the most loyal servants of the Elders of Zion. They held Ukrainians in shackles for centuries to satisfy their primitive urges, but finally, the indomitable spirit of Ukraine has liberated itself from the chains. Justice will be done and justice will be ours." #NT!
 UKR_forced_labour: "Prymusova Pratsya" #NT!
 UKR_forced_labour_desc: "" #NT!
 UKR_final_solution: "Ostatochne Rishennya" #NT!
 UKR_final_solution_desc: "Where there is a question, we provide a solution. Unlike so many before us, we don't make half-solutions. Our solutions are final. We will not make an exception with the Russian Question. One day our children will be able to live without having to fear the threat from the East. On the battlefield, there are only the laws of the animal kingdom, no measure is too harsh. One must strike before their enemy takes action. It isn't any different on the battlefield of nations. It is the rightful self-defense of our nation." #NT!
 UKR_final_solution_tt: "£decision_icon_small  §YDecisions§! regarding the Ukrainization of former §c[SOV.GetAdjective] territories§! and the §Rbanishment of its population§! will be §Yunlocked§!" #NT!
 UKR_dismantle_belarus: "Dismantle Belarus" #NT!
 UKR_dismantle_belarus_desc: "Like anything else in an unstable situation, Belarus can pose both a threat and an opportunity. If we leave them without our attention for too long, their land could turn into a northern foothold for the germans or muscovites on their way to our country. To prevent this, our army must be in Belarus first. When we'll strongly stand in Belarus, we will be able to advance further north or directly on Moscow." #NT!
 UKR_belarussian_integration: "Belarusian Integration" #NT!
 UKR_belarussian_integration_desc: "The successful campaign in the north put us in front of the expected question: What to do with Belarus? Although no one doubts the correctness of our actions, opinions regarding the status of Belarus are not the same." #NT!
 UKR_belarussian_integration_tt: "£decision_icon_small  §YDecisions§! regarding integrating §c[BLR.GetAdjective] territories§! will be §Yunlocked§!" #NT!
 UKR_revenge_on_poland: "Revenge on Poland" #NT!
 UKR_revenge_on_poland_desc: "Our defeat in the west was a demonstration of several things: The weakness, lack of will and betrayal of the former regime, which threw our brothers and sisters under the polish boots. For decades, they mocked us, and we had to look on and tolerate it, because this is what the policy of the jedo-democrats looked like. But time has changed, and finally the will of the ukrainian people will be dictated as it should be, our goal is to put an end to the shame of the past and eliminate the polish statehood as one whose existence is incompatible with ours. Onward, to Lviv! Onward to Warsaw!" #NT!
 UKR_attack_the_baltic: "Attack the Baltic" #NT!
 UKR_attack_the_baltic_desc: "" #NT!
 UKR_eliminate_the_polish_partisans: "Eliminate the Polish Partisans" #NT!
 UKR_eliminate_the_polish_partisans_desc: "After our victorious troops crushed the polish army, many of their men went underground to continue resisting our forces. They use cowardly and terrorist tactics to wear down our men. We have developed a specific force to deal with these Issues, their anti-partisan tactics together with polish collaboration and psychological warfare will quickly end these pests." #NT!
 UKR_crush_the_teutons: "Crush the Teutons" #NT!
 UKR_crush_the_teutons_desc: "" #NT!
 UKR_march_on_bratislava: "March on Bratislava" #NT!
 UKR_march_on_bratislava_desc: "" #NT!
 UKR_the_romanian_affair: "The Romanian Affair" #NT!
 UKR_the_romanian_affair_desc: "" #NT!
 UKR_expedition_to_hungary: "Expedition to Hungary" #NT!
 UKR_expedition_to_hungary_desc: "" #NT!
 UKR_subordinate_serbia: "Subordinate Serbia" #NT!
 UKR_subordinate_serbia_desc: "" #NT!
 UKR_attack_bulgaria: "Attack Bulgaria" #NT!
 UKR_attack_bulgaria_desc: "" #NT!
 UKR_punish_alexanders_decendants: "Attack the Greeks" #NT!
 UKR_punish_alexanders_decendants_desc: "" #NT!
 UKR_secure_the_straits: "Secure the Straits" #NT!
 UKR_secure_the_straits_desc: "" #NT!
 UKR_onto_caucasia: "Onto Caucasia!" #NT!
 UKR_onto_caucasia_desc: "The last piece of our empire is waiting. It is difficult to overestimate the importance of the Caucasus for our security. This region is inhabited by rebellious highlanders, which, combined with the mountainous terrain, will pose a challenge to us. However, we have repeatedly proved that our will cannot be broken and we will achieve our goal no matter what it takes. The reward for conquering them will be the inexhaustible oil records of this region." #NT!
  
 ### Events 
 ukraine.1.t: "The Ukrainian People's Republic, 1936" #NT!
 ukraine.1.d: "Following the collapse of the Russian Empire, the Ukrainian people sought to establish their own state along the Dnieper river. The German Empire briefly established a client state with the hopes of using Ukraine's vast fields to feed the Imperial Army, but was forced to evacuate the region following the German revolution in 1918. The Ukrainian People's Republic was re-established, and thrown into the chaos of the Russian Civil War. Coming out victorious against the bolsheviks, the Ukrainians seeked to distance themselves from Russia and create a unique Ukrainian identity wedged between Soviet Russia and a resurgent Germany. With tensions once more rising in Europe, Ukraine must place her bets and pick a side, or be lost to the annals of time." #NT!
 ukraine.1.a: "Shche Ne Vmerla Ukraina!" #NT!
 ukraine.2.t: "Black Wednesday Reaches Ukraine" #NT!
 ukraine.2.d: "The economic crisis that started in the United Kingdom has spiralled out of control and has spread everywhere including Ukraine!. Our country's prosperity has been shattered by Black Monday and the confidence in the government has been shaken." #NT!
 ukraine.2.a: "Oh no!" #NT!
 ukraine.3.t: "Disunity in the Pink-Orange Coalition" #NT!
 ukraine.3.d: "While the coalition between the ruling Social Democratic Party and Labour Party is not rock solid from the start, it kept the current government' stability just enough to continue ruling the country. However, members of both PLU and the SDU have been attacking one another verbally both in the Rada and in public newspapers, while these are only minor members, they could end the whole coalition if we allowed it to continue." #NT!
 ukraine.3.a: "Force a compromise" #NT!
 ukraine.3.b: "End the coalition" #NT!
 ukraine.4.t: "Clashes Between the OUN and PNIU" #NT!
 ukraine.4.d: "Some local police authorities in Zhytomir have reported to the national government of increase violence between the OUN and PNIU militias. These far-right militias are the main oppositions to the current government and to an extent, to each other. While the ideological differences of the two are minor and subtle, the OUN has a more popular leader, and also a war hero, Vyacheslav Lypynsky. We can either focus on pacifying either threat or make them cut each other's throats." #NT!
 ukraine.4.a: "The war hero is a far more greater threat" #NT!
 ukraine.4.b: "Dontsov is a lunatic, keep an eye on him" #NT!
 ukraine.4.c: "Let them be" #NT!
 ukraine.5.t: "Dontsov Accusses Government of Wide-Scale Corruption" #NT!
 ukraine.5.d: "In an attempt to gather support for the incoming elections, Dmytro Dontsov, leader of the National-Integralist Party of Ukraine, one of the most far-right and radical parties in the country have conducted an interview with various newspaper agencies and accussed of the current government of Lev Hankevych of wide-scale corruption done with the construction of various new processing plants in an attempt by the government to modernize the Ukrainian economy. Dontsov further discussed the details of this widespread corruption in an attempt to convince the Ukrainian people to destablize the current government." #NT!
 ukraine.5.a: "The government should answer these allegations" #NT!
 ukraine.5.b: "He's just talking nonsense." #NT!
 ukraine.6.t: "Rumours of President Hankevych's Death" #NT!
 ukraine.6.d: "An intriguing tabloid article has been released this morning speculating about the President's whereabouts. The article stated that the current President [Root.GetLeader] have actually been dead and the Prime Minister have been running things in the government in order to preserve and ensure the stability of the country.\nWhile the President is indeed still alive albeit in bad health, he is very much capable of running the country. However, his advisors have suggested of making a public appearance in order to resolve and put the conspiracy to rest; while his doctors on the other hand advises him to stay in the Presidential Palace and avoid excessive travels that will worsen his health situation." #NT!
 ukraine.6.a: "The President decides to make a public appearance" #NT!
 ukraine.6.b: "The President ignores the matter and heeds to his doctor's words." #NT!
 ukraine.7.t: "President's speech well received" #NT!
 ukraine.7.d: "Due to the ridicious rumours flying around Ukraine, President Hankevych have been forced to make a public appearance in order to quelm to growing unstability in Ukraine. He assured the people the he will continue to govern the country until the next elections." #NT!
 ukraine.7.a: "Very well said." #NT!
 ukraine.8.t: "Deploying the Police?" #NT!
 ukraine.8.d: "Yevhen Konovalets, one of the opposition leaders in the Rada, have started campaigning for the elections that will be held in October. He and his team travels to multiple cities encourging potential voters to vote for the OUN, at the same time, bashing the government of its current policies. They however have one odd request, they have requested a police escorts due to the threats on Konovalets' life. A couple of police constables will join the campaign in order to ensure the safety of not only OUN supporters and campaign team but also other citizens around the area." #NT!
 ukraine.8.a: "We must ensure the safety of the people" #NT!
 ukraine.8.b: "They will be fine, probably." #NT!
 ukraine.9.t: "Death of Konovalets" #NT!
 ukraine.9.d: "Bad news from Kherson, during the campaign of the OUN, a lone assailant have fired a gun targeting Yevhen Konovalets, entering the bullet in his neck and coming out from his lower chest; killing him instantly. The assailant have been arrested and have been detained in the local police station in the city." #NT!
 ukraine.9.a: "Send me the police report" #NT!
 ukraine.10.t: "OUN Supporters flock to NIPU" #NT!
 ukraine.10.d: "In the aftermath of the assassination of Yevhen Konovalets, the National-Integralist Party of Ukraine, headed by Dmytro Dontsov, have accused the government of assassinating Konovalets in order to secure their win in the upcoming elections in October. This has resulted however in current OUN members flocking to the NIPU, strengthening the support and voter base of Dontsov." #NT!
 ukraine.10.a: "Oh no" #NT!
 ukraine.11.t: "Attempted Assassination of Konovalets" #NT!
 ukraine.11.d: "During the campaign of Yevhen Konovalets in the city of Kherson, some lone gunman have attempted to assassinate the OUN leader, fortunately, our deployed police force in the area have spotted the assailant have been quickly arrested the man before he could do any damage.\n\nAfter interrogation, the man confessed that we has sent by Dontsov, to kill Konovalets and blame in onto the government. This have resulted in a massive arrests of NIPU supporters and officials, as well as Dontsov himself. Some have gone into hiding, escaping to Romania and Belarus. But the NIPU have fortunately been decapitated and have no longer influence in the Rada nor the government." #NT!
 ukraine.11.a: "Good grief" #NT!
 ukraine.12.t: "Strikes in Kyiv" #NT!
 ukraine.12.d: "Due to the effects of Black Wednesday, effectively crippling our economy; many radical members of the Socialist Party of Ukraine have organized a strike to protest the rising inflation and lowering of their salaries. These workers were greatly affected by the economic collapse and have been struggling to feed their family ever since.\n\nThe aim of this protests were to reverse the capitalists' move to lower their compensation and for the government to deal with the ever rising economic issues faster. What would the government do?" #NT!
 ukraine.12.a: "Give concessions" #NT!
 ukraine.12.b: "Disperse the strikers" #NT!
 ukraine.13.t: "The [GetYear] General Elections" #NT!
 ukraine.13.d: "According to the Constitution elections are to be held every four years. The Rada's term has expired and the time has come to elect a new parliament. There are 90 seats in the Rada available and various political parties have begun their campaigns. Which one shall prevail?" #NT!
 ukraine.13.a: "Social-Democratic Party" #NT!
 ukraine.13.b: "People's Labour Party" #NT!
 ukraine.13.c: "Union of Hetmanists-Statesmen" #NT!
 ukraine.13.e: "Organization of Ukrainaian Nationalists" #NT!
 ukraine.13.f: "National-Integralist Party of Ukraine" #NT!
 ukraine.14.t: "Status of the Bunds" #NT!
 ukraine.14.d: "Although the Bunds are trade unions, they are being organised by Jews, and for Jews alone. Having been allies of us, most within the party wish to allow them to keep their current influence over the Jewish minority. Radicals however have criticised the Bundas for their disassociation from the rest of the country, wishing to form a national trade union congress in order to undermine their influence and organise all trade unions more centrally." #NT!
 ukraine.14.a: "The Bunds are our natural allies." #NT!
 ukraine.14.b: "Stronger trade unions are an expression of democracy." #NT!
 ukraine.15.t: "Referendum on the Monarchy" #NT!
 ukraine.15.d: "The pro-monarchist forces are busily campaigning in the streets of Kiev and other Ukrainian cities, handing out pamphlets to suggest who should be the future king of Ukraine; there are two candidates for the throne, one if Wilhelm Franz von Habsburg-Lorithgen, an Austrian Archduke and a former colonel of the  Ukrainian Sich Riflemen; the other is Pavlo Skoropadskyi, a Ukrainian aristocrat and a military leader." #NT!
 ukraine.15.a: "Wilhelm von Habsburg shall be Vasyl I" #NT!
 ukraine.15.b: "Pavlo Skoropadskyi shall be the Hetman" #NT!
 ukraine.16.t: "[From.GetName] Requests Equipment Aid" #NT!
 ukraine.16.d: "In an effort to modernize and expand the capabilities of their armed forces, the government of [From.GetName] have requested that we provide them an equipment aid which consists on small arms can be used by their forces. While they have a proper stance that they are squished between the Valkists and the Bolsheviks, the threats within our own country also exists." #NT!
 ukraine.16.a: "Send them the equipment" #NT!
 ukraine.16.b: "We can't spare anything yet" #NT!
 ukraine.17.t: "[From.GetAdjective] Equipment Arrives" #NT!
 ukraine.17.d: "Our friends in [From.GetNameDef] have sent us a shipment of infantry equipment to aid in our struggle." #NT!
 ukraine.17.a: "Much needed!" #NT!
 ukraine.18.t: "[From.GetName] Refuses to Send Equipment" #NT!
 ukraine.18.d: "The Government of the [From.GetNameDef] have refused to send us equipment in order to expand the capabilities of our military as well our stockpile. They expressed their great regets by not being able to help us in this time." #NT!
 ukraine.18.a: "Dissapointing" #NT!
 ukraine.19.t: "[From.GetAdjective] Entry to the [Root.GetFactionName]" #NT!
 ukraine.19.d: "The Ukrainian government has approached us asking to join our alliance. Doing so would give us both a base and a loyal ally next to both the Soviets and Germany. How should we respond?" #NT!
 ukraine.19.a: "Welcome to the alliance!" #NT!
 ukraine.19.b: "Their aid is unnecessary." #NT!
 ukraine.20.t: "Offer Rebuked" #NT!
 ukraine.20.d: "Citing that a partnership with us is not in their best interests for the time being, our request to join their alliance has been refused" #NT!
 ukraine.20.a: "Their loss!" #NT!
 ukraine.21.t: "The [From.GetAdjective] Proposal" #NT!
 ukraine.21.d.1: "The Ukrainian government has approached us asking to create a formal alliance with them. Doing so would give us a strong ally in the east, but can also be liability when the Soviets reclaims their former lands. How should we respond?" #NT!
 ukraine.21.d.2: "The Ukrainian government has approached us asking to join our alliance. Doing so would give us a strong ally in the east, but can also be liability when the Soviets reclaims their former lands. How should we respond?" #NT!
 ukraine.21.a: "We accept their proposal" #NT!
 ukraine.21.b: "Their aid is unnecessary." #NT!
 ukraine.22.t: "[From.GetName] Refused" #NT!
 ukraine.22.d: "The Government of [From.GetNameDef] have refused to entertain our proposal for an alliance." #NT!
 ukraine.22.a: "Dissapointing" #NT!
 ukraine.23.t: "Ukraine Proposes Galician Referendum" #NT!
 ukraine.23.d: "The [From.GetName] Government, having claims with the region of Galicia which is currently under our control, have proposed a referendum in the said region in order to resolve the Ukrainian claim to the region. How should we respond?" #NT!
 ukraine.23.a: "We'll go with the diplomatic route, what could go wrong?" #NT!
 ukraine.23.b: "No, we can't be sure if the results untampered" #NT!
 ukraine.24.t: "Galicia Votes to Unite with Ukraine" #NT!
 ukraine.24.d: "With the referendum completed in the region of Galicia, and with the results finally been tallied after a week; it seems that the people of the region wants to unite with our country once again.\nBoth Warsaw and our governments are now preparing for the transfer of the region, with Ukrainian security personnel allowed to cross the border to help stabilize the region after the [POL.GetAdjective] Government have formally transferred its control in the region." #NT!
 ukraine.24.a: "Hurrah!" #NT!
 ukraine.25.t: "Referendum Lost" #NT!
 ukraine.25.d: "With the referendum completed in the region of Galicia, and with the results finally been tallied after a week; the results of the votes came favouring Kiev unfortunately. However, as a man of our word we will coordinate with the [UKR.GetAdjective] Government to formally transfer them the region, and allow their security forces to cross the border in order to stabilize the region." #NT!
 ukraine.25.a: "Shame." #NT!
 ukraine.26.t: "Galicia Votes to Stay with Poland" #NT!
 ukraine.26.d: "With the referendum completed in the region of Galicia, and with the results finally been tallied after a week; the results of the votes came favouring to stay under the watch of Warsaw." #NT!
 ukraine.26.a: "Dissapointing" #NT!
 ukraine.26.b: "Excellent." #NT!
 ukraine.27.t: "[From.Capital.GetCapitalVictoryPointName] Accepted our Proposal" #NT!
 ukraine.27.d: "The [From.GetAdjective] Government have accepted our proposal of conducting a referendum in the region of Galicia in order to settle the question of ownership and control of the region." #NT!
 ukraine.27.a: "Dissapointing" #NT!
 ukraine.28.t: "[From.Capital.GetCapitalVictoryPointName] Refused our Proposal" #NT!
 ukraine.28.d: "The [From.GetAdjective] Government have refused our proposal of conducting a referendum in the region of Galicia in order to settle the question of ownership and control of the region." #NT!
 ukraine.28.a: "It's not worth a war" #NT!
 ukraine.28.b: "We'll take them by force!" #NT!
 ukraine.29.t: "Proposal from Kiev" #NT!
 ukraine.29.t2: "Demands from [FROM.Capital.GetCapitalVictoryPointName]" #NT!
 ukraine.29.d: "The [UKR.GetAdjective] Government have approached us with an interesting proposal, they want us to transfer the ownership of the Bucovianian lands to them in exchange of an alliance with them. How should we respond?" #NT!
 ukraine.29.d2: "The [UKR.GetAdjective] Government has approached us today, demanding Bessarabia and Bucovina be given to them. How should we respond?" #NT!
 ukraine.29.a: "Accept the proposals, it's only a tiny bit of land" #NT!
 ukraine.29.b: "No, Greater Romania should be preserved." #NT!
 ukraine.29.c: "Accept the demands, it's only a tiny bit of land" #NT!
 ukraine.30.t: "Romania Accepts" #NT!
 ukraine.30.d: "The [From.GetAdjective] Government has seen the wisdom is our offer and have decided to accept the transfer of control of the lands of Bucovina to us." #NT!
 ukraine.30.a: "Excellent" #NT!
 ukraine.31.t: "Romania Refuses" #NT!
 ukraine.31.d: "The moronic and incompetent government of [From.GetName] have refused our generous offer to them. How should we respond to their insolence?" #NT!
 ukraine.31.a: "Mobilize the army!" #NT!
 ukraine.31.b: "Why waste time and resources on them." #NT!
 ukraine.32.t: "[From.GetName] Petitions [UKR_potential_ally.GetName] Entry to our Alliance" #NT!
 ukraine.32.d: "Our partners in [From.Capital.GetCapitalVictoryPointName] have advocated [UKR_potential_ally.GetNameDef] entry to our alliance. Should we accept?" #NT!
 ukraine.32.a: "Send them the invitation" #NT!
 ukraine.32.b: "Rather not." #NT!
 ukraine.33.t: "[From.GetName] Invites us to the [From.GetFactionName]" #NT!
 ukraine.33.d: "The [From.GetAdjective] Government with advocation from the [UKR.GetAdjective] Government have invited us to join their formal military alliance in order to combat the new threats that emerged against the status quo. While [From.GetNameDef] is the hegemon of Europe after the Great War, other nations have risen and fought their influence in this decade, allying with them will drag us into a new Great War once tensions escalate. Should we accept?" #NT!
 ukraine.33.a: "Sign the invitation" #NT!
 ukraine.33.b: "We'll keep our neutrality, for now." #NT!
 ukraine.34.t: "[From.GetName] Joins our Alliance" #NT!
 ukraine.34.d: "The [From.GetAdjective] Government has seen the wisdom in our proposal to them and have gladfuly acccepted and joined our military alliance." #NT!
 ukraine.34.a: "Together we will defend against tyranny!" #NT!
 ukraine.35.t: "[From.GetName] Refuses" #NT!
 ukraine.35.d: "The [From.GetAdjective] Government has proven themselves incompetent and naive as they have stated that they have no interest in joining alliances in this time and will prefer to be neutral when conflict comes." #NT!
 ukraine.35.a: "Don't crying back us for help!" #NT!
 ukraine.36.t: "[UKR_potential_ally.GetName] is Denied" #NT!
 ukraine.36.d: "The [From.GetAdjective] Government has refused to allow [UKR_potential_ally.GetName] to join our alliance." #NT!
 ukraine.36.a: "Unfortunate." #NT!
 ukraine.37.t: "[From.GetName] Demands Transcarpathia" #NT!
 ukraine.37.d: "The [From.GetAdjective] Government has recently sent us an ultimatum, the demand the transfer of the Transcarpathian region to their control. Should we accept?" #NT!
 ukraine.37.a: "Give them the land" #NT!
 ukraine.37.b: "They will have to march on [Root.Capital.GetCapitalVictoryPointName] first!" #NT!
 ukraine.38.t: "[From.GetName] Accepts" #NT!
 ukraine.38.d: "The [From.GetAdjective] Government has accepted our demand of transferring the region of Transcarpathia to our control." #NT!
 ukraine.38.a: "Excellent." #NT!
 ukraine.39.t: "[From.GetName] Refuses" #NT!
 ukraine.39.d: "The [From.GetAdjective] Government has proven themselves incompetent and naive as they have refused our demands to transfer the Transcarpathian region to our control. How should we respond?" #NT!
 ukraine.39.a: "To War" #NT!
 ukraine.39.b: "Drop the matter" #NT!
 ukraine.40.t: "Ukraine Requests We Abandon Belarus" #NT!
 ukraine.40.d: "The Ukrainian Government have approached us with an interesting proposal, they offer an formal military alliance by joining the Stahlpakt if we agree to abandon our promises on Belarus in the Konigsberg Treaty. Ukraine have been steadily modernizing and beefing up their military power and will be a great ally when we ourselves come into a conflict with the Entente. However, we also might be dragged into a war against the Soviet Union when the Bolsheviks tries to reclaim Ukraine, should we risk the Belarussian alliance in exchange for a much better Ukrainian one?" #NT!
 ukraine.40.a: "The Ukrainians are far more valuable." #NT!
 ukraine.40.b: "We will not back out on our word." #NT!
 ukraine.41.t: "Germany Abandons us for Ukraine" #NT!
 ukraine.41.d: "The German Government have accepted a formal alliance with the [UKR.GetAdjective] and have backed out on our formal agreements in Konigsberg." #NT!
 ukraine.41.a: "Disspointing..." #NT!
 ukraine.42.t: "Germany Abandons Belarus" #NT!
 ukraine.42.d: "The German Government have accepted our proposal and have notified the [BLR.GetAdjective] that they will withdraw from the Konigsberg Treaty. We will not join their alliance." #NT!
 ukraine.42.a: "Excellent." #NT!
 ukraine.43.t: "Germany Refuses Abandons Belarus" #NT!
 ukraine.43.d: "The German Government in their infinite wisdom have decided that the [BLR.GetAdjective]s are more valuable as an ally rather than us. For that matter, we'll try to join the other side of the conflict." #NT!
 ukraine.43.a: "Try contacting the Entente." #NT!
 ukraine.44.t: "[From.GetAdjective] Entry to the [Root.GetFactionName]" #NT!
 ukraine.44.d: "The Ukrainian government has approached us asking to join our alliance. Doing so would give us both a base and a loyal ally next to both the Soviets and Germany. How should we respond?" #NT!
 ukraine.44.a: "Welcome to the alliance!" #NT!
 ukraine.44.b: "Their aid is unnecessary." #NT!
 ukraine.45.t: "Offer Rebuked" #NT!
 ukraine.45.d: "Citing that a partnership with us is not in their best interests for the time being, our request to join their alliance has been refused" #NT!
 ukraine.45.a: "Their loss!" #NT!
 ukraine.46.t: "[From.GetAdjective] Offers Wheat Exports" #NT!
 ukraine.46.d: "The Ukrainian government has approached us proposing a trade agreements on wheat and other grain, It can surely benefit us both in the long run, should we accept?" #NT!
 ukraine.46.a: "We need the wheat, sign the proposal" #NT!
 ukraine.46.b: "Nope!" #NT!
 ukraine.47.t: "Germany Agreed" #NT!
 ukraine.47.d: "In order to secure their food supply in the upcoming conflicts, the German Government have accepted our proposal of exporting more wheat and other grain to them." #NT!
 ukraine.47.a: "Let's eat!" #NT!
 ukraine.48.t: "Germany Refuses" #NT!
 ukraine.48.d: "The Germans have refused our generous offer of exporting more wheat to secure their food supply. " #NT!
 ukraine.48.a: "They will starve to death when time comes." #NT!
 ukraine.49.t: "Strategic Retreat to the Urals" #NT!
 ukraine.49.d: "As Ukrianian forces continue to gain momentum and push our army back it is clear that our ability to continue the war is rapidly declining. Many generals are beginning to organize a retreat to east of the Urals where we can organize a more permanent defense from Ukrainian forces. It's strongly believed by our intelligence that Ukraine will not bother pushing past the Urals giving us even more time to rearm without interference." #NT!
 ukraine.49.a: "Begin the retreat and scorch everything in your path" #NT!
 ukraine.49.b: "Ni shagu nazad!" #NT!
 ukraine.50.t: "Soviet Forces Retreat" #NT!
 ukraine.50.d: "All was calm this morning on the Eastern Theater. The pounding of Soviet artillery that just yesterday filled the empty vastness of the steppe has finally gone silent. The Russians now retreat from the front more organized than usual burning all habitable land in their path. It is clear that the Russians intend for us pay in Ukrainian blood for every last inch of Soviet Russia. It'll take some months to repair the damage caused by the desperate defenders and even more to organize a new offensive into the Urals. Many of our own officers even suggest that the war in the east has met it's obvious conclusion as we occupy the most valuable land the Soviets would ever own. Dragging this conflict on for any longer may not be worth the human cost." #NT!
 ukraine.50.a: "We don't need to expand past the Urals" #NT!
 ukraine.50.b: "The Soviet Union can't be allowed to exist" #NT!
 ukraine.51.t: "Hetman Inspects the Troops" #NT!
 ukraine.51.d: "In recognition of the importance of our troops that will defend our country's sovereignity against foreign aggressors, the Hetman personally visited some various military installations near Kiev and an army base near Gomel.\n\nAs he found the abysmal situation of the garrisoned troops stationed in the area, he personally ordered the chief of the Army General Staff to improve the soldier's situation and quality of life in their bases, notably the one near both the Belarusian and Soviet borders." #NT!
 ukraine.51.a: "We need more reforms." #NT!
 ukraine.52.t: "Our Government is Re-Elected!" #NT!
 ukraine.52.d: "" #NT!
 ukraine.52.a: "We are still Worthy!" #NT!
 ukraine.53.t: "[UKR.GetNameDefCap] demands we give them their claims!" #NT!
 ukraine.53.d: "Report me :)" #NT!
 ukraine.53.a: "Accept the Demands" #NT!
 ukraine.53.b: "Who are we to give away free land?" #NT!
 ukraine.54.t: "[SOV.GetNameDefCap] gave in to our demands!" #NT!
 ukraine.54.d: "" #NT!
 ukraine.54.a: "Yay!" #NT!
 ukraine.55.t: "[SOV.GetNameDefCap] rejected our demands!" #NT!
 ukraine.55.d: "" #NT!
 ukraine.55.a: "Declare war!\n$RWar will be declared against [SOV.GetNameDef]!$!" #NT!
 ukraine.55.b: "Just claim...for now..." #NT!
 ukraine.56.t: "The [GetYear] General Elections" #NT!
 ukraine.56.d: "According to the Constitution elections are to be held every five years. The Rada's term has expired and the time has come to elect a new parliament. There are 90 seats in the Rada available and various political parties have begun their campaigns. Which one shall prevail?" #NT!
 ukraine.56.a: "Social-Democratic Party" #NT!
 ukraine.56.b: "People's Labour Party" #NT!
 ukraine.56.c: "Union of Hetmanists-Statesmen" #NT!
 ukraine.56.e: "Organization of Ukrainaian Nationalists" #NT!
 ukraine.56.f: "National-Integralist Party of Ukraine" #NT!
  
