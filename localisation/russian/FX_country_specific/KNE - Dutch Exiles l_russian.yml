 ### Ideas 
 KNE_military_refugees: "Military Refugees" #NT!
 KNE_military_refugees_desc: "A large part of the military fled the Netherlands to come to Suriname in refuge. Because of this we have a lot of capable soldiers who are willing to retake the homeland." #NT!
  
 ### Decisions 
 KNE_join_entente: "Join the [From.GetFactionName]" #NT!
 KNE_join_entente_desc: "In order to return to our home, we must align ourselves with France and defeat the illegitimate government in Amsterdam that is allied to Germany." #NT!
 KNE_invest_in_the_exiles: "Invest in [From.GetName]" #NT!
 KNE_return_of_the_queen: "Return of the Queen" #NT!
 KNE_return_of_the_queen_desc: "Amsterdam is now back in our hands, the capital and very heart of the Dutch Empire! At long last, we can restore the Kingdom of the Netherlands and the monarchy!" #NT!
  
 ### Events 
 dutchexiles.100.t: "[From.GetName] Requests Membership in the [Root.GetFactionName]" #NT!
 dutchexiles.100.d: "The exiled government of the [KNE.GetNameDef] have requested to enter our military alliance. It seems that they are determined to return to their home country; and return [KNE.GetLeader] to her rightful place." #NT!
 dutchexiles.100.a: "They are most welcome..." #NT!
 dutchexiles.100.b: "They cannot be trusted." #NT!
 dutchexiles.101.t: "[From.GetName] Rejects our Entry" #NT!
 dutchexiles.101.d: "It seems our chance in recovering the home country from the nationalist rebels that took over it has blown off. The [From.GetAdjective] Government have refused our entry into their faction; effectively cuting us from the peace deals that may occur after the war." #NT!
 dutchexiles.101.a: "All is not lost..." #NT!
 dutchexiles.102.t: "Investments from [From.GetName]" #NT!
 dutchexiles.102.d: "To bolster our war effort; the government of the [From.GetName] have provided investments in our economy. Giving us the necessary resources to increase production for the war effort." #NT!
 dutchexiles.102.a: "Their help is most appreciated." #NT!
 dutchexiles.103.t: "Reclamation of the Homeland" #NT!
 dutchexiles.103.d: "We have successfully reclaimed our homeland." #NT!
 dutchexiles.103.a: "God Save the Queen!" #NT!
 dutchexiles.104.t: "Reclamation?" #NT!
 dutchexiles.104.d: "Through a miraculous turn of events, the old German puppet government that once ruled has now been overturned. In its place, loyalists of Queen Wilhelmina have taken hold in the Netherlands and now graciously await her Majesty's return to the homeland.\n\nHowever, there are some fears that this will prompt a German intervention, forcing us to be on-guard for a German intervention. Additionally, the socialist government that is ruling has been forced out on the demands of the loyalists back home, who view them as part of the reason this whole mess occured in the first place." #NT!
 dutchexiles.104.a: "God Save the Queen!" #NT!
  
