####BRIEF HISTORY
 GEO_FUHRERREICH_DESC: "Прошло 100 лет, и Грузия наконец восстановила свою независимость, когда распалась Российская империя. Под руководством Грузинской партии меньшевиков страна быстро провела социал-демократические реформы и быстро развивалась. Однако после выборов 1934 года партия стала все более раскалываться между фракцией, которая хочет быстро уничтожить капитализм, и фракцией, которая больше выступает за постепенное развитие общества. Раскол придал смелости небольшим партиям Грузии, и похоже, что если политическая ситуация не стабилизируется быстро, на политическое поле могут выйти новые радикальные игроки." # 100 years have passed, and Georgia has finally regained its independence when the Russian Empire crumbled. Lead by the Georgian Menshevik Party, the country quickly adopted Social Democratic reforms and developed rapidly. However, after the 1934 elections the party has become increasingly split between a faction that wants to quickly abolish capitalism, and a faction that is more in favor of gradual development of society. The split has emboldened Georgia's smaller parties, and it looks like if the political situation doesn't stabilize quickly radical new players can enter the political field.

####EVENTS
 ge.100000.t: "Положение Грузии в 1936 году" # Georgia's Situation in 1936
 ge.100000.d: "После Октябрьской революции Российская Закавказская губерния отделилась и образовала Закавказскую федерацию. Однако это государство просуществовало в мире недолго, поскольку вскоре оно распалось на Армению, Азербайджан и Грузию. Видя, что конец войны наступит нескоро, грузины во главе с партией меньшевиков пригласили немцев оккупировать Грузию (и защитить ее от османов).\nГрузины не принимали чью-либо сторону в Гражданской войне в России, и хотя большевики изначально были враждебны, в 1920 году Грузия подписала мирное соглашение с Советским Союзом, которое установило большевистскую партию как легальную политическую партию.\nШли годы, в меньшевистской партии возникла новая фракция. Вечеринка. Интерес к радикалам возобновился, поскольку продвижение к социализму, казалось, остановилось. Они не представляли серьезной угрозы до недавнего времени, когда они начали выступать за быстрый переход Грузии к либертарианскому социализму. Нынешнее правительство Грузии принадлежит к умеренной фракции, которая выступает против быстрого изменения общества. Председатель Грузии Акакий Чхенкели, избранный после внесения поправки в конституцию, которая отменила ограничения по срокам и продлила срок полномочий председателя, занимает твердую позицию в пользу стабильности. Однако похоже, что радикальная фракция с каждым месяцем набирает все большую популярность..." # After the October Revolution, the Russian Transcaucasian province broke off and formed the Transcaucasian Federation. However this state wasn't long for the world, as it soon broke into Armenia, Azerbaijan and Georgia. Seeing as the war's end would not come soon, the Georgians, lead by the Menshevik Party, invited the Germans to occupy Georgia (and protect them from the Ottomans).\nThe Georgians didn't take sides in the Russian Civil War, and while the Bolsheviks were initially hostile, in 1920 Georgia signed a peace agreement with the Soviet Union, which established the Bolshevik Party as a legal political party.\nAs the years went by, a new faction developed in the Menshevik Party. The Radicals have received renewed interest as the progress towards socialism seemed to halt. They weren't a major threat until recently, when they started advocating for Georgia to quickly transition to Libertarian Socialism. The current government of Georgia is from the moderate faction, those who are against quickly changing society. The Chairman of Georgia, Akaki Chkhenkeli, who has been elected after a constitutional amendment that abolished term limits and extended the term of the Chairman, has a strong stance in favor of stability. However it seems like the radical faction gains more and more popularity every month...
 ge.100000.a: "Мрецвелоба Гадаархенс Сакартвелос!" # Mretsveloba Gadaarchens Sakartvelos!

 ge.1000.t: "Иосиф Джугашвили возвращается" # Ioseb Jugashvili Resurfaces
 ge.1000.d: "Казалось, что после долгой позорной ссылки Джугашвили из Советского Союза по вине его «товарищей» в советском руководстве, он уже никогда не вернется к тому, чем был раньше. Но, похоже, мы недооценили его, поскольку получили сообщения о том, что он настраивает людей против нашего правительства и формирует новую партию. Он даже пытался взять себе старое прозвище «Сталин», но без особого успеха." # It seemed like after Jugashvili's long disgraceful exile from the Soviet Union due to his "comrades" in the Soviet leadership, he would never return to what he used to be. But it seems that we have misjudged him, since we have received reports of him inciting people against our government and forming a new party. He even tried to adopt his old nickname, 'Stalin', though without much success.
 ge.1000.a: "Оставь его в покое" # Leave him alone
 ge.1000.b: "Посадите его за подстрекательство" # Imprison him for incitement
 ge.1000.c: "Приведите кого-нибудь, чтобы убедить его, что он неправ." # Bring someone to convince him that he's wrong

 ge.1001.t: "Мать Джугашвили убеждает его изменить свой образ жизни" # Jugashvili's Mother Convinces Him to Change His Ways
 ge.1001.d: "Мы привезли к Джугашвили мать Джугашвили, Кеке Геладзе, чтобы она убедила его прекратить свою бунтарскую деятельность и позаботиться о ней в старости. Было очевидно, что даже спустя все эти годы Джугашвили все еще боялся своей матери и обещал ее выслушать." # We have brought Jugashvili's mother, Keke Geladze, over to Jugashvili, in order for her to convince him to stop his rebellious activities and take care of her in her old age. It was obvious that even after all of these years, Jugashvili was still afraid of his mother and has promised to listen to her.
 ge.1001.a: "Он ненавидел своего отца, но любил свою мать." # He hated his father, but he loved his mother.

 ge.1002.t: "Встреча Джугашвили с матерью не удалась" # Jugashvili's Meeting with His Mother Failed
 ge.1002.d: "Мы привезли к Джугашвили мать Джугашвили, Кеке Геладзе, чтобы она убедила его прекратить свою бунтарскую деятельность и позаботиться о ней в старости. К сожалению, хотя Джугашвили и старался выглядеть почтительным, было очевидно, что он не собирается ее слушать и что он вернется к своей национал-коммунистической деятельности, как только сможет." # We have brought Jugashvili's mother, Keke Geladze, over to Jugashvili, in order for her to convince him to stop his rebellious activities and take care of her in her old age. Unfortunately, while Jugashvili made efforts to appear respectful, it was obvious he wasn't going to listen to her and that he would return to his National Communist activities as soon as he could.
 ge.1002.a: "Национал-коммунизм сильнее, чем связь мальчика с матерью?" # Is National Communism stronger than a boy's bond to his mother?

 ge.1003.t: "Жордания убеждает Джугашвили, что меньшевики на правильном пути" # Zhordania Convinces Jugashvili that the Mensheviks have the right path
 ge.1003.d: "Кажется, Жордания сделал невозможное. После долгой встречи с Иосифом Джугашвили, в ходе которой они обсуждали революционные вопросы и старые времена, Жордания, похоже, сумел убедить Джугашвили, что большевизм потерпел неудачу и что меньшевики возглавят социалистическую революцию. Джугашвили даже пообещал вступить в партию меньшевиков и поддержать ее!" # It seems like Zhordania has done the impossible. After a long meeting with Ioseb Jugashvili, in which the two discussed revolutionary matters and the old times, it seems like Zhordania has managed to convince Jugashvili that Bolshevism has failed and that the Mensheviks will lead the Socialist revolution. Jugashvili even promised to join the Menshevik Party and support it!
 ge.1003.a: "Разве не здорово, когда два старых Амханагебо воссоединяются?" # Isn't it great when two old Amkhanagebo reunite?

 ge.1004.t: "Джугашвили отказался от встречи с Жордания" # Jugashvili Storms out of the Meeting with Zhordania
 ge.1004.d: "Неужели мы действительно ожидали чего-то другого? Хотя никто не мог подвергнуть сомнению обоснованность аргументов Жордания, Джугашвили все равно сумел это сделать. Такого психа невозможно убедить. Похоже, эта встреча только еще больше убедила его в необходимости свержения правительства." # Have we really expected anything different? Even though nobody could question the validity of Zhordania's arguments, Jugashvili has managed to do so anyway. There is no convincing this kind of nut. It seems like this meeting only made him even more convinced of the need to overthrow the government.
 ge.1004.a: "Джугашвили действительно является оскорблением социализма." # Jugashvili is truly an insult to Socialism.

 ge.1100.t: "Переворот в Грузии" # The Coup in Georgia
 ge.1100.d: "Сегодня рано утром многие независимые ячейки национал-коммунистических революционеров захватили правительственные и общественные здания по всему Тбилиси. Одновременно другие группы захватили другие города, такие как Батуми, Кутаиси, Поти и Сухуми. На фоне всей этой неразберихи была предпринята попытка посадить в тюрьму ключевых фигур грузинской политики, но, к счастью, почти все эти попытки провалились, и теперь политики готовятся к побегу из страны." # Early in today's morning many independent cells of National Communist revolutionaries took over governmental and public buildings all over Tbilisi. Simultaneously, other groups have took over other cities, like Batumi, Kutaisi, Poti and Sokhumi. Amidst all of the confusion, an attempt was made to imprison key people in Georgian politics, but fortunately nearly all of those attempts failed and the politicians are now preparing to escape from the country.
 ge.1100.a: "Это темное время для нашей страны." # This is a dark time for our country.

 ge.1101.t: "Джугасвили переименовывает Тбилиси!" # Jughasvili renames Tbilisi!
 ge.1101.d: "Никто не предвидел этого. Иосеб Джугашвили внезапно объявил на заседании Марксистской партии, что переименует Тбилиси в Кобайси, имя, более подходящее для столицы социалистической страны, поскольку это имя главного героя-бандита в грузинской книге «Отцеубийца». Те, кто достаточно взрослый, чтобы помнить, знают, что это всего лишь уловка с целью переименовать столицу Грузии в имя Иосеба, поскольку Коба было его подпольным прозвищем в царскую эпоху. Но они не смеют высказаться..." # Nobody saw this coming. Ioseb Jughashvili suddenly announced in a meeting of the Marxist Party that he will rename Tbilisi to Kobaisi, a name more befitting for the capital of the socialist nation as it is the name of the bandit protagonist in the Georgian book 'The Patricide'. Those that are old enough to remember know that this is just a ploy to rename the capital of Georgia to Ioseb's name, as Koba was his underground nickname in the Tsarist era. But they dare not speak out...
 ge.1101.a: "Неужели нет предела безумию этого человека?!" # Is there no limit to this man's madness?!

 ge.1500.t: "Берию обвиняют в развратных действиях с военнослужащими" # Beria is Accused of Doing Indecent Acts with Army Women
 ge.1500.d: "С тех пор как мы разрешили призыв женщин на военную службу, к нам стало поступать все больше жалоб от женщин, прикомандированных на работу к Берии, о том, что он совершает рядом с ними непристойные действия. Как нам действовать?" # Ever since we have allowed for the conscription of women, we have started to receive more and more complaints from women who have been assigned to work with Beria that he is doing indecent acts near them. How should we proceed?
 ge.1500.a: "Пусть это скользит" # Let it slide
 ge.1500.b: "Отдать его под суд" # Put him on trial
 ge.1500.c: "Отправьте его к психиатру" # Send him to a psychiatrist

 ge.1501.t: "Берия хорошо реагирует на лечение" # Beria Reacts Well to Treatment
 ge.1501.d: "Мы отправили Берию к психиатру. После нескольких встреч психиатр сообщил нам, что Берия хорошо реагирует на лечение и что через несколько месяцев он снова станет психически здоровым." # We have sent Beria to a psychiatrist. After a few meetings, the psychiatrist has told us that Beria was reacting well to treatment and that in a few months he should be mentally healthy again.
 ge.1501.a: "Мы должны социализировать психиатрическую помощь, чтобы предотвратить возникновение таких случаев в первую очередь." # We should socialize mental healthcare to prevent such cases from happening in the first place

 ge.1502.t: "Берия завершил лечение" # Beria Has Finished His Treatment
 ge.1502.d: "Из кабинета психиатра выходит мужчина. На первый взгляд кажется, что это тот же человек, которого мы отослали много месяцев назад, но все люди, которые его знали, больше его не знают. Этот Берия — другой, гораздо более справедливый Берия, и он хочет внести свой вклад в жизнь общества в знак благодарности за обращение, которое с ним произошло." # A man comes out of the psychiatrist's office. On first sight it seems to be the same man we sent off many months ago, but all of the people who knew him don't know him anymore. This Beria is a different, much more just Beria, and he wants to contribute to society as a show of gratitude for the treatment that he has received.
 ge.1502.a: "Мы отправим его снова в офицерскую школу, чтобы он стал лучшим фельдмаршалом." # We shall send him to officer school again to become a better field marshal
 ge.1502.b: "Из этого человека мог бы получиться отличный руководитель разведки." # This man would make a great head of intelligence.

 ge.1503.t: "Берия плохо отреагировал на лечение" # Beria Didn't React Well to Treatment
 ge.1503.d: "С самого начала было очевидно, что это не сработает. Берия слишком укоренился в своих садистских привычках, чтобы когда-либо измениться. К сожалению, мы ничего не можем сделать." # It was obvious from the start that this isn't going to work. Beria is too set in his sadistic ways to ever change. Sadly, we can't do anything.
 ge.1503.a: "Как неудачно." # How unfortunate.

 ge.1.t: "Шахтеры марганца объявили забастовку!" # Manganese Miners Go on Strike!
 ge.1.d: "После недавнего краха лондонской фондовой биржи цены на марганец рухнули, и владельцы шахт были вынуждены снизить заработную плату шахтерам. Однако они не ожидали такой бурной реакции среди шахтеров, которую их действия вызвали. Шахтеры объявили забастовку, и другие профсоюзы тоже находятся на грани забастовки из солидарности и страха за свои рабочие места. Хотя мы ожидаем, что крах не затронет нас больше, радикальные меньшевики воспользовались случаем для выхода из коалиции, приобретя много новых последователей и вызвав необходимость новых выборов, поскольку у правительства больше нет большинства, чтобы поддержать его." # With the recent London Stock Market Crash, the Manganese prices crashed, and the mine owners were forced to lower the wages of the Manganese miners. However, they didn't anticipate the strong reaction their actions have caused amongst the miners. The miners have gone on strike, and other trade unions are on the verge of striking too, out of solidarity and fear for their own jobs. While we anticipate the Crash won't affect us much more, the radical Mensheviks have exploited the occasion to exit the coalition, gaining a lot of new followers and necessitating new elections as the government no longer has a majority to support it.
 ge.1.a: "К сожалению, выборы должны состояться раньше, чем ожидалось." # Unfortunately, the elections must happen earlier than expected.
 ge.1.b: "Маграм мне мегана ром мрецвелоба гадаархенда сакартвелос!" # Magram me megona rom mretsveloba gadaarchenda sakartvelos!

 ge.2.t: "Выборы!" # Elections!
 ge.2.d: "Хотя выборы планировалось провести только в следующем году, они, тем не менее, прошли гладко, и проголосовали люди со всей страны. Это также первые выборы после принятия поправки к конституции 1934 года, которая отменила ограничения на срок полномочий председателей и продлила их срок до трех лет. Результаты подведены. Победителем выборов стал:" # While the elections were only planned to be held in the next year, they went smoothly regardless and people from all over the country voted. These are also the first elections since the 1934 constitutional amendment that abolished term limits on chairmans and extended their terms to three years. The results are in. The winner of the elections is:
 ge.2.a: "Умеренная фракция!" # The moderate faction!
 ge.2.b: "Радикальная фракция!" # The radical faction!

 ge.3.t: "Досрочные выборы!" # Snap Elections!
 ge.3.d: "После распада коалиции старая меньшевистская партия потеряла большую часть своей популярности, так что теперь у бывших небольших партий появился шанс проявить себя. Победителем выборов является:" # After the coalition collapsed the old Menshevik party has lost a lot of its popularity, so now is the chance for the formerly small parties to shine. The winner of the elections is:
 ge.3.a: "Социалистически-федералистская партия!" # The Socialist-Federalist Party!
 ge.3.b: "Национально-демократическая партия!" # The National Democratic Party!

 ge.10.t: "Референдум о монархии!" # Monarchy Referendum!
 ge.10.d: "Коалиционное правительство приняло спорное решение о проведении референдума о преобразовании страны в конституционную монархию и восстановлении на грузинском престоле династии Багратиони-Мухрани. Хотя поначалу все думали, что у этого референдума нет шансов на успех и что это всего лишь попытка угодить консерваторам и церкви, теперь мы понимаем, что у референдума есть реальный шанс на успех благодаря активной кампании Грузинской Православной Церкви." # A controversial decision has been made by the coalition government to make a referendum about reforming the country into a constitutional monarchy and restorating the Bagrationi-Mukhrani dynasty to the Georgian throne. While at first everyone has thought this referendum had no chance of succeeding and was just a move to please the conservatives and the church, we now realise the referendum has a real chance of succeeding, due to a fervent campaign from the Georgian Orthodox Church.
 ge.10.a: "Монархия восстановлена!" # The Monarchy is restored!
 ge.10.b: "Республика сохранена!" # The Republic is kept!

 ge.100.t: "Грузия предлагает построить Закавказскую железную дорогу" # Georgia Proposes Building a Transcaucasian Railway
 ge.100.d: "Грузия предложила расширить существующие железнодорожные системы и соединить их вместе для улучшения нашей инфраструктуры. В то время как некоторые из наших министров выступают против этого как грузинской схемы получения контроля над нашей инфраструктурой, другие указывают на очевидные преимущества." # Georgia has proposed expanding the current railway systems and linking them together for the betterment of our infrastructure. While some of our ministers oppose this as a Georgian scheme to get control of our infrastructure, others point out the obvious benefits.
 ge.100.a: "Мы принимаем их предложение." # We accept their proposal.
 ge.100.b: "Мы никогда не будем иметь дело с вероломной Иберией!" # We will never deal with perfidious Iberia!

 ge.110.t: "Грузины требуют арбитража между ними и сепаратистами" # The Georgians Request Arbitration Between Them and Separatists
 ge.110.d: "Грузия уже давно имеет проблему сепаратизма в своей стране. Еще со времен феодализма Грузия была разделена на разные части, и даже сегодня они не имеют одной и той же культуры. Нас попросили выступить нейтральным арбитром между ними и их сепаратистами для восстановления мира." # Georgia has long had a problem with separatism in their country. Ever since the days of feudalism Georgia was divided into different parts and even today they don't all share the same culture. We were requested to serve as a neutral arbitrator between them and their separatists to restore the peace.
 ge.110.a: "Сепаратистские регионы заслуживают большей автономии." # The separatist regions deserve more autonomy.
 ge.110.b: "Грузия права, у них и так достаточно автономии." # Georgia is right, they already have enough autonomy as it is.

 ge.115.t: "Грузия предлагает сближение" # Georgia offers rapprochement
 ge.115.d: "Грузины стремятся к сближению с нами, возможно, из-за недавней смены правительства, которая сделала нас идеологически ближе друг к другу. Хотя у нас были планы по завоеванию региона, мы могли отказаться от них в пользу хороших отношений и взаимовыгодного сотрудничества." # The Georgians are seeking rapprochement with us, possibly because of our recent government change that made us closer to each other ideologically. While we did have plans to conquer the region, we could forgo them in favor of good relations and mutually beneficial cooperation.
 ge.115.a: "Мы согласны с тем, что наши грузинские товарищи заслуживают того, чтобы жить в мире." # Our Georgian comrades deserve to live in peace, we accept.
 ge.115.b: "Грузинский социализм – фальшивка! Пока мы говорим, они эксплуатируют рабочих. Мы никогда не примем!" # Georgia's socialism is fake! They're exploiting workers as we speak. We'll never accept!

 ge.116.t: "Советы принимают сближение" # Soviets accept rapprochement
 ge.116.d: "Советы приняли наше предложение о сближении, и наши отношения и торговля медленно, но верно улучшаются. Нам больше не нужно беспокоиться о советском вторжении." # The Soviets have accepted our offer of rapprochement, and our relations and trade are improving slowly but surely. We don't have to be worried about a Soviet invasion anymore.
 ge.116.a: "Отличные новости!" # Great news!

 ge.117.t: "Советы отвергают сближение" # Soviets reject rapprochement
 ge.117.d: "К сожалению, Советы отклонили наше предложение о сближении. Они заявляют, что наш социализм — фальшивка и что Грузия — это репрессивная диктатура буржуазии. Нам следует ожидать скорого вторжения с их стороны." # Unfortunately, the Soviets have rejected our offer of rapprochement. They claim our socialism is fake and that Georgia is an oppressive bourgeoisie dictatorship. We have to expect an invasion from them soon.
 ge.117.a: "Этим вероломным Советам нельзя доверять." # Those perfidious Soviets are not to be trusted.

 ge.120.t: "Советы требуют референдума в Сочи" # The Soviets Demand a Referendum in Sochi
 ge.120.d: "Россияне долгое время считали Сочи частью своей основной территории, а теперь, когда мы присоединились к Советскому Союзу, они требуют референдума, чтобы решить этот вопрос раз и навсегда." # The Russians have long considered Sochi to be a part of their core territory, and now that we have joined the Soviet Union they demand a referendum to figure out this issue once and for all.
 ge.120.a: "Мы не думали об этом, когда вступали в Советский Союз." # We haven't thought about this when we joined the Soviet Union

 ge.121.t: "Стоит ли жульничать на референдуме в Сочи?" # Should We Cheat in the Sochi Referendum?
 ge.121.d: "После того, как правительство Грузии объявило, что в Сочи будет проведен референдум, чтобы определить, в какой ССР это будет, некоторые люди предположили, что грузины промывают мозги населению Сочи, чтобы оно не признало наше законное владение их землями. Они говорят, что РСФСР, безусловно, имеет возможность повлиять на референдум так, чтобы он был немного в нашу пользу. Что нам делать?" # After the Georgian government has announced that a referendum will be held in Sochi to determine in which SSR it will be, some people have suggested that the Sochi population would be brainwashed by the Georgians to not accept our rightful ownership of their lands. They say that the Russian SFSR certainly has the power to affect the referendum to be slightly in our favor. What should we do?
 ge.121.a: "Сочинцы не знают, что для них хорошо!" # The Sochi folk don't know what's good for them!
 ge.121.b: "Мы все равно победим, зачем жульничать?" # We will win anyway, why cheat?

 ge.122.t: "Сочи остается грузинским" # Sochi Stays Georgian
 ge.122.d: "Референдум завершился, голоса подсчитаны. Подавляющее большинство жителей Сочи предпочли остаться грузинами!" # The referendum has ended, and the votes were counted. By large majority, the people of Sochi have chosen to stay Georgian!
 ge.122.a: "Троекратное ура Сакартвело!" # Three cheers for Sakartvelo!

 ge.123.t: "Сочи решил пойти с Россией" # Sochi Has Chosen to Go with Russia
 ge.123.d: "Референдум завершился, голоса подсчитаны. Жители Сочи проголосовали за присоединение к Российской СФСР. Хотя некоторые министры полагают, что русские смошенничали на референдуме, мы ничего не можем сделать." # The referendum has ended, and the votes were counted. The people of Sochi voted to be annexed by the Russian SFSR. While some ministers have suggested that the Russians have cheated in the referendum, we can't do a thing.
 ge.123.a: "Жители Сочи сделали свой выбор." # The people of Sochi have made their choice.

 ge.130.t: "Грузия просит присоединиться к Третьему Интернационалу" # Georgia asks to join the Third Internationale
 ge.130.d: "В связи с недавним потеплением отношений с Грузией правительство Грузии обратилось с просьбой разрешить им присоединиться к нашей фракции, Третьему Интернационалу. В нашем кабинете мнения по этому вопросу довольно расколоты: одни говорят, что мы должны принять их в альянс, а другие говорят, что они будут больше обузой." # Due to our recent warming of relations with Georgia, the Georgian government has requested that we allow them to join our faction, the Third Internationale. Our cabinet is pretty split on the issue, with some saying we should accept them into the alliance and others saying they would be more of a liability.
 ge.130.a: "Мы принимаем их в наш альянс." # We accept them into our alliance.
 ge.130.b: "Мы лишь гарантируем их независимость" # We will only guarantee their independence
 ge.130.c: "Мы не можем так углублять наши отношения." # We cannot deepen our relations like that.

 ge.131.t: "Советы приняли нашу просьбу о союзе!" # The Soviets have accepted our request for an alliance!
 ge.131.d: "К счастью, Советы согласились на нашу просьбу присоединиться к их альянсу, и теперь мы являемся частью Третьего Интернационала." # Fortunately, the Soviets have agreed to our request to join their alliance and we are now a part of the Third Internationale.
 ge.131.a: "Рабочие всего мира, объединяйтесь!" # Workers of the world, unite!

 ge.132.t: "Советы отклонили нашу просьбу о союзе!" # The Soviets have rejected our request for an alliance!
 ge.132.d: "К сожалению, Советы отклонили нашу просьбу о союзе. Похоже, они до сих пор не считают нас своими товарищами." # Unfortunately, the Soviets have rejected our request for an alliance. It seems like they still don't consider us their comrades.
 ge.132.a: "Наследие Ленина все еще ощущается в Москве." # Lenin's legacy is still felt in Moscow.

 ge.133.t: "Советы гарантировали нашу независимость!" # The Soviets have guaranteed our independence!
 ge.133.d: "Хотя Советы не приняли нас в члены Третьего Интернационала, они гарантировали нашу независимость." # While the Soviets have not accepted us as members of the Third Internationale, they have guaranteed our independence.
 ge.133.a: "Что-то лучше, чем ничего, верно?" # Something is better than nothing, right?

 ge.140.t: "Грузия предлагает начать закавказские переговоры" # Georgia proposes we start Transcaucasian talks
 ge.140.d: "Грузия пришла к нам с предложением начать переговоры между нами и ими об объединении наших стран, чтобы вместе противостоять внешним угрозам. Однако есть одно условие: если мы согласимся, то обязуемся по итогам переговоров провести референдум об образовании Закавказья. Также мы должны отказаться от наших территориальных претензий к другим сторонам переговоров." # Georgia has come to us with an offer to begin talks between us and them about unifying our countries in order to be able to stand up to outside threats together. However, there is one condition: if we accept, we pledge to conduct a referendum on the formation of Transcaucasia at the end of the talks. Also, we must forgo our territorial claims on the other parties to the talks.
 ge.140.a: "Мы должны объединиться в эти смутные времена." # We must unite in these troublous times.
 ge.140.b: "Мы никогда не согласимся на эти условия!" # We will never agree to these terms!

 ge.141.t: "[From.GetName] отказывается от закавказских переговоров!" # [From.GetName] refuses to Transcaucasian talks!
 ge.141.d: "К сожалению, дипломатам [From.GetName] не хватило смелости забыть о наших разногласиях и объединиться против наших общих врагов. К сожалению, от результатов пострадает весь регион, поскольку без критического участия [From.GetName] в наших переговорах мы не сможем продолжить реализацию нашего Закавказского плана." # Unfortunately, the diplomats of [From.GetName] were not brave enough to forget about our differences to unite against our common enemies. Unfortunately, the whole region will suffer the results, as without the critical participation of [From.GetName] in our talks we cannot continue with our Transcaucasian plan.
 ge.141.a: "Они совершили ужасную ошибку. Теперь мы все будем страдать от последствий." # They've made a terrible mistake. Now we shall all suffer the consequences.

 ge.150.t: "Грузино-армянские переговоры" # Georgian-Armenian Talks
 ge.150.d: "Мы встретились с представителями Армении, чтобы обсудить присоединение к гипотетической Закавказской федерации. Хотя встреча прошла позитивно, все заметили, что армяне ждали от нас территориальных уступок." # We have met with the representatives of Armenia to discuss them joining a hypothetical Transcaucasian federation. While the meeting went positively, everyone noticed that the Armenians waited for a territorial concession from us.
 ge.150.a: "Отдайте им Тао-Кларджети" # Give them Tao-Klarjeti
 ge.150.b: "Отдай им Лори" # Give them Lori
 ge.150.c: "Не давай им ничего" # Don't give them anything

 ge.151.t: "Грузино-азербайджанские переговоры" # Georgian-Azeri Talks
 ge.151.d: "Мы встретились с представителями Азербайджана, чтобы обсудить их присоединение к гипотетической Закавказской федерации. Встреча прошла очень гладко, и большинству представителей Азербайджана эта идея, похоже, понравилась. Однако некоторые из наиболее националистически настроенных сторонников упомянули, что мы владеем законными азербайджанскими территориями." # We have met with the representatives of Azerbaijan to discuss them joining a hypothetical Transcaucasian federation. The meeting went very smoothly, and most Azeri representatives seemed to like the idea. However, some of the more nationalist ones have mentioned that we hold rightful Azeri territories.
 ge.151.a: "Отдайте им Закаталу" # Give them Zaqatala
 ge.151.b: "Не давай им ничего" # Don't give them anything

 ge.152.t: "Закавказский референдум!" # The Transcaucasian Referendum!
 ge.152.d: "Миллионы людей по всему Закавказью проголосуют сегодня на референдуме о реформировании Закавказской федерации. Теперь не имеет значения, что об этом думают политики, важно только то, что думают люди." # Millions of people, all over Transcaucasia, will vote today in the referendum about the reformation of the Transcaucasian federation. Now it doesn't matter what the politicians think of this, only what the people think.
 ge.152.a: "Мы терпеливо, но с нетерпением ждем результатов." # We await the results, patiently but excitedly.

 ge.153.t: "Закавказский референдум!" # The Transcaucasian Referendum!
 ge.153.d: "Миллионы людей по всему Закавказью проголосуют сегодня на референдуме о реформировании Закавказской федерации. Теперь не имеет значения, что об этом думают политики, важно только то, что думают люди." # Millions of people, all over Transcaucasia, will vote today in the referendum about the reformation of the Transcaucasian federation. Now it doesn't matter what the politicians think of this, only what the people think.
 ge.153.a: "Правильно ли мы приняли решение, сотрудничая с этой инициативой?" # Have we made the right decision when we cooperated with this initiative?

 ge.154.t: "Результаты референдума здесь!" # The results from the referendum are here!
 ge.154.d: "Мы закончили подсчет всех голосов, то же самое сделали и другие республики. Независимо от результатов, наши страны за этот период сблизились, и вполне вероятно, что даже если референдум провалится, мы все равно создадим экономический и военный союз. Несмотря ни на что, результаты таковы:" # We finished counting all of the votes, and so did the other republics. No matter what the results are, our nations have come closer during this period, and it's likely that even if the referendum fails we will still create an economic and military union. Regardless, the results are:
 ge.154.a: "Народ проголосовал за образование Закавказья!" # The people have voted to form Transcaucasia!
 ge.154.b: "Народ против образования Закавказья, однако экономический и военный союз мы все равно создадим." # The people have against forming Transcaucasia, however we shall still form an economic and military union.

 ge.155.t: "Народ поддерживает Закавказье!" # The People Support Transcaucasia!
 ge.155.d: "Результаты референдума были очевидны. Закавказский народ хочет реформировать Закавказскую Федерацию. Мы уже ведем переговоры с Азербайджаном и Арменией о технических деталях этого воссоединения." # The results of the referendum were clear. The Transcaucasian people want to reform the Transcaucasian Federation. We are already in talks with Azerbaijan and Armenia about the technical details of this reunion.
 ge.155.a: "Отныне у нас одни и те же враги и друзья." # From now on, we have the same enemies and friends.

 ge.156.t: "Народ проголосовал против Закавказья" # The People Voted Against Transcaucasia
 ge.156.d: "Результаты референдума были очевидны. Закавказский народ не хочет реформировать Закавказскую Федерацию. Однако, поскольку мы уже установили дружеские отношения с правительствами Закавказья, мы согласились сформировать экономический и военный союз, несмотря на то, что политический союз не обсуждался." # The results of the referendum were clear. The Transcaucasian people don't want to reform the Transcaucasian Federation. However, since we have already established friendly relations with the Transcaucasian governments we have agreed to form an economic and military union despite the political union being off the table.
 ge.156.a: "Это еще что-то, да?" # This is still something, right?

 ge.159.t: "Грузия требует плебисцита в Трапизоне" # Georgia demands a plebiscite in Trapizon
 ge.159.d: "Безумные грузины выдвинули новое требование. Они хотят, чтобы территория Трапизона проголосовала за то, должна ли она остаться армянской или присоединиться к Грузии. Это абсурдное требование, но они пригрозили объявить нам войну, если мы откажемся." # The insane Georgians have come up with a new demand. They want the area of Trapizon to vote on whether it should remain Armenian or join Georgia. This is a preposterous demand, but they've threatened to declare war on us if we refuse.
 ge.159.a: "Мы позволим это" # We'll allow it
 ge.159.b: "Они получат плебисцит во сне" # They will get a plebiscite in their dreams

 ge.160.t: "Трапизони проголосовал за присоединение к Грузии" # Trapizoni votes to join Georgia
 ge.160.d: "Люди по всему Трапизони проголосовали сегодня за присоединение своей территории к Грузии. Хотя правительство Армении все еще обеспокоено этим вопросом, жители Трапизони высказались, и армяне ничего не могут с этим поделать." # People all over Trapizoni have voted today for their territory to join Georgia. While the Armenian government is still sore about this issue, the people of Trapizoni have spoken and the Armenians can do nothing about this.
 ge.160.a: "Они ненавидят грузин меньше, чем армян." # They hate Georgians less than they hate Armenians.

 ge.161.t: "Трапизони проголосовал за то, чтобы остаться в Армении" # Trapizoni votes to remain in Armenia
 ge.161.d: "Люди по всему Трапизони проголосовали сегодня за то, чтобы их территория осталась в составе Армении. Мы до сих пор не знаем, почему они это сделали, но за этим наверняка стоят армяне." # People all over Trapizoni have voted today for their territory to remain in Armenia. We are still not sure why they did this, but the Armenians have got to be behind this.
 ge.161.a: "Они обманули! Это означает войну!" # They've cheated! This means war!

 ge.162.t: "Армения отказывается проводить плебисцит!" # Armenia refuses to hold the plebiscite!
 ge.162.d: "Армения не прислушалась к нашим требованиям, проигнорировав наш ультиматум. Вероятно, они думали, что не смогут выиграть плебисцит, но это неважно. Так или иначе, мы получим этот регион." # Armenia has not listened to our demands, ignoring our ultimatum. They probably thought they couldn't win the plebiscite, but no matter. We'll get that region one way or another.
 ge.162.a: "Тогда очень хорошо. Они столкнутся с последствиями." # Very well then. They shall face the consequences.

 ge.163.t: "Трапизони проголосовал за присоединение к Грузии" # Trapizoni votes to join Georgia
 ge.163.d: "Люди по всему Трапизони проголосовали сегодня за присоединение своей территории к Грузии. Мы не знаем, как им это удалось, но возможно, им удалось подкупить население или каким-то образом проникнуть в комитет по подсчету голосов." # People all over Trapizoni have voted today for their territory to join Georgia. We're not sure how they did it, but it's possible they managed to bribe over the population or somehow infiltrate the vote counting committee.
 ge.163.a: "Мы ошибались, полагая, что они будут играть честно." # We were wrong to trust them to play fairly.

 ge.164.t: "Трапизони проголосовал за то, чтобы остаться в Армении" # Trapizoni votes to remain in Armenia
 ge.164.d: "Люди по всему Трапизони проголосовали сегодня за то, чтобы их территория осталась в составе Армении. К сожалению, Грузия уже объявила результаты плебисцита фальшивыми и объявила нам войну." # People all over Trapizoni have voted today for their territory to remain in Armenia. Unfortunately, Georgia already declared the results of the plebiscite to be fake and have declared war on us.
 ge.164.a: "Они просто неудачники!" # They're just sore losers!

 ge.170.t: "Грузины хотят присоединиться к Штальпакту" # The Georgians Want to Join the Stahlpakt
 ge.170.d: "Мы были удивлены, когда получили сообщение от правительства Грузии о желании присоединиться к «Штальпакту». Хотя мы уже сотрудничали в Великой войне, это мнение все еще было неожиданным. Мы подозреваем, что они хотят использовать нас, чтобы потребовать уступок от Советов." # We were surprised when we received a message from the Georgian government about them wanting to join the Stahlpakt. While we already cooperated in the Great War, this sentiment was still unexpected. We suspect they want to leverage us to demand concessions from the Soviets.
 ge.170.a: "Чем больше, тем лучше" # The more the merrier
 ge.170.b: "Грузия – не что иное, как бремя" # Georgia is nothing but a burden

 ge.171.t: "Германия отклонила наше предложение о союзе" # Germany has rejected our alliance offer
 ge.171.d: "Германия отклонила наше предложение о союзе. Мы подозреваем, что они сделали это, потому что боялись, что Советы нападут на нас и им придется вмешаться. В любом случае, это значительно снижает наши шансы на выживание против Советов." # Germany has rejected our alliance offer. We suspect they did it because of them being afraid of the Soviets attacking us and them having to intervene. Regardless, this makes our chances of survival against the Soviets a lot lower.
 ge.171.a: "Это их потеря!" # It's their loss!

 ge.180.t: "Грузины требуют Северный Кавказ" # The Georgians Demand North Caucasia
 ge.180.d: "Эти маленькие дети в Грузии думают, что у них достаточно сил, чтобы потребовать, чтобы мы отдали им Северный Кавказ. Хотя мы можем только смеяться над их угрозами, возможно, передача им этой незначительной территории — хороший способ избавиться от нее и ее нестабильности." # Those little brats over at Georgia think they have enough might to demand that we hand them over North Caucasia. While we can only laugh at them threatening us, perhaps handing them over this insignificant territory is a good way to get rid of it and its instability.
 ge.180.a: "Конечно, они могут это получить." # Sure, they can have it
 ge.180.b: "Ты что, шутишь?" # What, are you kidding me?

 ge.185.t: "Грузия требует Азербайджан!" # Georgia demands Azarbaijan!
 ge.185.d: "С тех пор, как Джугашвили пришел к власти в Грузии, они ведут себя все более и более безумно. Их последним действием было требование от нас Азербайджана, угрожая захватить его силой, если мы откажемся. Хотя они совершенно безумны, они вложили значительные средства в милитаризацию, так что, возможно, борьба с ними — не лучшая идея." # Ever since Jugashvili came to power in Georgia, they've been acting more and more insane. Their latest act was to demand Azarbaijan from us, threatening to take it by force if we refuse. While they're utterly insane, they've invested heavily into militarization so perhaps fighting them isn't the best idea.
 ge.185.a: "Мы должны отдать им должное, они слишком сумасшедшие!" # We have to give it to them, they are too crazy!
 ge.185.b: "Их? Победить нас? Мы никогда не слышали такой смешной шутки, как эта." # Them? Defeating us? We've never heard a joke as funny as this.

 ge.186.t: "Персия отказалась отдать нам Азербайджан!" # Persia refused to give us Azarbaijan!
 ge.186.d: "Они высмеяли наших дипломатов, а когда поняли, что мы настроены серьезно, выслали наших дипломатов и предупредили нас, чтобы мы больше им не угрожали. Видно, они сошли с ума! Они узнают, что такое Могущество грузинского народа!" # They've laughed our diplomats off, and when they realized we are serious they've expelled our diplomats and gave us a warning not to threaten them again. Clearly, they've lost their minds! They will learn what the Georgian People's Might means!
 ge.186.a: "Мы должны наказать их за наглость!" # We must punish them for their insolence!

 ge.187.t: "Персия согласилась отдать нам Азербайджан!" # Persia agreed to give us Azarbaijan!
 ge.187.d: "Они знали, насколько мы серьезны в тот момент, когда наши дипломаты выступили с этим требованием. Они быстро согласились на наши условия, и теперь Азербайджан контролируется нами." # They knew how serious we were the moment our diplomats came in with the demand. They've quickly agreed to our terms and Azarbaijan is now controlled by us.
 ge.187.a: "Они пока сохранены." # They are saved, for now.

 ge.190.t: "Грузины требуют гарантий своей независимости" # The Georgians Request a Guarantee for Their Independence
 ge.190.d: "У нас сложились дружеские отношения с правительством Грузии с тех пор, как мы поддержали ее независимость после Великой войны, несмотря на несколько затруднений на этом пути. Теперь они пришли к нам и попросили гарантии своей независимости от советской агрессии и любых других стран, которые стремятся к ним вторгнуться. Хотя такая гарантия может быть выгодна для нас с дипломатической точки зрения, вмешательство в войну в таком далеком месте может быть опасным." # We have had a friendly relationship with the Georgian government ever since we supported their independence after the Great War, despite a few hiccups along the way. Now they came to us and asked for a guarantee for their independence against the Soviet aggression and any other countries that seek to invade them. While such a guarantee might be benefitial to us diplomatically, a war in such a far away place could be dangerous to intervene in.
 ge.190.a: "Очень хорошо, мы можем гарантировать их." # Very well, we can guarantee them.
 ge.190.b: "Они могут справиться с этим самостоятельно." # They can deal with it on their own.

 ge.191.t: "Британцы отклонили нашу просьбу о гарантиях" # The British Deny Our Request of a Guarantee
 ge.191.d: "Ничего другого мы и не ожидали. Британцы пояснили, что мы не можем ожидать каких-либо гарантий их независимости, которые потребовали бы от них начать войну в нашу помощь." # We shouldn't have expected anything else. The British have clarified that we couldn't expect any sort of a guarantee for their independence that would require them to go to war in our aid.
 ge.191.a: "Коварный Альбион снова наносит удар!" # Perfidious Albion Strikes Again!
 ge.191.b: "Мы обращаемся к Франции в этот час нужды." # We turn to France in this hour of need.

 ge.192.t: "Грузины требуют гарантий своей независимости" # The Georgians Request a Guarantee for Their Independence
 ge.192.d: "С грузинами мы особо не общались, но они по-прежнему требуют гарантий своей независимости, в основном для того, чтобы не допустить нападения Советского Союза на них. Они уточняют, что просили у британцев гарантии, но те им отказали. Принятие этого могло бы укрепить нас дипломатически, но вмешательство в войну в далеком месте может быть опасным." # We didn't deal much with the Georgians, but they still request a guarantee for their independence, mostly to prevent the Soviet Union from attacking them. They clarify that they have asked the British for a guarantee, but they have turned them down. Accepting this could strengthen us diplomatically, but a war in a far away place could be dangerous to intervene in.
 ge.192.a: "Мы гарантируем их независимость." # We shall guarantee their independence.
 ge.192.b: "Они могут искать своих друзей где-нибудь еще." # They can search for their friends someplace else.

 ge.195.t: "Закавказье предлагает нам присоединиться к их федерации" # Transcaucasia proposes that we join their federation
 ge.195.d: "У нас уже давно хорошие отношения с грузинами и азербайджанцами. Учитывая международную ситуацию, для них имело смысл предложить нам присоединиться к их федерации, чтобы защититься от внешних угроз. Но это означает отказ от нашей независимости, то же самое, чего мы пытались избежать..." # We've had good relations with the Georgians and the Azerbaijanis for a long time. Because of the international situation, it made sense for them to propose that we join their federation in order to defend against foreign threats tofeth. But this means giving up our independence, the exact same thing we were trying to avoid...
 ge.195.a: "Мы вступим в их федерацию." # We will join their federation.
 ge.195.b: "Мы не можем отказаться от своей независимости!" # We can't give up our independence!

 ge.199.t: "Закавказские выборы" # The Transcaucasian Elections
 ge.199.desc: "Пришло время новых выборов. Если в прошлом партии были разделены по политической идеологии, то мы стали свидетелями того, как традиционные партии стран Закавказья превратились в партии, представляющие всю их нацию." # The time for new elections has come. While in the past the parties were divided by political ideology, we have seen the traditional parties of the Transcaucasian countries shift into parties that represent their entire nation.
 ge.199.a: "Победил грузинский кандидат" # The Georgian Candidate Wins
 ge.199.b: "Победил армянский кандидат" # The Armenian Candidate Wins
 ge.199.c: "Победил азербайджанский кандидат" # The Azeri Candidate Wins
 ge.199.d: "Андердог побеждает! Нашим лидером станет Пери-Хан Софиева." # An Underdog Wins! Peri-Khan Sofieva shall become our leader.

 ge.200.t: "Грузины просят вооружить их" # The Georgians request that we arm them
 ge.200.d: "Грузия всегда была страной, находящейся в центре наших кавказских интересов. Теперь, когда они расширяют свою армию, они решили, что было бы лучше попросить нас снабдить их столь желанным оружием. Хотя на самом деле им нечем платить, они пообещали, что будут вечно благодарны." # Georgia has always been a country at the heart of our caucasian interests. Now that they are expanding their army, they have figured that it would be best to ask us to supply them with their much coveted arms. While they don't really have much to pay with, they have promised they will be eternally grateful.
 ge.200.a: "Почему нет?" # Why not?
 ge.200.b: "Зачем нам это делать?" # Why would we ever do that?

 ge.201.t: "[From.GetName] отказался дать нам оружие!" # [From.GetName] has refused to give us weapons!
 ge.201.d: "К сожалению, [From.GetName] отказался предоставить нам оружие, хотя мы пытались убедить их, что это будет выгодно и им. После этого мы научились снижать ожидания международной помощи нашей стране." # Unfortunately, [From.GetName] has refused to give us weapons even though we tried to convince them that it would be beneficial for them too. After this we have learned to lower our expectations of international aid to our country.
 ge.201.a: "Какой позор." # What a shame.

 ge.250.t: "Линкор завершил постройку" # The Battleship Has Finished Construction
 ge.250.d: "Наш линкор, жемчужина нашего нового военно-морского флота, наконец-то достроен и теперь присоединится к остальному флоту." # Our battleship, the crown jewel in our new navy, has finally been completed and will now join the rest of our navy.
 ge.250.a: "Ура!" # Hurray!

 ge.260.t: "Предложить мир туркам?" # Propose Peace to the Turks?
 ge.260.d: "Мы получаем сообщения с поля боя о том, что мы побеждаем в Турции и что в настоящее время мы контролируем весь старый Трапизони. Теперь мы можем предложить мир, который обеспечит наш контроль над этим регионом." # We are receiving reports from the battlefield that we are winning in Turkey and that we currently control all of old Trapizoni. We can now propose peace that will ensure our control over this region.
 ge.260.a: "Что ж, не стоит проливать больше крови, чем необходимо." # Very well, there's no need for more bloodshed than necessary.
 ge.260.b: "Мы не прекратим сражаться, пока они безоговорочно не сдадутся!" # We will not stop fighting until they unconditionally surrender!

 ge.261.t: "Предложить мир Советам?" # Propose Peace to the Soviets?
 ge.261.d: "С поля боя мы получаем сообщения о том, что мы побеждаем на Северном Кавказе и что в настоящее время мы контролируем все заявленные нами земли. Теперь мы можем предложить мир, который обеспечит наш контроль над этими регионами." # We are receiving reports from the battlefield that we are winning in North Caucasia and that we currently control all of our claimed lands. We can now propose peace that will ensure our control over these regions.
 ge.261.a: "Что ж, не стоит проливать больше крови, чем необходимо." # Very well, there's no need for more bloodshed than necessary.
 ge.261.b: "Нам следует также потребовать и другие наши претензии, пока мы здесь, и подождать, пока они примут и эти требования." # We should also demand our other claims while we're here and wait until they will accept those demands too.

 ge.262.t: "Предложить мир Советам?" # Propose Peace to the Soviets?
 ge.262.d: "Мы получаем сообщения с поля боя о том, что мы побеждаем в войне против Советского Союза и в настоящее время контролируем все заявленные нами земли, включая Краснодар и Крым. Теперь мы можем предложить мир, который обеспечит наш контроль над этими регионами." # We are receiving reports from the battlefield that we are winning in our war against the Soviet Union and we currently control all of our claimed lands, including Krasnodar and Crimea. We can now propose peace that will ensure our control over these regions.
 ge.262.a: "Что ж, не стоит проливать больше крови, чем необходимо." # Very well, there's no need for more bloodshed than necessary.
 ge.262.b: "Мы не прекратим сражаться, пока они безоговорочно не сдадутся!" # We will not stop fighting until they unconditionally surrender!

 ge.263.t: "Грузины предлагают мир!" # The Georgians Propose Peace!
 ge.263.d: "Для нас это темное время. Мы смеялись над грузинами, когда они предъявляли нам свои нелепые претензии, но, похоже, они смеялись последними. Теперь они приходят к нам с предложением мира, и то, что поначалу казалось смешным, теперь кажется разумным." # This is a dark time for us. We have laughed at the Georgians when they pressed their ridiculous claims on us, but it seems they had the last laugh. Now they come to us with an offer of peace, and what seemed ridiculous at first seems reasonable now.
 ge.263.a: "У нас нет выбора..." # We have no choice...
 ge.263.b: "Неужели мы всерьез подумываем о сдаче этим Чвенебури?" # Are we really seriously thinking of surrender to these Chveneburi?
 ge.263.c: "Грузины не знают своего места!" # The Georgians don't know their place!

 ge.264.t: "Наше мирное предложение не было принято!" # Our Peace Offer Didn't Get Accepted!
 ge.264.d: "Мы надеялись, что враг поймет, что мы выиграли эту войну, но не тут-то было. Война продолжается, но теперь наши люди наконец начинают понимать, с каким чудовищным врагом мы столкнулись." # We were hopeful that the enemy will understand that we won this war, but there wasn't any such luck. The war goes on, but now our people finally begin to understand the monsterous enemy we are facing.
 ge.264.a: "Их потеря!" # Their loss!

 ge.900.t: "Грузинские добровольцы прибыли" # The Georgian Volunteers Have Arrived
 ge.900.d: "Мы были очень рады услышать, что в нашу армию прибыла первая дивизия грузинских добровольцев. Они будут интегрированы в состав Советской армии и будут служить на одном из фронтов." # We were very excited to hear that the first division of Georgian volunteers to our army has arrived. They will be integrated into the Soviet army and will serve at one of the fronts.
 ge.900.a: "Это показывает силу нашей «дружбы»." # This shows the strength of our 'friendship'

 ge.910.t: "Грузия хочет присоединиться к нашему альянсу" # Georgia Wants to Join Our Alliance
 ge.910.d: "Грузия хочет присоединиться к нашему альянсу. Они чувствуют, что не могут сидеть сложа руки, пока мир завоеван врагами человечества, и после того, как мы дали им гарантию, они думают, что мы их ближайшие союзники." # Georgia wants to join our alliance. They feel that they can't sit around while the world is conquered by the enemies of mankind, and after we've given them a guarantee they think that we're their closest allies.
 ge.910.a: "Пусть присоединяются!" # Let them join!
 ge.910.b: "Они будут только обузой." # They would only be a burden.

 ge.911.t: "Франция не хочет, чтобы мы были в их союзе!" # France Doesn't Want Us in Their Alliance!
 ge.911.d: "Мы надеялись, что французы поймут, что мы хотим им помочь. К сожалению, они не хотели, чтобы мы были в их альянсе. Хотя они не назвали особых причин, мы подозреваем, что это потому, что они думают, что мы недостаточно сильны, чтобы оказать влияние." # We were hopeful that the French would understand that we want to help them. Unfortunately, they didn't want us in their alliance. While they didn't give much of a reason, we suspect it's because they think we are not strong enough to make an impact.
 ge.911.a: "Их потеря!" # Their loss!

 ge.920.t: "Грузия хочет присоединиться к нашему альянсу" # Georgia Wants to Join Our Alliance
 ge.920.d: "Грузия хочет присоединиться к нашему альянсу. Они чувствуют, что не могут сидеть сложа руки, пока мир могут завоевать враги человечества, и после того, как мы дали им гарантию, они думают, что мы их ближайшие союзники." # Georgia wants to join our alliance. They feel that they can't sit around while the world can be conquered by the enemies of mankind, and after we've given them a guarantee they think that we're their closest allies.
 ge.920.a: "Пусть присоединяются!" # Let them join!
 ge.920.b: "Они будут только обузой." # They would only be a burden.

 ge.921.t: "Британия не хочет, чтобы мы были в их альянсе!" # Britain Doesn't Want Us in Their Alliance!
 ge.921.d: "Мы надеялись, что британцы поймут, что мы хотим им помочь. К сожалению, они не хотели, чтобы мы были в их альянсе. Хотя они не назвали особых причин, мы подозреваем, что это потому, что они думают, что мы недостаточно сильны, чтобы оказать влияние." # We were hopeful that the British would understand that we want to help them. Unfortunately, they didn't want us in their alliance. While they didn't give much of a reason, we suspect it's because they think we are not strong enough to make an impact.
 ge.921.a: "Их потеря!" # Their loss!

 ge.950.t: "Грузия просит нас присоединиться к их альянсу" # Georgia Requests That We Join Their Alliance
 ge.950.d: "Грузия хочет, чтобы мы присоединились к их альянсу ради нашей взаимной защиты." # Georgia wants us to join their alliance, for our mutual protection.
 ge.950.a: "Это будет взаимовыгодно." # This will be mutually benefitial.
 ge.950.b: "Мы предпочитаем сами распоряжаться своей судьбой." # We prefer to control our own fate.

 ge.951.t: "[From.GetName] не присоединился к нашему альянсу" # [From.GetName] Didn't Join Our Alliance
 ge.951.d: "Мы предложили [From.GetName] присоединиться к нашему альянсу и делали это максимально дружелюбно, но они до сих пор не приняли это предложение." # We have proposed for [From.GetName] to join our alliance, and we were as friendly as possible doing it, but they still haven't accepted it.
 ge.951.a: "Какой позор." # What a shame.

 ge.10000.t: "Эквтайм открывает новую музейную выставку" # Ekvtime Opens a New Museum Exhibition
 ge.10000.d: "Эквтиме Такаишвили, наш самый известный профессор истории в Тбилисском государственном университете, удостоился чести открыть новую выставку в Грузинском музее в Тбилиси. Выставка была посвящена документам, находившимся в Закавказском архиве царской эпохи. Среди них есть некоторые интересные данные о масштабах проникновения охранки в грузинские большевистские группы, которые, похоже, выставляют многих нынешних грузинских большевиков в плохом свете." # Ekvtime Takaishvili, our most renowned history professor in the Tbilisi State University, was honored in opening up a new exhibition in the Georgian Museum in Tbilisi. The exhibition was about the documents that were in the Transcaucasian archive from the Tsarist era. Among them are some fascinating findings about the extent of the Okhrana infiltration into the Georgian Bolshevik groups, that seem to put a lot of current Georgian Bolsheviks in a bad light.
 ge.10000.a: "Мы обязательно это проверим!" # We'll be sure to check it out!

 ge.10001.t: "Строительство Центрального стадиона Тбилиси завершено" # The Tbilisi Central Stadium Construction is Complete
 ge.10001.d: "Тысячи футбольных фанатов радуются открытию Центрального стадиона Тбилиси для публики. Хотя за последние десять лет было основано множество футбольных команд, часто связанных с различными профсоюзами и кооперативами, у них не было центрального места для соревнований. Но не более того! Новый стадион обязательно примет любой футбольный матч!" # Thousands of football fans cheer as the Tbilisi Central Stadium is opened to the public. While many football teams have been founded in the last dozen of years, often related to various labor unions and cooperatives, they didn't have a central place to compete in. But no more! The new stadium is sure to accommodate any football match!
 ge.10001.a: "Надеемся, футбольные команды смогут заставить нас гордиться!" # Hopefully the football teams can make us proud!

 ge.10002.t: "Чиаурели отпускает Арсена" # Chiaureli Releases Arsen
 ge.10002.d: "Сегодня в грузинских кинотеатрах вышла новая картина. Новый фильм известного кинорежиссера Михаила Чиаурели «Арсен» рассказывает о грузинском солдате, который возвращается из царской армии и замечает притеснения грузинских крепостных со стороны русских дворян. Он организует восстание против русских, и вместе с грузинами всех сословий, которые приходят добровольцами, восстание расширяется и превращается в большое восстание. К сожалению, русским удается внедрить в восстание агентов, которые побуждают грузин сдаться русским, и восстание голосует за принятие мирного соглашения с русскими. Арсен покидает группу вместе со своей возлюбленной Нено. \n\nВ последней сцене показаны результаты капитуляции. Арсен возвращается в некогда угнетённые деревни и находит лишь сгоревшие руины." # A new picture came out to Georgian cinemas today. The acclaimed film director Mikheil Chiaureli's new movie Arsen is about a Georgian soldier who returns from the Tsarist army and notices the oppression of the Georgian serfs by the Russian nobles. He organizes a rebellion against the Russians and together with Georgians from all classes who come to volunteer the rebellion expands and becomes a big revolt. Unfortunately the Russians manage to infiltrate the rebellion with agents that encourage the Georgians to surrender to the Russians, and the rebellion votes to accept a peace agreement with the Russians. Arsen leaves the group with his love Neno. \n\nIn the last scene, the results of the surrender are shown. Arsen returns to the once oppressed villages and only finds burnt ruins.
 ge.10002.a: "Этот фильм показывает, что мы не можем доверять русским." # This film shows that we can't trust the Russians.
 ge.10002.b: "Это лишь показывает, что националистическая пропаганда уступает социалистической." # This only shows that nationalist propaganda is inferior to socialist propaganda.

 ge.10003.t: "Чиаурели выпускает «Великий рассвет»" # Chiaureli Releases The Great Dawn
 ge.10003.d: "Чиаурели поражает нас еще одной картиной. На этот раз фильм представляет собой сатирический взгляд на Октябрьскую революцию. Он показывает, как меньшевик, находившийся в заключении до Февральской революции, видит отчаяние народа в Великой войне и слушает речь Владимира Ленина о том, как социал-демократическая партия принесет спасение, когда придет к власти. Воодушевленный речью, он присоединяется к большевистской фракции, а позже записывается в Красную Армию. \n\nВ фильме показано, как он путешествует по разным фронтам и входит в состав делегации Иосифа Джугашвили, тогда известного как Иосиф Сталин, чтобы остановить серьезные нарушения прав человека, которые их заставляют совершать. \n\nК несчастью для них, Сталин запирает всю делегацию в той же тюрьме, в которой он находился до этого, а после показательного суда, на котором присутствовал Сталин, его приказано казнить. Ему удается сбежать из тюрьмы только для того, чтобы встретить одного из людей, которых он видел в отчаянии, когда его вообще выпустили из этой тюрьмы. Человек говорит ему, что другие люди, которых он видел, были из его деревни и что теперь они голодают из-за политики большевиков, и что он ищет немного еды, которая выпала из поставок в тюрьму. Опечаленный этим открытием, он пытается бежать из России. По дороге он подслушивает речь Сталина о том, как был разбит великий рассвет революции, и начинает плакать." # Chiaureli hits us with another picture. This time, the movie is a satirical take on the October revolution. It shows how a Menshevik that was locked up until the February Revolution see the people's despair in the Great War and listens to a speech by Vladimir Lenin about how the Social Democratic party will bring salvation when it gets in power. Excited by the speech, he joins the Bolshevik faction, and later enlists in the Red Army. \n\nThe movie shows him traveling to different fronts, and being a part of a delegation to Ioseb Jugashvili, then known as Joseph Stalin, to stop the severe human rights violations that they are being forced to do. \n\nUnfortunately for them, Stalin locks all of the delegation up in the same prison he was locked in before and after a show trial attended by Stalin he is ordered to be executed. He manages to break out of the prison, only to meet one of the people he has seen in despair when he was released from that prison in the first place. The person tells him that the other people he saw were from his village and that now they are starving because of the Bolshevik policies and that he is searching for some food that fell off from the shipments to the prison. Saddened by this revelation he tries to escape from Russia. On his way he overhears a speech given by Stalin about how the great dawn of the revolution was broken and he begins to cry.
 ge.10003.a: "Это отрезвляющее напоминание о предательской природе Советов." # This is a sobering reminder of the treacherous nature of the Soviets.
 ge.10003.b: "Почему националистическая пропаганда всегда так плоха?" # Why is nationalist propaganda always so bad?
 ge.10003.c: "Мы поговорим с этим директором." # We will have a talk with this director.

 ge.10004.t: "Грузия присоединяется к Советскому Союзу" # Georgia Joins the Soviet Union
 ge.10004.d: "[This.GetNewspaperHeader]После советского вторжения в Грузию это казалось неизбежным. Временное народное правительство Грузии решило преобразовать Грузию в Грузинскую Советскую Социалистическую Республику и подписало все соответствующие договоры, формально присоединяющие Грузинскую ССР и Советский Союз." # [This.GetNewspaperHeader]Following the Soviet invasion of Georgia, this was seemingly inevitable. The Provisional People's Government of Georgia has decided to transform Georgia into the Georgian Soviet Socialist Republic, and has signed all of the relevant treaties that formally adjoin the Georgian SSR and the Soviet Union.
 ge.10004.a: "Разве Грузия не является частью Америки?" # Isn't Georgia a part of America?
 ge.10004.b: "Мы наконец воссоединились!" # We're reunited at last!
 ge.10004.c: "Приветствуем наших грузинских братьев в Союзе!" # We welcome our Georgian brothers into the Union!

 ge.10005.t: "Герзель Баазов публикует вторую часть своей трилогии «Петхаини»!" # Gerzel Baazov publishes the second part of his trilogy 'Petkhaini'!
 ge.10005.d: "Герзель Баазов, известный грузинский еврейский поэт, писатель и драматург, опубликовал вторую книгу запланированной трилогии книг, описывающих жизнь грузинских евреев. Первая книга трилогии была встречена с большим успехом и получила высокую оценку за точное описание повседневной жизни обычных грузинских евреев в поздней Российской империи. Вторая часть посвящена жизни в демократической Грузии, идеологическому конфликту между сионистами, несионистами и радикальными революционерами. Хотя Герзель не принадлежит ни к какой партии (он сионист), некоторые уловили в ней критику правительства за ограничение сионистской деятельности в некоторых случаях, в то время как другие говорят, что книга на самом деле представляет собой критику еврейских радикалов за предательство традиций. Герзель сказала, что ни одно из них не верно, поскольку книга лишь пытается описать еврейскую жизнь, а не критиковать ее." # Gerzel Baazov, a famous Georgian Jewish poet, writer and playwright, has published the second book of his planned trilogy of books describing the life of Georgian Jews. The first book in the trilogy was met with great acclaim and was praised for accuratly describing the daily life of regular Georgian Jews in the late Russian Empire. The second part focuses on life under democratic Georgia, the ideological conflict between Zionists, non-Zionists and radical revolutionaries. While Gerzel isn't affiliated with any party (he is a Zionist), some have detected criticism of the government in it for limiting Zionist activity in some instances, while others say the book is really a criticism of the Jewish radicals for betraying tradition. Gerzel said that none of them are correct, as the book only tries to describe the Jewish life, not offer critique of it.
 ge.10005.a: "Мы гордимся тем, что у нас есть такой талантливый писатель!" # We are proud to have such a talented writer!
