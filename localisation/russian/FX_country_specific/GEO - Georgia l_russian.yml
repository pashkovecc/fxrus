####NATIONAL FOCUS
    ### NON STALIN
 GEO_1936_elections: "Выборы!" # Elections!
 GEO_1936_elections_desc: "Грузия, которая была стабильной страной на протяжении всех последних лет независимости, проведет свои первые выборы, на которых победа SSDP не гарантирована. Хотя два крыла SSDP остаются двумя крупнейшими партиями, они не могут управлять в одиночку. Это означает, что им придется пойти на какой-то компромисс с другой партией, который может их подорвать." # Georgia, which had been a stable country for all of its recent years of independence, is going to have its first elections where the victory of the SSDP is not guaranteed. Even though the SSDP's two wings remain the two biggest parties they cannot rule alone. This means they will have to make some kind of compromise with another party which could undermine them.
 GEO_radical_victory: "Радикальная победа" # Radical Victory
 GEO_radical_victory_desc: "Народ устал ждать, когда в конце концов наступит социализм. Они предоставили радикальному крылу большинство голосов, чтобы иметь возможность ускорить приход социализма в страну." # The people have grown tired of waiting for socialism to eventually happen. They've given the Radical wing the plurality vote in order for them to have a shot at accelerating the arrival of socialism in the country.
 GEO_become_SSR: "Присоединение к Советскому Союзу" # Joining the Soviet Union
 GEO_become_SSR_desc: "Заставить страну, которая привыкла к свободе и демократии, встать на колени перед авторитарными иностранными правителями, очень сложно. Для этого коммунисты должны делать это постепенно, тщательно упраздняя оппозиционные партии и избирательно притесняя нелояльных граждан. Только после того, как страна окажется под твердой советской властью, общество сможет перейти к советской системе." # Making a country that is used to freedom and democracy kneel before authoritarian foreign overlords is tough. To do this the Communists must do it gradually, carefully abolishing opposition parties and selectively oppressing disloyal citizens. Only after the country is firmly under Soviet rule can society be transformed to the Soviet system.
 GEO_collie_takeover: "Коммунисты берут верх" # The Communists Take Over
 GEO_collie_takeover_desc: "Национал-коммунисты явно слишком помешаны на власти, чтобы им можно было доверить хотя бы ограниченную ответственность. В ответ на свои проступки коммунисты полностью захватили Коммунистическую партию." # The National Communists are clearly too mad with power to be entrusted with even limited responsibility. In response to their transgressions, the Communists have completely taken over the Communist Party.
 GEO_find_new_partners: "Найдите партнеров для управления" # Find Partners for Governing
 GEO_find_new_partners_desc: "Без поддержки национал-коммунистов ограниченная поддержка Коммунистической партии среди народа еще больше сократилась. Если коммунисты хотят править, им придется искать новых партнеров для управления, включая этнические меньшинства и раскаявшихся бывших профсоюзных лидеров." # Without the support of the National Communists the Communist Party's limited support amongst the people has dwindled even more. If the Communists want to rule they will have to look at new partners for governing, including ethnic minorities and repentant ex trade union leaders.
 GEO_realpolitik: "Реальная политика выживания" # Realpolitik of Survival
 GEO_realpolitik_desc: "Иногда нужно отдать дюйм, чтобы выиграть милю. Мы можем на данный момент пойти на некоторые уступки различным группам, чтобы стабилизировать наш режим." # Sometimes it is needed to give an inch to gain a mile. We can give some concessions to various groups to stabilize our regime for now.
 GEO_sudden_betrayal: "Внезапное предательство" # Sudden Betrayal
 GEO_sudden_betrayal_desc: "Хотя это и было ожидаемо, коммунисты были удивлены тем, как быстро национал-коммунисты предали свое совместное правление и теперь переходят к захвату власти на всех уровнях." # Even though it was expected, the Communists were surprised how quickly the National Communists have betrayed their joint rule and are now moving to seize power on all levels.
 GEO_vang_takeover: "Национал-коммунисты захватывают власть" # The National Communists Seize Power
 GEO_vang_takeover_desc: "Национал-коммунисты быстрыми шагами захватили власть на собрании Коммунистической партии. Пройдет время, прежде чем их правление укрепится, но это радикальное изменение, которое дестабилизирует и без того нестабильный и непопулярный режим." # In a swift move, the National Communists have seized power in a meeting of the Communist Party. It will take time until their rule solidifies, but this is an extreme change that destabilizes an already unstable and unpopular regime.
 GEO_crush_unloyalty: "Раздавить нелояльность" # Crush Unloyalty
 GEO_crush_unloyalty_desc: "Мы — непопулярная фракция, и если мы не разберемся быстро с оппозицией, они могут тем или иным образом свергнуть нас. Если мы не покажем, что можем сохранить стабильность в стране, Советский Союз может вмешаться против нас!" # We are an unpopular faction, and if we don't deal quickly with the opposition they might depose us in one way or another. If we don't show that we can keep the country stable the Soviet Union might intervene against us!
 GEO_vang_constitution: "Национальная коммунистическая конституция" # National Communist Constitution
 GEO_vang_constitution_desc: "Чтобы облегчить многие изменения, которые мы вносим в страну, нам нужно принять новую конституцию, которая, по крайней мере, придаст нам видимость легитимности. Эта конституция будет содержать положения для всего, что мы хотим сделать." # In order to facilitate the many changes we are making to the country, we need to make a new constitution that will at least give us a veneer of legitimacy. This constitution will have provisions for everything we want to do.
 GEO_their_worst_nightmare: "Их худший кошмар" # Their Worst Nightmare
 GEO_their_worst_nightmare_desc: "Когда меньшевики провозгласили независимость от Российской империи, они никогда не думали, что именно в такое состояние придет Грузия. Это настоящий кошмар для всех, кто разделяет их ценности «буржуазной» свободы, «буржуазной» демократии и «буржуазного» равенства." # When the Mensheviks declared independence from the Russian Empire they've never thought this is the state Georgia will come to. It is a living nightmare for everyone who shares their values of 'bourgeois' liberty, 'bourgeois' democracy and 'bourgeois' equality.
 GEO_still_alive: "Все еще жив" # Still Alive
 GEO_still_alive_desc: "Мы успешно преодолели трудности, возникшие с установлением нашего режима. Мы будем двигаться дальше, чтобы более прочно утвердиться в качестве единоличных лидеров Грузии." # We've successfully navigated the storms that came with the establishment of our regime. We shall move on to more firmly establish ourselves as the sole leaders of Georgia.
 GEO_crush_revolts: "Подавить восстание" # Crush the Revolts
 GEO_crush_revolts_desc: "Большая часть сельской местности все еще не умиротворена, и ею управляют различные националистические движения и крестьянские советы. Нам необходимо распространить наше управление и на эти области." # A lot of the countryside is still not pacified, and it is ruled by various nationalist movements and peasant councils. We need to spread our governance to these areas too.
 GEO_handle_instability: "Справьтесь с нестабильностью" # Handle the Instability
 GEO_handle_instability_desc: "Кажется, каждую неделю раскрывается новый сюжет. Нам необходимо искоренить все повстанческие движения и найти ответственных за эти революционные тенденции населения." # It seems like every week there's a new plot that is uncovered. We need to uproot all rebel movements and find those responsible for these revolutionary tendencies of the population.
 GEO_another_SSR: "Обычная ССР" # A Regular SSR
 GEO_another_SSR_desc: "Мы наконец установили свой режим и теперь можем прекрасно вписаться в Советский Союз с остальными ССР." # We've finally established our regime, and we can now fit in perfectly in the Soviet Union with the rest of the SSRs.
 GEO_delay_inevitable: "Отсрочка неизбежного" # Delay the Inevitable
 GEO_delay_inevitable_desc: "В конце концов, капитализм падет, и его заменит социализм. Мы не можем забегать вперед и рисковать потерять уже полученные реформы, поэтому отложим трансформацию общества на менее опасное время." # Eventually, Capitalism will fall and Socialism will replace it. We can't get ahead of ourselves and risk losing the reforms that we've already gotten, so we will delay the transformation of society to a less dangerous time.
 GEO_reunite_skhivi: "Слияние с фракцией Схиви" # Merger with the Skhivi faction
 GEO_reunite_skhivi_desc: "Фракция Схиви в СДПН откололась от нее много лет назад, поскольку хотела создать более демократическую партию. Теперь, когда мы — основная фракция, мы можем пригласить их обратно в партию и принять их требования." # The Skhivi faction of the SSDP split off from it many years ago because it wanted a more democratic party. Now that we are the major faction we can invite them back into the party and accept their demands.
 GEO_democratized_party: "Демократизация партии" # Democratizing the Party
 GEO_democratized_party_desc: "Чтобы получить больше общественной поддержки, нам необходимо больше вовлекать общественность в дела партии. Мы сделаем это, укрепив демократию в партии и повысив ее подотчетность перед обществом." # In order to receive more public support we need to get the public involved more in the affairs of the party. We will do this by strengthening the democracy in the party, allowing for more accountability to the public.
 GEO_workplace_social: "Закон о социализации на рабочем месте" # Workplace Socialization Law
 GEO_workplace_social_desc: "Первый радикальный закон, который мы примем, — это закон о социализации на рабочем месте. Он позволяет простым большинством голосов рабочих на рабочем месте экспроприировать его у владельца фабрики и возместить ему лишь частично." # The first radical law that we shall legislate is the Workplace Socialization law. It allows for a simple majority vote from the workers in a workplace to expropriate it from the factory's owner and only partially reimburse him.
 GEO_reform_society: "Реформа общества" # Reform Society
 GEO_reform_society_desc: "Закон о социализации на рабочем месте – это только первый шаг. Мы будем медленно, но верно реформировать общество с помощью либертарианских законов, которые приведут нас к социализму." # The Workplace Socialization Law is only the first step. We will slowly but surely reform society with Libertarian laws that will advance us towards Socialism.
 GEO_convince_trade_unions: "Убедить профсоюзы" # Convincing the Trade Unions
 GEO_convince_trade_unions_desc: "Хотя некоторые профсоюзы поддерживают нас, большинство по-прежнему поддерживают умеренную фракцию SSDP, поскольку она более укоренилась. Чтобы по-настоящему преобразовать общество, нам нужно будет убедить их сотрудничать с нами." # While some trade unions support us, most still support the moderate faction of the SSDP as it is more entrenched. To truly transform society we will need to convince them to cooperate with us.
 GEO_dashnak_alliance: "Коалиция с партией Дашнак" # Coalition with the Dashnak Party
 GEO_dashnak_alliance_desc: "Поскольку нам не хватает социалистических партнеров для коалиции, мы должны пригласить в коалицию партию Дашнакцутюн, поскольку, хотя они и являются армянскими националистами, они также являются социалистами, как и мы." # As we are starved for socialist partners to coalition with, we should invite the Dashnaktsutyun party into the coalition as while they are Armenian nationalists, they are also socialists like us.
 GEO_local_power: "Делегирование власти на местах" # Delegating Power to Localities
 GEO_local_power_desc: "В различных местах наблюдается множество беспорядков из-за националистической агитации, поддерживаемой коммунистами. Мы должны децентрализовать государство, чтобы они могли чувствовать себя свободными, не отрываясь от нас." # There is a lot of unrest in various places because of nationalist agitation supported by the communists. We should decentralize the state so that they can feel free without breaking off from us.
 GEO_demsoc_role_model: "Демократический социалистический образец для подражания" # Democratic Socialist Role Model
 GEO_demsoc_role_model_desc: "Теперь, когда наше общество трансформируется в демократический социализм, мы можем по-настоящему увидеть, какого прогресса мы достигли и насколько регрессивен остальной мир. Нам следует пригласить лидеров Лейбористского и Социалистического Интернационала посетить нашу страну." # Now that our society is transforming into democratic socialism, we can truly see how much progress we've made and how regressive the rest of the world is. We should invite the leaders of the Labour and Socialist International to see our country.
 GEO_moderate_victory: "Умеренная победа" # Moderate Victory
 GEO_moderate_victory_desc: "Народ показал, что предпочитает стабильность радикальной демагогии. Мы постараемся их не разочаровать." # The people have shown they prefer stability to radical demagoguery. We will try to not disappoint them.
 GEO_moderate_reform: "Умеренная реформа" # Moderate Reform
 GEO_moderate_reform_desc: "Радикальная фракция не такая уж и радикальная. Настоящие радикалы – это внешние партии. Мы будем вести переговоры с радикальной фракцией, чтобы достичь золотой середины, которая сохранит стабильность." # The radical faction isn't that radical. The real radicals are the outside parties. We will negotiate with the radical faction to achieve a happy middle ground that will keep stability.
 GEO_mend_schism: "Исправить раскол" # Mend the Schism
 GEO_mend_schism_desc: "Мы не можем оставаться разделенными. Мы воссоединим нашу партию на основе согласованных принципов и постараемся ограничить разногласия внутри партии." # We cannot remain divided. We will reunite our party with agreed upon principles and we will try to limit disagreements to within the party.
 GEO_keeping_what_worked: "Сохранение того, что сработало" # Keeping What Worked
 GEO_keeping_what_worked_desc: "Мы были стабильной страной на протяжении 18 лет. Ничто не мешает нам сохранять стабильность, продолжая нашу политику." # We were a stable country for 18 years. Nothing stops us from continuing to be stable by continuing our policies.
 GEO_focus_on_ourselves: "Сосредоточьтесь на себе" # Focus on Ourselves
 GEO_focus_on_ourselves_desc: "Ввязывание себя в мировые конфликты повредит нам больше всего. Мы больше всего возвращаемся к политике нейтралитета, которую мы проводили, когда была основана эта республика, и сохраняем ее так долго, как сможем." # Entangling ourselves in worldwide conflicts will hurt us the most. We most go back to the policy of neutrality that we held when this republic was founded and keep it for as long as we can.
 GEO_local_menshevik_leadership: "Местное меньшевистское руководство" # Local Menshevik Leadership
 GEO_local_menshevik_leadership_desc: "Причина ярого сепаратизма, распространенного в нашей стране, состоит в том, что партия меньшевиков оторвалась от местных сообществ и их интересов. Чтобы исправить это, мы должны поощрять участие местного населения в партии меньшевиков и продвигать местных лидеров на национальные позиции." # The reason for the fervent separatism that is common in our country is that the Menshevik party became detached from local communities and their concerns. To fix this we must encourage local participation in the Menshevik Party and promote local leaders to national positions.
 GEO_stable_once_more: "Стабильность еще раз" # Stable Once More
 GEO_stable_once_more_desc: "Мы наконец-то разрешили этот кризис. Теперь мы можем вернуться к миру и процветанию... По крайней мере, мы на это надеемся." # We have finally solved this crisis. We can now go back to being peaceful and prosperous... Or so we hope.
 GEO_wide_coalition: "Широкая коалиция" # Wide Coalition
 GEO_wide_coalition_desc: "Мы больше не можем поддерживать правительство, основанное только на нашей воле, поэтому мы создадим коалицию с Национально-демократической партией и Социалистически-федералистской партией." # We can no longer maintain a government based on our will alone, so we will make a coalition with the National Democratic Party and the Socialist-Federalist Party.
 GEO_painful_compromises: "Идите на болезненные компромиссы" # Make Painful Compromises
 GEO_painful_compromises_desc: "К сожалению, эта новая ситуация, в которой мы оказались, вынуждает нас идти на компромисс с другими партиями по ключевым политическим вопросам. Мы не можем избежать этого, если хотим сохранить эту коалицию." # Unfortunately, this new situation we found ourselves in forces us to compromise with the other parties on key policy issues. We cannot escape this if we want to maintain this coalition.
 GEO_free_market: "Свободный рынок" # Free Market
 GEO_free_market_desc: "На нашем рынке действует множество правил, и он в некоторой степени коллективизирован, и профсоюзы представляют большой процент работников. Наша коалиция поставила перед собой задачу освободить рынок, чтобы, как мы надеемся, стимулировать нашу экономику. Хотя партия меньшевиков в принципе выступает против этого, умеренная фракция может терпеть это, пока соблюдаются права трудящихся." # Our market has many regulations and is somewhat collectivised with unions representing a large percent of workers. Our coalition has set its sights on freeing the market, to hopefully stimulate our economy. While the Menshevik Party opposes this in principle, the moderate faction can tolerate it as long as worker rights are kept.
 GEO_talk_with_church: "Разговор с церковью" # Talk with the Church
 GEO_talk_with_church_desc: "Чтобы получить больше свободы действий с Национал-демократической партией, нам необходимо поговорить с Грузинской православной церковью и договориться с ней по ключевым вопросам." # To gain more leeway with the National Democratic Party we need to talk with the Georgian Orthodox Church and reach an agreement with them on key issues.
 GEO_monarchy_referendum: "Референдум о монархии" # Monarchy Referendum
 GEO_monarchy_referendum_desc: "Фракция в церкви потребовала от нас провести референдум по вопросу восстановления монархии. Хотя они даже не составляли большинства в церкви, проводившая этот референдум могла увеличить власть меньшевиков в коалиции, если народ отвергнет монархию. Однако к кампании за восстановление монархии уже присоединилось множество людей, и она имеет определенные шансы на успех." # A faction in the church has demanded us to hold a referendum on the issue of the restoration of the monarchy. While they were not even the majority in the church holding this referendum could increase the Menshevik power in the coalition if the people reject the monarchy. However, many people have already joined the campaign for the restoration of the monarchy and it has some chance of success.
 GEO_keep_social_reforms: "Продолжайте социальные реформы" # Keep Social Reforms
 GEO_keep_social_reforms_desc: "Эту коалицию можно сохранить только в том случае, если социалисты-федералисты и национал-демократы согласятся пойти на компромисс по вопросу, который меньше всего волнует меньшевики: социальные реформы и права рабочих. К счастью, они, похоже, согласятся на это, если будут выполнены другие их требования." # This coalition can only be kept if the Socialist-Federalists and National Democrats agree to compromise on the issue that the Mensheviks hold closest to heart: Social Reforms and Worker Rights. Fortunately they seem likely to agree to this as long as their other demands are met.
 GEO_historic_compromise: "Исторический компромисс" # Historic Compromise
 GEO_historic_compromise_desc: "В течение многих лет партия меньшевиков правила практически единолично, а другие партии не соглашались с ней почти по всем вопросам. Широкая коалиция изменила политику Грузии, и был достигнут компромисс, которого многие считали недостижимым." # For many years the Menshevik party practically ruled alone, and the other parties disagreed with it on almost every matter. The wide coalition has reshaped Georgia's politics, and a compromise has been reached that many thought could never be reached.
 GEO_moderate_alliance: "Умеренный Альянс" # The Moderate Alliance
 GEO_moderate_alliance_desc: "Главное, что нас всех объединяет, — это наше противостояние радикалам, которые в наши дни становятся все более распространенными. Мы должны бороться с экстремизмом, где бы он ни существовал, внутри и снаружи." # The main thing we all have in common is our opposition to the radicals who are becoming more and more common these days. We should fight extremism wherever it exists, within and without.
 GEO_wide_consensus: "Широкий консенсус" # Wide Consensus
 GEO_wide_consensus_desc: "Теперь, когда мы определились с нашими руководящими принципами, подавляющее большинство общественности признает нас как стабилизирующую силу и согласно с нашей политикой." # Now that we have decided on our guiding principals, the vast majority of the public recognizes us as a stabilizing force and agrees to our policies.
 GEO_socially_united: "Социально единый" # Socially United
 GEO_socially_united_desc: "За последние несколько месяцев политика, казалось, больше не имела большого значения. Поскольку большинство людей поддерживают Умеренный альянс, они больше не считают себя политическими соперниками, а вместо этого сосредотачиваются на том, что объединяет грузин как нацию." # Over the past few months, politics seemed to not matter too much anymore. As most people support the Moderate Alliance, they don't see themselves as political rivals anymore, instead focusing on what unites Georgians as a nation.
 GEO_dead_coalition: "Коалиция мертва!" # The Coalition is Dead!
 GEO_dead_coalition_desc: "Нам не удалось преодолеть наши разногласия, и наша коалиция снова нестабильна. Поскольку мы больше не можем прийти к согласию ни по каким важным темам, единственное, что остается сделать, — это снова объявить досрочные выборы." # We have failed to overcome our differences, and our coalition is unstable again. As we cannot agree on any important topics anymore, the only thing left to do is to call snap elections again.
 GEO_snap_elections: "Досрочные выборы" # Snap Elections
 GEO_snap_elections_desc: "Мы немедленно организуем досрочные выборы, чтобы определить будущее нашей страны. Поскольку оба крыла меньшевистской партии пострадали от текущих событий, либо Социалистически-федералистская партия, либо Национал-демократическая партия добьются большинства на выборах, и партия, которая добьется этого, станет первой неменьшевистской партией, добившейся большинства с момента обретения независимости." # We shall immediately organize snap elections to determine the future of our country. As both wings of the Menshevik Party have been hit by the current events, either the Socialist-Federalist Party or the National-Democratic Party will achieve plurality in the elections, and the party to do so will be the first non Menshevik party to achieve plurality since independence.
 GEO_socfed_plurality: "Социалистически-федералистский плюрализм" # Socialist-Federalist Plurality
 GEO_socfed_plurality_desc: "Народ высказался и выбрал социалистов-федералистов, чтобы они возглавили Грузию. Зародившись в царской России, они тогда выступали за национальные автономии как решение мучившей ее проблемы национализма. Их в основном поддерживают крестьянство и мелкое (бывшее) дворянство." # The people have spoken, and they've chosen the Socialist-Federalists to lead Georgia. Originating in Tsarist Russia, back then they were for national autonomies as a solution to the nationalism issue that plagued it. They are mostly supported by the peasantry and the minor (ex)nobles.
 GEO_federal_system: "Федеральная система" # Federal System
 GEO_federal_system_desc: "Правильный способ решить проблему нашего сепаратизма – предоставить абхазам и осетинам равные права, не только равные права граждан, но и национальные права. Каждый член национального меньшинства будет пользоваться автономией, независимо от того, где он проживает в стране." # The correct way to solve our separatism is by giving the Abkhazians and the Ossetians equal rights, not just equal citizen rights but also national rights. Every national minority member will enjoy autonomy no matter where he lives in the country.
 GEO_social_market: "Социальный рынок" # Social Market
 GEO_social_market_desc: "Нет смысла отказываться от всего прогресса, которого мы достигли в области социальных прав только потому, что старая экономическая система работала не слишком хорошо. Мы сохраним права рабочих и систему социальной защиты, которую наши законы предоставляют частным людям, склоняя на нашу сторону бывших меньшевиков." # It makes no sense to throw away all of the progress we made in social rights just because the old economy system didn't work too well. We shall keep the worker rights and the social safety net our laws provide to private people, swaying ex-Mensheviks to our side.
 GEO_fair_georgia: "Справедливая Грузия" # Fair Georgia
 GEO_fair_georgia_desc: "Грузия будет справедливой по отношению ко всем своим гражданам, независимо от того, какое у них экономическое происхождение или к какой этнической группе они принадлежат." # Georgia will be fair for all its citizens, no matter what economic background they have or what ethnic group they are a part of.
 GEO_natdem_plurality: "Национально-демократическое большинство" # National-Democratic Plurality
 GEO_natdem_plurality_desc: "Народ высказался и выбрал национал-демократов, чтобы возглавить Грузию. Это националистическая партия, также выступающая за свободный рынок и сильное руководство." # The people have spoken, and they've chosen the National-Democrats to lead Georgia. They are a nationalist party, also in favor of free markets and strong leadership.
 GEO_forced_centralization: "Принудительная централизация" # Forced Centralization
 GEO_forced_centralization_desc: "Автономия, которую мы даем нашим национальным меньшинствам, — это то, что дает им возможность. Мы должны устранить эту автономию, сделав все районы страны прямым контролем центрального государства." # The autonomy we give to our national minorities is what enables them. We must remove this autonomy, making all areas of the country directly controlled by the central state.
 GEO_minimal_welfare: "Минимальное благосостояние" # Minimal Welfare
 GEO_minimal_welfare_desc: "Хотя мы не можем полностью отменить социальное обеспечение, мы сведем его к минимуму, чтобы заставить людей работать и поддержать нашу экономику." # While we cannot remove welfare completely, we will minimize it to make people work and bolster our economy.
 GEO_all_are_georgians: "Мы все грузины" # We Are All Georgians
 GEO_all_are_georgians_desc: "Так называемые национальные меньшинства должны осознать, что они такие же грузины, как и все мы. Мы георгифицируем их, обучая нашему языку и истории в их школах и запрещая любую их сепаратистскую деятельность." # The so called national minorities need to realize they are Georgians just like the rest of us. We shall Georgify them by teaching our language and history in their schools and forbidding any of their separatist activities.
 GEO_foreign_policy: "Внешняя политика" # Foreign Policy
 GEO_foreign_policy_desc: "Теперь, когда наш политический путь определен, нам предстоит выбрать внешнюю политику. Оставаться нейтральным больше нецелесообразно." # Now that our political path is decided, we have to choose our foreign policy. Remaining neutral is no longer viable.
 GEO_SSR_policy: "Политика реформирования безопасности" # The SSR Policy
 GEO_SSR_policy_desc: "Даже теперь, когда мы являемся ССР, нам необходимо определить свою политику по отношению к другим ССР и по отношению к центральной власти." # Even now that we are an SSR, we need to decide our policy towards the other SSRs and towards the central authority.
 GEO_friendliness: "Дружелюбие с нашими соотечественниками-СССР" # Friendliness with Our Fellow SSRs
 GEO_friendliness_desc: "Теперь, когда мы находимся в СССР, нет смысла ввязываться в новые конфликты. Мы должны быть дружелюбны к нашим братьям-социалистам." # There is no reason to engage in new conflicts now that we are in the USSR. We should be friendly to our socialist brethren.
 GEO_soviet_industrial_help: "Советская промышленная помощь" # Soviet Industrial Help
 GEO_soviet_industrial_help_desc: "Мы отстали, когда дело касается нашей отрасли. Советы могут помочь нам расширить и обновить его, а мы, в свою очередь, поможем им, снабжая их товарами." # We are backwards when it comes to our industry. The Soviets can help us expand and update it, and in turn we will help them by providing them with goods.
 GEO_expeditionary_forces: "Грузинские экспедиционные войска" # Georgian Expeditionary Forces
 GEO_expeditionary_forces_desc: "Советский Союз — социалистическая держава, находящаяся в конфликте с буржуазией, которая пытается его свергнуть. Как ССР, мы должны помочь нашему союзу выжить и процветать, поэтому мы отправим ему экспедиционные войска, чтобы помочь ему в его благородной битве." # The Soviet Union is a socialist power in conflict with the bourgeoisie who are trying to bring it down. As an SSR we have to help our union survive and flourish, so we'll send it expeditionary forces to aid it in its noble battle.
 GEO_expansion: "Расширение" # Expansion
 GEO_expansion_desc: "Того, что у нас есть сейчас, недостаточно. Нам необходимо расширять наши владения, чтобы распространять социализм и укреплять нашу страну." # What we currently have is not enough. We need to expand our holdings to spread socialism and strengthen our country.
 GEO_ties_to_soviet_leadership: "Укрепляйте наши связи с советским руководством" # Strengthen Our Ties to the Soviet Leadership
 GEO_ties_to_soviet_leadership_desc: "Чтобы пойти по такому авантюрному пути, нам необходимо укрепить связи с руководством профсоюза, чтобы оно позволило нам это сделать." # To go on such an adventurous path we need to strengthen our ties to the leadership of the union so that they will allow us to do it.
 GEO_invade_azerbaijan: "Вторгнуться в Азербайджан" # Invade Azerbaijan
 GEO_invade_azerbaijan_desc: "Азербайджан является легкой мишенью, поскольку его вооруженные силы не так сильны. Он также полон нефти, очень важного ресурса для Советского Союза и для всего мира." # Azerbaijan is an easy target as its military is not that strong. It's also full of oil, a very important resource for the Soviet Union and for the world.
 GEO_invade_armenia: "Вторгнуться в Армению" # Invade Armenia
 GEO_invade_armenia_desc: "Армению будет трудной мишенью для «освобождения», поскольку ее армия крепка и закалена в боях. Однако у него много сторонников-коммунистов, которые помогут нам в будущем, а он является неотъемлемой частью Закавказья, поэтому мы должны его завоевать." # Armenia will be a hard target to 'liberate' as its military is tough and battle hardened. However, it has many communist supporters who will aid us in the future, and it's an integral part of Transcaucasia, so we must conquer it.
 GEO_form_socialist_transcaucasia: "Образовать Социалистическое Закавказье" # Form Socialist Transcaucasia
 GEO_form_socialist_transcaucasia_desc: "Теперь, когда народы Закавказья едины, пришло время интегрировать их дальше, объединив в одну ССР." # Now that the Transcaucasian people are united it's time to integrate them further by uniting them into one SSR.
 GEO_revive_transcaucasia: "Оживите Закавказье" # Revive Transcaucasia
 GEO_revive_transcaucasia_desc: "Закавказье было недолговечным государством, возникшим после распада Российской империи, но оно раскололось, поскольку национальные различия были слишком велики, чтобы поддерживать общую внешнюю политику во время Первой мировой войны. Теперь, когда у всех нас есть общий враг, Закавказье можно будет сохранить вместе, но сначала нам нужно убедить другие страны реформировать его." # Transcaucasia was a short lived state born when the Russian Empire crumbled, but it split as the national differences were too great to maintain a common foreign policy in WW1. Now that we all have a common enemy, it should be possible to keep Transcaucasia together, but first we need to convince the other countries to reform it.
 GEO_armenia_talks: "Компромисс с Арменией" # Compromise with Armenia
 GEO_armenia_talks_desc: "Армению будет труднее всего убедить. Они имеют территориальные претензии и к нам, и к Азербайджану, вели войны и с нами, и с Азербайджаном. Возможно, отказ от Лори, за которую мы боролись, убедит их в том, что мы серьезно настроены на мир. но это не будет популярно среди нашего народа." # Armenia will be the hardest country to convince. They have territorial claims on both us and Azerbaijan, and had wars with both us and Azerbaijan. It's possible that giving up Lori, which we fought over, will convince them that we are serious about peace. but that will not be popular with our people.
 GEO_azerbaijan_talks: "Компромисс с Азербайджаном" # Compromise with Azerbaijan
 GEO_azerbaijan_talks_desc: "У нас сложились дружественные отношения с Азербайджаном с момента обретения нами независимости, но убедить их стать частью нашего союза по-прежнему будет непросто. Нам придется убедить их помириться с Арменией, несмотря на их обширный территориальный конфликт. Мы также владеем большинством азербайджанской провинции, которую мы могли бы передать им для умиротворения их националистов." # We have had friendly relations with Azerbaijan since our independence, but convincing them to be a part of our union will still not be easy. We will have to convince them to make up with Armenia, despite their extended territorial conflict. We also hold a majority Azeri province, that we could give them to appease their nationalists.
 GEO_transcaucasia_campaign: "Кампания за Закавказье" # Pro-Transcaucasia Campaign
 GEO_transcaucasia_campaign_desc: "Убедить правительства недостаточно. Нам нужно убедить людей, что реформирование Закавказья – это правильный ответ на проблемы региона и что у нас больше общего, чем мы думали изначально." # Convincing the governments is not enough. We need to convince the people that reforming Transcaucasia is the correct answer to the region's problems and that we have more in common than we originally thought.
 GEO_transcaucasia_referendum: "Закавказский референдум" # Transcaucasia Referendum
 GEO_transcaucasia_referendum_desc: "Вопрос о том, следует ли реформировать Закавказье или нет, в конечном итоге должен решить народ. Мы поставим вопрос на голосование и дождемся результатов." # The question of whether Transcaucasia should be reformed or not should ultimately be decided by the people. We will put the matter to the vote, and await the results.
 GEO_form_transcaucasia: "Форма Закавказья" # Form Transcaucasia
 GEO_form_transcaucasia_desc: "Закавказские народы проголосовали за образование Закавказской Федерации. Теперь мы должны немедленно начать организовывать союз наших наций и создавать новую центральную власть." # The Transcaucasian peoples have voted for the formation of the Transcaucasian Federation. We should now immediately start to organize the union of our nations and set up a new central authority.
 GEO_caucasia_referendum: "Союз с Горной Республикой" # A Union with the Mountain Republic
 GEO_caucasia_referendum_desc: "Горская Республика уже давно поддерживается нами, и они сталкиваются с теми же угрозами, что и мы. Включение их в федерацию будет выгодно обеим сторонам, поэтому мы спросим их, хотят ли они присоединиться." # The Mountain Republic has long been supported by us, and they face the same threats as us. Including them in the federation will be beneficial to both sides, so we'll ask them if they want to join.
 GEO_our_ancient_claims: "Наши древние претензии" # Our Ancient Claims
 GEO_our_ancient_claims_desc: "Наш золотой век должен быть нашим источником вдохновения. В эти нестабильные времена у нас снова есть возможность вернуть себе старые территории и войти в новый золотой век!" # Our golden age should be our source of inspiration. In these unstable times we again have an opportunity to recapture our old territories and enter another golden age!
 GEO_trapizoni_plebiscite: "Плебисцит в Трапизони" # Plebiscite in Trapizoni
 GEO_trapizoni_plebiscite_desc: "Армения — жестокий враг, и нет смысла воевать с ней, если мы можем этого избежать. Мы потребуем плебисцита в Трапизони, чтобы определить, кто должен стать владельцем этой провинции. Если они отвергнут наши требования... Они пожалеют об этом." # Armenia is a tough enemy, and there's no reason to go to war with them if we can avoid it. We will demand a plebiscite in Trapizoni to determine who should be the owner of that province. If they reject our demands... They'll regret it.
 GEO_claim_armenia: "Война за Армению" # War over Armenia
 GEO_claim_armenia_desc: "Вся Армения когда-то была нашей, здесь нет смысла идти на компромисс. Только скорая победа приведет нас к славе!" # All of Armenia used to be ours, there's no point compromising on it. Only a swift victory will lead us to glory!
 GEO_claim_old_trapizoni: "Война за Старый Трапизони" # War over Old Trapizoni
 GEO_claim_old_trapizoni_desc: "Турки владеют территорией, которая раньше принадлежала нашим вассалам. Нет смысла красиво просить, пойдём воевать!" # The Turks hold territory that used to belong to our vassals. There's no point in asking nicely for it, we'll go to war!
 GEO_claim_azerbaijan: "Война за Азербайджан" # War over Azerbaijan
 GEO_claim_azerbaijan_desc: "Возможно, азербайджанцы и были нашими союзниками, но они держат нашу территорию и даже заявляют, что мы держим их территорию! Это должно быть исправлено, конечно же, войной." # The Azeris may have been our allies, but they hold our territory and even claim we hold their territory! This must be rectified, by war of course.
 GEO_alliance_with_germany: "Союз с Германией" # Alliance with Germany
 GEO_alliance_with_germany_desc: "Мы не можем разрушить Советский Союз в одиночку (или можем?). Нам следует объединиться с другой державой, которая противостоит Советам, а поскольку Франция и Великобритания выступают против наших завоеваний, у нас остается только один выбор: Германия." # We can't take down the Soviet Union on our own (or can we?). We should ally with another power that opposes the Soviets, and because France and UK are opposed to our conquests, that only leaves us with one choice: Germany.
 GEO_conflict_over_north_caucasia: "Конфликт вокруг Северного Кавказа" # Conflict Over North Caucasia
 GEO_conflict_over_north_caucasia_desc: "Северный Кавказ – это не только наша законная территория, но и территория стратегического значения. Мы немедленно захватим его." # North Caucasia is not only our rightful territory, but also an area of strategic importance. We shall seize it at once.
 GEO_claim_krasnodar: "Конфликт из-за Краснодара" # Conflict over Krasnodar
 GEO_claim_krasnodar_desc: "Пришло время встретиться с великим советским зверем. Хотя наши шансы невелики, наша законная территория впереди, и если мы не освободим ее, то кто это сделает?" # The time has come to face the great Soviet beast. While our chances are slim, our rightful territory lies ahead, and if we don't liberate it, who will?
 GEO_claim_crimea: "Война за Крым" # War over Crimea
 GEO_claim_crimea_desc: "Мы завоевали большую часть нашей законной территории, но один кусочек все еще существует неподалеку. На протяжении многих столетий Крым выходил из-под контроля Грузии, но не более того. Нам нужно получить это последнее требование, прежде чем мы сможем успокоиться." # We've gained a lot of our rightful territory, but one piece still exists not far away. For many centuries Crimea has left the Georgian grasp, but no more. We need to get this one final claim before we can rest easy.
 GEO_greater_georgia: "Провозгласить Великую Грузию" # Proclaim Greater Georgia
 GEO_greater_georgia_desc: "Мы сделали это. Грузия полностью восстановила свою территорию, и теперь мы можем сказать, что вступили в новый золотой век. Возможно, пришло время выйти и на глобальную арену?" # We did it. Georgia has restored its full territory, and we can now say we have entered a new golden age. Perhaps it is time to step into the global stage too?
 GEO_defense_pact: "Наш собственный альянс" # Our Own Alliance
 GEO_defense_pact_desc: "Мы не можем полагаться на помощь далеких европейцев. Если мы хотим быть в безопасности от советской угрозы, нам нужно собрать все страны региона в коалицию против них." # We cannot rely on assistance from far away Europeans. If we want to be safe from the Soviet threat, we need to gather all of the countries in the region into a coalition against them.
 GEO_request_british_protection: "Запросить британскую защиту" # Request British Protection
 GEO_request_british_protection_desc: "У нас долгая история с британцами, со взлетами и падениями. Они против Советов, и там есть политики, которые сочувствуют нашему тяжелому положению. Возможно, они захотят гарантировать нашу независимость?" # We have a long history with the Brits, with ups and downs. They are against the Soviets, and there are some politicians there who are sympathetic to our plight. Perhaps they will be willing to guarantee our independence?
 GEO_georgian_soviet_rapprochement: "Грузино-советское сближение?" # Georgian-Soviet Rapprochement?
 GEO_georgian_soviet_rapprochement_desc: "К власти пришло новое руководство, которое проповедует социализм, гораздо более близкий к нашему. Нам следует попытаться договориться с ними и потеплить наши отношения." # A new leadership has risen to power, one who preaches socialism much closer to our own. We should try to strike a deal with them, and warm our relations.
 GEO_dem_joining_the_internationale: "Попросите Советы присоединиться к Интернационалу" # Ask the Soviets to Join the Internationale
 GEO_dem_joining_the_internationale_desc: "Советы и мы стали намного ближе с тех пор, как произошло сближение. Некоторые в нашей стране предлагают нам присоединиться к советскому альянсу." # The Soviets and us have grown a lot closer since we had our rapprochement. Some in our country are suggesting we join the Soviet alliance.

    ### SHARED
 GEO_industry: "Переориентация отрасли" # Refocusing the Industry
 GEO_industry_desc: "Ясно, что наша старая промышленность больше нежизнеспособна в современную эпоху. Нам необходимо уже сейчас определить наше будущее промышленное направление." # It's clear that our old industry is no longer viable in this modern era. We need to determine our future industrial direction now.
 GEO_export_focus: "Экспортный фокус" # Export Focus
 GEO_export_focus_desc: "У нас недостаточно ресурсов, чтобы полностью обеспечить себя без внешней торговли. Мы должны поощрять экспорт, чтобы улучшить наш платежный баланс, в конце концов, нам есть что дать." # We do not have enough resources to completely sustain ourselves without outside trade. We should encourage export to improve our balance of payments, after all, we have much to give.
 GEO_borjomi_mineral_water: "Минеральная вода Боржоми" # Borjomi Mineral Water
 GEO_borjomi_mineral_water_desc: "Известно, что наши источники обладают целебными свойствами. Мы будем экспортировать их воды в остальной мир." # Our water springs are known to have healing qualities. We shall export their waters to the rest of the world.
 GEO_georgian_wine: "Грузинское вино" # Georgian Wine
 GEO_georgian_wine_desc: "Наше вино известно во всем мире своим уникальным вкусом и высоким качеством. Мы можем поставлять его во многие регионы по более низкой цене, чем европейское вино, и, надеемся, завоевать значительную долю рынка." # Our Wine is world famous in its unique taste and high quality. We can provide it to many regions for a lower price than the European wine, and hopefully gain a significant market share.
 GEO_lemons_tea_wheat: "Обмен лимонов и чая на пшеницу" # Exchange Lemons and Tea for Wheat
 GEO_lemons_tea_wheat_desc: "Мы варим много чая и лимонов, но люди не могут прокормить себя только этим. Мы должны заключить соглашения с другими странами о поставках чая и лимонов в обмен на пшеницу, чтобы накормить наш народ." # We make a lot of tea and lemons, but people cannot sustain themselves only on that. We should strike agreements with other countries to supply tea and lemons in exchange for wheat to feed our people.
 GEO_increase_tourism: "Увеличение туризма" # Increase Tourism
 GEO_increase_tourism_desc: "В то время как остальной мир погружен в хаос, Грузия все больше и больше кажется островом здравомыслия. Учитывая, что многие традиционные места отдыха закрыты из-за мировой напряженности, возможно, Грузия сможет стать главным туристическим направлением?" # As the rest of the world is embroiled in chaos, Georgia seems more and more like an island of sanity. With many traditional vacation spots closed because of world tensions, perhaps Georgia can become a prime tourism spot?
 GEO_autarky: "Автаркия" # Autarky
 GEO_autarky_desc: "Мы не можем надеяться, что сможем выжить за счет импортных товаров в такие нестабильные времена. Нам необходимо максимизировать собственное производство товаров, чтобы обеспечить максимальную самообеспеченность." # We cannot hope to sustain ourselves from imported goods in such volatile times. We need to maximize our own production of goods to be as self sustaining as we can.
 GEO_farm_collectivisation: "Коллективизация ферм" # Farm Collectivisation
 GEO_farm_collectivisation_desc: "Если каждый фермер будет работать на своей маленькой ферме, он сможет обеспечить себя, но не других. Нам необходимо коллективизировать фермы, чтобы больше земли использовалось более эффективно." # If every farmer works on his small farm, he might sustain himself, but not others. We need to collectivise the farms so that more land will be used more efficiently.
 GEO_forced_collectivisation: "Принудительная коллективизация" # Forced Collectivisation
 GEO_forced_collectivisation_desc: "Богатые фермеры угнетают всех, не давая им еды! Надо форсировать коллективизацию земли, чтобы все были равны (плохо кормят)." # The rich farmers are oppressing everyone by not giving them food! We must force the collectivisation of land so that everyone will be equal(ly poorly fed).
 GEO_voluntary_collectivisation: "Добровольная коллективизация" # Voluntary Collectivisation
 GEO_voluntary_collectivisation_desc: "Колхозы более эффективны, чем обычные фермы, но правильный способ добиться коллективизации — это стимулирование, а не принуждение." # Collective farms are more efficient than regular farms, but the correct way to achieve collectivisation is through incentivisation, not force.
 GEO_farm_privatisation: "Приватизация ферм" # Farm Privatisation
 GEO_farm_privatisation_desc: "Каждый человек имеет право на свою собственность, которая не может быть присвоена государством. Мы должны найти решение проблемы низкого сельскохозяйственного производства в рамках индивидуалистической системы." # Every person has a right to his own property, which cannot be appropriated by the state. We must find a solution to our low agricultural production within the individualist system.
 GEO_distribute_land: "Новая земельная реформа" # A New Land Reform
 GEO_distribute_land_desc: "Одна из первых вещей, которые мы сделали, когда получили независимость, — это земельная реформа, и она имела огромный успех. Если мы сделаем это снова, мы сможем увидеть те же преимущества, что и раньше." # One of the first things we did when we got independence is a land reform, and it was a massive success. If we do it again we might see the same benefits as when we did it previously.
 GEO_sell_land: "Продать землю тому, кто предложит самую высокую цену" # Sell Land to the Highest Bidder
 GEO_sell_land_desc: "Продавая государственную землю тому, кто предложит самую высокую цену, мы не только гарантируем себе дополнительный источник дохода, но и то, что человек, купивший землю, захочет, чтобы она развивалась." # By selling government land to the highest bidder we don't only guarantee an additional source of income for ourselves, but also that the person who bought the land will want to see it developed.
 GEO_encourage_wheat_farming: "Поощряйте выращивание пшеницы" # Encourage Wheat Farming
 GEO_encourage_wheat_farming_desc: "Нам нужен хлеб, от этого никуда не деться. Но вместо того, чтобы импортировать пшеницу, мы можем поощрять наших собственных фермеров выращивать пшеницу." # We need bread, there's no way around that. But instead of importing wheat, we can encourage our own farmers to grow wheat.
 GEO_advanced_agriculture: "Импорт сельскохозяйственных технологий" # Import Agricultural Technologies
 GEO_advanced_agriculture_desc: "Грузинская местность по своей природе хороша только для некоторых растений. Импортируя новые сельскохозяйственные технологии, мы могли бы выращивать больше растений и растений, которые принесли бы нам больше пользы." # The Georgian terrain is only naturally good for some plants. By importing new agricultural technologies we could grow more plants and plants that would benefit us more.
 GEO_expand_local_infrastracture: "Расширить местную инфраструктуру" # Expand Local Infrastracture
 GEO_expand_local_infrastracture_desc: "Инфраструктура Грузии устарела, иногда даже восходя к царской эпохе. Нам необходимо обновить старую инфраструктуру и расширить ее." # Georgia's infrastructure is outdated, sometimes even going to the Tsarist era. We need to renovate the old infrastructure and expand it.
 GEO_georgian_railways: "Грузинские железные дороги" # Georgian Railways
 GEO_georgian_railways_desc: "Если мы соединим всю страну железной дорогой, это увеличит производство и разовьет деревню." # If we connect the whole country by rail it will increase production and develop the countryside.
 GEO_transcaucasian_railways: "Закавказские железные дороги" # Transcaucasian Railways
 GEO_transcaucasian_railways_desc: "Мы должны сотрудничать с нашими соседями, чтобы координировать строительство новых железных дорог, которые соединят наши страны, что позволит облегчить транспортировку товаров, людей и, если есть необходимость, армий." # We should cooperate with our neighbors to coordinate the construction of new railways that will connect our countries, allowing for easier transport of goods, people and if there's a need, armies.
 GEO_regional_universities: "Основанные региональные университеты" # Found Regional Universities
 GEO_regional_universities_desc: "Тбилиси становится все более развитым, а сельская местность отстает. Нам следует основать новые университеты в различных регионах для их развития." # Tbilisi is becoming more and more developed while the countryside is lagging behind. We should found new universities in our various regions to develop them.
 GEO_army: "Грузинская армия" # The Georgian Army
 GEO_army_desc: "Грузинская армия годами находилась в пренебрежении. Хотя мы могли позволить себе игнорировать его все эти годы, пришло время перевооружить его перед лицом растущей напряженности в регионе." # The Georgian army has been neglected for years. While we could afford to keep it neglected for all these years, the time has come to rearm it in the face of increasing tension in the region.
 GEO_british_arms: "Импортировать британское оружие" # Import British Arms
 GEO_british_arms_desc: "У нас давняя история с британцами, но они еще когда-то согласились защищать нас от Советов. Может быть, они и сейчас согласятся нас вооружить." # We have a long history with the Brits, but they did agree to defend us from the Soviets way back when. Maybe they'll agree to arm us now too.
 GEO_soviet_arms: "Импорт советского оружия" # Import Soviet Arms
 GEO_soviet_arms_desc: "Теперь, когда мы поддерживаем Советский Союз, они наверняка помогут нам с поставками оружия, верно?" # Now that we are Soviet aligned, surely they'll help us with arms supply, right?
 GEO_local_arms: "Ищите местное оружие" # Look for Local Arms
 GEO_local_arms_desc: "Мы не можем надеяться на получение какого-либо оружия извне, поэтому нам приходится искать оружие внутри наших границ." # We cannot hope to receive any arms from outside, so we have to look inside our borders for arms.
 GEO_enforce_conscription: "Обеспечьте соблюдение законов о воинской повинности" # Enforce Conscription Laws
 GEO_enforce_conscription_desc: "У нас уже есть строгие законы о воинской повинности, но они остались неиспользованными из-за периода длительного мира. Теперь, когда мы приближаемся к новой эпохе войны, нам понадобится как можно больше людей в армии, поэтому мы будем обеспечивать соблюдение этих старых законов о воинской повинности." # We already have strict conscription laws, but they went unused due to the period of long peace. Now that we are approching another era of war, we will need as many people as we can get in the army, so we'll enforce those old conscription laws.
 GEO_french_training: "Обучение французских офицеров" # French Officer Training
 GEO_french_training_desc: "Французы стали экспертами в области обороны во время Великой войны. Мы должны попросить их обучить наших офицеров, чтобы у нас был шанс сражаться против превосходящей армии." # The French became experts in defense in the Great War. We should ask them to train our officers so we'll have a fighting chance against a superior army.
 GEO_ukrainian_training: "Подготовка украинских офицеров" # Ukrainian Officer Training
 GEO_ukrainian_training_desc: "Украинская армия провела много исследований Советской Армии, готовясь к будущему конфликту. Мы должны попросить их обучать наших офицеров, как потому, что они наши исторические друзья, так и из-за нашей схожей ситуации в отношении советской угрозы." # The Ukrainian Army has conducted much research into the Soviet Army, in preperation for a future conflict. We should ask them to train our officers, both because they are our historic friends and because of our similar situation in regard to the Soviet threat.
 GEO_expand_junker_school: "Расширить Юнкерскую школу" # Expand the Junker School
 GEO_expand_junker_school_desc: "Юнкерская школа подготовила некоторых из наших лучших офицеров, и нет никаких оснований доверять иностранцам подготовку наших офицеров лучше, чем мы. Вместо этого нам следует расширить Юнкерскую школу, чтобы подготовить гораздо больше офицеров." # The Junker School has trained some of our finest officers, and there's no reason to trust foreigners to train our officers better than we do. Instead, we should expand the Junker School to train many more officers.
 GEO_equipment_manufacturing: "Производство оборудования" # Equipment Manufacturing
 GEO_equipment_manufacturing_desc: "У нас больше людей, чем оружия, и эту ситуацию нам необходимо исправить, если мы хотим иметь шанс противостоять нашим врагам. Мы должны производить все необходимое оборудование внутри Грузии, чтобы ни на кого не полагаться." # We have more men than weapons, and that's a situation that we need to fix if we want to stand a chance against our enemies. We should produce all the equipment we need inside of Georgia, to not rely on anyone.
 GEO_heavy_weapons_industry: "Промышленность тяжелого вооружения" # Heavy Weapons Industry
 GEO_heavy_weapons_industry_desc: "Если мы будем сражаться только с использованием легкого оружия, мы проиграем более механизированным силам. Нам нужно больше тяжелого оружия, если мы хотим иметь шанс сражаться против более крупных армий." # If we only fight with light arms we will lose against a more mechanized force. We need more heavy weapons if we want to have a fighting chance against bigger armies.
 GEO_provinicial_manufacturing: "Провинциальное производство" # Provincial Manufacturing
 GEO_provinicial_manufacturing_desc: "Хранить все наше производство в городах неэффективно, когда мы можем строить новые заводы рядом с ресурсами, которые нам в любом случае нужны для производства оружия." # Keeping all our production in the cities is inefficient when we can build new factories near the resources that we need to manufacture weapons anyway.
 GEO_stand_our_ground: "Придерживайтесь нашей основной доктрины" # Stand Our Ground Doctrine
 GEO_stand_our_ground_desc: "На самом деле, если разразится война, мы не добьемся значительного прогресса в нашей армии. Самое главное, чтобы мы удерживали оборону как можно дольше, пока враг не поймет, что мы не стоим его усилий." # Realistically, we're not going to be doing much advancement with our army if a war breaks out. The most important thing is that we hold the line as long as possible, until the enemy realizes we're not worth their effort.
 GEO_field_artillery_doctrine: "Доктрина полевой артиллерии" # Field Artillery Doctrine
 GEO_field_artillery_doctrine_desc: "Использование тактики Великой войны не принесет нам пользы в эпоху современных войн. Мы будем активно использовать артиллерию, когда мы обороняемся и когда мы наступаем, чтобы сохранить жизни и быть более эффективными в бою." # Using Great War tactics will not benefit us in this era of modern warfare. We shall heavily use artillery when we're on the defense and when we're on the offense, to conserve lives and to be more effective in combat.
 GEO_advanced_theory: "Передовая военная теория" # Advanced Military Theory
 GEO_advanced_theory_desc: "Наши офицеры должны иметь глубокие знания военной теории. Мы должны учиться этому у других стран, а также поощрять наших более опытных офицеров писать свои собственные военные тексты." # Our officers need to have an indepth knowledge of military theory. We should learn from other nations about it, and also encourage our more experienced officers to write their own military texts.
 GEO_expanded_mountaineer: "Расширенные альпинистские силы" # Expanded Mountaineer Forces
 GEO_expanded_mountaineer_desc: "Грузия полна гор. Мы можем использовать их в своих интересах, нанося удары по врагу из мест, до которых он не может легко добраться. С этой целью мы расширим наши горные силы." # Georgia is full of mountains. We can use them to our advantage, striking the enemy from places he cannot reach easily. To this end, we shall expand our mountaineer forces.
 GEO_army_motorization: "Моторизация армии" # Army Motorization
 GEO_army_motorization_desc: "Каждая современная армия использует грузовики для снабжения и транспортировки; мы не должны отличаться от них." # Every modern army relies on trucks for supply and transportation; we should not be different from them.
 GEO_tank_research: "Исследование танков" # Tank Research
 GEO_tank_research_desc: "Танки очень успешно использовались в Великой войне и могли бы помочь и нам." # Tanks have been used very successfully in the Great War, and could help us as well.
 GEO_army_mechanization: "Армейская механизация" # Army Mechanization
 GEO_army_mechanization_desc: "Грузовики не обеспечивают достаточной защиты на поле боя. Бронетранспортеры могут обеспечить безопасность наших солдат, а также позволить им сражаться на ходу." # Trucks don't give enough protection in the battlefield. Armored personnel carriers can keep our soldiers safe and let them fight back on the move as well.
 GEO_navy: "ВМС Грузии" # The Georgian Navy
 GEO_navy_desc: "Наш флот едва ли существует как нечто большее, чем силы береговой обороны. Нам необходимо сделать грузинский флот значительной силой в регионе." # Our navy barely exists as anything more than a coast defense force. We need to establish the Georgian navy as a considerable power in the region.
 GEO_merchant_navy: "Расширьте наш торговый флот" # Expand Our Merchant Fleet
 GEO_merchant_navy_desc: "У нас недостаточно торговых судов для расширения нашей торговли со всем миром, поэтому нам следует покупать и строить больше торговых судов." # We do not have enough merchant vessels to expand our trade with the world, so we should buy and construct more merchant vessels.
 GEO_destroyer_focus: "Разрушитель Фокус" # Destroyer Focus
 GEO_destroyer_focus_desc: "Разрушители относительно дешевы, и они могут защитить нас от сбоев в торговле. Нам следует сосредоточиться на строительстве большего количества эсминцев для нашего флота." # Destroyers are relatively cheap, and they can protect us from trade disruptions. We should focus on building more destroyers for our navy.
 GEO_light_cruiser_research: "Исследование легких крейсеров" # Light Cruiser Research
 GEO_light_cruiser_research_desc: "Иногда эсминцам не хватает огневой мощи. У нас не так много возможностей для строительства больших кораблей, таких как эсминцы, но мы можем, по крайней мере, изучить возможность строительства нескольких легких крейсеров для лучшей защиты наших берегов." # Sometimes, destroyers don't have enough firepower. We don't have much capability to build big ships like destroyers, but we can at least explore the possibility of building a few light cruisers to better defend our coasts.
 GEO_import_new_designs: "Импортируйте новые дизайны" # Import New Designs
 GEO_import_new_designs_desc: "Конструкция нашего эсминца восходит к Великой войне и не подходит для современной войны. Нам необходимо импортировать новые конструкции эсминцев, способных бороться с современными подводными лодками и другими эсминцами." # Our destroyer design dates back to the Great War, and is not suitable for modern warfare. We need to import new destroyer designs that can fight against modern submarines and other destroyers.
 GEO_submarine_focus: "Подводная лодка Фокус" # Submarine Focus
 GEO_submarine_focus_desc: "У нас нет особой надежды выиграть битву против большого флота, но если мы построим подводные лодки, мы сможем нарушить торговлю наших врагов." # We don't have much hope of winning a battle against a large navy, but if we build submarines we can disrupt the trade of our enemies.
 GEO_kickstart_submarine_manufacturing: "Кикстарт по производству подводных лодок" # Kickstart Submarine Manufacturing
 GEO_kickstart_submarine_manufacturing_desc: "У нас нет опыта производства подводных лодок, поэтому, если мы хотим начать их строительство, нам нужно закупать детали за рубежом, чтобы иметь возможность быстро построить наши первые подводные лодки." # We have no experience with submarine manufacturing, so if we want to start building them we need to buy parts from abroad to be able to quickly build our first submarines.
 GEO_upgrade_torpedo_boats: "Улучшайте наши торпедные катера" # Upgrade our Torpedo Boats
 GEO_upgrade_torpedo_boats_desc: "Легкие крейсеры — самые большие корабли, которые мы можем реально использовать. Нам следует оснастить их торпедами, взятыми с наших миноносцев." # Light cruisers are the biggest ships we can realistically utilise. We should outfit them with torpedos, taken from our torpedo boats.
 GEO_expand_batumi_dockyard: "Расширить Батумскую верфь" # Expand the Batumi Dockyard
 GEO_expand_batumi_dockyard_desc: "Батуми уже является нашим самым крупным портом, поэтому расширение наших мощностей по судостроению имеет наибольший смысл из-за наличия в этой области квалифицированных рабочих." # Batumi is already our most major port, expanding our ship building capabilities there makes the most sense because of the existence of skilled workers in that area.
 GEO_provincial_dockyards: "Создайте новые провинциальные верфи" # Make New Provincial Dockyards
 GEO_provincial_dockyards_desc: "Хотя мы можем быть более эффективными, расширяя Батумскую верфь, это только усугубит проблему безработицы в провинции. Нам следует открыть новые верфи вдали от больших городов, чтобы дать работу провинциальной молодежи." # While we can be more efficient by expanding the Batumi Dockyard, this will just exacerbate the provincial unemployment issue. We should open new dockyards away from the big cities to give jobs to provincial youth.
#GEO_the_naval_crown_jewel: "Жемчужина военно-морской короны" # The Naval Crown Jewel
#GEO_the_naval_crown_jewel_desc: "Наш флот уже представляет собой значительную силу на Черном море, но более грозных кораблей нам не хватает. Наше правительство должно приложить все усилия, чтобы построить или купить линкор для пополнения нашего флота." # Our fleet is already a considerable force in the Black Sea, but we lack more formidable ships. Our government should make all efforts to build or buy a battleship to complete our fleet.
 GEO_airforce: "ВВС Грузии" # The Georgian Airforce
 GEO_airforce_desc: "Мы больше не можем обходиться нашими небольшими военно-воздушными силами времен Великой войны. Мы должны расширить его и инвестировать в противовоздушную оборону, чтобы защитить нас от других стран." # We can no longer make do with our small Great War era airforce. We should expand it and invest in aerial defenses to protect us from other countries.
 GEO_new_fighters: "Получите новых бойцов" # Get New Fighters
 GEO_new_fighters_desc: "Наша авиация очень мала. Нам следует получить новые истребители, которые дадут нам шанс сражаться против более крупных военно-воздушных сил." # Our airforce is very small. We should get new fighters to give us a fighting chance against larger airforces.
 GEO_expand_airbases: "Расширить авиабазы" # Expand Airbases
 GEO_expand_airbases_desc: "Теперь, когда у нас больше самолетов, нам необходимо расширить наши авиабазы, чтобы все самолеты могли быть в рабочем состоянии и готовы к выполнению миссий повсюду." # Now that we have more planes, we need to expand our airbases so that all the planes could be operational and ready for missions everywhere.
 GEO_cas_focus: "КАС Фокус" # CAS Focus
 GEO_cas_focus_desc: "Помощь нашим войскам должна быть нашим главным приоритетом. Мы будем инвестировать в исследования и производство CAS, чтобы повысить нашу боевую эффективность." # Assisting our troops should be our top priority. We will invest into CAS research and manufacturing so that our combat effectiveness will increase.
 GEO_tac_bomber_focus: "Тактический бомбардировщик" # Tactical Bomber Focus
 GEO_tac_bomber_focus_desc: "Наша воздушная цель должна быть направлена ​​на срыв операций противника. Мы будем инвестировать в исследования и производство тактических бомбардировщиков, чтобы пострадать операции нашего врага." # Our aerial focus should be disrupting enemy operations. We will invest into Tactical Bomber research and manufacturing so that our enemy's operations will suffer.
 GEO_doctrinal_research: "Доктринальные исследования" # Doctrinal Research
 GEO_doctrinal_research_desc: "У ВВС должна быть четкая доктрина, которая будет определять их действия. Мы будем продвигать исследования и публикации, посвященные доктринам ведения воздушной войны." # The Airforce should have a solid doctrine that will guide its actions. We will promote research and publications that deal with air warfare doctrines.
 GEO_towed_aa: "Буксируемая ПВО Фокус" # Towed AA Focus
 GEO_towed_aa_desc: "Наша противовоздушная оборона должна сосредоточиться на защите наших частей на поле боя от самолетов противника. Это будет достигнуто за счет инвестиций в буксируемые зенитные орудия и присоединения зенитных установок к нашим дивизиям." # Our Anti Air defense should focus on defending our units in the battlefield from enemy planes. This will be achieved by investing into Towed AA guns and attaching AA units to our divisions.
 GEO_static_aa: "Статический фокус АА" # Static AA Focus
 GEO_static_aa_desc: "Наша противовоздушная оборона должна сосредоточиться на защите наших заводов и гражданского населения. Мы разместим зенитные орудия в стратегических точках по всей стране, чтобы наши граждане чувствовали себя в безопасности, а наши заводы продолжали функционировать во время войны." # Our Anti Air defense should focus on defending our factories and our civilians. We will put AA guns in strategic locations across the country so that our citizens will feel safe and our factories will continue to function in war.
 
    ### STALIN
 GEO_STA_return: "Он возвращается" # He Returns
 GEO_STA_return_desc: "Жизнь Джугашвили в любом случае была непростой. От избиений дома до учебы у священников и, наконец, до того, что он стал ключевой фигурой в большевистском подполье. Но они предали его и скоро почувствуют, каково это, когда Джугашвили злится на тебя." # Jughashvili didn't have an easy life by any means. From his beatings at home, to studying with priests, and finally to being a key figure in the Bolshevik underground. But they have betrayed him, and they shall soon feel what it's like when Jughashvili is angry at you.
 GEO_STA_repress: "Политические репрессии" # Political Repression
 GEO_STA_repress_desc: "Эпоха свободы в Грузии закончилась. Люди больше не будут свободно ходить и выражать свое мнение, вместо этого будет одно разрешенное мнение и лишь несколько избранных, одобряющих образ жизни. Все старые партии должны быть закрыты и очищены, а марксистская партия выстоит." # The era of liberty in Georgia is over. No longer shall people walk around and express their opinions freely, instead there will be one allowed opinion and only a select few approved lifestyles. All old parties shall be closed and purged, and the Marxist Party shall stand tall.
 GEO_STA_nationalize: "Национализация всей промышленности" # Nationalization of all Industry
 GEO_STA_nationalize_desc: "Мы не можем исключить тот факт, что есть некоторые области, которые мы не полностью контролируем. Нам нужно прочно расширить контроль над промышленностью, и мы не можем допустить, чтобы какой-либо капиталист имел собственность, которая должна принадлежать рабочим, или, другими словами, нам." # We cannot except the fact that there are some areas which we do not fully control. We need to firmly extend our grasp of the industry and we cannot let any capitalist to have any property that should belong to the workers, or in other words, to us.
 GEO_STA_militarism: "Ярый милитаризм" # Fervent Militarism
 GEO_STA_militarism_desc: "Поскольку наше население нас не поддерживает, нам необходимо воспитывать детей с раннего возраста, чего можно достичь с помощью воинской повинности и связанных с ней молодежных организаций. Более того, это привлечет поддержку националистов и заставит людей ненавидеть наших внешних врагов, а не нас." # Since our population doesn't support us, we need to indoctrinate children from a young age, something that could be achieved with military conscription and associated youth organizations. Furthermore, this will attract nationalist support and will make people hate our external enemies instead of us.
 GEO_STA_labor_camps: "Трудовые лагеря" # Labor Camps
 GEO_STA_labor_camps_desc: "Мы заключили в тюрьму многих людей, выступающих против нашего режима, но просто тратить деньги на то, чтобы держать их в тюрьмах, бессмысленно. Нет, мы должны извлечь из них какую-то выгоду, и пока у нас нет огромных пустых пространств, как в СССР, мы обязательно найдем подходящие места для размещения своих «ГУЛАГов»." # We have incarcerated many people who oppose our regime, but just spending money to keep them in prisons is meaningless. No, we must derive some sort of benefit from them, and while we don't have vast empty spaces like the USSR has we will surely find suitable places to put our own 'Gulags'.
 GEO_STA_secret_police: "Копия тайной полиции Ленина" # Copy Lenin's Secret Police
 GEO_STA_secret_police_desc: "Ленин, возможно, и был ублюдком, но никто не может утверждать, что он не знал, как угнетать свой народ. Копируя его тайную полицию, мы сможем добиться тотального контроля над жизнью наших граждан гораздо быстрее, чем если бы мы создавали новую тайную полицию с нуля." # Lenin may have been a bastard, but none can argue that he didn't know how to oppress his people. By copying his secret police we can achieve total control over our citizens' lives much faster than if we developed a new secret police from scratch.
 GEO_STA_collectivisation: "Коллективизация Джугашвили" # Jughashvili's Collectivisation
 GEO_STA_collectivisation_desc: "Хотя Джугашвили изначально выступал против быстрой коллективизации, еще во времена, когда он был в КПСС, его чистка действительно пробудила в нем понимание преимуществ коллективизации. Некоторые крестьяне могут умереть, но он готов принести эту жертву." # While Jughashvili originally opposed fast collectivisation, back in his days in the CPSU, him getting purged really woken him up to the benefits of collectivisation. Some peasants might die, but that's a sacrifice he is willing to make.
 GEO_STA_vanguardism: "Национальный коммунизм с грузинской спецификой" # National Communism with Georgian Characteristics
 GEO_STA_vanguardism_desc: "Хотя мы не совсем следуем Марксу слово в слово, наши изменения необходимы для того, чтобы лучше соответствовать реальности жизни на Кавказе. Джугашвили знает, что на самом деле имел в виду Маркс." # While we do not exactly follow Marx word for word, our changes are necessary to better fit the reality of life in the Caucasus. Jughashvili knows what Marx really meant.
 GEO_STA_worship_stalin: "Поклонение лидеру" # Leader Worship
 GEO_STA_worship_stalin_desc: "Чтобы отвлечь людей от их несчастной жизни, мы должны сосредоточить их внимание на нашем Спасителе Иосебе Джугашвили. Без него они были бы ничем, с ним во главе Грузия будет великой, и все трудящиеся мира смогут поклоняться ему." # To distract people from their miserable lives, we should focus their attention on our Savior Ioseb Jughashvili. Without him they would be nothing, with him at the helm Georgia will be great, and all the workers of the world will be free to worship him.
 GEO_STA_5_year_plans: "Постоянные пятилетние планы" # Perpetual 5 Year Plans
 GEO_STA_5_year_plans_desc: "Наша промышленность находится в плачевном состоянии. Может, не надо было сосылать всех наших талантливых промышленников и инженеров? Несмотря на это, мы должны провести индустриализацию еще раз, пока в Грузии не появится лучшая промышленность в мире! Джугасвили поставил очень четкие цели на каждые 5 лет, и если они не будут достигнуты, ситуация будет плохой для всех..." # Our industry is in a poor shape. Maybe we shouldn't have exiled all of our talented industrialists and engineers? Regardless, we must industrialize once more until Georgia will have the best industry in the world! Jughasvili has set very clear goals for every 5 years, and if they are not met the situation will be bad for everyone...
 GEO_STA_rogue_state: "Государство-изгой" # Rogue State
 GEO_STA_rogue_state_desc: "Из-за безумия нашего лидера и угнетения наших граждан все думают, что мы сошли с ума, и что с нашим государством нельзя торговать. Что ж, возможно, они правы. Но скоро они увидят нашу истинную мощь и мощь и начнут бояться нас!" # With the insanity of our leader and the oppression of our citizenry, everyone thinks we have gone mad, and our state is not to be traded with. Well, maybe they are right. But soon they will see our true might and power, and they will fear us!

    ## FOREIGN POLICY (STALIN)
 GEO_STA_foreign_policy: "Внешняя политика" # Foreign Policy
 GEO_STA_foreign_policy_desc: "После того, как контроль Джугашвили укрепился, для нас пришло время попытаться расширить наши границы и распространить истинный социализм!" # After Jughashvili's control has solidified, the time has come for us to try to expand our borders and spread true socialism!
 GEO_STA_invade_azerbaijan: "Вторгнуться в Азербайджан" # Invade Azerbaijan
 GEO_STA_invade_azerbaijan_desc: "Азербайджан — легкая цель для вторжения в первую очередь, поскольку его армия наименее сильна на Кавказе и в ней много социалистов, которые могли бы нам помочь. Азербайджанцы могут даже рассматривать нас как меньшее зло по сравнению с армянами, что могло бы помочь нам разделять и властвовать." # Azerbaijan is an easy target to invade first, seeing as their army is the least strong in the Caucasus and there are many socialists in it that might help us. The Azeris might even see us as a lesser evil compared to the Armenians, which could help us to divide and conquer.
 GEO_STA_invade_armenia: "Вторгнуться в Армению" # Invade Armenia
 GEO_STA_invade_armenia_desc: "У Армении большая армия, и с ней будет трудно бороться. Они имеют решающее значение, если мы хотим расширить или ошибочно распространить социализм еще дальше. Мы не можем довольствоваться Кавказом, когда там так много земель, которые нужно освободить!" # Armenia has a big army, and will be tough to fight against. They are critical if we want to expand, or err spread socialism even further. We can't just be satisfied with the Caucasus when there are so many lands that need to be liberated!
 GEO_STA_invade_mountain: "Вторжение в Горную Республику" # Invade the Mountain Republic
 GEO_STA_invade_mountain_desc: "Северный Кавказ издавна был южными воротами в Россию. Чтобы обезопасить этот важный стратегический пункт, нам нужно будет вторгнуться в них." # The Northern Caucasus has long been the southern gateway to Russia. In order to secure this important strategic point, we will need to invade them.
 GEO_STA_invade_iranian_azerbaijan: "Вопрос об Иранском Азербайджане" # The Question of Iranian Azerbaijan
 GEO_STA_invade_iranian_azerbaijan_desc: "Иранский Азербайджан является неотъемлемой частью Азербайджана. Поскольку мы являемся законными правителями Азербайджана, Иран должен отдать нам этот регион, а если он этого не сделает, мы будем вынуждены вторгнуться в него." # Iranian Azerbaijan is an integral part of Azerbaijan. Because we are the legitimate rulers of Azerbaijan Iran has to give us this region, and if they don't we will be forced to invade them.
 GEO_STA_invade_soviet: "Вторгнуться в Советский Союз" # Invade the Soviet Union
 GEO_STA_invade_soviet_desc: "Наконец пришло время заняться настоящей проблемой. Советский Союз, который провел чистку Джугашвили много лет назад, почувствует вкус мести. Их фальшивый социализм будет сметен с лица земли, и будет установлен новый, более просвещенный режим." # Finally the time has come to deal with the real issue. The Soviet Union, which has purged Jughashvili all these years ago, is going to feel what revenge tastes like. Their fake socialism will be swept from the earth, and a new and more enlightened regime will be installed.

    ### SSR

 GEO_SOV_foreign_policy: "Внешняя политика" # Foreign Policy
 GEO_SOV_foreign_policy_desc: "Пришло время определиться с нашей внешней политикой. Мы могли бы просто быть ССР, как и все остальные, поддерживать хорошие отношения и в целом быть мирными, или мы могли бы расширять и распространять наш социализм и на другие страны." # The time has come to decide on our foreign policy. We could just be an SSR like the rest of them, maintain good relations and generally be peaceful, or we could expand and spread our socialism to other lands too.


