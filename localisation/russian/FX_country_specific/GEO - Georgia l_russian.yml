####IDEAS
 GEO_junker_school: "Юнкерская школа" # Junker School
 GEO_junker_school_desc: "Грузинское юнкерское училище — военная академия, основанная в 1919 году и возглавляемая генералом Георгием Квинитадзе. Он обучил многих офицеров, которые сейчас служат в нашей армии, и оказался очень эффективным учреждением." # The Georgian Junker School is a military academy founded in 1919 and headed by General Giorgi Kvinitadze. It had taught many officers which are now serving in our army and has proved to be a very effective institution.
 GEO_menshevik_schism: "Раскол партии меньшевиков" # Menshevik Party Schism
 GEO_menshevik_schism_desc: "Хотя партия меньшевиков правила нашей страной с момента нашей декларации независимости и правит до сих пор, в последние годы она все больше раскололась на тех, кто уважает либертарианский социализм Советского Союза и хочет присоединиться к нему, и тех, кто желает, чтобы Грузия оставалась независимой. Это повлияло на способность партии управлять." # While the Menshevik party ruled in our country from our declaration of independence and are still ruling now, in recent years it has become increasingly split between those who look up to the Libertarian Socialism of the Soviet Union and want to join them, and those who wish for Georgia to remain independent. This has affected the party's ability to rule.
 GEO_separatism: "Сепаратизм" # Separatism
 GEO_separatism_desc: "В последнее время в регионах нашей страны наблюдается всплеск сепаратистской активности. Если мы не решим эту проблему быстро, мы столкнемся с нестабильностью и восстаниями." # Recently there has been a surge in separatist activity in our country's provinces. If we don't deal with this quickly we will face instability and revolts.
 GEO_good_trade_relations: "Хорошие торговые отношения" # Good Trade Relations
 GEO_good_trade_relations_desc: "Мы расширили наши отношения с зарубежными странами, чтобы нам было легче торговать." # We increased our relations with countries abroad so that we can trade more easily.
 GEO_lemons_tea_wheat_idea: "Лимоны и чай для торговли пшеницей" # Lemons and Tea for Wheat Trade
 GEO_lemons_tea_wheat_idea_desc: "Наши земли не подходят для производства пшеницы и других основных источников продовольствия, но они отлично подходят для производства продуктов питания, пригодных для экспорта. Мы воспользовались этим и обменяли наши экспортируемые продукты на пшеницу и другие предметы первой необходимости." # Our lands are not good for producing wheat and other essential food sources, but they are great for producing exportable foods. We took advantage of this and traded our exportable foods for wheat and other essentials.
 GEO_tourism: "Туризм" # Tourism
 GEO_tourism_desc: "Мы провели ребрендинг нашей страны как мирного туристического направления. С каждым годом сюда приезжает все больше и больше иностранцев, и благодаря этому мы получаем много иностранной валюты." # We have rebranded our country as a peaceful tourist destination. More and more foreigners are visiting every year, and we're getting a lot of foreign currency because of it.
 GEO_voluntary_farm_collectivisation: "Добровольная коллективизация" # Voluntary Collectivisation
 GEO_voluntary_farm_collectivisation_desc: "Желающие могут коллективизировать свои хозяйства, повысить эффективность и получить помощь от нас. Однако мы никому не будем навязывать подобное." # Those who wish it can collectivise their farms, to increase effeciency and receive help from us. However, we will not force such a thing upon anyone.
 GEO_forced_farm_collectivisation: "Принудительная коллективизация" # Forced Collectivisation
 GEO_forced_farm_collectivisation_desc: "Некоторые реакционные фермеры достаточно долго эксплуатировали своих собратьев. Мы заставим их коллективизировать свои фермы, чтобы все были равны, нравится им это или нет!" # Some reactionary farmers have exploited their bretheren for long enough. We will force them to collectivise their farms so everyone will be equal, whether they like it or not!
 GEO_wheat_farming: "Выращивание пшеницы" # Wheat Farming
 GEO_wheat_farming_desc: "Поощряя выращивание пшеницы, мы можем быть более самодостаточными и направить капитал на другие цели." # By encouraging wheat farming, we can be more self sufficient, and dedicate the capital to other things.
 GEO_expanded_junker_school: "Расширенная юнкерская школа" # Expanded Junker School
 GEO_expanded_junker_school_desc: "Грузинское юнкерское училище — военная академия, основанная в 1919 году, которую первым возглавил генерал Георгий Квинитадзе. Он обучил многих офицеров, которые сейчас служат в нашей армии, и оказался очень эффективным учреждением. Недавно он был расширен, чтобы вместить больше офицеров." # The Georgian Junker School is a military academy founded in 1919, and it was first headed by General Giorgi Kvinitadze. It had taught many officers which are now serving in our army and has proved to be a very effective institution. Recently it has been expanded to accommodate more officers.
