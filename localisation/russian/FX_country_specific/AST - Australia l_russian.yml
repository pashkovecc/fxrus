 AST_guard_the_empire: "Берегите Империю" # Guard the Empire
 AST_guard_the_empire_desc: "Австралия сталкивается со многими серьезными опасностями: иностранные державы, которые хотят, чтобы мы потерпели поражение, коммунисты, которые лгут нашим работникам и хотят, чтобы наша страна погрузилась в хаос. Мы не откажемся от наших традиций и нашей истории ради яркой революции. Порядок необходимо поддерживать ради всех австралийцев, и мы увидим, как наша нация сияет, как никогда раньше!" # Australia faces many grave dangers - foreign powers that would see us ground down, communists who lie to our workers and would see our nation plunged into chaos. We will not abandon our traditions and our history for the sake of flashy revolution. Order must be maintained for the sake of all Australians, and we will see our nation shine like never before!
