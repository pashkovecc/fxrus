 ### Parties
 AST_vanguardist_party: "Социалистический Национал" # Socialist National
 AST_vanguardist_party_long: "Социалистическая национальная партия Австралии §gСоциалистическая национальная партия Австралии была основана в 1935 году социалистами, недовольными ленинской политикой Коммунистической партии. Возглавляемая Лэнсом Шарки партия «Социалистические националисты» стремится создать национал-социалистический или социалистически-патриотический австралийский штат, видя в этом единственный способ создать истинное социалистическое общество в Австралии.§!" # Socialist National Party of Australia                        §gThe Socialist National Party of Australia was founded in 1935 by socialists dissatisfied by the leninist policies of the Communist Party. Led by Lance Sharkey, the Socialist Nationals seeks to create a National Socialist or Socialist Patriotic Australian state, seeing it as the only way to create a true socialist society in Australia.§!
 AST_collectivist_party: "коммунист" # Communist
 AST_collectivist_party_long: "Коммунистическая партия Австралии §gКоммунистическая партия Австралии была основана в 1920 году социалистами, вдохновленными сообщениями о русской революции. Партия стремится к созданию ленинского социалистического государства в Австралии, а также к расширению прав и возможностей профсоюзов и созданию Советов в Австралии. Партия также является самой просоветской партией в стране.§!" # Communist Party of Australia                                 §gThe Communist Party of Australia was founded in 1920 by socialists inspired by the reports of the Russian Revolution. The party seeks a leninist socialist state in Australia, along with the empowering of labour unions and the establishment of Soviets in Australia. The party is also the most pro-Soviet party in the country.§!
 AST_libertarian_socialist_party: "Труд (слева)" # Labor (Left)
 AST_libertarian_socialist_party_long: "Австралийская лейбористская партия §gАвстралийская лейбористская партия — главная левоцентристская политическая партия в Австралии, а также старейшая сохранившаяся политическая партия в стране и единственная из них, принявшая участие в федеральных выборах 1901 года. Лейбористская партия является самым решительным сторонником демократического социализма в Австралии и стремится создать более эгалитарное общество. Левое крыло партии поддерживает социализацию экономики, усиление профсоюзов и более социалистическую политику в Австралии.§!" # Australian Labor Party                                          §gThe Australian Labor Party is the main centre-left political party in Australia, along with being the oldest surviving political party in the country, the only of them that has partaken in the 1901 Federal Elections. Labor is the strongest proponent of democratic socialism in Australia and seek to create a more egalitarian society. The party's left-wing supports socialization of the economy, stronger labour unions and more socialist policies in Australia.§!
 AST_alt_lib_soc_party: "Социалистический Труд" # Socialist Labor
 AST_alt_lib_soc_party_long: "Социалистическая рабочая партия §gСоциалистическая рабочая партия оставалась второстепенной партией с момента ее основания в 1901 году, но в последнее время приобрела известность. Партия, объединяющая синдикалистов, радикальных социалистов и бывших членов лейбористской партии, обязана пригласить в страну «Промышленных рабочих мира». Благодаря их социалистической политике многие видят в них ценную альтернативу как лейбористам, так и коммунистам.§!" # Socialist Labor Party                                              §gThe Socialist Labor Party has remained a minor party since it's founding in 1901, but has recently risen to prominence. A party uniting syndicalists, radical socialists and former Labor members, SLP is credited to the introduction of the Industrial Workers of the World to the country. With their socialist policies, many sees them as a valuable alternative to both Labor and the Communists.§!
 AST_social_democrat_party: "Труд" # Labor
 AST_social_democrat_party_long: "Австралийская лейбористская партия §gАвстралийская лейбористская партия — главная левоцентристская политическая партия в Австралии, а также старейшая сохранившаяся политическая партия в стране и единственная из них, принявшая участие в федеральных выборах 1901 года. Лейбористская партия является самым ярым сторонником демократического социализма в Австралии и стремится создать более эгалитарное общество.§!" # Australian Labor Party                                           §gThe Australian Labor Party is the main centre-left political party in Australia, along with being the oldest surviving political party in the country, the only of them that has partaken in the 1901 Federal Elections. Labor is the strongest proponent of democratic socialism in Australia and seek to create a more egalitarian society.§!
 AST_social_liberal_party: "Лейбористская партия (антисоциалистическая)" # Labor (Anti-Socialist)
 AST_social_liberal_party_long: "Австралийская лейбористская партия (антисоциалистическое крыло) §gАвстралийская лейбористская партия — главная левоцентристская политическая партия в Австралии, а также старейшая сохранившаяся политическая партия в стране и единственная из них, принявшая участие в федеральных выборах 1901 года. Лейбористская партия является самым решительным сторонником демократического социализма в Австралии и стремится создать более эгалитарное общество. Антисоциалистическое крыло партии стремится увести Лейбористскую партию от радикального социализма. Особенно от КПРФ.§!" # Australian Labor Party (Anti-Socialist Wing)            §gThe Australian Labor Party is the main centre-left political party in Australia, along with being the oldest surviving political party in the country, the only of them that has partaken in the 1901 Federal Elections. Labor is the strongest proponent of democratic socialism in Australia and seek to create a more egalitarian society. The party's anti-socialist wing seek to steer Labor away from radical socialism. Especially from the Communist Party.§!
 AST_soc_lib_alt_party: "Ланг Лейборист" # Lang Labor
 AST_soc_lib_alt_party_long: "Австралийская Лейбористская партия (несоциалистическая) §gАвстралийская Лейбористская партия (несоциалистическая) — отколовшаяся от первоначальной Лейбористской партии партия, возглавляемая премьер-министром Нового Южного Уэльса Джеком Лэнгом. Хотя Ланга считают противником консервативной экономики, он и его сторонники также являются весьма антисоциалистическими. Получив дальнейшую поддержку со стороны более социально консервативных крыльев Лейбористской партии, новая партия стремится ограничить влияние Коммунистической партии и других социалистических организаций в Австралии.§!" # Australian Labor Party (Non-Socialist)                     §gThe Australian Labor Party (Non-Socialist) is a breakaway party of the original Labor Party, led by the New South Wales premier Jack Lang. While Lang has been seen as an opponent of conservative economics, he and his supporters are also quite anti-socialist. Gaining further support from the more socially conservative wings of Labor, the new party seeks to limit the influence of the Communist Party and other socialist organizations in Australia.§!
 AST_market_liberal_party: "националист" # Nationalist
 AST_market_liberal_party_long: "Националистическая партия §gНационалистическая партия была основана в 1917 году в результате слияния Либеральной партии Содружества, старой правоцентристской политической партии в Австралии, и Национальной лейбористской партии, отколовшейся фракции лейбористов. Имея в своих рядах бывших членов Лейбористской партии, партия довольно консервативна в экономических вопросах. Однако в последние годы партия постепенно сдавала позиции как Лейбористской, так и Сельской партии.§!" # Nationalist Party                                                    §gThe Nationalist Party was founded in 1917 by a merger between the Commonwealth Liberal Party, the old centre-right political party in Australia, and the National Labor Party, a breakaway faction of Labor. While having former Labor members in it's ranks, the party are quite conservative on economical issues. In recent years, however, the party has steadly lost ground to both Labor and the Country Party.§!
 AST_mar_lib_alt_party: "Объединенная Австралия" # United Australia
 AST_mar_lib_alt_party_long: "Партия «Единая Австралия» §gПартия «Единая Австралия» была основана в результате союза Националистической партии и бывших членов Лейбористской партии, одним из основных основателей которой стал Джозеф Лайонс, бывший министр труда и железных дорог при кабинете Скаллина. Партия стремится проводить более консервативную экономическую политику и в целом объединить австралийский народ в трудные времена, желая вернуть стабильность в Австралию.§!" # United Australia Party                                           §gThe United Australia Party was founded through a union of the Nationalist Party and former Labor members, with Joseph Lyons, former minister of Works and Railways under the Scullin cabinet, as one of its core founders. The party seeks a more conservative economic policy and to generally unite the Australian people in times of hardship, wanting to bring stability back to Australia.§!
 AST_social_conservative_party: "Страна" # Country
 AST_social_conservative_party_long: "Австралийская деревенская партия §gАвстралийская деревенская партия была официально основана в 1913 году в Западной Австралии, а на федеральном уровне - в 1920 году из ряда аграрных партий Австралии. Кантри рассматривается как партия между лейбористами и националистами с их социально консервативными и экономически интервенционистскими взглядами. Даже в этом случае «Кантри» в основном рассматривается как правоцентристская партия, которая ранее объединяла правительства с националистами.§!" # Australian Country Party                                        §gThe Australian Country Party was formally founded in 1913 in Western Australia, federally in 1920, from a number of state-based agrarian parties in Australia. Country is seen as a party between Labor and the Nationalists, with their socially conservative and economically interventionist views. Even then, Country is mostly seen as a centre-right party, having joined governments with the Nationalists on previous occations.§!
 AST_soc_con_alt_party: "Объединенная Австралия" # United Australia
 AST_soc_con_alt_party_long: "Партия «Единая Австралия» §gПартия «Единая Австралия» была основана в результате союза Националистической партии и бывших членов Лейбористской партии, одним из основных основателей которой стал Джозеф Лайонс, бывший министр труда и железных дорог при кабинете Скаллина. Партия стремится проводить более консервативную экономическую политику и в целом объединить австралийский народ в трудные времена, желая вернуть стабильность в Австралию.§!" # United Australia Party                                          §gThe United Australia Party was founded through a union of the Nationalist Party and former Labor members, with Joseph Lyons, former minister of Works and Railways under the Scullin cabinet, as one of its core founders. The party seeks a more conservative economic policy and to generally unite the Australian people in times of hardship, wanting to bring stability back to Australia.§!
 AST_authoritarian_democrat_party: "Социальный кредит" # Social Credit
 AST_authoritarian_democrat_party_long: "Движение социального кредита §gДвижение социального кредита — это свободное движение людей, подписавшихся под теорией денежной реформы социального кредита Ч. Х. Дугласа. Хотя движение не имело такого влияния в Австралии, как в Канаде, оно все же приобрело последователей. Помимо экономических вопросов, движение считается консервативным, и иногда оно становится местом назначения консервативных бывших членов Лейбористской партии или националистов.§!" # Social Credit Movement                                        §gThe Social Credit Movement is a loose movement of people subscribed to C. H. Douglas' Social Credit theory of monetary reform. While the movement has not been as influential in Australia as it has been in Canada, it has still gained a following. Beside economic matters, the movement are considered conservative, with it sometimes being the destination for conservative former members of Labor or the Nationalists.§!
 AST_aut_dem_alt_party: "Объединенная Австралия" # United Australia
 AST_aut_dem_alt_party_long: "Партия «Единая Австралия» §gПартия «Единая Австралия» была основана в результате союза Националистической партии и бывших членов Лейбористской партии, одним из основных основателей которой стал Джозеф Лайонс, бывший министр труда и железных дорог при кабинете Скаллина. Партия стремится проводить более консервативную экономическую политику и в целом объединить австралийский народ в трудные времена, желая вернуть стабильность в Австралию.§!" # United Australia Party                                          §gThe United Australia Party was founded through a union of the Nationalist Party and former Labor members, with Joseph Lyons, former minister of Works and Railways under the Scullin cabinet, as one of its core founders. The party seeks a more conservative economic policy and to generally unite the Australian people in times of hardship, wanting to bring stability back to Australia.§!
 AST_paternal_autocrat_party: "Центр" # Centre
 AST_paternal_autocrat_party_long: "Центристская партия §gЦентристская партия, основанная в 1933 году, является политическим отделением националистической, монархической Новой гвардии, военизированной организации, возникшей в районе Большого Сиднея. Партия стремится избавить Австралию от социализма, являясь сильной оппозицией лейбористам как в Новом Южном Уэльсе, так и в других местах. В отличие от АФМ, Центр решительно выступает за Британскую империю и монархию, сочетая это с австралийским национализмом.§!" # Centre Party                                                          §gThe Centre Party, founded in 1933, is the political branch of the nationalist, monarchist New Guard, a paramilitary organization emerging from the Greater Sydney area. The party seeks to rid Australia for socialism, being a strong opposition to Labor in both New South Wales and elsewhere. Unlike the AFM, Centre are strongly in favour of the British Empire and the monarchy, combining it with Australian nationalism.§!
 AST_national_populist_party: "АСМ" # AFM
 AST_national_populist_party_long: "Первое движение Австралии §g Первое движение Австралии — одно из самых молодых движений в Австралии, возникшее на базе Рационалистической ассоциации Нового Южного Уэльса и Социалистической партии Виктории. Кажется, что это движение объединяет самые разные группы людей под лозунгом «Австралия прежде всего», черпая вдохновение из валькистских и национал-синдикалистских движений. Несмотря на ксенофобию, это движение также рассматривается как противник войны и голос изоляционизма.§!" # Australia First Movement                                       §gThe Australia First Movement is one of the youngest movements in Australia, growing out of the Rationalist Association of New South Wales and the Victorian Socialist Party. The movement seems to unite a diverse group of people to the message of Australia First, with inspirations taken from valkist and national syndicalist movements. While xenophobic, the movement are also seen as an opponent to war and a voice for isolationism.§!
 AST_valkist_party: "АФМ (Одинист)" # AFM (Odinist)
 AST_valkist_party_long: "Первое движение Австралии (крыло одинистов)"  # Australia First Movement (Odinist Wing)

 AST_ano_party: "СНОВА" # ANO
 AST_ano_party_long: "Национальная организация аборигенов" # Aboriginal National Organisation

### Ideas
 AST_auralia_movement_idea: "Движение Ауралия" # The Auralia Movement
 AST_auralia_movement_idea_desc: "Вопрос отделения Западной Австралии разделился на два лагеря. Хотя значительное большинство сепаратистов являются умеренными и стремятся восстановить независимость государства от Австралии, внутри Империи все еще есть многие, стремящиеся к полному разрыву с Империей. Это движение, движение Ауралия, также претендует на то, чтобы быть умеренным, но все больше и больше поддерживает силы, противостоящие мощи Империи в Австралии." # The issue of West Australian secession has developed into two camps. While a fair majority of secessionists are moderates who seek to restore the state as independent from Australia, but within the Empire, there are still many seeking a total break from the Empire. This movement, the Auralia movement, claims to be moderate as well, but are more and more aligned to forces opposed to the Empire’s might in Australia.
 AST_strong_auralia_movement_idea: "Движение Ауралия" # The Auralia Movement
 AST_strong_auralia_movement_idea_desc: "Вопрос отделения Западной Австралии разделился на два лагеря. Хотя значительное большинство сепаратистов являются умеренными и стремятся восстановить независимость государства от Австралии, внутри Империи все еще есть многие, стремящиеся к полному разрыву с Империей. Это движение, движение Ауралия, также претендует на то, чтобы быть умеренным, но все больше и больше поддерживает силы, противостоящие мощи Империи в Австралии." # The issue of West Australian secession has developed into two camps. While a fair majority of secessionists are moderates who seek to restore the state as independent from Australia, but within the Empire, there are still many seeking a total break from the Empire. This movement, the Auralia movement, claims to be moderate as well, but are more and more aligned to forces opposed to the Empire’s might in Australia.
 AST_internal_divisions_idea: "Внутренние подразделения" # Internal Divisions
 AST_internal_divisions_idea_desc: "Австралийское Содружество кажется более разделенным, чем когда-либо. Оба призыва к отделению в Западной Австралии, а также регионализм утвердились во многих австралийских штатах. Хотя большинство штатов хотят остаться в Содружестве, многие стремятся укрепить свои собственные штаты и поставить интересы местных и региональных партийных отделений выше федеральной партии." # The Commonwealth of Australia seems to be more divided than ever. With both calls for secession in Western Australia, along with regionalism taking hold in many Australian states. While most states want to remain in the Commonwealth, many seek to strengthen their own states and push the interest of local and regional party branches over the federal party.
 AST_more_internal_divisions_idea: "Внутренние подразделения" # Internal Divisions
 AST_more_internal_divisions_idea_desc: "Австралийское Содружество кажется более разделенным, чем когда-либо. Оба призыва к отделению в Западной Австралии, а также регионализм утвердились во многих австралийских штатах. Хотя большинство штатов хотят остаться в Содружестве, многие стремятся укрепить свои собственные штаты и поставить интересы местных и региональных партийных отделений выше федеральной партии." # The Commonwealth of Australia seems to be more divided than ever. With both calls for secession in Western Australia, along with regionalism taking hold in many Australian states. While most states want to remain in the Commonwealth, many seek to strengthen their own states and push the interest of local and regional party branches over the federal party.
 AST_memories_of_galipoli_idea: "Воспоминания о Галлиполи" # Memories of Galipoli
 AST_memories_of_galipoli_idea_desc: "Великая война стала свидетелем того, как сыны Австралии отдали все силы Британской империи и нашим союзникам. Эти воспоминания и истории, вспоминаемые каждый год в День Анзака, стали источником гордости австралийцев. Но это также служит напоминанием о потерянных жизнях, снижая вероятность вступления страны в еще одну кровавую внешнюю войну." # The Great War saw the sons of Australia give all in for the British Empire and our allies. Remembered each year through Anzac Day, these memories and stories have been a source for Australian pride. But it also acts as a reminder of the lives lost, making the country less likely to enter another bloody foreign war.
 AST_memories_of_galipoli_idea_1: "Воспоминания о Галлиполи" # Memories of Galipoli
 AST_memories_of_galipoli_idea_1_desc: "Великая война стала свидетелем того, как сыны Австралии отдали все силы Британской империи и нашим союзникам. Эти воспоминания и истории, вспоминаемые каждый год в День Анзака, стали источником гордости австралийцев. Но это также служит напоминанием о потерянных жизнях, снижая вероятность вступления страны в еще одну кровавую внешнюю войну." # The Great War saw the sons of Australia give all in for the British Empire and our allies. Remembered each year through Anzac Day, these memories and stories have been a source for Australian pride. But it also acts as a reminder of the lives lost, making the country less likely to enter another bloody foreign war.

 AST_effect_london_crash_idea: "Лондонские шрамы после аварии" # London Crash Scars
 AST_effect_london_crash_idea_desc: "Крах лондонского фондового рынка достиг берегов Австралии. Как доминион Британской империи, мы особенно пострадали от волн этой катастрофы." # The London Stock Market Crash has hit the shores of Australia. As a dominion of the British Empire, we have been especially hit by the waves of this disaster.

 AST_federal_lang_plan_idea: "Федеральное восстановление языка" # Federal Lang Recovery
 AST_federal_lang_plan_idea_desc: "Крах лондонского фондового рынка достиг берегов Австралии. Как доминион Британской империи, мы особенно пострадали от волн этой катастрофы. Австралия взяла на себя обязательства по Федеральному плану Ланга, плану, ориентированному на экономическое вмешательство и увеличение расходов на восстановление экономики." # The London Stock Market Crash has hit the shores of Australia. As a dominion of the British Empire, we have been especially hit by the waves of this disaster. Australia has commited itself to the Federal Lang Plan, a plan focused on economic intervention and more spending to recover the economy.
