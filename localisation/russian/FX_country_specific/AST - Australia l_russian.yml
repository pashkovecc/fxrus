## Radicals

 AST_workers_australia_unite: "Рабочие Австралии объединяйтесь" # Workers of Australia Unite
 AST_workers_australia_unite_desc: "Нам пришлось вырвать победу из рук капиталистов, и австралийцы больше не будут рисковать своей жизнью, чтобы сделать эту страну раем для нескольких сотен или нескольких тысяч жадных, эгоистичных семей миллионеров! Теперь революция пришла в Австралию, и мы не упустим свой шанс!" # We have had to wrest victory from the hands of the capitalists, no longer will Australians be expected to risk their lives to make this country a paradise for a few hundred, or a few thousand greedy, selfish millionaire families! Now the revolution has come to Australia and we will not let our chance go to waste!
 AST_workers_australia_unite_tt: "§GЭтот фокус будет автоматически пропущен, как только в Австралии произойдет Социалистическая революция.§!" # §GThis focus will be automatically be bypassed once a Socialist Revolution has taken place in Australia.§!
 AST_strike_against_capitalist: "Удар против капиталиста" # Strike Against the Capitalist
 AST_strike_against_capitalist_desc: ""
 AST_soviet_system: "Советская система" # The Soviet System
 AST_soviet_system_desc: ""
 AST_empower_workers_and_farmers: "Расширение прав и возможностей рабочих и фермеров" # Empower the Workers and Farmers
 AST_empower_workers_and_farmers_desc: "Столько десятилетий «промывания мозгов» лишило многих работников страны возможности понять, что на самом деле отвечает их собственным интересам. Мы должны предпринять согласованные усилия, чтобы перевоспитать и склонить их на сторону коммунизма. Рабочие Австралии должны объединиться в единую силу!" # So many decades of brainwashing have left many of the nation's workers unable to tell what truly lies in their own interests. We must make a concerted effort to re-educate and win them over to the communist cause. The workers of Australia must be united as a single force!
