l_russian:
 AST_FUHRERREICH_DESC: "The Commonwealth of Australia was established on January 1, 1901, uniting six self-governing colonies. It later became a Dominion within the British Empire. The Great War tested Australia's unity, raising doubts about the federal forces. The failure to complete the transcontinental railway heightened tensions between the East and West, leading to calls for secession. By 1936, regionalism and secessionist demands had eroded the country's unity. Established parties faced challenges from state parties and radical groups. While the current Labor government appeared stable, its unity could be superficial in times of adversity."
  
 ### Country Names 
