 AST_labor_survives_flag: "§SЛейбористской партии§! удалось удержаться у власти на выборах 1937 года." # §SThe Labor Party§! has managed to hold on to power in the 1937 Elections
 AST_united_australia_flag: "§BПартии Объединенной Австралии§! удалось обеспечить себе власть на выборах 1937 года." # §BThe United Australia Party§! has managed to secure power in the 1937 Elections
 AST_workers_australia_unite_flag: "В Австралии произошла §rСоциалистическая революция§!." # A §rSocialist Revolution§! has taken place in Australia
 AST_flying_eureka_flag: "§gДвижение «Австралия прежде всего»§! пришло к власти в Австралии" # §gThe Australia First Movement§! has taken power in Australia
 AST_guard_the_empire_flag: "В Австралии произошел §gНовый переворот §!" # A §gNew Guard Coup§! has taken place in Australia

 AST_economy_in_crisis_flag: "Обвал §YЛондонской фондовой биржи§! достиг §YАвстралии§!" #  The §YLondon Stock Market Crash§! has hit §YAustralia§!
 AST_federal_lang_plan_flag: "§SЛейбористское правительство§! приняло §YФедеральный план Ланга§!" # A §SLabor Government§! Has Adopted the §YFederal Lang Plan§!
 AST_balanced_approach_flag: "§YMiddle Road§! Теда Теодора принят на вооружение" # Ted Theodore's §YMiddle Road§! Has Been Adopted
 AST_austerity_measures_flag: "Либо §SLabor§!, либо §cUAP Правительство§! приняло §YПлан Джозефа Лайонса§!" # Either a §SLabor§! or a §cUAP Government§! Has Adopted §YJoseph Lyons' Plan§!
 AST_is_republic: "§Y[AST.GetName]§! имеет республиканское правительство." # §Y[AST.GetName]§! has a Republican Government

 AST_left_labour_congress_flag: "§YЛейбористские социалисты§! победили на Конгрессе ACTU" # §YLabour's Socialists§! has won the ACTU Congress
 AST_communist_congress_flag: "§YКоммунисты§! победили на Конгрессе ACTU" # §YCommunists§! has won the ACTU Congress
 AST_social_national_congress_flag: "§YСоциальные граждане§! выиграли Конгресс ACTU" # §YSocial Nationals§! has won the ACTU Congress

### Focus
 AST_economy_in_crisis: "Экономика в кризисе" # An Economy in Crisis
 AST_economy_in_crisis_desc: "Австралийская экономика последние пять лет страдает от тяжелой депрессии. Мы должны оценить возможности и подготовить нашу отрасль к правильному расширению, если мы хотим иметь хоть какую-то надежду вытащить себя из этой трясины." # The Australian economy has been suffering from a severe depression for the last five years. We must assess where opportunities lie and prepare our industry to be properly expanded if we're to have any hope of pulling ourselves out of this quagmire.
 AST_allieviate_farmers: "Помогите фермерам" # Allieviate the Farmers
 AST_allieviate_farmers_desc: "[Root.GetRulingParty] всегда был партией деревенских жителей. Другие партии заботятся только о рабочих, а о фермерах слишком часто забывают. Мы компенсируем это, предлагая гранты на развитие." # [Root.GetRulingParty] has always been the party of the countryfolk. Other parties concern themselves only with the workers, and the farmers are too often forgotten. We are making this up for them by offering development grants.
 AST_higher_taxes: "Более высокие налоги" # Higher Taxes
 AST_higher_taxes_desc: "С ростом наших инвестиций наш бюджет начал страдать. Введя новые налоги на бизнес, мы сможем получить дополнительные доходы, которые затем сможем использовать для дальнейших инвестиций в нашу экономику. Поскольку наше население велико, а потенциал нашей страны огромен, эти налоги, скорее всего, не отпугнут какой-либо бизнес." # With our increasing investments, our budget has begun to suffer. By implementing new business taxes, we can raise additional revenue that we can then use to further invest in our economy. As our population is large and the potential of our country immense, these taxes will most likely not scare any businesses away.
 AST_federal_lang_plan: "Федеральный план Ланга" # The Federal Lang Plan
 AST_federal_lang_plan_desc: ""
 AST_cease_interest_repayments: "Прекращение выплаты процентов" # Cease Interest Repayments
 AST_cease_interest_repayments_desc: ""
 AST_balanced_approach: "Сбалансированный подход" # A Balanced Approach
 AST_balanced_approach_desc: ""
 AST_free_up_cash: "Освободите наличные" # Free Up Cash
 AST_free_up_cash_desc: ""
 AST_sea_to_sea_federal_work: "Федеральная работа от моря до моря" # Sea to Sea Federal Work
 AST_sea_to_sea_federal_work_desc: ""
 AST_bail_out_industries: "Спасение промышленности" # Bail Out Industries
 AST_bail_out_industries_desc: ""
 AST_goods_standard: "Стандарт товаров" # The Goods Standard
 AST_goods_standard_desc: "Города Австралии уже быстро растут, и мы должны принять политику, которая будет стимулировать миграцию людей из сельских районов в городские. Если наша промышленная база будет расти, ей понадобится готовый источник рабочих, готовых укомплектовать фабрики." # Australia's cities are already growing rapidly - we must enact policies which will encourage the migration of people from the rural areas into urban ones. If our industrial base is to grow, it will need a ready source of workers ready to man the factories.
 AST_stimulated_economy: "Стимулируемая экономика" # A Stimulated Economy
 AST_stimulated_economy_desc: ""
 AST_deflate_prices: "Снижение цен" # Deflate the Prices
 AST_deflate_prices_desc: "Дерегулирование цен позволит обеспечить органичный рост корпоративного сектора, чем мы сможем воспользоваться для ускорения наших собственных усилий, а также позволит нам более прибыльно торговать нашими ресурсами." # Deregulating prices will allow for organic growth of the corporate sector which we can take advantage of to speed up our own endeavours, along with letting us trade our resources more profitably.
 AST_cut_bureaucracy: "Сократите бюрократию" # Cut the Bureaucracy
 AST_cut_bureaucracy_desc: "Основная проблема, стоящая перед нашей экономикой, — это огромные размеры правительственной бюрократии, отягощенной архаичными правилами и ориентированной на колониальную эксплуатацию, а не на эффективность. Нам нужно современное правительство, которое сможет реагировать на проблемы до того, как они перерастут в катастрофу, с которой мы столкнулись сейчас, а не намного позже." # The main problem facing our economy is the sheer magnitude of the governmental bureaucracy, laden down by archaic rules and focused on colonial exploitation rather than efficiency. We need a modern government which can respond to issues before they can turn into the catastrophe which faces us now, not well after.
 AST_austerity_measures: "Меры жесткой экономии" # Austerity Measures
 AST_austerity_measures_desc: "Самая важная вещь, которую нам нужно помнить, имея дело с продолжающимся экономическим кризисом, — это то, что мы не должны допустить, чтобы он увеличился до уже существующего государственного долга. В ближайшие годы казна [Root.GetName] должна быть полной, а не пустой, и есть только один способ добиться этого: резкое сокращение расходов." # The most important thing we need to remember when dealing with the ongoing economic crisis is that we must not let it accrue to already existing national debt. [Root.GetName]'s coffers need to be full, not empty, in the following years, and there is only one way to achieve this: Cutting spending drastically.
 AST_spending_cuts_deal: "Сделка по сокращению расходов" # Spending Cuts Deal
 AST_spending_cuts_deal_desc: ""
 AST_reduction_on_interest: "Снижение процентов" # Reduction on Interest
 AST_reduction_on_interest_desc: ""
 AST_balance_budget: "Сбалансируйте бюджет" # Balance the Budget
 AST_balance_budget_desc: ""
 AST_work_with_opposition: "Работайте с оппозицией" # Work With the Opposition
 AST_work_with_opposition_desc: ""
 AST_australias_middle_road: "Средняя дорога Австралии" # Australia's Middle Road
 AST_australias_middle_road_desc: ""
 AST_close_unprofitable_businesses: "Закрыть убыточный бизнес" # Close Unprofitable Businesses
 AST_close_unprofitable_businesses_desc: "Почти все государственные компании чувствуют себя плохо, страдая от бесхозяйственности и даже коррупции. Вместо того, чтобы пересматривать их практику, возможно, лучше вернуть их в руки частного сектора, где ими смогут управлять настоящие бизнесмены, а не бюрократы." # Almost all of the publicly-owned companies are doing poorly, suffering from mismanagement and even corruption. Rather than revise their practices, perhaps it's best to put them back in the hands of the private sector where they can be run by proper businessmen rather than bureaucrats.
 AST_wage_cuts: "Снижение заработной платы" # Wage Cuts
 AST_wage_cuts_desc: ""
 AST_back_to_normalcy: "Назад к нормальности" # Back to Normalcy
 AST_back_to_normalcy_desc: "Наконец-то мы вырвались из депрессивного состояния. Австралия может идти в будущее, а ее экономика является ярким примером для других." # Finally we have pulled ourselves out of the doldrums of depression. Australia can march into the future, its economy a shining example for others to follow.
 AST_end_austerity: "Конец жесткой экономии" # End Austerity
 AST_end_austerity_desc: ""

 AST_complete_transcontinental_railway: "Завершить Трансконтинентальную железную дорогу" # Complete the Transcontinental Railway
 AST_complete_transcontinental_railway_desc: "Расширение системы железных дорог на востоке не только даст возможность нашему горнодобывающему сектору, но и обеспечит столь необходимую занятость большому числу людей." # Expansion of the railroad system throughout the east will not only give our mining sectors a shot in the arm, but also provide much-needed employment for a great number of people.
 AST_expand_mines: "Расширить шахты" # Expand the Mines
 AST_expand_mines_desc: "Все эти новые автомобильные и железные дороги открыли некоторые части страны для старателей и разработчиков горнодобывающей промышленности. Мы должны поощрять их стимулами." # All these new roads and railroads have opened up parts of the country to prospectors and mining developers. We should encourage them with incentives.
 AST_australian_oil: "Австралийская нефть" # Australian Oil
 AST_australian_oil_desc: ""
 AST_conquer_northern_territories: "Покоряйте северные территории" # Conquer the Northern Territories
 AST_conquer_northern_territories_desc: ""
 AST_agricultural_modernization: "Модернизация сельского хозяйства" # Agricultural Modernization
 AST_agricultural_modernization_desc: ""
 AST_fund_local_universities: "Фонд местных университетов" # Fund Local Universities
 AST_fund_local_universities_desc: "Важно помнить, что научные занятия необходимы для сохранения наших позиций. Щедрое увеличение финансирования Национального университета в Канберре позволит нам обучать массы и стать маяком новых исследований." # It is important to remember that scholarly pursuits are needed to maintain our position. Generous funding increases to the National University in Canberra will allow us to educate the masses and become a beacon of new research.
 AST_invest_in_industry: "Инвестируйте в промышленность" # Invest in Industry
 AST_invest_in_industry_desc: ""
 AST_newcastle_industrial_center: "Промышленный центр Ньюкасла" # Newcastle Industrial Center
 AST_newcastle_industrial_center_desc: ""
 AST_australian_arms_industry: "Австралийская оружейная промышленность" # The Australian Arms Industry
 AST_australian_arms_industry_desc: "Орудия наших солдат и самолеты наших пилотов мало что сделают без пуль и бомб. Мы должны начать поощрять рост настоящей военной промышленности в Австралии." # Our soldiers' guns and our pilots' planes won't do very much without bullets and bombs. We must start encouraging the growth of a real munitions industry in Australia.

 AST_australian_army: "Австралийская армия" # Australian Army
 AST_australian_army_desc: "Наши сухопутные войска должны стать новым приоритетом, продвигая тех генералов, которые могут принести наибольшую пользу, и реформируя их методы ради нации." # Our ground forces must be a new priority, promoting those generals who can bring the greatest benefit and reforming their methods for the sake of the nation.
 AST_end_military_austerity: "Покончить с военной экономией" # End the Military Austerity
 AST_end_military_austerity_desc: "Мы должны работать вместе как нация, и политики всех идеологических спектров должны объединиться, если мы хотим увидеть победу в ближайшие дни!" # We must work together as a nation, indeed politicians from across all ideological spectrums must pull together if we are to see victory in the days to come!
 AST_citizen_forces_reforms: "Реформы гражданских сил" # Citizen Forces Reforms
 AST_citizen_forces_reforms_desc: "Законы о воинской повинности приняты, но их недостаточно. Во имя нашей обороны мы должны позаботиться о том, чтобы каждый принял участие в защите короля и страны." # Conscription laws have been enacted, but they are insufficient. In the name of our defence, we must see to it that everyone takes part in defending king and country.
 AST_purely_voluntary_force: "Чисто добровольная сила" # A Purely Voluntary Force
 AST_purely_voluntary_force_desc: "У нас нет промышленных мощностей для создания крупных бронетанковых сил. Вместо этого мы должны сосредоточиться на том, чтобы австралийская армия была небольшой, но хорошо оснащенной и хорошо обученной. Размер не так важен, как качество!" # We do not have the industrial capacity for a large or armoured force. Instead we must focus on keeping Australia's army small yet well-equipped and well-trained. Size is not as important as quality!
 AST_citizen_compulsory_service: "Гражданин обязательная служба" # Citizen Compulsory Service
 AST_citizen_compulsory_service_desc: "Любая попытка проецировать нашу военную мощь за пределы наших границ обречена принести лишь горе. Наше внимание как нации должно быть сосредоточено на собственной защите." # Any attempt to project our military power beyond our borders is doomed to bring little more than grief. Our focus, as a nation, should be on our own defence.
 AST_training_reforms: "Реформы обучения" # Training Reforms
 AST_training_reforms_desc: "Становится все более очевидным, что наши вооруженные силы больше всего нуждаются в небольших и очень специализированных воинских формированиях." # It is becoming increasingly apparent that small and very specialised military units are what our armed forces most desperately need.
 AST_establish_second_aif: "Создание второго АИФ" # Establish the Second AIF
 AST_establish_second_aif_desc: ""
 AST_modernize_equipment: "Модернизация оборудования" # Modernize the Equipment
 AST_modernize_equipment_desc: "Техника нашей пехоты старая, очень старая. Большая часть из них использовалась во время Великой войны, а некоторые комплекты прослужили даже дольше. Мы должны вооружить нашу армию современным снаряжением, иначе в новой войне у нас не будет шансов." # Our infantry's equipment is old, very old. Most of it saw service during the Great War, and some sets have been around even longer than that. We must equip our army with modern gear, or else we will not stand a chance in another war.
 AST_modernize_tactics: "Модернизируйте тактику" # Modernize the Tactics
 AST_modernize_tactics_desc: "Наша армия является ядром нашей обороны, и необходимо принять чрезвычайные меры, чтобы обеспечить им доступ к лучшему оборудованию и лучшему персоналу, который мы можем предоставить. Когда наши враги видят символ АНЗАК, они должны знать, что перед ними одни из лучших солдат, которых может предложить мир." # Our army is the core of our defence, and emergency measures must be passed to ensure they have access to the best equipment and the best personnel that we can possibly provide. When our enemies see the ANZAC symbol, they should know they face among the very best soldiers the world has to offer.
 AST_artillary_war: "Артиллерийская война" # Artillary War
 AST_artillary_war_desc: "Артиллерия Австралии в основном восходит к Великой войне. Мы должны модернизировать нашу артиллерию, если не хотим, чтобы наши солдаты были выпотрошены без надлежащей поддержки." # Australia's artillery mostly dates from the Great War. We must modernise our artillery unless we wish our soldiers to be eviscerated without proper support.
 AST_modernize_cavalry_division: "Модернизация кавалерийской дивизии" # Modernize the Cavalry Division
 AST_modernize_cavalry_division_desc: "Мобильность не означает просто создание танков — это еще и вопрос о мобилизации наших пехотных частей, создании механизированного транспорта, который быстро доставит их на фронт." # Mobility does not mean simply building tanks - there is also the question of mobilising our infantry units, by building mechanised transport which will get them to the front quickly.
 AST_focus_on_mobile_warfare: "Сосредоточьтесь на мобильной войне" # Focus on Mobile Warfare
 AST_focus_on_mobile_warfare_desc: "Качество наших сил не имеет и половины такого значения, как их мобильность. Наступила новая эра, и тактика окружения и охвата гораздо более важна для победы, чем когда-либо прежде. Именно на этом должно быть сосредоточено военное будущее Австралии." # The quality of our forces do not matter half so much as their mobility. This is a new era, and tactics of encirclement and reach are far more vital to victory than ever before. This must be the focus on Austalia's military future.
 AST_marine_training: "Морская подготовка" # Marine Training
 AST_marine_training_desc: "Прежде всего, наши наступательные военно-морские возможности — это наша способность высаживаться на чужих берегах вместе с Королевской австралийской морской пехотой. Это должна быть непревзойденная боевая сила, поддерживаемая самыми современными транспортными судами, которые может предоставить ВМФ." # First and foremost in our offensive naval capabilities is our ability to land on foreign shores with the Royal Australian Marines. This must be a fighting force like no other, supported by the most advanced transport vessels the navy can provide.
 AST_australian_tank_research: "Австралийские исследования танков" # Australian Tank Research
 AST_australian_tank_research_desc: "Танки — грозная машина на поле боя, но их очень сложно построить. Создав базовые стандарты качества, мы сможем ускорить производство бронетехники и снабдить своими танками крупные бронетанковые дивизии, которые обрушатся на противника как кирпич." # Tanks are a fearsome machine on the battlefield, but they are a very complex machine to build. By creating baseline quality standards, we can speed up production of armour and supply our tanks with large armoured divisions that will come down on the enemy like a brick.

 AST_australian_royal_navy: "Австралийский [Root.AST_GetRoyalOrRepublican] ВМС" # Australian [Root.AST_GetRoyalOrRepublican] Navy
 AST_australian_royal_navy_desc: "Во время Великой войны [Root.AST_GetRoyalOrRepublican] австралийский флот представлял собой небольшую группу, состоявшую всего из нескольких небольших кораблей, и планировалось вывести из эксплуатации даже их, как только война закончится. Поскольку Британский Тихоокеанский флот бежал в наши порты, мы оказались в распоряжении флота, который намного превосходит наши возможности должным образом управлять им. Это наша первая и главная проблема." # During the Great War, the [Root.AST_GetRoyalOrRepublican] Australian Navy was a small force that consisted of only a few small ships, and plans were to decommission even these as soon as the war ended. With the British Pacific Fleet having fled to our ports, we found ourselves in possession of a fleet that far outstrips our ability to properly manage them. This is our first and foremost issue.
 AST_modernize_naval_fortification: "Модернизация военно-морских укреплений" # Modernize Naval Fortification
 AST_modernize_naval_fortification_desc: "Прежде всего мы должны помнить о возможности того, что однажды враг может высадить войска на наших берегах. Тот факт, что этого еще не произошло, не означает, что этого никогда не произойдет, и мы должны подготовиться к этому дню, укрепляя наши прибрежные города так сильно, как только можем." # Foremost on our minds should be the possibility that, one day, and enemy might land forces on our shores. Just because it hasn't happened yet doesn't mean it never will, and we must prepare for that day by fortifying our coastal cities as heavily as we can.
 AST_protect_new_guinea: "Защитите Новую Гвинею" # Protect New Guinea
 AST_protect_new_guinea_desc: ""
 AST_safe_australian_seas: "Безопасные австралийские моря" # Safe Australian Seas
 AST_safe_australian_seas_desc: "Мощные линкоры гарантируют, что наше военно-морское превосходство будет постоянным и что мы сможем распространить нашу мощь далеко за пределы наших границ." # Powerful battleships will make sure our naval superiority is permanent, and that we are able to project our power well beyond our borders.
 AST_modernize_destroyer_fleet: "Модернизация флота эсминцев" # Modernize the Destroyer Fleet
 AST_modernize_destroyer_fleet_desc: "Эсминцы эффективны для уничтожения подводных лодок противника. Мы должны обеспечить безопасность наших перевозок, построив как можно больше таких судов." # Destroyers are effective at destroying enemy submarines. We should ensure our shipping is safe by constructing as many of these as possible.
 AST_australian_submarines: "Австралийские подводные лодки" # Australian Submarines
 AST_australian_submarines_desc: "Подводные лодки — отличный способ сорвать конвои противника. Мы должны построить как можно больше." # Submarines are an excellent way to disrupt enemy convoys. We should construct as many as possible.
 AST_cruiser_expansion: "Расширение крейсера" # Cruiser Expansion
 AST_cruiser_expansion_desc: "Наш флот эсминцев и подводных лодок всегда будет составлять основу нашего военно-морского флота, защищая наши торговые пути так же, как они атакуют пути наших врагов." # Our fleet of destroyers and submarines will always form the backbone of our navy, defending our trade routes just as they attack those of our enemies.
 AST_carrier_attempts: "Попытки оператора связи" # Carrier Attempts
 AST_carrier_attempts_desc: ""
 AST_naval_command: "Австралийское военно-морское командование" # Australian Naval Command
 AST_naval_command_desc: ""
 AST_expand_australian_dockyards: "Расширить австралийские верфи" # Expand Australian Dockyards
 AST_expand_australian_dockyards_desc: "Мы, наконец, в состоянии расширить наши возможности судостроения далеко за пределы того места, где они когда-то были." # We are finally in a position to expand our shipbuilding capabilities far beyond where they once were
 AST_fuel_naval_industry: "Подпитка военно-морской промышленности" # Fuel the Naval Industry
 AST_fuel_naval_industry_desc: "Большинство судостроительных предприятий в Австралии сильно устарело. Они должны обновляться и расширяться, готовы расширять наш автопарк." # Most shipbuilding facilities in Australia are sorely out of date. They must be updated and expanded, ready to expand our fleet.
 AST_increase_naval_productions: "Увеличение военно-морского производства" # Increase Naval Productions
 AST_increase_naval_productions_desc: ""
 AST_masters_on_southern_seas: "Мастера на южных морях" # Masters on the Southern Seas
 AST_masters_on_southern_seas_desc: ""

 AST_australian_royal_air_force: "Австралийские [Root.AST_GetRoyalOrRepublican] ВВС" # Australian [Root.AST_GetRoyalOrRepublican] Air Force
 AST_australian_royal_air_force_desc: "По правде говоря, на самом деле не было никаких [Root.AST_GetRoyalOrRepublican] австралийских ВВС, о которых можно было бы говорить, и наших нынешних самолетов едва достаточно, чтобы охранять наше собственное небо, не говоря уже о проецировании превосходства в воздухе в других местах. Учитывая, что войны будущего будут вестись в воздухе, правительство твердо намерено вскоре изменить ситуацию." # In truth, there has really been no [Root.AST_GetRoyalOrRepublican] Australian Air Force to speak of, and our current planes are barely sufficient in number to guard our own skies never mind project air superiority elsewhere. Considering that the wars of the future will be fought in the air, the government is determined that this must soon change.
 AST_subsidize_de_havilland: "Субсидировать de Havilland Australia" # Subsidize de Havilland Australia
 AST_subsidize_de_havilland_desc: "Создание наших военно-воздушных сил потребует расширения и организации наших заводов исключительно для этой цели." # Building our air force will require expanding and organising our factories for this sole purpose.
 AST_flying_training_school: "Школа летной подготовки" # Flying Training School
 AST_flying_training_school_desc: "Первым шагом в восстановлении наших ВВС является создание воздушной академии, которая сможет подготовить наших будущих летчиков к предстоящим боям." # The first step in rebuilding our air force is the creation of an air academy, one which can train our future airmen for the battles to come.
 AST_purchase_foreign_planes: "Покупка иностранных самолетов" # Purchase Foreign Planes
 AST_purchase_foreign_planes_desc: ""
 AST_close_air_support_effort: "Непосредственная авиационная поддержка" # Close Air Support Effort
 AST_close_air_support_effort_desc: "Непосредственная поддержка с воздуха позволяет нам обстреливать вражеские подразделения во время сражений с пугающей точностью, что дает нам большое преимущество над противниками." # Close air support allows us to strafe enemy units during battles with frightening accuracy, giving us a large edge on our opponents.
 AST_fighter_focus: "Истребитель Фокус" # Fighter Focus
 AST_fighter_focus_desc: "В рамках нашей кампании по господству в небе мы должны инвестировать ресурсы в наших истребителей." # As part of our campaign to rule the skies, we should invest resources in our fighters
 AST_defensive_air_tactics: "Оборонительная воздушная тактика" # Defensive Air Tactics
 AST_defensive_air_tactics_desc: "Наше внимание должно быть сосредоточено не только на подъёме в небо, но и на усилении нашей защиты от тех, кто поднимется в небо против нас." # Our focus should not only be on taking to the skies, but on increasing our defence against those who would take to the skies against us.
 AST_offensive_air_tactics: "Наступательная воздушная тактика" # Offensive Air Tactics
 AST_offensive_air_tactics_desc: "Наше основное внимание уделяется нашим военно-воздушным силам — Доминион должен осознать, в чем заключается его сила, и максимизировать свою эффективность." # Our primary focus is on our air force - the Dominion must recognise where its strength lies and maximise its effectiveness.
 AST_control_skies: "Управляйте небом" # Control the Skies
 AST_control_skies_desc: ""
 AST_naval_air_squadrons: "Эскадрильи морской авиации" # Naval Air Squadrons
 AST_naval_air_squadrons_desc: "Морские бомбардировщики позволяют нам уничтожать флот противника, не рискуя собственными кораблями. Нам следует построить как можно больше таких кораблей, если наш флот мал или занят в других местах." # Naval Bombers allow us to destroy enemy navies without risking our own ships. We should build as many of these as possible if our navy is small or busy elsewhere
 AST_upgrade_air_defences: "Модернизация ПВО" # Upgrade Air Defences
 AST_upgrade_air_defences_desc: "Поскольку наши города расположены в основном на восточном и западном побережьях острова, северная граница Австралии не имеет должной защиты или подготовки на случай вторжения или нападения. Новые военные структуры в этом районе будут приветствоваться." # With our cities mostly on the east and west coasts of the island, Australia's northern frontier lacks the proper defence or preparation in case of invasion or attack. New military structures in that area will be welcome.
 AST_jet_developments: "Реактивные разработки" # Jet Developments
 AST_jet_developments_desc: ""

