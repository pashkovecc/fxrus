 AST_down_with_king: "Долой короля" # Down With the King
 AST_down_with_king_desc: "В Австралии до сих пор сильны воспоминания о Галлиполи, и крики «никогда больше!» недостаточно. Мы должны разорвать связи с британцами не только с точки зрения нашего правительства, но также с нашей экономикой и нашими военными союзами. Наша нация должна выстоять самостоятельно, и с этого дня мы никогда больше не будем посылать наших отцов на бойню в войне европейского империализма." # Memories of Gallipoli still run strong in Australia, and cries of 'never again!' are not enough. We must cut ties with the British not only in terms of our government, but also with our economy and our military alliances. Our nation must stand on its own, and from this day forth we will never again send our sires to the slaughter in a war of European Imperialism.
 AST_down_with_king_tt: "§CОфис генерал-губернатора§! будет §Rупразднен§! вместе с нашими связями с @ENG §Y[ENG.GetNameDef]§!\n\n" # The §COffice of the Governor-General§! will be §Rabolished§! along with our ties with @ENG §Y[ENG.GetNameDef]§!\n\n
 AST_purge_monarchist_parties: "Чистка монархических партий" # Purge Monarchist Parties
 AST_purge_monarchist_parties_desc: ""

 AST_flying_eureka: "Полет на «Эврике»" # Flying the Eureka
 AST_flying_eureka_desc: "Народ высказался, и теперь Австралии пора отвернуться от истории колониального надзора и жестокости. Мы больше не будем вести войны в далеких странах, которые проливают австралийскую кровь без всякой доброй цели. Наша судьба принадлежит нам, и мы не упустим эту возможность!" # The people have spoken, and now it is time for Australia to turn its back on a history of colonial oversight and cruelty. No longer will we fight wars in distant lands that shed Australian blood to no good purpose. Our destiny is our own, and we will not waste this opportunity!
 AST_flying_eureka_tt: "§GЭтот фокус будет автоматически проигнорирован, как только Движение «Австралия прежде всего» придет к власти.§!" # §GThis focus will be automatically be bypassed once the Australia First Movement has taken power.§!
