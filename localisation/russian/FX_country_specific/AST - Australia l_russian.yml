### Events
 australia.0.t: "Великая Южная Земля" # The Great Southern Land
 australia.0.d: "1 января 1901 года было создано Австралийское Содружество, в котором шесть самоуправляющихся колоний Квинсленд, Новый Южный Уэльс, Виктория, Тасмания, Южная Австралия и Западная Австралия объединились в одно Содружество. Вскоре после этого новая нация получила статус Доминиона в составе Британской империи.\n\nС началом Великой войны единство Австралии подверглось серьезному испытанию. Война рассматривалась как испытание для федеральных сил, чтобы доказать, что они будут лучше, чем вооруженные силы штатов. После смерти многих австралийских сыновей начали назревать сомнения относительно федеральных сил. Еще одним ударом по единству Австралии станет неспособность завершить строительство трансконтинентальной железной дороги, что усилит напряженность между Востоком и Западом. Когда экономика Западной Австралии рухнула в 1920-е годы, призывы к отделению в западном штате усилились.\n\nС началом 1936 года единство, некогда существовавшее в Австралии, похоже, сменилось регионализмом и призывами Запада к отделению. В то время как традиционные политические игроки; Лейбористы, Кантри и Националисты остаются сильными игроками в австралийской политике. Эти партии все больше страдают от регионализма со стороны государственных партий, а также от роста радикальных групп, таких как коммунисты и АФМ.\n\nНынешнее правительство, управляемое лейбористами, продолжает оставаться стабильным, но эта стабильность и единство могут оказаться всего лишь фасадом перед лицом настоящих невзгод и кризиса." # The Commonwealth of Australia was established on January 1. 1901, with the six self-governing colonies of Queensland, New South Wales, Victoria, Tasmania, South Australia, and Western Australia united into one Commonwealth. Not long after, the new nation would recieve the status of Dominion within the British Empire.\n\nWith the onset of the Great War, the unity of Australia would be seriously tested. The war was seen as a test for the federal forces to prove that they would be better than state-based militaries. With the death of many Australian sons, doubts regarding the federal forces began to brew. Another blow to the unity of Australia would be the failure to complete the transcontinental railway, increasing the tensions between the East and the West. When the economy of Western Australia collapsed during the 1920s, calls for secession would grow in the western state.\n\nWith the start of 1936, the unity once present in Australia seems to be replaced by regionalism and the western call for secession. While the traditional political players; Labor, Country and the Nationalists, have remained strong players in Australian politics, these parties are more and more plauged by regionalism from state parties, along with the growth of radical groups like the Communists and the AFM.\n\nThe current Labor-run government have continued to be stable, but this stability and unity might just prove to be a facade in the face of true adversity and crisis.
 australia.0.a: "Вперед, Австралия!" # Advance Australia!

 australia.1.t: "Король умер.." # The King is Dead..
 australia.1.d: "Новости из Англии достигли берегов Австралии. Король Австралии Георг V ушел из этого мира. Во всем мире, в том числе здесь, в Австралии, смерть короля была встречена трауром.\n\nХотя для некоторых эта новость печальна. Другие воспринимают известие о смерти короля иначе. Наряду с оплакивающими эту потерю австралийцами многие восприняли эту новость как возможность протестовать против монархии. Особенно в Западной Австралии назревало некоторое недовольство людей, теряющих веру в монархию и Британскую империю. Эти настроения, похоже, исходят не только от радикалов левых и правых, но и от тех, кого можно назвать «обычными людьми».\n\nХотя австралийское правительство и многие жители страны отвечают на новости словами «Да здравствует король», некоторые вместо этого ответят словами «Да здравствует республика»." # News from England has hit the shores of Australia. The King of Australia, George V, has passed away from this world. All over the world, including here in Australia, the death of the King has been met with mourning.\n\nWhile the news are saddening for some. For others, they see the news of the King's death differently. Along with Australian people mourning the loss, there are many that has taken the news as an oppotunity to protest the monarchy. Especially in Western Australia has there been brewing some discontent from people losing faith in the monarchy and in the British Empire. These sentiments seems also to not only come from radicals on the left and the right, but also from those one could call "ordinary people".\n\nWhile the Australian government and many of the country's people answer the news with a "Long Live the King", some will instead answer it with a "Long Live the Republic".
 australia.1.a: "Тревожно.." # Troubling..

 australia.2.t: "Первомайский инсайдер" # The May Day Insident
 australia.2.d: "Хотя Лейбористская партия обычно считается ведущей партией в праздновании Первого Мая, в последнее время по этому поводу растет некоторая оппозиция. И на демонстрациях, и в профсоюзах все больше и больше места отдавалось прокоммунистическим протестующим.\n\nЭто привело к неловкому инциденту в Западной Австралии, где местное отделение ACTU, Австралийский совет профсоюзов, решило не приглашать местного лидера лейбористов, сославшись на нерадивое поведение партии при проведении пролейбористской политики. В результате это привело к конфронтации между сторонниками Лейбористской партии и предполагаемыми коммунистическими членами ACTU непосредственно в Первомая в этом году. В результате кражи знамени Лейбористской партии и последовавшего за этим агрессивного поведения все дело закончилось общим позором как для местных лейбористов, так и для членов ACTU." # While the Labor Party are usually considered the leading party under the May Day celebrations, there have been some opposition growing to this recently. In both the demonstrations and in the unions, more and more space have been given to pro-Communist protestors.\n\nThis led to an embarassing insident in Western Australia, where a local branch of the ACTU, the Australian Council of Trade Unions, chose to not invite a local Labor leader, citing the party's slothful behavior in passing pro-Labor policies. As a result, this have led to an confrontration between supporters of Labor and aledged Communist-leaning ACTU members on May Day itself this year. Resulting in a pro-Labor Party banner being stolen and some violent behavior following it, the whole case has ended in a general embarassment for local Labor and ACTU members alike.
 australia.2.a: "Разве мы не боремся за одно и то же?!" # Are We Not Fighting For The Same Things?!

 australia.3.t: "Выборы штата Западная Австралия 1936 года" # The 1936 Western Australia State Election
 australia.3.d: "На днях прошли государственные выборы в самом западном штате Австралии – Западной Австралии. На последних выборах в штате лейбористы и Филип Коллиер одержали минимальную победу на выборах над коалицией националистов и кантри во главе с Джеймсом Митчеллом.\n\nТеперь, три года спустя, выборы в штате оказались более трудными, чем обычно. Хотя победа коалиции националистов и кантри под руководством Чарльза Лэтэма является ожидаемой, более неожиданной частью является сильная демонстрация движения Auralia Out на этих выборах. Движение, возглавляемое австралийским националистом и антимонархистом Ксавье Гербертом, сумело получить два места в Законодательном собрании Западной Австралии благодаря нечестивому союзу между антимонархистами как крайне правого, так и крайне левого толка.\n\nТо, что эти новости могут означать для Западной Австралии и страны в целом, может вызывать беспокойство. Цель состоит в том, чтобы увидеть, сможет ли разумная политика противостоять этим радикальным движениям." # These days, state elections have been held in the most-western state of Australia, Western Australia. The last election in the state saw a razor thin electoral victory for Labor and Philip Collier over the Nationalist-Country coalition led by James Mitchell.\n\nNow, three years later, the election in the state has been more troublesome than usual. While the victory for the Nationalist-Country coalition under Country's Charles Latham are expected, the more unexpected part is a strong showing of the Auralia Out Movement this election. Led by Australian nationalist and anti-monarchist Xavier Herbert, the movement has managed to secure two seats in the Western Australian Legislative Assembly through an unholy alliance between anti-monarchists of both the far-right as well as the far-left.\n\nWhat these news might mean for Western Australia and the country as a whole, can be worrying. It is to see if sensible politics are able to withstand these radical movements.
 australia.3.a: "Редко какие-нибудь хорошие новости из Перта.." # Rarely Any Good News From Perth..

 australia.4.t: "Дебаты о военной подготовке" # The Military Training Debate
 australia.4.d: "С ростом валкизма в Европе раздались призывы провести новые реформы в отношении военной подготовки в Австралии. Даже в предстоящей ситуации вопрос о более сильном и расширенном плане военной подготовки встретил сопротивление среди политиков-лейбористов, даже в самом федеральном правительстве.\n\nХотя как националистическая оппозиция, так и многие лейбористы и политики страны призывают правительство усилить военную подготовку австралийских солдат, возможно, есть еще больше лейбористов, выступающих против такого плана, наряду со многими пацифистами, выступающими против армии в целом. В конце концов, этот вопрос так и не был решен, и федеральное правительство решило пока ничего не делать." # With the rise of Valkism in Europe, calls to make new reforms regarding military training in Australia has been called. Even with the situation ahead, the issue over a stronger and increased military training plan has been met with opposition among Labor politicians, even in the Federal Government itself.\n\nWhile both the Nationalist opposition as well as many Laborites and Country politicians urges the government to strengthen the military training of Australian soldiers, there are perhaps even more Laborites opposed to such a plan, along with many pacifists opposed to the military all together. In the end, this issue has not reached a conclusion, with the Federal Government choosing to do nothing for now.
 australia.4.a: "Статус-кво иногда бывает лучшим" # Status Quo is Sometimes the Best

 australia.5.t: "Обвал Лондонского фондового рынка обрушился на Австралию" # London Stock Market Crash Hits Australia
 australia.5.d: "Катастрофа! Крах лондонского фондового рынка распространился по всей Британской империи, нанеся рану Австралии. Как и в Британии, австралийский рынок оказался в грязи, оставив после себя безработицу и экономический ущерб.\n\nДаже в этом случае что-то подсказывает нам, что крах сам по себе является лишь началом трудного времени в австралийской истории. Достаточно успешное премьерство Джеймса Скаллина уже лежит в руинах, а оппозиция использует кризис как способ свергнуть федеральное правительство. Кроме того, начинают формироваться споры между фракциями, ищущими разные ответы в разрешении экономического кризиса. Даже в этом случае нам придется подождать, пока кризис стабилизируется, прежде чем предпринимать какие-либо действия по его исправлению." # Disaster! The London Stock Market Crash has now spread all over the British Empire, inflicting a wound upon Australia. As in Britain, the Australian market has been draged into the dirt, leaving unemployment and economic damage in it's wake.\n\nEven then, something do tell us that the crash itself is just the start of a troublesome time in Australian history. Already lies the fairly sucessful premiership of James Scullin in ruins, with the opposition using the crisis as a way to drag the Federal Government down. In addition are disputes beginning to form between factions seeking different answers in solving the economic crisis. Even then, we would have to wait for the crisis to stabalize before doing anything to fix it.
 australia.5.a: "Бог! Ты нас бросил?!" # God! Have You Abandoned Us?!

 australia.6.t: "Левые лейбористы настаивают на социализации" # Left Laborites Push For Socialization
 australia.6.d: "Австралийская Лейбористская партия далеко не полностью едина во всех вопросах. Внутри партии можно найти разнообразный состав от социалистов до центристов. На этот раз депутат от Лейбористской партии Джон Кертин снова вместе со своими левыми союзниками в Палате представителей выступил за социализацию австралийской инфраструктуры и критически важных отраслей. В условиях растущей напряженности в мире Кертин рассматривает эти меры как важный шаг для обеспечения готовности страны, а также для прекращения влияния капитализма на австралийскую инфраструктуру и критически важные отрасли. Надежда Кертина состоит в том, чтобы увидеть эти изменения в бюджете следующего года.\n\nХотя есть подозрения в оппозиции со стороны националистов, Кертин был немного отстранен от оппозиции со стороны некоторых своих товарищей по партии. Даже если их оппозиция была более нейтральной, они все равно называют его социалистом, стремящимся искоренить хорошие частные инициативы страны. Через некоторое время премьер-министру Джеймсу Скаллину удалось положить конец дебатам внутри Лейбористской партии. Боясь, что такие разногласия могут поставить под угрозу единство партии, он призывает Кертина и других депутатов от лейбористской партии обсудить позицию партии в кулуарах." # The Australian Labor Party is not at all completely unified on all things. Inside the party, a diverse cast of socialists to centrists can be found. This time, the Labor MP John Curtin has once more, along with his left-wing allies in the House, pushed for socialization of Australian infrastructure and critical industries. With the rising tentions in the world, Curtin sees these measures as an important step to secure the country's readyness, while also seing an end to the influence of capitalism on Australian infrastructure and critical industries. The hope Curtin have, is to see these changes for next year's budget.\n\nWhile the opposition from the Nationalists are suspected, Curtin was a bit taken back by the opposition from some of his own party comrades. Even if their opposition was more neuanced, they do still call him a socialist that seeks to uproot the good private initiatives of the country. After some time, Prime Minister James Scullin managed to end the debate inside Labor. Afraid that such disagreements can challenge the unity of the party, he urges Curtin and other Labor MPs to debate the party's stance on the backroom.
 australia.6.a: "Почему эта разобщенность, мужчины?" # Why This Disunity, Men?

 australia.7.t: "Начинаются антиправительственные протесты" # Anti-Government Protests Begins
 australia.7.d: "В условиях растущей безработицы и разрушения рынка люди по всей стране начинают винить в этой ситуации правительство. Обманутые, чтобы поверить в альтернативные решения проблем Австралии, безработные из рабочего класса начали собираться на улицах, чтобы протестовать против правительства.\n\nПока кабинет Скаллина все еще не знает, как реагировать на этот кризис, появляется все больше протестов. Одним из штатов, особенно пострадавших как от экономического кризиса, так и от роста беспорядков, является Западная Австралия. В условиях кризиса государственное движение «Ауралия» стало особенно популярным, и его концепция была принята некоторыми западными социалистами и антимонархистами." # With climbing unemployment and a broken market, people around the whole country are beginning to blame the government for this situation. Tricked in to belive in alternative solutions to Australia's problems, working class unemployed people have started to gather in the streets to protest the government.\n\nWith the Scullin cabinet still wondering how to respond to this crisis, a growing number of protests are poping up. One state ecpesially affected by both the economic crisis and increased riots, are Western Australia. With the crisis, the state's Auralia Movement have growned especially popular and the consept has been adopted by some western socialists and anti-monarchists.
 australia.7.a: "Пожалуйста, будьте мирными" # Please Be Peaceful

 australia.8.t: "Лейбористы разделились в вопросах реагирования на кризисы" # Labor Divided on Crisis Response
 australia.8.d: "В связи с экономическим кризисом, опустошающим Австралию, появились призывы к федеральному правительству что-то сделать с этим. Поскольку федеральное правительство не в состоянии что-либо сделать, правительства штатов начали бороться с кризисом по-своему. Даже в этом случае ясно, что нам нужен единый план восстановления Австралии.\n\nДаже если Лейбористская партия является социалистической партией, премьер-министр Джеймс Скаллин не решается навязать стране радикальный план экономического восстановления. Поскольку многие высказывают мнение, что консервативный план будет лучше для поддержания расходов и долга на низком уровне, Скаллин проявляет интерес к этому решению. С другой стороны, и член парламента от лейбористской партии Джон Кертин, и премьер-министр Северного Южного Уэльса Джек Лэнг стремятся к более интервенционистскому подходу.\n\nВ условиях продолжающегося кризиса будет необходимо выбрать план. Как для благополучия страны в целом, так и для благополучия Лейбористской партии и правительства Скаллина." # With the economic crisis ravaging through Australia, calls for the Federal government to do something about it has emerged. With the Federal government inable to do anything, State governments have started to deal with the crisis in it's own way. Even so it is clear that we need a unified plan for recovery in Australia.\n\nEven if Labor is a socialist party, Prime Minister James Scullin has been hesitant to enforce a radical economic recovery plan on the country. With many voicing the opinion that a conservative plan would be better to keep spending and debt low, Scullin are showing interest in this solution. On the other side, both Labor MP John Curtin and the Premier of North South Wales, Jack Lang, seek a more interventionist approach.\n\nWith the crisis going on, it will be neseccary to choose a plan. Both for the well-being of the country as a whole and for the well-being of the Labor Party and Scullin's government.
 australia.8.a: "Легче сказать, чем сделать" # Easier Said Than Done

 australia.9.t: "Предложение Лиона" # The Lyons Proposal
 australia.9.d: "Джозеф Лайонс, экономически консервативный член фракции Лейбористской партии в Палате представителей, объявил о плане экономического восстановления, который разозлил многих радикалов и левых внутри фракции Лейбористской партии. Предложения Лайона по балансированию бюджета и сокращению социальных расходов настолько грандиозны, что даже премьер-министр Скаллин колеблется.\n\nС другой стороны, г-н Лайонс получил поддержку многих представителей бизнеса, включая влиятельных членов Мельбурнского истеблишмента. Эта поддержка еще больше отдалила Лайона от профсоюзной базы Лейбористской партии, и если мы собираемся поддержать его консервативный план, мы можем рискнуть, что партия разделится на правых и левых. Если мы поддержим план Лайонса, мы увидим поддержку со стороны националистической оппозиции.\n\nПринимая во внимание все это, наше правительство получило как совет отклонить, так и принять во внимание план, объявленный Джозефом Лайонсом. Премьер-министру Джеймсу Скаллину необходимо решить, что будет делать." # Joseph Lyons, a economically conservative member of the Labor Party's caucus in the House, has announced a plan for economic recovery that has angered many radicals and left-wingers inside the Labor caucus. Lyons proposals to balancing the budget and cutting social spendings are so grand that even Prime Minister Scullin is hesitant.\n\nOn the other side, Mr. Lyons have gotten the support of many inside buisness, including influential members of the Melbourne Establishment. This support has alienated Lyons further from the labour union base of Labor, and if we are going to support his conservative plan, we might risk the party dividing between the right and the left. If we are to commit to Lyons' plan, we will see support from the Nationalist opposition.\n\nWith all this considered, our government have gotten both advice to reject and consider the plan announced by Joseph Lyons. Prime Minister James Scullin need to decide what will be done.
 australia.9.a: "У Лайонса есть план! Давайте попробуем это" # Lyons Got a Plan! Let's Try it Out
 australia.9.b: "Нет! Этот план уничтожит труд" # No! This Plan Would Destroy Labor

 australia.10.t: "Трудовые коллективы, выступающие против жесткой экономии, пересекают пол" # Anti-Austerity Labor Cross the Floor
 australia.10.d: "Когда новость о том, что мы приняли консервативный план восстановления экономики Джозефа Лайонса, распространилась по Австралии, она встретила массовую оппозицию со стороны членов партии и различных профсоюзов, вплоть до членов парламента, заседающих в Палате представителей. Сегодня возглавляемый Джоном Кертином пересек трибуну депутатов от лейбористской партии, создав левую оппозицию действующему правительству.\n\nУже социалистические лейбористы завоевали поддержку многих профсоюзов и партий штатов, ранее связанных с лейбористами. Одним из удивительных событий стало то, что возглавляемое Джеком Лэнгом отделение Лейбористской партии Нового Южного Уэльса не присоединилось к этой новой партии. Напротив, Ланг, похоже, столь же критичен по отношению к Социалистическому Лейбористскому Союзу, как и по отношению к Лионскому плану." # With the news of our adoption of Joseph Lyons' conservative recovery plan going through Australia, massive opposition was met from members of the party and different labour unions up to members of parliament sitting in the House. Today, led by John Curtin crossed left-leaning Labor MPs the floor, establishing a left-wing opposition to the current government.\n\nAlready, this Socialist Labor has gained the support of many labour unions and state parties previously tied to Labor. One surprising development was that the Jack Lang-led New South Wales branch of Labor did not join this new party. Instead, Lang seems to be as critical towards this Socialist Labor as he is towards the Lyons Plan.
 australia.10.a: "Левые набирают силу" # The Left-Wing is Rising

 australia.11.t: "Лейбористы Нового Южного Уэльса прощаются" # New South Wales Labor Bids Their Farewell
 australia.11.d: "После левого раскола в Лейбористской партии, когда социалисты создали левую оппозицию лейбористскому правительству, в Новом Южном Уэльсе, похоже, происходят новые события.\n\nЯвляясь резким критиком как социализма, так и консервативного экономического плана, принятого правительством Скаллина, Джек Лэнг объявил себя и отделение Лейбористской партии Нового Южного Уэльса независимыми от Федеральной лейбористской партии. К нему присоединилось большинство лейбористов Нового Южного Уэльса, что еще больше разделило наше собрание в Палате представителей. В результате этих событий у Лейбористской партии осталось фракционное собрание, всего на два члена больше, чем у Националистической партии. И это в Палате представителей, где всего несколько недель назад наша фракция вдвое превысила численность фракции националистов." # In the wake of the left-wing split in the Labor Party, with the socialists establishing a left-wing opposition to the Labor government, new developments seems to happen in New South Wales.\n\nAs a strong critic against both socialism and the conservative economic plan that the Scullin government has adopted, Jack Lang has declared himself and the NSW branch of Labor independent from the Federal Labor Party. He is joined by most New South Wales Laborites, further dividing our caucus in the House. With these developments, Labor is left with a caucus just two members bigger than the Nationalist Party. This in a House that saw our caucus double the size of the Nationalist caucus just a few weeks ago.
 australia.11.a: "Как пал Могучий" # How the Mighty has Fallen

 australia.12.t: "Неожиданная поддержка" # Unexpected Support
 australia.12.d: "Поскольку Лейбористская партия пережила худший раскол в своей истории, осталось не так много времени, прежде чем оппозиционной Националистической партии придется уйти, прежде чем она сможет обеспечить победу над нами. Поскольку они являются нашими естественными врагами в Палате представителей, удивительно, что они теперь решили поддержать правительство Скаллина. Лидер оппозиции Джон Лэтэм заявил, что Националистическая партия поддержит нынешнее лейбористское правительство, чтобы обеспечить стабильность в условиях экономического кризиса. Кроме того, Лэтэм стремится помешать любому дальнейшему росту власти как Социалистических лейбористов, так и Лэнг-лейбористов.\n\nПремьер-министр Джеймс Скаллин поблагодарил Лэтэма за поддержку, но также подтвердил, что это не означает, что лейбористы будут поддерживать националистическую политику." # With Labor seen the worst split in its history, there is not much left before the opposition Nationalist Party need to go before they can secure a victory over us. With them as our natural enemies in the House, it is surprising that they have now choosen to support the Scullin government. Opposition leader John Latham has declared that the Nationalist Party will support the current Labor government to asure stability through this economic crisis. In addition, Latham seeks to hinder any further growth in power to both Socialist Labor and Lang Labor.\n\nPrime Minister James Scullin has thanked Latham for his support, but has also reaffirmed that this does not mean that Labor will support Nationalist policies.
 australia.12.a: "Вы все еще «оппозиция»" # You Are Still 'Opposition'

 australia.13.t: "Джек Лэнг предлагает план" # Jack Lang Proposes a Plan
 australia.13.d: "Наш отказ от консервативного плана жесткой экономии Джозефа Лайонса многие лейбористы, выступающие против жесткой экономии, восприняли это как знак того, что предлагаемые ими решения будут представлены. Депутаты от лейбористской партии Нового Южного Уэльса выдвинули предложение премьер-министра Нового Южного Уэльса Джека Ланга. В этом его плане федеральное правительство проводит широкие интервенционистские реформы, основанные на теориях британского экономиста Джона Мейнарда Кейнса.\n\nПлан вызовет споры среди экономически консервативных членов Лейбористской партии, а также встретит сопротивление со стороны националистической оппозиции. В свою очередь, многие профсоюзы и левые выразили свою поддержку Плану Ланга. И это несмотря на антисоциалистические взгляды премьера Ланга. Согласиться с этим планом или нет, будет зависеть от премьер-министра Джеймса Скаллина." # With our rejection of the conservative austerity plan of Joseph Lyons, many anti-austerity Laborites has seen it as a sign for their proposed solutions to be presented. Labor MPs from New South Wales has brought forth a proposal from the New South Wales Premier Jack Lang. In this plan of his, the Federal government enacts wide interventionist reforms based on the theories of British economist John Maynard Keynes.\n\nThe plan would be controversial amoung economically conservative members of Labor, as well as opposed by the Nationalist opposition. In return, many labour unions and left-wingers have voiced their support in the Lang Plan. This despite the anti-socialist views of Premier Lang. It will be up to Prime Minister James Scullin to agree to the plan or not.
 australia.13.a: "Нам нужен Новый Южный Уэльс на нашей стороне" # We Need New South Wales on Our Side
 australia.13.b: "Нет! Нам следует придерживаться сбалансированного подхода" # No! We Should Take a Balanced Approach

 australia.14.t: "Джозеф Лайонс пересек пол" # Joseph Lyons Cross the Floor
 australia.14.d: "После отклонения его плана федеральным правительством Джозеф Лайонс покинул Лейбористскую партию. Вместе с другими экономически консервативными лейбористами он теперь нашел новых друзей среди Националистической партии. На этой основе националисты были поглощены новой политической силой в Австралии: Партией «Единая Австралия».\n\nПод руководством Джозефа Лайонса эта новая оппозиционная партия приобрела огромный импульс. Впервые с 1934 года лейбористы бросили серьезный вызов своей власти. Новая партия взяла на себя консервативный план восстановления Лиона, сократив расходы и сбалансировав бюджет. Кроме того, партия стремится объединить австралийское общество в целом против социалистических и валкистских угроз, существующих в мире." # With the rejection of his plan by the Federal government, Joseph Lyons has left Labor. Together with other economically conservative Laborites, he has now found new friends amoung the Nationalist Party. From this base, the Nationalists has been absorbed by a new political force in Australia: The United Australia Party.\n\nWith the leadership of Joseph Lyons, this new opposition party has gained huge momentum. For the first time since 1934, Labor has gained a formidable challenge to their power. The new party has commited themselves to the conservative recovery plan of Lyons, cutting spendings and balancing the budget. In addition, the party seeks to unite Australian society as a whole against the Socialist and Valkist threats present in the world.
 australia.14.a: "Действительно достойный соперник" # A Worthy Opponent Indeed

 australia.15.t: "Ответ Ланга" # Lang's Response
 australia.15.d: "Когда известие о нашем отказе от его плана прибыло от премьер-министра Джека Ланга, он был недоволен. Объявив наше решение актом подчинения оппозиционным силам, выступающим за жесткую экономию, он принял решение покинуть Лейбористскую партию.\n\nВместе с большей частью лейбористского отделения Нового Южного Уэльса Лэнг основал свою собственную Лейбористскую партию Ланг. Поскольку лейбористы теряют контроль над одним из основных штатов Содружества, наша власть значительно ослабевает. Хотя фракция лейбористов в Палате представителей по-прежнему больше, чем фракция националистов, наше абсолютное большинство потеряно. Интересно, этого ли желает Джек Лэнг?" # When news about our rejection to his plan arrived Premier Jack Lang, he was not pleased. With him declaring our decision an act of submission to pro-austerity forces in the opposition, he has taken the choice to leave Labor.\n\nAlong with most of the New South Wales branch of Labor, Lang has established his own Lang Labor. With Labor losing control of one of the core state in the Commonwealth, our power is greatly weakened. While Labor's caucus in the House is still bigger than the Nationalist caucus, our absolute majority has been lost. Wonder if this is what Jack Lang wishes.
 australia.15.a: "Партия разделена.." # A Party Divided..

 australia.16.t: "Руины Западной Австралии" # Western Australia Ruin
 australia.16.d: "Из всех штатов и территорий, входящих в состав Австралии, ни один не пострадал от экономического кризиса сильнее, чем Западная Австралия. Поскольку сельскохозяйственная промышленность штата остановилась, а горнодобывающая промышленность иссякла из-за кризиса, штат пережил колоссальный экономический крах всего за пару недель.\n\nНарод Западной Австралии становится все более и более отчужденным от остальной части Австралии, о чем свидетельствует возросшая активность сепаратистского движения Ауралия. И крайне левые, и крайне правые австралийские республиканцы использовали этот момент, чтобы разжечь недовольство в западном штате. Это затронуло даже наших депутатов из Западной Австралии, которым легче поверить, что федеральное правительство обидело штат." # Out of all the states and territories making up Australia, none has battered this economic crisis worse than Western Australia. With the agricultural industries of the state at an halt and the mining industries dried up by the crisis, the state has seen immense economic ruin in just a couple of weeks.\n\nThe people of Western Australia grows more and more alienated from the rest of Australia, proven by increased activity in the Auralia separatist movement. Both far-left and far-right Australian republicans have used this moment to stir up discontent in the western state. Even our MPs from Western Australia is affected, with them easier in believing that the Federal government has wronged the state.
 australia.16.a: "Год мрачный для Содружества" # The Year is Bleak For the Commonwealth

 australia.17.t: "Удар в спину" # Stab in the Back
 australia.17.d: "Поскольку всеобщие выборы 1937 года быстро приближаются, среди депутатов от Лейбористской партии ходят пессимистические слухи о том, что партия не переживет выборы. Недавний крах лондонской фондовой биржи и действия правительства в этой ситуации чрезвычайно подорвали его репутацию среди избирателей, и люди обвиняют правительство Скаллина в том, что оно не делает достаточно для решения экономической ситуации. Некоторые в партийных рядах даже подумывают о том, чтобы попросить премьер-министра Джеймса Скаллина уйти с поста лидера партии, чтобы лейбористам удалось пережить выборы, однако рассмотрение этих предложений приходится самому премьер-министру." # As the 1937 General Elections are fast approaching, there are whispers of pessimism within the Labour MPs that the party would not survive the election. The recent London Stock Market Crash and the government's handling of the situation has extremely damaged it's reputation to the voter base, and the people have been blaming the Scullin Government for not doing enough for handle the economic situation. Some within the party ranks are even considering asking for Prime Minister James Scullin to resign as leader of the party, in order for Labour to survive the election, however, it comes to the Prime Minister himself to address these motions.
 australia.17.a: "Отставка – единственный путь вперед" # Resignation is the only way forward
 australia.17.b: "Лондон должен быть виноват!" # London should be the one to blame!

 australia.18.t: "Новый глава Лейбористской партии" # New Labour Party Chief
 australia.18.d: "Отставка Джеймса Скалли оставила Лейбористскую партию без руководства, к счастью, на пост главы Лейбористской партии есть два популярных кандидата. Первым был Джон Кертин, известный член парламента от Лейбористской партии, который присоединился к Лейбористской партии в молодом возрасте, а также был связан с Викторианской Социалистической партией, а Фрэнсис Форд, нынешний министр администрации Скалли, а также видный член Лейбористской партии; кто это будет?" # The resignation of James Scully have left the Labour Party without leadership, fortunately, there are two popular candidates that fill-up the position of Labour Party head. The first in John Curtin a prominent labour MP, that joined the Labor Party at a young age and was also involved with the Victorian Socialist Party, while Francis Forde a current minister of the Scully administer and also a prominent Labour Party member; who shall it be?
 australia.18.a: "Джон Дж. Кертин" # John J. Curtin
 australia.18.b: "Фрэнсис М. Форд" # Francis M. Forde

 australia.19.t: "Против снижения заработной платы" # Opposition to Wage Cuts
 australia.19.d: "В рамках мер жесткой экономии, введенных в плане восстановления экономики Жозефа Лиона, правительство решило снизить заработную плату различных государственных служащих, что затем коснулось и работников частного сектора. Этот шаг подвергся критике со стороны ACTU или Австралийского совета профсоюзов, подразумевая, что среднестатистическому рабочему пришлось бороться с этой экономической катастрофой. Многие требуют, чтобы правительство изменило это решение, особенно бывшие члены Лейбористской партии левого крыла, которых поддерживает ACTU." # As part of the austerity measures introduced in Joseph Lyon's economic recovery plan, the government have decided to decrease the wages of various public workers which then also affected the workers in the private sector. This move have been critized by the ACTU or the Australian Council of Trade Unions, implying that the average worker have been left struggling in this economic catastrophe. Many are demanding that the government reverse this decision, particularly former Labour members in the left wing amplified by the ACTU.
 australia.19.a: "Им придется с этим справиться." # They have to deal with it.
 australia.19.b: "Теперь, господа, мы можем это решить." # Now gentlemen, we can work this out.

 australia.20.t: "ACTU объявляет всеобщую забастовку" # ACTU Announces General Strike
 australia.20.d: "Различные фабричные рабочие по всей Конфедерации сегодня уволились с работы, организовав незаконную забастовку, которая вызвала быструю реакцию полиции. Эта забастовка стала ответом на игнорирование правительством требований ACTU об отмене политики сокращения заработной платы в плане жесткой экономии для восстановления после краха лондонского рынка. Забастовщики забаррикадировались перед воротами местной фабрики, и им был предъявлен ультиматум о разъезде, который они проигнорировали. Насилие быстро возросло, когда вмешалась полиция, и в результате беспорядков в результате более тридцати человек были тяжело ранены. Через неделю фабричные рабочие вернулись на работу... теперь под присмотром солдат частной милиции, чтобы предотвратить дальнейшие демонстрации." # Various factory workers all over the Confederation walked off the job today, organising an illegal strike that prompted swift police reaction. This strike has been a response on the government's ignoring the ACTU's demands to rescind the Wage Cuts policies in the Austerity plan for recovering in the London Market Crash. The strikers, have barricaded themselves in front of their local factory gates and were issued an ultimatum to disperse - which they ignored. Violence quickly escalated when the police moved in, and the resulting riot ended with over thirty badly injured. Within a week, the factory workers were back on the job... now supervised by private militia soldiers, to ensure no further demonstrations.
 australia.20.a: "Профсоюзы всегда создают проблемы." # The unions are always the ones stirring up trouble.

 australia.21.t: "Кавана произносит речь" # Kavanagh Gives Speech
 australia.21.d: "Выдающийся лидер ACTU Джек Кавана выступил сегодня в Сиднее с речью, которая привлекла очень большую толпу и внимание средств массовой информации. Кавана говорил о необходимости «открытого диалога» между профсоюзами и правительством и о том, что нет необходимости бояться той марки демократии, которую принес синдикализм. Некоторые назвали эту речь «бессвязностью радикала», хотя многие другие заявили, что хорошая манера речи Каваны принесла ему много новых сторонников." # Prominent ACTU leader Jack Kavanagh gave a speech that drew a very large crowd as well as media attention in Sydney today. Kavanagh spoke of the need for an 'open dialogue' between the unions and the government, and that there was no need to fear the brand of democracy that syndicalism brought. The speech was branded by some as the 'ramblings of a radical', though many others said that Kavanagh's well-spoken manner earned him many new supporters.
 australia.21.a: "Я понимаю..." # I see...

 australia.22.t: "Социалистический марш в Канберре" # Socialist March in Canberra
 australia.22.d: "Многие радикалы, поддержанные Австралийским советом профсоюзов, провели незаконные марши в нескольких городах Австралии, даже в столице Канберре. В Канберре многие полицейские подразделения не спешили реагировать на продолжающиеся марши протестующих, что привело к тому, что протестующие успешно проникли в здание парламента и разгромили его, даже захватив видных политиков в качестве заложников. В ответ армия увидела батальон для подавления и разгона радикальных протестующих и в напряженной ситуации была..." # Many radicals supported by the Australian Council of Trade Unions have held an illegal march in several of Australia's cities, even in the capital, Canberra. In Canberra, many police units have been slow to react to ongoing marching of the protesters, and have led to the protesters successfully entering and vandalizing the parliament house, even capturing prominent politicians as hostages. As a response, the army have seen a battalion to suppress and disperse the radical protesters and in the tense situation have been...
 australia.22.a: "Армия штурмует здание парламента и арестовывает протестующих!" # The army storms the parliament house, and arrests the protesters!
 australia.22.b: "Армейские части бессильны, революция обеспечена!" # The army units are powerless, the revolution is secured!

 australia.23.t: "ACTU празднует сделку" # ACTU Celebrates Deal
 australia.23.d: "Новое соглашение рабочих, принятое правительством, стало большим поводом для празднования среди рабочего класса Австралии, и Австралийский совет профсоюзов специально провел марши в нескольких крупных городах в ознаменование этого исторического события. Выступления лидеров ACTU собрали огромные толпы людей, где они с явным пылом говорили о синдикалистских идеалах и истинных интересах рабочего класса. Рядом стояла полиция, сдерживая агитаторов, оскорблявших социалистов, сообщений о каких-либо инцидентах не поступало." # The new Workers' Deal enacted by the government has been a great cause for celebration among Australia's working class - and the Australian Council of Trade Unions specifically has led marches across several large cities to commemorate the historic occasion. Speeches by ACTU leaders drew massive crowds, where they spoke with obvious fervour about syndicalist ideals and the true interests of the working class. Police stood nearby, keeping back agitators who hurled slurs at the socialists, and there were no reports of incidents.
 australia.23.a: "Я понимаю..." # I see...

 australia.24.t: "Австралийская гвардия готовится к конфронтации" # Australian Guard Prepares for Confrontation
 australia.24.d: "Правительство получило информацию о весьма своеобразных перемещениях элементов в вооруженных силах, особенно подразделений, лояльных роялистскому движению, называемых Австралийской гвардией, возглавляемых двумя героями Великой войны, Эриком Кэмпбеллом и Томасом Блейми. Хотя это только кажется слухами, мы следим за тем, что происходит в тени внутри вооруженных сил." # The government has received word of rather peculiar movements of elements within the military especially units loyal to the royalist movement called the Australian Guard, headed by two heroes of the Great War, Eric Campbell and Thomas Blamey. While this only appears to be rumour, we keep an eye on what's happening in the shadows within the military.
 australia.24.a: "Что-то я в этом сомневаюсь." # Somehow I doubt it.

 australia.25.t: "[AST.GetAdjective] Охранник просит поддержки" # [AST.GetAdjective] Guard Asks for Support
 australia.25.d.left: "Правительство [Root.GetAdjective] в течение нескольких недель боролось с планом потери Австралии под властью большевизма, и теперь мы получили неожиданные новости: Томас Блейми, фельдмаршал [AST.GetAdjective] и член радикальной группы королевских сторонников под названием Австралийская гвардия, рассказал нам о плане организации государственного переворота против правительства [AST.GetAdjective]. Он попросил нас о поддержке, хотя советники предупреждают, что - если переворот потерпит неудачу - мы вполне можем оказаться втянутыми в немедленную войну против [AST.GetNameDef], с которой будет трудно справиться." # The [Root.GetAdjective] government has been struggling for weeks to come up with a plan regarding the loss of Australia to bolshevism, and now we have received surprising news: Thomas Blamey, a [AST.GetAdjective] field marshal and member of a radical group of royal supporters called the Australian Guard, has told us of a plan to engineer a coup against the [AST.GetAdjective] government. He has asked for our support, though advisors caution that - if the coup fails - we might very well be caught up in an immediate war against [AST.GetNameDef], one that will be difficult to deal with.
 australia.25.d.afm: "Правительство [Root.GetAdjective] изо всех сил пытается разработать план относительно потери Австралии, и теперь мы получили удивительные новости: Томас Блейми, фельдмаршал [AST.GetAdjective] и член радикальной группы королевских сторонников под названием Австралийская гвардия, рассказал нам о плане организации государственного переворота против правительства [AST.GetAdjective] AFM. Он попросил нас о поддержке, хотя советники предупреждают, что - если переворот потерпит неудачу - мы вполне можем оказаться втянутыми в немедленную войну против [AST.GetNameDef], с которой будет трудно справиться." # The [Root.GetAdjective] government has been struggling to come up with a plan regarding the loss of Australia, and now we have received surprising news: Thomas Blamey, a [AST.GetAdjective] field marshal and member of a radical group of royal supporters called the Australian Guard, has told us of a plan to engineer a coup against the [AST.GetAdjective] AFM government. He has asked for our support, though advisors caution that - if the coup fails - we might very well be caught up in an immediate war against [AST.GetNameDef], one that will be difficult to deal with.
 australia.25.a: "Мы поддержим их план, даже если это будет означать войну." # We shall support their plan, even if it means war.
 australia.25.b: "Мы не можем рисковать — Блейми сам по себе." # We cannot risk it - Blamey is on his own.

 australia.26.t: "Переворот австралийской гвардии" # The Australian Guard Coup
 australia.26.d.left: "Правительственные силы сегодня были в смятении, поскольку столица оказалась под внезапной осадой - военизированные формирования австралийской гвардии взяли в заложники многочисленных чиновников во главе с фельдмаршалом Томасом Блейми и генерал-майором Гербертом Ллойдом, когда они пытались незаконно взять на себя командование парламентом. Их радиопередача гремит по всей Канберре, не только призывая австралийцев восстать против большевизма, но и заявляя о полной поддержке Империи. Это возмутительное вмешательство в дела [Root.GetAdjective], если это правда, но пока еще неизвестно, одержат ли победу силы, лояльные ACTU..." # Government forces scrambled today as the capital found itself under sudden siege - Australian Guard paramilitary troops took numerous officials hostage, led by Field Marshal Thomas Blamey and Major General Herbert Lloyd, as they attempted to take unlawful command of parliament. Their radio broadcast is blaring throughout Canberra, not only calling on Australians to rise up against bolshevism but claiming to have the full support of the Empire. This is outrageous interference in [Root.GetAdjective] affairs, if true, but so far it remains to be seen if forces loyal to the ACTU will even win the day...
 australia.26.d.afm: "Правительственные силы сегодня были в смятении, поскольку столица оказалась под внезапной осадой - военизированные формирования австралийской гвардии взяли в заложники многочисленных чиновников во главе с фельдмаршалом Томасом Блейми и генерал-майором Гербертом Ллойдом, когда они пытались незаконно взять на себя командование парламентом. Их радиопередача гремит по всей Канберре, не только призывая австралийцев восстать против «предателей-республиканцев», но и заявляя о полной поддержке Империи. Это возмутительное вмешательство в дела [Root.GetAdjective], если это правда, но пока еще неизвестно, одержат ли победу силы, лояльные к AFM..." # Government forces scrambled today as the capital found itself under sudden siege - Australian Guard paramilitary troops took numerous officials hostage, led by Field Marshal Thomas Blamey and Major General Herbert Lloyd, as they attempted to take unlawful command of parliament. Their radio broadcast is blaring throughout Canberra, not only calling on Australians to rise up against 'the republican traitors' but claiming to have the full support of the Empire. This is outrageous interference in [Root.GetAdjective] affairs, if true, but so far it remains to be seen if forces loyal to the AFM will even win the day...
 australia.26.a: "Переворот удался! Гвардия берет под свой контроль страну." # The coup succeeds! The Guard takes control of the country.
 australia.26.b: "Переворот провалился! Силы Блейми бегут из столицы." # The coup fails! Blamey's forces flee the capital.

 australia.27.t: "Переворот австралийской гвардии увенчался успехом" # Australian Guard's Coup Succeeds
 australia.27.d.support: "Томас Блейми сообщил правительству [Root.GetAdjective], что, во многом благодаря нашей поддержке, сторонники королевской семьи вернули себе контроль над парламентом [AST.GetAdjective] и находятся в процессе восстановления порядка в стране. Теперь мы можем вздохнуть с облегчением, поскольку Австралия вновь заявляет о себе как о союзнике Великобритании и члене Антанты." # Thomas Blamey has sent word to the [Root.GetAdjective] government that, thanks in large part to our support, royal supporters have retaken control of the [AST.GetAdjective] parliament and are in the process of restoring order in the country. We can now breathe a sigh of relief as Australia once again re-asserts itself as a British ally and member of the Entente.
 australia.27.d.nosupport: "Томас Блейми сообщил правительству [Root.GetAdjective], что даже без нашей поддержки он и его сторонники из Гвардии вернули себе контроль над парламентом [AST.GetAdjective] и находятся в процессе восстановления порядка в стране. Он подтвердил, что [AST.GetNameDef] остается верным подданным британской короны и снова посвятит себя альянсу. Мы все можем вздохнуть с облегчением." # Thomas Blamey has sent word to the [Root.GetAdjective] government that, even without our support, he and his Guard supporters have retaken control of the [AST.GetAdjective] parliament and are in the process of restoring order in the country. He has affirmed that [AST.GetNameDef] remains a loyal subject of the British crown and that it will dedicate itself to the alliance once more. We can all breathe a sigh of relief.
 australia.27.a: "Хорошие новости на этот раз!" # Good news for once!

 australia.28.t: "Переворот австралийской гвардии провалился" # Australian Guard's Coup Fails
 australia.28.d: "Томас Блейми сообщил, что, несмотря на нашу поддержку, его попытка государственного переворота против правительства [AST.GetAdjective] закончилась неудачей. К счастью, он выжил и в настоящее время перебрасывает свои военизированные формирования на базы в Новой Зеландии. Хотя правительство [AST.GetAdjective] возмущено нашим вмешательством, мы пока не воюем с ним... хотя Блейми утверждает, что пользуется поддержкой правительства Новой Зеландии, и говорит нам, что они скоро поднимутся. Без нашей поддержки кажется сомнительным, что Новая Зеландия добьется успеха." # Thomas Blamey has sent word that, despite our support, his attempted coup against the [AST.GetAdjective] government has ended in failure. Thankfully he survived and is currently pulling his paramilitary forces to bases in New Zealand. While the [AST.GetAdjective] government is outraged by our interference, we are not at war with them yet... though Blamey claims to have the support of the New Zealand government and tells us they will be rising up soon. Without our support, it seems doubtful that New Zealand will carry the day.
 australia.28.a: "Будем ждать еще новостей..." # We shall wait for more news...
 australia.28.b: "Да будет так!" # So be it!

 australia.29.t: "Призыв к миру?" # A Call for Peace?
 australia.29.d: "Прошло много месяцев с тех пор, как началась война с Новой Зеландией, и, хотя мы захватили острова, мы продолжаем войну с их колониальными хозяевами. Однако эта война ни к чему не приведет, и поэтому было высказано предложение о том, что нам следует добиваться белого мира с правительством [ENT.GetAdjective]. Если они оставят нас в покое, этот конфликт можно оставить позади." # It has been many months since the war with New Zealand began, and while we have captured the islands we remain at war with their colonial masters. This is a war that will go nowhere, however, and thus a suggestion has been raised that we should seek white peace with the [ENT.GetAdjective] government. If they will leave us be, this conflict can be put behind us.
 australia.29.a: "Пришло время объявить перемирие." # It is time to call for a truce.
 australia.29.b: "Скажите им, что они спят." # Tell them they are dreaming.

 australia.30.t: "Мир с австралийцами?" # Peace with the Australians?
 australia.30.d: "От правительства [From.GetAdjective] прибыл посланник мира, предлагающий положить конец военным действиям. Если мы оставим их в покое и позволим им сохранить «законный» контроль над Новой Зеландией, тогда этот конфликт может закончиться... конфликт, который, похоже, ни к чему не привел для нас." # A peace envoy has arrived from the [From.GetAdjective] government, offering an end to hostilities. If we leave them be and allow them to retain 'rightful' control over New Zealand, then this conflict can come to an end... a conflict which, it seems, has been going nowhere for us.
 australia.30.a: "Да, давайте покончим с этим сейчас." # Yes, let us end this now.
 australia.30.b: "Нет! Мы продолжим эту войну, пока она не закончится!" # No! We will continue this war until it is finished!

 australia.31.t: "Нет мира с [From.GetNameDef]" # No Peace with [From.GetNameDef]
 australia.31.d: "Наши посланники вернулись из [From.GetNameDef] с однозначным ответом: мира не будет." # Our envoys have returned from [From.GetNameDef] with a definitive response: there will be no peace.
 australia.31.a: "Ах, хорошо." # Ah well.

 australia.32.t: "Призыв к миру?" # A Call for Peace?
 australia.32.d: "Прошло много месяцев с тех пор, как началась война, и наши бывшие колониальные хозяева, похоже, не ближе к завоеванию нашей страны, чем мы к пересечению Тихого океана, чтобы завоевать их страну. Поскольку война ни к чему не приводит, было высказано предложение, что нам следует добиваться белого мира с британцами. Если они оставят нас в покое, этот конфликт можно оставить позади." # It has been many months since the war began, and our former colonial masters appear no closer to conquering our nation than we are of crossing the Pacific to conquer theirs. Seeing as the war is going nowhere, a suggestion has been raised that we should seek white peace with the British. If they will leave us be, this conflict can be put behind us.

 australia.33.t: "Мир с австралийцами?" # Peace with the Australians?
 australia.33.d: "От правительства [From.GetAdjective] прибыл посланник мира, предлагающий положить конец военным действиям. Если мы оставим их в покое, позволив им продолжать существование под тем правительством, которое они выберут, тогда этот конфликт может прийти к концу... конфликту, который, похоже, имеет мало надежд на окончание в ближайшее время." # A peace envoy has arrived from the [From.GetAdjective] government, offering an end to hostilities. If we leave them be, allowing their continued existence under whatever government they so choose, then this conflict can come to an end... a conflict which, it seems, has little hope of ending anytime soon.

 australia.34.t: "Переворот австралийской гвардии" # The Australian Guard Coup
 australia.34.d.left: "Правительственные силы сегодня были в смятении, поскольку столица оказалась под внезапной осадой - военизированные формирования австралийской гвардии взяли в заложники многочисленных чиновников во главе с фельдмаршалом Томасом Блейми и генерал-майором Гербертом Ллойдом, когда они пытались незаконно взять на себя командование парламентом. Их радиопередача гремит по всей Канберре, не только призывая австралийцев восстать против большевизма, но и заявляя о полной поддержке Империи. Это возмутительное вмешательство в дела [Root.GetAdjective], если это правда, но пока еще неизвестно, одержат ли победу силы, лояльные ACTU..." # Government forces scrambled today as the capital found itself under sudden siege - Australian Guard paramilitary troops took numerous officials hostage, led by Field Marshal Thomas Blamey and Major General Herbert Lloyd, as they attempted to take unlawful command of parliament. Their radio broadcast is blaring throughout Canberra, not only calling on Australians to rise up against bolshevism but claiming to have the full support of the Empire. This is outrageous interference in [Root.GetAdjective] affairs, if true, but so far it remains to be seen if forces loyal to the ACTU will even win the day...
 australia.34.d.afm: "Правительственные силы сегодня были в смятении, поскольку столица оказалась под внезапной осадой - военизированные формирования австралийской гвардии взяли в заложники многочисленных чиновников во главе с фельдмаршалом Томасом Блейми и генерал-майором Гербертом Ллойдом, когда они пытались незаконно взять на себя командование парламентом. Их радиопередача гремит по всей Канберре, не только призывая австралийцев восстать против «предателей-республиканцев», но и заявляя о полной поддержке Империи. Это возмутительное вмешательство в дела [Root.GetAdjective], если это правда, но пока еще неизвестно, одержат ли победу силы, лояльные к AFM..." # Government forces scrambled today as the capital found itself under sudden siege - Australian Guard paramilitary troops took numerous officials hostage, led by Field Marshal Thomas Blamey and Major General Herbert Lloyd, as they attempted to take unlawful command of parliament. Their radio broadcast is blaring throughout Canberra, not only calling on Australians to rise up against 'the republican traitors' but claiming to have the full support of the Empire. This is outrageous interference in [Root.GetAdjective] affairs, if true, but so far it remains to be seen if forces loyal to the AFM will even win the day...

 australia.35.t: "Королевское правление восстановлено" # Royal Rule Restored
 australia.35.d.henry: "Новое правительство под руководством [Root.GetLeader] отказалось от вопросов республиканских статей предыдущего правительства, восстановив королевское правление над [Root.GetNameDef], вступившее в силу немедленно. Это событие ознаменовалось прибытием в парламент принца Генриха в качестве нового генерал-губернатора, который триумфально принял на себя обязанности главы государства перед большой восторженной толпой." # The new government under [Root.GetLeader] has dispensed with the republican articles issues by the previous government, restoring Royal rule over [Root.GetNameDef] effective immediately. The occasion was marked with the arrival of Prince Henry at parliament as the new Governor-General, triumphantly assuming his duties as head of state to a large and enthusiastic crowd.
 australia.35.d.george: "Новое правительство под руководством [Root.GetLeader] отказалось от вопросов республиканских статей предыдущего правительства, восстановив королевское правление над [Root.GetNameDef], вступившее в силу немедленно. Это событие ознаменовалось прибытием в парламент принца Джорджа в качестве нового генерал-губернатора, который триумфально принял на себя обязанности главы государства перед большой восторженной толпой." # The new government under [Root.GetLeader] has dispensed with the republican articles issues by the previous government, restoring Royal rule over [Root.GetNameDef] effective immediately. The occasion was marked with the arrival of Prince George at parliament as the new Governor-General, triumphantly assuming his duties as head of state to a large and enthusiastic crowd.
 australia.35.d.hore_ruthven: "Новое правительство под руководством [Root.GetLeader] отказалось от вопросов республиканских статей предыдущего правительства, восстановив королевское правление над [Root.GetNameDef], вступившее в силу немедленно. Это событие ознаменовалось прибытием в парламент известного губернатора Александра Хор-Рутвена в качестве нового генерал-губернатора, который триумфально принял на себя обязанности главы государства перед большой восторженной толпой." # The new government under [Root.GetLeader] has dispensed with the republican articles issues by the previous government, restoring Royal rule over [Root.GetNameDef] effective immediately. The occasion was marked with the arrival of renowned governor Alexander Hore-Ruthven at parliament as the new Governor-General, triumphantly assuming his duties as head of state to a large and enthusiastic crowd.
 australia.35.a: "Ура!" # Hurrah!

 australia.36.t: "Восстание АФМ" # Rise of the AFM
 australia.36.d: "До этого момента Движение «Австралия прежде всего», возглавляемое Перси Стивенсеном, считалось маргинальным движением, состоящим из недовольных социалистов. С ростом хаоса, вдохновленного синдикалистскими силами, а вместе с ним и с состоянием Австралийской гвардии, слова Стивенсена получили новую поддержку среди народа Австралии. Стивенсен призывает Австралию разорвать связи с британской короной, продолжать продвигать австралийство и сохранять нейтральную позицию в мировых делах, чтобы гарантировать, что Австралия никогда не попадет в еще одну катастрофу, подобную Галлиполи. «Они высокопарно говорят о «заполнении огромных пустых пространств Австралии», а затем сбрасывают сюда отбросы Лондона, — говорит он своим ярым сторонникам. — К черту британцев и Империю!»" # Up until this point, the Australia First Movement - led by Percy Stephensen - has been considered a fringe movement filled with disaffected socialists. With the rise of chaos inspired by syndicalist forces, and with it the fortunes of the Australian Guard, Stephensen's words have gained new purchase among the people of Australia. Stephensen calls for Australia to cut its ties with the British crown, to further promote Australianism and to maintain a neutral stance in global affairs so to ensure Australia never marches into another disaster like Gallipoli. 'They talk grandiloquently about 'filling up Australia's vast empty spaces' and then they dump down the scum of London here,' he tells his ardent supporters, 'To hell with the British and the Empire!'
 australia.36.a: "Это предательские разговоры, вот что это такое." # That's treasonous talk, is what that is.

 australia.37.t: "Викторианские пожары Буша" # Victorian Bush Fires
 australia.37.d: "Штат Виктория пострадал от сильных лесных пожаров на северо-востоке и юго-западе. Из-за сильной жары и засухи последних нескольких лет большая часть сельской местности Виктории высохла, оставив много топлива для огня. Пожары в этом месте настолько интенсивны, что пепел и дым можно увидеть из Новой Зеландии. Пожарные при поддержке правительства штата в настоящее время пытаются бороться с катастрофой, поскольку пламя уже угрожает нескольким крупным городам и вызывает серьезную панику." # The state of Victoria has been hit by heavy bush fires in the north east and south west. Because of intense heat and drought over the last few years, much of rural Victoria has dried up - leaving plenty of fuel for the flames. The fires at this point are so incredibly intense that the ash and smoke can be seen from New Zealand. Firefighters with the aid of the state government are currently trying to combat the disaster, with the flames already threatening several major cities and causing considerable panic.
 australia.37.a: "Боже мой!" # Goodness!

 australia.38.t: "Пожары Буша наконец потушены" # Bush Fires Finally Extinguished
 australia.38.d: "Пожары в Виктории наконец потушены благодаря усилиям местных пожарных, а также затянувшимся обильным дождям. Эта победа была достигнута ценой 71 жизни, разрушения более 1000 домов и сожжения почти 135 500 гектаров земли. В настоящее время судья Леонард Стреттон был выбран, чтобы возглавить королевскую комиссию по расследованию того, что привело к катастрофическим пожарам, хотя многие подозревают, что ответственность за это несут фермеры или скотоводы в сельских районах из-за их давней практики сжигания кустарника для расчистки новых земель." # The fires in Victoria have finally been extinguished, thanks to the efforts of local fire fighters as well as overdue dense rainfall. This victory has come at the cost of 71 lives, over 1000 homes destroyed, and the burning of almost 135,500 hectares of land. Currently Judge Leonard Stretton has been selected to lead a royal commission into what led to the disastrous fires, though many suspect farmers or graziers in rural areas to be responsible due to their long-standing practice of burning brush to clear new land.
 australia.38.a: "Ну, по крайней мере, худшее уже позади." # Well, at least the worst is over.

 australia.39.t: "[GetYear] Федеральные выборы" # The [GetYear] Federal Election
 australia.39.d: "Согласно Конституции Австралии, выборы должны проводиться не реже одного раза в три года (наследие австралийской практики). Выборы этого года особенно важны в связи с подъемом движения Перси Стивенсена «Австралия прежде всего», которое перекачивает поддержку со стороны традиционных консервативных партий. Будет ли электорат придерживаться одной из существующих политических партий или вместо этого они выберут радикалов?" # As per the Constitution of Australia, elections are to be held at least once every three years (a legacy of Australian practice). This year's election is particularly important, due to the rise of Percy Stephensen's Australia First Movement, which have siphoned support from the traditional conservative parties. Will the electorate stick with one of the established political parties, or will they opt instead for the radicals?
 australia.39.a: "Лейбористская партия доживает еще один срок!" # Labour survives for another term!
 australia.39.b: "Объединенная Австралия подметает пол!" # United Australia sweeps the floor!
 australia.39.c: "AFM одерживает неожиданную победу!" # The AFM makes a suprising win!

 australia.40.t: "Ион Идрисс «Король скота»" # Ion Idriess' 'The Cattle King'
 australia.40.d: "Ведущий австралийский писатель Ион Идрис сегодня опубликовал свой последний роман «Король скота». В нем рассказывается о жизни недавно умершего сэра Сидни Кидмана, предпринимателя и скотовода, который при жизни владел или совладельцем больших участков земли в Австралии. Кидман стал широко популярен благодаря поддержке правительства во время Великой войны и благотворительных организаций. Книга, судя по всему, станет бестселлером в Австралазии в 1936 году, и многие проводят параллели между Кидман и изгнанным Белым раджей Чарльзом Винером Бруком, что, несомненно, повысит популярность Брук." # Leading Australian writer Ion Idriess today published his latest novel, 'The Cattle King'. It follows the life of recently-deceased Sir Sidney Kidman, an entrepreneur and pastoralist who owned or co-owned large areas of land in Australia in his lifetime. Kidman became widely popular due to his support of the government in the Great War and charitable organisations. The book looks set to be Australasia's best-seller for 1936, and many are drawing parallels between Kidman and the exiled White Rajah, Charles Vyner Brooke, which is sure to boost Brooke's popularity.
 australia.40.a: "Интересное чтение!" # An Interesting Read!

 australia.41.t: "«Сорок тысяч всадников»" # 'Forty Thousand Horsemen'
 australia.41.d: "Фильм режиссера Шарля Шовеля «Сорок тысяч всадников» рассказывает историю австралийской легкой кавалерии во время Синайско-Палестинской кампании последней Великой войны. В нем рассказывается о приключениях трех хулиганских героев, борющихся и романтических, и кульминацией которого является битва при Беэр-Шеве. Хотя этот фильм явно является пропагандистским инструментом, призванным помочь в вербовке и поднять гордость австралазийцев дома, он быстро становится самым успешным австралийским фильмом, когда-либо созданным." # Directed by Charles Chauvel, 'Forty Thousand Horsemen' tells the story of the Australian Light Horse during the Sinai and Palestine Campaign of the last Great War. It follows the adventures of three rowdy heroes in fighting and romance and culminates at the Battle of Beersheba. While the film is clearly a propaganda tool to aid in recruitment and lift the pride of Australasians at home, it is fast becoming the most successful Australasian film ever produced.
 australia.41.a: "Ух ты!" # Wow!

 australia.42.t: "Социалистические ячейки раскрыты" # Socialist Cells Uncovered
 australia.42.d: "Наконец-то сегодня хорошие новости: в крупных [Root.GetAdjective] городах были обнаружены три отдельные ячейки социалистических агитаторов. Было произведено более пятидесяти арестов, а через несколько недель ожидались публичные судебные процессы, что стало настоящим ударом по социалистическому движению. Однако есть некоторые, кто выразил тревогу по поводу того, как быстро социалисты организовались, и предполагают, что этих ячеек может быть всего лишь несколько из многих в [Root.GetNameDef]." # Finally some good news today as three separate cells of socialist agitators were uncovered in major [Root.GetAdjective] cities. Over fifty arrests were made, with public trials expected within weeks, a true blow to the socialist movement. There are some, however, who have expressed dismay at how quickly the socialist have organised, and suggest that these cells may simply be a few of many in [Root.GetNameDef].
 australia.42.a: "Ну, это, конечно, начало." # Well, it's certainly a start.

 australia.43.t: "Роспуск Австралазийской гвардии" # The Dissolution Of The Australasian Guard
 australia.43.d: "Сегодня Эрик Кэмпбелл и Томас Блейми, ветераны Великой войны и виновники попытки государственного переворота австралийской гвардии, были приговорены к пожизненному заключению Высоким судом Австралии за государственную измену. Руководство Гвардии и ее политическое крыло, Центристская партия, разделяет ту же судьбу, что и многие другие видные деятели. Центристская партия была распущена, а Австралазийская гвардия более или менее прекратила свое существование как политическая сила в Австралии. Чарльза Вайнера Брука, к сожалению, нельзя было напрямую связать с переворотом, и он избежал тюремного заключения, хотя многие обвиняют его в даче взяток тем, кто участвовал в его судебном преследовании." # Today Eric Campbell and Thomas Blamey, both veterans of the Great War and perpetrators of the Australian Guard's attempted coup d'état, were sentenced to life imprisonment by the High Court of Australia for high treason. The leadership of the Guard and its political wing the Centre Party, shares the same fate along with many other prominent members. The Centre Party has been dissolved and the Australasian Guard more or less ended as a political force in Austrasia. Charles Vyner Brooke unfortunately could not be linked directly to the coup and so escaped a prison sentence, although many accuse him of bribing those involved in his prosecution.
 australia.43.a: "Скатертью дорога!" # Good Riddance!

 australia.44.t: "Подавление протестов профсоюзов" # Unions Protest Suppression
 australia.44.d: "Сторонники профсоюза вышли на улицы в нескольких крупных городах Австралии, протестуя против решения правительства продолжить подавление ACTU и его союзников-синдикалистов. Протестующих встретила полиция, а затем и военизированные формирования Австралазийской гвардии, что привело к кровавым столкновениям в Мельбурне, в которых, как сообщается, были ранены десятки людей. Лидер максимистов Дж. Б. Майлз призвал к продолжению сопротивления антипрофсоюзной политике правительства, хотя и не стал открыто призывать к вооруженному восстанию." # Union supporters have taken to the streets in several major Australasian cities, protesting the government's decision to continue the suppression of the ACTU and its syndicalist allies. The protesters were met with police, and later with Australasian Guard paramilitary groups, and this led to bloody clashes in Melbourne where dozens were reported injured. Maximist leader J.B. Miles has called for continued resistance to the government's anti-union policies, although he drew short of openly calling for armed revolt.
 australia.44.a: "Мы будем пристально следить за этим." # We will keep a close eye on this.

 australia.45.t: "Джозеф Лайонс умер от сердечного приступа" # Joseph Lyons Dies from Heart Attack
 australia.45.d.united: "Сегодня утром премьер-министр Джозеф А. Лайонс, лидер Объединенной партии и премьер-министр Австралии, скончался от сердечного приступа во время поездки из Мельбурна в Сидней. Его срочно доставили в больницу Святого Винсента в Дарлингхерсте, но по прибытии объявили уже мертвым. Государственные похороны пройдут в соборе Святой Марии в течение пяти дней, а его тело будет отправлено обратно в его родной город Девонпорт. Роберт Мензис, партнер Лиона по коалиции, сегодня вступит в должность премьер-министра Австралии." # This morning, Prime Minister Joseph A. Lyons the leader of the United Party and Prime Minister of Australia have been reportedly died from a heart attack while being driven from Melbourne to Sydney. He was rushed at St. Vincent's Hospital in Darlinghurst but declared already dead at arrival. A state funeral will be held in St. Mary's Cathedral for for five days and his body will be sent back to his hometown of Devonport. Robert Menzies, a coalition partner of Lyons will be now inaugurated as Prime Minister of Australia.
 australia.45.d.other: "Сегодня утром Джозеф А. Лайонс, известный своим планом Лиона, направленным на восстановление экономики [AST.GetAdjective] после краха лондонского фондового рынка посредством серии программ жесткой экономии, как сообщается, умер от сердечного приступа во время поездки из Мельбурна в Сидней. Его срочно доставили в больницу Святого Винсента в Дарлингхерсте, но по прибытии объявили уже мертвым. Похороны пройдут в соборе Святой Марии в течение пяти дней, а его тело отправят обратно в его родной город Девонпорт." # This morning, Joseph A. Lyons known for his Lyons plan that aims to recover the [AST.GetAdjective] economy from the London Stock Market Crash through a series of austerity programs have been reportedly died from a heart attack while being driven from Melbourne to Sydney. He was rushed at St. Vincent's Hospital in Darlinghurst but declared already dead at arrival. A funeral will be held in St. Mary's Cathedral for five days and his body will be sent back to his hometown of Devonport.
 australia.45.a: "Трагическая утрата..." # A tragic loss...

 australia.46.t: "Джозеф Лайонс выздоравливает после сердечного приступа" # Joseph Lyons Recovers from Heart Attack
 australia.46.d.united: "Сегодня утром премьер-министр Джозеф А. Лайонс, лидер Объединенной партии и премьер-министр Австралии, был, как сообщается, доставлен в больницу Сент-Винсента из-за сердечного приступа во время поездки из Мельбурна в Сидней. К счастью, Лайонс пережил сердечный приступ и отдыхает на территории больницы. В его отсутствие сейчас проходит инаугурация Роберта Мензиса в качестве нового премьер-министра Австралии; поскольку Лайонс в настоящее время недееспособен и уйдет из общественной жизни." # This morning, Prime Minister Joseph A. Lyons the leader of the United Party and Prime Minister of Australia have been reportedly rushed to the hospital at St. Vincent's due to a heart attack while being driven from Melbourne to Sydney. Fortunately, Lyons have survived the heart attack and is resting on the hospital grounds. In his absence, Robert Menzies, is now being inaugurated as the new primier of Australia; as Lyons is currently incapacitated and will withdraw from public life.
 australia.46.d.other: "Сегодня утром Джозеф А. Лайонс, известный своим планом Лиона, целью которого является восстановление экономики [AST.GetAdjective] после краха лондонского фондового рынка с помощью ряда программ жесткой экономии, как сообщается, был срочно доставлен в больницу Сент-Винсента из-за сердечного приступа во время поездки из Мельбурна в Сидней. К счастью, Лайонс пережил сердечный приступ и отдыхает на территории больницы. Однако по состоянию здоровья и советам врачей он ушел из общественной жизни и вместо этого ушел на пенсию." # This morning, Joseph A. Lyons known for the Lyon's Plan that aims to recover the [AST.GetAdjective] economy from the London Stock Market Crash through a series of austerity programs have been reportedly rushed to the hospital at St. Vincent's due to a heart attack while being driven from Melbourne to Sydney. Fortunately, Lyons have survived the heart attack and is resting on the hospital grounds. However, due to his health and advices from his physicians, he has withdrawn from public life and instead retire.
 australia.46.a: "Надеюсь, он поправится..." # Hope he recovers well...

 australia.47.t: "Австралия предлагает создать зону свободной торговли КАНЗУК" # Australia Proposes the CANZUK Free Trade Zone
 australia.47.d: "Правительство [AST.GetAdjective] обратилось к нам с предложением объединить империю, чтобы улучшить экономическое положение всех и избежать пошлин со стороны различных частей Империи, они разработали торговую зону внутри Содружества. Такая торговая зона будет свободна от торговых тарифов и правил и принесет взаимную выгоду всем членам." # The [AST.GetAdjective] Government have approached us for their proposal of bringing the empire closer together, in order to improve the economic situation of all, and avoid tariffs from various parts of the Empire, they have devised a trade zone within the commonwealth. Such trade zone will be free of trade tarriffs and regulations, and will mutually benefit all members.
 australia.47.a: "Хорошая идея!" # Good idea!

 australia.48.t: "Зона свободной торговли КАНЗУК" # The CANZUK Free Trade Zone
 australia.48.d: "Лондон проинформировал нас, что предложение [AST.GetAdjective] о создании зоны свободной торговли в рамках Содружества будет реализовано на всей территории Империи, и автоматически включил нас в качестве ее первых членов. Теперь мы можем торговать с различными имперскими территориями и другими членами Содружества без каких-либо пошлин, что значительно укрепит наше экономическое положение." # London have have informed us that the [AST.GetAdjective] proposal of creating a free trade zone within the commonwealth will be implemented throughout the Empire, and have automatically included us as its initial members. We can now trade with various imperial territories and other commonwealth members for no tarriffs involved, greatly bolstering our economic situation.
 australia.48.a: "Я понимаю..." # I see...

 australia.49.t: "Первый съезд ACTU" # First Congress of the ACTU
 australia.49.d: "Поскольку [Root.GetAdjective] Совет профсоюзов берет на себя все больший контроль над правительственными делами, их первый официальный съезд является делом огромной важности, которое определит направление [Root.GetNameDef] по мере того, как оно начинает свое преобразование в настоящую революционную республику. Популярный и прогрессивный Фред Патерсон, скорее всего, заручится поддержкой большинства делегатов, но непостоянный оратор Дж. Б. Майлз завоевал множество сторонников максимистского движения своими разговорами о мобилизации революционеров [Root.GetAdjective] любой ценой. Еще неизвестно, кто из двоих победит в этот день..." # With the [Root.GetAdjective] Council of Trade Unions having taken increasing control of government affairs, their first official congress is a matter of great importance which will determine the direction of [Root.GetNameDef] as it begins its transformation into a proper revolutionary republic. The popular and progressive Fred Paterson appears most likely to win the support of most delegates, but the volatile speaker J.B. Miles has won many supporters to the Maximist cause with his talk of mobilising the [Root.GetAdjective] revolutionaries at any cost. It remains to be seen which of the two will win the day...
 australia.49.a: "Левые лейбористы контролируют Конгресс." # The Left Labour control the congress.
 australia.49.b: "Коммунисты одерживают верх." # The Communists gain the upper hand.
 australia.49.c: "Социалисты-националисты удивляют незначительным большинством." # The Socialist-Nationalist surprise with a slim majority.

 australia.50.t: "[From.GetAdjective] Прибытие оборудования" # [From.GetAdjective] Equipment Arrives
 australia.50.d: "Наши друзья из [From.GetNameDef] прислали нам партию пехотного снаряжения, чтобы помочь в нашей борьбе." # Our friends in [From.GetNameDef] have sent us a shipment of infantry equipment to aid in our struggle.
 australia.50.a: "Очень нужно!" # Much needed!

 australia.51.t: "[From.GetNameDefCap] ищет альянс" # [From.GetNameDefCap] Seeks An Alliance
 australia.51.d: "Республика [From.GetAdjective] дистанцировалась от Британии и теперь стремится к более тесным торговым и дипломатическим связям с державами, близкими к дому, или так говорят посланники, которые они недавно отправили к правительству [Root.GetAdjective]. Заинтересованы ли мы в их предложении?" # The [From.GetAdjective] Republic has distanced itself from the British and now seeks closer trade and diplomatic ties with powers closer to home, or so say the envoys they recently sent to the [Root.GetAdjective] government. Are we interested in their proposition?
 australia.51.a: "Да, пусть наши страны сотрудничают более тесно." # Yes, let our nations cooperate more closely.
 australia.51.b: "Нет, это нас не интересует." # No, this is of no interest to us.

 australia.52.t: "[From.GetAdjective] Согласен" # The [From.GetAdjective] Agree
 australia.52.d: "Правительство [From.GetAdjective] согласилось на наше предложение, подписав официальный альянс, который будет иметь большое значение для сближения наших стран." # The [From.GetAdjective] government has agreed to our proposal, signing a formal alliance that will go a long way towards drawing our countries closer together.
 australia.52.a: "Приятно слышать!" # Good to hear!

 australia.53.t: "[From.GetAdjective] отказались" # The [From.GetAdjective] Have Refused
 australia.53.d: "Ответом правительства [From.GetAdjective] нашим посланникам было в основном молчание. Похоже, они не заинтересованы в каком-либо альянсе, который мы можем предложить." # The response from the [From.GetAdjective] government to our envoys has been mostly silence. It appears they are uninterested in any alliance we might offer.
 australia.53.a: "Плохое решение с их стороны." # A poor decision on their part.

 australia.54.t: "Сотрудничество с Австралией?" # Cooperation with Australia?
 australia.54.d: "[From.GetNameDef] обратились к нам с интересным предложением: будут проведены совместные военные учения между нашими войсками и их солдатами. Наши военные могут получить пользу от этих учений, изучая морские и воздушные бои, которых нам абсолютно не хватает, и в то же время модернизируя наши военно-воздушные и военно-морские средства; в то время как [From.GetAdjective] может улучшить свои боевые действия в джунглях и городах, что очень нравится нашим войскам. Должны ли мы принять их предложение?" # The [From.GetNameDef] have approched us with an interesting proposition, a join military exercise will be conducted between our own troops and their soldiers. Our military can benefit from this exercise learning about naval and air combat which we are absolutely lacking, and at the same time modernizing our air and naval facilities; while the [From.GetAdjective] can improve their jungle and urban warfare which our troops are quite fond of. Should we accept their proposition?
 australia.54.a: "Это может принести пользу нам обоим" # This can benefit us both
 australia.54.b: "Нет, мы заняты" # No, we're busy

 australia.55.t: "[From.GetAdjective] Согласен" # The [From.GetAdjective] Agree
 australia.55.d: "Правительство [From.GetAdjective] согласилось на наше предложение и уже готовится принять наши войска на предстоящих военных учениях, которые пройдут на Филиппинах." # The [From.GetAdjective] government has agreed to our proposal, already preparing to receive our troops in the upcoming military exercises that will be done in the Philippines.
 australia.55.a: "Приятно слышать!" # Good to hear!

 australia.56.t: "[From.GetAdjective] отказались" # The [From.GetAdjective] Have Refused
 australia.56.d: "Ответом правительства [From.GetAdjective] нашим посланникам было в основном молчание. Похоже, их не интересуют любые предложения, которые мы можем предложить." # The response from the [From.GetAdjective] government to our envoys has been mostly silence. It appears they are uninterested in any proposition we might offer.
 australia.56.a: "Плохое решение с их стороны." # A poor decision on their part.

### Decisions
 AST_defeat_australia: "Победить Австралию" # Defeat Australia
 AST_hold_out_vs_britain: "Устоять против Империи" # Hold Out Against the Empire
 AST_hold_out_vs_britain_desc: "Победа над всей Империей маловероятна, но если мы сможем продержаться против их сил достаточно долго, мы, возможно, сможем заставить их пойти на мирные переговоры. Если мы в это время удержим Новую Зеландию, у них, возможно, даже не останется другого выбора, кроме как позволить нам сохранить ее." # Defeating the entire Empire is unlikely, but if we can hold out against their forces long enough we can perhaps force them to peace talks. If we hold New Zealand at that time, they may even have no choice but to let us keep it.
 AST_join_alliance: "Присоединяйтесь к Альянсу [From.GetAdjective]" # Join the [From.GetAdjective] Alliance
 AST_join_alliance_desc: "У нас общие стратегические интересы с [From.GetAdjective]s. Присоединение к их военному альянсу могло бы принести большую пользу нашей стране." # We share strategic interests with the [From.GetAdjective]s. Joining their military alliance could be a great benefit to our nation.

