 AST_national_welfare_schemes_desc: ""
 AST_australian_socialization_scheme: "Австралийская схема социализации" # Australian Socialization Scheme
 AST_australian_socialization_scheme_desc: ""
 AST_solidify_union_support: "Укрепить поддержку профсоюза" # Solidify Union Support
 AST_solidify_union_support_desc: ""
 AST_support_small_business: "Поддержите малый бизнес" # Support Small Business
 AST_support_small_business_desc: ""
 AST_protect_australian_working_class: "Защитите австралийский рабочий класс" # Protect the Australian Working Class
 AST_protect_australian_working_class_desc: ""
 AST_work_with_anti_socialist_labor: "Работайте с антисоциалистическими рабочими" # Work With Anti-Socialist Labor
 AST_work_with_anti_socialist_labor_desc: ""
 AST_work_with_anti_socialist_labor_tt: "\n§lСоциал-либералы§! присоединятся к нашему правительству и сформируют §Yкоалицию§!\n\n" # \nThe §lSocial Liberals§! will join our government and form a §Ycoalition§!\n\n
 AST_work_and_welfare: "Работа и благосостояние" # Work and Welfare
 AST_work_and_welfare_desc: ""

 AST_assure_free_press: "Обеспечьте свободу прессы" # Assure the Free Press
 AST_assure_free_press_desc: ""
