 YUC_fund_worker_strikes_tt: "§gМы попытаемся саботировать промышленное производство [MEX.GetName]§!." # §gWe will try to sabotage the industrial output of [MEX.GetName]§!
 YUC_siphon_state_funds: "Выкачивать государственные фонды" # Siphon State Funds
 YUC_siphon_state_funds_tt: "§gМы попытаемся перевести часть средств из казны [MEX.GetAdjective]§!" # §gWe will try to transfer some funding from the [MEX.GetAdjective] treasury§!
 YUC_promote_anti_government_propaganda: "Продвигайте антиправительственную пропаганду" # Promote Anti-Government Propaganda
 YUC_promote_anti_government_propaganda_tt: "§gМы попытаемся дестабилизировать нацию [MEX.GetAdjective]§!" # §gWe will try to destablize the [MEX.GetAdjective] nation§!
 YUC_steal_stockpiled_equipment: "Украсть складированное оборудование" # Steal Stockpiled Equipment
 YUC_steal_stockpiled_equipment_tt: "§gМы попытаемся украсть некоторое оборудование из склада [MEX.GetAdjective]§!" # §gWe will try to steal some equipment from the [MEX.GetAdjective] stockpile§!
 YUC_mexican_yucateco_war: "Мексикано-юкатекская война" # Mexican-Yucateco War
 YUC_mexican_yucateco_war_desc: "В тысячах миль от нашей родины в регионе Центральной Америки разгорается конфликт. Штат Крузуб, отколовшийся штат, расположенный на полуострове Юкатан, борется против освоения Мексики. Мексика, на другой земле, рассматривает штат Крузуб как отколовшееся государство, которым правят повстанцы Кристеро. Мы можем поддержать любую сторону; и оказывать ограниченную помощь избранной нами стороне или вообще ничего не делать." # Thousands of miles away from our homeland is a growing conflict in the Central American region. The state of Cruzoob, a splinter state that rests on the Yucatan peninsula is fighting against the reclamation of Mexico. Mexico, on the other land sees the state of Cruzoob, as a breakaway state rules by Cristero rebels. We can support either side; and provide limited aide to our chosen side, or do nothing at all.
 YUC_support_a_side: "Поддержка [From.GetName]" # Support [From.GetName]
