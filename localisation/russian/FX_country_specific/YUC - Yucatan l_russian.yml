### History
 YUC_FUHRERREICH_DESC: "Последующие нападения на католиков со стороны военизированных формирований Кальеса вызвали национализм майя на полуострове Юкатан. Хаос в Мексике охватывает страну; эти националисты майя, являющиеся католиками, воспользовались этой возможностью и заявили о своей независимости от мексиканцев.\n\nОднако по мере того, как мексиканское государство исправляется; они присматриваются к бывшему отколовшемуся государству, и как только их приготовления будут завершены, конфликт станет приобретать все больший и больший масштаб..." # Subsequent attacks on Catholics by Calles' paramilitaries have sparked a Mayan nationalism in the Yucatan peninsula. As chaos in Mexico engulfs the nation; these Mayan nationalists whom are Catholics have seized the opportunity and have declared their independence from the Mexicans.\n\nHowever, as the Mexican state fixes itself; they are eyeing the former breakaway state, and once their preparations are complete, conflict looms larger and larger...

