### Description
 USA_FUHRERREICH_DESC: "Участвуя в Великой войне как на мексиканском, так и на европейском фронтах, Теодор Рузвельт покинул столы переговоров в Версале, разгневанный строгим и требовательным договором. Страна, находящаяся сейчас в политической изоляции, погрузилась в глубокие экономические проблемы. В это время несколько национальных холдингов провозгласили свою независимость, в том числе их мексиканское государство-сателлит. Теперь, имея мало друзей и пару могущественных врагов, Америка разделена, а на горизонте маячит еще один великий конфликт." # Participating in the Great War on both the Mexican and European fronts, Theodore Roosevelt left the tables at Versailles angered at the stringent and demanding treaty. A nation now in political isolation, the country has descended into deep economic troubles. In the midst, several of the nation's holdings declared their own independence, including their Mexican client state. Now, with few friends and a couple powerful enemies, America stands divided as another great conflict looms on the horizon.

