### Focus
 USA_last_minute_reforms: "Реформы в последнюю минуту" # Last Minute Reforms
 USA_last_minute_reforms_desc: "Срок полномочий президента Кертиса подошел к концу, но Великая депрессия все еще влияет на страну в экономическом и социальном плане. К счастью, у нынешней администрации еще есть некоторые программы по оказанию помощи слабой экономике Соединенных Штатов до того, как состоятся выборы." # President Curtis' term has come to it's final year, but the Great Depression still affects the nation economically and socially. Fortunately, the current administration still has some programs to aid the ailing economy of the United States before the election takes place.
 USA_expand_soup_kitchens: "Развернуть Суповые кухни" # Expand Soup Kitchens
 USA_expand_soup_kitchens_desc: "Поскольку экономическая катастрофа в Соединенных Штатах затягивается внутри страны, многие из них являются безработными и не могут прокормить себя и свои семьи. К счастью, правительство попытается смягчить эту ситуацию, создав программу, аналогичную программе «Суповые кухни» в Нью-Йорке." # As the economic catastrophe in the United States lingers within the nation, many are unemployed and with that cannot feed themselves or their families. Fortunately, the government will try to alleviate this by creating program similar to Soup-Kitchens in New York.
 USA_war_thropy: "Американизация Нижней Калифорнии" # Americanization of Baja California
 USA_war_thropy_desc: "Поскольку Нижняя Калифорния находится под нашим контролем, у нас есть возможность интегрировать этот регион в состав Соединенных Штатов. Инвестируя в инфраструктуру, продвигая американскую культуру и поощряя миграцию, мы можем гарантировать, что Нижняя Калифорния станет процветающей и неотъемлемой частью нашей страны." # With Baja California under our control, we have the opportunity to integrate the region into the United States. By investing in infrastructure, promoting American culture, and encouraging migration, we can ensure that Baja California becomes a prosperous and integral part of our nation.
 USA_pass_the_economic_stimulus_bill: "Принять законопроект об экономическом стимулировании" # Pass the Economic Stimulus Bill
 USA_pass_the_economic_stimulus_bill_desc: "Экономика ошеломляет, потому что потребители не потребляют. Мы создадим программы субсидирования населения, чтобы заставить его тратить деньги, чтобы экономика снова пришла в движение." # The economy is staggering because the consumers doesn't consume. We will setup programs to subsidize the population to make them spend in order to make the economy moving again.
 USA_increase_corporate_taxes: "Увеличение корпоративных налогов" # Increase Corporate Taxes
 USA_increase_corporate_taxes_desc: "Хотя корпоративные налоги составляют менее половины годового дохода федерального правительства, их увеличение все равно поможет максимизировать нашу прибыль и, в свою очередь, позволит нам тратить больше денег на наши проекты." # While corporate taxes make up less than half of the Federal Government's annual income, increasing it would still help maximize our profits and in turn have more money to spend on our projects.
 USA_decrease_military_spending: "Сокращение военных расходов" # Decrease Military Spending
 USA_decrease_military_spending_desc: "Только что началась Великая война, и победители заключили сокрушительные и ограничительные договоры с побежденными. Возможно, было бы лучше сократить наш оборонный бюджет, чтобы выделить больше ресурсов на стимулирование экономики и финансирование других неотложных государственных проектов." # A Great War has just been fought on, and the victors have put on crushing and restrictive treaties to the vanquished. Maybe decreasing our defense budget would better off in order to have more resources allocated to boosting the economy and financing other urgent government projects.
 USA_farmer_loans: "Фермерские кредиты" # Farmer Loans
 USA_farmer_loans_desc: "Американские фермы были опустошены в результате экономической катастрофы, земли многих из них были отняты банками и другими финансовыми учреждениями. Создав федеральное агентство, отвечающее за защиту фермеров, мы сможем обеспечить процветание и безопасность сельского хозяйства." # American farms were devastated in the economic catastrophe many off them were their lands taken by banks and other financing institutions. By creating a federal agency responsible for protecting farmers, we can ensure agricultural prosperity and security.
 USA_liquidate_failing_companies: "Ликвидировать обанкротившиеся компании" # Liquidate Failing Companies
 USA_liquidate_failing_companies_desc: "Часть государственных ресурсов забирают эти государственные корпорации, которые не приносят прибыли. Возможно, пришло время задуматься об их существовании." # Some of the government resources are being taken by these public-owned corporations that do not make profits. Maybe it's time to think about their existence.
 USA_slow_recovery: "Медленное восстановление" # Slow Recovery
 USA_slow_recoverydesc: "С тех пор, как к власти пришла Республиканская партия, американский бизнес и финансы поднялись на новую высоту. Безработица низкая, а цены на акции продолжают расти. Боже, благослови Америку и Боже, благослови капитализм!" # Since the Republican party was elected to power American business and finance have risen to new heights. Unemployment is low, and stock prices continue to rise. God bless America and God bless capitalism!
# Army
 USA_review_the_army: "Обзор армии" # Review the Army
 USA_review_the_army_desc: "Вопрос часа: в каком направлении должна двигаться армия США, чтобы не только ответить, но и предвидеть затяжную наземную войну? Мнение Макартура является данностью, поскольку он уже подготовился к этому конфликту в своем ближайшем окружении." # The question of the hour, which direction should the US Army take to not only respond but anticipate a prolonged land war? The opinion of MacArthur is a given, having already prepared for this conflict within his inner circle.
 USA_speed_of_armor: "Скорость брони" # Speed of Armor
 USA_speed_of_armor_desc: "Получатель MOLLUS Адна Чаффи-младший предлагает армии увеличить производство более дорогой бронетехники, а также спланировать создание новых специализированных подразделений в дополнение к более мобильной войне." # MOLLUS recipient Adna Chaffee Jr. proposes that the Army steps up production of more expensive armoured vehicles, as well as plan out new specialised divisions to complement a more mobile war.
 USA_crushing_blow_of_firepower: "Сокрушительный удар огневой мощи" # Crushing Blow of Firepower
 USA_crushing_blow_of_firepower_desc: "Макнейр предлагает уточнить неотъемлемое преимущество армии США в оказании массовой поддержки атакам пехоты. Это потребует интенсивного увеличения занятости в военной промышленности." # McNair proposes refining the inherent advantage the US Army has in delivering a mass quantity of support to infantry attacks. This will require an intensive employment increase in war industries.
 USA_importance_of_planning: "Важность планирования" # Importance of Planning
 USA_importance_of_planning_desc: ""
 USA_superiority_in_numbers: "Численное превосходство" # Superiority in Numbers
 USA_superiority_in_numbers_desc: "План Малин Крейг — единственный план, который гарантирует наличие крупных боевых сил в указанные нами сокращенные сроки." # Malin Craig's plan is the only plan that guarantees a large fighting force in the shortened time frame we have given.
 USA_expanding_motorized_divisions: "Расширение моторизованных дивизий" # Expanding Motorized Divisions
 USA_expanding_motorized_divisions_desc: "Высшие офицеры уже давно имели опыт работы в кавалерии и проектировали и планировали переоборудовать моторизованную технику и танки в соответствии с новыми потребностями. Тесно сотрудничая с правительством, военными, Генри Фордом и другими промышленниками, мы можем воплотить этот план в жизнь." # Top officers have long had experience in cavalry and have designed and planned to transform motorised and tanks to fit new needs. Working closely with the government, the military, Henry Ford and other Industrialists, we can make this plan a reality.
 USA_tank_research_prioritization: "Приоритеты исследований танков" # Tank Research Prioritization
 USA_tank_research_prioritization_desc: "Конструкций танков пруд пруди, нам нужна отлаженная система, чтобы определить, какая конструкция лучше всего сыграет свою роль в бою." # Tank designs are a dime a dozen, we need a streamlined system to determine which design will best fill its role in combat.
 USA_experimental_tank_divisions: "Экспериментальные танковые дивизии" # Experimental Tank Divisions
 USA_experimental_tank_divisions_desc: ""
 USA_experimental_tank_divisions_tt: "§7Получите §Y[Root.GetAdjective] шаблон бронетехники§! следующего состава:\n - 3 £GFX_unit_light_armor_icon_small батальонов\n - 3 £GFX_unit_motorized_icon_small батальонов\n\nСоздайте §Y3§! дивизию с вновь полученными шаблон§!\n" # §7Receive §Y[Root.GetAdjective] Armored§! template with the following composition:\n - 3 £GFX_unit_light_armor_icon_small battalions\n - 3 £GFX_unit_motorized_icon_small battalions\n\nSpawn §Y3§! division with newly gained template§!\n
 USA_further_tank_development: "Дальнейшее развитие танков" # Further Tank Development
 USA_further_tank_development_desc: "Основная беда создания военной промышленности в том, что объекты, находящиеся под нашим контролем, уже были сокращены во времена Великой депрессии, чтобы сократить увольнения. Нам пришлось расширять мощности и перепрофилировать старые здания, чтобы производить на нашей территории детали, необходимые для тяжелого вооружения." # The main trouble with creating a military industry is that facilities under our control were already reduced from the Great Depression to reduce redundancies. We have had to expand facilities and repurpose old buildings in order to manufacture parts needed for heavy weapons in our territory.
 USA_tank_production_initiatives: "Инициативы по производству танков" # Tank Production Initiatives
 USA_tank_production_initiatives_desc: "Бронированная война навсегда изменит облик поля боя. Мы не можем оставаться в стороне, пока мир перевооружается, и с помощью Танка мы сможем победить наших врагов за считанные недели, а не годы. Таким образом, для нас было бы приоритетом построить больше этих смертоносных машин, чтобы мы могли быть готовы к борьбе за свободу не только в Америке, но и во всем мире." # Armoured warfare will change the face of the battlefield forever. We cannot sid idly as the world rearms, and with the Tank, we may be able to beat our enemies in a matter of weeks instead of years. As such, it would be a priority for us to build more of these deadly machines, so that we may be ready for fight for freedom not only in America, but on the whole world.
 USA_artillery_modernization: "Модернизация артиллерии" # Artillery Modernization
 USA_artillery_modernization_desc: "Артиллерийские орудия должны быть как сильнее, так и легче, если мы хотим реагировать на изменения на поле боя, как того требует план. Опыт Макнейра в 1920-х годах в работе с экзаменационными комиссиями, похоже, не пропал даром, и он предложил провести капитальный ремонт производства американской артиллерии, который, по его прогнозам, приведет к тому, что артиллерийские орудия станут проще производить и ремонтировать, а также станут более точными на поле боя." # Artillery pieces will need to be stronger as well as lighter if we are to respond to battlefield changes as the plan dictates. McNair's expertise in the 1920s with the Examining boards seems to have not gone to waste, and he has proposed an overhaul of the American Artillery production which he projects will lead to artillery pieces being easier to produce and repair, as well as more accurate on the battlefield.
 USA_defense_contractors: "Оборонные подрядчики" # Defense Contractors
 USA_defense_contractors_desc: "Частное предпринимательство стало неотъемлемой частью нашей военной промышленности. Пришло время составить контракты и посмотреть, чем они могут нам помочь." # Private enterprise has become an undeniable part of our military industry. It is time we draw up contracts and see what they can do to help us.
 USA_american_auto_industry: "Американский автопром" # American Auto Industry
 USA_american_auto_industry_desc: "С момента изобретения автомобиля народ Америки всерьез воспринял его." # Since the invention of the Automobile, it has been taken up in earnest by the people of America.
 USA_expand_the_engineer_corps: "Расширить инженерный корпус" # Expand the Engineer Corps
 USA_expand_the_engineer_corps_desc: "Мы, наконец, можем обеспечить достаточную инфраструктуру и планируем предоставить инженерный корпус на местах. Координируя нашу разведывательную сеть с системами разведки и наблюдения, мы можем гарантировать, что небоевые элементы в бою будут учтены и смогут выполнить свои задачи." # We are finally able to provide enough infrastructure and planning to provide Engineering Corps in the field. Through coordinating our intelligence network with scouting and surveillance systems, we are able to ensure that non-combat elements in battle are accounted for and able to complete their tasks.
 USA_standardized_equipment_manufacturing: "Производство стандартизированного оружия" # Standardized Weapons Manufacturing
 USA_standardized_equipment_manufacturing_desc: "В то время как наша военная промышленность развивается, Макнейр подчеркнул необходимость использования как противовоздушных, так и противотанковых пушек, чтобы остановить как бронетанковые, так и воздушные угрозы. Однако Высшему командованию потребуются убедительные доказательства, чтобы перенаправить финансирование, которое запрашивает Макнейр..." # As our War Industry hums along, McNair has stressed the necessity of the usage of both Anti Air and Anti Tank cannons to stop both armoured and aerial threats dead in their tracks. However, High Command will require some solid report evidence to divert the funding McNair is requesting...
 USA_rifle_improvements: "Улучшения винтовки" # Rifle Improvements
 USA_rifle_improvements_desc: "Пехотное оружие под обозначением М1 уже много лет находится на испытаниях, в результате чего контракты тратятся впустую. Окончательное решение о том, какая конструкция будет запущена в производство, будет принято своевременно." # The M1 designation infantry weapon has been in trial for years, wasting contracts. The final decision on which design will go into production will be answered in a timely manner now.
 USA_recon_improvements: "Улучшения разведки" # Recon Improvements
 USA_recon_improvements_desc: "Обычно военная техника имеет громкие названия. Рация? Как это проскользнуло через систему? Наши генералы утверждают, что это новое устройство беспроводной связи позволит нашим солдатам эффективно разговаривать, когда они находятся в поле боя. И мы назвали это Walkie Talkie?" # Usually military equipment has strong names. Walkie Talkie? How did that slip through the system? Our generals claim that this new untethered communication device will enable our troops to speak effectively when they're in the field. And we called it Walkie Talkie?
 USA_modernize_training: "Модернизация обучения" # Modernize Training
 USA_modernize_training_desc: ""
 USA_reform_the_command_structure: "Реформировать командную структуру" # Reform the Command Structure
 USA_reform_the_command_structure_desc: "Споры, типичные для федеральной межведомственной политики, сохраняются и в нашем правительстве. Чтобы избежать распространения этого междисциплинарного разногласия, мы должны обеспечить, чтобы всем нашим начальникам штабов уделялось равное внимание." # The disputes common in the Federal inter-service politics persist in our own government. In order to avoid this interdisciplinary contention from spilling over, we must ensure that all our Chiefs of Staff are given equal attention.
 USA_expand_west_point: "Расширить Вест-Пойнт" # Expand West Point
 USA_expand_west_point_desc: "Учитывая непосредственную опасность, угрожающую нашим самым престижным офицерским школам, мы должны реорганизовать и профинансировать новые школы на более безопасной территории." # With the immediate danger posed to our most prestigious officer schools, we must reorganise and fund new schools in safer territory.
 USA_army_rangers: "Армейские Рейнджеры" # Army Rangers
 USA_army_rangers_desc: "Учебные полки по акклиматизации солдат в новых условиях позволят американским солдатам эффективно сражаться, независимо от того, куда их заведет ход войны. Рейнджеры - это недавно предложенные силы, созданные для адаптации к суровой местности с целью постепенного внедрения своих достижений в армию в целом. Давайте найдем эту организацию." # Training Regiments to acclimatise soldiers into new environments will enable American soldiers to fight effectively no matter where the course of war may take them. The Rangers are a newly proposed force conceptualised around adaptation to harsh terrain, with the purpose of introducing their advancements slowly the Army as a whole. Let us found this organisation.
 USA_recruitment_campaigns: "Кампании по набору персонала" # Recruitment Campaigns
 USA_recruitment_campaigns_desc: "Приоритетом генерала Крейга является не только мобилизация крупных пехотных подразделений, но и бесперебойность их снабжения. Таким образом, он настаивает на том, что необходимо составить второй бюджет, который в значительной степени благоприятствует подрядчикам по производству оружия, чтобы они производили больше оборудования, чтобы наши войска на фронте могли сражаться с полной экипировкой против любой угрозы." # A priority of General Craig is not only the Mobilisation of large infantry units, but the consistency of supplies for them. As such, he insists that a second budget needs to be drawn, one that favours Weapon contractors heavily to produce more equipment so our troops at the front may be able to fight with a full kit against any threat.
 USA_logistics_improvements: "Улучшения логистики" # Logistics Improvements
 USA_logistics_improvements_desc: "Планировка Соединенных Штатов может быть подходящей для торговли между штатами, но она не готова к массовому развертыванию сил. Мы должны это исправить." # The layout of the United States may be suited for interstate commerce, but is unprepared for massive deployments. We must correct this.
 USA_refine_our_tactics: "Уточните нашу тактику" # Refine our Tactics
 USA_refine_our_tactics_desc: "Наши наблюдатели во время Вельткрига показали, что новая тактика и технологии становятся жизненно важными на поле боя. Принимая это во внимание, неудивительно, что генерал Чаффи счел целесообразным распространить новые руководства, описывающие, как использовать и противодействовать наступлению бронетехники, поскольку старая тактика противодействия кавалерии устаревает." # It was apparent from our observers in the Weltkrieg that new tactics and technologies are becoming vital in the battlefield. Bearing this in mind, it's no wonder General Chaffee has seen fit to redistribute new manuals specifying how to use and counter armoured advances as the old counter-cavalry tactics grow outdated.
 USA_womens_army_corps: "Женский армейский корпус" # Women's Army Corps
 USA_womens_army_corps_desc: "Несмотря на протесты социально-консервативных элементов в армии США, главнокомандующий твердо встал на защиту Женского армейского корпуса. WAC, возглавляемый секретарем Министерства здравоохранения Оветой Хобби, принял более чем в два раза требуемое количество добровольцев. Женская вспомогательная служба поможет поддерживать и защищать наше боевое оружие, а также поддерживать работу нашей огромной цепочки поставок." # Despite protests from socially conservative elements in the US Army, the Commander in Chief has stood firm in defence of the Women's Army Corps. Led by Secretary of the Department of Health, Oveta Hobby, the WAC has received more than twice their requested number of volunteers. Women's Auxiliary will help maintain and safeguard our weapons of war, and keep our massive supply chain working.
 USA_the_army_reformed: "Армия реформирована" # The Army Reformed
 USA_the_army_reformed_desc: "Армия США достигла нового пика как по численности, так и по эффективности. Мы можем положиться на них в защите наших ценностей как внутри страны, так и за рубежом, и в процессе Верховное командование сумело извлечь некоторые ценные уроки, которые дают нам преимущество перед неопытными военными." # The US Army has reached a new peak in both size and efficiency. We can rely on them to defend our values both domestically and abroad, and in the process, High Command has managed to learn some valuable lessons that give us an edge over inexperienced militaries.
# Air Force
 USA_air_force_debate: "Дебаты о ВВС" # Air Force Debate
 USA_air_force_debate_desc: "Военно-воздушные силы, имеющие финансирование, необходимое для расширения, не имеют четкого направления и лидерства, необходимых для эффективного продвижения. С многочисленными запросами на финансирование исследований и конкурирующими умами, настаивающими на том, что они являются ключом к победе в небе." # The Air Force, having the funding necessary to expand, lacks the precise direction and leadership needed to effectively advance. With numerous requests to fund research, and competing minds insisting that they are the key to victory in the skies.
 USA_create_the_usaf: "Создать ВВС США" # Create the USAF
 USA_create_the_usaf_desc: "Военно-воздушные силы США — это успех как летчика, так и политика. Поскольку мечта о Билли Митчелле реализована во всем, кроме названия, теперь мы можем сосредоточиться на совершенствовании доктрины Гарольда Л. Джорджа и повышении возможностей Америки по нанесению ударов на дальние дистанции." # The United States Air Army Force is the success of both the airman and the politician. With the dream of Billy Mitchell realised in all but name, we can now focus on improving on Harold L. George's doctrine and enhancing America's long range strike capabilities
 USA_create_the_usaf_tt: "§GЭтот фокус будет автоматически пропущен, если мы решим создать отдельную ВВС США§!" # §GThis focus will automatically be bypassed if we chose to create a separate United States Air Force§!
 USA_expand_the_usaac: "Расширить USAAC" # Expand the USAAC
 USA_expand_the_usaac_desc: "Корпус воздушной армии США, находящийся на вооружении с 1926 года, по большей части оставался в стороне от военного строительства. Несмотря на скудный бюджет, им все же удалось внедрить инновации во многих аспектах, и высшее командование почти не видит причин для реформ. Учитывая разногласия высшего командования с летчиками в последние несколько лет, было решено, что им лучше оставаться неотъемлемой частью армии." # The United States Air Army Corps, in service since 1926, has largely remained on the sidelines of military development. Despite receiving a meagre budget, they've yet managed to innovate in many aspects and High Command barely sees any reason to reform. Provided High Command's disputes in the past few years with Airmen, it has been decided they'd be better off remaining as an integral part of the Army.
 USA_expand_the_usaac_tt: "§GЭтот фокус будет автоматически пропущен, если мы решим расширить Воздушный корпус армии США§!" # §GThis focus will automatically be bypassed if we chose to expand the United States Army Air Corps§!
 USA_carpet_bombing_doctrine: "Доктрина ковровой бомбардировки" # Carpet Bombing Doctrine
 USA_carpet_bombing_doctrine_desc: "Идея, выдвинутая Спаатцем и его знакомыми, довольно проста: Враг не сможет продолжать сражаться, если дома, за который они сражаются, больше не существует. Уничтожив их промышленность и их боевой дух в тылу, наши войска одержат верх как в моральном духе, так и в технике на передовой." # The idea pushed by Spaatz and his acquaintances is a rather simple one: The Enemy won't be able to continue fighting if the home for which they are fighting for no longer exists. By destroying both their industry and their fighting spirit at the homefront, our troops will prevail both in morale and equipment on the front line.
 USA_new_bombers: "Новые бомбардировщики" # New Bomber Units
 USA_new_bombers_desc: "Армия заявила, что им нужны многоцелевые самолеты, которые могут легко адаптироваться к боевым ситуациям. К счастью для нас, наши частные подрядчики разработали NA-40, который мог бы послужить основой для новой гибкой модели бомбардировщика, которую летчики настаивают на названии в честь Билли Митчелла, несмотря на протесты Верховного командования. Мы будем финансировать эти усилия по развитию." # The Army has stated they require multi-purpose air craft that can easily adapt to battle situations. Thankfully for us, our private contractors have come up with the NA-40, which could serve as a baseline to a new flexible bomber model, which the airmen insist on naming after Billy Mitchell despite High Command's protests. We shall fund these development efforts.
 USA_army_support_doctrine: "Доктрина поддержки армии" # Army Support Doctrine
 USA_army_support_doctrine_desc: "Генерал Кесада очень практично руководит воздушными операциями, а его подход к воздушной тактике является почти революционным для наших молодых ВВС. Давайте профинансируем его усилия и поможем распространить его руководства среди пилотов, чтобы наша доктрина CAS могла стать лучшей в мире!" # General Quesada has a very hands-on attitude to directing Air missions, and his approach to air tactics is near revolutionary for our young Air Force. Let us fund his efforts and help distribute his manuals to pilots so our CAS doctrine may be the best in the world!
 USA_new_cas: "Новые блоки CAS" # New CAS Units
 USA_new_cas_desc: "Поскольку авиакорпус никогда не намеревался интегрироваться в армию, новые модели непосредственной авиационной поддержки практически не разрабатывались. К счастью, подрядчики уже были настолько любезны, что предоставили нам такие прототипы, как Brewster XSBA-1 и уже устаревший Northrop A-17 «Drifter». Верховному командованию придется тщательно выбирать, кто станет нашим главным бомбардировщиком, если мы хотим добиться успеха..." # As the Air Corps never intended to be integrated into the army, hardly any development has gone into newer Close Air Support Models. Thankfully, Contractors have already been kind enough to provide us with prototypes like the Brewster XSBA-1 and the already ageing Northrop A-17 \"Drifter\". High Command will need to choose carefully who'll become our main Attack Bomber if we wish to succeed...
 USA_the_screaming_eagles: "Кричащие орлы" # The Screaming Eagles
 USA_the_screaming_eagles_desc: "Генерал Джон Ч.Х. Ли настаивает на начале нового эксперимента по воздушному нападению, проводимого в ответ на операции с дельтапланами, впервые появившиеся в Европе. С помощью воздушно-десантных войск мы сможем сокрушить защитников с разных сторон так, как это было невозможно несколько десятилетий назад. Таким образом, генеральный штаб санкционировал эксперименты, и на это будет направлено финансирование." # General John C.H. Lee is insisting on starting off a new experiment in Air Assaults done in response to the Hang-glider operations pioneered in Europe. With airborne forces we will be able to overwhelm defenders from multiple angles in ways that it was impossible decades ago. As such, the general staff has authorised the experiments and funding shall be diverged to it.
 USA_fighter_modernization: "Модернизация истребителя" # Fighter Modernization
 USA_fighter_modernization_desc: "Пока мы все еще застряли на P-26 Peashooter, наши национальные компании добились огромных прорывов с P-36 Hawk, Северским P-35, P-39 Airacobra и новыми прототипами P-40 Warhawk, которые могут дать нам преимущество на поле боя. Давайте профинансируем эти компании, чтобы их проекты пошли в массовое производство." # While we were still stuck with the P-26 Peashooter, our national companies have made huge breakthroughs with the P-36 Hawk, the Seversky P-35, the P-39 Airacobra and the new Prototypes of the P-40 Warhawk which could give us an edge on the battlefield. Let us fund these companies so that their projects may enter mass production.
 USA_strategic_bombers: "Стратегические бомбардировщики" # Strategic Bombers
 USA_strategic_bombers_desc: "У Америки вряд ли есть враги в пределах досягаемости, которых можно было бы опасаться. Таким образом, ВВС США овладела обобщенная мысль, распространяемая группой, возглавляемой такими известными летчиками, как Карл Спаатц. Армия окрестила их «бомбардировочной мафией» из-за их методов, и эта «бомбардировочная мафия» теперь запрашивает финансирование для дальнейшего расширения своих планов ударов на большие расстояния." # America hardly has any enemies within attack range to fear. As such, there has been a generalised thought that has been taking over the USAAF, spread by a group led by famous airmen like Carl Spaatz. The Army has dubbed them the \"Bomber Mafia\" due to their methods, and this \"Bomber Mafia\" is now requesting the funding to further expand on their long range strike plans.
 USA_heavy_escorts: "Тяжелый эскорт" # Heavy Escorts
 USA_heavy_escorts_desc: "Хотя наличие более совершенных бомбардировщиков жизненно важно для победы в войне будущего у порога врага, эти бомбардировщики редко могут действовать самостоятельно. Им понадобится эскорт, способный противостоять истребителям противника и вернуться целыми и невредимыми. К счастью для нас, конструктор самолетов Келли Джонсон обратился к нам с новым инновационным проектом: P-38, получившим название «Молния»." # While having better bombers is vital to win the war of tomorrow at the enemy's doorstep, these bombers can seldom operate on their own. They will need an escort capable of facing off enemy fighters and come back in one piece. Luckily for us, plane designer Kelly Johnson has contacted us with a new and innovative design: The P-38, dubbed \"The Lightning\".
 USA_air_bases: "Авиационные базы" # Air Bases
 USA_air_bases_desc: "Мы должны наполнить страну аэродромами, которые позволят нашим летчикам легко добраться до любой части страны." # We should pepper the nation with airfields, enabling our Airmen to reach any part of the nation easily.
 USA_air_defenses: "ПВО" # Air Defenses
 USA_air_defenses_desc: "Защита воздушного пространства нашей страны — это не то, что мы можем сделать только с воздуха. Как только мы построим зенитные орудия в [Root.Capital.GetCapitalVictoryPointName], мы сможем спать спокойно, зная, что наша столица защищена с воздуха!" # Defending our nation's airspace is not something we can do only from the air. Once we construct anti-aircraft guns in [Root.Capital.GetCapitalVictoryPointName] we can sleep saver knowing that our capital is protected from the air!
 USA_radar_programs: "Р.А.Д.А.Р. Программы" # R.A.D.A.R. Programs
 USA_radar_programs_desc: "РАДАР, сверхсекретная технология обнаружения движения воздуха, позволит нашим наблюдателям за небом спокойно отдыхать ночью." # RADAR, the top-secret technology to detect air movement will allow our sky watchers to rest easy at night.
 USA_fund_oppenheimers_research: "Фонд исследований Оппенгеймера" # Fund Oppenheimer's Research
 USA_fund_oppenheimers_research_desc: "Стоя на пороге открытия, которое изменит мир, мы не можем позволить другим зажечь огонь, который однажды может поглотить Землю." # Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth.
# Navy
 USA_address_the_navy: "Обращение к ВМФ" # Address the Navy
 USA_address_the_navy_desc: "Американский военно-морской флот, институт, история которого так глубоко переплетена с историей нации в целом, после многих лет пренебрежения находится в неуклонном упадке. Больше не надо! Мы должны вновь обратить внимание на военно-морские дела." # The American navy, an institution whose history is so deeply interwoven with that of the nation as a whole, has been in steady decline after years of neglect. No more! We must again turn our attention to naval affairs.
 USA_from_the_skies: "С небес" # From the Skies
 USA_from_the_skies_desc: "Операторы связи – это волна будущего. Мы должны инвестировать в их исследования и строительство, чтобы лучше проецировать военно-морскую мощь." # Carriers are the wave of the future. We should invest in their research and construction to better project naval power.
 USA_under_the_sea: "Под морем" # Under the Sea
 USA_under_the_sea_desc: "Торговля – это источник жизненной силы Америки. Мы должны сосредоточить нашу военно-морскую доктрину на обеспечении ее защиты от набегов противника." # Trade is the lifeblood of America. We should focus our naval doctrine on making sure that it is protected from enemy raids.
 USA_carrier_modernization: "Модернизация авианосца" # Carrier Modernization
 USA_carrier_modernization_desc: "Операторы связи – это волна будущего. Мы должны инвестировать в их исследования и строительство, чтобы лучше проецировать военно-морскую мощь." # Carriers are the wave of the future. We should invest in their research and construction to better project naval power.
 USA_battleship_escorts: "Эскорт линкора" # Battleship Escorts
 USA_battleship_escorts_desc: "Линкоры – короли открытого моря. Нам следует начать исследования новых моделей с более мощными пушками и лучшей противовоздушной защитой." # Battleships are the king of the high seas. We should start research into new models with bigger guns and better anti-air protection.
 USA_the_waves: "ВОЛНЫ" # The WAVES
 USA_the_waves_desc: "Женщины могут выполнять множество вспомогательных функций на флоте, освобождая мужчин для боевой службы. Хотя это может быть социально спорным, это существенно поможет военным усилиям." # Women can serve many auxiliary roles in the navy, freeing up men for combat duty. While this might be socially controversial, it will significantly help the war effort.
 USA_the_marines: "Морские пехотинцы" # The Marines
 USA_the_marines_desc: "Корпус морской пехоты был олицетворением американского влияния по всему миру. От берегов Триполи до залов Монтесумы морские пехотинцы всегда были рядом. Мы должны обеспечить им современное оборудование и обучение." # The Marine Corps was the epitome of American power projection around the globe. From the shores of Tripoli to the halls of Montezuma, the Marines were always there. We should ensure they have modern equipment and training.
 USA_doctrine_improvements: "Улучшения доктрины" # Doctrine Improvements
 USA_doctrine_improvements_desc: "Хотя Военно-морская академия в Аннаполисе была разрушена в боях Гражданской войны, у нас все еще есть много возможностей для подготовки нового поколения военно-морских лидеров и моряков." # While the Naval Academy in Annapolis was destroyed in the fighting of the Civil War, we still have plenty of facilities able to train a new generation of naval leaders and sailors.
 USA_amphibious_transports: "Амфибийные транспорты" # Amphibious Transports
 USA_amphibious_transports_desc: "Подготовка наступательной или оборонительной операции за пределами наших островов требует обширного плана и, конечно, оборудования десантных кораблей." # Preparing an offensive or defensive operation beyond our isles requires an extensive plan and of course, a landing craft equipment.
 USA_cruiser_modernization: "Модернизация крейсера" # Cruiser Modernization
 USA_cruiser_modernization_desc: "Легкие крейсеры важны в противовоздушных операциях, а также при атаке эсминцев и подводных лодок противника. Мы должны обеспечить, чтобы наш флот имел несколько таких, чтобы оставаться сбалансированными." # Lighter cruisers are important in anti-air operations, as well as attacking enemy destroyers and submarines. We should ensure our navy has a handful of these in order to stay balanced.
 USA_expand_the_port_of_los_angeles: "Расширить порт Лос-Анджелеса" # Expand the Port of Los Angeles
 USA_expand_the_port_of_los_angeles_desc: "Наши верфи несколько недостаточны для ведения войны в одиночку. Нам необходимо обеспечить строительство новых военно-морских производственных мощностей для поддержки военных усилий." # Our dockyards are somewhat inadequate to fight a war on their own. We need to ensure that new naval production facilities are constructed to support the war effort.
 USA_expand_the_port_of_boston: "Расширить порт Бостона" # Expand the Port of Boston
 USA_expand_the_port_of_boston_desc: "Наши верфи несколько недостаточны для ведения войны в одиночку. Нам необходимо обеспечить строительство новых военно-морских производственных мощностей для поддержки военных усилий." # Our dockyards are somewhat inadequate to fight a war on their own. We need to ensure that new naval production facilities are constructed to support the war effort.
 USA_submarine_modernization: "Модернизация подводных лодок" # Submarine Modernization
 USA_submarine_modernization_desc: "Подводные лодки позволяют нам сеять хаос вражеским кораблям и тяжелым кораблям. Мы должны гарантировать, что наши разработки будут актуальными для борьбы с эсминцами противника и противолодочной тактикой." # Submarines allow us to wreak havoc on enemy shipping and heavy ships. We should ensure that our designs stay up to date against enemy destroyers and anti-submarine tactics.
 USA_destroyer_modernization: "Модернизация эсминца" # Destroyer Modernization
 USA_destroyer_modernization_desc: "Восстановление береговой охраны обеспечит бесперебойную торговлю, остановку преступников на море и спасение тех, кто находится в опасности." # Restoring the Coast Guard will ensure that trade moves smoothly, criminals are stopped at sea, and those in danger are rescued.
 USA_naval_bombers: "Военно-морские бомбардировщики" # Naval Bombers
 USA_naval_bombers_desc: "Морская авиация – это будущее войны в открытом море. Мы должны обеспечить, чтобы наши авиационные разработки были способны запускаться с авианосцев и уничтожать флот противника, не ставя под угрозу даже свой собственный." # Naval aviation is the future of warfare on the high seas. We should ensure that our air designs are capable of being launched from carriers and destroying the enemy fleet without even endangering our own.
 USA_recruit_new_admirals: "Нанимайте новых адмиралов" # Recruit New Admirals
 USA_recruit_new_admirals_desc: "В условиях кризиса многие адмиралы совершили величайшее предательство – дезертирство. Мы должны подготовить новое поколение военно-морских лидеров, чтобы обеспечить дальнейшее господство на море." # In the face of crisis, many admirals committed the greatest treason - desertion. We should train a new generation of naval leaders to ensure our continued maritime dominance.
 USA_maritime_industry: "Морская индустрия" # Maritime Industry
 USA_maritime_industry_desc: "Америка имеет военно-морские традиции, с которыми могут соперничать только великие державы Европы, и столь же выдающуюся историю военно-морского производства и инноваций. Теперь, когда верфи и торговый флот значительно улучшились, давайте сосредоточимся на оптимизации и лучшей интеграции все более национального процесса военно-морского производства." # America has a naval tradition rivalled only by the great powers of Europe, and an equally illustrious history of naval production and innovation. With the dockyards and merchant marine now much improved, let us focus on streamlining and better integrating the increasingly national process of naval production.
 USA_new_dockyards: "Новые верфи" # New Dockyards
 USA_new_dockyards_desc: "Наши верфи несколько недостаточны для ведения войны в одиночку. Нам необходимо обеспечить строительство новых военно-морских производственных мощностей для поддержки военных усилий." # Our dockyards are somewhat inadequate to fight a war on their own. We need to ensure that new naval production facilities are constructed to support the war effort.
 USA_liberty_ships: "Свобода Корабли" # Liberty Ships
 USA_liberty_ships_desc: "Наши верфи, ранее занимавшиеся коммерческим судоходством, можно легко переоборудовать для производства огромного количества конвоев для снабжения наших союзников по всему миру." # Our shipyards, previously dedicated to commercial shipping, can easily be converted to produce massive numbers of convoys to supply our allies around the world.
 USA_better_batteries: "Лучшие батареи" # Better Batteries
 USA_better_batteries_desc: "Пока наши корабли активно модернизируются, нам также необходимо убедиться, что наше военно-морское оборудование, которое мы размещаем на этих кораблях, соответствует современному уровню." # While our ships are being actively modernized, we also need to make sure that our naval equipment we are putting inside these warships are state of the art.
 USA_locked_and_loaded: "Заблокировано и загружено" # Locked n' Loaded
 USA_locked_and_loaded_desc: "Благодаря нашим обширным инвестициям в военно-морские исследования и строительство, мы вернули себе место одной из ведущих военно-морских держав мира. Якоря прочь!" # Following our extensive investments into naval research and construction, we have regained our place as one of the world's leading naval powers. Anchors away!
# Elections
 USA_elections_of_1936: "Выборы 1936 года" # Elections of 1936
 USA_elections_of_1936_desc: "Последний срок президента Кертиса подходит к концу, и в ноябре американское население выберет своего нового президента." # The final term of President Curtis is coming to an end and on November the American populace will elect their new President.
 USA_elections_of_1936_tt: "§GЭтот фокус будет автоматически пропущен после начала выборов 1936 года.§!" # §GThis focus will be automatically bypass once the 1936 Elections has commenced.§!
 USA_president_long: "Президент Лонг" # President Long
 USA_president_long_desc: "Прогрессизм является самым популярным брендом в стране, поскольку американцы надеются на то, что наша партия приведет их к будущему, в котором всем будут предоставлены равные условия, поскольку мы продолжаем продвигать социальную справедливость и общественное доверие для общественности." # Progressivism in the most popular brand in the country as Americans look to our party to lead them to a future where all are given a square deal as we continue to promote social justice and public trusts for the public.
 USA_president_long_tt: "§GЭтот фокус будет автоматически отключен, как только Хьюи Лонг выиграет выборы 1936 года.§!" # §GThis focus will be automatically bypass once Huey Long has won the 1936 Elections.§!
 USA_president_roosevelt: "Президент Рузвельт" # President Roosevelt
 USA_president_roosevelt_desc: "Либералы победили на выборах, поскольку наши граждане верят в смешанную экономику, а наши бюрократические системы безопасности способствуют как максимальной эффективности, так и большему благосостоянию простых людей." # The Liberals have won election as our citizens trust in a mixed economy as our bureaucratic safety nets promote both maximum efficiency and greater well-being for the common man.
 USA_president_roosevelt_tt: "§GЭтот фокус будет автоматически обойден, как только Квентин Рузвельт выиграет выборы 1936 года.§!" # §GThis focus will be automatically bypass once Quentin Roosevelt has won the 1936 Elections.§!
 USA_president_landon: "Президент Лэндон" # President Landon
 USA_president_landon_desc: "Похоже, что про-индустриальный подход Республиканской партии к политике невмешательства был оправдан, поскольку Соединенные Штаты поручили ей принести процветание Америке с помощью своей программы. Они уверены, что с новым мандатом они смогут сделать именно это." # It appears that the pro-industry, laissez-faire ways of the Republican Party have been vindicated as the United States entrust them to bring prosperity to America with their agenda. With a new mandate, they are confident they will be able to do just that.
 USA_president_landon_tt: "§GЭтот фокус будет автоматически отключен, как только Альфред Лэндон выиграет выборы 1936 года.§!" # §GThis focus will be automatically bypass once Alfred Landon has won the 1936 Elections.§!
 USA_president_garner: "Президент Гарнер" # President Garner
 USA_president_garner_desc: "Демократическая партия добилась некоторых успехов со времен Первой гражданской войны. Сейчас мы начинаем новую эру популярности в нашей стране, и мы должны использовать это в своих интересах. Аморальные практики, такие как частичная нагота и алкоголизм, следует поощрять, а то и полностью запретить. В то же время мы должны поддерживать фермеров, которые являются основой Америки, и рабочих, которые обеспечивают функционирование нашей страны." # The Democratic Party has seen some successes since the First Civil War. Now we are beginning a new era of popularity in our country, and we should use it to our advantage. Immoral practices such as partial nudity and alcoholism should be discouraged if not outright banned. At the same time, we must support farmers, who are the backbone of America, and workers, who make our country function.
 USA_president_garner_tt: "§GЭтот фокус будет автоматически отключен, как только Джон Нэнс Гарнер выиграет выборы 1936 года.§!" # §GThis focus will be automatically bypass once John Nance Garner has won the 1936 Elections.§!
 USA_start_welfare_for_the_poor: "Начните благотворительность для бедных" # Start Welfare for the Poor
 USA_start_welfare_for_the_poor_desc: "Местное и государственное благосостояние расширялось с конца 20-го века, но на данный момент их ресурсов, как известно, не хватает. Мы должны координировать свои действия с местными органами власти и предприятиями, чтобы сделать местные формы социального обеспечения, такие как продовольственная и денежная помощь, более эксклюзивными для овдовевших матерей, а также ужесточить выплаты местным работникам, чтобы сосредоточить внимание на действительно инвалидах." # Local and state welfare had been expanding since the late 20th century but their resources are famously short as of now. We should coordinate with local governments and businesses to make local forms of welfare such as food and cash relief more exclusive to widowed mothers and tighten local workers compensation to focus on the truly disabled.
 USA_economic_reforms: "Экономические реформы" # Economic Reforms
 USA_economic_reforms_desc: "Закон о банках потребует определенного объема резервов и процентных ставок по депозитам в банках-членах, а также предоставит Совету управляющих контроль над некоторыми инструментами денежно-кредитной политики. Совет также будет иметь полномочия устанавливать учетные ставки в каждом округе Федеральной резервной системы." # The Bank Act will resquire a certain amount of reserves and interest rates for deposits at member banks, as well as giving the Board of Governors contorl over some tools of monetary policy. The Board will also have authority over discount rates in each Federal Reserve district.
 USA_secure_workers_rights: "Защитить права работников" # Secure Workers' Rights
 USA_secure_workers_rights_desc: "Рабочие должны быть защищены от эксплуатации. Те, кто получил травмы на рабочем месте, будут защищены этим новым пакетом законов, который позволяет заменять заработную плату таким работникам. Наши братья-инвалиды тоже заслуживают достоинства." # Workers must be protected from exploitation. Those who are injured in the workplace will be provided for by this new round of legislation, which allows wage replacement for such workers. Our disabled bretheren deserve dignity too.
 USA_share_our_wealth: "Поделитесь нашим богатством" # Share our Wealth
 USA_share_our_wealth_desc: "Пришло время богатым отдать свою справедливую долю. Ни одному человеку не будет разрешено накапливать более чем в 300 раз превышающий годовой национальный доход. Доходы ограничены $$1 млн, а наследство ограничено $$5,1 млн. Президент Лонг докажет газетам, которые его осуждали, неправоту." # It has come time for the rich to give their fair share. No person will be allowed to accumulate more than 300 times the annual national income. Incomes are capped at $$1 million, and inheritances capped at $$5.1 million. President Long will prove the newspapers who decried him wrong.
 USA_improve_interstate_infrastructure: "Улучшение межгосударственной инфраструктуры" # Improve Interstate Infrastructure
 USA_improve_interstate_infrastructure_desc: "Одним из немногих надежных преимуществ, которые правительство может обеспечить для экономики, является инфраструктура, которая помогает облегчить бизнес по всей стране. Давайте продолжим эти национальные проекты в стиле Авраама Линкольна." # One of the few reliable positives the government can provide for the economy is infrastructure, which helps faciliatate business around the nation. Let us continue these national projects in the style of Abraham Lincoln
 USA_free_basic_education: "Бесплатное базовое образование" # Free Basic Education
 USA_free_basic_education_desc: "Фермерских детей часто не пускают в школу под предлогом того, что они нужны в качестве рабочих на ферме. Этого больше не будет. Мы будем инвестировать в сельские школы, а также в другие методы сельского образования, чтобы каждый ребенок в нашей стране мог получить образование, которого он заслуживает." # Farm children are often kept out of school, with the excuse that they are needed as hands on the farm. This will no longer be the case. We will invest in rural schools as well as other methods of rural education so that every child in our country can receive the education they deserve.
 USA_import_regulation: "Правила импорта" # Import Regulations
 USA_import_regulation_desc: "Мы должны быть защищены от иностранной конкуренции любой ценой, если мы хотим оставаться самостоятельными. В этом начинании необходимы высокие тарифы практически на все товары, за исключением некоторых сельскохозяйственных товаров, а получаемые в результате доходы направляются на национальные проекты и существующие услуги." # We must be protected from foreign competition at all costs if we are to remain self-reliant. High tariffs for virtually all goods, with the exception of some agricultural goods, is needed in this endeavor, with the resulting income going to national projects and existing services.
 USA_new_industries: "Новые отрасли" # New Industries
 USA_new_industries_desc: "Нам необходимо еще больше ослабить последствия Великой депрессии, и один из способов сделать это — создать больше отраслей, которые могут приносить прибыль и, в свою очередь, еще больше стимулировать нашу экономику." # We need to further loosen the effects of the Great Depression, and one way of making that is to create more industries that can be profitted and in turn boost our economy even more.
 USA_tax_reforms: "Налоговые реформы" # Tax Reforms
 USA_tax_reforms_desc: "В идеале налогообложение должно обеспечивать баланс между возможностью людям иметь достаточно денег, чтобы тратить их на потребительские товары и предметы роскоши, и поддержкой государственных программ. Налоговый план [Root.GetRulingParty] гарантирует, что именно так и будет." # Ideally, taxation should strike a balance between allowing people to still have enough money to spend on consumer and luxury goods, and supporting government programs. The [Root.GetRulingParty]'s tax plan ensures this will be the case.
 USA_agricultural_adjustment_act: "Закон о регулировании сельского хозяйства" # Agricultural Adjustment Act
 USA_agricultural_adjustment_act_desc: "Есть много идей, как помочь нашим фермерам в условиях этого кризиса. Одна из идей гласит, что мы должны создать AAA, который повысит цены на сельскохозяйственную продукцию для фермеров, одновременно сокращая излишки. Правительство будет использовать это, чтобы гарантировать, что их фермеры смогут остаться на плаву в эти отчаянные времена." # There are many ideas for how to help our farmers in this crisis. One idea states that we should create the AAA, which will boost agricultural prices for farmers while reducing surpluses. The government will use this to ensure their farmers can stay afloat in these desperate times.
 USA_light_the_union: "Зажги Союз" # Light the Union
 USA_light_the_union_desc: "Будет создана Федеральная энергетическая комиссия; эта комиссия была создана с целью создания гидроэнергетических проектов на государственной земле, а также регулирования электроэнергетической и газовой промышленности. Мы можем внимательно следить за этими компаниями, одновременно укрепляя нашу энергетику и инфраструктуру." # The Federal Power Commission will be created; this commission has been created with the goal of creating hydroelectric projects on government land, as well as regluating the electric and natural gas industries. We can keep a close eye on these companies while simultaneously bolstering our energy and infrastructure.
 USA_second_homestead_act: "Закон о второй усадьбе" # Second Homestead Act
 USA_second_homestead_act_desc: "Поскольку из-за Великой депрессии многие стали бездомными, нам необходимо восстановить дома и переселить людей из огромных лагерей беженцев, которые разрослись по всей стране." # With many homeless due to the Great Depression, we need to rebuild houses and resettle people from the massive refugee camps that have sprouted up all over the country.
 USA_federal_pensions_reform: "Федеральная пенсионная реформа" # Federal Pensions Reform
 USA_federal_pensions_reform_desc: "Мы обеспечим, чтобы наши пожилые близкие могли уйти на пенсию достойно. Родители больше не будут обузой для своих детей. Вместо этого мы внедрим систему, в которой работники смогут платить в фонд, из которого они смогут получать средства после выхода на пенсию. Наши пожилые люди проживут остаток своей жизни порядочно, больше не стыдясь своего возраста." # We will ensure that our elderly loved ones can retire with dignity. No longer will parents be a burden on their children. Instead, we will implement a system in which workers can pay into a fund that they will be able to draw from after retirement. Our elderly will live the rest of their lives in decency, no longer ashamed of their age.
 USA_increase_tariffs: "Снижение тарифов" # Decrease Tariffs
 USA_increase_tariffs_desc: "Свободная торговля является основой сильной экономики. Мы должны обеспечить снижение тарифов и снятие барьеров для свободной торговли с нашими союзниками и нейтральными странами по всему миру." # Free trade is the building block of a strong economy. We should ensure that tariffs are struck down, and that barriers to free trade are lifted with our allies and neutral countries around the globe.
 USA_economic_investments: "Экономические инвестиции" # Economic Investments
 USA_economic_investments_desc: "Одним из многих непризнанных вкладов Гувера в развитие страны является RFC, который будет предоставлять кредиты банкам и другим секторам, которые не соответствуют требованиям Федеральной резервной системы. Пока его полномочия ограничены и он лучше финансируется, он будет способствовать нашим усилиям." # Amongst one of many of Hoover's unrecognized contributions to the nation include the RFC, which would give loans to banks and other sectors that did not qualify for the Federal Reserve. So long as its powers are limited and it is better funded it will aid our efforts.
 USA_compact_with_the_workers: "Договор с рабочими" # Compact with the Workers
 USA_compact_with_the_workers_desc: "Не все профсоюзы являются гнездами социализма. Некоторые на самом деле выступают за улучшение положения рабочего класса, а не просто продвигают эгоистические цели своих лидеров. Мы должны поддерживать эти профсоюзы, чтобы защитить наших рабочих и подорвать синдикалистскую деятельность, все еще скрывающуюся в стране." # Not all unions are nests of socialism. Some actually stand for the betterment of the working class, rather than just advancing the selfish goals of their leaders. We should support these unions, both to protect our workers and undercut syndicalists still hiding in the country.
 USA_nationwide_social_security: "Общенациональное социальное обеспечение" # Nationwide Social Security
 USA_nationwide_social_security_desc: "Современная система социального обеспечения даст пожилым людям возможность спокойно выйти на пенсию и получить финансовую безопасность, а также обеспечит широкую общественную поддержку нашей администрации." # A modern Social Security system will give the elderly the ability to retire in peace and financial security, and generate a great deal of popular support for our administration
 USA_economic_rehabilitation: "Экономическая реабилитация" # Economic Rehabilitation
 USA_economic_rehabilitation_desc: "Сбалансированный бюджет является ключом к управлению любым государством. Никакой этой чепухи о «дефицитных расходах». Мы должны тратить только то, что зарабатываем, и ни центом больше." # A balanced budget is key in running any state. None of this 'deficit spending' nonsense. We should only spend what we make, and not a cent more.
 USA_education_for_all: "Образование для всех" # Education for All
 USA_education_for_all_desc: "Самые богатые бизнесмены обычно посещали небольшую группу элитных университетов, таких как Лига плюща, Стэнфорд и Чикагский университет. Мы должны создавать стипендии, чтобы те, кому повезло меньше, могли также посещать эти маяки обучения." # The richest businessmen usually attended a small set of elite universities, like the Ivy Leagues, Stanford, and the University of Chicago. We should create scholarships to ensure that those less fortunate can also attend these beacons of learning.
 USA_bridge_the_racial_gap: "Преодолеть расовый разрыв" # Bridge the Racial Gap
 USA_bridge_the_racial_gap_desc: "Нет никаких причин, по которым черные и белые не могут жить вместе в гармонии. Пока поддерживаются семейные ценности, а тяжелая работа остается американской традицией, нет причин противостоять интеграции. Мы будем проводить эту политику как можно скорее, независимо от того, что могут сказать наши критики." # There is no reason why Blacks and Whites cannot live together in harmony. As long as family values are upheld, and hard work remains an American tradition, there is no reason to oppose integration. We will pursue this policy as soon as possible, regardless of what our critics might say.
 USA_develop_the_rural_regions: "Развивайте сельские регионы" # Develop the Rural Regions
 USA_develop_the_rural_regions_desc: "Некоторые регионы, особенно на Среднем Западе и Юге, не настолько промышленно развиты, как в северной части. Мы должны спонсировать программы развития этих регионов, которые могут способствовать восстановлению нашей больной экономики." # Some regions, particularly in the Midwest and the South aren't industrialized as much as in the northern part. We must sponsor programs in order to develop these regions that can contibute to recover our ailing economy.
 USA_public_works_administration: "Управление общественных работ" # Public Works Administration
 USA_public_works_administration_desc: "Нам нужно уничтожить два по цене одного и бороться как с безработицей, так и с отсталостью в развитии, которая представляет угрозу национальной безопасности. Управление общественных работ наймет большое количество людей для строительства крупных общественных проектов, таких как плотины, мосты и автомагистрали. Это может быть дорого, но надежда, которую это дает Америке, бесценна." # We need to knock out two for the price of one and combat both the unemployment and under-development that poses a national security risk. The Public Works Administration will hire a large swath of people to build massive public projects such as dams, bridges, and highways. It may be expensive, but the hope it offers America is priceless.
 USA_hydroelectric_conquest: "Гидроэлектрическое завоевание" # Hydroelectric Conquest
 USA_hydroelectric_conquest_desc: "Плотины имеют много целей в нашем обществе; От источника энергии и чистой воды до регулятора наводнений — эти чудеса технологии навсегда изменят наше общество. Мы должны сделать все возможное, чтобы способствовать их строительству и инвестировать в дальнейшие технологии плотин." # Dams have many purposes in our society; from being a source of power and clean water to a controller of floods, these marvels of technology will change our society forever. We must do everything we can to promote their construction and invest in further Dam technology.
 USA_industrial_recovery_program: "Программа восстановления промышленности" # Industrial Recovery Program
 USA_industrial_recovery_program_desc: "Хотя Республиканская партия и не выступает против всей торговли, она уже давно занимает позицию защиты наших молодых отраслей от иностранной конкуренции, в то время как они уже участвуют во внутренней конкуренции, чтобы мы могли развиваться быстрее." # While not opposed to all trade it has long been the position of the Republican Party to protect our infant industries from foreign competition while they already engage in domestic competition so that we may develop more quickly.
 USA_ensure_press_freedoms: "Обеспечить свободу прессы" # Ensure Press Freedoms
 USA_ensure_press_freedoms_desc: "Наши самые опасные враги разгромлены, и мы можем, наконец, положить конец череде газет и репортеров, стремящихся к разрушению государства! Закон о регулировании СМИ позволит новому отделу радиовещания Федеральной полиции составить список видных радикалов и немедленно запретить их публикации, прежде чем против Америки сформируется очередная попытка государственного переворота." # Our most dangerous foes have been quashed and we can finally end the litany of newspapers and reporters whom seek the destruction of the state! The Media Regulation Act will allow the new Broadcasting Division of the Federal Police to assemble a list of prominent radicals and ban their publications at once before another coup attempt forms against America.
 USA_increase_public_salaries: "Снижение государственных зарплат" # Decrease Public Salaries
 USA_increase_public_salaries_desc: "Сейчас не время тратить деньги на высокие государственные зарплаты. Закон об экономике сократит государственные зарплаты почти на полмиллиарда долларов, тем самым приближая нас к сбалансированному бюджету, а вместе с ним и к доверию инвесторов." # This is no time to be spending money on high government salaries. The Economy Act will slash government salaries by nearly half a billion dollars thus pushing us closer to a balanced budget and with it investor confidence.
 USA_banking_reforms: "Банковские реформы" # Banking Reforms
 USA_banking_reforms_desc: "Этот закон потребует определенного объема резервов и процентных ставок по депозитам в банках-членах, а также предоставит Совету управляющих контроль над некоторыми инструментами денежно-кредитной политики. Совет также будет иметь полномочия устанавливать учетные ставки в каждом округе Федеральной резервной системы." # This act will resquire a certain amount of reserves and interest rates for deposits at member banks, as well as giving the Board of Governors contorl over some tools of monetary policy. The Board will also have authority over discount rates in each Federal Reserve district.
 USA_lower_the_income_tax: "Снизить подоходный налог" # Lower the Income Tax
 USA_lower_the_income_tax_desc: "Подоходный налог стал бременем для простого человека в Америке, и мы должны найти способ его снизить, потому что для них важен каждый цент." # The income tax has been a burden for the common man in America, we must find a way to decrease it because for them, every cent counts.
 USA_private_partnerships: "Частное партнерство" # Private Partnerships
 USA_private_partnerships_desc: "Малый бизнес был основой американской экономики, пока многие из них не были уничтожены во время Гражданской войны. Нам следует изучить налоговые льготы и другие стратегии для восстановления доверия малого бизнеса." # Small businesses were the backbone of the American economy, until many were destroyed in the Civil War. We should look into tax incentives and other strategies to restore small business confidence.
 USA_bureaucratic_reforms: "Бюрократические реформы" # Bureaucratic Reforms
 USA_bureaucratic_reforms_desc: "Существует масса препятствий для проведения даже самых элементарных сделок с правительством, но сократив и убрав некоторые процедуры в этих сделках, мы можем гарантировать, что обычный человек сможет заключать сделки с правительством гораздо быстрее и с большим удовлетворением." # There are tons of hoops to get through even the most basic transactions with the government, but cutting and removing some procedures in these transactions, we can ensure that the common man can transact with the government much faster and much satistified.
 USA_privitization_of_services: "Приватизация услуг" # Privitization of Services
 USA_privitization_of_services_desc: "Некоторые второстепенные государственные услуги находятся в ведении правительства из-за такого низкого финансирования. Некоторые в правительстве предлагают их приватизировать, чтобы сделать их услуги эффективными и действенными." # Some non-essential public services are being handled by the government, having such low funding. Some in the government proposes to privatize them, in order to make their services effective and efficient.
 USA_mining_grants: "Гранты на добычу полезных ископаемых" # Mining Grants
 USA_mining_grants_desc: "Крупный бизнес, такой как горнодобывающие компании, также пострадал от Великой депрессии, и, как и малый бизнес, необходимо вмешательство правительства, чтобы полностью восстановить довоенную прибыльность." # Larger business such as mining companies also suffered in the Great Depression, and just like smaller businesses need government intervention to be fully restored to their pre-war profitability.
 USA_review_the_anti_trust_laws: "Ознакомьтесь с антимонопольным законодательством" # Review the Anti-Trust Laws
 USA_review_the_anti_trust_laws_desc: "Корпоративная эксплуатация рабочего класса была основной причиной подъема социализма в бывшей Российской империи. Нам необходимо развалить крупнейшие банки и другие промышленные конгломераты, чтобы подобное не повторилось." # Corporate exploitation of the working class was a major reason for the rise of the socialism in the former Russian Empire. We need to break up the largest banks and other industrial conglomerates to prevent this from occurring again.
 USA_pass_the_workers_relations_act: "Принять Закон об отношениях с трудящимися" # Pass the Workers Relations Act
 USA_pass_the_workers_relations_act_desc: "WRA проделает долгий путь для защиты американских рабочих. Мы планируем установить минимальную заработную плату, выплатить оплату за сверхурочную работу и ввести более жесткие стандарты занятости молодежи. Эти меры будут иметь большое значение для сдерживания плохого обращения корпораций с работниками, а также будут способствовать укреплению экономики." # The WRA will go a long way to protect American workers. We plan to establish a minimum wage, give overtime pay, and implement harsher youth employment standards. These measures will go a long way in curbing corporate mistreatment of workers while also bolstering the economy
 USA_medical_emergency_fund: "Фонд неотложной медицинской помощи" # Medical Emergency Fund
 USA_medical_emergency_fund_desc: "Когда наши граждане заболевают, они должны платить за право на жизнь. Это аморально, но, что еще хуже, это приводит людей в объятия ложно-заботливых марксистов. Вариант государственного здравоохранения обеспечит всеобщее медицинское обслуживание, финансируемое за счет увеличения подоходного налога, чтобы все могли пользоваться своим естественным правом на жизнь." # When our citizens fall ill they are expected to pay for the right to live. This is immoral but worse, it drives the people in the arms of the faux-caring Marxists. A public healthcare option will provide universal health care, funded by an increase in the income tax, so that all may enjoy their natural right to life.
 USA_morality_and_values: "Мораль и ценности" # Morality and Values
 USA_morality_and_values_desc: "Пассивная пропаганда гражданского правительства посредством возвышенных публикаций была резко подорвана брошюрами и частными издательствами, которые пропагандировали негражданское правительство. Конгресс решил, что многогранный подход к привитию американских ценностей через средства массовой информации, наконец, подорвет памфлетистов." # The passive promotion of civil government through high minded publications was undercut sharply by pamphlets and private publishers that promoted an uncivil government. Congress has decided that a multifaceted approach to instilling American values through mass media will finally undercut pamphleteers.
 USA_limit_union_activities: "Ограничить деятельность профсоюза" # Limit Union Activities
 USA_limit_union_activities_desc: "Поскольку рабочие профсоюзы были связаны с социализмом и радикализмом, пришло время развалить их навсегда, прежде чем они создадут какие-либо проблемы." # As the worker unions been nested with socialism and radicalism, it's time to break them up for good before they cause any trouble.
 USA_centers_for_higher_learning: "Центры высшего образования" # Centers for Higher Learning
 USA_centers_for_higher_learning_desc: "Высшее образование уже давно стало бастионом элиты, и его следует сохранить таким. Престижные залы Лиги Плюща – не место для неподготовленных. Их следует оставить для будущих лидеров Америки, чтобы они могли получить наилучшее образование." # Higher education has long been a bastion of the elite, and it should be kept that way. The prestigious halls of the Ivy Leagues are no place for those not prepared. They should be reserved for the future leaders of America, so they can receive the best education possible.
 USA_construction_subsidies_desc: "Чтобы построить больше инфраструктуры и объектов, которые мы сможем использовать и улучшить нашу экономику, мы должны субсидировать строительную отрасль, чтобы они производили больше и строили больше." # In order to build more infrastructure and facilities that we can utilitize and improve our economy, we must subsidize the construction industry section for them to make more and build more.
 USA_expand_public_housing: "Расширить государственное жилищное строительство" # Expand Public Housing
 USA_expand_public_housing_desc: "Поскольку из-за Великой депрессии многие стали бездомными, нам необходимо восстановить дома и переселить людей из огромных лагерей беженцев, которые разрослись по всей стране." # With many homeless due to the Great Depression, we need to rebuild houses and resettle people from the massive refugee camps that have sprouted up all over the country.
 USA_improve_urban_infrastructure: "Улучшение городской инфраструктуры" # Improve Urban Infrastructure
 USA_improve_urban_infrastructure_desc: "Одним из немногих надежных преимуществ, которые правительство может обеспечить для экономики, является инфраструктура, которая помогает облегчить бизнес по всей стране. Давайте продолжим эти национальные проекты в стиле Авраама Линкольна." # One of the few reliable positives the government can provide for the economy is infrastructure, which helps faciliatate business around the nation. Let us continue these national projects in the style of Abraham Lincoln.
 USA_fight_inflation_struggles: "Борьба с инфляцией" # Fight Inflation Struggles
 USA_fight_inflation_struggles_desc: "Нам нужна комплексная реформа нашей финансовой и банковской системы. Сокращение бюрократической волокиты, ненужных правил и других препятствий на пути к успеху – это то, что нужно этой стране после экономической катастрофы." # We need a comprehensive reform of our finance and banking system. Cutting back red tape, unnecessary regulations, and other roadblocks to success are what this country needs after the economic catastrophe.
 USA_recovery_from_the_depression: "Восстановление после депрессии" # Recovery from the Depression
 USA_recovery_from_the_depression_desc: "Последствия экономической катастрофы, которую республиканцы принесли в Америку, наконец, исчезают. Средний американец больше не может прокормить себя и свою семью. Боже, благослови Америку!" # The effects of the economic catastrophe the Republicans brought into American are finally fading. No longer the average American cannot feed himself and or his own family. God Bless America!
# Foreign
 USA_america_on_the_world_stage: "Америка на мировой арене" # America on the World Stage
 USA_america_on_the_world_stage_desc: "Нация столкнулась с некоторыми проблемами, которые означали, что она не могла действовать как международная держава, а не так, как она того заслуживает, - но теперь ситуация изменилась. Америка готова вновь выйти на мировую арену." # The nation has seen some troubles which meant it could not act as an international power, not as it deserves to be - but that has now changed. America is ready to re-enter the world stage.
 USA_continue_isolation: "Продолжить изоляцию" # Continue Isolation
 USA_continue_isolation_desc: "Америка прошла через ад, и нам еще не пришло время ввязываться в зарубежные трудности. Мы должны заботиться о своем доме, следить за тем, чтобы он был в порядке, и защищать наши стены, если враги постучатся в наши двери." # America has been through hell, and the time has not yet come for us to become embroiled in foreign difficulties. We must look to our home, ensure it is in order, and defend our walls should enemies come knocking on our doors.
 USA_fortify_the_northern_border: "Укрепите северную границу" # Fortify the Northern Border
 USA_fortify_the_northern_border_desc: ""
 USA_patrol_the_seas: "Патрулируйте моря" # Patrol the Seas
 USA_patrol_the_seas_desc: "Сильный военно-морской флот важен для обороны, и возможности военно-морского флота должны быть инвестированы, чтобы сдерживать имперскую власть, поскольку это их единственный способ достичь нас." # A strong navy is important to defense and the navies capabilities shall be invested in to keep away imperial power as that is their only means of reaching us.
 USA_defensive_tactics: "Оборонительная тактика" # Defensive Tactics
 USA_defensive_tactics_desc: "Первым шагом в нашей защите должно стать обеспечение хорошей охраны наших стен. Миру следует опасаться американской военной мощи, но только если они решат вступить с нами в бой." # The first step in our defence must be to ensure our walls are well-guarded. The world should fear American military might, but only if they choose to engage us.
 USA_fortify_hawaii: "Укрепить Гавайи" # Reinforce Hawaii
 USA_fortify_hawaii_desc: "Гавайи — идеальное место для размещения наших военно-морских сил в Тихом океане. Контроль над этим океаном будет означать, что никто не сможет остановить нас в регионе, по крайней мере, как только эти возможности будут реализованы." # Hawaii is the ideal location to launch our naval capabilities throughout the Pacific. Controlling this ocean will mean that none can stop us in the region, at least once these capabilities are realized.
 USA_fortify_puerto_rico: "Пуэрториканские базы" # Puerto Rican Bases
 USA_fortify_puerto_rico_desc: "Остров Пуэрто-Рико является важной стратегической островной базой для проведения наступательных и оборонительных мер в случае иностранного вторжения. Расположение самого острова очень стратегическое, поскольку аэродромы на острове могут достигать Форталезы в Бразилии. Нам следует укрепить эту военно-морскую базу, поскольку во время войны ее будет слишком важно потерять." # The island of Puerto Rico is an important strategic island base to conduct either offensive and defensive measures in case of a foreign invasion. The location of the island itself is very strategic as airfields in the island can reach as far as Fortaleza, Brazil. We should fortify this naval base as it will be too important to lose in times of warfare.
 USA_pragmatic_trade: "Прагматичная торговля" # Pragmatic Trade
 USA_pragmatic_trade_desc: "Преимущество нейтралитета состоит в том, что у нас мало врагов и, следовательно, много наших торговых партнеров. Если Америка хочет превратиться в настоящую мировую державу, мы должны сделать это за счет могучего американского доллара." # Neutrality has its benefit in that our enemies are few, and thus our trading partners plentiful. If America is to build itself into a true world power, we must do so on the back of the mighty American dollar.
 USA_america_leaps_forward: "Америка делает шаг вперед" # America Leaps Forward
 USA_america_leaps_forward_desc: "Благодаря консолидации наших усилий и четкому сосредоточению внимания Соединенные Штаты вместе смогут прыгнуть вперед в наступающее столетие, значительно опередив остальной мир." # With our efforts consolidated and our focus clear, together the United States can leap forward into the coming century - well ahead of the rest of the world.
 USA_new_interventionism: "Новый интервенционизм" # New Interventionism
 USA_new_interventionism_desc: "Америке принадлежит место на мировой арене, и хотя мы не колеблемся перед втягиванием в иностранные альянсы, мы без колебаний будем использовать нашу военную мощь, чтобы искоренить угрозы по всему миру, которые в конечном итоге нас найдут." # America belongs on the world stage, and while we are hesitant to be drawn into foreign alliances we will not hesitate to use our military might to stamp out threats around the world that will eventually find us.
 USA_american_panama: "Американская Панама" # American Panama
 USA_american_panama_desc: "Когда Панама снова окажется в руках Америки, мы не повторим той ошибки, которую совершили когда-то, мы будем инвестировать, чтобы этот регион действительно стал нашим, и пошлем военных офицеров, чтобы растоптать оппозицию, прежде чем, наконец, отправить больше американцев жить там в роскоши, принося с собой процветание." # With Panama back in American hands we will not make the same mistake we once did, we will invest so that the region is truly ours and send military officers to stomp out opposition before finally sending more Americans to live there in luxury, bringing prosperity with them.
 USA_anti_imperialist_bulwark: "Антиимпериалистический оплот" # Anti-Imperialist Bulwark
 USA_anti_imperialist_bulwark_desc: "Америка должна занять твердую позицию против самой доминирующей формы тирании в сегодняшнем мире — империализма. Только те, кому его достижения угрожают, как и нам, являются нашими настоящими друзьями." # America must take a firm stance against the most dominant form of tyranny in the world today, imperialism. Only those who are threatened by its advances as we are are our true friends.
 USA_revive_old_alliances: "Возродить старые союзы" # Revive Old Alliances
 USA_revive_old_alliances_desc: "Мы больше не можем прятать голову в песок, если хотим защитить демократию. Антанта действительно наши единственные истинные либеральные друзья в этом мире, и мы должны помочь им восстановить свое место под солнцем." # We can no longer keep our heads in the sand if we are to protect democracy. The Entente are indeed our only true liberal friends in this world and we must help them reassert their place under the sun.
 USA_secure_cuba: "Безопасная Куба" # Secure Cuba
 USA_secure_cuba_desc: "Куба была местом отдыха Америки в Карибском бассейне из-за ее близости к Флориде. Это также причина, по которой Куба должна находиться под защитой Америки, чтобы, когда появится другая великая держава, они не могли угрожать материковой части Америки." # Cuba has been a America's vacation spot in the Caribbean due to its proximity from Florida, this is also the reason why Cuba should be under American protection, so that when another great power emerges, they cannot threathen the American mainland.
 USA_avenge_1812: "Ненавижу 1812 год" # Avenge 1812
 USA_avenge_1812_desc: "Начало нового мирового порядка часто требует падения старого. Конечно, постоянное желание Британии вмешиваться в наши дела, чтобы использовать нас в качестве своего инструмента, как они это делали столетия назад, делает легким призывом наконец позаботиться о том, чтобы Дом Виндзоров наконец научился уважать Соединенные Штаты. Канада почувствует, что мощь Америки и ее обширные земли используются в наших собственных целях, что станет достойным концом монархии и началом новой западной державы." # The start of a new world order often necessitates the fall of the old one. Of course, Britains constant desire to interfere in our affairs to use us as their instrument as they did centuries ago makes it an easy call to finally see to it that House of Windsor finally learns to respect the United States. Canada shall feel the might of America and their vast lands put towards our own use, a fitting end for the monarchy and start of a new Western Power.
 USA_carribean_lake: "Карибское озеро" # Caribbean Lake
 USA_carribean_lake_desc: "Доктрина Монро применима не только к Центральной и Южной Америке, но и к Карибскому региону. Эти страны должны находиться под защитой Америки ради их и нашего блага." # The Monroe Doctrine not only applies to Central and South America but also in the Caribbean, these countries should be under the protection of America for their and our own good.
 USA_the_banana_republics: "Банановые республики" # The Banana Republics
 USA_the_banana_republics_desc: "Южная и Центральная Америка действительно являются задним двором Америки, но мы также должны серьезно относиться к тому, что мы защищаем ее народ от великих держав и других форм тирании ради нашей и их безопасности." # South and Central America is indeed America's backyard but we must also take seriously that we are the protector of its people from Great powers and other forms of tyranny for our, and their, security.
 USA_the_banana_republics_tt: "£decision_icon_small §YРешения§! относительно §C, обеспечивающих защиту§! в странах Центральной Америки, будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! regarding §Coffering protection§! in Central American countries will be §Yunlocked§!
 USA_stop_radicalism_in_south_america: "Сдержать радикализм в Южной Америке" # Contain Radicalism in South America
 USA_stop_radicalism_in_south_america_desc: "Социализм, популизм и валькизм стали серьезной угрозой для нашей страны во время недавнего кризиса. Хотя мы, конечно, не поддерживаем империализм, переговоров с этими радикальными элементами не ведется. Мы займём решительную антирадикальную позицию и предупредим эти страны о том, чтобы они выступали против нас или не позволяли своим правительствам продолжать это делать." # Socialism, Populism and Valkism was a major threat to our country in the recent crisis. While we of course do not support imperialism, there is no negotiating with these radical elements. We will take a strong anti-radicalism stance and warn these nations of standing against us or keeping their government in the process of doing so.
 USA_stop_radicalism_in_south_america_tt: "£decision_icon_small §YРешения§! относительно §Cвосстановления демократии§! в радикально настроенных странах Южной Америки будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! regarding §Crestoring democracy§! to radicalized South-American countries will be §Yunlocked§!
 USA_demand_greenland: "Спрос Гренландия" # Demand Greenland
 USA_demand_greenland_desc: "Как такая маленькая страна может надеяться отобрать у нас столько территории, если это жизненно важно для наших интересов? Они примут наше предложение по территории или столкнутся с нашим гневом." # How can such a small nation hope to hold so much territory from us when it is vitally important to our interests? They shall aceept our offer for the territory or face our wrath.
 USA_atlantic_outposts: "Атлантические аванпосты" # Atlantic Outposts
 USA_atlantic_outposts_desc: "Мы не сможем захватить Европу без Атлантики и поэтому будем наращивать наши возможности там. Исландия могла бы стать идеальной отправной точкой, но пока неизвестно, будут ли они сотрудничать или нет. Стоит попробовать." # We can not take Europe without the Atlantic and as such will build our capabilities there. Iceland would be an ideal starting point but it is yet to be seen whether they will cooperate or not. It is worth a try.
 USA_blood_on_the_emerald_isle: "Кровь на Изумрудном острове" # Blood on the Emerald Isle
 USA_blood_on_the_emerald_isle_desc: "Ирландцы находились под сапогом британцев с момента основания нашей великой страны, и с нашей стороны было бы эгоистично не освободить их под игом тирании." # The Irish has been under the boot of the British even since our great country has founded, it will be selfish of us not to liberate them under the yoke of tyranny.
 USA_blood_on_the_emerald_isle_tt: "Будут доступны подрывные операции в направлении @ENG §Y[ENG.GetName]§!, что позволит нам §Gзапустить восстание§! на Изумрудном острове.\n\n" # Subversive operations towards @ENG §Y[ENG.GetName]§! will be available allowing us to §Glaunch an insurrection§! in the emerald isle.\n\n
 USA_stop_the_valkist_menace: "Остановите угрозу валкистов" # Stop the Valkist Menace
 USA_stop_the_valkist_menace_desc: "Государство валкистов в Германии одержало верх в сдерживании французов и их союзников на европейском континенте. Мы покажем им мощь американской военной машины." # The Valkist state in Germany have gained an upperhand in containing the French and their allies in the European continent. We will show them the might of the American war machine.
 USA_the_marshall_plan: "План Маршалла" # The Marshall Plan
 USA_the_marshall_plan_desc: "Европа, возможно, и была захвачена своим собственным правительством, но она все еще страдает от последствий войн, которые там происходили. Мы должны финансировать наших союзников с помощью программы грантов и помощи, разработанной генеральным штабом и нашими главными политическими советниками, чтобы они могли восстановиться более гладко." # Europe may have been retaken by its proper government but it still suffers from the fallout of the wars that took place there. We must fund our allies with a grant and aid program put together by the general staff and our top political advisors so they may rebuild more smoothly.
 USA_the_marshall_plan_tt: "£decision_icon_small §YРешения§! относительно §Cпредоставления субсидий§! нашим союзникам будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! regarding §Cproviding subsidies§! to our allies will be §Yunlocked§!
 USA_villainify_german_valkism: "Очернить немецкий валькизм" # Villify German Valkism
 USA_villainify_german_valkism_desc: ""
 USA_crush_the_socialist_threat: "Сокрушить социалистическую угрозу" # Crush the Socialist Threat
 USA_crush_the_socialist_threat_desc: "В последнее время Советский Союз предпринял довольно агрессивные шаги; возможно, мы могли бы показать им, что Земля Свободы не будет простаивать, пока они содержат свободу и свободу." # The Soviet Union have made pretty aggresive moves lately; maybe we could show them that the Land of the Free won't stand idle while they contain liberty and freedom.
 USA_our_pacific_friend: "Наш тихоокеанский друг" # Our Pacific Friend
 USA_our_pacific_friend_desc: "Филиппинцы получили заслуженную свободу в 1936 году; однако, возможно, они больше не являются нашими подданными, но наши страны по-прежнему могут быть друзьями и союзниками. Мы обратимся к нашим друзьям в Маниле, используя посла США на Филиппинах Пола МакНатта, чтобы помочь нам укрепить наш интерес к региону." # The Filipinos have gained their deserved freedom in 1936; however, they may not be our subjects anymore but our countries can still be friends and allies. We will approach our friends in Manila using American Ambassador to the Philippines Paul McNutt to help us bolster our interest in the region.
 USA_guam_forward_base: "Передовая база Гуама" # Guam Forward Base
 USA_guam_forward_base_desc: "Как и Гавайи, Гуам также является идеальным местом и базой для операций в Тихом океане. близость к Японии, Австралии, Инсулиндии и Филиппинам позволит нам нанести сокрушительный удар по этим странам в случае начала войны." # Just like Hawaii, Guam is also an ideal location and base of operations in the Pacific. it's proximity to Japan, Australia, Insulindia an the Philippines will allow us to deliver a devastating blow to these countries should war breaks out.
 USA_strike_japan: "Ударьте Японию" # Strike Japan
 USA_strike_japan_desc: "Пришло время нанести удар по нашему крупнейшему противнику на Тихом океане — самой Японской империи. Мы сделаем их дружественными нашим интересам силой, поскольку это единственный вариант, который остается нашему главному восточному сопернику." # It is time to strike our largest opponent in the Pacific, the Japanese Empire itself. We will make them friendly to our interests through force for it is the only option left for our main Eastern rival.
 USA_support_the_kuomintang: "Поддержите Гоминьдан" # Support the Kuomintang
 USA_support_the_kuomintang_desc: "Правительство Гоминьдана, возглавляемое [KMT.GetLeader], является одной из многих клик полевых командиров, существующих на материковой части Китая. Однако убеждения Гоминьдана совпадают с нашими собственными; защита свободы людей; и они ведут крестовый поход, пытаясь остановить империализм в Китае. Мы должны помочь им в их борьбе»." # The Kuomintang Government, lead by [KMT.GetLeader] are one of the many warlord cliques that exist in the Chinese mainland. However, the beliefs of the Kuomintang aligns with our own; safeguarding liberty of the people; and they are in a crusade in stopping imperialism on China. We must aid them on their fight.`
 USA_intervene_in_india: "Вмешательство в Индию" # Intervene in India
 USA_intervene_in_india_desc: ""
 USA_pacific_guardian: "Тихоокеанский страж" # Pacific Guardian
 USA_pacific_guardian_desc: "Тихий океан принадлежит нам и останется таковым после того, как будут осуществлены необходимые переброски войск и экономическая координация, чтобы сделать наших союзников полностью зависимыми от нас." # The Pacific is ours and will remain as such after the necessary troop movements and economic coordination is made to make our allies wholly dependent on us.
 USA_pacific_guardian_tt: "£decision_icon_small §YРешения§! относительно §Cзапроса господства§! над некоторыми колониями Юго-Восточной Азии будут §Yразблокированы§" # £decision_icon_small  §YDecisions§! regarding §Crequesting lordship§! over some South-East Asian colonies will be §Yunlocked§
 USA_giant_of_the_west: "Гигант Запада" # Giant of the West
 USA_giant_of_the_west_desc: "Мы взяли Запад штурмом, теперь нам нужно только стабилизировать наши претензии." # We have taken the West by storm now we need only stabilize our claims.
 USA_entente_alliance: "Антанта Альянс" # Entente Alliance
 USA_entente_alliance_desc: "Нам необходимо объединиться с Антантой, нашими братьями по капиталистической демократии, против экстремистов и враждебных имперских сил, которые могут угрожать нам обоим. Когда мы поможем им в борьбе с немцами, они станут буферной зоной." # We need to ally the Entente, our brethren in capitalist democracy, against the extremists and hostile imperial forces that would threaten us both. When we help them against the Germans they will be a buffer zone.
 USA_the_arsenal_of_democracy: "Арсенал демократии" # The Arsenal of Democracy
 USA_the_arsenal_of_democracy_desc: "Политика добрососедства требует внутренней программы подготовки оружия к будущим конфликтам. Этот «Арсенал демократии», как его называет президент, позволит нам поставлять военную технику даже в самые труднодоступные места на других континентах для борьбы с тиранией и валкизмом." # The Good Neighbor Policy necessitates an internal program to ready arms for future conflicts. This Arsenal of Democracy, as the President calls it, will enable us to supply war material to even the hardest to reach places on other continents in service of fighting tyranny and Valkism.
 USA_longer_reach: "Более широкий охват" # Longer Reach
 USA_longer_reach_desc: "Если мы хотим проецировать нашу мощь на остальной мир, мы должны добиться такой возможности посредством нашей военно-морской мощи." # If we are to project our power onto the rest of the world, we must achieve the ability to do so through our naval power.
 USA_entente_lend_lease: "Ленд-лиз Антанты" # Entente Lend-Lease
 USA_entente_lend_lease_desc: "Антанта крайне нуждается в нашей поддержке, и она получит ее вместе с оружием, которое мы построили." # The Entente badly requires our support and they shall receive it with the arms we have built.
 USA_entente_lend_lease_tt: "£decision_icon_small §YРешения§! относительно §C предоставления материальной поддержки§! нашим союзникам будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! regarding §Cproviding material support§! to our allies will be §Yunlocked§!
