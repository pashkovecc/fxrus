 USA_call_the_reservists_tt: "§CБудут сформированы новые дивизии с нашими резервистами§!" # §CNew divisions with our reservist units will be raised§!
 USA_call_the_reservists_desc: ""
 USA_recall_the_veterans: "Вспомним ветеранов" # Recall the Veterans
 USA_recall_the_veterans_tt: "§CНовые дивизии из наших отозванных ветеранов будут сформированы§!" # §CNew divisions with our recalled veteran soldiers will be raised§!
 USA_recall_the_veterans_desc: ""
