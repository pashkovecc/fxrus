### Opinions
 USA_reconciliation: "Примирение" # Reconciliation

### Events
 usa.0.t: "Государство старой славы" # The State of Old Glory
 usa.0.d: "Неспокойная история иностранного вмешательства Америки обострила ее отношения с крупными мировыми державами. Недавнее слияние партии Bull Moose с Республиканской партией подняло вопросы о наследии Теодора Рузвельта. Рузвельт стремился не допустить участия США в назревающей европейской войне, но столкнулся с проблемами, включая мобилизацию мексиканского националиста Виктора Каррансы в ответ на действия Америки. Декларация Циммермана еще больше усилила напряженность, что привело к войне, которая длилась с 1917 по 1919 год и привела к значительным жертвам среди американцев. Попытки Рузвельта заключить умеренный мир не увенчались успехом, что привело к расколу в американо-европейской дипломатии.\n\nФокус сместился на побежденного соседа, Мексику, и эксплуатацию ее ресурсов. После смерти Рузвельта последующие президенты столкнулись с проблемами, включая экономический спад 1929 года. Предстоящие выборы 1936 года, ознаменованные Великой депрессией, открывают выбор для нового направления внутренней и внешней политики на фоне подъема крайне правых и крайне левых движений. Соединенные Штаты оказались в шатком положении, поскольку они ориентируются в этой сложной динамике и стремятся переопределить свою роль в мире." # America's troubled history of foreign intervention has strained its relations with major world powers. The recent merger of the Bull Moose Party into the Republican Party has raised questions about Theodore Roosevelt's legacy. Roosevelt aimed to keep the US out of the brewing European war but faced challenges, including Mexican nationalist Victor Carranza's mobilization in response to American actions. The Zimmerman Declaration further escalated tensions, leading to a war that lasted from 1917 to 1919 and resulted in significant American casualties. Roosevelt's attempts at a moderate peace were unsuccessful, causing a rift in US-European diplomacy.\n\nThe focus shifted to the conquered neighbor, Mexico, and exploiting its resources. After Roosevelt's death, subsequent presidents faced challenges, including the economic downturn of 1929. The upcoming 1936 election, marked by the Great Depression, presents choices for a new direction in domestic and foreign policy, amid the rise of far-right and far-left movements. The United States finds itself in a precarious position as it navigates these complex dynamics and seeks to redefine its role in the world.
 usa.0.a: "Боже, благослови Америку!" # God bless America!
 usa.1.t: "Президентские выборы 1936 года" # The 1936 Presidential Election
 usa.1.d: "Наконец-то подведены итоги, вероятно, самых идеологически спорных президентских выборов, которые когда-либо были в Соединенных Штатах. Ни одна из четырех основных партий не набрала достаточного количества голосов в Коллегии выборщиков, чтобы полностью выиграть пост президента, и в результате Палате представителей приходится голосовать за победителя выборов во второй раз за это десятилетие. Вероятно, это еще не конец наших проблем, но пока победа достается..." # The results are finally in from what has probably been the most ideologically contested Presidential election the United States has ever witnessed. None of the four major parties have secured enough votes in the Electoral College to outright win the presidency, and as a result, the House of Representatives has to vote on the winner of the election for the second time this decade. This is probably not the end of our problems, but for the time being, victory goes to...
 usa.1.a: "Хьюи Лонг" # Huey Long
 usa.1.b: "Квентин Рузвельт" # Quentin Roosevelt
 usa.1.c: "Альф Лэндон" # Alf Landon
 usa.1.e: "Джон Нэнс Гарнер" # John Nance Garner
 usa.2.t: "Паника в Хьюстоне" # Panic in Houston
 usa.2.d: "Сегодня утром в Хьюстоне, штат Техас, произошел взрыв, в результате которого несколько человек погибли и еще неисчислимое количество ранено. Среди главных подозреваемых в инциденте - мексиканские националисты, хотя местная полиция еще не исключила наличие внутриполитической группировки. На месте происшествия находится то, что офицеры идентифицировали как флаг мексиканского штата, хотя необходимо будет провести дополнительные судебно-медицинские исследования. Предполагается, что целью атаки стал железнодорожный и транспортный узел в городе, но какой именно, пока неизвестно. Однако известно, что политический климат в стране резко ухудшился и дальше он, несомненно, будет только ухудшаться." # An explosion rocketed Houston, Texas this morning, causing several deaths and a currently untold number of injuries. Chief suspects of the incident include Mexican nationalists, though local police have not yet ruled out a domestic political group either. Included at the scene is what officers have been identifying as the flag of the Mexican State, though additional forensics research will have to be conducted. The target of the attack is believed to be a rail and trasportation hub in the city, but exactly which is not yet known, either. What is known, however, is that the political climate in the country has taken a drastic turn for the worse, and it will certianly only go downhill from here.
 usa.2.a: "Южный Змей..." # The Southern Serpent...
 usa.3.t: "Независимые ВВС?" # An Independent Air Force?
 usa.3.d: "ВВС США отстают от других ВВС, особенно в Европе. Британские и французские ВВС превосходят наши, что вызывает ряд тревожных сигналов.\n\nНам нужно определиться с нашими приоритетами для ВВС США.\n\nМы могли бы отдать приоритет бомбардировщикам, в конце концов, разрушение промышленности врага приведет к полной остановке их военной машины. С другой стороны, мы можем сосредоточиться на попытках добиться от ВВС США успеха. работать с армией, поддерживая ее в бою." # The U.S.A.F has been lagging behind other Airforces, notably those in Europe. The British and French Airforces dwarf ours, which raises a set of red flags.\n\nWe need to decide on our priorities for the U.S.A.F.\n\nWe could prioritize Bombers, after all, destroying the Enemy's industry will bring their war machine to a grinding halt. On the other hand, we can focus on attempting to get the U.S.A.F. to work with the Army by supporting them in combat.
 usa.3.a: "Зеленый свет созданию ВВС США" # Greenlight the creation of USAF
 usa.3.b: "Просто расширьте USAAC" # Just expand the USAAC
 usa.4.t: "США требуют восстановления государства-клиента" # USA demands restoration of the Client-state
 usa.4.d: "Северные ублюдки потребовали, чтобы националистическое правительство ушло в отставку и восстановило американское марионеточное правительство! Их делегация была так уверена, что мы уступим их мелочным требованиям..." # The Northern bastards have demanded that the Nationalist Government step down and restore the American Puppet Government! Their delegation was oh-so confident that we'd surrender to their petty demands...
 usa.4.a: "Идите к черту, проклятые янки." # Go to hell you goddamn Yanks.
 usa.4.b: "Мы должны уступить их требованиям..." # We must cave to their demands...
 usa.5.t: "[MEX.GetName] отказывается" # [MEX.GetName] Refuses
 usa.5.d: "Правительство [MEX.GetAdjective], что неудивительно, отклонило наши требования о восстановлении бывшего законного правительства до прихода к власти синархистов. Кажется, война неизбежна." # The [MEX.GetAdjective] Government have unsuprisingly refused our demands in restoring the former legitimate government before the Synarchists took power. It seems that war is inevitable.
 usa.5.a: "Если они хотят войны..." # If its a war they want...
 usa.6.t: "Майами Наводнения" # Miami Floods
 usa.6.d: "Прогнозируемый ураган вышел из строя, а в некоторых округах Флории, включая Майами, произошло сильное наводнение; затрагивающие жизни тысяч граждан, проживающих в этом районе. Некоторые правительственные чиновники требуют, чтобы мы оказали некоторую помощь тем, кто пострадал; но из-за крайних последствий экономического спада; есть также те, кто желает, чтобы правительство временно осталось глухим к ушам." # A forecasted hurricane went haywire can some of the counties in Floria including Miami has experienced some major flooding; affecting the lives of the thousands of citizens residing in the area. Some government officials are requesting that we must provide some aid to those who are affected; but due to the extreme effects of the economic recessions; there are also those who wish that the government should temporarily have some deaf ears.
 usa.6.a: "Нам нужно помочь людям" # We need to help the people
 usa.6.b: "Они могут сделать это без нашей помощи" # They can do this without our help
 usa.7.t: "Пограничная стычка" # Border Skirmish
 usa.7.a: "Поддержите их достойный крестовый поход!" # Endorse their worthy crusade!
 usa.7.b: "Мы не можем мириться с такими действиями" # We cannot condone such actions
 usa.8.t: "Пограничный город подвергся нападению" # Border City Attacked
 usa.8.d: "В тихий теплый день в Калифорнии к контрольно-пропускному пункту на мексикано-американской границе подъехал грузовик. Это зрелище вызвало бурю активности у дислоцированных людей — такого не наблюдалось со времени ужесточения законов об экстрадиции несколькими месяцами ранее. Один из рядовых подозвал грузовик с пистолетом наготове. Грузовик не остановился. Несмотря на то, что по нему было выпущено несколько патронов, он пробил деревянный забор, ведущий с одного участка дороги на другой. Заборы, которые тянулись на многие мили по обе стороны от контрольно-пропускного пункта в качестве дополнительной меры предосторожности, содрогнулись. Рядовой, слишком увлеченный тем, как другой грузовик проезжал под ливнем металла, повернулся к восходящему солнцу и увидел несколько других грузовиков, появляющихся из миража. Однако они шли другим курсом, прямо к морю. Прямо в Сан-Диего. Вскоре после этого слухи о нападении достигли Вашингтона. И армия, вскоре после этого." # On a quiet, warm day in California, a truck rolled to a checkpoint on the Mexican-American border. The sight started the stationed men in a flurry of activity- such a thing hadn't realy been seen since the tightening of extradition laws months earlier. One of the privates called to the truck, gun at the ready. The truck did not come to a halt. Even though several rounds of ammunition were fired into it, it burst through the wooden fence, leading from one stretch of the road to the other. The fences, which stretched for miles from either side of the checkpoint as an additional safety precaution quaked. The private, too caught up in seeing the other truck through in a shower of metal, turned into the rising sun to see several other trucks emerging through the mirage. They were on a different course however, directly to the see. Directly out to San Diego. Word of the attack reached Washington shortly after. And the military, not long after that.
 usa.8.a: "Объявите военное положение в регионе!" # Declare Martial Law in the effected region!
 usa.8.b: "Пусть полиция разбирается в ситуации" # Let the police handle the situation
 usa.9.t: "Мексиканские националисты атаковали приграничный район" # Mexican Nationalists attack border area
 usa.9.d: "В тихий теплый день в Калифорнии к контрольно-пропускному пункту на мексикано-американской границе подъехал грузовик. Это зрелище вызвало бурю активности у дислоцированных людей — такого не наблюдалось со времени ужесточения законов об экстрадиции несколькими месяцами ранее. Один из рядовых подозвал грузовик с пистолетом наготове. Грузовик не остановился. Несмотря на то, что по нему было выпущено несколько патронов, он пробил деревянный забор, ведущий с одного участка дороги на другой. Заборы, которые тянулись на многие мили по обе стороны от контрольно-пропускного пункта в качестве дополнительной меры предосторожности, содрогнулись. Рядовой, слишком увлеченный тем, как другой грузовик проезжал под ливнем металла, повернулся к восходящему солнцу и увидел несколько других грузовиков, появляющихся из миража. Однако они шли другим курсом, прямо к морю. Прямо в Сан-Диего. Вскоре после этого слухи о нападении достигли Вашингтона. И армия, вскоре после этого." # On a quiet, warm day in California, a truck rolled to a checkpoint on the Mexican-American border. The sight started the stationed men in a flurry of activity- such a thing hadn't realy been seen since the tightening of extradition laws months earlier. One of the privates called to the truck, gun at the ready. The truck did not come to a halt. Even though several rounds of ammunition were fired into it, it burst through the wooden fence, leading from one stretch of the road to the other. The fences, which stretched for miles from either side of the checkpoint as an additional safety precaution quaked. The private, too caught up in seeing the other truck through in a shower of metal, turned into the rising sun to see several other trucks emerging through the mirage. They were on a different course however, directly to the see. Directly out to San Diego. Word of the attack reached Washington shortly after. And the military, not long after that.
 usa.9.a: "Постарайтесь разрядить ситуацию" # Try to defuse the situation
 usa.9.b: "Объявите военное положение в регионе!" # Declare Martial Law in the effected region!
 usa.10.t: "Американские войска отражают нашу атаку!" # US Troops Rebuke our Attack!
 usa.10.d: "Крестовый поход, который мы спонсировали на северной границе, позволил американцам разместить военный персонал, чтобы облегчить ситуацию. Однако это не мешает нам продолжать атаки по другую сторону границы. Однако выбор за нами: атаковать ли также расположенные в гарнизоне войска или затаиться на некоторое время." # The crusade that we have sponsored in the northern border have allowed the Yanks to deploy military personnel to ease up the situation. However, that doesn't stop us from continuing our attacks at the other side of the border. However the choice is our whether to also attack the garrisoned troops or to lay low for awhile.
 usa.10.a: "Удар по войскам!" # Strike at the troops!
 usa.10.b: "Покажите наше тяжелое положение массам" # Show our plight to the masses
 usa.11.t: "[MEX.GetName] атакует наши войска!" # [MEX.GetName] Attacks our Troops!
 usa.11.a: "Тогда это война!" # Then war it is!
 usa.11.b: "Требуйте правительство [MEX.GetAdjective] остановиться!" # Demand the [MEX.GetAdjective] Government to stop!
 usa.12.t: "Ультиматум Вашингтона" # Washington's Ultimatum
 usa.12.d: "Сегодня в МИД поступила телеграмма от американцев с требованием прекратить конфликт в приграничной зоне. Похоже, что правительство [USA.GetAdjective] сейчас мобилизует свои силы и готово действовать." # A telegram was received in the Foreign Ministry today from the Yanks, demanding us to stop the conflict in the border area. It seems that the [USA.GetAdjective] Government are mobilizing their forces as we speak, and are ready to do action. 
 usa.12.a: "Мы не преклонимся перед янками!" # We will not bow down to the Yanks!
 usa.12.b: "Примите ультиматум, даже если он унизителен." # Accept the ultimatum, even if its humiliating
 usa.13.t: "Мексика отказывается от наших требований!" # Mexico Refuses our Demands!
 usa.13.d: "Правительство [MEX.GetAdjective] ответило на наш ультиматум, отказавшись разрядить напряженность на южной границе. Пока мы говорим, они мобилизуют свои силы, кажется, война неизбежна." # The [MEX.GetAdjective] Government have responded to our ultimatum refusing to defuse the tensions in the southern border. They are mobilizing their forces as we speak, it seems war is inevitable.
 usa.13.a: "Мы победили бы их один раз, мы победили бы их снова!" # We'd beat them once, we'd beat them again!
 usa.13.b: "Назад..." # Back down...
 usa.14.t: "Мексика принимает наши требования" # Mexico Accepts our Demands
 usa.14.d: "К нашему величайшему удивлению, правительство [MEX.GetAdjective] ответило на наш ультиматум, согласившись на разрядку напряженности на южной границе. Они приносят нам официальные извинения и начинают демобилизовать свои силы." # To our outmost suprise, the [MEX.GetAdjective] Government have responded to our ultimatum accepting the defusing of tensions in the southern border. They are issued a formal apology to us and beginning to demobilize their forces.
 usa.14.a: "Мир в наше время..." # A peace in our time...
 usa.15.t: "Вступление США в Антанту" # US Entry into the Entente
 usa.15.d: "Делегация [USA.GetAdjective] прибыла сюда, в [Root.Capital.GetName], чтобы обсудить вхождение [USA.GetName] в [Root.GetFaction]. Правительство [USA.GetAdjective] стремится установить с нами официальный союз. Должны ли мы принять их предложение?" # An [USA.GetAdjective] delegation have arrived here in [Root.Capital.GetName] to discuss the entry of the [USA.GetName] in the [Root.GetFaction]. The [USA.GetAdjective] Government is seeking to establish a formal alliance with us. Should we accept their offer?
 usa.15.a: "Мы были бы дураками, если бы не приняли" # We'd be fools not to accept
 usa.16.t: "Въезд в Антанту запрещен" # Entente Entry Denied
 usa.16.d: "Правительство [From.GetAdjective] отклонило наше предложение об официальном союзе с ними. Возможно, нам придется поискать в другом месте." # The [From.GetAdjective] Government have refused our offer of our formal alliance with them. We may have to look elsewhere.
 usa.16.a: "Трагедия, конечно, иначе возможность..." # A tragedy to be sure, otherwise an opportunity...
 usa.17.t: "США приглашают нас на конференцию в Сан-Франциско" # US Invites us to the San Francisco Conference
 usa.17.d: "Департамент иностранных дел получил телеграмму от [USA.GetAdjective]s с приглашением на конференцию, которая пройдет в Сан-Франциско, Калифорния. В связи с потеплением отношений между нашими двумя странами [USA.GetAdjective] хотел бы обсудить будущие оборонительные союзы, торговлю и возможную аренду военной базы Соединенными Штатами на Филиппинах; обеспечить стабильность и мир в регионе. Должны ли мы принять предложение нашего бывшего хозяина?" # The Foreign Affairs Department have received a telegram from the [USA.GetAdjective]s inviting us to a conference that will be hosted in San Francisco, California. With the warming relations of our two nations, the [USA.GetAdjective] would like to discuss future defensive alliances, trade and possible military base leasing of the United States in the Philippines; to ensure stability and peace in the region. Should we accept our former master's offer?
 usa.17.a: "Конечно..." # Sure...
 usa.17.b: "Это просто имперализм в овечьей шкуре..." # This is just imperalism in sheep's clothing...
 usa.18.t: "Успех конференции в Сан-Франциско" # San Francisco Conference Success
 usa.18.d: "Правительство [From.GetAdjective] увидело мудрость в нашем предложении и приняло наши предложения на конференции." # The [From.GetAdjective] Government have seen the wisdom in our offer and have accepted our proposals in the conference.
 usa.18.a: "Большой!" # Great!
 usa.19.t: "Провал конференции в Сан-Франциско" # San Francisco Conference Failure
 usa.19.d: "Правительство [From.GetAdjective] отклонило наше предложение о приглашении на конференцию в Сан-Франциско." # The [From.GetAdjective] Government have refused our offer of invitation of talks in the conference in San Francisco.
 usa.19.a: "Стыд..." # Shame...
 usa.20.t: "Американские советники?" # US Advisors?
 usa.20.d: "[USA.GetAdjective] снова обратились к нашему правительству и выдвинули на рассмотрение еще одно предложение. Они предлагают прислать к нам советников для обучения наших командиров и солдат тактике, полученной во время Великой войны. Должны ли мы принять?" # The [USA.GetAdjective] have once again approached our government and have layed another offer on the table. They offer to send advisors to us to train our commanders and soldiers with tactics learned from the Great War. Should we accept?
 usa.20.a: "Конечно, почему бы и нет?" # Sure, why not?
 usa.20.b: "Мы предпочли бы отказаться" # We'd rather refuse
 usa.21.t: "[From.GetName] принимает советников" # [From.GetName] Accepts Advisors
 usa.21.d: "Правительство [From.GetAdjective] увидело мудрость и немедленно приняло наше предложение направить советников для полной подготовки их вооруженных сил." # The [From.GetAdjective] Government have seen the wisdom and have immediately accepted our offer of sending advisors to fully train their armed forces.
 usa.21.a: "Большой!" # Great!
 usa.22.t: "[From.GetName] отказывается от советников" # [From.GetName] Refuses Advisors
 usa.22.d: "Правительство [From.GetAdjective] отклонило наше предложение отправить военных советников для полноценной подготовки их вооруженных сил." # The [From.GetAdjective] Government have refused our offer of sending military advisors to truly train their armed forces.
 usa.22.a: "Как жаль..." # How unfortunate...
 usa.23.t: "США предлагают защиту" # US Offers Protection
 usa.23.d: "Этим тихим утром в МИД мы получили телеграмму из Вашингтона с требованием подчиниться защите [USA.GetAdjective]. Правительство [USA.GetAdjective] хочет, чтобы мы находились под их протекторатом, полностью войдя в сферу их влияния; хотя это предложение может спасти нас от реваншистов [MEX.GetAdjective]s на севере; наша независимость обязательно станет залогом." # This quiet morning, at the Foreign Ministry, we have received a telegram from Washington demanding us to submit to [USA.GetAdjective] protection. The [USA.GetAdjective] Government wants us to be under their protectorate, completely entering in their sphere of influence; while this offer can save us from the revanchist [MEX.GetAdjective]s in the north; our independence will sure become the collateral.
 usa.23.a: "Мы не имеем права отказать..." # We aren't in a position to refuse...
 usa.23.b: "Нет шансов! Свобода или смерть!" # Not a chance! Libertad o Muerte!
 usa.24.t: "[From.GetName] принял наши требования" # [From.GetName] Accepted our Demands
 usa.24.d: "Правительство [From.GetAdjective] приняло наши требования и стало нашим протекторатом." # The [From.GetAdjective] Government have accepted our demands in becoming them our protectorate.
 usa.24.a: "Необходимый акт для обеспечения стабильности в регионе." # A necessary act to ensure stability in the Region.
 usa.25.t: "[From.GetName] отказывается от наших требований" # [From.GetName] Refuses our Demands
 usa.25.d: "Южный Змей может оказаться более грозным врагом, чем его взгляд. Будет хорошо, если мы окружим их государствами-сателлитами у их южной границы. Конгресс принял идею направить в Центральную Америку требования о создании дружественного Америке правительства, и пора начинать." # The Southern Serpent might be a more formidable enemy than the look. It'll pay well to ensure that we surround them with satellite-states by their Southern Border. Congress has passed the notion of sending demands to Centroamerica for installation of American-friendly governments, it's about time we get started.
 usa.25.d_no_mex: "Когда Южный Змей наконец умиротворен, мы можем обеспечить стабильность в регионе, также умиротворяя режимы, находящиеся под ним. Конгресс принял идею направить в Центральную Америку требования о создании дружественного Америке правительства, и пора начинать." # With the Southern Serpent finally pacified, we can ensure the stability of the region by also pacifying the regimes below them. Congress has passed the notion of sending demands to Centroamerica for installation of American-friendly governments, it's about time we get started.
 usa.25.a: "Оставьте этот вопрос, вторжение в Центральную Америку звучит как кризис снабжения." # Drop the matter, an invasion of Central America sounds like a supply misery.
 usa.25.b: "Если они хотят войны..." # If it's war they want...
 usa.26.t: "Смерть Юджина Дебса" # Death of Eugene Debs
 usa.26.d: "Сегодня рано утром Юджин В. Дебс умер от полиорганной недостаточности после длительного периода плохого здоровья. Дебс имела обширный опыт в американской политике: она была профсоюзным лидером, который участвовал в избирательных кампаниях Теодора Рузвельта в 1912 и 1916 годах и добился далеко не звездных результатов. После того, как Верховный суд с трудом признал его невиновным в подстрекательстве к мятежу в его осуждении действий Америки против Мексики и, в частности, в отношении центральных держав, он продолжал оставаться противоречивой фигурой. Дебс также участвовал в президентских выборах 1920 года по списку Социалистической партии, но снова потерпел неудачу. Хотя он оставался де-факто лидером Социалистической партии, с тех пор он прекратил свою кандидатуру на пост президента, и с тех пор Социалистическая партия находится в застое на основных полях американской политики. Несколько недель назад он назначил журналиста и профсоюзного деятеля Джека Рида своим преемником, хотя после смерти Дебса переход стал официальным. Многие зрители не могут точно сказать, какова будет судьба партии сейчас, но она, вероятно, пострадает от раскола во власти после смерти своего сюзерена-лидера." # Early this morning, Eugene V. Debs died of multiple organ failure following an extended period of ailing health. Debs had an extensive history in American politics, having been a union leader who contested Theodore Roosevelt's election campaigns in 1912 and 1916 to less than stellar results. After having narrowly been found innocent of sedition in his condemnation of American actions against Mexico, and by extension to Central Powers, by the Supreme Court, he continued to be a controverial figure. Debs also contested the 1920 Presidential election on the Socialist Party ticket but was again very unsuccessful. While he remained de facto leader of the Socialist Party, he discontinued his runs for President from then on, and the Socialist Party has stagnated ever since, in the major margin of American politics. He appointed some weeks ago journalist and unioneer Jack Reed as his successor, though with Debs's death the transition has become official. Many spectators cannot say exactly what the fate of the party will be now, but it will probably suffer divisions in power following its suzerain leader's death.
 usa.26.a: "Неудачно..." # Unfortunate...
 usa.27.t: "[USA.GetAdjective] предлагает мир" # The [USA.GetAdjective] Offers Peace
 usa.27.d: "Видя, насколько тщетно их сопротивление нашим войскам, трусливое правительство [USA.GetAdjective] предложило прекратить боевые действия формальным обменом на передачу наших старых территорий, таких как Калифорния, Невада, Нью-Мексико и Техас. Поскольку мы достигли своей цели, вернув не только свое право по рождению, но и наши бывшие территории, было бы разумно принять предложение Вашингтона. Однако, чтобы по-настоящему победить нашего заклятого врага, нам, возможно, придется полностью разгромить его." # Seeing how the futile their resistance is to our troops, the cowardly [USA.GetAdjective] Government have proposed to end hostilities with formal exchange to transfer our old territories such as California, Nevada, New Mexico, and Texas. As we have achieved our goal in reclaiming not just our birthright but our former territories, it is wise to accept Washington's offer. However, to truly defeat our sworn enemy we might just have to crush them altogether.
 usa.27.a: "Примите предложение." # Accept the offer.
 usa.27.b: "Мы отправимся в [USA.Capital.GetName]" # We will march to [USA.Capital.GetName]
 usa.28.t: "Президентские выборы [GetYear]" # The [GetYear] Presidential Election
 usa.28.d: "Президентские выборы [GetYear] уже здесь. Кто станет президентом Соединенных Штатов Америки?" # The [GetYear] Presidential election is here. Who shall become the president of the United States of America?
 usa.28.a: "Хьюи Лонг" # Huey Long
 usa.28.b: "Квентин Рузвельт" # Quentin Roosevelt
 usa.28.c: "Венделл Уилки" # Wendell Wilkie
 usa.28.e: "Джон Нэнс Гарнер" # John Nance Garner
 usa.28.f: "Джек Рид" # Jack Reed
 usa.29.t: "Демократы раскритиковали правительство за законопроект о стимулировании" # Democrats Bashed the Government for the Stimulus Bill
 usa.29.d: "Видные члены Демократической партии выступили сегодня с заявлением в Конгрессе, заявив, что законопроект об экономическом стимулировании является неэффективной программой администрации, призванной тратить время и деньги как народа, так и самого правительства. Хотя это заявление не помешало принятию законопроекта, оно получило поддержку как со стороны семей низшего, так и среднего класса." # Prominent members for the Democratic Party have issued an statement today in Congress, stating that, the Economic Stimulus Bill is an ineffective program of the Administration designed to waste time and money of both the people and the government itself. While the statement did nothing to stop the passing of the bill, it has gathered support from the lower class and middle class families alike.
 usa.29.a: "Чего мы ожидаем? Демократы все время ноют..." # What do we expect? Democrats whine all the time...
 usa.30.t: "Реформы, демонстрирующие свои последствия" # Reforms Showing its Effects
 usa.30.d: "Похоже, реформы, проведенные бывшим президентом Чарльзом Кертисом перед выборами, показали свой эффект. Медленно, но верно экономика восстанавливается после последствий Великой депрессии. Американский народ теперь может ощутить последствия улучшения экономики. Мы должны надеяться, что эти последствия помогут Соединенным Штатам по-настоящему оправиться от величайшей экономической катастрофы в истории человечества." # It seems that the reforms conducted by the former President Charles Curtis before the elections has shown its effects. Slowly but surely the economy is recovering from the effects of the Great Depression. The American people can now feel the effects of the improving economy. We should hope that this effects continues to make the United States truly recover from this greatest economic disaster in human history.
 usa.30.a: "Мы очень надеемся на это." # We sure hope so.
 usa.31.t: "Социалисты набирают популярность" # Socialists Gaining Popularity
 usa.31.d: "Неспособность предыдущей администрации смягчить последствия Великой депрессии и провести эффективные реформы привела к тому, что рабочий класс поддержал некогда незначительную Социалистическую партию, возглавляемую Джеком Ридом. Хотя Социалистическая партия и не столь радикальна, как КП США, она выступает за некоторые умеренные и радикальные реформы, необходимые для борьбы с депрессией, которые могут эффективно изменить статус-кво." # The failure of the previous administration in alleviating the effects of the Great Depression in introducing effective reforms have lead the working class supporting the once insignificant Socialist Party lead by Jack Reed. While not as radical as the CPUSA, the Socialist Party advocates some moderate to radical reforms needed in dealing with the Depression that can effectively change the status quo.
 usa.31.a: "Нам следует следить за ними..." # We should keep an eye on them...
 usa.32.t: "Опасения генерала Макартура" # General MacArthur's Concerns
 usa.32.d: "Генерал Дуглас Макартур, один из командующих армией США, выражает обеспокоенность по поводу избрания [USA.GetLeader]. Он заявил, что политика и реформы, которые будет проводить новый президент, сильно повлияют на образ жизни [USA.GetAdjective]; ставя под угрозу свободы, за которые мы боролись во время предыдущих войн." # General Douglas MacArthur, one of the commanders of the US Army, are voicing out concerns over the election of [USA.GetLeader]. He stated that the policies and reforms that will be introduced by the new President will greatly affect the [USA.GetAdjective] way of life; endangering the liberties that we have fought during the previous wars.
 usa.32.a: "Предложите ему досрочную пенсию" # Offer him early retirement
 usa.32.b: "Назначьте его начальником штаба" # Appoint him as Chief of Staff
 usa.32.c: "Пусть он будет" # Let him be
 usa.33.t: "Макартур уходит на пенсию на Филиппинах" # MacArthur Retires in the Philippines
 usa.33.d: "При неожиданном повороте событий генерал Дуглас Макартур принял предложение нового президента [USA.GetLeader] досрочно выйти на пенсию. Поначалу Макартур сопротивлялся, но в конце концов согласился на предложение, лежащее на столе, и теперь планирует уйти на пенсию на Филиппины, где он называет свой «второй дом». Досрочный выход генерала Макартура в отставку решил один из противоположных голосов в самом консервативном институте Союза, в армии США, однако она также потеряла одного из своих лучших командиров." # In a suprising turn of events, General Douglas MacArthur have accepted the offer of early retirement by the new President, [USA.GetLeader]. While relunctant at first, MacArthur have finally agreed to the offer layed on the table, and is now planning to retire to the Philippines where he calls his \"second home\". The early retirement of General MacArthur have solved one opposing voices in the most conservative institutions in the union, the US Army, however it also lost one of its best commanders.
 usa.33.a: "Счастливого выхода на пенсию!" # Happy Retirement!
 usa.34.t: "Макартур предлагает свои услуги" # MacArthur Offers his Services
 usa.34.d: "Бывший генерал Дуглас Макартур прибыл сюда, на Филиппины, планируя провести остаток своей пенсии в нашем тропическом раю. Однако, несмотря на то, что Макартур принял предложение президента [USA.GetAdjective] [USA.GetLeader] о досрочном выходе на пенсию, он по-прежнему вполне способен стать офицером Вооруженных сил, и он обратился к нам с предложением своих услуг Вооруженным силам Филиппин." # Former General Douglas MacArthur have arrived here in the Philippines planning to spend the rest of his retirement in our tropical paradise. However, despite being accepted the offer of [USA.GetAdjective] President [USA.GetLeader] for an early retirement, MacArthur is still very well capable in being an officer in the Armed Forces, and he approached us offering his services to the Philippine Armed Forces.
 usa.34.a: "Примите его предложение" # Accept his offer
 usa.34.b: "Разве он уже не на пенсии?" # Isn't he retired already?
 usa.35.t: "[USA.GetAdjective]s предлагает поддержку" # [USA.GetAdjective]s Offer Support
 usa.35.d: "Правительство [USA.GetAdjective] направило посланника с предложением поддержки в разгроме как социалистического, так и реакционного восстания против нашего правительства." # The [USA.GetAdjective] Government have sent an envoy offering us support in defeating both socialist and reactionary rebellion against our government. 
 usa.35.a: "Нам нужна вся необходимая помощь..." # We need all the help we need...
 usa.36.t: "Профсоюзы организуют забастовку!" # Labour Unions Organize Strike!
 usa.36.d: "Из-за нашей недавней политики профсоюзы осудили наши действия и призвали своих членов присоединиться к забастовкам в надежде, что мы отменим нынешнюю политику. Хотя в правительстве есть люди, которые выступают за то, чтобы мы вели переговоры с их лидерами; Есть также голоса, которые рекомендуют нам просто игнорировать их и задействовать силы безопасности в случае чего." # Due to our recent policies have made the labour unions condemn our actions and are calling their members to join the strikes in hopes of us reversing the current policies. While there are some in the government that advocates that we negotiate with their leaders; there are also voices that recommends us just to ignore them and deploy the security forces incase of something happened.
 usa.36.a: "Попробуйте с ними договориться..." # Try negotiating with them...
 usa.36.b: "Развернуть полицию" # Deploy the police
 usa.37.t: "Успешные переговоры" # Successfull Negotiations
 usa.37.d: "Между представителями правительства и профсоюзными лидерами, которые встретились в городе [USA_protest_city], чтобы обсудить возможное прекращение забастовок, организованных профсоюзами, наблюдаются напряженные настроения. Однако это не мешает двум сторонам прийти к заключению и завершить конференцию без компромиссов. Похоже, что правительство согласилось с некоторыми условиями профсоюзов, и протестующие теперь возвращаются к работе." # There are tense mood between government representatives and union leaders that have met in the city of [USA_protest_city], to discuss the possible stopping of strikes organized by the labour unions. However, that doesn't stop the two parties from having a conclusion and ending the conference without compromises. It seems that the government agreed to some terms of the labour unions and the protesters are now going back to work.
 usa.37.a: "Ведь мы тоже работники..." # For we are a worker too...
 usa.38.t: "Протестующие возвращаются на работу" # Protesters Returning to Work
 usa.38.d: "Несмотря на раздражение по поводу реакции правительства на развертывание сил безопасности в случае конфликта. Лидеры и члены профсоюзов увидели, что правительство не уступит их требованиям, и приняли новую политику в отношении профсоюзной деятельности. Многие из их членов возвращаются на фабрики и сборочные конвейеры, конечно же, с нахмуренными лицами." # Despite being heated at the government response of deploying security forces in case of conflict. Union leaders and members have seen that the government will not give in to their demands and accepted the new policies regaring union activities. Many within their members are returning to the factories and assembly lines, with of course, a frown on their faces.
 usa.38.a: "Их требования остались без внимания..." # Their demands fell on deaf ears...
 usa.39.t: "Инцидент [USA_protest_city]" # The [USA_protest_city] Incident
 usa.39.d: "Нация в шоке: протесты в городе [USA_protest_city] переросли в кровавую баню; Острые споры между силами безопасности, задействованными местными властями, и протестующими позволили проявиться насилию. По многочисленным сообщениям, погибло по меньшей мере 10 человек и более 20 получили ранения, большинство из которых являются членами профсоюзов. Несмотря на это, силовики успешно разогнали протестующих, хотя и более жёстко." # The nation is in shock as the protests in the city of [USA_protest_city] have turned into a bloodbath; the heated arguments between the security forces deployed by the local government and the protesters have allowed violence to come through. Multiple reports have suggested that there are at least 10 persons dead, and more than 20 injured, most of whom are members of the labour unions. Despite this, the security forces successfully dispered the protesters albeit in a more iron fisted manner.
 usa.39.a: "Касательно..." # Concerning...
 usa.40.t: "В прокат вышли «Новые времена» Чарли Чаплина." # Charlie Chaplin's \"Modern Times\" released
 usa.40.d: "Сегодня в кинотеатрах вышел долгожданный фильм знаменитой звезды и комика Чарли Чаплина. Сюжет вращается вокруг простого фабричного рабочего, получившего травму на рабочем месте; затем его заподозрили в том, что он социалист, а затем бросили в тюрьму. Бродяга (Полетт Годдар) — вор, который сбегает из тюрьмы после ареста за кражу буханки хлеба.\n\nБродяга встречает девушку-сироту Эллен, которая отводит его в ветхую хижину, чтобы жить там, и дает ему работу официантом и официанткой. Затем он обнаруживает, что она танцовщица, и спасает ее, импровизируя текст своей песни, используя тарабарщину и пантомиму. Когда приезжает полиция, чтобы арестовать Эллен за ее предыдущий побег, они оба вынуждены снова бежать, и Эллен отчаивается, что их борьба бессмысленна, но Бродяга успокаивает ее." # The much awaited movie of the famour star and comedian, Charlie Chaplin have been released in the cinema's today. The plot revolves in a simple factory worker whom have been injured in the workplace; then being suspected of being a Socialist then being thrown in jail. The Tramp (Paulette Goddard) is a thief who escapes from jail after being arrested for stealing a loaf of bread.\n\nThe Tramp meets an orphaned girl, Ellen, who takes him to a run down shack to live in and gives him a job as a waiter and waitress. He then discovers that she is a dancer and rescues her by improvising the lyrics to his song using gibberish and by pantomiming. When police arrive to arrest Ellen for her earlier escape, the two are forced to flee again, and Ellen despairs that their struggles are all pointless but the Tramp reassures her.
 usa.40.a: "Не могу дождаться, чтобы увидеть это!" # Can't wait to see it!
 usa.41.t: "[USA.GetAdjective]s требует возвращения свободного правительства" # [USA.GetAdjective]s Demands the Return of Free Government
 usa.41.d: "[USA.GetName] направил нашему правительству ультиматум с требованием вернуть свободные выборы. Они заявили, что в сфере их влияния нет места тиранам и мы должны следовать их образу жизни. Подобный ультиматум определенно может привести к войне; однако, если мы примем это предложение, мы сможем, по крайней мере, обеспечить выживание нашей нации." # The [USA.GetName] has sent an ultimatum to our government, demanding the return of free elections. They stated that there is no place for tyrants in their sphere of influence and we should follow their way of life. An ultimatum like this can definitely result in war; however if we accept, we can at least assure the survival of our nation.
 usa.41.a: "Проведите новые выборы." # Hold new elections.
 usa.41.b: "Они вмешиваются в наш суверенитет!" # They're interfering with our sovereignity!
 usa.42.t: "[From.GetName] принимает наши требования" # [From.GetName] Accepts our Demands
 usa.42.d: "Правительство [From.GetAdjective] ответило на наш ультиматум и приняло наши требования о восстановлении демократического правительства." # The [From.GetAdjective] Government have replied to our ultimatum and have accepted our demands to reinstate a democratic government.
 usa.42.a: "Мы распространяем демократию" # We're spreading democracy
 usa.43.t: "[From.GetName] отказывается от наших требований" # [From.GetName] Refuses our Demands
 usa.43.d: "Правительство [From.GetAdjective] ответило на наш ультиматум, отклонив наши требования о восстановлении демократического правительства." # The [From.GetAdjective] Government have replied to our ultimatum refusing our demands to reinstate a democratic government.
 usa.43.a: "На войну!" # To War!
 usa.43.b: "Хорошо, что мы заняты" # Good thing that we are busy
 usa.44.t: "Президентские выборы [GetYear]" # The [GetYear] Presidential Election
 usa.44.d: "Президентские выборы [GetYear] уже здесь. Кто станет президентом Соединенных Штатов Америки?" # The [GetYear] Presidential election is here. Who shall become the president of the United States of America?
 usa.44.a: "Генри Уоллес" # Henry Wallace
 usa.44.b: "Томас Дьюи" # Thomas Dewey
 usa.44.c: "Албен В. Баркли" # Alben W. Barkley
 usa.44.e: "Ричард Рассел мл." # Richard Russell Jr.
 usa.45.t: "Президентские выборы [GetYear]" # The [GetYear] Presidential Election
 usa.45.d: "Президентские выборы [GetYear] уже здесь. Кто станет президентом Соединенных Штатов Америки?" # The [GetYear] Presidential election is here. Who shall become the president of the United States of America?
 usa.45.a: "Филип Ла Фоллет" # Philip La Follette
 usa.45.b: "Джон Брикер" # John Bricker
 usa.45.c: "Гарольд Стассен" # Harold Stassen
 usa.45.e: "Ричард Рассел мл." # Richard Russell Jr.
 usa.46.t: "Плоды инвестиций" # Fruits of Investments
 usa.46.d: "Одной из экономических реформ, осуществленных президентом [USA.GetLeader], является государственное инвестирование в различные сектора экономики; и это наконец принесло свои плоды. Многие из наших инвестиций в различные отрасли, такие как производство, транспорт и банковское дело, принесли большую прибыль." # One of the economic reforms implemented by President [USA.GetLeader] is the government investing on various sector of the economy; and that have finally gained fruit. Many of our investments in different industries such as manufacturing, transporation and banking have resulted in great profit.
 usa.46.a: "Большой!" # Great!
 usa.47.t: "Проблемы в программе «Поделись нашим богатством»" # Concerns in the \"Share our Wealth\" Program
 usa.47.d: "Сегодня Конгресс созвал заседание, на котором обсуждалась спорная социальная программа президента [USA.GetLeader]. Хотя консервативные элементы Конгресса обеспокоены этой программой из-за ее связи с марксизмом, многие прогрессивные политики высоко оценили программу помощи бедным и низшему классу." # The Congress have convened a session today discussing the controversial social program of President [USA.GetLeader]. While conservative elements of the Congress have concerns over this program due to it being linked to Marxism, many progressive politicians have praised the program in helping the poor and lower class.
 usa.47.a: "Правительство должно помочь своему народу" # The Government should help its people
 usa.47.b: "Программа представляет собой не что иное, как марксистскую повестку дня." # The program is nothing more than a Marxist agenda
 usa.48.t: "[USA.GetNameDef] предлагает поддержку" # [USA.GetNameDef] Offers Support
 usa.48.d: "Посол [USA.GetAdjective] обратился к нашему правительству с предложением материальной поддержки в разгроме левых повстанцев. Хотя помощь приветствуется, это может быть попыткой [USA.GetAdjective]s усилить свое влияние на наше правительство." # The [USA.GetAdjective] ambassador have approached our government offering us material support in defeating the leftist rebels. While the help is appreciated, this may a move of the [USA.GetAdjective]s to increase their influence onto our government.
 usa.48.a: "Помощь оценена по достоинству" # The help is appreciated
 usa.48.b: "Обмани меня один раз..." # Fool me once...
 usa.49.t: "Вашингтон требует территории Орегона" # Washington Demands the Oregon Territories
 usa.49.d: "Федеральное правительство, которое недавно свергло отколовшиеся штаты на материковой части Америки, потребовало, чтобы мы передали территории Орегона, которые мы оккупировали в начале американского краха." # The Federal Government which recently took down splinter states in the American mainland have demanded that we hand-over the Oregon territories that we have occupied in the beginning of the American collapse.
 usa.49.a: "Отдай им это" # Give it to them
 usa.49.b: "Мусор" # Refuse
 usa.50.t: "[From.GetName] принимает" # [From.GetName] Accepts
 usa.50.d: "Правительство [From.GetName] согласилось передать нам контроль над территориями штата Орегон." # The Government of [From.GetName] have accepted to turn over their control of the Oregon territories to us.
 usa.50.a: "Хороший" # Good
 usa.51.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 usa.51.d: "Правительство [From.GetName] отказалось передать нам контроль над территориями штата Орегон. Кажется, война неизбежна." # The Governemnt of [From.GetName] have refused to turn over their control of the Oregon territories to us. It seems war is inevitable.
 usa.51.a: "На войну!" # To War!
 usa.52.t: "США требуют Гренландию" # The USA Demands Greenland
 usa.52.d: "Делегация из [From.Capital.GetCapitalVictoryPointName] прибыла сюда, в [Root.Capital.GetCapitalVictoryPointName], чтобы проинформировать наше правительство о предложениях Вашингтона. Похоже, американцы заинтересованы в покупке Гренландии, чтобы иметь стратегическую базу в Североатлантическом регионе. [From.GetAdjective] предлагают щедрую сумму, чтобы гарантировать, что мы примем это предложение, но стоит ли нам?" # A delegation from [From.Capital.GetCapitalVictoryPointName] have arrived here in [Root.Capital.GetCapitalVictoryPointName] to inform our government of Washington's offers. It seems that the Yanks are interesting in purchasing Greenland in order to have a strategic base in the Northern Atlantic region. The [From.GetAdjective] are offering a generous amount to ensure that we will accept the offer, but should we?
 usa.52.a: "В любом случае это бесполезный кусок земли" # It's a useless piece of land anyway
 usa.52.b: "Мы не заинтересованы" # We are not interested
 usa.53.t: "[From.GetName] принимает" # [From.GetName] Accepts
 usa.53.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] принято." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government have been accepted.
 usa.53.a: "Отличный..." # Excellent...
 usa.54.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 usa.54.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] было отклонено." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government have been refused.
 usa.54.a: "Они заставили нас действовать..." # They forced our hand...
 usa.54.b: "Брось это дело" # Drop the matter
 usa.55.t: "США требуют наших атлантических владений" # The USA Demands our Atlantic Possessions
 usa.55.d: "Делегация из [From.Capital.GetCapitalVictoryPointName] прибыла сюда, в [Root.Capital.GetCapitalVictoryPointName], чтобы проинформировать наше правительство о предложениях Вашингтона. Похоже, американцы заинтересованы в покупке наших территорий в Атлантике, чтобы иметь стратегическую базу вблизи Европы. [From.GetAdjective] предлагают щедрую сумму, чтобы гарантировать, что мы примем это предложение, но стоит ли нам?" # A delegation from [From.Capital.GetCapitalVictoryPointName] have arrived here in [Root.Capital.GetCapitalVictoryPointName] to inform our government of Washington's offers. It seems that the Yanks are interesting in purchasing our territories in the Atlantic in order to have a strategic base near Europe. The [From.GetAdjective] are offering a generous amount to ensure that we will accept the offer, but should we?
 usa.55.a: "В любом случае это бесполезный кусок земли" # It's a useless piece of land anyway
 usa.55.b: "Мы не заинтересованы" # We are not interested
 usa.56.t: "[From.GetName] принимает" # [From.GetName] Accepts
 usa.56.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] принято." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government have been accepted.
 usa.56.a: "Отличный..." # Excellent...
 usa.57.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 usa.57.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] было отклонено." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government have been refused.
 usa.57.a: "Они заставили нас действовать..." # They forced our hand...
 usa.57.b: "Брось это дело" # Drop the matter
 usa.58.t: "США требуют покорения" # The USA Demands Subjugation
 usa.58.d: "Делегация из [From.Capital.GetCapitalVictoryPointName] прибыла сюда, в [Root.Capital.GetCapitalVictoryPointName], чтобы проинформировать наше правительство о требованиях Вашингтона. Похоже, американцы требуют, чтобы мы стали их протекторатом, чтобы защитить нас от других империалистических наций. Но это требование Вашингтона явно является актом империализма. Должны ли мы просто принять их требования, чтобы не проливать кровь?" # A delegation from [From.Capital.GetCapitalVictoryPointName] have arrived here in [Root.Capital.GetCapitalVictoryPointName] to inform our government of Washington's demands. It seems that the Americans are demands that we become a protectorate of them in order to protect us from other imperialistic nations. But this demand from Washington is clearly an act of imperialism. Should we just accept their demands to avoid spilling blood?
 usa.58.a: "Мы должны просто принять" # We should just accept
 usa.58.b: "Скажите янки, чтобы они пошли к черту!" # Tell the Yanks to go to hell!
 usa.59.t: "[From.GetName] принимает" # [From.GetName] Accepts
 usa.59.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] принято." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government have been accepted.
 usa.59.a: "Отличный..." # Excellent...
 usa.60.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 usa.60.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] было отклонено." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government have been refused.
 usa.60.a: "Мобилизуйте наши силы!" # Mobilize our forces!
 usa.60.b: "Упс, мы попробовали" # Welp we tried
 usa.61.t: "США требуют наших карибских владений" # The USA Demands our Caribbean Possessions
 usa.61.d: "Делегация из [From.Capital.GetCapitalVictoryPointName] прибыла сюда, в [Root.Capital.GetCapitalVictoryPointName], чтобы проинформировать наше правительство о предложениях Вашингтона. Кажется, янки требуют от нас сдать им наши территории в Карибском море? Должны ли мы?" # A delegation from [From.Capital.GetCapitalVictoryPointName] have arrived here in [Root.Capital.GetCapitalVictoryPointName] to inform our government of Washington's offers. It seems that the Yanks are demanding that we surrender our territories in the Caribbean to them? Should we?
 usa.61.a: "В любом случае это бесполезный кусок земли" # It's a useless piece of land anyway
 usa.61.b: "Идите к черту, чертовы янки!" # Go to hell you bloody Yanks!
 usa.62.t: "[From.GetName] принимает" # [From.GetName] Accepts
 usa.62.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] принято." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government have been accepted.
 usa.62.a: "Отличный..." # Excellent...
 usa.63.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 usa.63.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] было отклонено." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government have been refused.
 usa.63.a: "Они заставили нас действовать..." # They forced our hand...
 usa.63.b: "Брось это дело" # Drop the matter
 usa.64.t: "[From.GetAdjective] Прибытие оборудования" # [From.GetAdjective] Equipment Arrives
 usa.64.d: "Наши друзья из [From.GetNameDef] прислали нам партию пехотного снаряжения, чтобы помочь в нашей борьбе." # Our friends in [From.GetNameDef] have sent us a shipment of infantry equipment to aid in our struggle.
 usa.64.a: "Очень нужно!" # Much needed!
 usa.65.t: "Прибытие американских советников" # American Advisors Arrive
 usa.65.d: "Соединенные Штаты решили отправить официальную военную миссию на нашу родину, чтобы помочь нам улучшить наши устаревшие вооруженные силы. Такие миссии высоко ценятся за их влияние на вооруженные силы таких стран, как Филиппины и Гаити, и нам повезло, что они у нас есть." # The United States have decided to send an official military mission to our homeland in order to help us improve our obsolete armed forces. Such missions are well regarded for their impact on the militaries of nations like the Philippines and Haiti, and we are fortunate to have them.
 usa.65.a: "Мы приветствуем их!" # We welcome them!
 usa.66.t: "США отправляют инвестиции" # USA Sends Investments
 usa.66.d: "Соединенные Штаты решили направить промышленные инвестиции, чтобы облегчить нашу экономику из-за разрушений, причиненных войной. Соединенные Штаты надеются, что мы воспользуемся ими для улучшения нашей экономики, чтобы противостоять социалистической угрозе." # The United States have decided to send an industrial investment in order to relieve our economy due to the destruction from the war. The United States hopes that we will use to improve our economy in order to counter the Socialist threat.
 usa.66.a: "это мило с их стороны" # That's nice of them
 usa.67.t: "[From.Capital.GetVictoryPointName] предлагает союз" # [From.Capital.GetVictoryPointName] Proposes Alliance
 usa.67.d: "Сюда, в [Root.Capital.GetCapitalVictoryPointName], прибыла телеграмма от [From.Capital.GetCapitalVictoryPointName], информирующая наше правительство о предложениях Вашингтона. [From.GetAjective] предлагают официально оформить военный союз. Хотя [From.GetAjective] может гарантировать нашу независимость своим влиянием и экономической мощью, для [From.Capital.GetCapitalVictoryPointName] это также может быть способом утвердить свое влияние на нашу страну, должны ли мы принять это?" # A telegram from [From.Capital.GetCapitalVictoryPointName] have arrived here in [Root.Capital.GetCapitalVictoryPointName] to inform our government of Washington's proposals. The [From.GetAjective] are proposing formalizing a military alliance. While the [From.GetAjective] can guarantee our independence with their influence and economic powress, it can also be a way for [From.Capital.GetCapitalVictoryPointName] to assert its own influence onto our nation, should we accept?
 usa.67.a: "Будет глупо отказываться" # It will be foolish to decline
 usa.67.b: "Снижение, [From.Capital.GetCapitalVictoryPointName] пытается расширить свое влияние." # Decline, [From.Capital.GetCapitalVictoryPointName] is trying to expand their influence.
 usa.68.t: "[From.GetName] принимает" # [From.GetName] Accepts
 usa.68.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наши предложения правительству [From.GetAdjective] об официальном военном союзе приняты." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our proposals to the [From.GetAdjective] Government for a formal military alliance have been accepted.
 usa.68.a: "За Свободу и Свободу!" # For Liberty and Freedom!
 usa.69.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 usa.69.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] об официальном военном союзе было отклонено." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government for a formal military alliance have been refused.
 usa.69.a: "Они глупые?" # Are they stupid?
 usa.70.t: "Прибытие американской материальной поддержки" # American Material Support Arrives
 usa.70.d: "Наши друзья из [From.GetNameDef] прислали нам разнообразную материальную поддержку, чтобы помочь в нашей борьбе." # Our friends in [From.GetNameDef] have sent us a variety of materiel support to aid in our struggle.
 usa.70.a: "Очень нужно!" # Much needed!
 usa.71.t: "[From.GetNameDefCap] хочет господства над нашими колониями" # [From.GetNameDefCap] Wants Overlordship of Our Colonies
 usa.71.d: "Делегация из [From.Capital.GetCapitalVictoryPointName] прибыла сюда, в [Root.Capital.GetCapitalVictoryPointName], чтобы проинформировать наше правительство о требованиях Вашингтона. Кажется, что Соединенные Штаты занимают позицию антиколонизации и требуют, чтобы мы уступили им наши тихоокеанские владения, чтобы они подготовили эти страны к тому, чтобы они стали независимыми и, таким образом, вошли в их сферу влияния; конечно это абсурдное требование с их стороны, но стоит ли нам рисковать войной из-за этих территорий?" # A delegation from [From.Capital.GetCapitalVictoryPointName] have arrived here in [Root.Capital.GetCapitalVictoryPointName] to inform our government of Washington's demands. It seems that the United States is taking a stance in anti-colonization and are demanding that we cede to them our Pacific holdings for them to prepare this nations to become independent and thus inside their sphere of influence; of course this is an absurd demand from them but should we risk a war over these territories?
 usa.71.a: "Пришло время признать доминирование Америки" # It is time to accept American dominance
 usa.71.b: "Им придется взять их силой!" # They'll have to take them by force!
 usa.72.t: "[From.GetNameDefCap] Предоставляет господство над колониями" # [From.GetNameDefCap] Grants Overlordship of Colonies
 usa.72.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наши требования к правительству [From.GetAdjective] уступить свои территориальные владения в Африке были приняты." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our demands to the [From.GetAdjective] Government to cede their African territorial holdings have been accepted.
 usa.72.a: "Мудрое решение." # A wise decision.
 usa.73.t: "[From.GetNameDefCap] отказывается от господства над колониями" # [From.GetNameDefCap] Refuses Overlordship of Colonies
 usa.73.d: "Наша делегация, отправленная в [From.Capital.GetCapitalVictoryPointName], подтвердила, что наше предложение правительству [From.GetAdjective] уступить свои территориальные владения в Африке было отклонено." # Our delegation sent in [From.Capital.GetCapitalVictoryPointName] have confirmed that our offer to the [From.GetAdjective] Government to cede their African territorial holdings have been refused.
 usa.73.a: "За свободу и свободу!" # For liberty and freedom!
 usa.73.b: "Посмотрим, чем это для них обернется." # We shall see how that pans out for them.

 usa.100.t: "Общенациональные беспорядки" # Nationwide Riots
 usa.100.d: "Приняв унизительное поражение в оружии [MEX.GetAdjective], мы вынуждены уступить территории ублюдкам на юге. Однако это привело к массовому недовольству и неодобрению нашего правительства; с многочисленными сообщениями о беспорядках и беспорядках во многих наших сельских и городских районах, которые все еще контролируются Союзом." # As we accepted our humiliating defeat in [MEX.GetAdjective] arms we are forced to cede territories to the bastards at the south. This however have lead to massive discontent and dissaproval of our Government; with multiple reports of riots and unrest in many of our rural and urban areas still controlled by the Union.
 usa.100.a: "Пусть этим занимается полиция." # Let the police handle it.
 usa.101.t: "Беспорядки в Капитолии" # Turmoil in the Capitol
 usa.101.d: "Хотя нам приходится делать то, что считается необходимым для выживания Союза, многие политики, большинство из которых находятся в оппозиции, сейчас открыто и жестоко нападают на администрацию, идущую на компромисс с [MEX.GetAdjective]s и неспособную хорошо справиться с военной ситуацией. Хотя их мнение нас не особо волнует, президент сейчас обеспокоен тем, что страна сейчас разделена, как никогда прежде." # While we have to do what deemed necessary to the survival of the Union, many politicians, with whom majority of which in the opposition are now openly and brutally attacking the administration in compromising with the [MEX.GetAdjective]s and failing to handle to war situation well. While their opinions doesn't concern us that much, the President is now worried that the country is now divided than ever before.
 usa.101.a: "От них просто голова болит..." # They are just being a headache...
 usa.102.t: "Сесиды Новой Англии!" # New England Seceeds!
 usa.102.d: "Произошло немыслимое: представители и губернаторы северного региона заявили, что выходят из союза и формируют собственное правительство. Однако на данный момент мы не можем ничего сделать, поскольку наши собственные войска, дислоцированные в этом регионе, не признают нашу власть и принесли присягу на верность новому Новоанглийскому государству." # The unthinkable has happened, representatives and governors of the northern region have declared that they are seceeding from the union and forming their own government. We cannot do anything as of now however, as our own troops who have been garrisoned in the region, doesn't recognize our authority and have taken an oath of allegiance to the new New English state.
 usa.102.a: "Поддержите Вашингтон" # Stand with Washington
 usa.102.b: "Поддержите Бостон" # Stand with Boston
 usa.103.t: "Сесид Среднего Запада!" # The Midwest Seceeds!
 usa.103.d: "Поскольку мы не ожидаем, что ситуация может быть хуже, регион Среднего Запада объявил о своем выходе из Союза и сформировал новое правительство. Как и в случае с Новой Англией, наши подразделения, дислоцированные в этом районе, больше не признают нашу власть и присягнули на верность новому правительству." # As we do not expect the situation can be worse, the Midwest region have declared their secession from the Union and have declared a new government. Like the situation in New England, our units garrisoned in the area doesn't recognize our authority anymore and have sworn allegiance to the new government.
 usa.103.a: "Поддержите Вашингтон" # Stand with Washington
 usa.103.b: "Поддержите Сент-Луиса" # Stand with St. Louis
 usa.104.t: "Ржавый пояс распадается!" # The Rust Belt Seceeds!
 usa.104.d: "Кошмар в настоящее время не заканчивается, поскольку представители и губернаторы региона Ржавого пояса отказываются от нашей власти и выходят из Союза. Ходят слухи, что этому отделению способствуют корпорации, которые выступают против и недовольны политикой нынешней администрации, негативно затрагивающей их интересы. На данный момент новое правительство в [NAR.Capital.GetName] закрепило свою власть в регионе, а наши войска и местные подразделения присягнули на верность «Новой Американской Республике»." # The nightmare is not currently ending as the representatives and governors of the Rust Belt region are now refusing our authority and now seceeding from the Union. There are rumours that this secession is bolstered by the corporations who are against and discontented with the policies of the current administration that have negativily affected their interests. As of now, the new government in [NAR.Capital.GetName] are now secured their authority in the region, with our troops and local units sworn the allegiance to the \"New American Republic\".
 usa.104.a: "Поддержите Вашингтон" # Stand with Washington
 usa.104.b: "Поддержите Детриота" # Stand with Detriot
 usa.105.t: "Великобритания захватывает наши территории!" # United Kingdom Seizes our Territories!
 usa.105.d: "Правительство [ENG.GetAdjective], видя нашу ужасную ситуацию, воспользовалось этой возможностью и захватило контроль над оставшимися территориями, отключенными от [USA.Capital.GetName], при этом войска [ENG.GetAdjective] захватили Гавайи, Пуэрто-Рико и Аляску, а также оккупировали Каскадский регион на северо-западе." # The [ENG.GetAdjective] Government, seeing our dire situation, have grabbed the opportunity and have seized control of our remaining territories disconnected to [USA.Capital.GetName], with [ENG.GetAdjective] troops capturing Hawaii, Puerto Rico, and Alaska, as well as occuping the Cascadian Region in the northwest.
 usa.105.a: "Закончится ли когда-нибудь этот кошмар?" # Will this nightmare ever end?
 usa.106.t: "Распад Союза" # Collapse of the Union
 usa.106.d: "Произошло немыслимое: Союз, который мы так долго лелеяли, рухнул на наших глазах. Штаты-предатели теперь вышли из Союза, создав собственное правительство, независимое от Вашингтона. Страна находится на грани коллапса, по-прежнему существуют беспорядки и хаос, с которыми придется бороться силам безопасности, а текущая политическая ситуация является ужасной." # The unthinkable has happened, the Union that we have cherished for a long time have collapsed in our own very eyes. The traiterous states have now seceeded from the Union, creating their own government independent of Washington. The country is on the brink of collapse, there are still riots and chaos that the security forces will have to deal with and the current political situation is dire.
 usa.106.a: "Да поможет нам всем Бог..." # May God help us all...
 usa.107.t: "Экстренное заседание Конгресса" # Emergency Congress Session
 usa.107.d: "Этот кошмар, поразивший Союз, заставил оставшихся представителей различных штатов созвать экстренную сессию Конгресса, поскольку различные группы предлагают предоставить нынешнему президенту чрезвычайные полномочия в надежде вернуть утраченные нами территории. Однако некоторые радикальные группы также выступают за создание временного военного правительства в надежде восстановить порядок, а также победить конкурирующие правительства, возникшие по всему союзу. Однако то, что будет решено сегодня, зависит от Конгресса." # This nightmare that struck the Union have made the remaining representatives of various states convene an emergency session in Congress-as there are propositions from various groups to give the current President emergency powers in hopes in reclaiming the territories that we lost. However, some radical groups also advocates in installing a temporary military government in hopes in restore order as well as defeating the rival governments that emerged throughout the union. However, it is up to Congress whatever will be decided today.
 usa.107.a: "Дайте президенту его чрезвычайные полномочия" # Give the President his Emergency Powers
 usa.107.b: "В этой тяжелой ситуации нам нужно сильное правительство" # In this dire situation, we need a strong government
 usa.108.t: "Захватить канал?" # Seize the Canal?
 usa.108.d: "После распада Соединенных Штатов зона Панамского канала стала слабой и неохраняемой. Мы могли бы захватить его, чтобы защитить торговлю вдоль канала и успокоить общественность, мнение которой в основном против существования зоны канала." # Since the collapse of the United States, the Panama Canal Zone has been weak and unguarded. We could seize it to protect trade along the Canal and to appease the public, whose opinion is largely against the existence of the Canal Zone.
 usa.108.a: "Возможность" # An opportunity
 usa.108.b: "Скорее нет" # Rather not
 usa.109.t: "[PAN.GetName] захватывает канал!" # [PAN.GetName] Seizes the Canal!
 usa.109.d: "[PAN.GetAdjective]s, увидев возможность в ситуации здесь, в тылу, провели операцию по захвату канала у нас. Однако о жертвах не сообщается, поскольку армия [PAN.GetAdjective] быстро одолела силы нашего гарнизона и быстро взяла под свой контроль этот район." # The [PAN.GetAdjective]s seeing an opportunity, to the situation here at the homefront, have conducted an operation capturing the canal from us. There are no casualties reported however as the [PAN.GetAdjective] Army, quickly overpowered our garrisoned forces and have swiftly taken control of the area.
 usa.109.a: "Тогда это война..." # It is war then...
 usa.109.b: "Хорошо, что мы заняты" # Good thing that we are busy
 usa.110.t: "Орегонский вопрос" # The Oregon Question
 usa.110.d: "Крах правительства [USA.GetAdjective] позволил нам контролировать их изолированные территории без каких-либо последствий. Однако судьба территории Орегона, которую мы оккупировали вблизи новой мексиканской границы, в настоящее время не решена. Есть голоса, которые выступают за интеграцию его с Канадой, однако в правительстве есть и те, кто хочет создания штата Орегон по образцу правительства [ENG.GetAdjective]." # The collapse of the [USA.GetAdjective] Government have allowed us to control their isolated territories with no reprecussions. However, the fate Oregon territory that we have occupied near the new Mexican border is not currently undecided. There are voices that advocates to integrate it with Canada, however, there are also in the government that wants the creation of a Oregonian state modelled after the [ENG.GetAdjective] Government.
 usa.110.a: "Создать штат Орегон" # Create an Oregonian state
 usa.110.b: "Интегрируйте его в Канаду." # Integrate it to Canada.
 usa.111.t: "[USA.GetName] требует вернуть свою территорию" # [USA.GetName] Demands the Return of their Territory
 usa.111.d: "Правительство [USA.GetAdjective] отправило довольно интересную телеграмму, в которой потребовало вернуть основные территории, которые в настоящее время оккупированы нашими войсками. Судя по сообщениям наших разведчиков, подтверждающим присутствие мобилизованных войск на нашей границе, правительство [USA.GetAdjective] серьезно относится к этому вопросу. Кажется, если мы откажемся, война неизбежна." # The [USA.GetAdjective] Government have sent a rather interesting telegram, they have demanded the return of their core territories currently being occupied by our forces. It seems that the [USA.GetAdjective] Government is serious about this matter due to the reports of our intelligence agents confirming mobilized troops deployed at our border. It seems that if we refuse, war is inevitable.
 usa.111.a: "Мы должны сохранить мир" # We have to preserve peace
 usa.111.b: "Им придется с нами за это бороться!" # They have to fight us for it!
 usa.112.t: "[From.GetName] отказался вернуть нашу территорию" # [From.GetName] Refused to Return our Territory
 usa.112.d: "Правительство [From.GetAdjective] настолько упрямо, насколько может показаться; отказались признать нашу собственность на территории, которые они в настоящее время оккупируют. Сегодня дипломатия потерпела неудачу, и единственным выходом является война." # The [From.GetAdjective] Government is quite as stubborn as they might seem; have refused to acknowledge our ownership of the territories they have currently occupying. Today, diplomacy have failed, and war is now the only option.
 usa.112.a: "Мы забираем это из их хладнокровных рук!" # We take it from their cold blooded hands!
 usa.112.b: "Сейчас не время..." # Now is not the time...
 usa.113.t: "Отказ от чрезвычайных полномочий" # Relinquishing Emergency Powers
 usa.113.d: "Когда реинтеграция оккупированных штатов завершилась, президент [USA.GetLeader] выступил в Конгрессе, объявив о возрождении Америки и отказе от чрезвычайных полномочий, которыми Конгресс наделил его в связи с распадом союза. Многие конгрессмены, как демократы, так и республиканцы, аплодируют речи президента, испытывая облегчение от того, что нация, которой они служат, преодолела проблемы, с которыми она столкнулась." # As the reintegration of the occupied states have been completed, President [USA.GetLeader], have spoken in Congress, announcing the rebirth of America and his relinquishing the emergency powers the Congress have bestowed upon him in dealing with the collapse of the union. Many congressmen, Democrats and Republicans alike are applauding the speech of the President, relieved that the nation they serve as overcomed the challenges that it faced.
 usa.113.a: "Катастрофа закончилась..." # The disaster has ended...
 usa.114.t: "Выборы [GetYear]" # The Elections of [GetYear]
 usa.114.d: "Президентские выборы [GetYear] уже здесь. Кто станет президентом Соединенных Штатов Америки?" # The [GetYear] Presidential election is here. Who shall become the president of the United States of America?
 usa.114.a: "Генри Уоллес" # Henry Wallace
 usa.114.b: "Эрл Уоррен" # Earl Warren
 usa.114.c: "Гарри Трумэн" # Harry Truman
 usa.114.e: "Ричард Рассел мл." # Richard Russel Jr.
 usa.115.t: "Вернуться к гражданскому правлению?" # Return to Civilian Rule?
 usa.115.d: "Поскольку мы снова укрепили наше правление в Америке, многие выступают за возвращение гражданского правительства, заявляя, что диктаторам и диктатурам нет места в Америке; ибо мы боролись с тиранами, которые лишили нас нашей свободы и свобод. Должны ли мы принять и объявить новые выборы? или нам следует сохранить статус-кво?" # As we have consolidated our rule in America once again, many advocating the return of the civilian government, stating that dictators and dictatorships have no place in America; for we fought the tyrants that have denied us our freedom and liberties. Should we accept and call new elections? or should we continue the status quo?
 usa.115.a: "Назовите новые выборы" # Call new elections
 usa.115.b: "Нация все еще нуждается в руководстве" # The nation still needs guidance

