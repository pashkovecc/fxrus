 USA_dealing_with_the_great_depression: "Борьба с Великой депрессией" # Dealing with the Great Depression
 USA_dealing_with_the_great_depression_desc: "Великая депрессия продолжается уже 7 лет и имеет катастрофические последствия для граждан Соединенных Штатов. Президент Кертис ввел ряд реформ, которые могут помочь смягчить последствия Великой депрессии до окончания его срока в январе. Мы должны немедленно принять и реализовать эти реформы, чтобы лучше помогать нашему народу." # The Great Depression has been going strong for 7 years now and it has had catastrophic effects on the citizens of the United States, President Curtis have introduced a number of reforms that can help alleviate the effects of the Great Depression before the end of his term in January. We should immediately pass and implement these reforms to better help our people.
 USA_pass_curtis_reforms: "Принять реформы президента Кертиса" # Pass President Curtis' Reforms
 USA_pass_curtis_reforms_desc: "Эти реформы, хотя и не могут полностью устранить последствия Великой депрессии одним махом, могут помочь уменьшить ее влияние на экономику." # These reforms, while cannot remove the effects of the Great Depression entirely in one swoop, can help lessen its effects on the economy.
