### Ideas
 USA_the_us_army: "Армия США" # The US Army
 USA_the_greater_depression: "Великая депрессия" # The Great Depression
 USA_the_greater_depression_desc: "Величайшая экономическая катастрофа в истории Америки, Великая депрессия управляет современной политикой." # The greatest economic disaster in American history, the Great Depression rules contemporary politics.
 USA_recovering_from_the_depression: "Восстановление после Великой депрессии" # Recovering from the Great Depression
 USA_recovering_from_the_depression_desc: "Величайшая экономическая катастрофа в истории Америки, Великая депрессия управляет современной политикой." # The greatest economic disaster in American history, the Great Depression rules contemporary politics.
 USA_malnourished_populace: "Недоедающее население" # Malnourished Populace
 USA_malnourished_populace_desc: "Великая депрессия продолжается уже 7 лет и оказала катастрофические последствия на граждан Соединенных Штатов до такой степени, что многие из них не могут добыть достаточно еды для правильного питания. Из-за этого; многие молодые люди либо сами недоедают, либо отчаянно стараются уберечь свои семьи от несчастных жертв голода. В настоящее время трудно найти здоровых новобранцев для военной службы, возможно, как только мы оправимся от наших неудачных экономических обстоятельств, это больше не будет проблемой." # The Great Depression has been going strong for 7 years now and it has had catastrophic effects on the citizens of the United States, to the point that many of them are not able to get their hands on enough food for a proper diet. Because of this; many young men are either malnourished themselves or are desperately working to spare their families from becoming unfortunate victims of hunger. It's difficult to find healthy Recruits for military service nowadays, perhaps once we recover from our unfortunate economic circumstance this will no longer be an issue.
