 USA_protect_central_america: "Предложить защиту [From.GetName]" # Offer Protection to [From.GetName]
 USA_rebuilding_europe: "Восстановление Европы" # Rebuilding Europe
 USA_rebuilding_europe_desc: "Европа, возможно, и была захвачена своим собственным правительством, но она все еще страдает от последствий войн и революций, произошедших там. Мы должны финансировать наших союзников с помощью программы грантов и помощи, разработанной генеральным штабом и нашими главными политическими советниками, чтобы они могли восстановиться более гладко." # Europe may have been retaken by its proper government but it still suffers from the fallout of the wars and revolutions that took place their. We must fund our allies with a grant and aid program put together by the general staff and our top political advisors so they may rebuild more smoothly.
 USA_industrial_investments: "Промышленные инвестиции в [From.GetName]" # Industrial Investments in [From.GetName]
