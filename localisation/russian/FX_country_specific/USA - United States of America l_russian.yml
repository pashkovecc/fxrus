### Operations
 USA_operation_irish_revolt: "Разожгите ирландское восстание" # Fuel the Irish Revolt
 USA_operation_irish_revolt_desc: "У нашей страны нет возможностей, необходимых для полномасштабного вторжения в Ирландию из-за блокады Королевского флота, поэтому мы будем мыслить нестандартно. На Изумрудном острове существовали движения за независимость; некоторые из них были сосланы сюда, в Бостон или Филадельфию. Мы будем финансировать эти движения, чтобы организовать вторжение в регион; и мы объединимся с ними." # Our country do not have the capacity required to do a full-blown invasion of Ireland due to the blockade of the Royal Navy, so will think outside the box. Indepenedence movements of the emerald isle have existed; with some of them exiled here in Boston or Philadelphia. We will fund these movements to create an incursion in the region; and we will ally ourselves to them.
 USA_operation_irish_revolt_tt: "Поднимите тотальное ирландское восстание против §Y[ENG.GetName]§!." # Launch an all-out Irish rebellion against §Y[ENG.GetName]§!

### Operation Phases
 USA_infiltration_enter_by_submarine: "Войдите в Ирландию на подводных лодках" # Enter Ireland through Submarines
 USA_infiltration_enter_by_submarine_desc: "Наши агенты проникнут на изумрудный остров на подводной лодке, которая незаметно приблизится к берегам Ирландии." # Our agents will enter the emerald isle using a submarine that will quietly approach the shores of Ireland.
 USA_infiltration_enter_by_submarine_outcome: "Несмотря на некоторые проблемы с проникновением в Королевский флот, наши агенты высадились на берегах Ирландии." # Despite some trouble sneaking the Royal Navy, our agents have landed on the shores of Ireland.
 USA_infiltration_gather_collaborators: "Соберите сотрудников" # Gather Collaborators
 USA_infiltration_gather_collaborators_desc: "Многие ирландцы презирают своих британских повелителей. Мы можем использовать их, чтобы подготовиться к операции." # There are lots of Irish who dispises their British overlords. We can use them in helping us to prepare for the operation.
 USA_infiltration_gather_collaborators_outcome: "У наших агентов нет проблем с поиском сотрудников для наших операций." # Our agents have no problem finding some collaborators for our operations.
 USA_infiltration_train_ira_fighters: "Обучайте бойцов ИРА" # Train IRA Fighters
 USA_infiltration_train_ira_fighters_desc: "После того, как мы вступим в контакт с ирландским сопротивлением в этом районе, мы обеспечим их снабжением и обучим их ведению боя." # After contacting the Irish resistance in the area, we will supply them and train them for combat.
 USA_infiltration_train_ira_fighters_outcome: "Несмотря на языковую проблему, бойцы ИРА были очень стойкими и решительными в обучении, которое мы проводили." # Despite the language issue, the IRA fighters were very resilient and determined on the training we provided.
