 USA_intervene_ww2_sealion: "Интервенция против Германии" # Intervention Against Germany
 USA_intervene_ww2_sealion_desc: "Война в Европе достигла поистине ужасного состояния, когда демократия подорвана по всему континенту. Теперь британцы, загнанные в угол и побежденные, похоже, вот-вот падут перед немецкой угрозой. Мы не можем оставить это в покое!" # The war in Europe has progressed to a truly horrific state, with democracy being laid low throughout the continent. Now, the British - cornered and beaten - are seemingly about to fall to the German menace. We cannot let this stand!
