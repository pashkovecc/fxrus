 PHI_market_liberal_party: "Националист - Роксас" # Nacionalista - Roxas
 PHI_market_liberal_party_long: "Националистическая партия\n§gНационалистическая партия - фракция Роксаса§!\n§LПервоначальная Националистическая партия, основанная 21 августа 1901 года на Калле Гунао, Кьяпо, Манила, была забыта. Однако изначально она была создана как филиппинская националистическая партия, которая поддерживала независимость Филиппин до тех пор, пока Соединенные Штаты не предоставили ей независимость. Партия начиналась как средство достижения независимости страны путем построения современного национального государства и пропаганды эффективного самоуправления, доминируя в Ассамблее Филиппин, а затем и в Законодательном собрании Филиппин.§!\n" # Partido Nacionalista\n§gNationalist Party - Roxas Faction§!\n§LThe original Nacionalista Party that was founded on August 21, 1901 in Calle Gunao, Quiapo, Manila, was forgotten. However, it was initially created as a Filipino nationalist party that supported Philippine independence until when the United States granted independence to the country. The party began as the country's vehicle for independence, through the building of a modern nation-state and the advocacy of efficient self-rule, dominating the Philippine Assembly and later the Philippine Legislature.§!\n
 PHI_social_conservative_party: "Националист - Кесон" # Nacionalista - Quezon
 PHI_social_conservative_party_long: "Националистическая партия\n§gНационалистическая партия - фракция Кесон§!\n§LПервоначальная Националистическая партия, основанная 21 августа 1901 года на Калле Гунао, Кьяпо, Манила, была забыта. Однако изначально она была создана как филиппинская националистическая партия, которая поддерживала независимость Филиппин до тех пор, пока Соединенные Штаты не предоставили ей независимость. Партия начиналась как средство достижения независимости страны путем построения современного национального государства и пропаганды эффективного самоуправления, доминируя в Ассамблее Филиппин, а затем и в Законодательном собрании Филиппин.§!\n" # Partido Nacionalista\n§gNationalist Party - Quezon Faction§!\n§LThe original Nacionalista Party that was founded on August 21, 1901 in Calle Gunao, Quiapo, Manila, was forgotten. However, it was initially created as a Filipino nationalist party that supported Philippine independence until when the United States granted independence to the country. The party began as the country's vehicle for independence, through the building of a modern nation-state and the advocacy of efficient self-rule, dominating the Philippine Assembly and later the Philippine Legislature.§!\n
