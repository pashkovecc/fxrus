 PHI_ayala_corporation: "Айала Корпорация" # Ayala Corporation
 PHI_ayala_corporation_desc: "Ayala y Compañía, как ее официально называют, ведет свое начало с 1834 года, что делает ее одним из старейших и наиболее уважаемых деловых домов на Филиппинах. Основанная в испанский колониальный период семьями Айала и Рохас, фирма начинала как винокуренная и торговая компания, но с тех пор превратилась в очень влиятельное предприятие с интересами в различных секторах филиппинской торговли." # Ayala y Compañía, as it is formally known, traces its origins to 1834, making it one of the oldest and most respected business houses in the Philippines. Founded during the Spanish colonial period by the Ayala and Roxas families, the firm began as a distillery and trading company but has since evolved into a highly influential enterprise with interests across various sectors of Philippine commerce.
 PHI_san_miguel_corporation: "Сент-Майкл" # San Miguel
 PHI_san_miguel_corporation_desc: "Корпорация Сан-Мигель, первоначально основанная в 1890 году как La Fábrica de Cerveza de San Miguel, выросла из скромной пивоварни в Маниле в одно из самых известных и диверсифицированных коммерческих предприятий в Филиппинском Содружестве. Первоначально основанная доном Энрике Марией Барретто де Икаса-и-Эстебаном по королевскому гранту Испании, компания была первой пивоварней в Юго-Восточной Азии и по-прежнему славится качеством своего пива, которое стало основным продуктом на архипелаге и на некоторых зарубежных рынках.\n\nТеперь, в 1930-х годах, Сан-Мигель расширился далеко за пределы своего первоначального производства. Компания занимается не только пивоварением, но и диверсифицировала производство льда, безалкогольных напитков, молочных продуктов и производства стекла, став интегрированным промышленным предприятием. Под руководством Америки и Филиппин он является ярким примером того, как местная промышленность соответствует международным стандартам." # San Miguel Corporation, originally established in 1890 as La Fábrica de Cerveza de San Miguel, has grown from a modest brewery in Manila into one of the most prominent and diversified business enterprises in the Philippine Commonwealth. Initially founded by Don Enrique María Barretto de Ycaza y Esteban under a royal grant from Spain, the company was the first brewery in Southeast Asia and remains renowned for the quality of its beer, which has become a staple across the archipelago and in select foreign markets.\n\nNow, in the 1930s, San Miguel has expanded far beyond its original craft. It operates not only in brewing but has diversified into ice production, soft drinks, dairy products, and glass manufacturing—becoming an integrated industrial enterprise. Under American guidance and Filipino leadership, it stands as a shining example of local industry meeting international standards.
 PHI_bpi: "Банк Филиппинских островов" # Bank of the Philippine Islands
 PHI_bpi_desc: "Банк Филиппинских островов, основанный в 1851 году как El Banco Español Filipino de Isabel II, считается старейшим банковским учреждением на Филиппинах и, по сути, в Юго-Восточной Азии. На протяжении десятилетий он неуклонно удовлетворял финансовые потребности архипелага, адаптируясь к значительным политическим и экономическим изменениям, которые сформировали нашу нацию – от испанского колониального правления до нынешней американской администрации." # The Bank of the Philippine Islands, established in 1851 as El Banco Español Filipino de Isabel II, holds the distinction of being the oldest banking institution in the Philippines and, indeed, in Southeast Asia. Over the decades, it has steadfastly served the financial needs of the archipelago, adapting to the significant political and economic changes that have shaped our nation—from Spanish colonial rule to the present American administration.

