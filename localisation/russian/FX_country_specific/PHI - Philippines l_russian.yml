 PHI_co_prosperity_sphere: "Сфера совместного процветания" # Co-Prosperity Sphere
 PHI_join_japan: "Оформить союз с Японией" # Formalize Alliance with Japan
 PHI_propose_idea_to_japan: "Предложить идею Японии" # Propose the Idea to Japan
 PHI_propose_idea_to_japan_desc: "Наш новый верный союзник на севере, возможно, заинтересован в создании нового экономического и военного блока азиатских стран, свободного от правления и влияния Запада." # Our new staunch ally in the north, maybe interested in creating a new economic and military bloc of Asian nations that is free from rule and influence of the West.
 PHI_join_entente: "Присоединяйтесь к Антанте" # Join the Entente
 PHI_join_entente_desc: "[FRA.GetFactionName] стояли на защите Европы от тиранических когтей валкизма. Их и наши ценности совпадают, и мы должны помогать друг другу предотвратить рост тиранических диктатур." # The [FRA.GetFactionName] have been standing to protect Europe from the tyrannical claws of Valkism. Their values and ours aligns as much, and we must help each other to prevent a rise of tyrannical dictatorships.
 PHI_join_internationale: "Присоединяйтесь к Интернационалу" # Join the Internationale
 PHI_alliance_with_usa: "Создать союз с Соединенными Штатами" # Create an Alliance with the United States
 PHI_alliance_with_usa_desc: "[USA.GetAdjective]s являются нашими партнерами с 1901 года; и при этом они относятся к нам как к своему младшему брату, за которого несут ответственность; и чтобы воспользоваться этой ответственностью, мы предложим официально оформить наш союз с ними." # The [USA.GetAdjective]s have been our partner since 1901; and with that, they treat us as their little brother that they hold accountable for; and to make use of that accountability, we will propose that we formalize our alliance with them.
