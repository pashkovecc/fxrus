 PHI_form_confederation_cat: "Сформировать Конфедерацию" # Form the Confederation
 PHI_form_confederation_cat_desc: "Идея единой конфедерации Малайского полуострова, Инсулиндии и Филиппин может быть приписана Венсеслао Винзонсу, хотя ее можно проследить еще до Хосе Ризаля. Цели конфедерации объединить народы малайской расы в конфедерацию, где каждый из них равен и един!" # The concept of a united confederation of the Malayan penisula, Insulindia and the Philippines can be attributed to Wenceslao Vinzons, although it can be traced back as far to Jose Rizal. The confederation aims unite the Malay people of race in a confederation, where every one of them are equal and is united!
 PHI_form_confederation: "Начать объединение" # Start the Unification
 PHI_convince_insulindia: "Убедите [From.GetAdjective]s" # Convince the [From.GetAdjective]s
 PHI_great_game: "Большая игра" # The Great Game
 PHI_propaganda_against_the_church: "Пропаганда против церкви" # Propaganda Against the Church
 PHI_expose_church_crimes: "Разоблачение церковных преступлений" # Expose Church Crimes
