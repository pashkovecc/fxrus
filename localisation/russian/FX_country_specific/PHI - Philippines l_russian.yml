 PHI_papacy_in_exile: "Папство в изгнании" # Papacy-in-Exile
 PHI_papacy_in_exile_desc: "Папа и католическая церковь в целом были вынуждены покинуть Рим из-за угроз преследования. В конечном итоге они обосновались здесь, в нашей стране, укрепив наш престиж на международной арене." # The Pope and the Catholic Church in general have been forced to flee the city of Rome due to the threats of persecution. They ultimately settled here in our country, bolstering our prestige in the international scene.
 PHI_papacy_in_exile_1: "Папство в изгнании" # Papacy-in-Exile
 PHI_papacy_in_exile_1_desc: "Папа и католическая церковь в целом были вынуждены покинуть Рим из-за угроз преследования. В конечном итоге они обосновались здесь, в нашей стране, укрепив наш престиж на международной арене." # The Pope and the Catholic Church in general have been forced to flee the city of Rome due to the threats of persecution. They ultimately settled here in our country, bolstering our prestige in the international scene.
 PHI_uncooperative_protestants: "Несотрудничающие протестанты" # Uncooperative Protestants
 PHI_uncooperative_protestants_desc: "Хотя Филиппины называют единственной христианской страной в Азии, это означает, что многие жители придерживаются христианской веры, а не только католицизма. Хотя это гарантирует, что большинство населения дружественно относится к папству, некоторые конфессии христианской веры в большинстве случаев отказываются сотрудничать, когда Папа пришел к власти, и это проблема, которую необходимо решить." # While the Philippines is called the only Christian nation in Asia, it means that the many within the population are adhering to the Christian faith, not to Catholicism alone. While this ensures that the majority of the population is friendly towards the Papacy, some denominations of the Christian faith are at most uncooperative when the Pope took over, and this is a problem that needs to be solved.
 PHI_resisting_muslim_minorities: "Сопротивление Моро" # Moro Resistance
 PHI_resisting_muslim_minorities_desc: "На южном острове Минданао преобладают мусульмане, сопротивляющиеся нашему правлению. Хотя они все еще являются меньшинством даже в пределах одного только острова, с ними необходимо разобраться, прежде чем они смогут нанести какой-либо ущерб нашей власти.\n\n§YПРИМЕЧАНИЕ. Эта идея не имеет никаких эффектов, но является маркером государственных эффектов в штате Минданао.§!" # In the southern island of Mindanao, there is a prevalence of Muslims that are resisting to our rule. While they are still a minorities even in the scope of the island alone, they must be dealt with before they can do any damage to our grip in power.\n\n§YNOTE: This idea has no effects but is a marker for the state effects in the state of Mindanao.§!
 PHI_guerilla_problem: "Партизанская проблема" # Guerilla Problem
 PHI_guerilla_problem_desc: "Социалисты, хотя и не имеют широкой поддержки населения, по-прежнему представляют угрозу для нашей власти. Они запугивают фермеров и крестьян, заставляя их присоединиться к восстанию, и убивают их, когда они отказываются; это необходимо остановить." # The Socialists, though not having an abudance support from the populace, is still a threat to our grip on power. They intimidate the farmers and peasants into joining their rebellion and kills them when they refused, this must be stopped.
 PHI_call_people: "Призыв к народу" # Call to the People
