 PHI_legionaires_1: "Легионерский дух" # Legionary Spirit
 PHI_christian_unions: "Христианские союзы" # Christian Unions
 PHI_christian_unions_1: "Христианские союзы" # Christian Unions
 PHI_factory_incentives: "Заводские стимулы" # Factory Incentives
 PHI_per_aspera_ad_astra: "От Асперы к Астре" # Per Aspera ad Astra
 PHI_zoauve_officers: "Офицеры-зоавы" # Zoauve Officers
 PHI_papal_gendarmarie: "Папская жандармерия" # Papal Gendarmarie
 PHI_filipino_crusade: "Филиппинский крестовый поход" # Filipino Crusade
 PHI_war_reparations: "Военные репарации" # War Reparations
 PHI_huk_raids: "Рейды Хуков" # The Huk Raids
 PHI_huk_raids_desc: "«Хукбонг Баян Лабан са Хапон», или Народная армия против Японии, возглавляемая социалистом Луисом Таруком, представляет собой партизанскую силу, которая наносит ущерб нашим местным гарнизонным силам, в основном в сельских районах. Эти бандиты, которые нарушают мир и процветание, принесенные японцами, чтобы устроить социалистическую революцию на нашей родине." # The \"Hukbong Bayan Laban sa Hapon\" or the People's Army Against Japan, headed by the socialist Luis Taruc, is a guerilla force that causes havoc on our local garrisoned forces in mainly rural areas. These bandits that disrupt the peace and prosperity brought by the Japanese, to stage a socialist revolution in our motherland.
 PHI_unrecognized_government: "Непризнанное правительство" # Unrecognized Government
