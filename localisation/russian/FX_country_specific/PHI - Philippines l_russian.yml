 PHI_lunas_legacy: "Наследие генерала Луны" # General Luna's Legacy
 PHI_more_refugees: "Больше беженцев" # More Refugees
 PHI_hindered_british_trade: "Затрудненная британская торговля" # Hindered British Trade
 PHI_hindered_british_trade_desc: "Британский фондовый рынок рухнул, а вместе с ним и наш импорт в Содружество. Хотя крах окажет очень незначительное влияние на экономику, его ощутит сельскохозяйственный сектор." # The British Stock Market has collapsed, and with it, our imports to the Commonwealth. Though the crash have very minor effect to economy, it will be felt by the agricultural sector.
