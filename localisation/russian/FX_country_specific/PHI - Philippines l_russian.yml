### Ideas
 PHI_catholic_nation: "Священный католик" # Sagrado Katoliko
 PHI_catholic_nation_desc: "Большинство филиппинцев являются католиками или исповедуют какую-либо форму христианства, и поэтому Католическая церковь Рима имеет большое влияние на социальные, экономические и политические вопросы страны." # The majority of the Filipinos is Catholic or is practicing any form of Christianity, and with that the Catholic Church of Rome has a high influence on the social, economic and political issues of the nation.
 PHI_catholic_nation_1: "Священный католик" # Sagrado Katoliko
 PHI_catholic_nation_1_desc: "Большинство филиппинцев являются католиками или исповедуют какую-либо форму христианства, и поэтому Католическая церковь Рима имеет большое влияние на социальные, экономические и политические вопросы страны." # The majority of the Filipinos is Catholic or is practicing any form of Christianity, and with that the Catholic Church of Rome has a high influence on the social, economic and political issues of the nation.
 PHI_lingering_sakdalistas: "Затянувшиеся сакдалисты" # Lingering Sakdalistas
 PHI_lingering_sakdalistas_desc: "Сакдалисты во главе с Бениньо Рамосом, в настоящее время находящимся в изгнании в Токио; подняли против нас восстание в 1935 году, захватив несколько муниципальных зданий. Хотя их восстание было легко подавлено нашими силами, с тех пор движение набирает поддержку." # The Sakdalistas, headed by Benigno Ramos, currently in exile in Tokyo; have launched a revolt against us in 1935, capturing multiple municipal buildings. While their rebellion was easily crushed by our forces, the movement have been gathering support since.
 PHI_agricultural_society: "Сельскохозяйственное общество" # Agricultural Society
 PHI_agricultural_society_desc: "Наша экономика в основном состоит из сельскохозяйственной продукции, такой как рис, табак, кокос и ананас; хотя это позволило нам экспортировать в Соединенные Штаты и приносить доход, это также препятствует нашему экономическому росту; и предстоит пройти долгий путь модернизации и индустриализации архипелага." # Our economy is primarily composed of agricultural products, such as rice, tabacco, coconut and pineapple; while these allowed us to export to the United States and bring revenue, it also hinders our economic growth; and it will come a long way to modernize and industrialize the archipelago.
 PHI_hacienda_questions: "Вопросы по гасиенде" # Hacienda Questions
 PHI_hacienda_questions_desc: "«Гасьенды» были созданы в испанскую эпоху и принадлежали богатым землевладельцам, которые нанимали крестьян и фермеров для работы на своих полях и плантациях. Эти работники регулярно подвергались эксплуатации, часто не получая заработную плату должным образом или получая меньшую сумму, чем обычно. Правительство должно решить этот вопрос, чтобы в дальнейшем заручиться поддержкой народа и крестьянства." # The \"Haciendas\" were established in the Spanish era, owned by wealthy landowners that employ peasants and farmers to work in their fields and plantations. These workers have been regularly expoloited often not receiving their payroll properly or receiving a lower amount than usual. The Government must resolve this issue to further gather support from the people and the peasant.
 PHI_german_refugees: "Немецкие беженцы" # German Refugees
 PHI_german_refugees_desc: "Хотя открытие границы Филиппин для этих немцев, которых угнетали на родине, вызвало споры в правительстве, многие из этих людей обладают тем или иным опытом; и они будут иметь решающее значение в создании нового филиппинского государства." # While the opening of the border of the Philippines for these Germans whom have been oppressed in their homeland, have been controversial in the government, many of these people are skilled in one way or another; and they will be essential in forging a new Filipino state.
