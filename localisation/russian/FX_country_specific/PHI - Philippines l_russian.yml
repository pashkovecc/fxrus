 PHI_national_populist_party_long: "Филиппинская Фаланга\n§gИспанские национальные советы - Филиппины§!" # Filipino Falange\n§gJuntas Nacionales Españolas - Filipina§!
 PHI_valkist_party: "Золотой век" # Gintong Siglo
 PHI_valkist_party_long: "Гинтонг Сигло\n§gЗолотой век§!\n§LМаргинальная партия, выступающая за возвращение так называемого давно утраченного «Королевства Махарлика» вместе с возвращением его королевского дома, Дома Таллано. Сторонники движения Гинто Сигло, укорененные в идеалах суверенитета, достоинства и самоопределения, выступают за возврат к традиционным филиппинским ценностям, одновременно проводя прогрессивную политику современной эпохи. Партия также способствует расширению прав и возможностей местных сообществ и сохранению культур коренных народов, уделяя особое внимание подъему маргинализированных групп и обеспечению их представительства в управлении.§!\n" # Gintong Siglo\n§gGolden Age§!\n§LA fringe party that advocates for the return of the so-called long lost \"Kingdom of Maharlika\" with the return of it's royal house, the House of Tallano. Rooted in the ideals of sovereignty, dignity, and self-determination, supporters of the Ginto Siglo movement advocate for a return to traditional Filipino values while embracing progressive policies for the modern era. The party also promote the empowerment of local communities and the preservation of indigenous cultures, with a focus on uplifting marginalized groups and ensuring their representation in governance.§!\n

 PHI_nacionalista_party: "националист" # Nacionalista
 PHI_nacionalista_party_long: "Националистическая партия\n§gНационалистическая партия§!\n§LПервоначальная Националистическая партия, основанная 21 августа 1901 года на Калле Гунао, Кьяпо, Манила, была забыта. Однако изначально она была создана как филиппинская националистическая партия, которая поддерживала независимость Филиппин до тех пор, пока Соединенные Штаты не предоставили ей независимость. Партия начиналась как средство достижения независимости страны путем построения современного национального государства и пропаганды эффективного самоуправления, доминируя в Ассамблее Филиппин, а затем и в Законодательном собрании Филиппин.§!\n" # Partido Nacionalista\n§gNationalist Party§!\n§LThe original Nacionalista Party that was founded on August 21, 1901 in Calle Gunao, Quiapo, Manila, was forgotten. However, it was initially created as a Filipino nationalist party that supported Philippine independence until when the United States granted independence to the country. The party began as the country's vehicle for independence, through the building of a modern nation-state and the advocacy of efficient self-rule, dominating the Philippine Assembly and later the Philippine Legislature.§!\n
