### History
 PHI_FUHRERREICH_DESC: "На протяжении сотен лет филиппинский народ находился под репрессивным колониальным и империалистическим правлением; сначала испанцы, а теперь и американцы. Народ жаждет свободы и свободы, которой выставляли напоказ их новые повелители. Теперь, возможно, это наконец-то у них в руках, поскольку Великая депрессия ослабляет Соединенные Штаты; и разговоры о немедленной независимости не за горами.\nНо что принесет недавно обретенная независимость; процветание? или возможность другой империалистической державе установить контроль? Один путь очевиден: филиппинцам необходимо яростно защищать свои свободы и свободы, иначе они вернутся туда, откуда пришли." # For hundreds of years, the Filipino people have been subjugated to oppressive colonial and imperialistic rule; first the Spanish, and now the Americans. The people is thirsty for liberty and freedom their new overlords have paraded itself upon. Now it may finally within their grasp, as the Great Depression weakens the United States; and talks of immediate independence in on the horizon.\nBut what would newly found independence bring; prosperity? or an opportunity to another imperialist power to assert control? One way is certain, the Filipinos needs to viciously defend their freedoms and liberties, or they will be back to where they came.

