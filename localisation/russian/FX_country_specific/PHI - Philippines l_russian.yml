### Character Descriptions
 POLITICS_MANUEL_LUIS_QUEZON_DESC: "Мануэль Луис Кесон был сыном школьного учителя и мелкого землевладельца. В 1899 году он оставил изучение права в Университете Санто-Томас в Маниле, чтобы присоединиться к борьбе за независимость от Испании. Хотя его считали «умным, но ленивым», он продемонстрировал свой бесстрашный, смелый и вспыльчивый стиль боя и в конечном итоге поднялся до звания от рядового до майора.\n\nОднако после поражения революционеров от американцев Кесон вернулся в университет и получил степень. Он был убежден, что единственный путь к независимости лежит через сотрудничество с американцами, и мало-помалу поднялся по политической лестнице, от губернатора до постоянного комиссара Филиппин. Он сыграл важную роль в одобрении Конгрессом Закона Джонса и Закона о стрижке зайцев; что позволило ему стать достаточно популярным, чтобы выиграть президентский пост в 1933 году." # Manuel Luis Quezon was a son of a schoolteacher and small landholder. In 1899, he left his law studies at the University of Santo Tomás in Manila, to join the struggle for independence against Spain. Although considered \"bright but lazy\", he displayed his fearless, bold and quick-tempered style of fighting and ultimately rose to the ranks from private to major.\n\nAfter the defeat of the revolutionaries against the Americans however, Quezon returned to the university, and obtained his degree. He was convinced that the only way to independence was through cooperation with the Americans, and little by little, he made his way up the political ladder, from Governor to a Resident Commissioner of the Philippines. He played a major role in the Congress' approval of the Jones Act and Hare-Hawes-Cutting Act; which allowed him to be popular enough to be able to win the Presidency in 1933.
 POLITICS_BASILIO_J_VALDEZ_DESC: "Базилио родился третьим ребенком в семье из четырех человек, его отец, Бенито Сальвадор Вальдес, врач и бывший одноклассник Хосе Ризаля в Мадриде. После смерти его матери, родившей его брата и сестру, семья вела бродячую жизнь, из-за чего им пришлось учиться во многих разных школах. После окончания учебы в 1916 году он некоторое время работал преподавателем, но в конце концов уехал во Францию, чтобы присоединиться к французской армии в качестве медицинского волонтера, где он работал в военном госпитале хирургом Французского Красного Креста. Он был переведен в американскую армию, когда Соединенные Штаты присоединились к войне в 1917 году, и продолжал работать до 1919 года. После Великой войны он был назначен членом Межсоюзной военной комиссии в Германии и начальником медицинской службы в Комиссии Красного Креста в Германии, а затем стал заместителем комиссара Американского Красного Креста в Европе.\n\nОднако в 1922 году его попросили присоединиться к филиппинской полиции и возродить их медицинские службы; он присоединился к нему и к 1926 году получил звание подполковника и главного хирурга, работая медицинским инспектором с 1926 по 1934 год. Вальдес стал бригадным генералом и начальником полиции в 1934 году." # Basilio was born a third child in a family of four, his father, Benito Salvador Valdes is a doctor and a former classmate of José Rizal in Madrid. With the death of his mother, giving birth to his sibling, the family led a wandering existence, causing them to study in many different schools. After graduating in 1916, he worked briefly as a lecturer, but ultimately left for France to join in the French Army as a medical volunteer where he worked in the military hospital as a surgeon for the French Red Cross. He was transferred to the American Army when the United States joined the war in 1917 and continued to work until 1919. After the Great War, he was appointed a member of the Military Inter-Allied Commission to Germany and was made chief of Medican Service in Red Cross Commission to Germany and later made deputy commissioner to American Red Cross in Europe.\n\nHowever, in 1922, he was asked to join the Philippine Constabulary and revitalize their medical services; he joined and had by 1926 been promoted to lieutenant colonel and chief surgeon, serving as medical inspector from 1926 to 1934. Valdes became brigadier general and chief of the Constabulary in 1934.

