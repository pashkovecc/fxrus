 PHI_japanese_advisors: "Японские консультанты" # Japanese Advisors
 PHI_bangko_sentral_ng_pilipinas: "Центральный банк Филиппин" # Bangko Sentral ng Pilipinas
 PHI_himagsikan: "Новое восстание" # Bagong Himagsikan
 PHI_soviet_support: "Советская военная миссия" # Soviet Military Mission

### Decisions
 PHI_halt_refugee_acceptance: "Прекратить прием беженцев" # Halt Refugee Acceptance
 PHI_halt_refugee_acceptance_desc: "Произошло какое-то совершенно непредвиденное событие, и нам необходимо временно или навсегда отложить прием беженцев." # There have been some quite unforeseen event, and we need to postpone the acceptance of refugees temporarily, or permanently.
 PHI_resume_refugee_acceptance: "Возобновить прием беженцев" # Resume Refugee Acceptance
 PHI_industrialization_plan: "План индустриализации Осменьи" # The Osmeña Industrialization Plan
 PHI_industrialization_plan_desc: "План индустриализации Филиппин, широко известный как План Осменья, представляет собой совокупность политик и программ правительства Филиппин, направленных на улучшение и модернизацию состояния экономики страны. Этот план также направлен на устранение зависимости экономики Филиппин от сельскохозяйственного сектора, добавив больше отраслей, таких как производство и туризм, чтобы снизить безработицу и создать больше доходов для правительства." # The Philippine Industrialization Plan or widely known as the Osmeña Plan, are collection of policies and programs by the Philippine Government in order to improve and modernize the state of the country's economy. This plan also aims to remove the dependence of the Filipino economy from its agricultural sector, adding more industries such as manufacturing and tourism to alleviate unemployment and create more income for the government.
 PHI_industrial_investments: "Промышленные инвестиции в §Y[From.GetName]§!" # Industrial Investments in §Y[From.GetName]§!
 PHI_industrial_investments_desc: "Вложение некоторых промышленных инвестиций в [From.GetName] приведет к некоторым экономическим выгодам и создаст больше рабочих мест и доходов в этом районе." # Pouring some industrial investments in [From.GetName] will result in some economic benefits, and will create more jobs and revenue in the area.
 PHI_irrigation_construction: "Ирригационное строительство в §C[From.GetName]§!" # Irrigation Construction in §C[From.GetName]§!
 PHI_irrigation_construction_desc: "Обеспечение ирригации наших фермеров обеспечит более безопасный и предсказуемый урожай в будущем." # Providing irrigation for our farmers will provide a more secure and predictable harvest in the future.
 PHI_promote_tourism: "Продвижение туризма в §t[From.GetName]§!" # Promote Tourism in §t[From.GetName]§!
 PHI_promote_tourism_desc: "Одной из областей получения прибыли является развитие туризма в регионах с удивительными пейзажами и морскими пейзажами, а также рукотворными пейзажами с богатой историей." # One area of generating profits is to promote tourism for the areas that has amazing landscapes and seascapes, and manmade scenes with a rich-history.
 PHI_new_city_construction: "Строительство новых городов в §2[From.GetName]§!" # New Cities Construction in §2[From.GetName]§!
 PHI_new_city_construction_desc: "Создание новых городов в надежде уменьшить заторы в перенаселенных районах поможет нам экономически в будущем." # Creating new cities in hopes of reducing the congestion in overly populated areas will help us economically in the future.
 PHI_invite_investments: "Пригласить инвесторов из §6[From.GetName]§!" # Invite Investors from §6[From.GetName]§!
 PHI_invite_investments_desc: "Финансирование некоторых из этих престижных проектов правительством не может финансироваться исключительно государством; и поэтому нам нужны иностранные инвесторы, которые могут помочь нам с расходами." # Funding some of these prestigious projects by the government cannot be financed solely by the state; and with that, we need some foreign investors that can help us in the costs.
 PHI_pnr_expansion: "Расширение PNR" # PNR Expansion
 PHI_pnr_expansion_desc: "PNR или Филиппинская национальная железная дорога, основанная в 1892 году как Манильская железнодорожная компания, является государственной железнодорожной компанией страны. Вливание финансирования в компанию поможет расширить ее деятельность и улучшить качество обслуживания, что может быть полезно для уменьшения заторов на дорогах в Маниле и в различных местах страны." # The PNR or the Philippine National Railway, established in 1892 as the Manila Railway Company, is an state-owned railway company in the country. Pouring funding in the company will help expanding their operations and improve their service, that can be beneficial to reducing the traffic congestion in Manila and in various places in the country.
 PHI_find_new_trading_partners: "Найдите новых торговых партнеров" # Find New Trading Partners
 PHI_finalize_plan: "Завершить план индустриализации" # Finalize the Industrialization Plan
 PHI_help_insulindia: "Отправить помощь [INS.GetName]" # Send Aid to [INS.GetName]
 PHI_support_usa: "Поддержка [FROM.GetName]" # Support [FROM.GetName]
 PHI_support_usa_desc: "Как наш ближайший союзник на Западе, [FROM.GetName] нуждается в нашей поддержке, чтобы победить мексиканского змея и распространить его тираническую природу." # As our closest ally in the West, the [FROM.GetName] needs our support, in defeating Mexican serpent in spreading their tyrannical nature.
 PHI_support_mex: "Поддержка [FROM.GetName]" # Support [FROM.GetName]
 PHI_support_mex_desc: "Наши братья на Западе, [From.GetName] снова сражается с [USA.GetName], нашему брату нужна помощь, которую они могут" # Our brothers in the West, the [From.GetName] is fighting [USA.GetName] once again, they our brother needs the help they can 
 PHI_support_ins: "Поддержите наших братьев [From.GetAdjective]" # Support our [From.GetAdjective] Brothers
 PHI_suppress_resistance: "Подавить сопротивление в [From.GetName]" # Suppress Resistance in [From.GetName]
 PHI_suppress_resistance_tooltip: "Подавленное сопротивление §G-10%§!" # Suppressed Resistance §G-10%§!
 PHI_integrate: "Интегрировать [From.GetName]" # Integrate [From.GetName]
 PHI_integrate_fiji: "Интеграция тихоокеанских островов" # Integrate Pacific Islands
 PHI_spanish_civil_war: "Гражданская война в Испании" # The Spanish Civil War
 PHI_spanish_civil_war_desc: "Гражданская война в Испании, начавшаяся в декабре 1935 года в результате неудавшегося переворота консервативных монархических офицеров против Республики, привела к восстанию четырех сторон; Народный фронт, монархисты, националисты и республиканцы." # The Spanish Civil War, which began in December of 1935 as a result of a failed coup from Conservative Monarchist officiers against the Republic, has resulted in four sides rising up; the Popular Front, the Monarchists, the Nationalists, and the Republicans.
