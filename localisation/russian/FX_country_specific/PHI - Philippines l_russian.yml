 PHI_tour_the_country: "Совершить поездку по стране" # Tour the Country
 PHI_catholic_alliance_cat: "Католический Альянс" # The Catholic Alliance
 PHI_invite_south_america: "Пригласить [From.GetName]" # Invite [From.GetName]
 PHI_invite_spain: "Пригласить [From.GetName]" # Invite [From.GetName]
 PHI_invite_portugal: "Пригласить [From.GetName]" # Invite [From.GetName]
 PHI_papacy_in_exile_cat: "Папство" # The Papacy
 PHI_papacy_in_exile_cat_desc: "Папа и католическая церковь в целом были вынуждены покинуть Рим из-за угроз преследования. В конечном итоге они обосновались здесь, в нашей стране, укрепив наш престиж на международной арене." # The Pope and the Catholic Church in general have been forced to flee the city of Rome due to the threats of persecution. They ultimately settled here in our country, bolstering our prestige in the international scene.
 PHI_bring_pope_home: "Возвращение Папы" # Return of the Pope
 PHI_take_back_rome: "Верните [2.GetCapitalVictoryPointName]" # Take Back [2.GetCapitalVictoryPointName]
 PHI_take_back_jerusalem: "Восстановить [454.GetCapitalVictoryPointName]" # Reclaim [454.GetCapitalVictoryPointName]
 PHI_establish_collaboration_government: "Создайте лоялистскую Манилу!" # Establish a Loyalist Manila!
 PHI_establish_collaboration_government_tt: "Будет создано и создано §YПравительство сотрудничества§! в Маниле." # A §YCollaboration Government§! in Manila will be installed and established.
 PHI_support_huk_rebellion_tt: "Мы поддержим §RСоциалистическое восстание§! в @PHI §Y[PHI.GetName]§!, тайно поддерживая §SHUKs§!." # We will support a §RSocialist uprising§! in the @PHI §Y[PHI.GetName]§! by covertly supporting the §SHUKs§!
 PHI_proclaim_independence: "Провозгласить независимость" # Proclaim Independence
 PHI_proclaim_independence_desc: "Пришло время Филиппинам стать свободным и суверенным государством. После многих лет пребывания под иностранным правлением мы должны сделать смелый шаг и провозгласить миру нашу независимость. Это решение ознаменует начало новой главы в нашей истории, в которой мы сами определяем свою судьбу, свободные от внешнего влияния. Однако мы должны быть готовы к возможным последствиям, поскольку не все будут приветствовать нашу вновь обретенную свободу." # The time has come for the Philippines to stand as a free and sovereign nation. After years of being under foreign rule, we must take the bold step of proclaiming our independence to the world. This decision will mark the beginning of a new chapter in our history, one where we determine our own destiny, free from external influence. However, we must be prepared for the potential consequences, as not all will welcome our newfound freedom.
 PHI_japan_collaboration_end: "Спасите $PHI_JAP$" # Rescue the $PHI_JAP$
 PHI_sov_support_huk: "Поддержите ХУКБАЛАХАП" # Support the HUKBALAHAP

### Operations
 PHI_operation_indochinese_revolt: "Разожгите восстание в Индокитае" # Fuel the Indochinese Revolt
 PHI_operation_indochinese_revolt_desc: "У нашей страны нет возможностей, необходимых для полномасштабного вторжения в Индокитайский регион, поэтому мы будем мыслить нестандартно. Движения за независимость Индокитая существовали; некоторые из них сосланы сюда, в Манилу или Токио. Мы будем финансировать эти движения, чтобы организовать вторжение в регион; и мы объединимся с ними." # Our country do not have the capacity required to do a full-blown invasion of the Indochinese region, so will think outside the box. Indepenedence movements of the Indochinese region have existed; with some of them exiled here in Manila or Tokyo. We will fund these movements to create an incursion in the region; and we will ally ourselves to them.
 PHI_operation_insulindian_revolt: "Разожгите исулиндианское восстание" # Fuel the Insulindian Revolt
 PHI_operation_insulindian_revolt_desc: "Инсулиндийцам не удалось вернуть себе свою страну; но это не значит, что они не могут попробовать еще раз. Конверсионные операции в регионе будут проводить наши оперативники; контакт с остатками повстанцев; при соответствующем снабжении и финансировании с нашей стороны, а также при прямом нападении наших войск на Борнео; победа неминуема." # The Insulindians have failed to reclaim their country; but that doesn't mean that they can't try it again. Convert operations in the region will be conducted by our operatives; contacting the remnants of the revoluntaries; with proper supplies and funding from us, and a direct assault in Borneo by our troops; victory is imminent.
 PHI_operation_korean_revolt: "Разожгите корейское восстание" # Fuel the Korean Revolt
 PHI_operation_korean_revolt_desc: "С 1910 года Корейский полуостров находится под сапогом Японии, а миллионы корейцев угнетаются японскими повелителями. К счастью, мы связались с некоторыми корейскими группами сопротивления, действующими на полуострове, и, имея значительные запасы и финансирование, они начнут восстание против японцев." # Since 1910, the Korean peninsula has been under the Japanese jackboot and millions of Koreans are oppressed by the Japanese overlords. Fortunately, we have contacted some Korean resistance groups operating in the peninsula, and with some sizeable supplies and funding, they will launch a rebellion against the Japanese.

### Operation Phases
 PHI_infiltration_cross_border: "Пересечь границу" # Cross the Border
 PHI_infiltration_cross_border_desc: "Наши агенты проникнут на территорию Индокитая, пересекая либо сиамскую границу на востоке, либо границу Гоминьдана на юге." # Our agents will enter the Indochinese territory by crossing either the Siamese border to the east or the Kuomintang border to the south.
 PHI_infiltration_cross_border_outcome: "Несмотря на некоторые трудности с передвижением по сельской местности, наша команда успешно пересекла границу." # Despite some trouble navigating the rural lands, our team have successfully crossed the border.
 PHI_infiltration_gather_collaborators: "Соберите сотрудников" # Gather Collaborators
 PHI_infiltration_gather_collaborators_desc: "Есть много жителей Индокитая, которые презирают своих колониальных повелителей. Мы можем использовать их, чтобы подготовиться к операции." # There are lots of Indochinese who dispises their colonial overlords. We can use them in helping us to prepare for the operation.
 PHI_infiltration_gather_collaborators_outcome: "У наших агентов нет проблем с поиском сотрудников для наших операций." # Our agents have no problem finding some collaborators for our operations.
 PHI_infiltration_train_vietminh_fighters: "Тренируйте бойцов Вьетминя" # Train Vietminh Fighters
 PHI_infiltration_train_vietminh_fighters_desc: "После установления контакта с сопротивлением Вьетминя в этом районе мы обеспечим их снабжением и обучим их ведению боя." # After contacting the Vietminh resistance in the area, we will supply them and train them for combat.
 PHI_infiltration_train_vietminh_fighters_outcome: "Несмотря на языковую проблему, вьетминьские бойцы были очень стойкими и решительными в обучении, которое мы проводили." # Despite the language issue, the Vietminh fighters were very resilient and determined on the training we provided.
 PHI_infiltration_train_insulindian_fighters: "Тренируйте исулиндских бойцов" # Train Insulindian Fighters
 PHI_infiltration_train_insulindian_fighters_desc: "После того, как мы вступим в контакт с исулиндийским сопротивлением в этом районе, мы снабдим их и обучим для боя." # After contacting the Insulindian resistance in the area, we will supply them and train them for combat.
 PHI_infiltration_train_insulindian_fighters_outcome: "Несмотря на языковую проблему, инсульдийские бойцы были очень стойкими и решительными в обучении, которое мы проводили." # Despite the language issue, the Insuldian fighters were very resilient and determined on the training we provided.
 PHI_infiltration_train_korean_fighters: "Тренируйте корейских бойцов" # Train Korean Fighters
 PHI_infiltration_train_korean_fighters_desc: "После установления контакта с корейским сопротивлением в этом районе мы будем снабжать их и обучать ведению боя." # After contacting the Korean resistance in the area, we will supply them and train them for combat.
 PHI_infiltration_train_korean_fighters_outcome: "Несмотря на языковую проблему, корейские бойцы были очень стойкими и решительными в обучении, которое мы проводили." # Despite the language issue, the Korean fighters were very resilient and determined on the training we provided.

### Focus
# Politics
 PHI_elections_of_1937: "Выборы 1937 года" # Elections of 1937
 PHI_elections_of_1937_desc: "Выборы 1937 года являются историческим событием для филиппинской нации, поскольку это первые выборы, которые пройдут на полностью независимых Филиппинах; свободным от иностранного влияния и вмешательства. А теперь филиппинцы, голосуйте!" # The elections of 1937 is a historical event for the Filipino nation, as it is the first election that will be done in a fully independent Philippines; free of foreign influence and intervention. Now Filipinos, vote!
 PHI_partido_liberal: "Либеральный" # Liberal
 PHI_partido_liberal_desc: "Недавние скандалы, развязанные предыдущими администрациями, позволили возникнуть новой умеренной партии, Либеральной партии; возглавляют бывший сенатор Мануэль А. Рохас и сенатор Эльпидио Кирино. Либералы выступают за благосостояние рабочих и потребителей, сотрудничество между государственным и частным сектором для улучшения экономики и реформирование правового кодекса, чтобы он лучше соответствовал современной эпохе, в которую направляются Филиппины." # The recent scandals by the previous administrations have allowed the rise of a new moderate party, the Liberal Party; headed by former Senator Manuel A. Roxas and Senator Elpidio Quirino. The Liberals advocates for welfare for workers and consumers, cooperation between the public and private sector to improve the economy and reforming legal code to better suit the modern era the Philippines is headed on.
 PHI_reform_the_justice_system: "Реформировать систему правосудия" # Reform the Justice System
 PHI_reform_the_justice_system_desc: "Одним из наших обещаний в период предвыборной кампании является реформирование правового кодекса, существовавшего еще до испанской эпохи. Полная реформа судебной и правовой системы страны необходима для модернизации Филиппин не только экономически, но и морально." # One of our promises during the campaign period, is to reform the legal code which still predates to the Spanish Era. A complete reform of the justice and legal system for the country is needed for modernize the Philippines not just economically, but also morally.
 PHI_private_public_partnerships: "Частно-государственное партнерство" # Private-Public Partnerships
 PHI_private_public_partnerships_desc: "Продолжая политику Плана индустриализации Осменьи, администрация визуализирует новые инфраструктурные проекты, которые будут построены для дальнейшей индустриализации страны. Эти проекты включают в себя скоростные автомагистрали, мосты и автомагистрали для легкой транспортировки товаров туда и обратно из столицы Манилы. Однако у правительства ограниченные ресурсы, которые можно использовать для реализации этой концепции; и нам нужна помощь частного сектора, чтобы воплотить эту мечту в реальность." # Continuing the policies of the Osmeña Industrialization Plan, the administration visualizes more infrastructure projects that will be built to further industrialize the nation. These projects ranges from expressways, bridges and highways for goods to be easily transported back and forth from the capital city, Manila. However, the government has limited resources that can be used to start this vision; and we need the help of the private sector to make this dream a reality.
 PHI_establish_bsp: "Создание Центрального банка Филиппин." # Establish the Banko Sentral ng Pilipinas
 PHI_establish_bsp_desc: "Создание Bangko Sentral ng Pilipinas (Центрального банка Филиппин) является решающим шагом в модернизации финансовой системы нашей страны. Создав центральное денежно-кредитное управление, мы сможем стабилизировать экономику, регулировать инфляцию и обеспечить устойчивый приток кредитов в жизненно важные сектора. Это учреждение будет контролировать выпуск валюты, управлять валютными резервами и обеспечивать основу для устойчивого экономического роста. Имея Центральный банк, мы можем заложить основу для устойчивой и самостоятельной экономики, способной противостоять как внутренним, так и глобальным вызовам." # The establishment of the Bangko Sentral ng Pilipinas (Central Bank of the Philippines) is a crucial step in modernizing our nation's financial system. By creating a central monetary authority, we can stabilize the economy, regulate inflation, and ensure a steady flow of credit to vital sectors. This institution will oversee the issuance of currency, manage foreign reserves, and provide a framework for sustainable economic growth. With the Central Bank in place, we can lay the foundation for a resilient and self-reliant economy, capable of weathering both domestic and global challenges.
 PHI_filipino_broadcasting_corporation: "Филиппинская радиовещательная корпорация" # Filipino Broadcasting Corporation
 PHI_filipino_broadcasting_corporation_desc: "Радио уникально по своей способности доходить до масс. Мы должны обеспечить, чтобы FBC предоставлял сбалансированные услуги, которые были бы одновременно образовательными и развлекательными." # The radio is unique in its capability to reach out to the masses. We must ensure that the FBC provides a balanced service, which is as educational as it is entertaining.
 PHI_discredit_radical_groups: "Дискредитация радикальных группировок" # Discredit Radical Groups
 PHI_discredit_radical_groups_desc: "В филиппинском обществе и культуре радикализм нелегко интегрировать, поскольку филиппинцы — хорошие люди в отношении закона и страха перед Богом. Однако все же есть исключения: люди, выступающие за насилие, которое следует сдерживать. К счастью, мы можем использовать свое положение, чтобы начать пропагандистскую кампанию, чтобы очернить их; сделать свой имидж для публики таким дьяволом, каким они хотят его видеть." # In the Filipino society and culture, radicalism can't be easily integrated, as the Filpinos are good people with respect to law and fear of God. However, there are still exceptions, people who advocates for violence which should be contained. Fortunately, we can use our position to launch a propaganda campaign to evilize them; make their image to the public the devil they want it to be.
 PHI_wage_floors: "Минимальная заработная плата" # Wage Floors
 PHI_wage_floors_desc: "На Филиппинах уровень злоупотребления трудом чрезвычайно высок. Пришло время положить этому конец и позволить им получать справедливую долю богатства за счет заработной платы." # Abuse of labour has been extremely high in the Philippines. It is time to put an end to this and allow them to get a fair share of the wealth through their wages.
 PHI_light_the_archipelago: "Осветите архипелаг" # Light the Archipelago
 PHI_light_the_archipelago_desc: "В то время как Манила пользуется титулом «Париж Востока» за свою грандиозность; Это можно объяснить наличием в городе электричества. Тем не менее, во многих частях страны по-прежнему практически нет доступа к электричеству, что препятствует прогрессу многих стран. Мы запустим программу по привнесению этой замечательной общности в сельские районы; чтобы осветить каждую часть Филиппин, независимо от того, насколько далеко они находятся." # While Manila enjoys the title, \"the Paris of the East\" for its grandiosity; this can be attributed thanks to the availability of electricity in the city. However, many parts of the country still has little to no access to electricity which hinders many of its progress. We will launch a program to bring this wonderful commondity to the rural areas; to light every part of the Philippines no matter how far it is.
 PHI_partido_nacionalista: "националист" # Nacionalista
 PHI_partido_nacionalista_desc: "Несмотря на скандалы и критику со стороны активной оппозиции, «Националисты» по-прежнему сильны и пользуются доверием филиппинцев. Хотя мы реализовали некоторые из наших политик и реформ в стране; еще многое предстоит сделать для того, чтобы он стал процветающим." # Despite the scandals and criticisms by the vocal opposition, the Nacionalistas still stands strong and still being trusted by the Filipinos. Though we have implemented some of our policies and reforms on the nation; much is still to be done for it to become prosperous.
 PHI_rural_support: "Сельская поддержка" # Rural Support
 PHI_rural_support_desc: "Предотвращенный кризис в прошлом году стал результатом неэффективной работы правительства в сельских районах страны; Чтобы этого больше не повторилось, мы должны заручиться поддержкой этих слоев населения." # The averted crisis last year was the result of the ineffective outreach by the government in the rural areas of the country; to keep that from ever happening again, we must secure our support from these areas of the population.
 PHI_intensify_land_reform_efforts: "Активизировать усилия по земельной реформе" # Intensify Land Reform Efforts
 PHI_intensify_land_reform_efforts_desc: "Филиппины страдают от надоедливых землевладельцев, которые присвоили себе всю землю в стране в ущерб своим фермерам. Мы предпримем шаги, чтобы начать земельную реформу и равномерно распределить землю между фермерами." # The Philippines has been plagued by pesky landlords who have hoarded all of the land in the nation to themselves to the detriment of their farmers. We shall take steps to begin a land reform and have the land evenly distributed between farmers.
 PHI_farm_to_market_roads: "Дороги от фермы до рынка" # Farm to Market Roads
 PHI_farm_to_market_roads_desc: "Сбор урожая требует много времени и усилий; а транспортировать это другое; Один из способов помочь нашим фермерам доставить свою продукцию на рынок — это построить для правительства дороги, по которым можно будет быстро доставлять урожай и другие сельскохозяйственные товары на рынки; мы не будем знать, но это также может помочь потребителям снизить цены на товары." # Harvesting crops takes a long time and quite the effort; and transporting it is another; one way of helping our farmners to bring their goods to the market is for the government to build roads that can quickly transport the crops and other agricultural goods to the markets; we won't know, but these also might help the consumers in bringing the prices of the goods down.
 PHI_crop_insurance: "Страхование урожая" # Crop Insurance
 PHI_crop_insurance_desc: "Тайфуны на Филиппинах случаются регулярно: по данным метеорологического бюро, ежегодно ожидается 20 тайфунов. Этот тайфун время от времени уничтожает посевы фермеров и тем самым лишает их урожая. Чтобы помочь им в этой тяжелой ситуации; мы можем запустить систему страхования, которая сможет покрыть их убытки, если на их сельскохозяйственных угодьях произойдет стихийное бедствие." # Typhoons are a regular occurence in the Philippines, with 20 are to be expected each year according to the meteorological bureau. This typhoon occassionally destroys the farmers crops, and thus depriving them of their harvest. To help them in this dire situation; we can launch an insurance system that can cover their loss if a natural disaster has struck in their farmlands.
 PHI_filipino_language: "Закон о филиппинском языке" # The Filipino Language Act
 PHI_filipino_language_desc: "На Филиппинском архипелаге много диалектов, различающихся от региона к региону. Исторически официальными языками Филиппин были испанский и английский, но только элита и образованные люди могли говорить и понимать эти языки; и эти языки не были родными с самих Филиппин, они являются иностранными и представляют собой влияние репрессивных и колониальных периодов Запада. Мы выберем новый стандартизированный филиппинский язык, чтобы объединить филиппинцев из разных уголков архипелага!" # The Philippine archipelago has many dialects differentiating region to region. Historically, the official language of the Philippines were Spanish and English, but only the elites and educated were able to speak and understand these language; and these languages were not natively from the Philippines itself, it is foreign, an influence from the oppresive and colonial periods of the West. We will choose the new standardized Filipino language, to unite the Filipinos from different areas of the archipelago!
 PHI_free_higher_education: "Бесплатное высшее образование" # Free Higher Eduaction
 PHI_free_higher_education_desc: "На Филиппинах существовала система государственных школ с 1863 года, когда испанский указ впервые ввел государственное начальное образование на Филиппинах. Однако прибытие томаситов расширило и улучшило систему государственных школ и перешло на английский язык в качестве средства обучения. В настоящее время государство предлагает бесплатное обязательное образование от начальной до средней школы; позволяя Филиппинам иметь, по крайней мере, уровень грамотности, превышающий уровень грамотности в наших соседних странах. Правительство считает, что оно может подняться на ступеньку выше, поскольку предлагается предоставить бесплатное образование в пивных колледжах для тех, кто учится в государственных университетах." # Philippines had enjoyed a public school system since 1863, when a Spanish decree first introduced public elementary education in the Philippines. The arrival of the Thomasites, however, expanded and improved the public school system and switched to English as the medium of instruction. Currently, free compulsary education is offered by the State from primary to secondary; allowing the Philippines to have at least literacy rate that is above our neighboring countries. The government thinks it can take it up a notch, as proposed for a free as in beer college education for those in the State Universities will be granted.
 PHI_rotc: "Корпус подготовки офицеров запаса" # Reserved Officers Training Corps
 PHI_rotc_desc: "Мечты о независимых и суверенных Филиппинах стали реальностью; и мы должны защитить его любой ценой. Один из способов сделать это — обучать нашу молодежь различным военным и гражданским действиям, чтобы подготовить их к тому, чтобы их Родина нуждалась в них больше всего." # The dreams of an independent and sovereign Philippines have come into a reality; and we must safeguard it whatever the cost. One way of doing that is to train our youth to various military and civil activities to prepare them their motherland needs them the most.
 PHI_create_nbi: "Создать Национальное бюро расследований" # Create the National Bureau of Investigation
 PHI_create_nbi_desc: "Диссиденты и преступники являются врагами номер один филиппинского народа. Национальное бюро расследований разберется с этими крупными преступниками и отдаст их под суд." # Dissidents and criminals are the number one enemy of the Filipino people. The National Bureau of Investigation will handle these large scale criminals and will put them to justice.
 PHI_combat_public_service_corruption: "Борьба с коррупцией в государственной службе" # Combat Public Service Corruption
 PHI_combat_public_service_corruption_desc: "Коррупция – это то, что разрушает Филиппины. Без честной, функционирующей администрации, которая выполняет свои задачи с сильным чувством долга, наша нация медленно, но верно развалится на части." # Corruption is what destroys the Philippines. Without an honest, functioning administration that completes its tasks with a strong sense of duty, our nation will slowly but surely tear itself apart.
 PHI_new_antitrust_laws: "Новые антимонопольные законы" # New Anti-Trust Laws
 PHI_new_antitrust_laws_desc: "Корпоративные монополии не только нанесли ущерб филиппинской демократии в прошлом, но и нанесли ущерб недавно появившемуся малому бизнесу в нашем регионе на протяжении десятилетий. Мы должны принять строгие антимонопольные законы, чтобы избежать процветания корпоративных монополий в нашей стране и препятствования прогрессу наших предпринимателей." # Corporate monopolies have not only hurt Filipino democracy in the past, but they have also hurt the newly born small businesses in our region for decades. We shall install strong anti trust laws to avoid corporate monopolies to flourish in our nation and hinder the progress of our entrepreneurs.
 PHI_partido_progressista: "прогрессивный" # Progressista
 PHI_partido_progressista_desc: "Наконец, усилия, которые мы приложили, чтобы открыть глаза нашему народу на то, каким злом были националисты, наконец-то принесли свои плоды. Эмилио Агинальдо вновь стал президентом Республики и теперь поведет страну в светлое и достойное будущее!" # At last, the effort we have put in opening the eyes of our people of what an evil are the Nacionalistas were, have finally bore fruit. Emilio Aguinaldo once again became President of the Republic, and will now guide the country into a bright and properous future!
 PHI_strengthen_presidential_powers: "Усиление президентских полномочий" # Strenghten Presidential Powers
 PHI_strengthen_presidential_powers_desc: "Чтобы по-настоящему добиться прогресса, мы должны отправиться в путь, требующий принесения в жертву крови, пота и слез! Эти конституционные проверки лишь мешают планам президента, и мы должны что-то с этим сделать." # To be able to truly achieve progress, we must go on a journey that requires blood, sweat and tears to be sacrificed! These constitutional checks are just hinders to the plans the President envisions, and we must do something about it.
 PHI_promote_nationalism: "Продвигайте национализм" # Promote Nationalism
 PHI_promote_nationalism_desc: "Общественная апатия к собственной стране растет с угрожающей скоростью. Мы должны показать им путь истинного патриота, мы должны научить их тому, что для того, чтобы защищать и любить свою семью, они также должны любить свою страну, как это сделал бы хороший и верный христианин." # Public apethy towards their own country is growing an alarming rate. We must show them the ways of the true patriot, we must educate them that for them to protect and love their own family, they must also love their country, as a good and faithful Christian would.
 PHI_silence_critics: "Молчание критиков" # Silence Critics
 PHI_silence_critics_desc: "Слова как оружие более могущественны, чем любая пушка, пушка или танк; поскольку оно может свергать и устанавливать режимы. Мы не должны позволить этим критикам дестабилизировать наше правительство, потому что если мы это сделаем, это будет конец." # Words as a weapon is more powerful than any gun, cannon or tank; as it can bring down and establish regimes. We must not allow this critics to destablize our government, for if we do, it will be the end.
 PHI_for_the_public_good: "Для общественного блага" # For the Public Good
 PHI_for_the_public_good_desc: "Выравнивание правил игры было полезным, но этого недостаточно. Мы должны пойти дальше и принять законы о минимальной заработной плате, создать комиссию национальной безопасности для обеспечения экономической стабильности и национализировать новые государственные земли и ресурсы. Это будет сопровождать субсидирование перспективных потребительских отраслей, образования и исследований. Благодаря этому мы обеспечим наших людей рабочими местами и товарами." # While leveling the playing field was helpful, it is not enough. We must go a stop further and provide minimum wage laws, a National Security commission for economic stability, and the nationalization of new government lands and resources. This will accompany the subsidizing of promising consumer industries, education, and research. With that, we will provide jobs and goods for our people.
 PHI_department_of_public_safety: "Департамент общественной безопасности" # Department of Public Safety
 PHI_department_of_public_safety_desc: "Департамент общественной безопасности не только предоставит рабочие места потенциальным государственным служащим, но и поможет регулировать промышленность и потребительские товары, чтобы сделать их более безопасными, вознаграждая тех, кто лучше всего соблюдает налоговые льготы. Мы сделаем все возможное, чтобы сократить количество несчастных случаев на производстве." # The Department of Public Safety will not only provide jobs to potential government workers but help regulate industry and consumer products to be safer, rewarding those who best comply with tax breaks. We will do our best to cut down on work accidents.
 PHI_progressive_taxation: "Прогрессивное налогообложение" # Progressive Taxation
 PHI_progressive_taxation_desc: "Несправедливо, что обедневший крестьянин, трудовой рабочий и богатый бизнесмен платят в казну одинаковую часть своего жалованья. Более обеспеченные должны помогать нуждающимся, и мы будем проводить эту государственную политику, внедряя систему прогрессивного налогообложения." # It is not fair that an impoverished peasant, a toiling worker and a wealthy businessman all pay the same portion of their salary to the treasury. The more well off must help those in need, and we shall make this state policy, implementing a system of progressive taxation.
 PHI_universal_healthcare: "Универсальное здравоохранение" # Universal Healthcare
 PHI_universal_healthcare_desc: "Хорошее здравоохранение жизненно важно: без него люди вполне могут умереть ненужной смертью. Мы должны сделать так, чтобы здравоохранение было качественно качественным и доступным простому человеку нашей великой нации!" # Good healthcare is vital: without it, people may well die unnecessary deaths. We should ensure that healthcare is qualitatively good and affordable to common man of our great nation!
 PHI_nationalize_the_lands: "Национализировать земли" # Nationalize the Lands
 PHI_nationalize_the_lands_desc: "Олигархи полностью проигнорировали призывы своих рабочих о повышении заработной платы и улучшении условий труда; и за это они заплатят цену. Поскольку земельная реформа будет дорогостоящей и трудоемкой, наша администрация просто прибегнет к национализации своей земли; как способ прочитать им лекцию об их злых путях. Эти новые земли будут распределены между фермерами, которые, наконец, будут пожинать плоды своих усилий, работая на этих богатых землевладельцах в течение десятилетий." # Oligarchs have completely disregarded their workers plea for better wages and better working conditions; and for that they will pay the price. As Land Reform will be expensive and time consuming, our administration will just resort to nationalising their land; as a way to lecture them about their evil ways. These new lands, will be distributed to the farmers who will finally reap their efforts of working from these wealthy landowners for decades.
 PHI_agrarian_investments: "Аграрные инвестиции" # Agrarian Investments
 PHI_agrarian_investments_desc: "Помимо раздачи конфискованной земли у богатых землевладельцев, правительство предоставит этим фермерам некоторые инвестиции, такие как арендованные инструменты и техника, бесплатные посевы и многое другое." # In addition to distributing the seized land from the wealthy landowners, the government will provided these farmers with some investments, such as leased tools and machineries, free seedings and much more.
 PHI_feed_the_poor: "Накормите бедных" # Feed the Poor
 PHI_feed_the_poor_desc: "Крестьяне или низший класс преобладают на улицах не только Манилы, но и любого другого города на Филиппинах. Как добрые христиане и филиппинцы, наши соотечественники не должны страдать на своей земле только потому, что они находятся ниже экономической лестницы. Правительство будет обеспечивать этих людей едой три раза в день, каждый день; поскольку питание является основным правом человека." # The peasants or the lower class are prevalent in the streets of not just Manila, but any other city in the Philippines. As a fellow good Christian and Filipino, our countrymen should not suffer in their own land just because they are below the economic ladder. The government will provide these people with food to eat, three-times a day, everyday; as food is a basic human right.
 PHI_lapiang_sakdalista: "сакдалист" # Sakdalista
 PHI_lapiang_sakdalista_desc: ""
 PHI_reform_the_national_bank: "Реформировать Национальный банк" # Reform the National Bank
 PHI_reform_the_national_bank_desc: "Центральный банк Филиппин сильно зависит от средств от прибыли от экспорта наших товаров в другие страны, такие как Соединенные Штаты и Содружество. Из-за недавнего экономического кризиса многие из ожидаемых прибылей были остановлены, и, таким образом, средства стали нехватать для всей страны. Очевидно, что мы должны вмешаться и обеспечить, чтобы банк мог лучше управлять валютой, способствовать экономическому росту и сохранять стабильность цен." # The Central Bank of the Philippines is heavily dependent on the funds from the profits of our exports of our goods in other countries such as the United States and the Commonwealth. With the recent economic crisis, many of the expected profits were halted and thus funds became short for the entire nation. It is clear that we must step in and ensure that the bank can better manage currency, promote economic growth, and retain the stability of prices.
 PHI_institute_wealth_ceiling: "Потолок богатства института" # Institute Wealth Ceiling
 PHI_institute_wealth_ceiling_desc: "Промышленные магнаты слишком долго грабили наш народ. В свете этого мы решили ввести новый лимит благосостояния. Это позволит обеспечить более справедливое распределение богатства и может даже помочь нашему малому бизнесу процветать. Это разозлит богатых, но мы приветствуем их ненависть." # Tycoons of industry have robbed our people for too long. In light of this, we have decided to implement a new wealth cap. This will allow for a fairer distribution of wealth, and it may even help our small businesses thrive. This will make the wealthy angry, but we welcome their hate.
 PHI_promote_local_unions: "Продвигайте местные профсоюзы" # Promote Local Unions
 PHI_promote_local_unions_desc: "Создавая «местные союзы» или коммуны по всей стране, эти сообщества станут основой нашей новой социальной организации. Объединив местных жителей в эти кооперативы, все будут иметь равную собственность и права на все внутри общины, причем сотрудничество будет абсолютно необходимым и полезным для всех внутри группы." # Creating \"local unions\", or communes, across the nation, these communities will form the basis for our new social organization. Grouping locals together into these cooperatives, all would hold equal ownership and rights to everything within the commune, with cooperation being absolutely necessary and beneficial to all within the group.
 PHI_social_housing: "Социальное жилье" # Social Housing
 PHI_social_housing_desc: "Жилье должно быть широко доступно и дешево для людей. Радикальная серия жилищных проектов, финансируемых нашим новым правительством и переданных по контракту профсоюзам, обеспечит как рабочие места, так и дома." # Housing must be made available widely and cheaply to the people. A radical series of housing projects being funded by our new government and contracted out to the unions will provide both jobs and homes.
 PHI_youth_work_brigades: "Молодежные рабочие бригады" # Youth Work Brigades
 PHI_youth_work_brigades_desc: "Многие молодые люди, выходцы из низших классов или бедных семей, не получили никакого образования или прекратили обучение по финансовым причинам. Правительство, видя это, у детей в наши дни нет чувства ответственности и долга; естественно из-за всей той либеральной чепухи, которой их учили в школах, а в некоторых случаях даже и от родителей! Чтобы исправить это печальное положение дел, на Филиппинах будет создана молодежная организация, продвигающая истинные ценности среди наших самых маленьких, чтобы все жили полноценной и хорошей жизнью." # Many youth who came from lower class or impoverished families did not receive any education or studied by stopped due to financial reasons. The government, seeing this, Kids these days have no sense of responsibility and duty; naturally due to all the liberal drivel taught to them at schools, and in some cases even by their parents! In order to fix this sad state of affairs, the Philippines will have a youth organisation promoting true values to our youngest, so that everyone lives full and good lives.
 PHI_economic_independence: "Экономическая независимость" # Economic Independence
 PHI_economic_independence_desc: "Крах лондонского фондового рынка доказал одну истину; что мы не можем полагаться на другие страны в плане получения прибыли и экономического роста; хотя бизнес с ними все еще идет хорошо, сделать нашу экономику зависимой от их импорта из нас — это путь к катастрофе. Мы должны реформировать экономику, чтобы она стала максимально самодостаточной." # The London Stock Market Crash has proved one truth; that we cannot rely on other countries for our profits and economic growth; while businesses with them is still good, making our economy dependent on their imports from us is a recipe for disaster. We must reform the economy to become self-sufficient as possible.
 PHI_filipino_first: "Филиппинский прежде всего!" # Filipino First!
 PHI_filipino_first_desc: "Американцы и китайцы доминировали в филиппинской экономике на протяжении десятилетий, маргинализируя филиппинских предпринимателей и бизнес. Резолюция № 202, подписанная самим президентом Рамосом, направлена ​​на то, чтобы отдать приоритет предприятиям, принадлежащим филиппинцам, над иностранными аналогами, а также покровительствовать и продвигать на рынке продукцию филиппинского производства." # The Americans and the Chinese have dominated the Filipino economy for decades, marginalizing the Filipino entrepreneurs and businesses. The Resolution No. 202, signed by President Ramos himself, aims to prioritize Filipino-owned businesses over its foreign counterparts and the patronization and promotion of Filipino-made products in the market.
 PHI_the_army_in_control: "Армия под контролем" # The Army in Control
 PHI_the_army_in_control_desc: "Нацию обрушилась катастрофа, старые методы демократии потерпели неудачу, и единственный способ спасти страну от коллапса – это сильное и смелое руководство. К счастью, теперь армия будет справляться с ситуацией." # Disaster has struck the nation, the old ways of democracy has failed and the only way to save the country from collapsing is through a strong and bold leadership. Fortunately, the Army will handle the situation from now on.
 PHI_a_strong_leader: "Сильный лидер" # A Strong Leader
 PHI_a_strong_leader_desc: "Для большого количества болтовни и слишком большого количества бюрократии Конгресс является не чем иным, как бременем для управления страной и в интересах народа; новый сильный лидер – это то, что нам нужно." # To much chit-chat, too much bureaucracy, the Congress is nothing more than a burden in governing the nation and in the interest of the people; a new strong leader is what we need.
 PHI_support_from_capitalists: "Поддержка капиталистов" # Support from Capitalists
 PHI_support_from_capitalists_desc: "Чтобы наша страна действительно процветала и стабилизировалась, мы должны объединиться с капиталистами нашей страны; поскольку они могут обеспечить финансирование для обеспечения нашего контроля и улучшения нации." # To truly our country to flourish and stabilize, we must ally the capitalists of our nation; for they can provide the funding to secure our control and improve the nation.
 PHI_populist_junta: "Популистская хунта" # A Populist Junta
 PHI_populist_junta_desc: "Поддержка народа обеспечит наш контроль над страной. Мы должны обеспечить создание надлежащей пропаганды и реализацию популистской политики." # The support of the people will secure our control over the country. We must ensure that a proper propaganda is established and populists policies are implemented.
 PHI_land_redevelopment_program: "Программа редевелопмента земель" # Land Redevelopment Program
 PHI_land_redevelopment_program_desc: "Есть земли, которые находились под контролем богатых семей или корпораций, которые либо используются не по назначению, либо используются для эксплуатации фермеров. Новая программа редевелопмента земель направлена ​​на национализацию этих земель в обмен на некоторую денежную выплату их нынешнему владельцу." # There are lands that have been in control of wealthy families or corporations that are either misused or being used for exploitation of farmers. The new Land Redevelopment Program aims to nationalize these lands in exchange for some monetary payment to their current owner.
 PHI_corporatist_model: "Корпоративная модель" # Corporatist Model
 PHI_corporatist_model_desc: "Разрешение компаниям и другим крупным заинтересованным группам помогать новому правительству управлять экономикой, несомненно, принесет пользу в долгосрочной перспективе." # Allowing companies and other large interest groups to help the new government run the economy will surely be beneficial in the long term.
 PHI_mining_grants: "Гранты на добычу полезных ископаемых" # Mining Grants
 PHI_mining_grants_desc: "На архипелаге есть тонны неиспользованных ресурсов, которые ждут своей эксплуатации; Одним из примеров является богатый ресурсами регион Кордильеры, где, как сообщается, имеются запасы железа, вольфрама и хрома." # There are tons of untapped resources in the archipelago that are waiting to be exploited; one example is the resource rich region of the Cordilleras, were there are reported iron, tungsten and chromium reserves in the area.
 PHI_tax_breaks: "Налоговые льготы" # Tax Breaks
 PHI_tax_breaks_desc: "Цены на некоторые предметы повседневной жизни филиппинцев изменились из-за недавних экономических потрясений. Введя налоговые льготы по определенным повседневным товарам, мы улучшим ситуацию в стране, сначала на местном уровне, а затем и на национальном уровне." # Several items of the Filipino's day to day lives have had their prices altered by the recent economic upheaval. By enacting tax breaks on certain day to day items, we will improve the situation of the country, first locally, and then nationally.
 PHI_efficient_industrial_management: "Эффективное промышленное управление" # Efficient Industrial Management
 PHI_efficient_industrial_management_desc: "Правильное управление промышленностью и корпорациями должно находиться в руках капиталистов; ибо они знают, как оно знает и как его улучшить." # Proper handling of the industries and corporations need to be in the hands of the capitalists; for they know how it knows and how to improve it.
 PHI_strengthen_the_constabulary: "Укрепить полицию" # Strengthen the Constabulary
 PHI_strengthen_the_constabulary_desc: "Одна из ошибок бывшего правительства заключается в том, что оно недооценило радикалов, дестабилизирующих страну. К счастью, нынешняя администрация извлекла уроки из этой ошибки и будет продолжать укреплять внутреннюю безопасность государства, расширяя возможности сил безопасности, которые несут за нее ответственность." # One failure of the former government is they underestimated the radicals who are destabilizing the country. Fortunately, the current administration have learned from that mistake and will persue to strengthen the internal security of the state by empowering the security forces that has the responsibility for it.
 PHI_handle_the_threats: "Справляйтесь с угрозами" # Handle the Threats
 PHI_handle_the_threats_desc: "Когда государство будет обеспечено, у нас, наконец, появится возможность справиться с внутренними угрозами, которые пытаются дестабилизировать нынешнее правительство." # With the state secured, we finally have the capability to deal with the internal threats that are attempting to destablize the current government.
 PHI_promote_non_socialist_unions: "Продвигайте несоциалистические союзы" # Promote Non-Socialist Unions
 PHI_promote_non_socialist_unions_desc: "Вопреки распространенному мнению, не все профсоюзы имеют политическую позицию, есть некоторые, которые больше озабочены государством и работниками, такими как их льготы, компенсации и условия труда. Эти профсоюзы иногда не обладают идеологической лояльностью, поддерживая правительства, которые могут гарантировать благополучие рабочих. Мы будем поддерживать эти профсоюзы и в то же время гарантировать права и благосостояние их работников, чтобы заставить их поддержать наш режим." # Contrary to popular belief, not all trade unions have political staces, there are some that are more concerned with the state and the workers such as their benefits, compensation and workplace environment. These unions sometimes hold no ideological loyalty, supporting governments that can guarantee the welfare of the workers. We will support these unions and at the same time, guarantee their workers' rights and welfare to make them support our regime.
 PHI_national_youth_commission: "Национальная молодежная комиссия" # National Youth Commission
 PHI_national_youth_commission_desc: "Некоторые эксперты полагают, что лучшим решением против нынешнего беззакония среди молодежи нашей страны было бы организовать их так, чтобы они могли приобретать новые навыки и использовать свою энергию на благо общества. Республиканский закон № 8044, направленный на создание Национальной комиссии по делам молодежи, поможет нам сделать именно это." # Some experts have suggested that the best solution against the current lawlessness in our nation's youth would be organising them so that they can learn new skills and employ their energy for the public good. The Republic Act 8044, aims to create the National Youth Commission will help us do exactly that.
 PHI_military_industrial_complex: "Военно-промышленный комплекс" # Military Industrial Complex
 PHI_military_industrial_complex_desc: "Поскольку беспорядки в Соединенных Штатах и ​​щупальца Империи восходящего солнца угрожают самому нашему существованию, Филиппинам необходимо быть готовыми к вызовам, которые их ждут впереди. Инвестируя в наших местных производителей оружия, мы обеспечим, чтобы филиппинский солдат был хорошо подготовлен к предстоящим задачам." # With the unrest in the United States and the tentacles of the Empire of the Rising Sun threatens our very existence, the Philippines for then ever needs to be ready for the challenges that are ahead of it. With investing in our local arms producers, we will ensure the Filipino soldier is well equipped for the challenges that lay ahead.
 PHI_education_for_the_masses: "Образование для масс" # Education for the Masses
 PHI_education_for_the_masses_desc: "Идея о том, что каждый филиппинец имеет право на образование, является правильной. Мы должны предоставить нашему народу ресурсы, необходимые для повышения благосостояния наших граждан и процветания нашей страны." # The idea that every Filipino has the right to an education is a correct one. We must provide our people with the resources needed to bolster the welfare of our citizenry and prosperity of our nation.
 PHI_national_bank_act: "Закон о Национальном банке" # National Bank Act
 PHI_national_bank_act_desc: "С тех пор банкиры и ростовщики стали чумой для этой страны. Мы разрушим иностранные и внутренние монополии на банковское дело, заставив банки разделиться на более мелкие и регулярно проверяться налоговыми комиссарами." # The banksters and money-lenders have been a plague on this nation since. We will break foreign and domestic monopolies on banking by forcing banks to break apart into smaller sizes and be regularly audited by the tax commissioners.
 PHI_mass_public_works_program: "Программа массовых общественных работ" # Mass Public Works Program
 PHI_mass_public_works_program_desc: "От дорог до плотин, от небоскребов до парков развлечений и всего, что между ними, — все строится в рекордных количествах. Все это часть обширного проекта генерала Паулино по индустриализации Филиппин и обеспечению им процветания. И вскоре Филиппины превратятся в настоящую утопию, каждый дюйм которой будет связан и ускоряется к Завтрашнему дню." # From Roads to Dams, From Skyscrapers to Amusement Parks, and everything in-between, all are being constructed in record numbers. This is all part of General Paulino's vast project to industrialize the Philippines and bring to them Prosperity. And soon, the Philippines will become a true utopia, every inch connected and accelerating towards Tomorrow. 
 PHI_smash_the_oligarchs: "Разбить олигархов" # Smash the Oligarchs
 PHI_smash_the_oligarchs_desc: "Богатые землевладельцы и бизнесмены оказывали влияние на правительство со времен испанского колониального периода. Система «падрино» была оружием, направленным на унижение и лишение малых и бедных их прав. Пришло время положить этому конец." # Wealthy landowners and businessmen have been influencing the government since the Spanish Colonial period. The \"padrino\" system has been a weapon to belittle and strip the small and the poor of their rights. It's time to end that.
 PHI_homeguard_expansion: "Расширение Ополчения" # Homeguard Expansion
 PHI_homeguard_expansion_desc: "Ужасное состояние нынешних вооруженных сил Филиппин неприемлемо и не может эффективно защитить страну. Поэтому правительство будет добиваться расширения возможностей и личного состава вооруженных сил для эффективной борьбы с возросшими угрозами внутри страны и за рубежом." # The abysmal status of the current armed forces of the Philippines is unacceptable and cannot defend the country effectively. Therefore, the government will persue to expand the capabilities and serviced manpower of the armed forces to effectively combat the increased threats domestically and abroad.
 PHI_the_fighting_filipinos: "«Боевые филиппинцы»" # \"The Fighting Filipinos\"
 PHI_the_fighting_filipinos_desc: "«Сражающиеся филиппинцы» — термин, придуманный никем иным, как генералом Висенте П. Лимом, — это пропагандистское прозвище, целью которого является вдохновить наших соотечественников сражаться и защищаться от иностранных агрессоров." # \"The Fighting Filipinos\" a term coined by no other than General Vicente P. Lim, is a propaganda moniker that aims to inspire our fellow countrymen to fight and defend against foreign aggressors.
 PHI_revolution_by_ballot: "Революция путем голосования" # Revolution by Ballot
 PHI_revolution_by_ballot_desc: "Неожиданная победа «Лабориты» на выборах делает ее одним из немногих примеров того, как социалистическая партия пришла к власти буржуазными средствами. Теперь мы можем начать Вторую филиппинскую революцию и превратить нашу страну в образцовое социалистическое государство в Азии." # The Laborita's surprise electoral victory makes it one of the few examples of a socialist party gaining power through bourgeois means. Now, we can begin the Second Filipino Revolution and turn our nation into a model Socialist State in Asia.
 PHI_secure_our_control: "Обеспечьте наш контроль" # Secure our Control
 PHI_secure_our_control_desc: "Наша неожиданная победа на выборах оставила горький привкус у наших реакционных политических оппонентов, и появились слухи о том, что они планируют свергнуть наше законно избранное правительство. Мы должны действовать первыми, чтобы филиппинский народ не погиб." # Our unexpected win in the elections has left a bitter taste in our reactionary political opponents, with rumours of them planning to overthrow our legitimately elected government. We must act first so that the Filipino people will not perish.
 PHI_purge_the_hardliners: "Очистить сторонников жесткой линии" # Purge the Hardliners
 PHI_purge_the_hardliners_desc: "Хотя у нас и наших радикальных товарищей одинаковое видение социалистических Филиппин, их методы реализации этого плана сильно отличаются от наших и вызывают большую тревогу, поскольку их видение управления страной похоже на диктатуру с красной краской, и мы не должны допустить этого." # Though we and our radical comrades have the same vision for a socialist Philippines, their methods of implementing it wildly differs from our own and is very disturbing, as their vision of governing the country is just like a dictatorship with red paint and we should not let that happen.
 PHI_nationalize_the_haciendas: "Национализировать гасиенды" # Nationalize the Haciendas
 PHI_nationalize_the_haciendas_desc: "Хотя распределение земли на Филиппинах далеко не самое худшее в Азии, все еще существует много регионов, где землевладельцы контролируют землю и имеют слишком много власти и влияния, эксплуатируя бедных фермеров. Таким образом, мы должны должным образом перераспределить землю между крестьянами и освободить их от угнетения." # While the Philippines' land distribution is far from the worst case in Asia, there are still many regions where landlords control the land and have far too much power and influence, exploiting poor farmers. As such, we must redistribute the land properly amongst peasants and free them from oppression.
 PHI_christian_socialism: "Христианский социализм" # Christian Socialism
 PHI_christian_socialism_desc: "Социализм и христианство сделаны из одной ткани. Оба стремятся спасти угнетенных от обрушившейся на них несправедливости. Наша славная республика также была создана из любви к свободе; давайте поддерживать наши принципы, принимать и поощрять теологию освобождения." # Socialism and Christianity are cut from the same cloth. Both strive to save the downtrodden from the injustices visited upon them. Our glorious republic was similarly created for love of liberty; let us uphold our principles and embrace and encourage the theology of liberation.
 PHI_literacy_programs: "Программы грамотности" # Literacy Programs
 PHI_literacy_programs_desc: "Хотя на Филиппинах не самый худший уровень неграмотности в Азии или даже в мире, мы всегда можем улучшить его к лучшему. Создание новых программ грамотности для нашего народа в конечном итоге принесет пользу нашему государству в долгосрочной перспективе." # While the Philippines' doesn't have the worst case of illiteracy in Asia or even in the world, we could always improve it for the better. Creating new literacy programs towards our people will ultimately benefit our state in the long run.
 PHI_nationwide_social_security: "Общенациональное социальное обеспечение" # Nationwide Social Security
 PHI_nationwide_social_security_desc: "Наша нация должна вернуть людям широкомасштабные социальные программы, вместо того, чтобы хранить деньги налогоплательщиков в сейфах и хранилищах. Вливание капитала в экономику посредством социального обеспечения сделает ее значительно более динамичной." # Our nation must give back to the people with wide reaching social programs, instead of storing taxpayer money in safes and vaults. Injecting capital into the economy through social security will make it greatly more vibrant.
 PHI_establish_philhealth: "Создать PhilHealth" # Establish PhilHealth
 PHI_establish_philhealth_desc: "Один из способов обеспечить здоровье нации – это обеспечить здоровье ее народа. Создание Национальной системы здравоохранения гарантирует, что ни один ребенок, мужчина или женщина не останется без лечения в будущем." # One way to ensure a healthy nation, is to ensure its people are healthy. Setting up the National Healthcare will sure that no child, man or women will go untreated in the future.
 PHI_townhall_democracy: "Ратушная демократия" # Townhall Democracy
 PHI_townhall_democracy_desc: "Новую республику невозможно построить авторитарными методами. Мы должны добиваться лучшего классового характера нашей демократии, принимая законы, расширяющие возможности участия широких масс и общественных собраний. Политические решения больше не будут отдаленным ропотом в Маниле; вместо этого они будут созданы прямо среди рабочих!" # The new Republic cannot be built through authoritarian means. We must pursue a better class character for our democracy by passing laws empowering grassroots engagement and town hall meetings. Political decisions will no longer be a distant murmur on Manila; instead, they'll be made right amongst the workers!
 PHI_communal_farms: "Коммунальные фермы" # Communal Farms
 PHI_communal_farms_desc: "Филиппинцы должны работать вместе! Фермеры как нация должны быть заинтересованы в совместной работе в общинных фермах, чтобы повысить свою производительность и поделиться своим урожаем со своими филиппинскими братьями и сестрами." # Filipinos must work together! As a nation, farmers must be incentivised to work together in communal farms to increase their productivity and share their harvest with their fellow Filipino brothers and sisters.
 PHI_publicly_owned_enterprise: "Государственное предприятие" # Publicly Owned Enterprise
 PHI_publicly_owned_enterprise_desc: "На Филиппинах долгое время избегали государственных предприятий, поскольку каждый из наших старых президентов подчинялся воле большого бизнеса над своим электоратом. Однако теперь, когда мы сломали ярмо корпораций, Конгресс наконец-то нашел место для использования государственных предприятий в филиппинской экономике." # Public enterprises were for a long time shunned in the Philippines, as every one of our old presidents was beholden to the will of Big Business over their electorate. However, now that we've broken the yoke of the corporations, Congress has finally found room to make use of publicly-owned enterprises in the Filipino economy.
 PHI_workers_cooperatives: "Рабочие кооперативы" # Worker's Cooperatives
 PHI_workers_cooperatives_desc: "Доминирование промышленных профсоюзов не обязательно означает смерть предпринимательства! Мы просто заменим начальников, которые несправедливо забирают часть прибыли. Вместо этого позвольте работникам решать на своих рабочих местах, справедливо разделяя богатство между собой." # The dominance of industrial unions need not mean the death of enterprise! We shall simply replace the bosses who take an unjust cut of the profits. Instead, let the workers decide within their workplaces, dividing the wealth fairly amongst themselves.
 PHI_protectionist_policies: "Протекционистская политика" # Protectionist Policies
 PHI_protectionist_policies_desc: "Советы профессиональных рабочих пришли к выводу, что протекционистская политика в отношении местных товаров уместна, но не столь радикальна, как старый Закон о тарифах Смута-Хоули. Более мягкий подход приведет к увеличению налоговых льгот для профсоюзов, которые действуют исключительно в Штатах, а также к пропагандистскому толчку «покупайте филиппинское», как мы должны были это делать во время первой мировой войны." # The Councils of Professional Workers have concluded that a protectionist policy towards local goods is in order, but not as drastic as the old Smoot-Hawley Tariff Act. A softer approach will see increased tax breaks for unions that operate solely in the States, as well as a propaganda push to \"Buy Filipino\" just as we should have during the first Great War.
 PHI_protecting_the_revolution: "Защита революции" # Protecting the Revolution
 PHI_protecting_the_revolution_desc: "Поддержание и защита духа революции будет иметь жизненно важное значение в ближайшие годы. Мы сталкиваемся с огромным внешним давлением со стороны реакционных держав по всему миру, с саботажем со стороны диссидентов внутри нашей собственной страны и с борьбой фракционности даже среди нашего руководства. Но наша воля еще не сломлена, борьба продолжается!" # Maintaining and protecting the spirit of the revolution will be vital in the coming years. We face enormous outside pressure from the reactionary powers around the world, sabotage from dissidents within our own nation, and the strife of factionalism even amongst our leadership. Our will isn't yet broken though, the struggle continues!
# Foreign
 PHI_into_the_world: "В мир" # Into the World
 PHI_into_the_world_desc: "Цитату «Ни один человек не является островом» можно также сказать народам и странам; ни одна страна не может быть самодостаточной, и все полагаются на других; и при этом мы должны создавать новые альянсы и поддерживать существующие, чтобы обеспечить наше выживание." # The quote \"No man is an island\" can also be said to nations and countries; no country can be self-sufficient and everyone relies on others; and with that, we must forge new alliances and maintain existing ones to ensure our survival.
 PHI_forgiven_but_never_forgotten: "Прощен, но никогда не забыт" # Forgiven but Never Forgotten
 PHI_forgiven_but_never_forgotten_desc: "Испанцы колонизировали нас более трех столетий; и с тех пор их страна находится в упадке; нет больше великой Испанской империи, которая когда-то контролировала Новый Свет; но существует страна, которая воюет между собой. Хотя, как истинные чада Божьи, мы простили им то, что они с нами сделали, но мы не должны забывать." # The Spanish have colonized us for more than 3 centuries; and since then, their country is at a decline; no more is the great Spanish Empire that once controlled the New World; but exists a country that is fighting among itself. Though as a true child of God, we have forgiven them on what they did to us, but we must not forget.
 PHI_look_to_the_west: "Посмотрите на Запад" # Look to the West
 PHI_look_to_the_west_desc: "Поскольку после Великой войны Соединенные Штаты оказались в изоляции, мы не можем в дальнейшем полагаться на них. Французы и британцы имеют ведущее влияние в мировой политике, и мы должны гарантировать, что не окажемся на их плохой стороне." # As the United States have entered to isolation after the Great War, we can't rely on them further. The French and the British have the leading influence in global politics and we must ensure that we won't be on their bad side.
 PHI_maintain_american_relations: "Поддерживать американские отношения" # Maintain American Relations
 PHI_maintain_american_relations_desc: "Американцы были нашими друзьями с момента основания новой Филиппинской Республики, и будет только полезно, если мы обеспечим, чтобы дружба длилась долго." # The Americans have been our friends since the foundation of the new Philippine Republic, and it's only beneficial that we ensure that friendship lasts.
 PHI_an_entente_outpost_in_the_east: "Аванпост Антанты на Востоке" # An Entente Outpost in the East
 PHI_an_entente_outpost_in_the_east_desc: "Как верный союзник Антанты, мы должны обеспечить свободу нашего региона от радикализма. Социализм, популизм и валкизм ведут только к тираническим диктатурам, и мы должны гарантировать, что они не распространятся на эту часть региона." # As a staunch ally of the Entente, we must ensure that our region is free from radicalism. Socialism, Populism and Valkism only leads to tyrannical dictatorships and we must be the one to ensure that it will not nourish on this part of the region.
 PHI_safeguard_the_colonies: "Защитите колонии" # Safeguard the Colonies
 PHI_safeguard_the_colonies_desc: "Французы были разбиты неудержимыми немецкими силами; сейчас они заняты защитой своей Родины. Мы могли бы снять с них некоторое давление, потребовав контроля над Индокитаем и другими территориями, высвободив им несколько ценных дивизий и живой силы." # The French have been overwhelmed by the unstoppable German forces; they are now busy defending their homeland. We could take some pressure off them by requesting control of Indochina and other territories, freeing them some precious divisions and manpower.
 PHI_contain_japanese_aggression: "Сдержать японскую агрессию" # Contain Japanese Aggression
 PHI_contain_japanese_aggression_desc: "В последнее время японцы проявили агрессивные действия в Китае; и совсем скоро мы станем их целью. Мы должны подготовиться и быть готовыми." # Recently, the Japanese have shown aggressive actions in China; and it won't be long until we are their target. We must prepare and be ready.
 PHI_the_siamese_affair: "Сиамское дело" # The Siamese Affair
 PHI_the_siamese_affair_desc: "Японцы оказывают давление на Сиамское королевство, чтобы те присоединились к ним в «освобождении Азии» и пообещали им земли, которые были потеряны для французов несколько десятилетий назад. В эту игру могут сыграть двое, мы также можем оказать давление на сиамского короля, чтобы тот присоединился к нам, или столкнуться с неумолимой яростью нашей военной мощи." # The Siamese Kingdom are being pressured by the Japanese to join them in \"liberating Asia\" and promising them lands that were lost to the French decades ago. Well two could play that game, we can also pressure the Siamese King to join us, or face an unrelenting fury of our military might.
 PHI_strike_the_empire: "Удар по Империи" # Strike the Empire
 PHI_strike_the_empire_desc: "Планы готовы, и мы согласовали их с нашими союзниками. Мы должны перехватить инициативу, нанеся удар первыми по Японии, чтобы они знали, на что мы способны." # The plans are ready and we have coordinated with our allies. We must seize the initiative, by striking on Japan first, that way, they know what we are capable of.
 PHI_support_the_koreans: "Поддержите корейцев." # Support the Koreans
 PHI_support_the_koreans_desc: "С 1910 года Корейский полуостров находится под сапогом Японии, а миллионы корейцев угнетаются японскими повелителями. К счастью, мы связались с некоторыми корейскими группами сопротивления, действующими на полуострове, и, имея значительные запасы и финансирование, они начнут восстание против японцев." # Since 1910, the Korean peninsula has been under the Japanese jackboot and millions of Koreans are oppressed by the Japanese overlords. Fortunately, we have contacted some Korean resistance groups operating in the peninsula, and with some sizeable supplies and funding, they will launch a rebellion against the Japanese.
 PHI_support_the_koreans_tt: "Будут доступны подрывные операции в направлении @JAP §Y[JAP.GetName]§!, что позволит нам §Gначать восстание§!." # Subversive operations towards @JAP §Y[JAP.GetName]§! will be available allowing us to §Glaunch an insurrection§!.
 PHI_spanish_captaincy_general_islands: "Испанские Генерал-Капитанские острова" # Spanish Captaincy General Islands
 PHI_spanish_captaincy_general_islands_desc: "Некоторые острова в Тихом океане когда-то находились под управлением вице-королевства Новая Испания. Эти острова, хотя некоторые из них находятся далеко, имеют такую ​​же культуру, как и наша, было бы замечательно, если бы мы могли добавить их в наш архипелаг, присоединив их к нашей семье." # Some islands in the Pacific were once administered by the Viceroyalty of New Spain. These islands, while some of them are far, has the similar culture as ours, it would be a great idea if we can add them to our archipelago, adding them to our family.
 PHI_arm_the_white_russians: "Вооружите белых русских" # Arm the White Russians
 PHI_arm_the_white_russians_desc: "Белые русские являются законным правительством России после отречения царя Николая II. Однако кровожадные Советы оттеснили их обратно в Сибирь. Мы могли бы помочь им в борьбе против Советов, чтобы еще больше остановить распространение социализма в мире." # The White Russians, are the legitimate government of Russia since Tsar Nicholas II abdicated. However, they were driven back onto Siberia by the bloodthristy Soviets. We could aid them on their fight against the Soviets, to further halt the expansion of Socialism in the world.
 PHI_support_the_kuomitang: "Поддержите Гоминьдан" # Support the Kuomintang
 PHI_support_the_kuomitang_desc: "Правительство Гоминьдана, возглавляемое [KMT.GetLeader], является одной из многих клик полевых командиров, существующих на материковой части Китая. Однако убеждения Гоминьдана совпадают с нашими собственными; защита свободы людей; и они ведут крестовый поход, пытаясь остановить империализм в Китае. Мы должны помочь им в их борьбе." # The Kuomintang Government, lead by [KMT.GetLeader] are one of the many warlord cliques that exist in the Chinese mainland. However, the beliefs of the Kuomintang aligns with our own; safeguarding liberty of the people; and they are in a crusade in stopping imperialism on China. We must aid them on their fight.
 PHI_pivot_to_japan: "Поворот в Японию" # Pivot to Japan
 PHI_pivot_to_japan_desc: "Еще до того, как испанцы пришли на наши острова, наш народ и японцы исторически были дружелюбны друг к другу, принося друг другу пользу через торговлю. Когда американцы решили аннексировать Филиппины в 1898 году, японские добровольцы сражались вместе с нами, стремясь изгнать других западных империалистов на азиатские земли. Союз с ними гарантировал бы, что Азия будет свободна от колониализма в обозримом будущем." # Even before the Spanish came to our islands, our people and the Japanese have been historically friendly to each other, benefitting each other through trade. When the Americans decided to annex the Philippines in 1898, there were Japanese volunteers who have fought with us, aiming to expel other Western imperalist on Asian lands. An alliance with them would ensure that Asia will be free of colonialism for the forseeable future.
 PHI_our_soviet_comrades: "Наши советские товарищи" # Our Soviet Comrades
 PHI_our_soviet_comrades_desc: "Пришло время занять наше место среди наших братьев и сестер международного социалистического содружества. Вместе мы будем непобедимы!" # The time has come to take our place amidst our brothers and sisters of the international socialist community. Together we shall be invincible!
 PHI_on_our_own: "самостоятельно" # On Our Own
 PHI_on_our_own_desc: "Зачем нам прилагать усилия к созданию альянсов? Все кандидаты — просто империалисты с разным клеймом; и мы можем пройти сами. Хотя мы не сильны в военном отношении, у нас есть рабочая сила, фермы и ресурсы, которые помогут нам стать самодостаточными." # Why would we put an effort in making alliances? All of the candidates are just imperialists with a different branding; and we can go by on our own. While we are not strong militarily, we have the manpower, the farms, and the resources to help us being self-sufficient.
 PHI_anti_colonialist_crusade: "Антиколониалистический крестовый поход" # Anti-Colonialist Crusade
 PHI_anti_colonialist_crusade_desc: "Мы сами испытываем эту ужасную западную практику колониализма, эксплуатирующую богатства земли и порабощающую собственный народ. Нам необходимо добиться того, чтобы эта практика прекратилась раз и навсегда." # We ourselves experience that awful Western practice of colonialism, exploiting the richness of the land while enslaving our own people. We need to make sure that these practice stops once and for all.
 PHI_liberate_indochina: "Освободить Индокитай" # Liberate Indochina
 PHI_liberate_indochina_desc: "Индокитайский регион был колонизирован и эксплуатирован французами с 1862 года. Этнические жители там слишком долго были лишены свободы; и как их азиатские братья мы должны помочь им вернуть себе данные Богом права." # The Indochinese region have been colonialized and exploited by the French since 1862. The ethnic people there have been too long deprived of their liberty; and as their Asian brothers we must help them in reclaiming these God-given rights to them.
 PHI_fuel_insurrection_in_indochina: "Топливное восстание в Индокитае" # Fuel Insurrection in Indochina
 PHI_fuel_insurrection_in_indochina_desc: "У нашей страны нет возможностей, необходимых для полномасштабного вторжения в Индокитайский регион, поэтому мы будем мыслить нестандартно. Движения за независимость Индокитая существовали; некоторые из них сосланы сюда, в Манилу или Токио. Мы будем финансировать эти движения, чтобы организовать вторжение в регион; и мы объединимся с ними." # Our country do not have the capacity required to do a full-blown invasion of the Indochinese region, so will think outside the box. Indepenedence movements of the Indochinese region have existed; with some of them exiled here in Manila or Tokyo. We will fund these movements to create an incursion in the region; and we will ally ourselves to them.
 PHI_fuel_insurrection_in_indochina_tt: "Будут доступны подрывные операции против @FIC §Y[FIC.GetName]§!, что позволит нам §Gначать восстание§!." # Subversive operations towards @FIC §Y[FIC.GetName]§! will be available allowing us to §Glaunch an insurrection§!.
 PHI_the_burmese_question: "Бирманский вопрос" # The Burmese Question
 PHI_the_burmese_question_desc: "Бирма является стратегическим местом, если нашими целями являются Индия и Китай. Обладание этими территориями может помочь нам ослабить британское, индийское и китайское влияние в регионе." # Burma is a strategic location if our targets are India and China, possessing these territories can help us deminish British, Indian and Chinese influence in the region.
 PHI_second_insulindian_revolution: "Вторая Инсулиндианская революция" # Second Insulindian Revolution
 PHI_second_insulindian_revolution_desc: "Инсулиндийцам не удалось вернуть себе свою страну; но это не значит, что они не могут попробовать еще раз. Конверсионные операции в регионе будут проводить наши оперативники; контакт с остатками повстанцев; при соответствующем снабжении и финансировании с нашей стороны, а также при прямом нападении наших войск на Борнео; победа неминуема." # The Insulindians have failed to reclaim their country; but that doesn't mean that they can't try it again. Convert operations in the region will be conducted by our operatives; contacting the remnants of the revoluntaries; with proper supplies and funding from us, and a direct assault in Borneo by our troops; victory is imminent.
 PHI_second_insulindian_revolution_tt: "Будут доступны подрывные операции против @BEA §Y[BEA.GetName]§!, что позволит нам §Gначать восстание§!." # Subversive operations towards @BEA §Y[BEA.GetName]§! will be available allowing us to §Glaunch an insurrection§!.
 PHI_invite_insulindia: "Пригласить Инсулиндию" # Invite Insulindia
 PHI_invite_insulindia_desc: "После успеха Инсулиндианской революции мы сможем пригласить их в нашу фракцию; поэтому укрепим наш военный союз и еще больше изгоним влияние Запада в регионе." # With the Insulindian Revolution successfull, we can invite them into our faction; therefore strengthenin our military alliance and further expelling the Western influence in the region.
 PHI_the_co_prosperity_sphere: "[GetAppropriateFactionName]" # The [GetAppropriateFactionName]
 PHI_the_co_prosperity_sphere_desc: "Союз азиатских стран для противостояния западному империализму — не новая идея, но сейчас мы не можем позволить себе оставаться в одиночестве. Мы должны основать [GetAppropriateFactionName], чтобы укрепить свои позиции." # An alliance of Asian nations to oppose Western Imperialism is not a new idea, but now we cannot afford to stand alone. We must found the [GetAppropriateFactionName] in order to strengthen our position.
 PHI_invite_siam: "Добро пожаловать в Сиам" # Invite Siam
 PHI_invite_siam_desc: "Королевство Сиам — единственная страна в материковой Юго-Восточной Азии, не затронутая западным империализмом и колониализмом. Их положение на материке имеет значительное преимущество: они граничат с Британской Бирмой и Французским Индокитаем на западе и востоке, а также с Британской Малайей на юге. К счастью, они затаили серьезную неприязнь к этим жителям Запада, уступив французам значительные участки земель, что облегчило их приглашение в наш военный союз." # The Kingdom of Siam is the only country in mainland South-East Asia that is untouched by Western imperialism and colonialism. Their position in the mainland holds considerable advantage, bordering British Burma and French Indochina in the West and East and British Malaya in the South. Fortunately, they hold significant grudge against these Westerners, having ceeded considerable swatchs of lands to the French, making inviting them to our military alliance easier.
 PHI_strengthen_naval_presence: "Усиление военно-морского присутствия" # Strengthen Naval Presence
 PHI_strengthen_naval_presence_desc: "Многие из наших потенциальных врагов обладают большим флотом, способным уничтожить и потопить наш собственный, однако им не хватает настойчивости и мастерства среднего филиппинца, и уже одно это может буквально выиграть нам сражения или даже войны." # Many of our potential enemies possesses the large fleet, capable of destroying and sinking our own, however, they do not have the perseverence and workmanship of the average Filipino, and that alone can literally win us battles or even wars.
 PHI_operation_higante: "Операция Гигант" # Operation Higante
 PHI_operation_higante_desc: "Сиамцы съежились под давлением Великобритании и Франции, чтобы они не вступали в наш альянс. Но мы все еще можем что-то сделать; начать полномасштабное нападение на Королевство, чтобы заставить его подчиниться нашей воле." # The Siamese have cowered when pressured by the British and French not to join our alliance. But we can still do something; launching a full-blown assault on the Kingdom to make them submit to our will.
 PHI_influence_india: "Влияние Индии" # Influence India
 PHI_influence_india_desc: "Индийцы, успешно получив независимость от британцев, также превратились в государства-военачальники, как и Китай. Однако мы можем объединиться с Временным правительством Индии, чтобы обеспечить непоколебимое наше влияние на Индийском субконтиненте." # The Indians having successfully gained their independence from the British, have also collapsed into warlord states just like China. However, we can ally the Indian Provisional Government to make sure that our influence in the Indian subcontinent is unwavering.
 PHI_liberate_india: "Освободить Индию" # Liberate India
 PHI_liberate_india_desc: "Британское владычество, жемчужина Британской империи, а также символ западного империализма в Азии, боролось за свое выживание против самого индийского населения. Взяв под контроль эту мерзость, мы продемонстрируем нашу силу в Европе." # The British Raj, the Crown Jewel of the British Empire, and also a symbol of Western Imperialism in Asia have fought its survival against the Indian population itself. Taking control of this abomination will show off our strength in Europe.
 PHI_attack_australasia: "Атака Австралазии" # Attack Australasia
 PHI_attack_australasia_desc: "Чтобы продемонстрировать нашу мощь на Западе, наши объединенные начальники штабов предложили атаковать британские доминионы Австралию и Новую Зеландию. Если мы успешно возьмем под свой контроль Океанию, влияние Запада в нашем полушарии уменьшится." # To show-off our might within the West, our combined Chiefs of Staff have proposed to attack the British Dominion of Australia and New Zealand. If we successfully taken control of Oceania, western influence in our hemisphere will deminish.
# Industry
 PHI_osmena_industrialization_plan: "План индустриализации Осменьи" # Osmeña Industrialization Plan
 PHI_osmena_industrialization_plan_desc: "План индустриализации Филиппин, получивший название «План Осменья», представляет собой совокупность правительственных политик и программ, которые могут модернизировать филиппинскую экономику и превратить ее в индустриализированную. Этот план направлен на снижение зависимости экономики от сельскохозяйственного центра и одновременное диверсификацию в большем количестве отраслей, таких как туризм и производство, которые могут помочь создать рабочие места и увеличить доходы правительства." # The Philippine Industrialization Plan, dubbed as the Osmeña Plan, is a collection of government policies and programs that can modernize the Philippine economy towards an industrialized one. This plan aims to reduce the economy's reliance on the agricultural center while diversifying in more industries such as tourism and manufacturing that can help create jobs and more income for the government.
 PHI_osmena_industrialization_plan_tt: "£decision_icon_small §YРешения§! относительно §cпромышленных инвестиций§! будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! concerning §cindustrial investments§! will be §Yunlocked§!
 PHI_grant_more_visas: "Выдавать больше виз" # Grant More Visas
 PHI_grant_more_visas_desc: "Решение президента Кесона открыть границы Филиппин для приема беженцев принесло свои плоды; их навыки оказались полезными для модернизации страны; и правительство считает, что разрешение большего количества беженцев из Европы приведет к тому же эффекту." # President Quezon's decision to open the Philippine's borders to accept refugees have come into fruituition; their skills proved to be beneficial in modernizing the country; and the government thinks of allowing more refugees from Europe will do the same effect.
 PHI_farmer_subsidization_act: "Закон о субсидировании фермеров" # Farmer Subsidization Act
 PHI_farmer_subsidization_act_desc: "Закон о субсидировании фермеров, автором которого является сенатор Эулогио Родригес-старший, направлен на обеспечение фермеров семенами, удобрениями и решениями для орошения, которые могут помочь снизить стоимость основных сельскохозяйственных продуктов, таких как рис и кукуруза. Этот закон также позволяет правительству напрямую покупать урожай у фермеров по выгодной цене, а затем продавать его на рынке по низкой цене." # Authored by Senator Eulogio Rodriguez Sr., the Farmer Subsidization Act aims to provide the farmers seeds, fertilizers, and irrigation solutions that can help bring down the cost of essential agricultural products such as rice and corn. This act also enables the government to directly buy the crops from the farmers for a profitable price, then sell it to the market for a low cost.
 PHI_build_up_irrigation_systems: "Строительные ирригационные системы" # Build-up Irrigation Systems
 PHI_build_up_irrigation_systems_desc: "Одна из проблем, почему фермеры не могут выращивать достаточно урожая, заключается в том, что нет достаточных гидротехнических или ирригационных систем, которые могли бы помочь им поливать свои посевы и фермы; построив больше государственных ирригационных систем и расширив существующие, мы можем гарантировать, что наши фермеры получат облегчение, поскольку о их фермах позаботятся." # One of the problems of why farmers can't grow enough crops is that, there are no sufficient waterworks or irrigation systems that can help them water their crops and farms; by building more public irrigation systems and expanding current ones we can ensure that our farmers can be relieved as their farms are being taken care of.
 PHI_import_american_machinery: "Импорт американского оборудования" # Import American Machinery
 PHI_import_american_machinery_desc: "Часть программы модернизации, предложенной Планом Осменья, заключается в модернизации и оснащении наших фермеров новейшей сельскохозяйственной техникой. Мы уже поговорили с некоторыми американскими компаниями, производящими это оборудование, и они более чем рады продать нам его с небольшой скидкой." # Part of the modernization program proposed by the Osmeña Plan is to modernize and equip our farmers with the latest farm machinery. We already talked to some American companies producing these equipments, and they are more than happy to sell us with a small discount.
 PHI_ensure_food_sufficiency: "Обеспечить достаточное количество продовольствия" # Ensure Food Sufficiency
 PHI_ensure_food_sufficiency_desc: "Модернизированные города и расширенные промышленные мощности бесполезны, если наши люди не могут есть; Если мы продолжим превращать сельскохозяйственные угодья в промышленные или жилые районы, у нас могут закончиться фермы, производящие сельскохозяйственные культуры для производства продуктов питания. Мы должны добиться того, чтобы на рынке не возникло дефицита продовольствия." # Modernized cities and expanded industrial capacity is useless if our people cannot eat; if we keep transforming farmlands into industrial or residential areas, we may run out of farms producing crops for food. We must ensure that there will not be a food deficit in the market.
 PHI_new_cities: "Новые города" # New Cities
 PHI_new_cities_desc: "Перепись населения показывает, что население быстро растет, и поэтому правительство начинает строить больше городов в неосвоенных районах. Одной из таких территорий является незастроенная земля между Марикиной и Калуканом. Развитие этих районов может помочь уменьшить растущую загруженность дорог в Маниле." # Census suggests that the population is rapidly growing, and such, the government is launching to build more cities in undeveloped areas. One such area for this is an undeveloped land between Marikina and Caloocan. Developing these areas can help alleviate the growing congestion in Manila.
 PHI_new_cities_tt: "\n£decision_icon_small §YРешения§!, касающиеся создания новых §ccities§!, будут §Yразблокированы§!" # \n£decision_icon_small  §YDecisions§! concerning on creating new §ccities§! will be §Yunlocked§!
 PHI_deals_with_san_miguel: "Специальные предложения с Сан-Мигелем" # Deals with San Miguel
 PHI_deals_with_san_miguel_desc: "San Miguel Corporation — филиппинский конгломерат с диверсифицированной бизнес-моделью. Правительство заинтересовано в партнерстве с корпорацией Сан-Мигель в развитии различных отдаленных районов страны в надежде превратить их в современные промышленные центры, обеспечивающие людей работой." # The San Miguel Corporation is a Filipino conglomerate with a diverisified business model. The Government has an interest in partnering with San Miguel Corporation in developing various remote areas in the country in hopes of transforming them into a modern and industrial hubs providing the people with jobs.
 PHI_invite_foreign_investors: "Пригласить иностранных инвесторов" # Invite Foreign Investors
 PHI_invite_foreign_investors_desc: "В то время как филиппинская экономика растет, финансовые возможности правительства такие же, как и всегда, бюджет, необходимый для этих амбициозных проектов, осуществляемых и реализуемых правительством, не может быть профинансирован только государством. Нам необходимо поощрять некоторых иностранных инвесторов доверять нам свои инвестиции и финансировать проекты модернизации, осуществляемые правительством." # While the Filipino economy is growing, the financial capacity of the government is the same as always, the budget required by these ambitious projects carried out and implemented by the government can't be alone financed by the state. We need to encourage some foreign investors in trusting us with their investments and finance the modernization projects carried out by the government.
 PHI_invite_foreign_investors_tt: "£decision_icon_small §YРешения§! относительно приглашения §cиностранных инвесторов§! будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! concerning on inviting §cforeign investors§! will be §Yunlocked§!
 PHI_resource_excavation: "Раскопки ресурсов" # Resource Excavation
 PHI_resource_excavation_desc: "Наши богатые полезными ископаемыми острова предоставляют нам ресурсы, которым другие страны могут нам завидовать; и тем не менее, есть еще немало неиспользованных мест, готовых для разработки этих полезных ископаемых и сырья." # Our mineral rich islands provides us with resources that other countries have to envy us about; and yet there are still quite an untapped locations ready for these minerals and raw materials to be exploited.
 PHI_new_armament_factories: "Новые заводы по производству вооружений" # New Armament Factories
 PHI_new_armament_factories_desc: "Одним из потенциальных рынков, на котором мы могли бы расширяться, является рынок оружия и вооружений. Конечно, инвестировать в оружие для модернизации экономики может быть необычно, но в долгосрочной перспективе это будет гораздо более выгодно, поскольку нам не придется полагаться на иностранные оружейные компании для оснащения наших солдат и полицейских для защиты филиппинского народа." # One potential market we could expand on is the weapons and armaments market, sure it can be unconventional to invest in weapons to modernize the economy, but in the long-run it will be much more beneficial as we do not have to rely on foriegn weapons companies to equip our soldiers and policemen in defending the Filipino people.
 PHI_central_luzon_state_university: "Центральный государственный университет Лусона" # Central Luzon State University
 PHI_central_luzon_state_university_desc: "Небольшая школа в Муньосе, Нуэва-Эсиха; Сельскохозяйственная школа Центрального Лусона специализируется на сельскохозяйственных науках и механике. Финансирование этой небольшой школы может помочь нам обучить гораздо больше филиппинцев, способствовать развитию сельскохозяйственного образования и обеспечить углубленное обучение, а также техническую и профессиональную подготовку в области сельского хозяйства и механики." # A small school in Muñoz, Nueva Ecija; the Central Luzon Agricultural School specializes in agriculture sciences and mechanic arts. Funding this small school can help us education a lot of more Filipinos, promote agricultural education and provide advance instruction and technical and professional training in agriculture and mechanic arts.
 PHI_philippine_atomic_energy_program: "Филиппинская программа по атомной энергии" # Philippine Atomic Energy Program
 PHI_philippine_atomic_energy_program_desc: "Стоя на пороге открытия, которое изменит мир, мы не можем позволить другим зажечь огонь, который однажды может поглотить Землю." # Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth.
 PHI_tourism_adventures: "Туризм Приключения" # Tourism Adventures
 PHI_tourism_adventures_desc: "Будучи архипелагом, мы имеем множество береговых линий и островов, полных прекрасных пляжей, величественных гор и других чудес природы, которые мы можем использовать для получения прибыли." # As an archipelago, we have a lot of coastline and islands that is full of beautiful beaches, mountains that are majestic and other natural wonders that can we use to generate profit.
 PHI_tourism_adventures_tt: "£decision_icon_small §YРешения§!, касающиеся улучшения §cинфраструктуры§! в направлении туристических мест, будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! concerning on improving §cinfrastructure§! towards tourist spots will be §Yunlocked§!
 PHI_railway_expansion: "Расширение железных дорог" # Railway Expansion
 PHI_railway_expansion_desc: "PNR или Филиппинская национальная железная дорога, основанная в 1892 году как Манильская железнодорожная компания, является государственной железнодорожной компанией страны. Вливание финансирования в компанию поможет расширить ее деятельность и улучшить качество обслуживания, что может быть полезно для уменьшения заторов на дорогах в Маниле и в различных местах страны." # The PNR or the Philippine National Railway, established in 1892 as the Manila Railway Company, is an state-owned railway company in the country. Pouring funding in the company will help expanding their operations and improve their service, that can be beneficial to reducing the traffic congestion in Manila and in various places in the country.
 PHI_expand_manila_harbour: "Расширить гавань Манилы" # Expand Manila Harbour
 PHI_expand_manila_harbour_desc: "С момента прибытия испанцев порт Манилы использовался для облегчения торговли между различными маршрутами, он даже использовался в торговле галеонами между Мексикой и Филиппинами. Этот порт имеет важное значение в исторических, культурных и экономических делах, и его расширение необходимо для модернизации страны." # Ever since the arrival of the Spanish, the port of Manila has been used to facilitate trade between various routes, it even has been used in the Galleon Trade between Mexico and the Philippines. This port holds significance in historic, cultural and economic affairs, and an expansion of the port is necessary to accomodate the modernization of the country.
# Army
 PHI_expand_the_philippine_scouts: "Расширение филиппинских скаутов" # Expand the Philippine Scouts
 PHI_expand_the_philippine_scouts_desc: "Филиппинские скауты были созданы армией США для помощи в оккупации архипелага; и в настоящее время у нас есть значительные силы для поддержания спокойствия на островах. Однако, если разразится конфликт, у нас нет шансов полностью защитить наш архипелаг, и поэтому правительство распорядилось увеличить численность филиппинских скаутов." # The Philippine Scouts was created by the United States Army to assist with the occupation of the archipelago; and we currently have the sizeable force in keeping the tranquility in the islands. However, if a conflict brakes out, we have no chance in fully defending our archipelago, and thus, the government have ordered to expand the enlisted men of the Philippine Scouts.
 PHI_combined_arms_doctrine: "Общевойсковая доктрина" # Combined Arms Doctrine
 PHI_combined_arms_doctrine_desc: "Некоторые члены нашего высшего командования выступают за теорию подавляющей огневой мощи как краеугольного камня нашей программы модернизации, заключающейся в обстреле вражеских позиций артиллерией перед атакой. Кроме того, офицеру, находящемуся на передовой, необходимо дать больше инициативы и ответственности." # Some members of our high command advocate for the theories of overwhelming firepower as the cornerstone of our modernisation program, hammering enemy positions with artillery before attacking. Additionally, more initiative and responsibility needs to be given to the officer at the front-line.
 PHI_armor_spearhead_doctrine: "Доктрина бронетанкового острия" # Armor Spearhead Doctrine
 PHI_armor_spearhead_doctrine_desc: "Высокая бронемобильность является ключевым моментом в современной войне. Вот почему мы должны убедиться, что у нас есть достаточный запас бронированных механических транспортных средств, которые мы знаем, как правильно использовать." # High Armored Mobility is key in modern warfare. Which is why we should make sure we have an ample supply of armored mechanical vehicles that we know how to properly utilize.
 PHI_extensive_planning_doctrine: "Доктрина обширного планирования" # Extensive Planning Doctrine
 PHI_extensive_planning_doctrine_desc: "Некоторые члены нашего аппарата превыше всего ценят дисциплину, тщательное логистическое планирование и организационную целостность. Они верят, что благодаря тщательному планированию и общей моторизации они смогут сделать филиппинских солдат величайшими в мире!" # Some members of our chief of staff believe in discipline, thorough logistical planning and organisational integrity above all else. With extensive planning and a general motorisation, they believe that they can make the Filipino soldiers the greatest in the world!
 PHI_mass_mobilization_doctrine: "Доктрина массовой мобилизации" # Mass Mobilization Doctrine
 PHI_mass_mobilization_doctrine_desc: "Мобилизация всего населения на защиту страны станет залогом успеха! Иностранные захватчики не решатся высадиться на берегах нашего архипелага, поскольку на них заранее нападут многочисленные филиппинские солдаты!" # Mobilizing the entire population to defend the country will be the key to success! Foreign invaders will hesitate to land on the shores of our archipelago as numerous Filipino soldiers will attack them beforehand!
 PHI_modernize_firepower: "Модернизация огневой мощи" # Modernize Firepower
 PHI_modernize_firepower_desc: "Иногда применение артиллерийского огня необходимо не столько для разгрома противника, сколько для его дезорганизации и расшатывания. Эффективная такая кампания позволяет противнику показать свою слабость, поэтому нам следует вкладывать средства в артиллерию, наиболее эффективную в этом направлении." # Sometimes, using artillery fire is necessary not so much for defeating the enemy, as much as disorganising and discombobulating it. Effective campaign of such allows the enemy to show its weakness, which is why we should invest in artillery most effective in this department.
 PHI_equipment_assembly_lines: "Линии сборки оборудования" # Equipment Assembly Lines
 PHI_equipment_assembly_lines_desc: "Производство техники ограничивает наши возможности по расширению и оснащению наших войск качественным вооружением; пока у нас нет такого огромного размера военной промышленности, как у американцев или немцев; однако у нас есть квалифицированные рабочие, которые готовы вложить свои сердца и души в создание этого оружия." # Equipment production hinders our capability to expand and equip our troops with quality armaments; while we do not have the sheer size of the weapons industry of the Americans or the Germans; we have however, skilled workers that are willing to pour their hearts and souls in making these weapons.
 PHI_army_engineering_corps: "Армейский инженерный корпус" # Army Engineering Corps
 PHI_army_engineering_corps_desc: "Учитывая разнообразную местность, на которой нам предстоит сражаться, а также зачастую отсутствие инфраструктуры в некоторых частях страны, создание специализированного инженерного корпуса стало бы большим благом для наших вооруженных сил. Мы вложим средства именно в такое подразделение." # Given the varied terrain we will be fighting in, combined with the often lacking infrastructure parts of the country, the creation of a specialised engineer corps would be a great boon to our armed forces. We will put funds towards just such a unit.
 PHI_catching_up_with_communications: "Взаимодействие с коммуникациями" # Catching up with Communications
 PHI_catching_up_with_communications_desc: "Армейскую радиослужбу можно смело считать одним из столпов будущей войны. Тем не менее, сервису по-прежнему не хватает надлежащей централизованной структуры, которая сделала бы его использование эффективным. Давайте реализуем централизованную схему." # The Army Radio Service can easily be considered one of the pillars of future warfare. Yet, the service still lacks a proper centralized structure to make its use effective. Let us implement a centralized scheme.
 PHI_tank_production_initiatives: "Инициативы по производству танков" # Tank Production Initiatives
 PHI_tank_production_initiatives_desc: "Танки — грозная машина на поле боя, но их очень сложно построить. Создав базовые стандарты качества, мы сможем ускорить производство бронетехники и снабдить своими танками крупные бронетанковые дивизии, которые обрушатся на противника как кирпич." # Tanks are a fearsome machine on the battlefield, but they are a very complex machine to build. By creating baseline quality standards, we can speed up production of armour and supply our tanks with large armoured divisions that will come down on the enemy like a brick.
 PHI_armor_research_and_modernization: "Исследование и модернизация брони" # Armor Research and Modernization
 PHI_armor_research_and_modernization_desc: "Экспериментирование в отделе резервуаров (сосредоточенном вокруг локомотивного завода Каинта) — это то, чем мы занимаемся уже почти десять лет, и кажется, что наши усилия начали приносить плоды, возглавляемые генералом Матео С. Капинпином. Мы должны предпринять шаги для развертывания наших прототипов на местах." # Experimentation in the Tanking Department (centralized around the Cainta Locomotive Factory) is something that we've been engaging in for almost a decade now and it seems like our efforts have started to bear fruit, spearheaded by General Mateo S. Capinpin. We should take steps to deploy our prototypes on the field.
 PHI_reconnaissance_improvements: "Улучшения разведки" # Reconnaissance Improvements
 PHI_reconnaissance_improvements_desc: "Создавая подразделения разведки, мы всегда будем на шаг впереди противника. Мы будем знать, каков их следующий план и что нам нужно сделать, чтобы противодействовать ему." # By creating units dedicated to reconnaissance we will always be one step ahead of the enemy. We will know what their next plan is and what we need to do to counter-act it.
 PHI_mountaineers: "Альпинисты" # Mountaineers
 PHI_mountaineers_desc: "Генерал Паулино Сантос предложил создать экспериментальный «Горный корпус», чтобы должным образом защитить наши великие горы от врага. Нам нужно больше, лучше подготовленных альпинистов, чтобы обеспечить успех нашей кампании по защите филиппинцев и никогда больше не быть порабощенными." # General Paulino Santos have proposed to create an experimental \"Mountain Corps\" in order to properly defend our great mountains from the enemy. We need more, better trained mountaineers to ensure our success in our campaign to defend Filipinos and to never be subjugated again.
 PHI_conduct_war_games: "Военные игры" # War Games
 PHI_conduct_war_games_desc: "Расширение филиппинских скаутов, ныне филиппинской армии, привело к притоку новых рекрутов, хотя наши нынешние военнослужащие имеют некоторый боевой опыт, а эти новобранцы - нет; поэтому для того, чтобы выставить их на поле боя, не нанося при этом вреда их психическому здоровью; заключается в проведении военных игр для наших новобранцев." # The expansion of the Philippine Scouts, now the Philippine Army, has seen an influx of new recruits, while our current enlisted men have some sort of experience in combat, these new recruit have not; so in order to expose them to the battlefield while not damaging their mental health; is to conduct war games for our recruits.
 PHI_standardization_of_equipment: "Стандартизация оборудования" # Standardization of Equipment
 PHI_standardization_of_equipment_desc: "Наша нынешняя военная техника имеет разные страны происхождения. Мы должны создать свою или хотя бы унифицированную технику нашей армии." # Our current military's equipment have different countries of origin. We must create our own or at least standardized our army's equipment.
 PHI_army_scout_rangers: "Армейские разведчики-рейнджеры" # Army Scout Rangers
 PHI_army_scout_rangers_desc: "В джунглях терриан Юго-Восточной Азии нам нужно обучить нашу армию адаптироваться к истощению. Импровизация – ключ к выживанию." # In the jungle terrian of South-east Asia, we need to train our army to adapt to attrition. Improvising in the key to survival.
 PHI_logistical_improvements: "Логистические улучшения" # Logistical Improvements
 PHI_logistical_improvements_desc: "Многие потенциальные поля боя, к которым должны подготовиться наши военные, труднодоступны и труднопроходимы. Если мы хотим, чтобы наши вооруженные силы могли быть обеспечены достаточным снабжением на любой местности, нам следует сформировать специализированные батальоны, занимающиеся логистикой." # A lot of potential battlegrounds our military has to prepare for are difficult to reach and to traverse. If we wish for our military to be able to be adequately supplied in every terrain, we should form specialised battalions dealing with logistics.
 PHI_form_the_general_staff: "Сформировать Генеральный штаб" # Form the General Staff
 PHI_form_the_general_staff_desc: "Наши нынешние командиры, прошедшие обучение либо в Вест-Пойнте, либо здесь у американских офицеров, оказались более чем способными управлять армиями и их планированием. Правительство приказало военным сформировать генеральный штаб, который будет курировать планирование, проведение и развертывание наших военных операций." # Our current commanders, were trained in either in West Point, or here by American officers, were proved to be more than capable in handling the armies and their planning. The Government have ordered the military to form a general staff, one will oversee the planning, execution and deployment of our military operations.
 PHI_expand_the_constabulary_officers_school: "Расширить Школу офицеров полиции" # Expand the Constabulary Officers School
 PHI_expand_the_constabulary_officers_school_desc: "Школа офицеров полиции Филиппин в Кэмп-Генри Аллене - это школа офицеров, целью которой является обучение и инструктаж курсантов, а также подготовка их к службе в качестве офицеров полиции Филиппин. Мы можем расширить эту офицерскую школу, включив в нее подготовку для любых вооруженных сил нашего правительства." # The Philippine Constabulary Officers School in Camp Henry Allen is an officers school aimed at training and instructing cadets and preparing them for service as commissioned officers of the Philippine Constabulary. We can expand this officer school to include training for any armed force of the our government.
 PHI_learning_from_the_great_war: "Уроки Великой войны" # Learning from the Great War
 PHI_learning_from_the_great_war_desc: "Военные доктрины, определявшие наземные бои в Великой войне, устарели. Мы должны направить наши величайшие умы на задачу формирования военной мысли завтрашнего дня." # The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow.
 PHI_military_science: "Военная наука" # Military Science
 PHI_military_science_desc: "Танки, подводные лодки, самолеты, радары; Поле битвы постоянно меняется, особенно в те интересные времена, в которые мы живем. Мы должны гарантировать, что наши вооруженные силы не только получают современное оборудование, но также и чтобы наши генералы и адмиралы могли идти в ногу с этой эпохой постоянно меняющихся войн." # Tanks, submarines, planes, radar; the battlefield is ever changing, especially in the interesting times we live in. We must ensure that our military not only gets up to date equipment, but also that our generals and admirals can keep up with this age of ever changing warfare.
 PHI_fortress_philippines: "Крепость Филиппины" # Fortress Philippines
 PHI_fortress_philippines_desc: "Строительство оборонительных сооружений на ключевых участках стратегического значения в нашей стране является ключевым аспектом обороны. Таким образом, мы можем гарантировать, что ни один иностранный захватчик никогда больше не сможет наступить на филиппинскую территорию." # Constructing defenses in key areas of strategic importance in our country, is a key aspect of defence. That way we can ensure that no foreign invader can ever step on Filipino spoil ever again.
 PHI_legacy_of_general_luna: "Наследие генерала Луны" # Legacy of General Luna
 PHI_legacy_of_general_luna_desc: "Генерал Антонио Луна был нашим лучшим генералом во время Войны за независимость и Испано-американской войны; его героизму будут обучать всех солдат; вдохновить их патриотизмом и вспомнить, за что мы выступали во время Революции." # General Antonio Luna was our best general during Revolutionary War and the Spanish-American War; his heroism will be taught on all soldiers; to inspire them in patriotism and remember what we stood for during the Revolution.
# Navy
 PHI_start_naval_buildup: "Начать наращивание военно-морского флота" # Start Naval Buildup
 PHI_start_naval_buildup_desc: "Поскольку архипелаг состоит из различных островов в Тихом океане, мы должны обеспечить защиту наших морских территорий, и создание ВМС Филиппин поможет нам в этом." # As an archipelago comprises of different islands in the Pacific, we must ensure that our maritime territories are protected, establishing the Philippine Navy will help us do that.
 PHI_an_attack_underneath: "Атака снизу" # An Attack Underneath
 PHI_an_attack_underneath_desc: "Новое изобретение военно-морской войны с учетом достижений в области подводных технологий позволит нам эффективно наносить удары по вражеским конвоям." # Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys.
 PHI_strike_from_a_distance: "Удар на расстоянии" # Strike from a Distance
 PHI_strike_from_a_distance_desc: "Адаптация наших военно-морских доктрин для размещения крупных кораблей и обеспечения безопасности наших торговых конвоев научит нас многому о том, какие корабли нам нужны." # Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need.
 PHI_submarine_research: "Подводные исследования" # Submarine Research
 PHI_submarine_research_desc: "Подводная война — самое захватывающее военно-морское развитие со времен изобретения торпедного катера. Нам следовало бы не только защищаться от подводных лодок, но и использовать их против кораблей противника." # Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping.
 PHI_destoyer_modernization: "Модернизация эсминца" # Destroyer Modernization
 PHI_destoyer_modernization_desc: "Изучая конструкцию и стратегическое использование подводных лодок, мы также научились противодействовать этим стратегиям. Разрушители будут иметь решающее значение в этом." # Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this.
 PHI_cruiser_development: "Развитие крейсера" # Cruiser Development
 PHI_cruiser_development_desc: "Прежде чем приступить к передовым исследованиям линкоров, меньшие крейсеры нуждаются в замене." # Before making forays into advanced battleship research, the smaller cruisers are in need of replacement.
 PHI_new_and_improved_doctrines: "Новые и улучшенные доктрины" # New and Improved Doctrines
 PHI_new_and_improved_doctrines_desc: "Современные корабли вряд ли будут более полезны, чем корабли прошлого века, если мы не обновим и нашу военно-морскую доктрину. Готовое, как всегда, адмиралтейство наметило план доктринальной модернизации, который поможет нам быстро пересмотреть нашу тактику и переобучить наших офицеров." # Modern ships are barely any more useful than the ships of the last century if we don't update our naval doctrine as well. Ready as ever, the admiralty has outlined a doctrinal modernisation plan that will help us rapidly overhaul our tactics and retrain our officers.
 PHI_train_marines: "Поезд морских пехотинцев" # Train Marines
 PHI_train_marines_desc: "Особая часть ВМФ и Армии; Филиппинские морские пехотинцы станут нашей элитной силой на море и на суше. Специализируется на всем, что мы им бросаем." # A special part of the Navy and the Army; the Philippine Marines will be our elite force in the seas and the land. Specializes on everything that we throw at them.
 PHI_salvage_american_designs: "Спасение американских образцов" # Salvage American Designs
 PHI_salvage_american_designs_desc: "Напутственный подарок от американцев — парочка их старых проектов крейсера, эсминца и подводной лодки. Хотя эти разработки устарели, они могут оказать большую помощь в создании наших собственных сил морской обороны." # A parting gift from the Americans are a couple of their old designs for a cruiser, destroyer and submarine. While these designs are obsolete, they can be much help in building our own maritime defense force.
 PHI_naval_base_in_puerto_princesa: "Военно-морская база в Пуэрто-Принсесе" # Naval Base in Puerto Princesa
 PHI_naval_base_in_puerto_princesa_desc: "Департамент общественных работ исследовал некоторые районы в регионе Палаван, которые могут быть превращены в военно-морские верфи. Эти верфи будут использоваться для дальнейшего расширения возможностей нашей военно-морской обороны." # The Department of Public Works has explored some areas in the Palawan region that has the potential to be developed into naval shipyards. These shipyards will be used to further expand our naval defence capabilities.
 PHI_construct_the_davao_port: "Построить порт Давао" # Construct Davao Port
 PHI_construct_the_davao_port_desc: "Чтобы по-настоящему восстановить достойный внимания флот, мы должны значительно расширить наши судостроительные мощности." # To truly rebuild a navy worthy of note, we must greatly expand our shipbuilding capacity.
 PHI_refurbish_american_ships: "Ремонт американских кораблей" # Refurbish American Ships
 PHI_refurbish_american_ships_desc: "Частью соглашения между Соединенными Штатами и Филиппинами о независимости является содержание филиппинских баз, которые будут оккупированы американскими войсками. В этом соглашении также указано, что Соединенные Штаты предоставят Филиппинам устаревшую военно-морскую технику для защиты ее морских границ. Хотя эта военно-морская техника и выгодна для нас, она также достаточно старая и нуждается в ремонте собственными силами." # Part of the agreement by the United States and the Philippines for independence, is the maintenance of Filipino bases that will be occupied by American troops. In that agreement also stated, that the United States, will grant the Philippines its outdated naval equipment for the defence of its maritime borders. While these naval equipment is beneficial for us, they are also quite old, and needs to be refurbished by our own.
 PHI_dedicated_repair_facilities: "Специализированные ремонтные мощности" # Dedicated Repair Facilities
 PHI_dedicated_repair_facilities_desc: "Филиппинский флот находится в плачевном состоянии, не имея ни кораблей, ни инфраструктуры, способных конкурировать с японским флотом. Однако помощь со стороны Соединенных Штатов планирует выровнять поле боя и гарантировать, что, если флоту не удастся победить в открытом бою, он сможет эффективно нарушить японское судоходство и преследовать прибрежные города Китая." # The Filipino fleet is in a pitiful state, having neither the ships nor the infrastructure to compete with the Japanese fleet. Assistance from the United States however plans to even the battleground and to ensure that if the fleet can't manage to win in an open battle, it can effectively disrupt Japanese shipping and harass the coastal cities of China.
 PHI_landing_craft: "Десантный корабль" # Landing Craft
 PHI_landing_craft_desc: "Подготовка наступательной или оборонительной операции за пределами наших островов требует обширного плана и, конечно, оборудования десантных кораблей." # Preparing an offensive or defensive operation beyond our isles requires an extensive plan and of course, a landing craft equipment.
# Air Force
 PHI_fund_an_air_force: "Финансировать ВВС" # Fund an Air Force
 PHI_fund_an_air_force_desc: "Воздушный бой станет решающим фактором будущих боевых действий. Выделение отдельного подразделения, которое будет обучать пилотов, экспериментировать с доктринами и управлять операциями, будет иметь первостепенное значение." # Air combat will be a deciding factor for future combat operations. Dedicating a separate branch that will train pilots, experiment on doctrines and manage operations will be a paramount of importance.
 PHI_bomber_research: "Исследования бомбардировщиков" # Bomber Research
 PHI_bomber_research_desc: "Когда люди будущего будут говорить об ужасах сегодняшних войн, особое внимание будет уделяться огненному дождю с небес. Мы сделаем все возможное, чтобы эти истории рассказали наши враги." # When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies.
 PHI_fighter_research: "Исследования истребителей" # Fighter Research
 PHI_fighter_research_desc: "Хотя бомбардировщик всегда может пройти, его ведомый — нет, если только они оба не защищены дружественными истребителями." # While the bomber might always get through, his wingman might not - unless they are both protected by friendly fighters.
 PHI_train_new_pilots: "Обучайте новых пилотов" # Train New Pilots
 PHI_train_new_pilots_desc: "С расширением наших военно-воздушных сил нам также необходимо обучать больше людей, которые будут пилотировать самолеты. Правительство уже разработало программу нашей собственной подготовки пилотов; и мы ожидаем притока призывников." # With the expansion of our airforce, we also need to train more men that will pilot the planes. The government already setup a program for our very own pilot training; and we are expecting an influx of recuits.
 PHI_paratroopers_research: "Исследования десантников" # Paratroopers Research
 PHI_paratroopers_research_desc: "В связи с недавним расширением и наращиванием ВВС прозвучало много призывов также увеличить и обучить количество десантников. Эти десантники были бы полезны, поскольку они могли бы легко преодолеть хорошо защищенные линии противника и захватить ключевые города, укрепления и города." # With the recent expansion and buildup of the Air Force, there have been many calls to also increase and train the amount of Paratroopers. These paratroopers would be useful, as they could easily get over heavily defended enemy lines, and capture key towns, fortifications, and cities.
 PHI_radar_development: "РАДАР Разработка" # RADAR Development
 PHI_radar_development_desc: "Если Филиппинам грозит вторжение, оно придет из-за моря. Таким образом, нам следует инвестировать значительные средства в новые радиолокационные технологии и построить наблюдательные станции вдоль побережья." # If the Philippines faces an invasion, it will come from across the sea. Thus, we should invest heavily into new radar technologies, and build watch stations along the coast.
 PHI_cas_research: "КАС Исследования" # CAS Research
 PHI_cas_research_desc: "Самолеты, обеспечивающие поддержку наших сухопутных войск и кораблей, оказались очень эффективным дополнением при относительно небольших инвестициях. Эти самолеты теперь имеют несколько предлагаемых улучшений. Наши инженеры могут разработать следующее поколение самолетов поддержки." # Planes which provide support for our land forces and ships have been a very efficient addition at a relatively small investment. These planes now have several suggested improvements. Our engineers can develop the next generation of support aircraft.
 PHI_aviation_doctrine: "Авиационная доктрина" # Aviation Doctrine
 PHI_aviation_doctrine_desc: "Дальнейшие достижения в авиации будут необходимы для хорошей интеграции наших военно-воздушных сил с другими видами вооруженных сил." # Further advances in aviation will be necessary to integrate our air force well with other branches of the military.
 PHI_protect_our_coasts_from_above: "Защитите наши побережья сверху" # Protect our Coasts from Above
 PHI_protect_our_coasts_from_above_desc: "В Конституции говорится, что суверенитет филиппинского государства распространяется не только на землю, на которой мы сейчас находимся, но также на моря и океаны и даже на воздушное пространство, покрывающее эти водоемы. Мы обеспечим защиту и контроль нашего воздушного пространства под землей и морями." # The Constitution states that the sovereignity of the Filipino state not only covers the land we are currently in but also the seas and oceans and even the airspace that covers those bodies of water. We will ensure that our airspace below the land and seas will be protected and monitored.
 PHI_construct_new_air_bases: "Постройте новые авиабазы" # Construct New Air Bases
 PHI_construct_new_air_bases_desc: "На архипелаге имеется единственная авиабаза, которую можно использовать для воздушных атак или перехвата; авиабаза Кларк. Если эта авиабаза будет уничтожена или захвачена противником, мы потеряем инициативу." # The archipelago has a single airbase that can be used for air attacks or interception; the Clark Airbase. If this airbase would be destroyed or controlled by the enemy, we will lose the initiative.
 PHI_air_defenses: "ПВО" # Air Defenses
 PHI_air_defenses_desc: "Защита воздушного пространства нашей страны — это не то, что мы можем сделать только с воздуха. Как только мы построим зенитные орудия в [Root.Capital.GetCapitalVictoryPointName], мы сможем спать спокойно, зная, что наша столица защищена с воздуха!" # Defending our nation's airspace is not something we can do only from the air. Once we construct anti-aircraft guns in [Root.Capital.GetCapitalVictoryPointName] we can sleep saver knowing that our capital is protected from the air!
# Pope
 PHI_sedes_es_patri: "Штаб-квартира — Патри" # Sedes es Patri
 PHI_sedes_es_patri_desc: "Поскольку власть папства превышает власть филиппинского правительства, многие ярые сторонники католической церкви сегодня выступили с требованием, чтобы Папа взял на себя руководство страной. Он уже принял роль, предложенную народом, и заявил, что то, что происходит сегодня, действительно является волей самого Бога. Сейчас правительство мало что может сделать, чтобы остановить его." # With the power of the Papacy exceeding that of the Philippine Government, many ardent supporters of the catholic church have today come out to demand the Pope take up leadership of the country. He has already accepted the role put forth by the people, and declared that what is happening today is indeed the will of God himself. There is not much the government can do to stop him now.
 PHI_reinforce_temporal_power: "Укрепление временной власти" # Reinforce Temporal Power
 PHI_reinforce_temporal_power_desc: "Растущая секуляризация общества означает уменьшение влияния Папы. Однако есть способы, с помощью которых мы можем усилить его влияние внутри его собственных границ." # The increasing secularisation of society means a lessening of the pope's influence. However, there are ways by which we can reinforce his influence inside his own borders.
 PHI_forced_conversions: "Принудительные преобразования" # Forced Conversions
 PHI_forced_conversions_desc: "Чтобы эффективно контролировать население, мы должны заставить каждого протестанта перейти в католицизм, нравится им это или нет." # To effectively control the population, we must force every protestant to convert to Catholicism, whether they like it or not.
 PHI_christian_education: "Христианское образование" # Christian Education
 PHI_christian_education_desc: "Мы знаем много светлых умов в наших университетах, но, к сожалению, им нужно больше финансирования для продолжения своих проектов, которое Церковь готова предоставить. Настало время улучшить качества наших ученых." # We know of many bright minds in our universities, but unfortunately, they need more funding to continue their projects, which the Church is ready to provide. It is time to improve the qualities of our scientists.
 PHI_purge_unbelievers: "Начать инквизицию" # Start the Inquisition
 PHI_purge_unbelievers_desc: "Хотя на территориях, которые мы в настоящее время контролируем, большинство христиан по вере, все еще есть меньшинства, которые не придерживаются нашей веры и могут стать проблемой в будущем. Чтобы быстро и эффективно сохранить наш контроль, мы должны быть готовы подавить мятеж любыми необходимыми средствами, даже если это потребует эскалации конфликта в краткосрочной перспективе." # While the territories we currently control are majority Christian in faith, there are still those who are minority not adhering to our faith and can be a problem in the future. In order to swiftly and effectively maintain our control, we must be ready to crush the insurgency by whatever means necessary, even if it requires an escalation of the conflict in the short-term.
 PHI_denounce_socialists: "Осудить социалистов" # Denounce Socialists
 PHI_denounce_socialists_desc: "Социализм — это бич всего святого. Недопустимо позволять католикам присоединяться к синдикалистским движениям. Папа должен опубликовать энциклику, чтобы разъяснить это." # Socialism is a scourge of all things holy. It is unacceptable to let Catholics join syndicalist movements. The pope must publish an encyclical to make this clear.
 PHI_a_call_to_the_faithful: "Призыв к верующим" # A Call to the Faithful
 PHI_a_call_to_the_faithful_desc: "Сердце самого христианства досталось неверующим, и с нашим новым центром здесь, в Маниле, мы должны бороться изо всех сил, чтобы гарантировать, что новое местопребывание Католической Церкви останется нетронутым нашими гнусными врагами." # The heart of Christianity itself has falled to the unbelievers, with our new center here in Manila, we must fight with all their strength to ensure that the new seat of the Catholic Church remains untouched by our vile foes.
 PHI_legionary_spirit: "Легионерский дух" # Legionary Spirit
 PHI_legionary_spirit_desc: "Благодаря дисциплине, организации, настойчивости и мотивации римских легионов Рим превратился из итальянского города-государства в величайшую мировую державу и навсегда оставил славный след в истории. В эти опасные времена мы должны возродить эту легендарную дисциплину и снова сделать римские легионы всемирно известными." # Through the discipline, organisation, persistence and motivation of the Roman Legions Rome emerged from an Italian city-state to become the world's greatest power and forever left a glorious mark on history. In these precarious times, we must revive this legendary discipline and make the legions of Rome internationally renowned once again.
 PHI_the_papal_knights: "Папские рыцари" # The Papal Knights
 PHI_the_papal_knights_desc: "Эти «рыцари» — не что иное, как шпионы и проводники воли папства среди народа, хотя их и прославляют как безупречных носителей благоволения Божьего." # These 'knights' are nothing more than spies and enforcers of the Papacy's will among the people, though they are lauded as unimpeachable bearer's of God's goodwill.
 PHI_integrate_zouave_officers: "Интегрируйте офицеров-зуавов" # Integrate Zouave Officers
 PHI_integrate_zouave_officers_desc: "Когда мы покинули Рим, к нам присоединились наши опытные офицеры-зуавы из Палатинской гвардии. Эти офицеры могут быть интегрированы в филиппинскую армию, что позволит получить более опытных и обученных солдат, когда разразится Священная война." # As we have fled Rome, we have been joined by our experienced Zouave Officers from the Palatine Guard. These officers, can be integrated into the Filipino Army, allowing for a more experienced and trained soldiers when the Holy War breaks out.
 PHI_deus_vult: "Бог хочет!" # Deus Vult!
 PHI_deus_vult_desc: "Мы должны подготовиться к возможному возвращению Святых Земель и распространить слово Божие по миру. Деус Вульт!" # We must prepare for the eventual reclaimation of the Holy Lands and spread the word of god on the world. Deus Vult!
 PHI_deus_vult_tt: "Этот фокус откроет доступ к ветке фокусов §YThe Holy War§!\n" # This focus will unlock access to the §YThe Holy War§! focus branch\n
 PHI_criminalise_liberalism: "Криминализовать либерализм" # Criminalise Liberalism
 PHI_criminalise_liberalism_desc: "Либерализм — это болезнь, он не только превратил Землю в состояние чистой Ереси, но и позволил таким людям, как Дресслер, взять на себя высшую власть, когда она потерпит неудачу. Чтобы по-настоящему спасти Землю, мы должны не только остановить эту волну, но и остановить ее." # Liberalism is a disease, not only has it warped the Earth into a state of pure Heresy but also let people like Dressler assume ultimate power for himself when it fails. To truly save the Earth we must not only stem the tide, but cull it.
 PHI_establish_the_papal_gendarmerie: "Создание папской жандармерии" # Establish the Papal Gendarmarie
 PHI_establish_the_papal_gendarmerie_desc: "Безопасность наших границ – это один вопрос, но мы также должны обратить внимание на врагов внутри. Необходимо создать новую папскую жандармерию для борьбы с хаосом во имя Бога. Они действительно будут внимательно следить за людьми." # The security of our borders is one matter, but we must also look to the enemies within. A new Papal gendarmerie must be created to combat chaos in the name of God. They will watch the people closely indeed.
 PHI_ethical_economics: "Этническая экономика" # Ethnical Economics
 PHI_ethical_economics_desc: "Поскольку наш контроль бесспорен, а христиане получили новые полномочия, мы почти готовы достичь полной экономической независимости и, наконец, избавиться от наших иностранных жизненных путей. Однако возникла дискуссия, дошедшая до самых высоких эшелонов нашего правительства. Христианские социалисты изложили свой план того, что она называет «дистрибутизмом», который получил поддержку христианских рабочих, но его сравнивают с безбожным социализмом." # With our control unchallenged and Christians being empowered, we almost ready to achieve total economic independent and finally rid ourselves of our foreign lifelines. However, a debate has sprung up that has reached the highest echelons of our government. The Christian Socialists has outlined her plan for what she calls “Distributism”, which has garnered support from Christian Workers but has been compared to the godless Socialism.
 PHI_christian_state_unions: "Христианские государственные союзы" # Christian State Unions
 PHI_christian_state_unions_desc: "Христианские социалисты предложили создать католические союзы, которые будут находиться под нашим руководством. Они будут продвигать веру, а также следить за тем, чтобы католический контроль над рабочей силой оставался неоспоримым. Этот план уже одобрен нашим лидером, несмотря на сравнения с социализмом." # The Christian Socialists has proposed setting up Catholic Unions which will be under our guidance, they will promote the faith while also making sure that Catholic control in the workforce remains unchallenged. This plan has already been approved by our leader despite comparisons to Socialism.
 PHI_labor_omnia_vincit: "Тяжелый труд побеждает все" # Labor Omnia Vincit
 PHI_labor_omnia_vincit_desc: "Нас ждут опасные времена. Хотя мы неохотно проводили индустриализацию, видя, что она приводит к уменьшению свободы личности и сведению общества индивидуумов к обществу массового класса, мы, тем не менее, должны подготовить нашу страну к расширению военного производства, если мы хотим подготовить нашу армию для длительной войны против неверующих." # Dangerous times lie ahead of us. While we have been reluctant to industrialise, seeing it as resulting in less freedom for the individual and reducing a society of individuals to a mass-class society, we must nonetheless prepare our country for expanded military production if our army is to be supplied for a protracted war against the unbelievers
 PHI_per_aspera: "Для Асперы" # Per Aspera
 PHI_per_aspera_desc: "Католическая церковь исторически была великим покровителем науки, несмотря на заявления социалистов и антиклерикалистов, которые порочат нас ложью о конфликте. Вера и разум взаимно помогают друг другу, и для преодоления наших нынешних трудностей мы должны адаптировать этот разум и научное мышление к военным исследованиям." # The Catholic Church has historically been a great patron of science despite the claims of the socialists and anti-clericalists that defame us with the lies of conflict thesis. Faith and reason are of mutual help to each other, and to overcome our current hardships we must adapt that reason and scientific mindset to military research.
 PHI_entrench_corporatism: "Укрепить корпоративизм" # Entrench Corporatism
 PHI_entrench_corporatism_desc: "Благодаря тому, что профсоюзы были взяты под государственный контроль и представлены в правительстве, а государство стало посредником в позитивных отношениях между работодателями и работниками, новое корпоративное государство наконец утвердилось в новом папском королевстве. Нам следует еще больше формализовать такое положение дел с помощью новой корпоративной хартии, подписанной лидерами бизнеса и профсоюзными активистами и ставшей законом, чтобы гарантировать, что все будут сотрудничать ради общего блага под контролем государства." # With unions brought under state control and represented in government, and with the state brokering positive relations between employers and workers, a new corporate state has finally taken hold in new Papal realm. We should further formalise this state of affairs with a new corporate charter, signed by business leaders and unionists and passed into law, to ensure that all cooperate for the common good under state supervision.
 PHI_align_faithful_industrialists: "Объедините верных промышленников" # Align Faithful Industrialists
 PHI_align_faithful_industrialists_desc: "Бизнесмены правого толка, социально сознательные и националистические, уже давно являются решающими сторонниками церкви, их средства творят чудеса, обеспечивая дальнейший успех партии. Мы должны вознаградить этих хороших людей правительственными должностями и контрактами и, таким образом, еще больше стимулировать других богатых бизнесменов пополнить их ряды." # Rightwing businessmen, socially conscious and nationalistic, have long been crucial supporters of the Church, their funds working magic for the party's continued success. We should reward these good men with government positions and contracts, and thus further incentivise other wealthy businessmen to join their ranks.
 PHI_the_holy_war: "Священная война" # The Holy War
 PHI_the_holy_war_desc: "Пришло время [Root.GetName] взять на себя роль защитника Бога и добродетели, а людям подняться на его службу в Одиннадцатом крестовом походе против врагов веры." # The time has come for the [Root.GetName] to take on its role as the defender of God and virtue, and for the people to rise up to its service in an Eleventh Crusade against the enemies of the faith.
 PHI_protect_insulindian_christians: "Защитите исулиндианских христиан" # Protect Insulindian Christians
 PHI_protect_insulindian_christians_desc: "В различных частях Инсулиндийского архипелага проживает значительное меньшинство христиан-инсулиндианцев, живущее в условиях преследований со стороны мусульманского большинства. Мы должны им помочь." # There is a sizeable minority of Insulindian Christians in the different parts of the Insulindian archipelago, living in persecution from the Muslim majority. We must help them.
 PHI_mission_to_indochina: "Миссия в Индокитай" # Mission to Indochina
 PHI_mission_to_indochina_desc: "Индокитай был рассадником безбожной социалистической идеологии и различных видов языческой религии. Быстрый визит гарантирует, что они узнают слово Божье." # Indochina have been a hotbed for the godless Socialist ideology and different kinds of pagan religion. A quick visit ensures that they will know the word of God.
 PHI_topple_the_buddhist_kingdom: "Свергнуть буддийское королевство" # Topple the Buddhist Kingdom
 PHI_topple_the_buddhist_kingdom_desc: "[SIA.GetName] была преимущественно буддийской страной, следующей учению Будды. Папа считает, что пришло время показать людям [SIA.GetAdjective] истинную веру и обратить их, нравится им это или нет." # [SIA.GetName] have been prodominantly a Buddhist country, following the teaching of Buddha. The Pope thinks it's time to show the [SIA.GetAdjective] people the true faith, and convert them whether they like it or not.
 PHI_legacy_of_the_boxer_rebellion: "Наследие боксерского восстания" # Legacy of the Boxer Rebellion
 PHI_legacy_of_the_boxer_rebellion_desc: "Боксерское восстание — один из самых жестоких внутренних конфликтов, вспыхнувших со времен зарождения человечества. Мы не должны забывать." # The Boxer Rebellion is one of the most brutal internal conflicts that erupted since the dawn of man. We must not forget.
 PHI_pacify_burma: "Умиротворить Бирму" # Pacify Burma
 PHI_pacify_burma_desc: "Бирма является стратегическим местом, которое позволяет нам иметь сухопутную границу с индийцами, исповедующими индуизм и другие религиозные религии. Мы должны зайти в гости и попытаться обратить их в свою веру." # Burma is a strategic location that allows us to have a land border with the Indians, whom practices Hinduism and other pagal religions. We must stop by for a visit and try to convert them.
 PHI_punish_the_shogunate: "Наказать сёгунат" # Punish the Shogunate
 PHI_punish_the_shogunate_desc: "Многие миссионеры и братья нашей веры подвергались жестоким преследованиям со стороны сёгуна со времен сёгуната Токугава. Мы должны отомстить за наших павших братьев и силой принести христианство в Японию." # There are many missionaries and brothers of our faith that have been persecuted brutally by the Shogun since the Tokugawa Shogunate Era. We must avenge our fallen brothers and bring Christianity to Japan, forcefully.
 PHI_christianity_in_the_himalayas: "Христианство в Гималаях" # Christianity in the Himalayas
 PHI_christianity_in_the_himalayas_desc: "Тибет, Непал и Бутан, что общего у этих стран? Они поклоняются ложным богам, и мы, конечно же, можем убедить их следовать нашей вере." # Tibet, Nepal and Bhutan, what do these countries have in common? They are worshipping false gods, surely, we can convince them to follow our faith instead.
 PHI_crusade_in_india: "Крестовый поход в Индию" # Crusade in India
 PHI_crusade_in_india_desc: "Поскольку мы обратили в нашу веру большинство наших соседей, самое трудное еще впереди, но мы не должны останавливаться, ибо такова воля Божья." # As we have converted most of our neighbors to our faith, the hardest one comes yet, but we must not stop, for it is the will of God.
 PHI_catholic_dominion: "Католический доминион" # Catholic Dominion
 PHI_catholic_dominion_desc: "С восхождением папства как крупной силы, с которой снова приходится считаться, настало время для нас обратиться ко всем верным христианам и действовать как рука, которая ведет людей, так же, как пастырь ведет свое стадо и защищает его от зла. Это поручение Божие!" # With the ascension of the Papacy as a major power to be reckoned with once again, it is time for us to reach out to all faithful Christians and act as the hand that guides the people, just as the shepherd guides his flock and protects them from evil. It is the mandate of God!
 PHI_catholic_dominion_tt: "£decision_icon_small §YРешения§! о приглашении §cЛатинских стран§! в наш альянс будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! on inviting §cLatin Countries§! to our alliance will be §Yunlocked§!
 PHI_the_holy_lands: "Вернуть Святые земли" # Reclaim the Holy Lands
 PHI_the_holy_lands_desc: ""
 PHI_the_holy_lands_tt: "£decision_icon_small §YРешения§! о возвращении §cРима§! и §cИерусалима§! будут §Yразблокированы§!" # £decision_icon_small  §YDecisions§! on reclaiming §cRome§! and §cJerusalem§! will be §Yunlocked§!
### Collaborators
 PHI_new_regime_rival: "Провозгласить конкурирующее правительство" # Proclaim a Rival Government
 PHI_new_regime_other: "Провозгласить переходное правительство" # Proclaim a Transitional Government
 PHI_new_regime: "[Root.GetNewRegimeFocusName]" # [Root.GetNewRegimeFocusName]
 PHI_new_regime_desc: "Пришло время: наши освободители [Root.Overlord.GetAdjective] освободили нас из лап коррумпированного старого порядка. Мы возьмем под свой контроль архипелаг и отправимся в более благополучное будущее." # Now is the time, our [Root.Overlord.GetAdjective] liberators have freed us from the clutches of the corrupt old order. We will take control of the archipelago and proceed to a more prosperous future.
 PHI_appoint_a_new_cabinet: "Назначить новый кабинет министров" # Appoint a New Cabinet
 PHI_appoint_a_new_cabinet_desc: "Текущее положение правительства в лучшем случае нормальное, нынешним администраторам [Root.Overlord.GetAdjective] удалось стабилизировать политическую ситуацию. Однако, чтобы выглядеть легитимными в глазах нашего населения, в правительстве должен быть полностью филиппинский кабинет, чтобы мы не выглядели как [Root.Overlord.GetAdjective] болонки." # The current situation of the government is okay at best, the current [Root.Overlord.GetAdjective] administrators have managed to stabilize the political situation. However, to appear as the legitimate in the eyes of our populace, an all-Filipino cabinet must be in the government, so that we won't look as [Root.Overlord.GetAdjective] lapdogs.
 PHI_ally_with_the_oligarchs: "Союзник с олигархами" # Ally with the Oligarchs
 PHI_ally_with_the_oligarchs_desc: "Чтобы еще больше укрепить нашу борьбу за легитимность, мы будем добиваться тех, кто находится в высших эшелонах общества, Хасиендеро, политических кланов и влиятельных предпринимателей. Поскольку они поддерживают наше правительство, мы находимся в одном шаге от стабилизации нашей власти на архипелаге." # To further solidify our grip for legitimacy, we will woo those who are in the upper echelons of society, the Hacienderos, political clans, and powerful entrepreneurs, with them backing our government, we are one step away to stabilizing our power in the archipelago.
 PHI_state_corporatism: "Государственный корпоративизм" # State Corporatism
 PHI_state_corporatism_desc: "Процветание Филиппин можно построить только через сотрудничество бизнеса и государства: мы заключим контракты с филиппинскими компаниями на работу в государственных проектах со скидкой и начнем интегрировать их в правительство. Лояльный класс предпринимателей, тесно сотрудничающий с государственными чиновниками, будет продвигать нашу страну вперед!" # Filipino prosperity can only be built via cooperation between business and state - we shall contract Filipino companies to work for public projects at a discount and start integrating them into the government. A loyal class of entrepreneurs working closely with government officials shall propel our nation forward!
 PHI_bureaucratic_purge: "Бюрократическая чистка" # Bureaucratic Purge
 PHI_bureaucratic_purge_desc: "От самых низших до высших бюрократов мы должны очиститься от предателей, которые все еще верны старому порядку. Отстранение их от занимаемых должностей будет гарантией того, что никакие диссиденты не попытаются дестабилизировать наше правление." # From the lowest to highest bureaucrats, we must cleanse ourselves of traitors that are still loyal to the old order. Removing them from their positions will guarantee that no dissidents will try to destabilize our rule.
 PHI_propaganda_campaigns: "Пропагандистские кампании" # Propaganda Campaigns
 PHI_propaganda_campaigns_desc: "Нам нужно убедить граждан Филиппин в том, что мы являемся для них лучшим вариантом, и что нам нужна старая добрая пропагандистская кампания. В конце концов, нет лучшего способа убедить простодушных овец, чем пропаганда." # We need to convince the citizens of the Philippines that we are the best option for them, and a good old propaganda campaign is what we need. After all, there is no better method to convince simple minded sheep than propaganda.
 PHI_new_filipino_identity: "Новая филиппинская идентичность" # New Filipino Identity
 PHI_new_filipino_identity_desc: ""
 PHI_media_controls: "Средства управления медиа" # Media Controls
 PHI_media_controls_desc: "Взяв под свой контроль крупные газеты и превратив их в наших представителей, мы можем гарантировать, что наш голос будет услышан более громко – как и должно быть." # By taking control of major newspapers and turning them into our spokesmen, we can ensure that our voice is heard more loudly - as it should be.
 PHI_form_the_makapili: "Сформируйте селективную" # Form the Makapili
 PHI_form_the_makapili_desc: "Путь вперед для наших вооруженных сил — это набор народных ополченцев, которые помогут нам защитить революцию и не дать иностранным силам раздавить нас, прежде чем мы успеем встать на ноги." # The way forward for our armed forces is the recruitment of People's Militias to help us safeguard the revolution and prevent foreign forces from crushing us before we have managed to find our feet.
 PHI_consolidate_the_security_services: "Консолидация служб безопасности" # Consolidate the Security Services
 PHI_consolidate_the_security_services_desc: "Наша армия мала, поэтому мы не можем позволить себе вступать в великие сражения с нашими врагами за господство. Чтобы противостоять этому, в нашем военном штабе была открыта новая школа для обучения новых офицеров современным формам ведения боевых действий в небольших подразделениях и работы по сбору разведывательной информации. Обладая этими навыками, наши военные смогут противостоять более серьезным угрозам." # Our military is small, as such, we cannot afford to go into great battles against our enemies for dominance. To counter this, A new school has been opened at our military headquarters to train new officers in modern forms of small unit combat and intelligence gathering work. With these skills, our military may be able to combat larger threats.
 PHI_appeal_for_overlord_support: "Обращение в службу поддержки [Root.Overlord.GetAdjective]" # Appeal for [Root.Overlord.GetAdjective] Support
 PHI_appeal_for_overlord_support_desc: "С помощью нашего союзника мы создали конкурирующее правительство, которое бросает вызов старому порядку, однако мы согласились на компромиссы, которые нанесли ущерб нашей экономике, особенно в отношении репараций. Мы должны послать дипломата для ведения переговоров, чтобы нам не мешали экономически." # With our ally's help, we have established a rival government that challenges the old order, however, we have agreed to compromises that took a toll to our economy, particularly with the reparations, we must send a diplomat to negotiate this so that we are not hindered economically.
 PHI_crush_the_huks: "Раздавить хуков" # Crush the Huks
 PHI_crush_the_huks_desc: "В джунглях Сьерра-Мадре и Кордильер есть группа повстанцев, которая активно взаимодействует с нашими людьми, некоторые из них представляют собой остатки старого порядка, клянущего новую революцию, мы должны разобраться с ними, прежде чем они приобретут больше симпатий общественности." # In the jungles of Sierra Madre and Cordilleras, there is a rebel group that actively engage with our personel, some of them are from the remnants of the old order that vows for a new revolution, we must deal with them before they gain more symphaty to the public.
 PHI_mobilization_of_the_state: "Мобилизация государства" # Mobilization of the State
 PHI_mobilization_of_the_state_desc: "Когда на нас надвигается открытая война, прежние соображения о влиянии всеобщей мобилизации на экономику больше не имеют значения. Мы должны проводить настолько тщательную политику, насколько это возможно." # With open warfare upon us, previous considerations for the impact of general mobilisation upon the economy no longer hold sway. We must implement as thorough a policy as can be sustained.

### Events
 philippines.0.t: "Жемчужина Востока, 1936 год." # The Pearl of the Orient, 1936
 philippines.0.d: "В 1898 году, после 333 лет испанской колонизации, свобода и независимость наконец оказались в руках филиппинцев, борющихся против угнетения; Однако, к их большому разочарованию, американцы, которых они считают своими союзниками в борьбе с испанцами на архипелаге, решили аннексировать Филиппины после того, как выкупили их у Испании. Это привело к кровавой войне между американцами и филиппинскими революционерами, в результате которой одного угнетателя заменили другим.\n\nАмериканцы в конечном итоге победили, упразднив первую республику Эмилио Агинальдо. Однако это не разрушает мечты филиппинцев о независимой нации, где они будут свободны и свободны. В 1912 году президент Теодор Рузвельт подписал Закон Джонса, или Закон об автономии Филиппин, заменивший Органический закон Филиппин 1902 года. Это позволило избирать членов как нижней, так и верхней палат законодательного собрания.\n\nПоскольку Великая депрессия ослабила Соединенные Штаты, президент Герберт Гувер подписал Закон об обрезке зайцев 1933 года, предоставивший Филиппинам независимость после 10-летнего периода. переходный период. Этот закон также позволил избрать филиппинского президента и вице-президента, упразднив должность американского генерал-губернатора, но установив должность американского Верховного комиссара. Генерал-губернатор Фрэнк Мерфи назначил 10 июля датой выборов, на которых победил Мануэль Луис Кесон из Националистической партии.\n\nВ 1936 году, когда Великая депрессия продолжала терзать американскую экономику, одной из последних реформ администрации Кертиса было немедленное предоставление независимости Филиппинам, облегчение расходов и смягчение последствий депрессии; и снова мечты о свободе и свободе находятся в руках филиппинцев." # In 1898, after 333 years of colonization from the Spanish, liberty and independence was finally in the grasp of the Filipinos fighting against oppression; much to their disappointment however, the Americans whom they see as their allies in kicking the Spanish in the archipelago, have opted to annex the Philippines after they bought it from Spain. This resulted in a bloody war between the Americans and Filipino revolutionaries, replacing an oppressor with another.\n\nThe Americans ultimately won, abolishing the first Republic of Emilio Aguinaldo. However, this does not destroy the dreams of the Filipinos of an independent nation, where they are free and with liberty. In 1912, the Jones Act, or the Philippine Autonomy Act was signed by President Theodore Roosevelt replacing the Philippine Organic Act of 1902. This allowed election of members of both the lower and upper houses of the legislature to be elected.\n\nAs the Great Depression weakened the United States, President Herbert Hoover signed the Hare-Hawes-Cutting Act of 1933, granting the Philippines independence after a 10-year transition period. This act also allowed the election of a Filipino President and Vice-President, abolishing the position of the American Governor-General but establishing the position of the American High Commissioner. Governor-General Frank Murphy designated July 10, as the election date, with Manuel Luis Quezon of the Nacionalista Party winning.\n\nIn 1936, as the Great Depression continued to plague the American economy, one of the last minute reforms by the Curtis Administration was to grant independence to the Philippines immediately, to ease of expenditure and to lower the effects of the depression; and once again, the dreams of liberty and freedom is in the grasp of the Filipinos.
 philippines.0.a: "Да здравствуют Филиппины!" # Mabuhay ang Pilipinas!
 philippines.1.t: "Наконец-то независимость" # Independence At Last
 philippines.1.d: "В Вашингтоне, округ Колумбия, в [GetDate] президент США [From.GetLeader] подписал документ, содержащий официальное признание Соединенными Штатами независимых Филиппин. Свидетелями этого были наш собственный президент [Root.GetLeader] и несколько высокопоставленных чиновников, таких как вице-президент Серхио Осменья и главный судья Рамон Авансенья.\n\nВернувшись домой, в парке Лунета собрались толпы; чтобы отпраздновать это знаменательное событие. Также присутствуют делегации из Соединенных Штатов, такие как Верховный комиссар МакНатт, который вскоре станет послом США на Филиппинах, и сенатор Гарри Бартоу Хоуз, соавтор Закона об обрезке зайцев-Хоуза. Толпы в восторге, наблюдая за спуском американского флага и поднятием филиппинского флага, а некоторые сообщают о том, что они прослезились от всепоглощающей радости, увидев свою страну свободной от иностранного подчинения." # In Washington, D.C., at [GetDate], US President [From.GetLeader] has signed the document containing the official recognition of the United States, for an independent Philippines. This has been witnessed by our own President [Root.GetLeader] and a couple of higher officials, such as Vice-President Sergio Osmeña and Chief Justice Ramón Avanceña.\n\nBack here at home, crowds have gathered in Luneta Park; to celebrate this momentous occasion. Delegations from the United States are also present, such as High Commissioner McNutt, soon to be US Ambassador to the Philippines, and Senator Harry Bartow Hawes, a co-author of the Hare-Hawes-Cutting Act. Crowds are ecstatic in witnessing the lowering of the American flag, and the raising of the Philippine flag, with some reports of tearing-up with overwhelming joy to see their country free from foreign submission.
 philippines.1.a: "Да здравствуют Филиппины!" # Mabuhay ang Pilipinas!
 philippines.2.t: "Политика открытых дверей?" # An Open Door Policy?
 philippines.2.d: "Близкий друг президента Алекс Фридер сообщил ему о враждебных действиях режима Дресслера по отношению к его политическим оппонентам и их сторонникам. Господин Фрейдер, умоляли президента принять беженцев, поскольку многие страны их не принимают. Будучи развивающейся страной, Филиппины не имеют возможности финансово позаботиться об этих людях, но многие жители выступают за то, чтобы их впустили." # A close friend of the President, Alex Frieder, have informed him about the hostile actions of Dressler's regime, towards his political opponents and their supporters. Mr. Freider, have begged the President to accept the refugees, as many countries won't accept them. As a developing nation, the Philippines do not have the capacity to financially take care of these people, but many in the populace are in favour of letting them in.
 philippines.2.a: "Дайте им въездные визы" # Give them the entry visas
 philippines.2.b: "У нас есть больше проблем, с которыми нужно справиться" # We have more problems to deal with
 philippines.3.t: "Агинальдо критикует правительство" # Aguinaldo Critises the Government
 philippines.3.d.1: "Эмилио Агинальдо, ярый критик нынешней администрации, возможно, все еще огорченный своим поражением на выборах 1933 года; раскритиковали ответ президента на просьбу Алекса Фрейдера разрешить немецким беженцам искать убежища на Филиппинах. Он раскритиковал правительство за неспособность оказать гуманитарную помощь беженцам.\n\nХотя многие люди согласились с критикой Агинальдо; поскольку это самый гуманный поступок, который филиппинский народ может совершить для братьев-единоверцев; некоторые признали экономическое и финансовое положение страны и поддерживают решение, принятое президентом." # Emilio Aguinaldo, a vocal critic of the current administration, perhaps still bitter on his defeat in the 1933 Elections; have critized the President's answer to Alex Freider's request to allow German refugees to seek asylum in the Philippines. He lambasted the government for failure to do a humanitarian assisstance to the refugees.\n\nWhile many of the people agreed with Aguinaldo's criticism; as it is the most humanitarian act the Filipino people can give for brothers of the same faith; some have acknowledged the economic and financial situation of the country, and are supportive of the decision the President have made.
 philippines.3.d.2: "Эмилио Агинальдо, ярый критик нынешней администрации, возможно, все еще огорченный своим поражением на выборах 1933 года; раскритиковали ответ президента о разрешении въезда немецких беженцев в страну, заявив, что Филиппины, как молодая нация, имеют проблемы сами по себе и не могут финансово поддержать приток беженцев в страну. \n\nХотя некоторые люди согласились с критикой Агинальдо; многие по-прежнему одобряют политику президента Кесона по разрешению беженцев, поскольку это самый гуманный акт, который филиппинский народ может совершить для братьев одной веры." # Emilio Aguinaldo, a vocal critic of the current administration, perhaps still bitter on his defeat in the 1933 Elections; have critized the President's answer to allow entrance of German refugees in the country, stating that the Philippines, as a young nation has a problems on its own and can't financially support a refugee influx in the country.\n\nWhile some of the people agreed with Aguinaldo's criticism; many still favour President Quezon's policies of letting the refugees as it is the most humanitarian act the Filipino people can give for brothers of the same faith.
 philippines.3.a: "Такой лицемер!" # Such hypocrite!
 philippines.4.t: "Инвестиции на Филиппинах?" # Investments in the Philippines?
 philippines.4.d: "К нам обратились делегации из [PHI.GetName] с просьбой инвестировать в их новые инфраструктурные проекты и отрасли. Хотя они, безусловно, нуждаются в нашей помощи, мы мало ожидаем от инвестиций, которые мы могли бы сделать; поэтому нам нужно будет рассмотреть варианты." # We have been approached by the delegations from the [PHI.GetName], asking us to invest in their new infrastructure projects and industries. While they certainly need our help, we are expecting little for the investments we might put on; so we'll need to consider the options.
 philippines.4.a: "Давай сделаем это" # Let's do it
 philippines.4.b: "Это того не стоит" # It's not worth it
 philippines.5.t: "[From.GetNameDefCap] Принято" # [From.GetNameDefCap] Accepted
 philippines.5.d: "Правительство [From.GetAdjective] приняло наше предложение об инвестировании. Сюда будут приезжать [From.GetAdjective] инвесторы, заинтересованные в наших проектах, чтобы осмотреть и обсудить инвестиции." # The [From.GetAdjective] Government have accepted our proposal for them to invest. [From.GetAdjective] investors who are interested in our projects will be arriving here to inspect and discuss the investment.
 philippines.5.a: "Отличный." # Excellent.
 philippines.6.t: "[From.GetNameDefCap] Отказался" # [From.GetNameDefCap] Refused
 philippines.6.d: "Правительство [From.GetAdjective] отклонило наше предложение инвестировать." # The [From.GetAdjective] Government have refused our proposal for them to invest.
 philippines.6.a: "Мы обращаемся к инвесторам [Root.GetAdjective] здесь, дома." # We turn to [Root.GetAdjective] investors, here at home.
 philippines.7.t: "[From.GetNameDefCap] привлекает инвестиции!" # [From.GetNameDefCap] Pulls Investments!
 philippines.7.d: "Видя военные действия между нашими странами; инвесторы из [From.GetName] вывели свои инвестиции в наши проекты. Хотя это не может остановить наши уже реализованные проекты; это может замедлить его прогресс." # Seeing the hostilities between our countries; investors from [From.GetName] have pulled out their investments in our projects. While these can't stop our projects already implemented; it can slow down its progress.
 philippines.7.a: "Взрыв!" # Blast!
 philippines.8.t: "Прибыль от инвестиций [PHI.GetAdjective]" # Profits from [PHI.GetAdjective] Investment
 philippines.8.d: "Это заняло некоторое время, но мы не получаем выгоды от наших инвестиций в [PHI.GetName] в виде наличных денег." # It has taken some time, but we're not reaping the rewards from our investments in the [PHI.GetName] in cold, hard cash.
 philippines.8.a: "Пусть деньги текут..." # Let the money flow...
 philippines.9.t: "Конверт" # The Envelope
 philippines.9.d: "Сегодня утром сенатор Сумулонг нашел в своем столе в Сенате странный конверт без обратного адреса; он спросил своего секретаря, откуда взялся конверт, и был разочарован ответом своего секретаря; тем не менее он открыл конверт и был удивлен его содержимым. Включив радио, он узнал, что многие журналисты и радиоведущие получили один и тот же конверт.\n\n\"Министр сельского хозяйства и торговли Бениньо Акино-старший замешан в коррупционных схемах, в которых задействованы миллионы песо, предназначенных для различных сельскохозяйственных проектов в Нуэва-Эсихе и Тарлаке; согласно этим документам, которые мы получили сегодня утром\". эхо по радио в офисе президента Кесона; Удивленный и разъяренный, он позвонил своему секретарю, чтобы тот немедленно позвонил секретарю Акино. В комнате вместе с президентом находится также вице-президент Осменья, который пытался его успокоить. Через несколько минут госсекретарь Варгас был замечен бегущим по коридорам Малаканьяна. Сообщается, что многие в правительстве были возмущены этими выводами, а общественность стала требовать ответов, которые администрация не может дать." # In this morning, a peculiar envelope with no return address was found by Senator Sumulong in his desk in the Senate; he asked his secretary where did the envelope came from and was dissapointed by the response of his secretary; nonetheless, he opened the envelope and was suprised by its contents. Turning on the radio, he found out that many journalists and radio broadcasters received the same envelope.\n\n\"Agriculture and Commerce Secretary Benigno Aquino Sr. is embroiled in corruption schemes that involved millions of pesos that are for various agricultural projects in Nueva Ecija and Tarlac; according to these documents we received earlier this morning.\" echoing from the radio in the President Quezon's office; suprised and furious, he called his secretary, to immediately call Secretary Aquino. In the room together with the President, is also Vice President Osmeña whom tried calming down the President. Minutes later, Secretary Vargas was seen running in the halls of Malacañan, many within the Government were reported to be outraged by these findings, and the public become demanding answers the administration cannot provide.
 philippines.9.a: "Вызовите Акино прямо сейчас!" # Summon Aquino now!
 philippines.10.t: "Прибытие Мошенника" # The Arrival of the Crook
 philippines.10.d: "Прибыв в международный аэропорт Манилы из своей официальной поездки в Давао, госсекретарь Акино был проинформирован о том, что президент Кесон очень хочет встретиться с ним как можно скорее. Затем он приказал своему водителю ехать прямо в Малаканьян. Через 30 минут он прибыл и направился прямо в офис президента.\n\n\"Правдивы ли сообщения?\" президент напрямую обратился к секретарю Акино; «Нет... нет, сэр, это может быть уловка сакдалистов с целью дестабилизировать администрацию или привлечь больше сторонников, черт возьми, это может быть со стороны самого Агинальдо!», - ответил секретарь Акино после короткой и долгой паузы. По лицу президента было ясно, что он на это не купится; и секретарь тоже это знает. «Извините, Падрино, но я жду вашей немедленной отставки», - без колебаний сказал президент. Секретарь не ответил, кивает президенту и уходит." # Arriving in the Manila International Airport from his official trip in Davao City, Secretary Aquino was informed that President Quezon was keen on meeting him as soon as possible. He then instructed his driver to go straight to Malacañan. 30 minutes later, he arrived, and went straight to the President's office.\n\n\"Are the reports true?\" asked directly by the President to Secretary Aquino; \"n..no sir, it may be a ploy by the Sakdalistas to destablise the administration or gain more supporters, hell it may be from Aguinaldo himself!\", replied by Secretary Aquino after a brief and long pause. It was clear on the President's face that he doesn't buy it; and the Secretary knows it too. \"Sorry padrino, but I'll expect your resignation immediately\", said the President without hesitation. The Secretary didn't reply but nods to the President and leaves.
 philippines.10.a: "Будем надеяться, что это не станет ужасным." # Let's hope this won't get ugly.
 philippines.11.t: "Популярность сакдалиста растет" # Sakdalista Popularity Growing
 philippines.11.d: "Недавний скандал с участием высокопоставленных чиновников в правительстве дал сакдалистам возможность заручиться большей поддержкой среди низшего класса и крестьян. Многие из этих новых сторонников прибыли из Тарлака, которых можно легко убедить, поскольку Hacienda Luisita расположена в районе, где проходит земельная реформа, заблокированная бывшим секретарем Акино." # The recent scandal involving top official in the government has been an opportunity for the Sakdalistas to gather more support among the lower class and the peasants. Many for these new supporters came from Tarlac, whom can be easily persuaded, as the Hacienda Luisita, is located in the area are the one subject to the land reform blocked by the former Secretary Aquino. 
 philippines.11.a: "Будем надеяться, что их популярность перестанет расти..." # Let's hope their popularity stops growing...
 philippines.12.t: "Агинальдо публикует критические замечания" # Aguinaldo Publishes Criticisms
 philippines.12.d: "Эмилио Агинальдо, ярый критик правительства Кесона, опубликовал свою новую критику в адрес правительства. Он сосредоточил свою критику на недавнем скандале с участием бывшего министра экономики Акино. По словам Агинальдо, «разрешить Акино свободно передвигаться по стране с возможностью выезда за границу — это совершенно безрассудное действие со стороны правительства. Акино следует задержать, как только будут возбуждены дела». Хотя в критике есть и другие моменты, такие как неэффективность программ и политики правительства по облегчению жизни филиппинцев, основным аргументом в пользу продажи был скандал, и он может эффективно подорвать доверие к правительству Кесона." # Emilio Aguinaldo, a vocal critic of the Quezon Government has published his new criticisms towards the government. He focused his criticisms on the recent scandal involving former Economic Secretary Aquino. According to Aguinaldo, \"allowing Aquino to roam free in the country, with the capability of travelling abroad is a complete reckless action by the government. Aquino should be detained as soon as cases were filed.\". While there are also other points in the critisms such as the inefficiency of the programs and policies of the government to ease the life of the Filipinos, the main selling point was the scandal, and it may effectively drag the credibility of the Quezon Government.
 philippines.12.a: "Этот старик не будет держать язык за зубами." # This old man won't keep his mouth shut.
 philippines.12.b: "Он прав" # He's got a point
 philippines.13.t: "Провозглашение Либеральной партии" # Proclamation of the Liberal Party
 philippines.13.d: "Поскольку спор по вопросу о правительстве националистов еще не утих, некоторые члены самой партии националистов откололись от партии и создали свою собственную, одной из таких выдающихся фигур является президент Сената Мануэль А. Рохас и сенатор Эльпидио Р. Кирино. Похоже, что доминирование националистов в филиппинской политике теперь находится под вопросом." # As the dust haven't still been settled on the issue of the Nacionalista Government, some within the Nacionalista Party itself, have broke off from the party and have established their own, one such prominent figure, is Senate President Manuel A. Roxas and Senator Elpidio R. Quirino. It seems that the dominance of the Nacionalistas in Filipino politics are now in question.
 philippines.13.a: "Эти ублюдки!" # Those bastards!
 philippines.14.t: "Рохас выступает за досрочные выборы" # Roxas Advocates for Early Elections
 philippines.14.d: "Нынешний лидер Либеральной партии, сам бывший националист, президент Сената Мануэль Рохас в своем вчерашнем интервью на радио выступил за то, что выборы должны состояться досрочно, поскольку доверие к действующему правительству в последние недели находится под вопросом. Он умолял президента Кесона позволить Избирательной комиссии подготовить выборы в ближайшие месяцы, желательно в сентябре." # The current leader of the Liberal Party, a former Nacionalista himself, Senate President Manuel Roxas have advocated in his interview yesterday on a radio show that the elections should come early as the current government has its credibility in question for the last weeks. He begged President Quezon to let the Commission on Elections prepare an elections in the coming months, preferrably in September.
 philippines.14.a: "Это абсурд!" # That's absurd!
 philippines.15.t: "Агинальдо поддерживает досрочные выборы" # Aguinaldo Supports Early Elections
 philippines.15.d: "Эмилио Агинальдо, бывший революционер, выступающий против испанского и американского колониального правления на Филиппинах, и ярый критик администрации Кесона, недавно выразил поддержку назначению досрочных выборов в сентябре. Судя по всему, бывший президент Тагалогской Республики намерен снова баллотироваться на пост президента под знаменем своей новой партии – Национал-социалистической партии." # Emilio Aguinaldo, a former revolutionary against Spanish and American colonial rule in the Philippines, and a vocal critic of the Quezon administration have recently expressed his support for the calling of early elections in September. It seems that the former President of the Tagalog Republic, has the intention to run again for President under his new party banner, the National Socialist Party.
 philippines.15.a: "Просто попробуй и попробуй Мионг..." # Just try and try Miong...
 philippines.16.t: "Бениньо Рамос прибыл из Токио" # Benigno Ramos Arrives from Tokyo
 philippines.16.d: "Бениньо Рамос прибыл сегодня в международный аэропорт Манилы из своего изгнания в Токио. Г-н Рамос был лидером движения Сакдалиста, состоящего в основном из безземельных фермеров и крестьян, недовольных правительством. Похоже, что хаос, вызванный коррупционным скандалом в Акино, привел к резкому росту популярности сакдалиста, особенно в сельских районах, таких как Тарлак и Пангасинан; и Рамос, возможно, также планирует баллотироваться на пост президента." # Benigno Ramos have arrived today in Manila International Airport from his self-exile in Tokyo. Mr. Ramos, was the leader of the Sakdalista movement, primarily composed of landless farmers and peasants that are discontented towards the Government. It seems that in the chaos caused by the Aquino Corruption Scandal have caused the popularity of the Sakdalista to skyrocket, specially in the rural areas such as Tarlac and Pangasinan; and Ramos maybe planning also to run as President.
 philippines.16.a: "И ты тоже..." # Not you too...
 philippines.17.t: "Ответ правительства" # Government Response
 philippines.17.d: "Шли дни, но многие среди населения так и не услышали ответа от правительства, состоится ли попытка сенатора Роксаса провести досрочные выборы. Поскольку авторитет администрации сейчас находится под вопросом из-за разоблаченного коррупционного скандала с участием бывшего госсекретаря Акино. Мнения людей относительно того, состоятся ли выборы, как они официально запланированы в следующем году, в июле, разделились. Однако президент и его кабинет провели совещание по этому вопросу, и, судя по всему, администрация ответила, что никаких выборов проводиться не будет, за исключением тех, которые изначально запланированы на июль следующего года." # As days passed, many within the populace haven't heard a response from the government whether Senator's Roxas push for early elections will take place. As the credebility of the administration is now in question due to the corruption scandal involving former Secretary Aquino was exposed. The people are divided whether an election will take place as one is formally scheduled next year in the month of July. However, the President and his cabinet have conducted a meeting regarding the issue, and it seems that the administration response is that no elections will take place except for the one that is originally scheduled for July next year.
 philippines.17.a: "Теперь ждем..." # Now we wait...
 philippines.18.t: "Антиправительственные протесты в Тарлаке" # Anti-Government Protests in Tarlac
 philippines.18.d: "Полиция Филиппин сообщила о массовых антиправительственных протестах перед муниципальным зданием Капас, Тарлак. К этим протестам, организованным в первую очередь сакдалистами, также присоединились различные оппозиционные группы, такие как сторонники Либеральной партии и НСП. Хотя насилия зафиксировано не было; Судя по всему, недовольство населения не так низко, как ожидалось." # The Philippine Constabulary have reported a mass anti-government protests in front of the municipal hall of Capas, Tarlac. Primarily organized by the Sakdalistas, these protests have been also joined by various opposing groups such as the Liberal Party and NSP supporters. While there have been no violence recorded; it seems that the discontent among the population is not low as expected.
 philippines.18.a: "О, нет..." # Oh no...
 philippines.19.t: "Крах лондонской фондовой биржи" # The London Stock Market Crash
 philippines.19.d: "Поскольку ведущий фондовый рынок рухнул; мировая экономика резко упала. Хотя Великобритания и не является нашим ведущим партнером по экспорту сельскохозяйственной продукции, наш экспорт в Соединенное Королевство также способствует прибылям нашего сельскохозяйственного сектора. Похоже, что Великобритания и ее партнеры по Содружеству приостанавливают экспорт сельскохозяйственной продукции из Филиппин, и теперь эти последствия ощущаются дома." # As the leading stock market have crashed; the world's economy have been plummeted. Britain, while not our leading agricultural export partner, our exports in the United Kingdom also contributes to the profits of our agricultural sector. It seems that the United Kingdom and its Commonwealth partners are putting on hold to Filipino agricultural exports and now these effects are being felt at home.
 philippines.19.a: "Боже мой!" # Diyos Ko!
 philippines.20.t: "Протесты в Маниле" # Protests in Manila
 philippines.20.d: "После краха лондонского фондового рынка; многие из тех, кто работает в сельскохозяйственном секторе и почувствовали на себе последствия катастрофы, организовали протесты в некоторых частях страны, таких как Кабанатуан, Сан-Фернандо и Манила соответственно. Как и протесты, произошедшие несколько месяцев назад, эти протесты организованы сакдалистами, пользующимися поддержкой крестьянства и безземельных фермеров; и к ним присоединяются различные сторонники, от умеренных социалистов до сторонников Агинальдо." # Following the collapse of the London Stock Market Crash; many of those who are in the agricultural sector, who felt the effects of the crash have organized protests in some parts of the country such as in Cabanatuan, San Fernando and Manila respectively. Like the protests a few months ago, these are protests are organized by the Sakdalista whom have support from the peasantry and landless farmers; and are joined by various supporters from the moderate socialists to the Aguinaldo's own.
 philippines.20.a: "Пусть протестуют" # Let them protest
 philippines.20.b: "Попробуйте начать переговоры" # Try to open up talks
 philippines.21.t: "Фермеры требуют помощи правительства" # Farmers Demands Government Help
 philippines.21.d: "После экономического коллапса в Соединенном Королевстве филиппинский экспорт в Содружество был остановлен, и поэтому крах лондонской фондовой биржи ощутил на себе наш сельскохозяйственный сектор. Из-за этого фермеры решили обратиться к правительству с просьбой что-нибудь сделать; и правительство отреагировало на начало переговоров с ними. Они требуют или просят правительство помочь им в этом кризисе, предоставив им финансовую помощь для возмещения убытков, вызванных остановкой экспорта. Хотя мы могли бы помочь им, найдя неиспользованный бюджет в некоторых департаментах или бюро, или мы могли бы отказать в их требованиях и позволить им все равно протестовать." # In the wake of economic collapse in the United Kingdom, Filipino exports in the Commonwealth were halted and thus the London Stock Market Crash was felted by our agricultural sector. Because of this, the farmers decided to call on to the government to do something; and the government responded to open up talks with them. They demand or requested the government to help them in these crisis, providing them financial aid for the loses caused by the halted exports. Though we could help them by finding unused budget in some departments or bureaus or we could refuse their demands and let them protest anyway.
 philippines.21.a: "Примите их требования" # Accept their demands
 philippines.21.b: "Отказаться от их требований" # Refuse their demands
 philippines.22.t: "Протесты теряют силу" # Protests Losing Momentum
 philippines.22.d: "Поскольку новая программа субсидирования была одобрена Конгрессом и подписана самим президентом Кесоном; многие представители протестующих групп были достаточно довольны реакцией правительства на кризис; и поэтому продолжили путь домой. Выслушав радио, они один за другим ушли со своих позиций в надежде, что новая программа правительства поможет им выйти из того состояния, в котором они находились." # As the new subsidization program was approved by Congress, and be signed by President Quezon himself; many within the protesting groups have been contented enough with the government's response to the crisis; and as such proceeded to make their way home. After hearing from the radio, one by one, left from their positions hoping that the government's new program would help them recover from the state they were in.
 philippines.22.a: "Отличный" # Excellent
 philippines.23.t: "Протесты распространяются на другие регионы" # Protests Expanding to Other Areas
 philippines.23.d: "Недовольство среди крестьянства, фермеров и их сторонников в последние несколько дней набирает силу, вопреки ожиданиям правительства, что протесты потеряют силу в течение нескольких дней. Многие из этих протестов угрожают некоторым ключевым правительственным объектам в районе метро Манилы, таким как Дворец Малаканан, поскольку возле Мендиолы находится довольно большое количество протестующих." # The discontent among the peasantry, the farmers and their supporters have been gaining support in the last few days, contrary to the government's expectation of the protests losing momentum in a few days. Many of these protests are threatening some key government facilities in the Metro Manila area, such as the Malacanan Palace, as there are quite a large number of protesters near Mendiola.
 philippines.23.a: "Эвакуируйте президента, немедленно!" # Evacuate the President, now!
 philippines.23.b: "Все будет хорошо..." # It will be fine...
 philippines.24.t: "Скауты выгоняют протестующих в Мендиоле" # Scouts Expel Protesters in Mendiola
 philippines.24.d: "Полевые командиры, дислоцированные в районе Мендиолы, сообщают, что им удалось изгнать протестующих из Мендиолы, обеспечив безопасность Малаканского дворца от их угроз. Однако они также сообщили, что в ходе их операции есть жертвы: по меньшей мере 50 протестующих из разных районов погибли в результате беспорядков, вспыхнувших, когда в этот район прибыли развернутые скауты. Хотя мы, возможно, успешно подавили беспорядки в различных районах Манилы и Центрального Лусона; Потери в результате операции не пойдут на пользу нашему правительству и авторитету правящей партии. Похоже, что нам, возможно, придется проводить кампанию немного жестче, чтобы победить на следующих выборах." # Field commanders deployed in the area of Mendiola reports that they have successfully expelled the protesters away from Mendiola, keeping the Malacanan Palance safe from their threats. However, they also reported that there are casualties in their operation, at least 50 of the protesters from different areas were reported to be dead from the riots erupted when the deployed Scouts arrived in the area. While we may have successfully quelled the riots in different areas of Manila and Central Luzon; the casualties of the operation will be not good for our government and the ruling party's credebility. It seems that we might need to campaign a little bit harder to win the next elections.
 philippines.24.a: "Это нехорошо." # This is not good.
 philippines.25.t: "Рохас призывает к расследованию" # Roxas Calls for Investigation
 philippines.25.d: "Сенатор Мануэль А. Рохас, лидер Либеральной партии, которая в настоящее время является оппозиционной партией в правительстве, призвал провести внутреннее расследование вспыхнувшего насилия, которое переросло в смертоносные беспорядки в нескольких местах, где проходят протесты. Хотя многие сенаторы, прилетевшие в лагерь либералов, очевидно, поддержали эту идею; многие полагают, что сенатор Роксас популяризирует себя, чтобы победить националистов на предстоящих выборах." # Senator Manuel A. Roxas, leader of the Liberal Party, which is currently the opposition party in the Government have called for an internal investigation for the violence erupted that turned into deadly riots in a few locations that has protests. While many of the Senators that flown to the Liberal's camp has obviously supported the notion; many are assuming Senator Roxas is popularizing himself to be able to beat the Nationalista in the upcoming elections.
 philippines.25.a: "Просто перестань уже..." # Just stop already...
 philippines.26.t: "Рамос и Агинальдо раскритиковали правительство" # Ramos and Aguinaldo Slams the Government
 philippines.26.d: "Ранее сегодня лидер движения Лапианг Сакдалиста Бениньо Рамос раскритиковал правительство за его насильственную реакцию против протестующих в различных районах страны. Между тем, Эмилио Агинальдо, давний критик администрации Кесона, также осудил правительство за жестокое подавление протестующих, что привело к жертвам. Хотя в их заявлениях есть некоторая предвзятость, поскольку большинство протестующих являются их сторонниками, извлекающими выгоду из последствий краха лондонской фондовой биржи; Правительство также можно обвинить в том, что оно вообще медленно реагирует." # Earlier today, Benigno Ramos leader of the Lapiang Sakdalista movement have lambasted the government for its violence response against the protesters in the different areas in the country. Meanwhile, Emilio Aguinaldo, a long time critic of the Quezon Administration have also denounced the government for its violent respersing of the protesters that resulted in casulaties. While there are been some bias in their statements as most of the protesters are their supporters, capitalizing the effects of the London Stock Market Crash; the government can also to be blamed for slow to react in the first place.
 philippines.26.a: "Устают от своего ш..." # Getting tired of their sh...
 philippines.27.t: "Праздник Черного Назарянина" # Feast of the Black Nazarene
 philippines.27.d: "Праздник Черного Назарянина отмечается сегодня, 9 января 1937 года. Этот ежегодный праздник, также известный как «Трасласьон», представляет собой массовое шествие, связанное с праздником, которое отмечает годовщину переноса изображения из его первоначального места в церкви в современном парке Лунета в Кьяпо.\n\nКаждое 9 января тысячи верующих из всех слоев общества приходят в церковь Кьяпо, чтобы принять участие в процессии. способ укрепить свою веру или выполнить свою «панату» (обет) Господу. Кульминацией религиозного фестиваля является реконструкция Трасласиона. Буквально означает «перенос» или «торжественный перенос» в Малую базилику из ее первоначального храма внутри Интрамуроса. Во время процессии преданные обычно бросают полотенца полицейским, охраняющим статую, и просят их протереть полотенцем статую в надежде унести с собой часть этой силы." # The feast of the Black Nazarene has been celebrated today, January 9, 1937. This annual celebration, also known as the \"Traslación\", is a mass procession associated with the feast, that commemorates the anniversary of the transfer of the image from its original location at the church in modern-day Luneta Park to Quiapo.\n\nEvery 9th of January, thousands of devotees from all walks of life come to the church of Quiapo to take part in the procession as a way of strengthening their faith or fulfilling their “panata” (vow) to Lord.The highlight of the religious festival is the Traslacion reenactment. Literally means “transfer” or “solemn transfer” to the Minor Basilica from its original shrine inside Intramuros. During the procession, devotees normally throw towels to the police who guard the statue and ask them to rub the towel on the statue in hopes of carrying some of that power away with them.
 philippines.27.a: "Вроде все прошло гладко..." # Everything went smoothly it seems...
 philippines.28.t: "Ежегодный фестиваль латернов" # The Annual Latern Festival
 philippines.28.d: "В разгар рождественского сезона в Капампангане проводится фестиваль под названием «Фестиваль гигантских фонарей». Однако до появления электричества эти фонари создавались в каждом районе из бамбука и других местных материалов. Во время девятидневной новены перед Рождеством, которая совпадала с симбанг габи с 16 по 24 декабря, эти парулы обходили процессией каждый район к их посещению. Перед полуночной мессой в канун Рождества фонари были принесены в городскую церковь вместе с посетителями района.\n\nВ этом году сам президент будет присутствовать на фестивале, который пройдет в его честь; Президент пожертвовал приз за свой конкурс фонарей, который победителю лично вручил не кто иной, как первая леди Аврора Кесон." # At the height of the Christmas season, the Kapampangans have their festival called, the Giant Lantern Festival. Before the introduction of electricity however, these lanterns were created by each barrio from bamboo and other locally available materials. During the nine-day novena before Christmas, which coincided with the simbang gabi from December 16 to 24, these paruls were brought around each barrio in procession to their visita. Before the midnight Mass on Christmas Eve, the lanterns were brought to the town church together with the barrio patrons.\n\nThis year, the President himself, will be attending the festival that will be held in his honor; with the President donating the prize for his lantern contest, which was personally awarded to the winner by none other than First Lady Aurora Quezon.
 philippines.28.a: "Такой яркий!" # So bright!
 philippines.29.t: "Предложения госсекретаря Варгаса" # Secretary Vargas' Suggestions
 philippines.29.d: "Это было напряженное утро вторника, и секретарь Хорхе Варгас, секретарь президента; только что закончил беседу со своими коллегами в различных правительственных учреждениях, в основном в кабинете Кесона; что президент намерен встретиться со всеми ними в Малаканане. Он все еще подслушивает редакционный отрывок по радио своего секретаря о катастрофической реакции правительства на разгон протестов во многих районах метро Манилы.\n\nНесколько часов спустя его секретарь сообщил, что его коллеги прибыли и ждут в конференц-зале. Он тут же встал и направился в комнату, где находятся коллеги. Когда он прибыл в комнату, президент Кесон уже был там, и его приветствовал его старый друг Серджио. Часами обсуждали ситуацию и популярность администрации, и что делать, чтобы ее исправить; тогда у него возникла идея, почему бы не провести несколько пиар-ходов, чтобы восстановить подорванный авторитет администрации? Он с гордостью предложил это президенту, и его ответ был..." # It was a busy Tuesday morning, and Secretary Jorge Vargas, the Secretary to the President; has just finished relaying to his colleagues at different government agencies, basically the Quezon cabinet; that the President intends to meet them all at Malacanan. He still overheards the editorial segment from his own secretary's radio about the disastrous government response in dispersing the protests in many areas in the Metro Manila area.\n\nA few hours later, his secretary reported that his colleagues has arrived and are waiting on the conference room. He immediately stood up and proceeded to the room where is colleagues are at. When he arrived at the room, President Quezon is already there, and he was greeted by his old friend Sergio. For hours, they discussed the situtation and the popularity of the administration, and what to do for repair it; then he had an idea, why not have some PR stunts to repair the damaged credebility of the administration? He proudly suggested it to the President and his response was...
 philippines.29.a: "...какая отличная идея!" # ...what a great idea!
 philippines.29.b: "...перестань тратить мое время!" # ...stop wasting my time!
 philippines.30.t: "Президентский визит" # The Presidential Visit
 philippines.30.d: "Это было обычное утро четверга в баррио: кто-то подметал лужайки перед домом со своим «вали-тингом», кто-то приятно беседовал с односельчанином за чашкой кофе, обычное счастливое утро, когда люди просыпаются в сельских районах Филиппин. Однако рядом с местным магазином есть дом, во дворе которого стоит палатка; похоже, что Бертинг, фермер и владелец дома, в настоящее время оплакивает потерю своего сына с женой, произошедшего в результате трагического происшествия во время разгона протестующих на городской площади.\n\nВнезапно в район прибыла горстка военной техники, нарушив обычную тихую риторику деревни; солдаты, рассредоточившись, занимают позиции, как будто охраняют что-то или кого-то. Через несколько минут прибыла колонна, и во дворе дома Бертинга остановилась черная машина. Жители деревни были потрясены и поражены тем, что человеком из машины был сам президент. Он был там, чтобы засвидетельствовать свое почтение сыну Бертинга и утешить пару. Президент и несколько членов его кабинета вошли в дом Бертинга и начали беседовать со скорбящей четой. Супруги были тронуты тем, что президент направлялся из Манилы в Нуэва-Эсиху, просто чтобы утешить их и засвидетельствовать свое почтение их покойному сыну; и они остались с восхищением Президентом." # It was the usual Thursday morning at the barrio, some sweeping their front lawns with their \"walis ting-ting\", some having a good conversation with their fellow villager while having their cup of coffee, the usual happy mornings that people would wake up in the rural areas of the Philippines. However there is a house, near a local store, that has a tent in its front yard; it seems that the Berting, a farmer and the owner of the house is currently mourning the loss of their son with his wife, from the tragic accident during the dispersal of protesters in the city square.\n\nSuddenly, a handful of military vehicles arrived in the barrio, disturbing the usual quiet rhetoric of the village; the soldiers, dispersed, taking up positions like they are guarding something or someone. A few minutes later, a convoy arrived, and a black car stopped in Berting's front yard. The villagers was shocked and starstrucked as the man from the car was the President himself. He was there to pay his respects to Berting's son, and to comfort the couple. The President and a couple of his cabinet members, proceeded to enter Berting's house and started to converse with the mourning couple. The couple were touched as the President would make his way from Manila to Nueva Ecija, just to comfort them and pay his respects to their late son; and they were left with admiration for the President.
 philippines.30.a: "Приношу соболезнования..." # I offer my condolences...
 philippines.31.t: "Ночная церковь" # Simbang Gabi
 philippines.31.d: "«Эй, Хуан, просыпайся», — сказал Алинг Ненита своему спящему сыну в 3:30 утра. «Просыпайтесь, иначе мы опоздаем на мессу!», - продолжила его мать, продолжая трясти его за плечи, чтобы разбудить мальчика от глубокого сна. Хуан открыл глаза, поняв, что все еще темно, но встал, чтобы больше не спать. Выйдя из спальни, он уже увидел свою одетую сестру, а затем спросил ее, где их мама. «Она в ванной, готовится к мессе», — ответила его сестра. Хуан немедленно ушел в свою спальню, переодевшись, чтобы подготовиться к мессе. По дороге в собор он увидел своего хорошего друга Энрике вместе с мамой. Мама Энкируэ продолжила разговор с Алинг Ненитой, сказав, что если они завершат 9 дней Симбанг Габи, Бог может удовлетворить просьбу, которую они сделали из новенны.\n\nОни пошли к собору, видя своих собратьев-преданных, которые либо полностью бодрствуют, либо все еще полуспят. Прибыв в собор, они садятся и ждут начала мессы. Через несколько часов месса закончилась, Хуан жалуется матери, что голоден; и спросил ее, можно ли им купить немного Бибинки или Путо Бумбонга. Алинг Ненита улыбнулась и направилась к ларьку возле собора, чтобы купить свежеприготовленную рисовую выпечку. Купив то, что по сути является их завтраком, они направились домой, направляясь к улице, освещенной красивыми фонарями или фонарями." # \"Hey Juan, wake up\", said Aling Nenita to his sleeping son at 3:30 in the morning. \"Wake up, or we'll going to be late for the mass!\", continued by his mother while proceeding to shake his shoulders to wake the boy from his deep sleep. Juan opened his eyes, realizing still dark but stood up as to not sleep any further. Leaving his bedroom, he already saw his sister all dressed up, then asking her where is their mom. \"She's in the bathroom, getting ready for the mass.\", replied by his sister. Juan, immediately left for his bedroom, changing clothes to prepare for the mass. On the way to the cathedral, he saw his good friend, Enrique together with his mom. Enqirue's mom proceeded to talk to Aling Nenita, saying that if they completed the 9 days of Simbang Gabi, God may grant a request they made from the novena.\n\nThey proceeded to walk towards the cathedral, seeing their fellow devotees that are either fully awake or still half-asleep. As they arrived at the Cathedral, they proceed to sat down and wait for the mass to start. A few hours later, the mass ended, Juan then complains to his mother that he is hungry; and asked her if they could get some Bibingka or Puto Bumbong. Aling Nenita smiled and proceeded to the stall near the Cathedral and buy some of these freshly made rice pastries. As the have bought what is basically their breakfast, they proceeded to head home, walking towards a street that is illuminated by the beautiful parols or lanterns.
 philippines.31.a: "Рождество уже наступило?" # Is it Christmas yet?
 philippines.32.t: "День Бонифачо" # Bonifacio Day
 philippines.32.d: "С 1901 года день рождения Бонифачо отмечают общественные организации. К 1920 году сенатор Лопе К. Сантос внес законопроект об объявлении 30 ноября праздником в память о Супермо, Андресе Бонифачо, основателе Катипунана, тайного общества, которое привело нас к революции против испанцев в 1896 году.\n\nСегодня мы празднуем день рождения одного из наших героев, многие высокопоставленные правительственные чиновники, включая самого президента Кесона, присутствовали на церемонии в памятнике или памятнике Бонифачо, в Калукане, созданный национальным художником Гильермо Толентино в 1933 году. Памятник Бонифачо напоминает о филиппинской революции, которую возглавил Андрес Бонифачо, который призывал своих людей восстать против колониального правления Испании. Его призыв выступить против испанского правления прозвучал 23 августа 1896 года и широко известен как «Крик Пугада Лавина»." # Since 1901, Bonifacio's birthday has been celebrated by civic organizations. By 1920, Senator Lope K. Santos filed a bill to declare November 30 a holiday, in commemoration of the Supermo, Andres Bonifacio, the founder of the Katipunan, a secret society that lead us to the revolution against the Spanish in 1896.\n\nToday we celebrate the birthdate of one of our heroes, many high-ranking government officials, including President Quezon himself attended the ceremony in Bonifacio Monument or Monumento, in Caloocan, sculpted by the National Artist, Guillermo Tolentino in 1933. The Bonifacio Monument recalls the Philippine Revolution which was spearheaded by Andrés Bonifacio who had urged his men to raise against the colonial rule of Spain. His call to take arms against the Spanish rule was given on 23 August 1896, which is widely known as \"Cry of Pugad Lawin.\"
 philippines.32.a: "Да здравствует Верховный!" # Mabuhay ang Supremo!
 philippines.33.t: "Открытие сезона кампании" # Opening of the Campaign Season
 philippines.33.d: "До июльских выборов осталось два месяца, и Комиссия по выборам дала зеленый свет национальным кандидатам, которые будут вести кампанию за имеющиеся национальные должности, начиная с самого высокого поста в стране, президента Республики Филиппины и кончая сенаторами филиппинского сената. Многие надеются быть избранными, но лишь немногим посчастливится занять свои должности." # It is two months away from the eletions in July, and the Commission on Elections have signaled the green light for the national candidates that will be campaigning for the available national positions starting from the highest of office in the land, the President of the Republic of the Philippines down the the Senators of the Philippine Senate. Many are hoping to be elected, but there are only few who will be fortunate enough to be able to sit on the offices.
 philippines.33.a: "Звуки вашей кампании слишком громкие!" # Your campaign jingles are too loud!
 philippines.34.t: "Президентские выборы 1937 года" # The 1937 Presidential Elections
 philippines.34.d: "1936 год был очень трудным для националистов. Администрация Кесона была потрясена до глубины души, когда бывший министр экономики Бениньо Акино-старший был разоблачен в своей коррупции, связанной с выделением средств, предназначенных для сельскохозяйственных программ правительства бедным фермерам. Когда через несколько месяцев ситуация успокоилась, крах лондонской фондовой биржи снова подогрел ситуацию, когда недовольные фермеры и крестьяне вышли на улицы и призвали правительство к неэффективной реакции, которая привела к гибели людей.\n\nНеудивительно, что различные группы, такие как прогрессисты и сакдалисты, восприняли это как возможность повысить свою популярность среди населения. Падение популярности националистов привело к росту оппозиционных групп; пытаясь утвердиться в качестве альтернативы националистам. День выборов продолжался, и казалось, что их жертвы, как и победитель выборов, не были напрасны..." # 1936 was a very difficult year for the Nacionalistas, the Quezon administration was shocked to the core, when former Economic Secretary Benigno Aquino Sr. was exposed of his corruption involving the funds meant for the agricultural programs of the government to the impoverished farmers. As things calm down eventually in the few months, the London Stock Market Crash heated it up again as disgruntled farmers and peasants took to the streets and called on to the inefficient response by the government that resulted in deaths.\n\nThis was unsuprisingly taken as an opportunity by various groups such as the Progressistas and Sakdalistas to increase their popularity among the populace. As the popularity of the Nacionalistas decline, it resulted the rise of the opposing groups; trying to establish themselves as the alternatives to the Nacionalistas. As the election day went on, it seems that their sacrifices were not in vain as the winner of the elections are...
 philippines.34.a: "Либеральный" # Liberal
 philippines.34.b: "националист" # Nacionalista
 philippines.34.c: "прогрессивный" # Progressista
 philippines.34.e: "сакдалист" # Sakdalista
 philippines.34.f: "реформистский" # Repormista
 philippines.35.t: "Операция Мердека" # Operation Merdeka
 philippines.35.d: "Между 1658 и 1700 годами тогдашний султанат Сулу приобрел восточную часть территории Северного Борнео после того, как помог силам Брунейна урегулировать гражданскую войну. Поскольку мы являемся государством-преемником ныне несуществующего Султаната, у нас есть законные права на этот регион; с восстанием, начатым инсулиндианцами против британского колониального правительства в Инсулиндии, и с ослаблением британцев крахом лондонской фондовой биржи, мы можем, наконец, вернуть себе земли, которые британцы украли у султана; но возможности британской реакции все еще остаются, как будто бы мы продолжили свой шаг, действие не осталось незамеченным для Вестминстера или правительства в самой Батавии." # Between 1658 and 1700, the then Sultanate of Sulu acquired the eastern part of the territory of Northern Borneo after helping the Brunein forces settle a civil war. As we are the successor state to the now defunct Sultanate, we have a rightful claim onto the region; with the insurgency launched by the Insulindians against the British Colonial Government in Insulindia, and the British weakened by the London Stock Market Crash, we can finally reclaim the lands that the British stole from the Sultan; but there are still possibilities of British reaction, as if we proceeded with our move, the action is not become unnoticed to Westminster or the government in Batavia itself.
 philippines.35.a: "Дайте зеленый свет операции..." # Greenlight the operation...
 philippines.35.b: "Это слишком рискованно..." # It's too risky...
 philippines.36.t: "Операция Мердека – успешная" # Operation Merdeka - Successful
 philippines.36.d: "В 5:34 утра по местному времени отряды Королевской морской пехоты высадились в Сандакане, Северное Борнео, используя ранний утренний туман, чтобы быстро высадиться на берег. Местные жители были разбужены криками, которые разбудили полусонные подразделения местного гарнизона и приказали сдаться в казармах по всей зоне.\n\nНе имея численного превосходства и вооружения, гарнизоны сражались храбро, но тщетно, поскольку орудия ВМС Филиппин были направлены на упорных противников на территории. С тех пор боевые действия закончились, и на плацдармах прошло несколько часов относительного затишья, а наши войска рассчитывают захватить несколько ключевых районов, чтобы обеспечить наш контроль в регионе. Лондон и Батавия еще не отреагировали на наши действия; но тем не менее мы готовы и укрепляем свои позиции." # At 5.34am local time, detachments of the Royal Marines made ground in Sandakan, North Borneo using the early morning fog to advance quickly ashore. Locals were awoken as shouts went out to half asleep local garrison units being woken from their beds and ordered to surrender in barracks across the zone.\n\nOutnumbered and outgunned, the garrisons fought bravely but in vain, as the guns of the Philippine Navy were brought to bear on stubborn hold-outs in the territory. Fighting has since ended and several hours of relative calm have passed in the beachheads, with our troops expecting to capture several key areas to secure our control in the region. London and Batavia has yet to respond to our actions; but nonetheless, we are prepared and fortifying our positions.
 philippines.36.a: "Отличный..." # Excellent...
 philippines.37.t: "[PHI.GetAdjective] Тропы оккупируют Северное Борнео" # [PHI.GetAdjective] Trops Occupies North Borneo
 philippines.37.d: "Примерно в 6 утра по местному времени из региона Северного Борнео начали поступать сообщения о нападении хорошо вооруженных и специально обученных солдат. Хотя подробностей о том, кем были нападавшие, было мало, один из наших эсминцев заметил у побережья Сандакана эскадру кораблей ВМС Филиппин, обеспечивающих огневую поддержку того, что, как мы предполагаем, является контингентом филиппинских морских пехотинцев-разведчиков. Несмотря на храбрые сражения, наши гарнизонные подразделения в конечном итоге уступили более хорошо оснащенным филиппинским скаутам.\n\nT Хотя общественное мнение твердо поддерживает наше правительство в этом вопросе, некоторые сомневаются, что общественность полностью поддерживает войну с недавно независимой Филиппинской Республикой. Каким бы ни был наш ответ, мы должны выбирать осторожно." # At roughly 6am local time, reports began to come in from the North Borneo region regarding an assault by a heavily armed and specially trained force of soldiers. While details were scarce about who the attackers were, one of our Destroyers spotted a squadron of Philippine Navy vessels off the coast of Sandakan providing fire support for what we assume to be a contingent of Philippine Scout Marines. Despite fighting bravely, our garrisoned units eventually succumbed to the more well-equipped Philippine Scouts.\n\nT While public opinion is firmly in favour of our Government in the matter, some doubt that the public is fully behind a war with the recently independent Philippine Republic. Whatever our response is, we must choose carefully.
 philippines.37.a: "Мы вернем их обратно" # We'll get them back
 philippines.38.t: "[PHI.GetName] захватывает Северное Борнео" # [PHI.GetName] Seizes North Borneo
 philippines.38.d: "Примерно в 6 утра по местному времени из региона Северного Борнео начали поступать сообщения о нападении хорошо вооруженных и специально обученных солдат. Хотя подробностей о том, кем были нападавшие, было мало, некоторые из наших разведывательных кораблей заметили пару эскадрилий филиппинских ВМС у побережья Сандакана. Несколько часов спустя сообщения подтверждают, что подразделения Филиппинской Республики установили контроль над регионом Северного Борнео и укрепили свои позиции для ожидаемой контратаки со стороны нас или сил Инсулиндии. Поскольку колониальное правительство в Батавии занято подавлением восстания; и мы ослаблены крахом фондового рынка, у нас нет возможности ответить военным путем на провокацию [From.GetAdjective]." # At roughly 6am local time, reports began to come in from the North Borneo region regarding an assault by a heavily armed and specially trained force of soldiers. While details were scarce about who the attackers were, some of our reconnaissance ships spotted a couple of Philippine Navy squadrons near the coast of Sandakan. Few hours later, reports confirm that units of the Philippine Republic have secured control over the North Borneo region, and have fortified their positions for an expected counterattack by us or the Insulindian forces. As the colonial Government in Batavia is busy trying to quell off the uprising; and we are weakened by the Stock Market Crash, we do not have the capacity to respond militarily to the [From.GetAdjective] provocation.
 philippines.38.a: "Что?!" # What?!
 philippines.39.t: "[From.GetAdjective] Прибытие оборудования" # [From.GetAdjective] Equipment Arrives
 philippines.39.d: "Наши друзья из [From.GetNameDef] прислали нам партию пехотного снаряжения, чтобы помочь в нашей борьбе." # Our friends in [From.GetNameDef] have sent us a shipment of infantry equipment to aid in our struggle.
 philippines.39.a: "Очень нужно!" # Much needed!
 philippines.40.t: "Филиппинские волонтеры" # Filipino Volunteers
 philippines.40.d: "Изгоняя влияние Запада в Азии, мы должны помочь нашим братьям [INS.GetAdjective] победить империалистов." # In expelling Western influence in Asia, we need to help our [INS.GetAdjective] brothers in defeating the Imperialists.
 philippines.40.a: "Отправьте добровольцев" # Send the volunteers
 philippines.40.b: "оборудования уже достаточно" # Equipment are already enough
 philippines.41.t: "Филиппинские волонтеры" # Filipino Volunteers
 philippines.41.d: "Наши братья с севера прислали к нам добровольцев, чтобы помочь дать отпор британским империалистам." # Our brothers north have sent us volunteers to help repelling the British imperialists.
 philippines.41.a: "Отличный." # Excellent.
 philippines.42.t: "Последствия тайфуна Селинг" # Aftermath of Typhoon Seling
 philippines.42.d: "Метеорологическое бюро Филиппин наблюдало образование области низкого давления на юге Гуама недалеко от Филиппинского моря. По мере приближения этой области низкого давления к нашему архипелагу, находящемуся в 167 километрах от острова Самар; он превратился в тайфун, и бюро назвало его «Селинг». Несколько дней спустя этот тайфун обрушился на остров Самар, пересек Себу, а затем миновал Таклобан.\n\nКогда тайфун прошел и покинул архипелаг, он нанес колоссальный ущерб в 6 миллионов песо и убил 204 человека, еще больше людей пропали без вести. Хотя некоторые наши граждане находятся в безопасности в эвакуационных центрах, им каждый день нужны основные товары, такие как еда и чистая вода. Филиппинский Красный Крест уже находится в пострадавших районах, помогая нуждающимся, обеспечивая кашами и чистой водой. Разведывательные подразделения, размещенные или дислоцированные в этом районе, помогают найти пропавших без вести, а некоторые из них помогают в гуманитарных усилиях. Местные органы власти в этом районе обратились к национальному правительству с просьбой предоставить им больше помощи, поскольку их средства на исходе." # The Weather Bureau of the Philippines have observed a low-pressure area forming in the South of Guam near the Philippine Sea. As this low-pressure area comes approaches our archipelago, 167 kilometers near the Samar island; it became a typhoon and the bureau named it \"Seling\". A few days later, this typhoon hits the Samar island, crossing Cebu then passing Tacloban.\n\nAs the typhoon passed and leaves the archipelago, it left a whopping 6 million pesos in damages, and killing 204 people, with a lot more reported missing. While some of our citizens our safe in the evacuation centers, they need basic goods such as food and clean water every day. The Philippine Red Cross are already in the affected areas helping those in need, providing porridges and clean water. Scout units garrisoned or deployed in the area are helping to find the reported missing, with some of them helping in humanitarian efforts. Local Government units in the area have plead for the National Government to provide them more aid, as their funds are running thin.
 philippines.42.a: "Немедленно отправляйте помощь!" # Send help immediately!
 philippines.43.t: "Кесон ищет медицинскую помощь в США" # Quezon Seeks Medical Care in the US
 philippines.43.d: "Бывший президент Мануэль Луис Кесон, который по-прежнему является нынешним лидером Националистической партии, прилетел сегодня в Лос-Анджелес, чтобы пройти курс лечения от рецидивирующего туберкулеза. Бывший президент, которому разрешили дать короткое интервью прессе, заявил, что намерен найти гораздо более современное лечение своей болезни и вернется. Экс-президента сопровождает его жена Аврора, которая обеспокоена текущим состоянием здоровья его мужа." # Former President Manuel Luis Quezon, still the current leader of the Nacionalista Party have flown to Los Angeles today to seek treatment for his recurring Tuberculosis. The former President, whom allowed a quick interview from the press, stated that, he intends to seek a far more modern treatment for his disease and he will come back. Accompanying the former President, is his wife, Aurora, seen as worried to his husband's current medical status.
 philippines.43.a: "Удачного полета!" # Have a safe flight!
 philippines.44.t: "Президент совершает поездку по сельскохозяйственным угодьям" # President Tours the Farmlands
 philippines.44.d: "Президент [Root.GetLeader] недавно покинул свой дворец; и отправился осмотреть сельскохозяйственные угодья Нуэва-Эсиха. Поскольку фермеры являются основной основой филиппинского общества, его заинтересовало, что правительство может сделать еще, чтобы помочь им. Он прибыл в город Кабанатуан, встретился с мэром города и приступил к встречам с местными фермерами." # President [Root.GetLeader] have recently left his palace; and went to tour the farmlands of Nueva Ecija. As the farmers are the main foundations of the Philippine society, he found interest in what the government can do more in helping them. He arrived in the city of Cabanatuan, met with the city mayor and proceeded to meet with the local farmers.
 philippines.44.a: "Посадка - это не шутка..." # Magtanim ay hindi biro...
 philippines.45.t: "Закон о филиппинском языке" # The Filipino Language Act
 philippines.45.d: "Филиппины богаты историей и культурой; и при этом во многих культурах разных племен существует множество диалектов, таких как тагальский, кебуанский, пангалатокский и другие. Хотя испанский и английский считались «официальными языками» во время американского колониального периода, изначально не существовало «национального языка». Конституция предусматривала, что Ассамблея должна предпринять шаги по развитию и принятию общего национального языка на основе одного существующего родного языка, пока в противном случае английский и испанский не останутся официальными языками.\n\nНациональная Ассамблея одобрила создание Института национального языка, поручив ему провести исследование и обзор каждого существующего родного языка в надежде выбрать, какой из них станет основой для стандартизированного национального языка; с их рекомендацией сделать тагальский язык национальным языком. Президент принял рекомендацию INL и издал Указ № 134, с. 1937 г., одобрив принятие тагальского языка в качестве языка Филиппин и провозгласив национальным языком Филиппин, основанным на тагальском языке." # The Philippines is rich with history and culture; and with that many culture from different tribes exists a wide variety of dialects such as Tagalog, Cebuano, Pangalatok, and more. While Spanish and English were considered \"official languages\" during the American colonial period, there existed no \"national language\" initially. The Constitution provided that the Assembly, shall take steps toward the development and adoption of a common national language based on one existing native language, until otherwise, English and Spanish, shall continue as official languages.\n\nThe National Assembly has approved the creation of the Institute of the National Language, tasking it with making a study and survey of each existing native language, hoping to choose which was to be the base for a standardized national language; with their recommendation of making Tagalog as the National Language. The President have accepted the INL's recommendation and have issued Executive Order No. 134, s. 1937, approving the adoption of Tagalog as the language of the Philippines, and proclaimed the national language of the Philippines so based on the Tagalog language.
 philippines.45.a: "Да здравствуют Филиппины!" # Mabuhay ang Pilipinas!
 philippines.46.t: "Распятие в Сан-Фернандо, Пампанга." # Crucifixion in San Fernando, Pampanga
 philippines.46.d: "Наступает сезон фонарей, и многие филиппинцы осознают важность веры в своей повседневной жизни; преданные сейчас готовят свою религиозную практику к Страстной пятнице. Этих преданных или кающихся добровольно распинают, подражая страданиям и смерти Иисуса Христа, в то время как соответствующие практики включают ношение деревянных крестов, ползание по грубому тротуару и самобичевание. Эти кающиеся считают эти действия умерщвлением плоти и предпринимают их, чтобы попросить прощения за грехи, выполнить панату или обет или выразить благодарность за оказанные милости.\n\nЭти практики наблюдаются в Сан-Педро-Кутуд, городе Сан-Фернандо, Пампанге, но их также можно найти в других городах и провинциях. Хотя Департамент здравоохранения выразил обеспокоенность по поводу их практики, никто не мог остановить преданность и веру." # As the lanten season comes, and many Filipinos consider the importance of faith in their everyday lives; devotees are now preparing their devotional practice for Good Friday, These devotees or penitents are willingly crucified in imitation of Jesus Christ's suffering and death, while related practices include carrying wooden crosses, crawling on rough pavement and self-flagellation. These penitents consider these acts to be mortification of the flesh, and undertake these to ask forgiveness for sins, to fulfil a panatà or vow, or to express gratitude for favours granted.\n\nThese practices are observed in San Pedro Cutud, San Fernando City, Pampanga but can also be found on other cities or provinces. While the Health Department have expressed their concerns about their practices, no one could stop one's devotion and faith.
 philippines.46.a: "Это должно быть больно..." # That's got to hurt...
 philippines.47.t: "Пограничное столкновение на Северном Борнео" # Border Clash in North Borneo
 philippines.47.d: "Наши полевые командиры наших войск, дислоцированных в районе Северного Борнео, называемом Сабах, сообщили, что небольшой отряд военнослужащих [ENG.GetAdjective] открыл огонь по нашим пограничникам. Похоже, что эти подразделения [ENG.GetAdjective] были пьяны, когда открыли огонь; в результате чего некоторые наши подразделения открыли ответный огонь, что привело к нескольким жертвам." # Our field commanders of our troops stationed in the North Borneo region, called Sabah, have reported that a small detachment of [ENG.GetAdjective] troops have opened fire at our border guards. It seems that these [ENG.GetAdjective] units are drunk when they opened fire; causing some of our units to fire back, resulting in a handful of casualties.
 philippines.47.a: "Вызовите британского посла прямо сейчас!" # Summon the British Ambassador now!
 philippines.48.t: "Пограничное столкновение на Северном Борнео" # Border Clash in North Borneo
 philippines.48.d: "В министерство иностранных дел поступила телеграмма от нашего консульства в [PHI.Capital.GetName]. Правительство [PHI.GetAdjective] сообщило, что подразделения [ENG.GetAdjective] открыли огонь на границе в Сабахе, в результате чего несколько человек пострадали. Разведка сообщает, что эти утверждения [PHI.GetAdjective] на самом деле были верными; и правительство [PHI.GetAdjective] потребовали возмещения ущерба." # A telegram was received by the foreign office from our consulate in [PHI.Capital.GetName]. The [PHI.GetAdjective] Government reported that [ENG.GetAdjective] units have opened fire in the border at Sabah, causing a couple of casualties. Intelligence reports that these claims by the [PHI.GetAdjective] were in fact correct; and the [PHI.GetAdjective] Government have demanded reparations.
 philippines.48.a: "Мы должны принять" # We have to accept
 philippines.48.b: "Это не наша вина" # It ain't our fault
 philippines.49.t: "[From.GetAdjective] принимает наши требования" # The [From.GetAdjective] Accepts Our Demands
 philippines.49.d: "Правительство [From.GetAdjective] приняло наши требования о возмещении ущерба тем, кто погиб в пограничном столкновении на Северном Борнео; и они хотели бы выразить свои соболезнования семьям, потерявшим своих близких из-за действий, совершенных их войсками." # The [From.GetAdjective] Government have accepted our demands of reparation to those who died in the border clash in North Borneo; and they would like to extend their condolences to the families who lost their love ones on the actions their troops have done.
 philippines.49.a: "Отличный." # Excellent.
 philippines.50.t: "[From.GetAdjective] отказывается выполнять наши требования" # The [From.GetAdjective] Refuses Our Demands
 philippines.50.d: "Правительство [From.GetAdjective] отклонило наши требования о возмещении ущерба тем, кто погиб в пограничном столкновении на Северном Борнео; вместо этого они осудили правительство [PHI.GetAdjective] за кражу территории Британской империи." # The [From.GetAdjective] Government have refused our demands of reparation to those who died in the border clash in North Borneo; they instead condemned the [PHI.GetAdjective] Government for stealing a territory of the British Empire.
 philippines.50.a: "Разочарование..." # Dissapointing...
 philippines.51.t: "Нападение на гарнизоны на Северном Борнео" # Garrisons Attacked in North Borneo
 philippines.51.d: "Наши полевые командиры наших войск, дислоцированных в районе Северного Борнео, называемом Сабах, сообщили, что небольшой отряд военнослужащих [INS.GetAdjective] открыл огонь по нашим пограничникам. Кажется, что эти подразделения [INS.GetAdjective] питаются яростью и недоверием к нам в целом, когда мы вернули себе нашу законную территорию Сабаха. Однако, поскольку наши войска были обстреляны войсками [INS.GetAdjective], они без колебаний открыли ответный огонь, в результате чего на стороне [INS.GetAdjective] было несколько жертв." # Our field commanders of our troops stationed in the North Borneo region, called Sabah, have reported that a small detachment of [INS.GetAdjective] troops have opened fire at our border guards. It seems that these [INS.GetAdjective] units are fueled with rage and distrust on us generally, when we reclaimed our rightful territory of Sabah. However, as our troops were fired upon by the [INS.GetAdjective] troops they were not hesitant to fire back resulting in a handful of casualties of the side of the [INS.GetAdjective]s.
 philippines.51.a: "Что?!" # What?!
 philippines.52.t: "Националисты критикуют программу государственно-частного партнерства" # Nacionalistas Critices Private-Public Partnership Program
 philippines.52.d: "Программа государственно-частного партнерства направлена ​​на создание государственных проектов как государственным, так и частным секторами соответственно, в обмен на передачу частному сектору определенной собственности на свои инвестиции. Сенатор Эулогио Родригес-старший от Националистической партии выразил обеспокоенность последствиями этой программы и поставил под сомнение ее законность, поскольку Конституция не позволяет коммунальным предприятиям находиться в собственности частных предприятий." # The Private-Public Partnership Program aims to build public projects by both the public and private sectors respectively, in exchange of the private sector be given of some kind of ownership for their investments. Senator Eulogio Rodriguez Sr. from the Nacionalista Party have expressed his concerns the effects of this program and questioned its legality as the Constitution does not allow public utilities to be owned by private entities.
 philippines.52.a: "Совсем ерунда..." # Quite nonsense...
 philippines.53.t: "Сакдалистское движение теряет поддержку" # Sakdalista Movement Losing Support
 philippines.53.d: "Основными сторонниками сакдалиста являются безземельные фермеры и крестьяне, недовольные правительством. Однако по мере того, как правительство реализует различные программы и реформы, недовольство ими начинает сходить на нет, а поддержка сакдалиистов среди населения быстро снижается." # The Sakdalistas main supporters are the landless farmers and peasants that are discontented with the Government. However, as the Government implements various programs and reforms, these discontentment towards them are beginning to wind down, and Sakdalista support among the populace are rapidly decreasing.
 philippines.53.a: "Все по плану..." # All according to plan...
 philippines.54.t: "Земельная реформа завершена" # Land Reform Finished
 philippines.54.d: "Земельная реформа была спорным вопросом. Не потому, что некоторые не согласны, а потому, что реализация этого может быть либо дорогостоящей, либо насильственной в виде экспроприации. Тем не менее, попытка правительства провести разумную земельную реформу, не прибегая к незаконным или насильственным методам, начинает приводить к некоторым реальным изменениям в сельских районах по всей территории Филиппин. Это займет очень много времени, но программа «Земля земледельцу» постепенно перераспределяет землю и выплачивает компенсации помещикам, обеспечивая более высокий уровень владения крестьянской землей, чем когда-либо прежде." # Land reform has been a controversial issue. Not because some disagree, but because implementing it can either be expensive or violent through expropriations. Regardless, the government's attempt to implement a reasonable land reform without resorting to illegal or violent means is starting to see some real changes in rural areas throughout the Philippines. It will take a very long time, but the Land to the Tiller program is slowly redistributing land and compensating landlords, giving a higher rate of peasant land ownership like never before.
 philippines.54.a: "Большой!" # Great!
 philippines.55.t: "Агинальдо уходит из политики" # Aguinaldo Retires from Politics
 philippines.55.d: "Эмилио Агинальдо, бывший революционер и ярый критик предыдущей администрации, объявил, что официально уходит из политики и вместо этого сосредоточится на своей жене и семье." # Emilio Aguinaldo, the former revolutionary and a vocal critic of the previous administration, has announced he is officially retiring from politics, and instead will be focusing on his wife and family.
 philippines.55.d.1: "Эмилио Агинальдо, бывший революционер и ярый критик нашей администрации, объявил, что официально уходит из политики и вместо этого сосредоточится на своей жене и семье." # Emilio Aguinaldo, the former revolutionary and a vocal critic of our administration, has announced he is officially retiring from politics, and instead will be focusing on his wife and family.
 philippines.55.a: "Счастливой пенсии, Мионг!" # Happy retirement, Miong!
 philippines.56.t: "Выборы 1941 года" # Elections of 1941
 philippines.56.d: "Самые ожидаемые выборы за долгое время, [GetYear] Филиппинские выборы, заставляют каждого филиппинца напрягаться. Мануэль А. Рохас, глава оппозиции, баллотируется в президенты от либеральной партии; в то время как Серджио Осменья, архитектор Плана индустриализации Филиппин, является его главным соперником. Голоса официально подсчитаны, и победителем выборов признан..." # The most anticipated elections in a long time, the [GetYear] Philippine Elections have every Filipino on the edge of his or her seat. Manuel A. Roxas the head of the opposition, is running for President for the Liberal ticket; while Sergio Osmeña, the architect of the Philippine Industrialization Plan is his main contender. The votes have been officially counted and the winner of the election is...
 philippines.56.d.1: "Самые ожидаемые выборы за долгое время, [GetYear] Филиппинские выборы, заставляют каждого филиппинца напрягаться. Националистическую партию в настоящее время возглавляет Серхио Осменья, который баллотируется на пост президента против действующего президента; Мануэль А. Рохас баллотируется от либералов. Голоса официально подсчитаны, и победителем выборов признан..." # The most anticipated elections in a long time, the [GetYear] Philippine Elections have every Filipino on the edge of his or her seat. The Nacionalista Party is currently lead by Sergio Osmeña, whom is running for President against the incumbent President; Manuel A. Roxas is running for the Liberal ticket. The votes have been officially counted and the winner of the election is...
 philippines.56.a: "Серхио П. Осменья побеждает на выборах!" # Sergio P. Osmeña wins the election!
 philippines.56.b: "Мануэль Луис Кесон побеждает на выборах!" # Manuel Luis Quezon wins the election!
 philippines.56.c: "Мануэль А. Рохас побеждает на выборах!" # Manuel A. Roxas wins the election!
 philippines.57.t: "Выборы 1945 года" # Elections of 1945
 philippines.57.d: "Самые ожидаемые выборы за долгое время, [GetYear] президентские выборы на Филиппинах, заставляют каждого филиппинца напрягаться. Действующий президент Серхио Осменья баллотируется на переизбрание от партии «Националисты»; однако его главный соперник, Эльпидио Кирино, соучредитель оппозиционной партии Либеральная партия, также баллотируется на пост президента. Эти выборы, однако, совершенно иные, поскольку третий претендент, сенатор Хуан Сумулонг от Демократической партии, также надеется выиграть гонку за Малаканьяна. Голоса официально подсчитаны, и победителем выборов признан..." # The most anticipated elections in a long time, the [GetYear] Philippine Presidential Elections have every Filipino on the edge of his or her seat. The current incumbent President, Sergio Osmeña is running for reelection for the Nacionalista ticket; his main contender though, Elpidio Quirino, a co-founder of the opposition party, the Liberal Party is also running for a presidential bid. This election though is quite different, as a third contender, Senator Juan Sumulong, from the Democrata Party is also hoping to win the race to Malacañan. The votes have been officially counted and the winner of the election is...
 philippines.57.d.1: "Самые ожидаемые выборы за долгое время, [GetYear] президентские выборы на Филиппинах, заставляют каждого филиппинца напрягаться. Правящая партия, либералы, выдвигает свою ставку на Эльпидио Квирино, одного из ее соучредителей и бывшего сенатора. Его главным соперником является Серхио Осменья, претендующий на пост \"Националиста\". Эти выборы, однако, совершенно иные, поскольку третий претендент, сенатор Хуан Сумулонг от Демократической партии, также надеется выиграть гонку за Малаканьяна. Голоса официально подсчитаны, и победителем выборов признан..." # The most anticipated elections in a long time, the [GetYear] Philippine Presidential Elections have every Filipino on the edge of his or her seat. The ruling party, the Liberals are putting their bid for Elpidio Quirino, one of its, co-founders of the party and a former Senator. His main contender is Sergio Osmeña, running for the Nacionalista ticket. This election though is quite different, as a third contender, Senator Juan Sumulong, from the Democrata Party is also hoping to win the race to Malacañan. The votes have been officially counted and the winner of the election is...
 philippines.57.a: "Серджио Осменья" # Sergio Osmeña
 philippines.57.b: "Эльпидио Кирино" # Elpidio Quirino
 philippines.57.c: "Хуан Шаг вперед" # Juan Sumulong
 philippines.58.t: "Выборы 1949 года" # Elections of 1949
 philippines.58.d: "Самые ожидаемые выборы за долгое время, [GetYear] президентские выборы на Филиппинах, заставляют каждого филиппинца напрягаться. Националисты, либералы и демократы боролись за место в Малаканском дворце. Кто будет править страной следующие четыре года?" # The most anticipated elections in a long time, the [GetYear] Philippine Presidential Elections have every Filipino on the edge of his or her seat. The Nacionalistas, the Liberals, and the Democratas have been racing for a seat in the Malacanan Palace. Who would rule the country for the next four years?
 philippines.58.a: "Эулогио Родригес-старший, националист!" # Eulogio Rodriguez Sr., a Nacionalista!
 philippines.58.b: "Эльпидио Квирино — либералу!" # Elpidio Quirino, a Liberal!
 philippines.58.c: "Конечно, г-н Ректо, демократ!" # Claro M. Recto, a Democrata!
 philippines.59.t: "Выборы 1953 года" # Elections of 1953
 philippines.59.d: "Самые ожидаемые выборы за долгое время, [GetYear] президентские выборы на Филиппинах, заставляют каждого филиппинца напрягаться. Националисты, либералы и демократы боролись за место в Малаканском дворце. Кто будет править страной следующие четыре года?" # The most anticipated elections in a long time, the [GetYear] Philippine Presidential Elections have every Filipino on the edge of his or her seat. The Nacionalistas, the Liberals, and the Democratas have been racing for a seat in the Malacanan Palace. Who would rule the country for the next four years?
 philippines.59.a: "Эулогио Родригес-старший, националист!" # Eulogio Rodriguez Sr., a Nacionalista!
 philippines.59.b: "Х. Антонио Аранета, либерал!" # J. Antonio Araneta, a Liberal!
 philippines.59.c: "Конечно, г-н Ректо, демократ!" # Claro M. Recto, a Democrata!
 philippines.60.t: "Выборы 1957 года" # Elections of 1957
 philippines.60.d: "Самые ожидаемые выборы за долгое время, [GetYear] президентские выборы на Филиппинах, заставляют каждого филиппинца напрягаться. Националисты, либералы и демократы боролись за место в Малаканском дворце. Кто будет править страной следующие четыре года?" # The most anticipated elections in a long time, the [GetYear] Philippine Presidential Elections have every Filipino on the edge of his or her seat. The Nacionalistas, the Liberals, and the Democratas have been racing for a seat in the Malacanan Palace. Who would rule the country for the next four years?
 philippines.60.a: "Камилио Осиас, националист!" # Camilio Osias, a Nacionalista!
 philippines.60.b: "Х. Антонио Аранета, либерал!" # J. Antonio Araneta, a Liberal!
 philippines.60.c: "Лопе К. Сантос, демократ!" # Lope K. Santos, a Democrata!
 philippines.61.t: "[PHI.GetAdjective] Вход в [Root.GetFactionName]" # [PHI.GetAdjective] Entry to the [Root.GetFactionName]
 philippines.61.d: "Правительство Филиппин обратилось к нам с интересным предложением. Похоже, оно уже давно дистанцировалось от американцев и предпочло установить с нами официальные дипломатические отношения. Они также предложили нашему правительству вступление своей страны в [Root.GetFactionName]; позволяя им и нам построить более конструктивные отношения, принося пользу нам обоим. Хотя их военная сила не так уж велика, положение их архипелага является стратегическим преимуществом в военном и экономическом отношении." # The Filipino Government have approached us with an interesting proposal, it seems for the longest time, they are distancing themselves from the Americans and have opted to have formal diplomatic relations with us. They have also proposed to our Government their country's entry to the [Root.GetFactionName]; allowing them, and us, to build a more constructive relationship while benefitting us both. While their military force is not quite that big, their position of their archipelago is a strategic advantage, militarily and economically.
 philippines.61.a: "Нам нужна помощь, которую мы можем получить." # We need the help we can get.
 philippines.61.b: "Они были бы обузой" # They would be a burden
 philippines.62.t: "[From.GetNameDef] принимает" # [From.GetNameDef] Accepts
 philippines.62.d: "Правительство [From.GetAdjective] приняло наше предложение о вступлении в их альянс." # The [From.GetAdjective] Government have accepted our proposal in joining their alliance.
 philippines.62.a: "Большой!" # Great!
 philippines.63.t: "[From.GetNameDef] отказывается" # [From.GetNameDef] Refuses
 philippines.63.d: "Правительство [From.GetAdjective] отклонило наше предложение о вступлении в их альянс. Мы позаботимся о том, чтобы однажды они пожалели об этом решении." # The [From.GetAdjective] Government have refused our proposal in joining their alliance. We will make sure that they will regret this decision one day.
 philippines.63.a: "Разочарование..." # Dissapointing...
 philippines.64.t: "[PHI.GetAdjective]s предлагает союз" # [PHI.GetAdjective]s Proposes Alliance
 philippines.64.d: "Правительство Филиппин обратилось к нам с интересным предложением. Судя по всему, оно предлагает военный союз между нами и ими в надежде на борьбу как с европейским колониализмом, так и с японской агрессией в регионе. Принятие их предложения снова приведет их в нашу сферу влияния, но если это произойдет, то втянет нас в конфликт." # The Filipino Government have approached us with an interesting proposal, it seems that they proposes a military alliance between us and them, in hopes of combatting both European colonialism and Japanese aggression in the region. Accepting their proposal will get them into our sphere of influence once more, but will drag us into a conflict if it happens.
 philippines.64.a: "Нам нужно защитить их" # We need to protect them
 philippines.64.b: "Это их война, а не наша" # It's their war not ours
 philippines.65.t: "[From.GetNameDef] принимает" # [From.GetNameDef] Accepts
 philippines.65.d: "Правительство [From.GetAdjective] приняло наше предложение о создании альянса." # The [From.GetAdjective] Government have accepted our proposal in creating an alliance.
 philippines.65.a: "Большой!" # Great!
 philippines.66.t: "[From.GetNameDef] отказывается" # [From.GetNameDef] Refuses
 philippines.66.d: "Правительство [From.GetAdjective] отклонило наше предложение о создании альянса. Мы позаботимся о том, чтобы однажды они пожалели об этом решении." # The [From.GetAdjective] Government have refused our proposal in creating an alliance. We will make sure that they will regret this decision one day.
 philippines.66.a: "Разочарование..." # Dissapointing...
 philippines.67.t: "[PHI.GetAdjective]s предлагает союз" # [PHI.GetAdjective]s Proposes Alliance
 philippines.67.d: "Правительство Филиппин обратилось к нам с интересным предложением. Судя по всему, оно предлагает военный союз между нами и ими в надежде на борьбу с европейским колониализмом в регионе. Принятие их предложения снова приведет их в нашу сферу влияния, но если это произойдет, то втянет нас в конфликт." # The Filipino Government have approached us with an interesting proposal, it seems that they proposes a military alliance between us and them, in hopes of combatting both European colonialism in the region. Accepting their proposal will get them into our sphere of influence once more, but will drag us into a conflict if it happens.
 philippines.67.a: "Мы принимаем!" # We accept!
 philippines.67.b: "Это их война, а не наша" # It's their war not ours
 philippines.68.t: "[From.GetNameDef] принимает" # [From.GetNameDef] Accepts
 philippines.68.d: "Правительство [From.GetAdjective] приняло наше предложение о создании альянса." # The [From.GetAdjective] Government have accepted our proposal in creating an alliance.
 philippines.68.a: "Большой!" # Great!
 philippines.69.t: "[From.GetNameDef] отказывается" # [From.GetNameDef] Refuses
 philippines.69.d: "Правительство [From.GetAdjective] отклонило наше предложение о создании альянса. Мы позаботимся о том, чтобы однажды они пожалели об этом решении." # The [From.GetAdjective] Government have refused our proposal in creating an alliance. We will make sure that they will regret this decision one day.
 philippines.69.a: "Разочарование..." # Dissapointing...
 philippines.69.b: "Мы достанем их силой!" # We'll get them by force!
 philippines.70.t: "[PHI.GetAdjective]s приглашает нас в свой Альянс" # [PHI.GetAdjective]s Invites us to their Alliance
 philippines.70.d: "Правительство Филиппин обратилось к нам с интересным предложением. Кажется, они приглашают нас к военному союзу в надежде на борьбу с европейским колониализмом в регионе. Принятие их предложения даст нам больше союзников против будущих угроз, но втянет нас в конфликт, если он произойдет." # The Filipino Government have approached us with an interesting proposal, it seems that they invites a military alliance between us and them, in hopes of combatting both European colonialism in the region. Accepting their proposal will get us more allies against future threats, but will drag us into a conflict if it happens.
 philippines.70.a: "Где мы подписываем?" # Where do we sign?
 philippines.70.b: "Это их война, а не наша" # It's their war not ours
 philippines.71.t: "[From.GetNameDef] принимает" # [From.GetNameDef] Accepts
 philippines.71.d: "Правительство [From.GetAdjective] приняло наше предложение о создании альянса." # The [From.GetAdjective] Government have accepted our proposal in creating an alliance.
 philippines.71.a: "Большой!" # Great!
 philippines.72.t: "[From.GetNameDef] отказывается" # [From.GetNameDef] Refuses
 philippines.72.d: "Правительство [From.GetAdjective] отклонило наше предложение о создании альянса. Мы позаботимся о том, чтобы однажды они пожалели об этом решении." # The [From.GetAdjective] Government have refused our proposal in creating an alliance. We will make sure that they will regret this decision one day.
 philippines.72.a: "Разочарование..." # Dissapointing...
 philippines.72.b: "Мы достанем их силой!" # We'll get them by force!
 philippines.73.t: "[PHI.GetAdjective]s требует Бирмы" # [PHI.GetAdjective]s Demands Burma
 philippines.73.d: "Правительство Филиппин обратилось к нам с довольно интересным предложением: они требуют передать бирманские земли под их контроль. Поскольку мы не имеем права владеть или эксплуатировать какие-либо его богатства. Они планируют создать государство-сателлит, послушное Маниле. Каким должен быть наш ответ?" # The Filipino Government have approached us with a rather interesting proposal, they demand that the Burmese lands be transferred to their control. As we do not have the right to own or exploit any of its riches. They plan to create a satellite state that is obedient to Manila. What should our response?
 philippines.73.a: "Передача бирманских земель" # Transfer the Burmese lands
 philippines.73.b: "Они сумасшедшие?" # Are they insane?
 philippines.74.t: "[From.GetNameDef] принимает" # [From.GetNameDef] Accepts
 philippines.74.d: "Правительство [From.GetAdjective] приняло наши требования о передаче бирманских земель под наш контроль." # The [From.GetAdjective] Government have accepted our demands in transferring the Burmese lands to our control.
 philippines.74.a: "Большой!" # Great!
 philippines.75.t: "[From.GetNameDef] отказывается" # [From.GetNameDef] Refuses
 philippines.75.d: "Правительство [From.GetAdjective] отклонило наши требования о передаче бирманских земель под наш контроль. Мы позаботимся о том, чтобы однажды они пожалели об этом решении." # The [From.GetAdjective] Government have refused our demands in transferring the Burmese lands to our control. We will make sure that they will regret this decision one day.
 philippines.75.a: "Разочарование..." # Dissapointing...
 philippines.75.b: "Мы достанем их силой!" # We'll get them by force!
 philippines.76.t: "Сингапур пал перед войсками [From.GetAdjective]" # Singapore falls to [From.GetAdjective] Troops
 philippines.76.d: "Тревожные новости с Востока: похоже, наша крепость в Сингапуре захвачена войсками [From.GetAdjective]. Имеются неподтвержденные сведения о том, что произошло с силами и частями нашего гарнизона в этом районе; в первую очередь нынешний губернатор Сингапура. По некоторым данным, наши выжившие солдаты были отправлены в тюрьмы войсками [From.GetAdjective].\n\nПосле падения Сингапура и эвакуации правительства Ост-Индии в Дарвин; многие в правительстве предлагали нам просить мира. Однако есть и надежды на то, что ситуация повернется в пользу Британии, в первую очередь адмиралы, которые считают, что филиппинская экономика не готова к войне и со временем изнашивается." # Disturbing news from the East, it seems that our fortress in Singapore have fallen to the [From.GetAdjective] troops. There are unconfirmed reports of what happened to our garrisoned forces and units in the area; most notably the current Governor of Singapore. Some reports that our surviving soldiers were detained by [From.GetAdjective] troops to prisons.\n\nWith Singapore fallen and the East Indies Government evacuated to Darwin; many in the government have suggested that we should sue for peace. However, there are also some hopeful that the situation will turn to Britain's favor, primarily the admirals, whom believes that the Filipino economy is not ready for war and will worn out eventually.
 philippines.76.d.1: "Тревожные новости с Востока: похоже, наша крепость в Сингапуре захвачена войсками [From.GetAdjective]. Имеются неподтвержденные сведения о том, что произошло с силами и частями нашего гарнизона в этом районе; в первую очередь нынешний губернатор Сингапура. По некоторым данным, наши выжившие солдаты были отправлены в тюрьмы войсками [From.GetAdjective].\n\nПосле падения Сингапура Цейлон стал ближайшей базой нашего правительства, и многие в правительстве предложили нам просить мира. Однако есть и надежды на то, что ситуация повернется в пользу Британии, в первую очередь адмиралы, которые считают, что филиппинская экономика не готова к войне и со временем изнашивается." # Disturbing news from the East, it seems that our fortress in Singapore have fallen to the [From.GetAdjective] troops. There are unconfirmed reports of what happened to our garrisoned forces and units in the area; most notably the current Governor of Singapore. Some reports that our surviving soldiers were detained by [From.GetAdjective] troops to prisons.\n\nWith Singapore fallen, Ceylon is the nearest base for our government and many in the government have suggested that we should sue for peace. However, there are also some hopeful that the situation will turn to Britain's favor, primarily the admirals, whom believes that the Filipino economy is not ready for war and will worn out eventually.
 philippines.76.a: "Приготовьтесь просить мира." # Prepare to sue for peace.
 philippines.76.b: "Не все потеряно!" # Not all is lost!
 philippines.77.t: "Поражение в Индокитае" # Defeat in Indochina
 philippines.77.d: "Наше колониальное правительство в Индокитае объявило, что наши собственные солдаты не смогут противостоять подавляющим атакам войск [From.GetAdjective]. Французско-индокитайское правительство объявило о своей капитуляции; и многие в правительстве требуют, чтобы мы потребовали мира. Однако есть и такие, для которых война в конечном итоге может пойти в нашу пользу, но это может занять некоторое время, и может пролиться еще больше крови." # Our colonial government in Indochina have announced that the overwhelming attacks by [From.GetAdjective] troops can't be handled further by our own soldiers. The French-Indochinese government have announced their capitulation; and many within the government demands that we sue for peace. However, there are also some that the war can go on to our favour eventually, but that may take some time and more blood can be spilled.
 philippines.77.a: "Приготовьтесь просить мира." # Prepare to sue for peace.
 philippines.77.b: "Не все потеряно!" # Not all is lost!
 philippines.79.t: "Защита наших колоний" # Safeguarding our Colonies
 philippines.79.d: "Поскольку наши вооруженные силы разбиты немецкими войсками и капитулировали наше правительство перед [Root.GetCapitalVictoryPointName]; наши союзники [From.GetAdjective] обратились к нам с интересным предложением. Поскольку у них есть свободная рабочая сила и оборудование для наблюдения за нашими колониями в их районе; они предлагают нам временно отказаться от контроля над ними; высвободить нашу собственную рабочую силу и некоторое оборудование в надежде переломить ход войны. Хотя это предложение может принести нам пользу в военном отношении; некоторые сомневаются в намерениях [From.GetAdjective] предложить такое предложение." # As our military are overwhelmed by German forces and have capitulated our government to [Root.GetCapitalVictoryPointName]; our [From.GetAdjective] allies have approached us with an interesting proposal. As they have the spare manpower and equipment to oversee our colonies in their area; they propose that we temporarily reliquish our control of them; to free up our own manpower and some equipment in hopes to turn that tides of the war. While this proposal can benefit us militarily; some doubt the intensions of the [From.GetAdjective] for offering such as proposal.
 philippines.79.a: "Какая замечательная идея!" # What a wonderful idea!
 philippines.79.b: "Мы не доверяем [From.GetAdjective]s" # We don't trust the [From.GetAdjective]s
 philippines.80.t: "[From.GetAdjective] принимает наше предложение" # The [From.GetAdjective] Accepts Our Proposal
 philippines.80.d: "Правительство [From.GetAdjective] увидело мудрость в нашем предложении и приняло наше предложение передать нам контроль над своими колониями." # The [From.GetAdjective] Government have seen the wisdom in our offer and have accepted our proposal to relinquish their control over their colonies to us.
 philippines.80.a: "Отличный!" # Excellent!
 philippines.81.t: "[From.GetAdjective] отклоняет наше предложение" # The [From.GetAdjective] Refuses Our Proposal
 philippines.81.d: "[From.GetAdjective] оказались упрямыми, поскольку, находясь на смертном одре своей страны, они не рассмотрели наше предложение." # The [From.GetAdjective] have been proved stubborn as in their literal country's death bed, they have not considered our proposal.
 philippines.81.a: "Разочарование..." # Dissapointing...
 philippines.82.t: "Филиппины требуют права собственности на Гуам" # Philippines Requests Ownership of Guam
 philippines.82.d: "Ранее сегодня из Манилы в наше министерство иностранных дел была отправлена ​​телеграмма с просьбой о признании права собственности на остров Гуам. Должны ли мы принять?" # A telegram was sent from Manila earlier today to our foreign ministry, requesting the ownership of the island of Guam. Should we accept?
 philippines.82.a: "Облегчить трансфер" # Facilitate the transfer
 philippines.82.b: "Что? Они сумасшедшие?" # What? Are they insane?
 philippines.83.t: "[From.GetName] принимает" # [From.GetName] Accepts
 philippines.83.d: "Наш посол в [From.GetName] получил подтверждение того, что правительство [From.GetAdjective] приняло нашу просьбу о передаче нам права собственности на Гуам." # Our ambassador in [From.GetName] have received confirmation that the [From.GetAdjective] Government have accepted our request to transfer the ownership of Guam to us.
 philippines.83.a: "Отличный." # Excellent.
 philippines.84.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 philippines.84.d: "Наш посол в [From.GetName] получил подтверждение того, что правительство [From.GetAdjective] отклонило нашу просьбу о передаче нам права собственности на Гуам." # Our ambassador in [From.GetName] have received confirmation that the [From.GetAdjective] Government have refused our request to transfer the ownership of Guam to us.
 philippines.84.a: "Экстрадируйте их посла!" # Extradite their ambassador!
 philippines.84.b: "Мы возьмем его силой!" # We will take it by force!
 philippines.85.t: "Гуам успешно оккупирован" # Guam Successfully Occupied
 philippines.85.d: "Донесения наших полевых командиров подтвердили, что наши морские пехотинцы успешно высадились и взяли под контроль остров Гуам. Части гарнизона были застигнуты врасплох нашим внезапным нападением и быстро усмирены нашими войсками; многие из них содержались в гражданских тюрьмах некоторых полицейских участков, которые были преобразованы нашими войсками в оперативные базы и гарнизонные базы." # Reports from our commanders in the field have confirmed that our marines have successfully landed and secured the island of Guam. Garrisoned units were suprised by our sudden attack and was quickly pacified by our troops; many of them were detained in civillian prisons of some police stations that were converted by our forces to be bases of operations and garison bases.
 philippines.85.a: "Отличный." # Excellent.
 philippines.86.t: "Провал операции на Гуаме" # Guam Operation Failure
 philippines.86.d: "Донесения наших полевых командиров подтвердили, что наши морские пехотинцы не смогли высадиться и были отброшены в море поднятыми по тревоге частями гарнизона в этом районе. Хотя мы эвакуировали большую часть людей после неудавшегося штурма; некоторые трупы наших подразделений не были обнаружены из-за разгоревшегося конфликта на пляжах." # Reports from our commanders in the field have confirmed that our marines have failed to do the landing and was thrown back to the seas by alerted garrisoned units in the area. While we have evaculated most of the men from the failed assault; some corpses of our units were not recovered due to the conflict erupted in the beaches.
 philippines.86.a: "О, нет." # Oh no.
 philippines.87.t: "Филиппины захватывают Гуам" # Philippines Seizes Guam
 philippines.87.d: "Ходили слухи о неподтвержденных сообщениях о том, что группа иностранных морских пехотинцев провела успешную оккупацию острова Гуам. Хотя сообщения о наших кротах в различных посольствах подтвердили, что именно [PHI.GetNameDef] проводили операции по оккупации острова Гуам. Есть также сообщения о том, что наши гарнизонные подразделения в этом районе содержатся в гражданских тюрьмах, которые были преобразованы в оперативные базы вторгшихся оккупантов." # There were rumours of unconfirmed reports that a group foreign marines have lead a successfull occupation of the island of Guam. Although reports of our moles in various embassies have confirmed that [PHI.GetNameDef] were the ones conducted the operations that occupied the island of Guam. There are also reports that our garrisoned units in the area are being held in civillian prisons that were converted to operation bases for the invading occupiers.
 philippines.87.a: "На войну!" # To War!
 philippines.87.b: "Назад..." # Back down...
 philippines.88.t: "Богатый урожай в этом году" # Bountiful Harvest this Year
 philippines.88.d: "Сегодня утром на стол президента поступили годовые отчеты Министерства сельского хозяйства и торговли, в которых подробно указано, что урожай, собранный различными фермерами по всей стране, соответствует и превосходит план департамента по продовольственной безопасности.\n\nЭто позволило нашей стране облегчить экспорт различных сельскохозяйственных продуктов, таких как рис, кукуруза и сахар, в такие страны, как США, Япония и Великобритания; которые, в свою очередь, обернулись огромной прибылью." # The annual reports of the Agriculture and Commerce Department have arrived on the President's desk this morning detailing that the harvest done by various farmers throughout the country have met and exceeded the department's plan for food security.\n\nThis have allowed our country to facilitate exports of various agricultural products such as rice, corn and sugar to countries such as the United States, Japan and the United Kingdom; which in turn have turned into great profits.
 philippines.88.a: "Пошли есть!" # Let's go eat!
 philippines.89.t: "Арендодатели сопротивляются земельной реформе" # Landlords Resists the Land Reform
 philippines.89.d: "Ранее сегодня в Офис президента поступила информация о текущем состоянии земельной реформы, проводимой в стране. Похоже, что некоторые землевладельцы, один из которых владеет одной из крупнейших плантаций сахарного тростника в стране, сопротивляются попыткам правительства провести земельную реформу.\n\nИх огромное богатство и влияние на некоторых чиновников в их районе позволяют им тормозить процесс реформ через суд; при этом некоторым из них намекнули на подкуп различных правительственных чиновников, таких как чиновники, участвующие в процессе земельной реформы, некоторые мэры городов и муниципальных образований, а иногда и различные конгрессмены и губернаторы провинций. Это побудило президента провести общенациональное расследование того, кто причастен к этому; и наказать виновных." # Earlier today, the Office of the President have received an information about the current status of the Land Reform being done in the country. It seems that some of the landowners, with one of them owning one of the biggest sugar cane plantations in the country, are resisting the efforts of the government to conduct land reform.\n\nTheir immersive wealth and influence over some of the officials in their area allows them to stall the reform process through court; with some of them being hinted of bribing various government officials such as officials involving the land reform process, some city and municipal mayors and sometimes various congressmen and provincial governors. This have prompted the President to conduct a nationwide investigation on who is involved; and punish those responsible.
 philippines.89.a: "Как они посмели?" # How dare they?
 philippines.90.t: "Суд над помещиками" # Trial of the Landlords
 philippines.90.d: "Сообщения о сопротивлении помещиков нашли свое завершение. Похоже, информация, полученная Президентом, соответствует действительности; существуют различные чиновники местных органов власти, которых подкупают, чтобы затормозить процесс земельной реформы, проводимой правительством.\n\nСледственная комиссия представила полный список богатых землевладельцев, чиновников местных органов власти, таких как мэры муниципалитетов и городов, а также некоторые члены Конгресса. Учитывая, что эти известные личности уже осуждены; Президент приказал армии произвести их арест." # The reports of landlords resisting have found its conclusion. It seems that the information received by the President is true; there are various local government officials that are being bribed in order to stall the process of the land reform being conducted by the government.\n\nThe investigative panel have submitted a full-list of wealthty landowners, local government officials, such as municipal and city mayors and some members of the Congress. With these high-profile personalities being convicted already; the President have ordered the Army to order their arrests.
 philippines.90.a: "Арестуйте этих стервятников!" # Arrest these vultures!
 philippines.91.t: "Социалистические симпатии в профсоюзах" # Socialist Symphaties in the Unions
 philippines.91.d: "[PHIGetIntelligenceText] сообщает, что по всей стране наблюдается рост популярности левых групп. В отчетах они заявили, что на это увеличение повлияло множество факторов; например, реакция правительства на крах лондонского фондового рынка и некоторые неэффективные меры правительства ранее. Однако они также пришли к выводу, что правительству не следует беспокоиться, поскольку число радикальных левых все еще довольно мало." # The [PHIGetIntelligenceText] have reported that there have been an increase of popularity of leftist groups throughout the country. In the reports they stated that there are multiple factors that they have affected in these increase; such as the government's response in the London Stock Market Crash and some ineffective government policies previously. However, they also concluded that the government should not be alarmed as the numbers of hardline leftists is still pretty low.
 philippines.91.a: "Они всего лишь меньшинство" # They are mere minority
 philippines.92.t: "Грегорио Аглипай умер" # Gregorio Aglipay Has Died
 philippines.92.d: "Аглипай родился в Батаке, Илокос Норте, был сиротой и вырос на табачных полях в последние нестабильные десятилетия испанской оккупации Филиппин. Он начал карьеру помощника священника в различных приходах главного северного острова Лусон.\n\nАглипай ранее был отлучен от церкви архиепископом Бернардино Норзаледа-и-Вилла Манильским в мае 1899 года, а после филиппинско-американской войны стал первым епископом Филиппинской независимой церкви, раскола Римско-католической церкви; независимым от Святого Престола. Сообщается, что он умер во сне в своем доме в Балаче во время отпуска. Его супруга объявила пятидневный траур по последователям аглипаянских верований и другим." # Born in Batac, Ilocos Norte, Aglipay was an orphan who grew up in the tobacco fields in the last volatile decades of the Spanish occupation of the Philippines. He began a career as an assistant priest in various parishes around the main northern island of Luzon.\n\nAglipay was previously excommunicated by Archbishop Bernardino Norzaleda y Villa of Manila in May 1899, and after the Philippine-American war became the became the first bishop of the Philippine Independent Church, a schism from the Roman Catholic Church; independent from the Holy See. He was reportedly died in his sleep in his home in Balac while taking a vacation. His spouse announced a five-day mourning for those who follow the Aglipayan beliefs and others.
 philippines.92.a: "Вы будете скучать" # You will be missed
 philippines.93.t: "Статус английского языка" # Status of the English Language
 philippines.93.d: "Английский язык был навязан нам американцами, когда они взяли под свой контроль наш архипелаг в 1902 году. Чтобы помочь им «просвещать» филиппинцев, они отправили группу учителей на борт военного корабля США «Томас»; которых с тех пор называли томаситами. Несколько десятилетий спустя многие филиппинцы, хотя и не могут бегло говорить по-английски, могут эффективно говорить и понимать его. Однако этот язык продолжает оставаться напоминанием об американцах и их империалистических действиях. Чтобы бороться с этим, группа конгрессменов и сенаторов предложила полностью исключить этот язык из школьных программ и использовать филиппинский язык в государственных делах. Хотя некоторые рассматривают умеренный подход, согласно которому Департамент образования скорректирует школьные программы, чтобы уделять больше внимания нашему языку, но при этом преподавать английский, но не так подробно. И, конечно, есть те, кто хочет сохранить статус-кво." # The English Language has been enforced to us by the Americans when they took control of our archipelago in 1902. To help them \"enlighten\" the Filipinos, they sent a group of teachers aboard USS Thomas; whom been called Thomasites ever since. A few decades later, many of the Filipinos, while can't speak fluent English, can speak and understand it effectively. However, the language has been continued to be a reminder of the Americans and their imperialistic acts. To combat this, a group of Congressmen and Senators have proposed that we should remove the language entirely from school curriculums and use Filipino in government transactions. While some are considering a moderate approach, that the Education Department tweak the school curriculums to focus heavily on our language but still teach English, but not as extensive. And of course, there are some who wants to preserve the status quo.
 philippines.93.a: "Удалить это" # Remove it
 philippines.93.b: "Сосредоточьтесь на нашем родном языке" # Focus on our own language
 philippines.93.c: "Будь как будет" # Let it be
 philippines.94.t: "Япония стремится к расширению дипломатических отношений" # Japan Seeks Increased Diplomatic Relations
 philippines.94.d: "Отношения между Филиппинами и Японией уже давно теплые, еще со времен доколонизации Филиппин. Некоторые японские подразделения даже вызвались сражаться на стороне филиппинцев в филиппино-американской войне; и теперь их посольство заявило, что Империя стремится к расширению дипломатических связей между нашими двумя странами. Новая администрация Малаканана во главе с президентом [PHI.GetLeader] дала японцам надежду на то, что будет установлена ​​новая независимая внешняя политика нации." # Filipino and Japanese relations have long been warm since the pre-colonization period of the Philippines. Some Japanese units even volunteered to fight with the Filipinos in the Filipino-American war; and now their embassy have stated that the Empire is seeking increased diplomatic ties between our two countries. The new administration in Malacanan headed by President [PHI.GetLeader], have allowed the Japanese to have a hope that a new independent foreign policy of the nation will be established.
 philippines.94.a: "Это мило с их стороны..." # That's nice of them...
 philippines.95.t: "США поддерживают нового президента" # United States Supports New President
 philippines.95.d: "Филиппино-американские отношения уже давно стали теплыми после освобождения Филиппин от испанского владычества. Хотя американцы аннексировали архипелаг после Парижского договора 1898 года; Соединенные Штаты в конечном итоге помогли Филиппинам в подготовке их собственной независимости. Министр иностранных дел США выразил свои самые искренние поздравления победителям выборов этого года и выразил надежду, что американо-филиппинское сотрудничество по различным вопросам продолжится." # Filipino and American relations have long been warm since the liberation of the Philippines from Spanish rule. Though the Americans have annexed the archipelago after the Treaty of Paris in 1898; the United States eventually helped the Philippines in preparing their own independence. The American Foreign Secretary have expressed his deepmost congratulations to the winners of this years elections, and hoped that American and Filipino collaboration on various matters will continue.
 philippines.95.a: "Это мило с их стороны..." # That's nice of them...
 philippines.96.t: "[From.GetName] предлагает Конфедерацию" # [From.GetName] Proposes a Confederation
 philippines.96.d: "[From.GetAdjective] обратились к нам с довольно интересным предложением: они хотят попытаться объединить нашу нацию вместе с народами Малайского полуострова и сформировать конфедерацию. Должны ли мы принять?" # The [From.GetAdjective]s have approached us for a rather interesting proposal, they want to attemp to unite our nation, together with the people in the Malay peninsula to form a confederation.Should we accept?
 philippines.96.a: "Вместе мы сила!" # Together we are strong!
 philippines.96.b: "Мы в порядке сами по себе" # We are fine by our own
 philippines.97.t: "[From.GetName] соглашается объединиться!" # [From.GetName] Accepts to Unite!
 philippines.97.d: "Правительство [From.GetAdjective] приняло наше предложение сформировать с ними конфедерацию." # The [From.GetAdjective] Government have accepted our proposal to form a confederation with them.
 philippines.97.a: "К объединению!" # To unification!
 philippines.98.t: "[From.GetName] Отказался объединяться!" # [From.GetName] Refused to Unite!
 philippines.98.d: "Правительство [From.GetAdjective] отклонило наше предложение сформировать с ними конфедерацию." # The [From.GetAdjective] Government have refused our proposal to form a confederation with them.
 philippines.98.a: "Отлично..." # Fine...
 philippines.98.b: "Мы сделаем это силой!" # We will do it by force!
 philippines.99.t: "Капитуляция Австралии" # The Capitualation of Australia
 philippines.99.d: "Силы [From.GetAdjective] уничтожили оборону [AST.GetAdjective] и успешно захватили основные ключевые районы [AST.GetName]. Правительство [AST.GetAdjective] бежало в [Root.Capital.GetCapitalVictoryPointName]. В кабинете министров есть некоторые, которые считают, что война уже проиграна из-за капитуляции Австралии, и хотят, чтобы правительство потребовало мира; однако все еще есть те, кто верит в мощь Королевской армии и флота и может позже переломить ход войны." # The forces of the [From.GetAdjective] have slaughted [AST.GetAdjective] defenses and have successfully captured major key areas in [AST.GetName]. The [AST.GetAdjective] Government have fleed to [Root.Capital.GetCapitalVictoryPointName]. There are some in the cabinet that the war is already lost due to the capitulation of Australia, and wanted that the government should sue for peace; however there are still some that believes in the might of the Royal Army and Navy and could turn the tide of the war later.
 philippines.99.a: "Подать иск о мире" # Sue for peace
 philippines.99.b: "Мы еще можем выиграть это!" # We can still win this!
 philippines.100.t: "[From.GetAdjective] просит мира" # The [From.GetAdjective] Sues for Peace
 philippines.100.d: "Поражение войск [AST.GetAdjective] и капитуляция [AST.GetName] вынудили [From.GetAdjective] просить мира и положить конец войне. Договор подписан, и теперь мы хозяева Океании!" # The defeat of the [AST.GetAdjective] troops and the capitulation of [AST.GetName] have forced the [From.GetAdjective] to sue for peace and end the war. The treaty have been signed and we are now the masters of Oceania!
 philippines.100.a: "Отличный." # Excellent.
 philippines.101.t: "Президент Кесон убит" # President Quezon Assassinated
 philippines.101.d: "Произошла катастрофа! Президент [Root.GetLeader] был убит одним из охранников Малаканского дворца, которые очень симпатизировали протестующим. Покойный президент был хладнокровно убит в своем офисе из табельного пистолета нападавшего.\n\nОднако стрелок был быстро задержан другими гвардейцами и полицией, дислоцированной в этом районе. После известия об убийстве президента Вооруженные силы захватили контроль над государственным аппаратом, поскольку существуют серьезные угрозы безопасности страны." # Disaster has struck! President [Root.GetLeader] have been assassinated by one of the guards in the Malacanan Palace whom are very symphathetic to the protesters. The late President was murdered in his office cold-blooded with the service pistol of the assailant.\n\nHowever the gunman was quickly apprehended by the other guardsmen and some police deployed in the area. With the news of the Presidents assassination, the Armed Forces have seized control of the apparatus of state, as the there are major threats in the security of the country.
 philippines.101.a: "Дошло до этого..." # It has come to this...
 philippines.102.t: "Покушение на президента" # Assassination Attempt on the President
 philippines.102.d: "Во время выступления на заводе по производству боеприпасов недалеко от Каламбы, Лагуна, одинокий боевик попытался застрелить президента [Root.GetLeader]. К счастью, ранения президента оказались не смертельными, и его сразу доставили в больницу. Убийца был задержан силами безопасности президента и местными подразделениями гарнизонной полиции. По результатам дальнейшего расследования убийца был членом радикальной Соялистской партии, которая добивается насильственной коллективизации, как и в Советском Союзе. Хотя президент был шокирован тем, что за этим могут стоять некоторые из его бывших товарищей, он быстро понял, что радикализация во фракции Соялиста становится все более опасной и ее необходимо остановить." # While delivering a speech in a munitions factory near Calamba, Laguna, a lone gunmen have tried to shoot President [Root.GetLeader]. Fortunately, the President wounds was not lethal and he was taken to the hospital immediately. The assassin, have been apprehended by the Presidential Security Force and local garrisoned police units, upon further investigation, the assassin was a member of the radical Partido Soyalista, which seeks forced collectivization, just like in the Soviet Union. While the President was shocked that some of his former comrades may be behind this, he quickly realized that radicalization in the Soyalista faction is being more and more dangerous and must be stopped.
 philippines.102.a: "Радикалы ничего хорошего не задумали..." # Those radicals are up to no good...
 philippines.103.t: "Папа ищет убежища в [Root.Capital.GetCapitalVictoryPointName]" # The Pope Seeks Refuge in [Root.Capital.GetCapitalVictoryPointName]
 philippines.103.d_ita: "Поскольку социалисты одержали победу на всеобщих выборах в Италии и реализовали несколько радикальных мер, направленных против церкви, папство в Риме решило покинуть город и вместо этого обосноваться в большей нации, дружественной христианству и католической церкви в целом.\n\nЛидеры папства, включая самого Папу, согласились поселиться в нашей стране, поскольку угрозы католицизму и церкви здесь минимальны. Сам президент приветствовал его святейшество по прибытии самолета в аэропорт; и хотя он явно утомился от путешествия из Европы в Азию, он подошел к взволнованной короне, ожидающей его прибытия в страну." # As the Socialists have emerged victorious in the Italian General Elections and have implemented a couple of radical policies that targets the church, the Papacy in Rome have decided to flee the city and instead settle on a more nation that are friendly towards Christianity and the Catholic Church in general.\n\nThe leaders of the Papacy, including the Pope himself have agreed to settle in to our country, as the threats against Catholicism and the Church here are minimal. The President himself have welcomed his holiness on his arrival of his plane at the airport; and though clearly tired from the travel from Europe to Asia, he approached the excited crown waiting for his arrival in the country.
 philippines.103.d_itp: "Поскольку немцы одержали победу в войне против [ITA.GetName], папство в Риме решило покинуть город и вместо этого поселиться в другой нации, дружественной христианству и католической церкви в целом.\n\nЛидеры папства, включая самого Папу, согласились поселиться в нашей стране, поскольку угрозы католицизму и церкви здесь минимальны. Сам президент приветствовал его святейшество по прибытии самолета в аэропорт; и хотя он явно утомился от путешествия из Европы в Азию, он подошел к взволнованной короне, ожидающей его прибытия в страну." # As the Germans have emerged victorious in the war against [ITA.GetName], the Papacy in Rome have decided to flee the city and instead settle on a more nation that are friendly towards Christianity and the Catholic Church in general.\n\nThe leaders of the Papacy, including the Pope himself have agreed to settle in to our country, as the threats against Catholicism and the Church here are minimal. The President himself have welcomed his holiness on his arrival of his plane at the airport; and though clearly tired from the travel from Europe to Asia, he approached the excited crown waiting for his arrival in the country.
 philippines.103.d: "Поскольку угрозы папству в Риме становятся все более частыми, папство в Риме решило покинуть город и вместо этого поселиться в более дружественной по отношению к христианству и католической церкви стране в целом.\n\nЛидеры папства, включая самого Папу, согласились поселиться в нашей стране, поскольку угрозы католицизму и церкви здесь минимальны. Сам президент приветствовал его святейшество по прибытии самолета в аэропорт; и хотя он явно утомился от путешествия из Европы в Азию, он подошел к взволнованной короне, ожидающей его прибытия в страну." # As the threats to the Papacy in Rome are becoming more and more frequent, the Papacy in Rome have decided to flee the city and instead settle on a more nation that are friendly towards Christianity and the Catholic Church in general.\n\nThe leaders of the Papacy, including the Pope himself have agreed to settle in to our country, as the threats against Catholicism and the Church here are minimal. The President himself have welcomed his holiness on his arrival of his plane at the airport; and though clearly tired from the travel from Europe to Asia, he approached the excited crown waiting for his arrival in the country.
 philippines.103.a: "Убедитесь, что Папа получил это «филиппинское гостеприимство»." # Make sure the Pope receives that \"Filipino Hospitality\"
 philippines.104.t: "Умер Папа Пий XII" # Pope Pius XII Dies
 philippines.104.d: "Весь христианский мир оплакивает смерть Его Святейшества Папы Пия XII, который умер во сне, в то время как состояние здоровья Отца ухудшалось в течение последних нескольких лет, что быстро ухудшилось после его эвакуации из Рима. Святейший Отец – первый, кто не будет похоронен вместе с остальными своими предшественниками в Гробнице Пап, а вместо этого будет похоронен в склепе Манильского собора. Поскольку Коллегия кардиналов завершила свои заседания здесь, в [Root.Capital.GetCapitalVictoryPointName], они выбрали епископа Альфредо Шустера, ныне Папу Юлия IV, который был бывшим архиепископом Милана до того, как его также эвакуировали сюда, в [Root.Capital.GetCapitalVictoryPointName]." # All Christendom mourns the death of His Holiness, Pope Pius XII, who died in his sleep while the Father, is in declining health for the past several years, something which rapidly worsened following his evacuation of Rome. The Holy Father is the first that will not be interred with the rest of his predecessors in the Tomb of the Popes, but instead be interred in the crypt of the Manila Cathedral. As the College of Cardinals have finished convening here in [Root.Capital.GetCapitalVictoryPointName], they have selected Bishop Alfredo Schuster, now Pope Julius IV, who is the former Archbishop of Milan before being also evacuated here in [Root.Capital.GetCapitalVictoryPointName].
 philippines.104.a: "Удачи, Ваше Святейшество..." # Good Luck, Your Holiness...
 philippines.105.t: "Растущее политическое влияние католической церкви" # Growing Political Catholic Church Influence
 philippines.105.d: "Со времен испанского колониального периода на Филиппинах католическая церковь имеет одну из многих влиятельных фигур или институтов, которые правят народом [Root.GetAdjective], к лучшему или к худшему, хотя ее влияние колеблется после революции и американского колониального периода, ее влияние на людей не уменьшилось.\nПрибытие католической церкви или, в частности, папства в страну, чтобы избежать репрессивных режимов, в настоящее время контролирующих Рим, может быть честью для нашей молодой республики быть выбранным Папой. поселение, но с приходом «человека Божьего на Землю» многие наши соотечественники все еще находятся под влиянием Церкви в своей повседневной жизни, даже правительство не может избежать влияния Церкви, поскольку многие священники опустили пальцы на дела нации. Хотя некоторые утверждают, что заботы духовенства могут сводиться к праву на свободу слова, многие из их начальников этого не делают, и если об этом не позаботиться немедленно, это может иметь очень плохие последствия для нашей молодой и светской республики." # Ever since the Spanish Colonial Period in the Philippines, the Catholic Church has one of the many influencial figures or institutions that reign over the [Root.GetAdjective] people, for better or for worse, while their influence wavering after the Revolution and the American Colonial Period, their influence over the people have not been diminished.\nThe arrival of the Catholic Church or specifically the Papacy in the country to escape the oppressive regimes currently controlling Rome might be an honor for our young Republic to be chosen as the Pope's settlement, but with the arrival of \"God's man on Earth\", many of our countrymen are still being influenced by the Church on their day to day lives, even the Government can't escape the influence of the Church as many priests have dipped their toes on the affairs of the nation. While some argue that the concerns of the clergy can fall down to the right of freedom of speech, many of their superiors do not, and if this is not taken care of immediately, can have very bad consequences on our young and secular republic.
 philippines.105.a: "Возможно, есть предел тому, что можно сказать..." # Maybe there's a limit on what can say...
 philippines.106.t: "Возвышение Папы Римского" # The Pope's Ascendancy
 philippines.106.d: "Поскольку власть папства превышает власть филиппинского правительства, многие ярые сторонники католической церкви сегодня выступили с требованием, чтобы Папа взял на себя руководство страной. Он уже принял роль, предложенную народом, и заявил, что то, что происходит сегодня, действительно является волей самого Бога. Сейчас правительство мало что может сделать, чтобы остановить его." # With the power of the Papacy exceeding that of the Philippine Government, many ardent supporters of the catholic church have today come out to demand the Pope take up leadership of the country. He has already accepted the role put forth by the people, and declared that what is happening today is indeed the will of God himself. There is not much the government can do to stop him now.
 philippines.106.a: "Бог этого хочет!" # God wills it!
 philippines.107.t: "Потенциальный переворот раскрыт" # Potential Coup Exposed
 philippines.107.d: "Напряженность в [Root.Capital.GetCapitalVictoryPointName] нарастает, поскольку происходят массовые аресты различных правительственных чиновников, военачальников и некоторых представителей духовенства. Выяснилось, что радикальная фракция внутри католической церкви вместе со своими сторонниками в правительстве и военных планируют свергнуть демократически избранное правительство [Root.GetLeader] и заменить его правительством, назначенным самим Папой. Католическая церковь и Малакананский дворец не прокомментировали это сообщение, но одно можно сказать наверняка: это действительно шокировало нацию и еще больше ее разделило..." # Tensions are mounting in [Root.Capital.GetCapitalVictoryPointName] as there are mass arrest of various government officials, military commanders and some members of the clergy. It has been found that a radical faction within the Catholic Church, together with their supporters in the government and military are planning to overthrow the democratically elected government of [Root.GetLeader] and replace it with the government appointed by the Pope himself. The Catholic Church and the Malacanan Palace has not released a comment regarding this relevation but one thing is for sure, this truly shocked the nation and divided it even more...
 philippines.107.a: "Я правильно это читаю?" # Am I reading this right?
 philippines.107.b: "Я правильно это читаю?" # Am I reading this right?
 philippines.108.t: "Проблема Тарука" # The Taruc Problem
 philippines.108.d: "Недавние выборы на Филиппинах привели к шокирующей победе Реформистской социалистической партии, ознаменовав резкий сдвиг в политическом ландшафте страны. Новое правительство, возглавляемое [Root.GetLeader], уже начало проводить политику, соответствующую социалистическим идеалам, что вызывает обеспокоенность в Вашингтоне по поводу будущего выравнивания Филиппин. Многие в правительстве США опасаются, что это может привести к более тесным связям с коммунистическими державами, такими как Советский Союз, что поставит под угрозу американское влияние в Тихоокеанском регионе. Вопрос теперь в том, должны ли Соединенные Штаты вмешаться, чтобы защитить свои интересы или уважать демократический процесс." # The recent elections in the Philippines have resulted in a shocking victory for the Reformist Socialist Party, marking a dramatic shift in the nation's political landscape. The new government, led by [Root.GetLeader], has already begun implementing policies that align with socialist ideals, raising concerns in Washington about the Philippines' future alignment. Many in the US government fear that this could lead to closer ties with communist powers such as the Soviet Union, threatening American influence in the Pacific. The question now is whether the United States should intervene to safeguard its interests or respect the democratic process.
 philippines.108.a: "Поддержите переворот, чтобы восстановить дружественное правительство." # Support a coup to restore a friendly government.
 philippines.108.b: "Уважайте демократический процесс и следите за ситуацией." # Respect the democratic process and monitor the situation.
 philippines.109.t: "Представитель Короны в Маниле" # The Crown's Representative in Manila
 philippines.109.d: "Поскольку мы усмирили радикальное филиппинское правительство и создали совместное правительство, лояльное нам и Короне. В нынешнем составе коллаборационистского правительства в Маниле существует бесчисленное множество предложений и возражений. Нынешняя структура в настоящее время похожа на старое филиппинское правительство, которое они унаследовали от американцев, - президентскую республику. Некоторые в правительстве предлагают, чтобы мы реорганизовали правительство в Маниле, как здесь, дома и в наших владениях, в парламентскую республику. Однако преобразование Филиппин в парламентскую республику может поначалу вызвать некоторые проблемы, но в долгосрочной перспективе может быть лучше, и если мы поставим у руля генерал-губернатора, мы сможем следить за правительством." # As we have pacified the radical Filipino Government and have established a collaborative government loyal to us and the Crown. There are countless of suggestions and oppositions in the current setup of the collaborative government in Manila. The current setup is currently like the old Filipino Government, which they inherited from the Americans, a presidential republic. Some within the government suggest that we reorganize the government in Manila like here at home and our dominions, a parliamentary republic. However, switching the Philippines into a parliamentary republic can cause some issues initially but can be better in the long run, and if we install a Governor-General at the helm, we can keep an eye onto the Government.
 philippines.109.a: "Назначьте члена королевской семьи генерал-губернатором." # Install a member of the Royal Family as the Governor-General
 philippines.109.b: "Оставь всё как есть" # Remain it as it is
 philippines.110.t: "Слухи об Асванге в Каписе" # Rumours of Aswang in Capiz
 philippines.110.d: "В ту зловещую ночь в отдаленном районе провинции Капис воздух был наполнен зловещей тишиной. Расположенная у подножия горы сельскохозяйственная земля всегда была убежищем, но теперь ее омрачил пугающий инцидент. В ответ на сигнал бедствия от напуганных жителей прибыла группа сторожей баррио и подразделений филиппинской полиции, их чувства обострились из-за срочности ситуации. Безжизненное тело беременной жены Антонио Дималанты, чрево которой лишилось драгоценного содержимого, намекало на ужасное присутствие асванга. Подозрение пало на одинокую пожилую женщину, но никакие конкретные доказательства не смогли подтвердить ее вину.\n\nСтрах, охвативший район, был ощутимым, что побудило мэра города и местную полицию принять срочные меры. Вооружившись ружьями, солью, бутылками со святой водой из собора и большим количеством чеснока, они разработали комплексную стратегию патрулирования, чтобы защитить весь отдаленный город. Их шаги эхом раздавались в ночи, смешиваясь с коллективным сердцебиением сообщества, объединившегося в стремлении разгадать зловещую правду. Среди тьмы они стояли готовыми, мерцающее пламя решимости освещало их путь, когда они противостояли угрожающим силам, скрывающимся в тенях." # On that ominous night in the remote barrio of Capiz province, the air was heavy with a foreboding silence. Nestled near the base of the mountain, the farmland had always been a sanctuary, but now it was marred by a chilling incident. Responding to the distress call from the terrified residents, a group of barrio's watchmen and Philippine Constabulary units arrived, their senses heightened by the urgency of the situation. The lifeless body of Antonio Dimalanta's pregnant wife, her womb emptied of its precious contents, hinted at the gruesome presence of an Aswang. Suspicion fell upon an elderly woman living alone, but no concrete evidence could confirm her guilt.\n\nThe fear that gripped the barrio was palpable, prompting the municipal mayor and local police to take swift action. Armed with guns, salt, bottles of holy water from the cathedral, and an abundance of garlic, they orchestrated a comprehensive patrol strategy to safeguard the entire remote town. Their footsteps resonated through the night, blending with the collective heartbeat of a community united in their quest to unravel the sinister truth. Amidst the darkness, they stood prepared, the flickering flames of determination illuminating their path as they confronted the menacing forces lurking in the shadows.
 philippines.110.a: "Но существует ли асванг на самом деле?" # Does an aswang really exist though?
 philippines.111.t: "США вмешивается" # The USA Intervenes
 philippines.111.d: "Из-за агрессивности [JAP.GetAdjective] по отношению к нашей нации; наш друг и союзник [USA.GetNameDef] решил поддержать нас, вмешавшись в войну между нами и [JAP.GetAdjective]; это обеспечит выживание нашей нации. [USA.GetAdjective] обратились к нам с просьбой официально оформить союз между нашими округами; эффективно координировать наши силы в этой войне." # Due to the aggressiveness of the [JAP.GetAdjective] towards our nation; our friend and ally, [USA.GetNameDef] have decided to support us by intervening in the war between us and the [JAP.GetAdjective]; this will ensure the survival of our nation. The [USA.GetAdjective] have approached us in formalizing our alliance between our counties; to effectively coordinate our forces on this war.
 philippines.111.a: "Подпишите договоры!" # Sign the treaties!
 philippines.112.t: "Генерал Макартур возвращается в США" # General MacArthur Returns to the US
 philippines.112.d: "Поскольку Филиппины становятся независимым государством, свободным от любого иностранного вмешательства в их суверенитет; некоторые офицеры, назначенные для обучения филиппинских скаутов, вернутся в Соединенные Штаты. Один из них - генерал Дуглас Макартур, нынешний начальник штаба филиппинских скаутов и полиции.\n\nГенерал Макартур, который считает Филиппины своим вторым домом, поклялся время от времени навещать их и намекает на то, что, возможно, поселится здесь, на Филиппинах, после ухода со службы в армии США." # As the Philippines becomes an independent nation, free from any foreign interference into its sovereignity; some officers appointed to train the Philippine Scouts will be returning to the United States. One of them is General Douglas MacArthur, the current Chief of Staff of the Philippine Scouts and Constabulary.\n\nGeneral MacArthur, whom considers the Philippines his second home, has vowed to visit from time to time, and hints of possibly settling here in the Philippines after retiring from the service in the US Army.
 philippines.112.a: "До свидания, генерал" # Goodbye, General
 philippines.113.t: "Генерал Макартур прибыл с Филиппин" # General MacArthur Arrives from the Philippines
 philippines.113.d: "Поскольку Филиппины становятся независимым государством, свободным от любого иностранного вмешательства в их суверенитет; некоторые офицеры, назначенные для обучения филиппинских скаутов, вернутся в Соединенные Штаты. Один из них — генерал Дуглас Макартур, нынешний начальник штаба филиппинских скаутов и полиции." # As the Philippines becomes an independent nation, free from any foreign interference into its sovereignity; some officers appointed to train the Philippine Scouts will be returning to the United States. One of them is General Douglas MacArthur, the current Chief of Staff of the Philippine Scouts and Constabulary.
 philippines.113.a: "С возвращением, генерал" # Welcome back, General
 philippines.114.t: "[From.GetName] просит поддержки" # [From.GetName] Asks for Support
 philippines.114.d: "Наш новый союзник [From.GetNameDef] связался с нами через дипломатического посланника. Это желание отменить репарации, которые они нам дают для дальнейшего укрепления своей экономики и обороны. Должны ли мы принять?" # Our new ally, [From.GetNameDef] has reached out to us with diplomatic envoy. This wish to abolish the reparations that they are giving us to further strengthen their economy and defense. Should we accept?
 philippines.114.a: "Мы согласны" # We agree
 philippines.114.b: "Эти репарации ценны, отклоните запрос!" # Those reparations are valuable, decline the request!
 philippines.115.t: "[From.GetName] Согласен" # [From.GetName] Agrees
 philippines.115.d: "Наш верный союзник [From.GetNameDef] согласился отменить наши репарации и прислал советников для помощи в нашей защите." # Our staunch ally, [From.GetNameDef] have agreed to abolish our reparations and sent advisors to help with our defense.
 philippines.115.a: "Замечательная разработка!" # A wonderful development!
 philippines.116.t: "[From.GetName] отказывается" # [From.GetName] Refuses
 philippines.116.d: "Наш союзник [From.GetNameDef] отказался помочь нам в это трудное время, возможно, нам придется пересмотреть этот союз." # Our ally, [From.GetNameDef] have refused to help us in this time of need, we may have to reconsider this alliance.
 philippines.116.a: "Тогда мы сами по себе." # We're on our own then.
 philippines.117.t: "Филиппины провозглашают независимость" # Philippines Declares Independence
 philippines.117.d: "Хотя до сих пор Филиппинский архипелаг находился под протекторатом [Root.GetNameDef], сегодня они провозгласили свою независимость и уничтожили всех советников [Root.GetAdjective] из своего правительства. Существуют опасения по поводу безопасности граждан [ROOT.GetAdjective], остающихся в Либерии, а также вопрос национальной гордости, поставленный на карту... но действительно ли это вообще стоит затрат на репрессии?" # While the Philippine archipelago has been a protectorate of [Root.GetNameDef] until now, today they declared their independence and have benished all [Root.GetAdjective] advisors from their government. There are concerns over the safety of [ROOT.GetAdjective] citizens remaining in Liberia, as well as a matter of national pride at stake... but is it truly even worth the cost of reprisal?
 philippines.117.a: "У нас нет другого выбора, кроме как оставить их в покое." # We have little choice but to let them be.
 philippines.117.b: "Они не смогут уйти так легко." # They cannot escape so easily.
 philippines.118.t: "США признают нашу независимость" # US Recognises Our Independence
 philippines.118.d: "После многих лет пребывания под протекторатом США наконец настал день, когда Филиппины признаны полностью независимой страной. На торжественной церемонии, состоявшейся в Маниле, был спущен американский флаг и поднят флаг Филиппин под аплодисменты тысяч филиппинцев. Президент [Root.GetLeader] выразил благодарность Соединенным Штатам за их руководство и поддержку, подчеркнув при этом важность этого исторического момента для филиппинского народа. Это событие знаменует собой начало новой главы в истории страны, поскольку Филиппины занимают свое законное место среди независимых стран мира." # After years of being a protectorate under the United States, the day has finally come when the Philippines is recognized as a fully independent nation. In a grand ceremony held in Manila, the American flag was lowered, and the Philippine flag was raised to the cheers of thousands of Filipinos. President [Root.GetLeader] expressed gratitude to the United States for their guidance and support while emphasizing the importance of this historic moment for the Filipino people. The event marks the beginning of a new chapter in the nation's history, as the Philippines takes its rightful place among the independent nations of the world.
 philippines.118.a: "Да здравствуют Филиппины!" # Mabuhay ang Pilipinas!
 philippines.119.t: "Угрозы из Вашингтона" # Threats from Washington
 philippines.119.d: "После нашего одностороннего провозглашения независимости напряженность в отношениях с Соединенными Штатами достигла точки кипения. Вашингтон выступил с суровыми предупреждениями, осудив наши действия как безрассудные и нелегитимные. Они требуют, чтобы мы пересмотрели свое решение и вернулись к статусу протектората, угрожая экономическими санкциями и возможными военными действиями, если мы откажемся. Президент [Root.GetLeader] теперь должен решить, как реагировать на эти угрозы, сохраняя при этом суверенитет, за достижение которого мы так упорно боролись." # Following our unilateral declaration of independence, tensions with the United States have reached a boiling point. Washington has issued stern warnings, condemning our actions as reckless and illegitimate. They demand that we reconsider our decision and return to the status of a protectorate, threatening economic sanctions and potential military action if we refuse. President [Root.GetLeader] must now decide how to respond to these threats while maintaining the sovereignty we have fought so hard to achieve.
 philippines.119.a: "Я же говорил тебе, что это плохая идея!" # I told you this was a bad idea!
 philippines.119.b: "Игнорируйте их угрозы" # Ignore their threats
 philippines.120.t: "Филиппинские складки" # The Philippines Folds
 philippines.120.d: "Хотя были некоторые разногласия, вызванные тем, что они считали «возвращением американского империализма», филиппинское правительство сочло разумным принять наше предложение о защите и восстановлении отношений." # While there was some controversy caused by what they saw as 'a return of American Imperialism', the Filipino government has seen the wisdom in accepting our proposal of protection and restored relations.
 philippines.120.a: "Большой!" # Great!
 philippines.121.t: "Филиппины игнорируют наши угрозы!" # Philippines Ignores our Threats!
 philippines.121.d: "Несмотря на наши строгие предупреждения и четкие требования, правительство Филиппин предпочло проигнорировать наши угрозы и продолжить одностороннее провозглашение независимости. Это вопиющее пренебрежение авторитетом Америки и международными нормами вызвало шок в Вашингтоне. Многие в Конгрессе призывают к решительным действиям по восстановлению нашего влияния в регионе, в то время как другие призывают к осторожности, чтобы избежать дальнейшей эскалации напряженности. Вопрос теперь в том, оставим ли мы это неповиновение без ответа или предпримем шаги, чтобы напомнить Филиппинам о последствиях их действий." # Despite our stern warnings and clear demands, the Philippine government has chosen to ignore our threats and proceed with their unilateral declaration of independence. This blatant disregard for American authority and international norms has sent shockwaves through Washington. Many in Congress are calling for decisive action to reassert our influence in the region, while others urge caution to avoid escalating tensions further. The question now is whether we will let this defiance go unanswered or take steps to remind the Philippines of the consequences of their actions.
 philippines.121.a: "Заставь их заплатить" # Make them pay
 philippines.121.b: "Предложите им компромисс" # Offer them a compromise
 philippines.121.c: "Мы не можем позволить себе войну, отступи" # We can't afford a war, back down
 philippines.122.t: "США предлагают компромисс" # USA Proposes a Compromise
 philippines.122.d: "После того как Филиппины проигнорировали суровые предупреждения Вашингтона и провозгласили независимость, Соединенные Штаты решили применить другой подход. Посол США в Маниле предложил союз между двумя странами, предложив официально признать независимость Филиппин в обмен на пакт о взаимной обороне и экономическое сотрудничество. Этот компромисс мог бы обеспечить суверенитет Филиппин при сохранении прочных связей с Соединенными Штатами, но он также может сопровождаться определенными условиями." # After the Philippines ignored Washington's stern warnings and declared independence, the United States has decided to take a different approach. The US Ambassador in Manila has proposed an alliance between the two nations, offering to formally recognize Philippine independence in exchange for a mutual defense pact and economic cooperation. This compromise could ensure the Philippines' sovereignty while maintaining strong ties with the United States, but it may also come with strings attached.
 philippines.122.a: "Примите их предложение." # Accept their proposal.
 philippines.122.b: "Это возврат к колониализму, нам это не интересно" # This is a return to colonialism, we're not interested
 philippines.123.t: "Филиппины отказываются идти на компромисс" # Philippines Refuses to Compromise
 philippines.123.d: "Правительство Филиппин категорически отвергло предложенный нами компромисс, назвав его завуалированной попыткой восстановить контроль над своей страной. Этот отказ вызвал шок в Вашингтоне, и многие восприняли его как прямой вызов американскому влиянию в Тихоокеанском регионе. В то время как некоторые в Конгрессе призывают к немедленным карательным мерам, другие призывают к осторожности, чтобы избежать дальнейшей эскалации напряженности. Неповиновение Филиппин ставит нас перед трудным решением: принять ответные меры или оставить это оскорбление без внимания." # The Filipino government has outright rejected our proposed compromise, labeling it as a veiled attempt to reassert control over their nation. This refusal has sent shockwaves through Washington, with many viewing it as a direct challenge to American influence in the Pacific. While some in Congress are calling for immediate punitive measures, others urge caution to avoid further escalating tensions. The Philippines' defiance leaves us with a difficult decision: to retaliate or to let this insult pass.
 philippines.123.a: "Мы должны заставить их заплатить" # We must make them pay
 philippines.123.b: "Оставьте их. Они не выживут сами по себе" # Leave them. They won't survive on their own
 philippines.124.t: "Переворот на Филиппинах" # The Coup in the Philippines
 philippines.124.d: "Напряженность на Филиппинах достигла точки кипения, поскольку военные, поддержанные иностранными интересами, начали переворот против социалистического правительства. Рано утром солдаты, верные заговорщикам, штурмовали ключевые правительственные здания в [Root.Capital.GetCapitalVictoryPointName], пытаясь захватить контроль над страной. Исход этого переворота остается неопределенным, поскольку лоялистские силы и народ объединяются, чтобы защитить демократически избранное правительство. Мир внимательно наблюдает за тем, как судьба Филиппин висит на волоске." # Tensions have reached a boiling point in the Philippines as elements of the military, backed by foreign interests, have launched a coup against the socialist government. In the early hours of the morning, soldiers loyal to the coup plotters stormed key government buildings in [Root.Capital.GetCapitalVictoryPointName], attempting to seize control of the nation. The outcome of this coup remains uncertain, as loyalist forces and the people rally to defend the democratically elected government. The world watches closely as the fate of the Philippines hangs in the balance.
 philippines.124.a: "Переворот удался! Создается новое правительство." # The coup succeeds! A new government is established.
 philippines.124.b: "Переворот провалился! Правительство остается у власти." # The coup fails! The government remains in power.
 philippines.125.t: "Выборы 1953 года" # Elections of 1953
 philippines.125.d: "Самые ожидаемые выборы за долгое время, [GetYear] президентские выборы на Филиппинах, заставляют каждого филиппинца напрягаться. Националисты, либералы и демократы боролись за место в Малаканском дворце. Кто будет править страной следующие четыре года?" # The most anticipated elections in a long time, the [GetYear] Philippine Presidential Elections have every Filipino on the edge of his or her seat. The Nacionalistas, the Liberals, and the Democratas have been racing for a seat in the Malacanan Palace. Who would rule the country for the next four years?
 philippines.125.a: "молодой сенатор Фердинанд Э. Маркос!" # the young Senator, Ferdinand E. Marcos!
 philippines.125.b: "человек из народа, Бог Милосердия!" # the man of the people, Diosdado Macapagal!
 philippines.125.c: "политик защищает, Кларо М. Ректо!" # the political protege, Claro M. Recto!
 philippines.126.t: "Крах лоялистского правительства Манилы" # Manila Loyalist Government Collapse
 philippines.126.d: "Ситуация на Филиппинах приняла для японской администрации ужасный оборот. После решительной кампании сил сопротивления и растущих волнений по всему архипелагу коллаборационистское правительство в Маниле было вынуждено сдаться. Ключевые чиновники и лояльные сторонники покинули город под защитой Японии, ища убежища в Токио. Крах нашей администрации в Маниле знаменует собой значительный удар по японскому влиянию в регионе, а потеря Филиппин будет иметь далеко идущие последствия для нашего стратегического положения в Юго-Восточной Азии. Поскольку правительство в изгнании перегруппировывается в Токио, будущее японских интересов на островах остается неопределенным." # The situation in the Philippines has taken a dire turn for the Japanese administration. After a determined campaign by resistance forces and mounting unrest across the archipelago, the collaborationist government in Manila has been forced to surrender. Key officials and loyal supporters have evacuated the city under Japanese protection, seeking refuge in Tokyo. The collapse of our administration in Manila marks a significant setback for Japanese influence in the region, and the loss of the Philippines will have far-reaching consequences for our strategic position in Southeast Asia. As the exiled government regroups in Tokyo, the future of Japanese interests in the islands remains uncertain.
 philippines.126.a: "Горькое поражение." # A bitter defeat.

