 PHI_ktp_party_long: "Исполнительная комиссия Филиппин\n§gИсполнительная комиссия Филиппин§!" # Komisyong Tagapagpaganap ng Pilipinas\n§gPhilippine Executive Commission§!
 PHI_new_liberal_party: "Либеральный" # Liberal
 PHI_new_liberal_party_long: "Либеральная партия\n§gЛиберальная партия§!\n§LЛиберальная партия, основанная президентом Сената Мануэлем Роксасом, временным председателем Сената Эльпидио Кирино и бывшим сенатором от 9-го сенатского округа Хосе Авелино из отколовшегося либерального крыла старой Националистической партии, Либеральная партия остается второй старейшей активной политической партией на Филиппинах после Националистов. старейшая постоянно действующая партия. Либеральная партия остается влиятельной организацией в современной филиппинской политике. Левоцентристская партия по социальным вопросам и центристская по экономическим вопросам, она обычно ассоциируется с послереволюционным либерально-демократическим статус-кво Филиппин в отличие от авторитаризма, неоконсерватизма и популизма.§!\n" # Partido Liberal\n§gLiberal Party§!\n§LFounded by Senate President Manuel Roxas, Senate President Pro-Tempore Elpidio Quirino, and former 9th Senatorial District Senator José Avelino from the breakaway liberal wing of the old Nacionalista Party, the Liberal Party remains the second-oldest active political party in the Philippines after the Nacionalistas, and the oldest continually-active party. The Liberal Party remains an influential organization in contemporary Philippine politics. A center-left party on social issues and centrist on economic issues, it is commonly associated with the post-revolution, liberal-democratic status quo of the Philippines in contrast to authoritarianism, neoconservatism, and populism.§!\n
