 irq.11.t: "Королевство Машрики вырывается на свободу!" # The Mashriqi Kingdom breaks free!
 irq.11.d: "Со времен Великой войны Королевство Машрики находилось под нашим влиянием. Но после того, как мы пострадали от краха лондонской фондовой биржи, негодяи в парламенте Машрики проголосовали за прекращение нашего протектората над ними и без всякого уважения выгнали нашего Верховного комиссара." # Ever since the Great War, the Mashriqi Kingdom was firmly under our influence. But after we were struck by the London Stock Market Crash, the scoundrels in the Mashriqi parliament have voted to terminate our protectorate over them, and have kicked out our High Commissioner without any respect.
 irq.11.a: "Они могут это сделать?" # They can do this?

 IRQ_divided_nation: "Разделенная нация" # Divided Nation
 IRQ_divided_nation_desc: "Машрик — это обширный регион, в котором проживает множество племен, этнических групп и религий. Управлять ими и пытаться объединить их в рамках панарабизма было сложно, и они не разделяют такого же энтузиазма, как сирийцы, в противостоянии финикийцам. В результате наша нация глубоко страдает." # The Mashriq is a vast region, containing many tribes, ethnicities and religions within it. Ruling over them and trying to unite them under Pan-Arabism has been difficult, and they don't share the same enthusiasm as the Syrians in opposing the Phoenicians. Our nation suffers deeply as a result.

 IRQ_hashmite_dynasty: "Хасмитская династия" # The Hasmite Dynasty
 IRQ_hashmite_dynasty_desc: "Династия Хашимитов правила в Мекке более тысячи лет и теперь правит нашей страной, одним из многочисленных государств, которыми они управляли, таких как халифаты Омьядов и Аббасидов, королевства Идрисид и шарифаты Хиджази. Хашимиты являются живым воплощением арабизма и арабской истории." # The Hashemite Dynasty has ruled over a Thosand years in Mecca and now rules our country, one of the numerous states that they had ruled over, like the Ummyad and Abbasid Caliphates, the Idrised Kingdoms and the Hejazi Sharifates, the Hashemites are the living embodiment of Arabism and Arab History.
 IRQ_semi_democratic_state: "Полудемократическое государство" # Semi-Democratic State
 IRQ_semi_democratic_state_desc: "Есть парламент, есть выборы и есть все виды свобод, но король по-прежнему является тем, кто назначает премьер-министров и советников и распускает парламент, даже если он редко использовал свои полномочия, они все равно есть у короля." # There is a Parliament, There is Elections and there is all kinds of freedoms but the King is still the one who appoints prime ministers and sentors and disband parliament, even if he rarely used his powers, the King still have it.
 IRQ_british_protection: "Британская защита" # British Protection
 IRQ_british_protection_desc: "Как и большинство мест на этой планете, Машрик до сих пор находится под гнусной британской «защитой». Это право, которое Британия дает себе, чтобы эксплуатировать и добывать ресурсы страны и строить базы ради их величеств, монархов Англии." # Like most places on this planet, the Mashriq is still under vile British "protection". That's the right that Britain gives it self to exploit and extract the nations resources and build bases for the sake of their majesties, the Monarchs of England.
 IRQ_nationalist_unrest: "Националистические беспорядки" # Nationalist Unrest
 IRQ_nationalist_unrest_desc: "Машрик — оккупированное государство, даже с любимым национальным лидером, демократическими выборами и проектами развития, но люди по-прежнему хотят его устранения, даже если это только на бумаге." # The Mashriq is an occupied state even with a loved national figurehead, democratic elections and development projects, the people still want it gone even if it's only on paper
 IRQ_coalition_fraternal_communique: "Коалиционное «Братское» коммюнике" # The Coalition "Fraternal" Communiqué
 IRQ_coalition_fraternal_communique_desc: "На последних парламентских выборах, состоявшихся в августе 1935 года, Социал-демократическая партия, Национально-демократическая партия и Социал-консервативная партия национального братства объединились, чтобы сформировать правительство большинства во главе с социал-демократом Камелем Аль-Чадерчи." # In the last parliamentary elections held in August of 1935, the Social Democrat, National Democratic Party and Social Conservative National Brotherhood Party allied to form a majority government led by social democrat Kamel Al Chaderchi

