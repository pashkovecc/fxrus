#####Events#####
 bel.1.t: "Бельгия после Великой войны" # Belgium after the Great War
 bel.1.d: "В 1914 году Германия вторглась в Бельгию, проигнорировав ее нейтралитет и втянув в войну Великобританию на стороне Антанты. Бельгийские войска были быстро разбиты, но смогли закрепиться за рекой Изер. В оккупированной Бельгии немцы проводили Flamenpolitik — политику, направленную против фламандских националистов и, по сути, уступающую их требованиям. В свободной Бельгии король Альберт повел свои войска за линию фронта. После окончания войны это придало ему популярность. По Версальскому договору 1920 года бельгийские дипломаты смогли обеспечить территориальные претензии Нидерландов на Зеувс-Флаандерен и голландский Лимбург. В результате отношения с Нидерландами с тех пор никогда не были прежними. \n\nВ Лоппемском пакте 1919 года король сидел вместе с бельгийскими политиками, оставшимися в оккупированной Бельгии, и обсуждал возможность всеобщего избирательного права для всех мужчин старше 21 года. На следующих выборах было введено всеобщее избирательное право, что фактически превратило страну в массовую демократию. В результате нескольким политическим партиям пришлось реформировать свою программу, чтобы привлечь больше избирателей. Были также созданы новые партии, борющиеся за фламандское дело, и даже внутри традиционных партий это дело было принято. В начале 1930-х годов это привело к принятию нескольких лингвистических законов, которые сделали Фландрию одноязычным голландским правительством. \n\nОднако в последние годы появилось несколько крайне правых и крайне левых партий из-за растущего презрения к нынешней политической системе." # In 1914, Germany invaded Belgium, disregarding its neutrality and pulling the United Kingdom in the war on the side of the Entente. Belgian troops were quickly overrun, but were able to entrench behind the Yser river. In occupied Belgium, the Germans pursued the Flamenpolitik, a policy directed towards the Flemish nationalists and essentially giving in to their demands. In free Belgium, King Albert led his troops behind the frontline. After the war ended this gave him a popularity boost. In the 1920 Treaty of Versailles, Belgian diplomats were able to secure territorial claims on Zeeuws-Vlaanderen and Dutch Limburg from the Netherlands. As a result, relations with the Netherlands have never been the same since. \n\nIn the 1919 Pact of Loppem, the King sat together with the Belgian politicians who stayed behind in occupied Belgium and discussed the possibility of universal suffrage for all men above the age of 21. In the next elections, universal suffrage was enacted, effectivily turning the country into a mass democracy. As an effect, several political parties had to reform their programme to attract more voters. New parties fighting for the Flemish cause were also founded and even within the traditional parties the cause was adopted. In the early 1930s this lead to the enactment of several linguistic laws which made Flanders monolingual Dutch in the administration. \n\nHowever in recent years, several far-right and far-left parties have emerged because of a growing disdain for the current political system.
 bel.1.a: "Бельгийский Лев силён!" # The Belgian Lion stands strong!
 bel.2.t: "Король Альберт погиб в результате несчастного случая" # King Albert dies in an accident
 bel.2.d: "18 февраля в 2 часа ночи тело короля Альберта было найдено у подножия скалы в Марке-ле-Дам (Намюр). Предполагается, что король разбился насмерть в результате несчастного случая при восхождении. Однако король был известен как опытный альпинист, и многие задаются вопросом, была ли его смерть вообще несчастным случаем. Его 35-летний сын Леопольд теперь пойдет по стопам отца и станет королем Бельгии." # At 2 a.m. on the 18th of February, the body of King Albert was found at the base of a cliff in Marche-Les-Dames (Namur). It is presumed the King fell to his death after a climbing accident. However, the King was known to be a skilled mountaineer and many wonder if his death was an accident at all. His 35 year old son, Leopold, will now follow in his father's footsteps as King of Belgium.
 bel.2.a: "Да здравствует король Леопольд III!" # Long live King Leopold III!
 bel.3.t: "Королева Астрид погибла в результате подозрительного несчастного случая" # Queen Astrid dies in suspicious accident
 bel.3.d: "Со смертью короля Альберта всего месяц назад Бельгию и королевскую семью снова постигла катастрофа. Леопольд III и его жена Астрид ранее в этот день попали в автокатастрофу в Арденнах. Леопольд выжил в аварии, но его жена умерла у него на руках. Полицейские, прибывшие на место происшествия, обнаружили некоторые элементы, свидетельствующие о том, что причиной крушения может быть диверсия. Леопольд III в ярости и полон решимости найти виновника, чего бы это ни стоило." # With the death of King Albert only one month ago, Belgium and the royal family have been struck by disaster again. Leopold III and his wife Astrid were involved in a car crash in the Ardennes earlier this day. Leopold survived the accident, but his wife died in his arms. Police officers rushed to the scene and discovered some elements that sabotage may be the cause of the crash. Leopold III is furious and is determined to find the culprit, whatever the cost may be.
 bel.3.a: "Начать расследование дела." # Start an investigation into the case.
 bel.4.t: "Принять Кригсвет, чтобы помочь расследованию?" # Enact Krijgswet to help the investigation?
 bel.4.d: "Если парламент примет Кригсвет, расследование смерти королевы Астрид возьмут на себя военные. Это повысит шансы поймать преступника, но будет означать, что он, вероятно, не получит справедливого суда." # If parliament were to enact the Krijgswet, the military would take over the investigation into the death of Queen Astrid. This would improve the chances of catching the culprit, but it would mean that he would probably not get a fair trial.
 bel.4.a: "Крийгсвет проходит в парламенте, сделайте все, чтобы поймать убийцу." # The Krijgswet passes in parliament, do everything to catch the killer.
 bel.4.b: "Законопроект провалился, справедливое судебное разбирательство слишком важно." # The bill fails, a fair trial is too important.
 bel.5.t: "Убийца пойман" # The killer is caught
 bel.5.d: "С принятием Кригсвета военные быстро взяли на себя дело королевы Астрид. Используя все свои ресурсы, они смогли найти виновника. После двухдневной охоты они поймали мужчину средних лет незадолго до того, как он смог пересечь границу с Люксембургом. Мужчина был связан с местной коммунистической ячейкой. Теперь он, вероятно, исчезнет где-нибудь в темной тюремной камере." # With the enactment of the Krijgswet, the military quickly took over the case of Queen Astrid. Using all their resources, they were able to find the culprit. After a two day long manhunt, they caught a middle-aged man just before he could cross into Luxembourg. The man had ties to a local communist cell. He will now probably dissapear somewhere in a dark jail cell.
 bel.5.a: "Эти проклятые анархисты!" # Those damn anarchists!
 bel.6.t: "Расследование зашло в тупик" # Investigation hits dead end
 bel.6.d: "Расследование подозрительной смерти королевы Астрид зашло в тупик. Король Леопольд III расстроен тем, что Кригсвет не прошел. Если бы это было так, убийца наверняка был бы пойман. Напряженность между Леопольдом III и правительством сейчас растет. По всей стране все больше и больше людей выражают свою симпатию королю." # The investigation into the suspicious death of Queen Astrid has hit a dead end. King Leopold III is frustrated because the Krijgswet didn't pass. If it did, surely the killer would have been caught. Tensions between Leopold III and the government are now rising. Throughout the country, more and more people are expressing their sympathy for the King.
 bel.6.a: "В стране объявлен траур." # The nation enters a state of mourning.
 bel.7.t: "Результаты выборов готовы" # Election results are in
 bel.7.d: "Только что стали известны результаты последних выборов. Королю Леопольду III теперь предстоит сформировать правительство большинства на основе нового состава парламента. Следующее правительство определит будущее страны на следующие четыре года, поэтому выбор короля имеет первостепенное значение." # The results of the latest elections just came in. King Leopold III now has to form a majority government based on the new composition of parliament. The next government will determine the future of the country for the next four years, so the King's choice is of the outmost importance.
 bel.7.a: "Король отказывается формировать правительство!" # The King refuses to form a government!
 bel.7.b: "Король начинает переговоры" # The King starts negotiations
 bel.8.t: "Беспорядки в Валлонии!" # Unrest in Wallonia!
 bel.8.d: "Решение короля не формировать правительство, вызванное его разочарованием в связи со смертью жены, стало основной причиной волнений в Валлонии. Люди бастуют, а в некоторых местах даже нападают на полицию. Дошло до того, что гражданская война стала вполне реальной возможностью. Сообщения о том, что коммунистические ячейки берут в руки оружие, уже поступают, и армия находится в состоянии повышенной боевой готовности." # The King's decision to not form a government, rooted in his frustration with the case of his wife's death, has become a major reason for unrest in Wallonia. People are going on strike and in some places they are even attacking police forces. It has come to the point where civil war is a very real possibility. Reports of communist cells taking up arms are already coming in and the army is on high alert.
 bel.8.a: "Подавите их мелкий бунт!" # Crush their petty rebellion!
 bel.8.b: "Да здравствует революция (Играйте за коммунистов)" # Vive la Révolution (Play as communists)
 bel.8.c: "Парламент свергает Леопольда III и провозглашает республику до начала войны." # Parliament deposes Leopold III and declares the Republic before war breaks out.
 bel.9.t: "Какая коалиция должна возглавить правительство?" # Which coalition should lead the government?
 bel.9.d: "Результаты последних выборов были неоднозначными, три традиционные партии потеряли некоторую популярность, а крайне левые и правые партии находятся на подъеме. В результате переговоры о формировании коалиции заняли гораздо больше времени, чем ожидалось, но наконец подошли к концу. Новый премьер-министр вскоре выступит в парламенте и объявит новое правительство." # The results of the latest elections were ambiguous, the three traditional parties have lost some popularity and extreme-left and -right parties are on the rise. As a result, the negotiations to form a coalition have taken much longer than expected, but have finally come to an end. A new Prime Minister will soon take the stand in Parliament and declare the new government.
 bel.9.a: "Правительство возглавит коалиция католиков и социал-демократов." # A coalition of Catholics and Social Democrats will lead the government
 bel.9.b: "Правительство возглавит коалиция католиков, рыночных либералов и социал-либералов." # A coalition of Catholics, Market Liberals and Social Liberals will lead the government
 bel.9.c: "Другие коалиции потерпели неудачу, и крайне правые возглавят правительство меньшинства" # Other coalitions have failed and the far-right will lead a minority government
 bel.10.t: "Кто станет премьер-министром?" # Who will become Prime Minister?
 bel.10.d: "В новом правительстве католиков-социал-демократов кто-то должен взять на себя роль премьер-министра. Вопрос лишь в том, должен ли страной руководить член КП/ПК или член БВП/ПОБ." # In the new Catholic-Social Democrat government, someone should take the role of Prime Minister. The only question is whether a member of the KP/PC or from the BWP/POB should lead the country.
 bel.10.a: "Социал-демократ должен быть премьер-министром" # A Social Democrat should be PM
 bel.10.b: "Католик должен быть премьер-министром" # A Catholic should be PM
 bel.11.t: "Кто станет премьер-министром?" # Who will become Prime Minister?
 bel.11.d: "В новом католически-рыночно-либерально-социал-либеральном правительстве кто-то должен взять на себя роль премьер-министра. Католики уже поддержали либерала, вопрос лишь в том, должен ли это быть рыночный либерал от ЛП/ЛП или социальный либерал от ПП." # In the new Catholic-Market Liberal-Social Liberal government, someone should take the role of Prime Minister. The Catholics already gave their support for a liberal, the only question is whether it should be a market liberal from the LP/PL or a social liberal from the PP.
 bel.11.a: "Рыночный либерал должен быть премьер-министром" # A Market Liberal should be PM
 bel.11.b: "Социал-либерал должен быть премьер-министром" # A Social Liberal should be PM
 bel.12.t: "Кто станет премьер-министром?" # Who will become Prime Minister?
 bel.12.d: "Учитывая, что после недавних выборов к власти пришли крайне правые, удивительно, что им вообще удалось сформировать коалицию, поскольку сейчас они обсуждают, кто должен стать премьер-министром." # With the far-right taking over government after the recent elections, it is a surprise they were even able to form a coalition, as they are now discussing who should be Prime Minister.
 bel.12.a: "Стаф де Клерк (VNV) должен стать премьер-министром" # Staf de Clercq (VNV) should be PM
 bel.12.b: "Йорис ван Северен («Вердинасо») должен стать премьер-министром" # Joris van Severen (Verdinaso) should be PM
 bel.12.c: "Леон Дегрель (ПБ) должен стать премьер-министром" # Léon Degrelle (PB) should be PM
 bel.13.t: "Король Леопольд вызывает премьер-министра для объяснений" # King Leopold summons the Prime Minister for an explanation
 bel.13.d: "После того, как расследование смерти его жены зашло в тупик, король требует объяснений от премьер-министра Пола ван Зеланда. Основная жалоба Леопольда - это провал Крийгсвета в парламенте, поскольку он уже разрешил бы загадку, если бы дело взяли на себя военные. Однако Пол ван Зеланд отказывается давать какие-либо объяснения, поскольку информация о смерти королевы Астрид является конфиденциальной." # After the investigation into his wife's death hit a dead end, the King wants an explanation from Prime Minister Paul van Zeeland. Leopold's main complaint is the failing of the Krijgswet in Parliament, as it would have solved the mystery already, if the military had taken over the case. However, Paul van Zeeland refuses to give any explanations, as the information about Queen Astrid's death is confidential.
 bel.13.a: "Кем он себя считает?" # Who does he think he is?
 bel.14.t: "Валкистский манифест" # A Valkist Manifesto
 bel.14.d: "Недавно опубликованная статья Леона Дегреля в последнее время вызвала некоторые споры. В статье Дегрелль описывает Бельгию как точку пересечения германской и романской культур в том, что он называет Pax Belgica, мирным сосуществованием обеих культур. Он утверждает, что именно Pax Belgica несколько раз в истории делал регион таким успешным. Он использует пример великой Империи Карла Великого и Бургундского герцогства, могущественных держав Средневековья. \n\nЗатем Леон Дегрель рассказал о своих планах участвовать в предстоящих выборах вместе со своей новой партией, Бургиньонской партией. Его программа состоит из того, что лучше всего можно назвать валькизмом. Он заявляет о своем сильном отвращении к монархии, поскольку на протяжении веков она была инструментом, используемым иностранными державами и католической церковью для подавления германского и романского населения Бельгии. Дегрелль далее описывает прогрессивную политику, которую он будет стремиться реализовать, если его партия будет избрана на пост президента." # A recently published article by Léon Degrelle has caused some controversy lately. In the article, Degrelle describes Belgium as a crosspoint between Germanic and Romance culture in what he calls the Pax Belgica, the peaceful coexistance of both cultures. He argues that this Pax Belgica is what made the region so successful on several occasions in history. He uses the example of the great Empire of Charlemagne and the Duchy of Burgundy, both powerful nations of the Middle-Ages. \n\nLéon Degrelle then went on in describing his plans to participate in the coming elections with his new party, the Parti Bourguignon. His programme consists of what best can be described as Valkism. He declares his strong aversion towards the monarchy, as for centuries it was a tool used by foreign powers and the Catholic Church to surpress the Germanic and Romance people of Belgium. Degrelle further describes progressive policies he will strive to implement if his party gets elected into office.
 bel.14.a: "Подобные идеи можно только поощрять." # Ideas like this can only be encouraged
 bel.14.b: "Запретить дальнейшее распространение статьи" # Ban the article from being distributed further
 bel.15.t: "Ультиматум Бельгии" # Ultimatum from Belgium
 bel.15.d: "Бельгия направила нам ультиматум с требованием присоединения Люксембурга к Бельгии. Люксембург участвовал в Бельгийской революции 1830 года и был частью страны до заключения Лондонского договора 1839 года, когда он стал независимым Великим Герцогством. В последующие годы Бельгия считала Люксембург потерянной территорией. После Великой войны Бельгия попыталась пересмотреть статус Договора 1839 года, включая статус Люксембурга. Однако из-за того, что Бельгия получила территорию Голландии, Люксембург остался в покое. После того, как в Бельгии к власти пришли валкисты, раздались новые голоса, говорящие об аннексии Люксембурга." # Belgium has sent us an ultimatum demanding the annexation of Luxembourg into Belgium. Luxembourg participated in the Belgian Revolution of 1830 and was part of the country until the Treaty of London in 1839, when it became an independent Grand Duchy. In the following years, Belgium considered Luxembourg as a lost territory. After the Great War, Belgium has tried to renegotiate the status of the 1839 Treaty, including the status of Luxembourg. However, due to Belgium receiving Dutch territory, Luxembourg was left alone. After the valkist took over in Belgium, new voices which speak of annexation of Luxembourg have risen.
 bel.15.a: "Присоединяйтесь к нашим бельгийским братьям" # Join our Belgian brethren
 bel.15.b: "Откажитесь присоединиться к ним" # Refuse to join them
 bel.16.t: "«Черная среда» в Бельгии" # Black Wednesday hits Belgium
 bel.16.d: "После краха фондового рынка, который обрушился на Лондон всего несколько дней назад, наша экономика также ощущает на себе последствия «черной среды». Наша экономика сильно зависит от торговли в Северном море и инвестиций как из Великобритании, так и из Франции. Это еще один пример того, как крупные державы втягивают малые страны в свои беспорядки." # Following the stock market crash that hit London just a few days ago, our economy is also feeling the effects of Black Wednesday. Our economy is heavily dependant on trade in the North Sea and investments from both the UK and France. This is yet another example of big powers dragging small countries into their mess.
 bel.16.a: "О Боже мой!" # Oh good Lord!
 bel.17.t: "Люксембург принимает наши требования" # Luxembourg accepts our demands
 bel.17.d: "Люксембург согласился на присоединение к Бельгии. Правительство маленькой страны, приняв во внимание тесные связи, которые оно имеет с Бельгией, а также политическую ситуацию в Европе, осознало, что безопасность ее народа может быть гарантирована только более крупной и сильной страной, такой как Бельгия. Еще с 1839 года бельгийские политики мечтали о возвращении Люксембурга в состав Бельгии, и теперь эта мечта сбылась." # Luxembourg has agreed to the annexation into Belgium. The government of the small country has looked upon the close ties it has with Belgium and the political situation in Europe and has realised that the safety of its people can only be guaranteed by a bigger and stronger country such as Belgium. Ever since 1839 Belgian politicians have dreamed about the return of Luxembourg into Belgium and now that dream has come true.
 bel.17.a: "Единство делает силу - L'unité fait la Force - Единство делает силу" # Eendracht maakt macht - L'unité fait la force - Unity makes strength
 bel.18.t: "Люксембург отказывается от наших требований" # Luxembourg refuses our demands
 bel.18.d: "Люксембург отказался присоединиться к нашей стране. Леон Дегрель уже подготовил нашу страну к войне со своим маленьким соседом. Что бы люксембуржцы ни думали об ультиматуме, они присоединятся к нам либо мирным путем, либо силой. Они были достаточно глупы, чтобы думать, что могут отказать нам в наших законных правах." # Luxembourg has refused to join our country. Léon Degrelle has already prepared our country for war with its small neighbour. Whatever the Luxembourgians may think of the ultimatum, they will join us, either peacefully or by force. They were stupid enough to think that they can deny us our rightful claims.
 bel.18.a: "Тогда это война" # Then war it is
 bel.19.t: "Марш на Брюссель" # March on Brussels
 bel.19.d: "Сегодня большое количество людей собралось в Брюсселе в знак протеста против недавнего принятия Крийгсвета. Большинство из них идентифицируют себя с новым валкистским движением Леона Дегреля и называют себя бургиньонами. Однако некоторые фламандские националистические движения также присутствуют. Вопрос в том, каковы их мотивы и как должны реагировать городские власти." # Today a large number of people have gathered in Brussels to protest against the recent enactment of the Krijgswet. Most of them identify themselves with the new Valkist movement of Léon Degrelle and call themselves the Bourguignons. However, some Flemish nationalist movements are also present. The question is what their motive is and how the city officials should react.
 bel.19.a: "Разогнать толпу силой!" # Disperse the crowd with force!
 bel.19.b: "Пусть протестуют мирно" # Let them protest peacefully
 bel.20.t: "Расследование в отношении премьер-министра" # Investigation into the PM
 bel.20.d: "Король публично потребовал провести расследование финансов премьер-министра Пола ван Зеландии. Король стал с подозрением относиться к ван Зеланду после его недавнего поведения на голосовании в Крийгсвете. Парламент согласился начать расследование, но остается вопрос, кто возглавит комиссию." # The King has asked publicly for an investigation into the finances of Prime Minister Paul van Zeeland. The King has become suspicious of van Zeeland after his recent behavior in the Krijgswet vote. Parliament has agreed to start an investigation, but the question remains who will lead the commission.
 bel.20.a: "Хендрик де Ман возглавит расследование" # Hendrik de Man will lead the investigation
 bel.20.b: "Пол Хайманс возглавит расследование" # Paul Hymans will lead the investigation
 bel.21.t: "Каков наш следующий шаг?" # What's our next step?
 bel.21.d: "Каким должен быть наш следующий шаг в расследовании дела Пола ван Зеланда? Правительство хочет, чтобы дело было решено как можно быстрее, и оказывает большое давление на судей, участвующих в этом деле. Высока вероятность того, что Комиссия удовлетворит только один судебный запрос. Теперь вопрос в том, следует ли проводить обыск в доме премьер-министра или же проверка его финансовых отчетов даст больше результатов." # What should be our next step in the investigation into Paul van Zeeland? The government wants this handled quickly and put a lot of pressure on the judges involved in this case. It is highly probable that the Commission will get only one judicial request granted. Now the question is whether a house-search should be conducted in the home of the Prime Minister, or if a look into his financial records will give more results.
 bel.21.a: "Запросите ордер на обыск дома" # Request a warrant for a house-search
 bel.21.b: "Взгляните на его финансовые отчеты." # Take a look at his financial records
 bel.22.t: "Расследование зашло в тупик" # Investigation hits a dead end
 bel.22.d: "Расследование зашло в тупик, и правительственные чиновники, а также члены парламента хотят, чтобы расследование закончилось как можно скорее. В результате Комиссия была распущена, а Пол ван Зеланд остался нетронутым." # The investigation has hit a dead end and gorvernment officials as well as members of parliament want the inquiry to end sooner than later. As a result, the Commission has been disbanded and Paul van Zeeland remains untouched.
 bel.22.a: "Он счастливчик!" # He's a lucky man!
 bel.23.t: "Премьер-министр замешан в скандале!" # PM involved in scandal!
 bel.23.d: "Недавнее расследование финансовых дел премьер-министра Пола ван Зеланда показало, что ван Зеланд регулярно получал деньги от Национального банка. Дальнейшее расследование показало, что деньги были использованы незаконно в предвыборной кампании ван Зеланда на следующих выборах. Хотя никаких официальных действий предпринято не было, это сильно повлияет на политическую карьеру ван Зеланда." # A recent inquiry into the financial affaires of Prime Minister Paul van Zeeland has revealed that van Zeeland has been receiving money from the National Bank on a regular basis. Further investigation pointed out that the money was used illegaly in van Zeeland's campaign for the next elections. Although no official action has been taken, this will greatly affect van Zeeland's political career.
 bel.23.a: "Бедный Пол, он этого ожидал." # Poor Paul, he had it coming
 bel.24.t: "Дегрелль звонит из Зеландии" # Degrelle calls out van Zeeland
 bel.24.d: "После недавнего скандала с участием премьер-министра Пола ван Зеланда Леон Дегрелль раскритиковал действия премьер-министра в публичном выступлении. Газеты также внесли свой вклад в это дело и на следующий день опубликовали речь Дегреля. В результате рейтинги его партии растут, а популярность ван Зеланда падает." # After the recent scandal involving Prime Minister Paul van Zeeland, Léon Degrelle has called out the PM's actions in a public speech. The newspapers further contributed to the affaire and published Degrelle's speech the next day. As a result, the poll numbers of his party are on the rise, while van Zeeland's popularity is dwindling.
 bel.24.a: "У Дегрелля определенно есть особый способ добиться того, чтобы его услышали." # Degrelle certainly has a special way of making sure he's heard
 bel.25.t: "Приглашение в Гент" # Invitation to Ghent
 bel.25.d: "Бельгийское правительство направило нам приглашение в Гент для обсуждения объединения наших двух стран в одно более крупное государство под названием Дитсланд. Конечно, их идеи безумны и принесут с собой много проблем. Хотя некоторые люди в нашей стране хотели бы видеть объединение, мы, как правительство, не можем поддаваться этим абсурдным идеям и требованиям." # The Belgian government have sent us an invitation to Ghent to discuss the unification of our two nations into one bigger state called Dietsland. Of course their ideas are insane and would bring a lot of problems with them. Although some people in our nation would like to see a unification, we as a government can not give in to these absurd ideas and demands.
 bel.25.a: "Пожалуйста, отклоните приглашение" # Kindly reject the invitation
 bel.26.t: "Голландцы отказались!" # The Dutch refused!
 bel.26.d: "Голландцы отказались от нашего предложения подписать «Умиротворение Гента» и объединить Дитсланд в одну нацию. Это возмутительно, но мы были готовы к такому зрелищу. По всей территории Нидерландов верные сторонники дела Вердинасо готовятся свергнуть правительство принца Бернхарда. Эти секретные агенты попытаются убить Бернхарда и создать новое правительство, которое будет стремиться к объединению с нами в более великую нацию." # The Dutch refused our offer to sign the Pacification of Ghent and unite Dietsland into one nation. This is outrageous, but we were prepared for this display. All over the Netherlands, loyal supporters of the Verdinaso cause are preparing to overthrow the government of Prince Bernhard. These secret agents will attempt to kill Bernhard and establish a new government which will seek unification with us into a greater nation.
 bel.26.a: "Если Бернхард нас не поддержит, нам придется от него избавиться." # If Bernhard doesn't support us, we have to get rid of him
 bel.27.t: "Бельгийский заговор раскрыт!" # Belgian Plot Discovered!
 bel.27.d: "Наша секретная служба раскрыла бельгийский заговор с целью свергнуть наше правительство и убить принца Бернхарда в попытке поставить Вердинасо во главе нашей нации. Этот бельгийский заговор является еще одним примером растущей опасности, которую наши южные соседи представляют для голландского государства и принца Бернхарда. К счастью для нас, мы выявили большинство заговорщиков, и наши полицейские силы уже на пути к устранению угрозы." # Our secret service has discovered a Belgian plot to overthrow our government and kill Prince Bernhard in an attempt to put Verdinaso at the head of our nation. This Belgian plot is just another example of the growing danger our southern neighbors pose to the Dutch State and Prince Bernhard. Luckily for us, we have identified the majority of the conspirators and our police forces are already on their way to eliminate the threat.
 bel.27.a: "Эти проклятые вафельщики, давайте преподам им урок!" # Those damn waffle eaters, let's teach them a lesson!
 bel.28.t: "Наша попытка государственного переворота провалилась!" # Our coup attempt failed!
 bel.28.d: "Наша попытка создать лояльное правительство в Нидерландах провалилась. Голландцы готовятся к войне, и нам следует тоже. Нам нужно нанести удар по ним прежде, чем они ударят по нам. Если они не хотят объединить Дитсландию мирным путем, то нам придется сделать это посредством войны!" # Our attempt to establish a loyal government in the Netherlands has failed. The Dutch are preparing for war and so should we. We need to strike them before they strike us. If they don't want to unite Dietsland peacefully, then we have to do it by means of war!
 bel.28.a: "Давайте преподам этим сабо урок!" # Let's teach those clogs a lesson!
 bel.29.t: "Конец Бельгии!" # The end of Belgium!
 bel.29.d: "ВНВ успешно покончил с Бельгией! Придавая Бельгии все больше и больше федеральных характеристик, страна практически прекратила свое существование." # VNV has successfully made an end to Belgium! By giving more and more federal characteristics to Belgium, the country has practicly ceased to exist.
 bel.29.a: "Играйте за Фландерса" # Play as Flanders
 bel.29.b: "Играйте за Валлонию" # Play as Wallonia
 bel.30.t: "Конголезская автономия" # Congolese Autonomy
 bel.30.d: "Бельгийское правительство приняло решение предоставить Бельгийскому Конго большую автономию. Благодаря региональной независимости наша колония может внести больший вклад в благосостояние и научные знания Бельгии." # The Belgian government has decided to grant Belgian Congo more autonomy. Through regional independence, our colony can contribute more to the welfare and scientific knowledge of Belgium.
 bel.30.a: "Продолжайте играть за Бельгию" # Continue playing as Belgium
 bel.30.b: "Играйте за Конго" # Play as Congo
 bel.31.t: "Хендрик Де Ман берет на себя управление" # Hendrik De Man assumes control
 bel.31.d: "Хендрик Де Ман взял на себя управление Бельгией. Ранее он был членом бельгийских социал-демократов, но действия короля привели его к авангардизму. Де Ман теперь будет продвигать свою авангардную программу в надежде на стабилизацию ситуации в Бельгии." # Hendrik De Man has assumed control over Belgium. Previously a member of the Belgian social democrats, the actions of the King have lead him to embrace vanguardism. De Man will now push forward his vanguard agenda in hopes of stabilising Belgium.
 bel.31.a: "У Де Мана есть план!" # De Man has a plan!
 bel.32.t: "Национал-коммунисты остаются у власти" # National Communists remain in control
 bel.32.d: "Национал-коммунисты КПБ/ПКБ продолжают стабильно контролировать новое бельгийское государство. Несмотря на свою победу в Революции, они принесут мир и процветание народам Фландрии и Валлонии." # The National Communists of the KPB/PCB remain steadily in control of the new Belgian state. Though their victory in the Revolution, they will bring peace and prosperity to the peoples of Flanders and Wallonia.
 bel.32.a: "Да здравствует Революция!" # Long live the Revolution!

##### Belgisch Centraal-Afrika
 bca.1.t: "Бельгийская Центральная Африка" # Belgisch Centraal-Afrika
 bca.1.d: "18 октября 1908 года парламент Бельгии проголосовал за аннексию Конго как бельгийской колонии. После нашей победы в Великой войне Руанда-Урунди также попала в наши руки. Де-юре это был мандат Лиги Наций, но де-факто Бельгия имела здесь полную свободу действий. В 1933 году Конго и Руанда-Урунди объединились и образовали Бельгийскую Центральную Африку. Новому африканскому правительству была предоставлена ​​большая автономия в обмен на одно требование: BCA должна до 1939 года подготовиться к аннексии Бельгией. План состоит в том, чтобы «цивилизовать» и развивать страну, одновременно делая ее зависимой от Европы, пока она не будет готова к интеграции в качестве федерального региона. Удовлетворит ли стратегия Пьера Рикмана бельгийское правительство?" # On 18 October 1908, the Belgian Parliament voted in favour of annexing the Congo as a Belgian colony. After our victory in the Great War the Ruanda-Urundi also fell into our hands. De jure it was a League of Nations mandate, but de facto Belgium had a free hand there. In 1933, Congo and Ruanda-Urundi merged to form Belgian Central Africa. The new African government was given greater autonomy in exchange for one demand: the BCA has until 1939 to prepare for annexation by Belgium. The plan is to 'civilise' and develop the country while making it dependent on Europe until it is ready for integration as a federal region. Will Pierre Ryckman's strategy satisfy the Belgian government?
 bca.1.a: "Время покажет" # Time Will Tell
 bcaintro_tt: "§RСрок — январь 1939 г.§!" # §RThe Deadline is January 1939§!



#####Decisions#####
 BEL_economy: "Бельгийская экономика" # The Belgian Economy
 BEL_economy_desc: "Наша национальная промышленность важна для богатства и силы нашей нации. Наше правительство должно сделать все возможное, чтобы улучшить и развить существующую инфраструктуру." # Our national industry is important for the wealth and strength of our nation. Our government needs to do everything in its power to improve and build upon the current infrastructure.
 BEL_end_economic_crisis: "Покончить с экономическим кризисом" # End the Economic Crisis
 BEL_end_economic_crisis_desc: "Начиная с Черной среды, наша экономика находится в состоянии хаоса. Но благодаря усилиям правительства конец уже виден. Теперь нам нужно послать людям сильный сигнал и дать им понять, что будущее Бельгии выглядит светлым." # Ever since Black Wednesday, our economy has been in a state of disarray. But with the effort of the government, the end is now in sight. Now we need to send a strong signal to the people and let them know that the future looks bright for Belgium.

