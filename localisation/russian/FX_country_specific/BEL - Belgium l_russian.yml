#####Tooltips#####

#####Focus#####
 BEL_goal_elections: "Выборы 1936 года" # 1936 Elections
 BEL_goal_elections_desc: "Выборы в мае 1936 года определят, какие политические партии будут управлять Бельгией в течение следующих четырех лет." # The elections of May 1936 will determine which political parties will govern Belgium for the next four years.
 BEL_goal_elections_tt: "§GЭтот фокус будет автоматически пропущен после завершения выборов 1936 года.§!" # §GThis focus will be automatically bypassed once the 1936 elections has been concluded.§!
 BEL_goal_KPB: "Коммунистическая победа" # Communist Victory
 BEL_goal_KPB_desc: "После того, как коммунисты успешно разгромили королевскую армию в недавней гражданской войне, теперь им предстоит восстановить страну и снова сделать Бельгию великой." # After the communists successfully defeated the King's army in the recent civil war, it is now up to them to rebuild the country and make Belgium great again.
 BEL_goal_KPB_tt: "§GЭтот фокус будет автоматически обойден, как только коммунисты возьмут под свой контроль правительство.§!" # §GThis focus will be automatically bypass once the Communists has taken control of the government.§!
 BEL_goal_de_man: "Выбирайте Де Мана" # Choose De Man
 BEL_goal_de_man_desc: "Хендрик Де Ман, который недавно взял под свой контроль авангардистскую фракцию внутри BWP, является реальным претендентом на контроль над Бельгией после гражданской войны." # Hendrik De Man, who has recently took control of the vanguardist faction within the BWP, is a viable contender for control over Belgium after the civil war.
 BEL_goal_economic_secretariats: "Экономические секретариаты" # Economic Secretariats
 BEL_goal_economic_secretariats_desc: "Экономические секретариаты, возглавляемые технократами, не связанными ни с одной партией, — это путь вперед, если мы хотим вывести нашу страну из экономического кризиса." # Economic secretariats, led by technocrats not bound by any party, are the way forward if we want to lead our country away from the economic crisis.
 BEL_goal_nationalize_industries: "Национализировать промышленность" # Nationalize Industries
 BEL_goal_nationalize_industries_desc: "Национализация отраслей жизненно важна для прекращения так называемых рыночных монополий, которые некоторым компаниям удалось отобрать у правительства." # Nationalizing the industries is vital to end the so called marketmonopolies that some companies have managed to take from the government.
 BEL_goal_union_of_craftsmen_and_intellectuals: "Союз Мастеров и Интеллигенции" # Union of Craftsmen and Intellectuals
 BEL_goal_union_of_craftsmen_and_intellectuals_desc: "Союз ремесленников и интеллигенции создает прочную связь между рабочим классом нашей страны и интеллигенцией, возглавляющей страну." # The Union of Craftsmen and Intellectuals creates a strong bond between the working classes of our country and the intellectuals who are leading the country.
 BEL_goal_head_office_worker_education: "Главное управление образования рабочих" # Head Office for Worker's Education
 BEL_goal_head_office_worker_education_desc: "Главное управление образования рабочих — это учреждение, которое будет помогать в обучении рабочего класса Бельгии." # The Head Office for Worker's Education is an institution which will help educate the working classes of Belgium.
 BEL_goal_choose_KPB: "Выберите КПБ/ПХБ" # Choose KPB/PCB
 BEL_goal_choose_KPB_desc: "Коммунистической партии Бельгии удалось взять под свой контроль страну после недавней гражданской войны. Их марксистская программа теперь будет диктовать будущее Бельгии." # The Communist Party of Belgium has succeeded in taking control of the country after the recent civil war. Their marxist programme will now dictate the future of Belgium.
 BEL_goal_integrate_bwp: "Интегрируйте BWP/POB" # Integrate the BWP/POB
 BEL_goal_integrate_bwp_desc: "Интеграция авангардистской и социал-демократической фракций BWP/POB улучшит стабильность страны." # Integrating the vanguardist and social democrat factions of the BWP/POB will improve the country's stability.
 BEL_goal_economic_planning: "Экономическое планирование" # Economic Planning
 BEL_goal_economic_planning_desc: "Плановая экономика является одним из главных вопросов КПБ/ПКБ и жизненно важна для возрождения экономики страны." # A planned economy is one of the headliners of the KPB/PCB and vital to the revival of the country's economy.
 BEL_goal_worker_universities: "Рабочие университеты" # Worker's Universities
 BEL_goal_worker_universities_desc: "Повышение доступности университетов для низших классов значительно повысит благосостояние и уровень знаний в стране." # Making universities more accessible for the lower classes will greatly improve the wealth and knowledge in the country.
 BEL_goal_communist_brigades: "Коммунистические бригады" # Communist Brigades
 BEL_goal_communist_brigades_desc: "Создание коммунистических бригад улучшит статус нашей армии и лояльность солдат правительству." # Setting up communist brigades will improve the status of our army and the loyalty of soldiers to the government.
 BEL_goal_BWP_KP_coalition: "BWP/POB - Коалиция КП/ПК" # BWP/POB - KP/PC Coalition
 BEL_goal_BWP_KP_coalition_tt: "§GЭтот фокус будет автоматически обойден, как только BWP возьмет под свой контроль правительство.§!" # §GThis focus will be automatically bypass once the BWP has taken control of the government.§!
 BEL_goal_BWP_KP_coalition_desc: "После последних выборов коалиция католиков и социал-демократов сформировала новое правительство большинства. Теперь им предстоит управлять страной в течение следующих четырех лет." # After the most recent election, a coalition of Catholics and Social Democrats have formed a new majority government. It is now up to them to govern the country for the next four years.
 BEL_goal_improve_working_conditions: "Улучшить условия труда" # Improve Working Conditions
 BEL_goal_improve_working_conditions_desc: "Улучшение условий труда должно быть приоритетом для этого правительства, которое поклялось служить бельгийскому народу. Сюда входят тысячи рабочих, которым каждый день приходится работать в ужасных условиях. Пришло время правительству что-то сделать, чтобы это изменить." # Improving working conditions should be a priority for this government, which swore to serve the Belgian people. That includes the thousands of workers who have to work in horrible conditions each day. It is time the government does something to change that.
 BEL_goal_subsidize_the_boerenbond_1: "Субсидировать Боеренбонд" # Subsidize the Boerenbond
 BEL_goal_subsidize_the_boerenbond_1_desc: "Boerenbond, католическая организация, представляющая фермеров страны, должна получать субсидии, чтобы они могли продолжать свою хорошую работу." # The Boerenbond, a Catholic pillar organisation which represents the country's farmers, should be subsidized in order that they can continue their good work.
 BEL_goal_introduce_conge_paye: "Ввести оплачиваемый отпуск" # Introduce the Congé Payé
 BEL_goal_introduce_conge_paye_desc: "Введение оплачиваемых отпусков для нашего рабочего класса может повысить производительность, а также увеличить потребление ими бельгийских товаров." # By introducing payed vacations for our working classes, productivity could increase and their consumption of Belgian goods should also increase.
 BEL_goal_expand_national_industries: "Расширить национальные отрасли" # Expand National Industries
 BEL_goal_expand_national_industries_desc: "Расширение национальных отраслей, таких как железнодорожная инфраструктура и энергосистема, значительно улучшит наш промышленный потенциал." # Expanding the national industries like the railway infrastructure and the power grid would greatly improve our industrial capacities.
 BEL_goal_invest_in_education: "Инвестируйте в образование" # Invest in Education
 BEL_goal_invest_in_education_desc: "Образование молодежи страны является приоритетом. Инвестиции в местные школы и крупные университеты страны значительно улучшат образование масс." # The education of the country's youth is a priority. Investing in local schools and the major universities of the country would greatly improve education for the masses.
 BEL_goal_large_state_investments: "Крупные государственные инвестиции" # Large State Investments
 BEL_goal_large_state_investments_desc: "Государство должно взять меру в свои руки и вложить значительные средства в промышленность нашей страны. Возможно, это единственный способ решить нынешний экономический кризис." # The state should take measure into its own hands and invest heavily in the industry of our country. It might be the only way to solve the current economical crisis.
 BEL_goal_KP_LP_PP_coalition: "КП/ПК – ЛП/ПЛ – Коалиция ПП" # KP/PC - LP/PL - PP Coalition
 BEL_goal_KP_LP_PP_coalition_tt: "§GЭтот фокус будет автоматически обойден, как только коалиция КП-ЛП-ПП возьмет под свой контроль правительство.§!" # §GThis focus will be automatically bypass once the KP-LP-PP coalition has taken control of the government.§!
 BEL_goal_KP_LP_PP_coalition_desc: "После последних выборов коалиция католиков и либералов сформировала новое правительство большинства. Теперь им предстоит управлять страной в течение следующих четырех лет." # After the most recent elections, a coalition of Catholics and Liberals have formed a new majority government. It is now up to them to govern the country for the next four years.
 BEL_goal_deregulate_industries: "Дерегулирование отраслей" # Deregulate Industries
 BEL_goal_deregulate_industries_desc: "Дерегулирование отраслей даст частным компаниям больше возможностей для расширения. Учитывая нынешнюю нестабильную глобальную экономику, это может быть рискованно, но в конечном итоге это может оказаться успешным." # Deregulating the industries would give private owned companies more room to expand. Given the current unstable global economy, it may be risky to do this, but it might prove successful in the end.
 BEL_goal_subsidize_the_boerenbond_2: "Субсидировать Боеренбонд" # Subsidize the Boerenbond
 BEL_goal_subsidize_the_boerenbond_2_desc: "Boerenbond, католическая организация, представляющая фермеров страны, должна получать субсидии, чтобы они могли продолжать свою хорошую работу." # The Boerenbond, a Catholic pillar organisation which represents the country's farmers, should be subsidized in order that they can continue their good work.
 BEL_goal_encourage_the_middle_class: "Поощряйте средний класс" # Encourage the Middle Class
 BEL_goal_encourage_the_middle_class_desc: "Средний класс является важной частью нашей страны, и правительство должно всячески поощрять частный бизнес." # The middle class is an important part of our country and the government should encourage private owned businesses in every way it can.
 BEL_goal_women_suffrage: "Избирательное право женщин" # Women's Suffrage
 BEL_goal_women_suffrage_desc: "Расширение избирательных прав для женщин было хедлайнером Прогрессивной партии, которой удалось войти в правительственную коалицию с католиками и рыночными либералами. Как и было обещано, теперь они предоставят каждой женщине старше 21 года те же права голоса, что и мужчинам. Это важный шаг в нашей истории, который сблизит всех бельгийцев." # Extending voting rights to women was the headliner of the Progressive Party, which managed to enter the government coalition with the Catholics and the Market Liberals. As promised, they will now grant every woman above the age of 21 the same voting rights as men. This is an important step in our history and will bring all Belgians closer together.
 BEL_goal_fund_scientific_research: "Фонд научных исследований" # Fund Scientific Research
 BEL_goal_fund_scientific_research_desc: "Финансирование научных исследований могло бы оказаться очень полезным для промышленности нашей страны. Чем больше проектов правительство сможет поддержать, тем больше шансов, что будут сделаны крупные прорывы. Эти прорывы можно было бы применить в нашей армии или в нашей промышленности." # Funding scientific research could prove very useful to the industries of our country. The more projects the government can support, the more chance there is major breakthroughs will be made. These breakthroughs could be applied in our army or in our industry.
 BEL_goal_debase_belgian_frank: "Обесценить бельгийский франк" # Debase the Belgian Frank
 BEL_goal_debase_belgian_frank_desc: "Обесценивание бельгийского франка, нашей национальной валюты, возможно, единственный способ справиться с нынешним экономическим кризисом." # Debasing the Belgian Frank, our national currency, is maybe the only way we can deal with the current economic crisis.
 BEL_goal_royal_coup: "Королевский переворот удался" # Royal Coup Succeeds
 BEL_goal_royal_coup_desc: "Переворот короля Леопольда III увенчался успехом, и теперь его кабинет будет работать над будущим Бельгии. Неизвестно, по какому пути он поведет страну, но некоторые говорят, что это, возможно, единственный способ выжить в будущем." # The Coup of King Leopold III has succeeded and his cabinet will now work on the future of Belgium. It is uncertain which way he will lead the country into, but some say it might be the only way our country can survive the future.
 BEL_goal_royal_coup_tt: "§GЭтот фокус будет автоматически пропущен после успешного переворота роялистов.§!" # §GThis focus will be automatically bypass once the Royalist coup is successful.§!
 BEL_goal_politique_des_mains_libres: "Политика громкой связи" # Politique des Mains Libres
 BEL_goal_politique_des_mains_libres_desc: "Politique des Mains Libres, или Политика свободных рук, — это политика, при которой Бельгия не принимает чью-либо сторону на мировой арене, умиротворяя более сильные страны, надеясь, что они оставят нас в покое." # Politique des Mains Libres, or Politics of Free Hands, is a policy where Belgium doesn't take any sides on the world stage, appeasing stronger nations hoping that they will leave us alone.
 BEL_goal_armed_neutrality: "Вооруженный нейтралитет" # Armed Neutrality
 BEL_goal_armed_neutrality_desc: "Вооруженный нейтралитет – это идея о том, что страна должна быть нейтральной в международных конфликтах, но также должна вкладывать значительные средства в свою армию, чтобы защитить себя в случае войны." # Armed neutrality is the idea that a country should be neutral in international conflicts, but also should heavily invest in its army to defend itself in case of a war.
 BEL_goal_develop_royal_domains: "Развивайте королевские домены" # Develop Royal Domains
 BEL_goal_develop_royal_domains_desc: "Король владеет большим количеством земли в Арденнах, которая в настоящее время не используется в местной промышленности. Развитие этих территорий поможет местному населению и улучшит экономику региона." # The King is in possession of a lot of land in the Ardennes which are currently not being used in the local industry. Developing those domains will help the local population and improve the economy in the area.
 BEL_goal_fund_royal_academy: "Фонд Королевская Академия" # Fund Royal Academy
 BEL_goal_fund_royal_academy_desc: "В настоящее время Королевской академии не хватает средств для полноценной работы. Предоставление этому учреждению большего финансирования значительно улучшит его способность проводить исследования." # Currently the Royal Academy is lacking funds to properly operate. Providing the institution with more funding would greatly improve its ability to conduct research.
 BEL_goal_profits_from_congo: "Прибыль от Конго" # Profits from the Congo
 BEL_goal_profits_from_congo_desc: "Король по-прежнему занимает важное положение в Бельгийском Конго. Прибыль от единственной колонии страны может быть использована для улучшения промышленности и экономики Бельгии и может помочь разрешить текущий кризис." # The King still holds an important position in the Belgian Congo. Profits from the country's only colony could be used to improve the industry and economy of Belgium and may help solve the current crisis.
 BEL_goal_VNV: "ВНВ Победа" # VNV Victory
 BEL_goal_VNV_tt: "§GЭтот фокус будет автоматически обойден, как только BWP возьмет под свой контроль правительство.§!" # §GThis focus will be automatically bypass once the BWP has taken control of the government.§!
 BEL_goal_VNV_desc: "Vlaamsch Nationaal Verbond, или VNV, удалось назначить премьер-министра в новое правительство меньшинства. Они наверняка приведут Бельгию к конфедерации или даже к независимой Фландрии." # Vlaamsch Nationaal Verbond, or VNV, has succeeded to provide a Prime Minister in the new minority government. They will surely lead Belgium to a confederation, or even an independent Flanders.
 BEL_goal_vlaamse_wacht: "Создать фламандскую гвардию" # Establish the Vlaamse Wacht
 BEL_goal_vlaamse_wacht_desc: "Создание лояльной военизированной гвардии под названием Vlaamse Wacht обеспечит успех будущей политики правительства." # Establishing a loyal paramilitary guard called the Vlaamse Wacht will ensure the success of future policies implemented by the government.
 BEL_goal_cultural_communities: "Основанные культурные сообщества" # Found Cultural Communities
 BEL_goal_cultural_communities_desc: "Разработка культурной политики по разделению фламандских и валлонских тел стала бы первым шагом на пути к конфедерации или независимой Фландрии. Такие области, как образование, более эффективны, если они организованы региональными советами." # Designating cultural policies to separate Flemish and Walloon bodies would be the first step towards a confederation or an independent Flanders. Domains like education are more efficient if they are organised by regional councils.
 BEL_goal_flemish_independence: "Фламандская независимость" # Flemish Independence
 BEL_goal_flemish_independence_desc: "Фламандские националисты так долго боролись за независимость. Теперь, наконец, появилась возможность провозгласить независимость и двигаться вперед без франкоязычных валлонов." # The Flemish nationalists have worked so long for independence. Now is finally the opportunity to proclaim independence and move forward without the French-speaking Walloons.
 BEL_goal_PB: "ПБ Победа" # PB Victory
 BEL_goal_PB_tt: "§GЭтот фокус будет автоматически обойден, как только BWP возьмет под свой контроль правительство.§!" # §GThis focus will be automatically bypass once the BWP has taken control of the government.§!
 BEL_goal_PB_desc: "Бургиньонской партии, или ПБ, удалось назначить премьер-министра в новое правительство меньшинства. Популярность их версии немецкого валькизма в последние месяцы резко возросла, вероятно, благодаря ее лидеру Леону Дегрелю, известному своим очень острым языком." # The Parti Bourguignon, or PB, has succeeded to provide a Prime Minister in the new minority government. Their version of German Valkism has seen a rapid increase in popularity in recent months, probably due to its leader, Léon Degrelle, who is known for his very sharp tongue.
 BEL_goal_purge_opposition: "Чистка оппозиции" # Purge Opposition
 BEL_goal_purge_opposition_desc: "Чтобы укрепить позиции Дегреля в правительстве, необходимо провести чистку других партий и оппозиции." # To strengthen Degrelle's position in the government, the other parties and the opposition must be purged.
 BEL_goal_burgundian_inheritence: "Бургундское наследие" # Burgundian Inheritence
 BEL_goal_burgundian_inheritence_desc: "Бельгия — единственная истинная преемница Бургундии, поэтому мы должны претендовать на наши давно утраченные территории и нашу бургундскую родину во Франции." # Belgium is the only true successor of Burgundy, therefore we must claim our long lost territories and our Burgundian homeland in France.
 BEL_goal_ultimatum_luxembourg: "Люксембургский ультиматум" # Luxembourg Ultimatum
 BEL_goal_ultimatum_luxembourg_desc: "Люксембург — легкая цель и первая точка расширения нашей будущей империи. Мы должны действовать быстро и потребовать, чтобы они присоединились к нам." # Luxembourg is an easy target and a first point of expansion for our future empire. We must act quickly and demand that they join us.
 BEL_goal_ambiorix_legacy: "Наследие Амбиорикса" # The Legacy of Ambiorix
 BEL_goal_ambiorix_legacy_desc: "В бельгийском валкизме Амбиорикс считается первым в длинном списке сильных и храбрых лидеров, которые в прошлом привели бельгов, каролингов и бургундцев к славе. Для многих Леон Дегрелль — современный Амбиорик. Отважные бельгийцы когда-то сражались против латинян Рима, теперь пришло время сразиться с латинянами Франции и еще раз доказать, что бельгийцы самые храбрые из всех." # In Belgian Valkism, Ambiorix is considered to be the first in a long list of strong and brave leaders who have led the Belgae, Carolingians and Burgundians to glory in the past. To many, Léon Degrelle is a modern Ambiorix. The brave Belgae once fought against the Latins of Rome, now it is time to fight against the Latins of France and prove once more that the Belgians are the bravest of all.
 BEL_goal_Verdinaso: "Вердинасо Победа" # Verdinaso Victory
 BEL_goal_Verdinaso_desc: "Вердинасо, партия автократов по отцовской линии, которая стремится к воссоединению с Голландией, сумела обеспечить премьер-министра в новом правительстве меньшинства. В течение следующих четырех лет их политика будет определять будущее Бельгии." # Verdinaso, a paternal autocrat party which seeks reunification with the Dutch, has succeeded to provide a Prime Minister in the new minority government. For the next four years, their policies will determine the future of Belgium.
 BEL_goal_Verdinaso_tt: "§GЭтот фокус будет автоматически обойден, как только BWP возьмет под свой контроль правительство.§!" # §GThis focus will be automatically bypass once the BWP has taken control of the government.§!
 BEL_goal_nieuwe_marsrichting: "Новое направление Марса" # Nieuwe Marsrichting
 BEL_goal_nieuwe_marsrichting_desc: "Вместо объединения только Фландрии и Нидерландов нам следует объединить всю Бельгию с нашими голландскими соседями. Только тогда мы сможем назвать себя настоящим Дитсландом." # Instead of uniting only Flanders and the Netherlands, we should unite the whole of Belgium with our Dutch neighbors. Only then can we call ourselves a true Dietsland.
 BEL_goal_proclaim_south_dietsland: "Провозгласить Южный Дитсланд" # Proclaim South Dietsland
 BEL_goal_proclaim_south_dietsland_desc: "Если мы хотим объединить народ Сейма, мы должны начать с преобразования Бельгии в Южную Дитсландию. Смена имени будет выражать нашу политическую точку зрения и будущее, которое мы хотим для всех членов парламента." # If we want to unite the Diets people, we must start by transforming Belgium into South Dietsland. The namechange will express our political point of view and the future we want for all Diets people.
 BEL_goal_pacification_of_ghent: "Умиротворение Гента" # Pacification of Ghent
 BEL_goal_pacification_of_ghent_desc: "Умиротворение Гента было событием во время голландского восстания против испанцев, в ходе которого испанские Нидерланды впервые объединились в единый фронт после испанской ярости. Если мы пригласим голландское правительство в Генте на новое примирение, которое призывает к объединению наших двух наций, мы сможем объединить всех членов парламента в Нидерландах под одним знаменем." # The Pacification of Ghent was an event during the Dutch revolt against the Spanish in which the Spanish Low Countries came together for the first time as a united front, after the Spanish Fury. If we invite the Dutch government in Ghent for a new Pacification which calls for the unification of our two nations, we can unite all Diets people in the Low Countries under one banner.
 BEL_goal_depillarize: "Депилляризация общества" # Depillarize Society
 BEL_goal_depillarize_desc: "Бельгийское общество во многом определяется либеральными, католическими и социал-демократическими столпами. Разрушение этих столпов необходимо для будущего успеха наших маргинальных партий." # Belgium's society is heavily determined by the Liberal, Catholic and Social Democrat pillars. Destroying those pillars is necessary for the future success of our marginal parties.
 BEL_goal_aftermath_london: "Последствия Черной среды" # Aftermath of Black Wednesday
 BEL_goal_aftermath_london_desc: "К сожалению, Бельгия пострадала от экономического кризиса, последовавшего за крахом фондового рынка в Лондоне. Мы должны действовать сейчас, если хотим решить проблемы." # Belgium has unfortunately been hit by the economic crisis that followed the stock market crash in London. We must act now if we want to solve the problems.
 BEL_goal_aftermath_london_tt: "§GЭтот фокус будет автоматически обойден, как только крах лондонского фондового рынка достигнет Бельгии.§!" # §GThis focus will be automatically bypass once the London Stock Market Crash has reached Belgium.§!
 BEL_goal_expand_iron_rhine: "Расширить Железный Рейн" # Expand the Iron Rhine
 BEL_goal_expand_iron_rhine_desc: "Железный Рейн — это название железнодорожной инфраструктуры, соединяющей порт Антверпена с важными промышленными центрами Рейна. Теперь, когда мы контролируем Маастрихт и голландский Лимбург, мы можем расширить сеть еще ближе к Рейну." # The Iron Rhine is the name for the railway infrastructure connecting the port of Antwerp with the important industrial centers of the Rhine. Now that we control Maastricht and Dutch Limburg, we can expand the network even closer to the Rhine.
 BEL_goal_expand_antwerp_harbour: "Расширить порт Антверпена" # Expand the Port of Antwerp
 BEL_goal_expand_antwerp_harbour_desc: "Теперь, когда мы улучшили железные дороги, соединяющие Антверпен с Рейном, пришло время модернизировать порт Антверпена, чтобы он мог принять новый приток товаров." # Now that we've improved the railways connecting Antwerp to the Rhine, it is time that we modernize the port of Antwerp to accomodate with the new influx of goods.
 BEL_goal_antwerp_oil_refinery: "Антверпенские нефтеперерабатывающие заводы" # Antwerp Oil Refineries
 BEL_goal_antwerp_oil_refinery_desc: "Антверпен — идеальное место для новой экспериментальной отрасли, включающей нефтеперерабатывающие заводы. Нам следует инвестировать в строительство нового промышленного центра вокруг порта." # Antwerp is the ideal location for a new and experimental industry involving oil refineries. We should invest in building a new industrial center around the port.
 BEL_goal_invest_diamond_trade: "Инвестируйте в торговлю бриллиантами" # Invest in Diamond Trade
 BEL_goal_invest_diamond_trade_desc: "Антверпен является крупнейшим центром торговли алмазами в мире, и, возможно, наша страна сможет получить от этого больше прибыли, чем сейчас. Инвестиции в отрасль принесут нам огромные выгоды." # Antwerp is the largest hub for diamond trade in the world and maybe our country can profit more from it than it does now. Investing in the industry will grant us huge benefits.
 BEL_goal_invest_sillon_industriel: "Инвестируйте в промышленность Силлона" # Invest in the Sillon industriel
 BEL_goal_invest_sillon_industriel_desc: "Промышленность Силлон — крупнейший промышленный район Бельгии, расположенный в Валлонии. Инвестиции в этот регион могут оказаться жизненно важными для разрешения нынешнего кризиса." # The Sillon industriel is the biggest industriel area of Belgium, located in Wallonia. Investing in the area may prove vital to solving the current crisis.
 BEL_goal_expand_fn_herstal: "Развернуть ФН Херсталь" # Expand FN Herstal
 BEL_goal_expand_fn_herstal_desc: "Компания FN Herstal, расположенная в Льеже, Валлония, является крупнейшим производителем оружия в стране. Его расширение приведет к увеличению занятости и лучшему оснащению бельгийской армии." # Located in Liège, Wallonia, FN Herstal is the biggest weapons manufacturer of the country. Expanding it would result in more employment and a better equipped Belgian army.
 BEL_goal_expand_brussels_industry: "Расширить промышленность Брюсселя" # Expand Brussels Industry
 BEL_goal_expand_brussels_industry_desc: "В нашей столице мало промышленности по сравнению с другими промышленными центрами нашей страны. Возможно, пришло время подумать о его расширении, чтобы стимулировать местную экономику." # Our capital has little industry around it compared to the other industrial hubs of our country. Maybe it is time we think about expanding it to stimulate the local economy.
 BEL_goal_solvay_institute: "Основан Институт Сольвея" # Found Solvay Institute
 BEL_goal_solvay_institute_desc: "Институт Solvay, названный в честь Эрнеста Сольвея, будет исследовать технологии, которые помогут превратить наши заводы в современные и эффективные производственные дома." # The Solvay Institute, named after Ernest Solvay, will research technologies which will help turn our factories in modern and efficient production houses.
 BEL_goal_reinforce_colonial_government: "Укрепить колониальное правительство" # Reinforce the Colonial Government
 BEL_goal_reinforce_colonial_government_desc: "Если мы укрепим колониальное правительство и губернатора Конго, Бельгия, возможно, сможет контролировать больше ресурсов и прибылей в этом регионе." # If we reinforce the colonial government and the governor of Congo, Belgium may be able to control more of the resources and profits in the area.
 BEL_goal_more_autonomy: "Предоставьте больше автономии" # Grant More Autonomy
 BEL_goal_more_autonomy_desc: "Предоставление большей автономии Бельгийскому Конго принесет пользу как местным жителям, так и Бельгии. Большая автономия означает, что колония может развиваться самостоятельно, не используя бельгийские ресурсы." # Granting more autonomy to the Belgian Congo will benefit both the natives and Belgium. More autonomy means the colony can develop itself without using Belgian resources.
 BEL_goal_dominer_pour_servir: "Доминировать, чтобы служить" # Dominer pour Servir
 BEL_goal_dominer_pour_servir_desc: "«Dominer pour servir» или «доминировать, чтобы служить» — такова идеология губернатора Пьера Рикманса. Его преданность бельгийской колонии принадлежит не только стране, но и ее народу, и все, что он делает, направлено на цивилизацию конголезского народа." # 'Dominer pour servir' or 'to dominate to serve' is the ideology of governor Pierre Ryckmans. His devotion to the Belgian colony is not only to the country, but also to its people and everything he does is to civilize the Congolese people.
 BEL_goal_expand_conscription: "Расширить призыв в государственные силы" # Expand Force Publique Conscription
 BEL_goal_expand_conscription_desc: "Расширение местных конголезских гарнизонов Force Publique является тривиальной мерой по поддержанию порядка в колонии." # Expanding the local Congolese garrisons, the Force Publique, is trivial to maintaining order in the colony.
 BEL_goal_office_transports_coloniaux: "Колониальное транспортное управление" # Office des Transports Coloniaux
 BEL_goal_office_transports_coloniaux_desc: "Управление колониального транспорта улучшит инфраструктуру нашей колонии, сделав эксплуатацию природных ресурсов проще и доступнее." # The Office of Colonial Transports will improve the infrastructure in our colony, making exploitation of the natural resources easier and more accessible.
 BEL_goal_resource_extraction: "Добыча ресурсов" # Resource Extraction
 BEL_goal_resource_extraction_desc: "Финансируя исследования по добыче ресурсов, доходы Конго взлетят до небес и принесут пользу нашим фабрикам внутри страны." # By funding research into resource extraction, profits from the Congo will skyrocket and benefit our factories at home.
 BEL_goal_tungsten: "Вольфрамовые рудники в Киву" # Tungsten Mines in Kivu
 BEL_goal_tungsten_desc: "Провинция Киву богата вольфрамитом — природным ресурсом, используемым для производства вольфрама. Расширение рудников в Киву даст нам доступ к большему количеству вольфрама для наших заводов." # The province of Kivu is rich in Wolframite, the natural resource used to make tungsten. Expanding the mines in Kivu will give us access to more tungsten for our factories.
 BEL_goal_copper: "Медные рудники в Катанге" # Copper Mines in Katanga
 BEL_goal_copper_desc: "Провинция Катанга богата медью, поэтому расширение рудников даст нам доступ к ценным ресурсам, которые мы сможем использовать для производства большего количества стали в этом районе." # The province of Katanga is rich in Copper, expanding the mines there will give us access to valuable resources which we can use to make more steel in the area.
 BEL_goal_rubber: "Резиновые плантации в Эквадоре" # Rubber Plantations in Équateur
 BEL_goal_rubber_desc: "Экваториальная провинция полна каучуковых плантаций со зловещим прошлым. Если мы сосредоточимся на модернизации этих плантаций и научим местных жителей пользоваться современными инструментами, мы сможем получить больше каучука для наших заводов и избавиться от жестоких обычаев нашего прошлого." # The province of Équateur is full of rubber plantations with an ominous past. If we focus on modernizing these plantations and teach the locals how to use modern tools, we might get more rubber for our factories and get rid of the brutal ways of our past.
 BEL_goal_uranium: "Копать уран" # Dig for Uranium
 BEL_goal_uranium_desc: "Старатели вернулись из Конго с сообщениями о том, что по территории Конго распространяется новая руда под названием уран. Раздобыв этот материал, мы, возможно, сможем использовать его в экспериментальных исследованиях." # Prospectors have returned from the Congo with reports of a new ore called uranium being spread throughout the Congo. Digging for this material, we might be able to use it in experimental research.
 BEL_goal_boma_harbour: "Расширить гавань Бома" # Expand the Boma Harbour
 BEL_goal_boma_harbour_desc: "Бома всегда был важным пунктом остановки для кораблей, следующих в Конго и обратно. Расширение и модернизация гавани Бома улучшит наши усилия в нашей колонии." # Boma has always been an important stopping point for ships travelling to and from the Congo. Expanding and modernizing the Boma harbour will improve our efforts in our colony.
 BEL_goal_leopoldville_industry: "Индустриализация Леопольдвиля" # Industrialize Léopoldville
 BEL_goal_leopoldville_industry_desc: "Индустриализация города Леопольдвиль сделает Конго центром торговли и промышленности и улучшит наши возможности по модернизации нашей колонии." # Industrializing the city of Léopoldville will give Congo a center of commerce and industry and will improve our ability to modernize our colony.
 BEL_goal_educate_heart_of_darkness: "Воспитывайте Сердце Тьмы" # Educate the Heart of Darkness
 BEL_goal_educate_heart_of_darkness_desc: "Обучение конголезских масс – это то, на чем нашему правительству следует сосредоточиться, если мы хотим обеспечить светлое будущее нашей колонии." # Educating the Congolese masses is something our government should focus on if we want to provide a bright future for our colony.
 BEL_goal_bcsc: "Белго-конголезское научное сотрудничество" # Belgo-Congolese Scientific Cooperation
 BEL_goal_bcsc_desc: "Создание организации, которая приведет нашу страну и ее колонию к научному сотрудничеству, принесет большую пользу прогрессу, достигнутому в модернизации Конго." # Establishing an organisation which leads our nation and its colony to scientific cooperation will greatly benefit the progress made to modernize the Congo.
 BEL_goal_lessons_great_war: "Уроки Великой войны" # Lessons of the Great War
 BEL_goal_lessons_great_war_desc: "Изучая Великую войну, мы сможем лучше понять войну в наше время и подготовиться к будущим войнам." # By studying the Great War, we may be able to better understand warfare in modern times and prepare for future wars.
 BEL_goal_mobile_defence: "Фонд исследований Минервы" # Fund Minerva Research
 BEL_goal_mobile_defence_desc: "Мобильная оборона является ключом к удержанию линии обороны в будущих оборонительных войнах, и компания-производитель автомобилей Minerva могла бы извлечь выгоду из финансируемых исследований этих современных чудес." # Mobile defence is the key to holding the line in future defensive wars and the car manufacturing company Minerva could benefit from funded research into these modern marvels.
 BEL_goal_bicycle_divisions: "Велосипедные подразделения" # Bicycle Divisions
 BEL_goal_bicycle_divisions_desc: "Возрождение велосипедных дивизий, которые мы использовали в Великой войне, может оказаться полезным в будущих войнах." # Reviving the bicycle divisions we used in the Great War may prove useful in future wars.
 BEL_goal_bilingualism: "Двуязычие в армии" # Bilingualism in the Army
 BEL_goal_bilingualism_desc: "Языковые разногласия существовали в нашей армии слишком долго. Пришло время решить эту проблему, иначе наши силы могут оказаться неподготовленными к следующей войне. Обучение наших солдат как голландскому, так и французскому языку — это правильный путь. Это не только улучшит общение в армии, но и сблизит фламандских и валлонских солдат." # Language divisions have run through our army for far too long. It is time we solve the issue or our forces might be to unprepared for a next war. Teaching our soldiers both Dutch and French is the way to go. Not only will that improve communication in the army, but it will also bring Flemish and Walloon soldiers closer together.
 BEL_goal_separate_divisions: "Отдельные фламандская и валлонская дивизии" # Separate Flemish and Walloon Divisions
 BEL_goal_separate_divisions_desc: "Разделение нашей армии на фламандскую и валлонскую дивизии может быть единственным способом решить языковой барьер, который пронизывает нашу армию. Фламандские дивизии получали приказы на голландском языке, а валлонские — на французском. Центральное командование возьмет на себя задачу написания приказов на обоих языках." # Separating our army into Flemish and Walloon divisions might be the only way to solve the language divide that runs through our army. Flemish divisions would get their orders in Dutch and Walloon divisions in French. Central Command would take up the task of writing orders in both languages.
 BEL_goal_defensive_doctrine: "Оборонительная доктрина" # Defensive Doctrine
 BEL_goal_defensive_doctrine_desc: "Следование оборонительной доктрине – лучший способ выиграть будущие войны. Если обескровить врага в наших фортах и ​​укрепленных линиях, он поставится на колени, что позволит нашей армии в конце концов одержать победу." # Following a defensive doctrine is the best way to win future wars. Bleeding the enemy dry on our forts and fortified lines will bring them on their knees, allowing our army to be victorious in the end.
 BEL_goal_offensive_doctrine: "Наступательная доктрина" # Offensive Doctrine
 BEL_goal_offensive_doctrine_desc: "Хотя наша армия может быть небольшой, специализация на атаке может стать способом застать врасплох наших врагов. Наступательная доктрина – это то, что нам нужно, если мы хотим победить наших врагов." # While our army might be small, specializing in attack might be a way to surprise our enemies. An offensive doctrine is what we need if we want to overcome our enemies.
 BEL_goal_prepare_next_war: "Готовьтесь к следующей войне" # Prepare for the Next War
 BEL_goal_prepare_next_war_desc: "Многие думали, что Великая война станет войной, которая положит конец всем войнам, но стало ясно, что в Европе разразится новая война. Нам нужно подготовить нашу армию, чтобы снова защитить нашу страну." # Many thought the Great War was the war to end all wars, but it has become clear that a new war will break out in Europe. We need to prepare our army to once again defend our country.
 BEL_goal_modernize_liege_forts: "Модернизация пояса Льежских фортов" # Modernize the Liège Fort Belt
 BEL_goal_modernize_liege_forts_desc: "Во время Великой войны пояс фортов Льежа продержался дольше, чем ожидали немцы, но в конце концов они оказались слишком старыми для современных технологий и ведения войны. Если мы их модернизируем, они могут снова стать жизнеспособным оборонительным поясом вокруг Льежа." # In the Great War, the Liège fort belt held out longer than the Germans expected, but in the end, they were too old for modern technology and warfare. If we modernize them, they might become a viable defensive belt around Liège again.
 BEL_goal_fortify_french_border: "Укрепите французскую границу" # Fortify the French Border
 BEL_goal_fortify_french_border_desc: "Укрепление французской границы — следующий шаг в защите нашей страны. Недавние события во французской политике заставили многих бельгийских политиков задуматься, а не Германия ли главная опасность, а Франция." # Fortifying the French border is the next step in the defence of our country. Recent developments in French politics have many Belgian politicians wondering if the main danger isn't Germany, but France.
 BEL_goal_fortify_meuse: "Укрепить реку Маас" # Fortify the Meuse River
 BEL_goal_fortify_meuse_desc: "Река Маас является естественной линией обороны от врагов с востока. Размещение фортов по всему западному берегу может оказаться полезным, если Германия решит снова вторгнуться в нашу страну." # The Meuse river is a natural defensive line against enemies from the east. Putting forts all along the west bank might prove useful if Germany would choose to invade our country again.
 BEL_goal_modernize_antwerp_forts: "Модернизация пояса фортов Антверпена" # Modernize the Antwerp Fort Belt
 BEL_goal_modernize_antwerp_forts_desc: "Во время Великой войны форты вокруг Антверпена были жизненно важны для выживания бельгийской армии и позволили ей отступить в Западную Фландрию, где она продержалась пять лет до конца войны. Форты сильно повреждены и устарели, поэтому их модернизация — единственный способ снова использовать их в будущей войне." # During the Great War, the forts around Antwerp were vital to the survival of the Belgian army and allowed them to retreat to West-Flanders where they held out for five years until the end of the war. The forts have been heavily damaged and are outdated, modernizing them is the only way they can be used again in a future war.
 BEL_goal_small_arms: "Фонд FN Herstal Research" # Fund FN Herstal Research
 BEL_goal_small_arms_desc: "Стрелковое оружие так же важно, как и сами солдаты. Инвестиции в лучшее оборудование и более оптимизированное производство жизненно важны для бельгийской военной машины, особенно когда в этом участвует FN Herstal и наша промышленность может получить прибыль от финансируемых исследований." # Small arms are as important as the soldiers themselves. Investing in better equipment and a more streamlined production is vital to the Belgian war machine, especially when FN Herstal is involved and our industry can profit from funded research.
 BEL_goal_artillery: "Артиллерийский фокус" # Artillery Focus
 BEL_goal_artillery_desc: "Артиллерия – основа любой хорошей армии. Артиллерия прорывает линию противника и расчищает путь пехоте, чтобы продвинуться и завершить начатое." # Artillery is the backbone of any good army. Artillery breaks through the enemy lines and clears the way for infantry to move in and finish the job.
 BEL_expand_the_acedemy_of_brussels: "Расширить Академию Брюсселя" # Expand the Academy of Brussels
 BEL_expand_the_acedemy_of_brussels_desc: "Академия в Брюсселе является центром нашего офицерского корпуса, где готовят многих младших офицеров и стратегов, которые формируют нашу армию. Увеличивая финансирование этого органа, мы можем гарантировать, что он продолжит выпускать выпускников высшего класса. Однако также вероятно, что эта модернизация приведет к усилению доктринальных разногласий между различными школами мысли. Еще неизвестно, что станет ортодоксальностью." # The academy at Brussels is the centre of our officer corps, training many of the junior officers and strategists who shape our military. By pouring increased funding into the body, we can ensure it continues to push out top class graduates. However, is also likely that this modernisation will lead to increased doctrinal squabbling between the various schools of thought. It remains to be seen which will emerge as the orthodoxy.
 BEL_integrated_communication: "Интегрированные коммуникации" # Integrated Communications
 BEL_integrated_communication_desc: "Современные войны все чаще ведутся с помощью радио, радаров и вычислительных машин. Поэтому для нашей программы модернизации крайне важно, чтобы мы приобретали и разрабатывали новые достижения в этих областях и чтобы наши силы, вплоть до каждой роты, проходили обучение их использованию." # Modern wars are increasingly fought with the help of radio, radar and computing machines. It's therefore crucial for our modernisation programme that we procure and develop new advances in these fields and that our forces, down to every company, receive training in their use.

