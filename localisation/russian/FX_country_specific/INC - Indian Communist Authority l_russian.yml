### Events
 inc.01.t: "Народный фронт" # The People's Front
 inc.01.d: "Мы должны действовать быстро. Сейчас в Индии действует множество сил, и даже когда мы отделяемся от тех, кто пытался нас угнетать, весь субконтинент оказался в состоянии неопределенности. Радж распадается; люди, над которыми он так долго издевался, наконец-то забирают обратно то, что принадлежит им. Там, где националистическое восстание потерпело неудачу, политическая и военная власть, которую они нам добровольно дали, не исчезнет. Миллионы и миллионы людей уже собрались под нашим флагом, и мы можем с радостью сообщить, что вся Бенгалия теперь находится под нашим контролем. Однако это может длиться недолго. Радж все еще переживает свой крах, но если он выживет, он будет жаждать мести. А это будет означать войну против нас. Точно так же, что бы ни родилось из трупа Раджа, несомненно, будет оспаривать наши претензии на страну. Но они забывают себя. Эта земля принадлежит Народу, а не какой-либо иностранной империи или экономическому магнату. Народ будет руководить нашим завоеванием и поведет Индию в новое светлое будущее." # We must move quickly. There are many forces at play in India now, and even as we break away from those who have sought to oppress us, the entire subcontinent has been thrown into uncertainty. The Raj is fracturing; the people it has abused for so long are finally taking back what is theirs. Where the nationalistic rebellion failed, the political and military power they willingly gave us will not. Millions upon millions have already flocked to our flag, and we can be happy to say that all of Bengal is now under our control. This may not last for long, though. The Raj is still dealing with its own collapse, but should it survive, it will seek revenge. And that will mean war against us. Likewise, whatever else births itself from the Raj's corpse will undoubtebly contest our claim to the country. But they forget themselves. This land belongs to the People, not to any foreign empire or economic magnate. The People will guide our reconquest, and lead India into a bright new future.
 inc.01.a: "Слава Народу!" # Glory to the People!

 inc.02.t: "Первый Народный Конгресс" # The First People's Congress
 inc.02.d: "Величайшие социалистические деятели со всей Индии собрались сегодня в Дакке на первый первый Народный Конгресс. Возможно, оно не будет сопровождаться таким величием, как мы могли бы надеяться, но сейчас наступили неотложные времена. Стервятники остаются на нашем пороге, готовые напасть, как только мы проявим первые признаки слабости. Этот Конгресс будет иметь важное значение для сохранения воли народа и планирования нашего окончательного завоевания субконтинента. Ее важность невозможно переоценить." # The greatest socialist figures from across India have gathered today in Dhaka for the first inaugural People's Congress. It might not be accompanied by as much grandeur as we might hope, but these are pressing times. Vultures remain on our doorstep, ready to attack as soon as we show the first sign of weakness. This Congress will be essential to preserving the will of the People and planning our ultimate reconquest of the subcontinent. Its importance cannot be overstated.
 inc.02.a: "Пусть Конгресс начнется!" # Let the Congress begin!

 inc.10.t: "Народное завоевание Индии" # The People's Reconquest of India
 inc.10.d: "Поскольку Индия расколота, империи мира клюют на нас, как стервятники. Только их собственные распри не позволили им воспользоваться моментом, чтобы снова напасть на нас и завоевать нас. Разделенная Индия не будет иметь шансов. Но объединившись... мы могли бы стать самой могущественной нацией рабочих, которую когда-либо видел мир! Народ больше не будет скован цепями своих завоевателей. Давайте мобилизуем нашу армию и зарядим винтовки. Принцы, претендующие на господство над народами Индии, скоро познают наш гнев, и вскоре... народное завоевание Индии увенчается успехом." # With India fractured, the empires of the world pick at us like vultures. Only their own infighting has prevented them from seizing the moment to attack and conquer us once more. Divided, India will not stand a chance. But united...we could become the most powerful nation of workers the world has ever seen! The people shall no longer be held down by the chains of their conquerors. Let us mobilize our army, and load our rifles. The Princes that claim dominion over the peoples of India will soon know our wrath, and before long...the people's reconquest of India will succeed.
 inc.10.a: "Да здравствует Индия!" # Long live India!

