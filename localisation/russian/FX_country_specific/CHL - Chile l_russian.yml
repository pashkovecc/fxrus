l_russian:

 CHL_FUHRERREICH_DESC: "Для страны, которая не участвовала в Великой войне, годы показали, что то, что произошло во время нее, сильно повлияло на Чили. Возникновение новых процессов, позволяющих синтезировать удобрения, разрушило основу ее экономики, поскольку долгосрочные социальные проблемы оставались без ответа, а шанс на реформы был заблокирован недружественной и неэффективной парламентской системой, народ Чили начал терять веру в систему, и страна представляет собой лишь тень того, чем она была 20 лет назад." # For a nation that didn't fight in the Great War, the years showed that what happened during it greatly affected Chile. The rise of new processes that allow the synthesis of fertilizers demolished the core of its economy, as the long-coming social issues were kept unanswered and chance of reform was blocked by the unfriendly and unefficient parlamentary system, the people of Chile have began losing faith in the system, and the country is only but a shade of what it was 20 years ago.

