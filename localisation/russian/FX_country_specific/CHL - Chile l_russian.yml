### Events
 chl.1.t: "Нация на коленях" # A Nation on its Knees
 chl.1.d: "До Великой войны наша нация была сильной и находилась на подъеме, никто не мог говорить о Южной Америке, не упомянув Чили как одну из ее держав, и мы были на пути к величию, по крайней мере, мы так думали. Слабая парламентская система, которая нами управляла, сделала нас восприимчивыми к переменам и медленными в реформах, а также заглушила голос народа. \nНо во время Великой войны селитра, источник жизненной силы нашей экономики, перестала быть востребованным ресурсом. Сейчас наша экономика находится в упадке, и ошибки нашего правительства более заметны, чем когда-либо. Наш народ почти потерял веру в демократию и ищет лидера, который сможет принести перемены и снова вернуть нашу падшую нацию к ее славной судьбе. Мы должны быть осторожны, потому что набирают силу экстремистские движения, и люди будут искать любой способ, чтобы его голос был услышан, будь то разумом или силой. Тем временем деятели и политические деятели обдумывают, как прийти к власти. Какой путь выберет Чили?" # Before the Great War, our nation was strong and on the rise, no one could talk of South America before mentioning Chile as one of its powers, and we were on the path to greatness, or so we thought. The weak parlamentary system that has been rulling us has made us susceptible to change and slow to reform, and has hushed the voice of the people. \nBut during the Great War, Saltpetre, the lifeblood of our economy, stopped being a sought after resource. Now our economy is on the floor and the faults on our government are more visible than ever. Our people have almost lost faith in democracy and are seeking a leader that can bring the changes to lift up our fallen nation to its glorious fate again, we must be careful cause extreme movements are on the rise and the people will seek any way to have its voice heard, be it by reason, or by force. Meanwhile, figures and political actors scheme how to reach power. What path will Chile take?
 chl.1.a: "Мы должны быть едины в самой нижней точке." # We must stand united at our lowest point.
 chl.2.t: "Критическая точка" # A Critical Point
 chl.2.d: "Несмотря на то, что правительство сделало все возможное, используя те немногие силы, которые у него были, чтобы исправить нашу экономику во время этого кризиса, чилийский народ все еще сильно пострадал от его обстоятельств, и это все еще остается, поскольку политическая поляризация усилилась, никто не был удивлен, когда люди вернулись в экстремистские группы, чтобы вернуть свои надежды и мечты о лучшем будущем.\n Марш на Сантьяго произошел, когда тысячи недовольных чилийцев объединились под знаменем Валькистас, обещая национальное возрождение и правительство, которое действительно представляет дух нации; и руководство Хорхе «Эль-Хефе» Гонсалеса фон Мареса объединились и двинулись в Ла-Монеду, в то время как правительство было загнано в угол, и ему некуда было бежать." # While the government has done what it can with the few power it has to amend our economy during this crisis, the Chilean people has still been greatly affected by its circumstances and it still is, as political polarization increased, no one was surprised as people recurred to extremist groups to reclaim their hopes and dreams of a a better future.\n The March on Santiago occurred, as thousands of disconent chileans, united under the banner of the Valquistas, promising a national rebirth, and a government that truly represents the spirit of the nation; and the leadership of Jorge "El Jefe" González Von Marées, stood together and marched their way into La Moneda, as the government was backed into a corner, with no place left to run.
 chl.2.a: "Готовая к кризису, армия быстро вмешалась и остановила марширующих валкистов." # Prepared for the crisis, the Army quickly intervened and stopped the Marching Valkists.
 chl.2.b: "Марш на Сантьяго увенчался успехом: Чили идет под знаменем Валькисмо." # The March on Santiago Succeeds, as Chile walks under Valquismo's banner.
 chl.2.c: "Нация возьмет под контроль свою судьбу, вырвавшись из когтей мира!" # The nation will take control of its own destiny, off the world's claws!
 chl.3.t: "Выборы 1940 года" # Elections of 1940
 chl.3.d: "Еще совсем недавно казалось, что демократия рухнула, и наша страна была на грани разрушения, однако теперь демократия оказалась подходящей системой для нашего народа и традицией в нашей стране, и наша страна обрела давно утраченную стабильность. Пришло время демократии выбрать нашего нового лидера, поскольку срок полномочий Монтеро подошел к концу. За кого будет решать народная воля? Какая идеология будет руководить нашим народом в этом опасном мире?" # So little ago it seemed like democracy had collapsed and our country was on the verge of ruin, now however, democracy has been proven to the right system for our people and a tradition in our nation, and our country has found its long lost stability. Time has come for democracy to pick our new leader, as Montero's term has come to an end. Who will the people's will decide for? What ideology will guide our people in this dangerous world?
 chl.3.a: "Эдуардо Круз-Кокс, кандидат ПК, консерватор, но реформист." # Eduardo Cruz-Coke, PC's candidate, Conservative yet reformist.
 chl.3.b: "Густаво Росс, кандидат от ЛП, известный экономист и сторонник свободного рынка" # Gustavo Ross, PL's candidate, prominent economist and free-market advocate
 chl.3.c: "Мармадюк Гроув, кандидат от PS, бывший военный и демократический социалист." # Marmaduque Grove, PS's candidate, former military man & democratic socialist.
 chl.3.e: "Хуан Антонио Риос, кандидат от ПР, реформист и фаворит на смену Монтеро." # Juan Antonio Rios, PR's candidate, reformist and favourite to succeed Montero.
 chl.4.t: "Военные останавливают Валкистов" # The military stops the Valquistas
 chl.4.d: "Армия теперь может решить, по какому пути пойдет Чили, в то время как многие довольствуются тем, что являются защитниками Республики, значительная группа среди высшего командования, возглавляемая генералом Карлосом Ибаньесом дель Кампо, чувствует, что, возможно, Чили нужна более сильная направляющая рука, чтобы преодолеть нынешний хаос, видя многочисленные неудачи прошлых правительств. Трудно утверждать, что могло быть и хуже." # As the Army steps in and succesfully fights off the Valquistas, driving the extremists away from power, different military factions realize the situation they are in. The Army can now decide what path will Chile take, while many are content with being the protectors of the Republic, a sizeable group amongst the high command, lead by General Carlos Ibañez del Campo, feel that maybe Chile needs a stronger guiding hand, to get through its current chaos, seeing the multiple failures of the past governments, it is hard to argue it could go worse.
 chl.4.a: "Мы должны защищать правительство республики, как и ее демократию." # The republic's government is for us to defend, as is its democracy.
 chl.4.b: "Более сильное руководство, возможно, сможет наконец решить наши проблемы." # A stronger leadership may be able to finally solve our problems.
 chl.10.t: "Коммунистические демонстрации" # Communist Demonstrations
 chl.10.d: "По мере того как наша власть над политической базой нашей страны растет, экстремисты недовольны нашими успехами. Некоторые крайне левые группы, такие как Коммунистическая партия, начали демонстрации на улицах, перекрывая движение транспорта и прерывая запланированное выступление нашего генерала. Нельзя допустить такого рода неповиновение власти, особенно когда оно нарушает естественный порядок вещей в нашей стране." # As our hold on the political base of our nation grows, extremists are unhappy at our success. Some far left groups, of the likes of the Communist Party have began demonstrations on the streets, cutting off traffic and interrupting a planned speech by our General. This kind of defiance against authority can't be allowed, specially when it interrupts the natural order of our country.
 chl.10.a: "Укрепите безопасность на улицах и продолжайте политические усилия Ибаньеса." # Strenghten security in the streets and continue with Ibañez's political effort.
 chl.10.b: "Экстремисты слишком опасны, давайте просто будем вести против них пропаганду." # The extremists are too dangerous, let's just spread propaganda against them.
 chl.13.t: "Карлос Ибаньес убит!" # Carlos Ibañez is assassinated!
 chl.13.d: "Речь прошла так, как было задумано, наши люди были довольны, все аплодировали, чувствуя себя счастливыми под крылом генерала, или им так казалось. Но когда мероприятие подходило к концу, крайне левые группы начали демонстрацию на улице за углом. Зная, в какой опасности он находится, генерал приготовился уйти, однако один из повстанцев подобрался близко и смог выстрелить Ибаньесу в голову. Боевика расстреляли на месте, но произошла трагедия. Наш генерал мертв. Высшее военное командование взяло под свой контроль страну в этот час скорби." # The speech went as intended, our people were content, everyone was cheering, feeling happy protected under the General's wing, or so they thought they were. But as the event was coming to an end, the extreme left groups began demonstrating in the street around the corner, knowing the danger he was in, the general prepared himself to leave, however, one of the insurgents got close and was able to shoot Ibañez in the head. The insurgent was shot on the spot, but a tragedy has ocurred. Our general is dead. The military high command has taken control of the nation in this hour of sorrow.
 chl.13.a: "Граль. Бланш обещает вернуть демократию в республику." # Gral. Blanche promises to bring democracy back to the republic.
 chl.13.b: "Граль. Бланш вводит военное положение, и военный режим сохраняется." # Gral. Blanche establishes martial law and the military regime continues.
 chl.14.t: "Социальный вопрос." # The Social Question.
 chl.14.d: "Пока нация ожидает следующих выборов и возвращения демократии, генерал Бланш сделал все возможное, чтобы защитить нашу страну от хаоса, особенно в связи с ростом повстанческих сил, недовольных военным режимом. Теперь у всех на уме вопрос; Что будет с Мармадюк-Гроув и социалистической партией? Гроув, будучи ярым критиком диктатуры, высказался и заявил, что не поддерживает радикальные группировки, ответственные за смерть генерала Ибаньеса. Тем не менее, в эти смутные времена недоверие к его партии возросло." # As the nation anticipates the next elections and the return of democracy, General Blanche has done what he can to protect our nation from falling into disarray, specially with the rise of rebellious forces unhappy with the military's regime. Now, a question is in everyone's minds; What will be of Marmaduque Grove and the socialist party?. Grove, while a loud critic of the dictatorship, has spoken out and said he doesn't support the radical groups responsible for the death of General Ibañez. Nonetheless, distrust to his party has increased during these troubled times.
 chl.14.a: "Социалисты Гроува — это именно те левые, которые нам нужны, а не эти экстремисты." # Grove's Socialists are exactly the kind of left we need, instead of those extremists.
 chl.14.b: "Рост левых только навредил нам, и рана все еще открыта, давайте лучше запретим социалистам участвовать." # The growth of the left only has hurt us, and the wound is still open, let's better ban the socialists from participating.
 chl.15.t: "Возвращаясь к демократии." # Returning to democracy.
 chl.15.d: "Мы прошли через так много за такое короткое время. Демократия была на грани краха, наша экономика была мертва и похоронена. Но посмотрите на нас сейчас: мы пережили как опасных экстремистов, так и непреодолимые диктатуры, по крайней мере, до прихода генерала Бланша. И теперь демократия готова вернуться домой, может быть, дела наконец-то пойдут к лучшему, но вопрос в том; За кого будет решать народная воля? Какая идеология будет руководить нашим народом в этом опасном мире?" # We have gone through so much in so little time. Democracy was on the verge of failing, our economy was dead and buried. But look at us now, we have survived dangerous extremists as well as unestable dictatorships, at least until General Blanche came. And now democracy is ready to come back home, maybe things will finally turn out for the better, but the question is; Who will the people's will decide for? What ideology will guide our people in this dangerous world?
 chl.15.a: "Эдуардо Круз-Кокс, кандидат ПК, консерватор, но реформист." # Eduardo Cruz-Coke, PC's candidate, Conservative yet reformist.
 chl.15.b: "Густаво Росс, кандидат от ЛП, известный экономист и сторонник свободного рынка" # Gustavo Ross, PL's candidate, prominent economist and free-market advocate
 chl.15.c: "Мармадюк Гроув, кандидат от PS, бывший военный и демократический социалист." # Marmaduque Grove, PS's candidate, former military man & democratic socialist.
 chl.15.e: "Хуан Антонио Риос, кандидат от ПР, реформист и фаворит на смену Монтеро." # Juan Antonio Rios, PR's candidate, reformist and favourite to succeed Montero.
 chl.16.t: "Возвращаясь к демократии." # Returning to democracy.
 chl.16.d: "Мы прошли через так много за такое короткое время. Демократия была на грани краха, наша экономика была мертва и похоронена. Но посмотрите на нас сейчас: мы пережили как опасных экстремистов, так и непреодолимые диктатуры, по крайней мере, до прихода генерала Бланша. И теперь демократия готова вернуться домой, может быть, дела наконец-то пойдут к лучшему, но вопрос в том; За кого будет решать народная воля? Какая идеология будет руководить нашим народом в этом опасном мире?" # We have gone through so much in so little time. Democracy was on the verge of failing, our economy was dead and buried. But look at us now, we have survived dangerous extremists as well as unestable dictatorships, at least until General Blanche came. And now democracy is ready to come back home, maybe things will finally turn out for the better, but the question is; Who will the people's will decide for? What ideology will guide our people in this dangerous world?
 chl.16.a: "Эдуардо Круз-Кокс, кандидат ПК, консерватор, но реформист." # Eduardo Cruz-Coke, PC's candidate, Conservative yet reformist.
 chl.16.b: "Густаво Росс, кандидат от ЛП, известный экономист и сторонник свободного рынка" # Gustavo Ross, PL's candidate, prominent economist and free-market advocate
 chl.16.c: "Хуан Антонио Риос, кандидат от ПР, реформист и фаворит на смену Монтеро." # Juan Antonio Rios, PR's candidate, reformist and favourite to succeed Montero.
 chl.17.t: "Предложение из Чили." # An offer from Chile
 chl.17.d: "Наши страны пережили не лучшие моменты вместе, и раны заживают медленно, однако чилийский режим разделяет наши взгляды и верит, что взаимовыгодный пакт может быть заключен. Хотя наши собственные национальные интересы стоят на первом месте, у нас есть враги, и такая дружба действительно может быть лучшим решением для нашей страны." # Our nations have not had the best moments together, and wounds are slow to heal, however, the Chilean regime is of similar mind to us, and believes a mutually benefitial pact could be made. While our own national interests stand first, we are not without enemies, and such friendship may indeed be the best decision for our nation.
 chl.17.a: "Мы согласны на этот пакт." # We agree to this pact.
 chl.17.b: "Перу не нужны друзья." # Peru doesn't need friends.
 chl.18.t: "Перу соглашается на пакт!" # Peru agrees into the pact!
 chl.18.d: "Дипломаты прибыли с новостями. Перу согласилось заключить пакт с нашей страной, они тоже видят, что для нас обоих лучше установить такие связи." # The diplomats have arrived with news. Peru has agreed into forming a pact with our nation, they too, see that this is better for both of us, to form such ties.
 chl.18.a: "Они, кажется, умные." # They are smart, it seems.
 chl.19.d: "Пришло предложение из Чили. Возможно, у нас не так уж много связей, дружеских или иных, но чилийский режим разделяет наши взгляды и верит, что можно заключить взаимовыгодный пакт. Хотя наши собственные национальные интересы стоят на первом месте, у нас есть враги, и такая дружба действительно может быть лучшим решением для нашей страны." # An offer has arrived from Chile. We may not have a lot of ties, friendly or otherwise, but the Chilean regime is of similar mind to us, and believes a mutually benefitial pact could be made. While our own national interests stand first, we are not without enemies, and such friendship may indeed be the best decision for our nation.
 chl.19.a: "Мы согласны на этот пакт." # We agree to this pact.
 chl.19.b: "Венесуэле не нужны друзья." # Venezuela doesn't need friends.
 chl.20.t: "Венесуэла соглашается на пакт!" # Venezuela agrees into the pact!
 chl.20.d: "Дипломаты прибыли с новостями. Венесуэла согласилась заключить пакт с нашей страной, они тоже видят, что для нас обоих лучше установить такие связи." # The diplomats have arrived with news. Venezuela has agreed into forming a pact with our nation, they too, see that this is better for both of us, to form such ties.
 chl.20.a: "Они, кажется, умные." # They are smart, it seems.
 chl.21.t: "Чили приглашает нас" # Chile Invites Us
 chl.21.d: "Наши страны пережили не лучшие моменты вместе, войны все еще в нашей памяти, но сейчас более чем когда-либо Южная Америка находится на грани конфликта, и чилийское правительство считает, что оборонительный союз может помочь нашим странам в эти трудные времена, и призывает нас держаться вместе." # Our nations have not had the best moments together, the wars still in our memory, but now more than ever South America is on the edge of blowing into conflict, and the Chilean government believes a defensive alliance could help for our countries during these difficult times, and is inviting us to stand together.
 chl.21.a: "Демократические страны должны держаться вместе." # Democracies must stand together.
 chl.21.b: "Возможно, это не лучший ход." # This may not be the best move.
 chl.22.t: "Перу соглашается вступить в наш союз!" # Peru agrees into our alliance!
 chl.22.d: "Дипломаты прибыли с новостями. Перу согласилось сформировать оборонительный союз с нашей страной. Сейчас, как никогда ранее, демократические страны едины во время предстоящего конфликта." # The diplomats have arrived with news. Peru has agreed into forming a defensive alliance with our nation. Now more than ever, democracies are united during this time of upcoming conflict.
 chl.22.a: "Сегодня мы стоим вместе." # Today, we stand together.
 chl.23.t: "Чили приглашает нас" # Chile Invites Us
 chl.23.d: "Наши дипломаты информируют нас о неотложном вопросе. Поскольку дипломатическая напряженность в регионе возрастает, чилийское правительство считает, что оборонительный альянс может помочь нашим странам в эти трудные времена, и призывает нас держаться вместе." # Our diplomats are informing us of a pressing matter. As the diplomatic tension in the region escalates, the Chilean government believes a defensive alliance could help for our countries during these difficult times, and is inviting us to stand together.
 chl.23.a: "Демократические страны должны держаться вместе." # Democracies must stand together.
 chl.23.b: "Возможно, это не лучший ход." # This may not be the best move.
 chl.24.t: "Эквадор соглашается вступить в наш союз!" # Ecuador agrees into our alliance!
 chl.24.d: "Дипломаты прибыли с новостями. Эквадор согласился сформировать оборонительный союз с нашей страной. Сейчас, как никогда ранее, демократические страны едины во время предстоящего конфликта." # The diplomats have arrived with news. Ecuador has agreed into forming a defensive alliance with our nation. Now more than ever, democracies are united during this time of upcoming conflict.
 chl.24.a: "Сегодня мы стоим вместе." # Today, we stand together.

 chl.1000.t: "Толпа воссоединяется на собрании валкистов" # Crowd Reunites in Valkist Gathering
 chl.1000.d: "Поскольку народное недовольство продолжает расти в нашей стране, количество валькистов, собирающихся по всей стране, растет. Подпитываемая сильным пренебрежением к демократии и опасной риторикой, которая сочетает в себе превознесение былой славы Чили с прогрессивным, футуристическим мышлением, группа набрала обороты в последние несколько лет, особенно когда валькизм укрепляет свои позиции в Германии. \nИх самое большое собрание за всю историю, как это произошло, когда Гонсалес фон Мареес выступил с резкой речью против демократии. «Избранные лидеры здесь не принадлежат, ни один из них не может понять и разделить политический дух нашей единой нации, они принадлежат давно ушедшей эпохе, как и их республиканская система. Отбросив свою систему, Чили сможет позволить своему голосу быть услышанным», - так толпа приветствовала «Эль хефе», как они называют Гонсалеса." # As popular discontent continues accruing in our nation, the size of valkist gathering all around the country grows. Fueled by a strong contempt against democracy, and a dangerous rhetoric that mixes exaltation of Chile's past glory with a progressive, futurist mindset, the group has gained traction in the last few years, specially as valkism solidifies its hold in Germany.\nTheir largest gathering yet as occurred as González Von Marées gave a strong speech against democracy. "The elected leaders don't belong here, not one of them can understand nor share the political spirit of our united nation, they belong to a era far begone, as their republican system does. Throwing off their system Chile can let its voice be heard.", as the crowds cheered for "El jefe", as they call González.
 chl.1000.a: "Возможно, республика потерпела крах." # Maybe the republic has failed.
 chl.1000.b: "Лучше осудите его выступление в газетах." # Better censure his speech in the newspapers.
 chl.1001.t: "Провоенные настроения растут" # Pro-Military Sentiment Growing
 chl.1001.d: "Напряженность в нашей стране возрастает, поскольку небольшие газеты публикуют предполагаемые разговоры между армейскими офицерами, обсуждающими вопрос о захвате власти, если нынешний режим не сможет улучшить ситуацию, и быстро распространяются между различными СМИ. \nХотя военные защищали нашу власть во времена нестабильности, многие подозревают, что высшее командование потеряло веру в наше правительство. Эта идея, хотя и новая, побудила многих граждан выразить свою поддержку военным, доходя до того, что просили их освободить нашу страну. Ни один чиновник не прокомментировал ситуацию." # Tension increases in our nation as a small newspapers published supposed conversations between army officers discussing taking over if the current regime fails to improve the situation, quickly spreading between different media. \nWhile the military protected our rule in times of unstability, many suspect the high command has lost faith in our government, this idea, while new, has caused a lot of citizens to express their support for the military, going as far as asking them to liberate our country. No officer has commented on the matter.
 chl.1001.a: "Возможно, этой стране нужно более сильное силовое правление." # Maybe a stronger force ruling is what this country needs.
 chl.1001.b: "Армия не подчиняется правительству? Нелепый!" # The Army disobeying the government? Ridiculous!
 chl.1002.t: "Мануэль Рохас бросает вызов валкизму" # Manuel Rojas challenges Valkism
 chl.1002.d: "Известный поэт, писатель и политический деятель Мануэль Рохас недавно опубликовал работу, в которой критикует валькизм и все, что за ним стоит. Назвав это «расплывчатым, популистским и обманом заставляющим людей не осознавать истинных социальных проблем», он вызвал множество различных реакций среди населения. \nСам Мануэль также критиковал наше правительство, хотя и не осуждал демократию, как это сделали валкисты. Это в сочетании с его участием в более крайних позициях Социалистической партии делает его фигурой, к которой следует относиться с осторожностью, многие опасаются, что он может скрывать столь же крайние намерения, как и сами валькисты." # Known poet, writer, and political figure Manuel Rojas has recently published a work in which he critizes Valkism and all that it stands for. Qualifying it as "vague, populistic, and tricking the people into not realizing the true social issues", he has caused many differing reactions amongst the population. \nManuel himself has been critical of our government as well, even if not denouncing democracy as the valkists have. That combined with his participation in the more extreme stands of the Socialist Party, makes him a figure to be careful about, many worrying he might be hiding intentions as extreme as the valkists themselves.
 chl.1002.a: "Не всех так легко обмануть валькизмом." # Not everyone is fooled so easily by Valkism.
 chl.1002.b: "Мы предпочитаем революционеров, которые думают в первую очередь о Чили." # We prefer revolutionaries that think of Chile first and foremost.
 chl.1003.t: "Принят законопроект об экономической и финансовой реструктуризации" # Economical & Financial Readjustment bill passed
 chl.1003.d: "Новый законопроект президента Монтеро о реструктуризации был принят парламентом, в том редком случае, когда представители не слишком откладывали его принятие. Законопроект устанавливает некоторые льготы для свободных инвестиций и прощает часть долгов беднейшим слоям населения. Это долгожданная попытка вернуть нашу экономику на ноги, но она до сих пор подвергается широкой критике за то, что она слишком слабая и не делает больше для нашей экономики. \n\n Когда представители покидали здание конгресса, Хорхе Сильва Сомаррива, депутат Либеральной партии и защитник законопроекта, подвергся нападению со стороны группы мужчин в коричневых рубашках, которые обвинили его в пренебрежении социальными проблемами и отравлении нации. Когда охранники здания пришли к нему на помощь, он остался практически невредимым, но мужчинам удалось скрыться. Поляризация и насилие в нашем обществе достигают критической точки." # President Montero's new readjustment bill has been passed by the parliament, in a rare occasion of the representatives not delaying it too much. The Bill establishes some benefits to free investment and forgives some of the debts of the poorer. A welcome attempt to bring our economy back on foot, it still has been widely critizised for being too slight and not doing more for our economy. \n\n As the representatives were leaving the congress building, Jorge Silva Somarriva, Liberal Party deputy, and defender of the bill, was harrassed by a group of men on brown shirts, who accused him of not caring for the social issues and poisoning the nation. As the building's guards came for his help, he resulted mostly unharmed, but the men escaped. The polarization and violence in our society is reaching a critical point.
 chl.1003.a: "Мы должны быть осторожными в управлении экономикой: насилию нет оправдания." # We must be prudent while handling the economy, there is no justification to violence.
 chl.1003.b: "Политики, которые прячутся от проблем, будут привлечены к ответственности, народ недоволен." # Politicians that hide from the problems will be held accountable for, the people is unhappy.
 chl.1004.t: "В Палате депутатов начались дебаты после принятия Закона о солидарном труде" # Debate ensues on Chamber of Deputies as Solidary Labour Law is passed
 chl.1004.d: "Ранее был принят Закон о солидарном труде, защищающий сотрудников от злоупотреблений при сверхурочной работе и от гнусных контрактов, которые можно считать оскорбительными. Хотя многие представители Социалистической партии это приветствовали, некоторые представители Социалистической партии были разочарованы небольшими рамками закона. Это переросло в ожесточенный спор между сенатором Консервативной партии Эктором Родригесом де ла Сотта и сенатором Социалистической партии Оскаром Шнаке, который позже обвинил первого в умышленном блокировании любой попытки провести более обширные реформы. В конце концов спор утих, поскольку ни один из представителей не разговаривал друг с другом до конца дня, но атмосфера на конгрессе сохранялась напряженной." # Earlier, the executive's Solidary Labour Law passed, protecting employees from abuse in overtime working and from nefarious contracts that may be considered abusive. While celebrated by many, some of the Socialist Party's representatives were disappointed by the little extent of the law, this devolved into a heated argument between Conservative Party's senator Hector Rodriguez de la Sotta and Socialist Party's senator Oscar Schnake, as the later accused the former of deliberatingly blocking any attempt to pass more extensive reforms. Finally the argument settled down as neither of the representatives talked to the other for the rest of the day, but the air was kept tense in the congress.
 chl.1004.a: "Столько споров и конфликтов между политиками, что же остается народу?" # So many arguments and conflicts between politicians, what is left for the people?
 chl.1005.t: "Рабочие бастуют и маршируют" # Workers go on strike and march
 chl.1005.d: "Необъявленное событие: рабочие объявили забастовку и начали марш сегодня в Ньюоа, поскольку улицы были заполнены недовольными рабочими, атмосфера этого движения отличалась от предыдущих манифестаций. Например, не было замечено никакой поддержки основных левых партий, хотя некоторые мужчины, одетые в коричневые рубашки, были среди ведущих фигур демонстрации. Хотя были замечены высказывания против политической системы республики и измены правящей партии чилийскому народу, к счастью, манифестации закончились, не перерастая в насилие." # An unannounced development, workers went on strike and began marching today in Ñuñoa, as the streets were filled by the discontented workers, the air of this movement was different from previous manifestations. No support for the major left-wing parties was seen, for instance, although some men dressed in brown shirts were amongst the demonstration leading figures. Although discourse against the republic's political system and of treason by the ruling party against the chilean people was seen, luckily the manifestations finished without devolving into violence.
 chl.1005.a: "Похоже, Чили знает, чего хочет." # Chile knows what it wants, it seems.
 chl.1005.b: "Перемены не приходят быстро, но республика — единственная, кто может их осуществить." # Change doesnt come fast, but the republic is the only one that can bring it.
 chl.1006.t: "Президент встретился с главнокомандующим армией" # President meets with Commander-in-Chief of the Army
 chl.1006.d: "Ранее сегодня президент Монтеро встретился с главнокомандующим армией Луисом Альтамирано в Ла-Монеде. Эта встреча, видимо, была организована спонтанно, так как ее не было в расписании президента, но длилась несколько часов, и можно только предполагать, что обсуждались темы, касающиеся национальной безопасности, поскольку после встречи Монтеро решил освободить свое расписание на остаток дня. Будем надеяться, что это не проблема." # Earlier today, President Montero reunited with Commander-in-Chief of the Army Luis Altamirano in La Moneda. This meeting was apparently spontaneously arranged, as it wasnt on the president's schedule, but lasted for a few hours and we only can assume topics concerning national security were discussed, as after the meeting, Montero decided to clear his schedule for the rest of the day. Let us hope this isn't a concern.
 chl.1006.a: "Этой стране нужна стабильность, возможно, армия могла бы помочь." # This country needs some stability, maybe the Army could help.
 chl.1006.b: "Я уверен, что это ничего." # I am sure this is nothing.
 chl.2000.t: "Вторжение в Тихий океан" # The Invasion of the Pacific
 chl.2000.d: "Газеты и радио сообщили всем, что наша нация находится на пороге новой эпохи, настроение приподнято, даже если в воздухе витают сомнения, поскольку сегодня утром лидер нашей страны объявил, что мир больше не будет беспокоить нас, и Чили заберет то, что по праву принадлежит нам. \nТихоокеанские острова, контролируемые Британской империей, будут захвачены, и не может быть принято никакого результата, кроме победы и контроля Чили над южной частью Тихого океана. Мы идем на войну." # The newspapers and the radio have told everyone, our nation is on the cusp of a new age, the spirits are high even if doubts are in the air, as our nation's leader announced this morning that peace will plague us no more, and Chile will take what is rightfully ours. \nThe Pacific Islands controlled by the British Empire will be seized, no outcome can be accepted but victory and Chile's control of the South Pacific. We are going to war.
 chl.2000.a: "По праву или по силе!" # By right or by might!
 chl.1999.t: "Чили объявляет о своих намерениях в Тихом океане" # Chile Announces its intentions in the Pacific
 chl.1999.d: "Пришли новости, и нам сообщили, что Чили собирается начать агрессивную экспансию на островах в южной части Тихого океана, которые в настоящее время находятся под британским контролем. Хотя мы не ожидаем многого от агрессивного и популистского правительства южноамериканской страны, возможно, это событие будет нам полезно. Действительно, все возрастающее влияние Империи в Тихом океане представляет собой прямую угрозу нашим собственным интересам, и мы не можем поставить под угрозу попадание Чили под британское влияние, поэтому выражение нашей поддержки и защиты амбиций Чили может быть лучшим вариантом." # News have arrived, and we've been informed that Chile is about to initiate an agressive expansion in islands in the South Pacific Ocean that are currently in British control. While we don't expect a lot from the south american nation's aggresive, populist government, maybe this event would be of use to us. Indeed, the Empire's all encroaching influence in the Pacific Ocean is a direct threat to our own interests, and we can't endanger Chile falling under British influence, voicing our support and defense of Chile's ambitions may be the best option.
 chl.1999.a: "Мы поддерживаем законные претензии Чили и не потерпим британского империализма." # We stand in support of Chile's rightful claims and won't tolerate British imperialism.
 chl.1999.b: "Конфликты между другими странами не имеют значения для Америки." # Conflicts between other nations aren't of importance to America.
 chl.2001.t: "Чили вторгается в наши владения" # Chile invading our Domains
 chl.2001.d: "Наша империя столкнулась с дополнительной угрозой, поскольку Чили объявляет о вторжении на наши островные владения в южной части Тихого океана. Хотя мы сейчас не в лучшем положении, чтобы приложить к этому усилия, это не должно стать большой проблемой для Королевского флота. Однако есть и более важное соображение: Соединенные Штаты, стремясь противодействовать нам, заявили о своей явной поддержке амбиций Чили, и если мы вмешаемся, они могут использовать этот конфликт как способ разжечь конфликт между нами за контроль над тихоокеанской сферой влияния. \nЛюбой конфронтации со Штатами следует избегать любой ценой, однако наши лояльные подчиненные нации могут справиться с этим конфликтом, не создавая больших политических потрясений, которые могли бы поставить под угрозу нашу империю, они могут даже что-то получить от всего этого." # An additional threat is facing our empire as Chile is proclaiming an invasion of our South Pacific island domains. While we aren't in the best position to put our efforts into it right now, it shouldnt be a great problem for the Royal Navy to deal with. There is a greater consideration though, the United States, in a bid to antagonize us, have voiced their explicit support of Chile's ambitions, and if we intervene they may use this conflict as a way of creating conflict between us for control of the Pacific sphere of influence. \nAny confrontation with the States should be avoided at all cost, our loyal subject nations, however, may be able to handle this conflict without creating great political turmoil as to endanger our empire, they may even earn something out of all this.
 chl.2001.a: "Мы не отдадим свои владения пустым угрозам, оружию!" # We won't relinquish our domain to empty threats, to arms!
 chl.2001.b: "У Австралии не должно возникнуть проблем с решением этого вопроса самостоятельно." # Australia should have no trouble handling the matter by themselves.
 chl.2006.t: "Империя игнорирует нашу поддержку Чили" # The Empire ignores our support of Chile
 chl.2006.d: "Неожиданность охватила правительство, поскольку неожиданно Британская империя не отступила и прямо объявила войну Чили. Хотя Чили, возможно, не доставляет им особых проблем, империя достигла слабого места, и теперь у нас больше, чем когда-либо, может быть возможность нанести удар по ним и утвердить свое влияние как великой державы в мире." # Surprise has taken ahold of the government as unexpectedly the British Empire hasn't backed off and has directly declared war upon Chile. While Chile may not provide much trouble for them, the empire has reached a weak point, and now more than ever may be our opportunity to strike against them and assert our influence as a great power to the world.
 chl.2006.a: "Они добивались этого!" # They sought this!
 chl.2006.b: "Не поймите нас неправильно, мы никогда не бросали вызов Империи." # Don't misunderstand us, we were never really challenging the Empire.
 chl.2005.t: "Чили вторгается в наши владения" # Chile invading our Domains
 chl.2005.d: "Наша империя столкнулась с дополнительной угрозой, поскольку Чили объявляет о вторжении на наши островные владения в южной части Тихого океана. Хотя мы сейчас не в лучшем положении, чтобы приложить к этому усилия, это не должно стать большой проблемой для Королевского флота. Тем не менее, есть много соображений, которые необходимо учитывать при распределении наших ресурсов, и безопасный вариант, который не будет стоить нам так дорого, - это заставить Австралию взять на себя управление конфликтом, учитывая ее близость и влияние в этом регионе, это может быть естественным выбором, если мы не хотим вмешиваться напрямую." # An additional threat is facing our empire as Chile is proclaiming an invasion of our South Pacific island domains. While we aren't in the best position to put our efforts into it right now, it shouldnt be a great problem for the Royal Navy to deal with. Still, there are many considerations to be made while allocating our resources, and a safe option that wouldn't cost us that much is to make Australia handle the conflict, given its proximity and influence in the area, this may be a natural choice if we don't feel like intervining directly.
 chl.2005.a: "Мы не отдадим свои владения слабым ура-патриотическим государствам, оружию!" # We won't relinquish our domains to weak jingoistic states, to arms!
 chl.2005.b: "У Австралии не должно возникнуть проблем с решением этого вопроса самостоятельно." # Australia should have no trouble handling the matter by themselves.
 chl.2002.t: "Война за южную часть Тихого океана" # War for the South Pacific
 chl.2002.d: "Суровые новости приходят, поскольку империя подвергается нападению другой угрозы, более близкой к дому. Чили собирается вторгнуться и попытаться захватить островные владения империи на юго-востоке Тихого океана. Они приняли нашу сложную ситуацию за слабость, и тяжесть дела легла на плечи Австралии. Мы отдадим все силы, чтобы защитить океан от этих захватчиков!" # Harsh news arrive as the empire is attacked by a different threat, one closer to home. Chile is about to invade and try to seize the empire's south-east pacific island domains. They have mistaken our difficult situation for weakness, and it has fallen upon Australia's shoulders the weight of the matter. We will give our all to defend the ocean from these invaders!
 chl.2002.a: "На войну!" # To war!
 chl.2003.t: "Австралия сдается!" # Australia surrenders!
 chl.2003.d: "Толпы радуются дома, когда наши солдаты оккупируют австралийскую землю. Правительство Австралии запросило мира, поскольку их страна больше не может воевать, а острова находятся под нашим контролем, и победа наконец-то близка." # Crowds cheer at home as our soldiers occupy australian land. The Australian Government has sued for peace as their nation can't fight anymore and the islands are in our control, victory is finally at hand.
 chl.2003.a: "Мы вернули себе то, что предназначалось нам." # We have reclaimed what was meant for us.
 chl.2003.b: "Не время останавливаться, вся Австралия должна попасть под наш контроль!" # This isn't time to stop, all of Australia must fall under our control!
 chl.2004.t: "Чили сдается!" # Chile surrenders!
 chl.2004.d: "Толпы людей ликуют дома, когда наши солдаты оккупируют чилийскую землю. Чилийское правительство запросило мира, поскольку их нация больше не может воевать, а наши владения находятся под нашим контролем, и победа наконец-то близка." # Crowds cheer at home as our soldiers occupy chilean land. The Chilean Government has sued for peace as their nation can't fight anymore and our domains are safe in our control, victory is finally at hand.
 chl.2004.a: "Австралия торжествует!" # Australia triumphs!
 chl.2004.b: "Не время останавливаться, вся Чили должна попасть под наш контроль!" # This isn't time to stop, all of Chile has to fall under our control!
 chl.2010.t: "Перу за мир" # Perú sues for peace
 chl.2010.d: "На фронте развеваются белые флаги, когда перуанцы сдаются, предлагая нам то, что мы когда-то у них отобрали, Такну. Южноамериканский успех наконец вернулся в нашу страну таким же образом, каким мы достигли его десятилетия назад. Мы победили." # White flags are waved in the battlefront as the peruvians surrender, offering us what we once took from them, Tacna. South American success has finally returned to our nation in the same way we achieved it decades ago. We have won.
 chl.2010.a: "Примите их капитуляцию и отбейте Такну." # Accept their surrender and retake Tacna.
 chl.2010.b: "Приемлема только полная победа." # Only total victory is acceptable.
 chl.2011.t: "Чилийцы сдаются" # Chileans Surrender
 chl.2011.d: "На фронте развеваются белые флаги, когда чилийцы сдаются. Их безрассудный экспансионизм наконец-то нанес им удар, поскольку Перу принесет им возмездие и исправит ошибки прошлого." # White flags are waved in the battlefront as the chileans surrender. Their reckless expanionism has finally come to bite them, as Perú will bring retribution to them and fix the past's mistakes.
 chl.2011.a: "Верните нашу южную провинцию Арику." # Retake our southern province, Arica
 chl.2011.b: "Не останавливайтесь, пока мы не возьмем под контроль все Чили." # Don't stop until we control all of Chile.
 chl.2012.t: "Боливийское правительство пало" # Bolivian government falls
 chl.2012.d: "Радикальное правительство Боливии пало, поскольку наши войска продвигаются дальше вглубь страны, хотя некоторые сражения все еще продолжаются, кажется очевидным, что мы победители. Поручим ли мы более дружественное правительство или продолжим нашу экспансию?" # The radical government of Bolivia has fallen as out troops march further into the country, while there are still some battles fought, it seems clear we are victors. Will we put a friendlier government on charge, or will we continue our expansion?
 chl.2012.a: "Для более безопасной Южной Америки. (марионетка Боливия)" # For a safer South America. (puppet Bolivia)
 chl.2012.b: "Никаких остановок, пока джунгли не перейдут под контроль Чили." # No stopping until the jungle is under chilean control.


### Decisions
 CHL_political_decisions: "Политические действия - Чили" # Political Actions - Chile
 CHL_political_decisions_desc: "Еще многое предстоит сделать, а времени так мало, поэтому новые варианты выбора для нашего правительства могут появиться в любой момент." # There is much to be done and so little time, so new choices for our government may appear at any time.
 CHL_civic: "Постройте Гражданский квартал" # Build the Civic Quarter
 CHL_civic_desc: "Поскольку после многих лет упадка нашему народу, похоже, не хватает надежды, мы обнаружили, что нуждаемся во вдохновении. Наш президент [Root.GetLeader] тоже это заметил. Но Чили пойдет вперед и будет прогрессировать, и чтобы показать это, мы можем построить новый Гражданский квартал в нашей столице, который станет факелом надежды во тьме." # As our people seems lacking in hope after the years of decline, we have found ourselves needing inspiration. Our president [Root.GetLeader] has noticed this as well. But Chile will come forwards, and progress, and to show this, we can build a new Civic Quarter in our capital, to act as a torch of hope in the darkness.
 CHL_monument_to_labour: "Построить памятник рабочему" # Build Monument to the Labourer
 CHL_monument_to_labor_desc: "В течение десятилетий непродуктивного правительства под парламентской тиранией Чили обнаружила, что полностью игнорирует голос простых людей. Чтобы показать, что мы заботимся о нас, мы построим новый Монумент аль-Обреро, который, хотя и не решит ни одной социальной проблемы, продемонстрирует наш компромисс, направленный на улучшение жизни рабочего класса." # During decades of unproductive governments under the parlamentary tyranny, Chile found itself ignoring completely the voice of the common people. To show we do care, we'll build a new Monumento al Obrero, which, while it won't fix any of the social issues, it will show our compromise to improve the lives of the working classes.
 CHL_social_service_program: "Создать программу социальной работы" # Establish the Social Work Program
 CHL_social_service_program_desc: "Молодежь крайне необходима такой исцеляющейся нации, как Чили, для восстановления себя материально и духовно. Реализуя программу социальной работы, молодые люди в возрасте 18–19 лет сделают все возможное для своего сообщества, помогая душе Чили снова стать сильной." # The Youth is of essential need for a healing nation like Chile to rebuild itself materially and spiritually. By implementing the social work program, young men of 18-19 years will do what they can for their community, helping the soul of Chile grow strong again.

### Ideas
 CHL_readjusted_plan: "Скорректированный экономический план" # Readjusted Economic Plan
 CHL_readjusted_plan_desc: "Были внесены некоторые незначительные реформы в наше экономическое и финансовое законодательство." # Some slights reforms on our economic and financial laws have been made.
 CHL_solidary_labour: "Солидарное трудовое право" # Solidary Labour Law
 CHL_solidary_labour_desc: "Наконец, были приняты некоторые трудовые законы, защищающие рабочих, хотя они и очень незначительны." # Finally some labour laws that protect the workers have been passed, albeit they are very minor.
 CHL_crumbling_government: "Разваливающееся правительство" # Crumbling Government
 CHL_crumbling_government_desc: "Поскольку экономика находится в упадке и мало что сделано для ее исправления, сейчас, как никогда, наше правительство находится на грани краха." # With a economy on the floor and little done to fix it, now more than ever, our government is on the verge of collapse.
 CHL_collapsed_economy: "Разрушенная экономика" # Collapsed Economy
 CHL_collapsed_economy_desc: "Несмотря на то, что мы не участвовали в Великой войне, последствия ее развития все еще ощущаются на нашей испытывающей трудности экономике." # Even though we didnt fight in the Great War, the consequences of its developments are still felt upon our struggling economy.
 CHL_political_polarization: "Политическая поляризация" # Political Polarization
 CHL_political_polarization_desc: "Неудачи нашего правительства разделили страну по поводу того, что ей следует делать." # The failures of our government have divided the country about what should it do.
 CHL_economic_reforming: "Экономическая реструктуризация" # Economic Restructuring
 CHL_economic_reforming_desc: "Мы находимся в процессе реструктуризации нашей экономики." # We are amidst a process of re-structuring our economy.
 CHL_economic_reestructuring: "Экономическая реструктуризация" # Economic Restructuring
 CHL_economic_reestructuring_desc: "Мы начали процесс реструктуризации нашей экономики." # We have began a process of re-structuring our economy.
 CHL_reforming_government: "Реформирование правительства" # Reforming Government
 CHL_reforming_government_desc: "В условиях кризиса, в котором находится наша страна, наше правительство решило провести реформы, чтобы лучше решать наши проблемы." # Amidst the crisis our country is in, our government has decided to reform itself as to better deal with our issues.
 CHL_political_instability: "Политическая нестабильность" # Political Instability
 CHL_political_instability_desc: "Несмотря на то, что наше демократическое правительство выжило до сих пор, нестабильность все еще преследует нашу страну." # Even though our democratic government has survived thus far, instability still plagues our country.
 CHL_new_republic: "Новая Республика" # The New Republic
 CHL_new_republic_desc: "Велики были проблемы, с которыми столкнулась наша страна, но под властью демократии и прислушиваясь к своему народу, республика снова стала сильной." # Great have been the challenges our country has faced, but under the rule of democracy, and listening to its people, the republic has grown strong anew.
 CHL_chilean_race: "Чилийская гонка" # The Chilean Race
 CHL_chilean_race_desc: "Наш народ — потомок древних воинских традиций, завоевания и битвы у нас в крови!" # Our people are descendants of ancient warrior traditions, conquest and battle is in our blood!
 CHL_classes_united: "Классы Юнайтед" # Classes United
 CHL_classes_united_desc: "Ни для кого не секрет, что не все рождаются в равных условиях, тем не менее, вместо того, чтобы осуждать простую природу, мы все должны принять свою роль в обществе и свою роль в этом народе!" # It is no secret not everyone is born in equal conditions, nonetheless, rather than denounce simple nature, we should all accept our roles within society and our part in this nation!
 CHL_paternal_state: "Отцовское государство" # A Paternal State
 CHL_paternal_state_desc: "Нас ведут по правильному пути под руководством государства и нашего генерала Карлоса Ибаньеса." # We are lead through the right path under the guidance of the state and our general, Carlos Ibañez.
 CHL_paternal_regime: "Отцовское государство" # A Paternal State
 CHL_paternal_regime_desc: "Нас ведут по правильному пути под руководством государства и нашего генерала Карлоса Ибаньеса." # We are lead through the right path under the guidance of the state and our general, Carlos Ibañez.
 CHL_chilean_valkism_idea: "Чилийский путь к валькизму" # The Chilean Way to Valkism
 CHL_chilean_valkism_idea_desc: "Все знают, что каждая нация индивидуальна, и вполне естественно, что наша версия валькизма — лучшая из существующих." # Everyone knows each nation is different, it's only natural our version of valkism is the best one there is.
 CHL_warrior_legacy: "Наследие Воина" # Warrior Legacy
 CHL_warrior_legacy_desc: "Наш народ — воины по крови и истории, и мы никогда не забудем свое наследие." # Our people are warriors by blood and history, and we will never forget our legacy.
 CHL_roto_valkism: "Рото-валькизм" # Roto Valkism
 CHL_roto_valkism_desc: "Наши соседи называли нас ротосами, поскольку мы были сломлены невзгодами и трудностями, однако ротосы победили их и оказались безжалостными, и так будет всегда." # Our neighbours called us rotos as we were broken by the hardships and the odds, yet the rotos defeated them and proved relentless, and always will.
 CHL_chilean_nation: "Чилийская нация" # The Chilean Nation
 CHL_chilean_nation_desc: "Это земля страстных душ и благородных воинов, и мы не остановимся ни перед чем, чтобы показать миру, что мы лучшие!" # This is a land of passionate souls and noble warriors, and we will stop at nothing to show the world we are best!
 CHL_guided_men: "Мужчины с гидом" # Guided Men
 CHL_guided_men_desc: "Под сильным руководством генерала Ибаньеса наши люди наконец осознают важность нашей нации." # Under the strong leadership of general Ibañez, our men are finally realizing the importance of our nation.
 CHL_content_elite: "Контент Элита" # Content Elite
 CHL_content_elite_desc: "Элита, какой бы вредной она ни была в своих ошибочных действиях, все еще может быть полезна нашей великой стране, конечно, под руководством генерала Ибаньеса." # The elite, hurtful as they have been in their misguided ways, still can be of use to our great country, under the lead of general Ibañez, of course.
 CHL_peoples_economy: "Народная экономика" # People's Economy
 CHL_peoples_economy_desc: "Люди, наконец, оказались в центре внимания экономики под руководством генерала Ибаньеса Дель Кампо, который тратил больше средств как на промышленность, так и на социальную помощь." # People are finally the focus of the economy under general Ibañez Del Campo, who has spent more on both industry and social care.
 CHL_popular_economy: "Народная экономика" # People's Economy
 CHL_popular_economy_desc: "Экономические реформы нашего генерала сделали нашу экономику величайшей в нашей истории, наконец, бедные и работающие почувствовали себя в выигрыше, и наша промышленность выросла." # Our general's economic reforms have made our economy the greatest in our history, finally the poor and working feel benefitted and our industry has grown.
 CHL_president_ibanez: "Президент Ибаньес" # President Ibañez
 CHL_president_ibanez_desc: "Карлос Ибаньес дель Кампо взял нацию под свое крыло и направил нас к нашей судьбе. Он больше, чем просто генерал, он всегда будет известен как президент." # Carlos Ibañez del Campo took the nation under his wing and has guided us to the our destiny, more than a general, he will always be known as the president.
 CHL_the_new_model: "Новая модель" # The New Model
 CHL_the_new_model_desc: "Теперь, выздоровевшие и стабильные, радикалы наконец реализуют обещанную модель." # Now recovered and stable, the radicals are finally implementing the model they promised.
 CHL_radical_welfare: "Радикальное благосостояние" # Radical Welfare
 CHL_radical_welfare_desc: "В рамках новой модели нашего общества к бедным относятся более мягко, благодаря новым механизмам социального обеспечения, которые должны обеспечить им некоторую безопасность в процессе их жизни." # As part of the new model for our society, the poor are getting a softer treatment, with new welfare mechanisms that should allow them some safety as they make their lives.
 CHL_moderate_reforms: "Умеренные реформы" # Moderate Reforms
 CHL_moderate_reforms_desc: "Как бы нам ни хотелось поторопиться с реформированием и расходами, мы должны быть осторожны в управлении нашей страной, поскольку об этом нужно заботиться, а это требует стабильности, поэтому наши реформы заходят так далеко." # As much as we would like to rush into reforming and spending, we have to be careful in the management of our nation, as it is something to be cared about, and that needs stability, thus our reforms only go so far in reach.
 CHL_balanced_budget_idea: "Сбалансированный бюджет" # Balanced Budget
 CHL_balanced_budget_idea_desc: "Ни для кого не секрет, что сбалансированный бюджет, низкий уровень долгов и обеспечение соответствия всех цифр необходимы для существования страны, и наш не является исключением." # It is no secret a balanced budget, going low on debts and making sure every number fits is essential for a country to run, ours is not different.
 CHL_liberalized_economy: "Либерализованная экономика" # Liberalized Economy
 CHL_liberalized_economy_desc: "Слишком долго протекционизм душил нашу экономику, давайте освободим ее из рук правительства, позволив свободному рынку работать на наше благо лучше, чем это сделало бы любое государство." # For far too long protectionism has choked our economy, let's free it from the government's grasp, allowing free market to work for our benefit better than any state would.
 CHL_foreign_investors: "Иностранные инвесторы" # Foreing Investors
 CHL_foreign_investors_desc: "Наша страна долгое время была далека от внимания мировой общественности, отчасти из-за небольшого экономического интереса к ней. Если мы будем искать иностранных инвесторов, мы сможем принести больше доходов и успеха нашей экономике, а также известность нашей стране." # Our country has been far from the global eye for a long time, in part due to little economic interest in it, if we seek foreign investors, we may be able to bring more revenue and success to our economy, and notoriety to our nation.
 CHL_socialized_society: "Социализированное общество" # Socialized Society
 CHL_socialized_society_desc: "Жадность и индивидуальная конкуренция слишком долго ослабляли и разъединяли нас, давайте изменим свой менталитет и подумаем о других прежде, чем о себе." # Greed and individual competition has weakened and disunited us for too long, let's change our mentality, and think of the other before ourselves.
 CHL_agrarian_reform: "Новая аграрная реформа" # New Agrarian Reform
 CHL_agrarian_reform_desc: "Большая часть нашей страны все еще является аграрной, даже если она быстро сокращается, давайте реформировать земли, чтобы улучшить производство продуктов питания и жизнь нашей сельской местности, как говорит президент Гроув: «Ни земля без людей, ни люди без земли»." # A big part of our country is still agrarian, even if quickly diminishing, let's reform the lands to improve our food production and the life of our countryside, as president Grove says, "Neither land without men nor men without land".
 CHL_standing_up_alone: "Стоя в одиночестве" # Standing Up Alone
 CHL_standing_up_alone_desc: "Приверженность международным связям и дипломатии, возможно, не лучшее решение для нас, скорее, сохранение некоторого нейтралитета позволит нам не привлекать врагов и проявлять гибкость во внешних вопросах." # Commiting to international ties and diplomatics may not be the best decision for us, rather, preserving some kind of neutrality will make sure we don't attract enemies and that we are flexible in foreign matters.

### Focuses
 CHL_path_of_nation: "Путь нашей нации" # The Path of Our Nation
 CHL_path_of_nation_desc: "Для нашей страны сейчас тяжелые времена, экономика рухнула, мы сильно упали, а правительство ничего не делает. Какой путь пойдет нашей стране, чтобы исправить это?" # These are tough times for our country, the economy has collapsed, we have fallen hard, and the government doesn't do anything. What path will our nation take to fix this?
 CHL_readjust_economic_plan_desc: "Хотя большие изменения кажутся маловероятными, нам следует попытаться внести некоторые коррективы в наш текущий экономический план, чтобы попытаться стабилизироваться в нашей ужасной ситуации." # While big changes seem unlikely to be passed, we should try to implement some readjustments to our current economic plan to try and stabilize from our awful situation.
 CHL_readjust_economic_plan: "Скорректированный экономический план" # Readjusted Economic Plan
 CHL_connect_with_the_people: "Общайтесь с людьми" # Connect with the People
 CHL_connect_with_the_people_desc: "Общее ощущение разобщенности между правящими классами и народом ощущается по всей нашей стране, давайте сделаем шаги к сближению с народом." # A general feeling of disconnection between the rulling classes and the people can be felt through our country, let's make strides towards getting closer with the people.
 CHL_solidary_labour_law: "Солидарное трудовое право" # Solidary Labour Law
 CHL_solidary_labour_law_desc: "Наши работники пережили как экономический коллапс, так и десятилетия плохого управления со стороны своих работодателей, хотя более масштабные реформы кажутся маловероятными, давайте введем некоторые трудовые законы, которые помогут облегчить ситуацию." # Our workers have suffered both economic collapse and decades of mismanagement by their employers, while greater reforms seem unlikely, let's implement some labour laws that help ease the situation.
 CHL_try_to_stabilize: "Постарайтесь стабилизировать" # Try to Stabilize
 CHL_try_to_stabilize_desc: "Напряжение и поляризация ощущаются в нашей стране, давайте попробуем ослабить напряжение и сосредоточим внимание на сохранении стабильности в стране, чтобы не случилось чего-то плохого." # The tension and polarization can be felt through our nation, let's try to ease the tension and put our focus on keeping the country stable, lest something bad happen.
 CHL_the_critical_point: "Критическая точка" # The Critical Point
 CHL_the_critical_point_desc: "Правительство пытается сделать все возможное, чтобы поставить нас на ноги, но наше положение, похоже, не улучшается. В нынешнем политическом климате Чили мы приближаемся к критической точке, и что-то вот-вот произойдет." # As the government tries to do what it can to get us back on our feet, our condition does not seem to improve, in the current political climate of Chile, we are reaching a critical point, something is about to happen.
 CHL_democracy_survives: "Демократия выживает" # Democracy Survives
 CHL_democracy_survives_desc: "Хотя многие все еще возмущаются недостатками нашего правления и замышляют привести нас к падению, демократия еще не пала и, похоже, выжила в этот климатический момент для нашей страны." # Although many still resent the failings of our rule and plot to bring our downfall, democracy is yet to fall, and has seemingly survived in this climatic moment for our nation.
 CHL_military_guard: "Под охраной военных" # Under Military's Guard
 CHL_military_guard_desc: "Хотя крайние силы, стремящиеся разлучить наш народ, почти воспользовались слабостью нашего правительства, благородный генерал Карлос Ибаньес пришел, чтобы направить наш путь прямо и направить нас к нашей судьбе!" # Although extreme forces seeking to torn our people apart have almost preyed upon our government's weakness, the noble general Carlos Ibañez has come to set our path straight and guide us to our destiny!
 CHL_chilean_valkism: "Чилийский путь к валькизму" # The Chilean Way to Valkism
 CHL_chilean_valkism_desc: "Устав от игр и лжи «демократии» и старой олигархии, народ штурмовал улицы Сантьяго под знаменами Хорхе «Эль-Хефе» Гонсалеса фон Мареса и Валькисмо, поскольку страна знала, какую судьбу она себе решила." # Tired of the games and lies of "democracy" and the old oligarchy, the people stormed the streets of Santiago under the banner of the Jorge "El jefe" González Von Marées and Valquismo, as the country knew what destiny it decided for itself.
 CHL_centralize_peoples_will: "Централизуйте волю народа" # Centralize People's Will
 CHL_centralize_peoples_will_desc: "Слишком долго наш народ был лишен голоса из-за власти олигархов. Если мы централизуем государство на исполнительной роли, президент сможет реагировать на потребности людей без вмешательства Конгресса, хотя это может расстроить старую элиту." # For far too long our people have had their voices shut by powers of the oligarchs, if we centralize the state in the executive role, the president will be able to respond to people's need without intervention from the congress, although this may make the old elite unhappy.
 CHL_deal_with_oligarchs: "Сделка с олигархами" # Deal with the Oligarchs
 CHL_deal_with_oligarchs_desc: "Чтобы продвигаться вперед в восстановлении нашей страны, мы работаем со всеми частями Чили, поэтому нам необходимо заключить соглашения с элитой, которые принесут пользу как им, так и простому человеку; только при сотрудничестве наша республика может добиться успеха." # To go forward in our rebuilding of our country, we work with every part of Chile, as such, we need to establish deals with the elite that benefits both them and the common man; only with cooperation our republic can succeed.
 CHL_gaining_militarys_support: "Заручиться поддержкой военных" # Gaining the Military's Support
 CHL_gaining_militarys_support_desc: "Сейчас, как никогда, нам нужна поддержка наших вооруженных сил для поддержания стабильности, армия служит нации, а не наоборот!" # Now more than ever, we must have the support of our armed forces to mainting stability, the army serves the nation, not the other way around!
 CHL_ban_the_extremists: "Запретить экстремистов" # Ban the Extremists
 CHL_ban_the_extremists_desc: "Несмотря на то, что мы до сих пор держим ситуацию под контролем, это непросто, когда крайние деятели подстрекают людей к восстанию против демократического верховенства закона, запрещают этих экстремистов и защищают демократию!" # Even though we have kept ahold of the situation until now, it is not easy when extreme figures incite the people to rebel against democratic rule of law, bans these extremists and protect democracy!
 CHL_the_new_republic: "Новая Республика" # The New Republic
 CHL_the_new_republic_desc: "Велики проблемы, с которыми нам пришлось столкнуться, и велики проблемы, которые остаются, тем не менее, демократия выжила и оказалась на высоте! Наши реформы уступили место более справедливой, новой республике!" # Great are the challenges we have had to survive, and great are the challenges that remain, nonetheless, democracy has survived and risen to the occasion! Our reforms have given place to a fairer, new, republic!
 CHL_invest_in_our_industry: "Инвестируйте в нашу отрасль" # Invest in Our Industry
 CHL_invest_in_our_industry_desc: "Наша экономика находится в упадке, а безработица на небе, давайте вернемся к Чили и индустриализируем нашу экономику!" # Our economy is on the floor and unemployment is on the sky, let's bring our attention back to Chile, and industrialize our economy!
 CHL_closing_the_gap: "Устранение разрыва" # Closing the Gap
 CHL_closing_the_gap_desc: "Мы оказались далеко от того места, где нам нужно быть, наша страна осталась в прошлом, пришло время ликвидировать разрыв и привести нашу страну в настоящее." # We find ourselves far back from where we need to be, our country has stayed in the past, it's time to close the gap and bring our country to the present.
 CHL_reformed_trade_laws: "Реформированные торговые законы" # Reformed Trade Laws
 CHL_reformed_trade_laws_desc: "Наши древние торговые законы сохранили то, что нам не нужно, и то, что нам нужно, давайте реформируем наше законодательство и поддержим капиталовложения и торговлю продуктами, которые нужны нашему народу." # Our ancient trade laws have kept what we don't want in and what we need out, let's reform our law and support capital investments and trade of products that our people need.
 CHL_paving_new_roads: "Прокладывание новых дорог" # Paving New Roads
 CHL_paving_new_roads_desc: "Как мы можем надеяться охватить наших реформами каждого чилийца, если не все чилийцы могут охватить даже друг друга? Мы должны построить новые дороги по всей территории нашей страны и еще больше соединить нашу страну." # How can we hope to reach every chilean in our reforms when not every chilean can even reach each other? We must build new roads across the length of our country and connect our nation further.
 CHL_a_firm_hand: "Твердая рука" # A Firm Hand
 CHL_a_firm_hand_desc: "Наша страна слишком долго находилась без контроля, твердая рука нашего генерала против инакомыслящих – это то, что нам нужно для стабилизации." # Our country has been uncontrolled for too long, our general's firm hand against dissidents is what we need to stabilize.
 CHL_a_gentle_manner: "Нежные манеры" # A Gentle Manner
 CHL_a_gentle_manner_desc: "Тем не менее, как диссиденты заслуживают исправления, так и люди, которые ведут себя, заслуживают того, чтобы к ним относились с тем уважением, которого они заслуживают, даже если не все хотят, чтобы мы оказывали им такую ​​любезность." # Nonetheless, as much as dissidents deserve correction, the same way, the people that behave deserve to be treated with the respect they deserve, even if not everyone wants us to hand such niceness to them.
 CHL_general_of_hope: "Генерал надежды" # The General of Hope
 CHL_general_of_hope_desc: "Хотя многие не верили, что наша страна может стать лучше, генерал Ибаньес заставил их поверить, что люди сейчас, как никогда, чувствуют себя едиными в надежде под руководством нашего генерала." # While many didn't believe our country could get better, general Ibañez has made them believe, the people, now more than ever, feel united in hope under our general.
 CHL_presidente_ibanez: "Президент Ибаньес" # President Ibañez
 CHL_presidente_ibanez_desc: "С любовью, заботой и силой Карлос Ибаньес дель Кампо взял нацию под свое крыло и привел нас к успеху и нашей судьбе. Он больше, чем генерал, всегда будет известен как президент и герой своей нации." # With love, care and strength, Carlos Ibañez del Campo took the nation under his wing and has guided us to success and our destiny, more than a general, he will always be known as the president, and as a hero for his nation.
 CHL_economy_for_the_people: "Экономика для людей" # The Economy For The People
 CHL_economy_for_the_people_desc: "Чили слишком долго страдала из-за экономики, ориентированной только на ресурсы земли, а не на своих граждан, но с реформами Ибаньеса это изменится!" # Chile has suffered far too long with an economy only focused on the resources of the land and not in its citizens, with Ibañez's reforms, this will change!
 CHL_content_old_oligarchs: "Довольны старые олигархи" # Content the Old Oligarchs
 CHL_content_old_oligarchs_desc: "Как бы нам ни хотелось воздержаться от зависимости от них, все под руководством нашего правительства могут быть полезны, может быть, даже старая элита, если нам удастся убедить их поддержать нас." # As much as we would like to refrain from depending on them, everyone, under the guidance of our government, can be useful, maybe even the old elite, if we manage to content them into supporting us.
 CHL_moderate_land_reform: "Умеренная земельная реформа" # Moderate Land Reform
 CHL_moderate_land_reform_desc: "Большая часть нашей страны является аграрной по своей природе, и экономическая элита контролирует землю, которой лучше бы управляло государство и его граждане, давайте проведем земельную реформу, но не заходя слишком далеко, чтобы не расстроить экономических агентов." # A large part of our country is agrarian in nature, and the economic elite control land that would better be administered by the state and its citizens, let's make a land reform, but without going too far as to make the economic agents upset.
 CHL_patriotic_protectionism: "Патриотический протекционизм" # Patriotic Protectionism
 CHL_patriotic_protectionism_desc: "Многие инвесторы приезжают в Чили в поисках ресурсов и уезжают, не дав Чили того, чего она заслуживает. Давайте защитим нашу страну более жесткими торговыми законами, чтобы сохранить наше богатство и увеличить прибыль." # A lot of investors come to Chile looking for resources and leave without giving Chile what it deserves, let's protect our country with harsher trade laws to preserve our richness and profit more.
 CHL_unite_the_classes: "Объедините классы" # Unite the Classes
 CHL_unite_the_classes_desc: "Слишком много людей пытались разделить нашу нацию, противопоставляя несчастных более обеспеченным, хотя все они — чилийцы! Давайте объединим классы, ведь мы все образуем одну великую нацию!" # Far too many people have tried to divide our nation by putting the unfortunate against the more well off ones, while all of them are chileans! Let's unite the classes, as we all form one great nation!
 CHL_embrace_the_chilean_race: "Примите чилийскую расу" # Embrace the Chilean Race
 CHL_embrace_the_chilean_race_desc: "Как однажды сказал Николас Паласиос, наша нация родилась из смеси воинственных народов, и мы должны этим гордиться! Любой чилиец, рожденный непохожий друг на друга, имеет одинаковую моральную физиономию и является частью одной и той же чилийской расы!" # As Nicolás Palacios once said, our nation is born of a mixture of warrior peoples, and we must take pride on that! Any chilean, born different from one another, share the same superior moral physiognomy, and are part of the same chilean race!
 CHL_glory_to_the_rotos: "Слава Ротосу" # Glory to the Rotos
 CHL_glory_to_the_rotos_desc: "Завистливые и обидчивые, наши соседи прозвали нас ротосами, или «сломанными», мы приняли это имя, и они пожалеют о своих намерениях, когда ротосы нападут на них!" # Envious and hurtful, our neighbours have called us the rotos, or "Broken Ones", we have embraces this denonym, and they will regret their intentions when the rotos go for them!
 CHL_work_for_the_chilean: "Работа для чилийского мужчины" # Work for the Chilean Man
 CHL_work_for_the_chilean_desc: "Наш народ слишком долго страдал от бедности и безработицы, государству нужна национальная промышленность, которая будет поддерживать и вознаграждать чилийский народ." # Our people have suffered through poverty and unemployment for too long, the state needs a national industry that will sustain and reward the chilean people.
 CHL_new_national_industry: "Новая национальная промышленность" # The New National Industry
 CHL_new_national_industry_desc: "Поскольку прошлые экономические бумы ушли в прошлое, мы должны найти новый фокус для экономики, отрасль, в которой чилийский народ может преуспеть. Их истинная судьба." # As economy booms of pasts have left, we must find a new focus for economy, an industry that the chilean people can excel at. Their true destiny.
 CHL_militarized_nation: "Военизированная нация" # Militarized Nation
 CHL_militarized_nation_desc: "Только после великих побед наш народ обретает заслуженный успех, военные традиции равны успеху, и военизированная нация – это то, что нам нужно!" # Only after great victories our nation has found the success it deserves, military tradition equals success, and a militarized nation is what we need!
 CHL_our_warrior_legacy: "Наше воинское наследие" # Our Warrior Legacy
 CHL_our_warrior_legacy_desc: "Наш народ голодал, наша экономика рухнула, наше правительство потерпело неудачу, но если есть что-то, в чем Чили только добилась триумфа, то есть это было на поле битвы, мы должны принять, а не отвергнуть эту истину." # Our people have hungered, our economy has collapsed, our government has failed, but if there is something Chile has only triumphed at, it has been at the battlefield, we must embrace, not reject, this truth.
 CHL_revitalized_nation: "Возрожденная нация" # Revitalized Nation
 CHL_revitalized_nation_desc: "По мере того, как люди проходят свои дни, они осознают, насколько велика наша нация, поскольку наш Валкисмо дал им то, что им нужно, и обнаружил тот драйв, которого не хватало стране, теперь каждый чилиец может наконец сказать, насколько велика их нация! Не хватает только одного, чтобы мир тоже это увидел." # As people go on their days, they have realized how great our nation is, as our Valquismo gave them what they need and found the drive the country was missing, now every Chilean can finally say how great their nation is! Only one thing missing, for the world to see it too.
 CHL_our_natural_richness: "Наше природное богатство" # Our Natural Richness
 CHL_our_natural_richness_desc: "Ресурсы, которые мы можем найти на этой земле, велики, и мы должны улучшить методы их добычи, чтобы получить от них больше пользы." # Great are the resources we can find in this land, we must improve our extraction techniques to benefit more from them.
 CHL_compliment_our_economy: "Похвалите нашу экономику" # Compliment Our Economy
 CHL_compliment_our_economy_desc: "Какими бы богатыми ресурсами мы ни были в сфере полезных ископаемых, мы не обладаем всем, чтобы поддерживать себя, давайте интегрируем новые методы синтеза в нашу экономику и покроем наши недостатки!" # As resource rich as we may be in the mineral department, we don't possess everything to sustain ourselves, let's integrate new synthesis methods to our economy and cover our failings!
 CHL_from_arica_to_the_end_of_the_world: "От Арики до края света" # From Arica to the End of the World
 CHL_from_arica_to_the_end_of_the_world_desc: "От далекого севера до ледникового юга наша страна длинная и обширная, давайте развивать нашу инфраструктуру, чтобы лучше интегрировать ее." # From far up north to the glaciar south, our country is long and extensive, let's develop our infrastructure to integrate it all better.
 CHL_chilean_industrial_expansion: "Чилийская промышленная экспансия" # Chilean Industrial Expansion
 CHL_chilean_industrial_expansion_desc: "Наша экономика не может существовать только за счет прибыли от природных ресурсов, мы также должны развивать нашу промышленность, чтобы поддерживать себя!" # Our economy can't subsist only on resource profit, we must develop our industries to sustain ourselves, too!
 CHL_develop_the_south: "Развивать Юг" # Develop the South
 CHL_develop_the_south_desc: "Наши южные регионы, последняя часть нашей страны, которая будет заселена, представляют собой прекрасные земли, полные многообещающих возможностей и потенциала, но испытывающие недостаток в людях и инвестициях, давайте будем стремиться сделать эту зону неотъемлемой частью нашего экономического развития." # The last part of our nation to be inhabitated, our southern regions are beautiful lands full of promise and potential, but lacking in people and investment, let's push to bring this zone up as an integral part of our economic development.
 CHL_develop_the_north: "Развивайте Север" # Develop the North
 CHL_develop_the_north_desc: "Хотя они не так долго находились в нашем владении, наши северные территории богаты культурой и ресурсами, а также динамичной зоной, о которой мы не особо заботимся, давайте сосредоточим наши усилия на развитии ее автономного потенциала как экономического региона нашей страны." # While they haven't been in our possession for that long, our northern territories are rich in culture and resources, and a vibrant zone we haven't cared that much about, let's focus our efforts into developing its autonomous potential as an economic region of our nation.
 CHL_central_development_plan: "Центральный план развития" # Central Development Plan
 CHL_central_development_plan_desc: "Наше демографическое, политическое и культурное сердце, центр нашей страны, настолько чилийский, насколько это возможно, и мы не можем планировать экономическое развитие Чили, не планируя сосредоточить внимание на наших центральных районах." # Our populational, political, and cultural heart, the center of our country is about as Chilean as it can gets, and we can't possibly plan for Chile's economic development, without planning for focus on our central heartlands.
 CHL_the_new_technologies: "Новые технологии" # The New Technologies
 CHL_the_new_technologies_desc: "Чтобы модернизировать нашу страну, пришло время создать новые технологии, которые принесут большую пользу нашему обществу." # To modernize our country, it is time to bring forth new technologies that will be of great use to our society.
 CHL_funding_for_our_future: "Финансирование нашего будущего" # Funding for Our Future
 CHL_funding_for_our_future_desc: "Мы должны предоставить нашим интеллектуалам финансирование для исследования дальнейших улучшений во всех сферах жизни нашей страны, будь то качество жизни или более агрессивные разработки." # We must provide our intellectuals with the funding to research further improvementes to all the areas of our nation, be it life quality, or more agressive developments.
 CHL_preparing_for_the_worst: "Подготовка к худшему" # Preparing for the Worst
 CHL_preparing_for_the_worst_desc: "В эти конфликтные и нестабильные времена мы должны приложить некоторые усилия, чтобы подготовиться к тому, что нас ждет в будущем." # In these conflictive and unstable times, we must put some effort into preparing for whatever the future has waiting for us.
 CHL_chilean_mobilization: "Мобилизовать страну" # Mobilize the Country
 CHL_chilean_mobilization_desc: "Кажется, пришло время: давайте мобилизуем наши силы, граждан и промышленность для предстоящего хаоса." # It seems the time has come, let's mobilize our forces, citizens, and industries for the upcoming chaos.
 CHL_road_to_conflict: "Дорога к конфликту" # The Road to Conflict
 CHL_road_to_conflict_desc: "Конфликт витает в воздухе, рано или поздно нашим армиям придется встать и сражаться за то, во что мы верим, и мы будем готовы." # Conflict is in the air, sooner or later our armies will have to stand and fight for what we believe,, and we will be prepared.
 CHL_funding_the_army: "Финансирование армии" # Funding the Army
 CHL_funding_the_army_desc: "Годы и годы экономического спада привели к тому, что армейский бюджет оказался недостаточным, а ее оборудование устарело, и пришло время пополнить финансирование и расширить свои возможности." # Years and years of economic decline have left the army budget lacking, and its equipment ourdated, time to re-up the funding and being reaming ourselves.
 CHL_revamping_our_weapons: "Обновление нашего оружия" # Revamping our Weapons
 CHL_revamping_our_weapons_desc: "Наши старые запасы пришли в негодность, мы максимально модернизируем нашу армию, начиная с вооружения." # Our old stock has grown useless, we most modernize our army, beginning by its arms.
 CHL_artillery_effort: "Артиллерийские усилия" # Artillery Effort
 CHL_artillery_effort_desc: "Далее модернизируем нашу артиллерию для предстоящего боя!" # Next on, let's modernize our artillery for the upcoming fight!
 CHL_motorized_push: "Моторизованный толчок" # Motorized Push
 CHL_motorized_push_desc: "Кавария всех не получится, давайте полностью моторизировать нашу армию и отдать жизнь на колесах!" # The cavarly of all won't work, let's motorize fully our army, and give our lives on wheels!
 CHL_specialized_brigades: "Специализированные бригады" # Specialized Brigades
 CHL_specialized_brigades_desc: "Не все мужчины готовы вступить в бой, допустимы и другие способы боя, давайте подготовимся к любой среде, в которой нам придется сражаться!" # Not all men will charge to fight, other ways of fighting are valid too, let's prepare for any environment we must fight in!
 CHL_mastering_our_mountains: "Осваивая наши горы" # Mastering Our Mountains
 CHL_mastering_our_mountains_desc: "Мы живем в стране мощных гор, которые изолируют нас от наших врагов, давайте станем мастерами в бою на них, чтобы мы доминировали в любой битве на чилийской земле." # We live in a land of powerful mountains that keep us isolated from our enemies, let's become masters in fighting on them, so we dominate any fight on chilean soil.
 CHL_mechanized_advance: "Механизированное продвижение" # Mechanized Advance
 CHL_mechanized_advance_desc: "Новая механизация наших сил – это именно то, что нам нужно для победы на любом поле боя." # The new mechanization of our forces is just what we need to triumph in any batlefield.
 CHL_experimental_rocketry: "Экспериментальная ракетная техника" # Experimental Rocketry
 CHL_experimental_rocketry_desc: "Новое оружие мощно и впечатляюще, возможно, его изучение окажется полезным в этом конфликтном будущем." # The weapons of new are powerful and impressive, maybe delving into them will be of use in this conflictive future to come.
 CHL_fortress_the_andes: "Крепость Анды" # Fortress The Andes
 CHL_fortress_the_andes_desc: "Давайте построим форты на тропах и дорогах вокруг гор, чтобы никто не мог обойти нашу природную крепость." # Let's lay forts down the paths and ways around the mountains, so that nobody can bypass our natural fortress
 CHL_armored_endeavour: "Бронированный Индевор" # Armored Endeavour
 CHL_armored_endeavour_desc: "Танки — грозная машина на поле боя, но их очень сложно построить. Создав базовые стандарты качества, мы сможем ускорить производство бронетехники и снабдить своими танками крупные бронетанковые дивизии, которые обрушатся на противника как кирпич." # Tanks are a fearsome machine on the battlefield, but they are a very complex machine to build. By creating baseline quality standards, we can speed up production of armour and supply our tanks with large armoured divisions that will come down on the enemy like a brick.
 CHL_kriegs_unt_cazuelas: "Война при Казуэласе" # Kriegs Unt Cazuelas
 CHL_kriegs_unt_cazuelas_desc: "Со времен Пруссии наша нация демонстрирует военную мощь, давайте никогда не забывать нашу дисциплину и традиции и чтить ее имя." # Since the times of Prussia our nation has shows military might, let's never forget our discipline and traditions and honour its name.
 CHL_may_god_forgive_us: "Да простит нас Бог" # May God Forgive Us
 CHL_may_god_forgive_us_desc: "Когда битва закончится и дым рассеется, единственным, кто останется судить нас, будет сам Бог." # When the battle finishes, and the smoke is cleared, the only one remaining to judge us will be God himself.
 CHL_extending_our_coasts: "Расширяем наши побережья" # Extending Our Coasts
 CHL_extending_our_coasts_desc: "Наше побережье длинное и полно мест, которые наши враги могут попытаться использовать в своих целях. Давайте расширим наше господство на побережье, построив новые форты для защиты от вторжений." # Our coast is long and full of spots our enemies may try to use to their advantage, let's extend our dominion on the coast with new forts to protect from invasions.
 CHL_expanding_the_shipyards: "Расширение наших верфей" # Expanding Our Shipyards
 CHL_expanding_the_shipyards_desc: "Большое море требует много кораблей, давайте построим новые верфи для удовлетворения наших военно-морских нужд." # A big sea requires many ships, let's build new shipyards to fulfill our naval needs.
 CHL_pacific_strategy: "Тихоокеанская стратегия" # Pacific Strategy
 CHL_pacific_strategy_desc: "Есть много способов доминировать на морях, и мы должны выбрать стратегию, которая покажет Тихий океан его хозяевами!" # There are many ways to dominate in the seas, we must pick a strategy that shows the pacific its masters!
 CHL_the_battleships: "Линкоры" # The Battleships
 CHL_the_battleships_desc: "Основная часть нашего военно-морского флота, без сосредоточения внимания на линкорах мы не сможем контролировать воды." # A fundamental part of our navy, without focusing on battleships we won't control the waters.
 CHL_the_carriers: "Перевозчики" # The Carriers
 CHL_the_carriers_desc: "Хоть и молоды в морях, но нам ясно, будущее морского боя – за авианосцами!" # Although young in the seas, it is clear to us, the future of naval combat is carriers!
 CHL_the_cruisers: "Крейсеры" # The Cruisers
 CHL_the_cruisers_desc: "Старые и надежные крейсеры понадобятся, когда приливы станут красными." # Old and reliable, the cruisers will be needed when the tides turn red.
 CHL_the_destroyers: "Разрушители" # The Destroyers
 CHL_the_destroyers_desc: "Никакой громоздкий корабль не является проблемой для быстрых эсминцев, давайте сосредоточимся на пополнении ими нашего флота!" # No bulky ship is a problem to handle for the fast destroyers, let's put our focus on filling our fleet with them!
 CHL_the_submarines: "Подводные лодки" # The Submarines
 CHL_the_submarines_desc: "Столь мощные, как и трудно ожидать, подводные лодки являются необходимым дополнением к нашим военно-морским отрядам." # As powerful as hard to expect, the submarines are a needed addition to our naval squads.
 CHL_pacific_domination: "Тихоокеанское господство" # Pacific Domination
 CHL_pacific_domination_desc: "Тихий океан — наш дом и наша территория, никто не сможет противостоять нашему господству над ним! Чили правит морем!" # The pacific is our home and our territory, no one will be able to oppose our rule of it! Chile rules the sea!
 CHL_high_above_the_andes: "Высоко над Андами" # High Above the Andes
 CHL_high_above_the_andes_desc: "Чили — это не только наши высокие горы и прекрасные моря, мы также должны контролировать небо над ними!" # Chile isn't only our tall mountains or our beautiful seas, we must control the skies above too!
 CHL_soaring_over_all: "Парящий над всем" # Soaring Over All
 CHL_soaring_over_all_desc: "Чтобы расширить наше владычество в небе, мы должны построить базы на суше, с которых можно будет взлетать." # To expand our dominion into the skies, we must build bases on land to soar from.
 CHL_protecting_our_skies: "Защищая наше небо" # Protecting Our Skies
 CHL_protecting_our_skies_desc: "Мы не остановимся ни перед чем, чтобы защитить Чили, каждую ее часть, даже если нам придется сбить каждую птицу в небе." # We will stop at nothing to protect Chile, every bit of it, even if we have to shoot down every bird in the sky.
 CHL_support_push: "Воздушная поддержка" # Air Support Push
 CHL_support_push_desc: "То, что завоевано в небе, не решает исход на суше, если только мы не используем это в своих интересах." # What is won on the skies doesnt decide the outcome on land, unless, we use it to our advantage.
 CHL_strategic_winds: "Стратегические ветры" # Strategic Winds
 CHL_strategic_winds_desc: "Война — это не случайный хаос, это стратегия и тактика. Точно так же наши бомбардировщики должны быть готовы атаковать любую стратегическую цель, которую мы решим." # War isn't random chaos, it is strategy and tactics, similarly, our bombers must be prepared to take on any strategic target we decide.
 CHL_bombing_the_bandits: "Бомбардировка бандитов" # Bombing the Bandits
 CHL_bombing_the_bandits_desc: "Иногда, чтобы защитить море, нам приходится обратиться за помощью к небесам." # Sometimes to protect the sea, we must recur to the skies for help.
 CHL_fighters_for_the_fatherland: "Борцы за Отечество" # Fighters for the Fatherland
 CHL_fighters_for_the_fatherland_desc: "Точно так же, как некоторые люди рождаются бойцами на земле, некоторые также находят бой, чтобы сражаться, но в небе." # The same way some men are born fighters on land, some also find fights to fight, but in the skies.
 CHL_masters_of_the_airs: "Мастера воздуха" # Masters of the Airs
 CHL_masters_of_the_airs_desc: "Мы пришли, чтобы контролировать небо над нами, каждую его грань, может быть, нам следует показать свое мастерство в воздухе и нашим соседям." # We have come to control the skies above us, every brink of them, maybe we should show our air mastery to our neighbours, too.
 CHL_diplomatic_path: "Дипломатический путь" # Diplomatic Path
 CHL_diplomatic_path_desc: "В предстоящем хаосе нашей стране придется защищаться и находить союзников. Давайте приложим наши усилия к дипломатии, чтобы спасти нашу страну от трагедии конфликта." # In the upcoming chaos our nation will need to defend itself and find allies, let's put our efforts in diplomacy to save our country from tragedy of conflict.
 CHL_irredentist_path: "Ирредентистский путь" # Irredentist Path
 CHL_irredentist_path_desc: "Слишком долго наша нация находилась в тени славы, которую она заслуживает, и наконец пришло время показать миру, из чего мы сделаны, и что мы будем бороться за то, чего заслуживаем." # For far too long our nation has standed in just a shadow of the glory it deserves, it's finally time to show the world what we are made of and that we will fight for what we deserve.
 CHL_reclaim_tacna: "Вернуть Такну" # Reclaim Tacna
 CHL_reclaim_tacna_desc: "Наша нация выиграла Такну после войны на Тихом океане, где многие героические чилийцы отдали за это свои жизни, а что касается Чили, однако наш старый режим предал нас и вернул ее Перу по Лимскому договору несколько лет назад, давайте исправим то, что старая республика обидела, и вернем нам заслуженное владение." # Our nation won Tacna after the War of the Pacific, where many heroic chilean men gave their lives for it, and for Chile, however, our old regime betrayed us and gave it back to Peru in the Treaty of Lima some years ago, let's set right what the old republic wronged and reclaim our deserved possession.
 CHL_retake_tacna: "Отчет Такны" # Retake Tacna
 CHL_retake_tacna_desc: "Пришло время, давайте штурмовать Лиму и вернуть себе то, что принадлежит нам по праву!" # The time has come, let's storm our way to Lima and retake what is rightfully ours!
 CHL_reclaim_the_patagonia: "Верните Патагонию" # Reclaim the Patagonia
 CHL_reclaim_the_patagonia_desc: "С момента зарождения нашей нации мы знали, что Патагония принадлежит нам, поскольку наша судьба — заселить ее обширные равнины, однако грязные аргентинцы украли нашу заявленную землю, когда мы были заняты войной несколько десятилетий назад, давайте вернем то, что было насильственно украдено." # Since the birth of our nation, we have known the Patagonia belongs to us, as our destiny is to populate its vast plains, however, the dirty Argentines stole our claimed land when we were busy in war decades ago, let's reclaim what was forcefully stolen.
 CHL_retake_the_patagonia: "Верните Патагонию" # Retake the Patagonia
 CHL_retake_the_patagonia_desc: "Хватит ждать, давайте воспользуемся этим подходящим моментом хаоса и конфликта, чтобы нанести удар по Аргентине и захватить то, что было создано для того, чтобы мы могли удержать, всю Патагонию!" # No more waiting, let's take this opportune time of chaos and conflict to strike Argentina and take what was made for us to hold on to, all of Patagonia!
 CHL_claim_the_empire: "Заявите права на Империю" # Claim the Empire
 CHL_claim_the_empire_desc: "Наша нация слишком долго сидела без дела, пока европейские державы пришли и оказали влияние на Чили и Южную Америку, хотя сейчас мы бодрствуем, британцы все еще контролируют острова Тихого океана; острова, которые лучше подошли бы под владение Чили, у Британской империи дела идут не так хорошо, давайте заявим права на их тихоокеанские владения!" # Our nation sat idle too long as european powers came and influenced Chile and South America, even though now we are awake, the British still controls the pacific islands; islands which would better fit under Chile's possession, the British Empire isn't doing so good, let's claim their pacific holdings for ourselves!
 CHL_strike_the_empire_desc: "Британская империя находится в слабом месте, теперь пришло время Чили выйти вперед и захватить то, что мы заслуживаем и по праву владеем, контроль над Тихим океаном, давайте захватим тихоокеанские острова Империи!" # The British Empire is at a weak point, now it is time for Chile to step forward and seize what we deserve and rightfully own, control over the pacific, let's seize the Empire's Pacific Islands!
 CHL_strike_the_empire: "Удар по Империи" # Strike the Empire
 CHL_elections_forty: "Выборы 1940 года" # Elections of 1940
 CHL_elections_forty_desc: ""
 CHL_president_rios: "Президент Риос" # President Rios
 CHL_president_rios_desc: "Хуан Антонио Риос, кандидат от Радикальной партии, победил на выборах, пообещав провести реформы, которые давно были обещаны нашей стране, и, чтобы действовать непосредственно как преемник наследия Монтеро, он внедрит новую модель." # Juan Antonio Rios, the Partido Radical's candidate, has won the election, with promises of bringing forth the reforms that long ago our country was promised, and to proceed directly as a successor of Montero's legacy, he will implement a new model.
 CHL_radical_industry: "Радикальные промышленные инвестиции" # Radical Industrial Investment
 CHL_radical_industry_desc: "Наша страна может выжить только за счет ресурсов, давайте сосредоточим нашу экономическую модель на государственных расходах как способе создания новой промышленной экспансии." # Our country can survive off only resources, let's focus our economic model on government spending as a way of creating new industrial expansion.
 CHL_sharing_is_caring: "Делиться – значит заботиться" # Sharing is Caring
 CHL_sharing_is_caring_desc: "Делиться значит заботиться, по сей день бедные и несчастные бродят по улицам, мы не можем позволить этим бедным душам страдать еще больше, давайте создадим сеть благосостояния, которая поможет менее удачливым в нашем обществе." # Sharing is Caring, to this day, the poor and unfortunate ones roam the streets, we can't let these poor souls suffer more, let's create a welfare network that helps the less fortunate ones in our society.
 CHL_president_cruz_coke: "Президент Круз-Кока" # President Cruz-Coke
 CHL_president_cruz_coke_desc: "Эдуардо Круз-Кок Лассабе, кандидат от Партии консерваторов, победил на выборах, его христианские ценности и социальный подход к реформам здравоохранения обеспечили ему народную поддержку." # Eduardo Cruz-Coke Lassabe, Partido Conservador's candidate, has won the election, his christian values and social approach to health reforms, have given him the popular support.
 CHL_responsible_investments: "Ответственные инвестиции" # Responsible Investments
 CHL_responsible_investments_desc: "Правительство должно играть поддерживающую роль в нашей экономике, стимулируя и защищая ее, но осторожно, чтобы не вмешиваться слишком сильно, чтобы не испортить ее и не разрушить наш бюджет." # The government must take a supportive role in our economy, boosting and protecting it, but careful to not intervene too much, as to mess with it and ruin our budget.
 CHL_balanced_budget: "Сбалансированный бюджет" # Balanced Budget
 CHL_balanced_budget_desc: "Кризис несколько раз приводил нашу страну к банкротству, давайте сбалансируем национальный бюджет, чтобы нам не пришлось пережить крах из-за будущих трудностей." # Crisis have brought our nation to bankrupcy several times, let's balance the national budget so that way we don't have to go through collapse on future difficulties.
 CHL_president_ross: "Президент Росс" # President Ross
 CHL_president_ross_desc: "Густаво Росс, кандидат от Либеральной партии, известный экономист и сторонник свободного рынка, победил на выборах, его меры жесткой экономии и либеральные экономические идеи, похоже, получили поддержку среди нашего населения." # Gustavo Ross, Partido Liberal's candidate, prominent economist and free-market advocate, has won the election, his austerity measures and liberal economic ideas seem to have gained support amongst our population.
 CHL_seek_foreign_capital: "Ищите иностранный капитал" # Seek Foreign Capital
 CHL_seek_foreign_capital_desc: "Нашему правительству слишком долго приходилось субсидировать нашу промышленность, давайте выведем Чили на передний план мира, ища иностранных инвесторов, заинтересованных во взаимовыгодном соглашении." # Our government has had to subsidize our industry for too long, let's bring Chile to the front of the world by seeking foreign investors interested in a mutually profitable arrangement.
 CHL_develop_our_resources: "Развивайте наши ресурсы" # Develop Our Resources
 CHL_develop_our_resources_desc: "Наша нация слишком долго отвлекалась на наши неудачи, чтобы понять, что сокровище находится под нашими ногами, давайте эксплуатировать богатства полезных ископаемых под нашей землей!" # Our nation has been distracted by our failings for too long, to realise that a treasure is beneath our feet, let's exploit the mineral fortune under our soil!
 CHL_president_grove: "Президент Гроув" # President Grove
 CHL_president_grove_desc: "Мармадюк Гроув, кандидат от Радикально-социалистической партии, бывший военный и известный деятель демократических социалистов, был избран, хотя некоторые считают их предложения слишком марксистскими по своей природе, он, похоже, искренне хочет править демократически." # Marmaduque Grove, Partido Radical Socialista's candidate, former military man and notorious democratic socialist figure, has been elected, while several consider their proposals too marxist in their nature, he seems to genuinely want to rule democratically.
 CHL_improve_social_situation: "Улучшение социальной ситуации" # Improve Social Situation
 CHL_improve_social_situation_desc: "На протяжении десятилетий социальная проблема занимала видное место в нашем обществе, давайте инвестировать в улучшение условий жизни и инфраструктуры для утомленных рабочих, чтобы каждый мог гордиться нашей нацией." # For decades the social issue has been prominent as an issue in our society, let's invest in better living conditions and infrastructure for the fatigated workers, so that everyone can be proud of our nation.
 CHL_new_agrarian_reform: "Новая аграрная реформа" # New Agrarian Reform
 CHL_new_agrarian_reform_desc: "Большая часть нашей страны по-прежнему является аграрной, даже если она быстро сокращается из-за урбанизации, давайте реформируем земли, чтобы улучшить производство продуктов питания и жизнь нашей сельской местности, которая составляет большую часть низшего класса нашей страны." # A big part of our country is still agrarian, even if quickly diminishing due to urbanization, let's reform the lands to improve our food production and the life of our countryside, which is a big part of our country's lower class.
 CHL_academics_for_progress: "Академики ради прогресса" # Academics For Progress
 CHL_academics_for_progress_desc: "Пришло время продвигать нашу страну вперед, давайте сосредоточим внимание на инвестициях в науку, а также на разработку и адаптацию новейших технологий для себя." # It's time to bring our nation forward, let's put our focus on investing in academics, as to develop and adapt the latest technologies for ourselves.
 CHL_denounce_socialism: "Осудить социализм" # Denounce Socialism
 CHL_denounce_socialism_desc: "Крайние формы социализма угрожают Южной Америке и нашей стране, возможно, было бы хорошей идеей осудить эту идеологию, чтобы мир знал, где мы находимся." # Extreme forms of socialism are threatening South America and our nation, it may be a good idea to denounce the ideology so the world knows where we stand.
 CHL_intervene_in_bolivia: "Вмешательство в Боливию" # Intervene in Bolivia
 CHL_intervene_in_argentina: "Вмешательство в Аргентину" # Intervene in Argentina
 CHL_intervene_in_argentina_desc: "Аргентина поддалась чуме социализма. Наша нация подвергнется вторжению в их идеологический крестовый поход, если мы не воспользуемся шансом и не остановим их прежде, чем они смогут это сделать." # Argentina has succumbed to the plague of socialism. Our nation will be invaded in their ideological crusade, unless we take the chance and stop them before they can do that.
 CHL_friends_with_democracy: "Друзья с демократией" # Friends with Democracy
 CHL_friends_with_democracy_desc: "В этом конфликтном мире мы не можем оставаться в одиночестве, демократические страны должны поддерживать друг друга, давайте будем дружелюбны к другим демократическим режимам." # In this conflictive world we can't stand alone, democracies have to support each other, let's be friendly to other democratic regimes.
 CHL_standing_up_for_democracy: "Борьба за демократию" # Standing Up for Democracy
 CHL_standing_up_for_democracy_desc: "Хотя никто еще не решил встать на защиту демократии, мы это сделаем. Мы должны возглавить демократические страны Южной Америки, поскольку предстоящий конфликт наверняка решит судьбу всех нас." # While no one else has decided to stood up to defend democracy, we will. We have to lead the democracies of south america, as the upcoming conflict will surely decide the fate of us all.
 CHL_unlikely_friends: "Маловероятные друзья" # Unlikely Friends
 CHL_unlikely_friends_desc: "Две войны и много соперничества, перуанцы редко были к нам дружелюбны. Однако в эти критические времена, сейчас как никогда, мы приветствуем любого друга, давайте пригласим его в наш альянс по защите демократии." # Two wars and many rivalries, the peruvians have rarely been friendly to us. However, in these critical times, now more than ever, any friend is welcome, let's invite them into our alliance for protecting democracy.
 CHL_highlands_allies: "Хайлендские союзники" # Highlands Allies
 CHL_highlands_allies_desc: "Друг Чили, когда мы окружены врагами со всех сторон, Эквадор является примером демократии высоко над Андами, и их помощь понадобится для ее защиты. Давайте пригласим их в наш альянс." # A friend to Chile when we have been surrounded by enemies on all sides, Ecuador is an example of democracy from high above the Andes, their help will be needed to defend it. Let's invite them into our alliance.
 CHL_friends_with_authority: "Друзья с авторитетом" # Friends with Authority
 CHL_friends_with_authority_desc: "Либеральные демократии ввели многие страны в хаос. Чтобы оставаться сильными, мы должны подавать пример и иметь дело только с другими авторитарными режимами, которые понимают, как правильно управлять собой." # Liberal democracies have misguided many nations into chaos, to stand strong we must set the example, and deal only with fellow authoritarian regimes that understand how to properly rule themselves.
 CHL_standing_up_strong: "Стоять сильно" # Standing Up Strong
 CHL_standing_up_strong_desc: "Время кризиса приближается к Южной Америке. Как и ожидалось, мы будем сильными и дерзкими, когда начнется конфликт, и будем вести тех, кто желает, в будущее Южной Америки." # Time of crisis approaches South America. As expected, we will stand strong and defiant as conflict sets in, and will guide those willing into the future of South America.
 CHL_viceroyalty_ties: "Связи с вице-королевством" # Viceroyalty Ties
 CHL_viceroyalty_ties_desc: "Хотя на протяжении многих лет у нас были не самые лучшие отношения, мы не можем отрицать, что мы добрые братья, рожденные от одного наместничества. Давайте заключим договор с Перу, поскольку наши режимы понимают, как правильно управлять своими странами." # While we haven't had the best relations over the years, we can't deny we are kind, brothers born from the same viceroyalty. Let's form a pact with Peru, as our regimes understand the proper way of ruling their nations.
 CHL_friends_beyond_the_andes: "Друг за Андами" # Friend beyond the Andes
 CHL_friends_beyond_the_andes_desc: "Хотя, находясь по другую сторону Южной Америки, мы не можем отрицать, что Венесуэла разделяет наши взгляды, особенно в наше время, когда идеологические экстремисты угрожают нациям, пакт может быть взаимовыгодным для всех участников." # Although on the other side of South America, we can't deny that Venezuela is of similar mind to us, specially in this time of ideological extremists endangering nations, a pact may be mutually benefitial for all involved.


