 cruiser_submarine_desc: "$ship_hull_cruiser_submarine_desc$"
  
 fleet_submarine: "$ship_hull_fleet_submarine$"
 fleet_submarine_desc: "$ship_hull_fleet_submarine_desc$"
  
 midget_submarine: "$ship_hull_midget_submarine$"
 midget_submarine_desc: "$ship_hull_midget_submarine_desc$"
  
 rocket_submarine: "Ракетная подлодка"
 rocket_submarine_desc: "Новое поколение подводных лодок, оснащенных ракетами и пусковыми установками, которые позволяют нам наносить неожиданные удары по стратегическим целям противника"
  
 nuclear_submarine: "$ship_hull_nuclear_submarine$"
 nuclear_submarine_desc: "$ship_hull_nuclear_submarine_desc$"
  
 nuclear_missile_submarine: "Подлодка с ядерными ракетами"
 nuclear_missile_submarine_desc: "Подводные лодки, способные иметь на вооружении ядерные ракеты и запускать их по нашим целям. Они могут нести смерть и уничтожать целые города — и никто даже не успеет понять, что произошло."
  
 submarine_1_desc: "The first submersible warships actually capable of effective combat actions, these designs are significant improvements over their predecessors. With diesel-electric engines replacing the primarily petrol-electric engines of the first submarines, they have greatly improved range and surface speed compared with their predecessors. In combat with enemy warships, they act mainly as submersible light torpedo boats, but lack the submerged speed or endurance to remain underwater for more than relatively brief periods. These are the submarines that were used by the major naval powers during the Weltkrieg."
 submarine_2_desc: "The evolution of the earlier submarine designs, some of these warships took 'cruiser' submarines ideas further, with larger guns and a greater emphasis on surface abilities, while others look in the other direction, seeking to increase underwater capabilities and performance."
 submarine_3_desc: "The gains made by some earlier designs in extending underwater range, speed, and overall abilities, led to the turn in submarine development away from 'cruiser' types and back towards vessels with a greater emphasis on underwater capabilities. Vastly improved over earlier types, these submarines carry potent payloads of torpedoes and are a legitimate threat to almost all surface ships. However, they are still limited in submerged duration, range, and speed, and remain vulnerable when surfaced, especially to aircraft."
 submarine_4_desc: "With greatly increased battery capacity, advanced systems to refresh air while still submerged, and overall refined designs, these are the first submarines intended to be able to remain submerged for most of the duration of their time at sea. As such, they mark a massive shift in naval warfare, and the ascendancy of submarines to being true terrors. Such warships offer the ability to dominate the oceans to those nations that developed and deployed them."
 ship_hull_submarine_1_desc: "$submarine_1_desc$"
 ship_hull_submarine_2_desc: "$submarine_2_desc$"
 ship_hull_submarine_3_desc: "$submarine_3_desc$"
 ship_hull_submarine_4_desc: "$submarine_4_desc$"
  
 destroyer_1: "Эсминец I"
 destroyer_2: "Эсминец II"
 destroyer_3: "Эсминец III"
 destroyer_4: "Эсминец IV"
 destroyer_1_desc: "Для эффективной защиты торговых конвоев необходимо доработать эсминцы Великой войны. Боевую мощь заметно улучшат дополнительные торпеды."
 destroyer_2_desc: "Увеличенная дистанция хода торпед, быстрое заряжание и усиленные орудия ПВО обеспечивают эффективность и универсальность эсминцев."
 destroyer_3_desc: "Для защиты от угроз сверху и снизу эсминцы получают радары и современное протоволодочное и противовоздушное вооружение."
 destroyer_4_desc: "Современный эсминец характеризуется наличием различных технологий обнаружения, новой системой сброса глубинных бомб, а также увеличенными по сравнению с предшественниками размерами."
 ship_hull_light_1_desc: "$destroyer_1_desc$"
 ship_hull_light_2_desc: "$destroyer_2_desc$"
 ship_hull_light_3_desc: "$destroyer_3_desc$"
 ship_hull_light_4_desc: "$destroyer_4_desc$"
  
 ship_hull_cruiser_panzerschiff: "Броненосец"
 ship_hull_cruiser_panzerschiff_desc: "В попытке достичь недостижимого немецкие инженеры объединили корпус крейсера и вооружение, почти не уступающее линкорам. В результате был рожден корабль, превосходящий огневой мощью любой другой линкор, но при этом крайне дорогой, относительно небыстрый и при этом слабо бронированный."
  
 light_cruiser_1: "Легкий крейсер I"
 light_cruiser_2: "Легкий крейсер II"
 light_cruiser_3: "Легкий крейсер III"
 light_cruiser_4: "Легкий крейсер IV"
  
 torpedo_cruiser: "$ship_hull_torpedo_cruiser$"
 torpedo_cruiser_desc: "$ship_hull_torpedo_cruiser_desc$"
  
 light_cruiser_1_desc: "Быстрые и маневренные легкие крейсера оказываются незаменимыми для разведки."
 light_cruiser_2_desc: "Послевоенные договоры сдерживают развитие крейсеров, но даже с учетом всех ограничений можно создать легкий корабль с достаточным вооружением."
 light_cruiser_3_desc: "Более крупные и бронированные крейсера подбираются вплотную к ограничениям соглашения, но все еще остаются формально в классе легких крейсеров."
 light_cruiser_4_desc: "Ограничения ушли в прошлое, и новейшее поколение легких крейсеров получило более мощное вооружение, а также эффективные системы ПВО."
  
 heavy_cruiser_1: "Тяжелый крейсер I"
 heavy_cruiser_2: "Тяжелый крейсер II"
 heavy_cruiser_3: "Тяжелый крейсер III"
 heavy_cruiser_4: "Тяжелый крейсер IV"
 heavy_cruiser_1_desc: "Вашингтонское морское соглашение было призвано сдержать гонку вооружений в классе крейсеров, но тщетно. Более легкое бронирование позволяет установить более мощные орудия."
 heavy_cruiser_2_desc: "Несмотря на конференции и соглашения, продолжается установка тяжелого вооружения на легкие крейсера, хотя бронирование по-прежнему оставляет желать лучшего."
 heavy_cruiser_3_desc: "Ограничения забыты, весь мир строит тяжелые крейсера с серьезным бронированием, а также улучшенными системами ПВО для защиты от авианалетов противника."
 heavy_cruiser_4_desc: "Вершиной развития тяжелых крейсеров становятся современные образцы увеличенного размера с улучшенной бронезащитой, а также скорострельными орудиями."
 ship_hull_cruiser_1_desc: "$light_cruiser_1_desc$"
 ship_hull_cruiser_2_desc: "$light_cruiser_2_desc$"
 ship_hull_cruiser_3_desc: "$light_cruiser_3_desc$"
 ship_hull_cruiser_4_desc: "$light_cruiser_4_desc$"
  
 battle_cruiser_1: "Линейный крейсер I"
 battle_cruiser_2: "Линейный крейсер II"
 battle_cruiser_3: "Линейный крейсер III"
 battle_cruiser_4: "Линейный крейсер IV"
 battle_cruiser_1_desc: "Послевоенные линейные крейсера представляют собой тяжеловооруженные корабли, уступающие линкорам в бронировании, но выигрывающие в скорости."
 battle_cruiser_2_desc: "Модернизированные линейные крейсера по-прежнему быстрее даже новейших линкоров, и при этом они получили новые системы управления огнем, обнаружения и ПВО."
 battle_cruiser_3_desc: "Прогресс в проектировании линейных крейсеров сопровождался переоценкой роли этих кораблей и корректировкой траектории предыдущих разработок. Сохранив посредственную броню своих предшественников, эти корабли изменили курс в отношении своих орудий, в целом перейдя к уменьшению диаметра ствола в пользу орудий с большей начальной скоростью снаряда. Большинство из них вооружены шестью главными орудиями в сдвоенных или сдвоенных башнях, и большинство из этих орудий имеют калибр 11-12 дюймов или эквивалентный."
 battle_cruiser_4_desc: "К середине 1940-х годов эволюция линейных крейсеров достигла своего апогея: корабли, обладающие скоростью крейсеров, но при этом огневой мощью, достаточной для того, чтобы представлять угрозу для настоящих линейных боевых кораблей и держать их в напряжении. Хотя огневая мощь этих кораблей стала менее полезной с появлением авианосцев, они нашли широкое применение в береговых бомбардировках и сопровождении авианосцев. Функционально значительно увеличенные крейсеры с гораздо более тяжелой броней и орудиями, большинство из которых вооружены шестью-девятью главными орудиями сверхвысокой скорости, что обеспечивает бронепробиваемость и дальность стрельбы, достаточные для эффективного поражения линкоров, а также позволяет им эффективно действовать в качестве одиночных рейдеров на конвои, более чем способных справляться с эскортными эсминцами и более легкими крейсерами."
  
 battleship_1: "Линкор I"
 battleship_2: "Линкор II"
 battleship_3: "Линкор III"
 battleship_4: "Линкор IV"
 battleship_1_desc: "Пережиток прошлых эпох для одних, величайшие корабли в мире для других — как ни крути, это самые бронированные и тяжеловооруженные корабли из когда-либо построенных, вершина гонки вооружений на море."
 battleship_2_desc: "Новое поколение линкоров остается в рамках ограничений и отличается улучшенными стабильностью и дальностью."
 battleship_3_desc: "Более прочная броня, более мощная энергетическая установка, крупнокалиберные пушки и орудия ПВО позволяют линкорам сохранять эффективность в условиях повсеместного присутствия боевой авиации."
 battleship_4_desc: "Новые линкоры, которые могут стать последним поколением уходящей эпохи, разработаны с упором на мощь орудий и эффективность ПВО."
 ship_hull_heavy_1_desc: "$battleship_1_desc$"
 ship_hull_heavy_2_desc: "$battleship_2_desc$"
 ship_hull_heavy_3_desc: "$battleship_3_desc$"
 ship_hull_heavy_4_desc: "$battleship_4_desc$"
  
 carrier_1: "Авианосец I"
 carrier_2: "Авианосец II"
 carrier_3: "Авианосец III"
 carrier_4: "Авианосец IV"
 carrier_1_desc: "Военные теоретики утверждают, что будущее — за ВВС. Первым шагом к новой доктрине становится превращение старых военных и гражданских кораблей в авианосцы."
 carrier_2_desc: "Конструкторы авианосцев пытаются создать корабль с высокой скоростью и запасом хода, чтобы не оставать от остального флота, и при этом уложиться в ограничения морских соглашений."
 carrier_3_desc: "Общее улучшение конструкции и специализированные разработки, наподобие бортовых подъемников, повышают эффективность авианосцев."
 carrier_4_desc: "По мере того как соглашения теряют свою силу, мы получаем возможность разрабатывать более современные и вместительные авианосцы, чтобы завоевать превосходство в воздухе."
 ship_hull_carrier_conversion_ca_desc: "$carrier_1_desc$"
 ship_hull_carrier_1_desc: "$carrier_2_desc$"
 ship_hull_carrier_2_desc: "$carrier_3_desc$"
 ship_hull_carrier_3_desc: "$carrier_4_desc$"
  
 SH_battleship_1: "Сверхтяжелый линкор I"
 SH_battleship_2: "Сверхтяжелый линкор II"
 SH_battleship_1_desc: "Выполнение соглашений осталось далеко в прошлом. Отбросив ограничения, мы можем создать самый тяжелый и мощный линкор, способный вести бой с несколькими противниками сразу."
 SH_battleship_2_desc: "Новое слово в концепции супертяжелых кораблей: более мощные орудия и улучшенная система управления огнем."
 ship_hull_super_heavy_1_desc: "Выполнение соглашений осталось далеко в прошлом. Отбросив ограничения, мы можем создать самый тяжелый и мощный линкор, способный вести бой с несколькими противниками сразу."
  
 ship_hull_light_1: "Ранний эсминец"
 ship_hull_light_2: "Базовый эсминец"
 ship_hull_light_3: "Улучшенный эсминец"
 ship_hull_light_4: "Модернизированный эсминец"
  
 ship_hull_cruiser: "Крейсер"
 ship_hull_cruiser_desc: "Крейсеры — опора любого флота; они выполняют самые различные функции: от эскортных и разведывательных задач для легких крейсеров до поддержки ударной группы для тяжелых."
 ship_hull_cruiser_1: "Ранний крейсер"
 ship_hull_cruiser_2: "Базовый крейсер"
 ship_hull_cruiser_3: "Улучшенный крейсер"
 ship_hull_cruiser_4: "Модернизированный крейсер"
  
 ship_hull_heavy: "Тяжелый корабль"
 ship_hull_heavy_desc: "Эти бронированные великаны стали символом военно-морской мощи, хотя некоторые эксперты сомневаются в их эффективности в эпоху авиации и подводных лодок."
 ship_hull_heavy_1: "Ранний тяжелый корабль"
 ship_hull_heavy_2: "Базовый тяжелый корабль"
 ship_hull_heavy_3: "Улучшенный тяжелый корабль"
 ship_hull_heavy_4: "Модернизированный тяжелый корабль"
  
 ship_hull_heavy_modern: "Современный линкор"
  
 ship_hull_carrier: "Авианосец"
 ship_hull_carrier_desc: "После многих лет экспериментов авианосец постепенно превратился в самостоятельный класс. Эти корабли способны нести всё более эффективную авиацию и со временем грозят занять первое место по важности в составе флотов."
 ship_hull_carrier_conversion_bb: "Переделанный линкор"
 ship_hull_carrier_conversion_bb_desc: "После многих лет экспериментов авианосец постепенно превратился в самостоятельный класс. Эти корабли способны нести всё более эффективную авиацию и со временем грозят занять первое место по важности в составе флотов."
 ship_hull_carrier_conversion_ca: "Переделанный крейсер"
 ship_hull_carrier_1: "Базовый авианосец"
 ship_hull_carrier_2: "Улучшенный авианосец"
 ship_hull_carrier_3: "Модернизированный авианосец"
  
 ship_hull_carrier_modern: "Современный авианосец"
 ship_hull_carrier_modern_desc: "Самые крупные и передовые авианосцы, разработанные с использованием самых современных технологий. Их можно оснастить новейшим вооружением и оборудованием."
  
 ship_hull_submarine: "Подводная лодка"
 ship_hull_submarine_desc: "Современная подводная лодка далеко ушла от своих несложных предшественниц эпохи Великой войны; сегодня при весьма скромной стоимости она представляет собой угрозу любому кораблю вне зависимости от его размеров."
 ship_hull_submarine_1: "Ранняя подводная лодка"
 ship_hull_submarine_2: "Базовая подводная лодка"
 ship_hull_submarine_3: "Улучшенная подводная лодка"
 ship_hull_submarine_4: "Модернизированная подводная лодка"
  
 ship_hull_pre_dreadnought: "Додредноут"
 ship_hull_pre_dreadnought_desc: "Додредноут — отголосок эпохи до того, как гонка дредноутов превратилась в Великую войну. В современных условиях их боевая ценность крайне ограничена."
 ship_hull_cruiser_panzerschiff: "Броненосец"
 ship_hull_cruiser_panzerschiff_desc: "В попытке достичь недостижимого немецкие инженеры объединили корпус крейсера и вооружение, почти не уступающее линкорам. В результате был рожден корабль, превосходящий огневой мощью любой другой линкор, но при этом крайне дорогой, относительно небыстрый и при этом слабо бронированный."
 ship_hull_cruiser_coastal_defense_ship: "Корабль береговой обороны"
 ship_hull_cruiser_coastal_defense_ship_desc: "Эти относительно дешевые корабли слишком малы для полноценных океанических сражений. Они жертвуют дальностью хода ради тяжелого вооружения и брони."
 ship_hull_torpedo_cruiser: "Торпедный крейсер"
 ship_hull_torpedo_cruiser_desc: "Легкие крейсеры, несущие большое количество торпедных аппаратов за счет меньшего числа орудий главного калибра и установок ПВО."
 ship_hull_super_heavy_1: "Сверхтяжелый линкор"
 ship_hull_cruiser_submarine: "Подводный крейсер"
 ship_hull_cruiser_submarine_desc: "Большая подводная лодка, приспособленная для операций на больших расстояниях. Ее можно оснастить дополнительными топливными цистернами, чтобы сделать радиус действия еще больше, или снабдить небольшим самолетом-разведчиком."
 ship_hull_midget_submarine: "Сверхмалая подводная лодка"
 ship_hull_midget_submarine_desc: "Небольшая подлодка, управляемая малым экипажем. Сниженная дальность действия и объем вооружения компенсируются высокими темпами производства."
 ship_hull_fleet_submarine: "Эскадренная подводная лодка"
 ship_hull_fleet_submarine_desc: "Подводные лодки, которые благодаря большой дальности хода могут выполнять функции эскорта и поддержки надводного флота."
 ship_hull_carrier_submarine: "Подводный авианосец"
 ship_hull_carrier_submarine_desc: "Большой корпус подводной лодки, способный вмещать самолеты и запускать их для выполнения различных заданий."
 ship_hull_nuclear_submarine: "Атомная подводная лодка"
 ship_hull_nuclear_submarine_desc: "Благодаря ядерным реакторам наши подводные лодки смогут долгое время действовать под водой, сохраняя при этом высокую скорость. Это сделает их особенно смертоносным оружием в нашем арсенале."
 ship_hull_mega_carrier: "Авианосец-ледокол"
 ship_hull_mega_carrier_desc: "Гигантский авианосец, построенный из экспериментальных композитных материалов, содержащих лёд, — таких как пайкерит. На нем могут базироваться обычные самолеты, что увеличивает дальность полета нашей морской авиации."
 support_ship_hull: "Корабль поддержки"
 support_ship: "Корабль поддержки"
 support_ship_1: "Корабль поддержки"
 support_ship_1_desc: "Корабли поддержки — небоевые суда материально-технического обеспечения. Снабжают боевые соединения топливом и припасами, благодаря чему те могут дольше выполнять боевые задачи."
 support_ship_2: "Улучшенный корабль поддержки"
 support_ship_2_desc: "Мы обратились к практическому опыту и спроектировали более совершенный корабль поддержки флотов с увеличенной дальностью действия."
 repair_ship_hull: "Ремонтный корабль"
 repair_ship: "Ремонтный корабль"
 repair_ship_1: "Ремонтный корабль"
 repair_ship_1_desc: "Эти корабли перевозят тяжелое ремонтно-восстановительное оборудование. Именно от них зависит, куда пойдет поврежденный корабль: обратно в порт или на дно."
 repair_ship_2: "Улучшенный ремонтный корабль"
 repair_ship_2_desc: "Усовершенствованное судно, оснащенное самым современным оборудованием. Способно спасти даже сильно поврежденные корабли, если те не понесли непоправимый ущерб."
 ship_hull_escort_carrier: "Авианосец сопровождения"
 ship_hull_escort_carrier_desc: "Менее крупный и более недорогой авианосец. Вместо непосредственного участия в боях обычно сопровождает конвои и занимается противолодочной борьбой. Перевозит небольшую, но полезную в бою авиагруппу."
  
 screen_ship: "Охранение"
 capital_ship: "Крупные корабли"
