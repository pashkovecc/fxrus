 ace_promoted.1.t: "Летчик-ас получает повышение"
 ace_promoted.2.t: "Возвращение аса"
 ace_promoted.1.d: "Few take as many risks as the brave pilots of the [Root.GetAdjective] air force. [From.GetName] [From.GetSurname], a skilled pilot known under the callsign [From.GetCallsign], has distinguished [From.GetHerselfHimself] in not only returning alive from the recent mission over [From.GetMissionRegion], but living through significant victories in many critical encounters.\n\nHeld up as a shining example of [Root.GetAdjective] courage, [From.GetName]'s recent promotion has been highly publicised. Although the people may view war as more hell than glory, many are glad to see that there are still heroes to rally behind." #NT!
 ace_promoted.1.d_major: "Few take as many risks as the brave pilots of the [Root.GetAdjective] air force. [From.GetName] [From.GetSurname], a skilled pilot known under the callsign [From.GetCallsign], has distinguished [From.GetHerselfHimself] in not only returning alive, but piloting [From.GetHerHis] [From.GetWing] with immense skill. Recently, [From.GetName] was on a mission over [From.GetMissionRegion] and was instrumental to the success of this critical encounter.\n\nHeld up as a shining example of [Root.GetAdjective] courage, [From.GetName]'s recent promotion has been highly publicised. Although the people may view war as more hell than glory, many are glad to see that there are still heroes to rally behind." #NT!
 ace_promoted.1.a: "Смелость города берет."
  
 ace_died.1.t: "Гибель пилота [From.GetCallsign] над регионом [From.GetMissionRegion]"
 ace_died.1.d: "One of [From.Owner.GetName]'s most famous [From.GetAceType] aces, [From.GetFullName], has gone down in flames in the line of duty, during a mission over [From.GetMissionRegion]. Unfortunately, since [From.GetSheHe] has long since been a public figure, the demise of [From.GetCallsign] is severely demoralising to the many people who looked up to [From.GetHerHim].\n\nWhile we wish there was a way to hide this event from the people, the lack of public appearances from [From.GetName] would soon raise suspicion. Ultimately, [From.GetHerHis] death is another part of a legend that will hopefully live on long past our current troubles." #NT!
 ace_died.1.d_major: "One of [From.Owner.GetName]'s most famous [From.GetAceType] aces, [From.GetFullName], has gone down in the line of duty. Pilots returning from the mission report having spotted [From.GetHerHis] [From.GetWingShort] going down in flames over [From.GetMissionRegion] after taking heavy enemy fire. Unfortunately, since [From.GetSheHe] has long since been a public figure, the demise of [From.GetCallsign] is severely demoralising to the many people who looked up to [From.GetHerHim].\n\nWhile we wish there was a way to hide this event from the people, the lack of public appearances from [From.GetName] would soon raise suspicion. Ultimately, [From.GetHerHis] death is another part of a legend that will hopefully live on long past our current troubles." #NT!
 ace_died.1.a: "Живая легенда — это еще лучше."
  
 ace_killed_by_ace.1.t: "[From.GetFullName] сбит асом с позывным [Prev.GetCallsign]"
 ace_killed_by_ace.1.d: "Pilots returning from [From.GetMissionRegion] report that a squadron of [Prev.Owner.GetAdjective] aircrafts, led by the infamous [Prev.GetCallsign], focused on chasing down [From.GetCallsign]. After dodging several burst from the [Prev.Owner.GetAdjective]s and taking down a number of enemy aircraft, [From.GetCallsign] was overwhelmed by [Prev.GetCallsign], who reportedly outmanoeuvred [From.GetHerHim] and ripped the fuel tanks open with a clean hit. [From.GetName] [From.GetSurname]'s plane caught fire and went spiraling down over [From.GetMissionRegion] in a violent inferno.\n\n[From.GetFullName] has shown great courage throughout [From.GetHerHis] service and was looked up to by many. The loss of this national hero is a great blow to the [From.Owner.GetAdjective] air force and is a devastating blow to our nation as a whole. Knowing that while we grieve, [Prev.Owner.GetName] is celebrating [Prev.GetFullName] as a hero, makes the tragedy even greater." #NT!
 ace_killed_by_ace.1.d_major: "Pilots returning from [From.GetMissionRegion] report that, a squadron of [Prev.Owner.GetAdjective] aircrafts led by the infamous [Prev.GetCallsign] focused on chasing down [From.GetCallsign]. After taking down a number of enemy aircraft and dodging several burst from the [Prev.Owner.GetAdjective]s, [From.GetCallsign] was overwhelmed by [Prev.GetCallsign] in his [Prev.GetWingShort], who reportedly outmanoeuvred [From.GetHerHim] and ripped the fuel tanks open with a clean hit. [From.GetName] [From.GetSurname]'s [From.GetWingShort] caught fire and went spiraling down over [From.GetMissionRegion] in a violent inferno.\n\n[From.GetFullName] has shown great courage throughout [From.GetHerHis] service and was looked up to by many. The loss of this national hero is a great blow to the [From.Owner.GetAdjective] air force and is a devastating blow to our nation as a whole. Knowing that while we grieve, [Prev.Owner.GetName] is celebrating [Prev.GetFullName] as a hero, makes the tragedy even greater." #NT!
 ace_killed_by_ace.1.a: "Сокрушительная потеря для всех нас"
  
 ace_killed_other_ace.1.t: "[From.GetFullName] сбил аса с позывным [Prev.GetCallsign]"
 ace_killed_other_ace.1.d: "Our latest mission over [From.GetMissionRegion] was a great success for the [From.Owner.GetAdjective] air force in more than one aspect. Reports have come in highlighting [From.GetFullName]'s heroic deed, managing to outwit the [Prev.Owner.GetAdjective] pilot, [Prev.GetName] [Prev.GetSurname], known as [Prev.GetCallsign]. [From.GetCallsign] used [From.GetHerselfHimself] as bait and lured [Prev.GetCallsign] into a trap where the [From.Owner.GetAdjective] pilots were able to dive on [Prev.GetCallsign]'s squadron. [From.GetCallsign] proceeded to outmanoeuvre the [Prev.Owner.GetAdjective] aircrafts and with a single burst sent [Prev.GetCallsign] spiraling from the skies of [From.GetMissionRegion].\n\n[Prev.GetFullName] was a feared pilot with many [From.Owner.GetAdjective] lives on [Prev.GetHerHis] conscience. This is a great victory and shows that when we rally behind great heroes, they perform great deeds." #NT!
 ace_killed_other_ace.1.d_major: "Our latest mission over [From.GetMissionRegion] was a great success for the [From.Owner.GetAdjective] air force in more than one aspect. Reports have come in highlighting [From.GetFullName]'s heroic deed, managing to outwit the [Prev.Owner.GetAdjective] pilot, [Prev.GetName] [Prev.GetSurname], known as [Prev.GetCallsign]. [From.GetCallsign] used [From.GetHerselfHimself] as bait and lured [Prev.GetCallsign] into a trap where the [From.Owner.GetAdjective] pilots were able to dive on [Prev.GetCallsign]'s squadron. [From.GetCallsign] proceeded to outmanoeuvre the [Prev.Owner.GetAdjective] aircrafts and with a single burst sent [Prev.GetCallsign] spiraling from the skies of [From.GetMissionRegion].\n\n[Prev.GetFullName] was a feared pilot with many [From.Owner.GetAdjective] lives on [Prev.GetHerHis] conscience. This is a great victory and shows that when we rally behind great heroes, they perform great deeds." #NT!
 ace_killed_other_ace.1.a: "[From.Owner.GetName] не забудет такую победу!"
  
 aces_killed_each_other.1.t: "[From.GetFullName] погиб"
 aces_killed_each_other.1.d: "During the latest mission our famous [From.GetAceType] ace [From.GetFullname] ended up in a prolonged fight with the feared ace pilot, [Prev.GetFullName]. Being low on munitions and with no possibility of escape, [From.GetCallsign] manoeuvred through the fire from the [Prev.Owner.GetAdjective] aircrafts and proceeded to ram [Prev.GetCallsign].\nBoth [From.GetCallsign]'s and [Prev.GetCallsign]'s aircrafts were spotted going down in pieces over [From.GetMissionRegion].\n\nWhile it is a small consolation that the [Prev.Owner.GetAdjective] menace, [Prev.GetCallsign], will no longer be a nuisance to us, we have lost a valued public figure and inspiration to all [From.Owner.GetAdjective]." #NT!
 aces_killed_each_other.1.d_major: "During the latest mission our famous [From.GetAceType] ace [From.GetFullname] ended up in a prolonged fight with the feared ace pilot, [Prev.GetFullName]. Being low on munitions and with no possibility of escape, [From.GetCallsign] manoeuvred [From.GetHerHis] [From.GetWingShort] through the fire from the [Prev.Owner.GetAdjective] aircrafts and proceeded to ram [Prev.GetCallsign].\nBoth [From.GetCallsign]'s [From.GetWingShort] and [Prev.GetCallsign]'s [Prev.GetWingShort] were spotted going down in pieces over [From.GetMissionRegion].\n\nWhile it is a small consolation that the [Prev.Owner.GetAdjective] menace, [Prev.GetCallsign], will no longer be a nuisance to us, we have lost a valued public figure and inspiration to all [From.Owner.GetAdjective]." #NT!
 aces_killed_each_other.1.a: "Огромная потеря для всех нас"
  
 country_capitulated.0.t: "[Root.GetName] капитулирует"
 country_capitulated.0.d_positive_both_no_faction: "\n[From.From.GetLeader] заявил, что [From.From.GetAdjective]ий натиск позволил занять всю страну и сломил трусливый [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти сбежали за границу и создали правительство в изгнании. Основные силы капитулировали, и государство [From.From.GetNameDef] теперь контролирует главный регион.\nХотя война и продолжается в других районах, [From.From.GetNameDef] уже может праздновать важную победу."
 country_capitulated.0.d_positive_prev_no_faction: "\n[From.From.GetLeader] заявляет, что [From.From.GetAdjective]ий натиск позволил занять всю страну и сломил трусливый [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти сбежали за границу и создали правительство в изгнании. Основные силы капитулировали, и государство [From.From.GetNameDef] теперь контролирует главный регион.\nХотя война с остатками альянса [Root.GetFactionName] и продолжается в других районах, [From.From.GetNameDef] уже может праздновать важную победу."
 country_capitulated.0.d_positive_prev_faction: "\n[From.From.GetLeader] заявляет, что [From.From.GetAdjective]ий натиск позволил занять всю страну и сломил трусливый [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти сбежали за границу и создали правительство в изгнании. Основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует главный регион.\nХотя война с остатками альянса [Root.GetFactionName] и продолжается в других районах, альянс [From.From.GetFactionName] уже может праздновать важную победу."
 country_capitulated.0.d_negative_both_no_faction: "\n[Root.GetLeader] заявил, что [From.From.GetAdjective]ий агрессор, бесчинствующий в стране, не поставит на колени [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти создали правительство в изгнании. Основные силы капитулировали, и [From.From.GetNameDef] теперь контролирует их главный регион страны.\nНесмотря на это сокрушительное поражение, мы продолжим борьбу — [From.From.GetNameDef] еще далека от победы в этой войне."
 country_capitulated.0.d_negative_prev_no_faction: "\n[Root.GetLeader] заявил, что [From.From.GetAdjective]ий агрессор, бесчинствующий в стране, не поставит на колени [Root.GetAdjective]ий народ. [Root.GetAdjective]ие власти создали правительство в изгнании. Основные силы капитулировали, и государство [From.From.GetNameDef] теперь контролирует главный регион.\nИ пусть государство [From.From.GetNameDef] еще далеко от победы в войне, это поражение стало серьезным ударом для всего альянса [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction: "\n[Root.GetLeader] заявил, что [From.From.GetAdjective]ий агрессор, бесчинствующий в стране, не поставит на колени [Root.GetAdjective]ий народ. [Root.GetAdjective]ой власти создали правительство в изгнании. Основные силы капитулировали, и государство [From.From.GetNameDef] теперь контролирует главный регион страны.\nИ пусть [From.From.GetNameDef] и [From.From.GetFactionName] еще далеки от победы в войне, это поражение стало серьезным ударом для всего альянса [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction: "\n[Root.GetAdjective]ие власти создали правительство в изгнании, а капитуляцию основных сил принял представитель [From.From.GetNameRuGen], теперь контролирующий главный регион страны.\n\nНесмотря на то, что [From.From.GetName] и [Root.GetName] завершили свой конфликт, [From.From.GetNameDef] продолжает вести полномасштабную войну в других регионах."
 country_capitulated.0.d_neutral_prev_no_faction: "\n[Root.GetAdjective]ие Власти создали правительство в изгнании, а капитуляцию основных сил принял представитель [From.From.GetNameRuGen], теперь контролирующий главный регион страны.\n\n[Root.GetName] была незначительной частью крупного конфликта. Война, в которую втянуты [From.From.GetNameDef] и остатки альянса [Root.GetFactionName], продолжается в других регионах."
 country_capitulated.0.d_neutral_prev_faction: "\n[Root.GetAdjective]ие власти создали правительство в изгнании, а капитуляцию основных сил принял представитель [From.From.GetNameRuGen], теперь контролирующий главный регион страны.\n\n[From.From.GetNameDef] и [Root.GetNameDef] являлись незначительными участниками крупного конфликта. Война, в которую втянуты [From.From.GetFactionName] и остатки альянса [Root.GetFactionName], продолжается в других регионах."
 country_capitulated.0.d_positive_collab_diff_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. [From.From.GetAdjective]ие войска вместе с независимыми [Root.GetAdjective]ими [From.From.GetRulingIdeology_RU_lower_Adherent_Nom]ами добились того, что [Root.GetLeader] вместе с правительством уходят в отставку. Сейчас основано новое правительство, которое будет возглавлять государство [Root.GetNameDef], в чём ему поможет [From.From.GetNameDef]. [From.From.GetLeader] отмечает, что это взаимное соглашение приведёт к началу в государстве [Root.GetNameDef] новой эпохи мира и процветания.\n[Root.GetLeader] в ответ заметил, что даже в ссылке он продолжит сражаться за державу [Root.GetNameDef] и будет поддерживать сопротивление у себя на родине."
 country_capitulated.0.d_positive_collab_invaded_same_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. Несколько [Root.GetAdjective]их граждан, недовольных разновидностью [From.From.GetRulingIdeologyNoun_RU_lower_Gen], которую принёс в государство [Root.GetNameDef] [Root.GetLeader], присоединились к [From.From.GetAdjective]им солдатам, чтобы лишить его власти и учредить новое правительство, которое возглавит [From.From.GetNameDef]. [From.From.GetLeader] отмечает, что это взаимное соглашение приведёт к началу эпохи мира и процветания в государстве [From.From.GetNameDef].\n[Root.GetLeader] в ответ заметил, что [From.From.GetLeader] не есть истинный [From.From.GetRulingIdeology_RU_lower_Adherent_Nom], что даже в ссылке он продолжит сражаться за державу [Root.GetNameDef] и будет поддерживать сопротивление у себя на родине."
 country_capitulated.0.d_negative_collab_diff_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. Очевидно, что снисходительность [Root.GetAdjective]ого правительства к доморощенным [From.From.GetRulingIdeology_RU_lower_Adherent_Nom]ам сыграла свою роль в падении [Root.GetNameRuGen]. [Root.GetFascistLeader] теперь занимает ведущую роль и будет править страной во имя режима, который установил [From.From.GetLeader].\n[Root.GetLeader] утверждает, что это не конец [Root.GetAdjective]ого суверенитета и что правительство, находясь в ссылке, будет поддерживать сопротивление в стране."
 country_capitulated.0.a: "Отличная новость!"
 country_capitulated.0.b: "Это тяжелые времена"
 country_capitulated.0.c: "Это неспокойное время"
