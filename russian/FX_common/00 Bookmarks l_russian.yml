 ### Name and Description 
 FR_history_title: "Brief History" #NT!
 FR_scenario_name: "Legacy of the Great War" #NT!
 FR_scenario_desc: "The end of the Great War saw the empires of the old—the Ottomans, the Austrians, and the Germans—fall greatly in both power and influence while the United States, Britain, and France have risen. While the Great War was thought by many to usher in a new era of peace, it seems that the tensions of old have not yet faded away and, with them, could threaten the tenuous peace that remains..." #NT!
  
  
 OTHER_FUHRERREICH_DESC: "It is 1936, and the world is on a brink of a new, inevitable, war. But the world is made up of more than a few monolithic empires. The smallest stones can bring about tidal waves, and these lesser states can bring about much change. Will you side with the valkists? Will you carry on the torch of the revolution? Or maybe you will grant your people true freedom, the likes of which they have never seen? The world will soon derail from its peaceful existance, plummeting into the hells of war. And it will not wait for your decisions." #NT!
  
 highlight_minor_0_tt: "You can play as the §YState of India§! by starting a campaign as the §YBritish Raj§!. An event to do so will occur shortly after the outbreak of the Indian War of Independence." #NT!
