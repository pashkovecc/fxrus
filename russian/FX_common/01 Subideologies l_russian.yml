 RulingIdeologySubtypeDesc: "Ideology: [GetRulingIdeologyNameNoSubideology]\nIdeological Subtype: §Y[GetRulingIdeologySubtype]§!§L\n--------------------\n§!§L[GetRulingIdeologySubtypeDesc]§!" #NT!
  
 ### Vanguardist 
 revolutionary_showaist_subtype: "Revolutionary Showaism" #NT!
 revolutionary_showaist_subtype_desc: "§Y(Revolutionary Showaism)§!\n\nSince the present emperor ascended to the Chrysanthemum throne, the Japanese Empire has experienced a significant decline. The economy has reached a critical point, and the immigration of Koreans, along with the liberal impurity in Japanese politics, has only fueled the inspiration of right-wing extremists. Led by militarist advocates and the generals of the Imperial Armed Forces on Yamato Island, their only goal is to purify the island and secure it from the corrupted Western ideology once and for all.\n\nUnder the banner of Showa restoration, the far-right has embraced nationalistic and other right-wing ideas from Europe, but with a twist of socialism. This has led to the creation of Showaism, an ideology that aims to purify the Japanese Empire. Hashimoto Kingoro, a Japanese officer and one of Showaism's advocates, believes that the combination of revolutionary socialism, stratocracy, and nationalism will cleanse Japanese politics and bureaucracy of the corrupted liberalism. All of this will be done in the name of fairness and equality, based on his interpretation of socialism. The military will serve as the protector of the new reformed Japanese bureaucracy to ensure and safeguard the new Japan from another wave of corruption." #NT!
 autocratic_socialist_subtype: "Autocratic Socialism" #NT!
 autocratic_socialist_subtype_desc: "§Y(Autocratic Socialism)§!\n\nAutocratic Socialist regimes are highly authoritarian dictatorships that (at least on paper) adhere to socialist principles. They are notably varied, but can usually be seen with some form of command economy, emphasis on militarism, are often nationalist or use patriotism as a tool of the state, and are frequently at odds with more mainline Charter Totalists. While their commitment to Socialist revolutionary principles is usually questionable at best, these regimes still maintain socialism as the official state ideology, and go to lengths to paint their government red - even if the government is nothing short of a total dictatorship." #NT!
 hardliner_bolshevism_subtype: "Hardliner Bolshevism" #NT!
 hardliner_bolshevism_subtype_desc: "§Y(Hardliner Bolshevism)§!\n\nAs proud bearers of Leninist banners, Hardliner Bolshevist regimes are highly authoritarian dictatorships that (at least on paper) adhere to socialist principles. They are militarist, adhere to some form of nationalism or social-patriotism and usually practice state terror against all dissent. While their commitment to Socialist revolutionary principles is usually questionable at best, these regimes still maintain socialism as the official state ideology, and go to lengths to paint their government red - even if the government is nothing short of a total dictatorship." #NT!
 red_junta_subtype: "Red Junta" #NT!
 red_junta_subtype_desc: "§Y(Red Junta)§!\n\nMilitary Dictatorships come in many forms, including Military Dictatorships that have a significant left-lean. These regimes in particular are highly authoritarian, militaristic and stratocratic, while still maintaining Socialist principles." #NT!
 socialist_security_state_subtype: "Socialist Security State" #NT!
 socialist_security_state_subtype_desc: "§Y(Socialist Security State)§!\n\nWhile internal intelligence agencies aren't exclusive to any strain of ideology, Socialist Security concerns the organizations found in all so-called 'red' states. Called 'Securitatism' by people dismisive of such governments, the reason for their existence is a series of decisions that were meant to only broaden the reach of the state or party apparatus. When the agency overgrows their benefactors the chiefs of such polities reach for ultimate power with which they can monitor every happening inside their people's republic. Although most are only concerned by total control of any and all aspects of the nation, some do still maintain an aura of socialist policies or legitimate government as a cloak for their activities." #NT!
  
 ### Communist 
 monsoc_subtype: "Monarcho-Socialism" #NT!
 monsoc_subtype_desc: "§Y(Monarcho-Socialism)§!\n\nMonarcho-Socialism, along with its various subtypes such as Monarcho-Bolshevism, Monarcho-Communism, and others, seeks to coherently fuse the typically opposed systems of Socialism and Monarchism into one, unified form of government. Though the degree to which each monarch is dedicated to the Socialist system can vary greatly, from mere figureheads painted Red to monarchs fully dedicated to the Socialist cause, each system holds in common an adherence to the noble system of monarchism, and though this monarch is frequently only a facade for a more traditional Socialist government, their presence is key to the wider system. Under these Red monarchies, the journey to true Socialism is shepherded, and though each system is incredibly varied, they usually hold in common a more conservative or traditionalist outlook on social and societal issues." #NT!
 leninism_subtype: "Leninism" #NT!
 leninism_subtype_desc: "§Y(Leninism)§!\n\nLeninism is a political ideology developed by Vladimir Lenin, which advocates for the establishment of a revolutionary vanguard party to lead the working class in overthrowing capitalism. It emphasizes the need for a centralized and disciplined party structure, guided by Marxist principles, to seize and maintain state power on behalf of the working class. Leninism also promotes the idea of a transitional socialist state, referred to as the \"dictatorship of the proletariat,\" as a means to suppress counter-revolutionary forces and lay the groundwork for a future communist society." #NT!
 anarchism_subtype: "Anarchism" #NT!
 anarchism_subtype_desc: "§Y(Anarchism)§!\n\nAnarchism is a diverse body of politics that usually calls for the total or partial erosion of the State. Seeking to organize society along other means, either through voluntary cooperation or the free association between individuals and groups, these Socialists are oftentime seen as traitors to the Revolution by mainline Leftists. Still seeking a Socialist or Communist system, just without a wider state apparatus, Anarchists reject all or most positions of authority as they pursue total egalitarianism, equality, and freedom from all gods and masters." #NT!
  
 ### Libertarian Socialist 
 libsoc_utopian_socialism_subtype: "Utopian Socialism" #NT!
 libsoc_utopian_socialism_subtype_desc: "§Y(Utopian Socialism)§!\n\nUtopian socialism is seen as an ideology that is misguided in its attempts to create a perfect society through centralized planning and government control, Libertarians generally believe in the importance of individual liberty and see the government as a potential threat to these values.\n\nOn the other hand, Utopian socialism often involves the idea of a collective ownership of the means of production and a planned economy, which may be seen as incompatible with individual freedom and the principles of a free market. Libertarians would argue that such an approach would restrain innovation, limit consumer choice, and result in inefficiencies and waste." #NT!
 anarcho_syndicalism_subtype: "Anarcho-Syndicalism" #NT!
 anarcho_syndicalism_subtype_desc: "§Y(Anarcho-Syndicalism)§!\n\nThe largest subset of mainline Orthodox Syndicalism, Anarcho-Syndicalism seeks to build a Syndicalist system - that is, a system organized around trade unions and employee organizations - within an Anarchist and stateless, or semi-stateless, framework. Seeking to abolish the wage system as well as Capitalist-fueled statism, Anarcho-Syndicalists believe that through solidarity, self-management, communization, direct action, and direct democracy, a true egalitarian paradise can be built for all to enjoy. Rejecting private property, hierarchies, and social stratification, Anarcho-Syndicalists will tear down the state to build their unionist utopias free from the apparent greed of statism." #NT!
 socialist_feminist_subtype: "Socialist Feminism" #NT!
 socialist_feminist_subtype_desc: "§Y(Socialist Feminism)§!\n\nThe focus of Socialist Feminism is that all women should be liberated and the patriarchy should be overthrown. It encompasses a wide range of progressive and liberal ideas in the market with a free one for all people, and that oppression of the common person should be forbidden. They also think that every man, woman, and child should be equal and free under a society with no one over or under the rest." #NT!
 agrarian_socialism_subtype: "Agrarian Socialism" #NT!
 agrarian_socialism_subtype_desc: "§Y(Agrarian Socialism)§!\n\nAgrarian Socialism is the attempt to fuse Agrarian principles with Socialist doctrine. Championed by the likes of Zapata or the Narodniks, Agrarian Socialists are frequently more Conservative than their Leftist allies and push for a Socialist system that puts the peasantry and the farmers of the state above all other concerns. Common in less-developed or under-industrialized nations, Agrarian Socialism is frequently democratic, and usually calls for the creation of farming cooperatives, communes, or other cooperative organizational structures to better increase agricultural output and efficiency while progressing towards true Socialism." #NT!
 bukharinist_subtype: "Bukharinism" #NT!
 bukharinist_subtype_desc: "§Y(Bukharinism)§!\n\nBukharinism or Semi-Market Socialism is a set of ideas formulated by the Russian Bolshevik Nikolai Bukharin after the Civil War in Russia, which formed the basis of the program of his People's Socialist Party and the rationale for the so-called New Economic Policy.\n\nBukharin considered the main culprit for the failure of the Bolshevik Revolution in Russia and the loss of the Reds in the Civil War to be the ineffective policy of \"War communism\", which led to the complete alienation of the peasants from the Bolsheviks and economic crisis. Bukharin, however, in his writings, developed with economist Nikolai Kondratiev, suggested that socialism should be achieved gradually - and that state regulation of a mixed economy using planned and market mechanisms was necessary to achieve this goal. \"Socialism in the city - Capitalism in the countryside\" was how Bukharin characterized his program at the founding congress of the new party. In addition to the economic sphere, Bukharinism proposes a multiparty form of Soviet democracy, separation of powers, and Korenization - support for national minorities by promoting national human resources and limiting Russification." #NT!
 moderate_socialist_subtype: "Moderate Socialism" #NT!
 moderate_socialist_subtype_desc: "§Y(Moderate Socialism)§!\n\nModerate Socialism is an ideology that seeks to combine Democracy and Socialism in one syncretic system. Usually pursuing a directly democratic system, though sometimes using representative bodies such as a congress or union councils, these governments seek to give each and every citizen a voice regardless of their standing in society as they pursue true Socialism." #NT!
  
 ### Social Democrat 
 socdem_longism_subtype: "Longism" #NT!
 socdem_longism_subtype_desc: "§Y(Longism)§!\n\nBased on the policies and personality of Huey Pierce Long Jr, Longism is an ideology that is nearly as ambiguous as the man it's named after. Espousing civic nationalism, a deep sense of piety, and Left-leaning populist economics, all while ignoring critical questions such as race. Marked by authoritarian methods of ruling, Longist goverments will do anything and everything for the people, even if the people don't always agree." #NT!
 socdem_democratic_socialism_subtype: "Democratic Socialism" #NT!
 socdem_democratic_socialism_subtype_desc: "§Y(Democratic Socialism)§!\n\nDemocratic Socialism is an ideology that seeks to combine Democracy and Socialism in one syncretic system. Usually pursuing a directly democratic system, though sometimes using representative bodies such as a congress or union councils, these governments seek to give each and every citizen a voice regardless of their standing in society as they pursue true Socialism." #NT!
 socdem_left_nationalism_subtype: "Left-wing Nationalism" #NT!
 socdem_left_nationalism_subtype_desc: "§Y(Left Nationalism)§!\n\nLeft-Wing Nationalism, commonly known as Social Nationalism or simply Left Nationalism, is a strain of nationalism originating from various national liberation movements influenced by socialist schools of thought. Upholding self-determination as the highest value, Left Nationalists strive to create a state for their people in which popular sovereignty and locally defined equality can be enjoyed. Social Nationalists stand in opposition to their right-wing counterparts by rejecting ethnic or class based distinctions in their struggle." #NT!
 socdem_humanistic_capitalism_subtype: "Humanistic Capitalism" #NT!
 socdem_humanistic_capitalism_subtype_desc: "§Y(Humanistic Capitalism)§!\n\nHumanistic Capitalism is an economic thoughtform that seeks to unite Humanism with the pursuit of profit under moderated Capitalism. Humanistic Capitalist societies progress towards economic prosperity with market economics as any other Capitalists do, but do so in a humane way that pays special attention to the needs, safety, health, and desires of the people, as well as to their social and even cultural and spiritual development, depending on the nation. Creating economically-fair financial systems guided by the invisible hand of the national government over any vague market force, Humanistic Capitalists seek to create a profitable utopia where any and all have a fair shot at achieving their wildest dreams." #NT!
 socdem_christian_socialism_subtype: "Christian Socialism" #NT!
 socdem_christian_socialism_subtype_desc: "§Y(Christian Socialism)§!\n\nOne of the more widespread forms of Socialism outside of the Syndicalist paradigm, especially in those countries whose populations are quite conservative and religious, Christian Socialism seeks to create a society in union with the Teachings of Jesus Christ within a Socialist framework. However, the type of Christianity and the form of Socialism each specific example follows can vary greatly." #NT!
 socdem_agrarianism_subtype: "Agrarianism" #NT!
 socdem_agrarianism_subtype_desc: "§Y(Agrarianism)§!\n\nDespite not being a concrete ideology with a central doctrine or fundamental tenets, agrarianism became a broad classification of various movements across the entire globe concerned with the interests and plight of peasantry as a whole. Supporters of agrarian parties range from large landowners or landed gentry to smallholders and poor farmers, from the lower high class through the most consistent support base among the middle class, and ending up on the lower classes. The origins of political agrarianism can be traced to the 'government of nature' developed by physiocrat and laissez-faire advocate François Quesnay, as well as the republic of rural virtue of Thomas Jefferson. While supporters of such parties hold the people of the land as a foundation of society and the most important part of the nation's organism, they differ wildly in their positions regarding economy, taxation, protectionism vs free trade, system of government, religion etc. Agrarian parties are generally conservative and traditionalist, although there is a sizeable contingent of radically liberal and downright socialistic groups, with some unconventional right-wingers mixed in-between. This wide range can be seen by looking at only a few rural movements, such as the German national revolutionary Landvolkbewegung or the conservative and monarchist Bund der Landwirte, the more centrist Czech RSZML or the Finnish Maalaisliitto, and even the radicals in terms of social changes such as Poland's PSL Wyzwolenia or Bulgaria's BZNS." #NT!
 socdem_progressive_conservatism_subtype: "Progressive Conservatism" #NT!
 socdem_progressive_conservatism_subtype_desc: "§Y(Progressive Conservatism)§!\n\nProgressive Conservatism is a political ideology that naturally combines conservative and progressive policies first birthed during the Age of Enlightenment in order to create an orderly and responsible society that still cares for its people. First appearing in Western Europe in conservative groups pushing for social reform in the areas of science, economics, education, technology, medicine, and other facets of human living conditions that had begun to be negatively affected by the Industrial Revolution and its growing consequences, as well as with the abolitionist movement that had begun to take flight around the time, particularly in Britain. Calling for social safety nets and minimalist welfare systems, Progressive Conservatism seeks to improve society without radical or rapid changes to the established status quo and traditions, and is often tied to Catholic social teaching, Christian democracy, and even the papal literary work ‘Rerum novarum’ which calls for a form of Catholic conservative progressivism in order to safeguard the Christian working masses against the predation of Socialism. In more modern times, the ideology has been practiced and adapted across the world by the likes of former American president Theodore Roosevelt and British prime minister Benjamin Disraeli, and now has begun finding contemporary popularity once again as a Conservative alternative to more dangerous and radical Leftist progressivist ideology." #NT!
 socdem_paternal_socialism_subtype: "Paternal Socialism" #NT!
 socdem_paternal_socialism_subtype_desc: "§Y(Paternal Socialism)§!\n\nPaternal Socialism, also called Conservative Social Populism, Paternalistic Conservatism, or more rarely Christian Conservative Socialism in the Western World, is a unique thoughtform that attempts to fuse the seemingly contradictory ideas of traditional Conservatism and non-Marxist Socialism or Progressive Populism. Born during the Industrial Revolution in England and Germany but now increasingly common outside the Western World such as in Latin America or Africa where the rules and expectations of European-biased Socialisms do not apply, these strange systems seek to build moral, Conservative societies usually, but not always, rooted in theist ethics, Conservative welfare economics, class collaboration and cooperation, and/or ideas of Civic Nationalism and non-extremist Nationalist Patriotism. Often linked to ideas of Market Socialism, Christian Distributism, charity economics, Bismarck's State Socialism and economic interventionism, Red Toryism, and other wealth-sharing programs, Paternal Socialists seek to build egalitarian, non-predatory economic systems geared against ideas of class struggle that fuse Capitalist and Socialist ideas in a Consevative and Paternalistic package for the good of their usually traditionalist and nationalist peoples while undermining and weakening normal Socialist and Leftist movements to preserve tradition and societal stability, even if that puts them at odds with other Socialists or Conservatives around the globe." #NT!
  
 ### Social Liberal 
 centrist_subtype: "Centrism" #NT!
 centrist_subtype_desc: "§Y(Centrism)§!\n\nDemocratic Centrism describes the political outlook that revolves around the maintaining of the set status quo. Though this status quo varies from nation to nation, Centrists rally around this middleground just the same, seeking to balance equality and hierarchy in their varied societies. Hated by both conservatives and extremists who see them as fence-sitters, Centrists rally around the proven status quo without faltering, resisting rapid reform and staunch traditionalism just the same as they pursue a happy medium between bickering parties for the greater good of their societies as they seek stability and consistency above all." #NT!
 radical_liberalism_subtype: "Radical Liberalism" #NT!
 radical_liberalism_subtype_desc: "§Y(Radical Liberalism)§!\n\nRadical Liberalism - also called Classical Radicalism or Radical Republicanism - describes the modern political movements chiefly inspired by the Radicals of the French Revolution and the precursor Liberals of the past century. Associated with Republicanism, modernism, civic nationalism, rationalism, secular humanism, progressivism, and more, Radical Liberal seeks to stretch the meaning of what it means to be ‘Liberal’ in order to build a truly free, fair, and egalitarian society that champions freedom, liberty, and justice for all." #NT!
 venizelism_subtype: "Venizelism" #NT!
 venizelism_subtype_desc: "§Y(Venizelism)§!\n\nVenizelism is one of the most significant political movements in Greece since the start of the 20th century. During the period of 1910 to 1922, when Greece was in a state of continuous military readiness, a new political mindset emerged, embodied by Eleftherios Venizelos, and was commonly referred to as Venizelism. It is difficult to define in what exactly this political ideology was, but in terms of the economy, Venizelism considered the Greek state as a lever for the expression and development of Hellenism. In other words, the Greek state had to pursue the integration of Hellenism beyond its borders and, with a unified national and state identity, claim its place in the then-modern world. This required not only institutional modernization to make the state efficient and reliable but also a general commitment to the idea of developing the nation's productive forces." #NT!
  
 ### Market Liberal 
 marlib_centrist_subtype: "Centrism" #NT!
 marlib_centrist_subtype_desc: "§Y(Centrism)§!\n\nDemocratic Centrism describes the political outlook that revolves around the maintaining of the set status quo. Though this status quo varies from nation to nation, Centrists rally around this middleground just the same, seeking to balance equality and hierarchy in their varied societies. Hated by both conservatives and extremists who see them as fence-sitters, Centrists rally around the proven status quo without faltering, resisting rapid reform and staunch traditionalism just the same as they pursue a happy medium between bickering parties for the greater good of their societies as they seek stability and consistency above all." #NT!
 marlib_classical_liberalism_subtype: "Classical Liberalism" #NT!
 marlib_classical_liberalism_subtype_desc: "§Y(Classical Liberalism)§!\n\nClassical Liberalism is a branch of mainline Liberalism that advocates for a free market and laissez-faire economics, and for civil liberties tied to economic and political freedom under the rule of law of a limited government. Differing from mainline Social Liberalism, Classical Liberals look more negatively on social policies, welfare systems, heavy taxation, and state involvement in the lives of its citizens, instead advocating for deregulation and decentralization, sharing some ideas with Liberal Conservatives, despite despising Conservative economics such as protectionism. Tied to the ‘original’ Liberals of the 19th Century, such as John Locke, Jean-Baptiste Say, Thomas Robert Malthus, and David Ricardo, Classical Liberalism is rooted in the ideas of Adam Smith, standing true to natural law, liberal progress, utilitarianism, and to the lessons learned during the rise of the Industrial Revolution and urbanization. From Hayek to Mises, Classical Liberals tow the line between the Center-Right and the Center-Left, seeking to bring about the ideas of the Enlightenment to their wayward shores." #NT!
 liberal_conservative_subtype: "Liberal Conservatism" #NT!
 liberal_conservative_subtype_desc: "§Y(Liberal Conservatism)§!\n\nA near-paradoxical thoughtform that combines conservative ideas with liberal stances, Liberal Conservatism is a mixed bag that varies greatly depending on the nation that professes it. Split between groups that support deregulation and the free market, and those that instead support economic interventionism, these groups are united in their pursuit of civil liberties and freedoms while championing Conservative social positions. Overall, Liberal Conservatism fuses Liberal Capitalism and Social Justice with Traditionalist views on society and life, and is exceedingly common in the Western World specifically, though it can be seen in practice across the globe." #NT!
 marlib_venizelism_subtype: "Venizelism" #NT!
 marlib_venizelism_subtype_desc: "§Y(Venizelism)§!\n\nVenizelism is one of the most significant political movements in Greece since the start of the 20th centrury. During the period of 1910 to 1922, when Greece was in a state of continuous military readiness, a new political mindset emerged, embodied by Eleftherios Venizelos, and was commonly referred to as Venizelism. It is difficult to define in what exactly this political ideology was, but in terms of the economy, Venizelism considered the Greek state as a lever for the expression and development of Hellenism. In other words, the Greek state had to pursue the integration of Hellenism beyond its borders and, with a unified national and state identity, claim its place in the then-modern world. This required not only institutional modernization to make the state efficient and reliable but also a general commitment to the idea of developing the nation's productive forces." #NT!
 national_socialism_subtype: "National Socialism" #NT!
 national_socialism_subtype_desc: "§Y(National Socialism)§!\n\nDespite the name, the ideology espoused by the National Social Party promotes civic nationalism, Czech patriotism, liberal reformism, and liberalized, moderated socialism in that it is immensely populist with its citizenry while seeking to establish a moderated welfare state. Denouncing Marxist ideas of Socialism and instead pushing for a reformist agenda tied to modern Capitalism, these National Socialists seek to bring liberty, prosperity, egalitarianism, and patriotism to their own people. Though mildly antisemitic in its past well before the Great War, the party and its ideology have long abandoned these venomous ideas, and push for a truly liberal and united nation for all within its borders." #NT!
 marlib_national_liberalism_subtype: "National Liberalism" #NT!
 marlib_national_liberalism_subtype_desc: "§Y(National Liberalism)§!\n\nNational Liberalism describes the strand of mainline Liberal thought that also espouses patriotism and nationalism - either civic or ethnic in form - tied inherently to their notions of liberty, equality, freedom, and fraternity. Commonly more conservative or traditionalist than mainline Liberalism, National Liberals seek a society of order and protected freedoms, but many have been known to offer preferential treatment towards each regimes favored citizenry. Regardless, National Liberalism is a legitimate Liberal ideology, with roots in France, wider Europe, and their colonial possessions abroad." #NT!
  
 ### Social Conservative 
 christian_democracy_subtype: "Christian Democracy" #NT!
 christian_democracy_subtype_desc: "§Y(Christian Democracy)§!\n\nChristian Democratic movements understand that only through allowing people a choice, and not coercion, a religious society might be upheld. Basing its programmes on Catholic social teaching and neo-Calvinism, Christian Democrats strive to create a free society in which traditional family values, social justice and good old fashioned patriotism will be respected. While most Christian Democratic parties don't exclude any denomination, some might choose to keep to a strictly anti-ecumenical position. Surprisingly to some, many advocates for Christian Democracy are rather left leaning in their views on the economy, advocating for models such as Distributism, based on Pope Leo XIII's 'Rerum novarum' encyclical. That position is of course not the only choice, with others preaching the Prosperity Gospel or upholding Christian Capitalism." #NT!
 soccon_warlordism_subtype: "Warlordism" #NT!
 soccon_warlordism_subtype_desc: "§Y(Warlordism)§!\n\nWarlordism is hardly a uniform ideology by any stretch of the imagination. Instead, it describes the varied, incoherent, disorganized, and militarist nature of various warlord cliques around the world, and was named after the Warlord Period of China in which the term became popularized in the modern context. Ranging from bandit groups with a state to organized military startocracies to even military-backed republican governments or pure dictatorships, Warlordism has less to do with politics and more to do with a lack of clear borders and the ever-present and often chaotic nature of warfare. Warlordism is frequently a transitory state, and is usually just a stepping stone on the road to a more clearly defined political system, though some pure warlord states do exist." #NT!
 toryism_subtype: "Toryism" #NT!
 toryism_subtype_desc: "§Y(Toryism)§!\n\nToryism is an originally-British version of traditionalism and conservatism, which upholds the supremacy of social order as it has evolved in the English culture throughout history. The Tory ethos has been summed up with the phrase \"God, King, and Country\". Tories are generally monarchists, were historically of a high church Anglican religious heritage, and are opposed to political liberalism. Typically, Tories defend the ideas of hierarchy, natural order, and aristocracy." #NT!
 national_conservative_subtype: "National Conservatism" #NT!
 national_conservative_subtype_desc: "§Y(National Conservatism)§!\n\nNational Conservatism is a nationalist variant of mainline conservative thought that concentrates on upholding the national and cultural identity of the nation. These states usually promote traditional cultural and societal values, filial piety and the importance of the family structure, and patriotic monoculturalism. Though varied in their economic outlooks, they frequently range from corporatism and mixed-economics to laissez-faire policies, but usually oppose globalization and internationalism." #NT!
 ukrainian_social_conservatism_subtype: "Ukrainian Social Conservatism" #NT!
 ukrainian_social_conservatism_subtype_desc: "§Y(Ukrainian Social Conservatism)§!\n\nUkrainian Social Conservatism, or Ukrainian Hetmanism, according to Vyacheslav Lypynskyi, the ideological founder of the movement, is \"the idea of new monarchism and new aristocratism.\"\nHetmanism is a symbol of the unity of the Ukrainian Nation and the strength of the Ukrainian State, personified in a traditional, national, hereditary Hetman. \"Hetmanship is a new form of state life of our Nation, which we for our sons and descendants by hard work, sacrifices and dedication have yet to create...\" Only in the ideological and organizational revival of Ukrainian conservatism and in the restoration by its own forces of its fulcrum - Hetmanism, there is a way out of the national Ukrainian tragedy." #NT!
 soccon_jadidism_subtype: "Jadidism" #NT!
 soccon_jadidism_subtype_desc: "§Y(Jadidism)§!\n\nDrawing from the legacy for the early Jadids, Jadidism describes a uniquely Turkic ideology promoting the liberalization of the traditionally conservative Islamic socioeconomic and political structures of the Turkick and Muslim populations within the old Russian Empire. Jadidists hold that in order to slough off the decay wrought at the hands of the Russian autocrats, Islamic society must experience a Western-inspired and modernist, but inherently Islamic rebirth. Pushing for liberalism, modernism, industrialization, and overall greater equality and prosperity, Jadidism seeks to bring enlightenment and modernity to their newly-freed nations and the Turkic peoples, though the degree to which varies greatly with each movement, for Conservative and truly Liberal strains of Jadidism are increasingly popular in equal measure." #NT!
 filipino_nationalism_subtype: "Filipino Nationalism" #NT!
 filipino_nationalism_subtype_desc: "§Y(Filipino Nationalism)§!\n\nFilipino Nationalism is an ideology that emphasizes the pride, unity, and sovereignty of the Filipino people. Rooted in the historical context of colonization and struggles for independence, Filipino Nationalism seeks to promote the unique cultural identity, heritage, and interests of the Philippines. It calls for the recognition of Filipino contributions, history, and language, while challenging external influences and domination. Filipino Nationalism often highlights the need for self-determination, economic development, and social justice. It has been a driving force in shaping the nation's history, influencing political movements, and guiding efforts to assert the Philippines' rightful place in the global community." #NT!
 soccon_agrarianism_subtype: "Agrarianism" #NT!
 soccon_agrarianism_subtype_desc: "§Y(Agrarianism)§!\n\nDespite not being a concrete ideology with a central doctrine or fundamental tenets, agrarianism became a broad classification of various movements across the entire globe concerned with the interests and plight of peasantry as a whole. Supporters of agrarian parties range from large landowners or landed gentry to smallholders and poor farmers, from the lower high class through the most consistent support base among the middle class, and ending up on the lower classes. The origins of political agrarianism can be traced to the 'government of nature' developed by physiocrat and laissez-faire advocate François Quesnay, as well as the republic of rural virtue of Thomas Jefferson. While supporters of such parties hold the people of the land as a foundation of society and the most important part of the nation's organism, they differ wildly in their positions regarding economy, taxation, protectionism vs free trade, system of government, religion etc. Agrarian parties are generally conservative and traditionalist, although there is a sizeable contingent of radically liberal and downright socialistic groups, with some unconventional right-wingers mixed in-between. This wide range can be seen by looking at only a few rural movements, such as the German national revolutionary Landvolkbewegung or the conservative and monarchist Bund der Landwirte, the more centrist Czech RSZML or the Finnish Maalaisliitto, and even the radicals in terms of social changes such as Poland's PSL Wyzwolenia or Bulgaria's BZNS." #NT!
 paternal_socialism_subtype: "Paternal Socialism" #NT!
 paternal_socialism_subtype_desc: "§Y(Paternal Socialism)§!\n\nPaternal Socialism, also called Conservative Social Populism, Paternalistic Conservatism, or more rarely Christian Conservative Socialism in the Western World, is a unique thoughtform that attempts to fuse the seemingly contradictory ideas of traditional Conservatism and non-Marxist Socialism or Progressive Populism. Born during the Industrial Revolution in England and Germany but now increasingly common outside the Western World such as in Latin America or Africa where the rules and expectations of European-biased Socialisms do not apply, these strange systems seek to build moral, Conservative societies usually, but not always, rooted in theist ethics, Conservative welfare economics, class collaboration and cooperation, and/or ideas of Civic Nationalism and non-extremist Nationalist Patriotism. Often linked to ideas of Market Socialism, Christian Distributism, charity economics, Bismarck's State Socialism and economic interventionism, Red Toryism, and other wealth-sharing programs, Paternal Socialists seek to build egalitarian, non-predatory economic systems geared against ideas of class struggle that fuse Capitalist and Socialist ideas in a Consevative and Paternalistic package for the good of their usually traditionalist and nationalist peoples while undermining and weakening normal Socialist and Leftist movements to preserve tradition and societal stability, even if that puts them at odds with other Socialists or Conservatives around the globe." #NT!
 popularism_subtype: "Popularism" #NT!
 popularism_subtype_desc: "§Y(Popularism)§!\n\nThe guiding ideology of the Italian Popular Party, Popolarismo is the political successor to the wider social movements of Christian Democracy. Having been created by Don Luigi Sturzo, a Catholic priest with a background including softly socialistic Christian thought, as an alternative means of influencing politics while focusing on the people, which Pope Leo XIII forbade the ChristDem groups to do. European Popularism represents the effort of Catholics to come to terms and accept the existence of democratic institutions, and beginning to utilize them as a force unifying all social classes together. Parties advocating Popolarismo set out to implement proportional representation, respecting natural communities such as families, wider outreach to all social groups, female suffrage and a semi-corporatist special senate composed of managers, trade unions and academics. Since their origins lay with a predominantly agrarian base Popularists additionally see the nation as best operating when decentralized and with local communities given more autonomy. In a way Popolarismo is the decentralistic and organic brother of the centralistic and individual focused liberal democracy." #NT!
 progressive_conservatism_subtype: "Progressive Conservatism" #NT!
 progressive_conservatism_subtype_desc: "§Y(Progressive Conservatism)§!\n\nProgressive Conservatism is a political ideology that naturally combines conservative and progressive policies first birthed during the Age of Enlightenment in order to create an orderly and responsible society that still cares for its people. First appearing in Western Europe in conservative groups pushing for social reform in the areas of science, economics, education, technology, medicine, and other facets of human living conditions that had begun to be negatively affected by the Industrial Revolution and its growing consequences, as well as with the abolitionist movement that had begun to take flight around the time, particularly in Britain. Calling for social safety nets and minimalist welfare systems, Progressive Conservatism seeks to improve society without radical or rapid changes to the established status quo and traditions, and is often tied to Catholic social teaching, Christian democracy, and even the papal literary work ‘Rerum novarum’ which calls for a form of Catholic conservative progressivism in order to safeguard the Christian working masses against the predation of Socialism. In more modern times, the ideology has been practiced and adapted across the world by the likes of former American president Theodore Roosevelt and British prime minister Benjamin Disraeli, and now has begun finding contemporary popularity once again as a Conservative alternative to more dangerous and radical Leftist progressivist ideology." #NT!
 moderate_authoritarianism_subtype: "Moderate Authoritarianism" #NT!
 moderate_authoritarianism_subtype_desc: "§Y(Moderate Authoritarianism)§!\n\nModerate Authoritarianism might seem very similar to a standard authoritarian regime at first, but that would be a highly flawed view. States following such ideology still view democracy as being a good form of government, but do understand that various groups working inside its framework threaten it. Thus, Moderate Authoritarians decide to take matters into their own hands to ensure that liberty is upheld and radicals, both left and right, are combated. Most Moderate Authoritarian governments try to foster more traditional and conservative views, yet might still allow for moderate liberalism to spread, within bounds of reason of course." #NT!
 soccon_liberal_conservative_subtype: "Liberal Conservatism" #NT!
 soccon_liberal_conservative_subtype_desc: "§Y(Liberal Conservatism)§!\n\nA near-paradoxical thoughtform that combines conservative ideas with liberal stances, Liberal Conservatism is a mixed bag that varies greatly depending on the nation that professes it. Split between groups that support deregulation and the free market, and those that instead support economic interventionism, these groups are united in their pursuit of civil liberties and freedoms while championing Conservative social positions. Overall, Liberal Conservatism fuses Liberal Capitalism and Social Justice with Traditionalist views on society and life, and is exceedingly common in the Western World specifically, though it can be seen in practice across the globe." #NT!
  
 ### Authoritarian Democrat 
 authdem_national_conservative_subtype: "National Conservatism" #NT!
 authdem_national_conservative_subtype_desc: "§Y(National Conservatism)§!\n\nNational Conservatism is a nationalist variant of mainline conservative thought that concentrates on upholding the national and cultural identity of the nation. These states usually promote traditional cultural and societal values, filial piety and the importance of the family structure, and patriotic monoculturalism. Though varied in their economic outlooks, they frequently range from corporatism and mixed-economics to laissez-faire policies, but usually oppose globalization and internationalism." #NT!
 police_state_subtype: "Police State" #NT!
 police_state_subtype_desc: "§Y(Police State)§!\n\nFrom martial law and curfews to harsh crack downs and lawful paternalism, the main pillars that make up a Police State are unvaryingly similar despite the large number of forms such a state can come in. Depending on where it has formed and the conditions it formed under, a police-run nation can be political or apolitical, professional or unprofessional, corrupt or virtuous - all to varying degrees - but despite this ideological fluidity, they all share a baseline desire to control an otherwise unruly and chaotic society. Similar to military juntas but usually less militaristic and imperialistic, Police States seek to bring order to their people above all other pursuits, and with the Law on their side, they can do so with impunity." #NT!
 auth_duumvirism_subtype: "Duumvirism" #NT!
 auth_duumvirism_subtype_desc: "§Y(Duumvirism)§!\n\nBased on the belief that a single authority is necessary to ensure effective governance and decision-making. However, this authority must be balanced by two competing factions with equal power and influence. This balance of power is thought to promote stability, prevent corruption, and ensure that decisions are made in the best interests of the entire community, rather than just one group or individual." #NT!
 authdem_junta_subtype: "Military Junta" #NT!
 authdem_junta_subtype_desc: "§Y(Military Junta)§!\n\nMilitary Juntas are regimes ruled fully through the nation's Armed Forces or through military-backed governments of a similar nature. Juntas are often stratocratic, militarist, and authoritarian regimes that are swift to crack down on any perceived dissent or threat to the nation or its Military regime, and are known to emphasize military might and the fulfillment of national security or ambition over any other pursuit." #NT!
 authdem_warlordism_subtype: "Warlordism" #NT!
 authdem_warlordism_subtype_desc: "§Y(Warlordism)§!\n\nWarlordism is hardly a uniform ideology by any stretch of the imagination. Instead, it describes the varied, incoherent, disorganized, and militarist nature of various warlord cliques around the world, and was named after the Warlord Period of China in which the term became popularized in the modern context. Ranging from bandit groups with a state to organized military startocracies to even military-backed republican governments or pure dictatorships, Warlordism has less to do with politics and more to do with a lack of clear borders and the ever-present and often chaotic nature of warfare. Warlordism is frequently a transitory state, and is usually just a stepping stone on the road to a more clearly defined political system, though some pure warlord states do exist." #NT!
 oligarchy_subtype: "Oligarchism" #NT!
 oligarchy_subtype_desc: "§Y(Oligarchism)§!\n\nOligarchies are regimes dominated by a handful of elites who make decisions on behalf of a general populace. They can vary from councils of business tycoons to strongmen, military figures, politicians, or any other figures of power, and their nations are usually dominated by a rich or elite group. They vary greatly in how official or permanent their ruling bodies are, but the ruling class in Oligarchies often aren't concerned with much besides expanding their own wealth and power" #NT!
 prussian_constitutionalism_subtype: "Prussian Constitutionalism" #NT!
 prussian_constitutionalism_subtype_desc: "§Y(Prussian Constitutionalism)§!\n\nPrussian Constitutionalism is a semi-Authoritarian form of Parliamentary Monarchism combining ideas of enlightened monarchism and elitism supported by a limited congressional system usually modeled on the German landtag. Anti-Liberal in nature bordering on reactionary, this fusion of conservative democratic republicanism, militarism, and monarchism is the hallmark ideology of old Prussia and the Kaiserreich and is modeled on the Constiution of Germany, hence the name." #NT!
 controlled_democracy_subtype: "Controlled Democracy" #NT!
 controlled_democracy_subtype_desc: "§Y(Controlled Democracy)§!\n\nControlled democracy refers to a political system where the appearance of democracy is maintained, but power is effectively concentrated in the hands of a select few individuals or groups. It is characterized by limited political freedoms, restricted opposition parties, and manipulation of electoral processes to ensure the ruling elite retains power. Although elections may take place, they are often tightly controlled and manipulated to ensure predetermined outcomes, effectively limiting genuine democratic participation and decision-making by the general population." #NT!
 hetmanism_subtype: "Hetmanism" #NT!
 hetmanism_subtype_desc: "§Y(Hetmanism)§!\n\nHetmanism is a movement which evolved from the conservative monarchist movements in Ukraine. Their views became increasingly absolutist and nationalists in nature compared to the moderate conservatives, which lead to a eventual split of the monarchists. Hetmanism glorifies Ukraine's independent spirit and takes many inspirations from cossack culture, while promoting a revanchist foreign policy coupled to conservative social ideas. Skoropadskyi is the leading person behind the movement and still has considerable support within the armed forces. Due to the military background of Skoropadskyi, the idea of a militarized society coupled with a strong executive and a weak parliament became defining factors of his absolutist movement." #NT!
 authdem_revolution_nationale_subtype: "Révolution Nationale" #NT!
 authdem_revolution_nationale_subtype_desc: "§Y(Révolution Nationale)§!\n\nThe 'National Revolution' is the official ideology of the French state after Marshal Pétain and his loyalists instituted complete control. Its ideology aims to revolutionize and rebuild French society radically by instituting a strong moral order centered around the person of Marshal Pétain who is the object of a vast and extensive Cult of Personality. Denouncing liberalism, parliamentarianism, socialism and rejecting the modernism of the intellectual and political elites held responsible for the Communards' seizure of power, the Marshal's regime promoted instead a simpler, agrarian ideal of life centered around the family, religion and traditions while instilling in the youth the values of sacrifice and devotion to the Fatherland." #NT!
 authdem_christian_democracy_subtype: "Authoritarian Christian Democracy" #NT!
 authdem_christian_democracy_subtype_desc: "§Y(Authoritarian Christian Democracy)§!\n\nAuthoritarian Christian Democracy is the result of one simple realization, that democracy itself is a corrupting force when introduced into any society, the birthplace of it, Ancient Athens, being a prime example of moral degradation. Authoritarian Christian Democratic regimes take a more active stance in combating any progressive or socialistic force trying to tear the fabric of traditional society apart. Such states might also have close connections with established religious institutions, with clergymen serving as occasional ministers or bureaucrats. Although still wanting for a socially just economy to triumph, Authoritarian ChristDems give no breathing room for unions, lest they expand their influence and overthrow the government of the blessed and the righteous." #NT!
 authdem_agrarianism_subtype: "Agrarianism" #NT!
 authdem_agrarianism_subtype_desc: "§Y(Agrarianism)§!\n\nDespite not being a concrete ideology with a central doctrine or fundamental tenets, agrarianism became a broad classification of various movements across the entire globe concerned with the interests and plight of peasantry as a whole. Supporters of agrarian parties range from large landowners or landed gentry to smallholders and poor farmers, from the lower high class through the most consistent support base among the middle class, and ending up on the lower classes. The origins of political agrarianism can be traced to the 'government of nature' developed by physiocrat and laissez-faire advocate François Quesnay, as well as the republic of rural virtue of Thomas Jefferson. While supporters of such parties hold the people of the land as a foundation of society and the most important part of the nation's organism, they differ wildly in their positions regarding economy, taxation, protectionism vs free trade, system of government, religion etc. Agrarian parties are generally conservative and traditionalist, although there is a sizeable contingent of radically liberal and downright socialistic groups, with some unconventional right-wingers mixed in-between. This wide range can be seen by looking at only a few rural movements, such as the German national revolutionary Landvolkbewegung or the conservative and monarchist Bund der Landwirte, the more centrist Czech RSZML or the Finnish Maalaisliitto, and even the radicals in terms of social changes such as Poland's PSL Wyzwolenia or Bulgaria's BZNS." #NT!
  
 ### Paternal Autocrat 
 absolute_mon_subtype: "Absolute Monarchy" #NT!
 absolute_mon_subtype_desc: "§Y(Absolute Monarchy)§!\n\nAbsolute Monarchy holds a often despotic and authoritarian regime over the people. It is made of an autocratic king or emperor who rules over the country with an iron fist and with a powerful government under him. The government tends to be conservative with traditional values and focuses. The market, press, and businesses of the country are government controlled and the people live without a lot of their freedoms." #NT!
 social_nationalism_subtype: "Social Nationalism" #NT!
 social_nationalism_subtype_desc: "§Y(Social Nationalism)§!\n\nAkin to left-wing nationalism, Social Nationalism refers to a spectrum of national movements and nationalist ideologies influenced by socialist thought. Social nationalism tends to be a national liberation movement that emphasizes a well-considered, intellectual and civic nationalism, patriotism, and in some ways a more democratic political system than typical national-populist movements. Such movements tend to be popular in underdeveloped countries that have long been under the strong influence of a metropolis or a more powerful neighbor, and the appeal to social justice and national sentiment is what they emphasize." #NT!
 authdem_social_nationalism_subtype: "Social Nationalism" #NT!
 authdem_social_nationalism_subtype_desc: "§Y(Social Nationalism)§!\n\nAkin to left-wing nationalism, Social Nationalism refers to a spectrum of national movements and nationalist ideologies influenced by socialist thought. Social nationalism tends to be a national liberation movement that emphasizes a well-considered, intellectual and civic nationalism, patriotism, and in some ways a more democratic political system than typical national-populist movements. Such movements tend to be popular in underdeveloped countries that have long been under the strong influence of a metropolis or a more powerful neighbor, and the appeal to social justice and national sentiment is what they emphasize." #NT!
 pat_duumvirism_subtype: "Duumvirism" #NT!
 pat_duumvirism_subtype_desc: "§Y(Duumvirism)§!\n\nBased on the belief that a single authority is necessary to ensure effective governance and decision-making. However, this authority must be balanced by two competing factions with equal power and influence. This balance of power is thought to promote stability, prevent corruption, and ensure that decisions are made in the best interests of the entire community, rather than just one group or individual." #NT!
 samurai_dictatorship_subtype: "Samurai Dictatorship" #NT!
 samurai_dictatorship_subtype_desc: "§Y(Samurai Dictatorship)§!\n\nSince ancient times, the samurai have always wanted to have power over the imperial court. And it is believed that the leadership of the samurai will make Japan remains strong forever. Also, with the care of these samurai warriors, the administration of state affairs will never be contaminated by foreign ideas.\n\nAnd by living on the moral principles of Confucianism. This uses as an excuse the claim that the ruling samurais were savages, insane, or authoritarian. Because the virtues of Confucius are engraved in the hearts of every samurai. Also Bushido made the samurai a powerful and prudent warrior. To ensure the Yamato will remain strong forever and ever" #NT!
 pataut_warlordism_subtype: "Warlordism" #NT!
 pataut_warlordism_subtype_desc: "§Y(Warlordism)§!\n\nWarlordism is hardly a uniform ideology by any stretch of the imagination. Instead, it describes the varied, incoherent, disorganized, and militarist nature of various warlord cliques around the world, and was named after the Warlord Period of China in which the term became popularized in the modern context. Ranging from bandit groups with a state to organized military startocracies to even military-backed republican governments or pure dictatorships, Warlordism has less to do with politics and more to do with a lack of clear borders and the ever-present and often chaotic nature of warfare. Warlordism is frequently a transitory state, and is usually just a stepping stone on the road to a more clearly defined political system, though some pure warlord states do exist." #NT!
 junta_subtype: "Military Dictatorship" #NT!
 junta_subtype_desc: "§Y(Military Dictatorship)§!\n\nMilitary Juntas are regimes ruled fully through the nation's Armed Forces or through military-backed governments of a similar nature. Juntas are often stratocratic, militarist, and authoritarian regimes that are swift to crack down on any perceived dissent or threat to the nation or its Military regime, and are known to emphasize military might and the fulfillment of national security or ambition over any other pursuit." #NT!
 caudillo_populism_subtype: "Caudillo Populism" #NT!
 caudillo_populism_subtype_desc: "§Y(Caudillo Populism)§!\n\nCaudillo Populism is a term used to designate the different populist dictatorships present in Latin America. These ideologies, often without theoretical foundations, put forward a strong man, often a military man, around whom reigns a strong cult of personality showing him most often as guardian of the Fatherland and Father of the people. With a strong populist character, these regimes create legitimacy by often implementing non-socialist forms of welfare for the people, and by relying on nationalism or patriotism. The economic policies of these regimes vary greatly, ranging from state-run economies to free markets in favor of foreign companies to timid protectionism." #NT!
 corporatocracy_subtype: "Corporatocracy" #NT!
 corporatocracy_subtype_desc: "§Y(Corporatocracy)§!\n\nCorporatocracies are regimes completely controlled by major companies, monopolies, or other large business ventures. Corporatocratic regimes value profit above all, and are known to have little regard for anything besides making a quick buck, though the level or even presence of ruthlessness can vary. Workers rights in these regimes are known to be usually abysmal, as any force that could potentially harm their bottom line is stamped out as soon as they make themselves known, frequently with extreme force" #NT!
 pataut_legionarism_subtype: "Legionarism" #NT!
 pataut_legionarism_subtype_desc: "§Y(Legionarism)§!\n\nFirst popularized by the Iron Guard of Romania, the Black Hundreds in Russia, and the ANI in Italy, Legionarism is a form of a highly religious and deeply militarist revolutionary nationalism. Rejecting entrenched political elites though sometimes tied to monarchism, Legionaries or Legionarists advocate for a national revolution that would end the old order and usher in the creation of a new, spiritually reborn society. Members of Legionary parties are often trained to act as militant martyrs in order to become closer to their Nation and God, though less extreme examples exist where Nationalism and Patriotism are expressed far more than martyrdom. In terms of economics, there is no one defined view, although Capitalism and Socialism are usually outright rejected as a corrupting, foreign force, with Corporatism, Right Syndicalism, or other forms of controlled economics largely being dominant. Though the emphasis on religion and zealotry widely differs, most Legionarists are devoutly Catholic or Christian, depending on the nation of origin, and all are deeply devoted to the jingoistic revitalization of their native country." #NT!
 ukrainian_nationalism_subtype: "Ukrainian Nationalism" #NT!
 ukrainian_nationalism_subtype_desc: "§Y(Ukrainian Nationalism)§!\n\nUkrainian nationalism emerged in the 19th century and gained strength through the hard work of Ukrainian intellectuals, writers, historians, priests, servicemen, and politicians. Mykola Mikhnovskyi, author of the brochure \"Independent Ukraine,\" defined nationalism as a weapon of the enslaved people against their offenders. Between 1914 and 1922, the younger generation had to take part in the bloody struggle for Ukraine's independence. The war and the sacrifices that were made forced a large number of people to choose their destiny forever - to fight. To fight against national injustice, for Ukraine, its freedom, honor, glory and people. The ultimate goal of nationalism is to achieve a Ukrainian, united and independent state, no matter what it takes." #NT!
 revolution_nationale_subtype: "Révolution Nationale" #NT!
 revolution_nationale_subtype_desc: "§Y(Révolution Nationale)§!\n\nThe 'National Revolution' is the official ideology of the French state after Marshal Pétain and his loyalists instituted complete control. Its ideology aims to revolutionize and rebuild French society radically by instituting a strong moral order centered around the person of Marshal Pétain who is the object of a vast and extensive Cult of Personality. Denouncing liberalism, parliamentarianism, socialism and rejecting the modernism of the intellectual and political elites held responsible for France's decline, the Marshal's regime promoted instead a simpler, agrarian ideal of life centered around the family, religion and traditions while instilling in the youth the values of sacrifice and devotion to the Fatherland." #NT!
 theocracy_subtype: "Theocracy" #NT!
 theocracy_subtype_desc: "§Y(Theocracy)§!\n\nTheocracies are perhaps one of the oldest forms of government within human society. Made up either of priests, holy men or figures claiming to represent God or the Gods, Theocracies exist to direct the people to their ultimate end and to offer the their due diligences to their deity. While heavily differing depending on the religion, broadly speaking, Theocracies are authoritarian systems that crush all dissent and opposing religions." #NT!
 pataut_metaxism_subtype: "Metaxism" #NT!
 pataut_metaxism_subtype_desc: "§Y(Metaxism)§!\n\nMetaxism is a Greek nationalist authoritarian ideology associated with Ioannis Metaxas. It calls for the regeneration of the Greek nation and the establishment of a modern, culturally homogeneous Hellenic Nation. Mataxism disparages Liberalism and individualism while propagating various elements commonly found in Valkist or National Populist movements. It seeks to mobilize the Greek people as a disciplined mass in service of the creation of a new Hellenic State. Although some of the doctrines of Metaxism are described as National Populist, academically it is considered to be a unique big tent autocratic governorship based on the personal works of Metaxas unifying ideas from classical Conservatism, Monarchism, Valkism and National Populist movements. The Idea of the Third Greek Civilization after the first ancient Greek and the second Byzantine Civilizations is the common center of the movement, which is defined differently by the various strains within Metaxism." #NT!
  
  
 ### National Populist 
 volkisch_national_valkism_subtype: "Völkisch National-Valkism" #NT!
 volkisch_national_valkism_subtype_desc: "§Y(Völkisch National-Valkism)§!\n\nWhat is Valkism? It is undeniably an ultra-nationalist ideology, founded in the wake of the Great War by Adam Dressler through the unification of numerous Freikorps and veteran associations. Taking their name after the distinctive symbol they wear, Valkists are also ultra-militaristic and share a sense of elitism as a fraternal movement of brothers, inspired by the Bündisch Youth movements. This however also begins the moment where Valkism begins to diverge with the mainstream Valkist movement having taken after none other than German Führer Adam Dressler. However, Dressler was not the only theoretician to idealize the Valkist way. Rudolf Jung was among the first formulators of the Valkist way, idealizing how the state would be run. However, he and others would soon see their vision betrayed by a cabal of socialists and other miserable youths, attempting to subvert the national-social revolution in the German peoples. Now with these traitors overthrown, the TST can at last bring true Valkism, a new Valkism that sees the reality of the Jewish-controlled liberal world order. A Valkism that will ensure the dual hydras of capitalism and Marxism are slain and that Greater Germany will arise from the ashes as the greatest nation in Europe and the world - Völkisch National-Valkism shall be the way forward for Germany." #NT!
 statist_showaist_subtype: "Statist Showaism" #NT!
 statist_showaist_subtype_desc: "§Y(Statist Showaism)§!\n\nSince the ascension of the present emperor to the Chrysanthemum throne, the Japanese Empire has experienced a downfall. The economy has reached a critical point, and the immigration of Koreans, as well as liberal influences in Japanese politics, have only served to inspire right-wing extremists. Led by militarist advocates and the generals of the Imperial Armed Forces on Yamato Island, their only goal is to purify the island and rid it of any corrupted Western ideology once and for all.\n\nUnder the banner of Showa restoration, the far-right has embraced nationalistic and other right-wing ideas from Europe, but with a twist of socialism. This has led to the creation of Showaism, an ideology that seeks to purify the Japanese Empire. Nakano Seigo, a Japanese politician and one of Showaism's advocates, believes that the combination of corporatism and state socialism can help to reform the bureaucracy and rid it of foreign ideas. By making nationalism a central principle in policy-making and relying on trusted and fair overseers, the Japanese bureaucracy can be protected and purified.\n\nTo ensure the protection of the purity of the Japanese bureaucracy, a special government district will be created across Yamato Island. Feudalism will be adapted to some aspects of corporatism to ensure a balanced system of governance." #NT!
 integralism_subtype: "Integralism" #NT!
 integralism_subtype_desc: "§Y(Integralism)§!\n\nIntegralism is the attempt to create a society in which the nation is fully united in an Organic, Integral, and noncombative collaborationist whole. While the specifics differ from movement to movement, broadly speaking Integralism pushes for the total end of Church and State separation, the restoration or empowerment of a Monarch, the end of class struggle, and the decentralization of the state into an organic system in which each aspect of the state functions as an independent but cooperative organ working in unison with its counterparts. Frequently egalitarian in some regards despite its Nationalist slant, Integralism and its derivatives are a group of Christian-dominated political oddities." #NT!
 legionarism_subtype: "Legionarism" #NT!
 legionarism_subtype_desc: "§Y(Legionarism)§!\n\nFirst popularized by the Iron Guard of Romania, the Black Hundreds in Russia, and the ANI in Italy, Legionarism is a form of a highly religious and deeply militarist revolutionary nationalism. Rejecting entrenched political elites though sometimes tied to monarchism, Legionaries or Legionarists advocate for a national revolution that would end the old order and usher in the creation of a new, spiritually reborn society. Members of Legionary parties are often trained to act as militant martyrs in order to become closer to their Nation and God, though less extreme examples exist where Nationalism and Patriotism are expressed far more than martyrdom. In terms of economics, there is no one defined view, although Capitalism and Socialism are usually outright rejected as a corrupting, foreign force, with Corporatism, Right Syndicalism, or other forms of controlled economics largely being dominant. Though the emphasis on religion and zealotry widely differs, most Legionarists are devoutly Catholic or Christian, depending on the nation of origin, and all are deeply devoted to the jingoistic revitalization of their native country." #NT!
 klan_nationalism_subtype: "Klan Nationalism" #NT!
 klan_nationalism_subtype_desc: "§Y(Klan Nationalism)§!\n\nKlan Nationalism is a generic name of the White Supremacist ideology esposed by the American Ku Klux Klan. Varied in its approach to how it handles issues concerning race and ethnicity, the varied sects of the Klan all agree on one thing - White is right. From supporting Back to Africa plans to advocating to a total return the slavery, the ideas of the Klan are varied and diverse, but they can all agree that piety, nationalism, white supremacism, American exceptionalism, and militarism are all Godly pursuits." #NT!
 ukrainian_national_integralism_subtype: "Ukrainian National-Integralism" #NT!
 ukrainian_national_integralism_subtype_desc: "§Y(Ukrainian National-Integralism)§!\n\nUkrainian National-Integralism is based on the Dmytro Dontsov's concept of 'Active' or 'Integral' Nationalism. The Dontsov's doctrine is based on authoritarian integral nationalism and Social-Darwinism. According to him, the nation is in a permanent state of competition, and therefore a war for survival, this idea is reinforced by Mykhailo Kolodzinskyi's doctrine of aggressive expansionism. It follows that war is an inevitable thing, and wars between nations are eternal. Ukrainian nation, if it intends to enter the existing world order on an equal footing with the established ones, should have a hierarchy. At the head should be a leader, the vorzhd, then the elite or the order, under which the mass or the rabble lives. The party stands for Ukrainian dominance in Eastern Europe to ensure peace for the fatherland and wants to colonize new lands so that the state can exist forever." #NT!
 falangism_subtype: "Falangism" #NT!
 falangism_subtype_desc: "§Y(Falangism)§!\n\nFalangism, also known as Falange, is a far-right political ideology that emerged in Spain in the early 20th century. Founded by José Antonio Primo de Rivera in 1933, it gained prominence under the dictatorship of General Francisco Franco from 1939 to 1975. Falangism combines elements of nationalism, authoritarianism, and fascism, emphasizing the unity of the nation and rejecting parliamentary democracy. It promotes a centralized government, anti-communism, and corporatist economic principles.\n\nFalangism advocates for a strong and self-sufficient Spain, upholding traditional values and Catholicism. It seeks to restore and preserve Spain's cultural heritage while rejecting Marxism and internationalism. The ideology places importance on collective unity, with individuals expected to prioritize the nation's interests over their own. It envisions a corporatist economic system where different sectors of the economy are organized into syndicates, operating under state control to achieve social and economic harmony." #NT!
 metaxism_subtype: "Metaxism" #NT!
 metaxism_subtype_desc: "§Y(Metaxism)§!\n\nMetaxism is a Greek nationalist authoritarian ideology associated with Ioannis Metaxas. It calls for the regeneration of the Greek nation and the establishment of a modern, culturally homogeneous Hellenic Nation. Mataxism disparages Liberalism and individualism while propagating various elements commonly found in Valkist or National Populist movements. It seeks to mobilize the Greek people as a disciplined mass in service of the creation of a new Hellenic State. Although some of the doctrines of Metaxism are described as National Populist, academically it is considered to be a unique big tent autocratic governorship based on the personal works of Metaxas unifying ideas from classical Conservatism, Monarchism, Valkism and National Populist movements. The Idea of the Third Greek Civilization after the first ancient Greek and the second Byzantine Civilizations is the common center of the movement, which is defined differently by the various strains within Metaxism." #NT!
  
  
  
 ### Valkist 
 panasian_nichirenist_subtype: "Pan-Asian Nichirenism" #NT!
 panasian_nichirenist_subtype_desc: "§Y(Pan-Asian Nichirenism)§!\n\nThe evolution of Nichirenism began with Tanaka Chigaku, the father of Nichirenism, who believed that Nichiren Buddhism is the supreme truth, above all other beliefs in Yamato Island. The logos of Nichirenism must be followed by everyone, from the Emperor to bureaucrats and even common people. In the Japanese interpretation of the Lotus Sutra, it is believed that the Buddha is the only supreme being and even the center of the universe. Buddha's logos represent the supreme truth of the universe, and the Emperor will become the Marshal of the Holy Armed Forces and the viceroy of Buddha. He will guide the unification of Asia on the right and absolute path. After the world has been unified, the Lotus Sutra shall be taught in every corner of the world.\n\nLater, Nichirenism was further developed by Inoue Nissho, a preacher and former army spy who joined the Xinhai Revolution. He believed that he received the truth from Buddha while taking refuge in an abandoned temple and was motivated to study Nichiren Buddhism. He joined Chigaku's association in teaching Nichirenism and developed Pan-Asianism and Nichirenism together. He believed that Japan was the center of the world, the Sino-Indosphere, and that the unification of Asia was the same as the unification of the world. The Lotus Sutra must be spread to both the Moon (India) and the Sun (Japan), and there is no faith that is above the Lotus Sutra from west to east." #NT!
 occultism_subtype: "Esotericism" #NT!
 occultism_subtype_desc: "§Y(Esotericism)§!\n\nEsoteric Nationalism, also called Occultist Nationalism or Esotericism, is a diverse subset of far-Right ideologies bound together by their shared emphasis on outsider philosophies, religions, and other estranged ideas or movements. Often tied to Paganism, the Occult, or to fringe ideas like Theosophy and Ariosophy, these syncretic movements combine Nationalist fervor with their chosen motif or aesthetic, and seek to rebuild society completely along the lines of their proclaimed dogma." #NT!
 val_legionarism_subtype: "Legionarism" #NT!
 val_legionarism_subtype_desc: "§Y(Legionarism)§!\n\nFirst popularized by the Iron Guard of Romania, the Black Hundreds in Russia, and the ANI in Italy, Legionarism is a form of a highly religious and deeply militarist revolutionary nationalism. Rejecting entrenched political elites though sometimes tied to monarchism, Legionaries or Legionarists advocate for a national revolution that would end the old order and usher in the creation of a new, spiritually reborn society. Members of Legionary parties are often trained to act as militant martyrs in order to become closer to their Nation and God, though less extreme examples exist where Nationalism and Patriotism are expressed far more than martyrdom. In terms of economics, there is no one defined view, although Capitalism and Socialism are usually outright rejected as a corrupting, foreign force, with Corporatism, Right Syndicalism, or other forms of controlled economics largely being dominant. Though the emphasis on religion and zealotry widely differs, most Legionarists are devoutly Catholic or Christian, depending on the nation of origin, and all are deeply devoted to the jingoistic revitalization of their native country." #NT!
 val_metaxism_subtype: "Metaxism" #NT!
 val_metaxism_subtype_desc: "§Y(Metaxism)§!\n\nMetaxism is a Greek nationalist authoritarian ideology associated with Ioannis Metaxas. It calls for the regeneration of the Greek nation and the establishment of a modern, culturally homogeneous Hellenic Nation. Mataxism disparages Liberalism and individualism while propagating various elements commonly found in Valkist or National Populist movements. It seeks to mobilize the Greek people as a disciplined mass in service of the creation of a new Hellenic State. Although some of the doctrines of Metaxism are described as National Populist, academically it is considered to be a unique big tent autocratic governorship based on the personal works of Metaxas unifying ideas from classical Conservatism, Monarchism, Valkism and National Populist movements. The Idea of the Third Greek Civilization after the first ancient Greek and the second Byzantine Civilizations is the common center of the movement, which is defined differently by the various strains within Metaxism." #NT!
 mercourism_subtype: "Mercourism" #NT!
 mercourism_subtype_desc: "§Y(Mercourism)§!\n\nNamed after his founder and chief ideologue George S. Mercouris, Mercourism describes a specific current of Valkism found within the Greek far right. Marcourism takes great inspiration from Plato's ideal republic and envisions a state founded upon these ideals, Marcourism envisions Greece rejuvenated by a new elite of philosopher Kings, born from the recent struggles of Greece and inspired by the great past of their race. Furthermore a hierarchical order of society based on natural laws and merit of the individual is envisioned. The state would be separated into three classes, the ruling class, a elite trained from birth and tested at every opportunity, the warrior class, strong fighters of courage and virtue like the Spartans of old and the commoner class, working man and woman of Greece, constantly striving to better themselves, united in solidarity against the enemies of order and the state. The common good for Greece is placed as the highest ideal for each individual to strife for and the willingness to pursue knowledge art and power for the Greek people. Mercourism acknowledges the trappings of modernity and progress and seeks to use its power to transform the old Greece towards this Platonist ideal and end their final struggle against the eternal Turkish menace." #NT!
