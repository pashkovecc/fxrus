 ####################################### 
 # BLR - Belarus 
 ####################################### 
 BLR_infantry_equipment_0: "Vintoŭka Mosina-Nahanta uz.1891" #NT!
 BLR_infantry_equipment_0_short: "Mosin uz.1891" #NT!
 BLR_infantry_equipment_0_desc: "Adopted in 1891, the Mosin-Nagant is a magazine-fed bolt-action rifle feeding five rounds of 7.62x54mmR from a fixed single-stack magazine. The cartridge, designed to accompany the rifle, is powerful and flat-shooting, and accompanied by the long barrel of the 1891, provides the infantryman with an accurate weapon at long range, but which is held back by awkward handling, middling manufacture quality, and a tendency for the action to bind after a number of rounds fired. Despite this, the Mosin-Nagant remains one of the world's most prolific rifles." #NT!
 BLR_infantry_equipment_1: "Vintoŭka Mosina-Nahanta uz.1907/1928" #NT!
 BLR_infantry_equipment_1_short: "Mosin uz.1907/28" #NT!
 BLR_infantry_equipment_1_desc: "Based on the 1907 Dragoon Rifle, the uz.1907/28 is an attempt by Belarusian armorers to adapt large stocks of Imperial Russian-era M1891 and M1907 rifles to a more modern standard. The uz.1907/28 drops the spike bayonet for a more traditional knife bayonet, and has a shortened barrel length matching the 1907 pattern. It features updated sights and an updated trigger grouping, which seeks to improve its handling in the hands of an average infantryman." #NT!
 BLR_infantry_equipment_2: "Samazaradnaja Vintoŭka Jakizava uz.1941" #NT!
 BLR_infantry_equipment_2_short: "SVJ-41" #NT!
 BLR_infantry_equipment_2_desc: "Designed by Russian firearm designer Foma Yakizov, who emigrated to Belarus in the 1920s, the SVJ-39 utilizes a similar form-factor to the familiar Mosin-Nagant rifle. Utilizing the gas-trap operation of the Mauser Selbstladegewehr, the SVJ feeds from a fixed, staggered internal 5-round magazine, resulting in a somewhat clunky rifle which only marginly improves firepower over the Mosin-Nagant, at the cost of infrequent operation issues." #NT!
 BLR_infantry_equipment_3: "Aŭtamat-Karabin Vollmer uz.1944" #NT!
 BLR_infantry_equipment_3_short: "AKV-44" #NT!
 BLR_infantry_equipment_3_desc: "When Heinrich Vollmer designed the MKb 35, it saw little commercial success at the time, and was rejected by the German army for adoption. As a result, the design remained without a home, until Belarusian adoption, adapting the 7.75x39.5mm cartridge into a 7.62x40mm cartridge to better suit Belarusian barrel manufacture. The design, featuring a removable box magazine fed by stripper clips, allows for easy cleaning and has a (mostly) reliable gas system." #NT!
  
