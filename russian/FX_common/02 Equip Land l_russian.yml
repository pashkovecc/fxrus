 USA_infantry_equipment_0: "Rifle, M1903/M1918" #NT!
 USA_infantry_equipment_0_short: "M1903/M1918" #NT!
 USA_infantry_equipment_0_desc: "Adopted in 1903, the Springfield rifle has served as the US's faithful service rifle for three decades. In 1918 the 'US Automatic Pistol, M1918' was adopted, a device that fires the .30-18 pistol cartridge out of a standard Springfield rifle, feeding from a 40-round magazine; devised to boost the firepower of infantrymen with high-capacity semi-auto fire. Utilized during the final months of the Great War, it proved a novelty that shocked German troops but was fiddly and breakage-prone." #NT!
 USA_infantry_equipment_1: "Rifle, M1903A1 Springfield" #NT!
 USA_infantry_equipment_1_short: "M1903A1 Springfield" #NT!
 USA_infantry_equipment_1_desc: "A modernized pattern of the M1903 adopted in 1929, the M1903A1 uses a completely redesigned stock with a semi-pistol grip and has streamlined sights for easier infantry use. Modern manufactured M1903A1s also perform more reliably with powerful ammunition loads and are outfitted with modernized bayonets and sights." #NT!
 USA_infantry_equipment_2: "Rifle, M1 Garand" #NT!
 USA_infantry_equipment_2_short: "M1 Garand" #NT!
 USA_infantry_equipment_3: "Automatic Rifle, T20 Garand" #NT!
 USA_infantry_equipment_3_short: "T20 Garand" #NT!
 USA_infantry_equipment_3_desc: "As military technology increasingly develops, the need for individual soldiers to be able to act as independent bases of fire has become evident. The T20 Garand is a trial design intended to supplant both the M1 Garand and the M1918A2 BAR, feeding from 20-round BAR magazines and being capable of selective fire." #NT!
  
  
