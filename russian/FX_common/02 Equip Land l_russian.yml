 SOV_infantry_equipment_0_desc: "Adopted in 1891, the Mosin-Nagant is a magazine-fed bolt-action rifle feeding five rounds of 7.62x54mmR from a fixed single-stack magazine. The cartridge, designed to accompany the rifle, is powerful and flat-shooting, and accompanied by the long barrel of the 1891, provides the infantryman with an accurate weapon at long range, but which is held back by awkward handling, middling manufacture quality, and a tendency for the action to bind after a number of rounds fired. Despite this, the Mosin-Nagant remains one of the world's most prolific rifles." #NT!
