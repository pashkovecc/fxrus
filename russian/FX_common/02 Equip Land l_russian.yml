 ENG_infantry_equipment_0: "Rifle, No. 1, Mk.III* SMLE" #NT!
 ENG_infantry_equipment_0_short: "No. 1, Mk.III* SMLE" #NT!
 ENG_infantry_equipment_0_desc: "Introduced in 1904, the Short Magazine Lee-Enfield was, at the time, a remarkably forward-thinking rifle design. Coupled with a detachable magazine fed by two 5-round stripper clips, a relatively short length, and a fast and easy bolt throw, it is a handy rifle used by many branches of service. Its design saw many updates over the decades, and while it is long in the tooth by the 1930s, it remains in service all across the British Empire." #NT!
 ENG_infantry_equipment_1: "Rifle, No. 4, Mk.I" #NT!
 ENG_infantry_equipment_1_short: "No. 4 Lee-Enfield" #NT!
 ENG_infantry_equipment_1_desc: "The No. 4 Rifle is a modernized design based on the older No.1 Lee-Enfield rifle, albeit with simplified construction and updated ergonomics. Its simpler and handier bayonet is a spike instead of a sword bayonet, easing both manufacture and use. It also features updated sights, accompanied by more modern ammunition types including the \"F1\" Semi-Armor-Piercing round." #NT!
 ENG_infantry_equipment_2: "Rifle, No. 6, Mk.I Vickers-Armstrong" #NT!
 ENG_infantry_equipment_2_short: "No. 6, Mk.I VA" #NT!
 ENG_infantry_equipment_2_desc: "Designed by American firearm inventor John Pedersen, the No.6 Rifle was developed for British adoption by the Vickers-Armstrong company, and features a toggle-delayed blockback action which allows far faster firing than a traditional bolt-action rifle. It fires a lighter .276 cartridge, which allows for more accurate repeated fire by a single soldier, and feeds from a five-round enbloc clip, giving it a very high effective rate of fire." #NT!
 ENG_infantry_equipment_3: "Rifle No. 8, Mk.I BSA" #NT!
 ENG_infantry_equipment_3_short: "No. 8, Mk.I BSA" #NT!
 ENG_infantry_equipment_3_desc: "Developed originally as the Birmingham Small Arms 28P, the No. 8 is a select-fire battle rifle chambered for the .276 British cartridge, feeding from a 20-round detachable magazine, but designed to be reloaded by 10-round stripper clips. While various other models were tested for Britain's new automatic rifle, the 28P was chosen as a familiar conventional design which otherwise handles similarly to older models." #NT!
  
  
