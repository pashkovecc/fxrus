 ##STYLE GUIDE## 
 ##German weaponry is named according to a (relatively) straightforward convention, and those names are abbreviated consistently across the board. 
 ##The full name consists of three parts: The Type of equipment, the year of the original equipment's adoption, and suffix letters denoting variants. 
 ## -> Karabiner 1898AZ 
 ## Karabiner    (Carbine: Equipment Type) 
 ## 1898         (Year of adoption) 
 ## AZ           (Aufpflanz-und-Zusammensetzvorrichtung-- "With Bayonet Attachment Point & Stacking Rod". The variant) "With Bayonet Attachment Point & Stacking Rod" #NT!
 ## 
 ## This will abbreviated by shortening the Equipment type, and leaving a full space after the abbreviated word, with no period or other punctuation. 
 ## 
 ## -> Kar 98AZ 
 ## Like this. 
 ## 
 ## Abbreviations are different across German period literature and different equipment types, but it is good to keep a consistent labelling style. 
  
