 ##### DECISIONS ##### 
 FRA_entente_council: "The Entente Council" #NT!
 FRA_entente_council_desc: "After the utter devastation caused by The Great War, France established the Entente Council as a pan-European organisation to help peacefully mediate any future conflicts that may arise and hopefully avoid another major war. While peace has been kept so far, growing threats in Europe are beginning to strain the organizations ability to peacefully deal with them.\n\n§YAverage Entente Council Member's Confidence:§! §R[?FRA.entente_faith]%§!" #NT!
 entente_faith: "[?Root.entente_faith]" #NT!
