 sweden.92.t: "King Strengthen our Bond to the British Monarchy" #NT!
 sweden.92.d: "WIP" #NT!
 sweden.92.a: "Hurray!" #NT!
 sweden.93.t: "Royal Visit to Germany" #NT!
 sweden.93.d: "WIP" #NT!
 sweden.93.a: "It was an Honour!" #NT!
  
 sweden.94.t: "A Scandinavian Passport Union" #NT!
 sweden.94.d: "Easier Moving In between Countries?" #NT!
 sweden.94.a: "Let's Propose It" #NT!
 sweden.94.b: "Nah, Never mind" #NT!
  
 sweden.100.t: "Sweden Wants Trade Agreements" #NT!
 sweden.100.d: "WIP" #NT!
 sweden.100.a: "Okay then." #NT!
 sweden.100.b: "Nah." #NT!
 sweden.101.t: "The Soviets Accepted our Trade Agreements" #NT!
 sweden.101.d: "WIP" #NT!
 sweden.101.a: "This is a Great Start for Swedish-Soviet Relations!" #NT!
 sweden.102.t: "The Soviets Reject our Trade Agreements" #NT!
 sweden.102.d: "WIP" #NT!
 sweden.102.a: "Then we have to Endure the Crisis Alone." #NT!
  
 sweden.105.t: "The Swedish Proletariat Election" #NT!
 sweden.105.d: "With the power of the Swedish proletariat secured and our way to recovery clear, we can finally work to build a proletarian democracy in Sweden. Holding elections among the workers and farmers, there are primarily two parties that has a chance to secure victory.\n\nThe Left Socialists are made up of former Social Democrats who seek to build a democratic and revolutionary socialist society. They seek to decentralize power away from Stockholm and to ensure that Sweden remains as neutral as possible internationally.\n\nThe Communists are inspired by the Bolsheviks in Russia. They seek to reform our proletarian democracy into a socialist single-party state, with the party standing unopposed in the progress towards a Communist society. Among the Communists, there are some that are more radical and oriented towards building a revolutionary Vanguard." #NT!
 sweden.105.a: "Vänstersocialistiska Partiet Takes Control" #NT!
 sweden.105.b: "Sveriges Kommunistiska Parti Remains in Control" #NT!
 sweden.105.c: "The Revolutionary Vanguard of SKP Takes Control" #NT!
  
 sweden.106.t: "Sweden Wants to Join our International" #NT!
 sweden.106.d: "A messenger from Sweden have today arrived Moscow with an interesting request. With the world seemingly heading towards a new Great War, Sweden have taken the choice to leave their neutrality. They have requested us their entrance into our alliance. Many within our government sees this as a good way to strengthen the socialist revolution in Scandinavia, but others also think it could take resources that could be used in other theaters." #NT!
 sweden.106.a: "We Welcomes Them!" #NT!
 sweden.106.b: "No, Thanks!" #NT!
 sweden.107.t: "The Soviets Welcomes Us!" #NT!
 sweden.107.d: "Our messenger have come back with good news. The Soviet Union have accepted our request to join the Third International. With this alliance secured, we hope that our road ahead is much more safer, with many more ambitions available." #NT!
 sweden.107.a: "This is the Start of a Great Friendship!" #NT!
 sweden.108.t: "The Soviets Reject Us!" #NT!
 sweden.108.d: "Our messenger have come back, sadly, with bad news. The Soviet Union did not accept our request to join the Third International, leaving us outside their alliance. It is unfortunate that they doesn't see the need for our international movement to stick together against the reactionary forces of this world." #NT!
 sweden.108.a: "We Shall Show Them!" #NT!
  
 sweden.109.t: "Sweden Wants a Socialist Union" #NT!
 sweden.109.d: "The Swedish workers have thrown off the shackles of reactionary capitalism and have sent an envoy to Oslo. They propose that we should combine our forces and unite into a Scandinavian Socialist Union." #NT!
 sweden.109.a: "Yeah! Let's do it!" #NT!
 sweden.109.b: "No, we Are Independent!" #NT!
 sweden.110.t: "Norway Accept Unification" #NT!
 sweden.110.d: "Our Norwegian brethrens have accepted our request for unification. Together, we will break the borders that have divided us and forge a Pan-Scandinavian socialist society." #NT!
 sweden.110.a: "Perfect!" #NT!
 sweden.111.t: "Norway Reject Unification" #NT!
 sweden.111.d: "Our Norwegian brethrens have sadly rejected our request for unification. It is evident that the Norwegian socialist government are still captives of the reactionary ideas of nationalism. With these news, many inside our government are now urging us to unify with them by force." #NT!
 sweden.111.a: "Then We Need to Use Might" #NT!
 sweden.111.b: "Accept Their Choice" #NT!
  
 sweden.112.t: "Sweden Wants a Socialist Union" #NT!
 sweden.112.d: "The Swedish workers have thrown off the shackles of reactionary capitalism and have sent an envoy to Helsinki. They propose that we should combine our forces and unite into a Scandinavian Socialist Union." #NT!
 sweden.112.a: "Yeah! Let's do it!" #NT!
 sweden.112.b: "No, we Are Independent!" #NT!
 sweden.113.t: "Finland Accept Unification" #NT!
 sweden.113.d: "Our Finnish brethrens have accepted our request for unification. Together, we will break the borders that have divided us and forge a Pan-Scandinavian socialist society." #NT!
 sweden.113.a: "Perfect!" #NT!
 sweden.114.t: "Finland Reject Unification" #NT!
 sweden.114.d: "Our Finnish brethrens have sadly rejected our request for unification. It is evident that the Finnish socialist government are still captives of the reactionary ideas of nationalism. With these news, many inside our government are now urging us to unify with them by force." #NT!
 sweden.114.a: "Then We Need to Use Might" #NT!
 sweden.114.b: "Accept Their Choice" #NT!
  
 sweden.115.t: "Sweden Wants a Socialist Union" #NT!
 sweden.115.d: "The Swedish workers have thrown off the shackles of reactionary capitalism and have sent an envoy to Copenhagen. They propose that we should combine our forces and unite into a Scandinavian Socialist Union." #NT!
 sweden.115.a: "Yeah! Let's do it!" #NT!
 sweden.115.b: "No, we Are Independent!" #NT!
 sweden.116.t: "Denmark Accept Unification" #NT!
 sweden.116.d: "Our Danish brethrens have accepted our request for unification. Together, we will break the borders that have divided us and forge a Pan-Scandinavian socialist society." #NT!
 sweden.116.a: "Perfect!" #NT!
 sweden.117.t: "Denmark Reject Unification" #NT!
 sweden.117.d: "Our Danish brethrens have sadly rejected our request for unification. It is evident that the Danish socialist government are still captives of the reactionary ideas of nationalism. With these news, many inside our government are now urging us to unify with them by force." #NT!
 sweden.117.a: "Then We Need to Use Might" #NT!
 sweden.117.b: "Accept Their Choice" #NT!
  
 sweden.120.t: "A Union of Scandinavian Soviets?" #NT!
 sweden.120.d: "With the Nordic countries under one banner, we can finally unite the brethren people of Sweden, Norway, Denmark and Finland into one Scandinavian Socialist state. Today, a new day rises for the working class of these fair lands." #NT!
 sweden.120.a: "Long Live the Scandinavian Worker!" #NT!
  
 sweden.121.t: "Rising Swedish Influence" #NT!
 sweden.121.d: "The socialist regime in Sweden has given refuge to the radicals in the Labour Party. We are worried that they will attempt to incite revolutionary activies in Norway." #NT!
 sweden.121.a: "Damn Those Swedes" #NT!
  
 sweden.122.t: "Sweden Sends Aid" #NT!
 sweden.122.d: "The Swedish government have issued us military aid, as well as helping us with volunteers in our fight against the Soviet Union. Hopefully, this will be more than enough to secure a victory over the Russian bear." #NT!
 sweden.122.a: "Thank You, Sweden" #NT!
  
 sweden.123.t: "Sweden Request Access" #NT!
 sweden.123.d: "Our Swedish neighbors have reached out and requested that we give them military access through our nation. For the Swedes, this access will make it easier for them to move their forces down into the European continent in anticipation of a war against Germany. However, it could also make Denmark a target for the enemies of Sweden." #NT!
 sweden.123.a: "Let Them Enter" #NT!
 sweden.123.b: "We Have to Deny Them" #NT!
 sweden.124.t: "Denmark Accepted" #NT!
 sweden.124.d: "The Danish government have accepted our request, allowing our forces to travel through Danish lands. As a part of this deal, we have ourselves given them access to our land." #NT!
 sweden.124.a: "Knew the Danes Are Somewhat Reasonable" #NT!
 sweden.125.t: "Denmark Rejected" #NT!
 sweden.125.d: "The Danish government have rejected our request. This was not an unlikely outcome, but it still is regretable. Maybe we shouldn't have hoped much from the Danes after all." #NT!
 sweden.125.a: "Stubborn Flatlanders" #NT!
  
 sweden.126.t: "Sweden Seeks a Referendum on Åland" #NT!
 sweden.126.d: "Swedish diplomats have contacted us, asking us if we would be interested in an referendum on Åland. The Swedes are willing to give the decision to the people of Åland, seemingly growing a consciousness since their occupation of the islands. In Finland, there are mixed feelings about this. Some Finnish nationalists support it, since it can be an opportunity to reclaim the islands, while others reject it, since it can end up with legitimicing the Swedish occupation. It is up to us what we are going to do." #NT!
 sweden.126.a: "Referendum! We Will Win it Easily!" #NT!
 sweden.126.b: "We Can't Give Them the Chance" #NT!
 sweden.127.t: "Finland Accepts the Referendum" #NT!
 sweden.127.d: "Good news have arrived from our Finnish neighbors. They are on-board that we hold a referendum on the Åland islands. While the Finns might see this as an opportunity to gain control over the islands, it will be our opportunity to make our reconquest of the islands legitimate. Already, some polls do show a pro-Sweden leaning. Hopefully, the referendum will be easy to win, but we should be aware that Finland will try to steer it in their favor." #NT!
 sweden.127.a: "Now, the Work Begins" #NT!
 sweden.128.t: "Finland Doesn't Want a Referendum" #NT!
 sweden.128.d: "Surprisingly, the Finns have rejected our offer of holding a referendum on the Åland islands. This is probably because they fear such a referendum will only help legitimicing our control over the islands. In our eyes, however, this answer is proof that Åland isn't so important for Finland and that it is best for it to be governed by us. We gave them a chance..." #NT!
 sweden.128.a: "...and They Blew It" #NT!
  
 sweden.129.t: "The [GetYear] Election" #NT!
 sweden.129.d: "New parliamentary elections have come to Sweden. With the last four years being dominated by the authoritarian prime ministership of Carl Gustaf Hammarskjöld, the parliament have been put on the sideline in favor of a government that got more of its power from the King and the military. In this environment, democratic ideals have rotted away.\n\nWith Hammarskjöld retiring from politics and the appoinment of a moderate conservative to lead the government, many look with hope towards this election. Even if liberalization of the regime hasn't occured yet, there are faith in the new government that democracy will again flourish in Sweden.\n\nAnd the result is:\n\n§BConservatives§!: 124 Seats\n§SSocial Democrats§!: 42 Seats\n§GFarmers' League§!: 33 Seats\n§3People's Party§!: 21 Seats\n§0National Bloc§!: 10 Seats" #NT!
 sweden.129.a: "Victory for Democracy!" #NT!
  
 sweden.130.d: "New parliamentary elections have come to Sweden. With the last four years being dominated by the authoritarian prime ministership of Carl Gustaf Hammarskjöld, the parliament have been put on the sideline in favor of a government that got more of its power from the King and the military. In this environment, democratic ideals have rotted away.\n\nEven if Hammarskjöld is gone from Swedish politics, his authoritarian conservatism still lives on. For many, this election will only be a formality to strengthen the legitimacy of the regime. Even if there are still a few parties left, the regime will likely use its foreseeable victory to end party politics in Sweden.\n\nAnd the result is:\n\n§BConservatives§!: 176 Seats\n§0National Bloc§!: 25 Seats\n§GFarmers' League§!: 23 Seats\n§PIndependent Lists§!: 6 Seats" #NT!
  
 sweden.131.d: "New parliamentary elections have come to Sweden. After the victory of the Social Democratic-led coalition, the years of authoritarianism that was marked by the Hammarskjöld government has faded into the background and the New Swedish Movement does no longer pose a threat. Instead of radicalism, this years' election have many moderate voices with differing views on how Sweden ought to be governed.\n\nWith the election, the coalition between the Social Democrats and the liberals are beginning to fracture. Prime minister Hansson seek to further his vision of Folkhemmet, even proposing universal health care. The liberals have begun to voice alarm over these programs and will likely ally with the moderate conservatives.\n\nIt will be up to the Swedish people to vote." #NT!
 sweden.131.a: "The People Seem to Want More Social Democracy" #NT!
 sweden.131.b: "The People Seem to Want a Change in Government" #NT!
  
 sweden.132.t: "Social Democratic Victory!" #NT!
 sweden.132.d: "The people voted and they gave their answer - a new term for the Social Democrats of Per Albin Hansson. As the votes are counted, it creates a clear picture that people trust the Social Democrats not only to give them social security but also defend Sweden.\n\nAnd the result is:\n\n§SSocial Democrats§!: 133 Seats\n§BConservatives§!: 40 Seats\n§GFarmers' League§!: 26 Seats\n§3People's Party§!: 20 Seats\n§0National Bloc§!: 8 Seats\n§rCommunist Party§!: 3 Seats" #NT!
  
 sweden.133.t: "Borgerliga Blokket Victory!" #NT!
 sweden.133.d: "The people voted and they gave their answer - that they were tired of the Social Democrats and Per Albin Hansson. As the votes are counted, it creates a clear picture that people have given the Conservatives, Liberals and Agrarians a mandate to temper and moderate the Folkhemmet that the Social Democrats have given them.\n\nAnd the result is:\n\n§SSocial Democrats§!: 100 Seats\n§BConservatives§!: 64 Seats\n§GFarmers' League§!: 37 Seats\n§3People's Party§!: 23 Seats\n§0National Bloc§!: 3 Seats\n§rCommunist Party§!: 3 Seats" #NT!
  
 sweden.420.d: "In 1814, directly following the wake of the Napoleonic wars, Sweden gained control of the kingdom of Norway and the two entered a personal union which would last until 1905. Sweden-Norway remained neutral in nearly all conflicts of the later 19th century but during this time it cemented itself as one of the richest nations in Europe with one of the continents highest standard of living. This blissful isolation has been chalenged several times though. Sweden-Norway refused to support Denmark in their war against Prussia in 1864 which would permanently damaged support for a united Scandinavia. After nearly a century together Sweden and Norway dissolved the union in 1905 on good terms. \n\nRelations between the Nordic nations have remained good until the socialist party "Arbeiderpartiet" took power in Norway and ousted the Royal Family in a controversial referendum. Coming out of the ashes of the failed revolution in Sweden, Swedish conservatives rallied together against this new ideological enemy. For the last decade tensions in northern Europe have been high and in the wake of the London Stock Crash have finally reached a boiling point. The war between out nations was brutal but the Swedes have come out victorious over the revolutionaries and for the first time since 1905 our nations are one. In this ever changing world we must be strong to survive. A united Scadinavia will be too powerful for any nation to overcome! Shall we reform the union between our glorious states?" #NT!
  
 #### NEWS EVENTS #### 
 swenews.1.d: "[This.GetNewspaperHeader]During the Great War, Norway found themselves in a precarious position to say the least. The War ended up opening a rift between the classes of Norway, notably the Upper-class and Lower-class. Many resorted to the teachings of Karl Marx, and following a major Strike gone violent in Olso, the Arbeiderpartiet (Labour Party) pulled a large majority in the following elections. A referendum on the abolition of the monarchy was soon held, and a 52.1% saw it through… Much to the dissatisfaction of their neighbors. \n\nJust recently after the Victory of the Nationalist/Loyalist Coalition in Sweden; it has become apparent that Sweden has looked to break their policy of neutrality. Campaigning against Socialism in Scandinavia, Gustaf V is eager to demonstrate that Sweden is willing to meet Socialists with force." #NT!
  
 #### FOCUS TREE #### 
  
 SWE_reevaluate_swedish_defence: "Reevaluate Swedish Defence Policy" #NT!
 SWE_reevaluate_swedish_defence_desc: "Since the end of the Great War, our defence spending has laid on a low level. However, with the world again warming up to conflict, we need to revisit the issue of defence. In the upcoming Försvarsbeslutet 1936, there is a proposed increase in the yearly spending towards the Swedish Armed Forces. This is a natural step towards reforming our military." #NT!
 SWE_reforming_army: "Reforming the Army" #NT!
 SWE_reforming_army_desc: "Sweden has not seen war since 1814, and that shows in our military. For years, the Swedish army has remained backward, with many conservative generals refusing to adapt to modern advances. At the same time, Sweden have a proud military history to look back on, and we can take inspiration for reform both from the past and in the future." #NT!
 SWE_modern_caroleans: "Modern Caroleans" #NT!
 SWE_modern_caroleans_desc: "The Caroleans managed to build an empire in northern Europe on their shock tactics and dicipline. While they were created at a time of musketry, volley fire and pikemen, we should learn from their combination of shock and dicipline. By adapting Carolean tactics to modern technology, we will be able to build a new empire." #NT!
 SWE_focus_specialized_units: "Focus on Specialized Units" #NT!
 SWE_focus_specialized_units_desc: "" #NT!
 SWE_combined_arms_legacy: "Combined Arms Legacy" #NT!
 SWE_combined_arms_legacy_desc: "Gustavus Adolphus was one of the first military leaders to use different combat arms of a military to achieve victory. He emphazized mobility and aggressiveness over defence, employing mobile artillary on the field. We should find inspiration in the tactics and innovations of Gustavus Adolphus, amending them to the reality of modern warfare." #NT!
 SWE_new_infantry_equipment: "New Infantry Equipment" #NT!
 SWE_new_infantry_equipment_desc: "The equipment mostly used by our infantry is the gun known as the Swedish Mauser, our own version of the German design. While the old versions still works well, with the rise of mechanized infantry units the call for a shorter rifle has been made. With these changes, the weapon can be better used by other units in our military than just foot infantry." #NT!
 SWE_modernize_shock_tactics: "Modernize Shock Tactics" #NT!
 SWE_modernize_shock_tactics_desc: "While most of our military victories have been achieved through aggressiveness and shock, today we are more willing to stand back and defend. This has to change if we are forced into battle again. We need to take inspiration from our forefathers, their dicipline and resolve, and follow them into the charge.\n§RGå På!§!" #NT!
 SWE_reform_general_staff: "Reform the General Staff" #NT!
 SWE_reform_general_staff_desc: "The general staff is outdated, filled with men who doesn't even know that we have left the 19th century. We need to reform it to keep our army up to date and encourage meritocracy inside the ranks. In modern warfare, and warfare of any age, aritocracy hasn't determined if someone is fit to serve as a general." #NT!
 SWE_army_motorization: "Army Motorization" #NT!
 SWE_army_motorization_desc: "The invention of motors have revolutionized modern warfare. No longer is the battlefield dominated by men and horses. You can have armoured veichles that can be used for combat or for upholding supply lines. Even if Sweden is a little too small for tank production, we have the steel and synthetic rubber for other veichles." #NT!
 SWE_men_of_dalarane: "Men of Dalarna" #NT!
 SWE_men_of_dalarane_desc: "Dalarna is a region of Sweden known for its hills and valley, as well as its mining deposits. The men from these areas are hardy and know their rights. Historically, both Engelbrekt and Gustav Vasa found their strongest supporters among the men of Dalarna. With their history and their nature, it is no surprise that they prove useful as hunters and mountaineers." #NT!
