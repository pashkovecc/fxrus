 SWE_continued_industrialization: "Continued Industrialization" #NT!
 SWE_continued_industrialization_desc: "Sweden is a growing industrial powerhouse. Why shouldn't we continue in advancing our nation's greatness. Despite our problems, our nation still have many of Europe's best entrepreneurs and industralists around." #NT!
 SWE_expand_forestry_industry: "Expand the Forestry Industry" #NT!
 SWE_expand_forestry_industry_desc: "Our country is covered by forests and throughout Swedish history, the forests have played an important part of our economy. From building materials to furniture, the Swedish forests continues to bring riches to our nation. With both our domestic population and foreign buyers looking for Swedish products, we need to expand to be able to provide." #NT!
 SWE_swedish_hydropower: "Swedish Hydropower" #NT!
 SWE_swedish_hydropower_desc: "While Sweden doesn't have the ability to utilize our rivers and lakes to produce power like Norway can, we still have some potential for hydropower production. Especially in the northern parts of our country, into Jamtland, Dalarna and Norrland. Constructing new dams and hydropower stations will help providing energy for both the Swedish population and Swedish industry." #NT!
 SWE_ericsson_electric_industries: "Ericsson Electric Industries" #NT!
 SWE_ericsson_electric_industries_desc: "Telefonaktiebolaget LM Ericsson started in 1876 as a company that produced telegraph products for the government agency Telegrafverket. After a few years, Ericsson began to make and sell their own telephones. The company is in the forefront of the electronic industry, with their products reaching far beyond Sweden's borders. They continue to be an important provider for the Swedish government, both in civilian and increasingly in military matters." #NT!
 SWE_modernize_railways: "Modernize the Railways" #NT!
 SWE_modernize_railways_desc: "Rail transport in Sweden have chugged along since the first rails were laid in 1855. Since then, and with the establishment of the state-owned Statens Järnvägar, Sweden have quickly become one of the most covered country in comparison to our population. However, we always need to have our railways up to date and ensure that it is expanded enought to keep up with Swedish industrial demands." #NT!
 SWE_expand_car_roads: "Expand the Road Network" #NT!
 SWE_expand_car_roads_desc: "Our infrastructure can not only rely on rail transport. With the advent of the automobile, there will be a demand for roads that can properly acount for the rising demand. In addition, the Swedish military will seek to use this infrastructure for it's own use." #NT!
 SWE_support_skanska: "Support Skanska" #NT!
 SWE_support_skanska_desc: "Aktiebolaget Skånska Cementgjuteriet was founded in 1887 and have quickly rissen as one of the biggest construction companies not only in Sweden, but in Scandinavia. It started by manufacturing concrete products before diversifying. Skanska plays an important role in fulfilling Sweden's growing infrastructure demands, from roads to housing." #NT!
 SWE_husqvarna_civilian_industry: "Husqvarna Civilian Industry" #NT!
 SWE_husqvarna_civilian_industry_desc: "Husqvarna is one of the oldest companies in Sweden, tracing their roots back to firearm production in 1689. While they are known for their contribution in military industry, they have also made products for civilian use. Since the turn of the century, Husqvarna bicycles and motorcycles have come to be enjoyed by the Swedish people, with them in recent years tapping into lawn mowers." #NT!
 SWE_support_automobile_industry: "Support the Automobile Industry" #NT!
 SWE_support_automobile_industry_desc: "A growing automobile industry have taken hold in Sweden. Here, two companies have grown into prominence. AB Scania-Vabis was formed in 1911 in a union between a railcart producer and a bicycle producer. They have specialized in the production of trucks and are a reliable provider to the Swedish army.\n\nAB Volvo was formed by Svenska Kullagerfabriken to construct a car to implement their ball bearings. In 1927, their first car rolled off the production line. Quickly, Volvo have grown into almost an instant success, with safety always being one of their main goals. Both Scania and Volvo are testaments to Sweden's innovative spirit." #NT!
 SWE_complete_inlandsbanan: "Complete Inlandsbanan" #NT!
 SWE_complete_inlandsbanan_desc: "While the south of Sweden and the coastal areas have a well-built railway system, the interior are lacking behind. There is plans to complete 'Inlandsbanan', a railway streching from Vänern far up into the interior north. This will finally help to secure ourselves against this blindspot in our infrastructure and bring the railway to thousands of Swedes." #NT!
 SWE_expand_kiruna_mines: "Expand the Kiruna Mines" #NT!
 SWE_expand_kiruna_mines_desc: "The presence of iron in northern Lappland have been known for a very long time by the local Sámi inhabitants. At first, mining were consentrated at Malmberget, but the focus have eventually moved to Kiruna. Under the state-owned company Luossavaara-Kiirunavaara Aktiebolag (LKAB), Sweden have managed to extract a lot of iron. With the rising tensions around the world, we have been met with a rising demand for iron and steel. Therefore, we need to expand the mines at Kiruna." #NT!
 SWE_expand_bofors: "Expand Bofors" #NT!
 SWE_expand_bofors_desc: "AB Bofors is a company formerly connected to iron and steel production, but have gone into the manufacturing of weapons, especially cannons. In modern time, it have also tapped into the chemical industry, helped by one of its most known owners Alfred Nobel. Bofors have not only helped Sweden's military. It have also helped Germany to come around their post-Great War limitations on artillary development. With war on the horison, they will need to expand their production." #NT!
 SWE_invest_landsverk: "Invest in Landsverk" #NT!
 SWE_invest_landsverk_desc: "AB Landsverk was founded in 1872 and has grown during the last couple of decades into a company specializing in tracked and wheeled military veichles. While most of their production have been armoured cars and off-road cars, they have begun with making light tanks. Their most recent addition in the latter camp being the L-60. We need to invest into their company, making them able to make more armoured veichles and tanks." #NT!
 SWE_expand_rare_mineral_mines: "Expand Rare Mineral Mines" #NT!
 SWE_expand_rare_mineral_mines_desc: "While Sweden is mostly an extractor of iron, some do seek to find other minerals and materials that can be used. Previously, there have been some extractions of tungsten and other materials. Perhaps we will be able to find other stuff in the mines. There are especially hope to find more inside already existing mines." #NT!
 SWE_expand_kth: "Expand KTH" #NT!
 SWE_expand_kth_desc: "Kungliga Tekniska Högskulan was formed over a hundred years ago in 1827 and have been on the forefront in research and education on engineering and technology. Even so, it was only a few years ago that they finally was able to confer its own doctorates. We need to strengthen this institution, especially in this day and age. With the advent of nuclear technology, we have become more interested that the researchers at KTH make something with neutrons." #NT!
  
 # Foreign 
  
 SWE_our_place_in_world: "Our Place in the World" #NT!
 SWE_our_place_in_world_desc: "Sweden have long been neutral, but will it continue to be so. Will Sweden abandon its commitment to neutrality, or will it involve itself into the next Great War? Who knows?!" #NT!
