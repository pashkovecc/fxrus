 #### EVENTS #### 
 sweden.0.t: "The Status of Sweden" #NT!
 sweden.0.d: "From the ending days of the Napoleonic wars, Sweden has reserved itself from involvement in foreign conflicts. Even when Norway left the union between the two countries in 1905 and a war dipped Europe in blood, Sweden managed to remain neutral.\n\nEven with this neutrality, it was clear that Sweden was internationally leaning in favour of the Central Powers and Germany. While Sweden never joined the fighting, they had no problem in supplying Germany with Swedish steel and other materials. Likewise, the Entente had no problem to use this fact to extend the North Sea Blockade to include Sweden as well.\n\n1917 became one of the most troublesome years in recent Swedish history. With the blockade causing a crisis, with austerity and rationing being implemented, revolutions was soon in the air. As Russia fell to revolution, Sweden would soon see itself nearing one as well. The Swedish Revolution of 1917 failed as soon as it started. But the aftermath of it would grip the country through political polarization and resentment between the right and the left.\n\nThe end of the Great War would mean the end of the North Sea Blockade. Sweden came out of this era acquiring the Åland islands and a modest resentment against the Entente powers. Through the 1920s and early 1930s, Sweden would continue with a pro-German line on foreign and trade policy, with little trading with France or the United Kingdom. This economical dependency on Germany would smite Sweden as the Valkist takeover in Germany severed economical ties between the countries, leading to a new economic crisis.\n\nAs the situation worsened, King Gustaf V appointed general Carl Gustaf Hammarskjöld as prime minister in an attempt to stabilize the nation. While this was the intention, the result would be far different, with a rise of political tensions and a more defiant left-wing. The political tensions would manifest itself in the May Day incident of 1935, where the government reacted brutally against a May Day protest. While Sweden still is tored by crisis, many believes the Hammarskjöld government's days are numbered." #NT!
 sweden.0.a: "För Sverige - i tiden!" #NT!
 sweden.1.t: "6th of June" #NT!
 sweden.1.d: "While Sweden has no official national holiday, 6th of June is often viewed as an unofficial day of celebration. This day marks the day when Sweden, under the regin of Gustav Vasa, became independent from the Kalmar Union in 1523. The date also marks the day when a new Swedish constitution was passed in 1809, which granted more power to Ståndsriksdagen." #NT!
 sweden.1.a: "Maybe we need a National Holiday?" #NT!
 sweden.2.t: "6th of June" #NT!
 sweden.2.d: "While Sweden has no official national holiday, 6th of June is often seen as an unofficial day of celebration. This day marks the day when Sweden, under the regin of Gustav Vasa, became independent from the Kalmar Union in 1523. The date also marks the day when a new Swedish constitution was passed in 1809, which granted more power to Ståndsriksdagen." #NT!
 sweden.2.a: "Maybe we need a National Holiday?" #NT!
 sweden.3.t: "Kurt Haijby Claims to be the King's Lover." #NT!
 sweden.3.d: "A Stockholm native named Kurt Haijby has come out with some wild claims against his royal majesty, King Gustav V. Haijby claims to be the King's secret lover, and that this affair has been going on since the King, according to Haijby, seduced him in 1933. The rumors have already begun to spread with those closest to Haijby. We must act fast to avoid this developing into a scandal that could embarrass the royal house." #NT!
 sweden.3.a: "Let him speak" #NT!
 sweden.3.b: "Bribe him to shut up" #NT!
 sweden.3.c: "Find a way to silence him..." #NT!
 sweden.4.t: "The Opening of Stockholm Bromma Airport" #NT!
 sweden.4.d: "The need for Stockholm to get a proper airport have become more urgent in the recent years. First proposed in 1918 by Enoch Thulin, the idea of an airport close to the capital have become more and more prominent. In 1933, construction of the new airport began at the town of Riksby. After three years, the new airport are finally ready to be opened for public use.\n\nToday, Stockholm Bromma Airport have been officially opened by the King himself. The new airport contain four intersecting runways measuring lengths from over two thousand to under one thousand meters. Another details with Bromma that have gained attention even outside of Sweden, is that it is the first airport in Europe to feature paved runway from its opening. A detail that many Swedes are very proud of." #NT!
 sweden.4.a: "Titta vi flyger!" #NT!
 sweden.5.t: "Salaligan have Struck Again!" #NT!
 sweden.5.d: "The criminal gang known as Salaligan, or the Sala gang, have yet again terrorized the people of Västmanland. Since their inception, they have ruthlessly murdered four people and committed several burglaries. Today, Elon Pettersson succumbed to his wounds after being shot three times by the gang, making him their fifth victim. The police have started an investigation and have requested any tips that could lead them to the gang." #NT!
 sweden.5.a: "We will get them now" #NT!
 sweden.6.t: "Members of Salaligan Arrested" #NT!
 sweden.6.d: "After the police received a tip, it has lead them to arrest the members of the Sala gang. During the night, gang member Erik Hedström was arrested, with gang leader Sigvard Thurneman caught this morning. Already, the police have found the links between many committed crimes that have occured in Västmanland to the gang. With their capture, there will finally be some peace in Sala." #NT!
 sweden.6.a: "Excellent!" #NT!
  
 sweden.7.t: "The London Crash hits Sweden" #NT!
 sweden.7.d: "Some days ago, the stock market in London suddenly went into a tailspin. The news of this economic crash have been followed by its effects. As a trading partner exporting different minerals and materials to Britain, we have begun to feel the consequences of a fall in international trade. We just have to embrace ourelves and hope that Sweden will recover." #NT!
 sweden.7.a: "Oh no. No." #NT!
 sweden.8.t: "Per Engdahl Against the Establishment" #NT!
 sweden.8.d: "Per Engdahl, the far-right politican and leader of the New Swedish Movement have organized a rally at the steps of the Riksdag. Speaking to his followers and the national media that had showed up, Engdahl claimed that the Swedish political establishment are responsible in causing the economic crisis. Engdahl urged the on-lookers to vote for the New Swedish Movement, claiming they are the only movement that would place 'Sweden First'.\n\nDespite his attacks against the current government, it is expected that Engdahl will cooperate with prime minister Hammarskjöld after the election. It is yet to see how his anti-establishment rethoric will work out in a coalition with the establishment." #NT!
 sweden.8.a: "Populist Rambling" #NT!
 sweden.9.t: "Sven Linderot's Appeal to the Voters" #NT!
 sweden.9.d: "Seemingly provoced by Per Engdahl's rallies, the socialist far-left have begun to organize rallies in the industrial working class sectors of Stockholm. Communist leader Sven Linderot rallied local workers and spoke against both the forces of capitalism and the forces of reaction. Linderot claimed that Engdahl and the New Swedish Movement isn't an alternative to the establishment, pointing to an increasing cooperation between Engdahl and the government.\n\nLinderot's appeals to the working class haven't dempered conservative worries of a proletarian revolution. Instead, it has strengthened their willingness to work with the far-right and to enact more authoritarian measures to control the working class." #NT!
 sweden.9.a: "Marxist Scum" #NT!
  
 sweden.10.t: "The [GetYear] Swedish general election" #NT!
 sweden.10.d: "With the London Crash still fresh in people's mind, they have gone to vote. Many experts says that this might be Sweden's most important election in it's history, with individuals and groups both on the left and the right nearly fighting for power. Since the start of this year, the campaign have evolved into a two-horse raise between: \n\nA centre-left coalition led by the social democratic party, Sveriges Socialdemokratiska Parti. During their campaign, they have tried to reach out across the spectrum from the socialists to the liberals. Even from some conservatives that are alienated by prime minister Hammarskjöld's increasingly authoritarian leadership. \n\nThe second campaign is a coalition led by the conservative party, Allmänna Valmansförbundet, and prime minister Hammarskjöld. While seeking to hold on to liberal support, Hammarskjöld have reached out to the rising New Swedish Movement to stem the rise of socialism. However, many liberals do also look with worry upon the rising authoritarianism in Hammarskjöld's coalition.\n\nWith the votes counted, it is clear that..." #NT!
 sweden.10.a: "...the Social Democratic-led Coalition Has Won!" #NT!
  
 sweden.11.t: "Socialdemokraterna forms government" #NT!
 sweden.11.d: "The Social Democrats are now ready to from the next government. With the blessing of the king, this would hopefully usher in an era of peace and stability. An opportunity to finally turn the page on the disastrous Hammarskjöld cabinet and build a Sweden that works for all it's people." #NT!
 sweden.11.a: "A New Government is Ready!" #NT!
  
 sweden.12.t: "The Conservatives forms government" #NT!
 sweden.12.d: "The Conservatives are now ready to form the next government. With the blessing of the king, this would hopefully usher in an era of peace and stability. While few foresaw the survival of Hammarskjöld's cabinet possible after last year's events, he has proven to be more resiliant than what anyone though. The next challenge, however, will be to govern with the New Swedish Movement." #NT!
 sweden.12.a: "Hopefully, we can work with them..." #NT!
  
 sweden.13.t: "The New Swedish Movement Protest the Election Result" #NT!
 sweden.13.d: "The New Swedish Movement has taken to the streets to protest against the result. While the election seems to be fair, there are many Swedes on this end of the political spectrum that are not willing to accept this. Some worry that this could develop into an insurrection." #NT!
 sweden.13.a: "We Want no Insurrection!" #NT!
 sweden.14.t: "The Far-Left Political Parties Protest the Election Result" #NT!
 sweden.14.d: "The Communist Party and other far-left socialist movements has taken to the streets to protest against the result. While the election seems to be fair, there are many Swedes on this end of the political spectrum that object to that. Instead, they see a system that discriminates against the working class, with revolution as the only alternative." #NT!
 sweden.14.a: "We Want no Revolution!" #NT!
  
 sweden.15.t: "Far-Left Protests Escalates!" #NT!
 sweden.15.d: "The first May-day demonstration in Sweden was held in 1890. While it is not a recognized holiday, the socialist left have always sought to change that. A move they claim would show Sweden's commitment to social justice for the working class.\n\nWhile these demonstration has usually been peaceful and calm, this year's demonstration was an full on attack on the newly elected government. Communists. Socialists. Even Per-Albin Hansson and his so-called Social Democrats. All of them has used this day to fuel the working class in an rebellious fury against our government.\n\nThe police was sent out to many places to break up these demonstrations. However, this have resulted in many of them turning violent and causing more unrest." #NT!
 sweden.15.a: "Why Does we not Take them Down?!" #NT!
 sweden.16.t: "Swedish Revolutionaries Ask for Support" #NT!
 sweden.16.d: "The Swedish revolutionary Hugo Sillén have arrived in Leningrad with an request. He is sent by the leaders of the SKP in Sweden with the message of help in supplying them with equipment and volunteers to start a communist revolution in Sweden. \n\nWhile this can be a one in a time chance to let the marxist revolution be planted in Scandinavia, some of our leaders do not want to use valuable ressourses into it, if it is doomed to fail." #NT!
 sweden.16.a: "Let's Support This!" #NT!
 sweden.16.b: "No. Let's Not do it." #NT!
 sweden.17.t: "Far-Left Protests Deescalate!" #NT!
 sweden.17.d: "Good news have arrived regarding the May-Day protests. While there where some worried that this would lead to a socialist revolution, it looks like the fire of socialist revolution have burned out.\n\nThis have, however, showed us that our rule is uncertain, and that we should not stay idle facing the looming threat of socialist insurrection." #NT!
 sweden.17.a: "Was Afraid for a Socialist Coup There." #NT!
 sweden.18.t: "Stockholm Riots" #NT!
 sweden.18.d: "The capital city of Stockholm has bursted out in riots. Socialists, communists, social democrats even. All of them are now marching out, taking control. The interesting thing is that the rioters seems to be equipped with foreign weapons, making the riots look more like a Soviet operation. We need to show that Sweden do not want to be a Soviet puppet, but how should we operate facing these terrorists?!" #NT!
 sweden.18.a: "We Might Need to Retreat" #NT!
 sweden.18.b: "Do Not Give Them A Inch!" #NT!
 sweden.19.t: "Stockholm City Falls in Socialist Hands" #NT!
 sweden.19.d: "Stockholm has fallen. Today, the King and the government had to flee the capital from the working class insurrection. The Riksdag have been overrun, glas have been broken and a few buildings are set aflame. While the government continues the fight from Göteborg, there are rumours that the workers of the city will follow Stockholm into revolution." #NT!
 sweden.19.a: "We Will Fight On!" #NT!
 sweden.20.t: "The King Leaves for Denmark" #NT!
 sweden.20.d: "With our battles against the Socialists going against us, we are not in the perfect situation to lose any morale. Even then, in the middle of this demoralizing civil conflict, King Gustaf V have taken the choice to hop onto a ship and sail for Denmark. With this, our fight against the Red terror might be a losing one. At least, the world shall know that King Gustaf was truly a coward king." #NT!
 sweden.44.d: "With our battles against the New Swedish Movement going against us, we are not in the perfect situation to lose any morale. Even then, in the middle of this demoralizing civil conflict, King Gustaf V have taken the choice to hop onto a ship and sail for Denmark. With this, our fight against the New Sweden might be a losing one. At least, the world shall know that King Gustaf was truly a coward king." #NT!
 sweden.20.a: "What a Fool!" #NT!
 sweden.21.t: "Socialist Militias Seizes Göteborg" #NT!
 sweden.21.d: "Since the fall of Stockholm, socialist militias have marched on Göteborg and surrounded the city. With the workers inside the city rising up, we have completely lost control. The last remnants of our government are now boarding a cruiser and heading to London. Göteborg has fallen. With some time, we fear the rest of Sweden will as well." #NT!
 sweden.21.a: "We Have to Surrender!" #NT!
  
 sweden.22.t: "Former Prime Minister Arvid Lindman Dies in Accident" #NT!
 sweden.22.d: "The former prime minister, Arvid Lindman, was recently visiting the United Kingdom. On his way back home, the plane he was in crashed near the air port, killing many of the passengers, including Lindman himself. On the day, it seemed that the air port was shrouded in fog, and all aircraft were operating under so-called "QBI" conditions. His body is transporting home right now. \n\nLindman was truly a great man. One that has lead the conservatives both in the Riksdag and the parliament. An effective peace-broker and a conservative who did not lose his principles." #NT!
 sweden.22.a: "Rest In Peace, Mr. Lindman." #NT!
  
 sweden.23.t: "Swedish Communists Fight and Dies in Spain" #NT!
 sweden.23.d: "Reports of Swedish citizens fighting and dying in Spain has arrived the table of the Swedish government. Many of them are Swedish communists fighting on the side of Spanish revolutionaries. Some government members find it fitting that these revolutionaries bleed in Spain. Hopefully, it will be their grave. We don't need for them to come back and cause unrest at home." #NT!
 sweden.23.a: "Troublemakers" #NT!
  
 sweden.24.t: "Salaligan is Sentenced to Forced Labour Service" #NT!
 sweden.24.d: "Last year, the gang known as Salaligan had many of their key members arrested. With all their crimes revealed, it is finally time for justice to be delivered. Today, the judge sentenced the members of Salaligan to forced labour service after a trial that have been highly covered by the press. The lone exception is the gang leader himself. Sigvard Thurneman is considered mentally sick and is receiving psychiatric care. Instead of forced labour, he will be locked up seemingly until he drops dead." #NT!
 sweden.24.a: "Justice At Last" #NT!
  
 sweden.25.t: "Riksdagen on Maternity Leave" #NT!
 sweden.25.d: "A proposal from the population commission has reached the Riksdag. Their proposal, in order to help families that are struck by the economic crash and to smooth out the economic conditions between childless and child-raising families, is to introduce matenity leave, maternity help and open child welfare centers. The Social Democrats have announced their support for these measures, but can't get enought support from the left for the Riksdag to pass it. They are hoping to gain support from the right. That some of these conservatives would support the betterment of Swedish mothers and their children." #NT!
 sweden.25.a: "Members From the New Swedish Movement Votes For!" #NT!
 sweden.25.b: "The Proposal is Killed!" #NT!
  
 sweden.26.t: "A Huge Silver Treasure is Found in Stockholm" #NT!
 sweden.26.d: "It begun as a normal day in a local store in The Old Town of Stockholm. During some digging done by two workers in connection to renovation work, a treasure from the 1700s was unearthed. It wasn't a few scraps either. From the site they found a lot of plates, candlesticks and cups in pure silver, along with 18 000 silver coins. With this discovery, it has caused a debate over what the future of what will be the future of this treasure. Many seek to have it shown at a museum due to its historic importance. Others do, however, propose selling some of the coins and use the money to support a Swedish population still stuggling from economic and political woes." #NT!
 sweden.26.a: "Maybe We can use it for the Betterment of Sweden?" #NT!
 sweden.26.b: "The Treasure must be Shown to the Public" #NT!
  
 sweden.27.t: "Future of the Hammarskjöld Cabinet" #NT!
 sweden.27.d: "The last year have not been one pleasant for the government of Carl Gustaf Hammarskjöld. His policies in face of the economic crisis that arose after the Valkist takeover in Germany, among with his cruel reaction on the May Day protests, have utterly destroyed his reputation. Despite the opposition against him, many on the political right-wing would not risk the instability that would come by removing him from power. The King agrees and has denied any demands from the Social Democrats to pick a new prime minister.\n\nHowever, with the growth of the Social Democrats and the New Swedish Movement, the old plan - relying on timid support from the centre-right - will come up short. For the Liberals and the Agrarians, a partnership with the Social Democrats isn't as ridiculous as it seems. They share many similar socially progressive positions, while worried about the authoritarian leanings of Hammarskjöld and the New Swedish Movement. And while the New Swedish Movement have often rallied against the excesses and failures of the Hammarskjöld cabinet, they are in agreement with the Conservatives over the threat of socialism." #NT!
 sweden.27.a: "We Need to Save the Fatherland From Bolshevism!" #NT!
 sweden.27.b: "We Need to Save the Fatherland From Dictatorship!" #NT!
  
 sweden.28.t: "Victory Against the Movement" #NT!
 sweden.28.d: "The attempt from the New Swedish Movement and their militant followers to undermind Swedish democracy have failed. With our victory over both the regressive Conservatives, who sought to purchase stability with democracy, and the reactionary New Swedish Movement, who despises the values of a democratic Sweden, democracy will never be challenged again." #NT!
 sweden.28.a: "Long Live Democracy, Death to Traitors!" #NT!
  
 sweden.29.t: "The Final Verse of Despotism" #NT!
 sweden.29.d: "With both the Conservatives of Carl Gustaf Hammarskjöld and the New Swedish Movement of Per Engdahl without any power to harm the government, we see democratic rule has succeeded. With the economic recovery well under way and with support across the political spectrum, we will be able to turn to our political reforms. Much need to be done to heal the division that Hammarskjöld and previous conservative governments planted and to finally bring just government to the Swedish working class.\n\nLuckily for us, a growing faction of new Conservative politicians are growing up, seeking to preserve democracy. With their increasing success in taking over the Conservatives, the party will no longer be a threat to the democratic will of working class Swedes." #NT!
 sweden.29.a: "We Will Make Sweden Lagom" #NT!
  
 sweden.30.t: "Hammarskjöld's Successors" #NT!
 sweden.30.d: "While the Conservatives under the leadership of people like Gösta Bagge and Fritiof Domö are set to transform the party into a true democratic party, there is still forces that seeks to uphold the authoritarianism inheirit in Carl Gustaf Hammarskjöld's government. The National Youth League of Sweden under the leadership of Elmo Lindholm represents a radical voice in this party. Lindholm and his followers opposes the work we have done to dismember the power of Hammarskjöld Conservatives and the New Swedish Movement.\n\nWith the recent arrest of Per Engdahl and other far-right figures for insurrection conspiracies, Lindholm quickly emerges as a new figure for the Swedish far-right. While he share many of the views from the New Swedish Movement, he seek to present himself as more moderate and a successor to the legacy of Hammarskjöld." #NT!
 sweden.30.a: "Best to Watch Out.." #NT!
 sweden.31.t: "The Founding of the National League" #NT!
 sweden.31.d: "Elmo Lindholm, the leader of the National Youth League of Sweden, has today proclaimed that the youth organization will break all ties to the conservatives and to Allmänna Valmansförbundet. This due to the Conservatives' move away from the authoritarian legacy of Carl Gustaf Hammarskjöld. Instead the outbreakers seeks to create a new right-wing party, Sveriges Nationella Förbund. The new party seek to create a corporatist, anti-democratic and traditionalist Swedish state. It has clear influences by Maurrasian ideas in regards to its monarchist and integralist sentiments, while also taking some pages from the New Swedish movement and the Valkists in Germany." #NT!
 sweden.31.a: "Despots Have Always Admirers" #NT!
  
 sweden.32.t: "The [GetYear] Swedish general election" #NT!
 sweden.32.a: "...the Deadlock Remains!" #NT!
  
 sweden.33.t: "The [GetYear] Swedish general election" #NT!
 sweden.33.d: "With the London Crash still fresh in people's mind, they have gone to vote. Many experts says that this might be Sweden's most important election in it's history, with individuals and groups both on the left and the right nearly fighting for power. Since the start of this year, the campaign have evolved into a two-horse raise between: \n\nA centre-left coalition led by the social democratic party, Sveriges Socialdemokratiska Parti. During their campaign, they have tried to reach out across the spectrum from the socialists to the liberals. Even from some conservatives that are alienated by prime minister Hammarskjöld's increasingly authoritarian leadership. \n\nThe second campaign is a coalition led by the conservative party, Allmänna Valmansförbundet, and prime minister Hammarskjöld. While seeking to hold on to liberal support, Hammarskjöld have reached out to the rising New Swedish Movement to stem the rise of socialism. However, many liberals do also look with worry upon the rising authoritarianism in Hammarskjöld's coalition.\n\nWith the votes counted, it is clear that..." #NT!
 sweden.33.a: "...the Conservative-led Coalition Have Won!" #NT!
  
 sweden.34.t: "Prime Minister Per Engdahl" #NT!
 sweden.34.d: "Today, Per Engdahl, the leader of the New Swedish movement, has been appointed head of a new government. The day is historic, as Engdahl is the youngest prime minister ever in Swedish history. Similarly, is it the first time someone outside the political establishment have achieved this position. Through shaking hands with smaller parties on the far-right, as well as with radical conservatives, the new government have gathered enough support." #NT!
 sweden.34.a: "For A New Sweden!" #NT!
  
 sweden.35.t: "Unrest Against the Halted Elections" #NT!
 sweden.35.d: "With the elections being halted, many Swedes have come out into protest against this decision. For many, this is the foreseeable end of the Hammarskjöld government; a more authoritarian and tyrannical regime in Sweden. Nevertheless, Carl Gustaf Hammarskjöld have managed to secure support to halt the election and granting him emergency power. It will be time if this last chance for this government might work." #NT!
 sweden.35.a: "It Was the Only Option" #NT!
  
 sweden.36.t: "Trade Deals With the Brits" #NT!
 sweden.36.d: "Sweden has for long been a country economically dependant on German trade. What this gave us, however, was a crisis when these ties were broken. However. Over the last couple of years have the trade routes between Sweden and the United Kingdom grown stronger. With new business from both the British and the French, the hope for a renewed foreign policy have been lit. One more focused on the Anglo-French world." #NT!
 sweden.36.a: "Pleasure Doing Business" #NT!
  
 sweden.37.t: "The Death of the Prime Minister" #NT!
 sweden.37.d: "Terrible news have recently come out from the prime minister's office. Prime Minister Carl Gustaf Hammarskjöld is dead. While there where signs that the aging general would not be with us forever, the fact that he died in the middle of his prime ministership will destabilize the country further. The result is already felt, with a sudden power vacuum now in place. In the meantime, Axel Rappe, the Chief of the Defense Staff, have been tasked with governing Sweden." #NT!
 sweden.37.a: "This Should Not Have Happened!" #NT!
 sweden.38.t: "State of Emergency" #NT!
 sweden.38.d: "The new prime minister, Axel Rappe, have declared a state of emergency in Sweden, following the death of the former prime minister. With the state becoming more and more antagonstic towards opposition figures, many sees this as a death to Swedish democracy. With the army taking more and more power, there are some rumors of planned insurrections against the state. For now, it is not easy to know what will happen." #NT!
 sweden.38.a: "Please Do Not Resist!" #NT!
 sweden.39.t: "Red Guards Are Organizing" #NT!
 sweden.39.d: "The sudden death of the head of government have been a shaken experience for the nation. With the military taking a bigger role, there have been a rise in opposition. Right now, reports of the formation of Red Guards across the country, is pouring in. At the same time, many considers the seizure of power by the Army as a coup, willing to oppose it." #NT!
 sweden.39.a: "It's Treason Then!" #NT!
 sweden.40.t: "New Sweden Reemerges" #NT!
 sweden.40.d: "Supporters of the New Swedish movement have began to organize into several White Guard units in opposition to both the new government and to the emerging Red Guard units. Many conservatives, nationalists and other right-wingers have already defected to the movement. With rising tensions, it is difficult to see ourselves coming out of this still in power." #NT!
 sweden.40.a: "Treason, I Say!" #NT!
  
 sweden.41.t: "The Battle For Sweden" #NT!
 sweden.41.d: "The power and influence of the government have fallen. With the rise of opposing socialist Red Guards and nationalist White Guards, the country have fallen to anarchy. In this moment, battles are being waged on the streets of Stockholm, Göteborg and other cities. The price being control over Sweden. As the dust begins to settle, it is likely that one faction will seize power. That being..." #NT!
 sweden.41.a: "...the New Swedish Movement" #NT!
 sweden.41.b: "...the Socialists" #NT!
  
 sweden.42.t: "The End of the Riots" #NT!
 sweden.42.d: "The strategy to not retreat from the Socialist riots, while being controversial, have also been a success. While both we and the rioters have taken massive casualties, painting the gates of Stockholm red, the opposition to our rule is now defeated." #NT!
 sweden.42.a: "Finally This Bloodbath is Over" #NT!
  
 sweden.43.t: "Stockholm Seized by the New Sweden" #NT!
 sweden.43.d: "The New Swedish Movement have suddenly taken control of the city of Stockholm. While we was not able to repell their seizure, we hope to continue the fighting and, hopefully, winning in the rest of the country. There are rumors that they were able to pull this of because of foreign supporters and loyalties in local police and military forces." #NT!
 sweden.43.a: "So Our Own Men Are Deserting as Well?" #NT!
 sweden.45.t: "New Swedish Movement Secures Göteborg" #NT!
 sweden.45.d: "The city of Göteborg has fallen, symbolizing the end of the old government's opposition to the New Swedish Movement. With the movement now in control in a one-party state, it is time to carve a new state out of the old one. Today, the traitorous old guard have been pushed aside. Now, a New Generation of Swedes takes the lead." #NT!
 sweden.45.a: "Long Live the New Sweden!" #NT!
  
 sweden.46.t: "New Swedish Protests" #NT!
 sweden.46.d: "With the government seemingly passing more conservative-friendly reforms and rejecting many proposals from the New Swedish movement, protests have begun to be waged against the government. These protests have been met by the New Swedish movement with understanding, with many nationalists joining in against the government, even from New Swedish members of government. It is to see if this will mean the end of the coalition between the conservatives and the nationalists." #NT!
 sweden.46.a: "But, How Can We Allow Their Policies?" #NT!
 sweden.47.t: "Conservative Protests" #NT!
 sweden.47.d: "With the government seemingly passing more nationalist-friendly reforms and rejecting many conservative advice, many conservatives have begun to act against the government. Already, it looks like the conservatives might try to take back control of government, ousting the New Swedish movement. It is to see if this will mean the end of the coalition between the conservatives and the nationalists." #NT!
 sweden.47.a: "You Are Supposed to Support Us" #NT!
  
 sweden.48.t: "Sweden Wants to Join our Entente" #NT!
 sweden.48.d: "A messenger from Sweden have today arrived Paris with an interesting request. With the world seemingly heading towards a new Great War, Sweden have taken the choice to leave their neutrality. They have requested us their entrance into the Continental Entente. This can give us an ally against the rising German Reich and better control over Swedish steel, but some worries that the Swedes are more of a burden than a help." #NT!
 sweden.48.a: "We Welcomes Them!" #NT!
 sweden.48.b: "No, Thanks!" #NT!
 sweden.49.t: "France Welcomes Us!" #NT!
 sweden.49.d: "Our messenger have come back with good news. The French have accepted our request to join the Continental Entente. With this alliance secured, we hope that our road ahead is much more safer, with many more ambitions available." #NT!
 sweden.49.a: "This is the Start of a Great Friendship!" #NT!
 sweden.50.t: "France Reject Us!" #NT!
 sweden.50.d: "Our messenger have come back, sadly, with bad news. The French did not accept our request to join the Continental Entente, leaving us outside their alliance. While this is a bummer, it can also be the turn towards other foreign options." #NT!
 sweden.50.a: "We Shall Show Them!" #NT!
  
 sweden.51.t: "The Monarchy Question" #NT!
 sweden.51.d: "The Monarchy has been an institution in place in Sweden since the Viking Age. While it has been useful in giving stability and maintaining our national identity, many Social Democrats believes that the monarchy is an outdated system, one that holds up autocratic structures. This decision is one that could anger either the socialists or the centrists, with these standing against and for the monarchy respectively." #NT!
 sweden.51.a: "Constitutional Monarchy - Like in Italy or the United Kingdom" #NT!
 sweden.51.b: "Republic - Like in France or the United States" #NT!
 sweden.52.t: "Liberals and Conservatives Oppose Republicanism" #NT!
 sweden.52.d: "The news that the government are seeking to go forward with Republicanism have been met poorly by the opposition. The Conservatives have, as expected, come out as the loudest voice in favor of the monarchy. However, both liberal and agrarian politicians are critical towards our goal. This decision seems to be one that will alienate us to further collaboration with the non-socialist parties. On the other hand, socialist and communist leaders have officially supported our stance." #NT!
 sweden.52.a: "Let's Have a Referendum!" #NT!
 sweden.53.t: "Referendum: For or Against the Monarchy" #NT!
 sweden.53.d: "Today, we will finally hear what the people want. Do they really want the constitutional monarchy of today, or are they more interested in the liberal ideas of a republic. The votes are already coming in. It's close, but..." #NT!
 sweden.53.a: "...the Majority Want a Republic!" #NT!
 sweden.53.b: "...the Majority Want a Monarchy!" #NT!
 sweden.54.t: "Socialists Oppose Our Stance" #NT!
 sweden.54.d: "The news that the government are seeking to uphold the institution of the Monarchy have been met poorly by the socialist left. The Communists have claimed, with this decision, that the Social Democrats have officially abandoned the people in favor of the King and the upper class. Our cooperation with the socialist parties in the Riksdag have been hampered as a result of this decision. On the other hand, those to the right of us support our decision to keep the King." #NT!
 sweden.54.a: "It Would Cause Too Much Instability" #NT!
 sweden.55.t: "The First Swedish President" #NT!
 sweden.55.d: "A majority of the Swedish electorate have rejected the old institution of the monarchy. With this result, Riksdagen have been granted the responsibility to elect a President of the Swedish Republic. There are a few options for the position.\n\nThe Social Democrats have proposed prime minister Per Albin Hansson, with the prime minister himself willing to retire to become president. This would be a natural option for a governing party who also have a strong position in the Riksdag. Even members of the socialist parties are supportive, viewing Hansson as a better candidate than any candidate put forth by the bourgeoisie parties. However, the centrist parties are worried. They see it as a continuation of a system where the head of state is linked to one of the political parties. King Gustaf V with the Conservatives, and Hansson with the Social Democrats.\n\nThere are some among our Agrarian and Liberal allies who suggests conservative leader Gösta Bagge. This to show goodwill towards the opposition and to avoid too much power consentrated into one party. Even so, it could also be viewed as a way for the government to neutralize an opposition figure. By electing him as President, he would likely have to step back as party leader.\n\nLastly, some across the spectrum has proposed King Gustaf's nephew; Folke Bernadotte. This has been met with huge protests from the socialist parties in Riksdagen, who views it as a way to continue the monarchy. However, the proposal stresses Bernadotte's continued impartiality and his role in the Boy Scout movement. Bernadotte have even shown interest in working for the Swedish Red Cross. His philanthropic interests could be given extra attention with him as president." #NT!
 sweden.55.a: "Hansson is the Natural Option" #NT!
 sweden.55.b: "Bagge, to Appeace the Opposition" #NT!
 sweden.55.c: "Bernadotte Shows Great Potential" #NT!
  
 sweden.57.t: "Hammarskjöld Denounce Foreign Influences" #NT!
 sweden.57.d: "Prime minister Carl Gustaf Hammarskjöld have today presented a denouncement of foreign influence, calling out Soviet and Valkist influences for the destabilizing effects on Swedish politics, while blaming British influences in Sweden for causing the economic crisis to arrive in our country. While these denouncments and blamings are in many ways without cause, it paints opposition to the government as a treasonous act." #NT!
 sweden.57.a: "We Will Tear Them Down!" #NT!
  
 sweden.58.t: "Steps Towards Martial Law" #NT!
 sweden.58.d: "With the military loyal to the Hammarskjöld government and our coalition partner weakened, it is finally time to seize control over Sweden. Blaming on the on-going crises that the country find itself in, the prime minister seek to declare Martial Law. With some elbow grease, he and his supporters will be able to get the Riksdag to vote for this seizure of power." #NT!
 sweden.58.a: "For a Safe and Secure Sweden!" #NT!
 sweden.59.t: "Martial Law Invoked" #NT!
 sweden.59.d: "With all the machinations of the Swedish state under the control of prime minister Carl Gustaf Hammarskjöld and his clique of conservative politicians and military officers, only one structure stood between them and the ability to heal the Swedish nation from all it's crises - democracy. It had to be set aside for the country to properly heal.\n\nWhile the Social Democrats still oppose these measures, most of the other parties in the Riksdag achknowledge that the situation would either end with this controversial move, or with revolution. Fearing what the Communists and Socialists, these Soviet bootlickers, would try to do if the country continues into dispair, Hammarskjöld managed to gather the support of the Liberals, the Conservatives, the Agrarians and the Nationalists in the Riksdag to support Martial Law.\n\nWith the blessing of the King, Sweden is now one step closer to stability. Under Hammarskjöld and his followers, Sweden will grow to unimaginable glories." #NT!
 sweden.59.a: "So This is How Liberty Dies..." #NT!
  
 sweden.60.t: "The Resignation of the Prime Minister" #NT!
 sweden.60.d: "With Sweden recovering from both political, as well as economical, crises, it is time for prime minister Carl Gustaf Hammarskjöld to step down. With his age already beginning to take a hit on him, it will also be good for the old general to retire while he can. The last decision the prime minister can do now, is recommending to the King who he should choose as the next prime minister. Most likely will it be either Gösta Bagge or Elmo Lindholm.\n\nBagge is currently the leader of the Second Chamber in the Riksdag and was a big help in steering parliamentary support for Hammarskjöld's Martial Law declaration. Despite this, he is more moderate and willing to restore democratic rule. Lindholm has lead the conservative youth league since 1932, and due to his youth and nationalist leanings managed to help in forming a coalition with the New Swedish Movement. He has no interest in restoring democracy, favouring instead a monarchy built on Maurrasian though." #NT!
 sweden.60.a: "A Moderate Conservative, Like Prof. Bagge" #NT!
 sweden.60.b: "A Nationalist Conservative, Like Mr. Lindholm" #NT!
  
 sweden.61.t: "Reorganization of the Right" #NT!
 sweden.61.d: "In continuing to distance themselves from previous right-wing authoritarian governments, the conservative Allmänna Valmansförbundet have announced their intention to rebrand into Högerns Riksorganisation, the National Organization of the Right. This seems also to be a way for the party to better reflect their right-wing conservative views into their name considering that their previous name were less clear on this. Since the youth league went to form their own party, a new youth party for the party has been formed; Ungsvenskarna, the Young Swedes. With these changes, it does look like the conservative right have turned away from authoritarianism." #NT!
 sweden.61.a: "The Start of a New Era!" #NT!
  
 sweden.62.t: "Freedom and Prosperity" #NT!
 sweden.62.d: "Sweden should shape itself into a much more freer society. While upholding traditional values, it is important that tradition does not trump the rights and dignity of every Swedish citizen. Therefore, it is important for the Swedish people to reject authoritarianism, both socialism and nationalism, that seeks to consolidate power at the hands of a political class." #NT!
 sweden.62.a: "You Don't Deserve Freedom if You Trade it for Security" #NT!
 sweden.63.t: "The Democratic Consensus" #NT!
 sweden.63.d: "For the country to properly heal, it is important that we are willing to meet with the opposition. While these meetings have shown what we disagree on, we have also been able to show each other that we are all in consensus over a set of key positions. Among these, are the principles of democracy, freedom and constitutionalism. The Social Democrats are also giving signs that they will respect constitutional monarchy if we promise to not give the King any additional power." #NT!
 sweden.63.a: "Some Consensus is Important" #NT!
 sweden.64.t: "Worker Meet Boss" #NT!
 sweden.64.d: "The history of class relations have been one of conflict. Both in Sweden and abroad, the forces of labour and the forces of capital have often fought out their differences. Despite this history, there are some who seek peaceful means to advance the interests of either the working or the capitalist class. It is here were 'Hovudavtalet' comes in. The idea of 'Huvudavtalet', is that it is an agreement between the unions of the employee and the unions of the employer to set the rules on the working space. While many socialists are worried that this is an attempt to secure capitalist exploitation, we assure them that these agreements will be favorable to both sides. Beside, if the labor unions are angry of the agreement, they can issue the threat of a strike." #NT!
 sweden.64.a: "For a Better Workplace" #NT!
  
 sweden.65.t: "Authority of the King" #NT!
 sweden.65.d: "Many Republicans, Socialists and even Liberals see the monarchy as an archaic system. But while Republics elect Presidents set to oppress the minority on the behalf of the majority, the King is elected by God to rule for all the people of Sweden. Through the King, the Swedish state are granted it's God-given mandate over this land and its people.\n\nIt is important for us to secure the constitutional rights that King Gustaf V have, as king of Sweden. The king are the most important player in defending the dignity and freedom of our nation, and are God's representative to the Swedish nation. We can not allow his God-given authority to be challenged." #NT!
 sweden.65.a: "Long Live the King!" #NT!
  
 sweden.66.t: "Formation of the National League" #NT!
 sweden.66.d: "The government of Carl Gustaf Hammarskjöld have managed to balance its authoritarianism with the legitimacy granted by the democratic system. However, under Elmo Lindholm we achknowledge the folly of democracy and parliamentarian rule as mere tools by socialists and liberals to undermine the Swedish nation.\n\nWith the government's control over the nation assured, Lindholm have begun to use this opportunity to further entrench his regime. Today, Lindholm declared Sweden a post-party state, making all political parties illegal entities. Forming and operating political parties are now illegal, being seen as attempts to undermine and divide the nation. Instead, a National League has been formed by Lindholm and his allies as an anti-party entity that will be the head of the Swedish political body." #NT!
 sweden.66.a: "Onwards!" #NT!
  
 sweden.67.t: "Rise of the Movement" #NT!
 sweden.67.d: "When prime minister Hammarskjöld first approached the New Swedish Movement to form a coalition against the forces of socialism and revolution, the movement had only limited power over Swedish society. Now, the tables have turned. With the loyalty of the far-right militias garanteed and a growing workers movement under our control, the pieces are finally set to overthrow this failing bourgeoisie system and create a New Swedish state." #NT!
 sweden.67.a: "Hammarskjöld is on His Way Out" #NT!
  
 sweden.68.t: "Fate of the Monarchy" #NT!
 sweden.68.d: "While the monarchy is an old and true institution in Swedish society, there are some voices inside our movement that want to replace the King with a powerful leader, akin to the German Führer. This would, however, be a very controversial move, and signs are showing that many inside the movement are still strong monarchists. It is to see what we do." #NT!
 sweden.68.a: "The King and Fatherland is One!" #NT!
 sweden.68.b: "We Only Need the Ledare!" #NT!
  
 sweden.69.t: "The Unshackling of Proletarian Democracy" #NT!
 sweden.69.d: "Since it's introduction, democracy have been used as a tool for the ruling class to temper the forces of the working class. However, there are often few available options that can better raise the voice of the working class. Looking to bridge the Communists and Social Democrats, a proletarian type of democracy has been established.\n\nA part of this democracy is to remove the influences of capital from the election process. As a result, we have uprooted the establishment non-socialist parties and demanded an adherence to the welfare of the working class. With this enforcement now underway, we see new parties pop up in the space formerly filled by capitalist parties." #NT!
 sweden.69.a: "We Have to See How This Goes..." #NT!
  
 sweden.70.t: "Return to Faith" #NT!
 sweden.70.d: "The unrelenting march of modernity have left the state of Swedish Protestantism in a sorry state. For many years, Sweden was in the forefront to protect Lutheran Protestantism in the crusades against the heretical Catholic and Orthodox christians. However, with the rise of modernity, faith has fallen behind. Even so, the need for a protector of the Protestant faith is more urgent than ever. The rise of the Bolsheviks in Russia have kicked out the Orthodox christians for a worse and more anti-Christian regime, and while we can tolerate the Valkists, we achknowledge their creed as one different from ours.\n\nThe Swedish government have begun a zealous campaign to see the return of Protestant values and the Protestant faith to Sweden. It is a necessary part to build a strong Swedish national identity and to recharge the Swedish people of that old fervor. A fervor that sought to eliminate the heathens and ensure God's will on earth. From the first day at school to his charge on the battlefield as a soldier of Christ, the Swede will chant their prayer.\n\n'Fader Vår, som är i himmelen...'" #NT!
 sweden.70.a: "'Helgat varde ditt namn'" #NT!
  
 sweden.81.t: "The Passing of New Voting Laws" #NT!
 sweden.81.d: "New voting laws have been put in place, pushing the minimum age of voting down to 21. Along with strengthening the voting rights for women and eliminating arbitary hinders for people to vote, we can move into a better and more democratic society." #NT!
 sweden.81.a: "Every Vote Matters!" #NT!
  
 sweden.86.t: "Sweden Wants to Join our Pakt" #NT!
 sweden.86.d: "A messenger from Sweden have today arrived Berlin with an interesting request. With the world seemingly heading towards a new Great War, Sweden have taken the choice to leave their neutrality. They have requested us their entrance into the Stahlpakt. This can give us an ally against the Soviet Union and better control over Swedish steel, but some worries that the Swedes are more of a burden than a help." #NT!
 sweden.86.a: "We Welcomes Them!" #NT!
 sweden.86.b: "No, Thanks!" #NT!
 sweden.87.t: "Germany Welcomes Us!" #NT!
 sweden.87.d: "Our messenger have come back with good news. The Germans have accepted our request to join the Stahlpakt. With this alliance secured, we hope that our road ahead is much more safer, with many more ambitions available." #NT!
 sweden.87.a: "This is the Start of a Great Friendship!" #NT!
 sweden.88.t: "Germany Reject Us!" #NT!
 sweden.88.d: "Our messenger have come back, sadly, with bad news. The Germans did not accept our request to join the Stahlpakt, leaving us outside their alliance. While this is a bummer, it can also be the turn towards other foreign options." #NT!
 sweden.88.a: "We Shall Show Them!" #NT!
 sweden.89.t: "Sweden Wants to Join our Alliance" #NT!
 sweden.89.d: "A messenger from Sweden have today arrived London with an interesting request. With the world seemingly heading towards a new Great War, Sweden have taken the choice to leave their neutrality. They have requested us their entrance into the Imperial Protection Alliance. This can give us an ally against the rising German Reich and better control over Swedish steel, but some worries that the Swedes are more of a burden than a help." #NT!
 sweden.89.a: "We Welcomes Them!" #NT!
 sweden.89.b: "No, Thanks!" #NT!
