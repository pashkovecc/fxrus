 #SWE_1936_election: "The 1936 Election" #NT!
 #SWE_1936_election_desc: "With the economic crisis still fresh in people's mind, they have gone to vote for who shall sit in our parliament, and out from there, form a new government. Sweden wonders if this will mark the birth of Folkhemmet, the birth of a New Sweden, or a comeback of the conservatives." #NT!
  
 #SWE_socialistiska_blocket_victory: "Socialistiska Blocket Victory" #NT!
 #SWE_socialistiska_blocket_victory_desc: "The people want change and they have now voted for it. No longer shall the injustice of the hunger revolution be again acted by the conservatives, in this crisis. Sweden shall no longer just be a country that the rich and powerful can play with. It shall be in the hands of everyone. It is our Home!" #NT!
  
 #SWE_establish_folkhemmet: "Establish Folkhemmet" #NT!
 #SWE_establish_folkhemmet_desc: "Sweden should be formed like a home for our people. In this struggling time, we need to support each other like the father supporting his son, or an older brother supporting his younger siblings. In this home, justice shall be served equally and the people, from all social classes, from the rich to the poor, shall be able to rule." #NT!
  
 #SWE_recover_our_home: "Recover our Home" #NT!
 #SWE_recover_our_home_desc: "Sweden right now is like a house, a home that has been struck by unluck. But with the help of all living in the home, it will recover, and become stronger." #NT!
  
 #SWE_balanced_democracy: "Balanced Diplomacy" #NT!
 #SWE_balanced_democracy_desc: "Sweden lay itself in between two giants, the Germans in the south and the Soviets in the east. We need to balance our approach towards these powers to not endanger our independence." #NT!
  
 #SWE_borgerliga_blocket_victory: "Borgerliga Blocket Victory" #NT!
 #SWE_borgerliga_blocket_victory_desc: "While many believed that the conservatives were unlikely to hold on to power after the market crash, we did. But we need to act fast if we shall not get the opinion of the people against us. This might be the last chance to save Swedish conservatism." #NT!
  
 #SWE_swedish_democracy: "The Swedish Democracy" #NT!
 #SWE_swedish_democracy_desc: "Sweden, our Sweden. It has survived the waves of revolutions and radicalization. Out from the troubled times of the 1920s and 1930s shall a new Sweden rise. From the economic struggles to a time of economic growth and greatness. A new Sweden, one that gives democracy and peace!" #NT!
  
 #SWE_far_right_coalition: "The Far Right Coalition" #NT!
 #SWE_far_right_coalition_desc: "The social democrats were not able to get the support to form their government, and the conservatives are now supporting our coalition. We have won, and its time to change Sweden for the better and making our country great again!" #NT!
 #SWE_ban_communist_party: "Ban Sveriges Kommunistiska Parti" #NT!
 #SWE_ban_communist_party_desc: "Sveriges Kommunistiska Parti is a party of revolutionaries. They want to destroy Sweden and lay the country under a totalitarian rule with power centralized in Moscow. They are traitors and shall be dealt with like traitors. Communism is Treason! And Treason is punishable by Death!" #NT!
  
 #SWE_attract_rightwing_valkists: "Attract Right-wing Valkists" #NT!
 #SWE_attract_rightwing_valkists_desc: "Lindholmarna are very similar to us, but they are more against the monarchy and are generally more left-leaning with their socialist policies. But there are some of these valkists that can be easily attracted to us. We must just show us as a better alternative than the valkists." #NT!
  
 ## Right-Wing Tree ## 
  
 SWE_hammarskjold_engdahl_coalition: "Hammarskjöld-Engdahl Coalition" #NT!
 SWE_hammarskjold_engdahl_coalition_desc: "The coalition between the Conservatives under Carl Gustaf Hammarskjöld and the New Swedish Movement under Per Engdahl have won over the forces of revolution and socialism. Even so, many think the coalition will not last long, as both men seeks to seize power for themselves." #NT!
  
 SWE_swedish_red_scare: "Swedish Red Scare" #NT!
 SWE_swedish_red_scare_desc: "This recent election is the closest that the forces of socialism have been able to take over Sweden. These forces are a threat to our values and traditions, with their disdain towards Protestant Christianity, and to our independence, with them suckling the teat of the Bolsheviks in Moscow. They need to be rooted out for their treason." #NT!
 SWE_controlling_elections: "Controlling Elections" #NT!
 SWE_controlling_elections_desc: "Free and fair elections have only become a tool for the uneducated masses, influenced by deceptive forces, to undermine the institutions and the values of our country. In an era of crises and rising conflicts, we can't have the will of the people remain untamed. We need to better control the democratic processes, while restricting anti-Swedish parties and candidates from running." #NT!
 SWE_compromise_liberals: "Compromise With the Liberals" #NT!
 SWE_compromise_liberals_desc: "Many liberals were torn between supporting us or supporting the enemy under the recent election. Hopefully they understand that if they want some liberal reforms to go through, they have a better hope in working with us than against us. Compared to the corporatist populists in the New Swedish Movement, us Conservatives seek to protect the rights of capital." #NT!
 SWE_appeal_to_patriotism: "Appeal to Patriotism" #NT!
 SWE_appeal_to_patriotism_desc: "The people of Sweden need to know that we are the people that has the biggest heart for this country. While the Social Democrats and the Communists are bending over backward to please their Moscow masters and the New Swedish Movement are following closely behind the Valkists in Berlin, are we Conservatives those who put Sweden First. We are the ones that will Make Sweden Great Again!" #NT!
 SWE_cement_hammarskjold_regime: "Cement Hammarskjöld's Regime" #NT!
 SWE_cement_hammarskjold_regime_desc: "The charades of coalition politics are now finally over. With a declaration of martial law underway, Hammarskjöld and his most loyal followers will seize the little power given to Engdahl and his thugs. Now, we can finally look towards healing and restoration for the Swedish nation." #NT!
 SWE_tackle_foreign_interference: "Tackle Foreign Interference" #NT!
 SWE_tackle_foreign_interference_desc: "Foreign powers are trying to puppet Sweden. Moscow are rallying up socialists and communists, while valkists and ultra-'nationalists' are lackeys of Berlin. Even liberals, some of them supporting our government, are working to further the interests of Paris or London. It is time to stop this and restore Swedish independence." #NT!
 SWE_ban_pan_germanic_forces: "Ban Pan-Germanic Forces" #NT!
 SWE_ban_pan_germanic_forces_desc: "Organizations like the New Swedish Movement and the Valkist Workers' Party claim to fight for Sweden. In reality, they represent a pro-German fifth column in our country. Their goal aren't what's best for Sweden, but to further the Pan-Germanic goals set to life by the many Valkist and Völkish ideologues in Germany. Their lifeline ends now." #NT!
 SWE_crush_militia_forces: "Crush Militia Forces" #NT!
 SWE_crush_militia_forces_desc: "In recent years, both the Communists and the New Swedish Movement have begun to use militia forces to bend the will of the Swedish nation. This represent an unacceptable undermining of the Swedish state and it's possibility to uphold law and order. Be it socialist workers' militias or violent far-right thugs, these groups should no longer be able to endanger the Swedish people." #NT!
 SWE_protestant_values: "Protestant Values" #NT!
 SWE_protestant_values_desc: "Sweden was born a Protestant nation when Gustav Vasa freed us from the chains of the Kalmar Union. The Protestant values that we have inheirited from Vasa is fundamental to protect the independence of the Swedish nation. In a time of increased individualism and strife, these values are the glue that will counteract these forces and bind the Swedish people stronger together." #NT!
 SWE_ensure_army_loyalty: "Ensure Army Loyalty" #NT!
 SWE_ensure_army_loyalty_desc: "It is important that every part of the Swedish army affirm their loyalty to King and Fatherland. While most officers are quite conservative, some have drifted towards oppositional forces like the Social Democrats or the New Swedish Movement. They need to understand that their loyalty to King and Fatherland runs counter to the interests of these forces." #NT!
 SWE_royalist_virtues: "Royalist Virtues" #NT!
 SWE_royalist_virtues_desc: "King Gustaf V are God's choosen representative to run the Kingdom of Sweden, and strict loyalty towards the crown is near a requirement to be a proper Swede. However, with the rise of pro-Republican forces, we need to ensure that this loyalty towards King and Fatherland are imprinted upon every Swede. From before they begin to walk, the Swede shall know loyalty towards the King." #NT!
 SWE_cult_of_general: "Cult of the General" #NT!
 SWE_cult_of_general_desc: "Carl Gustaf Hammarskjöld are no special man, but he is an ideal for all Swedes. A man that have laid down his life to serve the Swedish people and his King. An ideal we should build a cult around. However, one different from the leader cult we see in Germany. We shouldn't venerate Hammarskjöld as a person, but the example of unrelenting service towards the realm that he has shown." #NT!
 SWE_hammarskjolds_retirement: "Hammarskjöld's Retirement" #NT!
 SWE_hammarskjolds_retirement_desc: "Carl Gustaf Hammarskjöld has served Sweden since the end of the 19th century, and was no young man when he began this service as prime minister. Already in his seventies, many of his aides fear that he will die while in office, and what the consequences of that would be. With capable men around him, able to take up the office of prime minister, and the country recovered from its crises, it is time to pass governing on to the next generation." #NT!
 SWE_caroleanism: "Caroleanism" #NT!
 SWE_caroleanism_desc: "Our ideology constitute a modern form of Caroleanism. This includes following many of the same values and diciplines that the Caroleans followed. For both the Carolean and for us, our spiritual brotherhood shall be more built on a shared Protestant Christian faith than nationality. As Christians with God on our side, we shouldn't fear death and be not afraid to charge right on our enemy, till we see the white in their eyes." #NT!
 SWE_paternalist_welfare: "Paternalist Welfare" #NT!
 SWE_paternalist_welfare_desc: "To preserve the welfare of the Swedish people are one of the most important tasks of a Swedish government. With the hardships that recent crises have brought upon our people, we should share our riches with our poor countrymen. Building institutions that take care of our unemployed, our elderly and our veterans are instrumental in upholding our Swedish Folkhem." #NT!
  
 SWE_swedish_cincinnatus: "A Swedish Cincinnatus" #NT!
 SWE_swedish_cincinnatus_desc: "The tale of Carl Gustaf Hammarskjöld mirrors the tale of Cincinnatus. A statesman and military leader who took on absolute authority to tackle an era of crises. At the end, resigning from this power and return it back to the people. Like with Rome, Sweden's time as a dictatorship is over and we should return to a democratic normalcy." #NT!
 SWE_second_age_of_liberty: "Second Age of Liberty" #NT!
 SWE_second_age_of_liberty_desc: "Like the first Carolean age, the second will also end with an Age of Liberty. With Sweden being at a much more stable place today than it was a few years ago, it is time to liberalize the security laws that prime minister Hammarskjöld enacted. This will also show our political opponents that we are true to our democratic ideals and can work with them." #NT!
 SWE_bring_in_liberals: "Bring In the Liberals" #NT!
 SWE_bring_in_liberals_desc: "The coalition agreement between us and the New Swedish Movement soured our relationship to the liberal People's Party and the agrarian Farmers' League. They were less willing to work with us when Hammarskjöld enacted martial law. However, with our steps to democratizise there have come new opportunities to work with the liberals." #NT!
 SWE_codify_huvudavtalet: "Codify Huvudavtalet" #NT!
 SWE_codify_huvudavtalet_desc: "There have been a lot of conflict between the forces of labour and the forces of capital the last decades. Often, these have resulted in violence and instability that have torn Sweden apart. Both us and moderate Social Democrats see that this can not continue. Therefore, we will work to establish a framework for collective bargaining between the labour unions and the employers." #NT!
 SWE_christian_unionization: "Christian Unionization" #NT!
 SWE_christian_unionization_desc: "Many previous unions have been socialist in nature, with revolution and treason to Moscow as goals. This is a major reason why instability have been allowed to grow on the workplace. Even so, the workers still need representation. That is why we will promote certain unions who are built upon a Christian foundation. Unions who seek to bring stability to the workers, without any loyalty to socialist parties." #NT!
  
 SWE_swedish_caesar: "A Swedish Caesar" #NT!
 SWE_swedish_caesar_desc: "The tale of Carl Gustaf Hammarskjöld mirrors the tale of Julius Caesar. A statesman and military leader who took power from institutions that had failed the people. Instead of giving power back to the institutions that constantly brought on crisis, they seek to build a new order. Like with Rome, Sweden need to abandon the destructiveness of democracy and create a new form of government." #NT!
 SWE_unite_national_right: "Unite the National Right" #NT!
 SWE_unite_national_right_desc: "While most of our supporters are organized in the General Electoral League, this is primarily a conservative party which still contains elements loyal to democracy. At the same time, there are nationalist organizations who have similar goals to us who could be included in our project. Elmo Lindholm see it therefore as a necessity to form a new organization to unite the National Right." #NT!
 SWE_destroy_enemies_of_swedishness: "Destroy the Enemies of Swedishness" #NT!
 SWE_destroy_enemies_of_swedishness_desc: "Socialists, Liberals and other non-Swedish elements still tries to undermine the Swedish nation. If we are to preserve Sweden as a loyal, patriotic kingdom, we need to make sure these forces doesn't become a threat. We can also establish camps to intern them, maybe even have them available as an extra source of labour." #NT!
 SWE_beyond_class_and_party: "Beyond Class and Party" #NT!
 SWE_beyond_class_and_party_desc: "The distinctions of class and party have always helped to divide our nation between competing interests. This have weakened Sweden and only helped those who seek to destroy us. We need to dissolve these distinctions, not through divisive revolution, but through a Swedish national solidarity that can destroy differences in class and in politics." #NT!
 SWE_swedish_catholicism: "A Swedish Catholicism" #NT!
 SWE_swedish_catholicism_desc: "Catholicism have remained a minor religion in Sweden, and are often viewed negatively by Swedish nationalists as a Papal tool. However, Lindholm does see a lot of good coming from Catholicism. Especially in its focus on social teachings. Lindholm achknowledge that Catholics who seek to overturn the French revolution isn't our enemies, they are compatriots." #NT!
  
 SWE_towards_austerity: "Towards Austerity" #NT!
 SWE_towards_austerity_desc: "In this crisis, we all need to bear the cost of austerity. While populists and socialists wish to spend our way out of our economic hardship, the truth is that hard choices need to be made. Even if this is unpopular, we will come out as a stronger nation." #NT!
 SWE_close_unprofitable_businesses: "Close Unprofitable Businesses" #NT!
 SWE_close_unprofitable_businesses_desc: "Businesses that can't manage to create a profit, can't live on. That has become more true than ever before with the recent economic crisis. If we are going to pull through this as a nation, we need to close some of them down. Sacrifices will be needed for the good of the whole Swedish nation." #NT!
 SWE_cut_social_spending: "Cut Social Spending" #NT!
 SWE_cut_social_spending_desc: "For many, cutting social spending will be unthinkable. Many Swedes depend on welfare funded by the state and have an uncertain future ahead without this. Even if this is more true now than ever, there is little faith that we will come through without making these hard decisions." #NT!
 SWE_renounce_foreign_debt: "Renounce Foreign Debt" #NT!
 SWE_renounce_foreign_debt_desc: "Former and more traitorous governments have enslaved Sweden to foreign powers. This debt are now dragging our nation down. We didn't make these deals and our New Swedish partners propose that we shouldn't respect them either. Instead, we should free us from these foreign trappings and denounce them." #NT!
 SWE_raise_taxes: "Raise Taxes" #NT!
 SWE_raise_taxes_desc: "Sweden needs money to have the funding necessary to recover. While this can bring a strain upon the Swedish people, higher taxes need to be implemented if we are going to recover. Tax cuts can wait until after recovery." #NT!
 SWE_enact_rationing: "Enact Rationing" #NT!
 SWE_enact_rationing_desc: "The crisis have damaged our ability to import and export goods. This have caused a lack of many products. For a short time, we will need to ration and be willing to not spend so much as we would like to." #NT!
 SWE_restore_trade_relations: "Restore Trade Relations" #NT!
 SWE_restore_trade_relations_desc: "Trade links broke down with the economic crisis. However, with both our economy and the economies of other countries slowly stabilizing, we will be able to rebuild these trade links. Already, we can see the forces of the market beginning to restore international trading." #NT!
 SWE_restrict_union_activities: "Restrict Union Activities" #NT!
 SWE_restrict_union_activities_desc: "Labour unions have tried to use the economic crisis to trigger revolutionary activities amongst the Swedish workers. Often, they are also working to undermine the effort we make to recover our country from this crisis. This is good reasons to heavily restrict their activities." #NT!
 SWE_nationalize_key_industries: "Nationalize Key Industries" #NT!
 SWE_nationalize_key_industries_desc: "There are many important industries in Sweden. Industries too important to remain in the greedy hands of private businessmen. To secure that these industries remain floating and protect them from private mismanagement, we should nationalize them. This way, they will benefit the nation, not just a few at the top." #NT!
 SWE_support_farmers: "Support the Farmers" #NT!
 SWE_support_farmers_desc: "The Swedish farmers are a pillar in the security of our society. However, with the recent economic crisis, the loss of export have greatly cut our farmers' ability to earn a profit. Since they are so important in upholding our society, bankruptcy and foreclosures are something we can't allow." #NT!
 SWE_german_steel_export: "German Steel Export" #NT!
 SWE_german_steel_export_desc: "Germany have been a key trade partner since the start of the century. Their industry have had good use in the steel that we export to them. While the economic crisis have crippled steel export elsewhere, German demand have continued to grow. This can be an opportunity to faster recover from the crisis." #NT!
 SWE_arbetsformedlingen: "Arbetsformedlingen" #NT!
 SWE_arbetsformedlingen_desc: "Unemployment have been a rising issue since the start of the crisis. This does also lead to social instability, since many of these unemployed people hasn't much else to do than causing crimes and other troubles. However, we have proposed an institution that will employ people that will be trained for industrial and infrastructural work. It will make our nation stronger and give these people a sense of purpose." #NT!
 SWE_restore_nation: "Restore the Nation" #NT!
 SWE_restore_nation_desc: "Finally, we see the signs of a new tomorrow rising. After many months in recession, the Swedish economy is finally beginning to turn to the better. While there are some time left before the crisis is finally over, we can now leave the worst behind us." #NT!
  
 SWE_attack_liberal_capitalists: "Attack Liberal Capitalists" #NT!
 SWE_attack_liberal_capitalists_desc: "The troubles that Sweden faces today, have in part been brought onto us by liberal capitalists. A class of international-oriented businessmen who favor loyalty to their own riches over loyalty to the nation. Let's rough up some of these to show that we aren't taking likely to liberals and capitalists who have no loyalty to Sweden. They are also a fair enemy to rally the Swedish workers against." #NT!
 SWE_empower_new_swedish_youth: "Empower the New Swedish Youth" #NT!
 SWE_empower_new_swedish_youth_desc: "The New Swedish movement have always been dominated by a younger sect of society. Many young intellectuals that have crafted the ideological reasonings behind the movement. These young men are eager to shape our country into a new nation. One beyond the limits of parliamentary democracy. It wouldn't hurt to let them try." #NT!
 SWE_utilize_far_right_militias: "Utilize Far-Right Militias" #NT!
 SWE_utilize_far_right_militias_desc: "While the New Swedish movement started in academia, it have strong ties to far-right groups built as military units. Many of these are young men with a background from military service seeking new enemies to attack. The New Swedish movement gives them many enemies - Socialists, Liberals, Jews. All of them, these radical thugs seems to find something wrong with." #NT!
 SWE_establish_loyal_unions: "Establish Loyal Unions" #NT!
 SWE_establish_loyal_unions_desc: "Swedish unions under the control of the Socialists will always undermine the Swedish nation. In order for our country to stand strong as one, we can't allow unions tearing us apart. At the same time, the workers should have a way to stand stronger against their bosses. Establishing unions under New Swedish control will solve this problem. This will utilize the power of labour to both further the rights of the worker as well as strengthening the body politic." #NT!
 SWE_rise_new_sweden: "Rise of a New Sweden" #NT!
 SWE_rise_new_sweden_desc: "When Carl Gustaf Hammarskjöld entered into a coalition with Per Engdahl and the New Swedish movement, he believed he could control the movement to do his bidding. However, the New Sweden have proven itself not willing to be controlled. Today, we will begin to shed away the degenerate shape that is the Old Sweden, purging it away to allow a New Sweden to rise." #NT!
 SWE_formalize_new_swedish_youth: "Formalize the New Swedish Youth" #NT!
 SWE_formalize_new_swedish_youth_desc: "Our regime need to keep the far-right militias under tight control. That is the reason why we need to officially form a New Swedish Youth, a militant group of young teenage boys and men that will serve loyally our regime. Through this force, we will give the youth purpose and make Sweden stronger." #NT!
 SWE_question_of_monarchy: "Question of the Monarchy" #NT!
 SWE_question_of_monarchy_desc: "While the King have always been willing to work with us, there is no secret that he would rather prefer the reactionary leadership of Hammarskjöld than ours. Having the King around grants our regime a veneer of legitimacy and stability. However, it also limits our ability to unite power under our leader, Per Engdahl." #NT!
 SWE_purge_dissidents: "Purge Dissidents" #NT!
 SWE_purge_dissidents_desc: "There are still many in Sweden that doesn't welcome the rise of the New Sweden. They seek to undermine our rightful rule and bring Socialism to our country. We need to get rid of these people so they doesn't pose a threat to our regime or to Swedishness." #NT!
 SWE_corporatize_economy: "Corporatize the Economy" #NT!
 SWE_corporatize_economy_desc: "Both Capitalism and Socialism have failed Sweden. They are economic systems that only seek to divide the nation into classes and peg them against each other. We achknowledge that the Swedish nation is one body where different parts does different things. However, all parts should works for the benefit of each others and the body as a whole. Not to one class." #NT!
 SWE_new_swedish_families: "New Swedish Families" #NT!
 SWE_new_swedish_families_desc: "The family is an important part of our ideological project. While the Swedish family have been formed by informal norms of what responsibilities each member has, the New Swedish family are more organized. Fathers that work the fields or in the factory, or fights Sweden's wars. Mothers that bring up children and lead the homelife. Children that are educated into the way of the New Sweden." #NT!
 SWE_swedish_christianity: "Swedish Christianity" #NT!
 SWE_swedish_christianity_desc: "Many Swedish christians doesn't believe in the wisdom of Per Engdahl and in the New Swedish project. Despite the fact that Christianity has a few good values that can help to further the New Swedish cause, there are a few reactionary elements that will work in opposition to our regime. Cleaning out these elements and assuring Church loyalty are important to achieve control." #NT!
 SWE_canonize_engdahl_thought: "Canonize Engdahl Thought" #NT!
 SWE_canonize_engdahl_thought_desc: "Per Engdahl have authored many manuscripts and texts that tries to map out his ideology - 'nysvenskhet'. From his admiration of Carolus Rex, his opposition to race mixing, to his nationalism and corporatism. All have come to form the ideology of Engdahl. Writing down and unify his ideas in one book will make the ideology of the New Sweden available to all Swedes." #NT!
 SWE_rise_of_swedish_legionaries: "Rise of the Swedish Legionaries" #NT!
 SWE_rise_of_swedish_legionaries_desc: "Militant members of our movement seeks to join the armed forces to fight the enemies of the New Sweden. They find inspiration in tales of Roman legionaries, often calling themselves a new generation of Swedish legionaries, along with the commitment of the Carolean soldier. Let them serve their nation with zeal!" #NT!
 SWE_vagen_framat: "Vägen Framåt" #NT!
 SWE_vagen_framat_desc: "The Sweden of old have passed and a New Sweden has rissen in its stead. Finally, Swedish society are fully united under the banner of the New Swedish movement and its leader, Per Engdahl. Our opposition have been silenced and we look beyond our borders to fulfill our ambitions." #NT!
 SWE_new_imperialism: "New Imperialism" #NT!
 SWE_new_imperialism_desc: "The Swedish Empire is not yet dead. The New Swedish movement seeks to restore the old glories of our empire, spanning across the Nordic countries. We will liberate our brothers from Socialist repression and conquer our place in the sun." #NT!
 SWE_restore_countryside: "Restore the Countryside" #NT!
 SWE_restore_countryside_desc: "While the Swedish farmers are on their way to recovery from the economic crisis, we need to strengthen them and restore our countryside. The encrochment of urbanization threaten our self-reliance. A trend that all Swedish patriots should help to reverse." #NT!
  
 SWE_for_king_and_new_sweden: "For King and the New Sweden" #NT!
 SWE_for_king_and_new_sweden_desc: "Keeping the King around was a decision with risks involved. However, King Gustaf have shown himself willing to support the New Swedish movement after witnessing that Hammarskjöld wasn't able to protect Sweden. This opens an opportunity to show our loyalty to the Kingdom forged by Gustav Vasa, Gustavus Adolphus and Carolus Rex." #NT!
 SWE_engdahl_carolus_rex_reborn: "Engdahl - the True Carolean Heir" #NT!
 SWE_engdahl_carolus_rex_reborn_desc: "While many conservatives opposed the abandonment of the monarchy, it helped us to unify power behind Per Engdahl. Swedish history have also shown that leadership doesn't necessarily befit those born into royalty. Gustav Vasa were only a lord, but rose to become king. The zeal that Engdahl displays proves that he is a truer heir to the legacy of past Kings than the old king." #NT!
 SWE_radicalize_svekoman_movement: "Radicalize the Svecoman Movement" #NT!
 SWE_radicalize_svekoman_movement_desc: "The Swedes that lives in Finland are our brothers. During their fight to break free from the Russians, the Finno-Swedes built their own movement to achieve independence. With the reconquest of Finland, we can finally radicalize and integrate the Svecoman movement. This will form the elite people that will lord over the lands of Finland." #NT!
 SWE_integrate_tst_training: "Integrate TST Training" #NT!
 SWE_integrate_tst_training_desc: "Our militant members have always forged themselves based on the German Trutzbündische Stoßtruppe. Because of this fact, it makes sense for us to observe their tactics against both foreign and domestic enemies, using these tactics for ourselves in our wars." #NT!
 SWE_new_form_of_governance: "A New Form of Governance" #NT!
 SWE_new_form_of_governance_desc: "The government of the New Sweden seeks to unite all classes and factions of the Swedish nation into one community of the people. 'Nysvenskhet' will be a foundation for our government and our laws. This will ensure that our New Sweden will endure even after Engdahl is gone." #NT!
  
 ## Left-Wing ## 
  
 SWE_rise_of_social_democracy: "Rise of Social Democracy" #NT!
 SWE_rise_of_social_democracy_desc: "In the recent election, Sweden was close to tread down the path of authoritarianism and ultranationalism. Luckily, we managed to rally enough people to oppose this grim future. For the first time in Swedish history, the Social Democrats have entered the government offices. Now, the hard work begins." #NT!
 SWE_interventionist_recovery: "Interventionist Recovery" #NT!
 SWE_interventionist_recovery_desc: "The previous government have been too light-handed when faced with economic crisis. We can not expect that the troubles that our citizens are living through will be fixed with austerity and market forces. We need to intervene to secure the standard of living of our people." #NT!
