 #### Political Parties ##### 
  
 SWE_vanguardist_party: "SKP" #NT!
 SWE_vanguardist_party_long: "Sveriges Kommunistiska Parti (Sillénarna)\n§gSwedish Communist Party§!\n§LThe Bolshevik revolution in Russia divided the Swedish working class between those supporting the revolution and the Moscow line and those seeking an independent course for socialism. The Communist Party represent the former line. Since the revolution, the party have experienced its own splinters, but remaining are many of the most loyal members of the Communist International and the vision of Leninist Socialism. The most pro-Comintern wing is led by Hugo Sillén. This wing wants the party to be a strong vanguard in opposition to the social valkists that dear call themselves socialist.§!" #NT!
 SWE_collectivist_party: "SKP" #NT!
 SWE_collectivist_party_long: "Sveriges Kommunistiska Parti\n§gSwedish Communist Party§!\n§LThe Bolshevik revolution in Russia divided the Swedish working class between those supporting the revolution and the Moscow line and those seeking an independent course for socialism. The Communist Party represent the former line. Since the revolution, the party have experienced its own splinters, but remaining are many of the most loyal members of the Communist International and the vision of Leninist Socialism. Most communists support a revolution, but want the dictatorship of the proletariat to represent the democratic will of the workers, not the will of a small party vanguard.§!" #NT!
 SWE_libertarian_socialist_party: "VsP" #NT!
 SWE_libertarian_socialist_party_long: "Vänstersocialistiska Partiet\n§gLeft Socialist Party§!\n§LThe Left Socialists represents both members of the Communist Party unwilling to follow the Moscow line and Social Democrats dissatisfied with the party's moderation. This movement have come under the leadership of Göteborg politician Albin Ström, who have been in both camps, with figures like Karl Kilbom and Nils Flyg also being strong figures. The Left Socialists are inspired by the course set by the socialists in Norway, seeking to create a similar independent-minded course for Swedish socialism.§!" #NT!
 SWE_social_democrat_party: "SAP" #NT!
 SWE_social_democrat_party_long: "Sveriges Socialdemokratiska Arbetareparti\n§gSwedish Social Democratic Workers' Party§!\n§LThe Social Democratic Workers' Party was founded in 1889 as a socialist party seeking to advance the rights of the working class. During the first couple of decades of the 20th century, it has experienced both left-wing splinters forming more radical parties and to be on the forefront in the fight for female suffrage. However, with the stain of socialism attached to the party, it has been difficult for it to achieve power. This, despite the effort of leaders like Hjalmar Branting and Per Albin Hansson to moderate the party away from marxism and towards an ideology seeking to establish 'folkhemmet' in Sweden - a society of equality and social welfare.§!" #NT!
 SWE_socdem_republican_party: "SAP - Republikanerna" #NT!
 SWE_socdem_republican_party_long: "Sveriges Socialdemokratiska Arbetareparti - Republikanerna\n§gSwedish Social Democratic Workers' Party - Republicans§!" #NT!
 SWE_social_liberal_party: "B" #NT!
 SWE_social_liberal_party_long: "Bondeförbundet\n§gFarmers' League§!\n§LThe Farmers' League was formed in 1913 and are on the forefront in representing the Nordic Agrarian movement in Sweden. The party seek to speak up for the people living in the countryside, especially the interests of the farmers. With its primary focus being representing the Swedish farmers and the countryside, the party can be hard to pin down. With some members leaning more conservative, while others seek to strengthen the party's bonds to the party of the workers - the Social Democrats. Under the leadership of Axel Pehrsson, the party have moved towards the latter position.§!" #NT!
 SWE_soclib_socialist_party: "BAF" #NT!
 SWE_soclib_socialist_party_long: "Bonde- och Arbetarförbundet\n§gFarmers' and Workers' League§!\n§LThe Farmers' and Workers' League represent an agrarianism without the reactionary stains of its previous incarnation. The rights of the farmers and the countryside workers are still important, but they understand that agrarian socialism are the best way to support these people.§!" #NT!
 SWE_market_liberal_party: "FP" #NT!
 SWE_market_liberal_party_long: "Folkpartiet\n§gPeople's Party§!\n§LThe People's Party are a fairly new party, but one with roots going back to the start of the century. While the first liberal party was formed in 1902, it divided itself over the issue of prohibition during the 1920s, before reconciling and forming the People's Party in 1934. While historically a party for members of the Free-Churches, it has grown in popularity among urban liberals. In regards to the Hammarskjöld government, the party remain splitted. More conservative liberals are more supportive of Hammarskjöld, while more social liberals seek to ally with the Social Democrats against authoritarianism.§!" #NT!
 SWE_marlib_socialist_party: "DF" #NT!
 SWE_marlib_socialist_party_long: "Demokratiska Folkförbundet\n§gDemocratic People's League§!\n§LThe Democratic People's League represent a liberalism that has been freed from the clenches of liberal capitalism. It seeks to strengthen the democratic side of our revolutionary democracy, while subscribing to a liberal socialism.§!" #NT!
 SWE_social_conservative_party: "AV" #NT!
 SWE_social_conservative_party_long: "Allmänna Valmansförbundet\n§gGeneral Electoral League§!\n§LThe General Electoral League are the latest incarnation of the conservative movement in Sweden. This movement was formed during the start of the 20th century as a reaction to the growing influence of the Social Democrats and the Liberals. At first the movement supported a nationalistic conservatism in favor of protectionism. However, during the leadership of the Admiral - Arvid Lindman - the party moderated itself and became more pragmatic. This swing has been mostly reversed with the rise in political polarization and the prime ministership of Carl Gustaf Hammarskjöld. Even so, there are still conservatives that seek pragmatic reforms and freer trade.§!" #NT!
 SWE_soccon_hogern_party: "HR" #NT!
 SWE_soccon_hogern_party_long: "Högerns Riksorganisation\n§gThe National Organization of the Right§!\n§LLike its previous incarnations, the General Electoral League have been reorganized into a new organization with a new name. The National Organization of the Right, often just called the Right, tries both to distance itself from the authoritarian leanings of its previous incarnation, as well as portraying itself as a conservative party. With a new generation of Swedish conservatives, headed by Gösta Bagge and Fritiof Domö, the party seek to present a fresher face to conservatism.§!" #NT!
 SWE_soccon_socialist_party: "KS" #NT!
 SWE_soccon_socialist_party_long: "Kristent Samhället\n§gChristian Society§!\n§LThe Christian Society represent a conservatism purged of the influences of reactionaries and capitalists. It seeks to further the interests of the Christian workers in Sweden, while not working to undermine our revolutionary democracy.§!" #NT!
 SWE_authoritarian_democrat_party: "AV" #NT!
 SWE_authoritarian_democrat_party_long: "Allmänna Valmansförbundet\n§gGeneral Electoral League§!\n§LThe General Electoral League are the latest incarnation of the conservative movement in Sweden. This movement was formed during the start of the 20th century as a reaction to the growing influence of the Social Democrats and the Liberals. At first the movement supported a nationalistic conservatism in favor of protectionism. However, during the leadership of the Admiral - Arvid Lindman - the party moderated itself and became more pragmatic. This swing has been mostly reversed with the rise in political polarization and the prime ministership of Carl Gustaf Hammarskjöld. This wing of the party seek to balance a veneer of democratic legitimacy with a goal to bring back Protestantism and Monarchism to Sweden.§!" #NT!
 SWE_autdem_national_league: "SNF" #NT!
 SWE_autdem_national_league_long: "Sveriges Nationella Förbund\n§gNational League of Sweden§!\n§LThe National League was previously the conservative youth league, but left the party when the conservatives moderated away from reactionary nationalism. The National League seeks to continue the authoritarian legacy of Hammarskjöld, while also seeking to become the new leading faction on the nationalist far-right.§!" #NT!
 SWE_paternal_autocrat_party: "KFP" #NT!
 SWE_paternal_autocrat_party_long: "Kyrkliga Folkpartiet\n§gClerical People's Party§!\n§LThe Clerical People's Party are a small Christian party in Sweden. The party are strong supporters of the power of the King, as well as supportive of rearmament and in opposition to parliamentarianism. Ideally, it would like to restore morality to a Sweden living in sodomy.§!" #NT!
 SWE_pataut_hammarskjold: "AV - HK" #NT!
 SWE_pataut_hammarskjold_long: "Allmänna Valmansförbundet - Hammarskjöld-klicken\n§gGeneral Electoral League - the Hammarskjöld Clique§!\n§LThe General Electoral League are the latest incarnation of the conservative movement in Sweden. This movement was formed during the start of the 20th century as a reaction to the growing influence of the Social Democrats and the Liberals. At first the movement supported a nationalistic conservatism in favor of protectionism. However, during the leadership of the Admiral - Arvid Lindman - the party moderated itself and became more pragmatic. This swing has been mostly reversed with the rise in political polarization and the prime ministership of Carl Gustaf Hammarskjöld. The most loyal members to the prime minister seek to create a military dictatorship to protect the people.§!" #NT!
 SWE_pataut_national_league: "SNF" #NT!
 SWE_pataut_national_league_long: "Sveriges Nationella Förbund\n§gNational League of Sweden§!\n§LThe National League was formed by prime minister Elmo Lindholm to replace party politics entirely. It is an anti-democratic, corporatist and nationalist organization that seeks to unite all Swedish society in loyal service to King, Fatherland and God. While growing out of the conservatives, the National League have begun to adopt some of the policies of the New Swedish Movement, mending 'nysvenskhet' to fit their neo-Caroleanist ideas.§!" #NT!
 SWE_pataut_army: "Armékoalitionen" #NT!
 SWE_pataut_army_long: "Nationella Återhämtningskoalitionen\n§gNational Recovery Coalition§!\n§LWith the sudden death of Carl Gustaf Hammarskjöld, leading military figure have couped the government and formed the National Recovery Coalition. However, this coalition is left weakened and the regime is likely to fall apart.§!" #NT!
 SWE_national_populist_party: "NR" #NT!
 SWE_national_populist_party_long: "Nysvenska Rörelsen\n§gNew Swedish Movement§!\n§LThe New Swedish Movement started as a student organization in 1930. Over the few years since then, it has managed to grow into one of the biggest political parties in Sweden, uniting both far-right students and intellectuals together with ultra-nationalist military thugs. The movement subscribes to an ideology called 'nysvenskhet'. An ideology that emphazize Swedish nationalism, corporatism, anti-communism and a disdain for democracy. Another key feature, are the movement's cult of personality around its leader - Per Engdahl.§!" #NT!
 SWE_natpop_socialist_party: "SNA" #NT!
 SWE_natpop_socialist_party_long: "Svenska Nationella Arbetarparti\n§gSwedish National Labour Party§!\n§LThe Swedish National Labour Party represent a nationalism that has fully embraced socialism. While still a harbringer of nationalist xenophobia, it is committed to the interests of the Swedish working class and will not undermine our revolutionary democracy.§!" #NT!
 SWE_valkist_party: "VAP" #NT!
 SWE_valkist_party_long: "Valkistiska Arbetarepartiet\n§gValkist Workers' Party§!\n§LThe Valkist Workers' Party is a party formed and led by Sven Olov Lindholm, with heavy inspiration from the Valkist movement in Germany. It supports nationalistic socialist economics and venerates a small cult around its leader. However, it remains fairly small in comparison to the New Swedish Movement.§!" #NT!
  
 #### IDEAS #### 
  
 SWE_unbroken_neutrality_idea: "Unbroken Neutrality" #NT!
 SWE_unbroken_neutrality_idea_desc: "Sweden has, since 1814, been a country at peace. No wars since then has touched the Kingdom, and has continued to stay neutral even when the world around it burned." #NT!
  
 SWE_sluggish_economy_idea: "Sluggish Economy" #NT!
 SWE_sluggish_economy_idea_desc: "The Valkist overthrow of the German Republic, our biggest economic partner since the Great War, had a sour impact on the Swedish economy. Due to our general pro-German leanings, we have not been able to harvest the fruits shared by the economic partners of the victors of the war. However, our government has finally begun to look outwards, to London and Paris, to integrate Sweden as a trade partner and to finally overcome these economic hardships." #NT!
 SWE_sluggish_economy1_idea: "Sluggish Economy" #NT!
 SWE_sluggish_economy1_idea_desc: "The Valkist overthrow of the German Republic, our biggest economic partner since the Great War, had a sour impact on the Swedish economy. Due to our general pro-German leanings, we have not been able to harvest the fruits shared by the economic partners of the victors of the war. However, our government has finally begun to look outwards, to London and Paris, to integrate Sweden as a trade partner and to finally overcome these economic hardships." #NT!
  
 SWE_revolution_and_reaction_idea: "Revolution and Reaction" #NT!
 SWE_revolution_and_reaction_idea_desc: "Swedish politics are broken. Due to the economic crises that we have endured, political polarization has been ripe. Unwillingness for the established parties to cooperate with the Social Democrats, fearing it would slide into revolution, have only helped to fuel more radical movements since little positive change is being made. The prime ministership of Carl Gustaf Hammarskjöld was meant to stabilize Sweden. However, there are few signs that he has been able to fulfill this mission. If Sweden isn’t able to bring itself out of crises and polarization, it is doomed to fall to revolutionary or reactionary forces." #NT!
 SWE_revolution_and_reaction1_idea: "Revolution and Reaction" #NT!
 SWE_revolution_and_reaction1_idea_desc: "Swedish politics are broken. Due to the economic crises that we have endured, political polarization has been ripe. Unwillingness for the established parties to cooperate with the Social Democrats, fearing it would slide into revolution, have only helped to fuel more radical movements since little positive change is being made. The prime ministership of Carl Gustaf Hammarskjöld was meant to stabilize Sweden. However, there are few signs that he has been able to fulfill this mission. If Sweden isn’t able to bring itself out of crises and polarization, it is doomed to fall to revolutionary or reactionary forces." #NT!
  
 SWE_conservative_military_idea: "An Outdated Military" #NT!
 SWE_conservative_military_idea_desc: "The last time Sweden went to war, it was to secure our control over Norway after the Treaty of Kiel in 1814. Since then, our military has only had our neutrality to guard. In this situation, the Swedish government has avoided necessary reforms to the military, making it increasingly outdated in comparison to other militaries on the continent. Our conservative general staff is more interested in getting themselves involved in the governing of Sweden than assuring that our military is able to defend Sweden. This is something that has to change." #NT!
 SWE_armen_idea: "An Outdated Military" #NT!
 SWE_armen_idea_desc: "The last time Sweden went to war, it was to secure our control over Norway after the Treaty of Kiel in 1814. Since then, our military has only had our neutrality to guard. In this situation, the Swedish government has avoided necessary reforms to the military, making it increasingly outdated in comparison to other militaries on the continent. Our conservative general staff is more interested in getting themselves involved in the governing of Sweden than assuring that our military is able to defend Sweden. This is something that has to change." #NT!
  
 SWE_new_swedish_generation_idea: "A New Swedish Generation" #NT!
 SWE_new_swedish_generation_idea_desc: "A shift has happened in Swedish universities. While these institutions have often challenged the conservative consensus of Sweden, a new challenge has risen with the New Swedish movement. Per Engdahl and his generation of far-right figures represent a new kind of nationalism. Instead of being working class men of a military background, they are university students and intellectuals who bring an ideological foundation to their movement. One that has proven attractive for many young Swedes that seek hope and change in these troublesome times." #NT!
  
