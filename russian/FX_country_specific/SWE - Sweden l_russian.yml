 #### DECISIONS #### 
 SWE_foreign_policy: "Foreign Policy" #NT!
 SWE_foreign_policy_desc: "Since the end of the Napoleonic Wars, Sweden have been able to maintain a neutral foreign policy. At least on paper. In reality, the governments and people of Sweden have had their preferences, with the pursuing of a pro-German position the last decades.\n\nWith the ever-changing world, we might be needed to abandon our neutrality and seek new or old allies." #NT!
 SWE_abandon_neutrality: "Abandon Neutrality" #NT!
 SWE_join_entente: "Joining the Entente" #NT!
 SWE_join_stahlpakt: "Joining the Stahlpakt" #NT!
 SWE_join_british_alliance: "Joining the British Alliance" #NT!
 SWE_join_soviet_international: "Joining the Soviet International" #NT!
  
 SWE_far_right_decisions: "Divisions in the Far-Right" #NT!
 SWE_far_right_decisions_desc: "While Swedish right-wing nationalists are mostly united under the New Sweden Movement, this movement is not all completely united. Encompassing both reactionary conservatives, revolutionary valkists and ultra-monarchists, the movement will need to balance between its more conservative and more radical wings.\n\n§YConservative§! influence is currently [ROOT.GetConservativeInfluence] ([?SWE_nat_conservative_influence_var|Y0])\n§YConservative§! loyalty towards our government is currently [ROOT.GetConservativeLoyalty] ([?SWE_nat_conservative_loyalty_var|Y0]%)\n\n§YRadical§! influence is currently [ROOT.GetRadicalInfluence] ([?SWE_nat_radical_influence_var|Y0])\n§YRadical§! loyalty towards our government is currently [ROOT.GetRadicalLoyalty] ([?SWE_nat_radical_loyalty_var|Y0]%)" #NT!
 SWE_empower_swedish_church: "Empower the Swedish Church" #NT!
 SWE_break_up_big_capital: "Break Up Big Capital" #NT!
  
 SWE_aland_game: "The Åland Game" #NT!
 SWE_aland_game_desc: "The islands of Åland has once again become a center of focus, with the incoming referendum set in the area. It will be in our interest to secure that the referendum goes in our favor.\n\n§YFinland§!'s support is currently [ROOT.GetFinlandSupport] ([?FIN_aland_game_var|Y0])\n\n§YSweden§!'s support is currently [ROOT.GetSwedenSupport] ([?SWE_aland_game_var|Y0])" #NT!
  
 SWE_pro_sweden_propaganda1: "Spread Pro-Sweden Propaganda" #NT!
 SWE_sabotage_finnish_propaganda1: "Sabotage the Finnish Campaign" #NT!
  
 SWE_aland_referendum_mission: "The [GetYear] Åland Referendum" #NT!
  
 SWE_calm: "§YCalm§!" #NT!
  
 SWE_1936_election_game: "The Future of Sweden" #NT!
 SWE_1936_election_game_desc: "The 1936 parliamentary election might become more important than ever. With the rise in popularity of both the §SSocial Democrats§! and the §8New Swedish Movement§!, Swedish politics have begun to divide itself between those who fear that the country are falling to §rBolshevism§! and those who fear that the country are falling to §gDictatorship§!.\n\nIn the first camp, many conservatives and nationalists have rallied behind prime minister §cHammarskjöld§!, believing he is the only one who could save Sweden from Revolution. In the other camp, many liberals and agrarians have begun to view the §SSocial Democrats§! as a better partner if the alternative will lead the country down a more authoritarian path.\n\nThe Support of §YHammarskjöld's Coalition§! is currently [ROOT.GetHammarskjoldSupport] ([?SWE_hammarskjold_election_var|Y0])\n\nThe Support of the §YSocial Democrats' Coalition§! is currently [ROOT.GetSocialDemocratSupport] ([?SWE_socialdemocrat_election_var|Y0])" #NT!
