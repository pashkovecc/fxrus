 FR_Sweden_Socialist: "Swedish Far-Left Focus Tree" #NT!
  
 SWE_FUHRERREICH_DESC: "The Kingdom of Sweden was once one of Europe's greatest power. Today, they are only a regional power in Scandinavia. Following the path of neutrality, even when Europe burned in the Great War. \n\nAfter the war, Swedish politics where marked by strife between the right and the left, and a growth in the far-right New Sweden Movement. With the Valkists taking power in Germany, Sweden have seen an ever suffering economy. This have resulted in the unpopular Hammarskjöld cabinet, trying desperatly to regain stability. It is yet to see where Sweden will go." #NT!
 POLITICS_GUSTAF_V_DESC: "§YLeader Description\nBorn:§! §gJune 16th, 1858, in Drottningholm, Stockholm§!\n§YPolitical Career:§! §gKing Gustaf V of Sweden has been the king of Sweden since 1907. He is the eldest son of the late king Oscar II and Sophia of Nassau. Gustaf grew up in the 19th century of the autocratic kingdom of Sweden, but when he ascended the throne, Sweden was already transforming into a parliamentarian democracy. In 1881, Gustaf married Victoria of Baden, a German noble woman and a descendance of a former royal house of Sweden. Despite Sweden's continued neutrality during the Great War, both the King and his wife were sympathetic towards the German Empire. Today, King Gustaf is an old man. He is a king from an another century and it will to see how the future will bring to the Swedish royal house.§!" #NT!
 SWE_Carl_Gustaf_Hammarskjold_desc: "§YLeader Description\nBorn:§! §gApril 22nd, 1865, in Vimmerby, Kalmar§!\n§YPolitical Career:§! §gCarl Gustaf Hammarskjöld is the definition of a man laying down his life in faithful service to his king and his fatherland. Born into the noble Hammarskjöld line, Carl Gustaf joined military service at 20, advancing to the rank of General and serving almost half a century in the Swedish army. His service hasn't been only in the army. During the 1920s, Hammarskjöld served both in the Parliament and as Defence Minister. Throughout his political career as a conservative, critical towards left-wing social reforms and supportive of a stronger military. Towards the end of his days, Hammarskjöld was suddenly appointed to lead a conservative government tasked to restore law and order. A task he will faithfully fulfill.§!\n\n§RHammarskjöld's health isn't what it once was and he might just have a few years left. If he passes while in office, it will destabilize the government.§!" #NT!
 SWE_Per_Albin_Hansson_desc: "§YLeader Description\nBorn:§! §gOctober 28th, 1885, in Kulladal, Malmöhus§!\n§YPolitical Career:§! §gPer Albin Hansson is in many ways the opposite to former prime minister Hammarskjöld. Born in a working class family in Malmö, Hansson grew up to become a key member in the growing labour movement. At the turn of the century, Hansson participated in the socialist temperance movement and become a founding member of the Social Democratic Youth. When the Bolshevik revolution divided the Swedish workers, Hansson remained a part of the majority that pushed aside the revolutionaries. Hansson became leader of the Social Democrats following Hjalmar Branting's death in 1925. Instead of continuing the party's marxist tradition, Hansson led the party towards a more moderate path where the ideal of 'Folkhemmet' is venerated. With his rise to power, it seems like this strategy has worked for Per Albin.§!" #NT!
 SWE_Per_Engdahl_desc: "§YLeader Description\nBorn:§! §gFebruary 25th, 1909, in Jönköping§!\n§YPolitical Career:§! §gPer Engdahl is the rising figure for the nationalist New Swedish movement. Being born in 1909, Engdahl has risen from a leader of the student society A New Sweden to the youngest prime minister in Swedish history in just a few years. What has made this possible, is the rising popularity of Engdahl's ideology 'nysvenskhet' and the growing cult around him. With his young age, it is likely that Engdahl will be an influential politician for many years to come.§!" #NT!
 SWE_Gosta_Bagge_desc: "§YLeader Description\nBorn:§! §gMay 27th, 1882, in Stockholm§!\n§YPolitical Career:§! §gGösta Bagge represents the rising generation of Swedish conservatives that have appeared in the aftermath of Hammarskjöld's prime ministership. Born in Stockholm, Bagge grew up to become a teacher and professor before entering Swedish politics in 1932. Quickly, Bagge became a rising conservative figure. Eventually joining Hammarskjöld's government in 1935. Now, he himself is leading a government. While a strong social conservative, Bagge is also supportive of democracy and economic liberalism, and an opponent to the authoritarian wings of the conservative movement.§!" #NT!
 SWE_Elmo_Lindholm_desc: "§YLeader Description\nBorn:§! §gJune 5th, 1897, in Nosaby, Kristianstad§!\n§YPolitical Career:§! §gElmo Lindholm are by many seen as the successor of prime minister Hammarskjöld's authoritarian style of government. Lindholm is, in contrast to general Hammarskjöld, a university-educated ideologue and philosopher. In the previous years, Lindholm have held the position as leader of the National Youth League. From this position, he was able to influence the government and give it an ideological reason for its actions. With Lindholm rising to the position of prime minister, he has the possibility to continue leading Sweden to become a nationalist, corporatist state.§!" #NT!
