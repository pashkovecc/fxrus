 ###Events### 
  
 cro.1.t: "The Croatian War for Independance!" #NT!
 cro.1.d: "The Hungarians are unwilling to negotiate and compromise, we must take our independance by force!" #NT!
 cro.1.a: "Croatia forever!" #NT!
 ### 
 cro.2.t: "Serbia declares war!" #NT!
 cro.2.d: "The Croatians in Bosnia have recently joined our cause, and now Serbia has declared war with the intent of retaking the lands. We must now fight on two fronts." #NT!
 cro.2.a: "Croatia forever!" #NT!
 ### 
 cro.3.t: "Italy declares war!" #NT!
 cro.3.d: "Dalmatia has joined our state not too long ago, and the Italians have decided that military intervention is the only solution. While Italy is far stronger than us, their internal political struggle may yield results for us." #NT!
 cro.3.a: "Croatia forever!" #NT!
 ### 
 cro.4.t: "Our enemies offer peace." #NT!
 cro.4.d: "We have survived against all odds and with enemies on all sides, and our enemies are unable to break our iron will. A combined delegation of Serbian, Hungarian, and Italian diplomats have sent an official letter of peace. The terms are completely reasonable; we leave all areas we've occupied during the war, and so do they. The Greater Croatian State survives, and our dream has been realized.\n\nWe have won." #NT!
 cro.4.a: "Croatia forever!" #NT!
  
 ###Ideas### 
  
 cro_united_revolt: "United in revolt" #NT!
 cro_united_revolt_desc: "All Croatians are united in our great revolt against our masters. Croatia will no longer be subject to foriegn powers." #NT!
  
