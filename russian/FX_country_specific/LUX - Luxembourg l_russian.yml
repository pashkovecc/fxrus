 LUX_give_equipment_for_each_friendly_majors: "§YEquipments§! will be added for each of the following countries that has an §Yopinion§! of Luxembourg! greater than §G1§!: \n§Y[FRA.getFlag][FRA.GetNameDef]§!, [ENG.getFlag]§Y [ENG.GetNameDef]§!, §Y[GER.getFlag][GER.GetNameDef]§!,§Y[USA.getFlag][USA.GetNameDef]§!, §Y[ITA.getFlag][ITA.GetNameDef]§! and §Y[SOV.getFlag][SOV.GetNameDef]§!." #NT!
  
 LUX_rearmament_tooltip: "§WCompleting this focus unlocks§! §YDecisions§! §Wto§! §Gget rid of§! the §RAshes of the Great War§! National Spirit" #NT!
 LUX_rearmament: "Legacy Of The Great War" #NT!
 LUX_rearmament_desc: "Our military has been in a sorry state ever since the Great War. From our near annihilation to the humiliation that was the Yser front, Luxembourg has failed to prove itself able to defend the people within it. The legacy of the war is that of destruction. \n\nIf we wish to continue our survival as a nation we must learn from the war. We must learn how to prevent the destruction and chaos of the conflict from ever arriving on our soil again." #NT!
  
 LUX_artillery_primacy: "Hit Hard" #NT!
 LUX_artillery_primacy_desc: "We lack the capacity to field a massive army like our contemporaries. Instead, we should focus our production on higher quality, stronger weaponry so that we may overpower any foes we face on the battlefield. This will be expensive, though, and, as such, we must be very selective in what units we deploy." #NT!
 LUX_decentralised_doctrine: "Decentralised Doctrine" #NT!
 LUX_decentralised_doctrine_desc: "We must place focus on smal units and low tier officers over the armchair generals who lead them." #NT!
 LUX_strength_in_firepower: "Strength In Firepower" #NT!
 LUX_strength_in_firepower_desc: "Our units must be focused on overpowering the enemy with Superior Firepower if we wish to come out on top." #NT!
 LUX_fn_contracts: "Belgian Assault Contracts" #NT!
 LUX_fn_contracts_desc: "The Belgian Fabrique Nationale produces high quality assault weapons, weapons our army desperately needs if we are to persue a policy of superior firepower. As such, we shall hand out Luxembourgish military contracts to FN in the hopes of acquiring more assault weapons for our armed forces." #NT!
 LUX_frc_contracts: "Belgian Cannon Contracts" #NT!
 LUX_frc_contracts_desc: "The Fonderie Royale des Canons for Cannons is a key component in our artillery industry. As such, we shall grant them extra funding and contracts in order to provide higher quality artillery for our army." #NT!
 LUX_minerva_contracts: "Belgian Car Contracts" #NT!
 LUX_minerva_contracts_desc: "The Belgian Minerva produced a wide array of mobile vehicles during the Great War. Many have pushed for the adoption of Armoured Personnel Carriers into our army in order to protect our infantrymen. Perhaps Minerva could provide this to little Luxembourg?" #NT!
 LUX_offencive_stratagems: "Offencive Stratagems" #NT!
 LUX_offencive_stratagems_desc: "Offence is the best Defence. We must take this to heart if we wish to defend our great nation from outside powers." #NT!
 LUX_modern_army: "A Modern Army" #NT!
 LUX_modern_army_desc: " " #NT!
  
 LUX_auxiliary_units: "Auxiliary Units" #NT!
 LUX_auxiliary_units_desc: "No force is complete without support units. From Reconnaissance to Engineers, they are crucial for success." #NT!
 LUX_auxiliary_recon: "Auxiliary Reconnaissance" #NT!
 LUX_auxiliary_recon_desc: "We shall focus our efforts on Auxiliary Reconnaissance specialisation!" #NT!
 LUX_auxiliary_engineers: "Auxiliary Engineers" #NT!
 LUX_auxiliary_engineers_desc: "We shall focus our efforts on Auxiliary Enginner specialisation!" #NT!
 LUX_logistics_calculation: "Logistics Specialists" #NT!
 LUX_logistics_calculation_desc: "We must carefully calculate our logistics in order to win!" #NT!
  
 LUX_planning_primacy: "Planning Primacy" #NT!
 LUX_planning_primacy_desc: "Planning is the end all win all of any war. In Depth Planning brought the Entente through the Great War, and it shall bring us through the next war!" #NT!
 LUX_modernised_units: "Modernise Our Units" #NT!
 LUX_modernised_units_desc: "The Units used in the Great War had proven themselves ineffective in the era of modern warfare. With this in mind, we must look to the future and prepare our units for modern combat." #NT!
 LUX_anti_tank_units: "Anti-Tank Companies" #NT!
 LUX_anti_tank_units_desc: "Armour has quickly enveloped Infantry as the dominant force on the battlefield. However, all is not lost, for Infantry can and will defeat Armour if provided a suitable weapon with which to destroy enemy armour!" #NT!
 LUX_modern_arty: "Support Artillery Companies" #NT!
 LUX_modern_arty_desc: "Artillery should not be focused on when constructing an army. Rather, it should be considered a support unit, one whose job is to assist infantry, not replace it." #NT!
 LUX_defencive_stratagems: "Defencive Stratagems" #NT!
 LUX_defencive_stratagems_desc: "We shall focus our army on defencive measures." #NT!
 LUX_planning_board: "Central Planning Board" #NT!
 LUX_planning_board_desc: "We must centralise our high command in order to make for better, more in depth plans." #NT!
 LUX_strength_in_planning: "Strength In Planning" #NT!
 LUX_strength_in_planning_desc: " " #NT!
 LUX_contracts: "Foreign Contracts" #NT!
 LUX_contracts_desc: "" #NT!
 LUX_cockerill_contracts: "Belgian Gun Contract" #NT!
 LUX_cockerill_contracts_desc: "John Cockerill produces defence oriented field guns which we can use to back up our army in our efforts to defend the homeland." #NT!
 LUX_rca_contracts: "Belgian Air Contracts" #NT!
 LUX_rca_contracts_desc: "Renard Constructions Aéronautiques is one of the few Belgian aeronautique companies in Beligum. If we wish to defend ourselves, we need to reach to our Belgian neighbours." #NT!
 LUX_modern_command: "A Modern High Command" #NT!
