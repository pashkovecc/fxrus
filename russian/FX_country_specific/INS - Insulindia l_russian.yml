 INS_sieze_timor: "Sieze Timor" #NT!
 INS_sieze_timor_desc: "The Portuguese imperialists have held Timor under their imperialist rule for far too long. We should invade this stain on the map and liberate the Indonesian populace from their Portuguese tyranny." #NT!
 INS_kick_out_japanese: "Kick Out the Japanese" #NT!
 INS_kick_out_japanese_desc: "The tiny island of Sulawesi is still under the boot of the Japanese. We should be gracious enough to intervene and incorporate them in our nation, with the local Malay population surely seeing us as liberators, right?" #NT!
