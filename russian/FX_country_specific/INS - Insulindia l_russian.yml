 #### Events #### 
 insulindia.0.t: "The Proclaimation of Indonesian Independence!" #NT!
 insulindia.0.d: "Today, the leader of the Indonesian fight for independence, Sukarno, does now utter the words, that Indonesia no longer will be ruled by colonial powers, to his followers and over radio in the country. The forces of Indonesia does stand up before the British Empire, maybe the largest in the world. But this fact does not seem to tear down the morale of the Indonesians." #NT!
 insulindia.0.a: "Sekali Merdeka tetap Merdeka! Merdeka atau Mati!" #NT!
  
 insulindia.1.t: "Foreign Volunteers Arrives Indonesia!" #NT!
 insulindia.1.d: "Foreign volunteers, with supplies and weapons, has arrived our HQ and offered their service in our fight to decolonialize the East Indies. The volunteers seems to mainly be from France, the Soviet Union, the United States of America and South-East Asia. Our leaders have warmly welcomed these volunteers and are already beginning to set them into service." #NT!
 insulindia.1.a: "Together, We Will Defeat the Colonialists!" #NT!
  
 insulindia.2.t: "Victory has Been Bringed Upon Us!" #NT!
 insulindia.2.d: "The British Imperialists have came to us and offered us a peace. We have won control over Java and Sumatra, and now will also win control over Indonesia. We just have to make peace. Further expantion onto the British Empire can be done later." #NT!
 insulindia.2.a: "Long Live Indonesia!" #NT!
  
 insulindia.3.t: "The Indonesians Has Pushed Us Out!" #NT!
 insulindia.3.d: "The Indonesians have pushed us out of the East Indies after long fights. We can either accept their victory, or continue this fight." #NT!
 insulindia.3.a: "Let's Make an Official Peace" #NT!
 insulindia.3.b: "No Peace With Rebels!" #NT!
  
 insulindia.4.t: "Approaching Our Politics" #NT!
 insulindia.4.d: "It is time to approach our political landscape. While most Indonesians wants our coutry to be independent, there are different views on how this independence shall look like. The most popular movements in Indonesia is currently the Socialists, mostly made up of the workers and farmers, the Nationalists, mostly made up of military leaders and the commoners, and the Islamists, mostly made up of the middle class and the muslim community. We need to set for us a path to follow on this front." #NT!
 insulindia.4.a: "Why Can't we all Adhere to the PNI? No?!" #NT!
  
 insulindia.5.t: "Socialist Demands Gain Volume" #NT!
 insulindia.5.d: "Socialist demands have begun to gain volume in our country, helped to be delievered to president Sukarno, through socialists in the provinsial government. These demands includes the siezing of foreign industries, nationalization of buisnesses and distribution of wealth. It is up to our leader how much we shall promice them." #NT!
 insulindia.5.a: "Accept Their Demands" #NT!
 insulindia.5.b: "Accpet Some of Their Demands" #NT!
 insulindia.5.c: "Reject Their Demands" #NT!
  
 insulindia.6.t: "Islamist Demands Gain Volume" #NT!
 insulindia.6.d: "Islamist demands have begun to gain volume in our country, helped to be delievered to president Sukarno, through islamists in the provinsial government. These demands includes a stop to secularization of Indonesia, banning of Christian parties and religious education. It is up to our leader how much we shall promice them." #NT!
 insulindia.6.a: "Accept Their Demands" #NT!
 insulindia.6.b: "Accept Some of Their Demands" #NT!
 insulindia.6.c: "Reject Their Demands" #NT!
  
 insulindia.7.t: "Nationalist Demands Gain Volume" #NT!
 insulindia.7.d: "Nationalist demands have begun to gain volume in our country, helped to be delievered to president Sukarno, through nationalists in the provinsial government. These demands includes the siezing of foreign industries, stronger military control and the banning of radical parties. It is up to our leader how much we shall promice them." #NT!
 insulindia.7.a: "Accept Their Demands" #NT!
 insulindia.7.b: "Accept Some of Their Demands" #NT!
 insulindia.7.c: "Reject Their Demands" #NT!
  
 insulindia.8.t: "Anti-PNI Rally!" #NT!
 insulindia.8.d: "Socialists and Islamists has come together to rally against our regime. They says that the independence of Indonesia only meant independence for the PNI and their members, and that other movements are not getting through their reforms. While there has not been much violence, police has removed people that have been seen as a threat." #NT!
 insulindia.8.a: "Ah! Come an!" #NT!
  
 insulindia.9.t: "Assassination Attempt on President Sukarno!" #NT!
 insulindia.9.d: "Our president Sukarno was on visit to some towns in norhern Sumatra today when someone, from the crowd of citizens watching him on his visit, jumped in front of Sukarno and shot him. The assassin was quickly slain, but the situation of Sukarno is now unknown. There is still a question how severe his injuries are." #NT!
 insulindia.9.a: "Sukarno Survives Minor Injuries!" #NT!
 insulindia.9.b: "Sukarno Sucomes to Major Injuries!" #NT!
  
 insulindia.10.t: "Islamist Riots!" #NT!
 insulindia.10.d: "Islamists in our country riots against what they see as unjust treatment by the provisional government." #NT!
 insulindia.10.a: "Ah! Come an!" #NT!
  
 insulindia.11.t: "Socialist Riots!" #NT!
 insulindia.11.d: "Socialists in our country riots against what they see as unjust treatment by the provisional government." #NT!
 insulindia.11.a: "Ah! Come an!" #NT!
  
 insulindia.12.t: "Nationalist Riots!" #NT!
 insulindia.12.d: "Nationalists in our country riots against what they see as unjust treatment by the provisional government." #NT!
 insulindia.12.a: "Ah! Come an!" #NT!
  
 insulindia.13.t: "We Have Been Pushed Out from Borneo!" #NT!
 insulindia.13.d: "WIP" #NT!
 insulindia.13.a: "At This Stage, We Need to Sign a Peace!" #NT!
  
 insulindia.14.t: "Indonesian Democracy Survives!" #NT!
 insulindia.14.d: "Democracy and Stability has survived this period of political instability. With elections soon up, our country will move past this era  of the provisional government." #NT!
 insulindia.14.a: "It is Time For Election!" #NT!
  
 insulindia.15.t: "First Indonesian Election" #NT!
 insulindia.15.d: "The first ever democratic election is being held in Indonesia. In the counting of the votes that now happens, there seems that three parties comes out at the top, reaching to gain a plurality." #NT!
 insulindia.15.a: "The PKI Assures a Plurality!" #NT!
 insulindia.15.b: "The PNI Retains Their Plurality!" #NT!
 insulindia.15.c: "The NU Assures a Plurality!" #NT!
  
 insulindia.16.t: "Darul Islam Mobilizes to War!" #NT!
 insulindia.16.d: "Radical Islamists in Darul Islam has mobilized against what they sees as a weak and inefficient provisional government. This might be the end of the democratic dream on Indonesia." #NT!
 insulindia.16.a: "We Must Stabalize! Quick!" #NT!
  
 insulindia.17.t: "The Darul Islam Coup!" #NT!
 insulindia.17.d: "Hundreds of members from Darul Islam have now marched upon the capital city of Batavia. They have begun to pick fight with troops loyal to our government, and can very soon be able to take control over the city and the rest of the country. At the same time have the royalty of Indonesia taken the choice to counter this coup with their own. It is still to see what faction will win out at the end." #NT!
 insulindia.17.a: "Darul Islam Sucseeds!" #NT!
 insulindia.17.b: "Indonesian Royals Counter-Coup the Islamists!" #NT!
 insulindia.17.c: "The PNI Retakes Control!" #NT!
  
 insulindia.18.t: "Support Dvindles Away" #NT!
 insulindia.18.d: "As we have rejected the demands our allies has given us in our time of governing, many Nationalists, Socialists and Islamists has come together in secret in order to organize strikes and riots through the country. There have been reports of violence, and some has even been killed in terror attacks." #NT!
 insulindia.18.a: "Blood Spills Upon the Archipelago!" #NT!
  
 insulindia.19.t: "Our Inability to Please Them All" #NT!
 insulindia.19.d: "As we have accepted the demands of both socialists, nationalists and islamists, we have found out that there is not a great possibility to please them all. We are doing so many of the reforms we have promiced without breaking our promices, but our partners are disappointed." #NT!
 insulindia.19.a: "We Should Not Try to Please All People" #NT!
  
 insulindia.20.t: "Cooperation is Possible" #NT!
 insulindia.20.d: "While many of our citizens have opposing views, we have managed to make the socialists, nationalists and islamists in our country happy for now. It seems like we have gotten that sweat middle road between Nationalism, Socialism and Islam - What we will call NASAGSOS." #NT!
 insulindia.20.a: "Indonesian Democracy Will Be Strong!" #NT!
  
 insulindia.100.t: "Indonesia Wish to Join the Entante" #NT!
 insulindia.100.d: "Indonesia has approached us in the intrest of joining the Entante. If we accept them, we will gain an ally in the area, but since it is a formerly British colony, would it be best to reject in order to not anger the brits?!" #NT!
 insulindia.100.a: "They Will be Welcomed!" #NT!
 insulindia.100.b: "We Do Not Need New Members!" #NT!
  
 insulindia.101.t: "France Accept our Request" #NT!
 insulindia.101.d: "The French have accepted our request to join the Entante. We will surely prove that we are an ally they can trust on." #NT!
 insulindia.101.a: "Our Alliance Shall Thrive!" #NT!
  
 insulindia.102.t: "France Reject our Request" #NT!
 insulindia.102.d: "The French have rejected our request to join the Entante. While it is a disturbance, we have assured ourselves that it will be them that are going to lose on their decision." #NT!
 insulindia.102.a: "It is They Who Miss Out!" #NT!
  
 insulindia.103.t: "Indonesia Wish to Join the 3rd International" #NT!
 insulindia.103.d: "Indonesia has approached us in the intrest of joining the Third International. If we accept them, we will gain an ally in the area, one that may help spread soviet influence in Asia. Some have been conserned of letting a former British colony into our alliance, but we should remember that the International is for all people." #NT!
 insulindia.103.a: "They Will be Welcomed!" #NT!
 insulindia.103.b: "We Do Not Need New Members!" #NT!
  
 insulindia.104.t: "The Soviets Accept our Request" #NT!
 insulindia.104.d: "The Soviets have accepted our request to join the Third International. We will surely prove that we are an ally they can trust on." #NT!
 insulindia.104.a: "Our Alliance Shall Thrive!" #NT!
  
 insulindia.105.t: "The Soviets Reject our Request" #NT!
 insulindia.105.d: "The Soviets have rejected our request to join the Third International. While it is a disturbance, we have assured ourselves that it will be them that are going to lose on their decision." #NT!
 insulindia.105.a: "It is They Who Miss Out!" #NT!
  
 insulindia.106.t: "Indonesia Wants to Buy Sulawesi" #NT!
 insulindia.106.d: "After the former Dutch East Indies was divided up between us, Britain and other countries, Sulawesi have been under Japanese control. Now with the British part of the East Indies becoming independent, the new Indonesian state has given us an offer. They want to buy Sulawesi from us and are willing to pay a fair sum of money and recourses. While the proposal is intriging, this sale will also weaken our control in the area." #NT!
 insulindia.106.a: "If the Price is Acceptable Then" #NT!
 insulindia.106.b: "Sulawesi Will be a Japanese Colony" #NT!
  
 insulindia.107.t: "Japan Accept our Purchase" #NT!
 insulindia.107.d: "Tokyo have responded to our offer of purchasing Sulawesi, they accepted our generous offer and have proceeded to coordinate with us with the details." #NT!
 insulindia.107.a: "Welcome Sulawesi Home" #NT!
  
 insulindia.108.t: "Japan Reject our Purchase" #NT!
 insulindia.108.d: "Tokyo have responded to our offer of purchasing Sulawesi, they have refused our offer and have build up defenses around the island incase we try to seize it for ourselves." #NT!
 insulindia.108.a: "Bastards!" #NT!
  
 insulindia.109.t: "Indonesia Wish to Join the Co-Prosperity Sphere" #NT!
 insulindia.109.d: "The Indonesian Government have approached us asking to join our military alliance. Though the lands of Indonesia is ripe of raw resources that we needed, they are fresh from their rebellion and haven't fully recovered and industrialized yet. Should we accept?" #NT!
 insulindia.109.a: "They Will be Welcomed!" #NT!
 insulindia.109.b: "We Do Not Need New Members!" #NT!
  
 insulindia.110.t: "Japan Accept our Request" #NT!
 insulindia.110.d: "WIP" #NT!
 insulindia.110.a: "Our Alliance Shall Thrive!" #NT!
  
 insulindia.111.t: "Japan Reject our Request" #NT!
 insulindia.111.d: "WIP" #NT!
 insulindia.111.a: "It is They Who Miss Out!" #NT!
  
 insulindia.112.t: "Indonesia Wish to Join the Co-Prosperity Sphere" #NT!
 insulindia.112.d: "We have been approached by the delegates from the newly formed [INS.GetNameDef]. They have expressed that they are interested in join our faction. Should we accept?" #NT!
 insulindia.112.a: "They Will be Welcomed!" #NT!
 insulindia.112.b: "We Do Not Need New Members!" #NT!
  
 insulindia.113.t: "[From.GetName] Accepts" #NT!
 insulindia.113.d: "Our friends in the [From.GetName] have accepted our proposal in joining their faction." #NT!
 insulindia.113.a: "Our Alliance Shall Thrive!" #NT!
  
 insulindia.114.t: "[From.GetName] Refuses" #NT!
 insulindia.114.d: "The government of [From.GetName] have refused our proposal in joining our faction." #NT!
 insulindia.114.a: "It is They Who Miss Out!" #NT!
  
 #### Focus Tree #### 
 INS_organize_armed_forces: "Organize the Armed Forces" #NT!
 INS_organize_armed_forces_desc: "" #NT!
  
 INS_establish_an_air_force: "Establish an Air Force" #NT!
 INS_establish_an_air_force_desc: "The KNIL used to have an air force, and while only one Indonesian pilot had official training, Adusicipto has been training new Indonesian pilots. Let us take notes and establish the Indonesian Air Force to handle the war in the air." #NT!
 INS_our_own_air_bases: "Our Own Air Bases" #NT!
 INS_our_own_air_bases_desc: "We have a defenitive lack of airbases as an archipelago constructing more airbases will bolster our aerial defense within our own borers." #NT!
 INS_purchase_new_air_crafts: "Purchase New Air Crafts" #NT!
 INS_purchase_new_air_crafts_desc: "Building an air force from the ground up takes time. We should try to purchase old planes from the Japanese in the name of Asian cooperation." #NT!
 INS_study_air_doctrines: "Study Air Doctrines" #NT!
 INS_study_air_doctrines_desc: "If we are to build an air force that is taken seriously in the world, we should study doctrinal advances in this sector." #NT!
 INS_focus_on_fighters: "Focus on Fighters" #NT!
 INS_focus_on_fighters_desc: "Without fighters, our airspace is defenceless. We should invest in fighter planes to make sure we can retain sovereignty over our air." #NT!
 INS_focus_on_bombers: "Focus on Bombers" #NT!
 INS_focus_on_bombers_desc: "Bombers are ideal to cripple the enemy industry and infrastructure. They should make up the bulk of our nation's air force with only a small squadron of fighters to defend them on their missions." #NT!
  
 INS_build_an_army: "Build an Army" #NT!
 INS_build_an_army_desc: "If we are to secure our independence, we need an army. We have enough manpower but finding the needed guns will definitely be a challenge." #NT!
 INS_our_own_tactics: "Our Own Tactics" #NT!
 INS_our_own_tactics_desc: "We should invest in researching doctrines as a guiding hand to our army in defeating our enemies, who undoubtedly invest in doctrinal advances too." #NT!
 INS_guerilla_fights: "Guerilla Fights" #NT!
 INS_guerilla_fights_desc: "We can't beat our enemies in head-on battle, at least not yet. A series of hit-and-run attacks from the jungle - guerrilla tactics - will be necessary to wear the enemy out so we can in turn take strategic points" #NT!
 INS_army_of_people: "An Army of People" #NT!
 INS_army_of_people_desc: "With these technical advances, we can say that our military is in a significantly better state than a few years ago. With such a capable military, Indonesia's military looks bright!" #NT!
 INS_adopt_foreign_tactics: "Adopt Foreign Tactics" #NT!
 INS_adopt_foreign_tactics_desc: "" #NT!
 INS_update_gun_designes: "Update the Gun Designes" #NT!
 INS_update_gun_designes_desc: "If we are to become a nation famed for its army, we should keep our infantry forces in mind too. Our guns are severely outdated, sometimes dating back to the Weltkrieg or even earlier. Time to change that!" #NT!
 INS_mechanized_research: "Mechanized Research" #NT!
 INS_mechanized_research_desc: "" #NT!
 INS_artillary_support: "Artillary Support" #NT!
 INS_artillary_support_desc: "We should back our armies up with artillery, pieces of which can be strategically placed on mountains to stop our enemies in their tracks as they get barraged in the jungle." #NT!
 INS_jungle_warfare: "Jungle Warfare" #NT!
 INS_jungle_warfare_desc: "" #NT!
 INS_meet_them_with_force: "Meet Them With Force" #NT!
 INS_meet_them_with_force_desc: "" #NT!
 INS_army_of_experience: "An Army of Experience" #NT!
 INS_army_of_experience_desc: "We should take inspiration from the KNIL. While their goals - maintaining Dutch and British tyranny over Indonesians - are despicable, we should definitely take note of their splendid organisation and discipline." #NT!
 INS_mountainer_research: "Mountainer Research" #NT!
 INS_mountainer_research_desc: "Indonesia is home to many mountains, volcanoes even. We should invest in special forces specifically trained to fight in alpine conditions to improve both our defence and offence." #NT!
  
 INS_establish_an_navy: "Establish an Navy" #NT!
 INS_establish_an_navy_desc: "Indonesia is a nation of islands, so long as we don't have a navy, we can hardly prevent the enemy from cutting Java and Sumatra off from the rest of the archipelago. Let us build a navy to keep the nation together!" #NT!
 INS_purchase_new_ships: "Purchase New Ships" #NT!
 INS_purchase_new_ships_desc: "Building a navy from scratch will be a severe challenge. We should instead try to entice foreign powers to help us build the navy we so desire." #NT!
 INS_expand_naval_ports: "Expand the Naval Ports" #NT!
 INS_expand_naval_ports_desc: "We should make sure that virtually every island has at least some kind of naval guardianship. We can hardly be taken seriously with a numerically limited navy." #NT!
 INS_destroyer_research: "Destroyer Research" #NT!
 INS_destroyer_research_desc: "" #NT!
 INS_focus_on_cruisers: "Focus on Cruisers" #NT!
 INS_focus_on_cruisers_desc: "" #NT!
 INS_focus_on_submarines: "Focus on Submarines" #NT!
 INS_focus_on_submarines_desc: "Let us build our navy of subsurface vessels such as submarines. In the Weltkrieg they arguably won Germany the war and our former colonial master was specialised in them as well. Let us harass their shipping to make it too expensive to attack us." #NT!
