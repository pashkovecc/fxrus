 INS_promote_mahaenism: "Promote Marhaenism" #NT!
 INS_promote_mahaenism_desc: "Marhaenism is the basis of our ideology: a pragmatic form of socialism emphasising national unity, culture and anti-imperialism. Let us stand together in the name of the poor farmer Marhaen and all the other Marhaens in Indonesia." #NT!
