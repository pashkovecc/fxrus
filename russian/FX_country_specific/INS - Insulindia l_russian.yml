 INS_mission_to_japan: "Mission to Japan" #NT!
 INS_mission_to_japan_desc: "Japan brings inspiration: they were Asia's rising sun who managed to become on par with the westerners; they were one of the few nations that managed to avoid the colonial onslaught, and now they seek to spread their influence throughout Asia. We should join this project against western incursion in the eastern sphere!" #NT!
