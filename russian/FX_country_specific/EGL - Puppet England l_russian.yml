 ### Ideas 
 EGL_war_reparations: "War Reparations" #NT!
 EGL_war_reparations_desc: "The collaborationist government is burdened with the responsibility of paying reparations to the occupying powers as part of the post-war settlement. These payments, extracted from the nation's economy, serve as a constant reminder of the country's subjugation and hinder efforts to rebuild. While the government attempts to frame these reparations as a necessary step toward stability, they remain a source of resentment among the populace, further straining the fragile legitimacy of the regime." #NT!
 EGL_shell_shocked: "Shell Shocked" #NT!
 EGL_shell_shocked_desc: "The sudden and catastrophic defeat of the British Empire has left the nation reeling in disbelief. The once-mighty empire, which spanned the globe, now lies shattered, and its people struggle to come to terms with the loss of prestige, power, and security. This collective trauma has created a pervasive sense of uncertainty and despair, undermining national morale and making it difficult for the collaborationist government to rally the population. The scars of this defeat linger in every corner of society, a constant reminder of the empire's fall from grace." #NT!
  
