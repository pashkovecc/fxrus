 NOR_join_entente: "Joining the Entente" #NT!
 NOR_join_ipa: "Joining the Imperial Protection Alliance" #NT!
  
 #### Others #### 
  
 NOR_FUHRERREICH_DESC: "Since independence in 1905, Norway stayed neutral in the Great War. But with class differences growing under the war, and a more and more unpopular monarchy, marxism was seen as a solution to the people. The Republic was established in 1926, and in 1930, a socialist coalition government took the lead. It is just to see if Norway will continue the path of socialism, or go back to the monarchy." #NT!
  
 POLITICS_MARTIN_TRANMAEL_DESC: "§YLeader Description\nBorn:§! §gJune 27th, 1879, in Melhus, Sør-Trøndelag§!\n§YPolitical Career:§! §gMartin Tranmæl came from a middle-sized farm in Melhus, and rose to become the leader, of not just the Norwegian labour movement, but also the Republic. Not many can say that they have removed a country's monarchy, but Tranmæl can. He is one of the greatest speakers that the labour movement have, some even say that his speeches holds his party together and prevented it from dividing itself up. But Tranmæl is also leading a republic that has for years struggled with monarchist and anti-socialist riots, and he is afraid to imagine how the Norwegian Republic will fare without him leading it.§!\n\n§RModerate Socialist§!" #NT!
 POLITICS_JOHAN_LUDWIG_MOWINCKEL_DESC: "§YLeader Description\nBorn:§! §gOctober 22nd, 1870, in Bergen, Hordaland§!\n§YPolitical Career:§! §gJohan Ludwig Mowinckel is a shipping magnate, statesman and philanthropist, a former Prime Minister, and the reigning President of Norway. Born into an old merchant family in Bergen, it was natural for him to grow up to become a foreign minister and an advocate of free trade. A Liberal, Mowinckel is opposed to both the Valkism of Germany and the socialism of both the Soviet Union and the Labour Party. With his background in the foreign field, there are hopes that his presidency will see increased cooperation with our neighbors and the democratic powers of the world.§!\n\n§OLiberal§!" #NT!
 POLITICS_INGOLF_ELSTER_CHRISTENSEN_DESC: "§YLeader Description\nBorn:§! §gMarch 28th, 1872, in Førde, Sogn og Fjordane§!\n§YPolitical Career:§! §gIngolf Elster Christensen has a history as a jurist, military officer and county governor. Coming from the rural county of Sogn og Fjordane, he has risen to the highest position in the country. Born in 1872 to a captain, Christensen studied in the Bergen Cathedral School and went to the Military Academy before serving as county governor, first for Sogn og Fjordane, than of Oslo and Akershus, until he stepped down to persue the presidency. A Conservative with a background in justice and defence, preserving law and order will be an important task for the President.§!\n\n§CConservative§!" #NT!
 POLITICS_EINAR_GERHARDSEN_DESC: "§YLeader Description\nBorn:§! §gMay 10th, 1897, in Asker, Akershus§!\n§YPolitical Career:§! §gEinar Henry Gerhardsen, born as Einar Henry Olsen. From a background as a road worker and an activist in the labour movement, he now sits as the President of Norway. Born in Asker to a modest working class family, Gerhardsen found it natural to become a member of the labour movement. This also led him to become a member of Martin Tranmæl's inner circle in the early 1920s, serving almost loyally to Mr. Tranmæl. While starting of as an radical, Gerhardsen have moved towards a more moderate position in the Labour Party. Many see him as a continuation of Tranmæl's legacy, but could also found a legacy of his own.§!\n\n§RModerate Socialist§!" #NT!
 POLITICS_HAAVARD_LANGSETH_DESC: "§YLeader Description\nBorn:§! §gJuly 7th, 1888§!\n§YPolitical Career:§! §gHaavard Langseth is a civil engineer, organizer, editor and one of the radical socialists that finds home in the Labour Party. A communist at heart, Langseth is a supporter of Soviet-style socialism, and was one of the main founders of the Friends of the Soviet Union movement. This have also made his opponents, and even moderates inside the party, afraid that he is no more than a Soviet puppet. With his rise to the presidency, Langseth can either prove them right by furthering Norway's relation to the Soviet Union, or build a more independent socialist society.§!\n\n§RRadical Socialist§!" #NT!
 POLITICS_JOHAN_NYGAARDSVOLD_DESC: "§YLeader Description\nBorn:§! §gSeptember 6th, 1879, in Hommelvik, Sør-Trøndelag§!\n§YPolitical Career:§! §gJohan Nygaardsvold is yet another working class Labour leader, with a background as a lumber mill worker. After a brief career in America, were he also acted as an agitator for the IWW, he returned to Norway in 1907. Nygaardsvold became a member of the Labour Party, then the Social Democrats, before the two parties reunited. While Nygaardsvold have been reluctant to hold public office, he has accepted the nomination to be the party's presidential candidate. With his moderate views, bordering to social democracy, he have gathered opposition from the radical faction of the party. However, he is a welcoming face for the opposition.§!\n\n§RSocial Democrat§!" #NT!
 POLITICS_ARTHUR_NORDLIE_DESC: "§YLeader Description\nBorn:§! §gFebruary 2nd, 1883, in Kristiania (Oslo)§!\n§YPolitical Career:§! §gArtur Nordlie is a contractor and sport manager that have served many years as a representative in the Storting for the Conservative Party. Born in the capital of Oslo, then Kristiania, Nordlie came into politics through service in artisan organizations. Nordlie has also been active in local politics and as an important figure in establishing football and sports federations, both nationally and locally. With Ingolf Elster Christensen aging, Nordlie have become the obvious candidate to represent the Conservative Party in the presidency.§!\n\n§CConservative§!" #NT!
 POLITICS_NILS_TRAEDAL_DESC: "§YLeader Description\nBorn:§! §gNovember 29th, 1879, in Sunndal, Møre og Romsdal§!\n§YPolitical Career:§! §gNils Trædal is a priest and one of the founding members of the Farmers' Party. Born in Sunndal in Møre og Romsdal, Trædal is a farmers' son, who became first a chaplain, then a parish priest. Politically, Trædal started as a member of the Liberal Party before becoming a member of the Farmers' Party at its founding in 1920. Trædal have served as a representative, member of government and parliamentary leader, before now being elected to the Presidency of Norway. Popularily seen as a compromice candidate, it is to see if he can be a unifying figure.§!\n\n§GAgrarian§!" #NT!
 POLITICS_KING_HAAKON_VII_DESC: "§YLeader Description\nBorn:§! §gAugust 3rd, 1872, in Charlottenlund Castle, Denmark§!\n§YPolitical Career:§! §gKing Haakon VII is the story of a king elected by the people, who was also overthrown by the people. Born as Prince Carl of Denmark, the son of the Danish king, Carl was given the throne of the newly independent Norway in 1905, only losing it 20 years later, being forced into exile. While first being a unifying figure with respect for the constitutional monarchy, the people failed to show the same respect for the institution like he did. This influenced King Haakon to gradually lose respect for the principles of modern constitutional monarchy. In recent years, King Haakon has adopted the idea of Royal Paternalism, seeing the missteped republican Norway as a project that can only be saved by a Paternal Monarch, Himself.§!\n\n§WRoyal Paternalist§!" #NT!
 POLITICS_KING_OLAV_V_DESC: "§YLeader Description\nBorn:§! §gJuly 2nd, 1903, in Appletown House, the United Kingdoms§!\n§YPolitical Career:§! §gKing Olav V was just a child when his father, Prince Carl, became King Haakon VII of Norway. Growing up in Norway, the crown prince was nearly heartbroken when he had to leave the newly formed republic in 1926. While he was allowed to see Norway for his marriage in 1929, since then, he has been uninvited by the socialist governments of the early 1930s. While the republic gave Olav a disstain for the consitutional monarchy at first, after some years of exile, Olav began to recover from the loss of his homeland in Norway. He has lived many years in England, with visits to the Americas in between. Returning to Norway, Olav hopes that he can be a king for the people and prevent another 1926.§!\n\n§WConstitutionalist§!" #NT!
 POLITICS_RAGNVALD_HVOSLEF_DESC: "§YLeader Description\nBorn:§! §gSeptember 19th, 1872, in Kristiania (Oslo)§!\n§YPolitical Career:§! §gRagnvald Hvoslef is a military officer and politician, and a central figure to steer the direction of Norway, even if he himself only rules for a few days. Born in Christiania, what is today Oslo, Hvoslef has served as a major, military attache and even chief for the Royal Guards. This before he left the Armed Forces in 1926. The leader of the paramilitary white guard Samfundsvernet, he was essential in the New Year Coup against the Republican government of the socialist Labour Party. It is now mostly up to him who is going to continue to lead Norway. However, it is not going to be a socialist ever again.§!\n\n§gNationalist§!" #NT!
 POLITICS_VIDKUN_QUISLING_DESC: "§YLeader Description\nBorn:§! §gJuly 18th, 1887, in Fyresdal, Telemark§!\n§YPolitical Career:§! §gVidkun Quisling is a military officer, former humanitarian relief worker and a strong opponent of socialism. Born in Telemark, Quisling was the son of a Church of Norway pastor. Quisling proved himself talented in the humanities and natural sciences, and eventually took an education in the military where he achieved the best result at the college. Through his life, Quisling have married twice, both to Russian women, partaken in humanitarian work with national hero Fridtjof Nansen, and was one of the most avid opponents to the Republic and to socialism. Now, life has placed him as the head of a new Norwegian state, anointed the savour of not only Norway, but all the Nordics.§!\n\n§gNationalist§!" #NT!
 POLITICS_STEIN_BARTH_HEYERDAHL_DESC: "§YLeader Description\nBorn:§! §gJuly 12th, 1909, in Stamnes, Nordland§!\n§YPolitical Career:§! §gStein Barth-Heyerdahl has a background as an art painter and editor. Born in Nordland, the young Barth-Heyerdahl became a local scout leader and eventually joined the Fatherland Leauge. While set to study law, Barth-Heyerdahl spent more time pursuing politics, and during his years in Oslo, he left the Church of Norway and became a neo-pagan. Barth-Heyerdahl was invited at the founding of Nasjonal Samling and became a figure of the radical wing of the party that first surrounded the Völkish-inspired Eugen Nielsen. With neo-pagan and Pan-German views, criticism towards the Quislingite wings conservative and bourgeois tendencies, along with belief in racialism, Barth-Heyerdahl naturally became inspired by the German Valkism of Adam Dressler.§!\n\n§GValkist§!" #NT!
 POLITICS_HANS_SOLGAARD_JACOBSEN_DESC: "§YLeader Description\nBorn:§! §gFebruary 10th, 1901, in Flekkefjord, Vest-Agder§!\n§YPolitical Career:§! §gHans Solgaard Jacobsen is a journalist and former ship broker, who would come to lead the circle of NS members who would manage to take down Vidkun Quisling. After his upbringing in Moss, where his father ran a shipping company, Jacobsen would travel to Germany for his social economics education. Staying most of the 1920s in Germany, here he was influenced by Pan-German, National-Socialistic ideas and got emotionally attached to the struggles of post-war Germany, especially through the litterature of a war veteran named Adam Dressler. A quick stint in a Ford factory in Detroit also helped in shaping his anti-capitalist views.\n\nBack in Norway, Jacobsen became affiliated with the radical Völkish-inspired wing of NS, led by Eugen Nielsen. After taking over from Nielsen, Jacobsen would mend it into a Pan-German, anti-capitalist and anti-Christian opposition group to Quisling. In addition, he has taken more and more inspiration by that Dressler guy, with the sucsess of Valkism in Germany.§!\n\n§GValkist§!" #NT!
  
