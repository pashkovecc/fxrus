 #### Ideas #### 
  
 NOR_socialism_surrounded_idea: "Socialism Surrounded" #NT!
 NOR_socialism_surrounded_idea_desc: "We, the Republic of Norway are ruled by a socialist government, surrounded by conservative and nationalist regimes. To the west, the British Empire rules our seas. In the south, the Danes are waiting to attack and give the throne to the former king. In the east, the Swedes see a chance to reassemble the union, but with them leading it all. And in the north, the White Finns are rebelling against the Soviet Union. We need to preach unity and defence in a time where we truly are surrounded by countries wanting us dead." #NT!
 NOR_monarchist_right_idea: "The Monarchist Right" #NT!
 NOR_monarchist_right_idea_desc: "Since the abolition of the monarchy in 1926, the liberals and conservatives have been the main supporters for pro-monarchist choices. This was shown when president Hambro allowed the marriage between the crown prince, Olav, and the Swedish princess, Märtha, to take place in the capital of Oslo. While the bourgeois parties have played by the 1926 constitutional reform, they are not scared of showing their monarchist positions. Many leaders in AP want pro-monarchist actions outlawed and be sentenced to prison, to crush this move!" #NT!
 NOR_monarchist_right_idea1: "The Monarchist Right" #NT!
 NOR_war_on_samfundsvernet_idea: "War on Samfundsvernet" #NT!
 NOR_war_on_samfundsvernet_idea_desc: "Samfundsvernet was created by the bourgeoisie as a weapon against the working class in 1923. This hasn’t changed since then. They were outlawed on New Year's eve of 1931, but they have gone underground. Lead by NS officers, they are a great danger to the country and have many times tried to start a civil war in the country in the last five years. They are still a threat to the people and the state, and should be dealt with to prevent a civil war or a coup!" #NT!
 NOR_war_on_samfundsvernet_idea1: "War on Samfundsvernet" #NT!
 NOR_samfundsvernets_rule_idea: "Samfundsvernet is Ruling Norway" #NT!
 NOR_military_deserters_idea: "Military Deserters" #NT!
 NOR_military_deserters_idea_desc: "Many soldiers have deserted the military in opposition to the undemocratic choice the government made." #NT!
 NOR_naval_deserters_idea: "Naval Deserters" #NT!
 NOR_effect_london_crash_idea: "Effects of the London Crash" #NT!
 NOR_effect_london_crash_idea_desc: "The London Crash is affecting our economy and industrial output." #NT!
  
