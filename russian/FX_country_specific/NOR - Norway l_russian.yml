 #### Events #### 
  
 nor.0.t: "The Republic of Norway" #NT!
 nor.0.d: "Norway became independent from Sweden in 1905, exiting the union that was established between these nations. One of the first questions the people of Norway had before themselves was if we should become a constitutional monarchy or a republic. The people then, all of the men 25 years old and older, voted for the monarchy. Prince Carl of Denmark came to Norway as King Haakon VII.\n\nBut not everyone was okay with the monarchy. When the Great War waged on, the class differences helped the worker movement to grow in our country and, after the war, the working class had become poorer and the upper class richer. With the ideas of Karl Marx, it was all laid down for revolution. Many can say it started with Denmark's turn into a dictatorship under their king. The fact that this king was King Haakon's brother was reason enough to get the workers up into a strike. The Oslo Strike was a protest against capitalism and monarchy. It was for the most part peaceful, but where it got violent was proof for many politicians in Arbeiderpartiet that the state and police were after them.\n\nThis was also the time when Martin Tranmæl emerged in Norwegian politics. He was the front-runner for the abolishment of the monarchy in 1926 and was a natural candidate for president. He represented the main opposition towards president Hambro. In 1930, Martin Tranmæl, for Arbeiderpartiet, won the presidential election while his comrades formed government.\n\nSince then, Arbeiderpartiet has yielded huge power. But their power is not eternal. There are potential enemies all around the nation, Sweden, Denmark and the emerging power in Germany. At the same time has monarchism and nationalism risen in the country. There is an increasing danger of militant groups taking power. With all the changes in the world, the upcoming election can be a new turning point in Norwegian history." #NT!
 nor.0.a: "Evig og Tro til Dovre Faller!" #NT!
 nor.1.t: "17th of May - Constitution Day" #NT!
 nor.1.d: "It is the 17th of May, constitution day. This day is marked every year by both children and adults marching in the towns, waving their flags. All this is for celebrating the day when our constitution was signed into law, 17th of May 1814. Since then, the constitution has been changed. But the core material has mostly survived, making it one of the oldest constitutions in the world." #NT!
 nor.1.a: "Hurra! Hurra! Hurra!" #NT!
 nor.2.t: "17th of May - Constitution Day" #NT!
 nor.2.d: "It is the 17th of May, constitution day. This day is marked every year by both children and adults marching in the towns, waving their flags. All this is for celebrating the day when our constitution was signed into law, 17th of May 1814. Since then, the constitution has been changed. But the core material has mostly survived, making it one of the oldest constitutions in the world." #NT!
 nor.2.a: "Hurra! Hurra! Hurra!" #NT!
 nor.3.t: "London Crash Affects us too!" #NT!
 nor.3.d: "Some days ago, the stock market in London crashed. Some of the members of the government and many in society said that we would not be affected. But we did. After members of the Continental Entente, today stopped all investment and all trade with us, we are not completely ready to deal with this problem. Already has unemployment risen and the state-owned companies are demanding more money and resources. The enemies of the government have already begun to blame us. We must just wait what the news will be filled with tomorrow." #NT!
 nor.3.a: "Tranmæl Holds a Speech Promising Growth and no ties with Capitalists!" #NT!
 nor.3.b: "Christensen Holds a Speech Warning Against Government Interference!" #NT!
 nor.3.c: "Quisling Holds a Speech Blaming the Socialists to have ruined Norway!" #NT!
 nor.4.t: "Crisis in the Economy" #NT!
 nor.4.d: "It seems that the unemployment rate has stopped going up and that we have been lucky in contrast to the situation in Britain. But it is not perfect here either. The worst is that the election is up in just a few days, and many say that this incident will sway the voters away from Martin Tranmæl and Arbeiderpartiet." #NT!
 nor.4.a: "It can't get worse at least!" #NT!
 nor.5.t: "Landslaget for Norske Jordbruksklubber" #NT!
 nor.5.d: "Since the 1920s there has always been an idea to get the youth interested in agriculture. The idea itself comes from the American organization 4-H. The rural clubs that have grown have now got together to organize. While some radicals see this as agrarian propaganda, president Tranmæl has shown his support for this." #NT!
 nor.5.a: "Clear Head, warm Heart, good Hands and good Health!" #NT!
 nor.6.t: "Rockfall in Loenvatnet" #NT!
 nor.6.d: "Bad news has arrived from the towns of Sogn og Fjordane Amt. Not so many hours ago, a huge bit of the mountain Ramnefjellet slid down into the lake, creating a 70-meter high flood wave that destroyed many nearby farms and killed 74 peoples. Many peoples are now waiting for the president to give a speech, showing his concern for the affected families and friends." #NT!
 nor.6.a: "Rest in Peace!" #NT!
 nor.7.t: "Alt for Kongen's Peoples March" #NT!
 nor.7.d: "When news from England came, giving the news of the birth of Prince Harald, son of Crown Prince Olav, the monarchists were not late to organize protest against the Republic. Lead by Rudolf Ræder, once leading member of Frisinnende Venstre before the party merged into Høyre, and now self-proclaimed leader of the monarchist movement, the monarchists marched in the capital of Oslo, mocking both the republic and the Oslo strike. What are we going to do about this?" #NT!
 nor.7.a: "They will be tired soon." #NT!
 nor.7.b: "Arrest so many you can!" #NT!
  
 nor.10.t: "Election Campaign Begins" #NT!
 nor.10.d: "When Norway became a republic, the president got the job to declare when an election campaign should begin before the election. Today, president Tanmæl has proclaimed that the election campaigns for the 1936 election can begin. Speeches will be held and posters will be hung up.\n\nArbeiderpartiet will this year focus on healing the divisions on the left, but wings of the party have a different program, that may make the party break apart. Venstre will campaign for the reprivatization of 'stolen' businesses and their own welfare plan. They hope to get both liberals and social democrats to support them. Høyre will campaign for the privatizing of important businesses and the monarchy. They wish to get conservative liberals and nationalists to support them on this. There are minor parties, but these are the most important." #NT!
 nor.10.a: "Interesting Every Time." #NT!
 nor.11.t: "Nasjonal Samling Involved in the Election" #NT!
 nor.11.d: "The political party Nasjonal Samling has for the last elections played a minor role, sometimes not getting involved in them at all. But today Vidkun Quisling, the party's leader, held a speech in front of Stortinget, our national assembly. He was joined by some of his party comrades and attracted around 200 passersbys. Quisling declared that he will be more involved in the election, and if he and his party are not allowed to participate, it would show the government's undemocratic nature. The police are ready to arrest Quisling after his speech." #NT!
 nor.11.a: "Arrest Him!" #NT!
 nor.11.b: "Let us Not Prove Our Undemocratic Nature to Him!" #NT!
 nor.12.t: "Radical Socialists are Protesting" #NT!
 nor.12.d: "Because of our acceptance over Quisling's speech that was held some days ago, many radical socialists, labour unionists and communists are protesting this in front of Stortinget. Many of them want to see the right-wing parties banned, with their posters saying: 'No Quisling, No Ræder, No Mogens!'" #NT!
 nor.12.a: "Maybe a Ban could Work." #NT!
 nor.13.t: "Samfundsvernet Protest Quisling's Arrestation" #NT!
 nor.13.d: "Because of the recent arrest of Nasjonal Samling leader Vidkun Quisling, many of those who have been suspected to be members of the right-winged militant group called Samfundsvernet, have protested in the streets of our capital city and surrounding towns. They are also spreading 'lies' about our government. That we arrest nationalists and try to arrest or assassinate conservative voices in parliament. Police have already been sent in." #NT!
 nor.13.a: "Maybe we should Strengthen this Fight!" #NT!
 nor.14.t: "Election Day" #NT!
 nor.14.d: "The time for campaigning is over. The election date is here finally. Today, we will see the will of the people play out. Some has said that this could become another victory for Arbeiderpartiet. Martin Tranmæl is still an inspiring figure in Norwegian politics. He is certain to win a third term as president, or give his position to a new, hopefully as uniting, figure. Others have faith that a new government will be formed. Both Venstre and Høyre has good chances this year, and many have blamed the Madsen government for the economic instability. Some would like to see Mowinckel or Christensen as the new president in Norway.\n\nThe president also has the power to cancel the election if he sees the situation to hold one to dangerous. But this choice would be very unpopular, and many believe it would only help the right-wing in our country gaining support. Let us see what's happens." #NT!
 nor.14.a: "While Losing some Support, Arbeiderpartiet still Wins." #NT!
 nor.14.b: "Stealing votes from AP and Høyre has made Venstre victorious." #NT!
 nor.14.c: "Høyre managed to win both the centre and the right." #NT!
 nor.14.e: "Stop this election! It weakens National Security!" #NT!
 nor.15.t: "Arbeiderpartiet's New Government" #NT!
 nor.15.d: "Arbeiderpartiet has won the election and it is now time to choose who shall lead the government. There are two possible option, Peder Furubotn, who wants closer ties with the internationalist vanguardists and to spread socialism in Scandinavia, or Aksel Zachariassen, who wants to heal the bond between the party and the social democrats, and wants to protect democratic values." #NT!
 nor.15.a: "The Radical Furubotn!" #NT!
 nor.15.b: "The Moderate Zachariassen!" #NT!
  
 nor.16.t: "Mass Protests Against the Canceled Election!" #NT!
 nor.16.d: "Canceling the election seems to have been a pretty bad idea. People all over the country are in protest, and places in the conservative Western Norway are in open revolts. There are also revolts beginning to grow in other regions. Many are now turning to the radical right to make them 'save' Norwegian democracy. Nearly everything is set for a coup or civil war." #NT!
 nor.16.a: "May God Help Us!" #NT!
  
 nor.17.t: "Military Deserters" #NT!
 nor.17.d: "Many more of our soldiers have now declared that they do not want to protect the government and their actions. Many conservative, liberal and nationalist soldiers have now deserted, some joining Norsk Samfundsvern." #NT!
 nor.17.a: "Can we Even Punish Them?!" #NT!
 nor.18.t: "Naval Deserters" #NT!
 nor.18.d: "Not only has military soldiers from the army begun to desert. Now even naval marines and low ranking officers have deserted. There is even a coastal patrol that has sailed to Denmark and sworn loyalty to the former king." #NT!
 nor.18.a: "What's Next? The Air Force?!" #NT!
 nor.19.t: "Party Divides!" #NT!
 nor.19.d: "Peder Furubotn has recently declared that he will lead the communist and radical parts of our party out and form a new party. He believes that Arbeiderpartiet is a sinking boat. Many of our most radical politicians and supporters have now left us!" #NT!
 nor.19.a: "Bastards!" #NT!
 nor.20.t: "Christmas Uprising" #NT!
 nor.20.d: "It seemed that the Christmas time would become a peaceful event. But we were wrong. Cities in West and South has started an uprising. Thousands of people march in the street against the government and president Tranmæl." #NT!
 nor.20.a: "I'm Glad we Don't have Opinion Polls" #NT!
 nor.21.t: "Uprising in Oslo" #NT!
 nor.21.d: "Protests has been going on the last months, but now, the whole city of Oslo was consumed by the fire of revolts. Samfundsvernet has been mobilized, and with the support of many angry men and women, they have started a major revolt. Many of our army units have either deserted to these enemies, or not responding to orders at all.\n\nAt the castle, the guards have either joined the protest or been murdered by rebels. Stones are already been thrown at the windows and into the presidential residence. Then did..." #NT!
 nor.21.a: "...Samfundsvernet break through the front door and arrest Tranmæl!" #NT!
 nor.22.t: "New Government in Norway" #NT!
 nor.22.d: "Norsk Samfundsvern has couped Norway and its time to find out what kind of government we are going to adopt. Some of our members want to give power to the conservatives, but there is also many that want us to invite back the king and let him rule. Lastly, there is the faction that wants to let Nasjonal Samling take power and control the country. We have to see what will be voted on." #NT!
 nor.22.a: "Democracy!" #NT!
 nor.22.b: "Monarchy!" #NT!
 nor.22.c: "Nationalism!" #NT!
  
 nor.23.t: "Understanding Towards the Cancellation" #NT!
 nor.23.d: "While many is angry that we canceled the election, understanding towards the action has begun to rise in the population. People begin to understand that Norsk Samfundsvern is not something better than the government." #NT!
 nor.23.a: "We Promise Election in 1940" #NT!
 nor.24.t: "Peaceful Christmas" #NT!
 nor.24.d: "We were afraid for protests and rebellions around Christmas time, but it has been relatively very peaceful. People do not want to rebel in the holiday season, and most of them have taken the choice to stay at home and be with their families." #NT!
 nor.24.a: "Good Choice!" #NT!
 nor.25.t: "Coup Prevented" #NT!
 nor.25.d: "This new years day, the militant group Norsk Samfundsvern mobilized and marched on the capital. While many military units have deserted, the ones in Oslo stayed loyal and managed to stop the paramilitary group from reaching the parliament or the castle. They are also losing the support of the population, and the people of Oslo has given information about where these traitors are hiding. The president has..." #NT!
 nor.25.a: "...ordered to rout out the Militants in Oslo!" #NT!
 nor.26.t: "Agreements with Deserters" #NT!
 nor.26.d: "Many of those that have deserted from our armed forces want to talk with us about an agreement. Some of the party's members don't want us to make an agreement with deserters, but president Tranmæl is open to set an agreement. He and many moderates see it as something essential to stabilize the country and bring on peace and prosperity." #NT!
 nor.26.a: "We Need to Heal our Country and Nation!" #NT!
  
 nor.30.t: "Strengthen Campaigns Against Internal Enemies" #NT!
 nor.30.d: "The president has ordered a strengthen campaign against the actions of internal enemies such as the monarchists and Norsk Samfundsvern. Our leadership believes this will finally start an era of inner peace and prosperity." #NT!
 nor.30.a: "Let's Begin!" #NT!
 nor.31.t: "A New Monarchy Referendum" #NT!
 nor.31.d: "It is over a decade ago we abolished the monarchy. While some believe that was a good option, some of us are not so sure anymore that this was the right choice. Our government will have a new referendum on this topic." #NT!
 nor.31.a: "Majority for the Monarchy" #NT!
 nor.31.b: "Majority for the Republic" #NT!
 nor.32.t: "Establishment of Independent Radios" #NT!
 nor.32.d: "The monopoly on the radio is now officially abolished. From now on, you can send radio signals from inside the country without being arrested for it. Another thing is that the people are allowed to listen in on foreign radio, while this was seen as treason under president Tranmæl." #NT!
 nor.32.a: "Let the People Speak!" #NT!
 nor.33.t: "Long Live King Olav V" #NT!
 nor.33.d: "We were lucky when the former crown prince accepted to come back to the nation. It was similar to when king Haakon first came to our nation. Members of Norsk Samfundsvern and Alt for Kongen met him on the dockyard, welcoming him, just like prime minister Michelsen welcomed king Haakon in 1905. The new king's coronation is not so long away!" #NT!
 nor.33.a: "God Bless king Olav V!" #NT!
 nor.34.t: "Long Live King Haakon VII" #NT!
 nor.34.d: "Our glorious king, our monarch, has accepted to come back to Norway from Denmark. When he came, he was met by members of Norsk Samfundsvern, Alt for Kongen and Nasjonal Samling. Even Vidkun Quisling and Ragnvald Hvoslef were there to honour King Haakon’s arrival, the latter of which was to safely transport king Haakon to the palace. A new coronation will soon be held." #NT!
 nor.34.a: "God Bless King Haakon VII" #NT!
 nor.35.t: "The King Meets with Quisling" #NT!
 nor.35.d: "Our king has recently arranged a meeting with Vidkun Quisling. The subject of the meeting was to arrange an agreement between the king and Nasjonal Samling to have the political party to help the king governing the country. It is truly both a dangerous and an inspiring agreement." #NT!
 nor.35.a: "For the King and the Nation" #NT!
 nor.36.t: "Nasjonal Samling and Valkist Factionalism" #NT!
 nor.36.d: "Since Vidkun Quisling and his Nasjonal Samling came to power, rifts have begun to be sown between different factions inside the party, with the growth of Valkist-inspired opposition groups who doesn't think that Quisling is doing enough. They are also critical towards a leadership that favors bourgeoisie capitalists over workers, venerate Quisling without good reason, and kowtow to a Christian Church that has showned their illoyalty towards Nasjonal Samling time and time again.\n\nIt is finally time to do away with the opposition. Quisling has called an assembly for the party. One with the goal to rid the country of his most ardent critics. With the result of this assembly tallied, we can see that..." #NT!
 nor.36.a: "...Quisling Manages to Purge the Party" #NT!
 nor.36.b: "...the Opposition Overthrows Quisling" #NT!
 nor.37.t: "Election to the King's Council" #NT!
 nor.37.d: "Our new king, Olav V, has set into system, a new kind of democracy in our realm. He will continue to bear much of the powers of ruling in Norway, but his Council will be no longer picked by him, but the people. He and his loyalists are, after all, fighting for the people of Norway! We will now see who will be the hand of the king.\n\nC. J. Hambro is one candidate accepted to run for hand of the King. By some regarded as the monarchist president after he allowed, then crown prince Olav's marriage to take place in Oslo after the Republic was declared. Being a member of a major party will also work for him.\n\nJoakim Lehmkuhl is another candidate that has been accepted to run. Leading the right-wing Fedrelandslaget, he is backed by many allies of the monarchy and the king, along with a big section of Norwegian nationalists.\n\nRudolf Ræder, the current hand, is the favorite candidate by the establishment of Alt for Kongen. His role in establishing the Kingdom of Norway might also help him in winning the election." #NT!
 nor.37.a: "C. J. Hambro is Elected Hand!" #NT!
 nor.37.b: "Joachim Lehmkuhl is Elected Hand!" #NT!
 nor.37.c: "Rudolf Ræder will Continue as Hand!" #NT!
  
 nor.40.t: "Our North Atlantic Brothers" #NT!
 nor.40.d: "We will finally send an ultimatum to those occupying our lands in the North Atlantic. We shall show them that we will not accept that we have brothers living under foreign occupation!" #NT!
 nor.40.a: "Send the Ultimatum" #NT!
 nor.40.b: "Let us wait.." #NT!
 nor.41.t: "Norway Demands the North Atlantic" #NT!
 nor.41.d: "The Norwegians have come with a demand, to hand over our North Atlantic territories or face war. Many of our commanders want us to say no to this demand, but there are some who believe that it would be better for the country to accept the proposal." #NT!
 nor.41.a: "No land before blood has been shed!" #NT!
 nor.41.b: "Okay, we accept their demand!" #NT!
 nor.42.t: "The [FROM.GetAdjective] Accept the Demand" #NT!
 nor.42.d: "They accepted the demand we have given them. Maybe we can be friends after all. This has been a great diplomatic victory for our nation and for our brothers in the North Atlantic." #NT!
 nor.42.a: "Good Choice!" #NT!
 nor.43.t: "The [FROM.GetAdjective] Rejected the Demand" #NT!
 nor.43.d: "They rejected our honourable demand! We will show them what happens in the case of rejection! We can either declare war or back down. It comes down to this." #NT!
 nor.43.a: "We started it! We finish it! War!" #NT!
 nor.43.b: "Let's back down. We are not ready for war." #NT!
 nor.44.t: "Norway Back Down" #NT!
 nor.44.d: "Norway has given up its claims in the North Atlantic. But we guess this will not be the end." #NT!
 nor.44.a: "Victory for us At Least!" #NT!
 nor.45.t: "Norway Demands the North Atlantic" #NT!
 nor.45.d: "The Norwegians have come with a demand, to leave the territories of Greenland, Iceland and the Faroe Islands or face war. Many of our commanders want us to say no to this demand, but there are some who believe that it would be better for the country to accept the proposal." #NT!
 nor.45.a: "No land before blood has been shed!" #NT!
 nor.45.b: "Okay, we accept their demand!" #NT!
 nor.46.t: "The British Accept the Demand" #NT!
 nor.46.d: "They have accepted the demand we gave them. Maybe we can be friends after all. This has been a great diplomatic victory for our nation and for our brothers in the North Atlantic." #NT!
 nor.46.a: "Good Choice!" #NT!
 nor.47.t: "The British Rejected the Demand" #NT!
 nor.47.d: "They rejected our honourable demand! We will show them what happens in the case of rejection! We can either declare war or back down. It comes down to this." #NT!
 nor.47.a: "We started it! We finish it! War!" #NT!
 nor.47.b: "Let's Back Down. We are not Ready for war." #NT!
 nor.48.t: "Norway Back Down" #NT!
 nor.48.d: "Norway has backed down from their claims in the North Atlantic. But we guess this will not be the end." #NT!
 nor.48.a: "Victory for us At Least!" #NT!
 nor.49.t: "Peace in the North Atlantic?" #NT!
 nor.49.d: "We are now winning, and both us and our enemy are now willing to sue for peace." #NT!
 nor.49.a: "Let's Make Peace." #NT!
 nor.49.b: "Never!" #NT!
 nor.50.t: "Norway wants Peace!" #NT!
 nor.50.d: "Peace talks" #NT!
 nor.50.a: "Okay" #NT!
 nor.50.b: "Niet" #NT!
 nor.51.t: "Britain Accepts Peace" #NT!
 nor.51.d: "The British have accepted our demand of ceding the North Atlantic territories over to us." #NT!
 nor.51.a: "Victory!" #NT!
  
 nor.52.t: "Our Brothers in the East" #NT!
 nor.52.d: "We will finally send an ultimatum to those occupying Jemtland and Alvheim from us. We shall show them that we will not accept that we have brothers living under foreign occupation!" #NT!
 nor.52.a: "Send the Ultimatum" #NT!
 nor.52.b: "Let us wait.." #NT!
 nor.53.t: "Norway Demands Bohuslen and Jamtland" #NT!
 nor.53.d: "The Norwegians have come with a demand, to hand over the territories of Bohuslen and Jamtland or face war. Many of our commanders want us to say no to this demand, but there are some who believe that it would be better for the country to accept the proposal." #NT!
 nor.53.a: "No land before blood has been shed!" #NT!
 nor.53.b: "Okay, we accept their demand!" #NT!
 nor.54.t: "The Swedes Accept the Demand" #NT!
 nor.54.d: "They accepted the demand we have given them. Maybe we can be friends after all. This has been a great diplomatic victory for our nation and for our brothers in Bohuslen and Jamtland." #NT!
 nor.54.a: "Good Choice!" #NT!
 nor.55.t: "The Swedes Rejected the Demand" #NT!
 nor.55.d: "They rejected our honourable demand! We will show them what happens in the case of rejection! We can either declare war or back down. It comes down to this." #NT!
 nor.55.a: "We started it! We finish it! War!" #NT!
 nor.55.b: "Let's back down. We are not ready for war." #NT!
 nor.56.t: "Norway Backs Down" #NT!
 nor.56.d: "Norway has given up its claims on Bohuslen and Jamtland. But we guess this will not be the end." #NT!
 nor.56.a: "Victory for us At Least!" #NT!
  
 nor.61.t: "For the Kings of Scandinavia" #NT!
 nor.61.d: "As our families have such strong ties to each other, our king wants to sign a 'Non-Aggression and Protection' pact with Denmark and its king, Christian X, and with Sweden and its king, Gustaf V. Hopefully will the Danish and Swedish governments agree to this, to upheld peace and prosperity!" #NT!
 nor.61.a: "Send the Letters!" #NT!
 nor.61.b: "Nevermind.." #NT!
 nor.62.t: "Norway Wants Non-Aggression and Protection Pact" #NT!
 nor.62.d: "The Norwegian king recently sent us a letter, containing a request for a Non-Aggression and Protection pact between us, them and Denmark. Shall we approve this request?" #NT!
 nor.62.a: "We would prosper from this!" #NT!
 nor.62.b: "We can't trust them!" #NT!
 nor.63.t: "Sweden Accepts" #NT!
 nor.63.d: "The Swedish have accepted our proposal, and have agreed on Non-Aggression and Protection. They see that peace is more important than war." #NT!
 nor.63.a: "Excellent!" #NT!
 nor.64.t: "Sweden Rejects" #NT!
 nor.64.d: "The Swedish has rejected our proposal of peace and harmony. They may have some plans against us as an independent nation!" #NT!
 nor.64.a: "They may be a Warmongerer!" #NT!
 nor.65.t: "Norway Wants Non-Aggression and Protection Pact" #NT!
 nor.65.d: "The Norwegian king recently sent us a letter, containing a request for a Non-Aggression and Protection pact between us, them and Sweden. Shall we approve this request?" #NT!
 nor.65.a: "We would prosper from this!" #NT!
 nor.65.b: "We can't trust them!" #NT!
 nor.66.t: "Denmark Accepts" #NT!
 nor.66.d: "The Danish have accepted our proposal, and have agreed on Non-Aggression and Protection. They see that peace is more important than war." #NT!
 nor.66.a: "Excellent!" #NT!
 nor.67.t: "Denmark Rejects" #NT!
 nor.67.d: "The Danish has rejected our proposal of peace and harmony. They may have some plans against us as an independent nation!" #NT!
 nor.67.a: "They may be a Warmongerer!" #NT!
 nor.68.t: "Both Sweden and Denmark Agreed!" #NT!
 nor.68.d: "Both of the Kingdoms of Sweden and Denmark have agreed to sign the 'Non-Aggression and Protection' pact. No-one will now be able to attack any of us without interference!" #NT!
 nor.68.a: "Long Live, Kings of Scandinavia!" #NT!
  
 nor.70.t: "Norway Wants to Join the Stahlpakt!" #NT!
 nor.70.d: "A diplomatic convoy from Norway has just arrived in our capital. The Norwegians came to ask if they can join the Stahlpakt. This could be helpful for us in securing the Skagerrak from French or British ships." #NT!
 nor.70.a: "Welcome to the Pakt!" #NT!
 nor.70.b: "We do not need you!" #NT!
 nor.71.t: "Germany Welcomes Us!" #NT!
 nor.71.d: "The Germans have been willing to let us in their alliance. This will surely be the start of a long friendship." #NT!
 nor.71.a: "Long Live Norway and Germany!" #NT!
 nor.72.t: "The Germans Reject" #NT!
 nor.72.d: "The Germans had the nerve to reject our humble request. This will not be forgotten by our leadership in the future." #NT!
 nor.72.a: "Norway Doesn't Need Germany!" #NT!
 nor.73.t: "Norway Wants to Join the Third International!" #NT!
 nor.73.d: "A diplomatic convoy from Norway has just arrived our capital. The Norwegians came to ask if they can join the Tretiy Internazional. This could be helpful for us in securing the Norwegian sea from British ships." #NT!
 nor.73.a: "Welcome to the International!" #NT!
 nor.73.b: "We do not need you!" #NT!
 nor.74.t: "Soviet Russia Welcomes us!" #NT!
 nor.74.d: "The Soviets have been willing to let us in their alliance. This will surely be the start of a long friendship." #NT!
 nor.74.a: "Long Live Norway and the Soviet Union!" #NT!
 nor.75.t: "The Soviets Rejects" #NT!
 nor.75.d: "The Soviets had the nerve to reject our humble request. This will not be forgotten by our leadership in the future." #NT!
 nor.75.a: "Norway Doesn't Need the Soviet Union!" #NT!
  
 nor.76.t: "The Norwegians Want a Naval Agreement With Us" #NT!
 nor.76.d: "Norway has approached us with the proposal of a naval agreement between our two nations. They believe that this cooperation would be beneficial for both of us in the long run." #NT!
 nor.76.a: "Okay!" #NT!
 nor.76.b: "We Do Not Want to be Involved" #NT!
 nor.77.t: "The British Accept the Agreement" #NT!
 nor.77.d: "The British has accepted the naval agreement between us and them. We are thrilled to hear that they want to sign under on this." #NT!
 nor.77.a: "For Norway and the British Empire!" #NT!
 nor.78.t: "The British Reject the Agreement" #NT!
 nor.78.d: "The British has rejected the naval agreement between us and them. We are a little disappointed, but what the future might give us is still unknown." #NT!
 nor.78.a: "What a Pity.." #NT!
  
 nor.80.t: "Mowinckel's Legacy" #NT!
 nor.80.d: "Johan Ludwig Mowinckel have been an ever-present figure in Norwegian politics since the end of the Great War. Already with his entrence into Norwegian national politics in 1919, he caused change in society. For him to be able, as a Free-spirited man outside the Church, to enter government, the constitutional amendment known as 'Lex Mowinckel' was passed. Since then, he have rissen to become a leading figure in Venstre and the heir to Gunnar Knudsen. However, despite the reforms passed under his governance, the 1920s were also an age marked by a fall of the popularity of Venstre in favor of the rising labour movement. The end came with the rise of the revolutionary Martin Tranmæl to the presidency and his Labour Party to government, placing Venstre onto the opposition bench.\n\nThe economic crisis has given Venstre and Mowinckel a chance to rectify the country away from revolutionaries and building a better liberal legacy. However, too many blame the economic liberalism that Mowinckel champions for the crisis and has lost faith in capitalism. They forget that we weren't in charge when the crisis hit, Labour was. We need to show them that liberalism is the solution to the hardship Norway faces, not the cause." #NT!
 nor.80.a: "Our Work Begins Now!" #NT!
  
 nor.81.t: "Høyre's Leadership" #NT!
 nor.81.d: "The Conservative Party was fairly united under the leadership of Ivar Lykke. Lykke even managed to keep most of the financial backers of the party when crisis saw it possible for them to break off and support the Free-Minded Liberals. However, Lykke stepped away from leadership years ago, and in his place the party is led by Carl Joachim Hambro. While Hambro has great oratory talents and is a strong principle defender of civilized democracy against the encroachment of totalitarian ideologies, he has also his dissidents. Many see Hambro as not focused enough on economic policies, while being a too improvized and self-willed leader. In some cases Hambro, the opponent of totalitarianism, is himself an authoritarian. The opposition to Hambro has united behind the industralist Johan H. Andresen. In many ways, Andresen is the opposite to Hambro. A structured, innovative business man who wants the party to focus more on economic issues and present itself as a clearer opposition to the socialism of the Labour Party. In addition, Andresen is more sympathetic to the Fatherland League and other right-wing organizations.\n\nDespite these differences, they are both invested in the issue of military preparedness and to unite the political right against the Labour Party. However, only one of them can lead the party into the future." #NT!
 nor.81.a: "Hambro Continues as Leader" #NT!
 nor.81.b: "We Need Andresen's Ideas" #NT!
  
 nor.82.t: "End of the Storting" #NT!
 nor.82.d: "The initial declaration of a socialist republic was mostly just for show. A change in the flag there and a new name for our republic there. Today starts the real change to a socialist republic. Members of the Storting from the opposition parties was today awaken in their homes by members of the Red Guard and loyal police units. They have been arrested on charges of conspiracy against the Republic, collaboration with reactionary terrorism, and general treason. On every step that the Labour movement have taken, these obstructionists have stood in the way of progress. We can't have 'democratic' systems that are built to prolong the oppression of the working class. That is why these treasonous politicians have been arrested.\n\nWe shall assure that they get the punishment they deserve!" #NT!
 nor.82.a: "Long Live the Revolution!" #NT!
  
 nor.83.t: "A Socialist Society" #NT!
 nor.83.d: "The final vestiges of the old Republic and the arcaic Kingdom are now torn up. In its place, we are building a new society, a free society, a socialist society. By following in the footsteps of Marx and Lenin, Norway will be a country where the working masses will breathe true freedom from the chains of capitalism. By following these steps, we set the course for, not only Norway, but for all workers of the world. From now on, we march together with our brothers in Moscow to free the workers of Germany, France, Britain from the chains they still endure." #NT!
 nor.83.a: "Workers of the World, Unite!" #NT!
  
 nor.84.t: "Syndicalism in Norway" #NT!
 nor.84.d: "Our dream represented by the 1911 Trondhjemsresolusjonen are now in reach. Since those days, many movements have come to form the Labour movement, from the Bolshevik revolution in Russia to the development of Social Democracy. However, we seem to trend back to the old dream of a Syndicalist form of government. Norway will show the world a future not built on Lenin's revolutionary ideas or the reformist ideas that seek to compromice with the forces of capital, but a future made by the hands of unionized workers." #NT!
 nor.84.a: "Our Revolution Begins!" #NT!
  
 nor.85.t: "Rise of Class Cooperation" #NT!
 nor.85.d: "Already, there have been attempts of cooperation between representatives of the Workers' National Trade Union, the Norwegian Employers' Confederation and the government to figure out the rules and regulation of employment in Norway. This is a path worth going down. While some believe this is not revolutionary enough, many achknowledge this cooperation as a good way for organized Labour to make their mind known. Many are also seeing the destructive side of revolution, favoring instead reform. Despite what those revolutionary ideologues would say, we will create a democratic Norway where class conflict will be resolved with peaceful means." #NT!
 nor.85.a: "Let's Shake On It" #NT!
  
 nor.90.t: "Longer Electoral Periods" #NT!
 nor.90.d: "Our parliament has recently decided to extend the electoral period from 3 years to 4 years. Some may see this as an attempt to take power from the people and give it to the politicians, but many see that this would help in giving these same politicians more time to execute their election promises." #NT!
 nor.90.a: "We Need to Listen to our Parliament!" #NT!
 nor.91.t: "The Rise of Christian Democracy" #NT!
 nor.91.d: "Many of our citizens believe that the major political parties are for secularism. Even Høyre, with their proposal for a reorganization of the trade unions into a Christian union, has been seen as too secular for many Christian voters. Therefore, the minor political party of Kristelig Folkeparti gained increased popularity, gaining both socialist, liberals and conservative voters. While most of their stands are very conservative, they do claim to not be on one side of the political spectrum. There are no signs that the party will dominate, however, but it will be a factor in upcoming elections." #NT!
 nor.91.a: "Christian Democracy Sounds Interesting." #NT!
 nor.92.t: "Ingolf Elster Christensen Resigns from Politics" #NT!
 nor.92.d: "Høyre's leader, Ingolf Elster Christensen, has chosen to resign from politics completely. He believes that he is beginning to become too weak and old to be able to bear the responsibility of being the leader of his party, and wants to retreat back to his family's farm in Førde. Carl Joachim Hambro will become new leader of Høyre from now on." #NT!
 nor.92.a: "Christensen has served his party well." #NT!
  
 nor.94.t: "1940 Arbeiderpartiet Conference" #NT!
 nor.94.d: "The last election showed the world that the future of Norway belongs to the workers and unionists. Our leader, Martin Tranmæl has now recently opened the 1940 party conference. This has happened every time before an election, but this time, the whole country will be set to watch the direction of the major party.\n\nThe first matter to be resolved is what kind of Foreign Politics shall be practiced." #NT!
 nor.94.a: "We must support Worker Revolutions in Scandinavia!" #NT!
 nor.94.b: "We will be unaligning ourselves from Capitalist countries!" #NT!
 nor.94.c: "We should preserve our neutrality!" #NT!
 nor.95.t: "The Issue of the Military" #NT!
 nor.95.d: "We have to find out where we find ourselves on military spending. While the Vanguardists want to have a military used for bringing the Revolution to other countries, our right wing wants to make our country more peaceful. Where do we go?" #NT!
 nor.95.a: "We need to protect and spread the Revolution!" #NT!
 nor.95.b: "We shall spend to protect what we already have!" #NT!
 nor.95.c: "Militarism is not the way of Socialism!" #NT!
 nor.96.t: "The Issue of Economy" #NT!
 nor.96.d: "We need to find out where our economic stance is. Many in our party want to nationalize everything, while some want us to be more accepting of private upstarts. We need to find out, where the party stands on this?" #NT!
 nor.96.a: "Nationalize all Industries and Farms for an equal society!" #NT!
 nor.96.b: "Farmers are not Industry Magnates. They have a right to their land!" #NT!
 nor.96.c: "Private Operators should be allowed if they follow our rules!" #NT!
  
 nor.99.t: "Election Day" #NT!
 nor.99.d: "It is, once more, time to elect who is going to sit in our Parliament, and from there, form a government. The victory of Arbeiderpartiet have managed to make them a dominant force on the political scene in Norway. The party's governing have proven that socialism can work fine in a democratic country. But with Norway being a democracy, there will be the presence of opposition. In this election, that opposition, represented by Venstre and Høyre have come together into their own coalition, trying to dethrone the ruling Arbeiderpartiet. We will now see who will be victorious!" #NT!
 nor.99.a: "Arbeiderpartiet Wins Again!" #NT!
 nor.99.b: "The 'Borgerlige' Coalition Wins!" #NT!
  
 nor.100.t: "Election to the Norwegian Supreme Soviet" #NT!
 nor.100.d: "With Norway transitioning into a Socialist Republic, it is time to hold the first free election in this socialist system. With the dominance of Arbeiderpartiet secured, securing the rights of the workers and people of Norway, the people are able to make a truly free choice. While the Radicals can gain a new victory, there is also a possibility for the Moderates, or even the Social Democrats, to become victorious. We will now see who will be victorious!" #NT!
 nor.100.a: "The Radicals Wins!" #NT!
 nor.100.b: "The Moderates Wins!" #NT!
 nor.100.c: "The Right-wing Wins!" #NT!
 nor.101.t: "Election Day" #NT!
 nor.101.d: "It is, once more, time to elect who is going to sit in our Parliament, and from there, form a government. The victory of Venstre in last election has given a good ground for both the liberals and conservatives to campaign. Arbeiderpartiet has returned to politics, and hope to 'save' the country from capitalism. We will now see who will be victorious!" #NT!
 nor.101.a: "Moderates from Arbeiderpartiet form the government!" #NT!
 nor.101.b: "Another victory for Venstre!" #NT!
 nor.101.c: "Høyre managed to become victorious!" #NT!
 nor.102.t: "Election Day" #NT!
 nor.102.d: "It is, once more, time to elect who is going to sit in our Parliament, and out from there, form a government. The victory of Høyre in last election has given a rise to conservatism, while socialism is becoming weaker and weaker. Arbeiderpartiet was given the blame for the economic problems from 1936, and are not able to be likely to win this time. But a new victory for Høyre may not be a reality. Venstre will have a chance of victory with support from both socialists and liberals. We will now see who will be victorious!" #NT!
 nor.102.a: "Venstre won!" #NT!
 nor.102.b: "Another victory for Høyre!" #NT!
  
 nor.104.t: "Election Day" #NT!
 nor.104.d: "It is once more, time to elect who is going to sit in our Parliament, and from there, form a government. While losing in 1936, Arbeiderpartiet has managed to regain power and believe they can lead a socialist coalition after the election. Venstre and Høyre have teamed up this time to counter the socialist coalition in their Borgerlige coalition. Nearly all socialist parties have agreed to democracy in achieving reforms, and the right has found agreements in each other programs. We will now see who will be victorious!" #NT!
 nor.104.a: "The Socialist Coalition Wins!" #NT!
 nor.104.b: "The 'Borgerlige' Coalition Wins!" #NT!
 nor.105.t: "Election Day" #NT!
 nor.105.d: "It is once more, time to elect who is going to sit in our Parliament, and from there, form a government. While the political parties of Venstre and Høyre have solidified their position in Norwegian politics, there will still be those that will vote for Arbeiderpartiet and other socialist movements. To counter this, the two parties have agreed on a coalition government if they together would have a majority. Arbeiderpartiet have, in return, formed a coalition between themselves and other socialist parties. We will now see who will be victorious!" #NT!
  
 nor.109.t: "Declaration of the Socialist Republic!" #NT!
 nor.109.d: "Prime Minister Peder Furubotn have today announced a new direction for Norway. No longer shall the people of Norway being dragged down by the bourgeoisie structures of parliamentary democracy. Today, the people will see themselves free in a Socialist Republic!" #NT!
 nor.109.a: "Long Live the Revolution!" #NT!
  
 nor.110.t: "The 1936 Presidential Election" #NT!
 nor.110.d: "With the parliamentary election bringing a new win for Arbeiderpartiet, there is a high possibility for the party to gain the Presidency as well. With the new Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With first round of voting being concluded, two candidates emerges in the second round.\n\nIncumbent president Martin Tranmæl is seeking a new term as President. Even if the economic crisis have affected these last weeks of his first term, he assures that the President and the Government will be able to bring Norway out from the last grasp of capitalism.\n\nTranmæl's opponent is Ingolf Elster Christensen from Høyre. Christensen hopes to unite the political right-wing in an anti-socialist block, hoping to get Liberals and Social Democrats to vote for him. Even if he should win, however, his power and influence would be limited by the socialist government." #NT!
 nor.110.a: "Tranmæl Wins Easily a Second Term" #NT!
 nor.110.b: "Christensen Manage to Win the Presidency" #NT!
  
 nor.111.d: "With the parliamentary election bringing a victory for Venstre, there is a possibility for the party to win the presidency as well. It is not assured, however, with the presence of incumbent president Martin Tranmæl. With the new Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With first round of voting being concluded, two candidates emerges in the second round.\n\nThe incumbent, Martin Tranmæl, might be able to win a second term, even if his party lost the parliamentary election. If he manages to gain the support of the Social Democrats, he will have a slight majority.\n\nWith Venstre overtaking Høyre in the parliamentary election, this have, in return, made Johan Ludwig Mowinckel the candidate to face Tranmæl in the second round. Mowinckel might be able to unite a broad coalition against Tranmæl, securing the hold of his party." #NT!
 nor.111.a: "A Slight Left-wing Majority Gives Tranmæl a Second Term" #NT!
 nor.111.b: "A Broad Coalition Makes Mowinckel President" #NT!
  
 nor.112.d: "With the parliamentary election bringing a victory for Høyre, there is a possibility for the party to win the presidency as well. While Tranmæl still has a chance, the right-wing has a hope to 'dethrone' the socialist president. With the new Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With first round of voting being concluded, two candidates emerges in the second round.\n\nThe incumbent, Martin Tranmæl, might be able to win a second term, even if his party lost the parliamentary election. If he manages to gain the support of the Social Democrats, and maybe even a few Liberals, he will have a slight majority.\n\nTranmæl's opponent is Ingolf Elster Christensen from Høyre. Christensen hopes to unite the political right-wing in an anti-socialist block, hoping to get Liberals, and perhaps also Social Democrats, to vote for him. His victory would also secure the hold of his party." #NT!
 nor.112.b: "Christensen Wins With a United Coalition" #NT!
  
 nor.113.t: "The 1940 Presidential Election" #NT!
 nor.113.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. Since Arbeiderpartiet basically has a dominant role in Norwegian politics, the election will just span one round. The question is who from our party is going to become President, since Martin Tranmæl is not seeking a term this time.\n\nEinar Gerhardsen is seen as a close associate to Martin Tranmæl, being a member of his circle back in the 1920s and 30s. Gerhardsen represents the moderate faction in Arbeiderpartiet, wanting to continue the line of Martin Tranmæl.\n\nHaavard Langseth represnts the radical wing of Arbeiderpartiet, and are one of the closest to the Soviet Union among the Presidential candidates. His presidency will alienate some of our most moderate members, so it might not be the best choice.\n\nJohan Nygaardsvold does in reality represent Norges Socialdemokratiske Arbeiderparti, a party that broke off Arbeiderpartiet back in the 1920s. His presidency can result in a party merge, but can also alienate the radical wing of the party." #NT!
 nor.113.a: "Einar Gerhardsen" #NT!
 nor.113.b: "Haavard Langseth" #NT!
 nor.113.c: "Johan Nygaardsvold" #NT!
  
 nor.114.t: "Our Candidate for the Presidency" #NT!
 nor.114.d: "With the parliamentary election now over, the election for the Presidency is up in the air. With Martin Tranmæl expressing no wish to be elected into a new term, a couple of candidates have come up for Arbeiderpartiet.\n\nEinar Gerhardsen is the candidate being supported by Tranmæl, and represents the moderates in the party. Gerhardsen has a background in the circle around Tranmæl, and are sharing many of his socialist ideas.\n\nHaavard Langseth represents the radical wing of Arbeiderpartiet, and are a supporter of the Soviet Union, while being sceptical to parliamentary democracy. His candidacy can risk alienate some moderates, with slim chances of gaining Social Democrats to support him.\n\nJohan Nygaardsvold is also being put forward as a candidate. While he is a member of Norges Socialdemokratiske Arbeiderparti, his candidacy might be able to gain the support of Liberals and politicians in the center. But this might alienate radical members of Arbeiderpartiet, even if it would be a secured win." #NT!
 nor.114.a: "Gerhardsen, Tranmæl's Heir" #NT!
 nor.114.b: "Langseth, the True Socialist" #NT!
 nor.114.c: "Nygaardsvold, the Outsider" #NT!
  
 nor.115.t: "The 1940 Presidential Election" #NT!
 nor.115.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With the first round of voting finishing up, it looks like two candidates are going to run in the second round.\n\nEinar Gerhardsen is the candidate supported by Arbeiderpartiet and other socialists in the Parliament. He is seen as a close associate to Martin Tranmæl, leading member of Arbeiderpartiet, and seems to continue in the footsteps of President Tranmæl. All in all, a safe candidate if Arbeiderpartiet wants to win the presidential election too.\n\nArthur Nordlie is the candidate supported by the political right, being a member of Høyre. He hope to gain the support of all anti-socialist forces in Norway in order to win this election. But with the victory of Arbeiderpartiet in the parliamentary election, it is a little unikely he will win." #NT!
 nor.115.a: "Einar Gerhardsen is Victorious!" #NT!
 nor.115.b: "Arthur Nordlie Gains a Surprising Win!" #NT!
  
 nor.116.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting coming to an end, it looks like two candidates are going to run in the second round.\n\nHaavard Langseth is the candidate with the support of Arbeiderpartiet and other socialists in the Parliament. While having the support of the governing party, his victory is still not secured. Viewed as a radical, he might make some moderates in Arbeiderpartiet abstain from voting, or vote on the opposing candidate, instead.\n\nArthur Nordlie is the candidate supported by the political right, being a member of Høyre. He hope to gain the support of all anti-socialist forces in Norway in order to win this election. But with the victory of Arbeiderpartiet in the parliamentary election, it is a little unlikely he will win." #NT!
 nor.116.a: "Haavard Langseth is the Winner!" #NT!
  
 nor.117.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting wraping up, it looks like two candidates are going to run in the second round.\n\nJohan Nygaardsvold is the candidate with the support of both the governing Arbeiderpartiet and his own party, Norges Socialdemokratiske Arbeiderparti. While not having a big appeal for radicals in Arbeiderpartiet, with a danger of making many of them abstain from voting, he might manage to appeal to many in the political center.\n\nArthur Nordlie is the candidate supported by the political right, being a member of Høyre. He hope to gain the support of all anti-socialist forces in Norway in order to win this election. But with the victory of Arbeiderpartiet in the parliamentary election, it is a little unikely he will win." #NT!
 nor.117.a: "Johan Nygaardsvold Carries the Win!" #NT!
  
 nor.118.t: "Our Candidate for the Presidency" #NT!
 nor.118.d: "With the parliamentary election now over, the new government party of Høyre is set in position to select who is going to become their candidate for President of Norway. While there are some arguing to have previous election's candidate stand this round too, there are some voices that wants new blood.\n\nArthur Nordlie is a new favorite candidate in the party. His candidacy might not mean much in Høyre's case, outside from getting some new blood in the Presidency. Ingolf Elster Christensen is also a candidate, being the candidate for Høyre back in 1936. Both candidates would mean that Høyre would control the Presidency if they win.\n\nThe last candidate being valued are Nils Trædal from Bondepartiet. Trædal could work as a more appealing candidate for both politicians from Venstre and NSA. But this strategy might alienate some members in Høyre, who believes we should support a candidate from our party." #NT!
 nor.118.a: "Nordlie, the 'New' Candidate" #NT!
 nor.118.b: "Christensen, the 'Old' Candidate" #NT!
 nor.118.c: "Trædal, the Outsider" #NT!
  
 nor.119.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting finishing up, it looks like two candidates are going to run in the second round.\n\nArthur Nordlie...\n\nEinar Gerhardsen..." #NT!
 nor.119.a: "Arthur Nordlie is Victorious!" #NT!
 nor.119.b: "Einar Gerhardsen Gains a Surprising Win!" #NT!
  
 nor.120.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With the first round of voting coming to an end, it looks like two candidates are going to run in the second round.\n\nIngolf Elster Christensen...\n\nEinar Gerhardsen..." #NT!
 nor.120.a: "Ingolf Elster Christensen Wins!" #NT!
  
 nor.121.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting wraping up, it looks like two candidates are going to run in the second round.\n\nNils Trædal...\n\nEinar Gerhardsen..." #NT!
 nor.121.a: "Nils Trædal Carries the Win!" #NT!
  
 nor.122.t: "Our Candidate for the Presidency" #NT!
 nor.122.d: "With the parliamentary election now over, the governing party of Venstre is set in position to select who is going to become their candidate for President of Norway. While there are some voices for the previous election's candidate, some are also voicing for a new candidate.\n\nArne Sunde is a potential candidate, remarking himself as a lawyer and a politician close to Johan Ludwig Mowinckel. His education and work would fit well for someone going to become the President of Norway.\n\nJohan Ludwig Mowinckel is also a reliable candidate, with his history as foreign, trade and prime minister over the years, and his contribution for Lex Mowinckel. Even if he has ran before, he might be a good candidate.\n\nAnother candidate being valued are Nils Trædal from Bondepartiet. Trædal could work as a more appealing candidate for both politicians from Høyre and NSA. But this strategy might alienate some members in Venstre, who believes we should support a candidate from our party." #NT!
 nor.122.a: "Sunde, the Lawyer" #NT!
 nor.122.b: "Mowinckel, the Veteran Politician" #NT!
 nor.122.c: "Trædal, the Outsider" #NT!
  
 nor.123.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these represenatives of the people to vote on who is going to become the next president of Norway. With the first round of voting wraping up, it looks like two candidates are going to run in the second round.\n\nArne Sunde...\n\nEinar Gerhardsen..." #NT!
 nor.123.a: "Arne Sunde is the New President!" #NT!
  
 nor.124.d: "With the parliamentary election now over, it is time to vote on who is going to become the next President of Norway. With the Parliament assembled, it is time for these representatives of the people to vote on who is going to become the next president of Norway. With the first round of voting wraping up, it looks like two candidates are going to run in the second round.\n\nJohan Ludwig Mowinckel...\n\nEinar Gerhardsen..." #NT!
 nor.124.a: "Johan Ludwig Mowinckel is Victorious!" #NT!
  
 nor.130.t: "The [GetYear] Election to the King's Council" #NT!
 nor.130.d: "New elections to the council of king Olav V have been called. While it seems like the same candidates will attempt to win the title of hand of the King in this election season, there are some changes.\n\nC. J. Hambro returns in this election to try to become the hand of King Olav. Coming from Høyre, one of the biggest parties in Norway, he is able to gain the support of many establishment politicians. Along with some regarding him as a monarchist president, he might be able to gain support from monarchists too.\n\nNils Lavik is a new candidate accepted to run for the title as hand of the King. A leading figure in the Christian Inner Mission movement, he have managed to gain popularity among the more conservative and christian parts of Norway, in the South and in the West.\n\nJoakim Lehmkuhl has once more been accepted to run as a candidate for the title as hand of the King. Leading the right-wing Fedrelandslaget, he is backed by many allies of the monarchy and the king, along with a big section of Norwegian nationalists.\n\nRudolf Ræder is the favorite candidate by the establishment of Alt for Kongen. His role in establishing the Kingdom of Norway might also help him in winning the election." #NT!
 nor.130.a: "C. J. Hambro" #NT!
 nor.130.b: "Nils Lavik" #NT!
 nor.130.c: "Joakim Lehmkuhl" #NT!
 nor.130.e: "Rudolf Ræder" #NT!
  
 nor.135.t: "Rising Norwegian Influence" #NT!
 nor.135.d: "The socialist regime in Norway has begun to fund our left-wing. I don't know what they are going for, but it ain't good." #NT!
 nor.135.a: "Damn Those Norwegians" #NT!
  
 nor.136.t: "Our Socialist Brethrens Request Our Submission" #NT!
 nor.136.d: "Since we are a revolutionary socialist country ourselves, the Norwegians have been kind enough to request our submission to them. They argue that together, we can form a stronger, prosperous Socialist Scandinavia." #NT!
 nor.136.a: "Okay, For the Revolution!" #NT!
 nor.136.b: "No, Denmark is Free" #NT!
  
 nor.137.t: "The Danes Agreed" #NT!
 nor.137.d: "The Danish Socialists saw reason and agreed to unite their nation with ours. Soon, Scandinavia will be fully unified." #NT!
 nor.137.a: "Long Live the Revolution!" #NT!
 nor.138.t: "The Danes Said No" #NT!
 nor.138.d: "The Danish, despite being run by fellow socialists, still didn't give in. There is only one way to fulfill the revolution now: War." #NT!
 nor.138.a: "You Should Have Said Yes!" #NT!
  
 nor.139.t: "Norway Fraternizes With Swedish Socialists" #NT!
 nor.139.d: "The socialist regime in Norway has begun to influence our politics, fraternizing with Swedish revolutionaries who seek to overthrow our government. That's not cool." #NT!
 nor.139.a: "Damn Those Norwegians" #NT!
  
 nor.140.b: "No, Sweden is Free" #NT!
  
 nor.141.t: "The Swedes Agreed" #NT!
 nor.141.d: "The Swedish Socialists saw reason and agreed to unite their nation with ours. Soon, Scandinavia will be fully unified." #NT!
 nor.142.t: "The Swedes Said No" #NT!
 nor.142.d: "The Swedes, despite being run by fellow socialists, still didn't give in. There is only one way to fulfill the revolution now: War." #NT!
  
 nor.143.t: "Norway Collaborate With the Reds" #NT!
 nor.143.d: "The socialist regime in Norway has begun to work together with the socialists in our country, becoming closer to the underground Red Guard. We have to be on guard." #NT!
 nor.143.a: "Damn Those Norwegians" #NT!
  
 nor.144.t: "No, Finland is Free" #NT!
  
 nor.145.t: "The Finns Agreed" #NT!
 nor.145.d: "The Finnish Socialists saw reason and agreed to unite their nation with ours. Soon, Scandinavia will be fully unified." #NT!
 nor.146.t: "The Finns Said No" #NT!
 nor.146.d: "The Finns, despite being run by fellow socialists, still didn't give in. There is only one way to fulfill the revolution now: War." #NT!
  
 nor.147.t: "The Union of Scandinavian Socialist Republics" #NT!
 nor.147.d: "For many in the Socialist movement, unity between the working class people of Scandinavia has been a far-seeing ambition. Today, this ambition is fulfilled. Together with our brethrens in Sweden, Denmark and Finland, we have created a new Socialist power in the world." #NT!
 nor.147.a: "Pan-Scandinavianism Isn't Dead" #NT!
 nor.149.t: "Capital of the Scandinavian State" #NT!
 nor.149.d: "With the unification of the Scandinavian people under one flag, a question quickly arise: 'What should be the capital of this new union?'. While many points to Oslo, since the unification have been led by Norwegians. Some argue another capital city like Stockholm or Køpenhavn to better integrate our brethrens. Others for a non-capital city, like Göteborg, to avoid favoritism towards one nation over the others. Where should it be?" #NT!
 nor.149.a: "Oslo - Norway Led the Unification" #NT!
 nor.149.b: "Göteborg - A Non-Capital Will Better Serve All" #NT!
 nor.149.c: "Stockholm - To Appeal to the Swedes" #NT!
 nor.149.e: "Køpenhavn - To Appeal to the Danes" #NT!
  
 nor.148.t: "Norway Sends Aid" #NT!
 nor.148.d: "The Norwegian government have issued us military aid, as well as helping us with volunteers in our fight against the Soviet Union. Hopefully, this will be more than enough to secure a victory over the Russian bear." #NT!
 nor.148.a: "Thank You, Norway" #NT!
  
 nor.150.t: "Norvego-Swedish Cooperation" #NT!
 nor.150.d: "Norway have reached out to us, seeking to further diplomatic and military cooperation between the two nations. Both Norway and Sweden have a common goal in securing peace and tranquility in Scandinavia, in a world that are more and more fraught with conflict and war." #NT!
 nor.150.a: "Sounds Good, Count Us In" #NT!
 nor.150.b: "We Don't Need This.." #NT!
  
 nor.151.t: "Norvego-Danish Cooperation" #NT!
 nor.151.d: "Norway have reached out to us, seeking to further diplomatic and military cooperation between the two nations. Both Norway and Denmark have a common goal in securing peace and tranquility in Scandinavia, in a world that are more and more fraught with conflict and war." #NT!
  
 nor.152.t: "Norvego-Finnish Cooperation" #NT!
 nor.152.d: "Norway have reached out to us, seeking to further diplomatic and military cooperation between the two nations. Both Norway and Finland have a common goal in securing peace and tranquility in Scandinavia, in a world that are more and more fraught with conflict and war." #NT!
  
 nor.153.t: "All of Them Agreed" #NT!
 nor.153.d: "All our Scandinavian neighbors; Sweden, Denmark and Finland, have agreed to strengthen military and diplomatic cooperation between the nations. Facing the rising threats of the Germans and the Soviets, we are able to show that Scandinavia will face the rising tentions together." #NT!
 nor.153.a: "Great" #NT!
 nor.154.t: "Sweden and Denmark Agreed" #NT!
 nor.154.d: "Two of our Scandinavian neighbors; Sweden and Denmark, have agreed to strengthen military and diplomatic cooperation between the nations. While the non-participation of Finland will weaken this cooperation, we are still a strong power block." #NT!
 nor.155.t: "Denmark and Finland Agreed" #NT!
 nor.155.d: "Two of our Scandinavian neighbors; Denmark and Finland, have agreed to strengthen military and diplomatic cooperation between the nations. While the non-participation of Sweden will weaken this cooperation, we are still a strong power block." #NT!
 nor.156.t: "Sweden and Finland Agreed" #NT!
 nor.156.d: "Two of our Scandinavian neighbors; Sweden and Finland, have agreed to strengthen military and diplomatic cooperation between the nations. While the non-participation of Denmark will weaken this cooperation, we are still a strong power block." #NT!
 nor.157.t: "Only Sweden Agreed" #NT!
 nor.157.d: "Only Sweden have agreed to strengthen military and diplomatic cooperation between the nations. While this will create a block powerful enough to defend itself, it is still very disappointing that Denmark and Finland isn't cooperating." #NT!
 nor.157.a: "Bummer" #NT!
 nor.158.t: "Only Denmark Agreed" #NT!
 nor.158.d: "Only Denmark have agreed to strengthen military and diplomatic cooperation between the nations. While this will create a block powerful enough to defend itself, it is still very disappointing that Sweden and Finland isn't cooperating." #NT!
 nor.159.t: "Only Finland Agreed" #NT!
 nor.159.d: "Only Finland have agreed to strengthen military and diplomatic cooperation between the nations. While this will create a block powerful enough to defend itself, it is still very disappointing that Sweden and Denmark isn't cooperating." #NT!
  
 nor.160.t: "Norway Wants to Join the Entente" #NT!
 nor.160.d: "A diplomatic convoy from Norway has just arrived in our capital. The Norwegians came to ask if they can join the Entente. This could be helpful for us in securing the Skagerrak from German ships and avoid that the Swedish steel trade comes under German or Soviet control." #NT!
 nor.160.a: "Welcome to the Entente!" #NT!
 nor.160.b: "We do not need you!" #NT!
 nor.161.t: "France Welcomes Us!" #NT!
 nor.161.d: "The French have been willing to let us in their alliance. This will surely be the start of a long friendship." #NT!
 nor.161.a: "Long Live Norway and France" #NT!
 nor.162.t: "The French Rejects" #NT!
 nor.162.d: "The French had the nerve to reject our humble request. This will not be forgotten by our leadership in the future." #NT!
 nor.162.a: "Norway Doesn't Need France!" #NT!
  
 nor.163.t: "Norway Wants to Join the Imperial Protection Alliance" #NT!
 nor.163.d: "A diplomatic convoy from Norway has just arrived in our capital. The Norwegians came to ask if they can join the Imperial Protection Alliance. This could be helpful for us in securing the Skagerrak from German ships and avoid that the Swedish steel trade comes under German or Soviet control." #NT!
 nor.163.a: "Welcome to the IPA!" #NT!
 nor.163.b: "We do not need you!" #NT!
 nor.164.t: "Britain Welcomes Us!" #NT!
 nor.164.d: "The British have been willing to let us in their alliance. This will surely be the start of a long friendship." #NT!
 nor.164.a: "Long Live Norway and Britain" #NT!
 nor.165.t: "The British Rejects" #NT!
 nor.165.d: "The British had the nerve to reject our humble request. This will not be forgotten by our leadership in the future." #NT!
 nor.165.a: "Norway Doesn't Need Britain!" #NT!
  
 nor.200.t: "Redistribution Begins" #NT!
 nor.200.d: "The orders of land redistribution from rich landowners into the hands of industrial workers and the lower classes has begun." #NT!
 nor.200.a: "Let this begin!" #NT!
  
