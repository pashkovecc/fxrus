 #### Focus Tree #### 
  
 NOR_space_for_economic_projects: "Space for Economic Projects" #NT!
 NOR_space_for_economic_projects_desc: "While Norway isn't a country filled with a lot of land for industry, there is areas where we can get there by a bit of work. To sustain the future development of Norwegian industry and production of new consumer goods, we need to clear out space for new expantions." #NT!
 NOR_utilize_merchant_fleet: "Utilize the Merchant Fleet" #NT!
 NOR_utilize_merchant_fleet_desc: "There are hundreds of merchant vessels that sails under the Norwegian flag. We should establish an administration to administrate this fleet. Both to utilize them for economic and military goals, as well as having some sense of how many ships we have available. Let's call this administration 'Nortraship'." #NT!
 NOR_support_fishing_industry: "Support the Fishing Industry" #NT!
 NOR_support_fishing_industry_desc: "The Norwegian coastline is itself filled with potential for industry. Already, there are many fishers who cruise the ocean to fish salmon and cod for a living. With the rise in domestic and international demands, we should support our fishers and the construction of fish 'farms' along the coast." #NT!
 NOR_hydro_power_expantion: "Hydro Power Expantion" #NT!
 NOR_hydro_power_expantion_desc: "Since the turn of the century, we have developed many new industries. However, these industries are in urgent need of cheap, reliable power. Luckily, Norway is blessed with a nature perfect to build hydro power plants. These will provide both industry and our people with the electricity they need." #NT!
 NOR_western_power_plants: "Western Power Plants" #NT!
 NOR_western_power_plants_desc: "The best places for hydro power expantion, is undeniably found in western Norway. Already, we have built hydro power plants here to provide cities like Ålesund and Molde with electricity. However, there are more cities and towns here to provide power to, as well as an even bigger industrial potential." #NT!
 NOR_norwegian_aluminium: "Norwegian Aliminium" #NT!
 NOR_norwegian_aluminium_desc: "Norway has many natural resources. One of them is aluminium. We have gotten words about potential aluminium reserves in the mountainous parts of our country. With the recent constructions of hydro power plants, we have the electricity needed to exploit this potential." #NT!
 NOR_our_trade_partners: "Our Trade Partners" #NT!
 NOR_our_trade_partners_desc: "" #NT!
 NOR_norwegian_fish_n_chips: "Norwegian Fish n' Chips" #NT!
 NOR_norwegian_fish_n_chips_desc: "While trade relations connected to the British created the crash, now when better times have come, the British seems to be stronger than ever. Therefore, should we reformalize trade with the empire." #NT!
 NOR_pomor_trade_reborn: "The Pomor Trade Reborn" #NT!
 NOR_pomor_trade_reborn_desc: "The Soviet Union has developed themselves away from capitalism. Some of us believe that it was the dark side of capitalism that affected us. Therefore, we should try to cease trade with capitalist countries, and focus on trade with the Soviets." #NT!
 NOR_provide_resources_germany: "Provide Resources to Germany" #NT!
 NOR_provide_resources_germany_desc: "The Germans have developed themselves into a new economy system. One we should take a part in. Germany is a land with ambitions that need many natural resources. As a land with many natural resources, we can trade them with the Germans." #NT!
 NOR_expand_railway_infrastructure: "Expand Railway Infrastructure" #NT!
 NOR_expand_railway_infrastructure_desc: "The railway system of western Norway is poor, and many places have not seen the wonder of modern transportation. We shall build tunnels and bridges, and bind this region closer to the country." #NT!
 NOR_rural_electrification: "Rural Electrification" #NT!
 NOR_rural_electrification_desc: "Over 600 000 people in Norway doesn't have access to electricity. Nowadays, when electricity becomes more and more important in everyday lives and on the workplaces, this can not stand. We need to ensure that as many as possible are connected with electric power and with the fortunes of the modern age." #NT!
 NOR_expand_steel_industries: "Expand Norsk Jernverk" #NT!
 NOR_expand_steel_industries_desc: "Iron and Steel is also a resource we have the potential of finding in our country. In our northern counties, we have also found potential the for new iron mines. This can help our country to become less dependent on steel imports." #NT!
 NOR_expand_university_oslo: "Expand the University of Oslo" #NT!
 NOR_expand_university_oslo_desc: "The University of Oslo is the oldest and the highest ranked university in Norway. We should promote the development of new innovations and research, and what better way is there to do this than to expand our dearest university." #NT!
 NOR_new_consumer_industries: "New Consumer Industries" #NT!
 NOR_new_consumer_industries_desc: "" #NT!
 NOR_reaction_to_london_crash: "Reaction to the London Crash" #NT!
 NOR_reaction_to_london_crash_desc: "While we have managed to remove British influence from Norway, the global economic consequences of the crash will affect us negatively, as both we and those in London have many common trade partners." #NT!
 NOR_public_works_program: "Public Works Program" #NT!
 NOR_public_works_program_desc: "" #NT!
 NOR_complete_northern_railway: "Complete Nordlandsbanen" #NT!
 NOR_complete_northern_railway_desc: "Our northern railway, 'Nordlandsbanen', is far from finished. While people and goods, as it stands now, can be transported to the Grong municipality, we should work on having a railway go all the way from Trondheim to Bodø, and even further beyond..." #NT!
 NOR_alleviate_indebted_farmers: "Alleviate Indebted Farmers" #NT!
 NOR_alleviate_indebted_farmers_desc: "The Norwegian economy is one reliant on our ability to export products. A sizeable part of this export economy, are our farmers. With the economic crisis, exports has halted and the demand for meat and milk has dried up. We need to support our farmers so they doesn't go bankrupt in this crisis." #NT!
 NOR_crisis_farm_subsidies: "Crisis Farm Subsidies" #NT!
 NOR_crisis_farm_subsidies_desc: "We should enact more subsidies to help out our farmers. If they fall, we risk an important section of our society, making our people more likely to starve if we aren't able to import products." #NT!
 NOR_cut_subsidies: "Cut Subsidies" #NT!
 NOR_cut_subsidies_desc: "With the support our farmers have gotten, they will manage to get through their hardship. Instead of increasing their subisidies, we should temporarily cut them back. This way, we will avoid inflation killing our economy." #NT!
 NOR_regulate_forclosures: "Regulate Forclosures" #NT!
 NOR_regulate_forclosures_desc: "An effect of the crisis that has befallen our farmers, is that they aren't able to make repayment on their debt. We need to properly regulate forclosure in the farming sector to avoid the banks using the crisis to throw our farmers into poverty and homelessness." #NT!
 NOR_cut_military_spending: "Cut Military Spending" #NT!
 NOR_cut_military_spending_desc: "Norway hasn’t seen any warfare since the Napoleonic era. While we can't be sure what the future will hold, we will try to cut our military budget to fund our relief programs. Hopefully, we will manage to restore it before any war hits our shores." #NT!
 NOR_crisis_rationing: "Crisis Rationing" #NT!
 NOR_crisis_rationing_desc: "We need to cut back on how much we are consuming. We don't need the situation to get worse, now when it is improving. These rations may also teach the people to not crave too much." #NT!
 NOR_towards_recovery: "Towards Recovery" #NT!
 NOR_towards_recovery_desc: "" #NT!
 NOR_urban_housing_projects: "Urban Housing Projects" #NT!
 NOR_urban_housing_projects_desc: "" #NT!
 NOR_restore_military_funding: "Restore Military Funding" #NT!
 NOR_restore_military_funding_desc: "" #NT!
 NOR_experience_with_synthetic_rubber: "Experience With Synthetic Rubber" #NT!
 NOR_experience_with_synthetic_rubber_desc: "" #NT!
 NOR_kongsberg_expantion: "Kongsberg Expantion" #NT!
 NOR_kongsberg_expantion_desc: "We need to expand our capacity for producing weapons. With a new expansion to Kongsberg Våpenfabrikk, we will have a much stronger military industry." #NT!
  
 NOR_reform_norwegian_army: "Reform the Norwegian Army" #NT!
 NOR_reform_norwegian_army_desc: "We need to find a new plan regarding our army and its strategies. We can focus on a specialized army, or one that is strong in numbers." #NT!
 NOR_restore_royal_guards: "Restore the Royal Guards" #NT!
 NOR_restore_royal_guards_desc: "When the monarchy was disbanded, His Majesty the King's Guard was also disbanded and integrated into the Presidential Guard. With the restoration of the Monarchy, we can restore the Guard and give them a chance to fight for Norway. Our enemies will learn to know and fear the 'Black Devils'." #NT!
 NOR_specialized_army: "A Specialized Army" #NT!
 NOR_specialized_army_desc: "Norway's population is small, and it would be incredibly stupid to draft most of them into the Armed Forces. Instead, we should overcome these shortcomings by focusing on professional, specialized soldiers and the opportunities granted to us through the use of good equipment." #NT!
 NOR_establish_special_forces: "Establish Special Forces" #NT!
 NOR_establish_special_forces_desc: "While many in our army are going through the ordinary training regime, we should look after those who can be trained into specialized positions. Not only those who can be good mountaineers and paratroopers, but also elite soldiers." #NT!
 NOR_strength_in_numbers: "Strength in Numbers" #NT!
 NOR_strength_in_numbers_desc: "Norway's population may be relatively small, but her land is vast and diverse. If we shall be able to protect it, we need to have more men and women serving in the military. We should extend the service time for future soldiers, as well as drafting more of our population to the Armed Forces." #NT!
 NOR_modernize_kongsberg_rifles: "Modernize Kongsberg Rifles" #NT!
 NOR_modernize_kongsberg_rifles_desc: "The Norwegian army has used the Kongsberg-produced Krag-Jørgensen since the 1890s. While it is a good rifle, it still needs to be improved and modernized to better fit with the ammonitions used today, while also to overcome the shortcomings of earlier versions of K-J." #NT!
 NOR_expand_national_service: "Expand National Service" #NT!
 NOR_expand_national_service_desc: "While some generals say this decision will cause less organization, we need everyone that we can get to defend our homeland. Expanding our national service, getting more people into the army, means we can mobilize a bigger force when we need to protect our homes." #NT!
 NOR_winter_mountaineers: "Winter Mountaineers" #NT!
 NOR_winter_mountaineers_desc: "There are two things Norway are known for that we can use against our enemies. Our mountains and our skis. We need to train and improve elite regiments of ski-going mountaineers. Already, our population have some of the best skiers in the world. It would be a shame to not utilize them." #NT!
 NOR_glomma_line: "The Glomma Line" #NT!
 NOR_glomma_line_desc: "Even if we doubt that war will be waged with our Swedish brothers, we shouldn't be naïve to believe it can't happen again. Luckily for us, we have forests and rivers that acts as natural defences against Swedish attacks. One of these are the Glomma river. We should establish fortifications along the river as a prevenative measure against potential attacks." #NT!
 NOR_utilize_artillary: "Utilize Artillary" #NT!
 NOR_utilize_artillary_desc: "We must move to improve our cannons and mortars that have stood since after the great war. We need artillery that can show force, and be a huge danger to our enemies." #NT!
 NOR_panservern_canon: "Panservernkanon" #NT!
 NOR_panservern_canon_desc: "" #NT!
 NOR_motorized_supply_lines: "Motorized Supply Lines" #NT!
 NOR_motorized_supply_lines_desc: "Foot soldiers struggle to cross vast distances in reasonable amounts of time compared to our industrialized neighbors. To make up for this, we should focus our efforts on motorizing our army and supply lines." #NT!
 NOR_experienced_general_staff: "An Experienced General Staff" #NT!
 NOR_experienced_general_staff_desc: "We need a real general staff. Not what we have now with these untested officers. We need to train these officers to come up with better plans." #NT!
 NOR_establish_home_guard: "Establish the Home Guard" #NT!
 NOR_establish_home_guard_desc: "Right now, we have no organized system of trained civilians ready for military service at a moment notice. Some of our generals and captains have proposed 'Heimevernet'. This force will be made up of civilians who are finished with normal army service, who stores their military equipment at home. A force that can be called upon if needed." #NT!
 NOR_study_armoured_designs: "Study Armoured Designs" #NT!
 NOR_study_armoured_designs_desc: "" #NT!
  
 NOR_norwegian_navy: "The Norwegian Navy" #NT!
 NOR_norwegian_navy_desc: "Our navy is not in the best shape. We should begin to plan for what direction we are going to take with our navy. We can focus on smaller, coastal ships and submarines, or bigger ships and control over our sea." #NT!
