 NOR_1936_election: "The 1936 Election" #NT!
 NOR_1936_election_desc: "It is time for the 1936 election. Many have speculated, in our country and abroad, that this election will be a turning point in Norway, its politics and history. The nationalist militant group that has called themselves 'Samfundsvernet' has tried to seize power. But our democracy still stands!" #NT!
  
 NOR_ap_victory: "AP Victory" #NT!
 NOR_ap_victory_desc: "The Norwegian Labour Party have, despite the economic crisis, beaten the odds and been elected for another term. It seems that the Norwegian people understands that the economic crisis weren't the fault of a socialist government, but the remaining influence of a capitalist system. We have now a mandate to overcome these hurdles and set Norway on the path to utopia." #NT!
  
 NOR_continue_norwegian_revolution: "Continue the Norwegian Revolution" #NT!
 NOR_continue_norwegian_revolution_desc: "The moderates in Labour have hindred us from fulfilling the revolution, our mandate given in 1930. They have continued to dream that socialism and working class freedom can be achieved within the confines of bourgeois democracy. With the recent economic crisis, many in the party finally sees that real change is needed - a truly Socialist Revolution." #NT!
 NOR_supply_militant_workers: "Supply Militant Workers" #NT!
 NOR_supply_militant_workers_desc: "Our workers are still under the threat of reactionary militias and police loyal to the whims of capitalists. Beside us, they only have themselves to rely on. Therefore, it is fair to supply them with weapons so they can defend themselves against the reactionaries and easier overthrow their oppressors in the Revolution to come." #NT!
 NOR_request_soviet_support: "Request Soviet Support" #NT!
 NOR_request_soviet_support_desc: "The Soviet Union are the only other major socialist country in the world. They have taken the mantle of leading the world revolution, and we should reach out to them to help us securing the revolution here in Norway. Hopefully, we can join them in furthering the revolution instead of selfishly keeping to ourselves." #NT!
 NOR_our_international_commitment: "Our International Commitment" #NT!
 NOR_our_international_commitment_desc: "It is time to meet our international commitment. For too long has the moderates in our party kept us away from joining forces with our working class brethren in the Soviet Union. Socialism has never been about workers of one nation, but about the workers of all nations.\n§R'The Internationale unites the Human Race!'§!" #NT!
 NOR_strengthen_anti_insurgency_laws: "Strengthen Anti-Insurgency Laws" #NT!
 NOR_strengthen_anti_insurgency_laws_desc: "The people of Norway lives in fear of the reactionary violence from the so-called Norsk Samfundsvern and the hidden plotting of AfK-affiliated politicians and businessmen. These forces seek to undermine the will of the people, and turn Norway into a capitalist dictatorship. It's our duty to stop them once and for all." #NT!
 NOR_overthrow_bourgeoisie_democracy: "Overthrow Bourgeois Democracy" #NT!
 NOR_overthrow_bourgeoisie_democracy_desc: "It is time to break the chains of bourgeois democracy that enslaves the working class under a false conciousness that their voices really matters. In our country, this is symbolized by reactionary institutions like the Storting, the police or the military. These institutions need to be upended to serve the Revolution!" #NT!
 NOR_nationalize_private_businesses: "Nationalize Private Businesses" #NT!
 NOR_nationalize_private_businesses_desc: "For too long, the means of production have been kept in the hands of the capitalist class. For too long, this country and land have not been owned by the Norwegian people. Today, we rectify this and take back control over the means of production to the working class." #NT!
 NOR_democratic_centralism: "Democratic Centralism" #NT!
 NOR_democratic_centralism_desc: "We need to follow Vladimir Lenin's teaching when it comes to forming the new socialist state, the dictatorship of the proletariat. A key principle of his, is Democratic Centralism. Here, political decisions reached by the voting process will be binding upon all members of the political party and of the national politic." #NT!
 NOR_collectivize_farmland: "Collectivize the Farmland" #NT!
 NOR_collectivize_farmland_desc: "In Norway, some farmers own a lot of land while others are 'husmenn' who works on lands that are owned by other farmers and landowners. We need to upend this system and bring all of the little farmland that we have under collective management, so it can be to the benefit for all our farmers, not just some of them." #NT!
 NOR_dictatorship_of_proletariat: "Dictatorship of the Proletariat" #NT!
 NOR_dictatorship_of_proletariat_desc: "No longer is the power of the state being controlled by the forces of reaction and the capitalist. What Marx calls the dictatorship of the bourgeoisie has been defeated. Finally, with our recent reforms, we see the Proletariat, the working class, achieving control over the government with the establishment of a Marxist-Leninist state." #NT!
 NOR_break_chains_of_religion: "Break the Chains of Religion" #NT!
 NOR_break_chains_of_religion_desc: "Marx calls religion 'opium for the people'. Religion has either served as a means for the ruling class to protect their exploitation of the working class and to create a false sense of conciousness for the workers, or as a way for the working class to process their own alienation. With the victory of the Revolution, religion will become obsolete in our society and should be overturned." #NT!
 NOR_shield_of_revolution: "Shield of the Revolution" #NT!
 NOR_shield_of_revolution_desc: "While our society is becoming one free from the shackles of the bourgeois reactionaries, it isn't secure that our socialist society wouldn't come under reactionary attacks in the future. We need to form a State Security Police which will be tasked with protecting the Norwegian working class from the enemies of the Revolution." #NT!
 NOR_anti_monarchist_operations: "Anti-Monarchist Operations" #NT!
 NOR_anti_monarchist_operations_desc: "Since the declaration of the Republic in 1926, monarchist sentiments has continued to grow in Norway under the banner of AfK. These have constituted of influential opposition politicians and businessmen, as well as foreign monarchs and royals sympathetic to the cause of restoration. This movement need to be stumped out before it endangers our Republic." #NT!
 NOR_crush_samfundsvernet: "Crush Samfundsvernet" #NT!
 NOR_crush_samfundsvernet_desc: "While Norsk Samfundsvern has remained an illegal organization since our first ascendancy in 1930, they have continued to operate underground. With the radicalizing effect of the economic crisis causing more and more young men to join these reactionaries, we need to crack down on them more heavy-handed than before." #NT!
  
 NOR_continue_moderate_course: "Continue the Moderate Course" #NT!
 NOR_continue_moderate_course_desc: "The Norwegian Labour Party have managed to steer a course for an independent and moderate Norwegian flair of socialism, and we will continue to follow it. While some in the party urge us to take a more radical course, we know this course is the best one for our nation. This way, we will uphold Norwegian democracy while overturning the reactionary, capitalist system." #NT!
 NOR_limit_labour_militancy: "Limit Labour Militancy" #NT!
 NOR_limit_labour_militancy_desc: "In response to reactionary violence, organized Labour have began to protect the workers with violence. While it is usually not their fault, this violence is still contra-productive. If we want to have a society where the rule of law applies, we can't allow ourselves to deal with punishment on our own." #NT!
 NOR_social_democratic_allies: "Social Democratic Allies" #NT!
 NOR_social_democratic_allies_desc: "The Social Democratic Labour Party have moved closer to us since we first came into government in 1930. With our party continuing the course of Democratic Socialism, the Social Democrats have been willing to help us in government. With many of the reasons why they split off from us eventually resolved, we hope to unite the Labour movement in the near future." #NT!
 NOR_socialist_reformism: "Socialist Reformism" #NT!
 NOR_socialist_reformism_desc: "While we are gradually moving away from Revolution, that doesn't mean we are moving away from Reform. Many believe that a Socialist government will be able to wrestle with the forces of capitalism inside the democratic framework, and create substantial change for the working class. This is something similar to what the Social Democrats in Denmark have worked towards and what Swedish Social Democrats also seek to achieve. Why wouldn't it work in Norway?" #NT!
 NOR_tranmaelite_cult: "Tranmælite Cult" #NT!
 NOR_tranmaelite_cult_desc: "Martin Tranmæl is one of the greatest leaders in recent Norwegian history. Through his leadership, the Labour movement have ousted a monarch and created a government for the working class. Many see these achievements impossible to reproduce without Tranmæl and the role he has played in the movement. Even if Tranmæl is on his last years as President, his legacy will live on with his protégés holding central positions in the movement." #NT!
 NOR_fulfill_trondhjemsresolusjonen: "Fulfill Trondhjemsresolusjonen" #NT!
 NOR_fulfill_trondhjemsresolusjonen_desc: "A part of the Labour Party's history was Fagopposisjonen 1911 and Trondhjemsresolusjonen, that sought a more revolutionary line for the party. While some principles of the resolution have been implemented, others are still left unfulfilled. Fulfilling it would place the foundation for Syndicalism in Norway, a third way separate from both Democratic Socialism and Communism, where the Workers' National Trade Union will become a central part of governance." #NT!
 NOR_revolutionary_women: "Revolutionary Women" #NT!
 NOR_revolutionary_women_desc: "Like the bourgeois capitalist oppresses the workers, so oppresses the patriarchy women. Many of the same capitalist structures that are used against the workers, are ones that justify the oppression of the female sex. In overthrowing capitalism, we also overthrow patriarchy. We have to ensure to break the chains that binds our female comrades, not uphold them." #NT!
 NOR_power_in_unions: "Power in Unions" #NT!
 NOR_power_in_unions_desc: "Political power needs to be vested in the hands of the unions, the best representatives of the working class, not in the hands of parties and bourgeois institutions. With this, we shall ensure that unions are united in advancing the interests of the working class as a whole, not the interests of one profession." #NT!
 NOR_empower_unionized_militias: "Empower Unionized Militias" #NT!
 NOR_empower_unionized_militias_desc: "The military and the police should be subserviant to the union. Too often these institutions have been a tool for capitalist reactionaries to undermine the rights of the working class. It is time to raise militias to defend the unions, which its loyalty always will be with the working class." #NT!
 NOR_decentralized_communities: "Decentralized Communities" #NT!
 NOR_decentralized_communities_desc: "The Syndicalist state should be one where the decision making powers are decentralized down into local union chapters and communities. These communities will be made up of the local workers, farmers and people of the area, not by the interests of capitalist reactionaries. It would be a purer form of governance that reflects well with how Norway has been built." #NT!
 NOR_compromise_with_agrarians: "Compromise With Agrarians" #NT!
 NOR_compromise_with_agrarians_desc: "Many see an agreement with the Farmers' Party unlikely. They have been one of the most anti-socialist parties in Norway, with some of their members even collaborating with Norsk Samfundsvern. However, they are more alike Labour than we think. We are both class parties representing lower classes. Often, their interests are aligned with us against the interests of the capitalist class. We can show them that City and Countryside can work together, Hand in Hand." #NT!
 NOR_improve_workers_rights: "Improve Workers Rights" #NT!
 NOR_improve_workers_rights_desc: "One of the most important achievement for the Labour movement, is the introduction of the 40-hour work week. However, there is always reforms that can be enacted to better the conditions of the workers. We need to ensure that the working class have the right to unionize, collectivly bargain and strike for better conditions." #NT!
 NOR_for_old_and_unemployeed: "For the Old and Unemployed" #NT!
 NOR_for_old_and_unemployeed_desc: "A central campaign promise of Labour, is the expantion of universal social security programs. The biggest steps towards this goal is the establishment of programs to help the unemployed and programs that support pensioners. While we hope that these can be enacted as universal programs, we might still have to include needs testing to get them approved." #NT!
 NOR_protect_norwegian_farmers: "Protect Norwegian Farmers" #NT!
 NOR_protect_norwegian_farmers_desc: "A promise from us to the Farmers' Party, was increasing support to and protection for the Norwegian farmers. This will include expanding the agricultural subsidies, helping our farmers to survive on their meager income and modernize their equipment, as well as enacting toll on foreign agricultural products. Measures that will also support our national self-sufficiency and independence." #NT!
 NOR_trepartssamarbeidet: "Trepartssamarbeidet" #NT!
 NOR_trepartssamarbeidet_desc: "The idea of cooperation between the worker and the boss for better conditions are nothing new. Already, this have been used to a limited degree with good sucsess. It is time to make this the standard for the employer-employee relationship across Norway. Instead of having a potential conflict where people get harmed every time the worker seeks justice, we can get together and come to an agreement." #NT!
 NOR_secularization: "Secularization" #NT!
 NOR_secularization_desc: "The fathers of the Norwegian constitution created a Norway that was to its core a Christian nation. However, we are long passed 1814, and we need to achknowledge that we can't have religious dogmas running our country. While the religious people can have their God and their churches, they have to agree that the influence of their God doesn't extend into schools or other official sectors." #NT!
 NOR_socialism_and_liberal_feminism: "Socialism and Liberal Feminism" #NT!
 NOR_socialism_and_liberal_feminism_desc: "We have to come to terms with the fact that feminism of revolutionary socialism isn't so much interested in uplifting women as it is to use feminism to tear down capitalism. In this regards, we have to hear the experience coming from the liberal feminist tradition. While liberal feminism isn't perfect, it should be the foundation to build feminism further on." #NT!
 NOR_norwegian_utopia: "A Norwegian Utopia" #NT!
 NOR_norwegian_utopia_desc: "As we move forward, we can begun to see the outlines for a Norwegian Socialist Utopia. For many Socialists, a society not so dissimilar to the revelation of a new Earth and a new Heaven given to John the Evangelist on Patmos. While our nation isn't reaching the standard of Revelation, it has come far in tendering to the inequality between the rich and the poor, and making sure everyone has a chance to a fair, happy life." #NT!
  
 NOR_venstre_victory: "Venstre Victory" #NT!
 NOR_venstre_victory_desc: "While many are surprised that Venstre won, the experts see why. They had support from more people than Høyre, and had made friends with both social democrats and liberal-conservatives, with their supportive stand for welfare and private initiatives." #NT!
 NOR_mowinckels_legacy: "Mowinckel's Legacy" #NT!
 NOR_mowinckels_legacy_desc: "Johan Ludwig Mowinckel has been the leader of Venstre since the retirement of Gunnar Knudsen in 1927. Even before that, he has been an influential Norwegian politician. To some degree, he played a role in the rise of the Labour Party in 1930 with his inhability to gather and preserve an anti-socialist coalition. Instead negotiating across the spectrum. Now, the economic crisis has given his party a new chance to lead. Hopefully, it will leave a better legacy." #NT!
 NOR_our_castbergian_roots: "Our Castbergian Roots" #NT!
 NOR_our_castbergian_roots_desc: "Johan Castberg is considered the father of a string of laws that recognized the right of inheiritance to illegitimate children, and economic aid to mothers and children. Laws that lays the foundation for a growing welfare state. Mowinckel did stand close to Castberg back then, and we should look towards reforms to strengthen the foundation that Castberg laid." #NT!
 NOR_liberal_pension_system: "A Liberal Pension System" #NT!
 NOR_liberal_pension_system_desc: "Many of Norway's elderly are looking forward to retirement, but they are often too likely to face retirement in bankrupcy. While the previous Labour government have done some reforms to secure pensions for our retirees, we in Venstre will finish it in a reasonable way." #NT!
 NOR_work_with_moderate_unions: "Work With Moderate Unions" #NT!
 NOR_work_with_moderate_unions_desc: "The Workers' National Trade Union has since its founding represented a troublesome bunch of revolutionaries. However, there are many members and organizations under their umbrella that are willing to work for reforms instead of revolution. Many have an earnest interest to better the working conditions of their members, and opposes the revolutionary ambitions of some union crooks." #NT!
 NOR_liberalism_and_neutrality: "Liberalism and Neutrality" #NT!
 NOR_liberalism_and_neutrality_desc: "Mowinckel's vision can be summed up in two words: 'Liberalism' and 'Neutrality'. He seek to create a liberal Norwegian state, with freedom to trade our products onto the free market, in addition to a strong adherance to civil freedoms. He also seek this state to be neutral in the face of upcoming conflicts." #NT!
 NOR_promote_nordic_ties: "Promote Nordic Ties" #NT!
 NOR_promote_nordic_ties_desc: "Our closest ties is those we have with our Nordic neighbors. These are ties that will be useful both in securing markets for Norwegian products, as well as brothers who can back each other up when faced with conflict." #NT!
 NOR_strengthen_low_church: "Strengthen the Low Church" #NT!
 NOR_strengthen_low_church_desc: "Venstre has always been a friend to underdogs against elites. While Mowinckel is no Christian and Venstre has become a more secular party, we still support the low church. These churches are institutions that rejects state control over their teachings and operations. We should move away from the monopoly of the Church of Norway, strengthening the churches outside its control." #NT!
 NOR_oppose_protectionist_policies: "Oppose Protectionist Policies" #NT!
 NOR_oppose_protectionist_policies_desc: "Mowinckel and Venstre are strong supporters of economic liberalism. However, not many seek to follw this natural direction. Especially the Farmers' Party seek to drag Norway into protectionism, not understanding that free trade will be beneficial to the farmers. Even if they would move against us, we will not bow down to protectionism." #NT!
 NOR_promote_liberal_feminism: "Promote Liberal Feminism" #NT!
 NOR_promote_liberal_feminism_desc: "The same year Venstre was formed, the Norwegian Association for Women's Rights was formed. Since then, we have both worked towards the same goal. Equality and democracy for both sexes based on a liberal foundation. In recent years, socialist 'feminists' have tried to overshadow these fighters of justice and equality. We need to defend the liberal feminist tradition that have granted Norwegian women this equality." #NT!
 NOR_reduce_bureaucracy: "Reduce Bureaucracy" #NT!
 NOR_reduce_bureaucracy_desc: "Government need to be as efficient as possible. However, with the rise of modernity, it has seen a rise of an alienating bureaucracy that cages the people in paperwork and rutines. We should reduce this hurdle upon our people, ensuring that Norwegian bureaucracy shines as an example of efficiency and humanity." #NT!
 NOR_ban_political_militias: "Ban Political Militias" #NT!
 NOR_ban_political_militias_desc: "Norsk Samfundsvern and other militia groups challenge our democracy with their threats against opposing forces. We need to crack down on this, ensuring that everyone, be they socialist or conservative, can partake in our democratic institutions without threats by armed mobs of criminals." #NT!
  
 NOR_borgerlig_samarbeid: "Borgerlig Samarbeid" #NT!
 NOR_borgerlig_samarbeid_desc: "The non-socialist parties have a common political opponent in the socialist Labour Party. It is therefore natural for us to band together in a coalition against them. While there will be compromises, at least it is better than risking a socialist government." #NT!
 NOR_status_radio_monopoly: "Status of the Radio Monopoly" #NT!
 NOR_status_radio_monopoly_desc: "While many on the political right see the need for a Norwegian Broadcasting Corporation (NRK) to lead the way in radio news communication, some have problems with the radio monopoly that the socialist government enacted. Afraid that such a monopoly would make NRK a tool for ideological indoctrination, some right-wingers propose abandoning the monopoly and subsidize independent local radio stations across the country." #NT!
 NOR_encourage_new_businesses: "Encourage New Businesses" #NT!
 NOR_encourage_new_businesses_desc: "The reign of socialist governance was a reign marked by anti-business activities and laws. As a result, our industralists and business men was pressured out, leaving our country worse off. We need a new wave of businesses and entrepreneurship to enter Norway to rectify socialist mistakes." #NT!
 NOR_rebuild_farming_sector: "Rebuild the Farming Sector" #NT!
 NOR_rebuild_farming_sector_desc: "The Norwegian farmer was probably hit the hardest by the economic crisis. With recovery going smothly, we need to ensure that our farmers are able to rebuild their farms and produce products. This will include higher subsidies and protectionist policies despite the opposition to such measures in our coalition." #NT!
 NOR_promote_conservative_officers: "Promote Conservative Officers" #NT!
 NOR_promote_conservative_officers_desc: "The socialists in the Labour Party used to discriminate in promotions, often promoting officers that was either sympathetic to the Labour Party or officers who didn't voice any opinion on the government. This left many talented, conservative officers in the ditch. We need to set things right and recognize the efforts of these Norwegian patriots." #NT!
 NOR_resolve_monarchy_question: "Resolve the Monarchy Question" #NT!
 NOR_resolve_monarchy_question_desc: "The socialists used the people's lack of knowledge and a populist appeal to vote away the monarchy. As a result, the issue was never completely resolved. We need to give a proper, fair and well-informed choice to the Norwegian people so that we can lay this to rest once and for all." #NT!
  
 NOR_hoyre_victory: "Høyre Victory" #NT!
 NOR_hoyre_victory_desc: "The left, for the most part, hates Høyre, but they have good reasons for their victory. They have been able to attract both liberals and conservatives, and have had many on the far right reluctantly supporting them." #NT!
 NOR_integrate_samfundsvern_moderates: "Integrate Samfundsvern Moderates" #NT!
 NOR_integrate_samfundsvern_moderates_desc: "Norsk Samfundsvern and other militias do challenge Norwegian democracy. At the same time, their members are everyday people worried about the excesses of socialist government and the power of the Labour Party. By adopting some of their messaging, we can win some of them back to parliamentary democracy and gain a loyal cohort against Labour." #NT!
 NOR_leadership_question: "The Leadership Question" #NT!
 NOR_leadership_question_desc: "Since Ivar Lykke stepped away from leading Høyre, the position has been filled by Carl Joachim Hambro. Hambro is a leader with strong oratory skills and a strong focus on re-armament. However, some in the party oppose him due to his improvized and sometimes authoritarian leadership. This opposition has rallied behind Johan Henrik Andresen, a structured business man who could bring re-newed focus towards Høyre's economic agenda." #NT!
 NOR_limit_anti_parliamentarian_ideas: "Limit Anti-Parliamentarian Ideas" #NT!
 NOR_limit_anti_parliamentarian_ideas_desc: "The rise of socialists through our democratic systems and the economic crisis we have endured have soured many people's opinion on parliamentary democracy. Høyre has also had it's history with scepticism towards this system. However, we know today the benefits that this system gives. We should work to limit the anti-parliamentarian sentiments in Norway, bringing people back to democracy." #NT!
 NOR_arm_our_neutrality: "Arm Our Neutrality" #NT!
 NOR_arm_our_neutrality_desc: "A central theme of Høyre's campaign, was re-armament. Under socialist rule, our military has been left abandoned. Even under the liberals, there have been little focus on preparedness. If Norway is to continue to be a neutral country in Europe, we should be ready to defend our neutrality and our democracy. Remember the words in our anthem:\n\n'even we, when it is demanded, for its peace will encamp'" #NT!
 NOR_lift_socialist_red_tape: "Lift Socialist Red Tape" #NT!
 NOR_lift_socialist_red_tape_desc: "Since the socialists in Labour took power in 1930 have they tried everything to undermine our economy in an attempt to fulfill their dogmatic ideology. We should cut back on their regulations and taxes to let business breathe again. This way, our economy will be booming once more." #NT!
 NOR_church_and_values: "Church and Values" #NT!
 NOR_church_and_values_desc: "The Church of Norway has played a central role in fostering a moral society, one the socialists has tried to undermine through their over-zealous anti-Christian agenda. In cases of education and social policies, a balance will always need to be upheld between kowtowing to religious dogma and upholding critical thinking. We will find it by cooperation with the Church, not by crusading against it." #NT!
 NOR_moral_case_against_marxism: "The Moral Case Against Marxism" #NT!
 NOR_moral_case_against_marxism_desc: "There should be a serious discussion over the moral implication of Marxism. It have influenced people across the world with ideas, which on paper sounds lovely, but has resulted in authoritarianism. We need to learn the Norwegian people the real consequences of abandoning democracy for a proletarian revolution, and to find other solutions to handle material inequality." #NT!
 NOR_balance_the_books: "Balance the Books" #NT!
 NOR_balance_the_books_desc: "The socialists in Labour have ran a government on spending more than we have. This has resulted with our country knee-deep in debt. Fiscal discipline is necessary to bring our spending under control and achieve balance. While some would oppose the spending cuts we will propose, we will eventually have more money for spending after the cuts." #NT!
 NOR_paternalist_programs: "Paternalist Programs" #NT!
 NOR_paternalist_programs_desc: "A reason why the socialists managed to lull the working class into their grasp, is through the use of welfare programs. While our ambitions can never match theirs, we should try to counter these socialist bribes with our own ideas on welfare. Based upon paternalist principles, we will create a harmonious state for both worker and boss." #NT!
 NOR_empower_non_socialist_unions: "Empower Non-Socialist Unions" #NT!
 NOR_empower_non_socialist_unions_desc: "The Workers' National Trade Union are a gang of socialist troublemakers who serve the interest of revolution and the Labour Party over the interest of the working class. We need to empower independent unions outside their reach. Unions who base themselves upon a Protestant work ethic and Paternalist principles." #NT!
  
 NOR_samfundsvernets_coup: "Samfundsvernet's Coup" #NT!
 NOR_samfundsvernets_coup_desc: "Our men are now marching in the streets of the cities of Norway. We have finally saved the country from socialist dystopia! We will find out what to do with the socialist traitors, but for now, Norway can celebrate this victory!" #NT!
  
 NOR_monarchist_victory: "Monarchist Victory" #NT!
 NOR_monarchist_victory_desc: "While commander Ragnvald Hvoslef wants to make Vidkun Quisling the minister-president, the majority of the members of Norsk Samfundsvern has voted in favour of reinstating the monarchy." #NT!
 NOR_crown_prince: "The Crown Prince" #NT!
 NOR_crown_prince_desc: "We are afraid that king Haakon could be too indoctrinated into the absolutist ideology, that he would not listen to the people, and instead rule with a hard hand. His son, however, crown prince Olav, could be a wise choice since he believes more in the idea that he is the king for the people." #NT!
 NOR_listen_to_people: "Listen to the People" #NT!
 NOR_listen_to_people_desc: "The new king understands that his powers don't come from his wealth and influence, but from the will of the people. The king will loosen up on the rules that have targeted free speech, and wants his opposition to speak with him so he can listen and rule more wisely. This will also strengthen the king's approval by the public." #NT!
 NOR_reach_out_borgerlige_parties: "Reach Out to 'Borgerlige' Parties" #NT!
 NOR_reach_out_borgerlige_parties_desc: "The king needs to have the support of most of the political parties. These organizations and those who voted for them need to be respected. So long they are loyal to the king, they will be able to come with requests to the king." #NT!
 NOR_reestablish_parliament: "Reestablish the Parliament" #NT!
 NOR_reestablish_parliament_desc: "When the country was saved from the claws of socialism, the parliament was unluckily dissolved. Now when everything has stabilized, it is time to reestablish the parliament of Norway, Stortinget." #NT!
 NOR_kings_party_for_all: "A King's Party for All" #NT!
 NOR_kings_party_for_all_desc: "While the King will always serve as an impartial figure, we need a King's Party that can make the voice of the people heard to the king. While staying loyal to our monarch, it is always important that we do not become autocrats and despots. The people shall have their voice and their representation through the King's Party!" #NT!
 NOR_beyond_partisanship: "Beyond Partisanship" #NT!
 NOR_beyond_partisanship_desc: "Our movement is one beyond the destructive and polarizing nature of political parties. George Washington, a man who helped ushering a democratic republic, understood this fact better than anyone else about political parties:\n'...they are likely in the course of time and things, to become potent engines, by which cunning, ambitious, and unprincipled men will be enabled to subvert the power of the people and to usurp for themselves the reins of government, destroying afterwards the very engines which have lifted them to unjust dominion.'" #NT!
 NOR_towards_center: "Towards the Center" #NT!
 NOR_towards_center_desc: "The King's Party are not a right-wing nor a left-wing party. It is entirely the People's and the King's Party. It shall always be placed in the center of Norwegian politics. Not on the side of one section of the people, which is the fate of right-wing and left-wing parties, but on the side of all the people - and His Majesty of course." #NT!
 NOR_facade_of_democracy: "A Façade of Democracy" #NT!
 NOR_facade_of_democracy_desc: "In the modern world, the people will always seek a way to influence the policies of the nation. It will be our responsibility to provide them with a 'democratic' voice. However, with political parties no longer legal and the election system entirely under our control, our people will have a façade of a democratic choice." #NT!
 NOR_loyalist_propaganda: "Loyalist Propaganda" #NT!
 NOR_loyalist_propaganda_desc: "Even if His Majesty's Kingdom shall respect the freedom of the press, we need to ensure that the press they read, see and hear is our press. Through propaganda, our people will know our truth about the greatness of His Majesty and his everyday service to his people." #NT!
 NOR_king: "The King" #NT!
 NOR_king_desc: "It is treason to say we should pick the former crown prince as king when the real king is still alive. King Haakon is known for sliding into a more authoritarian view on governing, but he is, after all, our true and honourable monarch." #NT!
 NOR_royal_guard_police_forces: "A Royal Guard Police Force" #NT!
 NOR_royal_guard_police_forces_desc: "The Royal Guards have great experience as guardsmen and could use this experience to further strengthen our police forces. In addition, this would be a way for loyal guardsmen to secure control over the Norwegian police, ensuring its loyalty to the King." #NT!
 NOR_subjugate_samfundsvernet: "Subjugate Samfundsvernet" #NT!
 NOR_subjugate_samfundsvernet_desc: "Samfundsvernet have been loyal in restoring the King to the throne. However, their loyalty aren't to our monarch, but to men like Ragnvald Hvoslef and visions that could place our Kingdom in danger. We need to pacify them, ensuring that they doesn't pose a threat. Hopefully some of them are willing to join us." #NT!
 NOR_modern_royal_titles: "Modern Royal Titles" #NT!
 NOR_modern_royal_titles_desc: "In some societies today, the Royals are treated like unimportant people. But the reality is that such belief is treason in itself. The Royals are chosen by God to rule and should be given their rightful privileges." #NT!
 NOR_christian_moral_society: "A Christian, Moral Society" #NT!
 NOR_christian_moral_society_desc: "His Majesty see many among the people who have fallen from the Church and who celebrates immorality. This can't stand. It is in his will that all are educated in the values of our Christian faith and that the values of our Church are enforced throughout our society. Everyone will know the name of God!" #NT!
 NOR_punish_socialists: "Punish the Socialists" #NT!
 NOR_punish_socialists_desc: "High Treason, Corruption, Seizure of Power, Insurrection.\nAll crimes that the Norwegian socialists in the Labour Party are guilty of. While these are crimes that would easily lead to execution, the King want to show his mercy towards these citizens that have wronged him and only give them light sentences - like life imprisonment - instead." #NT!
 NOR_empower_fagopposisjonen: "Empower Fagopposisjonen" #NT!
 NOR_empower_fagopposisjonen_desc: "The Workers' National Trade Union are known for their corruption and socialism. However, an opposition group inside it has rose up in support of our King and of decency. While the old organization need to be torn down, this group of loyal workers' representatives will form the basis for the Professional Organization of the Norwegian Realm." #NT!
 NOR_paternalist_economics: "Paternalist Economics" #NT!
 NOR_paternalist_economics_desc: "The conditions that allowed capitalists to exploit their workers, which also helped fuel the dangerous sickness known as socialism, shall never happen again. It is the responsibility of the capitalist to take care of his workers welfare, and if not, he will lose his business." #NT!
 NOR_benevolent_monarch: "A Benevolent Monarch" #NT!
 NOR_benevolent_monarch_desc: "His Majesty see many among the people who struggle day to day in his country. This can't stand. It is in his will that the state provide services such as unemployment, pensioner and maternity benefits. Services that help our stuggling citizens the most. No one will go to bed hungry!" #NT!
 NOR_voluntary_work_service: "Voluntary Work Service" #NT!
 NOR_voluntary_work_service_desc: "His Majesty see many among the people without employment in his country. This can't stand. It is in his will that we organize a voluntary work service where young men can serve their King and their nation, and in return be helped on the path of steady employment. No one will be slave to poverty!" #NT!
 NOR_work_with_ns: "Work With NS" #NT!
 NOR_work_with_ns_desc: "Many of the people in the council would see this move as dangerous. To allow Nasjonal Samling into the council could be troublesome for some people, because of their political stands. But the king believes this will help in stabilizing the kingdom." #NT!
 NOR_entrench_strict_loyalty: "Entrench Strict Loyalty" #NT!
 NOR_entrench_strict_loyalty_desc: "We need to secure the loyalty of the people to the King. Through the powers of propaganda, we will present the King as a Paternal figure that the people naturally should respect and love. We should also secure that no slander and ill speak is done against the King and his person." #NT!
 NOR_absolute_rule: "Absolute Rule" #NT!
 NOR_absolute_rule_desc: "While it will be hard for a people of a modern time to understand, the King does have the right to rule from God. Instead of favoring one section of the people to rule on behalf of His Majesty, governing should be done under an Absolute monarch. That way, all his people have an equal opportunity to reach out to him." #NT!
 NOR_enlighten_absolutism: "Enlightened Absolutism" #NT!
 NOR_enlighten_absolutism_desc: "The Age of Enlightenment brought a lot of good philosophy, ideas and technology to the world. Unfortunately, it also gave fuel to movements who displaced their monarchs from power. Out from this era however, figures like Catherine II of Russia, Charles III of Spain and Frederick the Great rose to champion an Enlightened form of Absolutism. A form that balanced the King's right to rule with improvement of society for its citizens. A form Norway should learn from." #NT!
 NOR_quisling_in_cabinet: "Quisling in Cabinet" #NT!
 NOR_quisling_in_cabinet_desc: "While King Haakon isn't the biggest fan of Vidkun Quisling, he achknowledge that Quisling can be a valuable ally if Republican forces rises again. Bringing Quisling and his supporters into His Majesty's government could help in ensuring that Nasjonal Samling doesn't create any trouble." #NT!
 NOR_utilize_ns_structures: "Utilize NS Structures" #NT!
 NOR_utilize_ns_structures_desc: "Nasjonal Samling have many intraparty structures, with organizations for men and women of all ages. These structures could be used in the service of his majesty. Of course, anti-monarchist elements need to be rooted out. Besides that, many NS members are willing to serve their King." #NT!
 NOR_heir_of_st_olav: "The Heir of St. Olav" #NT!
 NOR_heir_of_st_olav_desc: "All Norwegian kings gain their legitimacy through God. However, this legitimacy isn't given directly to each king. It is granted to them as the legitimate heir of Saint Olav, the King who brought the Christian faith to Norway. King Haakon VII isn't legitimate only because of the people's vote in 1905. He is legitimate because he is the heir of Norway's Eternal King!" #NT!
 NOR_long_live_the_king: "Long Live the King" #NT!
 NOR_long_live_the_king_desc: "The Norwegian King are the embodiment of the Norwegian nation. He are set to rule the people as an anointed servant of Christ. The King's rule is not like the master's rule over his slaves. Instead, our King is an enthroned servant of the Norwegian people.\n§YLong may he live, Long Live the King!§!" #NT!
  
 NOR_NS_victory: "NS Victory" #NT!
 NOR_NS_victory_desc: "While there are many members that want either democracy or monarchy, the majority, with commander Ragnvald Hvoslef at the front, have voted for Nasjonal Samling to take control in Norway. Vidkun Quisling will become the new minister-president of Norway." #NT!
 NOR_promote_loyal_policemen: "Promote Loyal Policemen" #NT!
 NOR_promote_loyal_policemen_desc: "Since the socialists came to power, they have attempted to take control over the police and purging it of nationally-minded officers. Luckily, they did not succeed. There are many within the police sympathetic to our party. We can assure the loyalty of the police by promoting these officers into leadership positions." #NT!
 NOR_remove_socialist_cancer: "Remove the Socialist Cancer" #NT!
 NOR_remove_socialist_cancer_desc: "Resistance from the socialists are still rampant in Norway. This Moscowite influence causes good Norwegian men and women to take up arms against our nation. We need to purge out this socialist cancer, both from society and from the minds of the Norwegian workers." #NT!
 NOR_subdue_monarchists: "Subdue the Monarchists" #NT!
 NOR_subdue_monarchists_desc: "The monarchists have been a good ally to achieve our goal, but they are more loyal towards an exciled Dane than towards the nation. While monarchy could be useful to unite and temper the conservative forces in Norway, it is an archaic institution which likely would fight against our leaders for dominance." #NT!
 NOR_enforce_jodeparagrafen: "Enforce Jødeparagrafen" #NT!
 NOR_enforce_jodeparagrafen_desc: "In 1814, the founding fathers of our constitution understood the threat in allowing Catholics and Jews to gain too much power and influence in Norway. While we still forbid Catholic Jesuits from entering the realm, we sadly allowed Jews and their influence to come in. Through reamending the constitution and enforcing the paragraph, we can finally 'help' our Jewish neighbors to move. Either back to Eastern Europe, to Palestine or another place." #NT!
 NOR_norges_faggruppeorganisasjon: "Norges Faggruppeorganisasjon" #NT!
 NOR_norges_faggruppeorganisasjon_desc: "Unlike the liberal capitalists, we understand the need for the Norwegian workers to be represented and heared. While the Workers' National Trade Union is poisoned by socialism, a minority still exist that seek to decouple the fight for Norwegian workers from international marxist socialism. They will form the foundation for a Norwegian Organization of Professional Workers." #NT!
 NOR_establish_arbeidstjenesten: "Establish Arbeidstjenesten" #NT!
 NOR_establish_arbeidstjenesten_desc: "Faced by unemployment and inactivity, many see the need to organize a work service for young Norwegian men. Here, they can come to work and contribute to society, while the work service can be a good way for further employment in either the military or in related work fields." #NT!
 NOR_agrarian_revitalization: "Agrarian Revitalization" #NT!
 NOR_agrarian_revitalization_desc: "The agrarian sector has been stagnant since the economic depression. Many farmers struggled to pay off debt and survive while the rich city-folk continued to exploit them. We need serious investments into the Norwegian farmers, helping them to rebuild their lives and to modernize their farms." #NT!
 NOR_integrate_samfundsvernet: "Integrate Samfundsvernet" #NT!
 NOR_integrate_samfundsvernet_desc: "Samfundsvernet have been a great help in overthrowing the socialist regime. However, they operate too much as an organization on the sideline of our government. We can't have military organizations that are not completely loyal to Nasjonal Samling. However, many in their ranks support us and they can easily swap out their Samfundsvern uniforms with uniforms from Hirden." #NT!
 NOR_militarize_hirden: "Militarize Hirden" #NT!
 NOR_militarize_hirden_desc: "Hirden is a paramilitary organization loyal to the will and goals of Nasjonal Samling. Until now, they have acted like guards and extra police units. We need to militarize them while making them a natural part of the Norwegian forces and society. In all levels of our armed forces, the influence of our Hirdmenn will be felt." #NT!
 NOR_heim_ett_fedreland: "Heim, Ætt, Fedreland" #NT!
 NOR_heim_ett_fedreland_desc: "Home, Family and Fatherland. These words underline the values that our regime seeks to preserve. We want Norway to be a homeland for a healthy and proper Norwegian people. The strongest defenders of national values, both in the past and in modernity, has been the Norwegian woman. While some have seen childrearing responsibilities as a way to oppress women, we know and appreciate the empowering position this gives the women of Norway." #NT!
 NOR_festning_norge: "Festning Norge" #NT!
 NOR_festning_norge_desc: "Our country is not surrounded by friends. We need to protect our coast and seas from the imperial ambitions enbodied by the French and the British. We need to make our nation into a fortification!" #NT!
 NOR_work_camp_for_socialists: "Work Camps for Socialists" #NT!
 NOR_work_camp_for_socialists_desc: "It is too costly to let the socialist and Marxist traitors rot in prison. Instead, we should force them to do hard work in the communities and in the factories, of course, overseen by loyal members of NS." #NT!
 NOR_approach_valkist_factionalism: "Approach Valkist Factionalism" #NT!
 NOR_approach_valkist_factionalism_desc: "While the Socialists are ousted, the power of our fører isn't yet secure. For every day that passes, we see increasing division between those loyal to the leadership of Vidkun Quisling and those who seek to move Norway more towards a Valkist-inspired direction. Led by Hans S. Jacobsen, they seek a more radical direction for our country." #NT!
 NOR_entrench_ns_rule: "Entrench Quisling's Rule" #NT!
 NOR_entrench_ns_rule_desc: "The many challenges against Quisling's rule tried to rise up against our leader. Luckily, they have been dealt with as the opponents are either sidelined or kicked out as 'envoys' to Germany. No longer will these internal socialists challenge the stability of Norwegian society and the prosperous future we seek under the leadership of Vidkun Quisling." #NT!
 NOR_reforged_christian_church: "A Reforged Christian Church" #NT!
 NOR_reforged_christian_church_desc: "When we took power, there were still many in the Norwegian Church who opposed it. However, we have since then worked to mend the institutions of the Church into our image. Quisling also has a few ideas of his own, what he call 'Universism', which we could seek to implement in this reforged Church." #NT!
 NOR_integrate_capitalist_class: "Integrate the Capitalist Class" #NT!
 NOR_integrate_capitalist_class_desc: "Many capitalists have been sceptical towards the Quisling regime due to the socialist tendencies from some of our members. However, Quisling and his closest circle are far from socialists. Instead, they seek an economy where the different sections of society work together for the betterment of the nation." #NT!
 NOR_loyalty_to_foreren: "Loyalty to Føreren" #NT!
 NOR_loyalty_to_foreren_desc: "Loyalty to Vidkun Quisling, føreren, is an important tenant of our nation. Quisling has saved Norway from destruction by the forces of socialism, and he will lead the country into a prosperous future. Only under him will Norway ever be great again." #NT!
 NOR_depose_quisling: "Depose Quisling" #NT!
 NOR_depose_quisling_desc: "Vidkun Quisling has fallen. While he fought valiantly against the corrosive forces of socialism and liberal democracy in Norway, he was ultimately a weak ruler who believed himself to have the strength to lead our nation. Now, we can finally steer Norway into a better future for all it's people." #NT!
 NOR_paetelist_principles: "Paetelist Principles" #NT!
 NOR_paetelist_principles_desc: "We are inspired by Karl Otto Paetel's ideas of socialism under the basis of nationalism instead of marxist internationalism. Instead of compromising with the fickle capitalist class, like Quisling would do, we need to have the economy under national control. An economy which would work for workers and farmers, not for the capitalists." #NT!
 NOR_end_white_christs_influence: "End White Christ's Influence" #NT!
 NOR_end_white_christs_influence_desc: "Jesus Christ, also known as White Christ, and his followers have often proven themselves to hold Norway back. It isn't surprising since he came as a way to force Norway under Papist boots, and it hasn't changed even if he took on a Protestant form. To continue our national revolution, we need to end the influence that Christ and his Church has over Norway." #NT!
 NOR_meritocratic_order: "A Meritocratic Order" #NT!
 NOR_meritocratic_order_desc: "While we aren't totally against the principle of having a leader, a 'fører', we don't support giving leadership to a bozo like Quisling. We seek to build a meritocratic system from the buttom-up that awards military and intellectual prowess. A system where Norway's best fighters have a greater chance to lead the nation than the degenerate elites of yesteryears." #NT!
 NOR_rikstinget: "Rikstinget" #NT!
 NOR_rikstinget_desc: "We need to overturn the broken systems of old. The establishment of Rikstinget will not be one of continuing the faults of the past. Instead, the different sections of our people; workers, farmers, city-folk, etc. will be united to work for our vision for Norway." #NT!
 NOR_with_spirit_st_olav: "The Spirit of St. Olav" #NT!
 NOR_with_spirit_st_olav_desc: "An important symbol for the party is the Sun Cross. Often, it is mentioned as the Olav Cross. It is indeed the steps of Saint Olav we follow. He united Norway into a Christian realm, and we will follow in uniting the Norwegian people into a national community. It is the spirit of Saint Olav that flows in our Norwegian blood." #NT!
 NOR_spirit_germanic_volk: "The Spirit of A Germanic Volk" #NT!
 NOR_spirit_germanic_volk_desc: "The Norwegian people isn't an entity separate from the world around them. They are all a part of a Germanic community, a community of the peoples of the Nordics and of the German lands. The struggles of the German people aren't foreign to us, we share them as part of a Volk. This spirit is alive in us, as it is in the Germans." #NT!
  
 NOR_looking_outwards: "Looking Outwards" #NT!
 NOR_looking_outwards_desc: "The world is growing more and more unrestful ever since the Great War. While Norway has managed to survive in peace with its neutrality, some see the rising tension as a sign that we need to re-evaluate this stance." #NT!
 NOR_spreading_revolution: "Spreading the Revolution" #NT!
 NOR_spreading_revolution_desc: "The Socialist revolution can not be contained in one country or to one people. The challenges of the working class is shared by the workers of every country, and we need to do our job to liberate the workers of neighboring nations. Some in our movement see the Pan-Scandinavian movement as an inspiration to bring freedom to the workers of all the Nordics." #NT!
 NOR_support_danish_left: "Support the Danish Left" #NT!
 NOR_support_danish_left_desc: "The Danish Republicans and Communists are in support of our socialism and will likely be sympathetic to a union between Norway and Denmark. Sending them support and recruiting some of them would be a obvious move before we overthrow the Danish bourgeoisie and establish socialist unity." #NT!
 NOR_secure_denmark: "Захватить Данию"
 NOR_secure_denmark_desc: "It is time to take over Denmark. If they are fellow socialists, they will likely see reason and join us without a fight. If they are reactionaries, we have to crush them and free the Danish working class. For the Revolution!" #NT!
 NOR_harbour_swedish_revolutionaries: "Harbour Swedish Revolutionaries" #NT!
 NOR_harbour_swedish_revolutionaries_desc: "There are many Swedish socialists, members of the Socialist and Communist parties, that can be willing to work with us in achieving liberation for the Swedish people. The working class of Sweden isn't our enemy, we have a common enemy in the reactionary regime that oppresses them." #NT!
 NOR_a_swedish_revolution: "A Swedish Revolution" #NT!
 NOR_a_swedish_revolution_desc: "It is time to bring the revolution east, into Sweden, and bring unity between the Norwegian and Swedish working class. If they are fellow socialists, they will likely listen to our reason. If they are reactionaries, we have to crush them and free the Swedish working class. For the Revolution!" #NT!
 NOR_work_with_finnish_reds: "Work With the Finnish Reds" #NT!
 NOR_work_with_finnish_reds_desc: "In its fight for independence, the Finnish Reds attempted to free the working class. While they were fought back by the bourgeois reactionaries, they can still be a great ally in liberating Finland. Both the workers of Norway and the workers of Finland has a common enemy in the bourgeoisie who keeps us separated." #NT!
 NOR_march_into_finland: "March Into Finland" #NT!
 NOR_march_into_finland_desc: "It is time to march into Finland, to liberate their workers from their chains, and unite into one socialist country. If they are fellow socialists, they will likely join us. If they are reactionaries, we will crush them with the hammer of the worker. For the Revolution!" #NT!
 NOR_scandinavian_socialist_republics: "The Scandinavian Socialist Republics" #NT!
 NOR_scandinavian_socialist_republics_desc: "With the fall of the last reactionary regime in Scandinavia, red banners fly now over Northern Europe. But we have to show that we are liberators, not conquerors. Workers from all the Nordic countries; Norway, Sweden, Denmark and Finland participated to liberate this land. So we should form a union of socialist republics between these brethren peoples." #NT!
 NOR_reconstruction_and_integration: "Reconstruction and Integration" #NT!
 NOR_reconstruction_and_integration_desc: "The conflicts that have led to this unification has left these Scandinavian lands in ruin. Both as a sign of our commitment to this union and as a way to integrate our new lands, we should fund the reconstruction of industries and infrastructure. Through this effort, we will be able to bind our nations together." #NT!
 NOR_socialist_scandinavianism: "Socialist Scandinavianism" #NT!
 NOR_socialist_scandinavianism_desc: "The Pan-Scandinavian project of the 19th century may have been led primarily by bourgeoisie liberals, but some of their ideas are still valuable. Even if our socialist ideology prioritizes internationalism, we can use Scandinavian Pan-Nationalism to strengthen the international cooperation between the different nations of Scandinavia." #NT!
 NOR_nordic_neutrality: "Nordic Neutrality" #NT!
 NOR_nordic_neutrality_desc: "" #NT!
 NOR_military_cooperation: "Military Cooperation" #NT!
 NOR_military_cooperation_desc: "" #NT!
 NOR_seek_western_allies: "Seek Western Allies" #NT!
 NOR_seek_western_allies_desc: "" #NT!
 NOR_entente_advisors: "Entente Advisors" #NT!
 NOR_entente_advisors_desc: "" #NT!
 NOR_securing_nordic_front: "Securing the Nordic Front" #NT!
 NOR_securing_nordic_front_desc: "" #NT!
 NOR_prepare_for_german_confrontation: "Prepare for German Confrontation" #NT!
 NOR_prepare_for_german_confrontation_desc: "" #NT!
 NOR_support_finns: "Support the Finns" #NT!
 NOR_support_finns_desc: "" #NT!
 NOR_german_alignment: "German Alignment" #NT!
 NOR_german_alignment_desc: "" #NT!
 NOR_revive_greenland_case: "Revive the Greenland Case" #NT!
 NOR_revive_greenland_case_desc: "In 1814, the great powers divided our nation in two, the 'Danish' part and the 'Swedish' part. While our brothers in the North Atlantic did not fight for independence like we did, they are still brothers. When we got independence in 1905, the Danish did not give over their territories. It is time to take back these territories and unite the Norwegians!" #NT!
 NOR_integrate_western_islands: "Integrate the Western Islands" #NT!
 NOR_integrate_western_islands_desc: "" #NT!
 NOR_explore_greenland: "Explore Greenland" #NT!
 NOR_explore_greenland_desc: "While there is mostly just white ice and snow in Greenland, we have the potential to start industry along the southern coast." #NT!
 NOR_icelandic_industries: "Icelandic Industries" #NT!
 NOR_icelandic_industries_desc: "The industry of Iceland is tiny. There is almost nothing there. Just some naval ports and old houses. We need to improve this territory and get people to immigrate here." #NT!
 NOR_claims_in_east: "Claims in the East" #NT!
 NOR_claims_in_east_desc: "The Swedes have in many years occupied Alvheim and öystræ rikinu, Jemtland. These were unlawfully seized and the Danes believed they could represent us. We claim these lands as parts of Norway." #NT!
 NOR_integrate_eastern_lands: "Integrate Eastern Lands" #NT!
 NOR_integrate_eastern_lands_desc: "" #NT!
 NOR_develop_east: "Develop the East" #NT!
 NOR_develop_east_desc: "" #NT!
 NOR_greater_norwegian_dream: "The Greater Norwegian Dream" #NT!
 NOR_greater_norwegian_dream_desc: "We have finally fully united the Norwegian nation. It is a great achievement, one we need to show our pride for. A new age has arrived in the world. The age of Greater Norway!" #NT!
  
 #### Decisions #### 
  
 NOR_economical_decision_group: "Norway's Economical Decisions" #NT!
 NOR_economical_decision_group_desc: "Norway has for a long time been a rural and non-industrial state. We got a beginning after independence in 1905, but we need to continue our industrial rise." #NT!
  
 NOR_land_distribution: "Land Distribution" #NT!
 NOR_land_distribution_desc: "No Longer shall there be people in our country with 'unearned' riches and wealth!" #NT!
 NOR_expand_steel_mines: "Expand the Steel Mines" #NT!
 NOR_expand_steel_mines_desc: "There is potential to mine out a lot of iron and steel in Norway." #NT!
  
 NOR_war_with_decistions: "Foreign Policy" #NT!
  
 NOR_white_peace_sweden: "White Peace with Sweden" #NT!
 NOR_white_peace_sweden_desc: "The war between us, Norway, and Sweden has not come to an end. There is, however, no clear winner in this either, so we must try to sign a white peace." #NT!
  
 NOR_join_third_international: "Joining the Third Internationale" #NT!
