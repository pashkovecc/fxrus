 AST_vanguard_of_revolution: "The Vanguard of the Revolution" #NT!
 AST_vanguard_of_revolution_desc: "" #NT!
 AST_collectivization_efforts: "Collectivization Efforts" #NT!
 AST_collectivization_efforts_desc: "" #NT!
 AST_export_revolution: "Export the Revolution" #NT!
 AST_export_revolution_desc: "" #NT!
 AST_great_australian_purge: "Great Australian Purge" #NT!
 AST_great_australian_purge_desc: "" #NT!
 AST_power_to_chairman: "Power to the Chairman" #NT!
 AST_power_to_chairman_desc: "" #NT!
 AST_down_with_king: "Down With the King" #NT!
 AST_down_with_king_desc: "Memories of Gallipoli still run strong in Australia, and cries of 'never again!' are not enough. We must cut ties with the British not only in terms of our government, but also with our economy and our military alliances. Our nation must stand on its own, and from this day forth we will never again send our sires to the slaughter in a war of European Imperialism." #NT!
 AST_down_with_king_tt: "The §COffice of the Governor-General§! will be §Rabolished§! along with our ties with @ENG §Y[ENG.GetNameDef]§!\n\n" #NT!
 AST_purge_monarchist_parties: "Purge Monarchist Parties" #NT!
 AST_purge_monarchist_parties_desc: "" #NT!
  
 AST_flying_eureka: "Flying the Eureka" #NT!
 AST_flying_eureka_desc: "The people have spoken, and now it is time for Australia to turn its back on a history of colonial oversight and cruelty. No longer will we fight wars in distant lands that shed Australian blood to no good purpose. Our destiny is our own, and we will not waste this opportunity!" #NT!
 AST_flying_eureka_tt: "§GThis focus will be automatically be bypassed once the Australia First Movement has taken power.§!" #NT!
 AST_intellectual_movement: "An Intellectual Movement" #NT!
