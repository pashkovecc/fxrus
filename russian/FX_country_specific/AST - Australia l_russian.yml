 ### Events 
 australia.0.t: "The Great Southern Land" #NT!
 australia.0.d: "The Commonwealth of Australia was established on January 1. 1901, with the six self-governing colonies of Queensland, New South Wales, Victoria, Tasmania, South Australia, and Western Australia united into one Commonwealth. Not long after, the new nation would recieve the status of Dominion within the British Empire.\n\nWith the onset of the Great War, the unity of Australia would be seriously tested. The war was seen as a test for the federal forces to prove that they would be better than state-based militaries. With the death of many Australian sons, doubts regarding the federal forces began to brew. Another blow to the unity of Australia would be the failure to complete the transcontinental railway, increasing the tensions between the East and the West. When the economy of Western Australia collapsed during the 1920s, calls for secession would grow in the western state.\n\nWith the start of 1936, the unity once present in Australia seems to be replaced by regionalism and the western call for secession. While the traditional political players; Labor, Country and the Nationalists, have remained strong players in Australian politics, these parties are more and more plauged by regionalism from state parties, along with the growth of radical groups like the Communists and the AFM.\n\nThe current Labor-run government have continued to be stable, but this stability and unity might just prove to be a facade in the face of true adversity and crisis." #NT!
 australia.0.a: "Advance Australia!" #NT!
  
 australia.1.t: "The King is Dead.." #NT!
 australia.1.d: "News from England has hit the shores of Australia. The King of Australia, George V, has passed away from this world. All over the world, including here in Australia, the death of the King has been met with mourning.\n\nWhile the news are saddening for some. For others, they see the news of the King's death differently. Along with Australian people mourning the loss, there are many that has taken the news as an oppotunity to protest the monarchy. Especially in Western Australia has there been brewing some discontent from people losing faith in the monarchy and in the British Empire. These sentiments seems also to not only come from radicals on the left and the right, but also from those one could call "ordinary people".\n\nWhile the Australian government and many of the country's people answer the news with a "Long Live the King", some will instead answer it with a "Long Live the Republic"." #NT!
 australia.1.a: "Troubling.." #NT!
  
 australia.2.t: "The May Day Insident" #NT!
 australia.2.d: "While the Labor Party are usually considered the leading party under the May Day celebrations, there have been some opposition growing to this recently. In both the demonstrations and in the unions, more and more space have been given to pro-Communist protestors.\n\nThis led to an embarassing insident in Western Australia, where a local branch of the ACTU, the Australian Council of Trade Unions, chose to not invite a local Labor leader, citing the party's slothful behavior in passing pro-Labor policies. As a result, this have led to an confrontration between supporters of Labor and aledged Communist-leaning ACTU members on May Day itself this year. Resulting in a pro-Labor Party banner being stolen and some violent behavior following it, the whole case has ended in a general embarassment for local Labor and ACTU members alike." #NT!
 australia.2.a: "Are We Not Fighting For The Same Things?!" #NT!
  
 australia.3.t: "The 1936 Western Australia State Election" #NT!
 australia.3.d: "These days, state elections have been held in the most-western state of Australia, Western Australia. The last election in the state saw a razor thin electoral victory for Labor and Philip Collier over the Nationalist-Country coalition led by James Mitchell.\n\nNow, three years later, the election in the state has been more troublesome than usual. While the victory for the Nationalist-Country coalition under Country's Charles Latham are expected, the more unexpected part is a strong showing of the Auralia Out Movement this election. Led by Australian nationalist and anti-monarchist Xavier Herbert, the movement has managed to secure two seats in the Western Australian Legislative Assembly through an unholy alliance between anti-monarchists of both the far-right as well as the far-left.\n\nWhat these news might mean for Western Australia and the country as a whole, can be worrying. It is to see if sensible politics are able to withstand these radical movements." #NT!
 australia.3.a: "Rarely Any Good News From Perth.." #NT!
  
 australia.4.t: "The Military Training Debate" #NT!
 australia.4.d: "With the rise of Valkism in Europe, calls to make new reforms regarding military training in Australia has been called. Even with the situation ahead, the issue over a stronger and increased military training plan has been met with opposition among Labor politicians, even in the Federal Government itself.\n\nWhile both the Nationalist opposition as well as many Laborites and Country politicians urges the government to strengthen the military training of Australian soldiers, there are perhaps even more Laborites opposed to such a plan, along with many pacifists opposed to the military all together. In the end, this issue has not reached a conclusion, with the Federal Government choosing to do nothing for now." #NT!
 australia.4.a: "Status Quo is Sometimes the Best" #NT!
  
 australia.5.t: "London Stock Market Crash Hits Australia" #NT!
 australia.5.d: "Disaster! The London Stock Market Crash has now spread all over the British Empire, inflicting a wound upon Australia. As in Britain, the Australian market has been draged into the dirt, leaving unemployment and economic damage in it's wake.\n\nEven then, something do tell us that the crash itself is just the start of a troublesome time in Australian history. Already lies the fairly sucessful premiership of James Scullin in ruins, with the opposition using the crisis as a way to drag the Federal Government down. In addition are disputes beginning to form between factions seeking different answers in solving the economic crisis. Even then, we would have to wait for the crisis to stabalize before doing anything to fix it." #NT!
 australia.5.a: "God! Have You Abandoned Us?!" #NT!
  
 australia.6.t: "Left Laborites Push For Socialization" #NT!
 australia.6.d: "The Australian Labor Party is not at all completely unified on all things. Inside the party, a diverse cast of socialists to centrists can be found. This time, the Labor MP John Curtin has once more, along with his left-wing allies in the House, pushed for socialization of Australian infrastructure and critical industries. With the rising tentions in the world, Curtin sees these measures as an important step to secure the country's readyness, while also seing an end to the influence of capitalism on Australian infrastructure and critical industries. The hope Curtin have, is to see these changes for next year's budget.\n\nWhile the opposition from the Nationalists are suspected, Curtin was a bit taken back by the opposition from some of his own party comrades. Even if their opposition was more neuanced, they do still call him a socialist that seeks to uproot the good private initiatives of the country. After some time, Prime Minister James Scullin managed to end the debate inside Labor. Afraid that such disagreements can challenge the unity of the party, he urges Curtin and other Labor MPs to debate the party's stance on the backroom." #NT!
 australia.6.a: "Why This Disunity, Men?" #NT!
  
 australia.7.t: "Anti-Government Protests Begins" #NT!
 australia.7.d: "With climbing unemployment and a broken market, people around the whole country are beginning to blame the government for this situation. Tricked in to belive in alternative solutions to Australia's problems, working class unemployed people have started to gather in the streets to protest the government.\n\nWith the Scullin cabinet still wondering how to respond to this crisis, a growing number of protests are poping up. One state ecpesially affected by both the economic crisis and increased riots, are Western Australia. With the crisis, the state's Auralia Movement have growned especially popular and the consept has been adopted by some western socialists and anti-monarchists." #NT!
 australia.7.a: "Please Be Peaceful" #NT!
  
 australia.8.t: "Labor Divided on Crisis Response" #NT!
 australia.8.d: "With the economic crisis ravaging through Australia, calls for the Federal government to do something about it has emerged. With the Federal government inable to do anything, State governments have started to deal with the crisis in it's own way. Even so it is clear that we need a unified plan for recovery in Australia.\n\nEven if Labor is a socialist party, Prime Minister James Scullin has been hesitant to enforce a radical economic recovery plan on the country. With many voicing the opinion that a conservative plan would be better to keep spending and debt low, Scullin are showing interest in this solution. On the other side, both Labor MP John Curtin and the Premier of North South Wales, Jack Lang, seek a more interventionist approach.\n\nWith the crisis going on, it will be neseccary to choose a plan. Both for the well-being of the country as a whole and for the well-being of the Labor Party and Scullin's government." #NT!
 australia.8.a: "Easier Said Than Done" #NT!
  
 australia.9.t: "The Lyons Proposal" #NT!
 australia.9.d: "Joseph Lyons, a economically conservative member of the Labor Party's caucus in the House, has announced a plan for economic recovery that has angered many radicals and left-wingers inside the Labor caucus. Lyons proposals to balancing the budget and cutting social spendings are so grand that even Prime Minister Scullin is hesitant.\n\nOn the other side, Mr. Lyons have gotten the support of many inside buisness, including influential members of the Melbourne Establishment. This support has alienated Lyons further from the labour union base of Labor, and if we are going to support his conservative plan, we might risk the party dividing between the right and the left. If we are to commit to Lyons' plan, we will see support from the Nationalist opposition.\n\nWith all this considered, our government have gotten both advice to reject and consider the plan announced by Joseph Lyons. Prime Minister James Scullin need to decide what will be done." #NT!
 australia.9.a: "Lyons Got a Plan! Let's Try it Out" #NT!
 australia.9.b: "No! This Plan Would Destroy Labor" #NT!
  
 australia.10.t: "Anti-Austerity Labor Cross the Floor" #NT!
 australia.10.d: "With the news of our adoption of Joseph Lyons' conservative recovery plan going through Australia, massive opposition was met from members of the party and different labour unions up to members of parliament sitting in the House. Today, led by John Curtin crossed left-leaning Labor MPs the floor, establishing a left-wing opposition to the current government.\n\nAlready, this Socialist Labor has gained the support of many labour unions and state parties previously tied to Labor. One surprising development was that the Jack Lang-led New South Wales branch of Labor did not join this new party. Instead, Lang seems to be as critical towards this Socialist Labor as he is towards the Lyons Plan." #NT!
 australia.10.a: "The Left-Wing is Rising" #NT!
  
 australia.11.t: "New South Wales Labor Bids Their Farewell" #NT!
 australia.11.d: "In the wake of the left-wing split in the Labor Party, with the socialists establishing a left-wing opposition to the Labor government, new developments seems to happen in New South Wales.\n\nAs a strong critic against both socialism and the conservative economic plan that the Scullin government has adopted, Jack Lang has declared himself and the NSW branch of Labor independent from the Federal Labor Party. He is joined by most New South Wales Laborites, further dividing our caucus in the House. With these developments, Labor is left with a caucus just two members bigger than the Nationalist Party. This in a House that saw our caucus double the size of the Nationalist caucus just a few weeks ago." #NT!
 australia.11.a: "How the Mighty has Fallen" #NT!
  
 australia.12.t: "Unexpected Support" #NT!
 australia.12.d: "With Labor seen the worst split in its history, there is not much left before the opposition Nationalist Party need to go before they can secure a victory over us. With them as our natural enemies in the House, it is surprising that they have now choosen to support the Scullin government. Opposition leader John Latham has declared that the Nationalist Party will support the current Labor government to asure stability through this economic crisis. In addition, Latham seeks to hinder any further growth in power to both Socialist Labor and Lang Labor.\n\nPrime Minister James Scullin has thanked Latham for his support, but has also reaffirmed that this does not mean that Labor will support Nationalist policies." #NT!
 australia.12.a: "You Are Still 'Opposition'" #NT!
  
 australia.13.t: "Jack Lang Proposes a Plan" #NT!
 australia.13.d: "With our rejection of the conservative austerity plan of Joseph Lyons, many anti-austerity Laborites has seen it as a sign for their proposed solutions to be presented. Labor MPs from New South Wales has brought forth a proposal from the New South Wales Premier Jack Lang. In this plan of his, the Federal government enacts wide interventionist reforms based on the theories of British economist John Maynard Keynes.\n\nThe plan would be controversial amoung economically conservative members of Labor, as well as opposed by the Nationalist opposition. In return, many labour unions and left-wingers have voiced their support in the Lang Plan. This despite the anti-socialist views of Premier Lang. It will be up to Prime Minister James Scullin to agree to the plan or not." #NT!
 australia.13.a: "We Need New South Wales on Our Side" #NT!
 australia.13.b: "No! We Should Take a Balanced Approach" #NT!
  
 australia.14.t: "Joseph Lyons Cross the Floor" #NT!
 australia.14.d: "With the rejection of his plan by the Federal government, Joseph Lyons has left Labor. Together with other economically conservative Laborites, he has now found new friends amoung the Nationalist Party. From this base, the Nationalists has been absorbed by a new political force in Australia: The United Australia Party.\n\nWith the leadership of Joseph Lyons, this new opposition party has gained huge momentum. For the first time since 1934, Labor has gained a formidable challenge to their power. The new party has commited themselves to the conservative recovery plan of Lyons, cutting spendings and balancing the budget. In addition, the party seeks to unite Australian society as a whole against the Socialist and Valkist threats present in the world." #NT!
 australia.14.a: "A Worthy Opponent Indeed" #NT!
  
 australia.15.t: "Lang's Response" #NT!
 australia.15.d: "When news about our rejection to his plan arrived Premier Jack Lang, he was not pleased. With him declaring our decision an act of submission to pro-austerity forces in the opposition, he has taken the choice to leave Labor.\n\nAlong with most of the New South Wales branch of Labor, Lang has established his own Lang Labor. With Labor losing control of one of the core state in the Commonwealth, our power is greatly weakened. While Labor's caucus in the House is still bigger than the Nationalist caucus, our absolute majority has been lost. Wonder if this is what Jack Lang wishes." #NT!
 australia.15.a: "A Party Divided.." #NT!
  
 australia.16.t: "Western Australia Ruin" #NT!
 australia.16.d: "Out of all the states and territories making up Australia, none has battered this economic crisis worse than Western Australia. With the agricultural industries of the state at an halt and the mining industries dried up by the crisis, the state has seen immense economic ruin in just a couple of weeks.\n\nThe people of Western Australia grows more and more alienated from the rest of Australia, proven by increased activity in the Auralia separatist movement. Both far-left and far-right Australian republicans have used this moment to stir up discontent in the western state. Even our MPs from Western Australia is affected, with them easier in believing that the Federal government has wronged the state." #NT!
 australia.16.a: "The Year is Bleak For the Commonwealth" #NT!
  
 australia.17.t: "Stab in the Back" #NT!
 australia.17.d: "As the 1937 General Elections are fast approaching, there are whispers of pessimism within the Labour MPs that the party would not survive the election. The recent London Stock Market Crash and the government's handling of the situation has extremely damaged it's reputation to the voter base, and the people have been blaming the Scullin Government for not doing enough for handle the economic situation. Some within the party ranks are even considering asking for Prime Minister James Scullin to resign as leader of the party, in order for Labour to survive the election, however, it comes to the Prime Minister himself to address these motions." #NT!
 australia.17.a: "Resignation is the only way forward" #NT!
 australia.17.b: "London should be the one to blame!" #NT!
  
 australia.18.t: "New Labour Party Chief" #NT!
 australia.18.d: "The resignation of James Scully have left the Labour Party without leadership, fortunately, there are two popular candidates that fill-up the position of Labour Party head. The first in John Curtin a prominent labour MP, that joined the Labor Party at a young age and was also involved with the Victorian Socialist Party, while Francis Forde a current minister of the Scully administer and also a prominent Labour Party member; who shall it be?" #NT!
 australia.18.a: "John J. Curtin" #NT!
 australia.18.b: "Francis M. Forde" #NT!
  
 australia.19.t: "Opposition to Wage Cuts" #NT!
 australia.19.d: "As part of the austerity measures introduced in Joseph Lyon's economic recovery plan, the government have decided to decrease the wages of various public workers which then also affected the workers in the private sector. This move have been critized by the ACTU or the Australian Council of Trade Unions, implying that the average worker have been left struggling in this economic catastrophe. Many are demanding that the government reverse this decision, particularly former Labour members in the left wing amplified by the ACTU." #NT!
 australia.19.a: "They have to deal with it." #NT!
 australia.19.b: "Now gentlemen, we can work this out." #NT!
  
 australia.20.t: "ACTU Announces General Strike" #NT!
 australia.20.d: "Various factory workers all over the Confederation walked off the job today, organising an illegal strike that prompted swift police reaction. This strike has been a response on the government's ignoring the ACTU's demands to rescind the Wage Cuts policies in the Austerity plan for recovering in the London Market Crash. The strikers, have barricaded themselves in front of their local factory gates and were issued an ultimatum to disperse - which they ignored. Violence quickly escalated when the police moved in, and the resulting riot ended with over thirty badly injured. Within a week, the factory workers were back on the job... now supervised by private militia soldiers, to ensure no further demonstrations." #NT!
 australia.20.a: "The unions are always the ones stirring up trouble." #NT!
  
 australia.21.t: "Kavanagh Gives Speech" #NT!
 australia.21.d: "Prominent ACTU leader Jack Kavanagh gave a speech that drew a very large crowd as well as media attention in Sydney today. Kavanagh spoke of the need for an 'open dialogue' between the unions and the government, and that there was no need to fear the brand of democracy that syndicalism brought. The speech was branded by some as the 'ramblings of a radical', though many others said that Kavanagh's well-spoken manner earned him many new supporters." #NT!
 australia.21.a: "I see..." #NT!
  
 australia.22.t: "Socialist March in Canberra" #NT!
 australia.22.d: "Many radicals supported by the Australian Council of Trade Unions have held an illegal march in several of Australia's cities, even in the capital, Canberra. In Canberra, many police units have been slow to react to ongoing marching of the protesters, and have led to the protesters successfully entering and vandalizing the parliament house, even capturing prominent politicians as hostages. As a response, the army have seen a battalion to suppress and disperse the radical protesters and in the tense situation have been..." #NT!
 australia.22.a: "The army storms the parliament house, and arrests the protesters!" #NT!
 australia.22.b: "The army units are powerless, the revolution is secured!" #NT!
  
 australia.23.t: "ACTU Celebrates Deal" #NT!
 australia.23.d: "The new Workers' Deal enacted by the government has been a great cause for celebration among Australia's working class - and the Australian Council of Trade Unions specifically has led marches across several large cities to commemorate the historic occasion. Speeches by ACTU leaders drew massive crowds, where they spoke with obvious fervour about syndicalist ideals and the true interests of the working class. Police stood nearby, keeping back agitators who hurled slurs at the socialists, and there were no reports of incidents." #NT!
 australia.23.a: "I see..." #NT!
  
 australia.24.t: "Australian Guard Prepares for Confrontation" #NT!
 australia.24.d: "The government has received word of rather peculiar movements of elements within the military especially units loyal to the royalist movement called the Australian Guard, headed by two heroes of the Great War, Eric Campbell and Thomas Blamey. While this only appears to be rumour, we keep an eye on what's happening in the shadows within the military." #NT!
 australia.24.a: "Somehow I doubt it." #NT!
  
 australia.25.t: "[AST.GetAdjective] Guard Asks for Support" #NT!
 australia.25.d.left: "The [Root.GetAdjective] government has been struggling for weeks to come up with a plan regarding the loss of Australia to bolshevism, and now we have received surprising news: Thomas Blamey, a [AST.GetAdjective] field marshal and member of a radical group of royal supporters called the Australian Guard, has told us of a plan to engineer a coup against the [AST.GetAdjective] government. He has asked for our support, though advisors caution that - if the coup fails - we might very well be caught up in an immediate war against [AST.GetNameDef], one that will be difficult to deal with." #NT!
 australia.25.d.afm: "The [Root.GetAdjective] government has been struggling to come up with a plan regarding the loss of Australia, and now we have received surprising news: Thomas Blamey, a [AST.GetAdjective] field marshal and member of a radical group of royal supporters called the Australian Guard, has told us of a plan to engineer a coup against the [AST.GetAdjective] AFM government. He has asked for our support, though advisors caution that - if the coup fails - we might very well be caught up in an immediate war against [AST.GetNameDef], one that will be difficult to deal with." #NT!
 australia.25.a: "We shall support their plan, even if it means war." #NT!
 australia.25.b: "We cannot risk it - Blamey is on his own." #NT!
  
 australia.26.t: "The Australian Guard Coup" #NT!
 australia.26.d.left: "Government forces scrambled today as the capital found itself under sudden siege - Australian Guard paramilitary troops took numerous officials hostage, led by Field Marshal Thomas Blamey and Major General Herbert Lloyd, as they attempted to take unlawful command of parliament. Their radio broadcast is blaring throughout Canberra, not only calling on Australians to rise up against bolshevism but claiming to have the full support of the Empire. This is outrageous interference in [Root.GetAdjective] affairs, if true, but so far it remains to be seen if forces loyal to the ACTU will even win the day..." #NT!
 australia.26.d.afm: "Government forces scrambled today as the capital found itself under sudden siege - Australian Guard paramilitary troops took numerous officials hostage, led by Field Marshal Thomas Blamey and Major General Herbert Lloyd, as they attempted to take unlawful command of parliament. Their radio broadcast is blaring throughout Canberra, not only calling on Australians to rise up against 'the republican traitors' but claiming to have the full support of the Empire. This is outrageous interference in [Root.GetAdjective] affairs, if true, but so far it remains to be seen if forces loyal to the AFM will even win the day..." #NT!
 australia.26.a: "The coup succeeds! The Guard takes control of the country." #NT!
 australia.26.b: "The coup fails! Blamey's forces flee the capital." #NT!
  
 australia.27.t: "Australian Guard's Coup Succeeds" #NT!
 australia.27.d.support: "Thomas Blamey has sent word to the [Root.GetAdjective] government that, thanks in large part to our support, royal supporters have retaken control of the [AST.GetAdjective] parliament and are in the process of restoring order in the country. We can now breathe a sigh of relief as Australia once again re-asserts itself as a British ally and member of the Entente." #NT!
 australia.27.d.nosupport: "Thomas Blamey has sent word to the [Root.GetAdjective] government that, even without our support, he and his Guard supporters have retaken control of the [AST.GetAdjective] parliament and are in the process of restoring order in the country. He has affirmed that [AST.GetNameDef] remains a loyal subject of the British crown and that it will dedicate itself to the alliance once more. We can all breathe a sigh of relief." #NT!
 australia.27.a: "Good news for once!" #NT!
  
 australia.28.t: "Australian Guard's Coup Fails" #NT!
 australia.28.d: "Thomas Blamey has sent word that, despite our support, his attempted coup against the [AST.GetAdjective] government has ended in failure. Thankfully he survived and is currently pulling his paramilitary forces to bases in New Zealand. While the [AST.GetAdjective] government is outraged by our interference, we are not at war with them yet... though Blamey claims to have the support of the New Zealand government and tells us they will be rising up soon. Without our support, it seems doubtful that New Zealand will carry the day." #NT!
 australia.28.a: "We shall wait for more news..." #NT!
 australia.28.b: "So be it!" #NT!
  
 australia.29.t: "A Call for Peace?" #NT!
 australia.29.d: "It has been many months since the war with New Zealand began, and while we have captured the islands we remain at war with their colonial masters. This is a war that will go nowhere, however, and thus a suggestion has been raised that we should seek white peace with the [ENT.GetAdjective] government. If they will leave us be, this conflict can be put behind us." #NT!
 australia.29.a: "It is time to call for a truce." #NT!
 australia.29.b: "Tell them they are dreaming." #NT!
  
 australia.30.t: "Peace with the Australians?" #NT!
 australia.30.d: "A peace envoy has arrived from the [From.GetAdjective] government, offering an end to hostilities. If we leave them be and allow them to retain 'rightful' control over New Zealand, then this conflict can come to an end... a conflict which, it seems, has been going nowhere for us." #NT!
 australia.30.a: "Yes, let us end this now." #NT!
 australia.30.b: "No! We will continue this war until it is finished!" #NT!
  
 australia.31.t: "No Peace with [From.GetNameDef]" #NT!
 australia.31.d: "Our envoys have returned from [From.GetNameDef] with a definitive response: there will be no peace." #NT!
 australia.31.a: "Ah well." #NT!
  
 australia.32.t: "A Call for Peace?" #NT!
 australia.32.d: "It has been many months since the war began, and our former colonial masters appear no closer to conquering our nation than we are of crossing the Pacific to conquer theirs. Seeing as the war is going nowhere, a suggestion has been raised that we should seek white peace with the British. If they will leave us be, this conflict can be put behind us." #NT!
  
 australia.33.t: "Peace with the Australians?" #NT!
 australia.33.d: "A peace envoy has arrived from the [From.GetAdjective] government, offering an end to hostilities. If we leave them be, allowing their continued existence under whatever government they so choose, then this conflict can come to an end... a conflict which, it seems, has little hope of ending anytime soon." #NT!
  
 australia.34.t: "The Australian Guard Coup" #NT!
 australia.34.d.left: "Government forces scrambled today as the capital found itself under sudden siege - Australian Guard paramilitary troops took numerous officials hostage, led by Field Marshal Thomas Blamey and Major General Herbert Lloyd, as they attempted to take unlawful command of parliament. Their radio broadcast is blaring throughout Canberra, not only calling on Australians to rise up against bolshevism but claiming to have the full support of the Empire. This is outrageous interference in [Root.GetAdjective] affairs, if true, but so far it remains to be seen if forces loyal to the ACTU will even win the day..." #NT!
 australia.34.d.afm: "Government forces scrambled today as the capital found itself under sudden siege - Australian Guard paramilitary troops took numerous officials hostage, led by Field Marshal Thomas Blamey and Major General Herbert Lloyd, as they attempted to take unlawful command of parliament. Their radio broadcast is blaring throughout Canberra, not only calling on Australians to rise up against 'the republican traitors' but claiming to have the full support of the Empire. This is outrageous interference in [Root.GetAdjective] affairs, if true, but so far it remains to be seen if forces loyal to the AFM will even win the day..." #NT!
  
 australia.35.t: "Royal Rule Restored" #NT!
 australia.35.d.henry: "The new government under [Root.GetLeader] has dispensed with the republican articles issues by the previous government, restoring Royal rule over [Root.GetNameDef] effective immediately. The occasion was marked with the arrival of Prince Henry at parliament as the new Governor-General, triumphantly assuming his duties as head of state to a large and enthusiastic crowd." #NT!
 australia.35.d.george: "The new government under [Root.GetLeader] has dispensed with the republican articles issues by the previous government, restoring Royal rule over [Root.GetNameDef] effective immediately. The occasion was marked with the arrival of Prince George at parliament as the new Governor-General, triumphantly assuming his duties as head of state to a large and enthusiastic crowd." #NT!
 australia.35.d.hore_ruthven: "The new government under [Root.GetLeader] has dispensed with the republican articles issues by the previous government, restoring Royal rule over [Root.GetNameDef] effective immediately. The occasion was marked with the arrival of renowned governor Alexander Hore-Ruthven at parliament as the new Governor-General, triumphantly assuming his duties as head of state to a large and enthusiastic crowd." #NT!
 australia.35.a: "Hurrah!" #NT!
  
 australia.36.t: "Rise of the AFM" #NT!
 australia.36.d: "Up until this point, the Australia First Movement - led by Percy Stephensen - has been considered a fringe movement filled with disaffected socialists. With the rise of chaos inspired by syndicalist forces, and with it the fortunes of the Australian Guard, Stephensen's words have gained new purchase among the people of Australia. Stephensen calls for Australia to cut its ties with the British crown, to further promote Australianism and to maintain a neutral stance in global affairs so to ensure Australia never marches into another disaster like Gallipoli. 'They talk grandiloquently about 'filling up Australia's vast empty spaces' and then they dump down the scum of London here,' he tells his ardent supporters, 'To hell with the British and the Empire!'" #NT!
 australia.36.a: "That's treasonous talk, is what that is." #NT!
  
 australia.37.t: "Victorian Bush Fires" #NT!
 australia.37.d: "The state of Victoria has been hit by heavy bush fires in the north east and south west. Because of intense heat and drought over the last few years, much of rural Victoria has dried up - leaving plenty of fuel for the flames. The fires at this point are so incredibly intense that the ash and smoke can be seen from New Zealand. Firefighters with the aid of the state government are currently trying to combat the disaster, with the flames already threatening several major cities and causing considerable panic." #NT!
 australia.37.a: "Goodness!" #NT!
  
 australia.38.t: "Bush Fires Finally Extinguished" #NT!
 australia.38.d: "The fires in Victoria have finally been extinguished, thanks to the efforts of local fire fighters as well as overdue dense rainfall. This victory has come at the cost of 71 lives, over 1000 homes destroyed, and the burning of almost 135,500 hectares of land. Currently Judge Leonard Stretton has been selected to lead a royal commission into what led to the disastrous fires, though many suspect farmers or graziers in rural areas to be responsible due to their long-standing practice of burning brush to clear new land." #NT!
 australia.38.a: "Well, at least the worst is over." #NT!
  
 australia.39.t: "The [GetYear] Federal Election" #NT!
 australia.39.d: "As per the Constitution of Australia, elections are to be held at least once every three years (a legacy of Australian practice). This year's election is particularly important, due to the rise of Percy Stephensen's Australia First Movement, which have siphoned support from the traditional conservative parties. Will the electorate stick with one of the established political parties, or will they opt instead for the radicals?" #NT!
 australia.39.a: "Labour survives for another term!" #NT!
 australia.39.b: "United Australia sweeps the floor!" #NT!
 australia.39.c: "The AFM makes a suprising win!" #NT!
  
 australia.40.t: "Ion Idriess' 'The Cattle King'" #NT!
 australia.40.d: "Leading Australian writer Ion Idriess today published his latest novel, 'The Cattle King'. It follows the life of recently-deceased Sir Sidney Kidman, an entrepreneur and pastoralist who owned or co-owned large areas of land in Australia in his lifetime. Kidman became widely popular due to his support of the government in the Great War and charitable organisations. The book looks set to be Australasia's best-seller for 1936, and many are drawing parallels between Kidman and the exiled White Rajah, Charles Vyner Brooke, which is sure to boost Brooke's popularity." #NT!
 australia.40.a: "An Interesting Read!" #NT!
  
 australia.41.t: "'Forty Thousand Horsemen'" #NT!
 australia.41.d: "Directed by Charles Chauvel, 'Forty Thousand Horsemen' tells the story of the Australian Light Horse during the Sinai and Palestine Campaign of the last Great War. It follows the adventures of three rowdy heroes in fighting and romance and culminates at the Battle of Beersheba. While the film is clearly a propaganda tool to aid in recruitment and lift the pride of Australasians at home, it is fast becoming the most successful Australasian film ever produced." #NT!
 australia.41.a: "Wow!" #NT!
  
 australia.42.t: "Socialist Cells Uncovered" #NT!
 australia.42.d: "Finally some good news today as three separate cells of socialist agitators were uncovered in major [Root.GetAdjective] cities. Over fifty arrests were made, with public trials expected within weeks, a true blow to the socialist movement. There are some, however, who have expressed dismay at how quickly the socialist have organised, and suggest that these cells may simply be a few of many in [Root.GetNameDef]." #NT!
 australia.42.a: "Well, it's certainly a start." #NT!
  
 australia.43.t: "The Dissolution Of The Australasian Guard" #NT!
 australia.43.d: "Today Eric Campbell and Thomas Blamey, both veterans of the Great War and perpetrators of the Australian Guard's attempted coup d'état, were sentenced to life imprisonment by the High Court of Australia for high treason. The leadership of the Guard and its political wing the Centre Party, shares the same fate along with many other prominent members. The Centre Party has been dissolved and the Australasian Guard more or less ended as a political force in Austrasia. Charles Vyner Brooke unfortunately could not be linked directly to the coup and so escaped a prison sentence, although many accuse him of bribing those involved in his prosecution." #NT!
 australia.43.a: "Good Riddance!" #NT!
  
 australia.44.t: "Unions Protest Suppression" #NT!
 australia.44.d: "Union supporters have taken to the streets in several major Australasian cities, protesting the government's decision to continue the suppression of the ACTU and its syndicalist allies. The protesters were met with police, and later with Australasian Guard paramilitary groups, and this led to bloody clashes in Melbourne where dozens were reported injured. Maximist leader J.B. Miles has called for continued resistance to the government's anti-union policies, although he drew short of openly calling for armed revolt." #NT!
 australia.44.a: "We will keep a close eye on this." #NT!
  
 australia.45.t: "Joseph Lyons Dies from Heart Attack" #NT!
 australia.45.d.united: "This morning, Prime Minister Joseph A. Lyons the leader of the United Party and Prime Minister of Australia have been reportedly died from a heart attack while being driven from Melbourne to Sydney. He was rushed at St. Vincent's Hospital in Darlinghurst but declared already dead at arrival. A state funeral will be held in St. Mary's Cathedral for for five days and his body will be sent back to his hometown of Devonport. Robert Menzies, a coalition partner of Lyons will be now inaugurated as Prime Minister of Australia." #NT!
 australia.45.d.other: "This morning, Joseph A. Lyons known for his Lyons plan that aims to recover the [AST.GetAdjective] economy from the London Stock Market Crash through a series of austerity programs have been reportedly died from a heart attack while being driven from Melbourne to Sydney. He was rushed at St. Vincent's Hospital in Darlinghurst but declared already dead at arrival. A funeral will be held in St. Mary's Cathedral for five days and his body will be sent back to his hometown of Devonport." #NT!
 australia.45.a: "A tragic loss..." #NT!
  
 australia.46.t: "Joseph Lyons Recovers from Heart Attack" #NT!
 australia.46.d.united: "This morning, Prime Minister Joseph A. Lyons the leader of the United Party and Prime Minister of Australia have been reportedly rushed to the hospital at St. Vincent's due to a heart attack while being driven from Melbourne to Sydney. Fortunately, Lyons have survived the heart attack and is resting on the hospital grounds. In his absence, Robert Menzies, is now being inaugurated as the new primier of Australia; as Lyons is currently incapacitated and will withdraw from public life." #NT!
 australia.46.d.other: "This morning, Joseph A. Lyons known for the Lyon's Plan that aims to recover the [AST.GetAdjective] economy from the London Stock Market Crash through a series of austerity programs have been reportedly rushed to the hospital at St. Vincent's due to a heart attack while being driven from Melbourne to Sydney. Fortunately, Lyons have survived the heart attack and is resting on the hospital grounds. However, due to his health and advices from his physicians, he has withdrawn from public life and instead retire." #NT!
 australia.46.a: "Hope he recovers well..." #NT!
  
 australia.47.t: "Australia Proposes the CANZUK Free Trade Zone" #NT!
 australia.47.d: "The [AST.GetAdjective] Government have approached us for their proposal of bringing the empire closer together, in order to improve the economic situation of all, and avoid tariffs from various parts of the Empire, they have devised a trade zone within the commonwealth. Such trade zone will be free of trade tarriffs and regulations, and will mutually benefit all members." #NT!
 australia.47.a: "Good idea!" #NT!
  
 australia.48.t: "The CANZUK Free Trade Zone" #NT!
 australia.48.d: "London have have informed us that the [AST.GetAdjective] proposal of creating a free trade zone within the commonwealth will be implemented throughout the Empire, and have automatically included us as its initial members. We can now trade with various imperial territories and other commonwealth members for no tarriffs involved, greatly bolstering our economic situation." #NT!
 australia.48.a: "I see..." #NT!
  
 australia.49.t: "First Congress of the ACTU" #NT!
 australia.49.d: "With the [Root.GetAdjective] Council of Trade Unions having taken increasing control of government affairs, their first official congress is a matter of great importance which will determine the direction of [Root.GetNameDef] as it begins its transformation into a proper revolutionary republic. The popular and progressive Fred Paterson appears most likely to win the support of most delegates, but the volatile speaker J.B. Miles has won many supporters to the Maximist cause with his talk of mobilising the [Root.GetAdjective] revolutionaries at any cost. It remains to be seen which of the two will win the day..." #NT!
 australia.49.a: "The Left Labour control the congress." #NT!
 australia.49.b: "The Communists gain the upper hand." #NT!
 australia.49.c: "The Socialist-Nationalist surprise with a slim majority." #NT!
  
 australia.50.t: "[From.GetAdjective] Equipment Arrives" #NT!
 australia.50.d: "Our friends in [From.GetNameDef] have sent us a shipment of infantry equipment to aid in our struggle." #NT!
 australia.50.a: "Much needed!" #NT!
  
 australia.51.t: "[From.GetNameDefCap] Seeks An Alliance" #NT!
 australia.51.d: "The [From.GetAdjective] Republic has distanced itself from the British and now seeks closer trade and diplomatic ties with powers closer to home, or so say the envoys they recently sent to the [Root.GetAdjective] government. Are we interested in their proposition?" #NT!
 australia.51.a: "Yes, let our nations cooperate more closely." #NT!
 australia.51.b: "No, this is of no interest to us." #NT!
  
 australia.52.t: "The [From.GetAdjective] Agree" #NT!
 australia.52.d: "The [From.GetAdjective] government has agreed to our proposal, signing a formal alliance that will go a long way towards drawing our countries closer together." #NT!
 australia.52.a: "Good to hear!" #NT!
  
 australia.53.t: "The [From.GetAdjective] Have Refused" #NT!
 australia.53.d: "The response from the [From.GetAdjective] government to our envoys has been mostly silence. It appears they are uninterested in any alliance we might offer." #NT!
 australia.53.a: "A poor decision on their part." #NT!
  
 australia.54.t: "Cooperation with Australia?" #NT!
 australia.54.d: "The [From.GetNameDef] have approched us with an interesting proposition, a join military exercise will be conducted between our own troops and their soldiers. Our military can benefit from this exercise learning about naval and air combat which we are absolutely lacking, and at the same time modernizing our air and naval facilities; while the [From.GetAdjective] can improve their jungle and urban warfare which our troops are quite fond of. Should we accept their proposition?" #NT!
 australia.54.a: "This can benefit us both" #NT!
 australia.54.b: "No, we're busy" #NT!
  
 australia.55.t: "The [From.GetAdjective] Agree" #NT!
 australia.55.d: "The [From.GetAdjective] government has agreed to our proposal, already preparing to receive our troops in the upcoming military exercises that will be done in the Philippines." #NT!
 australia.55.a: "Good to hear!" #NT!
  
 australia.56.t: "The [From.GetAdjective] Have Refused" #NT!
 australia.56.d: "The response from the [From.GetAdjective] government to our envoys has been mostly silence. It appears they are uninterested in any proposition we might offer." #NT!
 australia.56.a: "A poor decision on their part." #NT!
  
 ### Decisions 
 AST_defeat_australia: "Defeat Australia" #NT!
 AST_hold_out_vs_britain: "Hold Out Against the Empire" #NT!
 AST_hold_out_vs_britain_desc: "Defeating the entire Empire is unlikely, but if we can hold out against their forces long enough we can perhaps force them to peace talks. If we hold New Zealand at that time, they may even have no choice but to let us keep it." #NT!
 AST_join_alliance: "Join the [From.GetAdjective] Alliance" #NT!
 AST_join_alliance_desc: "We share strategic interests with the [From.GetAdjective]s. Joining their military alliance could be a great benefit to our nation." #NT!
  
