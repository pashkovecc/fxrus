 AST_memories_of_galipoli_idea: "Memories of Galipoli" #NT!
 AST_memories_of_galipoli_idea_desc: "The Great War saw the sons of Australia give all in for the British Empire and our allies. Remembered each year through Anzac Day, these memories and stories have been a source for Australian pride. But it also acts as a reminder of the lives lost, making the country less likely to enter another bloody foreign war." #NT!
