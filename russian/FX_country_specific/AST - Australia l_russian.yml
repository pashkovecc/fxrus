 AST_internal_divisions_idea: "Internal Divisions" #NT!
 AST_internal_divisions_idea_desc: "The Commonwealth of Australia seems to be more divided than ever. With both calls for secession in Western Australia, along with regionalism taking hold in many Australian states. While most states want to remain in the Commonwealth, many seek to strengthen their own states and push the interest of local and regional party branches over the federal party." #NT!
