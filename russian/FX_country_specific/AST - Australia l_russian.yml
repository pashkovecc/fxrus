 ### Parties 
 AST_vanguardist_party: "Socialist National" #NT!
 AST_vanguardist_party_long: "Socialist National Party of Australia                        §gThe Socialist National Party of Australia was founded in 1935 by socialists dissatisfied by the leninist policies of the Communist Party. Led by Lance Sharkey, the Socialist Nationals seeks to create a National Socialist or Socialist Patriotic Australian state, seeing it as the only way to create a true socialist society in Australia.§!" #NT!
 AST_collectivist_party: "Communist" #NT!
 AST_collectivist_party_long: "Communist Party of Australia                                 §gThe Communist Party of Australia was founded in 1920 by socialists inspired by the reports of the Russian Revolution. The party seeks a leninist socialist state in Australia, along with the empowering of labour unions and the establishment of Soviets in Australia. The party is also the most pro-Soviet party in the country.§!" #NT!
 AST_libertarian_socialist_party: "Labor (Left)" #NT!
 AST_libertarian_socialist_party_long: "Australian Labor Party                                          §gThe Australian Labor Party is the main centre-left political party in Australia, along with being the oldest surviving political party in the country, the only of them that has partaken in the 1901 Federal Elections. Labor is the strongest proponent of democratic socialism in Australia and seek to create a more egalitarian society. The party's left-wing supports socialization of the economy, stronger labour unions and more socialist policies in Australia.§!" #NT!
 AST_alt_lib_soc_party: "Socialist Labor" #NT!
 AST_alt_lib_soc_party_long: "Socialist Labor Party                                              §gThe Socialist Labor Party has remained a minor party since it's founding in 1901, but has recently risen to prominence. A party uniting syndicalists, radical socialists and former Labor members, SLP is credited to the introduction of the Industrial Workers of the World to the country. With their socialist policies, many sees them as a valuable alternative to both Labor and the Communists.§!" #NT!
 AST_social_democrat_party: "Labor" #NT!
 AST_social_democrat_party_long: "Australian Labor Party                                           §gThe Australian Labor Party is the main centre-left political party in Australia, along with being the oldest surviving political party in the country, the only of them that has partaken in the 1901 Federal Elections. Labor is the strongest proponent of democratic socialism in Australia and seek to create a more egalitarian society.§!" #NT!
 AST_social_liberal_party: "Labor (Anti-Socialist)" #NT!
 AST_social_liberal_party_long: "Australian Labor Party (Anti-Socialist Wing)            §gThe Australian Labor Party is the main centre-left political party in Australia, along with being the oldest surviving political party in the country, the only of them that has partaken in the 1901 Federal Elections. Labor is the strongest proponent of democratic socialism in Australia and seek to create a more egalitarian society. The party's anti-socialist wing seek to steer Labor away from radical socialism. Especially from the Communist Party.§!" #NT!
 AST_soc_lib_alt_party: "Lang Labor" #NT!
 AST_soc_lib_alt_party_long: "Australian Labor Party (Non-Socialist)                     §gThe Australian Labor Party (Non-Socialist) is a breakaway party of the original Labor Party, led by the New South Wales premier Jack Lang. While Lang has been seen as an opponent of conservative economics, he and his supporters are also quite anti-socialist. Gaining further support from the more socially conservative wings of Labor, the new party seeks to limit the influence of the Communist Party and other socialist organizations in Australia.§!" #NT!
 AST_market_liberal_party: "Nationalist" #NT!
 AST_market_liberal_party_long: "Nationalist Party                                                    §gThe Nationalist Party was founded in 1917 by a merger between the Commonwealth Liberal Party, the old centre-right political party in Australia, and the National Labor Party, a breakaway faction of Labor. While having former Labor members in it's ranks, the party are quite conservative on economical issues. In recent years, however, the party has steadly lost ground to both Labor and the Country Party.§!" #NT!
 AST_mar_lib_alt_party: "United Australia" #NT!
 AST_mar_lib_alt_party_long: "United Australia Party                                           §gThe United Australia Party was founded through a union of the Nationalist Party and former Labor members, with Joseph Lyons, former minister of Works and Railways under the Scullin cabinet, as one of its core founders. The party seeks a more conservative economic policy and to generally unite the Australian people in times of hardship, wanting to bring stability back to Australia.§!" #NT!
 AST_social_conservative_party: "Country" #NT!
 AST_social_conservative_party_long: "Australian Country Party                                        §gThe Australian Country Party was formally founded in 1913 in Western Australia, federally in 1920, from a number of state-based agrarian parties in Australia. Country is seen as a party between Labor and the Nationalists, with their socially conservative and economically interventionist views. Even then, Country is mostly seen as a centre-right party, having joined governments with the Nationalists on previous occations.§!" #NT!
 AST_soc_con_alt_party: "United Australia" #NT!
 AST_soc_con_alt_party_long: "United Australia Party                                          §gThe United Australia Party was founded through a union of the Nationalist Party and former Labor members, with Joseph Lyons, former minister of Works and Railways under the Scullin cabinet, as one of its core founders. The party seeks a more conservative economic policy and to generally unite the Australian people in times of hardship, wanting to bring stability back to Australia.§!" #NT!
 AST_authoritarian_democrat_party: "Social Credit" #NT!
 AST_authoritarian_democrat_party_long: "Social Credit Movement                                        §gThe Social Credit Movement is a loose movement of people subscribed to C. H. Douglas' Social Credit theory of monetary reform. While the movement has not been as influential in Australia as it has been in Canada, it has still gained a following. Beside economic matters, the movement are considered conservative, with it sometimes being the destination for conservative former members of Labor or the Nationalists.§!" #NT!
 AST_aut_dem_alt_party: "United Australia" #NT!
 AST_aut_dem_alt_party_long: "United Australia Party                                          §gThe United Australia Party was founded through a union of the Nationalist Party and former Labor members, with Joseph Lyons, former minister of Works and Railways under the Scullin cabinet, as one of its core founders. The party seeks a more conservative economic policy and to generally unite the Australian people in times of hardship, wanting to bring stability back to Australia.§!" #NT!
 AST_paternal_autocrat_party: "Centre" #NT!
 AST_paternal_autocrat_party_long: "Centre Party                                                          §gThe Centre Party, founded in 1933, is the political branch of the nationalist, monarchist New Guard, a paramilitary organization emerging from the Greater Sydney area. The party seeks to rid Australia for socialism, being a strong opposition to Labor in both New South Wales and elsewhere. Unlike the AFM, Centre are strongly in favour of the British Empire and the monarchy, combining it with Australian nationalism.§!" #NT!
 AST_national_populist_party: "AFM" #NT!
 AST_national_populist_party_long: "Australia First Movement                                       §gThe Australia First Movement is one of the youngest movements in Australia, growing out of the Rationalist Association of New South Wales and the Victorian Socialist Party. The movement seems to unite a diverse group of people to the message of Australia First, with inspirations taken from valkist and national syndicalist movements. While xenophobic, the movement are also seen as an opponent to war and a voice for isolationism.§!" #NT!
 AST_valkist_party: "AFM (Odinist)" #NT!
 AST_valkist_party_long: "Australia First Movement (Odinist Wing)" #NT!
  
 AST_ano_party: "ANO" #NT!
 AST_ano_party_long: "Aboriginal National Organisation" #NT!
  
 ### Ideas 
 AST_auralia_movement_idea: "The Auralia Movement" #NT!
 AST_auralia_movement_idea_desc: "The issue of West Australian secession has developed into two camps. While a fair majority of secessionists are moderates who seek to restore the state as independent from Australia, but within the Empire, there are still many seeking a total break from the Empire. This movement, the Auralia movement, claims to be moderate as well, but are more and more aligned to forces opposed to the Empire’s might in Australia." #NT!
