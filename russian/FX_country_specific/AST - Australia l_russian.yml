 ### Focus 
 AST_economy_in_crisis: "An Economy in Crisis" #NT!
 AST_economy_in_crisis_desc: "The Australian economy has been suffering from a severe depression for the last five years. We must assess where opportunities lie and prepare our industry to be properly expanded if we're to have any hope of pulling ourselves out of this quagmire." #NT!
 AST_allieviate_farmers: "Allieviate the Farmers" #NT!
 AST_allieviate_farmers_desc: "[Root.GetRulingParty] has always been the party of the countryfolk. Other parties concern themselves only with the workers, and the farmers are too often forgotten. We are making this up for them by offering development grants." #NT!
 AST_higher_taxes: "Higher Taxes" #NT!
 AST_higher_taxes_desc: "With our increasing investments, our budget has begun to suffer. By implementing new business taxes, we can raise additional revenue that we can then use to further invest in our economy. As our population is large and the potential of our country immense, these taxes will most likely not scare any businesses away." #NT!
 AST_federal_lang_plan: "The Federal Lang Plan" #NT!
 AST_federal_lang_plan_desc: "" #NT!
 AST_cease_interest_repayments: "Cease Interest Repayments" #NT!
 AST_cease_interest_repayments_desc: "" #NT!
 AST_balanced_approach: "A Balanced Approach" #NT!
 AST_balanced_approach_desc: "" #NT!
 AST_free_up_cash: "Free Up Cash" #NT!
 AST_free_up_cash_desc: "" #NT!
 AST_sea_to_sea_federal_work: "Sea to Sea Federal Work" #NT!
 AST_sea_to_sea_federal_work_desc: "" #NT!
 AST_bail_out_industries: "Bail Out Industries" #NT!
 AST_bail_out_industries_desc: "" #NT!
 AST_goods_standard: "The Goods Standard" #NT!
 AST_goods_standard_desc: "Australia's cities are already growing rapidly - we must enact policies which will encourage the migration of people from the rural areas into urban ones. If our industrial base is to grow, it will need a ready source of workers ready to man the factories." #NT!
 AST_stimulated_economy: "A Stimulated Economy" #NT!
 AST_stimulated_economy_desc: "" #NT!
 AST_deflate_prices: "Deflate the Prices" #NT!
 AST_deflate_prices_desc: "Deregulating prices will allow for organic growth of the corporate sector which we can take advantage of to speed up our own endeavours, along with letting us trade our resources more profitably." #NT!
 AST_cut_bureaucracy: "Cut the Bureaucracy" #NT!
 AST_cut_bureaucracy_desc: "The main problem facing our economy is the sheer magnitude of the governmental bureaucracy, laden down by archaic rules and focused on colonial exploitation rather than efficiency. We need a modern government which can respond to issues before they can turn into the catastrophe which faces us now, not well after." #NT!
 AST_austerity_measures: "Austerity Measures" #NT!
 AST_austerity_measures_desc: "The most important thing we need to remember when dealing with the ongoing economic crisis is that we must not let it accrue to already existing national debt. [Root.GetName]'s coffers need to be full, not empty, in the following years, and there is only one way to achieve this: Cutting spending drastically." #NT!
 AST_spending_cuts_deal: "Spending Cuts Deal" #NT!
 AST_spending_cuts_deal_desc: "" #NT!
 AST_reduction_on_interest: "Reduction on Interest" #NT!
 AST_reduction_on_interest_desc: "" #NT!
 AST_balance_budget: "Balance the Budget" #NT!
 AST_balance_budget_desc: "" #NT!
 AST_work_with_opposition: "Work With the Opposition" #NT!
 AST_work_with_opposition_desc: "" #NT!
 AST_australias_middle_road: "Australia's Middle Road" #NT!
 AST_australias_middle_road_desc: "" #NT!
 AST_close_unprofitable_businesses: "Close Unprofitable Businesses" #NT!
 AST_close_unprofitable_businesses_desc: "Almost all of the publicly-owned companies are doing poorly, suffering from mismanagement and even corruption. Rather than revise their practices, perhaps it's best to put them back in the hands of the private sector where they can be run by proper businessmen rather than bureaucrats." #NT!
 AST_wage_cuts: "Wage Cuts" #NT!
 AST_wage_cuts_desc: "" #NT!
 AST_back_to_normalcy: "Back to Normalcy" #NT!
 AST_back_to_normalcy_desc: "Finally we have pulled ourselves out of the doldrums of depression. Australia can march into the future, its economy a shining example for others to follow." #NT!
 AST_end_austerity: "End Austerity" #NT!
 AST_end_austerity_desc: "" #NT!
  
 AST_complete_transcontinental_railway: "Complete the Transcontinental Railway" #NT!
 AST_complete_transcontinental_railway_desc: "Expansion of the railroad system throughout the east will not only give our mining sectors a shot in the arm, but also provide much-needed employment for a great number of people." #NT!
 AST_expand_mines: "Expand the Mines" #NT!
 AST_expand_mines_desc: "All these new roads and railroads have opened up parts of the country to prospectors and mining developers. We should encourage them with incentives." #NT!
 AST_australian_oil: "Australian Oil" #NT!
 AST_australian_oil_desc: "" #NT!
 AST_conquer_northern_territories: "Conquer the Northern Territories" #NT!
 AST_conquer_northern_territories_desc: "" #NT!
 AST_agricultural_modernization: "Agricultural Modernization" #NT!
 AST_agricultural_modernization_desc: "" #NT!
 AST_fund_local_universities: "Fund Local Universities" #NT!
 AST_fund_local_universities_desc: "It is important to remember that scholarly pursuits are needed to maintain our position. Generous funding increases to the National University in Canberra will allow us to educate the masses and become a beacon of new research." #NT!
 AST_invest_in_industry: "Invest in Industry" #NT!
 AST_invest_in_industry_desc: "" #NT!
 AST_newcastle_industrial_center: "Newcastle Industrial Center" #NT!
 AST_newcastle_industrial_center_desc: "" #NT!
 AST_australian_arms_industry: "The Australian Arms Industry" #NT!
 AST_australian_arms_industry_desc: "Our soldiers' guns and our pilots' planes won't do very much without bullets and bombs. We must start encouraging the growth of a real munitions industry in Australia." #NT!
  
 AST_australian_army: "Australian Army" #NT!
 AST_australian_army_desc: "Our ground forces must be a new priority, promoting those generals who can bring the greatest benefit and reforming their methods for the sake of the nation." #NT!
 AST_end_military_austerity: "End the Military Austerity" #NT!
 AST_end_military_austerity_desc: "We must work together as a nation, indeed politicians from across all ideological spectrums must pull together if we are to see victory in the days to come!" #NT!
 AST_citizen_forces_reforms: "Citizen Forces Reforms" #NT!
 AST_citizen_forces_reforms_desc: "Conscription laws have been enacted, but they are insufficient. In the name of our defence, we must see to it that everyone takes part in defending king and country." #NT!
 AST_purely_voluntary_force: "A Purely Voluntary Force" #NT!
 AST_purely_voluntary_force_desc: "We do not have the industrial capacity for a large or armoured force. Instead we must focus on keeping Australia's army small yet well-equipped and well-trained. Size is not as important as quality!" #NT!
 AST_citizen_compulsory_service: "Citizen Compulsory Service" #NT!
 AST_citizen_compulsory_service_desc: "Any attempt to project our military power beyond our borders is doomed to bring little more than grief. Our focus, as a nation, should be on our own defence." #NT!
 AST_training_reforms: "Training Reforms" #NT!
 AST_training_reforms_desc: "It is becoming increasingly apparent that small and very specialised military units are what our armed forces most desperately need." #NT!
 AST_establish_second_aif: "Establish the Second AIF" #NT!
 AST_establish_second_aif_desc: "" #NT!
 AST_modernize_equipment: "Modernize the Equipment" #NT!
 AST_modernize_equipment_desc: "Our infantry's equipment is old, very old. Most of it saw service during the Great War, and some sets have been around even longer than that. We must equip our army with modern gear, or else we will not stand a chance in another war." #NT!
 AST_modernize_tactics: "Modernize the Tactics" #NT!
 AST_modernize_tactics_desc: "Our army is the core of our defence, and emergency measures must be passed to ensure they have access to the best equipment and the best personnel that we can possibly provide. When our enemies see the ANZAC symbol, they should know they face among the very best soldiers the world has to offer." #NT!
 AST_artillary_war: "Artillary War" #NT!
 AST_artillary_war_desc: "Australia's artillery mostly dates from the Great War. We must modernise our artillery unless we wish our soldiers to be eviscerated without proper support." #NT!
 AST_modernize_cavalry_division: "Modernize the Cavalry Division" #NT!
 AST_modernize_cavalry_division_desc: "Mobility does not mean simply building tanks - there is also the question of mobilising our infantry units, by building mechanised transport which will get them to the front quickly." #NT!
 AST_focus_on_mobile_warfare: "Focus on Mobile Warfare" #NT!
 AST_focus_on_mobile_warfare_desc: "The quality of our forces do not matter half so much as their mobility. This is a new era, and tactics of encirclement and reach are far more vital to victory than ever before. This must be the focus on Austalia's military future." #NT!
 AST_marine_training: "Marine Training" #NT!
 AST_marine_training_desc: "First and foremost in our offensive naval capabilities is our ability to land on foreign shores with the Royal Australian Marines. This must be a fighting force like no other, supported by the most advanced transport vessels the navy can provide." #NT!
 AST_australian_tank_research: "Australian Tank Research" #NT!
 AST_australian_tank_research_desc: "Tanks are a fearsome machine on the battlefield, but they are a very complex machine to build. By creating baseline quality standards, we can speed up production of armour and supply our tanks with large armoured divisions that will come down on the enemy like a brick." #NT!
  
 AST_australian_royal_navy: "Australian [Root.AST_GetRoyalOrRepublican] Navy" #NT!
 AST_australian_royal_navy_desc: "During the Great War, the [Root.AST_GetRoyalOrRepublican] Australian Navy was a small force that consisted of only a few small ships, and plans were to decommission even these as soon as the war ended. With the British Pacific Fleet having fled to our ports, we found ourselves in possession of a fleet that far outstrips our ability to properly manage them. This is our first and foremost issue." #NT!
 AST_modernize_naval_fortification: "Modernize Naval Fortification" #NT!
 AST_modernize_naval_fortification_desc: "Foremost on our minds should be the possibility that, one day, and enemy might land forces on our shores. Just because it hasn't happened yet doesn't mean it never will, and we must prepare for that day by fortifying our coastal cities as heavily as we can." #NT!
 AST_protect_new_guinea: "Protect New Guinea" #NT!
 AST_protect_new_guinea_desc: "" #NT!
 AST_safe_australian_seas: "Safe Australian Seas" #NT!
 AST_safe_australian_seas_desc: "Powerful battleships will make sure our naval superiority is permanent, and that we are able to project our power well beyond our borders." #NT!
 AST_modernize_destroyer_fleet: "Modernize the Destroyer Fleet" #NT!
 AST_modernize_destroyer_fleet_desc: "Destroyers are effective at destroying enemy submarines. We should ensure our shipping is safe by constructing as many of these as possible." #NT!
 AST_australian_submarines: "Australian Submarines" #NT!
 AST_australian_submarines_desc: "Submarines are an excellent way to disrupt enemy convoys. We should construct as many as possible." #NT!
 AST_cruiser_expansion: "Cruiser Expansion" #NT!
 AST_cruiser_expansion_desc: "Our fleet of destroyers and submarines will always form the backbone of our navy, defending our trade routes just as they attack those of our enemies." #NT!
 AST_carrier_attempts: "Carrier Attempts" #NT!
 AST_carrier_attempts_desc: "" #NT!
 AST_naval_command: "Australian Naval Command" #NT!
 AST_naval_command_desc: "" #NT!
 AST_expand_australian_dockyards: "Expand Australian Dockyards" #NT!
 AST_expand_australian_dockyards_desc: "We are finally in a position to expand our shipbuilding capabilities far beyond where they once were" #NT!
 AST_fuel_naval_industry: "Fuel the Naval Industry" #NT!
 AST_fuel_naval_industry_desc: "Most shipbuilding facilities in Australia are sorely out of date. They must be updated and expanded, ready to expand our fleet." #NT!
 AST_increase_naval_productions: "Increase Naval Productions" #NT!
 AST_increase_naval_productions_desc: "" #NT!
 AST_masters_on_southern_seas: "Masters on the Southern Seas" #NT!
 AST_masters_on_southern_seas_desc: "" #NT!
  
 AST_australian_royal_air_force: "Australian [Root.AST_GetRoyalOrRepublican] Air Force" #NT!
 AST_australian_royal_air_force_desc: "In truth, there has really been no [Root.AST_GetRoyalOrRepublican] Australian Air Force to speak of, and our current planes are barely sufficient in number to guard our own skies never mind project air superiority elsewhere. Considering that the wars of the future will be fought in the air, the government is determined that this must soon change." #NT!
 AST_subsidize_de_havilland: "Subsidize de Havilland Australia" #NT!
 AST_subsidize_de_havilland_desc: "Building our air force will require expanding and organising our factories for this sole purpose." #NT!
 AST_flying_training_school: "Flying Training School" #NT!
 AST_flying_training_school_desc: "The first step in rebuilding our air force is the creation of an air academy, one which can train our future airmen for the battles to come." #NT!
 AST_purchase_foreign_planes: "Purchase Foreign Planes" #NT!
 AST_purchase_foreign_planes_desc: "" #NT!
 AST_close_air_support_effort: "Close Air Support Effort" #NT!
 AST_close_air_support_effort_desc: "Close air support allows us to strafe enemy units during battles with frightening accuracy, giving us a large edge on our opponents." #NT!
 AST_fighter_focus: "Fighter Focus" #NT!
 AST_fighter_focus_desc: "As part of our campaign to rule the skies, we should invest resources in our fighters" #NT!
 AST_defensive_air_tactics: "Defensive Air Tactics" #NT!
 AST_defensive_air_tactics_desc: "Our focus should not only be on taking to the skies, but on increasing our defence against those who would take to the skies against us." #NT!
 AST_offensive_air_tactics: "Offensive Air Tactics" #NT!
 AST_offensive_air_tactics_desc: "Our primary focus is on our air force - the Dominion must recognise where its strength lies and maximise its effectiveness." #NT!
 AST_control_skies: "Control the Skies" #NT!
 AST_control_skies_desc: "" #NT!
 AST_naval_air_squadrons: "Naval Air Squadrons" #NT!
 AST_naval_air_squadrons_desc: "Naval Bombers allow us to destroy enemy navies without risking our own ships. We should build as many of these as possible if our navy is small or busy elsewhere" #NT!
 AST_upgrade_air_defences: "Upgrade Air Defences" #NT!
 AST_upgrade_air_defences_desc: "With our cities mostly on the east and west coasts of the island, Australia's northern frontier lacks the proper defence or preparation in case of invasion or attack. New military structures in that area will be welcome." #NT!
 AST_jet_developments: "Jet Developments" #NT!
 AST_jet_developments_desc: "" #NT!
  
