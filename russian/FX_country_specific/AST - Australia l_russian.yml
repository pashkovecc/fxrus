 ## Radicals 
  
 AST_workers_australia_unite: "Workers of Australia Unite" #NT!
 AST_workers_australia_unite_desc: "We have had to wrest victory from the hands of the capitalists, no longer will Australians be expected to risk their lives to make this country a paradise for a few hundred, or a few thousand greedy, selfish millionaire families! Now the revolution has come to Australia and we will not let our chance go to waste!" #NT!
 AST_workers_australia_unite_tt: "§GThis focus will be automatically be bypassed once a Socialist Revolution has taken place in Australia.§!" #NT!
 AST_strike_against_capitalist: "Strike Against the Capitalist" #NT!
 AST_strike_against_capitalist_desc: "" #NT!
 AST_soviet_system: "The Soviet System" #NT!
 AST_soviet_system_desc: "" #NT!
 AST_empower_workers_and_farmers: "Empower the Workers and Farmers" #NT!
 AST_empower_workers_and_farmers_desc: "So many decades of brainwashing have left many of the nation's workers unable to tell what truly lies in their own interests. We must make a concerted effort to re-educate and win them over to the communist cause. The workers of Australia must be united as a single force!" #NT!
 AST_labors_socialists: "Labor's Socialists" #NT!
 AST_labors_socialists_desc: "" #NT!
 AST_labors_socialists_tt: "§GThis focus will be automatically unlocked when Labor's Socialists won the First ACTU Congress§!" #NT!
 AST_socialize_australia: "Socialize Australia" #NT!
 AST_socialize_australia_desc: "" #NT!
 AST_integrate_laborites: "Integrate the Laborites" #NT!
 AST_integrate_laborites_desc: "" #NT!
