     ###Super-Heavy Art 
 sp_land_super_heavy_howitzer: "Super-Heavy Artillery" #NT!
 sp_land_super_heavy_howitzer_desc: "Dating back to the Great War, Super-Heavy Artillery are guns designed for seige and fortification-busting roles, which boast an effective range and explosive payload which far exceeds standard artillery guns. In exchange for this awesome firepower, Super-Heavy Artillery are typically orders of magnitude heavier and larger than can be carried by conventional trucks and tractors, and often must be broken down into multiple pieces for transport, and must be loaded by specialized loading vehicles." #NT!
 sp_land_self_propelled_super_heavy_howitzer: "Self-Propelled Super-Heavy Artillery" #NT!
 sp_land_self_propelled_super_heavy_howitzer_desc: "A model of Super-Heavy Artillery mounted on a self-propelled carriage. Compared to other conventional Self-Propelled Artillery, this vehicle makes extreme compromises on speed, maneuverability, and armor, instead achieving a minimum size and weight to effectively move the artillery piece for operational redeployment between battles." #NT!
  
