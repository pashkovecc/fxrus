 sp_land_land_cruiser_desc: "The concept of the "Land Cruiser" dates back to the early 1920s, where the British first developed the idea of the "Land Battleship", a massive, heavily-armored vehicle with armament and crew similar to the battleships of the sea. A massive, heavy, multi-turret, multi-gun vehicle, the Land Cruiser sports extreme armor and armaments, in exchange for requiring the most powerful engine and largest crew that can possibly be developed for a land vehicle. Marred with developmental issues and sometimes totally incapable of moving on conventional roads and bridges, the Land Cruiser nonetheless represents the pinnacle of armored vehicle ambition." #NT!
  
