 super_heavy_railway_gun_equipment_desc: "Based on conventional heavy railway guns dating back to the Great War, this Super-Heavy Railway Gun is a more massive model of gun which requires a full-sized train, specialized loading vehicles, and a full supporting division to operate. In exchange, this gun boasts an absolutely unparalleled range for a ballistic artillery piece, being capable of firing at targets outside of the operational range of any other land-based unit." #NT!
